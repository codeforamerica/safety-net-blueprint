# annotated-field-inventory.schema.yaml
#
# JSON Schema for the annotated field inventory — the intermediate artifact
# that combines the generated field inventory (types, relationships) with
# layered annotations (programs, policies, prose) into a single file.
#
# This is the input the HTML builder reads. It is generated by merging:
#   - The field inventory output from generate-field-inventory.mjs
#   - One or more annotation files (base blueprint + state-specific layers)
#
# The annotation shape follows the blueprint annotations schema
# (packages/contracts/schemas/annotations-schema.yaml) and is intentionally
# open — states add custom annotation keys without schema changes.

$schema: 'https://json-schema.org/draft/2020-12/schema'
title: Annotated Field Inventory
description: >
  Field inventory enriched with layered annotations. Keys under `schema` are
  dot-notation field paths matching the field inventory output. Each entry
  carries type metadata from the inventory and annotation metadata from one
  or more annotation layers (last layer wins per key).

type: object
required: [schema]
additionalProperties: false

properties:
  schema:
    type: object
    description: >
      Map of dot-notation field paths to annotated field entries.
      Paths use the same notation as the field inventory:
      camelCase segments, [] suffix for array fields
      (e.g. application.members[].personalInformation.ssn).
    minProperties: 1
    propertyNames:
      pattern: '^[a-z][a-zA-Z0-9]*(\.[a-zA-Z][a-zA-Z0-9]*(\[\])?)*$'
    additionalProperties:
      $ref: '#/$defs/AnnotatedField'

$defs:
  # ── Field entry ─────────────────────────────────────────────────────────────
  AnnotatedField:
    type: object
    additionalProperties: false
    properties:
      # ── Type metadata (from field inventory) ────────────────────────────────
      type:
        type: string
        description: >
          Field type. Scalar types: string, boolean, number, integer, uuid,
          date, datetime, email, enum. Composite types: object, list,
          list(SchemaName).

      values:
        type: array
        description: Allowed values for enum fields.
        items:
          type: string
        minItems: 1

      relationship:
        type: string
        description: >
          Schema name of the related resource for uuid fields
          (e.g. Person, Application). Used to render cross-reference links.

      appliesWhen:
        type: string
        description: >
          Condition under which this field applies, for discriminated oneOf
          variants (e.g. "type = snap_expedited").

      # ── Annotations (from annotation layers) ────────────────────────────────
      annotations:
        $ref: '#/$defs/Annotation'

  # ── Annotation ──────────────────────────────────────────────────────────────
  # Follows the blueprint Annotation shape (contracts/schemas/annotations-schema.yaml).
  # Open to additional properties so states can extend without schema changes
  # (e.g. CO adds `design`; other states add their own keys).
  Annotation:
    type: object
    additionalProperties: true
    properties:
      # Structural annotations (from *-annotations.yaml)
      policies:
        type: array
        description: >
          Policy IDs from the platform policy registry that apply to this field.
          The renderer resolves IDs to citation text and URLs via the registry —
          IDs are never replaced with inline text here.
        items:
          type: string
        minItems: 1

      programs:
        description: >
          Programs this field is relevant to. Shorthand array form (e.g. [snap])
          marks all entries as required. Map form allows per-program strength.
        oneOf:
          - type: array
            items:
              type: string
            minItems: 1
          - type: object
            additionalProperties:
              type: string
              enum: [required, preferred, optional]

      dataClassification:
        type: array
        description: >
          Data sensitivity classifications. Blueprint vocabulary: pii, fti, phi,
          phi-behavioral, cjis. States may add values via overlay.
        items:
          type: string
          enum: [pii, fti, phi, phi-behavioral, cjis]
        minItems: 1

      # Prose annotations (from *-annotations-docs.yaml)
      reason:
        type: string
        description: Why this field is collected; business or program context.

      modeling:
        type: string
        description: Technical modeling decisions or design rationale for this field.
