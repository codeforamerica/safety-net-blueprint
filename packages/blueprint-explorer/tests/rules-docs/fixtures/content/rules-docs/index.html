<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rules Docs — Rules Docs</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #F3F3F3; color: #1a1a1a; font-size: 14px; line-height: 1.6; }
    a { color: #5650BE; text-decoration: none; }
    a:hover { text-decoration: underline; }
    code { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 12px; background: #F7EDE8; padding: 1px 5px; border-radius: 3px; border: 1px solid #E9CCBE; color: #2a2a2a; }
    table { border-collapse: collapse; width: 100%; }
    th { background: #F7EDE8; color: #1a1a1a; font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; padding: 8px 12px; text-align: left; border-bottom: 2px solid #E9CCBE; }
    td { padding: 10px 12px; border-bottom: 1px solid #E9CCBE; vertical-align: top; font-size: 13px; word-break: break-word; overflow-wrap: anywhere; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #F7EDE8; }
    .content-item { transition: border-color 0.1s; }
    .content-item:hover { border-color: #5650BE; }
    .content-item > details > summary:hover { background: #E6EBF9; }
    details summary { transition: background 0.1s; }
    details summary:hover { background: #F7EDE8; }
    [data-expand-id] { transition: opacity 0.1s; }
    [data-expand-id]:hover { opacity: 0.75; }

    /* Deep-link target highlighting — fades out after arrival so it doesn't persist */
    @keyframes target-fade { 0%,60% { background: #fff9c4; } 100% { background: transparent; } }
    [id]:target { scroll-margin-top: 1rem; }
    tr[id]:target td { animation: target-fade 4s ease forwards; }
    .content-item[id]:target > details > summary { animation: target-fade 4s ease forwards; }

    /* Permalink anchors — hidden until parent is hovered */
    .permalink { opacity: 0; font-size: 10px; text-decoration: none; color: inherit; transition: opacity 0.1s; }
    tr:hover .permalink,
    .content-item:hover .permalink,
    summary:hover .permalink { opacity: 0.4; }
    
  </style>
</head>
<body>
  <div style="background:#2B1A78;padding:0.5rem 1.25rem;display:flex;align-items:center;gap:0.5rem;font-size:12px;font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;color:#C2C0E8;"><a href="../index.html" style="color:#C2C0E8;text-decoration:none;">Explorer</a><span style="opacity:0.5;">/</span><a href="index.html" style="color:#C2C0E8;text-decoration:none;">Rules Docs</a><span style="opacity:0.5;">/</span><a href="#" style="color:#FFFFFF;text-decoration:none;">Rules Docs</a></div>
  <script src="rules-engine.js"></script>
<div style="max-width:1100px;margin:0 auto;padding:2.5rem 1.5rem 4rem;">
<h1 style="font-size:1.25rem;font-weight:800;color:#111827;margin-bottom:1.5rem">Rules Docs</h1>
<table style="width:100%;border-collapse:collapse">
  <thead>
    <tr>
      <th style="padding:6px 16px 4px 0;font-size:9px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:#9ca3af;text-align:left">Ruleset</th>
      <th style="padding:6px 0 4px;font-size:9px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:#9ca3af;text-align:left">Domain</th>
    </tr>
  </thead>
  <tbody><tr style="border-bottom:1px solid #f3f4f6">
      <td style="padding:8px 16px 8px 0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:700;color:#2B1A78;">
        <a href="test-main.html" style="color:inherit;text-decoration:none;">main</a>
      </td>
      <td style="padding:8px 0;font-size:12px;color:#6b7280;">test</td>
    </tr></tbody>
</table></div>
  <script>
    document.querySelectorAll('[data-expand-id]').forEach(btn => {
      const target = document.getElementById(btn.getAttribute('data-expand-id'));
      if (!target) return;
      btn.addEventListener('click', () => {
        const visible = target.style.display !== 'none';
        target.style.display = visible ? 'none' : '';
        const ch = btn.querySelector('.chevron, .chip-arrow');
        if (ch) ch.textContent = visible ? '▶' : '▼';
      });
    });
    
  </script>
</body>
</html>
