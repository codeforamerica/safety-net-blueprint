<div style="position:absolute;left:783px;top:52px;width:556px;height:62px;background:#F3F3F3;border:1.5px dashed #E9CCBE;border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;z-index:2;padding:4px 6px"><div style="font-size:12px;font-weight:700;color:#000000;">Identity</div></div>
<div style="position:absolute;left:699.5px;top:169.0px;transform:translate(-50%,0);text-align:center;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;z-index:3;"><div style="font-size:9px;font-weight:600;color:#5650BE;white-space:nowrap;">⚡ task.assigned</div></div>
</div>

  <script>
    (function() {
      const tip = document.createElement('div');
      tip.style.cssText = [
        'position:fixed', 'display:none', 'pointer-events:none',
        "font-family:'Helvetica Neue',Helvetica,Arial,sans-serif",
        'font-size:8.5px', 'line-height:1.65', 'white-space:nowrap',
        'z-index:9999', 'background:white', 'border:1px solid #E9CCBE',
        'border-radius:5px', 'padding:5px 8px',
        'box-shadow:0 2px 8px rgba(0,0,0,0.12)'
      ].join(';');
      document.body.appendChild(tip);
      const content = {};
      document.querySelectorAll('.int-content').forEach(el => {
        content[el.dataset.intId] = el.innerHTML;
      });
      document.querySelectorAll('.int-hit').forEach(el => {
        const html = content[el.dataset.intId] || '';
        if (!html) return;
        el.addEventListener('mouseenter', () => { tip.innerHTML = html; tip.style.display = 'block'; });
        el.addEventListener('mousemove', e => { tip.style.left = (e.clientX + 16) + 'px'; tip.style.top = (e.clientY + 10) + 'px'; });
        el.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
      });
    })();
  </script>
