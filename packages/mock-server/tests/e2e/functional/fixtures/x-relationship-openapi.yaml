openapi: 3.1.0
info:
  title: X-Relationship Fixture API
  version: 1.0.0
  x-domain: x-relationship
  x-status: alpha
  x-visibility: internal
  description: |
    Fixture spec for functional testing of x-relationship behavior through the
    full resolve pipeline. Tests expand (Parent.ownerId → Owner) and links-only
    (Child.parentId → Parent) styles.
servers:
  - url: /x-relationship
    description: Functional test server (unique prefix avoids collision with other fixture specs)
tags:
  - name: Owners
    description: Manage owners.
  - name: Parents
    description: Manage parents. Each parent has a required ownerId (style&#58; expand).
  - name: Children
    description: Manage children. Each child has a required parentId (style&#58; links-only).
x-events:
  owner.created:
    type: org.codeforamerica.safety-net-blueprint.x-relationship.owner.created
    summary: Emitted when a owner is created
    payload:
      $ref: "#/components/schemas/OwnerCreatedEvent"
  owner.updated:
    type: org.codeforamerica.safety-net-blueprint.x-relationship.owner.updated
    summary: Emitted when a owner is updated via PATCH
    payload:
      $ref: "#/components/schemas/OwnerUpdatedEvent"
  owner.deleted:
    type: org.codeforamerica.safety-net-blueprint.x-relationship.owner.deleted
    summary: Emitted when a owner is deleted
    payload:
      $ref: "#/components/schemas/OwnerDeletedEvent"
paths:
  /owners:
    get:
      summary: List owners
      description: Retrieve a paginated list of owners.
      operationId: listOwners
      tags:
        - Owners
      parameters:
        - $ref: ../../../../../contracts/components/parameters.yaml#/SearchQueryParam
        - $ref: ../../../../../contracts/components/parameters.yaml#/LimitParam
        - $ref: ../../../../../contracts/components/parameters.yaml#/OffsetParam
        - $ref: ../../../../../contracts/components/parameters.yaml#/SortParam
      responses:
        "200":
          description: A paginated collection of owners.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerList"
        "400":
          $ref: ../../../../../contracts/components/responses.yaml#/BadRequest
        "500":
          $ref: ../../../../../contracts/components/responses.yaml#/InternalError
    post:
      summary: Create a owner
      description: Create a new owner record.
      operationId: createOwner
      tags:
        - Owners
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerCreate"
      responses:
        "201":
          description: Owner created successfully.
          headers:
            Location:
              description: URL of the newly created owner resource.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Owner"
        "400":
          $ref: ../../../../../contracts/components/responses.yaml#/BadRequest
        "422":
          $ref: ../../../../../contracts/components/responses.yaml#/UnprocessableEntity
        "500":
          $ref: ../../../../../contracts/components/responses.yaml#/InternalError
  /owners/{ownerId}:
    parameters:
      - $ref: "#/components/parameters/OwnerIdParam"
    get:
      summary: Get a owner
      description: Retrieve a single owner by identifier.
      operationId: getOwner
      tags:
        - Owners
      responses:
        "200":
          description: Owner retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Owner"
              examples:
                OwnerExample1:
                  $ref: "#/components/examples/OwnerExample1"
        "404":
          $ref: ../../../../../contracts/components/responses.yaml#/NotFound
        "500":
          $ref: ../../../../../contracts/components/responses.yaml#/InternalError
    patch:
      summary: Update a owner
      description: Apply partial updates to an existing owner.
      operationId: updateOwner
      tags:
        - Owners
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerUpdate"
      responses:
        "200":
          description: Owner updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Owner"
        "400":
          $ref: ../../../../../contracts/components/responses.yaml#/BadRequest
        "404":
          $ref: ../../../../../contracts/components/responses.yaml#/NotFound
        "422":
          $ref: ../../../../../contracts/components/responses.yaml#/UnprocessableEntity
        "500":
          $ref: ../../../../../contracts/components/responses.yaml#/InternalError
    delete:
      summary: Delete a owner
      description: Permanently remove a owner record.
      operationId: deleteOwner
      tags:
        - Owners
      responses:
        "204":
          description: Owner deleted successfully.
        "404":
          $ref: ../../../../../contracts/components/responses.yaml#/NotFound
        "500":
          $ref: ../../../../../contracts/components/responses.yaml#/InternalError
  /parents:
    get:
      summary: List parents
      description: Retrieve a paginated list of parents.
      operationId: listParents
      tags:
        - Parents
      parameters:
        - $ref: ../../../../../contracts/components/parameters.yaml#/SearchQueryParam
        - $ref: ../../../../../contracts/components/parameters.yaml#/LimitParam
        - $ref: ../../../../../contracts/components/parameters.yaml#/OffsetParam
        - $ref: ../../../../../contracts/components/parameters.yaml#/SortParam
      responses:
        "200":
          description: A paginated collection of parents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentList"
        "400":
          $ref: ../../../../../contracts/components/responses.yaml#/BadRequest
        "500":
          $ref: ../../../../../contracts/components/responses.yaml#/InternalError
    post:
      summary: Create a parent
      description: Create a new parent record.
      operationId: createParent
      tags:
        - Parents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentCreate"
      responses:
        "201":
          description: Parent created successfully.
          headers:
            Location:
              description: URL of the newly created parent resource.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Parent"
        "400":
          $ref: ../../../../../contracts/components/responses.yaml#/BadRequest
        "422":
          $ref: ../../../../../contracts/components/responses.yaml#/UnprocessableEntity
        "500":
          $ref: ../../../../../contracts/components/responses.yaml#/InternalError
  /parents/{parentId}:
    parameters:
      - $ref: "#/components/parameters/ParentIdParam"
    get:
      summary: Get a parent
      description: Retrieve a single parent by identifier.
      operationId: getParent
      tags:
        - Parents
      responses:
        "200":
          description: Parent retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Parent"
              examples:
                ParentExample1:
                  $ref: "#/components/examples/ParentExample1"
        "404":
          $ref: ../../../../../contracts/components/responses.yaml#/NotFound
        "500":
          $ref: ../../../../../contracts/components/responses.yaml#/InternalError
    patch:
      summary: Update a parent
      description: Apply partial updates to an existing parent.
      operationId: updateParent
      tags:
        - Parents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentUpdate"
      responses:
        "200":
          description: Parent updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Parent"
        "400":
          $ref: ../../../../../contracts/components/responses.yaml#/BadRequest
        "404":
          $ref: ../../../../../contracts/components/responses.yaml#/NotFound
        "422":
          $ref: ../../../../../contracts/components/responses.yaml#/UnprocessableEntity
        "500":
          $ref: ../../../../../contracts/components/responses.yaml#/InternalError
    delete:
      summary: Delete a parent
      description: Permanently remove a parent record.
      operationId: deleteParent
      tags:
        - Parents
      responses:
        "204":
          description: Parent deleted successfully.
        "404":
          $ref: ../../../../../contracts/components/responses.yaml#/NotFound
        "500":
          $ref: ../../../../../contracts/components/responses.yaml#/InternalError
  /children:
    get:
      summary: List children
      description: Retrieve a paginated list of children.
      operationId: listChildren
      tags:
        - Children
      parameters:
        - $ref: ../../../../../contracts/components/parameters.yaml#/SearchQueryParam
        - $ref: ../../../../../contracts/components/parameters.yaml#/LimitParam
        - $ref: ../../../../../contracts/components/parameters.yaml#/OffsetParam
        - $ref: ../../../../../contracts/components/parameters.yaml#/SortParam
      responses:
        "200":
          description: A paginated collection of children.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChildList"
        "400":
          $ref: ../../../../../contracts/components/responses.yaml#/BadRequest
        "500":
          $ref: ../../../../../contracts/components/responses.yaml#/InternalError
    post:
      summary: Create a child
      description: Create a new child record.
      operationId: createChild
      tags:
        - Children
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChildCreate"
      responses:
        "201":
          description: Child created successfully.
          headers:
            Location:
              description: URL of the newly created child resource.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Child"
        "400":
          $ref: ../../../../../contracts/components/responses.yaml#/BadRequest
        "422":
          $ref: ../../../../../contracts/components/responses.yaml#/UnprocessableEntity
        "500":
          $ref: ../../../../../contracts/components/responses.yaml#/InternalError
  /children/{childId}:
    parameters:
      - $ref: "#/components/parameters/ChildIdParam"
    get:
      summary: Get a child
      description: Retrieve a single child by identifier.
      operationId: getChild
      tags:
        - Children
      responses:
        "200":
          description: Child retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Child"
              examples:
                ChildExample1:
                  $ref: "#/components/examples/ChildExample1"
        "404":
          $ref: ../../../../../contracts/components/responses.yaml#/NotFound
        "500":
          $ref: ../../../../../contracts/components/responses.yaml#/InternalError
    patch:
      summary: Update a child
      description: Apply partial updates to an existing child.
      operationId: updateChild
      tags:
        - Children
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChildUpdate"
      responses:
        "200":
          description: Child updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Child"
        "400":
          $ref: ../../../../../contracts/components/responses.yaml#/BadRequest
        "404":
          $ref: ../../../../../contracts/components/responses.yaml#/NotFound
        "422":
          $ref: ../../../../../contracts/components/responses.yaml#/UnprocessableEntity
        "500":
          $ref: ../../../../../contracts/components/responses.yaml#/InternalError
    delete:
      summary: Delete a child
      description: Permanently remove a child record.
      operationId: deleteChild
      tags:
        - Children
      responses:
        "204":
          description: Child deleted successfully.
        "404":
          $ref: ../../../../../contracts/components/responses.yaml#/NotFound
        "500":
          $ref: ../../../../../contracts/components/responses.yaml#/InternalError
components:
  parameters:
    OwnerIdParam:
      name: ownerId
      in: path
      required: true
      description: Unique identifier of the owner.
      schema:
        type: string
        format: uuid
      example: 4d1f13f0-3e26-4c50-b2fb-8d140f7ec1c2
    ParentIdParam:
      name: parentId
      in: path
      required: true
      description: Unique identifier of the parent.
      schema:
        type: string
        format: uuid
      example: 4d1f13f0-3e26-4c50-b2fb-8d140f7ec1c2
    ChildIdParam:
      name: childId
      in: path
      required: true
      description: Unique identifier of the child.
      schema:
        type: string
        format: uuid
      example: 4d1f13f0-3e26-4c50-b2fb-8d140f7ec1c2
  schemas:
    Owner:
      type: object
      additionalProperties: false
      required:
        - id
        - label
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Unique identifier (server-generated).
        label:
          type: string
          minLength: 1
          maxLength: 200
          description: Display label for the owner.
        note:
          type: string
          maxLength: 1000
          description: Optional note.
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when the owner was created.
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when the owner was last updated.
    OwnerCreate:
      type: object
      additionalProperties: false
      required:
        - label
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 200
          description: Display label for the owner.
        note:
          type: string
          maxLength: 1000
          description: Optional note.
    OwnerUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 200
          description: Display label for the owner.
        note:
          type: string
          maxLength: 1000
          description: Optional note.
    OwnerList:
      type: object
      additionalProperties: false
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Owner"
        total:
          type: integer
          minimum: 0
          description: Total number of owners available.
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: Maximum number of owners requested.
        offset:
          type: integer
          minimum: 0
          description: Number of items skipped before the current page.
        hasNext:
          type: boolean
          description: Indicates whether more owners are available beyond the current page.
    OwnerCreatedEvent:
      description: Snapshot of the newly created owner resource.
      $ref: "#/components/schemas/Owner"
    OwnerUpdatedEvent:
      $ref: ../../../../../contracts/components/events.yaml#/ResourceUpdatedEvent
    OwnerDeletedEvent:
      $ref: ../../../../../contracts/components/events.yaml#/ResourceDeletedEvent
    Parent:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - ownerId
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Unique identifier (server-generated).
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Name of the parent.
        description:
          type: string
          maxLength: 1000
          description: Optional description.
        ownerId:
          type: string
          format: uuid
          description: FK to Owner. Expanded to a full Owner object on GET responses.
          x-relationship:
            resource: Owner
            style: expand
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when the parent was created.
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when the parent was last updated.
    ParentCreate:
      type: object
      additionalProperties: false
      required:
        - name
        - ownerId
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Name of the parent.
        description:
          type: string
          maxLength: 1000
          description: Optional description.
        ownerId:
          type: string
          format: uuid
          description: FK to Owner.
    ParentUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Name of the parent.
        description:
          type: string
          maxLength: 1000
          description: Optional description.
        ownerId:
          type: string
          format: uuid
          description: FK to Owner.
    ParentList:
      type: object
      additionalProperties: false
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Parent"
        total:
          type: integer
          minimum: 0
          description: Total number of parents available.
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: Maximum number of parents requested.
        offset:
          type: integer
          minimum: 0
          description: Number of items skipped before the current page.
        hasNext:
          type: boolean
          description: Indicates whether more parents are available beyond the current page.
    ParentCreatedEvent:
      description: Snapshot of the newly created parent resource.
      $ref: "#/components/schemas/Parent"
    ParentUpdatedEvent:
      $ref: ../../../../../contracts/components/events.yaml#/ResourceUpdatedEvent
    ParentDeletedEvent:
      $ref: ../../../../../contracts/components/events.yaml#/ResourceDeletedEvent
    Child:
      type: object
      additionalProperties: false
      required:
        - id
        - label
        - parentId
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Unique identifier (server-generated).
        label:
          type: string
          minLength: 1
          maxLength: 200
          description: Display label for the child.
        note:
          type: string
          maxLength: 1000
          description: Optional note.
        parentId:
          type: string
          format: uuid
          description: FK to Parent. A links object with a URI to the parent is added on GET responses.
          x-relationship:
            resource: Parent
            style: links-only
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when the child was created.
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when the child was last updated.
    ChildCreate:
      type: object
      additionalProperties: false
      required:
        - label
        - parentId
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 200
          description: Display label for the child.
        note:
          type: string
          maxLength: 1000
          description: Optional note.
        parentId:
          type: string
          format: uuid
          description: FK to Parent.
    ChildUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 200
          description: Display label for the child.
        note:
          type: string
          maxLength: 1000
          description: Optional note.
        parentId:
          type: string
          format: uuid
          description: FK to Parent.
    ChildList:
      type: object
      additionalProperties: false
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Child"
        total:
          type: integer
          minimum: 0
          description: Total number of children available.
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: Maximum number of children requested.
        offset:
          type: integer
          minimum: 0
          description: Number of items skipped before the current page.
        hasNext:
          type: boolean
          description: Indicates whether more children are available beyond the current page.
    ChildCreatedEvent:
      description: Snapshot of the newly created child resource.
      $ref: "#/components/schemas/Child"
    ChildUpdatedEvent:
      $ref: ../../../../../contracts/components/events.yaml#/ResourceUpdatedEvent
    ChildDeletedEvent:
      $ref: ../../../../../contracts/components/events.yaml#/ResourceDeletedEvent
  examples:
    OwnerExample1:
      summary: Example Owner record
      value:
        id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        label: Example Owner
        note: An optional note about this owner.
        createdAt: "2024-01-15T10:30:00Z"
        updatedAt: "2024-01-15T10:30:00Z"
    ParentExample1:
      summary: Example Parent record
      value:
        id: b2c3d4e5-f6a7-8901-bcde-f12345678901
        name: Example Parent
        description: An optional description.
        ownerId: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        createdAt: "2024-01-15T10:30:00Z"
        updatedAt: "2024-01-15T10:30:00Z"
    ChildExample1:
      summary: Example Child record
      value:
        id: c3d4e5f6-a7b8-9012-cdef-123456789012
        label: Example Child
        note: An optional note about this child.
        parentId: b2c3d4e5-f6a7-8901-bcde-f12345678901
        createdAt: "2024-01-15T10:30:00Z"
        updatedAt: "2024-01-15T10:30:00Z"
