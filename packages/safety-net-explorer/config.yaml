name: "Safety Net Blueprint"
repo:
  url: "https://github.com/codeforamerica/safety-net-blueprint"
  branch: "refactor/blueprint-core-package"
  spec_path: "packages/safety-net-contracts/src"
  link_template: "{url}/blob/{branch}/{spec_path}"

# Optional hero links shown in the explorer hub (e.g. for leadership audiences)
featured_links:
  - label: "Executive Summary"
    href: "authored/executive-summary.html"
  - label: "Architecture Principles"
    href: "authored/architecture-principles.html"

# Cross-cutting concerns shown as a banner on the context-map overview.
cross_cutting:
  - Authentication & Authorization
  - Audit & History
  - Search
  - Observability
  - Reporting
  - Configuration Management

# Bounded contexts
# status: partial | not-started | design-complete
domains:
  - id: client_management
    label: Client Management
    status: not-started
    description: Persistent client identity & history
    entities: [Person, Client, Relationship]

  - id: intake
    label: Intake
    status: partial
    description: Application submission & intake processing
    entities: [Application, ApplicationMember, Income, Expense, Resource, Verification]

  - id: eligibility
    label: Eligibility
    status: design-complete
    description: Program eligibility determination
    entities: [Determination, Decision]

  - id: case_management
    label: Case Management
    status: partial
    description: Cases, workers & staff assignments
    entities: [Case, CaseWorker, Assignment, Office]

  - id: document_management
    label: Document Management
    status: not-started
    description: Files, uploads & verification
    entities: [Document, Upload, DocumentRequest]

  - id: workflow
    label: Workflow
    status: partial
    description: Task lifecycle, queues & SLA tracking
    entities: [Task, Queue, VerificationTask, SLAType]

  - id: data_exchange
    label: Data Exchange
    status: partial
    description: External service facade — FDSH, IEVS, SAVE, SSA
    entities: [ExternalService, ExternalServiceCall]

  - id: scheduling
    label: Scheduling
    status: partial
    description: Appointments & interviews
    entities: [Appointment, Schedule]

  - id: communication
    label: Communications
    status: not-started
    description: Notices, letters & client alerts
    entities: [Notice, Template, DeliveryEvent, Preference]

# Domain events (asynchronous, pub/sub)
#
# publisher: the domain that emits the event (singleton)
# subscribers: one or more domains that consume the event
# status: implemented | planned  — whether the publisher is emitting the event
events:

  # ── Client Management ─────────────────────────────────────────────────────────

  # person match result surfaces prior case history and prompts caseworker
  # review on fuzzy matches — requires client management domain contract (#249)
  - name: person.match_resolved
    publisher: client_management
    status: planned
    subscribers:
      - intake

  # ── Data Exchange ─────────────────────────────────────────────────────────────

  # verification result received — triggers conditional document requirement
  # updates and task lifecycle events
  - name: call.completed
    publisher: data_exchange
    status: implemented
    subscribers:
      - intake
      - eligibility

  - name: call.submitted
    publisher: data_exchange
    status: planned
    subscribers:
      - workflow
      - eligibility

  - name: call.failed
    publisher: data_exchange
    status: planned
    subscribers:
      - workflow
      - eligibility

  - name: call.timed_out
    publisher: data_exchange
    status: planned
    subscribers:
      - workflow
      - eligibility

  # ── Eligibility ───────────────────────────────────────────────────────────────

  # expedited screening result — intake sets isExpedited: true on the application;
  # workflow subscribes directly to assign the expedited SLA track (no re-publish needed)
  - name: eligibility.determination.expedited
    publisher: eligibility
    status: implemented
    subscribers:
      - intake
      - workflow

  # per-person per-program decision outcome — fires on auto-determination at submission
  # (Medicaid, all checks conclusive, 45 CFR § 435.911) or after application.review_completed;
  # may fire multiple times as individual Decisions resolve
  - name: eligibility.decision.completed
    publisher: eligibility
    status: implemented
    subscribers:
      - intake

  # fires once all program+member combinations on the application are determined;
  # triggers intake to update final status and close the application
  - name: eligibility.determination.completed
    publisher: eligibility
    status: implemented
    subscribers:
      - intake

  # ── Document Management ──────────────────────────────────────────────────────

  # emitted when a DocumentVersion is uploaded; intake subscribes when the document
  # carries metadata.intake.verificationId to satisfy the linked Verification
  - name: version.uploaded
    publisher: document_management
    status: implemented
    subscribers:
      - intake

  # ── Intake ───────────────────────────────────────────────────────────────────

  # intake calls communication directly when a document request is created on a verification item;
  # no event — intake knows exactly what it needs and who to call

  # emitted when a determination requires supervisor sign-off before the NOA is sent;
  # workflow subscribes to create a supervisor approval task and move the caseworker
  # task to pending_review
  - name: determination.approval_needed
    publisher: intake
    status: implemented
    subscribers:
      - workflow

  # emitted when a supervisor rejects a determination; workflow returns the
  # caseworker task to in_progress via return-to-worker for revision
  - name: determination.rejected
    publisher: intake
    status: implemented
    subscribers:
      - workflow

  # triggers case creation and workflow task cleanup on close
  - name: application.closed
    publisher: intake
    status: implemented
    subscribers:
      - case_management
      - workflow

  # fires automatically when all VerificationItems are resolved —
  # triggers the eligibility rules engine, no caseworker action needed
  - name: application.review_completed
    publisher: intake
    status: implemented
    subscribers:
      - eligibility

  - name: application.submitted
    publisher: intake
    status: implemented
    subscribers:
      - workflow
      - eligibility
      - client_management

  - name: application.withdrawn
    publisher: intake
    status: implemented
    subscribers:
      - workflow
      - eligibility

  # emitted on POST (resource creation) — no cross-domain subscribers yet
  - name: application.created
    publisher: intake
    status: implemented
    subscribers: []

  # emitted when submitted application transitions to under_review;
  # triggered internally by task.claimed via the intake rules file
  - name: application.opened
    publisher: intake
    status: implemented
    subscribers: []

  # generic resource lifecycle events from OpenAPI x-events
  - name: application.updated
    publisher: intake
    status: implemented
    subscribers: []

  - name: application.deleted
    publisher: intake
    status: implemented
    subscribers: []

  # ── Scheduling ────────────────────────────────────────────────────────────────

  # appointment.scheduled links the appointment to the Interview record in intake.
  # appointment.completed is a scheduling-domain event; intake does not subscribe —
  # interview completion is caseworker-attested (PATCH completedAt) per Decision 15.
  - name: appointment.scheduled
    publisher: scheduling
    status: implemented
    subscribers:
      - intake

  - name: appointment.completed
    publisher: scheduling
    status: planned
    subscribers: []

  # ── Workflow ─────────────────────────────────────────────────────────────────

  # transitions the linked application from submitted → under_review
  - name: task.claimed
    publisher: workflow
    status: implemented
    subscribers: []

  # emitted on task creation (onCreate hook)
  - name: task.created
    publisher: workflow
    status: implemented
    subscribers: []

  # supervisor or system assigns task to a specific caseworker
  - name: task.assigned
    publisher: workflow
    status: implemented
    subscribers: []

  # caseworker releases task back to queue
  - name: task.released
    publisher: workflow
    status: implemented
    subscribers: []

  - name: task.completed
    publisher: workflow
    status: implemented
    subscribers: []

  - name: task.cancelled
    publisher: workflow
    status: implemented
    subscribers: []

  - name: task.reopened
    publisher: workflow
    status: implemented
    subscribers: []

  # manual escalation by caseworker or supervisor
  - name: task.escalated
    publisher: workflow
    status: implemented
    subscribers: []

  - name: task.de-escalated
    publisher: workflow
    status: implemented
    subscribers: []

  # task blocked waiting for applicant action
  - name: task.awaiting_client
    publisher: workflow
    status: implemented
    subscribers: []

  # task blocked waiting for external verification result
  - name: task.awaiting_verification
    publisher: workflow
    status: implemented
    subscribers: []

  # manually unblocked by caseworker or supervisor
  - name: task.resumed
    publisher: workflow
    status: implemented
    subscribers: []

  # unblocked by an incoming verification result
  - name: task.system_resumed
    publisher: workflow
    status: implemented
    subscribers: []

  - name: task.submitted_for_review
    publisher: workflow
    status: implemented
    subscribers: []

  - name: task.approved
    publisher: workflow
    status: implemented
    subscribers: []

  - name: task.returned_to_worker
    publisher: workflow
    status: implemented
    subscribers: []

  - name: task.priority_changed
    publisher: workflow
    status: implemented
    subscribers: []

  # SLA deadline exceeded — federal compliance reporting trigger
  - name: task.sla_breached
    publisher: workflow
    status: implemented
    subscribers: []

  # timer-triggered escalations (state machine only — not in OpenAPI x-events)
  - name: task.auto_escalated
    publisher: workflow
    status: implemented
    subscribers: []

  # auto-cancelled after 30 days in awaiting_client
  - name: task.auto_cancelled
    publisher: workflow
    status: implemented
    subscribers: []

  # auto-resumed after 7 days in awaiting_verification
  - name: task.auto_resumed
    publisher: workflow
    status: implemented
    subscribers: []

  # generic resource lifecycle events from OpenAPI x-events
  - name: task.updated
    publisher: workflow
    status: implemented
    subscribers: []

  - name: task.deleted
    publisher: workflow
    status: implemented
    subscribers: []

# Direct API calls (synchronous, point-to-point — not event-driven)
#
# call: the operation being invoked
# domain: the domain that exposes the operation
# callers: one or more domains initiating the call
# status: implemented | planned
apis:

  - call: FDSH services (fdsh_ssa, fdsh_vlp, fdsh_fti, fdsh_medicare, fdsh_vci)
    domain: data_exchange
    status: planned
    callers:
      - eligibility
      - intake

  - call: IEVS sources (ssa_ievs, irs_ievs, swica, uib)
    domain: data_exchange
    status: planned
    callers:
      - eligibility
      - intake

  - call: immigration status — USCIS SAVE (save)
    domain: data_exchange
    status: planned
    callers:
      - eligibility

  - call: enrollment & incarceration checks
    domain: data_exchange
    status: planned
    callers:
      - eligibility
