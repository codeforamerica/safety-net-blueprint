$defs:
  PhoneNumber:
    title: PhoneNumber
    type: object
    properties:
      number:
        type: string
      extension:
        type: string

  # ContactDetails references PhoneNumber via internal #/$defs/ — this is the
  # pattern that breaks generate-field-inventory when the custom resolver returns
  # a parsed object instead of a string (causing $RefParser to lose the base URL
  # and resolve #/$defs/ against the root spec instead of this file).
  ContactDetails:
    title: ContactDetails
    type: object
    properties:
      phone:
        $ref: "#/$defs/PhoneNumber"
      altPhone:
        $ref: "#/$defs/PhoneNumber"
