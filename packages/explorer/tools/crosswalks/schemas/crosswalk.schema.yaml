# crosswalk.schema.yaml
#
# JSON Schema for blueprint crosswalk files.
#
# A crosswalk maps blueprint field inventory paths to fields in an external
# system (or vice versa). Each file represents one crosswalk relationship
# (e.g. blueprint → CBMS, interview template → blueprint). The direction and
# context are declared in the generator config, not in this file.
#
# Validate: ajv validate -s packages/explorer/schemas/crosswalk.schema.yaml -d your-crosswalk.yaml

$schema: 'https://json-schema.org/draft/2020-12/schema'
title: Crosswalk
description: >
  Maps blueprint field inventory paths to fields in an external system.
  Each entry in `mappings` describes one relationship. Either side may be
  an array for many-to-one or one-to-many mappings. Set `external` to null
  to record an explicit gap (a blueprint field with no external equivalent).

type: object
required: [mappings]
additionalProperties: false

properties:
  mappings:
    type: array
    minItems: 1
    items:
      $ref: '#/$defs/Mapping'

$defs:
  # ── Field path ──────────────────────────────────────────────────────────────
  # A dot-notation field path from the field inventory (e.g. application.channel)
  # or an external system field identifier (e.g. CBMS_APPL_CHNL_CD).
  # Arrays are used for many-to-one or one-to-many mappings.
  FieldPath:
    oneOf:
      - type: string
        minLength: 1
      - type: array
        minItems: 2
        items:
          type: string
          minLength: 1

  # ── Mapping entry ────────────────────────────────────────────────────────────
  Mapping:
    type: object
    required: [blueprint]
    additionalProperties: false
    properties:
      blueprint:
        $ref: '#/$defs/FieldPath'
        description: >
          Blueprint field inventory path(s). Use dot-notation matching the
          field inventory output (e.g. application.members[].contact.name.firstName).

      external:
        description: >
          External system field identifier(s). Set to null to record an explicit
          gap — a blueprint field that has no equivalent in the external system.
        oneOf:
          - $ref: '#/$defs/FieldPath'
          - type: 'null'

      type:
        type: string
        description: >
          How the fields relate. Use null or omit when unknown or not yet reviewed.
        enum:
          - '1:1'           # Direct field mapping; same semantics and cardinality
          - derived         # Value requires computation or interpretation from source field(s)
          - split           # One source field maps to multiple target fields
          - collapsed       # Multiple source fields combine into one target field
          - filtered_list   # Source field is a filtered subset of a target collection
          - gate            # Gating/conditional field; sub-fields carry the actual data
          - structural      # Grouping or organizational entry; no direct field mapping
          - no_equivalent   # No equivalent exists in the other system
          - needs_review    # Mapping uncertain; placeholder until resolved

      confidence:
        type: string
        description: >
          Confidence in the correctness of this mapping, expressed as a percentage.
          Typical values: 100% (direct), 90% (minor transform), 80% (type conversion),
          70% (derivation needed), 50% (weak or structural match).
        pattern: '^(100|[1-9][0-9]|[1-9])%$'

      rationale:
        type: string
        description: >
          Explanation for non-obvious mappings, gaps, or confidence downgrades.
          Omit for clear 1:1 mappings where the relationship is self-evident.

      annotations:
        $ref: '#/$defs/Annotations'

  # ── Annotations ─────────────────────────────────────────────────────────────
  # Mirrors the field annotation schema so the rendering library handles
  # both field-level and mapping-level annotations consistently.
  Annotations:
    type: object
    additionalProperties: false
    properties:
      reason:
        type: string
        description: Why this mapping exists; business or program context.
      design:
        type: string
        description: Technical modeling decisions, transformation notes, or caveats.
      policy:
        type: string
        description: Policy citation or regulatory basis for the mapping.
