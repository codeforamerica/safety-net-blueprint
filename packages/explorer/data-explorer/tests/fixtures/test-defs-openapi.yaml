openapi: 3.0.3
info:
  title: $defs regression test fixture
  version: 1.0.0
  description: >
    Exercises external schema files that use internal #/$defs/ self-references.
    Regression test for the bug where the annotating resolver returning a parsed
    object caused $RefParser to resolve #/$defs/ against the root spec instead
    of the external file.

paths:
  /applications:
    get:
      operationId: listApplications
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationList'

  /applications/{applicationId}:
    get:
      operationId: getApplication
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
    patch:
      operationId: updateApplication
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'

components:
  schemas:
    Application:
      allOf:
        - $ref: '#/components/schemas/ApplicationUpdate'
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    ApplicationList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Application'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        hasNext:
          type: boolean

    ApplicationUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [draft, submitted]
        contact:
          $ref: './schemas/domain.yaml#/$defs/ContactDetails'

    ContactDetails:
      $ref: './schemas/domain.yaml#/$defs/ContactDetails'

    PhoneNumber:
      $ref: './schemas/domain.yaml#/$defs/PhoneNumber'
