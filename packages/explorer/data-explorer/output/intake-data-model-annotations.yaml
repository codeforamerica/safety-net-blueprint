    description: Other allowable business expenses not captured above.
  application.income[].jobId:
    description: The job record this income is associated with.
  application.income[].memberId:
    description: The household member this income record belongs to.
  application.income[].type:
    description: >-
      The category of income. employed and self_employed are earned income; unearned covers passive
      and benefit income; lump_sum covers one-time payments; in_kind_support covers non-cash
      contributions; tribal covers per-capita and other tribal payments; education_grant covers
      grants and scholarships not reported elsewhere; prior_period covers income from a previous
      benefit period being reported now.
  application.income[].typeOther:
    description: Free-text description when type is other.
  application.income[].amount:
    description: The income amount for the given frequency period.
