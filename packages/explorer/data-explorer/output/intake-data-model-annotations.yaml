  application.jobs[].status:
    description: >-
      Current status of the job. active — currently working. on_strike — participating in a labor
      strike (SNAP eligibility may be affected under 7 CFR § 273.1(f)). ended — employment has
      concluded.
  application.jobs[].hoursPerWeek:
    description: >-
      Average hours worked per week. Used in TANF work participation rate calculations (45 CFR §
