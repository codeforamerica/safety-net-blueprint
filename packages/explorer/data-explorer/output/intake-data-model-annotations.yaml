  application.assetDisposals[].memberId:
    description: The household member who disposed of the asset.
  application.assetDisposals[].type:
    description: >-
      The category of asset. liquid (cash, checking, savings) is counted in the SNAP resource test
      (7 CFR § 273.8) and expedited screening resource threshold. vehicle and real_property
      treatment varies by program and state policy. retirement_account treatment depends on whether
      the account is accessible. insurance includes life insurance policies with cash value.
