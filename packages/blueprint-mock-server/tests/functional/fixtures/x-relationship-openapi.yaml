components:
  parameters:
    OwnerIdParam:
      name: ownerId
      in: path
      required: true
      description: Unique identifier of the owner.
      schema:
        type: string
        format: uuid
      example: 4d1f13f0-3e26-4c50-b2fb-8d140f7ec1c2
    ParentIdParam:
      name: parentId
      in: path
      required: true
      description: Unique identifier of the parent.
      schema:
        type: string
        format: uuid
      example: 4d1f13f0-3e26-4c50-b2fb-8d140f7ec1c2
    ChildIdParam:
      name: childId
      in: path
      required: true
      description: Unique identifier of the child.
      schema:
        type: string
        format: uuid
      example: 4d1f13f0-3e26-4c50-b2fb-8d140f7ec1c2
  schemas:
    # ---------------------------------------------------------------------------
    # Owner
    # ---------------------------------------------------------------------------
    OwnerWritable:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 200
          description: Display label for the owner.
        note:
          type: string
          maxLength: 1000
          description: Optional free-text note.
    Owner:
      unevaluatedProperties: false
      required:
        - id
        - label
        - createdAt
        - updatedAt
      allOf:
        - $ref: "#/components/schemas/OwnerWritable"
        - type: object
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
              description: Unique identifier (server-generated).
            createdAt:
              type: string
              format: date-time
              readOnly: true
              description: Timestamp when the owner was created.
            updatedAt:
              type: string
              format: date-time
              readOnly: true
              description: Timestamp when the owner was last updated.
    OwnerCreate:
      allOf:
        - $ref: "#/components/schemas/OwnerWritable"
        - type: object
          required:
            - label
    OwnerUpdate:
      allOf:
        - $ref: "#/components/schemas/OwnerWritable"
        - type: object
          minProperties: 1
    OwnerList:
      type: object
      additionalProperties: false
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Owner"
        total:
          type: integer
          minimum: 0
          description: Total number of owners available.
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: Maximum number of owners requested.
        offset:
          type: integer
          minimum: 0
          description: Number of items skipped before the current page.
        hasNext:
          type: boolean
          description: Indicates whether more owners are available beyond the current page.
    OwnerCreatedEvent:
      description: Snapshot of the newly created owner resource.
      $ref: "#/components/schemas/Owner"
    OwnerUpdatedEvent:
      $ref: https://blueprint.codeforamerica.org/base/schemas/events.yaml#/ResourceUpdatedEvent
    OwnerDeletedEvent:
      $ref: https://blueprint.codeforamerica.org/base/schemas/events.yaml#/ResourceDeletedEvent

    # ---------------------------------------------------------------------------
    # Parent — ownerId has x-relationship: expand (set on the read schema only)
    # ParentCreate/ParentUpdate reference ParentWritable so the expand
    # transformation does not affect write payloads.
    # Note: with the Writable pattern, both ownerId (from ParentWritable) and
    # owner (expanded) will coexist on GET responses — see x-extensions.md.
    # ---------------------------------------------------------------------------
    ParentWritable:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Name of the parent.
        ownerId:
          type: string
          format: uuid
          description: ID of the owner this parent belongs to.
        description:
          type: string
          maxLength: 1000
          description: Optional description.
    Parent:
      unevaluatedProperties: false
      required:
        - id
        - name
        - ownerId
        - createdAt
        - updatedAt
      allOf:
        - $ref: "#/components/schemas/ParentWritable"
        - type: object
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
              description: Unique identifier (server-generated).
            ownerId:
              x-relationship:
                resource: Owner
                style: expand
            createdAt:
              type: string
              format: date-time
              readOnly: true
              description: Timestamp when the parent was created.
            updatedAt:
              type: string
              format: date-time
              readOnly: true
              description: Timestamp when the parent was last updated.
    ParentCreate:
      allOf:
        - $ref: "#/components/schemas/ParentWritable"
        - type: object
          required:
            - name
            - ownerId
    ParentUpdate:
      allOf:
        - $ref: "#/components/schemas/ParentWritable"
        - type: object
          minProperties: 1
    ParentList:
      type: object
      additionalProperties: false
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Parent"
        total:
          type: integer
          minimum: 0
          description: Total number of parents available.
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: Maximum number of parents requested.
        offset:
          type: integer
          minimum: 0
          description: Number of items skipped before the current page.
        hasNext:
          type: boolean
          description: Indicates whether more parents are available beyond the current page.
    ParentCreatedEvent:
      description: Snapshot of the newly created parent resource.
      $ref: "#/components/schemas/Parent"
    ParentUpdatedEvent:
      $ref: https://blueprint.codeforamerica.org/base/schemas/events.yaml#/ResourceUpdatedEvent
    ParentDeletedEvent:
      $ref: https://blueprint.codeforamerica.org/base/schemas/events.yaml#/ResourceDeletedEvent

    # ---------------------------------------------------------------------------
    # Child — parentId has x-relationship: links-only (set on the read schema only)
    # links-only does not rename the FK field so coexistence is not a concern.
    # ---------------------------------------------------------------------------
    ChildWritable:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 200
          description: Display label for the child.
        parentId:
          type: string
          format: uuid
          description: ID of the parent this child belongs to.
        note:
          type: string
          maxLength: 1000
          description: Optional free-text note.
    Child:
      unevaluatedProperties: false
      required:
        - id
        - label
        - parentId
        - createdAt
        - updatedAt
      allOf:
        - $ref: "#/components/schemas/ChildWritable"
        - type: object
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
              description: Unique identifier (server-generated).
            parentId:
              x-relationship:
                resource: Parent
                style: links-only
            createdAt:
              type: string
              format: date-time
              readOnly: true
              description: Timestamp when the child was created.
            updatedAt:
              type: string
              format: date-time
              readOnly: true
              description: Timestamp when the child was last updated.
    ChildCreate:
      allOf:
        - $ref: "#/components/schemas/ChildWritable"
        - type: object
          required:
            - label
            - parentId
    ChildUpdate:
      allOf:
        - $ref: "#/components/schemas/ChildWritable"
        - type: object
          minProperties: 1
    ChildList:
      type: object
      additionalProperties: false
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Child"
        total:
          type: integer
          minimum: 0
          description: Total number of children available.
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: Maximum number of children requested.
        offset:
          type: integer
          minimum: 0
          description: Number of items skipped before the current page.
        hasNext:
          type: boolean
          description: Indicates whether more children are available beyond the current page.
    ChildCreatedEvent:
      description: Snapshot of the newly created child resource.
      $ref: "#/components/schemas/Child"
    ChildUpdatedEvent:
      $ref: https://blueprint.codeforamerica.org/base/schemas/events.yaml#/ResourceUpdatedEvent
    ChildDeletedEvent:
      $ref: https://blueprint.codeforamerica.org/base/schemas/events.yaml#/ResourceDeletedEvent
  examples:
    OwnerExample1:
      summary: Example Owner record
      value:
        id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        label: Example Owner
        note: An optional note about this owner.
        createdAt: "2024-01-15T10:30:00Z"
        updatedAt: "2024-01-15T10:30:00Z"
    ParentExample1:
      summary: Example Parent record
      value:
        id: b2c3d4e5-f6a7-8901-bcde-f12345678901
        name: Example Parent
        ownerId: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        owner:
          id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
          label: Example Owner
          createdAt: "2024-01-15T10:30:00Z"
          updatedAt: "2024-01-15T10:30:00Z"
        description: An optional description.
        createdAt: "2024-01-15T10:30:00Z"
        updatedAt: "2024-01-15T10:30:00Z"
    ChildExample1:
      summary: Example Child record
      value:
        id: c3d4e5f6-a7b8-9012-cdef-123456789012
        label: Example Child
        parentId: b2c3d4e5-f6a7-8901-bcde-f12345678901
        note: An optional note about this child.
        createdAt: "2024-01-15T10:30:00Z"
        updatedAt: "2024-01-15T10:30:00Z"
