openapi: 3.1.0
info:
  title: X-Relationship Fixture API
  version: 1.0.0
  x-domain: x-relationship
  x-status: alpha
  x-visibility: internal
  description: |
    Fixture spec for functional testing of x-relationship behavior through the
    full resolve pipeline. Tests expand (Parent.ownerId → Owner) and links-only
    (Child.parentId → Parent) styles.

    Uses the Writable schema pattern throughout: {Resource}Writable contains
    client-writable fields; {Resource} adds system fields and x-relationship
    annotations; {Resource}Create and {Resource}Update reference {Resource}Writable
    so resolve-time transformations on the read schema do not affect write payloads.
servers:
  - url: /x-relationship
    description: Functional test server (unique prefix avoids collision with other fixture specs)
tags:
  - name: Owners
    description: Manage owners.
  - name: Parents
    description: Manage parents. Each parent has a required ownerId (style&#58; expand).
  - name: Children
    description: Manage children. Each child has a required parentId (style&#58; links-only).
x-events:
  owner.created:
    type: org.codeforamerica.safety-net-blueprint.x-relationship.owner.created
    summary: Emitted when a owner is created
    payload:
      $ref: "#/components/schemas/OwnerCreatedEvent"
  owner.updated:
    type: org.codeforamerica.safety-net-blueprint.x-relationship.owner.updated
    summary: Emitted when a owner is updated via PATCH
    payload:
      $ref: "#/components/schemas/OwnerUpdatedEvent"
  owner.deleted:
    type: org.codeforamerica.safety-net-blueprint.x-relationship.owner.deleted
    summary: Emitted when a owner is deleted
    payload:
      $ref: "#/components/schemas/OwnerDeletedEvent"
  parent.created:
    type: org.codeforamerica.safety-net-blueprint.x-relationship.parent.created
    summary: Emitted when a parent is created
    payload:
      $ref: "#/components/schemas/ParentCreatedEvent"
  parent.updated:
    type: org.codeforamerica.safety-net-blueprint.x-relationship.parent.updated
    summary: Emitted when a parent is updated via PATCH
    payload:
      $ref: "#/components/schemas/ParentUpdatedEvent"
  parent.deleted:
    type: org.codeforamerica.safety-net-blueprint.x-relationship.parent.deleted
    summary: Emitted when a parent is deleted
    payload:
      $ref: "#/components/schemas/ParentDeletedEvent"
  child.created:
    type: org.codeforamerica.safety-net-blueprint.x-relationship.child.created
    summary: Emitted when a child is created
    payload:
      $ref: "#/components/schemas/ChildCreatedEvent"
  child.updated:
    type: org.codeforamerica.safety-net-blueprint.x-relationship.child.updated
    summary: Emitted when a child is updated via PATCH
    payload:
      $ref: "#/components/schemas/ChildUpdatedEvent"
  child.deleted:
    type: org.codeforamerica.safety-net-blueprint.x-relationship.child.deleted
    summary: Emitted when a child is deleted
    payload:
      $ref: "#/components/schemas/ChildDeletedEvent"
paths:
  /owners:
    get:
      summary: List owners
      description: Retrieve a paginated list of owners.
      operationId: listOwners
      tags:
        - Owners
      parameters:
        - $ref: https://blueprint.codeforamerica.org/base/components/parameters.yaml#/SearchQueryParam
        - $ref: https://blueprint.codeforamerica.org/base/components/parameters.yaml#/LimitParam
        - $ref: https://blueprint.codeforamerica.org/base/components/parameters.yaml#/OffsetParam
        - $ref: https://blueprint.codeforamerica.org/base/components/parameters.yaml#/SortParam
      responses:
        "200":
          description: A paginated collection of owners.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerList"
        "400":
          $ref: https://blueprint.codeforamerica.org/base/components/responses.yaml#/BadRequest
        "500":
          $ref: https://blueprint.codeforamerica.org/base/components/responses.yaml#/InternalError
    post:
      summary: Create an owner
      description: Create a new owner record.
      operationId: createOwner
      tags:
        - Owners
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerCreate"
      responses:
        "201":
          description: Owner created successfully.
          headers:
            Location:
              description: URL of the newly created owner resource.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Owner"
        "400":
          $ref: https://blueprint.codeforamerica.org/base/components/responses.yaml#/BadRequest
        "422":
          $ref: https://blueprint.codeforamerica.org/base/components/responses.yaml#/UnprocessableEntity
        "500":
          $ref: https://blueprint.codeforamerica.org/base/components/responses.yaml#/InternalError
  /owners/{ownerId}:
    parameters:
      - $ref: "#/components/parameters/OwnerIdParam"
    get:
      summary: Get an owner
      description: Retrieve a single owner by identifier.
      operationId: getOwner
      tags:
        - Owners
      responses:
        "200":
          description: Owner retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Owner"
              examples:
                OwnerExample1:
                  $ref: "#/components/examples/OwnerExample1"
        "404":
          $ref: https://blueprint.codeforamerica.org/base/components/responses.yaml#/NotFound
        "500":
          $ref: https://blueprint.codeforamerica.org/base/components/responses.yaml#/InternalError
    patch:
      summary: Update an owner
      description: Apply partial updates to an existing owner.
      operationId: updateOwner
      tags:
        - Owners
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerUpdate"
      responses:
        "200":
          description: Owner updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Owner"
        "400":
          $ref: https://blueprint.codeforamerica.org/base/components/responses.yaml#/BadRequest
        "404":
          $ref: https://blueprint.codeforamerica.org/base/components/responses.yaml#/NotFound
        "422":
          $ref: https://blueprint.codeforamerica.org/base/components/responses.yaml#/UnprocessableEntity
        "500":
          $ref: https://blueprint.codeforamerica.org/base/components/responses.yaml#/InternalError
    delete:
      summary: Delete an owner
      description: Permanently remove an owner record.
      operationId: deleteOwner
      tags:
        - Owners
      responses:
        "204":
          description: Owner deleted successfully.
        "404":
          $ref: https://blueprint.codeforamerica.org/base/components/responses.yaml#/NotFound
        "500":
          $ref: https://blueprint.codeforamerica.org/base/components/responses.yaml#/InternalError
  /parents:
    get:
      summary: List parents
      description: Retrieve a paginated list of parents.
      operationId: listParents
      tags:
        - Parents
      parameters:
        - $ref: https://blueprint.codeforamerica.org/base/components/parameters.yaml#/SearchQueryParam
        - $ref: https://blueprint.codeforamerica.org/base/components/parameters.yaml#/LimitParam
        - $ref: https://blueprint.codeforamerica.org/base/components/parameters.yaml#/OffsetParam
        - $ref: https://blueprint.codeforamerica.org/base/components/parameters.yaml#/SortParam
      responses:
        "200":
          description: A paginated collection of parents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentList"
        "400":
          $ref: https://blueprint.codeforamerica.org/base/components/responses.yaml#/BadRequest
        "500":
          $ref: https://blueprint.codeforamerica.org/base/components/responses.yaml#/InternalError
    post:
      summary: Create a parent
      description: Create a new parent record.
      operationId: createParent
      tags:
        - Parents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentCreate"
      responses:
        "201":
          description: Parent created successfully.
          headers:
            Location:
              description: URL of the newly created parent resource.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Parent"
        "400":
          $ref: https://blueprint.codeforamerica.org/base/components/responses.yaml#/BadRequest
        "422":
          $ref: https://blueprint.codeforamerica.org/base/components/responses.yaml#/UnprocessableEntity
        "500":
          $ref: https://blueprint.codeforamerica.org/base/components/responses.yaml#/InternalError
  /parents/{parentId}:
    parameters:
      - $ref: "#/components/parameters/ParentIdParam"
    get:
      summary: Get a parent
      description: Retrieve a single parent by identifier.
      operationId: getParent
      tags:
        - Parents
      responses:
        "200":
          description: Parent retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Parent"
              examples:
                ParentExample1:
                  $ref: "#/components/examples/ParentExample1"
        "404":
          $ref: https://blueprint.codeforamerica.org/base/components/responses.yaml#/NotFound
        "500":
          $ref: https://blueprint.codeforamerica.org/base/components/responses.yaml#/InternalError
    patch:
      summary: Update a parent
      description: Apply partial updates to an existing parent.
      operationId: updateParent
      tags:
        - Parents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentUpdate"
      responses:
        "200":
          description: Parent updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Parent"
        "400":
          $ref: https://blueprint.codeforamerica.org/base/components/responses.yaml#/BadRequest
        "404":
          $ref: https://blueprint.codeforamerica.org/base/components/responses.yaml#/NotFound
        "422":
          $ref: https://blueprint.codeforamerica.org/base/components/responses.yaml#/UnprocessableEntity
        "500":
          $ref: https://blueprint.codeforamerica.org/base/components/responses.yaml#/InternalError
    delete:
      summary: Delete a parent
      description: Permanently remove a parent record.
      operationId: deleteParent
