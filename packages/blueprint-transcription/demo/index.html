<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Transcription Demo</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e3e2dd;
    --accent: #2f5d8a; --warn: #a3542a; --code: #f0efea; --open: #fbefc4;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --panel: #1f1f1d; --ink: #ecebe6; --muted: #9a9993; --line: #33322f;
      --accent: #8db6e0; --warn: #e29a6f; --code: #2a2a27; --open: #4a4120; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header, .controls, main { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
  header { padding-top: 24px; }
  h1 { font-size: 1.5rem; margin: 0; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 16px auto; }
  select, button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  .controls button { cursor: pointer; }
  .controls button:disabled { opacity: 0.4; cursor: default; }
  #step, #run { background: var(--accent); color: var(--panel); border-color: var(--accent); }
  .divider { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
  #upcoming { color: var(--muted); font-size: 0.9rem; }
  main { padding-bottom: 32px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }

  /* The diagram: what the worker sees, then three lifelines. */
  .row, .heads { display: grid; grid-template-columns: 2fr 3fr; gap: 0 16px; }
  .heads { font-weight: 600; font-size: 0.85rem; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .heads .lanes { display: grid; grid-template-columns: 1fr 1fr 1fr; text-align: center; background: none; }
  #flow { height: 560px; overflow-y: auto; }
  .row { border-bottom: 1px solid var(--line); }
  .worker { padding: 6px 0; font-size: 0.92rem; overflow-wrap: anywhere; }
  .worker b { color: var(--muted); font-weight: 600; margin-right: 4px; }
  .worker.progress { color: var(--muted); font-style: italic; }
  .worker.gap { color: var(--warn); }
  .worker.aside { color: var(--muted); }
  .lanes { position: relative; padding: 4px 0;
    background: linear-gradient(to right,
      transparent calc(16.667% - 0.5px), var(--line) calc(16.667% - 0.5px), var(--line) calc(16.667% + 0.5px), transparent calc(16.667% + 0.5px),
      transparent calc(50% - 0.5px), var(--line) calc(50% - 0.5px), var(--line) calc(50% + 0.5px), transparent calc(50% + 0.5px),
      transparent calc(83.333% - 0.5px), var(--line) calc(83.333% - 0.5px), var(--line) calc(83.333% + 0.5px), transparent calc(83.333% + 0.5px)); }
  .step { position: relative; height: 30px; }
  .arrow, .note { position: absolute; top: 0; height: 100%; padding: 0; border: 0; background: none; color: var(--ink); font: inherit; font-size: 0.78rem; cursor: default; }
  .arrow::before { content: ""; position: absolute; left: 0; right: 0; bottom: 6px; border-top: 1.5px solid var(--ink); }
  .arrow::after { content: ""; position: absolute; right: -1px; bottom: 2px; border: 5px solid transparent; border-left: 8px solid var(--ink); border-right: 0; }
  .arrow.leftward::after { right: auto; left: -1px; border-left: 0; border-right: 8px solid var(--ink); }
  .arrow .label { position: absolute; left: 0; right: 0; top: 1px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .note { transform: translateX(-50%); white-space: nowrap; padding: 2px 6px; }
  .warn, .warn .label { color: var(--warn); }
  .arrow.warn::before { border-color: var(--warn); } .arrow.warn::after { border-left-color: var(--warn); }
  .arrow.warn.leftward::after { border-left-color: transparent; border-right-color: var(--warn); }
  .has-detail { cursor: pointer; }
  .has-detail .label { text-decoration: underline dotted; text-underline-offset: 3px; }
  button.open .label { background: var(--open); border-radius: 3px; }
  .detail { grid-column: 1 / -1; padding: 0 0 10px; }
  .detail h4 { margin: 6px 0 2px; font-size: 0.75rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
  .detail pre { margin: 0; padding: 8px; background: var(--code); border-radius: 6px; font-size: 0.78rem; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 300px; overflow: auto; }
  @media (max-width: 760px) {
    .row, .heads { grid-template-columns: 1fr 1fr; gap: 0 8px; }
    #flow { height: 420px; }
  }
</style>
</head>
<body>
<header>
  <h1>Live transcription, every part in one tab</h1>
  <p id="loading">Loading…</p>
</header>

<div class="controls">
  <select id="mode" aria-label="How the browser reaches the service">
    <option value="fake">Straight to a vendor</option>
    <option value="relay">Through a relay</option>
  </select>
  <select id="speed" aria-label="Speed when running all">
    <option value="0.5">½× speed</option>
    <option value="1" selected>1× speed</option>
    <option value="2">2× speed</option>
  </select>
  <button id="step">Step</button>
  <button id="run">Run all</button>
  <span id="upcoming"></span>
  <span class="divider"></span>
  <button id="pause">Go off the record</button>
  <button id="resume">Back on the record</button>
  <button id="drop">Drop the connection</button>
  <button id="stop">Stop</button>
</div>

<main>
  <section>
    <div class="heads">
      <div>What the worker sees</div>
      <div class="lanes"><span>Browser</span><span>Server</span><span id="service-lane">Service (stand-in)</span></div>
    </div>
    <div id="flow" aria-live="polite"></div>
  </section>
</main>

<!-- demo.js -->
</body>
</html>
