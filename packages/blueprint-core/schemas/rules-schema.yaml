# JSON Schema for domain rules YAML files ({domain}-rules.yaml).
# Validates structural correctness. Cross-artifact semantic checks
# (e.g., $ref resolution, cycle detection, CEL expression validity)
# are performed by the validate pipeline.
#
# Example usage:
#
#   $schema: "https://blueprint.codeforamerica.org/schemas/rules-schema.yaml"
#   domain: intake
#   rulesets:
#     workRequirements:
#       endpoint:
#         path: /assess-work-requirements
#       inputs:
#         person:
#           $ref: 'https://blueprint.codeforamerica.org/schemas/Person.yaml'
#         policy:
#           type: object
#           properties:
#             incomeThreshold:
#               type: number
#               default: 150
#       outputs:
#         eligible:
#           type: boolean
#         reason:
#           type: string
#       facts:
#         - path: eligible
#           expression: "person.age >= 18 && person.income < policy.incomeThreshold"
#         - path: reason
#           expression: "'Work requirement met'"

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://blueprint.codeforamerica.org/schemas/rules-schema.yaml"
title: Domain Rules
description: >
  Schema for domain rules files ({domain}-rules.yaml).
  A rules file contains one or more named rulesets. Each ruleset is a dependency
  graph of named facts. Facts are either inputs (values the caller supplies) or
  derived facts (values computed from other facts via a CEL expression). The
  evaluator walks the graph in topological order, resolving each derived fact
  from its dependencies, and supports partial evaluation against incomplete data.

type: object
required:
  - $schema
  - domain
  - rulesets
additionalProperties: false

properties:
  $schema:
    type: string
    description: Must reference the rules contract schema URI.

  domain:
    type: string
    description: Domain namespace (e.g., intake, eligibility).

  rulesets:
    type: object
    description: >
      Named ruleset declarations. Each key is the ruleset name (camelCase);
      the value declares the inputs, outputs, and facts for that ruleset.
    minProperties: 1
    additionalProperties:
      $ref: "#/$defs/Ruleset"

$defs:

  Ruleset:
    # Example — minimal ruleset:
    #   eligible:
    #     inputs:
    #       person:
    #         type: object
    #         properties:
    #           age: { type: integer }
    #           income: { type: number }
    #     outputs:
    #       eligible: { type: boolean }
    #     facts:
    #       - path: eligible
    #         expression: "person.age >= 18"
    #
    # Example — with shared schema refs and a standalone endpoint:
    #   workRequirements:
    #     endpoint:
    #       path: /assess-work-requirements
    #     inputs:
    #       person:
    #         $ref: 'https://blueprint.codeforamerica.org/schemas/Person.yaml'
    #     outputs:
    #       eligible:
    #         type: boolean
    #       reason:
    #         type: string
    #     facts:
    #       - path: eligible
    #         expression: "person.age >= 18 && person.income < 150"
    type: object
    description: >
      A named ruleset. Declares its inputs, outputs, and the facts that
      compute outputs from inputs via CEL expressions.
    required:
      - endpoint
      - inputs
      - outputs
      - facts
    additionalProperties: false
    properties:
      endpoint:
        description: >
          Where the ruleset is evaluated. Every ruleset in the blueprint is
          reachable through its API, at the path it declares — there is no
          default, and no way to have none.
        $ref: "#/$defs/Endpoint"
      inputs:
        $ref: "#/$defs/SchemaMap"
      constants:
        description: >
          Named values the ruleset's facts read as `constants.<name>` — a
          conversion factor, a threshold, a choice a state makes. They are not
          data: a caller doesn't send them, and a result resting on one is
          complete, not a placeholder. Fixed in the contract; a state changes
          one with an overlay. Each is an object so that where a value comes
          from can be declared later without changing its shape — evaluators
          read the value from the compiled graph, never from here.
        type: object
        minProperties: 1
        propertyNames:
          pattern: "^[a-zA-Z][a-zA-Z0-9]*$"
        additionalProperties:
          $ref: "#/$defs/Constant"
      outputs:
        $ref: "#/$defs/SchemaMap"
      facts:
        type: array
        description: >
          Ordered list of fact declarations. Each fact is either an input alias
          or a derived fact with a CEL expression. The evaluator resolves facts
          in topological order — declaration order does not need to match
          dependency order.
        minItems: 1
        items:
          $ref: "#/$defs/Fact"

  Constant:
    # Example:
    #   differenceAllowed:
    #     value: 0.1
    #     description: How far apart two amounts can be, as a fraction, before they count as different.
    type: object
    description: One named value a ruleset's facts read.
    required: [value]
    additionalProperties: false
    properties:
      value:
        description: The value, of any JSON type.
      type:
        type: string
        enum: [integer, number, string, boolean, array, object]
        description: >
          What CEL sees the value as. `integer` is a whole number in integer
          arithmetic — compare it with another integer, such as an age; a
          number without a type is a double.
      format:
        type: string
        enum: [date, date-time]
        description: >
          For a string, what CEL sees it as: `date` or `date-time` is a
          timestamp, compared with a date input the same way — a date is read
          at UTC midnight. Only with `type: string`.
      description:
        type: string
    # A format says how to read a string, so it needs one.
    dependentSchemas:
      format:
        required: [type]
        properties:
          type:
            const: string

  Fact:
    # Example — derived fact:
    #   - path: eligible
    #     expression: "person.age >= 18 && person.income < policy.incomeThreshold"
    #     description: "Whether the applicant meets basic eligibility criteria"
    #
    # Example — intermediate derived fact:
    #   - path: ageVerified
    #     expression: "person.age >= 18"
    type: object
    description: >
      A single fact in the dependency graph. Derived facts declare a CEL expression
      that computes the fact's value from other facts or inputs.
    required:
      - path
      - expression
    additionalProperties: false
    properties:
      path:
        type: string
        description: >
          The fact's name within the ruleset graph. Used to reference this fact
          in other expressions. camelCase by convention.

          A dot groups facts: `risks.earnedIncomeVaries` is the fact
          `earnedIncomeVaries` in the group `risks`. The fact keeps its whole
          path everywhere — other expressions refer to it by it, and the
          ruleset's answer names it by it — so a consumer reads the group from
          the name, whatever the ruleset. A path can't be both a fact and a
          group: `risks` and `risks.earnedIncomeVaries` in one ruleset is refused.

          `[].` names a fact on each item of a list fact: `reviewMonths[].qualifies`
          is computed once for each item of `reviewMonths`, which must declare
          `as`. Lists nest: `reviewMonths[].reviewWeeks[].worked`.
        pattern: "^[a-zA-Z][a-zA-Z0-9]*((\\.|\\[\\]\\.)[a-zA-Z][a-zA-Z0-9]*)*$"
      as:
        type: string
        description: >
          Makes this fact a list fact, and names one of its items. Facts at
          `<path>[].<name>` are computed once for each item, and their
          expressions read the item by this name: `month.hoursWorked` for an
          item field, `month.qualifies` for another fact on the item. A fact
          inside a nested list reads each enclosing item by its own name.
          Outside, the list is read with a macro, and each item carries its
          facts: `size(reviewMonths.filter(m, m.qualifies))`.
        pattern: "^[a-zA-Z_][a-zA-Z0-9_]*$"
      expression:
        type: string
        description: >
          CEL expression that computes this fact's value. May reference input
          paths and other derived facts by their path names.
        minLength: 1
      description:
        type: string
        description: Human-readable description of what this fact computes.
      type:
        description: >
          Optional type declaration for the computed value. Used for documentation
          and cross-artifact field validation. Inferred from the expression if omitted.

          Either a bare type name — the common case, and what every ruleset in
          the repository uses — or a full schema for a structured value. The
          compiler has always accepted both; only this declaration did not.
        oneOf:
          - type: string
            enum: [string, number, integer, boolean, object, array]
          - $ref: "#/$defs/SchemaOrRef"

  Endpoint:
    # Example:
    #   endpoint:
    #     path: /assess-work-requirements
    type: object
    description: >
      Places the ruleset's POST endpoint. The full path is the file-level domain
      followed by `path` — /intake/applications/evaluate-interview-flags. The request and
      response schemas are derived from the ruleset's inputs and outputs, and
      the endpoints are documented in an OpenAPI document resolve generates
      beside the rules file.
    required:
      - path
    additionalProperties: false
    properties:
      path:
        type: string
        description: >
          The path within the domain. The full endpoint path is /{domain}
          followed by this, e.g. /intake for the intake domain.

          Path parameters are not permitted. A ruleset is evaluated against the
          inputs in the request body and nothing binds a path segment to them, so
          a parameter in the path would be accepted and silently ignored — the
          path would promise resource hydration the endpoint does not perform.
          Pass the identifier as an input instead.
        format: uri-template
        # At least one segment, no parameters, no trailing slash: "/" would be
        # the domain's root, and "/x/" differs from "/x" only by its slash.
        pattern: "^(/[^/{}]+)+$"

  SchemaMap:
    type: object
    description: >
      A map of named input declarations. Each key is the input name as it appears
      in fact expressions; the value is a JSON Schema definition or $ref.

      Two things about declared types affect the answers a ruleset gives, and
      neither is obvious from the type name alone.

      `integer` means integer arithmetic. Division truncates, so an income of
      7 divided by 4 is 1, not 1.75. That is CEL's behaviour for two integers
      and it is what the declaration asks for — in a benefit calculation it is
      a policy choice, not a rounding detail. A fact that wants real division
      converts explicitly: `double(x) / 4.0`.

      Prefer `format: date` over `date-time` for temporal inputs unless a rule
      genuinely depends on the time of day. Dates compare and subtract cleanly;
      instants carry timezone semantics a determination rarely wants, and the
      blueprint already puts time-of-day concerns in SLA definitions and state
      machine transitions rather than in rules.

      Either format reaches an expression as a timestamp, so a fact reads it
      directly — `m.dateOfBirth.getFullYear()` — without converting first. A
      bare date is read at UTC midnight.
    minProperties: 1
    additionalProperties:
      $ref: "#/$defs/SchemaOrRef"

  SchemaOrRef:
    description: >
      A JSON Schema definition (inline) or a $ref to a shared schema.
      Cross-package references use canonical URIs
      (https://blueprint.codeforamerica.org/schemas/...).
      Any object is structurally valid here — $ref resolution and schema
      correctness are checked by the validate pipeline.

      A $ref is followed when the graph is compiled, down to the individual
      field paths a fact can depend on, including through array items. A ref
      that cannot be resolved leaves the input as an opaque object, and a
      schema that refers to itself stops at the point of recursion.
    type: object

