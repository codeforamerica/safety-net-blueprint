# JSON Schema for compiled rule graph files ({domain}-graph.yaml).
# This is the universal intermediate format produced by the resolve pipeline
# from *-rules.yaml source files. It is consumed by the evaluator, the mock
# server, the explorer visualizer, and any downstream translators (e.g., to
# Fact Graph XML, DMN, or other rules formats).
#
# Example:
#
#   $schema: "https://blueprint.codeforamerica.org/schemas/graph-schema.yaml"
#   domain: intake
#   ruleset: workRequirements
#   outputs:
#     - eligible
#   nodes:
#     $.person.age:
#       type: integer
#       description: Applicant age in years
#     $.person.income:
#       type: number
#       description: Monthly gross income
#     ageVerified:
#       expression: "person.age >= 18"
#       type: boolean
#     eligible:
#       expression: "ageVerified && person.income < 150"
#       type: boolean
#   dependencies:
#     ageVerified:
#       - $.person.age
#     eligible:
#       - ageVerified
#       - $.person.income

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://blueprint.codeforamerica.org/schemas/graph-schema.yaml"
title: Rule Graph
description: >
  Universal intermediate representation of a compiled rule graph.
  Produced by the resolve pipeline from *-rules.yaml source files.
  Consumed by the evaluator, mock server, explorer, and downstream
  translators.

  Two kinds of nodes:
  - Input nodes: path prefixed with '$.' followed by JSONPath notation
    (e.g. '$.person.age', '$.household.members[].income'). Values the
    caller supplies; no expression. Identified by the '$.' prefix.
  - Derived nodes: no prefix (e.g. 'eligible'). Computed from other
    nodes via a CEL expression.

  The 'outputs' list declares which derived nodes are returned to the
  caller. All other derived nodes are internal to the graph.

  The 'dependencies' map keys are derived fact names (the 'to' side);
  the list items are the node paths they depend on (the 'from' side).

type: object
required:
  - $schema
  - domain
  - ruleset
  - nodes
  - dependencies
additionalProperties: false

properties:
  $schema:
    type: string
    description: Must reference the graph schema URI.

  domain:
    type: string
    description: Domain namespace this graph belongs to (e.g., intake, eligibility).

  ruleset:
    type: string
    description: Name of the ruleset this graph was compiled from.

  outputs:
    type: array
    description: >
      Derived node paths returned to the caller. Nodes not listed here
      are internal to the graph and not included in the evaluation response.
    items:
      type: string
    minItems: 1
    uniqueItems: true

  functions:
    type: array
    description: >
      Non-baseline CEL functions used in expressions (e.g. 'yearsBetween').
      A translator consuming this graph must be able to implement or map
      each listed function to produce valid output for its target format.
    items:
      type: string
    uniqueItems: true

  nodes:
    type: object
    description: >
      Map of node path to node definition. Input nodes are identified by
      the '$.' prefix followed by JSONPath notation
      (e.g. '$.person.age', '$.household.members[].income');
      derived nodes have no prefix (e.g. 'eligible').
    minProperties: 1
    additionalProperties:
      $ref: "#/$defs/Node"
    propertyNames:
      pattern: "^(\\$\\.[a-zA-Z][a-zA-Z0-9]*(\\.[a-zA-Z][a-zA-Z0-9]*(\\[\\])?)*|[a-zA-Z][a-zA-Z0-9]*)$"

  dependencies:
    type: object
    description: >
      Dependency map for derived nodes. Each key is a derived node name
      (the 'to' side); the list items are the node paths it depends on
      (the 'from' side). Input nodes ($.prefix) never appear as keys —
      they have no dependencies of their own. Dependency list items may
      reference either input nodes ($.JSONPath notation) or other
      derived nodes (plain name).
    additionalProperties:
      type: array
      items:
        type: string
        pattern: "^(\\$\\.[a-zA-Z][a-zA-Z0-9]*(\\.[a-zA-Z][a-zA-Z0-9]*(\\[\\])?)*|[a-zA-Z][a-zA-Z0-9]*)$"
      minItems: 1

$defs:

  Node:
    type: object
    description: >
      A single node in the dependency graph. Input nodes ($.prefix) have
      no expression. Derived nodes have an expression and appear as keys
      in the dependencies map.
    additionalProperties: false
    properties:
      expression:
        type: string
        description: >
          CEL expression that computes this node's value. Present on
          derived nodes; absent on input nodes.
        minLength: 1
      description:
        type: string
        description: >
          Human-readable description of what this node represents.
      type:
        type: string
        enum: [string, number, integer, boolean, object, array]
        description: >
          JSON Schema primitive type for this node's value. Used for
          documentation, type checking, and translator output mapping.
      format:
        type: string
        description: >
          JSON Schema format hint (e.g. 'date', 'date-time'). Used with
          type: string for date/time values.
      enum:
        type: array
        description: Enumeration of allowed string values for this node.
        items:
          type: string
        minItems: 1
      enumDescriptions:
        type: array
        description: >
          Human-readable labels for each enum value, parallel to the enum
          array.
        items:
          type: string
      default:
        description: >
          Default value for input nodes. Used for policy parameters that
          have a well-known value but can be overridden.
