# JSON Schema for routing files: where each domain, API, socket and operation
# is answered in one deployment. Configuration, not a contract: a contract says
# what an API is; routing says where it's answered. The blueprint's runtime
# reads it (the mock server, the explorer, an app running the mock in its
# page), and validateRouting checks a file against this schema and against the
# contracts. A state's own services route with their own infrastructure,
# following the same rules (docs/conventions/patterns/routing.yaml).
#
# routing-schema.json beside this file is generated from it, for the browser,
# where a YAML file can't be read; a test fails when the two disagree.

$schema: https://json-schema.org/draft/2020-12/schema
$id: https://blueprint.codeforamerica.org/schemas/routing-schema.yaml
title: Routing
description: 'Where each domain, API, socket and operation is answered in one deployment, when something
  other than the blueprint''s own runtime answers it: a service at a URL, or code. Per-environment configuration,
  read when the runtime starts; never part of a contract set. See docs/conventions/patterns/routing.yaml.'
type: object
required:
- routing
additionalProperties: false
properties:
  routing:
    type: array
    items:
      $ref: '#/$defs/Route'
$defs:
  Route:
    description: 'One domain, API or operation, and who answers it: exactly one of domain, api and operation,
      and exactly one of to and handler. With match, only the requests it matches: one of several implementations
      of the same API or operation, such as one session adapter per transcription service.'
    type: object
    oneOf:
    - required:
      - domain
    - required:
      - api
    - required:
      - operation
    anyOf:
    - required:
      - to
    - required:
      - handler
    additionalProperties: false
    properties:
      domain:
        description: A domain the contracts declare, by the name of its directory, or * for every domain.
          Every route its APIs declare, and every event their state machines receive, is routed. With
          *, so is a request for a route the mock doesn't have, and any entry naming a domain, API or
          operation overrides it.
        type: string
        pattern: ^([a-z0-9-]+|\*)$
        examples:
        - intake
        - document-management
        - '*'
      api:
        description: 'An API the contracts declare, by name: its OpenAPI file''s name without -openapi.yaml,
          which its events AsyncAPI shares. Every route it declares, and every event its state machines
          receive, is routed. Overrides a domain entry for that API. Or a socket: an AsyncAPI document
          reached over its own connection, which the mock serves at its localhost server, by its file
          name without -asyncapi.yaml. Only an entry naming a socket routes it; it takes no except or
          includeHeaders, and no operation entry names one of its operations, since its messages all travel
          on one connection.'
        type: string
        pattern: ^[a-z0-9-]+$
        examples:
        - intake
        - communication-transcripts
        - communication-transcripts-relay
      operation:
        description: 'One operation, by id: an OpenAPI operationId, or an AsyncAPI receive operation''s.
          Bare when one API declares it, $apis.<api>.<id> when more than one does. Overrides a domain
          or API entry for that operation.'
        type: string
        minLength: 1
        examples:
        - createApplication
        - $apis.workflow.receiveIntakeApplicationSubmitted
      match:
        description: 'Only the requests whose JSON body has these values: dot paths into the body, each
          with the value it must equal, as a stub''s match is written. Several entries for the same API
          or operation, each with its own match, are implementations chosen per request, such as one per
          transcription service, by startStream''s provider. A later request with none of the fields,
          such as stopStream''s, goes to the entry that answered the earlier request naming the same resource:
          by a path parameter with the name and value of a field of that request. Only on an api or operation
          entry.'
        type: object
        minProperties: 1
        additionalProperties:
          type:
          - string
          - number
          - boolean
        examples:
        - provider: whisper
      except:
        description: 'What stays in the mock, inside this entry: on a domain, an API in it or an operation;
          on *, any API or operation; on an API, an operation in it. Not on an operation entry.'
        type: array
        minItems: 1
        items:
          oneOf:
          - type: object
            required:
            - api
            additionalProperties: false
            properties:
              api:
                type: string
                pattern: ^[a-z0-9-]+$
          - type: object
            required:
            - operation
            additionalProperties: false
            properties:
              operation:
                type: string
                minLength: 1
      to:
        description: 'Absolute base URL of the service that answers. For a request, its path is a prefix:
          the request''s own path is appended to it. A received event is POSTed to it as written, in the
          CloudEvents HTTP binding''s structured mode. A socket''s connections are opened to it as written,
          passing on the subprotocols the client offered; it may be ws or wss, and http or https is taken
          as ws or wss, as the WebSocket constructor takes it. Only a socket is routed to a ws or wss
          URL. May not carry a username or password: this file is configuration, and a credential belongs
          to the target, or to a header the caller sends and includeHeaders names.'
        type: string
        pattern: ^(https?|wss?)://[^/@?#]+([/?#].*)?$
      handler:
        description: 'Code that answers instead. In a file, a JavaScript module, by path relative to the
          file, that exports a handler for each operation it answers, by operationId; it needn''t answer
          every operation the entry covers, and one it doesn''t answer is answered as if the entry weren''t
          there. In code, a function, with fetch''s signature, that answers every operation the entry
          covers, or such a module itself. A handler gets a second argument, { params, publish, call }:
          the request''s path parameters; publish(event, data, { subject }), to send an event the contracts
          declare; and call(operationId, { params, query, body }), to make another call, through routing.
          A received event reaches a handler as the request to would have been sent, and what it answers
          is checked against the operation''s response schema. For a socket, a class used as new WebSocket(url,
          protocols), in code only.'
        if:
          type: string
        then:
          pattern: \.(m?js)$
        examples:
        - ./adapters/whisper.js
      includeHeaders:
        description: 'Headers to pass along beyond the default set, in either direction. Anything not
          named here or in the default set is dropped, credentials included. Not on a socket: a browser''s
          WebSocket sends no headers of its own, and its subprotocols, a token among them, are passed
          on as offered.'
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: ^[A-Za-z0-9!#$%&'*+.^_`|~-]+$
      timeoutMs:
        description: How long to wait for the service before answering 504, or, for a socket, for its
          connection to open before closing the client's with 1014. Defaults to 10000.
        type: integer
        minimum: 1
    allOf:
    - if:
        required:
        - match
      then:
        anyOf:
        - required:
          - api
        - required:
          - operation
