# JSON Schema for Domain Composition YAML files ({domain}-compositions.yaml).
# Validates structural correctness. Cross-artifact semantic checks
# (e.g., bind fields matching resource schemas) are performed by the resolve pipeline.
#
# Example usage:
#
#   version: "1.0"
#   domain: intake
#   compositions:
#     applicationReview:
#       compositeType: sectionView
#       resource: Application
#       sections:
#         identity:
#           resource: ApplicationMember
#           bind: applicationId
#           index:
#             fields: [name, dateOfBirth]
#         household: { resource: ApplicationHousehold, bind: applicationId }
#       panel:
#         include:
#           verifications:
#             resource: Verification
#             bind: applicationId
#             filter: "category == $section.name"
#       endpoint:
#         path: /applications/{applicationId}/review
#       state:
#         schema:
#           name: ReviewProgress
#           type: object
#           properties:
#             status: { type: string, enum: [not_started, in_progress, complete, flagged], default: not_started }
#         methods: [put, patch]

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://blueprint.codeforamerica.org/schemas/compositions-schema.yaml"
title: Domain Compositions
description: >
  Schema for domain composition YAML files ({domain}-compositions.yaml).
  Defines declarative resource compositions — composite views assembled
  from multiple source resources at request time.

type: object
required:
  - version
additionalProperties: false

properties:
  $schema:
    type: string

  version:
    type: string
    description: Schema version for change tracking.

  domain:
    type: string
    description: Domain namespace (e.g., intake, eligibility).

  capability:
    type: string
    description: >
      The framework capability this document belongs to. Only the framework's
      own files declare one; a contract set includes them by listing the
      capability in x-capabilities.

  compositions:
    type: object
    description: >
      Named composition declarations. Each key is the composition name;
      the value declares the root resource and how to assemble it.
    minProperties: 1
    additionalProperties:
      $ref: "#/$defs/Composition"

$defs:

  Composition:
    # Three types, chosen by compositeType; each lists exactly what it allows.
    description: >
      A named composition declaration. compositeType chooses its schema:
      view (the default), sectionView or editable.
    if:
      required: [compositeType]
      properties: { compositeType: { const: sectionView } }
    then:
      $ref: "#/$defs/CompositionSectionView"
    else:
      if:
        required: [compositeType]
        properties: { compositeType: { const: editable } }
      then:
        $ref: "#/$defs/CompositionEditable"
      else:
        $ref: "#/$defs/CompositionView"

  CompositionBase:
    type: object
    description: What every type of composition has.
    required:
      - resource
      - endpoint
    properties:
      compositeType:
        type: string
        enum: [view, sectionView, editable]
        default: view
        description: Which type of composition this is. Each type's schema says what it is and allows.
      resource:
        $ref: "#/$defs/ResourceName"
      bind:
        $ref: "#/$defs/Bind"
      links:
        type: boolean
        description: >
          Generate _links.self on each item. Mutually exclusive with flatten. Default false.
        default: false
      missing:
        type: string
        enum: [empty]
        description: >
          Singleton resources only. Default is null when not found;
          'empty' returns {} instead.
      fields:
        $ref: "#/$defs/Fields"
      endpoint:
        description: >
          Where the composition is served. Every composition is reachable at the
          path it declares; the path names which record the view is for.
        $ref: "#/$defs/Endpoint"

  CompositionViewBase:
    description: >
      What every view shares, a view and a sectionView alike: records put
      together to read. Its endpoint answers get; change the records at their
      own endpoints, which links can point to.
    allOf:
      - $ref: "#/$defs/CompositionBase"
      - $ref: "#/$defs/ResponseShaping"
    properties:
      include:
        $ref: "#/$defs/IncludeMap"

  CompositionView:
    # Example:
    #   members:
    #     resource: ApplicationMember
    #     bind: applicationId
    #     filter: "status == 'active'"
    #     fields: [firstName, lastName]
    #     links: true
    #     endpoint:
    #       path: /applications/{applicationId}/members-summary
    description: >
      compositeType view, the default: a view served at one endpoint.
    allOf:
      - $ref: "#/$defs/CompositionViewBase"
    properties:
      compositeType:
        const: view
    unevaluatedProperties: false

  CompositionSectionView:
    # Example:
    #   reviewContext:
    #     compositeType: sectionView
    #     resource: Application
    #     sections:
    #       identity: { resource: ApplicationMember, bind: applicationId }
    #     endpoint:
    #       path: /applications/{applicationId}/review
    description: >
      compositeType sectionView: a view a worker steps through by section. Its
      endpoint answers get with a section index, each section is served at its
      own panel path, and review progress is kept in state.
    allOf:
      - $ref: "#/$defs/CompositionViewBase"
    required: [compositeType]
    properties:
      compositeType:
        const: sectionView
      sections:
        type: object
        description: >
          Named sections, each backed by a different resource type.
          Each section is individually addressable at the derived panel path.
        additionalProperties:
          $ref: "#/$defs/Section"
      panel:
        type: object
        description: >
          Nodes added to every panel response in addition to the matching
          section's resource.
        additionalProperties: false
        properties:
          include:
            $ref: "#/$defs/IncludeMap"
      state:
        $ref: "#/$defs/StateResource"
    unevaluatedProperties: false

  CompositionEditable:
    # Example:
    #   applicationDetails:
    #     compositeType: editable
    #     resource: Application
    #     include:
    #       members: { resource: ApplicationMember, bind: applicationId }
    #       incomes: { resource: Income, bind: applicationId }
    #     endpoint:
    #       path: /applications/{applicationId}/details
    description: >
      compositeType editable: a composition a caller can change as well as
      read, with a JSON Patch (RFC 6902, application/json-patch+json) sent as
      its generated update operation. It's the records a change touches
      together, what domain-driven design calls an aggregate. Each include is
      keyed by record id, so a path like /incomes/{incomeId}/amount names one
      record, and must keep id in its fields; there's no filter, flatten,
      sections or panel, since a patch has to see every record and know whose
      field it names. A patch applies all or nothing: each change is made
      through its record's own operation, as the caller, with that operation's
      permissions, guards and events, and if any change is refused, nothing is
      saved and no events are sent. A change may add a record under an id the
      caller chooses, and another change in the same patch may name it.
      Changes to fields the server sets, to fields a state machine owns, and to
      derived fields are refused with 422; a renamed field is written under its
      original name. The update operation requires an Idempotency-Key, answers
      200 with the document after the patch, 409 when a test fails or a
      record's state refuses its change, and 415 for another media type.
    allOf:
      - $ref: "#/$defs/CompositionBase"
    required: [compositeType]
    properties:
      compositeType:
        const: editable
      include:
        $ref: "#/$defs/IncludeMapEditable"
    unevaluatedProperties: false

  ResponseShaping:
    description: >
      How a view or sectionView, or one of its includes, shapes its response.
      An editable composition has neither: a patch has to see every record and
      know whose field it names.
    properties:
      filter:
        $ref: "#/$defs/Filter"
      flatten:
        type: boolean
        description: >
          Remove the composition key and promote the node's fields to the parent level.
          Mutually exclusive with links. Default false.
        default: false

  ResourceName:
    type: string
    pattern: '^[A-Z][A-Za-z0-9]*$'
    description: >
      A resource, named by the schema its endpoints return, as x-relationship
      and a state machine's object name one: ApplicationMember, not the path's
      members.

  Filter:
    type: string
    description: >
      CEL expression evaluated per record at read time; only records it's true
      for are returned. Read-only: it doesn't limit what can be written.

  IncludeMap:
    type: object
    description: >
      Map of named includes in a view or sectionView. Each key is the include
      name; the value is an include.
    additionalProperties:
      $ref: "#/$defs/Include"

  IncludeMapEditable:
    type: object
    description: Map of named includes in an editable composition.
    additionalProperties:
      $ref: "#/$defs/IncludeEditable"

  IncludeBase:
    type: object
    description: >
      A related resource pulled into a composition, found by its binding
      field; one entry under include. It answers with a list of the records it
      finds, or, in an editable composition, an object of them keyed by id. An
      include of a singleton resource (one per parent, at a path with no id of
      its own) answers with that one record as an object, or null when there
      isn't one.
    required:
      - resource
    properties:
      resource:
        $ref: "#/$defs/ResourceName"
      bind:
        $ref: "#/$defs/Bind"
      links:
        type: boolean
        default: false
      missing:
        type: string
        enum: [empty]
        description: >
          Singleton resources only. Default is null when not found;
          'empty' returns {} instead.
      fields:
        $ref: "#/$defs/Fields"

  Include:
    # Example — with bind and field selection:
    #   income:
    #     resource: Income
    #     bind: memberId
    #     fields: [amount, type]
    description: An include in a view or sectionView.
    allOf:
      - $ref: "#/$defs/IncludeBase"
      - $ref: "#/$defs/ResponseShaping"
    properties:
      include:
        $ref: "#/$defs/IncludeMap"
    unevaluatedProperties: false

  IncludeEditable:
    description: >
      An include in an editable composition: no filter or flatten, and id kept
      in its fields, so every record is there and a patch can name it.
    allOf:
      - $ref: "#/$defs/IncludeBase"
    properties:
      fields:
        contains:
          enum: [id, "*"]
      include:
        $ref: "#/$defs/IncludeMapEditable"
    unevaluatedProperties: false

  Section:
    # Example — section with index config:
    #   income:
    #     resource: Income
    #     bind: applicationId
    #     index:
    #       fields: [id, memberId, type, amount]
    #
    # Example — section with index filter:
    #   demographics:
    #     resource: ApplicationMember
    #     bind: applicationId
    #     index:
    #       filter: "roles.contains('primary_applicant')"
    #       fields: [id, firstName, lastName]
    #
    # Example — link-only section (no index config):
    #   household: { resource: ApplicationHousehold, bind: applicationId }
    type: object
    description: A section in a sectionView composition.
    required:
      - resource
    additionalProperties: false
    properties:
      resource:
        $ref: "#/$defs/ResourceName"
      bind:
        $ref: "#/$defs/Bind"
      fields:
        $ref: "#/$defs/Fields"
      index:
        type: object
        description: >
          Section index configuration — filter and fields for this section's entry in
          the section index response. Omit to make this a link-only section.
        additionalProperties: false
        properties:
          filter:
            $ref: "#/$defs/Filter"
            description: Applied when assembling this section's index entry.
          fields:
            $ref: "#/$defs/Fields"
      missing:
        type: string
        enum: [empty]
      filter:
        $ref: "#/$defs/Filter"
      include:
        $ref: "#/$defs/IncludeMap"
      sortable:
        type: object
        description: >
          Sorting configuration for this section's panel endpoint.
          Declared fields become the allowlist for the ?sort= parameter.
          Same semantics as x-sortable on OpenAPI list endpoints:
          tieBreaker defaults to 'id'; set to null to disable.
          Fields must match [A-Za-z_][A-Za-z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*)*.
        additionalProperties: false
        required:
          - fields
        properties:
          fields:
            type: array
            items:
              type: string
              pattern: '^[A-Za-z_][A-Za-z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*)*$'
            minItems: 1
          default:
            type: string
          tieBreaker:
            type: [string, 'null']
            pattern: '^[A-Za-z_][A-Za-z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*)*$'
          maxFields:
            type: integer
            minimum: 1
      links:
        type: boolean
        description: >
          Generate _links.self on each item using the URL from the resource's
          spec-declared endpoint. Mutually exclusive with flatten. Default false.
        default: false
      state:
        $ref: "#/$defs/StateResource"

  Endpoint:
    # Example:
    #   endpoint:
    #     path: /applications/{applicationId}/review
    #     methods: [get]
    #     parentLink: true
    type: object
    description: Consumer-facing endpoint declaration for this composition.
    required:
      - path
    additionalProperties: false
    properties:
      path:
        type: string
        format: uri-template
        # At least one segment, no trailing slash: "/" would be the API's root,
        # and "/x/" differs from "/x" only by its slash.
        pattern: "^(/[^/]+)+$"
        description: >
          URL path for the composition endpoint, within the server of the API
          document that declares its resource, e.g. /applications/{applicationId}/review.
      methods:
        type: array
        description: >
          The methods the endpoint serves. Every composition serves get; an
          editable one also serves patch, by its compositeType.
        items:
          type: string
          enum: [get]
        default: [get]
      parentLink:
        type: boolean
        description: >
          Inject _links.{compositionKey} into the parent resource's GET by ID response.
          Default false.
        default: false

  StateResource:
    # Example:
    #   state:
    #     schema:
    #       name: ReviewProgress
    #       type: object
    #       additionalProperties: false
    #       properties:
    #         status:
    #           type: string
    #           enum: [not_started, in_progress, complete, flagged]
    #           default: not_started
    #     methods: [put, patch]
    #     flatten: true
    type: object
    description: >
      Composition-owned state resource. The framework creates, persists, and exposes
      this as a first-class resource with generated GET/PUT/PATCH endpoints.
      Schema defines the client-writable fields inline; the resolve pipeline generates
      the writable and read-only OpenAPI schemas from this definition.
    required:
      - schema
    additionalProperties: false
    properties:
      schema:
        type: object
        description: >
          Inline schema for the client-writable fields of the state resource.
          Must include a `name` field (PascalCase) used to derive the generated
          OpenAPI schema names (e.g. name: ReviewProgress → ReviewProgressWritable,
          ReviewProgress, ReviewProgressListResponse).
        required:
          - name
        properties:
          name:
            type: string
            pattern: '^[A-Z][A-Za-z0-9]*$'
            description: PascalCase name used to derive the generated OpenAPI schema names.
          type:
            type: string
            enum: [object]
          additionalProperties:
            type: boolean
          properties:
            type: object
            additionalProperties: true
          required:
            type: array
            items:
              type: string
      methods:
        type: array
        items:
          type: string
          enum: [put, patch]
        default: [put, patch]
      flatten:
        type: boolean
        description: Promote state fields to the parent level in GET responses. Default false.
        default: false

  Bind:
    # Example — single field:  bind: applicationId
    # Example — compound:      bind: [memberId, programId]
    description: >
      Field name(s) on the child resource matching the parent's identifier.
      Single string for simple joins; array for compound joins.
    oneOf:
      - type: string
        description: Single bind field name (e.g., applicationId).
      - type: array
        items:
          type: string
        minItems: 2
        description: Compound bind — list of field names for multi-key joins.

  Fields:
    # Example — subset:  fields: [firstName, lastName]
    # Example — alias:   fields: [applicationId as clientApplicationId]
    # Example — all:     fields: [*]
    description: >
      Field selection list. Plain names ('firstName'), aliased names
      ('applicationId as clientApplicationId'), or ['*'] for all fields.
    type: array
    items:
      type: string
    minItems: 1

