# JSON Schema for domain annotation YAML files.
# Validates structural correctness. The leaf level (individual annotation objects)
# is intentionally open — states add custom annotation types via additionalProperties.
#
# Section definitions follow the naming convention {SectionName}AnnotationMap in $defs,
# where {SectionName} matches the pluralized section key (e.g., OperationsAnnotationMap → operations).
# This allows tooling to derive the list of valid sections from $defs without hardcoding them.

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://blueprint.codeforamerica.org/schemas/annotations-schema.yaml"
title: Domain Annotations
description: >
  Schema for domain annotation files ({domain}-annotations.yaml).
  Annotation files attach machine-readable metadata to specific elements in
  contract artifacts. Sections correspond to contract artifact types:

    schema     — data model fields, keyed by JSON path notation
                 (e.g., application.members[].personalInformation.ssn)
    operations — State machine actions, keyed by {objectName}.{actionId}
                 (e.g., application.submit, verification.satisfy)
    events     — AsyncAPI event channels, keyed by event type
                 (e.g., intake.application.submitted)
    facts      — Ruleset facts, keyed by {ruleset}.{factName}
                 (e.g., snapInterviewProbes.incomeInconsistency)

  Annotations reference policies by ID from the policy registry. They never
  embed citation text directly.

type: object
required:
  - version
  - domain
additionalProperties: false

properties:
  $schema:
    type: string

  version:
    type: string
    description: Schema version for change tracking.

  domain:
    $ref: "https://blueprint.codeforamerica.org/base/schemas/enums.yaml#/$defs/Domain"

  schema:
    description: >
      Annotations for data model fields, keyed by JSON path notation.
      Annotate at any granularity — a collection (e.g., application.incomes[]),
      a specific field (e.g., application.members[].citizenship.citizenshipStatus),
      or a sub-object (e.g., application.members[].citizenship).
    $ref: "#/$defs/SchemaAnnotationMap"

  operations:
    description: >
      Annotations for state machine actions and OpenAPI path operations.
      A state machine action and its generated path operation share a key because
      they represent the same behavioral event. Keys are qualified by the state
      machine object name using dot notation (e.g., application.submit,
      verification.satisfy).
    $ref: "#/$defs/OperationsAnnotationMap"

  events:
    description: >
      Annotations for AsyncAPI event channels.
      Keys are the event type identifier (e.g., intake.application.submitted).
    $ref: "#/$defs/EventsAnnotationMap"

  facts:
    description: >
      Annotations for ruleset facts, keyed by {ruleset}.{factName}.
      The ruleset name matches the ruleset field in the compiled graph file.
      (e.g., snapInterviewProbes.incomeInconsistency)
    $ref: "#/$defs/FactsAnnotationMap"

$defs:
  SchemaAnnotationMap:
    type: object
    description: >
      Map of JSON path keys to annotation objects.
      Keys use dot-and-bracket notation: segments are camelCase identifiers,
      array segments are suffixed with [] (e.g., application.members[].citizenship.citizenshipStatus).
    minProperties: 1
    propertyNames:
      pattern: "^[a-z][a-zA-Z0-9]*(\\.[a-zA-Z][a-zA-Z0-9]*(\\[\\])?)*$"
    additionalProperties:
      $ref: "#/$defs/Annotation"

  OperationsAnnotationMap:
    type: object
    description: >
      Map of qualified action IDs to annotation objects.
      Keys must be qualified by the state machine object name:
      {objectName}.{actionId} (e.g., application.submit, verification.satisfy).
    minProperties: 1
    propertyNames:
      pattern: "^[a-z][a-zA-Z0-9]*\\.[a-z][a-zA-Z0-9-]*$"
    additionalProperties:
      $ref: "#/$defs/Annotation"

  EventsAnnotationMap:
    type: object
    description: >
      Map of AsyncAPI channel addresses to annotation objects.
      Keys are dot-separated event type identifiers with at least two segments
      (e.g., intake.application.submitted).
    minProperties: 1
    propertyNames:
      pattern: "^[a-z][a-zA-Z0-9_]*(\\.[a-z][a-zA-Z0-9_]*){1,}$"
    additionalProperties:
      $ref: "#/$defs/Annotation"

  FactsAnnotationMap:
    type: object
    description: >
      Map of ruleset fact keys to annotation objects.
      Keys are dot-separated: {ruleset}.{factName}, where ruleset matches
      the ruleset field in the compiled graph file.
      (e.g., snapInterviewProbes.incomeInconsistency)
    minProperties: 1
    propertyNames:
      pattern: "^[a-z][a-zA-Z0-9]*\\.[a-z][a-zA-Z0-9]*$"
    additionalProperties:
      $ref: "#/$defs/Annotation"

  Annotation:
    type: object
    description: >
      Metadata for a specific contract element. The baseline defines policies
      and dataClassification; all other properties are open so adopters can
      attach domain-specific annotation types without schema changes.
    additionalProperties: true
    properties:
      policies:
        type: array
        description: >
          Policy IDs from the registry that apply to this element.
          Referenced policies must exist in a platform-registry-policies*.yaml file.
        items:
          type: string
        minItems: 1
      dataClassification:
        type: array
        description: >
          Data sensitivity classifications. Baseline vocabulary: pii, fti, phi,
          phi-behavioral, cjis. States may add values via overlay.
        items:
          type: string
          enum: [pii, fti, phi, phi-behavioral, cjis]
        minItems: 1
