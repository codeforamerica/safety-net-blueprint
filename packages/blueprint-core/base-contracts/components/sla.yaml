# Shared SLA schemas used by any domain with SLA tracking, defined in
# schemas/sla.yaml so OpenAPI and JSON Schema contracts share them.
#
# Schemas: SlaInfo, SlaInfoCreate, SlaDeadline
SlaInfo:
  $ref: "https://blueprint.codeforamerica.org/base/schemas/sla.yaml#/$defs/SlaInfo"
SlaInfoCreate:
  $ref: "https://blueprint.codeforamerica.org/base/schemas/sla.yaml#/$defs/SlaInfoCreate"
SlaDeadline:
  $ref: "https://blueprint.codeforamerica.org/base/schemas/sla.yaml#/$defs/SlaDeadline"
