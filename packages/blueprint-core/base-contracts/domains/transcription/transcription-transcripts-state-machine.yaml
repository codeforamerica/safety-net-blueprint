# The lifecycle of a transcript. A transcript starts in `recording` when it is
# created; pausing takes the conversation off the record, resuming puts it back,
# and closing ends it. See docs/architecture/cross-cutting/transcripts.md.
$schema: state-machine-schema.yaml
version: "1.0"
domain: transcription
eventsSpec: transcription-transcripts-asyncapi.yaml
machines:
  - object: Transcript
    states:
      - id: recording
        slaClock: stopped
        description: The conversation is on the record; lines are accepted.
      - id: paused
        slaClock: stopped
        description: The conversation is off the record — an applicant asked, say. Nothing said now is stored.
      - id: closed
        slaClock: stopped
        description: The transcript has ended. Terminal.
    initialState: recording
    actions:
      - id: pause
        description: Take the conversation off the record.
        transition:
          from: recording
          to: paused
        steps:
          - emit:
              type: transcription.transcript.paused
      - id: resume
        description: Put the conversation back on the record.
        transition:
          from: paused
          to: recording
        steps:
          - emit:
              type: transcription.transcript.resumed
      - id: close
        description: End the transcript.
        transition:
          from: [recording, paused]
          to: closed
        steps:
          - set:
              field: closedAt
              value: $now
          - emit:
              type: transcription.transcript.closed
