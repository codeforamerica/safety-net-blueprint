# The events a transcript's lifecycle emits, beside
# transcription-transcripts-state-machine.yaml, which emits them. Starting one emits
# `transcription.transcript.created`, declared with the API.
asyncapi: 3.0.0
info:
  x-domain: transcription
  title: Transcript events
  version: 0.1.0
  x-status: alpha
  description: Events a transcript emits as it is paused, resumed and closed.
channels:
  transcription.transcript.paused:
    address: transcription.transcript.paused
    messages:
      TranscriptPaused:
        $ref: '#/components/messages/TranscriptPausedMessage'
  transcription.transcript.resumed:
    address: transcription.transcript.resumed
    messages:
      TranscriptResumed:
        $ref: '#/components/messages/TranscriptResumedMessage'
  transcription.transcript.closed:
    address: transcription.transcript.closed
    messages:
      TranscriptClosed:
        $ref: '#/components/messages/TranscriptClosedMessage'
components:
  messages:
    TranscriptPausedMessage:
      name: transcription.transcript.paused
      summary: The conversation went off the record. Anything said until it resumes is not stored.
      payload:
        $ref: '#/components/schemas/TranscriptPausedEvent'
    TranscriptResumedMessage:
      name: transcription.transcript.resumed
      summary: The conversation is back on the record.
      payload:
        $ref: '#/components/schemas/TranscriptResumedEvent'
    TranscriptClosedMessage:
      name: transcription.transcript.closed
      summary: The transcript has ended.
      payload:
        $ref: '#/components/schemas/TranscriptClosedEvent'
  schemas:
    TranscriptPausedEvent:
      allOf:
        - $ref: https://blueprint.codeforamerica.org/base/schemas/events.yaml#/$defs/Event
        - type: object
          properties:
            type:
              type: string
              const: transcription.transcript.paused
    TranscriptResumedEvent:
      allOf:
        - $ref: https://blueprint.codeforamerica.org/base/schemas/events.yaml#/$defs/Event
        - type: object
          properties:
            type:
              type: string
              const: transcription.transcript.resumed
    TranscriptClosedEvent:
      allOf:
        - $ref: https://blueprint.codeforamerica.org/base/schemas/events.yaml#/$defs/Event
        - type: object
          properties:
            type:
              type: string
              const: transcription.transcript.closed
