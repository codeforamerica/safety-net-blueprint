# A transcript: the written record of one conversation — who said what, and
# when. A transcription client writes to it; the audio goes from the client to
# its provider and never through the blueprint. Its lifecycle — recording,
# paused, closed — is transcription-transcripts-state-machine.yaml beside this file.
#
# A transcript's timeline is its entries: lines said or typed, gaps where
# nothing was captured, and pauses when the conversation was off the record.
# The state machine decides when an entry is accepted.
#
# A transcript is started under a profile: the transcription service and
# languages a state chose for a kind of conversation. Profiles are seeded from
# the domain's config and can be changed through the API; their update events
# record what a profile said when any transcript started under it.
#
# See docs/architecture/cross-cutting/transcripts.md for the design, including
# the rules a client is held to.
openapi: 3.1.0
info:
  title: Transcripts
  version: 0.1.0
  x-domain: transcription
  x-status: alpha
  x-visibility: internal
  description: |
    The written record of a conversation. Starting a transcript opens it for
    recording; pausing takes the conversation off the record; closing ends it.
    A transcript refers to what it records — an interview, a call — and names
    the profile it was started under, which says the transcription service,
    and the client and model that produced its lines. Updating corrects what
    it records; deleting removes it, and the event left behind says which one
    and by whom.

    A profile is a state's choice of transcription service and languages for
    a kind of conversation. The deployment's config seeds them; they can be
    added and changed here, never deleted, so every transcript's profile
    still exists.

    Its entries are its timeline, in the order things happened: lines, gaps
    where nothing was captured, and pauses. Every time on a transcript and its
    entries is the client's — when it started, paused, resumed and closed, and
    when each line was said — so they are compared on one clock.
servers:
  - url: https://api.example.com/transcription
    description: Production server
  - url: http://localhost:1080/transcription
    description: Local development server
tags:
  - name: Transcripts
    description: The written record of a conversation.
  - name: Transcript entries
    description: A transcript's timeline — lines, gaps and pauses.
  - name: Transcription profiles
    description: The transcription service and languages to use for a kind of conversation.
paths:
  /transcripts:
    get:
      summary: List transcripts
      description: |
        Retrieve a paginated list of transcripts. Filter by `subjectId` to find
        the transcripts of one interview or call.
      operationId: listTranscripts
      tags:
        - Transcripts
      x-sortable:
        fields: [createdAt]
        default: -createdAt
        tieBreaker: id
      parameters:
        - $ref: "https://blueprint.codeforamerica.org/base/components/parameters.yaml#/SearchQueryParam"
        - $ref: "https://blueprint.codeforamerica.org/base/components/parameters.yaml#/LimitParam"
        - $ref: "https://blueprint.codeforamerica.org/base/components/parameters.yaml#/OffsetParam"
        - $ref: "https://blueprint.codeforamerica.org/base/components/parameters.yaml#/SortParam"
      responses:
        "200":
          description: A paginated collection of transcripts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptList"
        "400":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/BadRequest"
        "500":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/InternalError"
    post:
      summary: Start a transcript
      description: |
        Start recording a conversation, under a profile. The transcript begins
        in `recording`. It is refused when the profile does not exist, or when
        the profile names a transcription service and no `model` is given.
      operationId: createTranscript
      tags:
        - Transcripts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscriptCreate"
      responses:
        "201":
          description: Transcript started.
          headers:
            Location:
              description: URL of the new transcript.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transcript"
        "400":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/BadRequest"
        "409":
          description: |
            The transcript is refused: its profile does not exist, or the
            profile names a transcription service and no `model` was given.
          content:
            application/json:
              schema:
                $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/Error"
        "422":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/UnprocessableEntity"
        "500":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/InternalError"
  /transcripts/{transcriptId}:
    parameters:
      - $ref: "#/components/parameters/TranscriptIdParam"
    get:
      summary: Get a transcript
      description: Retrieve a single transcript by identifier.
      operationId: getTranscript
      tags:
        - Transcripts
      responses:
        "200":
          description: Transcript retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transcript"
              examples:
                TranscriptExample1:
                  $ref: "#/components/examples/TranscriptExample1"
        "404":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/NotFound"
        "500":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/InternalError"
    patch:
      summary: Update a transcript
      description: |
        Correct what a transcript records — its subject, model or client. Its
        profile does not change, and its status changes only through `pause`,
        `resume` and `close`.
      operationId: updateTranscript
      tags:
        - Transcripts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscriptUpdate"
      responses:
        "200":
          description: Transcript updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transcript"
        "400":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/BadRequest"
        "404":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/NotFound"
        "422":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/UnprocessableEntity"
        "500":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/InternalError"
    delete:
      summary: Delete a transcript
      description: |
        Permanently remove a transcript. The `transcription.transcript.deleted`
        event records which transcript was removed and who removed it.
      operationId: deleteTranscript
      tags:
        - Transcripts
      responses:
        "204":
          description: Transcript deleted.
        "404":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/NotFound"
        "500":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/InternalError"
  /transcripts/{transcriptId}/entries:
    parameters:
      - $ref: "#/components/parameters/TranscriptIdParam"
    get:
      summary: List a transcript's entries
      description: |
        A transcript's timeline, in the order things happened — by `startedAt`.
        Filter by `kind` for only its lines, gaps or pauses.

        To fetch only entries added since the last read, search on `createdAt`,
        which the server sets when it stores an entry: `q=createdAt:>=<the
        newest createdAt already read>`, skipping ids already read. `startedAt`
        is the client's clock, so a line can arrive after one that started
        later than it; `createdAt` still puts it after the last read.
      operationId: listTranscriptEntries
      tags:
        - Transcript entries
      x-sortable:
        fields: [startedAt, createdAt]
        default: startedAt
        tieBreaker: id
      parameters:
        - $ref: "https://blueprint.codeforamerica.org/base/components/parameters.yaml#/SearchQueryParam"
        - $ref: "https://blueprint.codeforamerica.org/base/components/parameters.yaml#/LimitParam"
        - $ref: "https://blueprint.codeforamerica.org/base/components/parameters.yaml#/OffsetParam"
        - $ref: "https://blueprint.codeforamerica.org/base/components/parameters.yaml#/SortParam"
        - name: kind
          in: query
          description: Only entries of this kind.
          schema:
            $ref: "#/components/schemas/TranscriptEntryKind"
      responses:
        "200":
          description: The transcript's entries, in the order things happened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptEntryList"
        "400":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/BadRequest"
        "404":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/NotFound"
        "500":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/InternalError"
    post:
      summary: Add an entry to a transcript
      description: |
        Add a finished line, or a gap where nothing was captured. Pauses are not
        added here: pausing the transcript adds one.

        Send an `Idempotency-Key` with every add, and the same key when retrying
        one, so a retry is not a second line. The transcript refuses an entry
        that started while it was paused or after it closed, an entry that ends
        before it starts, and a gap that overlaps a pause.
      operationId: addTranscriptEntry
      tags:
        - Transcript entries
      parameters:
        - $ref: "https://blueprint.codeforamerica.org/base/components/parameters.yaml#/IdempotencyKeyParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscriptEntryCreate"
      responses:
        "201":
          description: Entry added.
          headers:
            Location:
              description: URL of the new entry.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptEntry"
        "400":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/BadRequest"
        "403":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/Forbidden"
        "404":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/NotFound"
        "409":
          description: |
            The transcript refuses the entry: it started while the transcript
            was paused or after it closed, it ends before it starts, or it is a
            gap overlapping a pause.
          content:
            application/json:
              schema:
                $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/Error"
        "422":
          description: |
            The entry is not valid, or its `Idempotency-Key` was already used
            for a different request.
          content:
            application/json:
              schema:
                $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/Error"
        "500":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/InternalError"
  /transcripts/{transcriptId}/entries/{entryId}:
    parameters:
      - $ref: "#/components/parameters/TranscriptIdParam"
      - $ref: "#/components/parameters/TranscriptEntryIdParam"
    get:
      summary: Get a transcript entry
      description: Retrieve a single entry by identifier.
      operationId: getTranscriptEntry
      tags:
        - Transcript entries
      responses:
        "200":
          description: Entry retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptEntry"
        "404":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/NotFound"
        "500":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/InternalError"
    patch:
      summary: End a pause entry
      description: |
        Set when a pause ended. Only the system may — resuming or closing the
        transcript does it. Nothing else about an entry changes once it is
        written, and entries are never deleted.
      operationId: updateTranscriptEntry
      tags:
        - Transcript entries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscriptEntryUpdate"
      responses:
        "200":
          description: Entry updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptEntry"
        "403":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/Forbidden"
        "404":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/NotFound"
        "422":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/UnprocessableEntity"
        "500":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/InternalError"
  /profiles:
    get:
      summary: List transcription profiles
      description: Retrieve a paginated list of profiles, by name.
      operationId: listTranscriptionProfiles
      tags:
        - Transcription profiles
      x-sortable:
        fields: [name, createdAt]
        default: name
        tieBreaker: id
      parameters:
        - $ref: "https://blueprint.codeforamerica.org/base/components/parameters.yaml#/SearchQueryParam"
        - $ref: "https://blueprint.codeforamerica.org/base/components/parameters.yaml#/LimitParam"
        - $ref: "https://blueprint.codeforamerica.org/base/components/parameters.yaml#/OffsetParam"
        - $ref: "https://blueprint.codeforamerica.org/base/components/parameters.yaml#/SortParam"
      responses:
        "200":
          description: A paginated collection of profiles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionProfileList"
        "400":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/BadRequest"
        "500":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/InternalError"
    post:
      summary: Add a transcription profile
      description: |
        Add a profile beside the ones the deployment's config seeds. It is
        marked `source: user`.
      operationId: createTranscriptionProfile
      tags:
        - Transcription profiles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscriptionProfileCreate"
      responses:
        "201":
          description: Profile added.
          headers:
            Location:
              description: URL of the new profile.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionProfile"
        "400":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/BadRequest"
        "422":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/UnprocessableEntity"
        "500":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/InternalError"
  /profiles/{profileId}:
    parameters:
      - $ref: "#/components/parameters/ProfileIdParam"
    get:
      summary: Get a transcription profile
      description: Retrieve a single profile by identifier.
      operationId: getTranscriptionProfile
      tags:
        - Transcription profiles
      responses:
        "200":
          description: Profile retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionProfile"
              examples:
                TranscriptionProfileExample1:
                  $ref: "#/components/examples/TranscriptionProfileExample1"
        "404":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/NotFound"
        "500":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/InternalError"
    patch:
      summary: Change a transcription profile
      description: |
        Change a profile, including one the config seeded. The change applies to
        transcripts started from now on; the update event records each field
        before and after, so what the profile said when an earlier transcript
        started can still be looked up. Profiles are never deleted.
      operationId: updateTranscriptionProfile
      tags:
        - Transcription profiles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscriptionProfileUpdate"
      responses:
        "200":
          description: Profile changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionProfile"
        "400":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/BadRequest"
        "404":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/NotFound"
        "422":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/UnprocessableEntity"
        "500":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/InternalError"
components:
  parameters:
    TranscriptIdParam:
      name: transcriptId
      in: path
      required: true
      description: Unique identifier of the transcript.
      schema:
        type: string
        format: uuid
      example: 4d1f13f0-3e26-4c50-b2fb-8d140f7ec1c2
    TranscriptEntryIdParam:
      name: entryId
      in: path
      required: true
      description: Unique identifier of the entry.
      schema:
        type: string
        format: uuid
      example: 9c2e4a10-7b1d-4f3e-8a62-1d5c0b7e9f24
    ProfileIdParam:
      name: profileId
      in: path
      required: true
      description: Unique identifier of the profile.
      schema:
        type: string
        format: uuid
      example: 7a1e0c2d-0000-4000-8000-0000000000b1
  schemas:
    # Writable base: client-writable fields only. Transcript, TranscriptCreate
    # and TranscriptUpdate extend it via allOf, so a write never carries a
    # server-managed field — status included, which only the transitions move.
    TranscriptWritable:
      type: object
      description: Client-writable fields of a transcript.
      properties:
        subjectType:
          type: string
          description: What kind of thing the transcript records, e.g. `interview` or `call`.
          example: interview
        subjectId:
          type: string
          format: uuid
          description: The record of the conversation it transcribes — an interview's id, say. `subjectType` says what kind.
          x-relationship:
            resource: Polymorphic
        model:
          type: string
          description: |
            The transcription service's identifier for the model that produced
            its lines — e.g. `scribe_v2`. Services change the model behind the
            same name, so this is what tells two transcripts made a month apart
            apart. Where a service does not report a version, the model the
            client requested — e.g. `standard`. Required unless the profile's
            service is `none`.
          example: scribe_v2
        client:
          type: string
          pattern: "^[a-z0-9][a-z0-9.-]*/[0-9A-Za-z.+-]+$"
          description: The software that wrote its lines, as `name/version` — a transcription client, or a chat.
          example: interview-assistant/0.1.0
    Transcript:
      description: A transcript, including server-managed fields.
      unevaluatedProperties: false
      required:
        - id
        - status
        - createdAt
        - updatedAt
      allOf:
        - $ref: "#/components/schemas/TranscriptWritable"
        - type: object
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
              description: Unique identifier (server-generated).
            profileId:
              type: string
              format: uuid
              readOnly: true
              description: The profile it was started under, which says the transcription service. It does not change.
              x-relationship:
                resource: TranscriptionProfile
            status:
              type: string
              readOnly: true
              x-enum-source:
                source: states[].id
                machine: Transcript
              description: |
                `recording` while the conversation is on the record, `paused`
                while it is off it, and `closed` once it has ended.
            startedAt:
              type: string
              format: date-time
              readOnly: true
              description: When the conversation began, by the client's clock — the clock every time on its entries is on.
            closedAt:
              type: string
              format: date-time
              readOnly: true
              description: When the transcript was closed, by the client's clock.
            lastActivityAt:
              type: string
              format: date-time
              readOnly: true
              description: When the last line or gap ended, by the client's clock. A transcript closed for being idle closes at this time.
            createdAt:
              type: string
              format: date-time
              readOnly: true
              description: When the transcript was started.
            updatedAt:
              type: string
              format: date-time
              readOnly: true
              description: When the transcript last changed.
    TranscriptCreate:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/TranscriptWritable"
        - type: object
          description: |
            Payload to start a transcript. What produced it is required — the
            profile, which says the transcription service; the client; and the
            model unless the profile's service is `none` — so every transcript
            says where its lines came from — and when it started, by the
            client's clock. id, status, createdAt and updatedAt are set by the
            server.
          required: [profileId, client, startedAt]
          properties:
            profileId:
              type: string
              format: uuid
              description: The profile to start it under.
              x-relationship:
                resource: TranscriptionProfile
            startedAt:
              type: string
              format: date-time
              description: When the conversation began, by the client's clock.
    TranscriptUpdate:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/TranscriptWritable"
        - type: object
          description: |
            Payload to update one or more fields of a transcript. Partial
            updates are supported; status is not one of them.
          minProperties: 1
    TranscriptList:
      type: object
      additionalProperties: false
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Transcript"
        total:
          type: integer
          minimum: 0
          description: Total number of transcripts available.
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: Maximum number of transcripts requested.
        offset:
          type: integer
          minimum: 0
          description: Number of items skipped before the current page.
        hasNext:
          type: boolean
          description: Whether more transcripts are available beyond this page.

    TranscriptEntryKind:
      type: string
      enum: [line, gap, pause]
      description: |
        `line`: something said or typed. `gap`: a stretch where nothing was
        captured — a dropped connection, a provider failure. `pause`: the
        conversation off the record, by choice.

    Speaker:
      type: string
      enum: [staff, client, unknown]
      description: |
        Who said a line, as a role. A contract set replaces these by overlay —
        safety-net-contracts might say `worker` and `applicant`.

    GapCause:
      type: string
      enum: [connection, provider, client, unknown]
      description: Why nothing was captured, as far as the client knows.

    TranscriptEntry:
      description: An entry in a transcript's timeline, including server-managed fields.
      type: object
      required: [id, transcriptId, kind, startedAt, endedAt, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Unique identifier (server-generated).
        transcriptId:
          type: string
          format: uuid
          readOnly: true
          description: The transcript it belongs to.
          x-relationship:
            resource: Transcript
        kind:
          $ref: "#/components/schemas/TranscriptEntryKind"
        startedAt:
          type: string
          format: date-time
          description: When it began, by the client's clock. Entries are in this order.
        endedAt:
          type: [string, "null"]
          format: date-time
          description: When it ended, by the client's clock. Null only for a pause still going on.
        text:
          type: string
          description: What was said or typed. Lines only.
        speaker:
          $ref: "#/components/schemas/Speaker"
        speakerLabel:
          type: string
          description: The transcription service's own label for the speaker, e.g. `spk_0` or `ch_1`, kept so a mapping mistake can be corrected. Lines only.
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: The transcription service's confidence in the line. Spoken lines only.
        language:
          $ref: "https://blueprint.codeforamerica.org/base/schemas/enums.yaml#/$defs/Language"
          description: |
            The language the line was transcribed in, as the transcription
            service reported it — one of its profile's languages. People switch
            languages within a conversation, so each line says its own. Absent
            where the service does not report one.
        cause:
          $ref: "#/components/schemas/GapCause"
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: When the entry was recorded, by the server's clock.
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: When the entry last changed, by the server's clock.

    # A client adds lines and gaps. Pauses are not in the create schema: only
    # pausing the transcript writes one.
    TranscriptEntryCreate:
      oneOf:
        - $ref: "#/components/schemas/TranscriptLineCreate"
        - $ref: "#/components/schemas/TranscriptGapCreate"
      discriminator:
        propertyName: kind
        mapping:
          line: "#/components/schemas/TranscriptLineCreate"
          gap: "#/components/schemas/TranscriptGapCreate"

    TranscriptLineCreate:
      type: object
      description: A finished line, said or typed.
      additionalProperties: false
      required: [kind, startedAt, endedAt, text, speaker]
      properties:
        kind: {const: line}
        startedAt: {type: string, format: date-time, description: When it began, by the client's clock.}
        endedAt: {type: string, format: date-time, description: When it ended. For a typed line, the same as startedAt.}
        text: {type: string, minLength: 1}
        speaker: {$ref: "#/components/schemas/Speaker"}
        speakerLabel: {type: string}
        confidence: {type: number, minimum: 0, maximum: 1}
        language: {$ref: "https://blueprint.codeforamerica.org/base/schemas/enums.yaml#/$defs/Language"}

    TranscriptGapCreate:
      type: object
      description: A stretch where nothing was captured, recorded once transcription works again or the transcript closes.
      additionalProperties: false
      required: [kind, startedAt, endedAt]
      properties:
        kind: {const: gap}
        startedAt: {type: string, format: date-time}
        endedAt: {type: string, format: date-time}
        cause: {$ref: "#/components/schemas/GapCause"}

    TranscriptEntryUpdate:
      type: object
      description: When a pause ended. Written by resuming or closing the transcript.
      additionalProperties: false
      required: [endedAt]
      properties:
        endedAt: {type: string, format: date-time}

    TranscriptEntryList:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptEntry"
        total: {type: integer, minimum: 0, description: Total number of entries.}
        limit: {type: integer, minimum: 1, maximum: 100, description: Maximum number of entries requested.}
        offset: {type: integer, minimum: 0, description: Number of entries skipped before this page.}
        hasNext: {type: boolean, description: Whether more entries are available beyond this page.}

    # Writable base: client-writable fields only. TranscriptionProfile,
    # TranscriptionProfileCreate and TranscriptionProfileUpdate extend it.
    TranscriptionProfileWritable:
      type: object
      description: Client-writable fields of a profile.
      properties:
        name:
          type: string
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          description: A short handle people tell profiles apart by, e.g. `english-phone`. Nothing checks that it is unique.
          example: english-phone
        description:
          type: string
          description: What the profile is for.
        provider:
          type: string
          description: |
            The transcription service — an entry of the `transcription-services`
            registry, which a contract set extends with a registry file of its
            own. `none` for conversations no service transcribes: a chat, or
            lines a person types.
          x-enum-source:
            registry: transcription-services
          example: aws-transcribe
        languages:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "https://blueprint.codeforamerica.org/base/schemas/enums.yaml#/$defs/Language"
          description: |
            The languages the conversation may be in. One fixes the language;
            several let the service tell which is being spoken among them.
            Absent, the service detects the language itself — which not every
            service can do.
          example: [en-US, es-US]
        idleTimeout:
          type: string
          format: duration
          description: |
            How long a recording transcript may go without a line or gap before
            it closes itself, as an ISO 8601 duration. It is checked when the
            time is up and again after any activity since, so a quiet
            transcript closes between one and two of these after it was last
            heard from. Absent, a transcript never closes for being idle.
          example: PT30M
    TranscriptionProfile:
      description: A profile, including server-managed fields.
      unevaluatedProperties: false
      required: [id, name, provider, source, createdAt, updatedAt]
      allOf:
        - $ref: "#/components/schemas/TranscriptionProfileWritable"
        - type: object
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
              description: Unique identifier — given in the config for a seeded profile, server-generated for one added here.
            source:
              $ref: "https://blueprint.codeforamerica.org/base/schemas/enums.yaml#/$defs/ConfigSource"
            createdAt:
              type: string
              format: date-time
              readOnly: true
              description: When the profile was added.
            updatedAt:
              type: string
              format: date-time
              readOnly: true
              description: When the profile last changed.
    TranscriptionProfileCreate:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/TranscriptionProfileWritable"
        - type: object
          description: Payload to add a profile.
          required: [name, provider]
    TranscriptionProfileUpdate:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/TranscriptionProfileWritable"
        - type: object
          description: Payload to change one or more fields of a profile.
          minProperties: 1
    TranscriptionProfileList:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptionProfile"
        total: {type: integer, minimum: 0, description: Total number of profiles.}
        limit: {type: integer, minimum: 1, maximum: 100, description: Maximum number of profiles requested.}
        offset: {type: integer, minimum: 0, description: Number of profiles skipped before this page.}
        hasNext: {type: boolean, description: Whether more profiles are available beyond this page.}

  examples:
    TranscriptExample1:
      summary: A transcript of an interview, recording
      value:
        id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        subjectType: interview
        subjectId: "5c1f8a2e-0d3b-4e6f-9a7c-2b4d6e8f0a1c"
        profileId: "7a1e0c2d-0000-4000-8000-0000000000b1"
        model: standard
        client: interview-assistant/0.1.0
        status: recording
        startedAt: "2026-10-11T14:00:00Z"
        createdAt: "2026-10-11T14:00:00Z"
        updatedAt: "2026-10-11T14:00:00Z"
    TranscriptionProfileExample1:
      summary: The English interview profile, as the config seeded it
      value:
        id: "7a1e0c2d-0000-4000-8000-0000000000b1"
        name: english
        description: An interview in English.
        provider: aws-transcribe
        languages: [en-US]
        idleTimeout: PT30M
        source: system
        createdAt: "2026-10-01T00:00:00Z"
        updatedAt: "2026-10-01T00:00:00Z"
