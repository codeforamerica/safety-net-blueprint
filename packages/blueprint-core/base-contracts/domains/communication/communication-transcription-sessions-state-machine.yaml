# The lifecycle of a transcription session: the software's connection to its
# transcription service, kept track of for one conversation. See
# docs/architecture/domains/communication-transcripts.md.
#
# The session's actions are what the app does: start, pause, resume and stop.
# Its adapter is how it reaches its transcription
# service: the session calls the adapter to start, pause and stop streaming,
# and the adapter reports what happens by publishing the session's events —
# connected, disconnected, failed, ended, and the lines. The session follows
# those under on:, and so does the transcript, which keeps the lines. See
# docs/architecture/cross-cutting/adapters.md, "A running adapter".
#
# The session keeps nothing itself: its actions call the transcript's
# operations by operationId, so routing carries the calls wherever the
# transcript runs. It calls them as the caller, so the transcript sees who is
# transcribing and checks their permissions. A new
# transcript is started when the session starts, since a create can only be
# guarded, and a reaction to the session's created event would answer before
# the transcript existed. Steps are written in the actions, not as
# procedures, because a procedure runs after an action's steps, not where
# it's called.
$schema: state-machine-schema.yaml
version: "1.0"
domain: communication
capability: transcripts
machines:
  - object: TranscriptionSession
    states:
      - id: created
        slaClock: stopped
        description: Started, not yet streaming.
      - id: connecting
        slaClock: stopped
        description: The adapter is getting a credential and opening the connection.
      - id: connected
        slaClock: stopped
        description: Audio is going to the service and text is coming back.
      - id: disconnected
        slaClock: stopped
        description: The connection dropped, and the adapter is trying again.
      - id: paused
        slaClock: stopped
        description: Off the record. The connection is closed, so no audio goes to the service.
      - id: stopping
        slaClock: stopped
        description: Stop was asked for; the adapter sends the last audio and the last text is still coming.
      - id: closed
        slaClock: stopped
        description: Done, and the transcript is closed. Terminal.
      - id: failed
        slaClock: stopped
        description: The adapter gave up connecting or reconnecting. The transcript stays open; a new session can carry on under it. Terminal.
    initialState: created
    guards:
      - id: transcriptOrStart
        description: it names a transcript, or gives what to start one with — a profile, the client and when it started
        condition: >-
          has(request.transcriptId) ||
          (has(request.profileId) && has(request.client) && has(request.startedAt))
      - id: transcriptExists
        description: the transcript it names exists
        condition: '!has(request.transcriptId) || transcript != null'
      - id: hasTranscript
        description: the session has a transcript to carry on
        condition: has(object.transcriptId)
      # The adapter runs for the caller who started the session, and publishes
      # its events as them, so an event someone else published is ignored.
      - id: publishedByStarter
        description: the event was published by the caller who started the session, or the session was started with no caller identified
        condition: '!has(object.startedById) || (has(this.authid) && this.authid == object.startedById)'
    # The session's own events, and those its adapter publishes for it
    # (communication-transcription-sessions-adapter-asyncapi.yaml),
    # each with the session's id as its subject and partition key.
    emits:
      - id: connecting
        description: The session started or resumed; its adapter is getting a credential and opening the connection.
      - id: connected
        description: The connection to the service is open. A stretch with nothing captured before it, after a reconnect or when carrying on a transcript, is its gap; the transcript records it.
        schema:
          type: object
          required: [transcriptId]
          properties:
            transcriptId: {type: string, format: uuid, description: "The session's transcript. The transcript refuses an event that names another.", x-relationship: {resource: Transcript, style: links-only}}
            gap:
              type: object
              additionalProperties: false
              required: [startedAt, endedAt]
              description: The stretch nothing was captured in, by the client's clock.
              properties:
                startedAt: {type: string, format: date-time}
                endedAt: {type: string, format: date-time}
      - id: disconnected
        description: The connection dropped; it's trying again.
        schema:
          type: object
          required: [transcriptId]
          properties:
            transcriptId: {type: string, format: uuid, description: The session's transcript., x-relationship: {resource: Transcript, style: links-only}}
            at: {type: string, format: date-time, description: When it dropped, by the client's clock.}
      - id: failed
        description: It gave up connecting or reconnecting. The transcript is still open.
        schema:
          type: object
          required: [transcriptId]
          properties:
            transcriptId: {type: string, format: uuid, description: The session's transcript., x-relationship: {resource: Transcript, style: links-only}}
            reason: {type: string, description: Why, for people.}
      - id: line_updated
        description: A line in progress, to show. Not kept.
        schema:
          type: object
          required: [transcriptId, key, text, startedAt]
          properties:
            transcriptId: {type: string, format: uuid, description: The session's transcript., x-relationship: {resource: Transcript, style: links-only}}
            key: {type: string, maxLength: 255, description: "The line's key, the same on every update and on the finished line, and unique within the session. A service's own result id is unique only within one connection, so the adapter makes it unique across reconnects, for example by putting the connection's number in front."}
            text: {type: string}
            speaker: {type: string, description: "Who's speaking, as the transcript's Speaker names it."}
            startedAt: {type: string, format: date-time, description: "When it began, by the client's clock."}
      - id: line_finished
        description: A finished line. The transcript keeps it, once for its key, and its entry's created event names this event as its cause, in causationid, so a consumer can tell which entry a line became; one the transcript refuses, closed say, isn't kept.
        schema:
          type: object
          required: [transcriptId, key, startedAt, endedAt, text, speaker]
          properties:
            transcriptId: {type: string, format: uuid, description: "The session's transcript. The transcript refuses an event that names another.", x-relationship: {resource: Transcript, style: links-only}}
            key: {type: string, maxLength: 255, description: "The line's key, as on its updates. The transcript keeps a line once for the session and its key, so one published again after a network error isn't added twice."}
            startedAt: {type: string, format: date-time, description: "When it began, by the client's clock."}
            endedAt: {type: string, format: date-time, description: When it ended.}
            text: {type: string, minLength: 1}
            speaker: {type: string, description: "Who's speaking, as the transcript's Speaker names it."}
            speakerLabel: {type: string, description: "The service's own label for the voice, when it tells voices apart."}
            confidence: {type: number, minimum: 0, maximum: 1}
            language: {type: string, description: "The line's language, as a BCP 47 tag the Language enum lists."}
      - id: ended
        description: The session stopped the adapter, and it's done. The last line is published and the connection closed.
        schema:
          type: object
          required: [transcriptId, at]
          properties:
            transcriptId: {type: string, format: uuid, description: The session's transcript., x-relationship: {resource: Transcript, style: links-only}}
            at: {type: string, format: date-time, description: When the last text came in, by the client's clock; the transcript closes at it.}
      - id: paused
        description: Off the record. The adapter closes the connection, so no audio goes to the service, whoever paused it — the app, or someone pausing the transcript.
      - id: stopping
        description: Stop was asked for. The adapter sends the end of the audio and publishes the last text, then ended.
      - id: closed
        description: The session is done and the transcript closed, whoever closed it.
    actions:
      - id: start
        description: Start streaming. A new transcript is started, unless the session names one to carry on.
        transition:
          from: created
          to: connecting
        steps:
          # The adapter runs for this caller and publishes the session's events as them.
          - set:
              field: startedById
              value: $caller.id
          # Steps run in order, so the transcript exists before the adapter starts.
          - if: has(object.transcriptId)
            then:
              # Carrying on: what the transcript last heard is the start of a gap.
              - call:
                  operationId: getTranscript
                  parameters:
                    - {name: transcriptId, in: path, value: $object.transcriptId}
                runAs: caller
                bind: $current
              - call:
                  operationId: getTranscriptionProfile
                  parameters:
                    - {name: profileId, in: path, value: $current.profileId}
                runAs: caller
                bind: $profile
              - call:
                  operationId: startStream
                  requestBody:
                    payload:
                      transcriptionSessionId: $object.id
                      transcriptId: $object.transcriptId
                      provider: $profile.provider
                      model: $current.model
                      languages: $profile.languages
                      lastActivityAt: $current.lastActivityAt
                runAs: caller
            else:
              - call:
                  operationId: createTranscript
                  requestBody:
                    payload:
                      profileId: $object.profileId
                      model: $object.model
                      client: $object.client
                      startedAt: $object.startedAt
                      subjectType: $object.subjectType
                      subjectId: $object.subjectId
                runAs: caller
                bind: $transcript
              - set:
                  field: transcriptId
                  value: $transcript.id
              - call:
                  operationId: getTranscriptionProfile
                  parameters:
                    - {name: profileId, in: path, value: $transcript.profileId}
                runAs: caller
                bind: $profile
              - call:
                  operationId: startStream
                  requestBody:
                    payload:
                      transcriptionSessionId: $object.id
                      transcriptId: $transcript.id
                      provider: $profile.provider
                      model: $transcript.model
                      languages: $profile.languages
                runAs: caller
          - emit: connecting
      - id: pause
        description: Take the conversation off the record. The transcript keeps the pause; the adapter closes the connection.
        transition:
          from: connected
          to: paused
        schema:
          request:
            $ref: "#/$defs/AtRequest"
        steps:
          # The audio stops first, so none goes to the service once it's off the record.
          - call:
              operationId: pauseStream
              parameters:
                - {name: transcriptionSessionId, in: path, value: $object.id}
            runAs: caller
          - call:
              operationId: pauseTranscript
              parameters:
                - {name: transcriptId, in: path, value: $object.transcriptId}
              requestBody:
                payload: {at: $request.at}
            runAs: caller
          - emit: paused
      - id: resume
        description: Put the conversation back on the record, and start the adapter streaming again. From created, a new session carries on a paused transcript.
        transition:
          from: [created, paused]
          to: connecting
        schema:
          request:
            $ref: "#/$defs/AtRequest"
        guards:
          - conditions: [hasTranscript]
        steps:
          - set:
              field: startedById
              value: $caller.id
          - call:
              operationId: resumeTranscript
              parameters:
                - {name: transcriptId, in: path, value: $object.transcriptId}
              requestBody:
                payload: {at: $request.at}
            runAs: caller
          - call:
              operationId: getTranscript
              parameters:
                - {name: transcriptId, in: path, value: $object.transcriptId}
            runAs: caller
            bind: $current
          - call:
              operationId: getTranscriptionProfile
              parameters:
                - {name: profileId, in: path, value: $current.profileId}
            runAs: caller
            bind: $profile
          # The pause covers the time off the record, so there's no gap to report.
          - call:
              operationId: startStream
              requestBody:
                payload:
                  transcriptionSessionId: $object.id
                  transcriptId: $object.transcriptId
                  provider: $profile.provider
                  model: $current.model
                  languages: $profile.languages
            runAs: caller
          - emit: connecting
      - id: stop
        description: Finish. The adapter sends the end of the audio and publishes the last text, then ended, which closes the transcript.
        transition:
          from: [connecting, connected, paused, disconnected]
          to: stopping
        schema:
          request:
            $ref: "#/$defs/AtRequest"
        steps:
          - call:
              operationId: stopStream
              parameters:
                - {name: transcriptionSessionId, in: path, value: $object.id}
            runAs: caller
          - emit: stopping
    on:
      # What the adapter publishes for the session.
      - type: communication.transcription_session.connected
        description: Follow the adapter connected.
        transition:
          from: [connecting, disconnected]
          to: connected
        guards:
          - conditions: [publishedByStarter]
      - type: communication.transcription_session.disconnected
        description: Follow the adapter's connection dropping.
        transition:
          from: connected
          to: disconnected
        guards:
          - conditions: [publishedByStarter]
      - type: communication.transcription_session.failed
        description: Follow the adapter giving up.
        transition:
          from: [connecting, disconnected]
          to: failed
        guards:
          - conditions: [publishedByStarter]
      - type: communication.transcription_session.ended
        description: The last line is in; close the transcript.
        transition:
          from: stopping
          to: closed
        guards:
          - conditions: [publishedByStarter]
        steps:
          - call:
              operationId: closeTranscript
              parameters:
                - {name: transcriptId, in: path, value: $object.transcriptId}
              requestBody:
                payload: {at: $this.data.at}
          - emit: closed
      # The transcript can be paused or closed by someone else, or close itself
      # when idle. The session follows — found through its transcriptId — and
      # stops its adapter streaming. It follows even when the adapter can't be
      # reached, since the transcript has already changed. Resuming isn't
      # followed: only the app that's capturing the audio starts it again.
      - type: communication.transcript.paused
        description: Follow the transcript off the record.
        transition:
          from: [connecting, connected, disconnected]
          to: paused
        steps:
          - call:
              operationId: pauseStream
              parameters:
                - {name: transcriptionSessionId, in: path, value: $object.id}
            catch:
              do:
                - emit: paused
          - emit: paused
      - type: communication.transcript.closed
        description: Follow the transcript closed.
        transition:
          from: [connecting, connected, disconnected, paused, stopping]
          to: closed
        steps:
          - call:
              operationId: stopStream
              parameters:
                - {name: transcriptionSessionId, in: path, value: $object.id}
            catch:
              do:
                - emit: closed
          - emit: closed
    resources:
      TranscriptionSession:
        create:
          context:
            - transcript:
                from: communication/transcripts
                where: has(request.transcriptId) && item.id == request.transcriptId
          guards:
            - conditions: [transcriptOrStart, transcriptExists]

$defs:
  AtRequest:
    type: object
    additionalProperties: false
    required: [at]
    example:
      at: "2026-01-15T14:30:00Z"
    properties:
      at:
        type: string
        format: date-time
        description: When it happened, by the client's clock.
