$schema: metrics-schema.yaml
version: "1.0"
domain: workflow
metrics:
  - id: task_time_to_claim
    name: Task Time to Claim
    description: Median time from task creation to first claim event.
    aggregate: duration
    from:
      collection: events
      filter: type == "workflow.task.created"
    to:
      collection: events
      filter: type == "workflow.task.claimed"
    pairBy: subject
    targets:
      - stat: p50
        operator: <
        amount: 4
        unit: hours
  - id: tasks_in_queue
    name: Tasks in Queue
    description: Number of tasks currently in pending status.
    aggregate: count
    source:
      collection: tasks
      filter: status == "pending"
    targets:
      - stat: trend
        direction: down
  - id: release_rate
    name: Release Rate
    description: Ratio of release events to total task transitions.
    aggregate: ratio
    source:
      collection: events
      filter: type == "workflow.task.released"
    total:
      collection: events
      # Every task transition: task events other than created and updated.
      filter: type.contains("workflow.task.") && type != "workflow.task.created" && type != "workflow.task.updated"
    targets:
      - stat: ratio
        operator: <
        amount: 10
        unit: percent
  - id: sla_breach_rate
    name: SLA Breach Rate
    description: Ratio of tasks with a breached SLA to total tasks.
    aggregate: ratio
    source:
      collection: tasks
      # Any SLA entry breached.
      filter: slaInfo.exists(entry, entry.status == "breached")
    total:
      collection: tasks
    targets:
      - stat: ratio
        operator: <
        amount: 5
        unit: percent
  - id: sla_warning_rate
    name: SLA Warning Rate
    description: Ratio of SLA warning escalation events to total task transitions.
    aggregate: ratio
    source:
      collection: events
      # The warning timer escalates the task with this reason; there is no
      # event of its own.
      filter: type == "workflow.task.escalated" && has(data.reason) && data.reason == "sla_deadline_approaching"
    total:
      collection: events
      # Every task transition: task events other than created and updated.
      filter: type.contains("workflow.task.") && type != "workflow.task.created" && type != "workflow.task.updated"
    targets:
      - stat: ratio
        operator: <
        amount: 15
        unit: percent
