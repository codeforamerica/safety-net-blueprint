              type: string
              format: uuid
              readOnly: true
            createdAt:
              type: string
              format: date-time
              readOnly: true
            updatedAt:
              type: string
              format: date-time
              readOnly: true

    VerificationCreate:
      allOf:
        - $ref: "../intake/intake-schema.yaml#/$defs/Verification"
        - type: object
          required:
            - category

    VerificationUpdate:
      allOf:
        - $ref: "../intake/intake-schema.yaml#/$defs/Verification"
        - type: object
          minProperties: 1

    VerificationList:
      allOf:
        - $ref: "https://blueprint.codeforamerica.org/base/components/pagination.yaml#/Pagination"
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Verification"

    # ---------------------------------------------------------------------------
    # Interview
    # ---------------------------------------------------------------------------

    Interview:
      description: >
        Tracks the required SNAP interview obligation for an application
        (7 CFR § 273.2(e)). Distinct from individual appointments — one
        interview requirement may span multiple appointments due to rescheduling
        or no-shows. The caseworker explicitly sets completedAt to attest
        which appointment satisfied the regulatory obligation; this is not
        set automatically when an appointment ends.
      allOf:
        - $ref: "../intake/intake-schema.yaml#/$defs/Interview"
        - type: object
          required:
            - id
            - createdAt
            - updatedAt
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
            createdAt:
              type: string
              format: date-time
              readOnly: true
            updatedAt:
              type: string
              format: date-time
              readOnly: true

    InterviewUpdate:
      allOf:
        - $ref: "../intake/intake-schema.yaml#/$defs/Interview"
        - type: object
          minProperties: 1

    VerificationDocumentRequest:
      $ref: "../intake/intake-schema.yaml#/$defs/VerificationDocumentRequest"

