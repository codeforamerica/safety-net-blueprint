        check first, document request only if inconclusive) directly encodes the
        ex parte rule (42 CFR § 435.940).
      allOf:
        - $ref: "../intake/intake-schema.yaml#/$defs/Verification"
        - type: object
          required:
            - id
            - createdAt
            - updatedAt
            - evidence
            - documentRequests
