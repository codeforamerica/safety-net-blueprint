openapi: 3.1.0
info:
  title: Intake Service API
  version: 1.1.0
  x-domain: intake
  x-status: beta
  x-visibility: public
  description: |
    REST API for managing public assistance applications. Covers the full
    intake lifecycle: applications, household members, household data, income,
    jobs, assets, expenses, health plans, health enrollments, contacts,
    organizations, person relationships, authorized representatives, tax filers,
    sponsors, signatures, verifications, and interviews.

    > **Status: Alpha** — Breaking changes expected.

  contact:
    name: API Support
    email: support@example.com

servers:
  - url: https://api.example.com/intake
    description: Production server
  - url: http://localhost:1080/intake
    description: Local development server

tags:
  - name: Applications
    description: Manage public assistance applications.
  - name: Application Review
    description: Composite read-only context view assembled server-side for the caseworker review workflow.
  - name: Application Review Progress
    description: Per-section review progress tracking. Upsert entries to track caseworker progress through each section.
  - name: Application Notes
    description: Caseworker notes recorded against an application, member, or section.
  - name: Asset Disposals
    description: Asset disposal records for an application.
  - name: Assets
    description: Asset records for an application.
  - name: Authorized Representatives
    description: Authorized representative records for an application.
  - name: Contacts
    description: Non-member contact records for an application (authorized representatives, sponsors, tax dependents, etc.).
  - name: Deductions
    description: Above-the-line tax deduction records for an application.
  - name: Disability Benefits
    description: SSI/SSDI disability benefit records for an application.
  - name: Expenses
    description: Expense records for an application.
  - name: Health Enrollments
    description: Member enrollment records linking household members to health plans.
  - name: Health Plans
    description: Health coverage plan records for an application.
  - name: Household Info
    description: Household-level data for an application (shelter costs, utilities, composition).
  - name: Income
    description: Income records for an application.
  - name: Interviews
    description: SNAP interview obligation tracking.
  - name: Jobs
    description: Employment records for an application.
  - name: Members
    description: Household members included in an application.
  - name: Organizations
    description: Organization records for an application (employers, organizational authorized representatives).
  - name: Person Relationships
    description: Directional relationship records between any two persons in an application.
  - name: Signatures
    description: Signature records for an application.
  - name: Sponsors
    description: Sponsor records for non-citizen household members.
  - name: Tax Filers
    description: Tax filing status records for an application.
  - name: Verifications
    description: Application verification obligations — electronic check results and document evidence.

paths:
  /applications:
    get:
      summary: List applications
      description: Retrieve a paginated list of applications.
      operationId: listApplications
      tags:
        - Applications
      x-sortable:
        # submittedAt is user-meaningful but caseworker recency triage needs it;
        # threat model assumes listApplications scope implies record-read (A01:2025).
        fields: [createdAt, updatedAt, submittedAt, status]
        default: -submittedAt
        tieBreaker: id
      parameters:
        - $ref: "https://blueprint.codeforamerica.org/base/components/parameters.yaml#/SearchQueryParam"
        - $ref: "https://blueprint.codeforamerica.org/base/components/parameters.yaml#/LimitParam"
        - $ref: "https://blueprint.codeforamerica.org/base/components/parameters.yaml#/OffsetParam"
        - $ref: "https://blueprint.codeforamerica.org/base/components/parameters.yaml#/SortParam"
      responses:
        "200":
          description: A paginated collection of applications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationList"
        "400":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/BadRequest"
        "500":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/InternalError"

    post:
      summary: Create an application
      description: Create a new public assistance application in draft status.
      operationId: createApplication
      tags:
        - Applications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationCreate"
      responses:
        "201":
          description: Application created successfully.
          headers:
            Location:
              description: URL of the newly created application resource.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/BadRequest"
        "422":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/UnprocessableEntity"
        "500":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/InternalError"

  /applications/{applicationId}:
    parameters:
      - $ref: "#/components/parameters/ApplicationIdParam"

    get:
      summary: Get an application
      description: Retrieve a single application by identifier.
      operationId: getApplication
      tags:
        - Applications
      responses:
        "200":
          description: Application retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
              examples:
                ApplicationExample1:
                  $ref: "#/components/examples/ApplicationExample1"
        "404":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/NotFound"
        "500":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/InternalError"

    patch:
      summary: Update an application
      description: Apply partial updates to a draft or under-review application.
      operationId: updateApplication
      tags:
        - Applications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationUpdate"
      responses:
        "200":
          description: Application updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/BadRequest"
        "404":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/NotFound"
        "422":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/UnprocessableEntity"
        "500":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/InternalError"

    delete:
      summary: Delete an application
      description: Permanently remove a draft application record.
      operationId: deleteApplication
      tags:
        - Applications
      responses:
        "204":
          description: Application deleted successfully.
        "404":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/NotFound"
        "500":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/InternalError"

  /applications/{applicationId}/members:
    parameters:
      - $ref: "#/components/parameters/ApplicationIdParam"

    get:
      summary: List application members
      description: Retrieve all household members linked to this application.
      operationId: listApplicationMembers
      tags:
        - Members
      x-sortable:
        # name.* needed for alphabetical browse; ssn/dateOfBirth excluded —
        # sort order is an oracle even when fields aren't projected (A01:2025).
        fields: [createdAt, updatedAt, name.lastName, name.firstName]
        default: name.lastName,name.firstName
        tieBreaker: id
      parameters:
        - $ref: "https://blueprint.codeforamerica.org/base/components/parameters.yaml#/SearchQueryParam"
        - $ref: "https://blueprint.codeforamerica.org/base/components/parameters.yaml#/LimitParam"
        - $ref: "https://blueprint.codeforamerica.org/base/components/parameters.yaml#/OffsetParam"
        - $ref: "https://blueprint.codeforamerica.org/base/components/parameters.yaml#/SortParam"
      responses:
        "200":
          description: A paginated list of application members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationMemberList"
        "400":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/BadRequest"
        "404":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/NotFound"
        "500":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/InternalError"

    post:
      summary: Add a member
      description: Add a household member to this application.
      operationId: createApplicationMember
      tags:
        - Members
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationMemberCreate"
      responses:
        "201":
          description: Member added successfully.
          headers:
            Location:
              description: URL of the newly created member resource.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationMember"
        "400":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/BadRequest"
        "404":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/NotFound"
        "422":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/UnprocessableEntity"
        "500":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/InternalError"

  /applications/{applicationId}/members/{memberId}:
    parameters:
      - $ref: "#/components/parameters/ApplicationIdParam"
      - $ref: "#/components/parameters/MemberIdParam"

    get:
      summary: Get a member
      description: Retrieve a single household member by identifier.
      operationId: getApplicationMember
      tags:
        - Members
      responses:
        "200":
          description: Member retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationMember"
              examples:
