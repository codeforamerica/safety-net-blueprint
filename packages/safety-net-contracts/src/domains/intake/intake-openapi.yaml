        "404":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/NotFound"
        "500":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/InternalError"

    patch:
      summary: Update a member
      description: Apply partial updates to a household member record.
      operationId: updateApplicationMember
      tags:
        - Members
      requestBody:
        required: true
        content:
          application/json:
            schema:
