  /applications/{applicationId}/health-enrollments/{healthEnrollmentId}:
    parameters:
      - $ref: "#/components/parameters/ApplicationIdParam"
      - $ref: "#/components/parameters/HealthEnrollmentIdParam"
    get:
      summary: Get health enrollment
      operationId: getHealthEnrollment
      tags: [Health Enrollments]
      responses:
        "200":
          description: Health enrollment record retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnrollment"
        "404":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/NotFound"
        "500":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/InternalError"
    patch:
      summary: Update health enrollment
      operationId: updateHealthEnrollment
      tags: [Health Enrollments]
      requestBody:
        required: true
        content:
