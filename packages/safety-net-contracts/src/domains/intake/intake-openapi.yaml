      description: Apply partial updates to the interview record (e.g., set waiverGranted, record completedAt).
      operationId: updateInterview
      tags:
        - Interviews
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterviewUpdate"
      responses:
        "200":
          description: Interview updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Interview"
        "400":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/BadRequest"
        "404":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/NotFound"
        "422":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/UnprocessableEntity"
        "500":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/InternalError"

components:
  parameters:
    ApplicationIdParam:
      name: applicationId
      in: path
      required: true
      description: Unique identifier of the application.
      schema:
        type: string
        format: uuid

    VerificationIdParam:
      name: verificationId
      in: path
      required: true
      description: Unique identifier of the verification obligation.
      schema:
        type: string
        format: uuid

    MemberIdParam:
      name: memberId
      in: path
      required: true
      description: Unique identifier of the application member.
      schema:
        type: string
        format: uuid

    IncomeIdParam:
      name: incomeId
      in: path
      required: true
      description: Unique identifier of the income record.
      schema:
        type: string
        format: uuid

    ExpenseIdParam:
      name: expenseId
      in: path
      required: true
      description: Unique identifier of the expense record.
      schema:
        type: string
        format: uuid

    AssetIdParam:
      name: assetId
      in: path
      required: true
      description: Unique identifier of the asset record.
      schema:
        type: string
        format: uuid

    JobIdParam:
      name: jobId
      in: path
      required: true
      description: Unique identifier of the job record.
      schema:
        type: string
        format: uuid

    HealthPlanIdParam:
      name: healthPlanId
      in: path
      required: true
      description: Unique identifier of the health plan record.
      schema:
        type: string
        format: uuid

    HealthEnrollmentIdParam:
      name: healthEnrollmentId
      in: path
      required: true
      description: Unique identifier of the health enrollment record.
      schema:
        type: string
        format: uuid

    AssetDisposalIdParam:
      name: assetDisposalId
      in: path
      required: true
      description: Unique identifier of the asset disposal record.
      schema:
        type: string
        format: uuid

    DeductionIdParam:
      name: deductionId
      in: path
      required: true
      description: Unique identifier of the deduction record.
      schema:
        type: string
        format: uuid

    DisabilityBenefitIdParam:
      name: disabilityBenefitId
      in: path
      required: true
      description: Unique identifier of the disability benefit record.
      schema:
        type: string
        format: uuid

    ContactIdParam:
      name: contactId
      in: path
      required: true
      description: Unique identifier of the contact record.
      schema:
        type: string
        format: uuid

    OrganizationIdParam:
      name: organizationId
      in: path
      required: true
      description: Unique identifier of the organization record.
      schema:
        type: string
        format: uuid

    PersonRelationshipIdParam:
      name: personRelationshipId
      in: path
      required: true
      description: Unique identifier of the person relationship record.
      schema:
        type: string
        format: uuid

    AuthorizedRepresentativeIdParam:
      name: authorizedRepresentativeId
      in: path
      required: true
      description: Unique identifier of the authorized representative record.
      schema:
        type: string
        format: uuid

    TaxFilerIdParam:
      name: taxFilerId
      in: path
      required: true
      description: Unique identifier of the tax filer record.
      schema:
        type: string
        format: uuid

    SponsorIdParam:
      name: sponsorId
      in: path
      required: true
      description: Unique identifier of the sponsor record.
      schema:
        type: string
        format: uuid

    SignatureIdParam:
      name: signatureId
      in: path
      required: true
      description: Unique identifier of the signature record.
      schema:
        type: string
        format: uuid

    MemberIdQueryParam:
      name: memberId
      in: query
      required: false
      description: Filter records by the household member they belong to.
      schema:
        type: string
        format: uuid

  schemas:
    Application:
      description: >
        The root entity representing one submitted application from a household.
        Distinct from the downstream benefit case — no platform tracks the final
        determination on the application itself; that lives on the case created
        after eligibility determination. Drives the regulatory processing clock:
        the 30-day SNAP deadline and 45-day Medicaid deadline both run from
        submittedAt (7 CFR § 273.2, 42 CFR § 435.912).
      allOf:
        - $ref: "../intake/intake-schema.yaml#/$defs/Application"
        - type: object
          required:
            - id
            - status
            - createdAt
            - updatedAt
          properties:
            id:
              type: string
              format: uuid
              description: Unique identifier for the application.
              readOnly: true
            status:
              type: string
              description: Current lifecycle status of the application.
              readOnly: true
              x-enum-source:
                source: states[].id
                machine: Application
            isExpedited:
              type:
                - boolean
                - "null"
              description: Whether the application qualifies for expedited processing (e.g., SNAP 7-day track). Set during caseworker expedited screening after submission. Null until screening is complete.
              readOnly: true
            submittedAt:
              type: string
              format: date-time
              description: When the application was formally submitted. Null until submitted.
              readOnly: true
              nullable: true
            withdrawnAt:
              type: string
              format: date-time
              description: When the application was withdrawn. Null unless withdrawn.
              readOnly: true
              nullable: true
            closedAt:
              type: string
              format: date-time
              description: When the intake phase closed. Null until closed.
              readOnly: true
              nullable: true
            createdAt:
              type: string
              format: date-time
              description: When the application record was created.
              readOnly: true
            updatedAt:
              type: string
              format: date-time
              description: When the application record was last modified.
              readOnly: true

    ApplicationCreate:
      allOf:
        - $ref: "../intake/intake-schema.yaml#/$defs/Application"
        - type: object
          required:
            - programsAppliedFor

    ApplicationUpdate:
      allOf:
        - $ref: "../intake/intake-schema.yaml#/$defs/Application"
        - type: object
          minProperties: 1

    ApplicationList:
      allOf:
        - $ref: "https://blueprint.codeforamerica.org/base/components/pagination.yaml#/Pagination"
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Application"

    # ---------------------------------------------------------------------------
    # ApplicationMember
    # ---------------------------------------------------------------------------

    ApplicationMember:
      description: >
        A person linked to an application. May be the primary applicant, a
        household member applying for benefits, a member counted but not
        applying (their income and resources still count toward the household),
        or an authorized representative. SNAP requires all household members to
        be listed regardless of individual eligibility (7 CFR § 273.1).
      allOf:
        - $ref: "../intake/intake-schema.yaml#/$defs/ApplicationMember"
        - type: object
          required:
            - id
            - applicationId
            - roles
            - createdAt
            - updatedAt
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
            applicationId:
              type: string
              format: uuid
              readOnly: true
              x-relationship:
                resource: Application
            createdAt:
              type: string
              format: date-time
              readOnly: true
            updatedAt:
              type: string
              format: date-time
              readOnly: true
            personMatch:
              readOnly: true
              nullable: true
              $ref: "#/components/schemas/PersonMatch"
            programDeterminations:
              type: array
              readOnly: true
              description: Per-program eligibility determination results, populated as decisions arrive from the eligibility domain.
              items:
                $ref: "#/components/schemas/ApplicationMemberProgramDetermination"

    ApplicationMemberCreate:
      allOf:
        - $ref: "../intake/intake-schema.yaml#/$defs/ApplicationMember"
        - type: object
          required:
            - roles

    ApplicationMemberUpdate:
      allOf:
        - $ref: "../intake/intake-schema.yaml#/$defs/ApplicationMember"
        - type: object
          minProperties: 1

    ApplicationMemberList:
      allOf:
        - $ref: "https://blueprint.codeforamerica.org/base/components/pagination.yaml#/Pagination"
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ApplicationMember"

    PersonMatch:
      $ref: "../intake/intake-schema.yaml#/$defs/PersonMatch"

    PersonMatchCandidate:
      $ref: "../intake/intake-schema.yaml#/$defs/PersonMatchCandidate"

    ApplicationMemberProgramDetermination:
      $ref: "../intake/intake-schema.yaml#/$defs/ApplicationMemberProgramDetermination"

    # ---------------------------------------------------------------------------
    # Application-level collection schemas
    # ---------------------------------------------------------------------------

    Income:
      description: An income record for an application.
      allOf:
        - $ref: "../../common/schemas/income.yaml"
        - type: object
          required:
            - id
            - memberId
            - applicationId
            - createdAt
            - updatedAt
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
            memberId:
              type: string
              format: uuid
              description: The household member this income record belongs to.
              x-relationship:
                resource: ApplicationMember
            applicationId:
              type: string
              format: uuid
              readOnly: true
              x-relationship:
                resource: Application
            createdAt:
              type: string
              format: date-time
              readOnly: true
            updatedAt:
              type: string
              format: date-time
              readOnly: true

    IncomeCreate:
      allOf:
        - $ref: "../../common/schemas/income.yaml"
        - type: object
          required:
            - memberId
          properties:
            memberId:
              type: string
              format: uuid
              description: The household member this income record belongs to.
              x-relationship:
                resource: ApplicationMember

    IncomeUpdate:
      description: >
        Mutable fields for an income record. type is immutable — to change the
        income type, delete and recreate the record.
      allOf:
        - $ref: "../../common/schemas/income.yaml#/$defs/IncomeBase"
        - type: object
          minProperties: 1

    IncomeList:
      allOf:
        - $ref: "https://blueprint.codeforamerica.org/base/components/pagination.yaml#/Pagination"
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Income"

    Expense:
      description: An expense record for an application.
      allOf:
        - $ref: "../intake/intake-schema.yaml#/$defs/Expense"
        - type: object
          required:
