openapi: 3.1.0
info:
  title: Person API
  version: 0.1.0
  x-domain: client-management
  x-status: alpha
  x-visibility: internal
  description: |
    REST API for managing persons. The specification defines CRUD operations
    for creating, reading, updating, and deleting persons.
  contact:
    name: API Support
    email: support@example.com
servers:
- url: https://api.example.com
  description: Production server
- url: http://localhost:8080
  description: Local development server
tags:
- name: Persons
  description: Manage persons.
paths:
  "/persons":
    get:
      summary: List persons
      description: Retrieve a paginated list of persons.
      operationId: listPersons
      tags:
      - Persons
      x-sortable:
        fields: [createdAt, updatedAt, name]
        default: -updatedAt
        tieBreaker: id
      parameters:
      - "$ref": "https://blueprint.codeforamerica.org/base/components/parameters.yaml#/SearchQueryParam"
      - "$ref": "https://blueprint.codeforamerica.org/base/components/parameters.yaml#/LimitParam"
      - "$ref": "https://blueprint.codeforamerica.org/base/components/parameters.yaml#/OffsetParam"
      - "$ref": "https://blueprint.codeforamerica.org/base/components/parameters.yaml#/SortParam"
      responses:
        '200':
          description: A paginated collection of persons.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PersonList"
        '400':
          "$ref": "https://blueprint.codeforamerica.org/base/components/responses.yaml#/BadRequest"
        '500':
          "$ref": "https://blueprint.codeforamerica.org/base/components/responses.yaml#/InternalError"
    post:
      summary: Create a person
      description: Create a new person record.
      operationId: createPerson
      tags:
      - Persons
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PersonCreate"
      responses:
        '201':
          description: Person created successfully.
          headers:
            Location:
              description: URL of the newly created person resource.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Person"
        '400':
          "$ref": "https://blueprint.codeforamerica.org/base/components/responses.yaml#/BadRequest"
        '422':
          "$ref": "https://blueprint.codeforamerica.org/base/components/responses.yaml#/UnprocessableEntity"
        '500':
          "$ref": "https://blueprint.codeforamerica.org/base/components/responses.yaml#/InternalError"
  "/persons/{personId}":
    parameters:
    - "$ref": "#/components/parameters/PersonIdParam"
    get:
      summary: Get a person
      description: Retrieve a single person by identifier.
      operationId: getPerson
      tags:
      - Persons
      responses:
        '200':
          description: Person retrieved successfully.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Person"
              examples:
                PersonExample1:
                  $ref: "#/components/examples/PersonExample1"
        '404':
          "$ref": "https://blueprint.codeforamerica.org/base/components/responses.yaml#/NotFound"
        '500':
          "$ref": "https://blueprint.codeforamerica.org/base/components/responses.yaml#/InternalError"
    patch:
      summary: Update a person
      description: Apply partial updates to an existing person.
      operationId: updatePerson
      tags:
      - Persons
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PersonUpdate"
      responses:
        '200':
          description: Person updated successfully.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Person"
        '400':
          "$ref": "https://blueprint.codeforamerica.org/base/components/responses.yaml#/BadRequest"
        '404':
          "$ref": "https://blueprint.codeforamerica.org/base/components/responses.yaml#/NotFound"
        '422':
          "$ref": "https://blueprint.codeforamerica.org/base/components/responses.yaml#/UnprocessableEntity"
        '500':
          "$ref": "https://blueprint.codeforamerica.org/base/components/responses.yaml#/InternalError"
    delete:
      summary: Delete a person
      description: Permanently remove a person record.
      operationId: deletePerson
      tags:
      - Persons
      responses:
        '204':
          description: Person deleted successfully.
        '404':
          "$ref": "https://blueprint.codeforamerica.org/base/components/responses.yaml#/NotFound"
        '500':
          "$ref": "https://blueprint.codeforamerica.org/base/components/responses.yaml#/InternalError"
components:
  parameters:
    PersonIdParam:
      name: personId
      in: path
      required: true
      description: Unique identifier of the person.
      schema:
        type: string
        format: uuid
      example: 4d1f13f0-3e26-4c50-b2fb-8d140f7ec1c2
  schemas:
    Person:
      allOf:
      - $ref: "../client-management/client-management-schema.yaml#/$defs/Person"
      - type: object
        required: [id, createdAt, updatedAt]
        properties:
          id:
            type: string
            format: uuid
            readOnly: true
            description: Unique identifier for the person record.
          createdAt:
            type: string
            format: date-time
            readOnly: true
            description: Timestamp when the person record was created.
          updatedAt:
            type: string
            format: date-time
            readOnly: true
            description: Timestamp when the person record was last updated.
    PersonCreate:
      allOf:
      - $ref: "../client-management/client-management-schema.yaml#/$defs/Person"
      - type: object
        description: |
          Payload to create a new person record.

          Note: id, createdAt, and updatedAt are server-generated (readOnly) and will be returned in the response.
    PersonUpdate:
      allOf:
      - $ref: "../client-management/client-management-schema.yaml#/$defs/Person"
      - type: object
        description: |
          Payload to update one or more mutable fields of an existing person. Partial updates are supported.

          Note: id, createdAt, and updatedAt are server-generated (readOnly) and cannot be updated.
        minProperties: 1
    PersonList:
      allOf:
      - $ref: "https://blueprint.codeforamerica.org/base/components/pagination.yaml#/Pagination"
      - type: object
        required: [items]
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/Person"

  examples:
    PersonExample1:
      summary: Example Person record
      value:
        id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        createdAt: "2024-01-15T10:30:00Z"
        updatedAt: "2024-01-15T10:30:00Z"

