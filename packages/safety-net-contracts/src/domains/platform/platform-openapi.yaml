openapi: 3.1.0
info:
  title: Platform API
  version: 0.5.0
  x-domain: platform
  x-status: beta
  x-visibility: internal
  description: |
    Cross-cutting platform services shared across all domains.

    Includes the policy registry and cross-resource search (`/search`). The
    event log (`/events`) comes from the framework's own platform domain,
    beside this document. The `/platform` base path may be overlaid by state
    partners to match their own conventions.

    > **Status: Alpha** — Breaking changes expected.

  contact:
    name: API Support
    email: support@example.com

servers:
  - url: https://api.example.com/platform
    description: Production server
  - url: http://localhost:1080/platform
    description: Local development server

tags:
  - name: Registry
    description: Platform-level metadata registries shared across all domains.
  - name: Search
    description: Cross-resource search across all domains.

paths:
  /registry/policies:
    get:
      summary: List policies
      description: |
        Returns all regulatory citations in the platform policy registry, keyed
        by stable ID. Policies are shared platform-level metadata — not domain-
        scoped — and serve as the canonical source for annotation displays,
        compliance tooling, and caseworker UI.
      operationId: listPolicies
      tags:
        - Registry
      x-sortable:
        fields: [id, citation]
        default: id
        tieBreaker: id
      parameters:
        - $ref: "https://blueprint.codeforamerica.org/base/components/parameters.yaml#/SearchQueryParam"
        - $ref: "https://blueprint.codeforamerica.org/base/components/parameters.yaml#/LimitParam"
        - $ref: "https://blueprint.codeforamerica.org/base/components/parameters.yaml#/OffsetParam"
        - $ref: "https://blueprint.codeforamerica.org/base/components/parameters.yaml#/SortParam"
      responses:
        "200":
          description: Paginated list of policies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyList"
        "400":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/BadRequest"
        "500":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/InternalError"

  /registry/policies/{policyId}:
    parameters:
      - name: policyId
        in: path
        required: true
        description: Stable policy identifier (e.g., `snap-processing-clock`).
        schema:
          type: string

    get:
      summary: Get a policy
      description: Retrieve a single policy from the registry by its stable identifier.
      operationId: getPolicy
      tags:
        - Registry
      responses:
        "200":
          description: Policy retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "404":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/NotFound"
        "500":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/InternalError"

  /search:
    get:
      summary: Search across resources
      description: |
        Search across all resource types (persons, cases, applications, tasks,
        appointments) and return a unified result list. Results include typed
        attributes for consistent client rendering and facet counts per resource type.
      operationId: search
      tags:
        - Search
      parameters:
        - $ref: "https://blueprint.codeforamerica.org/base/components/parameters.yaml#/SearchQueryParam"
        - $ref: "https://blueprint.codeforamerica.org/base/components/parameters.yaml#/LimitParam"
        - $ref: "https://blueprint.codeforamerica.org/base/components/parameters.yaml#/OffsetParam"
        - name: types
          in: query
          required: false
          description: Filter results to specific resource types. When omitted, all types are searched.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/SearchResultType"
      responses:
        "200":
          description: A paginated list of search results with facet counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResultList"
        "400":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/BadRequest"
        "500":
          $ref: "https://blueprint.codeforamerica.org/base/components/responses.yaml#/InternalError"

components:
  schemas:
    # Primary schemas

    Policy:
      description: |
        A regulatory citation in the platform policy registry. Policies are
        contract artifacts defined in `platform-registry-policies*.yaml` files
        and referenced by annotation files using their stable ID. They are not
        mutable records — no createdAt/updatedAt fields.
      type: object
      additionalProperties: false
      required:
        - id
        - citation
        - description
      properties:
        id:
          type: string
          description: Stable policy identifier (e.g., `snap-processing-clock`).
          example: snap-processing-clock
        citation:
          type: string
          description: The regulatory citation string (e.g., "7 CFR § 273.2(g)(1)").
          example: "7 CFR § 273.2(g)(1)"
        citationUrl:
          type: string
          format: uri
          description: URL to the official regulatory text.
          example: "https://www.ecfr.gov/current/title-7/section-273.2"
        description:
          type: string
          description: Plain-language description of the regulatory requirement.
        programs:
          type: array
          description: Programs this policy applies to.
          items:
            type: string
          example: [snap]

    SearchResult:
      type: object
      description: |
        A single search result with a uniform shape regardless of the underlying
        resource type. Attributes provide typed key-value pairs for consistent
        client rendering.
      additionalProperties: false
      required:
        - id
        - type
        - title
        - url
        - attributes
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the matched resource.
        type:
          $ref: "#/components/schemas/SearchResultType"
        title:
          type: string
          description: Display title for the result (e.g., person name, case number).
        url:
          type: string
          format: uri
          description: Canonical API URL of the matched resource.
        score:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Relevance score between 0 and 1. Higher is more relevant.
        attributes:
          type: array
          description: Typed key-value pairs describing the result (e.g., status, date of birth, case number).
          items:
            $ref: "#/components/schemas/SearchResultAttribute"
        createdAt:
          type: string
          format: date-time
          description: When the matched resource was created.
        updatedAt:
          type: string
          format: date-time
          description: When the matched resource was last updated.

    # Ancillary schemas (alphabetical)

    PolicyList:
      description: Paginated list of policies from the platform registry.
      allOf:
        - $ref: "https://blueprint.codeforamerica.org/base/components/pagination.yaml#/Pagination"
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Policy"

    SearchFacet:
      type: object
      description: A result count for a single resource type, enabling UI to show type-based filtering.
      additionalProperties: false
      required:
        - type
        - count
      properties:
        type:
          $ref: "#/components/schemas/SearchResultType"
        count:
          type: integer
          minimum: 0
          description: Number of matching results for this type.

    SearchResultAttribute:
      type: object
      description: A typed key-value pair for rendering search result details.
      additionalProperties: false
      required:
        - field
        - value
        - type
      properties:
        field:
          type: string
          description: Machine-readable field key (e.g., "dob", "status", "caseNumber").
        label:
          type: string
          description: Human-readable display label (e.g., "Date of Birth", "Status", "Case Number").
        value:
          type: string
          description: Display value, pre-formatted as a string regardless of type.
        type:
          type: string
          description: |
            Value type hint for client rendering:
            - `string` — plain text (default)
            - `date` — date value (client may reformat)
            - `currency` — monetary amount (client may reformat)
          enum:
            - string
            - date
            - currency

    SearchResultList:
      type: object
      description: Paginated search results with facet counts.
      additionalProperties: false
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"
        total:
          type: integer
          minimum: 0
          description: Total number of matching results across all types.
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: Maximum number of results requested.
        offset:
          type: integer
          minimum: 0
          description: Number of items skipped before the current page.
        hasNext:
          type: boolean
          description: Indicates whether more results are available beyond the current page.
        facets:
          type: array
          description: Result counts per resource type.
          items:
            $ref: "#/components/schemas/SearchFacet"

    SearchResultType:
      type: string
      description: The type of resource matched by the search.
      enum:
        - person
        - case
        - application
        - task
        - appointment
