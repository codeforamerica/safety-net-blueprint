$schema: policies-schema.yaml
version: "1.0"

policies:

  # ── Household composition ─────────────────────────────────────────────────────

  snap-household-composition:
    citation: "7 CFR § 273.1"
    citationUrl: "https://www.ecfr.gov/current/title-7/section-273.1"
    description: >
      All household members must be listed on the application regardless of
      whether they are individually applying for SNAP. Members who are ineligible
      — such as non-citizens who do not qualify — must still be listed because
      their income and resources are counted when calculating the benefit amount
      for the rest of the household.
    programs: [snap]

  snap-authorized-representative:
    citation: "7 CFR § 273.2(n)"
    citationUrl: "https://www.ecfr.gov/current/title-7/section-273.2"
    description: >
      A SNAP authorized representative must be a non-household member. They may
      apply, be interviewed, and obtain benefits on behalf of the household, but
      may not also appear as a regular household member on the same application.
    programs: [snap]

  medicaid-authorized-representative:
    citation: "42 CFR § 435.923"
    citationUrl: "https://www.ecfr.gov/current/title-42/section-435.923"
    description: >
      A Medicaid authorized representative may be a household member. Unlike
      SNAP, Medicaid permits a person who lives in the household to act as
      authorized representative, meaning one person can simultaneously hold both
      the household member and authorized representative roles.
    programs: [medicaid]

  # ── Application filing and acceptance ────────────────────────────────────────

  snap-application-acceptance:
    citation: "7 CFR § 273.2(g)"
    citationUrl: "https://www.ecfr.gov/current/title-7/section-273.2"
    description: >
      Agency must accept any application on the date of first contact, even if
      incomplete. The date received is the application filing date and starts
      the processing clock.
    programs: [snap]

  snap-application-date-stamp:
    citation: "7 CFR § 273.2(c)(1)"
    citationUrl: "https://www.ecfr.gov/current/title-7/section-273.2"
    description: >
      Agency must date-stamp or otherwise record the date of receipt on every
      application. The date stamp establishes the filing date used for timeliness
      determinations.
    programs: [snap]

  snap-right-to-apply:
    citation: "7 CFR § 273.2(a)"
    citationUrl: "https://www.ecfr.gov/current/title-7/section-273.2"
    description: >
      Any household may apply for SNAP benefits regardless of current
      participation in other programs. Agencies may not screen out applicants
      before accepting an application.
    programs: [snap]

  # ── Processing timeliness ─────────────────────────────────────────────────────

  snap-processing-clock:
    citation: "7 CFR § 273.2(i)(1)"
    citationUrl: "https://www.ecfr.gov/current/title-7/section-273.2"
    description: >
      Agency must act on an application and provide benefits or send a notice of
      denial within 30 days of the date of application.
    programs: [snap]

  snap-expedited-processing:
    citation: "7 CFR § 273.2(i)(3)(i)"
    citationUrl: "https://www.ecfr.gov/current/title-7/section-273.2"
    description: >
      Benefits must be issued within 7 days for households with gross monthly
      income below $150 and liquid resources at or below $100, or households
      whose combined monthly gross income and liquid resources are less than
      the monthly rent or mortgage and utilities.
    programs: [snap]

  medicaid-processing-clock:
    citation: "42 CFR § 435.912"
    citationUrl: "https://www.ecfr.gov/current/title-42/section-435.912"
    description: >
      States must make eligibility determinations within 45 days of application
      for most applicants and within 90 days for applicants who require a
      disability determination.
    programs: [medicaid]

  # ── Interview requirement ─────────────────────────────────────────────────────

  snap-interview-requirement:
    citation: "7 CFR § 273.2(e)"
    citationUrl: "https://www.ecfr.gov/current/title-7/section-273.2"
    description: >
      SNAP applicants must complete an in-person or telephone interview before
      certification. The interview must be conducted by a qualified eligibility
      worker.
    programs: [snap]

  # ── Verification requirements ─────────────────────────────────────────────────

  snap-identity-verification:
    citation: "7 CFR § 273.2(f)(1)(vi)"
    citationUrl: "https://www.ecfr.gov/current/title-7/section-273.2"
    description: >
      Agency must verify the identity of the head of household prior to
      certification. Identity may be verified through a collateral contact or
      documentary evidence.
    programs: [snap]

  snap-residency-verification:
    citation: "7 CFR § 273.2(f)(1)(iii)"
    citationUrl: "https://www.ecfr.gov/current/title-7/section-273.2"
    description: >
      Residency must be verified; applicants may not be required to show a
      permanent address. Homeless households and those with no fixed address
      are eligible.
    programs: [snap]

  snap-income-verification:
    citation: "7 CFR § 272.8"
    citationUrl: "https://www.ecfr.gov/current/title-7/section-272.8"
    description: >
      Income must be verified through available electronic data sources (SSA
      IEVS, IRS IEVS, SWICA, UIB) before relying on applicant statements.
      Electronic verification reduces documentation burden on applicants.
    programs: [snap]

  snap-ssa-identity-check:
    citation: "42 U.S.C. § 1320b-7"
    citationUrl: "https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title42-section1320b-7&num=0&edition=prelim"
    description: >
      Agencies must use SSA data matches to verify identity and citizenship
      status for SNAP applicants. FDSH SSA is the electronic source for this
      check.
    programs: [snap]

  # ── Immigration and citizenship ───────────────────────────────────────────────

  snap-citizenship-eligibility:
    citation: "7 CFR § 273.4"
    citationUrl: "https://www.ecfr.gov/current/title-7/section-273.4"
    description: >
      Only U.S. citizens and qualified aliens are eligible for SNAP. Agency must
      verify citizenship or immigration status for all applicants.
    programs: [snap]

  qualified-alien-eligibility:
    citation: "8 U.S.C. § 1611"
    citationUrl: "https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title8-section1611&num=0&edition=prelim"
    description: >
      Federal statute establishing that only qualified aliens are eligible for
      federal public benefits including SNAP. Defines the categories of
      immigration status that confer eligibility.
    programs: [snap, medicaid]

  medicaid-citizenship-electronic-check:
    citation: "42 CFR § 435.956(b)"
    citationUrl: "https://www.ecfr.gov/current/title-42/section-435.956"
    description: >
      States must use electronic data sources to verify citizenship before
      requesting paper documentation. FDSH SSA citizenship check satisfies this
      requirement.
    programs: [medicaid]

  medicaid-immigration-electronic-check:
    citation: "42 CFR § 435.956(c)"
    citationUrl: "https://www.ecfr.gov/current/title-42/section-435.956"
    description: >
      States must use electronic data sources to verify immigration status before
      requesting paper documentation. FDSH VLP satisfies this requirement.
    programs: [medicaid]

  # ── Ex parte and electronic verification ─────────────────────────────────────

  medicaid-ex-parte-renewal:
    citation: "42 CFR § 435.916"
    citationUrl: "https://www.ecfr.gov/current/title-42/section-435.916"
    description: >
      States must renew Medicaid eligibility using available electronic data
      before sending a renewal form to beneficiaries. If electronic data is
      sufficient, no contact with the beneficiary is required.
    programs: [medicaid]

  medicaid-ex-parte-determination:
    citation: "42 CFR § 435.911"
    citationUrl: "https://www.ecfr.gov/current/title-42/section-435.911"
    description: >
      States must use available electronic data to make eligibility
      determinations without requiring additional information from the applicant
      when data is sufficient to establish eligibility.
    programs: [medicaid]

  medicaid-data-sharing:
    citation: "42 CFR § 435.948"
    citationUrl: "https://www.ecfr.gov/current/title-42/section-435.948"
    description: >
      States must use data from other agencies and programs to verify
      eligibility information electronically before requesting documentation
      from applicants.
    programs: [medicaid]

  # ── Eligibility criteria ──────────────────────────────────────────────────────

  snap-gross-income-test:
    citation: "7 CFR § 273.9(a)"
    citationUrl: "https://www.ecfr.gov/current/title-7/section-273.9"
    description: >
      Household gross income must be at or below 130% of the federal poverty
      level. Most households must pass the gross income test before the net
      income test is applied.
    programs: [snap]

  snap-net-income-test:
    citation: "7 CFR § 273.9(b)"
    citationUrl: "https://www.ecfr.gov/current/title-7/section-273.9"
    description: >
      Household net income after allowable deductions must be at or below 100%
      of the federal poverty level.
    programs: [snap]

  snap-resource-limit:
    citation: "7 CFR § 273.8"
    citationUrl: "https://www.ecfr.gov/current/title-7/section-273.8"
    description: >
      Most households may not have countable liquid resources exceeding $2,750.
      Households with an elderly or disabled member have a limit of $4,250.
    programs: [snap]

  snap-benefit-calculation:
    citation: "7 CFR § 273.10"
    citationUrl: "https://www.ecfr.gov/current/title-7/section-273.10"
    description: >
      Allotment is calculated by multiplying net income by 30% and subtracting
      from the maximum allotment for household size. The result determines the
      monthly benefit amount.
    programs: [snap]

  # ── Concurrent and joint applications ────────────────────────────────────────

  medicaid-concurrent-application:
    citation: "42 CFR § 435.406"
    citationUrl: "https://www.ecfr.gov/current/title-42/section-435.406"
    description: >
      States must allow households to apply for Medicaid and SNAP in a single
      application. Agencies may not require separate applications for programs
      administered by the same agency.
    programs: [medicaid]

  # ── Notice and fair hearing ───────────────────────────────────────────────────

  snap-notice-of-action:
    citation: "7 CFR § 273.13"
    citationUrl: "https://www.ecfr.gov/current/title-7/section-273.13"
    description: >
      Adverse action notice required for denials and closures. Agency must
      provide at least 10 days advance notice before an adverse action takes
      effect, stating the reason and the right to a fair hearing.
    programs: [snap]

  snap-fair-hearing-rights:
    citation: "7 CFR § 273.15(a)"
    citationUrl: "https://www.ecfr.gov/current/title-7/section-273.15"
    description: >
      Every household has the right to a fair hearing to contest any agency
      action affecting their benefits, including delays, denials, reductions,
      and terminations.
    programs: [snap]

  snap-supervisor-review:
    citation: "7 CFR § 273.15"
    citationUrl: "https://www.ecfr.gov/current/title-7/section-273.15"
    description: >
      Applicants have the right to a fair hearing if the agency delays or
      denies benefits. Supervisor review is a prerequisite for escalated cases
      prior to formal hearing proceedings.
    programs: [snap]

  # ── Verification — general ───────────────────────────────────────────────────

  snap-verification-requirements:
    citation: "7 CFR § 273.2(f)"
    citationUrl: "https://www.ecfr.gov/current/title-7/section-273.2"
    description: >
      Before certifying a household, the agency must verify income, identity,
      and residency. Verification may occur via electronic check, document
      review, or interview. States may not require verification of items beyond
      those listed in this section.
    programs: [snap]

  medicaid-electronic-verification-first:
    citation: "42 CFR § 435.940"
    citationUrl: "https://www.ecfr.gov/current/title-42/section-435.940"
    description: >
      When verification is required, electronic data sources must be checked
      before requesting paper documentation from applicants. Applies to
      citizenship, immigration status, and income verification. Paper documents
      may only be requested when an electronic check returns inconclusive.
    programs: [medicaid]

  # ── Notice of eligibility decision ───────────────────────────────────────────

  snap-notice-of-eligibility:
    citation: "7 CFR § 273.2(h)"
    citationUrl: "https://www.ecfr.gov/current/title-7/section-273.2"
    description: >
      Written notice of eligibility or denial must be sent to each applicant
      household within the 30-day processing deadline (7 days for expedited).
      Notice must include the eligibility decision, benefit amount if approved,
      or denial reason if denied.
    programs: [snap]

  medicaid-notice-of-eligibility:
    citation: "42 CFR § 435.917"
    citationUrl: "https://www.ecfr.gov/current/title-42/section-435.917"
    description: >
      Written notice of eligibility, denial, or termination must be sent within
      the 45-day processing deadline (90 days if a disability determination is
      required). Notice must state the decision, the reason, and the applicant's
      right to appeal.
    programs: [medicaid]

  # ── Determination documentation ───────────────────────────────────────────────

  medicaid-determination-documentation:
    citation: "42 CFR § 431.17(b)(1)"
    citationUrl: "https://www.ecfr.gov/current/title-42/section-431.17"
    description: >
      Each eligibility determination must be documented with the date of the
      decision, the regulatory basis for the decision, and all information and
      documents used to support it. Applies to approvals, denials, and
      terminations.
    programs: [medicaid]

  # ── Voter registration ────────────────────────────────────────────────────────

  nvra-voter-registration-offer:
    citation: "42 USC § 1973gg-5"
    citationUrl: "https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title42-section1973gg-5&num=0&edition=prelim"
    description: >
      Public assistance agencies must offer voter registration to every applicant
      and person seeking to renew benefits, and must assist with completing the
      registration form on request. Refusal to register does not affect benefit
      eligibility.
    programs: [snap, medicaid, tanf, chip]

  # ── Household composition — detail ────────────────────────────────────────────

  snap-roomers-boarders:
    citation: "7 CFR § 273.1(b)(5)"
    citationUrl: "https://www.ecfr.gov/current/title-7/section-273.1"
    description: >
      Roomers (persons who pay a household for lodging only) and boarders (persons
      who pay for both lodging and meals) are not SNAP household members because they
      purchase and prepare food separately. Payments received from roomers or boarders
      count as household income.
    programs: [snap]

  snap-strike-disqualification:
    citation: "7 CFR § 273.1(f)"
    citationUrl: "https://www.ecfr.gov/current/title-7/section-273.1"
    description: >
      A household member on strike is ineligible for SNAP unless the household
      was eligible immediately before the strike began. A striking member's income
      from before the strike is counted during the disqualification period.
    programs: [snap]

  snap-pregnancy-household-rules:
    citation: "7 CFR § 273.1(c)"
    citationUrl: "https://www.ecfr.gov/current/title-7/section-273.1"
    description: >
      Each unborn child of a pregnant household member counts as a separate
      household member for SNAP household size determination, increasing the
      maximum allotment.
    programs: [snap]

  snap-military-household-rules:
    citation: "7 CFR § 273.1(b)(2)"
    citationUrl: "https://www.ecfr.gov/current/title-7/section-273.1"
    description: >
      Military members on active duty are SNAP household members. Special income
      treatment applies to combat pay and certain military allowances. Dependents
      living with an active duty member share the same SNAP household.
    programs: [snap]

  snap-institutionalized-household:
    citation: "7 CFR § 273.1(b)(7)"
    citationUrl: "https://www.ecfr.gov/current/title-7/section-273.1"
    description: >
      Residents of institutions (group living facilities, nursing homes, correctional
      facilities) are generally ineligible for SNAP. Exceptions exist for residents
      of certain drug treatment and group living facilities approved for SNAP.
    programs: [snap]

  # ── Utility allowances ────────────────────────────────────────────────────────

  snap-utility-allowance-standards:
    citation: "7 CFR § 273.9(d)(6)"
    citationUrl: "https://www.ecfr.gov/current/title-7/section-273.9"
    description: >
      Households that do not receive LIHEAP may use a standard utility allowance
      instead of actual utility costs. Households that heat or cool their home qualify
      for the full heating and cooling standard (HCSUA). Residents of federally
      subsidized housing where utilities are included in rent are ineligible for
      the HCSUA. Receipt of even one dollar of LIHEAP automatically qualifies the
      household for the HCSUA.
    programs: [snap]

  # ── TANF — work and time limits ───────────────────────────────────────────────

  tanf-time-limits:
    citation: "45 CFR § 264.1"
    citationUrl: "https://www.ecfr.gov/current/title-45/section-264.1"
    description: >
      States must enforce the 60-month lifetime limit on TANF-funded assistance.
      Cross-state receipt is tracked to prevent households from circumventing the
      limit by moving between states. States may use state funds to continue
      assistance after the federal limit is reached.
    programs: [tanf]

  tanf-work-activities:
    citation: "45 CFR § 260.31"
    citationUrl: "https://www.ecfr.gov/current/title-45/section-260.31"
    description: >
      Defines the countable work activities (unsubsidized employment, subsidized
      employment, on-the-job training, work experience, etc.) that satisfy the
      TANF work participation requirement. States must document each activity
      category for federal reporting.
    programs: [tanf]

  tanf-work-participation:
    citation: "45 CFR § 261.22"
    citationUrl: "https://www.ecfr.gov/current/title-45/section-261.22"
    description: >
      States must meet a 50% overall work participation rate and a 90% two-parent
      family rate. Average weekly hours for each recipient are calculated and
      reported monthly. Failure to meet participation rates results in federal
      financial penalties.
    programs: [tanf]

  tanf-voluntary-quit:
    citation: "45 CFR § 261.50"
    citationUrl: "https://www.ecfr.gov/current/title-45/section-261.50"
    description: >
      A TANF recipient who voluntarily quits a job or reduces work hours without
      good cause may be sanctioned, reducing or terminating their benefit. States
      define good cause criteria within federal minimum standards.
    programs: [tanf]

  tanf-child-support-cooperation:
    citation: "42 USC § 608(a)(2)"
    citationUrl: "https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title42-section608&num=0&edition=prelim"
    description: >
      TANF recipients must cooperate with child support enforcement as a condition
      of eligibility. Non-cooperation results in a benefit reduction of at least
      25%. A good cause exception protects recipients for whom cooperation would
      endanger them or their children.
    programs: [tanf]

  tanf-felony-disqualifications:
    citation: "42 USC § 608(a)(9)"
    citationUrl: "https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title42-section608&num=0&edition=prelim"
    description: >
      Individuals fleeing prosecution for a felony or violating probation or parole
      are ineligible for TANF cash assistance. States must verify and report fleeing
      felons to law enforcement agencies.
    programs: [tanf]

  # ── SNAP — expedited processing detail ────────────────────────────────────────

  snap-expedited-screening:
    citation: "7 CFR § 273.2(i)"
    citationUrl: "https://www.ecfr.gov/current/title-7/section-273.2"
    description: >
      Agencies must screen every application on the day it is received for
      expedited service eligibility. Households qualify if gross monthly income
      is below $150 and liquid resources are $100 or less; if combined income and
      liquid resources are less than monthly rent or mortgage plus utilities; or if
      the household contains a migrant or seasonal farm worker with little or no
      income. Expedited benefits must be issued within 7 days.
    programs: [snap]

  # ── SNAP — ABAWD work requirement ────────────────────────────────────────────

  snap-abawd-work-requirement:
    citation: "7 CFR § 273.24"
    citationUrl: "https://www.ecfr.gov/current/title-7/section-273.24"
    description: >
      Able-bodied adults without dependents (ABAWDs) ages 18–49 may receive SNAP
      for only 3 months in a 36-month period unless they work or participate in
      an approved work or training program for at least 80 hours per month.
      Exemptions apply for pregnancy, disability, and caring for a dependent child.
    programs: [snap]

  # ── SNAP — income rules detail ────────────────────────────────────────────────

  snap-unearned-income:
    citation: "7 CFR § 273.9(c)"
    citationUrl: "https://www.ecfr.gov/current/title-7/section-273.9"
    description: >
      Defines countable unearned income types including Social Security benefits,
      SSI, unemployment compensation, workers' compensation, child support, and
      veterans' benefits. Most unearned income is counted in full with limited
      exclusions.
    programs: [snap]

  snap-lump-sum-income:
    citation: "7 CFR § 273.9(c)(14)"
    citationUrl: "https://www.ecfr.gov/current/title-7/section-273.9"
    description: >
      Lump sum payments received by a SNAP household are counted as income in
      the month received. Amounts that push income above the gross income limit
      result in ineligibility only for that month; they do not affect subsequent
      months.
    programs: [snap]

  snap-alimony-deduction:
    citation: "7 CFR § 273.9(d)(5)"
    citationUrl: "https://www.ecfr.gov/current/title-7/section-273.9"
    description: >
      Legally obligated child support and alimony payments made to non-household
      members are deductible from SNAP gross income. Only the legally required
      amount is deductible — voluntary payments above the obligation are not.
    programs: [snap]

  snap-elderly-disabled-deductions:
    citation: "7 CFR § 273.9(d)"
    citationUrl: "https://www.ecfr.gov/current/title-7/section-273.9"
    description: >
      Households with an elderly or disabled member are eligible for an excess
      medical expense deduction (unreimbursed costs above $35/month) in addition
      to the standard deductions. These households are also exempt from the gross
      income test and subject only to the net income test.
    programs: [snap]

  snap-self-employment-expenses:
    citation: "7 CFR § 273.11(b)"
    citationUrl: "https://www.ecfr.gov/current/title-7/section-273.11"
    description: >
      Self-employment income is calculated as gross receipts minus allowable
      business expenses. Deductible expenses include costs of goods sold, labor,
      rent, utilities, depreciation, and taxes directly attributable to the business.
      Personal expenses and capital expenditures are not deductible.
    programs: [snap]

  snap-deeming-rules:
    citation: "7 CFR § 273.11"
    citationUrl: "https://www.ecfr.gov/current/title-7/section-273.11"
    description: >
      Income of a non-applying spouse is deemed to the household. Special income
      averaging rules apply to households with irregular or self-employment income.
      Temporary income changes may be prorated over the benefit period.
    programs: [snap]

  # ── SNAP — SSN and student rules ──────────────────────────────────────────────

  snap-ssn-requirement:
    citation: "7 CFR § 273.6"
    citationUrl: "https://www.ecfr.gov/current/title-7/section-273.6"
    description: >
      Every household member applying for SNAP must provide a Social Security
      Number or apply for one. Members who refuse to provide an SSN are ineligible,
      but their income is still counted toward the household's SNAP calculation.
    programs: [snap]

  snap-student-eligibility-restriction:
    citation: "7 CFR § 273.5"
    citationUrl: "https://www.ecfr.gov/current/title-7/section-273.5"
    description: >
      Students enrolled at least half-time in an institution of higher education
      are ineligible for SNAP unless they meet an exemption: employed 20+ hours
      per week, participating in work-study, responsible for a dependent child
      under 6, receiving TANF, or physically or mentally unable to work.
    programs: [snap]

  # ── SNAP — asset rules detail ─────────────────────────────────────────────────

  snap-asset-disposal-lookback:
    citation: "7 CFR § 273.8(h)"
    citationUrl: "https://www.ecfr.gov/current/title-7/section-273.8"
    description: >
      Households that transfer assets for less than fair market value within
      36 months of application may be disqualified or have the transferred
      value counted as a resource for the period that the transferred amount
      would have made them ineligible.
    programs: [snap]

  # ── SNAP — disqualifications ──────────────────────────────────────────────────

  snap-fleeing-felon-disqualification:
    citation: "7 USC § 2015(k)"
    citationUrl: "https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title7-section2015&num=0&edition=prelim"
    description: >
      Individuals fleeing to avoid prosecution, custody, or confinement for a
      felony are ineligible for SNAP. Individuals violating a condition of probation
      or parole are also ineligible.
    programs: [snap]

  snap-ipv-disqualifications:
    citation: "7 USC § 2015(b)(1)"
    citationUrl: "https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title7-section2015&num=0&edition=prelim"
    description: >
      Conviction for an intentional program violation (IPV) results in a 12-month
      disqualification for the first offense, 24 months for a second, and permanent
      disqualification for a third. Permanent disqualification applies to trafficking
      benefits over $500, trading benefits for firearms or controlled substances, or
      conviction for murder or certain sex offenses under the Agriculture Improvement
      Act of 2018.
    programs: [snap]

  snap-drug-felony-disqualification:
    citation: "21 USC § 862a"
    citationUrl: "https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title21-section862a&num=0&edition=prelim"
    description: >
      Individuals convicted of a federal or state felony for possession, use, or
      distribution of a controlled substance are ineligible for SNAP and TANF
      under federal law. States may opt out of the ban entirely or limit the
      restriction by statute.
    programs: [snap, tanf]

  # ── Medicaid — MAGI methodology ──────────────────────────────────────────────

  medicaid-magi-methodology:
    citation: "42 CFR § 435.603"
    citationUrl: "https://www.ecfr.gov/current/title-42/section-435.603"
    description: >
      Medicaid uses Modified Adjusted Gross Income (MAGI) to determine eligibility
      for most non-elderly, non-disabled individuals. MAGI includes wages, self-
      employment income, Social Security, and most other income sources; it excludes
      child support received, certain Native American income, and tax-exempt interest.
      The tax filing unit (not household) is the unit of calculation. Tax filers
      include their own income; non-filers are evaluated as a separate household.
    programs: [medicaid, chip]

  medicaid-magi-deductions:
    citation: "42 CFR § 435.603(e)"
    citationUrl: "https://www.ecfr.gov/current/title-42/section-435.603"
    description: >
      Above-the-line tax deductions reduce MAGI for Medicaid eligibility purposes.
      Deductible amounts include student loan interest, alimony paid, IRA
      contributions, and self-employment taxes. These deductions are applied at the
      member level and must be annualized for the MAGI income projection.
    programs: [medicaid, chip]

  medicaid-magi-income-projection:
    citation: "42 CFR § 435.603(h)"
    citationUrl: "https://www.ecfr.gov/current/title-42/section-435.603"
    description: >
      When projected annual income differs from annualized current income due to
      a recent change, states must accept the applicant's reasonable projection.
      A change in circumstances (job change, income increase or decrease, new
      household member) is required to support a projection that differs materially
      from annualized pay stubs.
    programs: [medicaid, chip]

  # ── Medicaid — Medicare Savings Program ───────────────────────────────────────

  medicaid-medicare-savings-program:
    citation: "42 CFR § 435.119"
    citationUrl: "https://www.ecfr.gov/current/title-42/section-435.119"
    description: >
      States must provide Medicare Savings Program (MSP) benefits to Medicare
      beneficiaries who meet income and resource limits. MSP categories include
      QMB (pays Part A and B premiums, deductibles, and coinsurance), SLMB
      (pays Part B premium only), QI (pays Part B premium only, federally funded),
      and QDWI (pays Part A premium for certain working disabled individuals).
    programs: [medicaid]

  # ── Medicaid — other eligibility pathways ────────────────────────────────────

  medicaid-pregnancy-eligibility:
    citation: "42 CFR § 435.116"
    citationUrl: "https://www.ecfr.gov/current/title-42/section-435.116"
    description: >
      States must provide Medicaid to pregnant women with income at or below 133%
      FPL. Coverage begins on the date of application and continues through the
      end of the month in which the 60-day postpartum period ends. States may
      extend postpartum coverage to 12 months under the ARP option.
    programs: [medicaid]

  medicaid-ssi-categorical-eligibility:
    citation: "42 CFR § 435.120"
    citationUrl: "https://www.ecfr.gov/current/title-42/section-435.120"
    description: >
      SSI recipients are categorically eligible for Medicaid in most states (1634
      states). Receipt of SSI establishes Medicaid eligibility without a separate
      Medicaid income or resource test. In 209(b) states, a separate determination
      is required using state eligibility criteria no more restrictive than the
      state's January 1972 Medicaid plan.
    programs: [medicaid]

  medicaid-foster-care-extended-eligibility:
    citation: "42 USC § 1396a(a)(10)(A)(ii)(XX)"
    citationUrl: "https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title42-section1396a&num=0&edition=prelim"
    description: >
      Youth who were in foster care and enrolled in Medicaid at age 18 are eligible
      for Medicaid coverage until age 26 regardless of income. Coverage applies to
      youth who aged out of foster care or who left care for adoption or guardianship.
      States must accept applications from eligible youth who were in care in any
      state.
    programs: [medicaid]

  medicaid-retroactive-coverage:
    citation: "42 CFR § 435.915"
    citationUrl: "https://www.ecfr.gov/current/title-42/section-435.915"
    description: >
      Medicaid must cover medical expenses incurred in the three calendar months
      before the month of application if the individual would have been eligible
      during those months. Retroactive coverage applies to all covered Medicaid
      services and does not require a separate application.
    programs: [medicaid]

  medicaid-disability-determination:
    citation: "42 CFR § 435.541"
    citationUrl: "https://www.ecfr.gov/current/title-42/section-435.541"
    description: >
      States must establish criteria and processes for determining disability for
      Medicaid eligibility purposes. States may use SSA disability determinations
      or conduct their own evaluations. A disabling condition must be expected to
      last at least 12 months or result in death.
    programs: [medicaid]

  medicaid-caretaker-relative:
    citation: "42 CFR § 435.4"
    citationUrl: "https://www.ecfr.gov/current/title-42/section-435.4"
    description: >
      A caretaker relative is an adult who lives with and cares for a dependent
      child and who is related to the child within the fifth degree. Caretaker
      relative status is a basis for Medicaid eligibility separate from MAGI
      pathways and is used to determine household composition for MAGI-exempt
      populations.
    programs: [medicaid]

  medicaid-application-signature:
    citation: "42 CFR § 435.907"
    citationUrl: "https://www.ecfr.gov/current/title-42/section-435.907"
    description: >
      States must accept electronic signatures on Medicaid applications. An
      authorized representative may sign on behalf of an applicant. Signature
      certifies that information is accurate and authorizes release of information
      for verification purposes.
    programs: [medicaid]

  medicaid-residency-requirement:
    citation: "42 CFR § 435.403"
    citationUrl: "https://www.ecfr.gov/current/title-42/section-435.403"
    description: >
      Medicaid applicants must be residents of the state in which they apply.
      Residency is established by living in the state with the intent to remain.
      A fixed address is not required; homeless individuals who live in the state
      are residents.
    programs: [medicaid]

  medicaid-third-party-liability:
    citation: "42 CFR § 433.136"
    citationUrl: "https://www.ecfr.gov/current/title-42/section-433.136"
    description: >
      Medicaid is payer of last resort. States must identify third-party liability
      — insurance, workers' compensation, or other coverage — and pursue cost
      avoidance and recovery before paying Medicaid claims. Applicants must
      cooperate with third-party liability identification as a condition of eligibility.
    programs: [medicaid]

  medicaid-medical-support-cooperation:
    citation: "42 CFR § 433.147"
    citationUrl: "https://www.ecfr.gov/current/title-42/section-433.147"
    description: >
      Medicaid applicants must assign their right to medical support and cooperate
      with the state in establishing paternity and obtaining medical support as a
      condition of eligibility. A good cause exception applies when cooperation
      would endanger the applicant or their child.
    programs: [medicaid]

  medicaid-imd-exclusion:
    citation: "42 CFR § 435.1010"
    citationUrl: "https://www.ecfr.gov/current/title-42/section-435.1010"
    description: >
      Medicaid does not cover services for individuals ages 22-64 who are patients
      in an institution for mental diseases (IMD) with more than 16 beds. Exceptions
      exist for short-term acute inpatient stays and for states operating under
      an approved IMD waiver.
    programs: [medicaid]

  medicaid-incarceration-exclusion:
    citation: "42 CFR § 435.1008"
    citationUrl: "https://www.ecfr.gov/current/title-42/section-435.1008"
    description: >
      Incarcerated individuals are ineligible for Medicaid except for inpatient
      hospital services. Individuals detained pending disposition of charges retain
      Medicaid eligibility. Eligibility is suspended (not terminated) during
      incarceration so it can be restored upon release without reapplication.
    programs: [medicaid]

  medicaid-language-access:
    citation: "42 CFR § 435.905(b)"
    citationUrl: "https://www.ecfr.gov/current/title-42/section-435.905"
    description: >
      States must provide translated notices and interpreter services to applicants
      and beneficiaries with limited English proficiency. Written materials must be
      translated into any language spoken by 5% or more of the service area
      population. Interpreter services must be provided free of charge.
    programs: [medicaid, chip]

  medicaid-electronic-notices:
    citation: "42 CFR § 435.918"
    citationUrl: "https://www.ecfr.gov/current/title-42/section-435.918"
    description: >
      States may send notices electronically to applicants and beneficiaries who
      affirmatively opt in to electronic delivery. Electronic notices must be
      equally accessible and must contain the same information as paper notices.
      Paper notices must be sent when an electronic notice cannot be delivered.
    programs: [medicaid]

  # ── Medicaid — Medicare Part D / Part A ───────────────────────────────────────

  medicare-part-a-entitlement:
    citation: "42 USC § 1395c"
    citationUrl: "https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title42-section1395c&num=0&edition=prelim"
    description: >
      Medicare Part A hospital insurance is available to individuals age 65 or
      older who are entitled to Social Security or Railroad Retirement benefits,
      and to disabled individuals who have received SSDI for 24 months. Individuals
      who do not meet the work requirement may enroll by paying a premium.
    programs: [medicaid]

  medicare-part-d-low-income-subsidy:
    citation: "42 USC § 1395w-114"
    citationUrl: "https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title42-section1395w-114&num=0&edition=prelim"
    description: >
      Low Income Subsidy (Extra Help) reduces Part D premiums, deductibles, and
      cost-sharing for Medicare beneficiaries with limited income and resources.
      Individuals receiving full Medicaid, SSI, or MSP benefits are automatically
      eligible. Others may apply through SSA.
    programs: [medicaid]

  # ── CHIP ──────────────────────────────────────────────────────────────────────

  chip-age-eligibility:
    citation: "42 USC § 1397jj"
    citationUrl: "https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title42-section1397jj&num=0&edition=prelim"
    description: >
      CHIP covers targeted low-income children under age 19 who are not eligible
      for Medicaid and who lack other insurance coverage. States set income limits
      up to 300% FPL (or higher with a waiver). CHIP also covers pregnant women
      in states with an unborn child option.
    programs: [chip]

  chip-unborn-child-coverage:
    citation: "42 USC § 1397bb(b)(1)(C)"
    citationUrl: "https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title42-section1397bb&num=0&edition=prelim"
    description: >
      States may elect to cover unborn children from conception through birth
      under CHIP, treating the unborn child as a targeted low-income child for
      purposes of program eligibility. Coverage is provided through the pregnant
      woman; the child is deemed enrolled at birth.
    programs: [chip]

  chip-ai-an-eligibility:
    citation: "42 CFR § 457.125"
    citationUrl: "https://www.ecfr.gov/current/title-42/section-457.125"
    description: >
      American Indian and Alaska Native children are exempt from CHIP cost-sharing
      and must not be charged premiums, enrollment fees, or cost-sharing. States
      must coordinate CHIP eligibility with Indian Health Service and tribal health
      programs.
    programs: [chip]

  # ── ACA — health coverage and tax credits ─────────────────────────────────────

  aca-minimum-essential-coverage:
    citation: "26 USC § 5000A"
    citationUrl: "https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title26-section5000A&num=0&edition=prelim"
    description: >
      Defines minimum essential coverage (MEC) for ACA purposes. MEC includes
      employer-sponsored coverage, Medicare, Medicaid, CHIP, TRICARE, VA coverage,
      and marketplace plans. Coverage must meet MEC standards to satisfy eligibility
      rules for marketplace premium tax credits and to block premium tax credit
      eligibility when offered through an employer.
    programs: [aca, medicaid, chip]

  aca-premium-tax-credit:
    citation: "26 CFR § 1.36B-2"
    citationUrl: "https://www.ecfr.gov/current/title-26/section-1.36B-2"
    description: >
      Premium tax credit eligibility rules for marketplace coverage. A household
      member is ineligible for the credit if they are eligible for other MEC
      (Medicaid, Medicare, employer coverage meeting affordability and minimum
      value standards) or if the employer's lowest-cost self-only plan costs less
      than the applicable percentage of household income.
    programs: [aca]

  aca-employer-coverage-affordability:
    citation: "26 USC § 36B(c)(2)(C)"
    citationUrl: "https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title26-section36B&num=0&edition=prelim"
    description: >
      Employer-sponsored coverage is considered affordable if the employee's
      share of the lowest-cost self-only premium does not exceed the applicable
      percentage of household income (approximately 9.5%, inflation-adjusted
      annually). If employer coverage is affordable and meets minimum value, the
      employee is ineligible for marketplace premium tax credits.
    programs: [aca]

  aca-special-enrollment-periods:
    citation: "45 CFR § 155.420"
    citationUrl: "https://www.ecfr.gov/current/title-45/section-155.420"
    description: >
      Individuals may enroll in marketplace coverage outside open enrollment
      following a qualifying life event: loss of coverage, household size change,
      change in residency, or loss of eligibility for other MEC. The special
      enrollment period is generally 60 days from the qualifying event.
    programs: [aca]

  aca-section-1557-nondiscrimination:
    citation: "ACA § 1557"
    citationUrl: "https://www.ecfr.gov/current/title-45/section-92.207"
    description: >
      Section 1557 prohibits discrimination in health programs and activities on
      the basis of race, color, national origin, sex (including gender identity and
      sexual orientation), age, and disability. Applies to health programs receiving
      federal financial assistance, including state Medicaid and CHIP programs and
      marketplace plans.
    programs: [medicaid, chip, aca]

  # ── Privacy and confidentiality ───────────────────────────────────────────────

  hipaa-confidential-communications:
    citation: "45 CFR § 164.522"
    citationUrl: "https://www.ecfr.gov/current/title-45/section-164.522"
    description: >
      Individuals have the right to request that covered entities send protected
      health information to an alternative address or by alternative means. Health
      plans must accommodate reasonable requests when the individual states that
      disclosure to the usual address could endanger them. Applies particularly to
      domestic violence survivors and recipients of sensitive health services.
    programs: [medicaid, chip, aca]

  # ── Electronic signatures ─────────────────────────────────────────────────────

  esign-act:
    citation: "15 USC § 7001"
    citationUrl: "https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title15-section7001&num=0&edition=prelim"
    description: >
      Electronic signatures and records have the same legal effect as paper
      signatures and documents in interstate commerce. Agencies accepting
      applications electronically must ensure applicants can provide legally
      valid signatures. UETA provides equivalent state-law authority.
    programs: [snap, medicaid, tanf, chip]

  # ── Child support cooperation ─────────────────────────────────────────────────

  snap-child-support-cooperation:
    citation: "45 CFR § 303.6"
    citationUrl: "https://www.ecfr.gov/current/title-45/section-303.6"
    description: >
      SNAP applicants with children who have an absent parent must cooperate with
      child support enforcement as a condition of eligibility for the children.
      Good cause exceptions apply when cooperation would endanger the applicant
      or their children; the applicant must apply for good cause at the time of
      application.
    programs: [snap]

  # ── Immigration — sponsor deeming ─────────────────────────────────────────────

  prwora-sponsor-deeming:
    citation: "8 USC § 1631"
    citationUrl: "https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title8-section1631&num=0&edition=prelim"
    description: >
      Sponsors of immigrant non-citizens are deemed to have provided income and
      resources to the sponsored alien for federal benefit eligibility purposes.
      The sponsor's income and resources are attributed to the non-citizen at
      levels determined by household size. Deeming continues until the non-citizen
      becomes a citizen or completes 40 qualifying quarters of work.
    programs: [snap, medicaid, tanf]

  prwora-affidavit-of-support:
    citation: "8 USC § 1183a"
    citationUrl: "https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title8-section1183a&num=0&edition=prelim"
    description: >
      Sponsors must sign a legally enforceable affidavit of support (Form I-864)
      committing to maintain the sponsored non-citizen at or above 125% of the
      federal poverty level. The affidavit creates a legally enforceable obligation
      that government agencies may use to recover benefit costs from the sponsor.
    programs: [snap, medicaid, tanf]

  prwora-1996-grandfather-exemption:
    citation: "8 USC § 1613(a)"
    citationUrl: "https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title8-section1613&num=0&edition=prelim"
    description: >
      Non-citizens who were lawfully residing in the US on August 22, 1996 and
      who were receiving SNAP or other federal benefits on that date are exempt
      from the 5-year bar on federal benefits. Continuous residence since that
      date is required to qualify for the grandfathering exception.
    programs: [snap, medicaid, tanf]

  prwora-military-alien-exemption:
    citation: "8 USC § 1641(b)(1)"
    citationUrl: "https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title8-section1641&num=0&edition=prelim"
    description: >
      Non-citizens with a qualifying connection to US military service — veterans,
      active duty service members, and their spouses and unmarried dependent children
      — are qualified aliens exempt from PRWORA waiting periods and restrictions
      on federal benefits.
    programs: [snap, medicaid, tanf]

  # ── Residency requirements ────────────────────────────────────────────────────

  snap-residency-requirement:
    citation: "7 CFR § 273.3"
    citationUrl: "https://www.ecfr.gov/current/title-7/section-273.3"
    description: >
      SNAP applicants must be residents of the state in which they apply. Residency
      is established by physical presence with intent to remain; a fixed address
      is not required. Migrant workers and homeless individuals may apply in the
      state where they currently reside.
    programs: [snap]

  tanf-residency-requirement:
    citation: "45 CFR § 260.52"
    citationUrl: "https://www.ecfr.gov/current/title-45/section-260.52"
    description: >
      States may not impose a durational residency requirement on TANF applicants.
      States may pay reduced benefits to recent residents for up to 12 months
      if the sending state's benefit level was lower, subject to federal limits
      established after Saenz v. Roe.
    programs: [tanf]

  # ── SSI — in-kind support ─────────────────────────────────────────────────────

  ssi-in-kind-support:
    citation: "20 CFR § 416.1102"
    citationUrl: "https://www.ecfr.gov/current/title-20/section-416.1102"
    description: >
      In-kind support and maintenance (ISM) — food or shelter received from
      outside the household — reduces an SSI recipient's benefit by up to one-
      third of the federal benefit rate. When a sponsor provides ISM to a
      non-citizen, the value is counted as income for SSI eligibility purposes.
    programs: [medicaid]

  # ── Civil rights and language access ─────────────────────────────────────────

  omb-race-ethnicity-standards:
    citation: "OMB Statistical Policy Directive No. 15"
    citationUrl: "https://www.federalregister.gov/documents/2024/03/29/2024-06469/revisions-to-ombs-statistical-policy-directive-no-15-standards-for-maintaining-collecting-and"
    description: >
      OMB standards require federal agencies and programs receiving federal funds
      to collect race and ethnicity data using prescribed minimum categories.
      Individuals must be able to select all applicable races simultaneously.
      Hispanic or Latino ethnicity is collected separately from race.
    programs: [snap, medicaid, tanf, chip]

  title-vi-civil-rights:
    citation: "42 USC § 2000d"
    citationUrl: "https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title42-section2000d&num=0&edition=prelim"
    description: >
      Programs and activities receiving federal financial assistance may not
      discriminate on the basis of race, color, or national origin. Title VI
      requires agencies to provide meaningful access to persons with limited
      English proficiency through interpreter services and translated materials.
    programs: [snap, medicaid, tanf, chip]

  eo-13166-language-access:
    citation: "Executive Order 13166"
    citationUrl: "https://www.federalregister.gov/documents/2000/08/16/00-20937/improving-access-to-services-for-persons-with-limited-english-proficiency"
    description: >
      Federal agencies and recipients of federal financial assistance must ensure
      meaningful access to services for persons with limited English proficiency.
      Each agency must develop a language access plan, and recipients must provide
      language services free of charge. Applies to all safety net benefit programs.
    programs: [snap, medicaid, tanf, chip]

  # ── MAGI — tax credits and deductions ────────────────────────────────────────

  magi-above-line-deductions:
    citation: "26 USC § 62"
    citationUrl: "https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title26-section62&num=0&edition=prelim"
    description: >
      Defines above-the-line (adjusted gross income) deductions allowable for
      federal income tax purposes that are also deductible for MAGI Medicaid
      eligibility. Includes student loan interest, IRA contributions, self-
      employment taxes and health insurance, alimony paid (pre-2019 agreements),
      and educator expenses.
    programs: [medicaid, chip]

  irs-scholarship-magi-exclusion:
    citation: "26 USC § 117"
    citationUrl: "https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title26-section117&num=0&edition=prelim"
    description: >
      Scholarships and fellowships are excluded from gross income to the extent
      used for qualified tuition and related fees. Amounts used for room, board,
      or other expenses are taxable and count as MAGI income for Medicaid and
      marketplace eligibility purposes.
    programs: [medicaid, chip, aca]

  irs-domestic-violence-filing-exception:
    citation: "IRS Rev. Proc. 2013-34"
    citationUrl: "https://www.irs.gov/pub/irs-drop/rp-13-34.pdf"
    description: >
      Domestic violence survivors may file taxes as head of household or as
      single even when legally married, if they meet conditions for innocent
      spouse or separation of liability relief. This exception allows survivors
      to exclude their abusive spouse's income from their MAGI tax household
      for Medicaid eligibility purposes.
    programs: [medicaid, chip]

  # ── Medicaid — resource rules ─────────────────────────────────────────────────

  medicaid-asset-rules:
    citation: "42 CFR § 435.601"
    citationUrl: "https://www.ecfr.gov/current/title-42/section-435.601"
    description: >
      States operating a Medicaid program with a resource test must apply
      resource limits no more restrictive than those in effect on January 1, 1972.
      MAGI-based eligibility groups are exempt from resource tests. Non-MAGI
      groups (elderly, blind, disabled) may be subject to resource limits
      established by state plan.
    programs: [medicaid]

  # ── AI/AN and tribal health ───────────────────────────────────────────────────

  indian-health-care-improvement-act:
    citation: "25 USC § 1603"
    citationUrl: "https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title25-section1603&num=0&edition=prelim"
    description: >
      Establishes the Indian Health Service and defines its mission to raise the
      health status of American Indians and Alaska Natives to the highest possible
      level. States must coordinate Medicaid and CHIP coverage for AI/AN individuals
      with IHS and tribal health programs, and may not consider IHS services as
      third-party liability.
    programs: [medicaid, chip]
