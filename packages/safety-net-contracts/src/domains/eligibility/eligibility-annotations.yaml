$schema: annotations-schema.yaml
version: "1.0"
domain: eligibility

# ---------------------------------------------------------------------------
# Fact annotations
# Keyed {ruleset}.{fact path}. A fact on each item of a list keeps its whole
# path: medicaidWorkRequirements.reviewMonths[].qualifies. Citations are in the
# platform policy registry.
# ---------------------------------------------------------------------------

facts:

  # ── Medicaid work requirements ─────────────────────────────────────────────

  medicaidWorkRequirements.requirementApplies:
    reason: >
      Most people on Medicaid aren't subject to the requirement. Deciding this first means
      nobody outside it is asked about work or exemptions.
    policies: [medicaid-community-engagement-statute, medicaid-community-engagement-applicability, medicaid-community-engagement-transition]
    programs: [medicaid]

  medicaidWorkRequirements.exemptions:
    reason: >
      Each exemption the person has, longest-lasting first. Any one is enough, and which ones
      apply decides what proof the state can accept.
    policies: [medicaid-community-engagement-exclusions]
    programs: [medicaid]

  medicaidWorkRequirements.isExempt:
    policies: [medicaid-community-engagement-exclusions]
    programs: [medicaid]

  medicaidWorkRequirements.lostExemptStatus:
    reason: >
      A person exempt at the last determination who no longer is, such as a parent whose
      child turned 14, needs to know they now have to meet the requirement.
    policies: [medicaid-community-engagement-exclusions]
    programs: [medicaid]

  medicaidWorkRequirements.isMedicallyFrail:
    reason: >
      Medical frailty needs both a qualifying condition and significant impairment; a
      diagnosis alone isn't enough.
    policies: [medicaid-community-engagement-exclusions]
    programs: [medicaid]

  medicaidWorkRequirements.frailtyCategories:
    policies: [medicaid-community-engagement-exclusions]
    programs: [medicaid]

  medicaidWorkRequirements.reviewMonths[].qualifies:
    reason: >
      A month counts by an exception, a hardship, or qualifying activity or income. Each month
      is judged on its own.
    policies: [medicaid-community-engagement-activities, medicaid-community-engagement-exceptions, medicaid-community-engagement-hardship]
    programs: [medicaid]

  medicaidWorkRequirements.reviewMonths[].qualifiesBy:
    reason: How the month counts, which decides what proof it needs.
    policies: [medicaid-community-engagement-activities, medicaid-community-engagement-exceptions, medicaid-community-engagement-hardship]
    programs: [medicaid]

  medicaidWorkRequirements.reviewMonths[].totalActivityHours:
    policies: [medicaid-community-engagement-activities]
    programs: [medicaid]

  medicaidWorkRequirements.reviewMonths[].hardshipAvailableIfRequested:
    reason: >
      A hospital stay or medical travel excuses a month only if the person asks, so the person
      has to be told they can.
    policies: [medicaid-community-engagement-hardship]
    programs: [medicaid]

  medicaidWorkRequirements.reviewMonths[].proofRule:
    policies: [medicaid-community-engagement-verification]
    programs: [medicaid]

  medicaidWorkRequirements.monthsRequired:
    policies: [medicaid-community-engagement-review-period]
    programs: [medicaid]

  medicaidWorkRequirements.qualifyingMonthCount:
    policies: [medicaid-community-engagement-review-period]
    programs: [medicaid]

  medicaidWorkRequirements.meetsRequirement:
    policies: [medicaid-community-engagement-review-period]
    programs: [medicaid]

  medicaidWorkRequirements.couldAskForHardship:
    reason: >
      A person short of the months required may still qualify by asking for a hardship
      exception for a month that had one.
    policies: [medicaid-community-engagement-hardship]
    programs: [medicaid]

  medicaidWorkRequirements.statementAccepted:
    reason: >
      Whether a signed statement is enough, or documents are needed, depends on the year, the
      state's choices and how the person qualifies.
    policies: [medicaid-community-engagement-verification]
    programs: [medicaid]

  medicaidWorkRequirements.status:
    policies: [medicaid-community-engagement-applicability, medicaid-community-engagement-exclusions, medicaid-community-engagement-review-period]
    programs: [medicaid]

  medicaidWorkRequirements.coverageResult:
    reason: >
      Coverage isn't denied or ended without a notice and 30 days to respond.
    policies: [medicaid-community-engagement-noncompliance]
    programs: [medicaid]

  medicaidWorkRequirements.nextStep:
    policies: [medicaid-community-engagement-verification, medicaid-community-engagement-noncompliance]
    programs: [medicaid]
