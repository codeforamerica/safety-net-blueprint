$schema: annotations-schema.yaml
version: "1.0"
domain: eligibility

# ---------------------------------------------------------------------------
# Fact annotations
# Keyed {ruleset}.{fact path}. A fact on each item of a list keeps its whole
# path: medicaidWorkRequirements.reviewMonths[].qualifies. Citations are in the
# platform policy registry.
# ---------------------------------------------------------------------------

facts:

  # ── Medicaid work requirements ─────────────────────────────────────────────

  medicaidWorkRequirements.requirementApplies:
    reason: >
      Most people on Medicaid aren't subject to the requirement. Deciding this first means
      nobody outside it is asked about work or exemptions.
    policies: [medicaid-community-engagement-statute, medicaid-community-engagement-applicability, medicaid-community-engagement-transition]
    programs: [medicaid]

  medicaidWorkRequirements.notApplicableReason:
    policies: [medicaid-community-engagement-applicability, medicaid-community-engagement-transition]
    programs: [medicaid]

  medicaidWorkRequirements.exemptions:
    reason: >
      Each exemption the person has, longest-lasting first. Any one is enough, and which ones
      apply decides what proof the state can accept.
    policies: [medicaid-community-engagement-exclusions]
    programs: [medicaid]

  medicaidWorkRequirements.isExempt:
    policies: [medicaid-community-engagement-exclusions]
    programs: [medicaid]

  medicaidWorkRequirements.lostExemptStatus:
    reason: >
      A person exempt at the last determination who no longer is, such as a parent whose
      child turned 14, needs to know they now have to meet the requirement.
    policies: [medicaid-community-engagement-exclusions]
    programs: [medicaid]

  medicaidWorkRequirements.isMedicallyFrail:
    reason: >
      Medical frailty needs both a qualifying condition and significant impairment; a
      diagnosis alone isn't enough.
    policies: [medicaid-community-engagement-exclusions]
    programs: [medicaid]

  medicaidWorkRequirements.frailtyCategories:
    policies: [medicaid-community-engagement-exclusions]
    programs: [medicaid]

  medicaidWorkRequirements.reviewMonths[].qualifies:
    reason: >
      A month counts by an exception, a hardship, or qualifying activity or income. Each month
      is judged on its own.
    policies: [medicaid-community-engagement-activities, medicaid-community-engagement-exceptions, medicaid-community-engagement-hardship]
    programs: [medicaid]

  medicaidWorkRequirements.reviewMonths[].qualifiesBy:
    reason: How the month counts, which decides what proof it needs.
    policies: [medicaid-community-engagement-activities, medicaid-community-engagement-exceptions, medicaid-community-engagement-hardship]
    programs: [medicaid]

  medicaidWorkRequirements.reviewMonths[].totalActivityHours:
    policies: [medicaid-community-engagement-activities]
    programs: [medicaid]

  medicaidWorkRequirements.reviewMonths[].hardshipAvailableIfRequested:
    reason: >
      A hospital stay or medical travel excuses a month only if the person asks, so the person
      has to be told they can.
    policies: [medicaid-community-engagement-hardship]
    programs: [medicaid]

  medicaidWorkRequirements.reviewMonths[].proofRule:
    policies: [medicaid-community-engagement-verification]
    programs: [medicaid]

  medicaidWorkRequirements.monthsRequired:
    policies: [medicaid-community-engagement-review-period]
    programs: [medicaid]

  medicaidWorkRequirements.qualifyingMonthCount:
    policies: [medicaid-community-engagement-review-period]
    programs: [medicaid]

  medicaidWorkRequirements.meetsRequirement:
    policies: [medicaid-community-engagement-review-period]
    programs: [medicaid]

  medicaidWorkRequirements.couldAskForHardship:
    reason: >
      A person short of the months required may still qualify by asking for a hardship
      exception for a month that had one.
    policies: [medicaid-community-engagement-hardship]
    programs: [medicaid]

  medicaidWorkRequirements.statementAccepted:
    reason: >
      Whether a signed statement is enough, or documents are needed, depends on the year, the
      state's choices and how the person qualifies.
    policies: [medicaid-community-engagement-verification]
    programs: [medicaid]

  medicaidWorkRequirements.satisfiesRequirement:
    policies: [medicaid-community-engagement-applicability, medicaid-community-engagement-exclusions, medicaid-community-engagement-review-period]
    programs: [medicaid]

  medicaidWorkRequirements.coverageResult:
    reason: >
      Coverage isn't denied or ended without a notice and 30 days to respond.
    policies: [medicaid-community-engagement-noncompliance]
    programs: [medicaid]

  medicaidWorkRequirements.nextStep:
    policies: [medicaid-community-engagement-verification, medicaid-community-engagement-noncompliance]
    programs: [medicaid]

  # ── SNAP work requirements ─────────────────────────────────────────────────
  # Cited only where the regulation was checked: 7 CFR 273.24(a)(1) for the 20
  # hours; 7 CFR 273.7(b)(1), paragraph by paragraph, for caring for a child
  # under 6 or an incapacitated person, unemployment benefits, a treatment
  # program, working 30 hours or earning the minimum wage times 30, and being a
  # student; 7 CFR 273.24 for the age cutoffs, pregnancy, a child in the
  # household and disability. Not cited, because no source was checked: the five
  # situations counted as preventing work, being American Indian, being a
  # migrant farmworker, and the proof rules.

  # Each exemption.
  snapWorkRequirements.ageUnderMinimumExemption:
    policies: [snap-abawd-work-requirement]
    programs: [snap]
  snapWorkRequirements.ageOverMaximumExemption:
    policies: [snap-abawd-work-requirement]
    programs: [snap]
  snapWorkRequirements.receivingBenefitsSsdiExemption:
    policies: [snap-abawd-work-requirement]
    programs: [snap]
  snapWorkRequirements.receivingBenefitsSsiExemption:
    policies: [snap-abawd-work-requirement]
    programs: [snap]
  snapWorkRequirements.receivingBenefitsVeteransDisabilityExemption:
    policies: [snap-abawd-work-requirement]
    programs: [snap]
  snapWorkRequirements.receivingBenefitsWorkersCompensationExemption:
    policies: [snap-abawd-work-requirement]
    programs: [snap]
  snapWorkRequirements.receivingBenefitsDisabilityPensionExemption:
    policies: [snap-abawd-work-requirement]
    programs: [snap]
  snapWorkRequirements.receivingBenefitsInsurancePaymentsExemption:
    policies: [snap-abawd-work-requirement]
    programs: [snap]
  snapWorkRequirements.receivingBenefitsDisabilityMedicaidExemption:
    policies: [snap-abawd-work-requirement]
    programs: [snap]
  snapWorkRequirements.receivingBenefitsOtherExemption:
    policies: [snap-abawd-work-requirement]
    programs: [snap]
  snapWorkRequirements.hasChildExemption:
    policies: [snap-abawd-work-requirement]
    programs: [snap]
  snapWorkRequirements.isPregnantExemption:
    policies: [snap-abawd-work-requirement]
    programs: [snap]
  snapWorkRequirements.caringForChildUnder6Exemption:
    policies: [snap-general-work-requirement]
    programs: [snap]
  snapWorkRequirements.caringForDisabledOrIllPersonExemption:
    policies: [snap-general-work-requirement]
    programs: [snap]
  snapWorkRequirements.hasUnemploymentBenefitsExemption:
    policies: [snap-general-work-requirement]
    programs: [snap]
  snapWorkRequirements.isInAlcoholTreatmentProgramExemption:
    policies: [snap-general-work-requirement]
    programs: [snap]
  snapWorkRequirements.isStudentExemption:
    policies: [snap-general-work-requirement]
    programs: [snap]

  # What gathers them.
  snapWorkRequirements.isAgeExempt:
    policies: [snap-abawd-work-requirement]
    programs: [snap]
  snapWorkRequirements.receivingDisabilityBenefits:
    policies: [snap-abawd-work-requirement]
    programs: [snap]
  snapWorkRequirements.hasOtherExemption:
    policies: [snap-general-work-requirement, snap-abawd-work-requirement]
    programs: [snap]
  snapWorkRequirements.hasExemption:
    policies: [snap-general-work-requirement, snap-abawd-work-requirement]
    programs: [snap]
  snapWorkRequirements.earningsAboveMinimum:
    policies: [snap-general-work-requirement]
    programs: [snap]
  snapWorkRequirements.hasEarningsExemption:
    policies: [snap-general-work-requirement]
    programs: [snap]
  snapWorkRequirements.isExemptFromWorkRules:
    policies: [snap-general-work-requirement, snap-abawd-work-requirement]
    programs: [snap]
  snapWorkRequirements.totalWorkVolunteerAndTrainingHours:
    policies: [snap-abawd-work-requirement]
    programs: [snap]

  # The result.
  snapWorkRequirements.requirementApplies:
    policies: [snap-abawd-work-requirement]
    programs: [snap]
  snapWorkRequirements.notApplicableReason:
    policies: [snap-abawd-work-requirement]
    programs: [snap]
  snapWorkRequirements.isExempt:
    policies: [snap-general-work-requirement, snap-abawd-work-requirement]
    programs: [snap]
  snapWorkRequirements.exemptions:
    policies: [snap-general-work-requirement, snap-abawd-work-requirement]
    programs: [snap]
  snapWorkRequirements.meetsRequirement:
    policies: [snap-abawd-work-requirement]
    programs: [snap]
  snapWorkRequirements.satisfiesRequirement:
    policies: [snap-general-work-requirement, snap-abawd-work-requirement]
    programs: [snap]

# ---------------------------------------------------------------------------
# Constant annotations
# Keyed {ruleset}.{constantName}: the policy that sets each value a state may
