$schema: https://blueprint.codeforamerica.org/schemas/rules-schema.yaml
domain: eligibility

rulesets:

  # Medicaid work requirements, 2027–2028: the community engagement
  # requirement of SSA § 1902(xx) (P.L. 119-21 § 71119) and 42 CFR
  # 435.551–435.562 (CMS-2454-IFC).
  #
  # Four questions, in order: does the requirement apply (435.551); is the
  # person exempt — the regulation's "exclusions", as of the month of
  # application or renewal (435.554); did enough months of the review period
  # count (435.552–435.556); and can it be shown (435.557–435.558).
  #
  # Nothing a person answers has a default, so a result that needs an answer
  # is missing until it's given, and names the answer to ask for. Values a
  # state chooses are constants, which a state overlay changes.
  medicaidWorkRequirements:
    endpoint:
      path: /determinations/evaluate-medicaid-work-requirements

    inputs:
      determination:
        type: object
        properties:
          kind:
            type: string
            enum: [application, renewal, change_in_circumstances]
          # The day the application, renewal or change is decided. Coverage
          # from the day the requirement takes effect is subject to it
          # (435.559(a)), and from documentationRequiredFrom the state can ask
          # for documents (435.557).
          date:
            type: string
            format: date
          # The day the renewal started. A renewal started before the
          # requirement took effect is decided without it (435.559(c)).
          renewalStartedOn:
            type: string
            format: date
          exemptAtLastDetermination:
            type: boolean

      # As of the month of application or renewal.
      person:
        type: object
        properties:
          age:
            type: integer
          inAdultExpansionGroup:
            type: boolean
          hasMedicare:
            type: boolean
          isPregnantOrPostpartum:
            type: boolean
          isAmericanIndianOrAlaskaNative:
            type: boolean
          isFormerFosterYouth:
            type: boolean
          caresForChildUnder14:
            type: boolean
          caresForPersonWithDisability:
            type: boolean
          careRelationship:
            type: string
            enum: [parent_or_guardian, relative, lives_with, other]
          caregivingHoursPerMonth:
            type: number
          isVeteranWithTotalDisability:
            type: boolean
          meetsTanfWorkRequirements:
            type: boolean
          inSnapHousehold:
            type: boolean
          subjectToSnapWorkRules:
            type: boolean
          inSubstanceUseTreatment:
            type: boolean
          isIncarcerated:
            type: boolean

      # Medical frailty (435.554(c)(5)): one of five kinds of condition, and
      # significant impairment.
      health:
        type: object
        properties:
          isBlindOrDisabled:
            type: boolean
          hasSubstanceUseDisorder:
            type: boolean
          yearsInRecovery:
            type: number
          hasDisablingMentalDisorder:
            type: boolean
          hasDisabilityLimitingDailyActivities:
            type: boolean
          hasSeriousOrComplexCondition:
            type: boolean
          conditionSignificantlyImpairsAbilityToMeetRequirement:
            type: boolean

      # Each month the person reports on, by how many months before the month
      # of application or renewal it is (1 = the month before).
      months:
        type: array
        items:
          type: object
          properties:
            monthsBefore:
              type: integer
            # Exceptions (435.553): the month counts.
            wasExempt:
              type: boolean
            wasUnder19:
              type: boolean
            hadMedicare:
              type: boolean
            wasInOtherMandatoryGroup:
              type: boolean
            wasIncarceratedInPrior3Months:
              type: boolean
            # Short-term hardships (435.555): county ones apply on their own,
            # medical ones only when asked for.
            countyHadDisasterOrEmergency:
              type: boolean
            countyHadHighUnemployment:
              type: boolean
            receivedInpatientCare:
              type: boolean
            hadMedicalTravel:
              type: boolean
            askedForHardship:
              type: boolean
            # Qualifying activities (435.552).
            hoursWorked:
              type: number
            hoursCommunityService:
              type: number
            hoursWorkProgram:
              type: number
            enrolledHalfTimeOrMore:
              type: boolean
            educationCreditHours:
              type: number
            educationClassHours:
              type: number
            householdIncome:
              type: number
            isSeasonalWorker:
              type: boolean
            sixMonthAverageIncome:
              type: number

      # The state's own data first; otherwise a notice, with 30 days to
      # respond (435.558).
      verification:
        type: object
        properties:
          stateDataConfirms:
            type: boolean
          response:
            type: string
            enum: [not_yet, responded, no_response]
          proofSent:
            type: string
            enum: [none, statement, documents]
          documentsReasonablyAvailable:
            type: boolean
          frailtyStatementAlreadyUsed:
            type: boolean

    constants:
      effectiveDate:
        value: '2027-01-01'
        type: string
        format: date
        description: Earlier at state option; later only under a CMS good-faith exemption, by December 31, 2028.
      minimumAge:
        value: 19
        type: integer
      maximumAge:
        value: 64
        type: integer
      formerFosterYouthMaximumAge:
        value: 25
        type: integer
      caregiverMinimumMonthlyHours:
        value: 80
        description: For a caregiver who neither lives with nor is related to the person cared for.
      stableRecoveryYears:
        value: 5
      monthlyHoursRequired:
        value: 80
      federalMinimumWage:
        value: 7.25
        description: The federal minimum wage, never a state or local one.
      creditHourWeeklyHours:
        value: 3
        description: Each credit hour counts as this many hours a week.
      weeksPerMonth:
        value: 4.33
      offersHardshipExceptions:
        value: true
        description: State option, all or none (435.555).
      applicationReviewMonths:
        value: 1
        type: integer
        description: 1–3 consecutive months before the month of application (435.556).
      renewalMonthsRequired:
        value: 1
        type: integer
        description: Months, consecutive or not, since the last determination.
      documentationRequiredFrom:
        value: '2028-01-01'
        type: string
        format: date
        description: From this date, documents where reasonably available (435.557).
      acceptsStatementsBeforeDocumentationRequired:
        value: true
        description: State option.
      acceptsStatementsForMandatoryExceptions:
        value: true
        description: State option, any year.
      acceptsFrailtyStatements:
        value: true
        description: State option. From 2028, once per enrollment period.

    outputs:
      requirementApplies: {}
      notApplicableReason: {}
      exemptions: {}
      isExempt: {}
      lostExemptStatus: {}
      frailtyCategories: {}
      isMedicallyFrail: {}
      monthsRequired: {}
      qualifyingMonthCount: {}
      meetsRequirement: {}
      satisfiesRequirement: {}
      couldAskForHardship: {}
      statementAccepted: {}
      coverageResult: {}
      nextStep: {}
      reviewMonths[].qualifies: {}
      reviewMonths[].qualifiesBy: {}
      reviewMonths[].proofRule: {}
      reviewMonths[].hardshipAvailableIfRequested: {}
      reviewMonths[].totalActivityHours: {}

    facts:
      # ── Does the requirement apply? (435.551, 435.559) ──────────────────────
      # A renewal is checked only if it started on or after the requirement took
      # effect (435.559(c)); anything else, by when it's decided, since coverage
      # from then on is subject to it (435.559(a)). So a renewal is never asked
      # its decision date here, nor an application its start.
      - path: requirementInEffect
        expression: >-
          determination.kind == 'renewal'
            ? determination.renewalStartedOn >= constants.effectiveDate
            : determination.date >= constants.effectiveDate
      - path: inAgeRange
        expression: person.age >= constants.minimumAge && person.age <= constants.maximumAge
      - path: requirementApplies
        expression: requirementInEffect && person.inAdultExpansionGroup && inAgeRange && !person.hasMedicare
      # Which condition it doesn't apply by, the first that settles it, so a
      # caller can say why without asking anything requirementApplies didn't.
      - path: notApplicableReason
        expression: >-
          !requirementInEffect ? (determination.kind == 'renewal' ? 'renewal_started_before_requirement' : 'not_yet_in_effect') :
          !person.inAdultExpansionGroup ? 'not_in_expansion_group' :
          person.hasMedicare ? 'has_medicare' :
          !inAgeRange ? 'outside_age_range' : 'applies'

      # ── Medical frailty (435.554(c)(5)) ─────────────────────────────────────
      - path: substanceUseDisorderCounts
        expression: health.hasSubstanceUseDisorder && health.yearsInRecovery < constants.stableRecoveryYears
      - path: frailtyCategories
        expression: >-
          (health.isBlindOrDisabled ? ['blind_or_disabled'] : []) +
          (substanceUseDisorderCounts ? ['substance_use_disorder'] : []) +
          (health.hasDisablingMentalDisorder ? ['disabling_mental_disorder'] : []) +
          (health.hasDisabilityLimitingDailyActivities ? ['disability_limiting_daily_activities'] : []) +
          (health.hasSeriousOrComplexCondition ? ['serious_or_complex_condition'] : [])
      - path: isMedicallyFrail
        expression: size(frailtyCategories) > 0 && health.conditionSignificantlyImpairsAbilityToMeetRequirement

      # ── Is the person exempt? (435.554), longest-lasting first ──────────────
      # One fact per exemption, and only these read the answers that grant one,
      # so a question an exemption doesn't need — how a caregiver is related,
      # for someone who cares for no one — is never asked.
      - path: isQualifyingCaregiver
        expression: >-
          person.careRelationship != 'other' ||
          person.caregivingHoursPerMonth >= constants.caregiverMinimumMonthlyHours
      - path: americanIndianOrAlaskaNativeExemption
        expression: person.isAmericanIndianOrAlaskaNative
      - path: veteranWithTotalDisabilityExemption
        expression: person.isVeteranWithTotalDisability
      - path: formerFosterYouthExemption
        expression: person.isFormerFosterYouth && person.age <= constants.formerFosterYouthMaximumAge
      - path: caregiverOfChildUnder14Exemption
        expression: person.caresForChildUnder14 && isQualifyingCaregiver
      - path: caregiverOfPersonWithDisabilityExemption
        expression: person.caresForPersonWithDisability && isQualifyingCaregiver
      - path: pregnantOrPostpartumExemption
        expression: person.isPregnantOrPostpartum
      - path: snapWorkRulesExemption
        expression: person.inSnapHousehold && person.subjectToSnapWorkRules
      - path: tanfWorkRulesExemption
        expression: person.meetsTanfWorkRequirements
      - path: substanceUseTreatmentExemption
        expression: person.inSubstanceUseTreatment
      - path: incarceratedExemption
        expression: person.isIncarcerated
      - path: exemptions
        expression: >-
          (americanIndianOrAlaskaNativeExemption ? ['american_indian_or_alaska_native'] : []) +
          (veteranWithTotalDisabilityExemption ? ['veteran_with_total_disability'] : []) +
          (formerFosterYouthExemption ? ['former_foster_youth'] : []) +
          (isMedicallyFrail ? ['medically_frail'] : []) +
          (caregiverOfChildUnder14Exemption ? ['caregiver_of_child_under_14'] : []) +
          (caregiverOfPersonWithDisabilityExemption ? ['caregiver_of_person_with_disability'] : []) +
          (pregnantOrPostpartumExemption ? ['pregnant_or_postpartum'] : []) +
          (snapWorkRulesExemption ? ['snap_work_rules'] : []) +
          (tanfWorkRulesExemption ? ['tanf_work_rules'] : []) +
          (substanceUseTreatmentExemption ? ['substance_use_treatment'] : []) +
          (incarceratedExemption ? ['incarcerated'] : [])
      - path: isExempt
        expression: requirementApplies && size(exemptions) > 0
      - path: lostExemptStatus
        expression: determination.exemptAtLastDetermination && !isExempt

      # ── The review period (435.552–435.556) ─────────────────────────────────
      # At application, the months just before it, all of which must count. At
      # renewal or a change, any months since the last determination.
      - path: isApplication
        expression: determination.kind == 'application'
      - path: monthsRequired
        expression: 'isApplication ? constants.applicationReviewMonths : constants.renewalMonthsRequired'
      - path: reviewMonths
        as: month
        expression: 'isApplication ? months.filter(m, m.monthsBefore <= constants.applicationReviewMonths) : months'
      - path: incomeRequired
        expression: constants.monthlyHoursRequired * constants.federalMinimumWage

      - path: reviewMonths[].mandatoryException
        expression: >-
          month.wasExempt || month.wasUnder19 || month.hadMedicare ||
          month.wasInOtherMandatoryGroup || month.wasIncarceratedInPrior3Months
      - path: reviewMonths[].automaticHardshipException
        expression: >-
          constants.offersHardshipExceptions &&
          (month.countyHadDisasterOrEmergency || month.countyHadHighUnemployment)
      - path: reviewMonths[].hardshipAvailableIfRequested
        expression: constants.offersHardshipExceptions && (month.receivedInpatientCare || month.hadMedicalTravel)
      - path: reviewMonths[].requestedHardshipException
        expression: month.hardshipAvailableIfRequested && month.askedForHardship
      - path: reviewMonths[].educationHours
        expression: >-
          month.educationCreditHours * constants.creditHourWeeklyHours * constants.weeksPerMonth +
          month.educationClassHours
      - path: reviewMonths[].totalActivityHours
        expression: month.hoursWorked + month.hoursCommunityService + month.hoursWorkProgram + month.educationHours
      - path: reviewMonths[].meetsActivityHours
        expression: month.totalActivityHours >= constants.monthlyHoursRequired
      - path: reviewMonths[].meetsIncome
        expression: month.householdIncome >= incomeRequired
      - path: reviewMonths[].meetsSeasonalIncome
        expression: month.isSeasonalWorker && month.sixMonthAverageIncome >= incomeRequired
      - path: reviewMonths[].qualifies
        expression: >-
          month.mandatoryException || month.automaticHardshipException || month.requestedHardshipException ||
          month.meetsIncome || month.meetsSeasonalIncome || month.enrolledHalfTimeOrMore || month.meetsActivityHours
      - path: reviewMonths[].qualifiesBy
        expression: >-
          month.mandatoryException ? 'mandatory_exception' :
          month.automaticHardshipException ? 'automatic_hardship' :
          month.requestedHardshipException ? 'requested_hardship' :
          month.meetsIncome ? 'income' :
          month.meetsSeasonalIncome ? 'seasonal_income' :
          month.enrolledHalfTimeOrMore ? 'half_time_education' :
          month.meetsActivityHours ? 'activity_hours' : 'none'
      # none_needed: the state's county data shows it. exception: a statement
      # is enough. standard: a statement in 2027, documents from 2028.
      - path: reviewMonths[].proofRule
        expression: "month.automaticHardshipException ? 'none_needed' : month.mandatoryException ? 'exception' : 'standard'"

      - path: qualifyingMonthCount
        expression: size(reviewMonths.filter(m, m.qualifies))
      - path: meetsRequirement
        expression: qualifyingMonthCount >= monthsRequired
      - path: couldAskForHardship
        expression: '!meetsRequirement && reviewMonths.exists(m, !m.qualifies && m.hardshipAvailableIfRequested)'

      # ── Can it be shown? (435.557) ──────────────────────────────────────────
      - path: beforeDocumentationRequired
        expression: determination.date < constants.documentationRequiredFrom
      # The state's option first, so a state that doesn't take statements
      # before then never asks when the decision is.
      - path: statementAcceptedGenerally
        expression: >-
          (constants.acceptsStatementsBeforeDocumentationRequired && beforeDocumentationRequired) ||
          !verification.documentsReasonablyAvailable
      - path: frailtyStatementAccepted
        expression: >-
          isMedicallyFrail && constants.acceptsFrailtyStatements &&
          (beforeDocumentationRequired ? constants.acceptsStatementsBeforeDocumentationRequired : !verification.frailtyStatementAlreadyUsed)
      - path: hasExemptionOtherThanFrailty
        expression: 'size(exemptions) > (isMedicallyFrail ? 1 : 0)'
      - path: statementAcceptedForExemption
        expression: (hasExemptionOtherThanFrailty && statementAcceptedGenerally) || frailtyStatementAccepted
      - path: monthsNeedingNoProof
        expression: "size(reviewMonths.filter(m, m.qualifies && m.proofRule == 'none_needed'))"
      - path: monthsShownByExceptionStatement
        expression: >-
          size(reviewMonths.filter(m, m.qualifies && (m.proofRule == 'none_needed' ||
          (m.proofRule == 'exception' && constants.acceptsStatementsForMandatoryExceptions))))
      - path: statementAcceptedForReviewPeriod
        expression: statementAcceptedGenerally || monthsShownByExceptionStatement >= monthsRequired
      - path: statementAccepted
        expression: 'isExempt ? statementAcceptedForExemption : statementAcceptedForReviewPeriod'
      - path: sentDocuments
        expression: verification.response == 'responded' && verification.proofSent == 'documents'
      - path: sentStatement
        expression: verification.response == 'responded' && verification.proofSent == 'statement'

      # Shown by the exemption, or by the review period.
      - path: exemptionShown
        expression: >-
          isExempt && (verification.stateDataConfirms || sentDocuments ||
          (sentStatement && statementAcceptedForExemption))
      - path: reviewPeriodShown
        expression: >-
          meetsRequirement && (monthsNeedingNoProof >= monthsRequired || verification.stateDataConfirms ||
          (!isExempt && (sentDocuments || (sentStatement && statementAcceptedForReviewPeriod))))

      # ── The result (435.558) ────────────────────────────────────────────────
      - path: hasBasis
        expression: isExempt || meetsRequirement
      - path: isCovered
        expression: '!requirementApplies || exemptionShown || reviewPeriodShown'
      # Whether the person is all right under the requirement: it doesn't
      # apply, they're exempt, or enough months counted. Whether that's shown
      # is isCovered's question.
      - path: satisfiesRequirement
        expression: '!requirementApplies || isExempt || meetsRequirement'
      - path: coverageResult
        expression: >-
          isCovered ? (isApplication ? 'gets_coverage' : 'keeps_coverage') :
          verification.response == 'not_yet' ? 'notice_respond_within_30_days' :
          isApplication ? 'application_denied' : 'loses_coverage'
      - path: nextStep
        expression: >-
          isCovered ? 'none' :
          verification.response != 'not_yet' ? 'reapply_or_ask_for_reconsideration' :
          couldAskForHardship ? 'ask_for_hardship_exception' :
          hasBasis && statementAccepted ? 'send_statement_or_documents' :
          isExempt && !hasExemptionOtherThanFrailty ? 'send_health_records' :
          hasBasis ? 'send_documents' : 'show_another_way_to_qualify'

  # SNAP work requirements: the general work requirement (7 CFR 273.7) and the
  # time limit's age and exemption rules (7 CFR 273.24), for one person.
  #
  # Ported from the work rules of codeforamerica/work-requirements-self-advocacy-tool,
  # by way of codeforamerica/co-snap-interview-prompts (feature/work-rules,
  # contracts/work-rules/), whose intake-work-rules-source-annotations.yaml maps
  # each name here to the tool's code. The facts keep that port's logic and
  # names; the outputs share Medicaid's vocabulary — requirementApplies,
  # exemptions, isExempt, meetsRequirement, satisfiesRequirement — with age deciding whether
  # the requirement applies, as the tool's own result does first.
  #
  # Nothing a person answers has a default. A state adds its own exemptions by
  # overlay, through the three state facts below.
  snapWorkRequirements:
    endpoint:
      path: /determinations/evaluate-snap-work-requirements

    inputs:
      person:
        type: object
        properties:
          age:
            type: integer
            minimum: 0
          isAmericanIndian:
            type: boolean
          hasChild:
            type: boolean
          caringForChildUnder6:
            type: boolean
          caringForDisabledOrIllPerson:
            type: boolean
          isPregnant:
            type: boolean
          hasUnemploymentBenefits:
            type: boolean
          receivingBenefitsSsdi:
            type: boolean
          receivingBenefitsSsi:
            type: boolean
          receivingBenefitsVeteransDisability:
            type: boolean
          receivingBenefitsWorkersCompensation:
            type: boolean
          receivingBenefitsDisabilityPension:
            type: boolean
          receivingBenefitsInsurancePayments:
            type: boolean
          receivingBenefitsDisabilityMedicaid:
            type: boolean
          receivingBenefitsOther:
            type: boolean
          isMigrantFarmworker:
            type: boolean
          isStudent:
            type: boolean
          isInAlcoholTreatmentProgram:
            type: boolean
          preventingWorkPlaceToSleep:
            type: boolean
          preventingWorkDrugsAlcohol:
            type: boolean
          preventingWorkDomesticViolence:
            type: boolean
          preventingWorkMedicalCondition:
            type: boolean
          preventingWorkOther:
            type: boolean
          isWorking:
            type: boolean
          workingHours:
            type: integer
          workingWeeklyEarnings:
            type: number
          isVolunteer:
            type: boolean
          volunteeringHours:
            type: integer
          isInWorkTraining:
            type: boolean
          workTrainingHours:
            type: integer

    constants:
      workRulesMinimumAge:
        value: 18
        type: integer
        description: Younger is outside the work rules.
      workRulesMaximumAge:
        value: 64
        type: integer
        description: Older is outside the work rules.
      weeklyHoursRequired:
        value: 20
        type: integer
        description: Hours of work, volunteering and training a week that meet the work rules.
      earningsExemptionWeeklyHours:
        value: 30
        type: integer
        description: Working this many hours a week exempts a person.
      earningsExemptionWeeklyAmount:
        value: 217.50
        description: Earning this much a week exempts a person — the federal minimum wage times 30.
      requiresProofOfVolunteering:
        value: true
      requiresProofOfAmericanIndianStatus:
        value: false

    outputs:
      requirementApplies: {}
      notApplicableReason: {}
      exemptions: {}
      isExempt: {}
      meetsRequirement: {}
      satisfiesRequirement: {}
      hasExemption: {}
      hasEarningsExemption: {}
      anyPreventingWork: {}
      requiresProof: {}
      needsProofOfVolunteering: {}
      americanIndianExemptionRequiresProof: {}

    # One fact per exemption, and only these read the answers that grant one.
    # Everything else reads these by name, so each exemption's condition is
    # written once.
    facts:
      # State hooks. A state overlay replaces these; federally there is nothing.
      - path: hasStateExemption
        type: boolean
        expression: 'false'
      - path: extraPreventingWork
        type: boolean
        expression: 'false'
      - path: stateExemptionReasons
        type: array
        expression: '[]'

      # Each exemption.
      - path: ageUnderMinimumExemption
        type: boolean
        expression: person.age < constants.workRulesMinimumAge
      - path: ageOverMaximumExemption
        type: boolean
        expression: person.age > constants.workRulesMaximumAge
      - path: receivingBenefitsSsdiExemption
        type: boolean
        expression: person.receivingBenefitsSsdi
      - path: receivingBenefitsSsiExemption
        type: boolean
        expression: person.receivingBenefitsSsi
      - path: receivingBenefitsVeteransDisabilityExemption
        type: boolean
        expression: person.receivingBenefitsVeteransDisability
      - path: receivingBenefitsWorkersCompensationExemption
        type: boolean
        expression: person.receivingBenefitsWorkersCompensation
      - path: receivingBenefitsDisabilityPensionExemption
        type: boolean
        expression: person.receivingBenefitsDisabilityPension
      - path: receivingBenefitsInsurancePaymentsExemption
        type: boolean
        expression: person.receivingBenefitsInsurancePayments
      - path: receivingBenefitsDisabilityMedicaidExemption
        type: boolean
        expression: person.receivingBenefitsDisabilityMedicaid
      - path: receivingBenefitsOtherExemption
        type: boolean
        expression: person.receivingBenefitsOther
      - path: preventingWorkDomesticViolenceExemption
        type: boolean
        expression: person.preventingWorkDomesticViolence
      - path: preventingWorkDrugsAlcoholExemption
        type: boolean
        expression: person.preventingWorkDrugsAlcohol
      - path: preventingWorkMedicalConditionExemption
        type: boolean
        expression: person.preventingWorkMedicalCondition
      - path: preventingWorkOtherExemption
        type: boolean
        expression: person.preventingWorkOther
      - path: preventingWorkPlaceToSleepExemption
        type: boolean
        expression: person.preventingWorkPlaceToSleep
      - path: caringForChildUnder6Exemption
        type: boolean
        expression: person.caringForChildUnder6
      - path: caringForDisabledOrIllPersonExemption
        type: boolean
        expression: person.caringForDisabledOrIllPerson
      - path: hasChildExemption
        type: boolean
        expression: person.hasChild
      - path: hasUnemploymentBenefitsExemption
        type: boolean
        expression: person.hasUnemploymentBenefits
      - path: isAmericanIndianExemption
        type: boolean
        expression: person.isAmericanIndian
      - path: isInAlcoholTreatmentProgramExemption
        type: boolean
        expression: person.isInAlcoholTreatmentProgram
      - path: isMigrantFarmworkerExemption
        type: boolean
        expression: person.isMigrantFarmworker
      - path: isPregnantExemption
        type: boolean
        expression: person.isPregnant
      - path: isStudentExemption
        type: boolean
        expression: person.isStudent

      # Exemptions in groups.
      - path: isAgeExempt
        type: boolean
        expression: ageUnderMinimumExemption || ageOverMaximumExemption
      - path: receivingDisabilityBenefits
        type: boolean
        expression: >-
          receivingBenefitsSsdiExemption || receivingBenefitsSsiExemption || receivingBenefitsVeteransDisabilityExemption ||
          receivingBenefitsWorkersCompensationExemption || receivingBenefitsDisabilityPensionExemption ||
          receivingBenefitsInsurancePaymentsExemption || receivingBenefitsDisabilityMedicaidExemption ||
          receivingBenefitsOtherExemption
      - path: anyListedPreventingWork
        type: boolean
        expression: >-
          preventingWorkDomesticViolenceExemption || preventingWorkDrugsAlcoholExemption || preventingWorkMedicalConditionExemption ||
          preventingWorkOtherExemption || preventingWorkPlaceToSleepExemption
      - path: hasOtherExemption
        type: boolean
        expression: >-
          caringForChildUnder6Exemption || caringForDisabledOrIllPersonExemption ||
          hasChildExemption || hasUnemploymentBenefitsExemption ||
          isAmericanIndianExemption || isInAlcoholTreatmentProgramExemption ||
          isMigrantFarmworkerExemption || isPregnantExemption || isStudentExemption
      - path: hasExemption
        type: boolean
        expression: >-
          isAgeExempt || receivingDisabilityBenefits || anyListedPreventingWork ||
          hasOtherExemption || hasStateExemption
      - path: earningsAboveMinimum
        type: boolean
        expression: person.workingWeeklyEarnings >= constants.earningsExemptionWeeklyAmount
      - path: workingEarningsExemptionHours
        type: boolean
        expression: person.workingHours >= constants.earningsExemptionWeeklyHours
      - path: hasEarningsExemption
        type: boolean
        expression: person.isWorking && (workingEarningsExemptionHours || earningsAboveMinimum)
      - path: isExemptFromWorkRules
        type: boolean
        expression: hasExemption || hasEarningsExemption
      - path: anyPreventingWork
        type: boolean
        expression: anyListedPreventingWork || extraPreventingWork

      # Whether the work rules are met. Hours count only for what the person
      # does, so someone who doesn't volunteer is never asked how many hours.
      # One fact each: the engine settles a conditional at the top of an
      # expression, not inside a sum.
      - path: countedWorkingHours
        type: integer
        expression: 'person.isWorking ? person.workingHours : 0'
      - path: countedVolunteeringHours
        type: integer
        expression: 'person.isVolunteer ? person.volunteeringHours : 0'
      - path: countedWorkTrainingHours
        type: integer
        expression: 'person.isInWorkTraining ? person.workTrainingHours : 0'
      - path: totalWorkVolunteerAndTrainingHours
        type: integer
        expression: countedWorkingHours + countedVolunteeringHours + countedWorkTrainingHours
      - path: meetsRequirement
        type: boolean
        expression: totalWorkVolunteerAndTrainingHours >= constants.weeklyHoursRequired

      # Proof.
      - path: isVolunteering
        type: boolean
        expression: person.isVolunteer && person.volunteeringHours > 0
      - path: needsProofOfVolunteering
        type: boolean
        expression: constants.requiresProofOfVolunteering && isVolunteering
      - path: americanIndianExemptionRequiresProof
        type: boolean
        expression: constants.requiresProofOfAmericanIndianStatus && isAmericanIndianExemption
      - path: requiresProof
        type: boolean
        expression: >-
          (earningsAboveMinimum && !isExemptFromWorkRules) || isStudentExemption ||
          preventingWorkDrugsAlcoholExemption || preventingWorkMedicalConditionExemption || receivingDisabilityBenefits ||
          isInAlcoholTreatmentProgramExemption || americanIndianExemptionRequiresProof

      # The result, in the vocabulary Medicaid's work requirements share. Age
      # decides whether the requirement applies at all.
      - path: requirementApplies
        type: boolean
        expression: '!isAgeExempt'
      # Which age cutoff it doesn't apply by.
      - path: notApplicableReason
        type: string
        expression: "ageUnderMinimumExemption ? 'under_minimum_age' : ageOverMaximumExemption ? 'over_maximum_age' : 'applies'"
      - path: isExempt
        type: boolean
        expression: requirementApplies && isExemptFromWorkRules
      # The exemption codes, one per exemption that holds. Age isn't among them:
      # it decides whether the requirement applies.
      - path: exemptions
        type: array
        expression: >-
          (receivingBenefitsSsdiExemption ? ['receiving_benefits_ssdi'] : []) +
          (receivingBenefitsSsiExemption ? ['receiving_benefits_ssi'] : []) +
          (receivingBenefitsVeteransDisabilityExemption ? ['receiving_benefits_veterans_disability'] : []) +
          (receivingBenefitsWorkersCompensationExemption ? ['receiving_benefits_workers_compensation'] : []) +
          (receivingBenefitsDisabilityPensionExemption ? ['receiving_benefits_disability_pension'] : []) +
          (receivingBenefitsInsurancePaymentsExemption ? ['receiving_benefits_insurance_payments'] : []) +
          (receivingBenefitsDisabilityMedicaidExemption ? ['receiving_benefits_disability_medicaid'] : []) +
          (receivingBenefitsOtherExemption ? ['receiving_benefits_other'] : []) +
          (preventingWorkDomesticViolenceExemption ? ['preventing_work_domestic_violence'] : []) +
          (preventingWorkDrugsAlcoholExemption ? ['preventing_work_drugs_alcohol'] : []) +
          (preventingWorkMedicalConditionExemption ? ['preventing_work_medical_condition'] : []) +
          (preventingWorkOtherExemption ? ['preventing_work_other'] : []) +
          (preventingWorkPlaceToSleepExemption ? ['preventing_work_place_to_sleep'] : []) +
          (caringForChildUnder6Exemption ? ['caring_for_child_under_6'] : []) +
          (caringForDisabledOrIllPersonExemption ? ['caring_for_disabled_or_ill_person'] : []) +
          (hasChildExemption ? ['has_child'] : []) +
          (hasUnemploymentBenefitsExemption ? ['has_unemployment_benefits'] : []) +
          (isAmericanIndianExemption ? ['is_american_indian'] : []) +
          (isInAlcoholTreatmentProgramExemption ? ['is_in_alcohol_treatment_program'] : []) +
          (isMigrantFarmworkerExemption ? ['is_migrant_farmworker'] : []) +
          (isPregnantExemption ? ['is_pregnant'] : []) +
          (isStudentExemption ? ['is_student'] : []) +
          stateExemptionReasons +
          (hasEarningsExemption ? ['earnings_exemption'] : [])
      # Whether the person is all right under the work rules: they don't
      # apply, the person is exempt, or the hours are met.
      - path: satisfiesRequirement
        type: boolean
        expression: '!requirementApplies || isExempt || meetsRequirement'
