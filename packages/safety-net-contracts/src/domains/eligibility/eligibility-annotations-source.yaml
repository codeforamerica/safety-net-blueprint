$schema: annotations-schema.yaml
version: '1.0'
domain: eligibility

# ---------------------------------------------------------------------------
# Where the work requirements rulesets differ from their sources
#
#   snapWorkRequirements      the SNAP work rules of the self-advocacy tool,
#                             codeforamerica/work-requirements-self-advocacy-tool
#                             at commit 7de6bff (2026-10-13), by way of
#                             co-snap-interview-prompts' workRules
#                             (feature/work-rules). The tool is the source:
#                             every difference here is from the tool.
#   medicaidWorkRequirements  the draft Medicaid community engagement rules:
#                             rules.yaml (two rulesets, one per month and one
#                             per person), states.yaml and scenarios.yaml.
#
# Only what differs is listed. An input, constant or fact that is one-to-one
# with its source, under the same name and logic, has no entry.
#
#   source        the source's name for it; none when it's introduced
#   sourceFile    a link to it in the tool, pinned to the commit
#   mapping       renamed     the same logic under another name
#                 changed     one-to-one, but reshaped: a different type,
#                             logic or structure
#                 derived     no single counterpart: built from part of
#                             something in the source
#                 introduced  nothing in the source corresponds; the note
#                             says why it's here
#   mapping-rules the translation rules it follows, stated once in
#                 eligibility-registry-mapping-rules.yaml
#   note          what's particular to it
#
# North Carolina's overlay (states/nc.yaml) adds entries for the inputs,
# constants and facts it adds.
#
# What has no input, constant or fact to annotate:
#
# SNAP
#   - No outcome string (the tool's four outcomes): satisfiesRequirement,
#     requirementApplies, isExempt and meetsRequirement carry the same
#     information. The tool's record of exemptions found, and when, is gone.
#   - No state input or unsupported location: a state's rules come from its
#     file in states/, and the rules always answer. County and zip code, used
#     only to find an office, are gone.
#   - No order of questions (the tool's ScreenerNavigation and each page's
#     show?). The tool skips questions — none after an age exemption, no work
#     questions once a person has another exemption — and reads a skipped
#     question as no. Here a result waits on the answers it needs.
#   - The tool clears answers on save: hours and earnings when the person
#     says no, and North Carolina answers its pages didn't ask. The counted
#     hours facts do this for hours; nothing does it for earnings or North
#     Carolina's health question (see earningsAboveMinimum and, in the NC
#     overlay, healthConditionsPreventingWork).
#   - No range on hours (the tool takes 1 to 168) and no question wording.
#   - The tool's "none of these" boxes, its birth date and age, and fields no
#     rule reads (names, contact details, signature, survey answers) aren't
#     ported.
#   - Scenarios (tests/scenarios/snap-work-requirements.yaml) are co-snap's
#     cases, as YAML, with an `unanswered` block for the defaults that are
#     gone. Age cases expect requirementApplies false and no age code in
#     exemptions. Outcome cases check the four results instead of a string.
#     Combined-hours cases say yes to working, volunteering and training.
#     New: hours for something the person doesn't do don't count. co-snap's
#     per-exemption cases and its Fact Graph comparison weren't ported.
#   - Delaware: requiresProofOfAmericanIndianStatus is true, as in the tool.
#     The other states' files change nothing for SNAP; the tool supports only
#     Delaware and North Carolina.
#
# Medicaid
#   - The draft's per-month ruleset is per-item facts on reviewMonths, worked
#     out only for months in the review period (rule one-ruleset). A
#     scenario's expectMonths counts review-period months.
#   - The draft's status output (four values) is satisfiesRequirement, with
#     requirementApplies, isExempt and meetsRequirement.
#   - No question wording, and with it two conditions that lived only there:
#     caregiving must be regular, and a person whose dependent traveled for
#     care without them must show they missed work or activities.
#   - answers.yaml (resident-facing text and FAQ) and the county
#     unemployment list aren't ported.
#   - Scenarios (tests/scenarios/medicaid-work-requirements.yaml): the
#     draft's 44, plus other-application-submitted-before and
#     iowa-before-start. Each status expectation is the separate results it
#     stood for; years are dates; an `unanswered` block holds the draft's
#     defaults, with a renewal started on the federal start day.
#   - States: seven have overlays (AR, DE, IA, ID, IN, NC, UT), matching
#     states.yaml apart from renamed constants and Iowa's start as a date.
#     The other 37 in states.yaml have none, so the federal values apply,
#     including Montana's and Nebraska's earlier starts. Two notes at the top
#     of states.yaml aren't carried: renewalMonthsRequired reads KFF's
#     "renewal look-back period", and frailtyDefinitionPlan was asked before
#     the federal rule.
# ---------------------------------------------------------------------------

inputs:

  medicaidWorkRequirements.determination.date:
    source: determination.year
    mapping: changed
    mapping-rules: [dates-not-years, no-defaults]
    note: >-
      The draft asked for the year of the decision, as an integer. The ruleset asks for the day it's
      decided, as a date, so a start partway through a year, like Iowa's December 1, 2026, can be
      expressed. A renewal is never asked this to decide whether the requirement applies; it's
      still asked for the proof rules (beforeDocumentationRequired).

  medicaidWorkRequirements.determination.renewalStartedOn:
    source: determination.startedBeforeRequirement
    mapping: changed
    mapping-rules: [dates-not-years, no-defaults]
    note: >-
      The draft asked yes or no: was the application submitted, or the renewal started, before the
      requirement took effect? The ruleset asks for the day a renewal started, as a date, and only
      renewals read it, because 42 CFR 435.559(c) excuses only a renewal started before the start.
      The draft also excused an application submitted before, which 435.559 doesn't say.

  medicaidWorkRequirements.determination.exemptAtLastDetermination:
    source: determination.excludedAtLastDetermination
    mapping: renamed
    mapping-rules: [exclusions-are-exemptions, no-defaults]
    note: Same question, with "exempt" for the draft's "excluded".

  medicaidWorkRequirements.months[].monthsBefore:
    source: reviewMonth.month.monthsBefore
    mapping: renamed
    mapping-rules: [one-ruleset, no-questions]
    note: >-
      Now a field of each item in `months`. The draft marked it required and filled from state
      data; the ruleset has neither marker.

  medicaidWorkRequirements.months[].wasExempt:
    source: reviewMonth.month.wasExcluded
    mapping: renamed
    mapping-rules: [one-ruleset, exclusions-are-exemptions, no-defaults]
    note: >-
      Whether an exemption applied for any part of the month (435.553), with "exempt" for
      "excluded".

  medicaidWorkRequirements.months[].wasUnder19:
    source: reviewMonth.month.wasUnder19
    mapping: renamed
    mapping-rules: [one-ruleset, no-defaults]
    note: Now a field of each item in `months`.

  medicaidWorkRequirements.months[].hadMedicare:
    source: reviewMonth.month.hadMedicare
    mapping: renamed
    mapping-rules: [one-ruleset, no-defaults]
    note: Now a field of each item in `months`.

  medicaidWorkRequirements.months[].wasInOtherMandatoryGroup:
    source: reviewMonth.month.wasInOtherMandatoryGroup
    mapping: renamed
    mapping-rules: [one-ruleset, no-defaults, no-questions]
    note: Now a field of each item in `months`. The draft marked it as filled from state data.

  medicaidWorkRequirements.months[].wasIncarceratedInPrior3Months:
    source: reviewMonth.month.wasIncarceratedInPrior3Months
    mapping: renamed
    mapping-rules: [one-ruleset, no-defaults]
    note: Now a field of each item in `months`.

  medicaidWorkRequirements.months[].countyHadDisasterOrEmergency:
    source: reviewMonth.month.countyHadDisasterOrEmergency
    mapping: renamed
    mapping-rules: [one-ruleset, no-defaults, no-questions]
    note: Now a field of each item in `months`. The draft marked it as filled from state data.

  medicaidWorkRequirements.months[].countyHadHighUnemployment:
    source: reviewMonth.month.countyHadHighUnemployment
    mapping: renamed
    mapping-rules: [one-ruleset, no-defaults, no-questions]
    note: >-
      Now a field of each item in `months`. The draft marked it as filled from state data, and its
      comment gave the threshold (the lesser of 8% or 1.5 times the national rate, with CMS
      approval, 435.555); the ruleset drops both.

  medicaidWorkRequirements.months[].receivedInpatientCare:
    source: reviewMonth.month.receivedInpatientCare
    mapping: renamed
    mapping-rules: [one-ruleset, no-defaults]
    note: Now a field of each item in `months`.

  medicaidWorkRequirements.months[].hadMedicalTravel:
    source: reviewMonth.month.hadMedicalTravel
    mapping: renamed
    mapping-rules: [one-ruleset, no-defaults, no-questions]
    note: >-
      Now a field of each item in `months`. The draft's help text carried a condition the rules
      don't check: if the dependent traveled alone, the person must show they missed work or
      activities. The ruleset has no help text, so that condition is gone.

  medicaidWorkRequirements.months[].askedForHardship:
    source: reviewMonth.month.askedForHardship
    mapping: renamed
    mapping-rules: [one-ruleset, no-defaults]
    note: Now a field of each item in `months`.

  medicaidWorkRequirements.months[].hoursWorked:
    source: reviewMonth.month.hoursWorked
    mapping: renamed
    mapping-rules: [one-ruleset, no-defaults, no-questions]
    note: >-
      Now a field of each item in `months`. The draft's help text said unpaid work, like an
      internship, counts; the ruleset has no help text.

  medicaidWorkRequirements.months[].hoursCommunityService:
    source: reviewMonth.month.hoursCommunityService
    mapping: renamed
    mapping-rules: [one-ruleset, no-defaults]
    note: Now a field of each item in `months`.

  medicaidWorkRequirements.months[].hoursWorkProgram:
    source: reviewMonth.month.hoursWorkProgram
    mapping: renamed
    mapping-rules: [one-ruleset, no-defaults]
    note: Now a field of each item in `months`.

