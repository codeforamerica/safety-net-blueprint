  snapWorkRequirements.person.isWorking:
    source: screeners.is_working
    sourceFile: >-
      https://github.com/codeforamerica/work-requirements-self-advocacy-tool/blob/7de6bff2aa63b9de1687cfb7e7204c34ee4ca6ae/db/schema.rb
    mapping: changed
    mapping-rules: [yes-no-answer, counted-hours]
    note: >-
      The tool's rules read is_working only for the earnings exemption. The ruleset also reads it to
      decide whether working hours count toward the 20.

  snapWorkRequirements.person.workingHours:
    source: screeners.working_hours
    sourceFile: >-
      https://github.com/codeforamerica/work-requirements-self-advocacy-tool/blob/7de6bff2aa63b9de1687cfb7e7204c34ee4ca6ae/db/schema.rb
