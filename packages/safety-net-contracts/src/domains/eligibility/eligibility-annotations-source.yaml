    mapping-rules: [one-ruleset, no-defaults]
    note: Now a field of each item in `months`.

  medicaidWorkRequirements.months[].educationCreditHours:
    source: reviewMonth.month.educationCreditHours
    mapping: renamed
    mapping-rules: [one-ruleset, no-defaults]
    note: Now a field of each item in `months`.

  medicaidWorkRequirements.months[].educationClassHours:
    source: reviewMonth.month.educationClassHours
    mapping: renamed
    mapping-rules: [one-ruleset, no-defaults]
    note: Now a field of each item in `months`.

  medicaidWorkRequirements.months[].householdIncome:
    source: reviewMonth.month.householdIncome
    mapping: renamed
    mapping-rules: [one-ruleset, no-defaults]
    note: >-
      Now a field of each item in `months`. The draft's comment said it's MAGI-based monthly
      household income; the ruleset doesn't say.

  medicaidWorkRequirements.months[].isSeasonalWorker:
    source: reviewMonth.month.isSeasonalWorker
    mapping: renamed
    mapping-rules: [one-ruleset, no-defaults]
    note: Now a field of each item in `months`.

  medicaidWorkRequirements.months[].sixMonthAverageIncome:
    source: reviewMonth.month.sixMonthAverageIncome
    mapping: renamed
    mapping-rules: [one-ruleset, no-defaults]
    note: Now a field of each item in `months`.

  medicaidWorkRequirements.months[]:
    source: reviewMonths (with reviewMonth.month)
    mapping: changed
    mapping-rules: [one-ruleset, no-defaults]
    note: >-
      The draft's person-level ruleset took reviewMonths, a list of results already run through
      the separate reviewMonth ruleset (default an empty list), with monthsBefore expected on
      each. The ruleset takes the raw answers for each month as `months`, one object per month, and
      works out each month's result itself (see the fact reviewMonths).

  snapWorkRequirements.person.age:
    source: screeners.age_range
    sourceFile: >-
      https://github.com/codeforamerica/work-requirements-self-advocacy-tool/blob/7de6bff2aa63b9de1687cfb7e7204c34ee4ca6ae/app/models/screener.rb
    mapping: changed
    mapping-rules: [age-as-number]
    note: >-
      The tool asks for one of five ranges; the ruleset takes an age in whole years, at least 0, with
      no upper limit. The tool also asks for a birth date later on (screeners.birth_date), but no
      rule reads it.

  snapWorkRequirements.person.isAmericanIndian:
    source: screeners.is_american_indian
    sourceFile: >-
      https://github.com/codeforamerica/work-requirements-self-advocacy-tool/blob/7de6bff2aa63b9de1687cfb7e7204c34ee4ca6ae/db/schema.rb
    mapping: changed
    mapping-rules: [yes-no-answer]

  snapWorkRequirements.person.hasChild:
