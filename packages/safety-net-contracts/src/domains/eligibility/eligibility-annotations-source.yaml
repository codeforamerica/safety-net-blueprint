    mapping: changed
    mapping-rules: [number-answer]
    note: >-
      A decimal column in the tool, cleared when is_working is no. The ruleset reads it even for
      someone who doesn't work (see earningsAboveMinimum), so it can be asked of a person the tool
      would never ask.

  snapWorkRequirements.person.isVolunteer:
