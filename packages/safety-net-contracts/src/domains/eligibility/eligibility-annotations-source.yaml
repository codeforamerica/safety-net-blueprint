    mapping: changed
    mapping-rules: [yes-no-answer, counted-hours]
    note: >-
      No rule in the tool reads is_in_work_training; it only clears the training hours on save
      when the answer is no. co-snap kept it as an input nothing read. The ruleset reads it to decide
      whether training hours count.

  snapWorkRequirements.person.workTrainingHours:
    source: screeners.work_training_hours
    sourceFile: >-
      https://github.com/codeforamerica/work-requirements-self-advocacy-tool/blob/7de6bff2aa63b9de1687cfb7e7204c34ee4ca6ae/db/schema.rb
    mapping: changed
    mapping-rules: [number-answer]
    note: >-
      The tool stores this as a string column, validates it as a whole number, and reads it with
      to_i. The ruleset takes an integer.

constants:

  medicaidWorkRequirements.effectiveDate:
    source: firstYearInEffect
    mapping: changed
    mapping-rules: [parameters-are-constants, dates-not-years]
    note: >-
      The draft held the first year in effect (2027). The ruleset holds the first day, as a date
      ('2027-01-01'), so Iowa's December 1, 2026 start can be expressed.

  medicaidWorkRequirements.documentationRequiredFrom:
    source: documentationRequiredFromYear
    mapping: changed
    mapping-rules: [parameters-are-constants, dates-not-years]
    note: >-
      The draft held the year documents are required from (2028). The ruleset holds the first day, as
      a date ('2028-01-01') (435.557).

  medicaidWorkRequirements.acceptsStatementsBeforeDocumentationRequired:
    source: acceptsStatementsBefore2028
    mapping: renamed
    mapping-rules: [parameters-are-constants]
    note: >-
      Same state option, same default (true). The name no longer bakes in 2028, since the date it
      refers to is now the constant documentationRequiredFrom.

  snapWorkRequirements.workRulesMinimumAge:
    source: Screener#age_exempt?
    sourceFile: >-
      https://github.com/codeforamerica/work-requirements-self-advocacy-tool/blob/7de6bff2aa63b9de1687cfb7e7204c34ee4ca6ae/app/models/screener.rb
    mapping: changed
    mapping-rules: [age-as-number, literal-to-constant]
    note: >-
      The tool has no number here. 18 is the upper edge of the under_18 range that age_exempt?
      checks.

  snapWorkRequirements.workRulesMaximumAge:
    source: Screener#age_exempt?
    sourceFile: >-
