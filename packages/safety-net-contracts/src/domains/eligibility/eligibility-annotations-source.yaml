facts:

  medicaidWorkRequirements.requirementInEffect:
    source: requirementInEffect
    mapping: changed
    mapping-rules: [dates-not-years, short-circuit]
    note: >-
      Follows 42 CFR 435.559. A renewal is checked if it started on or after effectiveDate
      (435.559(c)); anything else, if it's decided on or after it, since coverage from then on is
      subject (435.559(a)). The draft compared the decision year and excused anything started
      before, applications included. Written as a conditional so a renewal is never asked its
      decision date here, nor an application its start.

  medicaidWorkRequirements.notApplicableReason:
    mapping: introduced
    note: >-
      Says why the requirement doesn't apply: renewal_started_before_requirement,
      not_yet_in_effect, not_in_expansion_group, has_medicare, outside_age_range, or applies. It
      names the first condition that settles it, so a caller can explain the result without asking
      anything requirementApplies didn't. Also an output.

  medicaidWorkRequirements.americanIndianOrAlaskaNativeExemption:
    source: exclusions
    mapping: derived
    mapping-rules: [per-exemption-facts]
    note: The draft's american_indian_or_alaska_native term inside exclusions, as its own fact.

  medicaidWorkRequirements.veteranWithTotalDisabilityExemption:
    source: exclusions
    mapping: derived
    mapping-rules: [per-exemption-facts]
    note: The draft's veteran_with_total_disability term inside exclusions, as its own fact.

  medicaidWorkRequirements.formerFosterYouthExemption:
    source: exclusions
    mapping: derived
    mapping-rules: [per-exemption-facts]
    note: >-
      The draft's former_foster_youth term inside exclusions (former foster youth, age at most
      formerFosterYouthMaximumAge), as its own fact.

  medicaidWorkRequirements.caregiverOfChildUnder14Exemption:
    source: exclusions
    mapping: derived
    mapping-rules: [per-exemption-facts]
    note: >-
      The draft's caregiver_of_child_under_14 term inside exclusions, as its own fact. It reads
      isQualifyingCaregiver only after caresForChildUnder14, so someone who cares for no child
      isn't asked how they're related.

  medicaidWorkRequirements.caregiverOfPersonWithDisabilityExemption:
    source: exclusions
    mapping: derived
    mapping-rules: [per-exemption-facts]
    note: >-
      The draft's caregiver_of_person_with_disability term inside exclusions, as its own fact. It
      reads isQualifyingCaregiver only after caresForPersonWithDisability.

  medicaidWorkRequirements.pregnantOrPostpartumExemption:
    source: exclusions
    mapping: derived
    mapping-rules: [per-exemption-facts]
    note: The draft's pregnant_or_postpartum term inside exclusions, as its own fact.

  medicaidWorkRequirements.snapWorkRulesExemption:
    source: exclusions
    mapping: derived
    mapping-rules: [per-exemption-facts]
    note: >-
      The draft's snap_work_rules term inside exclusions (in a SNAP household and subject to
      SNAP's work rules), as its own fact.

  medicaidWorkRequirements.tanfWorkRulesExemption:
    source: exclusions
    mapping: derived
    mapping-rules: [per-exemption-facts]
    note: The draft's tanf_work_rules term inside exclusions, as its own fact.

  medicaidWorkRequirements.substanceUseTreatmentExemption:
    source: exclusions
    mapping: derived
    mapping-rules: [per-exemption-facts]
    note: The draft's substance_use_treatment term inside exclusions, as its own fact.

  medicaidWorkRequirements.incarceratedExemption:
    source: exclusions
    mapping: derived
    mapping-rules: [per-exemption-facts]
    note: The draft's incarcerated term inside exclusions, as its own fact.

  medicaidWorkRequirements.exemptions:
    source: exclusions
    mapping: changed
    mapping-rules: [exclusions-are-exemptions, per-exemption-facts]
    note: >-
      Same list, same values, same order, longest-lasting first (435.554). It now gathers the
      per-exemption facts instead of testing each condition inline. Medical frailty still reads
      isMedicallyFrail directly; it has no separate exemption fact. Also an output.

  medicaidWorkRequirements.isExempt:
    source: isExcluded
    mapping: renamed
    mapping-rules: [exclusions-are-exemptions]
    note: Same logic (requirementApplies and at least one exemption). Also an output.

  medicaidWorkRequirements.lostExemptStatus:
    source: lostExcludedStatus
    mapping: renamed
    mapping-rules: [exclusions-are-exemptions]
    note: Same logic, reading the renamed input exemptAtLastDetermination. Also an output.

  medicaidWorkRequirements.reviewMonths:
    source: countedMonths
    mapping: changed
    mapping-rules: [one-ruleset]
    note: >-
      Same filter: at application, only months with monthsBefore at most applicationReviewMonths;
      otherwise every month (435.556). It now filters the raw `months` input, and each item it
      keeps carries the per-month facts (reviewMonths[].…). So per-month results exist only for
      months in the review period; the draft worked out every month given, then filtered.

  medicaidWorkRequirements.incomeRequired:
    source: reviewMonth.incomeRequired
    mapping: changed
    mapping-rules: [one-ruleset]
    note: >-
      Same amount (monthlyHoursRequired times federalMinimumWage, $580). Worked out once for the
      person instead of once per month, since it doesn't depend on the month.

  medicaidWorkRequirements.reviewMonths[].mandatoryException:
    source: reviewMonth.mandatoryException
    mapping: renamed
    mapping-rules: [one-ruleset, exclusions-are-exemptions]
    note: Same logic (435.553), reading month.wasExempt for month.wasExcluded.

  medicaidWorkRequirements.reviewMonths[].automaticHardshipException:
    source: reviewMonth.automaticHardshipException
    mapping: renamed
    mapping-rules: [one-ruleset]
    note: Same logic (435.555), now a fact on each review-period month.

  medicaidWorkRequirements.reviewMonths[].hardshipAvailableIfRequested:
    source: reviewMonth.hardshipAvailableIfRequested
    mapping: renamed
    mapping-rules: [one-ruleset]
    note: Same logic (435.555), now a fact on each review-period month, and a per-month output.

  medicaidWorkRequirements.reviewMonths[].requestedHardshipException:
    source: reviewMonth.requestedHardshipException
    mapping: renamed
    mapping-rules: [one-ruleset]
    note: Same logic, now a fact on each review-period month.

  medicaidWorkRequirements.reviewMonths[].educationHours:
    source: reviewMonth.educationHours
    mapping: renamed
    mapping-rules: [one-ruleset]
    note: >-
      Same arithmetic (credit hours times 3 times 4.33, plus class hours), now a fact on each
      month.

  medicaidWorkRequirements.reviewMonths[].totalActivityHours:
    source: reviewMonth.totalActivityHours
    mapping: renamed
    mapping-rules: [one-ruleset]
    note: Same sum (435.552), now a fact on each review-period month, and a per-month output.

  medicaidWorkRequirements.reviewMonths[].meetsActivityHours:
    source: reviewMonth.meetsActivityHours
    mapping: renamed
    mapping-rules: [one-ruleset]
    note: Same logic, now a fact on each review-period month.

  medicaidWorkRequirements.reviewMonths[].meetsIncome:
    source: reviewMonth.meetsIncome
    mapping: renamed
    mapping-rules: [one-ruleset]
    note: Same logic, now a fact on each month, reading the person-level incomeRequired.

  medicaidWorkRequirements.reviewMonths[].meetsSeasonalIncome:
    source: reviewMonth.meetsSeasonalIncome
    mapping: renamed
    mapping-rules: [one-ruleset]
    note: Same logic, now a fact on each month, reading the person-level incomeRequired.

  medicaidWorkRequirements.reviewMonths[].qualifies:
    source: reviewMonth.qualifies
    mapping: renamed
    mapping-rules: [one-ruleset]
    note: Same logic, now a fact on each review-period month, and a per-month output.

  medicaidWorkRequirements.reviewMonths[].qualifiesBy:
    source: reviewMonth.qualifiesBy
    mapping: renamed
    mapping-rules: [one-ruleset]
    note: Same order and values, now a fact on each review-period month, and a per-month output.

  medicaidWorkRequirements.reviewMonths[].proofRule:
    source: reviewMonth.proofRule
    mapping: renamed
    mapping-rules: [one-ruleset]
    note: >-
      Same values (none_needed, exception, standard), now a fact on each month, and a per-month
      output.

  medicaidWorkRequirements.meetsRequirement:
    source: meetsReviewPeriod
    mapping: renamed
    note: >-
      Same logic (qualifying months at least monthsRequired, 435.556). Renamed to match the SNAP
      ruleset's vocabulary, and now an output; the draft didn't output it.

  medicaidWorkRequirements.beforeDocumentationRequired:
    source: beforeDocumentationYear
    mapping: changed
    mapping-rules: [dates-not-years]
    note: >-
      Compares the decision date to the date documentationRequiredFrom, where the draft compared
      the decision year to a year (435.557).

  medicaidWorkRequirements.statementAcceptedGenerally:
    source: statementAcceptedGenerally
    mapping: changed
    mapping-rules: [short-circuit]
    note: >-
      Same logic, operands swapped: the state option comes before the date check, so a state that
      doesn't take statements before documents are required is never asked the decision date for
      this.

  medicaidWorkRequirements.hasExemptionOtherThanFrailty:
    source: hasExclusionOtherThanFrailty
    mapping: renamed
    mapping-rules: [exclusions-are-exemptions]
    note: Same logic.

  medicaidWorkRequirements.statementAcceptedForExemption:
    source: statementAcceptedForExclusion
    mapping: renamed
    mapping-rules: [exclusions-are-exemptions]
    note: Same logic.

  medicaidWorkRequirements.exemptionShown:
    source: exclusionShown
    mapping: renamed
    mapping-rules: [exclusions-are-exemptions]
    note: Same logic.

  medicaidWorkRequirements.satisfiesRequirement:
    source: status
    mapping: derived
    note: >-
      Replaces the draft's four-value status string with yes or no: the requirement doesn't apply,
      the person is exempt, or enough months counted. It is true wherever status wasn't
      does_not_meet_requirement. The other distinctions status made are in requirementApplies,
      isExempt and meetsRequirement, all outputs. Whether it's shown is still isCovered's job.

