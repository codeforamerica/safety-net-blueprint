    source: WorkRulesPolicy::Base#has_exemption?
    sourceFile: >-
      https://github.com/codeforamerica/work-requirements-self-advocacy-tool/blob/7de6bff2aa63b9de1687cfb7e7204c34ee4ca6ae/app/models/work_rules_policy.rb
    mapping: changed
    mapping-rules: [no-list]
    note: >-
      The tool checks non_earnings_exemption_reasons.any?. Like the tool, it counts age, so it is
      true for a 70-year-old whose isExempt is false. The tool uses it to skip the work,
      volunteering and training questions.

  snapWorkRequirements.earningsAboveMinimum:
    source: Screener#earnings_above_minimum?
    sourceFile: >-
      https://github.com/codeforamerica/work-requirements-self-advocacy-tool/blob/7de6bff2aa63b9de1687cfb7e7204c34ee4ca6ae/app/models/screener.rb
    mapping: changed
    mapping-rules: [literal-to-constant, number-answer]
    note: >-
      Neither checks whether the person works. The tool reads blank earnings as 0 and clears them
      when is_working is no, so for a non-worker this is false. The ruleset has no 0 to fall back on,
      so it waits on the earnings answer even from someone who said they don't work, unlike the
      counted hours facts, which check isWorking first.

  snapWorkRequirements.workingEarningsExemptionHours:
    source: Screener#working_30_or_more_hours?
    sourceFile: >-
      https://github.com/codeforamerica/work-requirements-self-advocacy-tool/blob/7de6bff2aa63b9de1687cfb7e7204c34ee4ca6ae/app/models/screener.rb
    mapping: renamed
    mapping-rules: [threshold-name, literal-to-constant]

  snapWorkRequirements.isExemptFromWorkRules:
    source: WorkRulesPolicy::Base#exempt_from_work_rules?
    sourceFile: >-
      https://github.com/codeforamerica/work-requirements-self-advocacy-tool/blob/7de6bff2aa63b9de1687cfb7e7204c34ee4ca6ae/app/models/work_rules_policy.rb
    mapping: changed
    mapping-rules: [no-list, shared-vocabulary]
    note: >-
      The tool checks exemption_reasons.any?; the ruleset joins hasExemption and hasEarningsExemption
      with or. It still counts age, as the tool does. co-snap made it an output; the ruleset keeps it
      as a fact only, and isExempt is the output.

  snapWorkRequirements.anyPreventingWork:
    source: Screener#any_preventing_work?
    sourceFile: >-
      https://github.com/codeforamerica/work-requirements-self-advocacy-tool/blob/7de6bff2aa63b9de1687cfb7e7204c34ee4ca6ae/app/models/screener.rb
    mapping: changed
    mapping-rules: [no-list, results-for-everyone]
    note: >-
      The tool loops over PREVENTING_WORK_ATTRIBUTES, then asks the state. The ruleset joins
      anyListedPreventingWork and extraPreventingWork with or. The tool uses it only on the
      signature page and in the PDF packet.

  snapWorkRequirements.countedWorkingHours:
    mapping: introduced
    mapping-rules: [counted-hours]
    note: Working hours if isWorking is true, otherwise 0.

  snapWorkRequirements.countedVolunteeringHours:
    mapping: introduced
    mapping-rules: [counted-hours]
    note: Volunteering hours if isVolunteer is true, otherwise 0.

  snapWorkRequirements.countedWorkTrainingHours:
    mapping: introduced
    mapping-rules: [counted-hours]
    note: Training hours if isInWorkTraining is true, otherwise 0.

  snapWorkRequirements.totalWorkVolunteerAndTrainingHours:
    source: Screener#total_work_volunteer_and_training_hours
    sourceFile: >-
      https://github.com/codeforamerica/work-requirements-self-advocacy-tool/blob/7de6bff2aa63b9de1687cfb7e7204c34ee4ca6ae/app/models/screener.rb
    mapping: changed
    mapping-rules: [counted-hours, number-answer]
    note: >-
      The tool adds working_hours, volunteering_hours and work_training_hours whatever the
      yes-or-no answers say, reading blanks as 0. Through the tool's screens the total is the
      same, because a no clears the hours on save. Called directly, it differs: the tool's own
      spec adds 5, 7 and 9 hours with no yes-or-no answers and gets 21; the ruleset waits on
      isWorking, isVolunteer and isInWorkTraining.

  snapWorkRequirements.meetsRequirement:
    source: WorkRulesPolicy::Base#complies_with_work_rules?
    sourceFile: >-
      https://github.com/codeforamerica/work-requirements-self-advocacy-tool/blob/7de6bff2aa63b9de1687cfb7e7204c34ee4ca6ae/app/models/work_rules_policy.rb
    mapping: renamed
    mapping-rules: [shared-vocabulary, literal-to-constant]
    note: co-snap's compliesWithWorkRules, renamed to Medicaid's word.

  snapWorkRequirements.isVolunteering:
    source: Screener#volunteering?
    sourceFile: >-
      https://github.com/codeforamerica/work-requirements-self-advocacy-tool/blob/7de6bff2aa63b9de1687cfb7e7204c34ee4ca6ae/app/models/screener.rb
    mapping: renamed
    mapping-rules: [names]

  snapWorkRequirements.requiresProof:
    source: Screener#requires_proof?
    sourceFile: >-
      https://github.com/codeforamerica/work-requirements-self-advocacy-tool/blob/7de6bff2aa63b9de1687cfb7e7204c34ee4ca6ae/app/models/screener.rb
    mapping: changed
    mapping-rules: [results-for-everyone, number-answer]
    note: >-
      The same expression as the tool's. Two things differ. Through earningsAboveMinimum, it waits
      on earnings from someone who doesn't work, where the tool reads 0. And the ruleset answers it
      for everyone, so a 70-year-old student gets true; the tool shows it only on the proof page,
      which only people exempt for a reason other than age reach.

  snapWorkRequirements.requirementApplies:
    source: Screener#age_exempt?, and the AGE_EXEMPT outcome AgeExemptionController saves
    sourceFile: >-
      https://github.com/codeforamerica/work-requirements-self-advocacy-tool/blob/7de6bff2aa63b9de1687cfb7e7204c34ee4ca6ae/app/controllers/age_exemption_controller.rb
    mapping: derived
    mapping-rules: [shared-vocabulary, age-decides-applicability]
    note: >-
      Not age-exempt. Careful with the words: in the tool, the "work rules apply" pages
      (WorkRulesApplyMetController, WorkRulesApplyUnmetController) mean the person isn't exempt at
      all. Here requirementApplies is only about age, and stays true for someone exempt.

  snapWorkRequirements.notApplicableReason:
    source: WorkRulesPolicy::Base#non_earnings_exemption_reasons — 'age_under_18', 'age_65_or_older'
    sourceFile: >-
      https://github.com/codeforamerica/work-requirements-self-advocacy-tool/blob/7de6bff2aa63b9de1687cfb7e7204c34ee4ca6ae/app/models/work_rules_policy.rb
    mapping: derived
    mapping-rules: [shared-vocabulary, age-decides-applicability, threshold-name]
    note: >-
      Which age cutoff the person is past: under_minimum_age or over_maximum_age, else applies.
      The tool's codes were age_under_18 and age_65_or_older; co-snap's were age_under_minimum and
      age_over_maximum. The applies value has no counterpart.

  snapWorkRequirements.isExempt:
    source: >-
      WorkRulesPolicy::Base#exempt_from_work_rules?, and the EXEMPT outcome DownloadFormController
      saves
    sourceFile: >-
      https://github.com/codeforamerica/work-requirements-self-advocacy-tool/blob/7de6bff2aa63b9de1687cfb7e7204c34ee4ca6ae/app/controllers/download_form_controller.rb
    mapping: derived
    mapping-rules: [shared-vocabulary, age-decides-applicability]
    note: >-
      requirementApplies and isExemptFromWorkRules. False for someone age-exempt, where the tool's
      exempt_from_work_rules? is true. It matches the tool's exempt outcome, which only people
      past the age check reach. An earnings exemption counts, as in the tool.

  snapWorkRequirements.exemptions:
    source: WorkRulesPolicy::Base#exemption_reasons
    sourceFile: >-
      https://github.com/codeforamerica/work-requirements-self-advocacy-tool/blob/7de6bff2aa63b9de1687cfb7e7204c34ee4ca6ae/app/models/work_rules_policy.rb
    mapping: changed
    mapping-rules: [shared-vocabulary, age-decides-applicability, yes-no-answer]
    note: >-
      Leaves out the age codes the tool puts first. Read as a set; the tool keeps an order for its
      exemptions_found record. The ruleset declares no item list or uniqueness, where co-snap
      declared both. It also waits on every exemption question. So for someone exempt by, say,
      pregnancy, it waits on isWorking, a question the tool skips once has_exemption? is true.

  snapWorkRequirements.satisfiesRequirement:
    source: >-
      Screener outcomes: AGE_EXEMPT, EXEMPT, NOT_EXEMPT_WORK_RULES_MET,
      NOT_EXEMPT_WORK_RULES_NOT_MET
    sourceFile: >-
      https://github.com/codeforamerica/work-requirements-self-advocacy-tool/blob/7de6bff2aa63b9de1687cfb7e7204c34ee4ca6ae/app/controllers/question_controller.rb
    mapping: derived
    mapping-rules: [shared-vocabulary]
    note: >-
      True when the requirement doesn't apply, the person is exempt, or the hours are met; false
      only for the tool's not_exempt_work_rules_not_met. The four-way outcome is gone; it can be
      rebuilt from requirementApplies, isExempt and meetsRequirement.
