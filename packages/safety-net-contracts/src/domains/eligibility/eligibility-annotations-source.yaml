    mapping: derived
    mapping-rules: [exemption-per-code, age-as-number, threshold-name, age-decides-applicability]
    note: >-
      The tool adds the code age_under_18 to its exemption list. The ruleset adds no code for it to
      exemptions; it feeds requirementApplies and notApplicableReason instead. The name still ends
