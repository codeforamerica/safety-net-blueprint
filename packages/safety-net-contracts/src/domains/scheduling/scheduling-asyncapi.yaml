asyncapi: 3.0.0
info:
  title: Scheduling Domain Events
  version: 0.1.0
  x-status: alpha
  x-domain: scheduling
  description: |
    Event catalog for the Scheduling domain. Covers appointment lifecycle events
    and timer infrastructure events used by the platform scheduling service.

    Event types follow the convention: scheduling.{resource}.{event}.

    The org-specific prefix is never written here — the resolver adds it at resolve
    time via the x-event-type-prefix overlay config.
channels:
  scheduling.timer.cancelled:
    address: scheduling.timer.cancelled
    messages:
      timerCancelled:
        $ref: '#/components/messages/TimerCancelledMessage'
  scheduling.timer.requested:
    address: scheduling.timer.requested
    messages:
      timerRequested:
        $ref: '#/components/messages/TimerRequestedMessage'
components:
  messages:
    TimerCancelledMessage:
      name: scheduling.timer.cancelled
      summary: >-
        Emitted by the platform cancelTimer procedure to cancel a pending timer; no-op if the timer
        has already fired.
      payload:
        $ref: '#/components/schemas/TimerCancelledEvent'
    TimerRequestedMessage:
      name: scheduling.timer.requested
      summary: >-
        Emitted by the platform requestTimer procedure; the scheduling service registers the timer
        and fires the callback event on expiry.
      payload:
        $ref: '#/components/schemas/TimerRequestedEvent'
  schemas:
    TimerCancelledEvent:
      allOf:
        - $ref: https://blueprint.codeforamerica.org/base/schemas/events.yaml#/$defs/Event
        - type: object
          properties:
            type:
              type: string
              const: scheduling.timer.cancelled
            data:
              $ref: >-
                https://blueprint.codeforamerica.org/base/schemas/events.yaml#/SchedulingTimerCancelledEvent
    TimerRequestedEvent:
      allOf:
        - $ref: https://blueprint.codeforamerica.org/base/schemas/events.yaml#/$defs/Event
        - type: object
          properties:
            type:
              type: string
              const: scheduling.timer.requested
            data:
              $ref: >-
                https://blueprint.codeforamerica.org/base/schemas/events.yaml#/SchedulingTimerRequestedEvent
