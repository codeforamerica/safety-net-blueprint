$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "domains/identity-access/identity-access-schema.yaml"
title: IdentityAccess
description: >
  Identity and access domain types. Covers user account management,
  authentication context, and authorization schemas.

  Referenced by the User Service API (users-openapi.yaml), JWT schemas,
  and state machine actor definitions.

$defs:
  Role:
    type: object
    description: Role and permissions for authorization.
    required:
      - name
    properties:
      name:
        $ref: "../../common/schemas/enums.yaml#/$defs/RoleType"
      permissions:
        type: array
        items:
          type: string
        description: |
          Permission strings in the format {resource}:{action}.
          Examples: applications:read, persons:update, users:create
        example:
          - "applications:read"
          - "applications:create"
          - "persons:read"

  BackendAuthContext:
    type: object
    description: |
      Minimal authorization context for backend API authorization. Stored in the
      User Service and embedded in JWT tokens during login. Domain APIs read these
      claims for authorization decisions without runtime calls to the User Service.

      For frontend tokens that include UI permissions and preferences, see
      FrontendAuthContext.
    required:
      - userId
      - roles
    properties:
      userId:
        type: string
        format: uuid
        description: User Service identifier. Same value as User.id on the REST resource.
      roles:
        $ref: "#/$defs/Role"

  JwtClaims:
    type: object
    description: |
      Expected JWT claims structure for domain API authentication.
      Combines standard JWT claims with custom authorization claims.

      Domain APIs validate the JWT signature and read these claims
      for authorization decisions. No runtime calls to User Service required.
    required:
      - sub
      - iss
      - aud
      - exp
      - userId
      - roles
    allOf:
      - type: object
        properties:
          sub:
            type: string
            description: |
              Subject identifier from the Identity Provider.
              Uniquely identifies the user within the IdP.
            example: "auth0|507f1f77bcf86cd799439011"
          iss:
            type: string
            format: uri
            description: Token issuer (IdP URL).
            example: "https://your-tenant.auth0.com/"
          aud:
            type: string
            description: Intended audience (API identifier).
            example: "https://api.safetynet.example.com"
          exp:
            type: integer
            description: Expiration timestamp (Unix epoch seconds).
            example: 1706300000
          iat:
            type: integer
            description: Issued-at timestamp (Unix epoch seconds).
            example: 1706296400
          email:
            type: string
            format: email
            description: User's email address.
            example: "jane.smith@alameda.gov"
          name:
            type: string
            description: User's display name.
            example: "Jane Smith"
      - $ref: "#/$defs/BackendAuthContext"

  FrontendAuthContext:
    type: object
    description: |
      Authorization context for frontend applications. Extends BackendAuthContext
      with UI permissions and user preferences.

      Used in enriched JWTs for frontends (via BFF/gateway) or returned by
      GET /users/me. States can customize this independently from BackendAuthContext.
    allOf:
      - $ref: "#/$defs/BackendAuthContext"
      - type: object
        properties:
          ui:
            type: object
            readOnly: true
            additionalProperties: true
            description: |
              Computed UI permissions and display data for frontend feature toggling.
              Backend computes these from role and permissions to provide
              a UI-friendly interface for showing/hiding features.

              Structure is flexible — states define their own fields via overlays.
              Example fields: name, availableModules, canApproveApplications, etc.
            example:
              name: "Jane Smith"
              availableModules: ["cases", "tasks", "documents"]
              canApproveApplications: false
              canViewSensitivePII: false
              canExportData: true
              canManageUsers: false
          preferences:
            type: object
            additionalProperties: true
            description: |
              User preferences for the application.

              Structure is flexible — states define their own fields via overlays.
              Example fields: timezone, dateFormat, itemsPerPage, language, theme, etc.
            example:
              timezone: "America/Los_Angeles"
              dateFormat: "us"
              itemsPerPage: 25

  User:
    type: object
    description: >
      Writable fields for a User account. OpenAPI specs compose this with
      system fields (id, userId, createdAt, updatedAt) to produce the full
      resource schema.
    properties:
      idpSubject:
        type: string
        description: |
          Subject identifier from the Identity Provider. Immutable after creation.
          Format varies by IdP (e.g., "auth0|507f1f77bcf86cd799439011").
        example: "auth0|507f1f77bcf86cd799439011"
      email:
        type: string
        format: email
        description: User's email address (from IdP or manually set).
        example: "jane.smith@alameda.gov"
      name:
        type: string
        example: "Jane Smith"
      roles:
        $ref: "#/$defs/Role"
      status:
        type: string
        description: User account status.
        enum:
          - active
          - inactive
          - pending
          - suspended
      counties:
        type: array
        items:
          type: string
        description: County FIPS codes assigned to the user.
        example: ["06001"]
      organizationId:
        type: string
        format: uuid
        x-relationship:
          resource: External
      personId:
        type: string
        format: uuid
        description: Link to Person record (for applicants).
        x-relationship:
          resource: Person
          domain: client-management
      caseWorkerId:
        type: string
        format: uuid
        description: Link to CaseWorker record (for staff).
        x-relationship:
          resource: External
      preferences:
        type: object
        additionalProperties: true
        description: |
          User preferences for the application.

          Structure is flexible — states define their own fields via overlays.
          Example fields: timezone, dateFormat, itemsPerPage, language, theme, etc.
        example:
          timezone: "America/Los_Angeles"
          dateFormat: "us"
          itemsPerPage: 25
