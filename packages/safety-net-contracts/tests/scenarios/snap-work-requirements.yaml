      volunteeringHours: 5
    expect:
      needsProofOfVolunteering: false
  - name: 55–64, no diploma, no recent work, medical condition
    state: NC
    person:
      age: 60
      preventingWorkMedicalCondition: true
      hasHsDiploma: false
      workedLastFiveYears: false
    expect:
      ageWorkEducationHealthExemption: true
  - name: undecided when age is unanswered
    state: NC
    person:
      preventingWorkMedicalCondition: true
      hasHsDiploma: false
      workedLastFiveYears: false
    expect:
      ageWorkEducationHealthExemption: null
  - name: not when too young
    state: NC
    person:
      age: 30
      preventingWorkMedicalCondition: true
      hasHsDiploma: false
      workedLastFiveYears: false
    expect:
      ageWorkEducationHealthExemption: false
  - name: not when too old
    state: NC
    person:
      age: 70
      preventingWorkMedicalCondition: true
      hasHsDiploma: false
      workedLastFiveYears: false
    expect:
      ageWorkEducationHealthExemption: false
  - name: not when worked recently with no earnings answer
    state: NC
    person:
      age: 60
      preventingWorkMedicalCondition: true
      hasHsDiploma: false
      workedLastFiveYears: true
    expect:
      ageWorkEducationHealthExemption: false
  - name: not with a diploma
    state: NC
    person:
      age: 60
      preventingWorkMedicalCondition: true
      hasHsDiploma: true
      workedLastFiveYears: false
    expect:
      ageWorkEducationHealthExemption: false
  - name: not without a medical condition
    state: NC
    person:
      age: 60
      preventingWorkMedicalCondition: false
      hasHsDiploma: false
      workedLastFiveYears: false
    expect:
      ageWorkEducationHealthExemption: false
  - name: worked recently but under the earnings threshold
    state: NC
    person:
      age: 60
      preventingWorkMedicalCondition: true
      hasHsDiploma: false
      workedLastFiveYears: true
      earnedMoreThanThreshold: false
      healthConditionsPreventingWork: true
    expect:
      ageWorkEducationHealthExemption: true
  - name: not when no health condition either way
    state: NC
    person:
      age: 60
      preventingWorkMedicalCondition: false
      hasHsDiploma: false
      workedLastFiveYears: false
      earnedMoreThanThreshold: false
      healthConditionsPreventingWork: false
    expect:
      ageWorkEducationHealthExemption: false
  - name: the 55 exemption counts as preventing work
    state: NC
    person:
      age: 60
      preventingWorkMedicalCondition: true
      hasHsDiploma: false
      workedLastFiveYears: false
    expect:
      anyPreventingWork: true
  - name: both state exemptions listed
    state: NC
    person:
      age: 60
      preventingWorkMedicalCondition: true
      hasHsDiploma: false
      workedLastFiveYears: false
      teachesHomeschool: true
      homeschoolHours: 40
    expect:
      stateExemptionReasons:
        - exemption_age_no_diploma
        - exemption_homeschool
  - name: no state exemptions by default
    state: NC
    person:
      age: 30
    expect:
      stateExemptionReasons: []
  - name: homeschool alone exempts
    state: NC
    person:
      age: 30
      teachesHomeschool: true
      homeschoolHours: 40
    expect:
      exemptions:
        - exemption_homeschool
  - name: and is a non-earnings exemption
    state: NC
    person:
      age: 30
      teachesHomeschool: true
      homeschoolHours: 40
    expect:
      hasExemption: true
  - name: state, federal and earnings exemptions together
    state: NC
    person:
      age: 30
      isPregnant: true
      isWorking: true
      workingHours: 30
      teachesHomeschool: true
      homeschoolHours: 40
    expect:
      exemptions:
        - is_pregnant
        - exemption_homeschool
        - earnings_exemption
  - name: homeschool under 30 hours does not exempt
    state: NC
    person:
      age: 30
      teachesHomeschool: true
      homeschoolHours: 29
    expect:
      exemptions: []
  - name: (ours) age 17
    person:
      age: 17
    note: >-
      The port listed age_under_minimum among the exemptions. Age decides whether the requirement
      applies, so it is in requirementApplies, not exemptions.
    expect:
      requirementApplies: false
      exemptions: []
  - name: (ours) age 18
    person:
      age: 18
    expect:
      exemptions: []
  - name: (ours) age 64
    person:
      age: 64
    expect:
      exemptions: []
  - name: (ours) age 65
    person:
      age: 65
    note: >-
      The port listed age_over_maximum among the exemptions. Age decides whether the requirement
      applies, so it is in requirementApplies, not exemptions.
    expect:
      requirementApplies: false
      exemptions: []
  - name: (ours) NC 55-to-64 exemption at 54
    state: NC
    person:
      age: 54
      preventingWorkMedicalCondition: true
      hasHsDiploma: false
      workedLastFiveYears: false
    expect:
      ageWorkEducationHealthExemption: false
  - name: (ours) NC 55-to-64 exemption at 55
    state: NC
    person:
      age: 55
      preventingWorkMedicalCondition: true
      hasHsDiploma: false
      workedLastFiveYears: false
    expect:
      ageWorkEducationHealthExemption: true
  - name: (ours) NC 55-to-64 exemption at 64
    state: NC
    person:
      age: 64
      preventingWorkMedicalCondition: true
      hasHsDiploma: false
      workedLastFiveYears: false
    expect:
      ageWorkEducationHealthExemption: true
  - name: (ours) NC 55-to-64 exemption at 65
    state: NC
    person:
      age: 65
      preventingWorkMedicalCondition: true
      hasHsDiploma: false
      workedLastFiveYears: false
    expect:
      ageWorkEducationHealthExemption: false
