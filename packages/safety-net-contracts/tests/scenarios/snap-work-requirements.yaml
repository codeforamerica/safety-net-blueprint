        - caring_for_disabled_or_ill_person
  - name: hasChild = yes gives has_child
    person:
      age: 30
      hasChild: true
    expect:
      exemptions:
        - has_child
  - name: hasUnemploymentBenefits = yes gives has_unemployment_benefits
    person:
      age: 30
