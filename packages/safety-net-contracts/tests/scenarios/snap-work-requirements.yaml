# SNAP work requirements cases and the results each must produce. Ported from
# scripts/work-rules-cases.mjs in codeforamerica/co-snap-interview-prompts
# (feature/work-rules), whose cases come from the self-advocacy tool's own specs.
#
#   person  answers; a question not given takes its answer in unanswered, below
#   state   a state overlay (default: the federal rules as written)
#   expect  facts and the values they must have. null: not decided, so missing.
#           A list of exemption codes is compared as a set.
#   note    where an expectation differs from the port's, and why
#
# Renamed to the vocabulary Medicaid's work requirements share: exemptionReasons
# is exemptions, outcome is satisfiesRequirement and the booleans it rests on, compliesWithWorkRules is meetsRequirement.
#
# The rules give nothing a default, so an unanswered question leaves a result
# missing. A case is about the answers it gives; every other question takes the
# answer that grants nothing, as the tool treats a question it skipped. Age has
# no such answer, so a case that leaves it out is undecided.

unanswered:
  person:
    isAmericanIndian: false
    hasChild: false
    caringForChildUnder6: false
    caringForDisabledOrIllPerson: false
    isPregnant: false
    hasUnemploymentBenefits: false
    receivingBenefitsSsdi: false
    receivingBenefitsSsi: false
    receivingBenefitsVeteransDisability: false
    receivingBenefitsWorkersCompensation: false
    receivingBenefitsDisabilityPension: false
    receivingBenefitsInsurancePayments: false
    receivingBenefitsDisabilityMedicaid: false
    receivingBenefitsOther: false
    isMigrantFarmworker: false
    isStudent: false
    isInAlcoholTreatmentProgram: false
    preventingWorkPlaceToSleep: false
    preventingWorkDrugsAlcohol: false
    preventingWorkDomesticViolence: false
    preventingWorkMedicalCondition: false
    preventingWorkOther: false
    isWorking: false
    workingHours: 0
    workingWeeklyEarnings: 0
    isVolunteer: false
    volunteeringHours: 0
    isInWorkTraining: false
    workTrainingHours: 0
  northCarolina:
    hasHsDiploma: true
    workedLastFiveYears: true
    earnedMoreThanThreshold: true
    healthConditionsPreventingWork: false
    teachesHomeschool: false
    homeschoolHours: 0
cases:
  - name: no exemption reasons when nothing applies
    person:
      age: 30
    expect:
      exemptions: []
  - name: nothing decided when age is unanswered
    person: {}
    note: >-
      The port expected the exemption list undecided, since it held the age codes. Without them the
      list is decided without age; whether the requirement applies is what waits on it.
    expect:
      exemptions: []
      requirementApplies: null
  - name: 65 or older
    person:
      age: 70
    note: >-
      The port listed age_over_maximum among the exemptions. Age decides whether the requirement
      applies, so it is in requirementApplies, not exemptions.
    expect:
      requirementApplies: false
      exemptions: []
  - name: under 18
    person:
      age: 16
    note: >-
      The port listed age_under_minimum among the exemptions. Age decides whether the requirement
      applies, so it is in requirementApplies, not exemptions.
    expect:
      requirementApplies: false
      exemptions: []
  - name: receivingBenefitsSsdi = yes gives receiving_benefits_ssdi
    person:
      age: 30
      receivingBenefitsSsdi: true
    expect:
      exemptions:
        - receiving_benefits_ssdi
  - name: receivingBenefitsSsi = yes gives receiving_benefits_ssi
    person:
      age: 30
      receivingBenefitsSsi: true
    expect:
      exemptions:
        - receiving_benefits_ssi
  - name: receivingBenefitsVeteransDisability = yes gives receiving_benefits_veterans_disability
    person:
      age: 30
