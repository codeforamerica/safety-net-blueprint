        - is_pregnant
  - name: isStudent = yes gives is_student
    person:
      age: 30
      isStudent: true
    expect:
      exemptions:
        - is_student
  - name: age, other and earnings exemptions together
    person:
      age: 70
      hasChild: true
      isPregnant: true
      isWorking: true
      workingHours: 30
    note: >-
      The port listed age_over_maximum among the exemptions. Age decides whether the requirement
      applies, so it is in requirementApplies, not exemptions.
    expect:
      requirementApplies: false
      exemptions:
        - has_child
        - is_pregnant
        - earnings_exemption
  - name: earnings exemption at 30 hours
    person:
      age: 30
      isWorking: true
      workingHours: 30
    expect:
      hasEarningsExemption: true
  - name: earnings exemption at $217.50 a week
    person:
      age: 30
      isWorking: true
      workingWeeklyEarnings: 217.5
    expect:
      hasEarningsExemption: true
  - name: no earnings exemption under both thresholds
    person:
      age: 30
      isWorking: true
      workingHours: 10
      workingWeeklyEarnings: 100
    expect:
      hasEarningsExemption: false
  - name: no earnings exemption when not working
    person:
      age: 30
      isWorking: false
    expect:
      hasEarningsExemption: false
  - name: earnings alone exempt, but are not a non-earnings exemption
    person:
      age: 30
      isWorking: true
      workingHours: 30
    expect:
      hasExemption: false
  - name: a non-earnings exemption counts
    person:
      age: 30
      hasUnemploymentBenefits: true
      isPregnant: true
    expect:
      hasExemption: true
  - name: 20 combined hours complies
    person:
      age: 30
      workingHours: 10
      volunteeringHours: 5
      workTrainingHours: 5
    expect:
      meetsRequirement: true
  - name: 19 combined hours does not
    person:
      age: 30
      workingHours: 10
      volunteeringHours: 5
      workTrainingHours: 4
    expect:
      meetsRequirement: false
  - name: no proof of American Indian status federally
    person:
      age: 30
      isAmericanIndian: true
    expect:
      americanIndianExemptionRequiresProof: false
  - name: proof of volunteering when volunteering
    person:
      age: 30
      isVolunteer: true
      volunteeringHours: 5
    expect:
      needsProofOfVolunteering: true
  - name: no proof of volunteering at 0 hours
    person:
      age: 30
      isVolunteer: true
      volunteeringHours: 0
    expect:
      needsProofOfVolunteering: false
  - name: no proof of volunteering when not a volunteer
    person:
      age: 30
      isVolunteer: false
      volunteeringHours: 5
    expect:
      needsProofOfVolunteering: false
  - name: nothing extra prevents work federally
    person:
      age: 30
    expect:
      anyPreventingWork: false
  - name: a listed situation prevents work
    person:
      age: 30
      preventingWorkOther: true
    expect:
      anyPreventingWork: true
  - name: proof required for isStudent
    person:
      age: 30
      isStudent: true
    expect:
      requiresProof: true
  - name: proof required for preventingWorkDrugsAlcohol
    person:
      age: 30
      preventingWorkDrugsAlcohol: true
    expect:
      requiresProof: true
  - name: proof required for preventingWorkMedicalCondition
    person:
      age: 30
      preventingWorkMedicalCondition: true
    expect:
      requiresProof: true
  - name: proof required for receivingBenefitsSsi
    person:
      age: 30
      receivingBenefitsSsi: true
    expect:
      requiresProof: true
  - name: proof required for isInAlcoholTreatmentProgram
    person:
      age: 30
      isInAlcoholTreatmentProgram: true
    expect:
      requiresProof: true
  - name: no proof required for pregnancy
    person:
      age: 30
      isPregnant: true
    expect:
      requiresProof: false
  - name: no earnings proof once exempt
    person:
      age: 30
      isWorking: true
      workingWeeklyEarnings: 300
    expect:
      requiresProof: false
  - name: no outcome until age is answered
    person:
      isPregnant: true
    expect:
      requirementApplies: null
      satisfiesRequirement: null
  - name: 'outcome: age exempt'
    person:
      age: 16
      isPregnant: true
    expect:
      requirementApplies: false
      satisfiesRequirement: true
  - name: 'outcome: exempt'
    person:
      age: 30
      isPregnant: true
    expect:
      requirementApplies: true
      isExempt: true
      satisfiesRequirement: true
  - name: 'outcome: rules met'
    person:
      age: 30
      isWorking: true
      workingHours: 20
    expect:
      requirementApplies: true
      isExempt: false
      meetsRequirement: true
      satisfiesRequirement: true
  - name: 'outcome: rules not met'
    person:
      age: 30
      isWorking: true
      workingHours: 19
    expect:
      requirementApplies: true
      isExempt: false
      meetsRequirement: false
      satisfiesRequirement: false
  - name: proof of American Indian status
    state: DE
    person:
      age: 30
      isAmericanIndian: true
    expect:
      americanIndianExemptionRequiresProof: true
  - name: which makes proof required
    state: DE
    person:
      age: 30
      isAmericanIndian: true
    expect:
      requiresProof: true
  - name: no proof when not American Indian
    state: DE
    person:
      age: 30
