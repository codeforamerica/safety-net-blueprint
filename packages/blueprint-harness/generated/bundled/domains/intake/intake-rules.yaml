$schema: https://blueprint.codeforamerica.org/schemas/rules-schema.yaml
domain: intake
rulesets:
  interviewFlags:
    endpoint:
      path: /applications/evaluate-interview-flags
    inputs:
      application:
        type: object
        description: The application as it stands at the interview.
        properties:
          programsAppliedFor:
            type: array
            items:
              type: string
              enum:
                - snap
                - medicaid
                - tanf
                - chip
            description: Programs the household applied for.
          householdSize:
            type: integer
            description: The household size the application states.
          members:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  description: The member's id.
                age:
                  type: integer
                  description: Age in years.
                isDisabled:
                  type: boolean
                  description: Whether the member is disabled.
          jobs:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  description: The job's id.
                memberId:
                  type: string
                  description: The member who holds the job.
          incomes:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  description: The income's id.
                memberId:
                  type: string
                  description: The member who receives it.
                jobId:
                  type: string
                  description: The job it's paid for
                  when it's earned income.: null
                type:
                  type: string
                  enum:
                    - earned
                    - self_employment
                    - unearned
                  description: Where the money comes from.
                payPattern:
                  type: string
                  enum:
                    - regular
                    - irregular
                    - tips
                    - cash
                  description: How it's paid.
                monthlyAmount:
                  type: number
                  description: Monthly amount
                  in dollars.: null
          expenses:
            type: array
            items:
              type: object
              properties:
                category:
                  type: string
                  enum:
                    - rent
                    - mortgage
                    - utilities
                    - dependent_care
                    - medical
                    - child_support
                  description: What it's for.
                monthlyAmount:
                  type: number
                  description: Monthly amount
                  in dollars.: null
          reportedMonthlyIncome:
            type: number
            description: Total monthly income, as the household reported it.
          reportedMonthlyExpenses:
            type: number
            description: Total monthly expenses, as the household reported them.
          utilitiesIncludedInRent:
            type: boolean
            description: Whether the household says its utilities are included in the rent.
          claimsUtilityAllowance:
            type: boolean
            description: Whether a standard utility allowance is applied to the household.
          hasChangedCircumstances:
            type: boolean
            description: Whether the household reported changes since the application was submitted.
      lastCertification:
        type: object
        description: What the household's last certification recorded.
        properties:
          memberIds:
            type: array
            items:
              type: string
            description: The members certified last time.
          incomes:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  description: The income's id.
                memberId:
                  type: string
                  description: The member who receives it.
                jobId:
                  type: string
                  description: The job it's paid for
                  when it's earned income.: null
                type:
                  type: string
                  enum:
                    - earned
                    - self_employment
                    - unearned
                  description: Where the money comes from.
                payPattern:
                  type: string
                  enum:
                    - regular
                    - irregular
                    - tips
                    - cash
                  description: How it's paid.
                monthlyAmount:
                  type: number
                  description: Monthly amount
                  in dollars.: null
          expenses:
            type: array
            items:
              type: object
              properties:
                category:
                  type: string
                  enum:
                    - rent
                    - mortgage
                    - utilities
                    - dependent_care
                    - medical
                    - child_support
                  description: What it's for.
                monthlyAmount:
                  type: number
                  description: Monthly amount
                  in dollars.: null
      dataMatches:
        type: object
        description: What outside data and verified documents say.
        properties:
          wageRecords:
            type: array
            description: Monthly wages from state wage records or IEVS, by member.
            items:
              type: object
              properties:
                memberId:
                  type: string
                monthlyWages:
                  type: number
          payStubs:
            type: array
            description: Monthly amounts worked out from verified pay stubs, by income.
            items:
              type: object
              properties:
                incomeId:
                  type: string
                monthlyAmount:
                  type: number
    facts:
      - path: risks.earnedIncomeVaries
        type: boolean
        description: A member's wages are hourly with irregular hours, or include tips.
        expression: application.incomes.exists(i, i.type == 'earned' && i.payPattern in ['irregular', 'tips'])
      - path: risks.cashOrSelfEmploymentIncome
        type: boolean
        description: A member has self-employment income, or is paid in cash.
        expression: application.incomes.exists(i, i.type == 'self_employment' || i.payPattern == 'cash')
      - path: risks.incomeChangedSinceLastCertification
        type: boolean
        description: |
          An income source is new, ended, or a different amount from the last certification.
        expression: |
          application.incomes.exists(i, !lastCertification.incomes.exists(p,
            p.memberId == i.memberId && p.type == i.type && p.monthlyAmount == i.monthlyAmount))
          || lastCertification.incomes.exists(p, !application.incomes.exists(i,
            i.memberId == p.memberId && i.type == p.type))
      - path: risks.householdChangedSinceLastCertification
        type: boolean
        description: Someone has joined or left the household since the last certification.
        expression: |
          application.members.exists(m, !(m.id in lastCertification.memberIds)) || lastCertification.memberIds.exists(id, !application.members.exists(m, m.id == id))
      - path: risks.shelterCostsCarriedOver
        type: boolean
        description: Rent or mortgage is exactly what the last certification recorded.
        expression: |
          application.expenses.exists(e, e.category in ['rent', 'mortgage']
            && lastCertification.expenses.exists(p, p.category == e.category && p.monthlyAmount == e.monthlyAmount))
      - path: risks.elderlyOrDisabledWithoutMedicalCosts
        type: boolean
        description: A member is 60 or older, or disabled, and no medical costs are recorded.
        expression: |
          application.members.exists(m, m.age >= 60 || m.isDisabled) && !application.expenses.exists(e, e.category == 'medical')
      - path: risks.childrenAndEarnersWithoutDependentCare
        type: boolean
        description: |
          There's a child under 13 and someone earning, and no dependent care is recorded. Under 13 is this sketch's line, not a regulation's.
        expression: |
          application.members.exists(m, m.age < 13) && application.incomes.exists(i, i.type == 'earned' || i.type == 'self_employment') && !application.expenses.exists(e, e.category == 'dependent_care')
      - path: risks.circumstancesChangedSinceApplying
        type: boolean
        description: The household's circumstances changed between applying and the interview.
        expression: application.hasChangedCircumstances
      - path: risks.multipleProgramsApplied
        type: boolean
        description: The household applied for SNAP and another program, whose reporting rules differ.
        expression: "'snap' in application.programsAppliedFor && application.programsAppliedFor.exists(p, p != 'snap')"
      - path: inconsistencies.incomeBelowExpenses
        type: boolean
        description: Reported income doesn't cover reported expenses.
        expression: application.reportedMonthlyIncome < application.reportedMonthlyExpenses
      - path: inconsistencies.wagesDifferFromWageRecords
        type: boolean
        description: |
          A member's wages in the wage records differ by more than 10% from the earned income recorded for them, or they have no earned income recorded.
        expression: |
          dataMatches.wageRecords.exists(w, !application.incomes.exists(i,
            i.memberId == w.memberId && i.type == 'earned'
            && i.monthlyAmount >= w.monthlyWages * 0.9 && i.monthlyAmount <= w.monthlyWages * 1.1))
      - path: inconsistencies.incomeDiffersFromPayStub
        type: boolean
        description: A recorded income differs by more than 10% from what its verified pay stubs show.
        expression: |
          dataMatches.payStubs.exists(s, application.incomes.exists(i, i.id == s.incomeId
            && (i.monthlyAmount < s.monthlyAmount * 0.9 || i.monthlyAmount > s.monthlyAmount * 1.1)))
      - path: inconsistencies.householdSizeDiffersFromMembers
        type: boolean
        description: The stated household size isn't the number of members listed.
        expression: application.householdSize != size(application.members)
      - path: inconsistencies.jobWithoutEarnedIncome
        type: boolean
        description: A member has a job with no earned income recorded for it.
        expression: application.jobs.exists(j, !application.incomes.exists(i, has(i.jobId) && i.jobId == j.id))
      - path: inconsistencies.earnedIncomeWithoutJob
        type: boolean
        description: Earned income is recorded with no job behind it.
        expression: |
          application.incomes.exists(i, i.type == 'earned'
            && !(has(i.jobId) && application.jobs.exists(j, j.id == i.jobId)))
      - path: inconsistencies.utilitiesIncludedButClaimed
        type: boolean
        description: Utilities are included in the rent, but a utility allowance is applied.
        expression: application.utilitiesIncludedInRent && application.claimsUtilityAllowance
    outputs:
      risks.earnedIncomeVaries:
        type: boolean
      risks.cashOrSelfEmploymentIncome:
        type: boolean
      risks.incomeChangedSinceLastCertification:
        type: boolean
      risks.householdChangedSinceLastCertification:
        type: boolean
      risks.shelterCostsCarriedOver:
        type: boolean
      risks.elderlyOrDisabledWithoutMedicalCosts:
        type: boolean
      risks.childrenAndEarnersWithoutDependentCare:
        type: boolean
      risks.circumstancesChangedSinceApplying:
        type: boolean
      risks.multipleProgramsApplied:
        type: boolean
      inconsistencies.incomeBelowExpenses:
        type: boolean
      inconsistencies.wagesDifferFromWageRecords:
        type: boolean
      inconsistencies.incomeDiffersFromPayStub:
        type: boolean
      inconsistencies.householdSizeDiffersFromMembers:
        type: boolean
      inconsistencies.jobWithoutEarnedIncome:
        type: boolean
      inconsistencies.earnedIncomeWithoutJob:
        type: boolean
      inconsistencies.utilitiesIncludedButClaimed:
        type: boolean
