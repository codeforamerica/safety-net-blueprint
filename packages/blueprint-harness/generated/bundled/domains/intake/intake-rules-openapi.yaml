openapi: 3.1.0
info:
  title: Intake rules
  version: 1.0.0
  description: Evaluation endpoints for the intake rulesets, generated from their rules document.
  x-domain: intake
servers:
  - url: /intake
paths:
  /applications/evaluate-interview-flags:
    post:
      summary: Evaluate interviewFlags
      operationId: evaluateInterviewFlags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Input data for interviewFlags evaluation. All fields are optional — partial inputs trigger partial evaluation.
              properties:
                application:
                  type: object
                  description: The application as it stands at the interview.
                  properties:
                    programsAppliedFor:
                      type: array
                      items:
                        type: string
                        enum:
                          - snap
                          - medicaid
                          - tanf
                          - chip
                      description: Programs the household applied for.
                    householdSize:
                      type: integer
                      description: The household size the application states.
                    members:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            description: The member's id.
                          age:
                            type: integer
                            description: Age in years.
                          isDisabled:
                            type: boolean
                            description: Whether the member is disabled.
                    jobs:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            description: The job's id.
                          memberId:
                            type: string
                            description: The member who holds the job.
                    incomes:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            description: The income's id.
                          memberId:
                            type: string
                            description: The member who receives it.
                          jobId:
                            type: string
                            description: The job it's paid for
                            when it's earned income.: null
                          type:
                            type: string
                            enum:
                              - earned
                              - self_employment
                              - unearned
                            description: Where the money comes from.
                          payPattern:
                            type: string
                            enum:
                              - regular
                              - irregular
                              - tips
                              - cash
                            description: How it's paid.
                          monthlyAmount:
                            type: number
                            description: Monthly amount
                            in dollars.: null
                    expenses:
                      type: array
                      items:
                        type: object
                        properties:
                          category:
                            type: string
                            enum:
                              - rent
                              - mortgage
                              - utilities
                              - dependent_care
                              - medical
                              - child_support
                            description: What it's for.
                          monthlyAmount:
                            type: number
                            description: Monthly amount
                            in dollars.: null
                    reportedMonthlyIncome:
                      type: number
                      description: Total monthly income, as the household reported it.
                    reportedMonthlyExpenses:
                      type: number
                      description: Total monthly expenses, as the household reported them.
                    utilitiesIncludedInRent:
                      type: boolean
                      description: Whether the household says its utilities are included in the rent.
                    claimsUtilityAllowance:
                      type: boolean
                      description: Whether a standard utility allowance is applied to the household.
                    hasChangedCircumstances:
                      type: boolean
                      description: Whether the household reported changes since the application was submitted.
                lastCertification:
                  type: object
                  description: What the household's last certification recorded.
                  properties:
                    memberIds:
                      type: array
                      items:
                        type: string
                      description: The members certified last time.
                    incomes:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            description: The income's id.
                          memberId:
                            type: string
                            description: The member who receives it.
                          jobId:
                            type: string
                            description: The job it's paid for
                            when it's earned income.: null
                          type:
                            type: string
                            enum:
                              - earned
                              - self_employment
                              - unearned
                            description: Where the money comes from.
                          payPattern:
                            type: string
                            enum:
                              - regular
                              - irregular
                              - tips
                              - cash
                            description: How it's paid.
                          monthlyAmount:
                            type: number
                            description: Monthly amount
                            in dollars.: null
                    expenses:
                      type: array
                      items:
                        type: object
                        properties:
                          category:
                            type: string
                            enum:
                              - rent
                              - mortgage
                              - utilities
                              - dependent_care
                              - medical
                              - child_support
                            description: What it's for.
                          monthlyAmount:
                            type: number
                            description: Monthly amount
                            in dollars.: null
                dataMatches:
                  type: object
                  description: What outside data and verified documents say.
                  properties:
                    wageRecords:
                      type: array
                      description: Monthly wages from state wage records or IEVS, by member.
                      items:
                        type: object
                        properties:
                          memberId:
                            type: string
                          monthlyWages:
                            type: number
                    payStubs:
                      type: array
                      description: Monthly amounts worked out from verified pay stubs, by income.
                      items:
                        type: object
                        properties:
                          incomeId:
                            type: string
                          monthlyAmount:
                            type: number
      responses:
        "200":
          description: interviewFlags evaluation result.
          content:
            application/json:
              schema:
                allOf:
                  - type: array
                    description: |
                      Ordered list of output fact evaluation results. Only output facts are included; intermediate facts are not returned.
                    items:
                      oneOf:
                        - type: object
                          required:
                            - fact
                            - state
                            - value
                          properties:
                            fact:
                              type: string
                              description: The fact name.
                            state:
                              type: string
                              enum:
                                - complete
                            value:
                              description: The computed value.
                        - type: object
                          required:
                            - fact
                            - state
                            - value
                          properties:
                            fact:
                              type: string
                              description: The fact name.
                            state:
                              type: string
                              enum:
                                - placeholder
                            value:
                              description: The computed value, derived using one or more schema defaults.
                        - type: object
                          required:
                            - fact
                            - state
                            - missing
                          properties:
                            fact:
                              type: string
                              description: The fact name.
                            state:
                              type: string
                              enum:
                                - missing
                            missing:
                              type: array
                              description: Input paths required to resolve this fact.
                              items:
                                type: string
                        - type: object
                          required:
                            - fact
                            - state
                            - message
                          properties:
                            fact:
                              type: string
                              description: The fact name.
                            state:
                              type: string
                              enum:
                                - error
                            message:
                              type: string
                              description: The reason evaluation failed.
                      discriminator:
                        propertyName: state
                description: Evaluation result for interviewFlags.
        "400":
          description: The request is malformed or contains invalid parameters.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Machine-readable error code.
                  message:
                    type: string
                    description: Human-readable error description.
                  details:
                    type: array
                    description: Additional error details.
                    items:
                      type: object
                      additionalProperties: true
        "500":
          description: An unexpected error occurred on the server.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Machine-readable error code.
                  message:
                    type: string
                    description: Human-readable error description.
                  details:
                    type: array
                    description: Additional error details.
                    items:
                      type: object
                      additionalProperties: true
      tags:
        - Applications
      x-relationship:
        type: ruleset
        domain: intake
        id: interviewFlags
