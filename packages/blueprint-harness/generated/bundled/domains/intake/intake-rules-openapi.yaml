openapi: 3.1.0
info:
  title: Intake rules
  version: 1.0.0
  description: Evaluation endpoints for the intake rulesets, generated from their rules document.
  x-domain: intake
servers:
  - url: /intake
paths:
  /applications/evaluate-interview-prompts:
    post:
      summary: Evaluate interviewPrompts
      operationId: evaluateInterviewPrompts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Input data for interviewPrompts evaluation. All fields are optional — partial inputs trigger partial evaluation.
              properties:
                household:
                  type: object
                  description: Household composition and financial circumstances.
                  properties:
                    monthlyIncome:
                      type: number
                      description: Total monthly gross income reported by the household.
                    monthlyExpenses:
                      type: number
                      description: Total monthly expenses reported by the household.
                    members:
                      type: array
                      description: All individuals in the household.
                      items:
                        type: object
                        description: |
                          A person in the household, as the interview rules read them. Shared so a ruleset can reference it rather than restating the shape — the compiler follows the $ref down to individual field paths, which is what keeps missing-input tracking per-field rather than per-object.
                        properties:
                          age:
                            type: integer
                            description: Member's age in years.
                          isEmployed:
                            type: boolean
                            description: Whether the member is currently employed.
                          isStudent:
                            type: boolean
                            description: Whether the member is enrolled at least half-time in higher education.
                          isNonCitizen:
                            type: boolean
                            description: Whether the member is a non-citizen subject to immigration screening.
                application:
                  type: object
                  description: Application-level context relevant to the interview.
                  properties:
                    hasChangedCircumstances:
                      type: boolean
                      description: Whether the household reported changes since the application was submitted.
      responses:
        "200":
          description: interviewPrompts evaluation result.
          content:
            application/json:
              schema:
                allOf:
                  - type: array
                    description: |
                      Ordered list of output fact evaluation results. Only output facts are included; intermediate facts are not returned.
                    items:
                      oneOf:
                        - type: object
                          required:
                            - fact
                            - state
                            - value
                          properties:
                            fact:
                              type: string
                              description: The fact name.
                            state:
                              type: string
                              enum:
                                - complete
                            value:
                              description: The computed value.
                        - type: object
                          required:
                            - fact
                            - state
                            - value
                          properties:
                            fact:
                              type: string
                              description: The fact name.
                            state:
                              type: string
                              enum:
                                - placeholder
                            value:
                              description: The computed value, derived using one or more schema defaults.
                        - type: object
                          required:
                            - fact
                            - state
                            - missing
                          properties:
                            fact:
                              type: string
                              description: The fact name.
                            state:
                              type: string
                              enum:
                                - missing
                            missing:
                              type: array
                              description: Input paths required to resolve this fact.
                              items:
                                type: string
                        - type: object
                          required:
                            - fact
                            - state
                            - message
                          properties:
                            fact:
                              type: string
                              description: The fact name.
                            state:
                              type: string
                              enum:
                                - error
                            message:
                              type: string
                              description: The reason evaluation failed.
                      discriminator:
                        propertyName: state
                description: Evaluation result for interviewPrompts.
        "400":
          description: The request is malformed or contains invalid parameters.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Machine-readable error code.
                  message:
                    type: string
                    description: Human-readable error description.
                  details:
                    type: array
                    description: Additional error details.
                    items:
                      type: object
                      additionalProperties: true
        "500":
          description: An unexpected error occurred on the server.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Machine-readable error code.
                  message:
                    type: string
                    description: Human-readable error description.
                  details:
                    type: array
                    description: Additional error details.
                    items:
                      type: object
                      additionalProperties: true
      tags:
        - Applications
      x-relationship:
        type: ruleset
        domain: intake
        id: interviewPrompts
