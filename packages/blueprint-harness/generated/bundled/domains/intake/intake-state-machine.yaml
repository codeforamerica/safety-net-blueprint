$schema: state-machine-schema.yaml
extends: ../platform/platform-state-machine.yaml
version: "1.0"
domain: intake
machines:
  - object: Application
    states:
      - id: draft
        slaClock: stopped
        description: Created but not yet filed; regulatory clock has not started.
      - id: submitted
        slaClock: running
        description: Formally filed; regulatory clock starts (7 CFR § 273.2(g)).
      - id: under_review
        slaClock: running
        description: Caseworker is actively reviewing; clock running toward processing deadline.
      - id: withdrawn
        slaClock: stopped
        description: Household withdrew the application. Terminal.
      - id: closed
        slaClock: stopped
        description: Intake complete; case opened if approved. Terminal.
    initialState: draft
    timers:
      - id: review_reminder
        description: |
          Fires when an application has been awaiting caseworker review for too long. The callback event (intake.review_reminder) triggers an escalation notice.
    emits:
      - id: submitted
        description: TODO — describe when this event is emitted and who consumes it.
      - id: closed
        description: TODO — describe when this event is emitted and who consumes it.
      - id: withdrawn
        description: TODO — describe when this event is emitted and who consumes it.
      - id: review-reminder
        description: Emitted when an application has been awaiting caseworker review for too long.
    actions:
      - id: submit
        description: Formally submits a draft application, starting the regulatory processing clock.
        transition:
          from: draft
          to: submitted
        steps:
          - set:
              field: submittedAt
              value: $now
              description: Record the submission timestamp (regulatory clock start).
          - emit:
              event: submitted
              data:
                programsAppliedFor: $object.programsAppliedFor
              description: Triggers eligibility screening, caseworker task creation, and confirmation notice.
              type: intake.application.submitted
          - call: requestTimer
            with:
              timerId: review_reminder
              fireAfter:
                amount: 72
                unit: hours
              callback:
                event: intake.review_reminder
            description: Escalate if no caseworker has opened this application in 72 hours.
      - id: open
        description: Moves a submitted application into active caseworker review.
        transition:
          from: submitted
          to: under_review
        steps:
          - set:
              field: openedAt
              value: $now
              description: Record when caseworker began review, marking the start of active processing.
      - id: close
        description: Closes the application once intake processing is complete.
        schema:
          request:
            type: object
            required:
              - outcome
            properties:
              outcome:
                type: string
                enum:
                  - approved
                  - denied
                description: Whether the application was approved or denied at close.
              notes:
                type: string
                description: Optional caseworker notes on the closure decision.
        transition:
          from: under_review
          to: closed
        steps:
          - emit:
              event: closed
              type: intake.application.closed
      - id: withdraw
        description: Withdraws the application at the household's request.
        transition:
          from:
            - draft
            - submitted
            - under_review
          to: withdrawn
        guards:
          - actors:
              - applicant
              - case_worker
        steps:
          - emit:
              event: withdrawn
              type: intake.application.withdrawn
    "on":
      - type: intake.review_reminder
        description: |
          Escalates an application that has been awaiting caseworker review for too long. Fired by the scheduling service when the review_reminder timer expires.
        transition:
          from: submitted
        steps:
          - emit:
              event: review-reminder
              description: Notify supervisors that this application needs immediate attention.
              type: intake.application.review-reminder
  - object: Interview
    states:
      - id: scheduled
        slaClock: stopped
        description: Scheduled, not yet started.
      - id: in_progress
        slaClock: stopped
        description: Under way; its flags are evaluated as the household's incomes change.
      - id: completed
        slaClock: stopped
        description: Finished; its suggestions still open are expired. Terminal.
    initialState: scheduled
    emits:
      - id: started
        description: The interview started.
      - id: completed
        description: The interview finished.
    actions:
      - id: start
        description: Starts the interview and puts its flags to the worker.
        transition:
          from: scheduled
          to: in_progress
        steps:
          - set:
              field: startedAt
              value: $now
          - emit:
              event: started
              type: intake.interview.started
          - call: suggestFlags
      - id: process-suggestions
        description: |
          Evaluates the flags again, proposing a suggestion for a newly flagged record and expiring one whose flag cleared — called when the household's incomes change.
        transition:
          from: in_progress
          to: in_progress
        steps:
          - call: suggestFlags
      - id: complete
        description: Finishes the interview and expires its suggestions still open.
        transition:
          from: in_progress
          to: completed
        steps:
          - set:
              field: completedAt
              value: $now
          - emit:
              event: completed
              type: intake.interview.completed
          - call: expireOpenSuggestions
    "on":
      - type: intake.application_income.created
        description: Evaluates the flags of the application's interview in progress again.
        context:
          - income:
              from: intake/applications/incomes
              where:
                id: $this.subject
        steps:
          - call: processInterviewSuggestions
      - type: intake.application_income.updated
        description: Evaluates the flags of the application's interview in progress again.
        context:
          - income:
              from: intake/applications/incomes
              where:
                id: $this.subject
        steps:
          - call: processInterviewSuggestions
    procedures:
      - id: processInterviewSuggestions
        steps:
          - forEach:
              from: intake/applications/interviews
              where:
                applicationId: $income.applicationId
                status: in_progress
              as: interview
            do:
              - call:
                  operationId: processSuggestionsInterview
                  parameters:
                    - name: applicationId
                      in: path
                      value: $interview.applicationId
                    - name: interviewId
                      in: path
                      value: $interview.id
      - id: suggestFlags
        steps:
          - call:
              operationId: getInterviewFlagsInputs
              parameters:
                - name: applicationId
                  in: path
                  value: $object.applicationId
            bind: $inputs
          - evaluate: interviewFlags
            inputs:
              current:
                incomes: $inputs.incomes
              verified: $inputs.verified
            bind:
              earned: flagged.earnedIncomeVaries
              cash: flagged.cashOrSelfEmploymentIncome
              payStub: flagged.incomeDiffersFromPayStub
          - forEach:
              in: $earned
              as: id
            do:
              - call: proposeFlag
                with:
                  category: earned-income-varies
                  flag: flagged.earnedIncomeVaries
                  id: $id
          - forEach:
              in: $cash
              as: id
            do:
              - call: proposeFlag
                with:
                  category: cash-or-self-employment-income
                  flag: flagged.cashOrSelfEmploymentIncome
                  id: $id
          - forEach:
              in: $payStub
              as: correction
            do:
              - call: proposeCorrection
                with:
                  correction: $correction
          - forEach:
              from: decision-support/suggestions
              where:
                and:
                  - "==":
                      - var: metadata.intake.interviewId
                      - var: object.id
                  - in:
                      - var: status
                      - - proposed
                        - refused
              as: open
            do:
              - if: |
                  (open.metadata.intake.flag == 'flagged.earnedIncomeVaries' && !(open.metadata.intake.recordId in earned)) || (open.metadata.intake.flag == 'flagged.cashOrSelfEmploymentIncome' && !(open.metadata.intake.recordId in cash)) || (open.metadata.intake.flag == 'flagged.incomeDiffersFromPayStub' && !payStub.exists(c, c.id == open.metadata.intake.recordId))
                then:
                  - call: expireSuggestionOf
                    with:
                      id: $open.id
      - id: proposeFlag
        parameters:
          - category
          - flag
          - id
        steps:
          - call:
              operationId: createSuggestion
              requestBody:
                payload:
                  kind: informing
                  category: $params.category
                  subjectType: application_income
                  subjectId: $params.id
                  metadata:
                    intake:
                      interviewId: $object.id
                      flag: $params.flag
                      recordId: $params.id
            catch:
              do: []
      - id: proposeCorrection
        parameters:
          - correction
        steps:
          - call:
              operationId: createSuggestion
              requestBody:
                payload:
                  kind: operation
                  call:
                    operationId: updateApplicationIncome
                    parameters:
                      - name: applicationId
                        in: path
                        value: $object.applicationId
                      - name: incomeId
                        in: path
                        value: $params.correction.id
                    requestBody:
                      payload:
                        amount: $params.correction.amount
                        frequency: $params.correction.frequency
                  metadata:
                    intake:
                      interviewId: $object.id
                      flag: flagged.incomeDiffersFromPayStub
                      recordId: $params.correction.id
            catch:
              do: []
      - id: expireOpenSuggestions
        steps:
          - forEach:
              from: decision-support/suggestions
              where:
                and:
                  - "==":
                      - var: metadata.intake.interviewId
                      - var: object.id
                  - in:
                      - var: status
                      - - proposed
                        - refused
              as: open
            do:
              - call: expireSuggestionOf
                with:
                  id: $open.id
      - id: expireSuggestionOf
        parameters:
          - id
        steps:
          - call:
              operationId: expireSuggestion
              parameters:
                - name: suggestionId
                  in: path
                  value: $params.id
$defs:
  CloseRequest:
    type: object
    required:
      - outcome
    properties:
      outcome:
        type: string
        enum:
          - approved
          - denied
        description: Whether the application was approved or denied at close.
      notes:
        type: string
        description: Optional caseworker notes on the closure decision.
