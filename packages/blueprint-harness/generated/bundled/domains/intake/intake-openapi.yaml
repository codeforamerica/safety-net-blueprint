openapi: 3.1.0
info:
  title: Intake API
  version: 1.0.0
  x-domain: intake
  x-status: stable
  x-visibility: public
x-events:
  application.created:
    type: org.codeforamerica.safety-net-blueprint.intake.application.created
    summary: Emitted when an application is created.
  application.updated:
    type: org.codeforamerica.safety-net-blueprint.intake.application.updated
    summary: Emitted when an application is updated via PATCH.
  application.deleted:
    type: org.codeforamerica.safety-net-blueprint.intake.application.deleted
    summary: Emitted when an application is deleted.
  applicationMember.created:
    type: org.codeforamerica.safety-net-blueprint.intake.application-member.created
    summary: Emitted when a household member is added to an application.
  applicationMember.updated:
    type: org.codeforamerica.safety-net-blueprint.intake.application-member.updated
    summary: Emitted when a household member is updated via PATCH.
  applicationMember.deleted:
    type: org.codeforamerica.safety-net-blueprint.intake.application-member.deleted
    summary: Emitted when a household member is removed from an application.
  intake.application.submitted:
    type: org.codeforamerica.safety-net-blueprint.intake.application.submitted
    summary: Emitted when an applicant formally submits an application, starting the regulatory processing clock.
  intake.application.withdrawn:
    type: org.codeforamerica.safety-net-blueprint.intake.application.withdrawn
    summary: Emitted when a household withdraws their application.
  intake.application.closed:
    type: org.codeforamerica.safety-net-blueprint.intake.application.closed
    summary: Emitted when intake is complete and the application is closed.
paths:
  /applications:
    get:
      summary: List applications
      operationId: listApplications
      tags:
        - Applications
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: |
            Search query using field:value syntax. Multiple conditions separated by
            spaces are ANDed together.

            **URL Encoding:** This parameter must be URL-encoded when sent over HTTP.
            Most HTTP clients handle this automatically. Examples in this documentation
            show human-readable syntax for clarity.

            ## Syntax

            | Pattern | Description | Example |
            |---------|-------------|---------|
            | `term` | Full-text exact match | `john` |
            | `*term*` | Full-text contains | `*john*` |
            | `term*` | Full-text starts with | `john*` |
            | `*term` | Full-text ends with | `*smith` |
            | `field:value` | Exact match on field | `status:approved` |
            | `field:*value*` | Contains (case-insensitive) | `name:*john*` |
            | `field:value*` | Starts with | `name:john*` |
            | `field:*value` | Ends with | `email:*@example.com` |
            | `field:"value"` | Quoted value (for spaces) | `name:"john doe"` |
            | `field.nested:value` | Nested field (dot notation) | `address.state:CA` |
            | `field:>value` | Greater than | `income:>1000` |
            | `field:>=value` | Greater than or equal | `income:>=1000` |
            | `field:<value` | Less than | `income:<5000` |
            | `field:<=value` | Less than or equal | `income:<=5000` |
            | `field:val1,val2` | Match any value (OR) | `status:approved,pending` |
            | `-field:value` | Exclude / negate | `-status:denied` |
            | `field:*` | Field exists (not null) | `email:*` |
            | `-field:*` | Field does not exist | `-deletedAt:*` |

            ## Examples

            - `john` — exact match for "john" in searchable fields
            - `*john*` — contains "john" in searchable fields
            - `name:*smith*` — name contains "smith" (case-insensitive)
            - `email:*@example.com` — email ends with "@example.com"
            - `status:approved` — exact match on status field
            - `status:approved,pending` — status is "approved" OR "pending"
            - `income:>=1000` — income greater than or equal to 1000
            - `created:>2024-01-01` — created after January 1, 2024
            - `status:approved income:>=1000` — approved AND income >= 1000 (multiple conditions)
            - `-status:denied` — exclude records with status "denied"
            - `-deletedAt:*` — only records where deletedAt does not exist
            - `applicant.state:CA` — nested field filter

            ## URL Encoding Reference

            When manually constructing URLs, encode these characters:

            | Character | Encoded |
            |-----------|---------|
            | (space) | `%20` or `+` |
            | `"` | `%22` |
            | `:` | `%3A` |
            | `>` | `%3E` |
            | `<` | `%3C` |
            | `,` | `%2C` |

            **Example:**
            ```
            Human-readable: q=status:approved income:>=1000
            URL-encoded:    q=status%3Aapproved%20income%3A%3E%3D1000
            ```
          examples:
            simpleSearch:
              summary: Full-text exact match
              value: john
            containsSearch:
              summary: Full-text contains
              value: "*john*"
            exactMatch:
              summary: Filter by status
              value: status:approved
            containsField:
              summary: Name contains (case-insensitive)
              value: name:*smith*
            startsWithField:
              summary: Name starts with
              value: name:john*
            endsWithField:
              summary: Email ends with domain
              value: email:*@example.com
            multipleFilters:
              summary: Status and income filter
              value: status:approved income:>=1000
            dateRange:
              summary: Created after date
              value: created:>2024-01-01
            multiValue:
              summary: Multiple statuses (OR)
              value: status:approved,pending,under_review
            negation:
              summary: Exclude denied
              value: "-status:denied"
            notExists:
              summary: Field does not exist
              value: "-deletedAt:*"
            nestedField:
              summary: Filter by nested field
              value: applicant.state:CA
        - name: limit
          in: query
          description: Maximum number of items to return (1-100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          description: Number of items to skip before collecting results.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: sort
          in: query
          required: false
          schema:
            type: string
          description: |
            Comma-separated list of fields to sort the response by. Prefix a field
            with `-` for descending order. The first field is the primary sort;
            subsequent fields are tie-breakers in declaration order.

            **URL Encoding:** This parameter must be URL-encoded when sent over HTTP.
            Most HTTP clients handle this automatically. Examples below show
            human-readable syntax for clarity.

            Which fields a given list endpoint allows is declared in the operation's
            `x-sortable.fields` extension. Sending a field name not present in that
            list returns `400 FIELD_NOT_SORTABLE`. Sending a field name that doesn't
            exist on the resource schema returns `400 INVALID_SORT_FIELD`. When this
            parameter is omitted, the operation's `x-sortable.default` (if declared)
            is applied; otherwise no client-driven sort is applied. A configured
            tie-breaker (default `id`) is always appended for stable pagination.

            See `api-patterns.yaml#sorting` for the full convention and
            `docs/architecture/x-extensions.md` for the extension shape.

            ## Syntax

            | Pattern | Description | Example |
            |---------|-------------|---------|
            | `fieldName` | Ascending | `sort=createdAt` |
            | `-fieldName` | Descending | `sort=-createdAt` |
            | `field1,field2` | Multi-field | `sort=status,-priority` |
            | `nested.field` | Nested field via dot notation | `sort=name.lastName` |

            ## Examples

            - `sort=createdAt` — oldest first
            - `sort=-createdAt` — newest first
            - `sort=-priority,dueDate` — highest priority first, then oldest due date
            - `sort=name.lastName,name.firstName` — alphabetical by surname, then given name
          examples:
            ascendingByDate:
              summary: Oldest first
              value: createdAt
            descendingByDate:
              summary: Newest first
              value: "-createdAt"
            multiField:
              summary: Multi-field — primary then tie-breaker
              value: "-priority,dueDate"
            nestedField:
              summary: Sort by a nested field
              value: name.lastName
        - name: status
          in: query
          schema:
            type: string
          description: Filter by application status.
        - name: channel
          in: query
          schema:
            type: string
          description: Filter by submission channel.
      responses:
        "200":
          description: A paginated list of applications.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                  - total
                  - limit
                  - offset
                properties:
                  items:
                    type: array
                    items:
                      description: A benefit application record, including server-managed fields.
                      unevaluatedProperties: false
                      required:
                        - id
                        - status
                        - programsApplied
                        - referenceId
                        - createdAt
                        - updatedAt
                      allOf:
                        - type: object
                          properties:
                            programsApplied:
                              type: array
                              items:
                                type: string
                                enum:
                                  - snap
                                  - medicaid
                                  - chip
                                  - tanf
                              description: Benefit programs the household is applying for.
                            channel:
                              type: string
                              enum:
                                - online
                                - phone
                                - in_person
                                - mail
                              description: Channel through which the application was submitted.
                            address:
                              type: object
                              description: Mailing or residential address.
                              required:
                                - street
                                - city
                                - state
                                - zip
                              properties:
                                street:
                                  type: string
                                  description: Street address including apartment or unit number.
                                city:
                                  type: string
                                  description: City name.
                                state:
                                  type: string
                                  minLength: 2
                                  maxLength: 2
                                  description: Two-letter US state abbreviation.
                                zip:
                                  type: string
                                  pattern: ^\d{5}(-\d{4})?$
                                  description: ZIP code or ZIP+4.
                            contactInfo:
                              type: object
                              description: Contact details for the primary applicant.
                              properties:
                                phone:
                                  type: string
                                  description: Primary phone number.
                                email:
                                  type: string
                                  format: email
                                  description: Email address.
                                preferredContact:
                                  type: string
                                  enum:
                                    - phone
                                    - email
                                    - mail
                                  description: Applicant's preferred method of contact.
                            labels:
                              type: object
                              additionalProperties:
                                type: string
                              description: |
                                Arbitrary key-value labels for state-specific tagging, routing, and reporting. States may use these to attach jurisdiction-specific metadata without modifying the core schema.
                            countyCode:
                              type: string
                              maxLength: 10
                              description: County code for routing this application to the correct local office.
                        - type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                              readOnly: true
                              description: Unique identifier (server-generated).
                            referenceId:
                              type: string
                              readOnly: true
                              x-derived: $this.id.substring(0, 8).toUpperCase()
                              description: Short human-readable reference code for this application.
                            confirmationNumber:
                              type: string
                              readOnly: true
                              deprecated: true
                              description: |
                                Deprecated — use referenceId instead. Legacy confirmation number assigned by older case management systems. Retained for backward compatibility during state migration periods.
                            status:
                              type: string
                              readOnly: true
                              description: Current lifecycle status of the application.
                              enum:
                                - draft
                                - submitted
                                - under_review
                                - withdrawn
                                - closed
                            submittedAt:
                              type: string
                              format: date-time
                              nullable: true
                              readOnly: true
                              description: Timestamp when the application was formally submitted. Null until submitted.
                            openedAt:
                              type: string
                              format: date-time
                              nullable: true
                              readOnly: true
                              description: Timestamp when a caseworker began active review. Null until the application is opened.
                            slaTypeCode:
                              type: string
                              readOnly: true
                              description: SLA type governing the processing deadline for this application.
                              enum:
                                - snap_standard
                                - medicaid_standard
                            members:
                              type: array
                              items:
                                description: A household member on a benefit application.
                                unevaluatedProperties: false
                                required:
                                  - id
                                  - applicationId
                                  - firstName
                                  - lastName
                                  - relationship
                                  - createdAt
                                  - updatedAt
                                allOf:
                                  - type: object
                                    properties:
                                      firstName:
                                        type: string
                                        description: Member's first name.
                                      lastName:
                                        type: string
                                        description: Member's last name.
                                      dateOfBirth:
                                        type: string
                                        format: date
                                        description: Member's date of birth (YYYY-MM-DD).
                                      relationship:
                                        type: string
                                        enum:
                                          - self
                                          - spouse
                                          - child
                                          - parent
                                          - sibling
                                          - other
                                        description: Relationship of this member to the primary applicant.
                                      incomeSource:
                                        description: Income reported by a household member. Type discriminator determines the variant.
                                        oneOf:
                                          - type: object
                                            description: Income from wages or salary employment.
                                            required:
                                              - type
                                              - employer
                                              - monthlyGrossIncome
                                            properties:
                                              type:
                                                type: string
                                                const: employment
                                              employer:
                                                type: string
                                                description: Name of the employer.
                                              monthlyGrossIncome:
                                                type: number
                                                minimum: 0
                                                description: Monthly gross income before deductions (dollars).
                                          - type: object
                                            description: Income from self-employment or a sole proprietorship.
                                            required:
                                              - type
                                              - businessType
                                              - monthlyNetIncome
                                            properties:
                                              type:
                                                type: string
                                                const: self_employment
                                              businessType:
                                                type: string
                                                description: Type of business (e.g., sole proprietor, freelance).
                                              monthlyNetIncome:
                                                type: number
                                                minimum: 0
                                                description: Monthly net income after business expenses (dollars).
                                          - type: object
                                            description: Income from a government benefit program.
                                            required:
                                              - type
                                              - benefitType
                                              - monthlyAmount
                                            properties:
                                              type:
                                                type: string
                                                const: benefit
                                              benefitType:
                                                type: string
                                                enum:
                                                  - ssi
                                                  - ssdi
                                                  - unemployment
                                                  - veterans
                                                  - other
                                                description: The benefit program providing income.
                                              monthlyAmount:
                                                type: number
                                                minimum: 0
                                                description: Monthly benefit amount (dollars).
                                        discriminator:
                                          propertyName: type
                                          mapping:
                                            employment: "#/$defs/EmploymentIncome"
                                            self_employment: "#/$defs/SelfEmploymentIncome"
                                            benefit: "#/$defs/BenefitIncome"
                                      notificationPreference:
                                        description: How this member prefers to receive benefit notices and updates.
                                        oneOf:
                                          - type: object
                                            required:
                                              - channel
                                              - address
                                            properties:
                                              channel:
                                                type: string
                                                enum:
                                                  - email
                                              address:
                                                type: string
                                                format: email
                                                description: Email address for benefit notices.
                                          - type: object
                                            required:
                                              - channel
                                              - phone
                                            properties:
                                              channel:
                                                type: string
                                                enum:
                                                  - sms
                                              phone:
                                                type: string
                                                description: Phone number for SMS benefit notices (E.164 format).
                                          - type: object
                                            required:
                                              - channel
                                              - address
                                            properties:
                                              channel:
                                                type: string
                                                enum:
                                                  - mail
                                              address:
                                                type: object
                                                description: Mailing or residential address.
                                                required:
                                                  - street
                                                  - city
                                                  - state
                                                  - zip
                                                properties:
                                                  street:
                                                    type: string
                                                    description: Street address including apartment or unit number.
                                                  city:
                                                    type: string
                                                    description: City name.
                                                  state:
                                                    type: string
                                                    minLength: 2
                                                    maxLength: 2
                                                    description: Two-letter US state abbreviation.
                                                  zip:
                                                    type: string
                                                    pattern: ^\d{5}(-\d{4})?$
                                                    description: ZIP code or ZIP+4.
                                        discriminator:
                                          propertyName: channel
                                      verificationEvidence:
                                        description: |
                                          Identity verification evidence for this member. Accepts anyOf: an electronic data match result, a manual caseworker review record, or both.
                                        anyOf:
                                          - type: object
                                            required:
                                              - source
                                              - matchCode
                                              - verifiedAt
                                            properties:
                                              source:
                                                type: string
                                                description: Data source used for the electronic match (e.g., SSA, IRS-IEVS).
                                              matchCode:
                                                type: string
                                                description: Result code returned by the data source.
                                              verifiedAt:
                                                type: string
                                                format: date-time
                                                description: Timestamp when the electronic verification was completed.
                                          - type: object
                                            required:
                                              - verifiedBy
                                              - verifiedAt
                                            properties:
                                              verifiedBy:
                                                type: string
                                                description: ID of the caseworker who performed the manual verification.
                                              verifiedAt:
                                                type: string
                                                format: date-time
                                                description: Timestamp when the manual verification was completed.
                                              notes:
                                                type: string
                                                description: Optional caseworker notes on the verification outcome.
                                  - type: object
                                    properties:
                                      id:
                                        type: string
                                        format: uuid
                                        readOnly: true
                                        description: Unique identifier (server-generated).
                                      applicationId:
                                        type: string
                                        format: uuid
                                        description: The application this member belongs to.
                                        x-relationship:
                                          type: fk
                                          resource: Application
                                          style: links-only
                                      createdAt:
                                        type: string
                                        format: date-time
                                        readOnly: true
                                        description: Timestamp when the member was added.
                                      updatedAt:
                                        type: string
                                        format: date-time
                                        readOnly: true
                                        description: Timestamp when the member was last updated.
                                      links:
                                        type: object
                                        readOnly: true
                                        description: Related resource links.
                                        properties:
                                          application:
                                            type: string
                                            format: uri-reference
                                            description: Link to the related Application resource.
                              description: Household members on this application.
                            createdAt:
                              type: string
                              format: date-time
                              readOnly: true
                              description: Timestamp when the application was created.
                            updatedAt:
                              type: string
                              format: date-time
                              readOnly: true
                              description: Timestamp when the application was last updated.
                        - type: object
                          properties:
                            _links:
                              type: object
                              readOnly: true
                              description: Generated composition links.
                              properties:
                                applicationSummary:
                                  type: object
                                  description: Link to the applicationSummary composition.
                                  properties:
                                    href:
                                      type: string
                                      format: uri-reference
                                      readOnly: true
                        - type: object
                          properties:
                            _links:
                              type: object
                              readOnly: true
                              description: Generated composition links.
                              properties:
                                applicationReview:
                                  type: object
                                  description: Link to the applicationReview composition.
                                  properties:
                                    href:
                                      type: string
                                      format: uri-reference
                                      readOnly: true
                  total:
                    type: integer
                    minimum: 0
                    description: Total number of matching applications.
                  limit:
                    type: integer
                    minimum: 1
                    maximum: 100
                    description: Maximum number of applications per page.
                  offset:
                    type: integer
                    minimum: 0
                    description: Number of applications skipped.
                  hasNext:
                    type: boolean
                    description: Whether more applications are available.
        "400":
          description: Bad request — validation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
    post:
      summary: Create an application
      operationId: createApplication
      tags:
        - Applications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  properties:
                    programsApplied:
                      type: array
                      items:
                        type: string
                        enum:
                          - snap
                          - medicaid
                          - chip
                          - tanf
                      description: Benefit programs the household is applying for.
                    channel:
                      type: string
                      enum:
                        - online
                        - phone
                        - in_person
                        - mail
                      description: Channel through which the application was submitted.
                    address:
                      type: object
                      description: Mailing or residential address.
                      required:
                        - street
                        - city
                        - state
                        - zip
                      properties:
                        street:
                          type: string
                          description: Street address including apartment or unit number.
                        city:
                          type: string
                          description: City name.
                        state:
                          type: string
                          minLength: 2
                          maxLength: 2
                          description: Two-letter US state abbreviation.
                        zip:
                          type: string
                          pattern: ^\d{5}(-\d{4})?$
                          description: ZIP code or ZIP+4.
                    contactInfo:
                      type: object
                      description: Contact details for the primary applicant.
                      properties:
                        phone:
                          type: string
                          description: Primary phone number.
                        email:
                          type: string
                          format: email
                          description: Email address.
                        preferredContact:
                          type: string
                          enum:
                            - phone
                            - email
                            - mail
                          description: Applicant's preferred method of contact.
                    labels:
                      type: object
                      additionalProperties:
                        type: string
                      description: |
                        Arbitrary key-value labels for state-specific tagging, routing, and reporting. States may use these to attach jurisdiction-specific metadata without modifying the core schema.
                    countyCode:
                      type: string
                      maxLength: 10
                      description: County code for routing this application to the correct local office.
                - type: object
                  required:
                    - programsApplied
                    - channel
      responses:
        "201":
          description: Application created successfully.
          content:
            application/json:
              schema:
                description: A benefit application record, including server-managed fields.
                unevaluatedProperties: false
                required:
                  - id
                  - status
                  - programsApplied
                  - referenceId
                  - createdAt
                  - updatedAt
                allOf:
                  - type: object
                    properties:
                      programsApplied:
                        type: array
                        items:
                          type: string
                          enum:
                            - snap
                            - medicaid
                            - chip
                            - tanf
                        description: Benefit programs the household is applying for.
                      channel:
                        type: string
                        enum:
                          - online
                          - phone
                          - in_person
                          - mail
                        description: Channel through which the application was submitted.
                      address:
                        type: object
                        description: Mailing or residential address.
                        required:
                          - street
                          - city
                          - state
                          - zip
                        properties:
                          street:
                            type: string
                            description: Street address including apartment or unit number.
                          city:
                            type: string
                            description: City name.
                          state:
                            type: string
                            minLength: 2
                            maxLength: 2
                            description: Two-letter US state abbreviation.
                          zip:
                            type: string
                            pattern: ^\d{5}(-\d{4})?$
                            description: ZIP code or ZIP+4.
                      contactInfo:
                        type: object
                        description: Contact details for the primary applicant.
                        properties:
                          phone:
                            type: string
                            description: Primary phone number.
                          email:
                            type: string
                            format: email
                            description: Email address.
                          preferredContact:
                            type: string
                            enum:
                              - phone
                              - email
                              - mail
                            description: Applicant's preferred method of contact.
                      labels:
                        type: object
                        additionalProperties:
                          type: string
                        description: |
                          Arbitrary key-value labels for state-specific tagging, routing, and reporting. States may use these to attach jurisdiction-specific metadata without modifying the core schema.
                      countyCode:
                        type: string
                        maxLength: 10
                        description: County code for routing this application to the correct local office.
                  - type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        readOnly: true
                        description: Unique identifier (server-generated).
                      referenceId:
                        type: string
                        readOnly: true
                        x-derived: $this.id.substring(0, 8).toUpperCase()
                        description: Short human-readable reference code for this application.
                      confirmationNumber:
                        type: string
                        readOnly: true
                        deprecated: true
                        description: |
                          Deprecated — use referenceId instead. Legacy confirmation number assigned by older case management systems. Retained for backward compatibility during state migration periods.
                      status:
                        type: string
                        readOnly: true
                        description: Current lifecycle status of the application.
                        enum:
                          - draft
                          - submitted
                          - under_review
                          - withdrawn
