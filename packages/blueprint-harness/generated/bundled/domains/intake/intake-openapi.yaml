                  - id
                  - status
                  - programsAppliedFor
                  - programCount
                  - createdAt
                  - updatedAt
                allOf:
                  - type: object
                    properties:
                      programsAppliedFor:
                        type: array
                        items:
                          type: string
                          enum:
                            - snap
                            - medicaid
                            - chip
                            - tanf
                        description: Benefit programs the household is applying for.
                      channel:
                        type: string
                        enum:
                          - online
                          - phone
                          - in_person
                          - mail
                        description: Channel through which the application was submitted.
                      address:
                        type: object
                        description: Mailing or residential address.
                        required:
                          - street
                          - city
                          - state
                          - zip
