    patch:
      summary: Change applicationDetails
      operationId: updateApplicationDetails
      description: Applies a JSON Patch (RFC 6902) all or nothing. Each change is made through its record's own operation, as the caller, with that operation's permissions, guards and events; if any change is refused, nothing is saved and no events are sent. A change may add a record under an id the caller chooses, and another change in the same patch may name it.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: |
            A key the client makes for one request that creates or changes records,
            so a retry doesn't make them twice. Send the same key with every retry of
            the same request: the first is carried out, and a repeat gets the same
            response back. The same key with a
            different request is refused with 422. Keys are scoped to the caller.

            Any value unique to the operation works; a UUID is recommended. An
            operation that lists this parameter requires it. Follows the IETF HTTP API
            working group's `Idempotency-Key` header draft, and the convention Stripe
            and others use.
          schema:
            type: string
            minLength: 1
            maxLength: 255
          example: 6f1c2e8a-3b5d-4c7e-9a10-2d4f6b8c0e12
      requestBody:
        required: true
        content:
          application/json-patch+json:
            schema:
              type: array
              description: |
                A JSON Patch (RFC 6902), sent as application/json-patch+json: changes applied in order, all or nothing. Each change's path is a JSON Pointer (RFC 6901). A change may carry members the RFC doesn't define, such as evidence; the RFC says they're ignored when the patch is applied.
              items:
                type: object
                description: One change in a JSON Patch.
                required:
                  - op
                  - path
                properties:
                  op:
                    type: string
                    enum:
                      - add
                      - remove
                      - replace
                      - move
                      - copy
                      - test
                    description: |
                      What the change does. `test` changes nothing: it refuses the whole patch unless the value at `path` equals `value`.
                  path:
                    type: string
                    format: json-pointer
                    description: Where the change applies, e.g. `/incomes/{incomeId}/amount`.
                  value:
                    description: The value to add, replace with, or test for.
                  from:
                    type: string
                    format: json-pointer
                    description: Where `move` and `copy` take their value from.
                allOf:
                  - if:
                      properties:
                        op:
                          enum:
                            - add
                            - replace
                            - test
                    then:
                      required:
                        - value
                  - if:
                      properties:
                        op:
                          enum:
                            - move
                            - copy
                    then:
                      required:
                        - from
