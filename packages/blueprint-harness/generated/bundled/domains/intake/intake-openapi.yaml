                            createdAt:
                              type: string
                              format: date-time
                              readOnly: true
                            updatedAt:
                              type: string
                              format: date-time
                              readOnly: true
                            links:
                              type: object
                              readOnly: true
                              description: Related resource links.
                              properties:
                                application:
                                  type: string
                                  format: uri-reference
                                  description: Link to the related Application resource.
                  total:
                    type: integer
