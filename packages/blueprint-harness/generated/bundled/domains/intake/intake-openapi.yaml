        members:
          type: object
          description: The ApplicationMember records, keyed by id.
          propertyNames:
            format: uuid
          additionalProperties:
            description: A household member on a benefit application.
            unevaluatedProperties: false
            required:
              - id
              - application
              - firstName
              - lastName
              - relationship
              - createdAt
              - updatedAt
            allOf:
              - type: object
                properties:
                  firstName:
                    type: string
                    description: Member's first name.
                  lastName:
                    type: string
                    description: Member's last name.
                  dateOfBirth:
                    type: string
                    format: date
                    description: Member's date of birth (YYYY-MM-DD).
                  relationship:
                    type: string
                    enum:
                      - self
                      - spouse
                      - child
                      - parent
                      - sibling
                      - other
                    description: Relationship of this member to the primary applicant.
                  incomeSource:
                    description: Income reported by a household member. Type discriminator determines the variant.
                    oneOf:
                      - type: object
                        description: Income from wages or salary employment.
                        required:
                          - type
                          - employer
                          - monthlyGrossIncome
                        properties:
                          type:
                            type: string
                            const: employment
                          employer:
                            type: string
                            description: Name of the employer.
                          monthlyGrossIncome:
                            type: number
                            minimum: 0
                            description: Monthly gross income before deductions (dollars).
                      - type: object
                        description: Income from self-employment or a sole proprietorship.
                        required:
                          - type
                          - businessType
                          - monthlyNetIncome
                        properties:
                          type:
                            type: string
                            const: self_employment
                          businessType:
                            type: string
                            description: Type of business (e.g., sole proprietor, freelance).
                          monthlyNetIncome:
                            type: number
                            minimum: 0
                            description: Monthly net income after business expenses (dollars).
                      - type: object
                        description: Income from a government benefit program.
                        required:
                          - type
                          - benefitType
                          - monthlyAmount
                        properties:
                          type:
                            type: string
                            const: benefit
                          benefitType:
                            type: string
                            enum:
                              - ssi
                              - ssdi
                              - unemployment
                              - veterans
                              - other
                            description: The benefit program providing income.
                          monthlyAmount:
                            type: number
                            minimum: 0
                            description: Monthly benefit amount (dollars).
                    discriminator:
                      propertyName: type
                      mapping:
                        employment: "#/$defs/EmploymentIncome"
                        self_employment: "#/$defs/SelfEmploymentIncome"
                        benefit: "#/$defs/BenefitIncome"
                  notificationPreference:
                    description: How this member prefers to receive benefit notices and updates.
                    oneOf:
                      - type: object
                        required:
                          - channel
                          - address
                        properties:
                          channel:
                            type: string
                            enum:
                              - email
                          address:
                            type: string
                            format: email
                            description: Email address for benefit notices.
                      - type: object
                        required:
                          - channel
                          - phone
                        properties:
                          channel:
                            type: string
                            enum:
                              - sms
                          phone:
                            type: string
                            description: Phone number for SMS benefit notices (E.164 format).
                      - type: object
                        required:
                          - channel
                          - address
                        properties:
                          channel:
                            type: string
                            enum:
                              - mail
                          address:
                            type: object
                            description: Mailing or residential address.
                            required:
                              - street
                              - city
                              - state
                              - zip
                            properties:
                              street:
                                type: string
                                description: Street address including apartment or unit number.
                              city:
                                type: string
                                description: City name.
                              state:
                                type: string
                                minLength: 2
                                maxLength: 2
                                description: Two-letter US state abbreviation.
                              zip:
                                type: string
                                pattern: ^\d{5}(-\d{4})?$
                                description: ZIP code or ZIP+4.
                    discriminator:
                      propertyName: channel
                  verificationEvidence:
                    description: |
                      Identity verification evidence for this member. Accepts anyOf: an electronic data match result, a manual caseworker review record, or both.
                    anyOf:
                      - type: object
                        required:
                          - source
                          - matchCode
                          - verifiedAt
                        properties:
                          source:
                            type: string
                            description: Data source used for the electronic match (e.g., SSA, IRS-IEVS).
                          matchCode:
                            type: string
                            description: Result code returned by the data source.
                          verifiedAt:
                            type: string
                            format: date-time
                            description: Timestamp when the electronic verification was completed.
                      - type: object
                        required:
                          - verifiedBy
                          - verifiedAt
                        properties:
                          verifiedBy:
                            type: string
                            description: ID of the caseworker who performed the manual verification.
                          verifiedAt:
                            type: string
                            format: date-time
                            description: Timestamp when the manual verification was completed.
                          notes:
                            type: string
                            description: Optional caseworker notes on the verification outcome.
              - type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    readOnly: true
                    description: Unique identifier, given when the record was created or else generated by the server.
                  createdAt:
                    type: string
                    format: date-time
                    readOnly: true
                    description: Timestamp when the member was added.
                  updatedAt:
                    type: string
                    format: date-time
                    readOnly: true
                    description: Timestamp when the member was last updated.
                  application:
                    type: object
                    description: Expanded Application (subset).
                    properties:
                      id:
                        type: string
                        format: uuid
                        readOnly: true
                        description: Unique identifier, given when the record was created or else generated by the server.
                      status:
                        type: string
                        readOnly: true
                        description: Current lifecycle status of the application.
                        enum:
                          - draft
                          - submitted
                          - under_review
                          - withdrawn
                          - closed
                          - scheduled
                          - in_progress
                          - completed
                      programsAppliedFor:
                        type: array
                        items:
                          type: string
                          enum:
                            - snap
                            - medicaid
                            - chip
                            - tanf
                        description: Benefit programs the household is applying for.
                      programCount:
                        type: integer
                        readOnly: true
                        x-derived: this.programsAppliedFor.size()
                        description: How many programs this application covers, from programsAppliedFor.
                    x-relationship:
                      type: fk
                      resource: Application
                      onDelete: cascade
                      style: expand
                      fields:
                        - id
                        - status
                        - programsAppliedFor
                        - programCount
        incomes:
          type: object
          description: The ApplicationIncome records, keyed by id.
          propertyNames:
            format: uuid
          additionalProperties:
            allOf:
              - type: object
                properties:
                  memberId:
                    type: string
                    format: uuid
                    description: The member who receives it.
                    x-relationship:
                      type: fk
                      resource: ApplicationMember
                      onDelete: cascade
                      style: links-only
                  source:
                    type: string
                    enum:
                      - earned
                      - self_employment
                      - unearned
                  amount:
                    type: number
                    minimum: 0
                    description: The amount received each time it's paid, in dollars.
                  frequency:
                    type: string
                    enum:
                      - weekly
                      - biweekly
                      - semimonthly
                      - monthly
                      - irregular
                    description: How often it's paid.
                  paidInCash:
                    type: boolean
                  amountVaries:
                    type: boolean
                    description: Whether the amount changes from one payment to the next, as with irregular hours or tips.
                  links:
                    type: object
                    readOnly: true
                    description: Related resource links.
                    properties:
                      member:
                        type: string
                        format: uri-reference
                        description: Link to the related ApplicationMember resource.
              - type: object
                required:
                  - id
                  - applicationId
                  - memberId
                  - source
                  - amount
                  - frequency
                  - createdAt
                  - updatedAt
                properties:
                  id:
                    type: string
                    format: uuid
                    readOnly: true
                  applicationId:
                    type: string
                    format: uuid
                    readOnly: true
                    x-relationship:
                      resource: Application
                      onDelete: cascade
                  createdAt:
                    type: string
                    format: date-time
                    readOnly: true
                  updatedAt:
                    type: string
                    format: date-time
                    readOnly: true
                  links:
                    type: object
                    readOnly: true
                    description: Related resource links.
                    properties:
                      application:
                        type: string
                        format: uri-reference
                        description: Link to the related Application resource.
    Document:
      allOf:
        - type: object
          required:
            - documentTypeId
            - title
          properties:
            documentTypeId:
              type: string
              description: What kind of document this is.
            title:
              type: string
              description: A human-readable name for the document.
            documentDate:
              type:
                - string
                - "null"
              format: date
              description: The date the document itself bears, which is not the date it arrived.
        - type: object
          required:
            - id
            - lifecycleState
            - latestVersionId
            - createdAt
            - updatedAt
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
            lifecycleState:
              type: string
              enum:
                - active
                - superseded
                - disposed
              readOnly: true
              description: Where this document is in its retention lifecycle.
            legalHold:
              type: boolean
              readOnly: true
              description: Whether disposition is suspended pending litigation.
            latestVersionId:
              type: string
              format: uuid
              readOnly: true
              description: The most recent version, which is what describes the file.
              x-relationship:
                type: fk
                domain: document-management
                resource: DocumentVersion
                style: links-only
            retentionDeadline:
              type:
                - string
                - "null"
              format: date-time
              readOnly: true
              description: When this document becomes eligible for disposition.
            metadata:
              type: object
              additionalProperties: true
              description: Arbitrary key-value metadata supplied at upload.
            createdAt:
              type: string
              format: date-time
              readOnly: true
            updatedAt:
              type: string
              format: date-time
              readOnly: true
            links:
              type: object
              readOnly: true
              description: Related resource links.
              properties:
                latestVersion:
                  type: string
                  format: uri-reference
                  description: Link to the related DocumentVersion resource.
    DocumentWritable:
      type: object
      required:
        - documentTypeId
        - title
      properties:
        documentTypeId:
          type: string
          description: What kind of document this is.
        title:
          type: string
          description: A human-readable name for the document.
        documentDate:
          type:
            - string
            - "null"
          format: date
          description: The date the document itself bears, which is not the date it arrived.
