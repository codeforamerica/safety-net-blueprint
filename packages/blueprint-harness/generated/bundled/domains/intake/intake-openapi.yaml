    post:
      summary: Create an application
      operationId: createApplication
      tags:
        - Applications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  properties:
                    programsAppliedFor:
                      type: array
                      items:
                        type: string
                        enum:
                          - snap
                          - medicaid
                          - chip
                          - tanf
                      description: Benefit programs the household is applying for.
                    channel:
                      type: string
                      enum:
                        - online
                        - phone
                        - in_person
                        - mail
                      description: Channel through which the application was submitted.
                    address:
                      type: object
                      description: Mailing or residential address.
                      required:
                        - street
                        - city
                        - state
                        - zip
                      properties:
                        street:
                          type: string
                          description: Street address including apartment or unit number.
                        city:
                          type: string
                          description: City name.
                        state:
                          type: string
                          minLength: 2
                          maxLength: 2
                          description: Two-letter US state abbreviation.
                        zip:
                          type: string
                          pattern: ^\d{5}(-\d{4})?$
                          description: ZIP code or ZIP+4.
                    contactInfo:
                      type: object
                      description: Contact details for the primary applicant.
                      properties:
                        phone:
                          type: string
                          description: Primary phone number.
                        email:
                          type: string
                          format: email
                          description: Email address.
                        preferredContact:
                          type: string
                          enum:
                            - phone
                            - email
                            - mail
                          description: Applicant's preferred method of contact.
                    proofOfIncomeDocumentId:
                      type: string
                      format: uuid
                      description: The uploaded document evidencing household income, if one is attached.
                      x-relationship:
                        type: fk
                        domain: document-management
                        resource: Document
                        style: links-only
                    type:
                      type: string
                      enum:
                        - new
                        - renewal
                      default: new
                      description: |
                        A first application, or an application for recertification — the same kind of request.
                    interviewDate:
                      type: string
                      format: date
                      description: The date of the application's interview.
                    labels:
                      type: object
                      additionalProperties:
                        type: string
                      description: |
                        Arbitrary key-value labels for state-specific tagging, routing, and reporting. States may use these to attach jurisdiction-specific metadata without modifying the core schema.
                    countyCode:
                      type: string
                      maxLength: 10
                      description: County code for routing this application to the correct local office.
                    links:
                      type: object
                      readOnly: true
                      description: Related resource links.
                      properties:
                        proofOfIncomeDocument:
                          type: string
                          format: uri-reference
                          description: Link to the related Document resource.
                - type: object
                  description: |
                    The id a caller may choose for a record it creates, following JSON:API's client-generated ids. Every create schema references it. Without an id, the server sets one. An id another record already has is refused with 409. Choosing the id lets one request name a record another change in it creates, as a JSON Patch to a composition does.
                  properties:
                    id:
                      type: string
                      format: uuid
                      description: The new record's id, a UUID (RFC 9562).
                - type: object
                  required:
                    - programsAppliedFor
                    - channel
