                                    - self_employment
                                    - unearned
                                amount:
                                  type: number
                                  minimum: 0
                                  description: The amount received each time it's paid, in dollars.
                                frequency:
                                  type: string
                                  enum:
                                    - weekly
                                    - biweekly
                                    - semimonthly
                                    - monthly
                                    - irregular
                                  description: How often it's paid.
                                paidInCash:
                                  type: boolean
                                amountVaries:
                                  type: boolean
                                  description: Whether the amount changes from one payment to the next, as with irregular hours or tips.
                          expenses:
                            type: array
                            items:
                              type: object
                              required:
                                - type
                                - amount
                                - frequency
                              properties:
                                type:
                                  type: string
                                  enum:
                                    - rent
                                    - mortgage
                                    - utilities
                                    - dependent_care
                                    - medical
                                    - child_support
                                amount:
                                  type: number
                                  minimum: 0
                                frequency:
                                  type: string
                                  enum:
                                    - weekly
                                    - biweekly
                                    - semimonthly
                                    - monthly
                      programCount:
