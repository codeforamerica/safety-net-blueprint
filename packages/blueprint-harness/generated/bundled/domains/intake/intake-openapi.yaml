openapi: 3.1.0
info:
  title: Intake API
  version: 1.0.0
  x-domain: intake
  x-status: stable
  x-visibility: public
servers:
  - url: http://localhost:1080/intake
    description: Local development server
paths:
  /applications:
    get:
      summary: List applications
      operationId: listApplications
      x-sortable:
        fields:
          - createdAt
          - updatedAt
          - submittedAt
          - status
          - channel
          - countyCode
        default: "-createdAt"
      tags:
        - Applications
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: |
            Search query using field:value syntax. Multiple conditions separated by
            spaces are ANDed together.

            **URL Encoding:** This parameter must be URL-encoded when sent over HTTP.
            Most HTTP clients handle this automatically. Examples in this documentation
            show human-readable syntax for clarity.

            ## Syntax

            | Pattern | Description | Example |
            |---------|-------------|---------|
            | `term` | Full-text exact match | `john` |
            | `*term*` | Full-text contains | `*john*` |
            | `term*` | Full-text starts with | `john*` |
            | `*term` | Full-text ends with | `*smith` |
            | `field:value` | Exact match on field | `status:approved` |
            | `field:*value*` | Contains (case-insensitive) | `name:*john*` |
            | `field:value*` | Starts with | `name:john*` |
            | `field:*value` | Ends with | `email:*@example.com` |
            | `field:"value"` | Quoted value (for spaces) | `name:"john doe"` |
            | `field.nested:value` | Nested field (dot notation) | `address.state:CA` |
            | `field:>value` | Greater than | `income:>1000` |
            | `field:>=value` | Greater than or equal | `income:>=1000` |
            | `field:<value` | Less than | `income:<5000` |
            | `field:<=value` | Less than or equal | `income:<=5000` |
            | `field:val1,val2` | Match any value (OR) | `status:approved,pending` |
            | `-field:value` | Exclude / negate | `-status:denied` |
            | `field:*` | Field exists (not null) | `email:*` |
            | `-field:*` | Field does not exist | `-deletedAt:*` |

            ## Lists

            A condition on a list matches when any item matches. That holds for a list
            of values (`programs:snap`) and for a list of objects anywhere along a
            dotted path (`members.firstName:Jo`, any member named Jo).

            Each condition is checked on its own. `members.firstName:Jo members.age:>60`
            matches when some member is named Jo and some member, not necessarily the
            same one, is over 60. There is no way to require the same item.

            ## Examples

            - `john` — exact match for "john" in searchable fields
            - `*john*` — contains "john" in searchable fields
            - `name:*smith*` — name contains "smith" (case-insensitive)
            - `email:*@example.com` — email ends with "@example.com"
            - `status:approved` — exact match on status field
            - `status:approved,pending` — status is "approved" OR "pending"
            - `income:>=1000` — income greater than or equal to 1000
            - `created:>2024-01-01` — created after January 1, 2024
            - `status:approved income:>=1000` — approved AND income >= 1000 (multiple conditions)
            - `-status:denied` — exclude records with status "denied"
            - `-deletedAt:*` — only records where deletedAt does not exist
            - `applicant.state:CA` — nested field filter

            ## URL Encoding Reference

            When manually constructing URLs, encode these characters:

            | Character | Encoded |
            |-----------|---------|
            | (space) | `%20` or `+` |
            | `"` | `%22` |
            | `:` | `%3A` |
            | `>` | `%3E` |
            | `<` | `%3C` |
            | `,` | `%2C` |

            **Example:**
            ```
            Human-readable: q=status:approved income:>=1000
            URL-encoded:    q=status%3Aapproved%20income%3A%3E%3D1000
            ```
          examples:
            simpleSearch:
              summary: Full-text exact match
              value: john
            containsSearch:
              summary: Full-text contains
              value: "*john*"
            exactMatch:
              summary: Filter by status
              value: status:approved
            containsField:
              summary: Name contains (case-insensitive)
              value: name:*smith*
            startsWithField:
              summary: Name starts with
              value: name:john*
            endsWithField:
              summary: Email ends with domain
              value: email:*@example.com
            multipleFilters:
              summary: Status and income filter
              value: status:approved income:>=1000
            dateRange:
              summary: Created after date
              value: created:>2024-01-01
            multiValue:
              summary: Multiple statuses (OR)
              value: status:approved,pending,under_review
            negation:
              summary: Exclude denied
              value: "-status:denied"
            notExists:
              summary: Field does not exist
              value: "-deletedAt:*"
            nestedField:
              summary: Filter by nested field
              value: applicant.state:CA
        - name: limit
          in: query
          description: Maximum number of items to return (1-100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          description: Number of items to skip before collecting results.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: sort
          in: query
          required: false
          schema:
            type: string
          description: |
            Comma-separated list of fields to sort the response by. Prefix a field
            with `-` for descending order. The first field is the primary sort;
            subsequent fields are tie-breakers in declaration order.

            **URL Encoding:** This parameter must be URL-encoded when sent over HTTP.
            Most HTTP clients handle this automatically. Examples below show
            human-readable syntax for clarity.

            Which fields a given list endpoint allows is declared in the operation's
            `x-sortable.fields` extension. Sending a field name not present in that
            list returns `400 FIELD_NOT_SORTABLE`. Sending a field name that doesn't
            exist on the resource schema returns `400 INVALID_SORT_FIELD`. When this
            parameter is omitted, the operation's `x-sortable.default` (if declared)
            is applied; otherwise no client-driven sort is applied. A configured
            tie-breaker (default `id`) is always appended for stable pagination.

            See `api-patterns.yaml#sorting` for the full convention and
            `docs/architecture/x-extensions.md` for the extension shape.

            ## Syntax

            | Pattern | Description | Example |
            |---------|-------------|---------|
            | `fieldName` | Ascending | `sort=createdAt` |
            | `-fieldName` | Descending | `sort=-createdAt` |
            | `field1,field2` | Multi-field | `sort=status,-priority` |
            | `nested.field` | Nested field via dot notation | `sort=name.lastName` |

            ## Examples

            - `sort=createdAt` — oldest first
            - `sort=-createdAt` — newest first
            - `sort=-priority,dueDate` — highest priority first, then oldest due date
            - `sort=name.lastName,name.firstName` — alphabetical by surname, then given name
          examples:
            ascendingByDate:
              summary: Oldest first
              value: createdAt
            descendingByDate:
              summary: Newest first
              value: "-createdAt"
            multiField:
              summary: Multi-field — primary then tie-breaker
              value: "-priority,dueDate"
            nestedField:
              summary: Sort by a nested field
              value: name.lastName
        - name: status
          in: query
          schema:
            type: string
          description: Filter by application status.
        - name: channel
          in: query
          schema:
            type: string
          description: Filter by submission channel.
      responses:
        "200":
          description: A paginated list of applications.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                  - total
                  - limit
                  - offset
                properties:
                  items:
                    type: array
                    items:
                      description: A benefit application record, including server-managed fields.
                      unevaluatedProperties: false
                      required:
                        - id
                        - status
                        - programsAppliedFor
                        - programCount
                        - createdAt
                        - updatedAt
                      allOf:
                        - type: object
                          properties:
                            programsAppliedFor:
                              type: array
                              items:
                                type: string
                                enum:
                                  - snap
                                  - medicaid
                                  - chip
                                  - tanf
                              description: Benefit programs the household is applying for.
                            channel:
                              type: string
                              enum:
                                - online
                                - phone
                                - in_person
                                - mail
                              description: Channel through which the application was submitted.
                            address:
                              type: object
                              description: Mailing or residential address.
                              required:
                                - street
                                - city
                                - state
                                - zip
                              properties:
                                street:
                                  type: string
                                  description: Street address including apartment or unit number.
                                city:
                                  type: string
                                  description: City name.
                                state:
                                  type: string
                                  minLength: 2
                                  maxLength: 2
                                  description: Two-letter US state abbreviation.
                                zip:
                                  type: string
                                  pattern: ^\d{5}(-\d{4})?$
                                  description: ZIP code or ZIP+4.
                            contactInfo:
                              type: object
                              description: Contact details for the primary applicant.
                              properties:
                                phone:
                                  type: string
                                  description: Primary phone number.
                                email:
                                  type: string
                                  format: email
                                  description: Email address.
                                preferredContact:
                                  type: string
                                  enum:
                                    - phone
                                    - email
                                    - mail
                                  description: Applicant's preferred method of contact.
                            proofOfIncomeDocumentId:
                              type: string
                              format: uuid
                              description: The uploaded document evidencing household income, if one is attached.
                              x-relationship:
                                type: fk
                                domain: document-management
                                resource: Document
                                style: links-only
                            type:
                              type: string
                              enum:
                                - new
                                - renewal
                              default: new
                              description: |
                                A first application, or an application for recertification — the same kind of request.
                            interviewDate:
                              type: string
                              format: date
                              description: The date of the application's interview.
                            labels:
                              type: object
                              additionalProperties:
                                type: string
                              description: |
                                Arbitrary key-value labels for state-specific tagging, routing, and reporting. States may use these to attach jurisdiction-specific metadata without modifying the core schema.
                            countyCode:
                              type: string
                              maxLength: 10
                              description: County code for routing this application to the correct local office.
                            links:
                              type: object
                              readOnly: true
                              description: Related resource links.
                              properties:
                                proofOfIncomeDocument:
                                  type: string
                                  format: uri-reference
                                  description: Link to the related Document resource.
                        - type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                              readOnly: true
                              description: Unique identifier, given when the record was created or else generated by the server.
                            previousHousehold:
                              readOnly: true
                              description: |
                                The household on record before this application's interview: on a new application, the household as filed; on a renewal, the household as last certified, copied when the renewal is opened so the baseline holds still through the review.
                              type: object
                              properties:
                                size:
                                  type: integer
                                  minimum: 1
                                  description: The number of people who buy and prepare food together, as the household states it.
                                utilitiesIncludedInRent:
                                  type: boolean
                                  description: Whether the household says its utilities are included in the rent.
                                monthlyIncome:
                                  type: number
                                  minimum: 0
                                  description: Total monthly income, as the household states it.
                                monthlyExpenses:
                                  type: number
                                  minimum: 0
                                  description: Total monthly expenses, as the household states them.
                                members:
                                  type: array
                                  items:
                                    type: object
                                    required:
                                      - id
                                    properties:
                                      id:
                                        type: string
                                        description: The member's key within the household.
                                      dateOfBirth:
                                        type: string
                                        format: date
                                      isDisabled:
                                        type: boolean
                                        description: Whether the member is disabled.
                                jobs:
                                  type: array
                                  items:
                                    type: object
                                    required:
                                      - id
                                      - memberId
                                    properties:
                                      id:
                                        type: string
                                        description: The job's key within the household.
                                      memberId:
                                        type: string
                                        description: The member who holds the job.
                                      employer:
                                        type: string
                                incomes:
                                  type: array
                                  items:
                                    type: object
                                    required:
                                      - id
                                      - memberId
                                      - source
                                      - amount
                                      - frequency
                                    properties:
                                      id:
                                        type: string
                                        description: The income's key within the household.
                                      memberId:
                                        type: string
                                        description: The member who receives it.
                                      jobId:
                                        type: string
                                        description: The job it's paid for, when it's earned.
                                      source:
                                        type: string
                                        enum:
                                          - earned
                                          - self_employment
                                          - unearned
                                      amount:
                                        type: number
                                        minimum: 0
                                        description: The amount received each time it's paid, in dollars.
                                      frequency:
                                        type: string
                                        enum:
                                          - weekly
                                          - biweekly
                                          - semimonthly
                                          - monthly
                                          - irregular
                                        description: How often it's paid.
                                      paidInCash:
                                        type: boolean
                                      amountVaries:
                                        type: boolean
                                        description: Whether the amount changes from one payment to the next, as with irregular hours or tips.
                                expenses:
                                  type: array
                                  items:
                                    type: object
                                    required:
                                      - type
                                      - amount
                                      - frequency
                                    properties:
                                      type:
                                        type: string
                                        enum:
                                          - rent
                                          - mortgage
                                          - utilities
                                          - dependent_care
                                          - medical
                                          - child_support
                                      amount:
                                        type: number
                                        minimum: 0
                                      frequency:
                                        type: string
                                        enum:
                                          - weekly
                                          - biweekly
                                          - semimonthly
                                          - monthly
                            programCount:
                              type: integer
                              readOnly: true
                              x-derived: this.programsAppliedFor.size()
                              description: How many programs this application covers, from programsAppliedFor.
                            confirmationNumber:
                              type: string
                              readOnly: true
                              deprecated: true
                              description: |
                                Deprecated — use id instead. Legacy confirmation number assigned by older case management systems. Retained for backward compatibility during state migration periods.
                            status:
                              type: string
                              readOnly: true
                              description: Current lifecycle status of the application.
                              enum:
                                - draft
                                - submitted
                                - under_review
                                - withdrawn
                                - closed
                                - scheduled
                                - in_progress
                                - completed
                            submittedAt:
                              type:
                                - string
                                - "null"
                              format: date-time
                              readOnly: true
                              description: Timestamp when the application was formally submitted. Null until submitted.
                            openedAt:
                              type:
                                - string
                                - "null"
                              format: date-time
                              readOnly: true
                              description: Timestamp when a caseworker began active review. Null until the application is opened.
                            slaTypeCode:
                              type: string
                              readOnly: true
                              description: SLA type governing the processing deadline for this application.
                              enum:
                                - snap_standard
                                - medicaid_standard
                            slaInfo:
                              type: array
                              readOnly: true
                              items:
                                type: object
                                description: |
                                  Engine-managed SLA tracking entry. Returned in resource responses. All fields except slaTypeCode are populated and managed by the engine.
                                additionalProperties: false
                                required:
                                  - slaTypeCode
                                  - status
                                  - clockStartedAt
                                  - deadline
                                properties:
                                  slaTypeCode:
                                    type: string
                                    description: |
                                      Identifies which SLA type applies. Valid values are injected at resolve time from the domain's *-sla-types.yaml.
                                    enum:
                                      - snap_standard
                                      - medicaid_standard
                                  status:
                                    type: string
                                    enum:
                                      - active
                                      - warning
                                      - paused
                                      - breached
                                      - completed
                                    description: |
                                      Engine-managed SLA clock status. active — clock is running. warning — clock is running but warningThresholdPercent has elapsed. paused — clock is paused (e.g., awaiting client response). breached — deadline has passed without completion. completed — SLA was satisfied before the deadline.
                                    readOnly: true
                                  clockStartedAt:
                                    type: string
                                    format: date-time
                                    description: When the SLA clock started. Engine-managed.
                                    readOnly: true
                                  deadline:
                                    type: string
                                    format: date-time
                                    description: |
                                      Computed deadline. Recalculated after a resume to exclude accumulated paused duration. Engine-managed.
                                    readOnly: true
                              description: |
                                Engine-managed SLA tracking entries. Populated on create and updated on every transition. Read by the sla_breach_rate metric.
                            members:
                              type: array
                              items:
                                description: A household member on a benefit application.
                                unevaluatedProperties: false
                                required:
                                  - id
                                  - application
                                  - firstName
                                  - lastName
                                  - relationship
                                  - createdAt
                                  - updatedAt
                                allOf:
                                  - type: object
                                    properties:
                                      firstName:
                                        type: string
                                        description: Member's first name.
                                      lastName:
                                        type: string
                                        description: Member's last name.
                                      dateOfBirth:
                                        type: string
                                        format: date
                                        description: Member's date of birth (YYYY-MM-DD).
                                      relationship:
                                        type: string
                                        enum:
                                          - self
                                          - spouse
                                          - child
                                          - parent
                                          - sibling
                                          - other
                                        description: Relationship of this member to the primary applicant.
                                      incomeSource:
                                        description: Income reported by a household member. Type discriminator determines the variant.
                                        oneOf:
                                          - type: object
                                            description: Income from wages or salary employment.
                                            required:
                                              - type
                                              - employer
                                              - monthlyGrossIncome
                                            properties:
                                              type:
                                                type: string
                                                const: employment
                                              employer:
                                                type: string
                                                description: Name of the employer.
                                              monthlyGrossIncome:
                                                type: number
                                                minimum: 0
                                                description: Monthly gross income before deductions (dollars).
                                          - type: object
                                            description: Income from self-employment or a sole proprietorship.
                                            required:
                                              - type
                                              - businessType
                                              - monthlyNetIncome
                                            properties:
                                              type:
                                                type: string
                                                const: self_employment
                                              businessType:
                                                type: string
                                                description: Type of business (e.g., sole proprietor, freelance).
                                              monthlyNetIncome:
                                                type: number
                                                minimum: 0
                                                description: Monthly net income after business expenses (dollars).
                                          - type: object
                                            description: Income from a government benefit program.
                                            required:
                                              - type
                                              - benefitType
                                              - monthlyAmount
                                            properties:
                                              type:
                                                type: string
                                                const: benefit
                                              benefitType:
                                                type: string
                                                enum:
                                                  - ssi
                                                  - ssdi
                                                  - unemployment
                                                  - veterans
                                                  - other
                                                description: The benefit program providing income.
                                              monthlyAmount:
                                                type: number
                                                minimum: 0
                                                description: Monthly benefit amount (dollars).
                                        discriminator:
                                          propertyName: type
                                          mapping:
                                            employment: "#/$defs/EmploymentIncome"
                                            self_employment: "#/$defs/SelfEmploymentIncome"
                                            benefit: "#/$defs/BenefitIncome"
                                      notificationPreference:
                                        description: How this member prefers to receive benefit notices and updates.
                                        oneOf:
                                          - type: object
                                            required:
                                              - channel
                                              - address
                                            properties:
                                              channel:
                                                type: string
                                                enum:
                                                  - email
                                              address:
                                                type: string
                                                format: email
                                                description: Email address for benefit notices.
                                          - type: object
                                            required:
                                              - channel
                                              - phone
                                            properties:
                                              channel:
                                                type: string
                                                enum:
                                                  - sms
                                              phone:
                                                type: string
                                                description: Phone number for SMS benefit notices (E.164 format).
                                          - type: object
                                            required:
                                              - channel
                                              - address
                                            properties:
                                              channel:
                                                type: string
                                                enum:
                                                  - mail
                                              address:
                                                type: object
                                                description: Mailing or residential address.
                                                required:
                                                  - street
                                                  - city
                                                  - state
                                                  - zip
                                                properties:
                                                  street:
                                                    type: string
                                                    description: Street address including apartment or unit number.
                                                  city:
                                                    type: string
                                                    description: City name.
                                                  state:
                                                    type: string
                                                    minLength: 2
                                                    maxLength: 2
                                                    description: Two-letter US state abbreviation.
                                                  zip:
                                                    type: string
                                                    pattern: ^\d{5}(-\d{4})?$
                                                    description: ZIP code or ZIP+4.
                                        discriminator:
                                          propertyName: channel
                                      verificationEvidence:
                                        description: |
                                          Identity verification evidence for this member. Accepts anyOf: an electronic data match result, a manual caseworker review record, or both.
                                        anyOf:
                                          - type: object
                                            required:
                                              - source
                                              - matchCode
                                              - verifiedAt
                                            properties:
                                              source:
                                                type: string
                                                description: Data source used for the electronic match (e.g., SSA, IRS-IEVS).
                                              matchCode:
                                                type: string
                                                description: Result code returned by the data source.
                                              verifiedAt:
                                                type: string
                                                format: date-time
                                                description: Timestamp when the electronic verification was completed.
                                          - type: object
                                            required:
                                              - verifiedBy
                                              - verifiedAt
                                            properties:
                                              verifiedBy:
                                                type: string
                                                description: ID of the caseworker who performed the manual verification.
                                              verifiedAt:
                                                type: string
                                                format: date-time
                                                description: Timestamp when the manual verification was completed.
                                              notes:
                                                type: string
                                                description: Optional caseworker notes on the verification outcome.
                                  - type: object
                                    properties:
                                      id:
                                        type: string
                                        format: uuid
                                        readOnly: true
                                        description: Unique identifier, given when the record was created or else generated by the server.
                                      createdAt:
                                        type: string
                                        format: date-time
                                        readOnly: true
                                        description: Timestamp when the member was added.
                                      updatedAt:
                                        type: string
                                        format: date-time
                                        readOnly: true
                                        description: Timestamp when the member was last updated.
                                      application:
                                        type: object
                                        description: Expanded Application (subset).
                                        properties:
                                          id:
                                            type: string
                                            format: uuid
                                            readOnly: true
                                            description: Unique identifier, given when the record was created or else generated by the server.
                                          status:
                                            type: string
                                            readOnly: true
                                            description: Current lifecycle status of the application.
                                            enum:
                                              - draft
                                              - submitted
                                              - under_review
                                              - withdrawn
                                              - closed
                                              - scheduled
                                              - in_progress
                                              - completed
                                          programsAppliedFor:
                                            type: array
                                            items:
                                              type: string
                                              enum:
                                                - snap
                                                - medicaid
                                                - chip
                                                - tanf
                                            description: Benefit programs the household is applying for.
                                          programCount:
                                            type: integer
                                            readOnly: true
                                            x-derived: this.programsAppliedFor.size()
                                            description: How many programs this application covers, from programsAppliedFor.
                                        x-relationship:
                                          type: fk
                                          resource: Application
                                          onDelete: cascade
                                          style: expand
                                          fields:
                                            - id
                                            - status
                                            - programsAppliedFor
                                            - programCount
                              description: Household members on this application.
                            createdAt:
                              type: string
                              format: date-time
                              readOnly: true
                              description: Timestamp when the application was created.
                            updatedAt:
                              type: string
                              format: date-time
                              readOnly: true
                              description: Timestamp when the application was last updated.
                            proofOfIncomeDocument:
                              x-relationship:
                                type: fk
                                domain: document-management
                                resource: Document
                                style: expand
                              allOf:
                                - type: object
                                  required:
                                    - documentTypeId
                                    - title
                                  properties:
                                    documentTypeId:
                                      type: string
                                      description: What kind of document this is.
                                    title:
                                      type: string
                                      description: A human-readable name for the document.
                                    documentDate:
                                      type:
                                        - string
                                        - "null"
                                      format: date
                                      description: The date the document itself bears, which is not the date it arrived.
                                - type: object
                                  required:
                                    - id
                                    - lifecycleState
                                    - latestVersionId
                                    - createdAt
                                    - updatedAt
                                  properties:
                                    id:
                                      type: string
                                      format: uuid
                                      readOnly: true
                                    lifecycleState:
                                      type: string
                                      enum:
                                        - active
                                        - superseded
                                        - disposed
                                      readOnly: true
                                      description: Where this document is in its retention lifecycle.
                                    legalHold:
                                      type: boolean
                                      readOnly: true
                                      description: Whether disposition is suspended pending litigation.
                                    latestVersionId:
                                      type: string
                                      format: uuid
                                      readOnly: true
                                      description: The most recent version, which is what describes the file.
                                      x-relationship:
                                        type: fk
