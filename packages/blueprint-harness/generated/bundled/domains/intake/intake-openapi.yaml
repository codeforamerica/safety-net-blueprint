components:
  parameters:
    ApplicationIdParam:
      name: applicationId
      in: path
      required: true
      description: Unique identifier of the application.
      schema:
        type: string
        format: uuid
      example: 00000000-0000-0000-0000-000000000001
    MemberIdParam:
      name: memberId
      in: path
      required: true
      description: Unique identifier of the household member.
      schema:
        type: string
        format: uuid
      example: 00000000-0000-0000-0000-000000000010
  schemas:
    ApplicationWritable:
      type: object
      properties:
        programsAppliedFor:
          type: array
          items:
            type: string
            enum:
              - snap
              - medicaid
              - chip
              - tanf
          description: Benefit programs the household is applying for.
        channel:
          type: string
          enum:
            - online
            - phone
            - in_person
            - mail
          description: Channel through which the application was submitted.
        address:
          type: object
          description: Mailing or residential address.
          required:
            - street
            - city
            - state
            - zip
          properties:
            street:
              type: string
              description: Street address including apartment or unit number.
            city:
              type: string
              description: City name.
            state:
              type: string
              minLength: 2
              maxLength: 2
              description: Two-letter US state abbreviation.
            zip:
              type: string
              pattern: ^\d{5}(-\d{4})?$
              description: ZIP code or ZIP+4.
        contactInfo:
          type: object
          description: Contact details for the primary applicant.
          properties:
            phone:
              type: string
              description: Primary phone number.
            email:
              type: string
              format: email
              description: Email address.
            preferredContact:
              type: string
              enum:
                - phone
                - email
                - mail
              description: Applicant's preferred method of contact.
        proofOfIncomeDocumentId:
          type: string
          format: uuid
          description: The uploaded document evidencing household income, if one is attached.
          x-relationship:
            type: fk
            domain: document-management
            resource: Document
            style: links-only
        type:
          type: string
          enum:
            - new
            - renewal
          default: new
          description: |
            A first application, or an application for recertification — the same kind of request.
        interviewDate:
          type: string
          format: date
          description: The date of the application's interview.
        labels:
          type: object
          additionalProperties:
            type: string
          description: |
            Arbitrary key-value labels for state-specific tagging, routing, and reporting. States may use these to attach jurisdiction-specific metadata without modifying the core schema.
        countyCode:
          type: string
          maxLength: 10
          description: County code for routing this application to the correct local office.
        links:
          type: object
          readOnly: true
          description: Related resource links.
          properties:
            proofOfIncomeDocument:
              type: string
              format: uri-reference
              description: Link to the related Document resource.
    Application:
      description: A benefit application record, including server-managed fields.
      unevaluatedProperties: false
      required:
        - id
        - status
        - programsAppliedFor
        - programCount
        - createdAt
        - updatedAt
      allOf:
        - type: object
          properties:
            programsAppliedFor:
              type: array
              items:
                type: string
                enum:
                  - snap
                  - medicaid
                  - chip
                  - tanf
              description: Benefit programs the household is applying for.
            channel:
              type: string
              enum:
                - online
                - phone
                - in_person
                - mail
              description: Channel through which the application was submitted.
            address:
              type: object
              description: Mailing or residential address.
              required:
                - street
                - city
                - state
                - zip
              properties:
                street:
                  type: string
                  description: Street address including apartment or unit number.
                city:
                  type: string
                  description: City name.
                state:
                  type: string
                  minLength: 2
                  maxLength: 2
                  description: Two-letter US state abbreviation.
                zip:
                  type: string
                  pattern: ^\d{5}(-\d{4})?$
                  description: ZIP code or ZIP+4.
            contactInfo:
              type: object
              description: Contact details for the primary applicant.
              properties:
                phone:
                  type: string
                  description: Primary phone number.
                email:
                  type: string
                  format: email
                  description: Email address.
                preferredContact:
                  type: string
                  enum:
                    - phone
                    - email
                    - mail
                  description: Applicant's preferred method of contact.
            proofOfIncomeDocumentId:
              type: string
              format: uuid
              description: The uploaded document evidencing household income, if one is attached.
              x-relationship:
                type: fk
                domain: document-management
                resource: Document
                style: links-only
            type:
              type: string
              enum:
                - new
                - renewal
              default: new
              description: |
                A first application, or an application for recertification — the same kind of request.
            interviewDate:
              type: string
              format: date
              description: The date of the application's interview.
            labels:
              type: object
              additionalProperties:
                type: string
              description: |
                Arbitrary key-value labels for state-specific tagging, routing, and reporting. States may use these to attach jurisdiction-specific metadata without modifying the core schema.
            countyCode:
              type: string
              maxLength: 10
              description: County code for routing this application to the correct local office.
            links:
              type: object
              readOnly: true
              description: Related resource links.
              properties:
                proofOfIncomeDocument:
                  type: string
                  format: uri-reference
                  description: Link to the related Document resource.
        - type: object
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
              description: Unique identifier, given when the record was created or else generated by the server.
            previousHousehold:
              readOnly: true
              description: |
                The household on record before this application's interview: on a new application, the household as filed; on a renewal, the household as last certified, copied when the renewal is opened so the baseline holds still through the review.
              type: object
              properties:
                size:
                  type: integer
                  minimum: 1
                  description: The number of people who buy and prepare food together, as the household states it.
                utilitiesIncludedInRent:
                  type: boolean
                  description: Whether the household says its utilities are included in the rent.
                monthlyIncome:
                  type: number
                  minimum: 0
                  description: Total monthly income, as the household states it.
                monthlyExpenses:
                  type: number
                  minimum: 0
                  description: Total monthly expenses, as the household states them.
                members:
                  type: array
                  items:
                    type: object
                    required:
                      - id
                    properties:
                      id:
                        type: string
                        description: The member's key within the household.
                      dateOfBirth:
                        type: string
                        format: date
                      isDisabled:
                        type: boolean
                        description: Whether the member is disabled.
                jobs:
                  type: array
                  items:
                    type: object
                    required:
                      - id
                      - memberId
                    properties:
                      id:
                        type: string
                        description: The job's key within the household.
                      memberId:
                        type: string
                        description: The member who holds the job.
                      employer:
                        type: string
                incomes:
                  type: array
                  items:
                    type: object
                    required:
                      - id
                      - memberId
                      - source
                      - amount
                      - frequency
                    properties:
                      id:
                        type: string
                        description: The income's key within the household.
                      memberId:
                        type: string
                        description: The member who receives it.
                      jobId:
                        type: string
                        description: The job it's paid for, when it's earned.
                      source:
                        type: string
                        enum:
                          - earned
                          - self_employment
                          - unearned
                      amount:
                        type: number
                        minimum: 0
                        description: The amount received each time it's paid, in dollars.
                      frequency:
                        type: string
                        enum:
                          - weekly
                          - biweekly
                          - semimonthly
                          - monthly
                          - irregular
                        description: How often it's paid.
                      paidInCash:
                        type: boolean
                      amountVaries:
                        type: boolean
                        description: Whether the amount changes from one payment to the next, as with irregular hours or tips.
                expenses:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - amount
                      - frequency
                    properties:
                      type:
                        type: string
                        enum:
                          - rent
                          - mortgage
                          - utilities
                          - dependent_care
                          - medical
                          - child_support
                      amount:
                        type: number
                        minimum: 0
                      frequency:
                        type: string
                        enum:
                          - weekly
                          - biweekly
                          - semimonthly
                          - monthly
            programCount:
              type: integer
              readOnly: true
              x-derived: this.programsAppliedFor.size()
              description: How many programs this application covers, from programsAppliedFor.
            confirmationNumber:
              type: string
              readOnly: true
              deprecated: true
              description: |
                Deprecated — use id instead. Legacy confirmation number assigned by older case management systems. Retained for backward compatibility during state migration periods.
            status:
              type: string
              readOnly: true
              description: Current lifecycle status of the application.
              enum:
                - draft
                - submitted
                - under_review
                - withdrawn
                - closed
                - scheduled
                - in_progress
                - completed
            submittedAt:
              type:
                - string
                - "null"
              format: date-time
              readOnly: true
              description: Timestamp when the application was formally submitted. Null until submitted.
            openedAt:
              type:
                - string
                - "null"
              format: date-time
              readOnly: true
              description: Timestamp when a caseworker began active review. Null until the application is opened.
            slaTypeCode:
              type: string
              readOnly: true
              description: SLA type governing the processing deadline for this application.
              enum:
                - snap_standard
                - medicaid_standard
            slaInfo:
              type: array
              readOnly: true
              items:
                type: object
                description: |
                  Engine-managed SLA tracking entry. Returned in resource responses. All fields except slaTypeCode are populated and managed by the engine.
                additionalProperties: false
                required:
                  - slaTypeCode
                  - status
                  - clockStartedAt
                  - deadline
                properties:
                  slaTypeCode:
                    type: string
                    description: |
                      Identifies which SLA type applies. Valid values are injected at resolve time from the domain's *-sla-types.yaml.
                    enum:
                      - snap_standard
                      - medicaid_standard
                  status:
                    type: string
                    enum:
                      - active
                      - warning
                      - paused
                      - breached
                      - completed
                    description: |
                      Engine-managed SLA clock status. active — clock is running. warning — clock is running but warningThresholdPercent has elapsed. paused — clock is paused (e.g., awaiting client response). breached — deadline has passed without completion. completed — SLA was satisfied before the deadline.
                    readOnly: true
                  clockStartedAt:
                    type: string
                    format: date-time
                    description: When the SLA clock started. Engine-managed.
                    readOnly: true
                  deadline:
                    type: string
                    format: date-time
                    description: |
                      Computed deadline. Recalculated after a resume to exclude accumulated paused duration. Engine-managed.
                    readOnly: true
              description: |
                Engine-managed SLA tracking entries. Populated on create and updated on every transition. Read by the sla_breach_rate metric.
            members:
              type: array
              items:
                description: A household member on a benefit application.
                unevaluatedProperties: false
                required:
                  - id
                  - application
                  - firstName
                  - lastName
                  - relationship
                  - createdAt
                  - updatedAt
                allOf:
                  - type: object
                    properties:
                      firstName:
                        type: string
                        description: Member's first name.
                      lastName:
                        type: string
