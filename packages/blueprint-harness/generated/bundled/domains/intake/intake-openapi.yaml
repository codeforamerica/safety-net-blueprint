        - Applications
      x-relationship:
        type: ruleset
        domain: intake
        id: interviewPrompts
components:
  parameters:
    ApplicationIdParam:
      name: applicationId
      in: path
      required: true
      description: Unique identifier of the application.
      schema:
        type: string
        format: uuid
      example: 00000000-0000-0000-0000-000000000001
    MemberIdParam:
      name: memberId
      in: path
      required: true
      description: Unique identifier of the household member.
      schema:
        type: string
        format: uuid
      example: 00000000-0000-0000-0000-000000000010
  schemas:
    ApplicationWritable:
      type: object
      properties:
        programsApplied:
          type: array
          items:
            type: string
            enum:
              - snap
              - medicaid
              - chip
              - tanf
          description: Benefit programs the household is applying for.
        channel:
          type: string
          enum:
            - online
            - phone
            - in_person
            - mail
          description: Channel through which the application was submitted.
        address:
          type: object
          description: Mailing or residential address.
          required:
            - street
            - city
            - state
            - zip
          properties:
            street:
              type: string
              description: Street address including apartment or unit number.
            city:
              type: string
              description: City name.
            state:
              type: string
              minLength: 2
              maxLength: 2
              description: Two-letter US state abbreviation.
            zip:
              type: string
              pattern: ^\d{5}(-\d{4})?$
              description: ZIP code or ZIP+4.
        contactInfo:
          type: object
          description: Contact details for the primary applicant.
          properties:
            phone:
              type: string
              description: Primary phone number.
            email:
