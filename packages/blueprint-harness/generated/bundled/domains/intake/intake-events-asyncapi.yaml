    IntakeApplicationUpdated:
      name: intake.application.updated
      summary: A Application was changed. Carries each changed field, before and after.
      payload:
        allOf:
          - allOf:
              - allOf:
                  - type: object
                    required:
                      - type
                    properties:
                      type:
