components:
  messages:
    IntakeApplicationCreated:
      name: intake.application.created
      summary: A Application was created. Carries the record as created.
      payload:
        allOf:
          - allOf:
              - allOf:
                  - type: object
                    required:
                      - type
                    properties:
                      type:
                        type: string
                        description: |
                          Fully qualified CloudEvents event type, {domain}.{resource}.{event} (e.g., intake.application.submitted): the domain as declared, the resource's schema name in snake_case.
                      description:
                        type: string
                        description: Human-readable annotation for state machine authors. Not a CloudEvents field.
                  - type: object
                    properties:
                      subject:
                        type: string
                        description: |
                          CloudEvents subject override. The entity ID the event pertains to. Defaults to the emitting resource's own id when omitted.
                      causationid:
                        type: string
                        description: |
                          CloudEvents Causation extension (optional). Value expression resolving to the id of the event that directly caused this one. Use when an event is emitted in response to another event (e.g., auto-resume triggered by a timer callback).
                      data:
                        type: object
                        additionalProperties: true
                        description: Event-specific payload. Field values are value expressions resolved at emit time.
              - type: object
                required:
                  - specversion
                  - id
                  - source
                  - subject
                  - time
                  - datacontenttype
                properties:
                  specversion:
                    type: string
                    const: "1.0"
                    description: CloudEvents specification version.
                  id:
                    type: string
                    format: uuid
                    description: Unique event identifier.
                  source:
                    type: string
                    description: Domain base path that produced the event (e.g., /intake, /workflow).
                    example: /intake
                  subject:
                    type: string
                    format: uuid
                    description: Entity ID the event pertains to.
                  time:
                    type: string
                    format: date-time
                    description: When the event occurred.
                  datacontenttype:
                    type: string
                    const: application/json
                    description: Media type of the event payload.
                  traceparent:
                    type:
                      - string
                      - "null"
                    description: |
                      W3C Trace Context header (optional). Propagated from the triggering request or event. The trace ID component is stable across the full causal chain.
                  causationid:
                    type:
                      - string
                      - "null"
                    format: uuid
                    description: |
                      CloudEvents Causation extension (optional). The `id` of the event that directly caused this one. Use when an event is emitted in direct response to another event (e.g., a task auto-resumed because a timer fired). Allows consumers to trace the immediate cause without inspecting the full distributed trace.
                  authid:
                    type:
                      - string
                      - "null"
                    description: |
                      CloudEvents Auth Context extension (optional). Principal identifier (userId from JWT claims) of the actor who triggered the event. No PII — user ID only, not name or email. Required for FTI-governed events per IRS Pub. 1075. Omitted when no caller identity is present.
                  authtype:
                    type:
                      - string
                      - "null"
                    enum:
                      - user
                      - service_account
                      - api_key
                      - system
                      - unauthenticated
                      - unknown
                      - null
                    description: |
                      CloudEvents Auth Context extension (optional). Principal type of the actor who triggered the event. Required when authid is present. Required for FTI-governed events per IRS Pub. 1075.
                  data:
                    type: object
                    description: Event-specific payload. Schema is defined per event type in each domain's AsyncAPI file.
          - type: object
            properties:
              type:
                type: string
                const: intake.application.created
              data:
                description: A benefit application record, including server-managed fields.
                unevaluatedProperties: false
                required:
                  - id
                  - status
                  - programsAppliedFor
                  - programCount
                  - createdAt
                  - updatedAt
                allOf:
                  - type: object
                    properties:
                      programsAppliedFor:
                        type: array
                        items:
                          type: string
                          enum:
                            - snap
                            - medicaid
                            - chip
                            - tanf
                        description: Benefit programs the household is applying for.
                      channel:
                        type: string
                        enum:
                          - online
                          - phone
                          - in_person
                          - mail
                        description: Channel through which the application was submitted.
                      address:
                        type: object
                        description: Mailing or residential address.
                        required:
                          - street
                          - city
                          - state
                          - zip
                        properties:
                          street:
                            type: string
                            description: Street address including apartment or unit number.
                          city:
                            type: string
                            description: City name.
                          state:
                            type: string
                            minLength: 2
                            maxLength: 2
                            description: Two-letter US state abbreviation.
                          zip:
                            type: string
                            pattern: ^\d{5}(-\d{4})?$
                            description: ZIP code or ZIP+4.
                      contactInfo:
                        type: object
                        description: Contact details for the primary applicant.
                        properties:
                          phone:
                            type: string
                            description: Primary phone number.
                          email:
                            type: string
                            format: email
                            description: Email address.
                          preferredContact:
                            type: string
                            enum:
                              - phone
                              - email
                              - mail
                            description: Applicant's preferred method of contact.
                      proofOfIncomeDocumentId:
                        type: string
                        format: uuid
                        description: The uploaded document evidencing household income, if one is attached.
                        x-relationship:
                          type: fk
                          domain: document-management
                          resource: Document
                          style: links-only
                      type:
                        type: string
                        enum:
                          - new
                          - renewal
                        default: new
                        description: |
                          A first application, or an application for recertification — the same kind of request, tied to the household's existing case.
                      caseId:
                        type: string
                        format: uuid
                        description: The case a renewal recertifies. Empty on a new application, whose case doesn't exist yet.
                        x-relationship:
                          type: fk
                          domain: case-management
                          resource: Case
                          style: links-only
                      interviewDate:
                        type: string
                        format: date
                        description: The date of the application's interview.
                      labels:
                        type: object
                        additionalProperties:
                          type: string
                        description: |
                          Arbitrary key-value labels for state-specific tagging, routing, and reporting. States may use these to attach jurisdiction-specific metadata without modifying the core schema.
                      countyCode:
                        type: string
                        maxLength: 10
                        description: County code for routing this application to the correct local office.
                      links:
                        type: object
                        readOnly: true
                        description: Related resource links.
                        properties:
                          proofOfIncomeDocument:
                            type: string
                            format: uri-reference
                            description: Link to the related Document resource.
                          case:
                            type: string
                            format: uri-reference
                            description: Link to the related Case resource.
                  - type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        readOnly: true
                        description: Unique identifier (server-generated).
                      previousHousehold:
                        readOnly: true
                        description: |
                          The household on record before this application's interview: on a new application, the household as filed; on a renewal, the household the case's current determination certified, copied when the renewal is opened so the baseline holds still through the review.
                        type: object
                        properties:
                          statedSize:
                            type: integer
                            minimum: 1
                            description: The number of people the household says buy and prepare food together.
                          utilitiesIncludedInRent:
                            type: boolean
                            description: Whether the household says its utilities are included in the rent.
                          statedMonthlyIncome:
                            type: number
                            minimum: 0
                            description: Total monthly income, as the household states it.
                          statedMonthlyExpenses:
                            type: number
                            minimum: 0
                            description: Total monthly expenses, as the household states them.
                          members:
                            type: array
                            items:
                              type: object
                              required:
                                - id
                              properties:
                                id:
                                  type: string
                                  description: The member's key within the household.
                                dateOfBirth:
                                  type: string
                                  format: date
                                isDisabled:
                                  type: boolean
                                  description: Whether the member is disabled.
                          jobs:
                            type: array
                            items:
                              type: object
                              required:
                                - id
                                - memberId
                              properties:
                                id:
                                  type: string
                                  description: The job's key within the household.
                                memberId:
                                  type: string
                                  description: The member who holds the job.
                                employer:
                                  type: string
                          incomes:
                            type: array
                            items:
                              type: object
                              required:
                                - id
                                - memberId
                                - source
                                - amount
                                - frequency
                              properties:
                                id:
                                  type: string
                                  description: The income's key within the household.
                                memberId:
                                  type: string
                                  description: The member who receives it.
                                jobId:
                                  type: string
