$schema: https://blueprint.codeforamerica.org/schemas/rules-examples-schema.yaml
domain: eligibility
rulesets:
  expeditedSnap:
    examples:
      - description: Low income and low resources — qualifies on condition 1
        inputs:
          household:
            monthlyGrossIncome: 120
            liquidResources: 75
            monthlyShelterCost: 800
            isMigrantFarmworker: false
          policy:
            incomeThreshold: 150
            resourceThreshold: 100
        outputs:
          isLowIncome: true
          hasLowResources: true
          isExpeditedEligible: true
      - description: Income and resources below shelter cost — qualifies on condition 2
        inputs:
          household:
            monthlyGrossIncome: 500
            liquidResources: 50
            monthlyShelterCost: 650
            isMigrantFarmworker: false
          policy:
            incomeThreshold: 150
            resourceThreshold: 100
        outputs:
          isLowIncome: false
          hasLowResources: true
          isExpeditedEligible: true
      - description: Migrant farmworker with low resources — qualifies on condition 3
        inputs:
          household:
            monthlyGrossIncome: 300
            liquidResources: 60
            monthlyShelterCost: 1000
            isMigrantFarmworker: true
          policy:
            incomeThreshold: 150
            resourceThreshold: 100
        outputs:
          isLowIncome: false
          hasLowResources: true
          isExpeditedEligible: true
      - description: Above all thresholds — does not qualify
        inputs:
          household:
            monthlyGrossIncome: 2000
            liquidResources: 500
            monthlyShelterCost: 1200
            isMigrantFarmworker: false
          policy:
            incomeThreshold: 150
            resourceThreshold: 100
        outputs:
          isLowIncome: false
          hasLowResources: false
          isExpeditedEligible: false
  interviewProbes:
    examples:
      - description: Income gap and unemployed members — multiple probes triggered
        inputs:
          household:
            monthlyIncome: 800
            monthlyExpenses: 1200
            members:
              - age: 35
                isEmployed: false
                isStudent: false
                isNonCitizen: false
              - age: 8
                isEmployed: false
                isStudent: false
                isNonCitizen: false
          application:
            hasChangedCircumstances: false
        outputs:
          incomeInconsistencyProbe: true
          workRequirementProbe: true
          studentEligibilityProbe: false
          immigrationStatusProbe: false
          changeVerificationProbe: false
          allMembersEmployed: false
      - description: Non-citizen student with changed circumstances
        inputs:
          household:
            monthlyIncome: 1500
            monthlyExpenses: 1400
            members:
              - age: 22
                isEmployed: true
                isStudent: true
                isNonCitizen: true
          application:
            hasChangedCircumstances: true
        outputs:
          incomeInconsistencyProbe: false
          workRequirementProbe: false
          studentEligibilityProbe: true
          immigrationStatusProbe: true
          changeVerificationProbe: true
          allMembersEmployed: true
      - description: All members employed — no work requirement probe
        inputs:
          household:
            monthlyIncome: 3000
            monthlyExpenses: 2500
            members:
              - age: 40
                isEmployed: true
                isStudent: false
                isNonCitizen: false
              - age: 38
                isEmployed: true
                isStudent: false
                isNonCitizen: false
          application:
            hasChangedCircumstances: false
        outputs:
          incomeInconsistencyProbe: false
          workRequirementProbe: false
          studentEligibilityProbe: false
          immigrationStatusProbe: false
          changeVerificationProbe: false
          allMembersEmployed: true
