asyncapi: 3.0.0
info:
  title: Eligibility API events
  version: 1.0.0
  x-domain: eligibility
  description: The events eligibility-openapi.yaml and the state machines attached to its resources send. Generated by resolve; not edited by hand.
channels:
  eligibility.determination.created:
    address: eligibility.determination.created
