  /eligibility/determinations/evaluate-expedited-snap:
    post:
      summary: Evaluate expeditedSnap
      operationId: evaluateExpeditedSnap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Input data for expeditedSnap evaluation. All fields are optional — partial inputs trigger partial evaluation.
              properties:
                household:
                  type: object
                  description: Household financial circumstances at the time of application.
                  properties:
                    monthlyGrossIncome:
                      type: number
                      description: Total monthly gross income for all household members (dollars).
                    liquidResources:
                      type: number
                      description: Total liquid resources (cash, bank accounts) available to the household (dollars).
                    monthlyShelterCost:
                      type: number
                      description: Monthly shelter cost including rent/mortgage and utilities (dollars).
                    isMigrantFarmworker:
                      type: boolean
                      description: Whether any household member is a migrant or seasonal farmworker.
                policy:
                  type: object
                  properties:
                    incomeThreshold:
                      type: number
                      default: 150
                      description: Monthly gross income threshold for expedited eligibility (7 CFR § 273.2(i)(1)(i)).
                    resourceThreshold:
                      type: number
                      default: 100
                      description: Liquid resource threshold for expedited eligibility (7 CFR § 273.2(i)(1)(i)).
      responses:
        "200":
          description: expeditedSnap evaluation result.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    description: |
                      Map of output fact names to their evaluation result. Only output facts are included; intermediate facts are not returned.
                    additionalProperties:
                      oneOf:
                        - type: object
                          required:
                            - state
                            - value
                          properties:
                            state:
                              type: string
                              enum:
                                - complete
                            value:
                              description: The computed value.
                        - type: object
                          required:
                            - state
                            - value
                          properties:
                            state:
                              type: string
                              enum:
                                - placeholder
                            value:
                              description: The computed value, derived using one or more schema defaults.
                        - type: object
                          required:
                            - state
                            - value
                            - missing
                          properties:
                            state:
                              type: string
                              enum:
                                - missing
                            value:
                              type: "null"
                            missing:
                              type: array
                              description: Input paths required to resolve this fact.
                              items:
                                type: string
                        - type: object
                          required:
                            - state
                            - value
                            - message
                          properties:
                            state:
                              type: string
                              enum:
                                - error
                            value:
                              type: "null"
                            message:
                              type: string
                              description: The reason evaluation failed.
                      discriminator:
                        propertyName: state
                description: Evaluation result for expeditedSnap.
        "400":
          description: The request is malformed or contains invalid parameters.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Machine-readable error code.
                  message:
                    type: string
                    description: Human-readable error description.
                  details:
                    type: array
                    description: Additional error details.
                    items:
                      type: object
                      additionalProperties: true
        "500":
          description: An unexpected error occurred on the server.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Machine-readable error code.
                  message:
                    type: string
                    description: Human-readable error description.
                  details:
                    type: array
                    description: Additional error details.
                    items:
                      type: object
                      additionalProperties: true
  /eligibility/determinations/evaluate-interview-probes:
    post:
      summary: Evaluate interviewProbes
      operationId: evaluateInterviewProbes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Input data for interviewProbes evaluation. All fields are optional — partial inputs trigger partial evaluation.
              properties:
                household:
                  type: object
                  description: Household composition and financial circumstances.
                  properties:
                    monthlyIncome:
                      type: number
                      description: Total monthly gross income reported by the household.
                    monthlyExpenses:
                      type: number
                      description: Total monthly expenses reported by the household.
                    members:
                      type: array
                      description: All individuals in the household.
                      items:
                        type: object
                        properties:
                          age:
                            type: integer
                            description: Member's age in years.
                          isEmployed:
                            type: boolean
                            description: Whether the member is currently employed.
                          isStudent:
                            type: boolean
                            description: Whether the member is enrolled at least half-time in higher education.
                          isNonCitizen:
                            type: boolean
                            description: Whether the member is a non-citizen subject to immigration screening.
                application:
                  type: object
                  description: Application-level context relevant to the interview.
                  properties:
                    hasChangedCircumstances:
                      type: boolean
                      description: Whether the household reported changes since the application was submitted.
      responses:
        "200":
          description: interviewProbes evaluation result.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    description: |
                      Map of output fact names to their evaluation result. Only output facts are included; intermediate facts are not returned.
                    additionalProperties:
                      oneOf:
