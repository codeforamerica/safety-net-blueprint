                            - message
                          properties:
                            state:
                              type: string
                              enum:
                                - error
                            value:
                              type: "null"
                            message:
                              type: string
                              description: The reason evaluation failed.
                      discriminator:
                        propertyName: state
                description: Evaluation result for interviewProbes.
        "400":
          description: The request is malformed or contains invalid parameters.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Machine-readable error code.
                  message:
                    type: string
                    description: Human-readable error description.
                  details:
                    type: array
                    description: Additional error details.
                    items:
                      type: object
                      additionalProperties: true
        "500":
          description: An unexpected error occurred on the server.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Machine-readable error code.
                  message:
                    type: string
                    description: Human-readable error description.
                  details:
                    type: array
                    description: Additional error details.
                    items:
                      type: object
                      additionalProperties: true
