openapi: 3.1.0
info:
  title: Eligibility API
  version: 1.0.0
  x-domain: eligibility
  x-status: stable
  x-visibility: internal
x-events:
  eligibility.determination.complete:
    type: org.codeforamerica.safety-net-blueprint.eligibility.determination.complete
    summary: Emitted when an eligibility determination is finalized for all applied programs.
paths:
  /determinations:
    get:
      summary: List determinations
      operationId: listDeterminations
      tags:
        - Determinations
      parameters:
        - name: limit
          in: query
          description: Maximum number of items to return (1-100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          description: Number of items to skip before collecting results.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: sort
          in: query
          required: false
          schema:
            type: string
          description: |
            Comma-separated list of fields to sort the response by. Prefix a field
            with `-` for descending order. The first field is the primary sort;
            subsequent fields are tie-breakers in declaration order.

            **URL Encoding:** This parameter must be URL-encoded when sent over HTTP.
            Most HTTP clients handle this automatically. Examples below show
            human-readable syntax for clarity.

            Which fields a given list endpoint allows is declared in the operation's
            `x-sortable.fields` extension. Sending a field name not present in that
            list returns `400 FIELD_NOT_SORTABLE`. Sending a field name that doesn't
            exist on the resource schema returns `400 INVALID_SORT_FIELD`. When this
            parameter is omitted, the operation's `x-sortable.default` (if declared)
            is applied; otherwise no client-driven sort is applied. A configured
            tie-breaker (default `id`) is always appended for stable pagination.

            See `api-patterns.yaml#sorting` for the full convention and
            `docs/architecture/x-extensions.md` for the extension shape.

            ## Syntax

            | Pattern | Description | Example |
            |---------|-------------|---------|
            | `fieldName` | Ascending | `sort=createdAt` |
            | `-fieldName` | Descending | `sort=-createdAt` |
            | `field1,field2` | Multi-field | `sort=status,-priority` |
            | `nested.field` | Nested field via dot notation | `sort=name.lastName` |

            ## Examples

            - `sort=createdAt` — oldest first
            - `sort=-createdAt` — newest first
            - `sort=-priority,dueDate` — highest priority first, then oldest due date
            - `sort=name.lastName,name.firstName` — alphabetical by surname, then given name
          examples:
            ascendingByDate:
              summary: Oldest first
              value: createdAt
            descendingByDate:
              summary: Newest first
              value: "-createdAt"
            multiField:
              summary: Multi-field — primary then tie-breaker
              value: "-priority,dueDate"
            nestedField:
              summary: Sort by a nested field
              value: name.lastName
        - name: status
          in: query
          schema:
            type: string
          description: Filter by determination status.
        - name: applicationId
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by intake application.
      responses:
        "200":
          description: A paginated list of determinations.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - total
                  - limit
                  - offset
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - applicationId
                        - status
                        - expedited
                        - createdAt
                        - updatedAt
                      properties:
                        id:
                          type: string
                          format: uuid
                          readOnly: true
                          description: Unique identifier (server-generated).
                        applicationId:
                          type: string
                          format: uuid
                          description: The intake application this determination is for.
                          x-relationship:
                            domain: intake
                            resource: Application
                            style: links-only
                        status:
                          type: string
                          enum:
                            - pending
                            - in_progress
                            - complete
                          readOnly: true
                          description: Current status of the eligibility determination.
                        expedited:
                          type: boolean
                          readOnly: true
                          description: Whether this household qualifies for expedited processing (7 CFR § 273.2(i)).
                        determinedAt:
                          type: string
                          format: date-time
                          nullable: true
                          readOnly: true
                          description: Timestamp when the determination was finalized. Null until complete.
                        createdAt:
                          type: string
                          format: date-time
                          readOnly: true
                          description: Timestamp when the determination was created.
                        updatedAt:
                          type: string
                          format: date-time
                          readOnly: true
                          description: Timestamp when the determination was last updated.
                        links:
                          type: object
                          readOnly: true
                          description: Related resource links.
                          properties:
                            application:
                              type: string
                              format: uri-reference
                              description: Link to the related Application resource.
                  total:
                    type: integer
                    minimum: 0
                  limit:
                    type: integer
                    minimum: 1
                    maximum: 100
                  offset:
                    type: integer
                    minimum: 0
                  hasNext:
                    type: boolean
        "400":
          description: Bad request — validation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
    post:
      summary: Create a determination
      operationId: createDetermination
      tags:
        - Determinations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  properties:
                    applicationId:
                      type: string
                      format: uuid
                      description: The intake application this determination is for.
                      x-relationship:
                        domain: intake
                        resource: Application
                        style: links-only
                    links:
                      type: object
                      readOnly: true
                      description: Related resource links.
                      properties:
                        application:
                          type: string
                          format: uri-reference
                          description: Link to the related Application resource.
                - type: object
                  required:
                    - applicationId
      responses:
        "201":
          description: Determination created successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - applicationId
                  - status
                  - expedited
                  - createdAt
                  - updatedAt
                properties:
                  id:
                    type: string
                    format: uuid
                    readOnly: true
                    description: Unique identifier (server-generated).
                  applicationId:
                    type: string
                    format: uuid
                    description: The intake application this determination is for.
                    x-relationship:
                      domain: intake
                      resource: Application
                      style: links-only
                  status:
                    type: string
                    enum:
                      - pending
                      - in_progress
                      - complete
                    readOnly: true
                    description: Current status of the eligibility determination.
                  expedited:
                    type: boolean
                    readOnly: true
                    description: Whether this household qualifies for expedited processing (7 CFR § 273.2(i)).
                  determinedAt:
                    type: string
                    format: date-time
                    nullable: true
                    readOnly: true
                    description: Timestamp when the determination was finalized. Null until complete.
                  createdAt:
                    type: string
                    format: date-time
                    readOnly: true
                    description: Timestamp when the determination was created.
                  updatedAt:
                    type: string
                    format: date-time
                    readOnly: true
                    description: Timestamp when the determination was last updated.
                  links:
                    type: object
                    readOnly: true
                    description: Related resource links.
                    properties:
                      application:
                        type: string
                        format: uri-reference
                        description: Link to the related Application resource.
        "400":
          description: Bad request — validation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "422":
          description: Unprocessable entity — business rule validation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
