  /determinations/{determinationId}/programs:
    parameters:
      - name: determinationId
        in: path
        required: true
        description: Unique identifier of the determination.
        schema:
          type: string
          format: uuid
        example: 00000000-0000-0000-0001-000000000001
    get:
      summary: List program results
      operationId: listProgramResults
      tags:
        - Program Results
      parameters:
        - name: limit
          in: query
          description: Maximum number of items to return (1-100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          description: Number of items to skip before collecting results.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Program-level eligibility results for this determination.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - total
                  - limit
                  - offset
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - determinationId
                        - program
                        - eligible
                        - createdAt
                        - updatedAt
                      properties:
                        id:
                          type: string
                          format: uuid
                          readOnly: true
                          description: Unique identifier (server-generated).
                        determinationId:
                          type: string
                          format: uuid
                          description: The determination this result belongs to.
                          x-relationship:
                            resource: Determination
                            style: links-only
                        program:
                          type: string
                          enum:
                            - snap
                            - medicaid
                            - chip
                            - tanf
                          description: The benefit program this result applies to.
                        eligible:
                          type: boolean
                          description: Whether the household is eligible for this program.
                        reason:
                          type: string
                          nullable: true
                          description: Explanation of the eligibility determination.
                        benefitAmount:
                          type: number
                          minimum: 0
                          nullable: true
                          description: Estimated monthly benefit amount if eligible (dollars).
                        createdAt:
                          type: string
                          format: date-time
                          readOnly: true
                        updatedAt:
                          type: string
                          format: date-time
                          readOnly: true
                        links:
                          type: object
                          readOnly: true
                          description: Related resource links.
                          properties:
                            determination:
                              type: string
                              format: uri-reference
                              description: Link to the related Determination resource.
                  total:
                    type: integer
                    minimum: 0
                  limit:
                    type: integer
                    minimum: 1
                    maximum: 100
                  offset:
                    type: integer
                    minimum: 0
                  hasNext:
                    type: boolean
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
