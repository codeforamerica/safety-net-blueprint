asyncapi: 3.0.0
info:
  title: Document Management API events
  version: 1.0.0
  x-domain: document-management
  description: The events document-management-openapi.yaml and the state machines attached to its resources send. Generated by resolve; not edited by hand.
channels:
  document-management.document.created:
    address: document-management.document.created
    messages:
      DocumentManagementDocumentCreated:
        name: document-management.document.created
        summary: A Document was created. Carries the record as created.
        payload:
          allOf:
            - allOf:
                - allOf:
                    - type: object
                      required:
                        - type
                      properties:
                        type:
                          type: string
                          description: |
                            Fully qualified CloudEvents event type, {domain}.{resource}.{event} (e.g., intake.application.submitted): the domain as declared, the resource's schema name in snake_case.
                        description:
                          type: string
                          description: Human-readable annotation for state machine authors. Not a CloudEvents field.
                    - type: object
                      properties:
                        subject:
                          type: string
                          description: |
                            CloudEvents subject override. The entity ID the event pertains to. Defaults to the emitting resource's own id when omitted.
                        causationid:
                          type: string
                          description: |
                            CloudEvents Causation extension (optional). Value expression resolving to the id of the event that directly caused this one. Use when an event is emitted in response to another event (e.g., auto-resume triggered by a timer callback).
                        data:
                          type: object
                          additionalProperties: true
                          description: Event-specific payload. Field values are value expressions resolved at emit time.
                - type: object
                  required:
                    - specversion
                    - id
                    - source
                    - subject
                    - time
                    - datacontenttype
                  properties:
                    specversion:
                      type: string
                      const: "1.0"
                      description: CloudEvents specification version.
                    id:
                      type: string
                      format: uuid
                      description: Unique event identifier.
                    source:
                      type: string
                      description: Domain base path that produced the event (e.g., /intake, /workflow).
                      example: /intake
                    subject:
                      type: string
                      format: uuid
                      description: Entity ID the event pertains to.
                    time:
                      type: string
                      format: date-time
                      description: When the event occurred.
                    datacontenttype:
                      type: string
                      const: application/json
                      description: Media type of the event payload.
                    traceparent:
                      type:
                        - string
                        - "null"
                      description: |
                        W3C Trace Context header (optional). Propagated from the triggering request or event. The trace ID component is stable across the full causal chain.
                    causationid:
                      type:
                        - string
                        - "null"
                      format: uuid
                      description: |
                        CloudEvents Causation extension (optional). The `id` of the event that directly caused this one. Use when an event is emitted in direct response to another event (e.g., a task auto-resumed because a timer fired). Allows consumers to trace the immediate cause without inspecting the full distributed trace.
                    authid:
                      type:
                        - string
                        - "null"
                      description: |
                        CloudEvents Auth Context extension (optional). Principal identifier (userId from JWT claims) of the actor who triggered the event. No PII — user ID only, not name or email. Required for FTI-governed events per IRS Pub. 1075. Omitted when no caller identity is present.
                    authtype:
                      type:
                        - string
                        - "null"
                      enum:
                        - user
                        - service_account
                        - api_key
                        - system
                        - unauthenticated
                        - unknown
                        - null
                      description: |
                        CloudEvents Auth Context extension (optional). Principal type of the actor who triggered the event. Required when authid is present. Required for FTI-governed events per IRS Pub. 1075.
                    data:
                      type: object
                      description: Event-specific payload. Schema is defined per event type in each domain's AsyncAPI file.
            - type: object
              properties:
                type:
                  type: string
                  const: document-management.document.created
                data:
                  allOf:
                    - type: object
                      required:
                        - documentTypeId
                        - title
                      properties:
                        documentTypeId:
                          type: string
                          description: What kind of document this is.
                        title:
                          type: string
                          description: A human-readable name for the document.
                        documentDate:
                          type:
                            - string
                            - "null"
                          format: date
                          description: The date the document itself bears, which is not the date it arrived.
                    - type: object
                      required:
                        - id
                        - lifecycleState
                        - latestVersionId
                        - createdAt
                        - updatedAt
                      properties:
                        id:
                          type: string
                          format: uuid
                          readOnly: true
                        lifecycleState:
                          type: string
                          enum:
                            - active
                            - superseded
                            - disposed
                          readOnly: true
                          description: Where this document is in its retention lifecycle.
                        legalHold:
                          type: boolean
                          readOnly: true
                          description: Whether disposition is suspended pending litigation.
                        latestVersionId:
                          type: string
                          format: uuid
                          readOnly: true
                          description: The most recent version, which is what describes the file.
                          x-relationship:
                            type: fk
                            domain: document-management
                            resource: DocumentVersion
                            style: links-only
                        retentionDeadline:
                          type:
                            - string
                            - "null"
                          format: date-time
                          readOnly: true
                          description: When this document becomes eligible for disposition.
                        metadata:
                          type: object
                          additionalProperties: true
                          description: Arbitrary key-value metadata supplied at upload.
                        createdAt:
                          type: string
                          format: date-time
                          readOnly: true
                        updatedAt:
                          type: string
                          format: date-time
                          readOnly: true
                        links:
                          type: object
                          readOnly: true
                          description: Related resource links.
                          properties:
                            latestVersion:
                              type: string
                              format: uri-reference
                              description: Link to the related DocumentVersion resource.
