              startedAt: "2026-10-12T15:00:00Z"
              endedAt: "2026-10-12T15:01:00Z"
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'connected'
      - stepId: gapKept
        description: |
          Read the transcript's timeline

          - The gap, on the same transcript the failed session started.
        operationId: $sourceDescriptions.transcripts.listTranscriptEntries
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptId
            in: path
            value: $workflows.givingUp.outputs.transcriptId
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/items/0/kind == 'gap'
  - workflowId: renewing
    summary: Renewing the credential
    description: Starts already connected. Before the credential expires, the client gets a fresh one without dropping the connection.
    dependsOn:
      - setUp
    steps:
      - stepId: connected
        x-actors:
          - staff
          - client
          - server
        description: |
          Start a session and connect, as in the main flow

          - Runs the Connect workflow: start a session, ask how to stream, open the connection to the service, and say it's open.
        workflowId: connect
        parameters:
          - name: profileId
            value: $workflows.setUp.outputs.profileId
          - name: startedAt
            value: "2026-10-12T16:30:00Z"
        outputs:
          sessionId: $outputs.sessionId
          transcriptId: $outputs.transcriptId
      - stepId: standInForRenewal
        x-actors:
          - developer
        description: Stand in for the transcript audio adapter for the renewal
        operationId: $sourceDescriptions.mock.registerHttpStub
        requestBody:
          payload:
            match:
              method: POST
              url: /issue-connection
            response:
              status: 200
              body:
                provider: fake-transcription
                protocol: websocket
                url: wss://fake-transcription.example/stream
                subprotocol: blueprint.transcripts.relay.v1
                accessToken: fake-service-token
                tokenType: Bearer
                expiresIn: 300
        successCriteria:
          - condition: $statusCode == 201
      - stepId: renew
        x-actors:
          - client
          - server
        description: |
          Renew the credential

          - `renew-connection` gets a fresh credential and leaves the session `connected`; the connection isn't dropped, and no event is sent.
        operationId: $sourceDescriptions.sessions.renewConnectionTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptionSessionId
            in: path
            value: $steps.connected.outputs.sessionId
        requestBody:
          payload:
            audio:
              encoding: linear16
              sampleRateHertz: 16000
              channelCount: 1
            protocols:
              - websocket
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/expiresIn == 300
  - workflowId: transcriptRules
    summary: What's refused and repeated
    description: A line sent to a session before it's connected, then the transcript's own rules, called directly, with no session. Calling the transcript directly is also how a typed conversation, such as a chat, is kept, under a profile with no service.
    dependsOn:
      - setUp
    steps:
      - stepId: startSession
        x-actors:
          - staff
          - client
          - server
        description: Start a session, and don't connect
        operationId: $sourceDescriptions.sessions.createTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
        requestBody:
          payload:
            profileId: $workflows.setUp.outputs.profileId
            model: standard
            client: interview-assistant/0.1.0
            startedAt: "2026-10-12T15:30:00Z"
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          id: $response.body#/id
      - stepId: lineBeforeConnecting
        x-actors:
          - client
          - server
        description: |
          Send a finished line before connecting

          - Refused with `409`: a session adds a line only while connected, paused or stopping.
        operationId: $sourceDescriptions.sessions.addLineTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptionSessionId
            in: path
            value: $steps.startSession.outputs.id
        requestBody:
          payload:
            key: early
            startedAt: "2026-10-12T15:30:01Z"
            endedAt: "2026-10-12T15:30:02Z"
            text: Too soon.
            speaker: staff
        successCriteria:
          - condition: $statusCode == 409
      - stepId: startWithoutAModel
        x-actors:
          - client
          - server
        description: |
          Start without a model

          - Refused with `409` by `modelGivenForTheService`: under a profile whose `provider` is a transcription service, a transcript has to say which `model` produced its lines.
          - A guard runs on a plain create because the state machine governs `Transcript` under `resources:`. No action is involved.
        operationId: $sourceDescriptions.transcripts.createTranscript
        parameters:
          - reference: $components.parameters.caller
        requestBody:
          payload:
            profileId: $workflows.setUp.outputs.profileId
            client: interview-assistant/0.1.0
            startedAt: "2026-10-12T16:00:00Z"
        successCriteria:
          - condition: $statusCode == 409
      - stepId: startUnderAMissingProfile
        x-actors:
          - client
          - server
        description: |
          Start under a profile that does not exist

          - Refused with `409` by `profileExists`: the guard reads the profile `profileId` names, through the machine's context, and there isn't one.
        operationId: $sourceDescriptions.transcripts.createTranscript
        parameters:
          - reference: $components.parameters.caller
        requestBody:
          payload:
            profileId: 00000000-0000-4000-8000-000000000000
            model: standard
            client: interview-assistant/0.1.0
            startedAt: "2026-10-12T16:00:00Z"
        successCriteria:
          - condition: $statusCode == 409
      - stepId: start
        x-actors:
          - client
          - server
        description: |
          Start a transcript

          - `status` is `recording`. `startedAt` is by the client's clock, and every time on the transcript's entries is compared on that same clock.
        operationId: $sourceDescriptions.transcripts.createTranscript
        parameters:
          - reference: $components.parameters.caller
        requestBody:
          payload:
            profileId: $workflows.setUp.outputs.profileId
            model: standard
            client: interview-assistant/0.1.0
            startedAt: "2026-10-12T16:00:00Z"
        successCriteria:
          - condition: $statusCode == 201
          - condition: $response.body#/status == 'recording'
        outputs:
          id: $response.body#/id
      - stepId: firstLine
        x-actors:
          - client
          - server
        description: |
          Add the first line

          - `Idempotency-Key` is declared on this operation. The server remembers the key with its answer.
          - `startedWhileRecording`, `endsAfterItStarts` and `gapOutsidePauses` all passed: the guards the machine puts on every new entry.
        operationId: $sourceDescriptions.transcripts.addTranscriptEntry
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptId
            in: path
            value: $steps.start.outputs.id
          - name: Idempotency-Key
            in: header
            value: line-1
        requestBody:
          payload:
            kind: line
            startedAt: "2026-10-12T16:00:05Z"
            endedAt: "2026-10-12T16:00:06Z"
            text: Can you tell me who lives with you?
            speaker: staff
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          id: $response.body#/id
      - stepId: retryFirstLine
        x-actors:
          - client
          - server
        description: |
          Send it again

          - Same `Idempotency-Key`, same body: the server answers with the line it already stored, with the same `id` and `Idempotent-Replayed: true`. No second line is written.
          - The same key with a different body would be refused with `422`.
        operationId: $sourceDescriptions.transcripts.addTranscriptEntry
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptId
            in: path
            value: $steps.start.outputs.id
          - name: Idempotency-Key
            in: header
            value: line-1
        requestBody:
          payload:
            kind: line
            startedAt: "2026-10-12T16:00:05Z"
            endedAt: "2026-10-12T16:00:06Z"
            text: Can you tell me who lives with you?
            speaker: staff
        successCriteria:
          - condition: $statusCode == 201
          - condition: $response.body#/id == $steps.firstLine.outputs.id
          - condition: $response.header.Idempotent-Replayed == 'true'
      - stepId: pause
        x-actors:
          - staff
          - server
        description: |
          Go off the record

          - `pause` goes from `recording` to `paused`, writes a `pause` entry with no `endedAt`, and sends `communication.transcript.paused`.
        operationId: $sourceDescriptions.transcripts.pauseTranscript
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptId
            in: path
            value: $steps.start.outputs.id
        requestBody:
          payload:
            at: "2026-10-12T16:00:10Z"
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'paused'
      - stepId: lineSaidBeforeThePause
        x-actors:
          - client
          - server
        description: |
          Send a line said just before the pause

          - It arrived after the pause, but its `startedAt` is before it, and `startedWhileRecording` judges an entry by when it started. Kept.
        operationId: $sourceDescriptions.transcripts.addTranscriptEntry
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptId
            in: path
            value: $steps.start.outputs.id
          - name: Idempotency-Key
            in: header
            value: line-2
        requestBody:
          payload:
            kind: line
            startedAt: "2026-10-12T16:00:08Z"
            endedAt: "2026-10-12T16:00:11Z"
            text: My two kids and my mother.
            speaker: client
        successCriteria:
          - condition: $statusCode == 201
      - stepId: lineSaidDuringThePause
        x-actors:
          - client
          - server
        description: |
          Send a line said during the pause

          - Refused with `409` by `startedWhileRecording`. The server refuses it, not the client: nothing said off the record is kept, even if a client keeps sending.
        operationId: $sourceDescriptions.transcripts.addTranscriptEntry
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptId
            in: path
            value: $steps.start.outputs.id
          - name: Idempotency-Key
            in: header
            value: line-3
        requestBody:
          payload:
            kind: line
            startedAt: "2026-10-12T16:00:12Z"
            endedAt: "2026-10-12T16:00:13Z"
            text: Off the record.
            speaker: client
        successCriteria:
          - condition: $statusCode == 409
      - stepId: gapOverlappingThePause
        x-actors:
          - client
          - server
        description: |
          Report a lost stretch overlapping the pause

          - Refused with `409` by `gapOutsidePauses`. A gap is time the client lost, and the pause already accounts for that stretch.
        operationId: $sourceDescriptions.transcripts.addTranscriptEntry
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptId
            in: path
            value: $steps.start.outputs.id
          - name: Idempotency-Key
            in: header
            value: gap-1
        requestBody:
          payload:
            kind: gap
            startedAt: "2026-10-12T16:00:09Z"
            endedAt: "2026-10-12T16:00:11Z"
            cause: connection
        successCriteria:
          - condition: $statusCode == 409
      - stepId: getConnectionWhilePaused
        x-actors:
          - client
          - server
        description: |
          Ask how to stream during the pause

          - Refused with `409`: `get-connection` goes only from `recording`. Off the record, the server issues no credential and doesn't call the adapter.
        operationId: $sourceDescriptions.transcripts.getConnectionTranscript
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptId
            in: path
            value: $steps.start.outputs.id
        requestBody:
          payload:
            audio:
              encoding: linear16
              sampleRateHertz: 16000
              channelCount: 1
            protocols:
              - websocket
        successCriteria:
          - condition: $statusCode == 409
      - stepId: resume
        x-actors:
          - staff
          - server
        description: |
          Go back on the record

          - `resume` gives the open pause its `endedAt` and goes back to `recording`.
        operationId: $sourceDescriptions.transcripts.resumeTranscript
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptId
            in: path
            value: $steps.start.outputs.id
        requestBody:
          payload:
            at: "2026-10-12T16:00:20Z"
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'recording'
      - stepId: lineSaidDuringThePastPause
        x-actors:
          - client
          - server
        description: |
          Send a late line from inside the past pause

          - Still refused by `startedWhileRecording`: the pause is over, but the line started inside it.
        operationId: $sourceDescriptions.transcripts.addTranscriptEntry
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptId
            in: path
            value: $steps.start.outputs.id
          - name: Idempotency-Key
            in: header
            value: line-4
        requestBody:
          payload:
            kind: line
            startedAt: "2026-10-12T16:00:15Z"
            endedAt: "2026-10-12T16:00:16Z"
            text: Still off the record.
            speaker: client
        successCriteria:
          - condition: $statusCode == 409
      - stepId: timeline
        description: |
          Read the timeline

          - Lines, gaps and pauses together, in the order they happened by `startedAt`.
          - `total` is 3: the two lines kept, and the pause with the `endedAt` resuming gave it. The refused entries left nothing behind.
        operationId: $sourceDescriptions.transcripts.listTranscriptEntries
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptId
            in: path
            value: $steps.start.outputs.id
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/total == 3
          - condition: $response.body#/items/2/kind == 'pause'
          - condition: $response.body#/items/2/endedAt == '2026-10-12T16:00:20Z'
        outputs:
          firstEntryId: $response.body#/items/0/id
      - stepId: clientEditsAnEntry
        x-actors:
          - client
          - server
        description: |
          Try to change an entry

          - Refused with `403`: the machine lets only `system` update a `TranscriptEntry`. Entries never change once kept.
        operationId: $sourceDescriptions.transcripts.updateTranscriptEntry
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptId
            in: path
            value: $steps.start.outputs.id
          - name: entryId
            in: path
            value: $steps.timeline.outputs.firstEntryId
        requestBody:
          payload:
            endedAt: "2026-10-12T16:00:59Z"
        successCriteria:
          - condition: $statusCode == 403
      - stepId: close
        x-actors:
          - staff
          - server
        description: |
          Close the transcript

          - `closedAt` is the `at` sent. `lastActivityAt` is when the last line or gap ended; a pause doesn't count.
        operationId: $sourceDescriptions.transcripts.closeTranscript
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptId
            in: path
            value: $steps.start.outputs.id
        requestBody:
          payload:
            at: "2026-10-12T16:00:30Z"
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'closed'
          - condition: $response.body#/lastActivityAt == '2026-10-12T16:00:11Z'
      - stepId: lineAfterTheClose
        x-actors:
          - client
          - server
        description: |
          Send a line after the close

          - Refused with `409` by `startedWhileRecording`: the line started after `closedAt`.
        operationId: $sourceDescriptions.transcripts.addTranscriptEntry
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptId
            in: path
            value: $steps.start.outputs.id
          - name: Idempotency-Key
            in: header
            value: line-5
        requestBody:
          payload:
            kind: line
            startedAt: "2026-10-12T16:00:31Z"
            endedAt: "2026-10-12T16:00:32Z"
            text: Too late.
            speaker: client
        successCriteria:
          - condition: $statusCode == 409
      - stepId: addTimedProfile
        x-actors:
          - administrator
        description: |
          Add a profile with an idle timeout

          - `idleTimeout` is an ISO 8601 duration, `PT30M`. A recording transcript under this profile that hears nothing for that long closes itself.
        operationId: $sourceDescriptions.transcripts.createTranscriptionProfile
        parameters:
          - name: X-Caller-Id
            in: header
            value: admin-1
        requestBody:
          payload:
            name: english-timed
            provider: fake-transcription
            languages:
              - en-US
            idleTimeout: PT30M
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          id: $response.body#/id
      - stepId: standInForTheScheduler
        x-actors:
          - developer
        description: |
          Stand in for the scheduler

          - `requestIdleCheck` emits `platform.timer.requested`, asking the scheduler to send an `idle_check` once the profile's `idleTimeout` has passed.
          - Nobody waits 30 minutes in a test. This stub answers the next idle check request at once, as if the time had passed.
        operationId: $sourceDescriptions.mock.registerEventStub
        requestBody:
          payload:
            "on": platform.timer.requested
            match:
              data.callback.event: communication.idle_check
        successCriteria:
          - condition: $statusCode == 201
      - stepId: startAndGoQuiet
        x-actors:
          - client
          - server
        description: |
          Start a transcript and go quiet

          - Creating it asks for the first idle check. No line or gap ever arrives.
        operationId: $sourceDescriptions.transcripts.createTranscript
        parameters:
          - reference: $components.parameters.caller
        requestBody:
          payload:
            profileId: $steps.addTimedProfile.outputs.id
            model: standard
            client: interview-assistant/0.1.0
            startedAt: "2026-10-12T17:00:00Z"
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          id: $response.body#/id
      - stepId: quietTranscriptClosed
        x-actors:
          - server
        description: |
          Hear that the quiet transcript closed itself

          - When the `idle_check` came, nothing had arrived since it was asked for, so the server closed the transcript and sent `communication.transcript.closed`. `authtype` is `system`: nobody asked.
        operationId: $sourceDescriptions.transcriptEvents.sendCommunicationTranscriptClosed
        action: receive
        successCriteria:
          - condition: $message.payload#/subject == $steps.startAndGoQuiet.outputs.id
          - condition: $message.payload#/authtype == 'system'
      - stepId: whenItClosed
        description: |
          Read the quiet transcript

          - It closed when it was last heard from, here its `startedAt`, not when the check ran.
        operationId: $sourceDescriptions.transcripts.getTranscript
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptId
            in: path
            value: $steps.startAndGoQuiet.outputs.id
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'closed'
          - condition: $response.body#/closedAt == '2026-10-12T17:00:00Z'
  - workflowId: connect
    summary: Connect
    description: Start a session and connect to the service, as the main flow does.
    inputs:
      type: object
      required:
        - profileId
        - startedAt
      properties:
        profileId:
          type: string
        startedAt:
          type: string
          format: date-time
    steps:
      - stepId: start
        x-actors:
          - staff
          - client
          - server
        description: Start a session
        operationId: $sourceDescriptions.sessions.createTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
        requestBody:
          payload:
            profileId: $inputs.profileId
            model: standard
            client: interview-assistant/0.1.0
            startedAt: $inputs.startedAt
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          id: $response.body#/id
      - stepId: standInForTheAdapter
        x-actors:
          - developer
        description: Stand in for the transcript audio adapter
        operationId: $sourceDescriptions.mock.registerHttpStub
        requestBody:
          payload:
            match:
              method: POST
              url: /issue-connection
            response:
              status: 200
              body:
                provider: fake-transcription
                protocol: websocket
                url: wss://fake-transcription.example/stream
                subprotocol: blueprint.transcripts.relay.v1
                accessToken: fake-service-token
                tokenType: Bearer
                expiresIn: 300
        successCriteria:
          - condition: $statusCode == 201
      - stepId: getConnection
        x-actors:
          - client
          - server
        description: Ask how to stream
        operationId: $sourceDescriptions.sessions.getConnectionTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptionSessionId
            in: path
            value: $steps.start.outputs.id
        requestBody:
          payload:
            audio:
              encoding: linear16
              sampleRateHertz: 16000
              channelCount: 1
            protocols:
              - websocket
        successCriteria:
          - condition: $statusCode == 200
      - stepId: standInForTheService
        x-actors:
          - developer
        description: Stand in for the service, answering start with started
        operationId: $sourceDescriptions.mock.registerWsStub
        requestBody:
          payload:
            channel: communication-transcripts-relay-asyncapi.yaml#/channels/audio
            "on": start
            send:
              - type: started
        successCriteria:
          - condition: $statusCode == 201
      - stepId: sendStart
        x-actors:
          - client
          - service
        description: Open the connection and send start
        operationId: $sourceDescriptions.audio.receiveStart
        action: send
        requestBody:
          payload:
            type: start
            audio:
              encoding: linear16
              sampleRateHertz: 16000
              channelCount: 1
            languages:
              - en-US
      - stepId: started
        x-actors:
          - service
          - client
        description: Hear that the service is ready
        operationId: $sourceDescriptions.audio.sendStarted
        action: receive
      - stepId: connect
        x-actors:
          - client
          - server
        description: Say the connection is open
        operationId: $sourceDescriptions.sessions.connectTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptionSessionId
            in: path
            value: $steps.start.outputs.id
        requestBody:
          payload: {}
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'connected'
        outputs:
          transcriptId: $response.body#/transcriptId
    outputs:
      sessionId: $steps.start.outputs.id
      transcriptId: $steps.connect.outputs.transcriptId
  - workflowId: reconnect
    summary: Reconnect
    description: Get a new credential and connect again, recording a gap when one is given.
    inputs:
      type: object
      required:
        - sessionId
      properties:
        sessionId:
          type: string
        gap:
          type: object
    steps:
      - stepId: standInForTheAdapter
        x-actors:
          - developer
        description: Stand in for the transcript audio adapter for the new connection
        operationId: $sourceDescriptions.mock.registerHttpStub
        requestBody:
          payload:
            match:
              method: POST
              url: /issue-connection
            response:
              status: 200
              body:
                provider: fake-transcription
                protocol: websocket
                url: wss://fake-transcription.example/stream
                subprotocol: blueprint.transcripts.relay.v1
                accessToken: fake-service-token
                tokenType: Bearer
                expiresIn: 300
        successCriteria:
          - condition: $statusCode == 201
      - stepId: getConnection
        x-actors:
          - client
          - server
        description: |
          Ask how to stream again

          - The session already has its transcript, so it only gets a new credential.
        operationId: $sourceDescriptions.sessions.getConnectionTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptionSessionId
            in: path
            value: $inputs.sessionId
        requestBody:
          payload:
            audio:
              encoding: linear16
              sampleRateHertz: 16000
              channelCount: 1
            protocols:
              - websocket
        successCriteria:
          - condition: $statusCode == 200
      - stepId: standInForTheService
        x-actors:
          - developer
        description: Stand in for the service on the new connection
        operationId: $sourceDescriptions.mock.registerWsStub
        requestBody:
          payload:
            channel: communication-transcripts-relay-asyncapi.yaml#/channels/audio
            "on": start
            send:
              - type: started
        successCriteria:
          - condition: $statusCode == 201
      - stepId: sendStart
        x-actors:
          - client
          - service
        description: |
          Open a new connection and send start

          - The last connection closed, so this opens another.
        operationId: $sourceDescriptions.audio.receiveStart
        action: send
        requestBody:
          payload:
            type: start
            audio:
              encoding: linear16
              sampleRateHertz: 16000
              channelCount: 1
            languages:
              - en-US
      - stepId: started
        x-actors:
          - service
          - client
        description: Hear that the service is ready
        operationId: $sourceDescriptions.audio.sendStarted
        action: receive
      - stepId: connect
        x-actors:
          - client
          - server
        description: |
          Say the connection is open

          - With a `gap`, the stretch nothing was captured in, which the session adds to the transcript.
        operationId: $sourceDescriptions.sessions.connectTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptionSessionId
            in: path
            value: $inputs.sessionId
        requestBody:
          payload:
            gap: $inputs.gap
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'connected'
