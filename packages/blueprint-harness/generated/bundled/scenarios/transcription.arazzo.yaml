arazzo: 1.1.0
info:
  title: Transcribing a conversation, end to end
  version: 1.0.0
  x-domain: communication
  description: |
    A staff member transcribes a conversation: the client in their browser streams the audio to a transcription service and tells the session what happens, the session keeps the transcript on the server, and the transcript audio adapter issues the credential the client connects with. Each section is one situation, on its own session. The mock answers for the adapter, the service and the relay with stubs, which the developer registers as the scenario goes.

    - the main flow: start, connect, one line, stop
    - the same, through a relay, for a service the browser can't reach
    - off the record and back, and someone else pausing the transcript
    - a dropped connection, and renewing the credential
    - what the transcript itself refuses and repeats, which is also how a typed conversation is kept
  x-actors:
    - id: administrator
      name: The administrator
      description: Sets up the transcription profiles that transcripts are started under.
    - id: staff
      name: The staff member
      description: Starts, pauses, resumes and stops transcribing, from their browser.
    - id: client
      name: The client
      description: The software in the staff member's browser that streams the audio to the transcription service and tells the session what happens. This scenario plays its part.
    - id: server
      name: The server
      description: Runs the contracts. In this demo, that's the mock server, which also runs the session, as the browser would.
    - id: service
      name: The transcription service
      description: Turns the audio into text. In this demo, a fake that speaks the relay contract, which the mock answers for with WebSocket stubs.
    - id: relay
      name: The relay
      description: Runs in front of a service a browser can't reach, and speaks the relay contract to the client. In this demo, the mock answers for it with WebSocket stubs.
    - id: someoneElse
      name: Someone else
      description: Another person or application with access to the transcript, such as a supervisor.
    - id: developer
      name: The developer
      description: Runs the demo or test, and uses the mock server's own routes to stand in for the state's transcript audio adapter, the transcription service, the relay and the scheduler.
sourceDescriptions:
  - name: sessions
    url: ../base/domains/communication/communication-transcription-sessions-openapi.yaml
    type: openapi
  - name: sessionEvents
    url: ../base/domains/communication/communication-transcription-sessions-events-asyncapi.yaml
    type: asyncapi
  - name: transcripts
    url: ../base/domains/communication/communication-transcripts-openapi.yaml
    type: openapi
  - name: transcriptEvents
    url: ../base/domains/communication/communication-transcripts-events-asyncapi.yaml
    type: asyncapi
  - name: audio
    url: ../base/domains/communication/communication-transcripts-relay-asyncapi.yaml
    type: asyncapi
  - name: mock
    url: https://blueprint.codeforamerica.org/mock/mock-openapi.yaml
    type: openapi
components:
  parameters:
    caller:
      name: X-Caller-Id
      in: header
      value: worker-1
workflows:
  - workflowId: setUp
    summary: Set up
    description: An administrator adds the profile every session in this walkthrough starts its transcript under.
    steps:
      - stepId: addProfile
        x-actors:
          - administrator
        description: |
          Add a profile

          - The transcription service and languages transcripts are started under. `provider` takes its values from the `transcription-services` registry. `fake-transcription` is an entry the harness adds with a registry file of its own, for demos and tests.
          - No `idleTimeout`, so transcripts under this profile never close for being idle.
        operationId: $sourceDescriptions.transcripts.createTranscriptionProfile
        parameters:
          - name: X-Caller-Id
            in: header
            value: admin-1
        requestBody:
          payload:
            name: english-interviews
            provider: fake-transcription
            languages:
              - en-US
        successCriteria:
          - condition: $statusCode == 201
          - condition: $response.body#/source == 'user'
        outputs:
          id: $response.body#/id
    outputs:
      profileId: $steps.addProfile.outputs.id
  - workflowId: mainFlow
    summary: The main flow
    description: The staff member starts transcribing. The client asks how to stream and connects straight to the transcription service. One line is spoken; the service sends it while it's changing and once it's finished, and the client passes each on to the session. Then they stop, and the transcript closes.
    dependsOn:
      - setUp
    steps:
      - stepId: start
        x-actors:
          - staff
          - client
          - server
        description: |
          Start a session

          - It says what to start a transcript with: the profile, the model, the client and when the conversation began. No transcript exists yet.
          - The session begins in `created`.
          - Not shown: signing in. The staff member is already signed in.
        operationId: $sourceDescriptions.sessions.createTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
        requestBody:
          payload:
            profileId: $workflows.setUp.outputs.profileId
            model: standard
            client: interview-assistant/0.1.0
            startedAt: "2026-10-12T10:00:00Z"
        successCriteria:
          - condition: $statusCode == 201
          - condition: $response.body#/status == 'created'
        outputs:
          id: $response.body#/id
      - stepId: standInForTheAdapter
        x-actors:
          - developer
        description: |
          Stand in for the transcript audio adapter

          - The state's transcript audio adapter holds the transcription service's secret and issues the short-lived credential the client streams with. The mock can't issue one itself: it answers `POST /issue-connection` with `501`.
          - This stub, on the mock server's own route, answers the next `POST /issue-connection` with what the service's adapter would: where to connect, and a token good for five minutes.
        operationId: $sourceDescriptions.mock.registerHttpStub
        requestBody:
          payload:
            match:
              method: POST
              url: /issue-connection
            response:
              status: 200
              body:
                provider: fake-transcription
                protocol: websocket
                url: wss://fake-transcription.example/stream
                subprotocol: blueprint.transcripts.relay.v1
                accessToken: fake-service-token
                tokenType: Bearer
                expiresIn: 300
        successCriteria:
          - condition: $statusCode == 201
      - stepId: getConnection
        x-actors:
          - client
          - server
        description: |
          Ask how to stream

          - The session has no transcript yet, so `get-connection` starts one, under the profile it was created with, then asks the transcript how to connect. The transcript's own `get-connection` calls the transcript audio adapter's `issueTranscriptConnection`.
          - Not shown: the server's call to the adapter. It happens inside this step, and the stub above answers it.
          - The answer is a `StreamConnection`: where to connect, its `subprotocol`, and the token. The client streams the audio straight to the service; it never passes through the server.
        operationId: $sourceDescriptions.sessions.getConnectionTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptionSessionId
            in: path
            value: $steps.start.outputs.id
        requestBody:
          payload:
            audio:
              encoding: linear16
              sampleRateHertz: 16000
              channelCount: 1
            protocols:
              - websocket
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/provider == 'fake-transcription'
          - condition: $response.body#/expiresIn == 300
      - stepId: connecting
        x-actors:
          - server
          - client
        description: |
          Hear that the session is connecting

          - `connecting`, which the session sends from `get-connection`. The client follows the session's events, so whatever changes it, the client hears.
        operationId: $sourceDescriptions.sessionEvents.sendCommunicationTranscriptionSessionConnecting
        action: receive
        successCriteria:
          - condition: $message.payload#/subject == $steps.start.outputs.id
      - stepId: standInForTheService
        x-actors:
          - developer
        description: |
          Stand in for the transcription service

          - This demo's service is a fake that speaks the relay contract, `communication-transcripts-relay-asyncapi.yaml`, so the mock can answer for it. This stub, on the mock's own route, answers the next `start` with `started`, as the contract's `reply` says it's answered.
        operationId: $sourceDescriptions.mock.registerWsStub
        requestBody:
          payload:
            channel: communication-transcripts-relay-asyncapi.yaml#/channels/audio
            "on": start
            send:
              - type: started
        successCriteria:
          - condition: $statusCode == 201
      - stepId: sendStart
        x-actors:
          - client
          - service
        description: |
          Open the connection and say what audio is coming

          - The client opens a WebSocket to the URL `get-connection` gave, asking for its subprotocol with the token beside it, and sends `start` with the audio's format.
        operationId: $sourceDescriptions.audio.receiveStart
        action: send
        requestBody:
          payload:
            type: start
            audio:
              encoding: linear16
              sampleRateHertz: 16000
              channelCount: 1
            languages:
              - en-US
      - stepId: started
        x-actors:
          - service
          - client
        description: |
          Hear that the service is ready

          - `started`: the service is ready for audio.
        operationId: $sourceDescriptions.audio.sendStarted
        action: receive
      - stepId: connect
        x-actors:
          - client
          - server
        description: |
          Say the connection is open

          - The client opened the connection to the service itself; only it knows it worked. The session is `connected`, and names the transcript `get-connection` started.
        operationId: $sourceDescriptions.sessions.connectTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptionSessionId
            in: path
            value: $steps.start.outputs.id
        requestBody:
          payload: {}
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'connected'
        outputs:
          transcriptId: $response.body#/transcriptId
      - stepId: connected
        x-actors:
          - server
          - client
        description: Hear that the session is connected
        operationId: $sourceDescriptions.sessionEvents.sendCommunicationTranscriptionSessionConnected
        action: receive
        successCriteria:
          - condition: $message.payload#/subject == $steps.start.outputs.id
      - stepId: standInForWhatsSaid
        x-actors:
          - developer
        description: |
          Stand in for what the service hears

          - What's said is the one thing no contract can tell the mock. This stub answers the next audio with two results for one stretch of speech: one the service may still revise, then the final one.
        operationId: $sourceDescriptions.mock.registerWsStub
        requestBody:
          payload:
            channel: communication-transcripts-relay-asyncapi.yaml#/channels/audio
            "on": audio
            send:
              - type: result
                id: r1
                isFinal: false
                startOffsetMs: 5000
                endOffsetMs: 5600
                speaker: spk_0
                alternatives:
                  - transcript: Can you tell me who
              - type: result
                id: r1
                isFinal: true
                startOffsetMs: 5000
                endOffsetMs: 6000
                speaker: spk_0
                alternatives:
                  - transcript: Can you tell me who lives with you?
                    confidence: 0.94
        successCriteria:
          - condition: $statusCode == 201
      - stepId: sendAudio
        x-actors:
          - client
          - service
        description: |
          Send the audio

          - Binary frames, in the format `start` gave. The client sends them as it captures them, about ten a second.
        operationId: $sourceDescriptions.audio.receiveAudio
        action: send
        requestBody:
          payload: (16-bit PCM audio)
      - stepId: resultInProgress
        x-actors:
          - service
          - client
        description: |
          Hear a result the service may still revise

          - `isFinal` is false. A later result with the same `id` replaces it.
        operationId: $sourceDescriptions.audio.sendResult
        action: receive
        successCriteria:
          - condition: $message.payload#/isFinal == false
        outputs:
          key: $message.payload#/id
          text: $message.payload#/alternatives/0/transcript
      - stepId: lineInProgress
        x-actors:
          - client
          - server
        description: |
          Show the line in progress

          - The client passes it on with the result's `id` as the line's key. Nothing is kept.
        operationId: $sourceDescriptions.sessions.updateLineTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptionSessionId
            in: path
            value: $steps.start.outputs.id
        requestBody:
          payload:
            key: $steps.resultInProgress.outputs.key
            text: $steps.resultInProgress.outputs.text
            speaker: staff
            startedAt: "2026-10-12T10:00:05Z"
        successCriteria:
          - condition: $statusCode == 200
      - stepId: lineUpdated
        x-actors:
          - server
          - client
        description: |
          Hear the line in progress

          - `line_updated` carries the text and the line's key, for the page to show. It's only an event.
        operationId: $sourceDescriptions.sessionEvents.sendCommunicationTranscriptionSessionLineUpdated
        action: receive
        successCriteria:
          - condition: $message.payload#/subject == $steps.start.outputs.id && $message.payload#/data/key == 'r1'
      - stepId: finalResult
        x-actors:
          - service
          - client
        description: |
          Hear the final result

          - `isFinal` is true, with the same `id`: this is what the transcript keeps.
        operationId: $sourceDescriptions.audio.sendResult
        action: receive
        successCriteria:
          - condition: $message.payload#/isFinal == true
        outputs:
          key: $message.payload#/id
          text: $message.payload#/alternatives/0/transcript
      - stepId: finishedLine
        x-actors:
          - client
          - server
        description: |
          Add the finished line

          - The client passes it on with the same key. Its times are the result's offsets added to when the conversation began, by the client's clock.
          - The session adds it to the transcript, with the key in its `Idempotency-Key`, so a retry keeps it once.
        operationId: $sourceDescriptions.sessions.addLineTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptionSessionId
            in: path
            value: $steps.start.outputs.id
        requestBody:
          payload:
            key: $steps.finalResult.outputs.key
            text: $steps.finalResult.outputs.text
            speaker: staff
            startedAt: "2026-10-12T10:00:05Z"
            endedAt: "2026-10-12T10:00:06Z"
        successCriteria:
          - condition: $statusCode == 200
      - stepId: lineAdded
        x-actors:
          - server
          - client
        description: |
          Hear the line was kept

          - `line_added` carries the line's key and the transcript entry it became, so the page swaps the line in progress for the kept one.
        operationId: $sourceDescriptions.sessionEvents.sendCommunicationTranscriptionSessionLineAdded
        action: receive
        successCriteria:
          - condition: $message.payload#/subject == $steps.start.outputs.id && $message.payload#/data/key == 'r1'
      - stepId: stop
        x-actors:
          - staff
          - client
          - server
        description: |
          Stop

          - The session is `stopping`. The client sends the end of the audio and waits for the last text.
        operationId: $sourceDescriptions.sessions.stopTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptionSessionId
            in: path
            value: $steps.start.outputs.id
        requestBody:
          payload:
            at: "2026-10-12T10:00:10Z"
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'stopping'
      - stepId: standInForTheEnd
        x-actors:
          - developer
        description: |
          Stand in for the service's last answers

          - A last line, said just before Stop, then `ended`, and the service closes the connection, as the contract says it does after `ended`.
        operationId: $sourceDescriptions.mock.registerWsStub
        requestBody:
          payload:
            channel: communication-transcripts-relay-asyncapi.yaml#/channels/audio
            "on": end
            send:
              - type: result
                id: r2
                isFinal: true
                startOffsetMs: 8500
                endOffsetMs: 10200
                speaker: spk_0
                alternatives:
                  - transcript: Thank you, that's everything.
              - type: ended
            close:
              code: 1000
        successCriteria:
          - condition: $statusCode == 201
      - stepId: sendEnd
        x-actors:
          - client
          - service
        description: |
          Say the audio has ended

          - The service sends any results it still has, then `ended`.
        operationId: $sourceDescriptions.audio.receiveEnd
        action: send
        requestBody:
          payload:
            type: end
      - stepId: lastResult
        x-actors:
          - service
          - client
        description: Hear the last result, after Stop
        operationId: $sourceDescriptions.audio.sendResult
        action: receive
        successCriteria:
          - condition: $message.payload#/id == 'r2'
        outputs:
          key: $message.payload#/id
          text: $message.payload#/alternatives/0/transcript
      - stepId: lastLine
        x-actors:
          - client
          - server
        description: |
          Add the last line, after Stop

          - Still added: lines are accepted while stopping, and it began before the transcript closes.
        operationId: $sourceDescriptions.sessions.addLineTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptionSessionId
            in: path
            value: $steps.start.outputs.id
        requestBody:
          payload:
            key: $steps.lastResult.outputs.key
            text: $steps.lastResult.outputs.text
            speaker: staff
            startedAt: "2026-10-12T10:00:08Z"
            endedAt: "2026-10-12T10:00:10Z"
        successCriteria:
          - condition: $statusCode == 200
      - stepId: ended
        x-actors:
          - service
          - client
        description: |
          Hear that the service is done

          - `ended`: no more results are coming, and the service closes the connection.
        operationId: $sourceDescriptions.audio.sendEnded
        action: receive
      - stepId: close
        x-actors:
          - client
          - server
        description: |
          Close

          - The last text is in and the connection is closed. The session closes the transcript, at the time the client says.
        operationId: $sourceDescriptions.sessions.closeTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptionSessionId
            in: path
            value: $steps.start.outputs.id
        requestBody:
          payload:
            at: "2026-10-12T10:00:11Z"
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'closed'
      - stepId: transcriptClosed
        x-actors:
          - server
          - client
        description: |
          Hear that the transcript closed

          - `communication.transcript.closed`, from the transcript, which anyone following it hears.
        operationId: $sourceDescriptions.transcriptEvents.sendCommunicationTranscriptClosed
        action: receive
        successCriteria:
          - condition: $message.payload#/subject == $steps.connect.outputs.transcriptId
      - stepId: timeline
        description: |
          Read the transcript's timeline

          - Both lines. Nothing from the line in progress.
        operationId: $sourceDescriptions.transcripts.listTranscriptEntries
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptId
            in: path
            value: $steps.connect.outputs.transcriptId
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/total == 2
          - condition: $response.body#/items/0/text == 'Can you tell me who lives with you?'
          - condition: $response.body#/items/1/text == "Thank you, that's everything."
  - workflowId: throughARelay
    summary: The main flow, through a relay
    description: The same, for a service the browser can't reach, such as Google Cloud Speech-to-Text. The transcript audio adapter answers with the state's relay instead of the service, and a token it signed for it. The client speaks the same contract to the relay as to the fake service, so only the connection differs; from `connected` on, it's the main flow.
    dependsOn:
      - setUp
    steps:
      - stepId: addProfile
        x-actors:
          - administrator
        description: |
          Add a profile for Google Cloud Speech-to-Text

          - Google's service takes only gRPC, which a browser can't speak, so the state runs a relay in front of it. The profile names the service; where the relay is, is the adapter's configuration.
        operationId: $sourceDescriptions.transcripts.createTranscriptionProfile
        parameters:
          - name: X-Caller-Id
            in: header
            value: admin-1
        requestBody:
          payload:
            name: english-google
            provider: google-cloud-speech
            languages:
              - en-US
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          id: $response.body#/id
      - stepId: start
        x-actors:
          - staff
          - client
          - server
        description: Start a session
        operationId: $sourceDescriptions.sessions.createTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
        requestBody:
          payload:
            profileId: $steps.addProfile.outputs.id
            model: latest_long
            client: interview-assistant/0.1.0
            startedAt: "2026-10-12T11:00:00Z"
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          id: $response.body#/id
      - stepId: standInForTheAdapter
        x-actors:
          - developer
        description: |
          Stand in for the transcript audio adapter, with a relay

          - For a service behind a relay, the adapter answers with the relay's URL, its `subprotocol`, and a JSON Web Token it signed itself, naming the relay as its audience and lasting a minute. It calls nothing to do so.
          - The relay checks the token's signature against the adapter's public keys, which the adapter publishes as `getTranscriptConnectionKeys`. The mock doesn't check it.
        operationId: $sourceDescriptions.mock.registerHttpStub
        requestBody:
          payload:
            match:
              method: POST
              url: /issue-connection
            response:
              status: 200
              body:
                provider: google-cloud-speech
                protocol: websocket
                url: wss://relay.example/transcribe
                subprotocol: blueprint.transcripts.relay.v1
                accessToken: eyJhbGciOiJFUzI1NiIsImtpZCI6InJlbGF5LTIwMjYtMTEiLCJ0eXAiOiJKV1QifQ.eyJhdWQiOiJ3c3M6Ly9yZWxheS5leGFtcGxlL3RyYW5zY3JpYmUiLCJpYXQiOjE3OTA2NzI0MDAsImV4cCI6MTc5MDY3MjQ2MH0.c2lnbmF0dXJl
                tokenType: Bearer
                expiresIn: 60
        successCriteria:
          - condition: $statusCode == 201
      - stepId: getConnection
        x-actors:
          - client
          - server
        description: |
          Ask how to stream

          - The same call as without a relay. `subprotocol` tells the client the connection speaks the relay contract, `communication-transcripts-relay-asyncapi.yaml`.
          - The client sends the token in the WebSocket subprotocol header, not the URL, since URLs are logged.
        operationId: $sourceDescriptions.sessions.getConnectionTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptionSessionId
            in: path
            value: $steps.start.outputs.id
        requestBody:
          payload:
            audio:
              encoding: linear16
              sampleRateHertz: 16000
              channelCount: 1
            protocols:
              - websocket
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/provider == 'google-cloud-speech'
          - condition: $response.body#/subprotocol == 'blueprint.transcripts.relay.v1'
          - condition: $response.body#/expiresIn == 60
      - stepId: standInForTheRelay
        x-actors:
          - developer
        description: Stand in for the relay, answering start with started
        operationId: $sourceDescriptions.mock.registerWsStub
        requestBody:
          payload:
            channel: communication-transcripts-relay-asyncapi.yaml#/channels/audio
            "on": start
            send:
              - type: started
        successCriteria:
          - condition: $statusCode == 201
      - stepId: sendStart
        x-actors:
          - client
          - relay
        description: |
          Open the connection to the relay and say what audio is coming

          - The relay checks the token before taking the connection, then opens its own connection to Google. A token it refuses ends with an `error` whose `code` is `not-allowed`.
          - Not shown: the relay refusing a token. The token goes in the connection's opening handshake, which a scenario step can't set, so this scenario connects without one.
          - Not shown: the relay reading the adapter's keys to check the token. The client doesn't make that call.
        operationId: $sourceDescriptions.audio.receiveStart
        action: send
        requestBody:
          payload:
            type: start
            audio:
              encoding: linear16
              sampleRateHertz: 16000
              channelCount: 1
            languages:
              - en-US
            model: latest_long
      - stepId: started
        x-actors:
          - relay
          - client
        description: Hear that the relay is ready
        operationId: $sourceDescriptions.audio.sendStarted
        action: receive
      - stepId: connect
        x-actors:
          - client
          - server
        description: |
          Say the connection is open

          - From here on, it's the main flow: audio, results, lines and stopping are the same whatever the client is connected to.
        operationId: $sourceDescriptions.sessions.connectTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptionSessionId
            in: path
            value: $steps.start.outputs.id
        requestBody:
          payload: {}
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'connected'
      - stepId: keepalive
        x-actors:
          - client
          - relay
        description: |
          Keep a quiet connection open

          - Sent when no audio has gone for a while, since browser code can't send a WebSocket ping. Nothing answers it.
        operationId: $sourceDescriptions.audio.receiveKeepalive
        action: send
        requestBody:
          payload:
            type: keepalive
      - stepId: standInForWhatsSaid
        x-actors:
          - developer
        description: Stand in for what the relay hears
        operationId: $sourceDescriptions.mock.registerWsStub
        requestBody:
          payload:
            channel: communication-transcripts-relay-asyncapi.yaml#/channels/audio
            "on": audio
            send:
              - type: result
                id: r1
                isFinal: true
                startOffsetMs: 2000
                endOffsetMs: 3400
                speaker: spk_0
                alternatives:
                  - transcript: Who lives with you?
        successCriteria:
          - condition: $statusCode == 201
      - stepId: sendAudio
        x-actors:
          - client
          - relay
