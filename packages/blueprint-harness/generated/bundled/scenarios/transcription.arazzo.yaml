        operationId: $sourceDescriptions.mock.registerWsStub
        requestBody:
          payload:
            channel: communication-transcripts-relay-asyncapi.yaml#/channels/audio
            "on": audio
            send:
              - type: result
                id: r1
                isFinal: true
                startOffsetMs: 2000
                endOffsetMs: 3500
                speaker: spk_0
                alternatives:
                  - transcript: I work at the grocery store.
            close:
              code: 1006
        successCriteria:
          - condition: $statusCode == 201
      - stepId: sendAudio
        x-actors:
          - client
          - service
        description: Send the audio
        operationId: $sourceDescriptions.audio.receiveAudio
        action: send
        requestBody:
          payload: (16-bit PCM audio)
