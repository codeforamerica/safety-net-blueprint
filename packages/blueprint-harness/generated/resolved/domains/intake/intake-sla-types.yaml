$schema: sla-types-schema.yaml
version: "1.0"
domain: intake
slaTypes:
  - id: snap_standard
    name: SNAP Standard Processing
    duration:
      amount: 30
      unit: days
    warningThresholdPercent: 80
    autoAssignWhen: "\"snap\" in programsAppliedFor"
    pauseWhen: status in ["withdrawn"]
  - id: medicaid_standard
    name: Medicaid Standard Processing
    duration:
      amount: 45
      unit: days
    warningThresholdPercent: 80
    pauseWhen: status in ["withdrawn"]
