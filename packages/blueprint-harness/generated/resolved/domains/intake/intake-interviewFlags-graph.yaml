$schema: https://blueprint.codeforamerica.org/schemas/graph-schema.yaml
domain: intake
ruleset: interviewFlags
outputs:
  - risks.earnedIncomeVaries
  - risks.cashOrSelfEmploymentIncome
  - risks.incomeChangedSincePrevious
  - risks.householdChangedSincePrevious
  - risks.shelterCostsCarriedOver
  - risks.elderlyOrDisabledWithoutMedicalCosts
  - risks.childrenAndEarnersWithoutDependentCare
  - risks.multipleProgramsApplied
  - inconsistencies.incomeBelowExpenses
  - inconsistencies.wagesDifferFromWageRecords
  - inconsistencies.incomeDiffersFromPayStub
  - inconsistencies.householdSizeDiffersFromMembers
  - inconsistencies.jobWithoutEarnedIncome
  - inconsistencies.earnedIncomeWithoutJob
  - inconsistencies.utilitiesIncludedButBilled
inputs:
  $.current.size:
    type: integer
    description: The number of people who buy and prepare food together, as the household states it.
  $.current.utilitiesIncludedInRent:
    type: boolean
    description: Whether the household says its utilities are included in the rent.
  $.current.monthlyIncome:
    type: number
    description: Total monthly income, as the household states it.
  $.current.monthlyExpenses:
    type: number
    description: Total monthly expenses, as the household states them.
  $.current.members[]:
    type: array
  $.current.members[].id:
    type: string
    description: The member's key within the household.
  $.current.members[].dateOfBirth:
    type: string
    format: date
  $.current.members[].isDisabled:
    type: boolean
    description: Whether the member is disabled.
  $.current.jobs[]:
    type: array
  $.current.jobs[].id:
    type: string
    description: The job's key within the household.
  $.current.jobs[].memberId:
    type: string
    description: The member who holds the job.
  $.current.jobs[].employer:
    type: string
  $.current.incomes[]:
    type: array
  $.current.incomes[].id:
    type: string
    description: The income's key within the household.
  $.current.incomes[].memberId:
    type: string
    description: The member who receives it.
  $.current.incomes[].jobId:
    type: string
    description: The job it's paid for, when it's earned.
  $.current.incomes[].source:
    type: string
    enum:
      - earned
      - self_employment
      - unearned
  $.current.incomes[].amount:
    type: number
    description: The amount received each time it's paid, in dollars.
  $.current.incomes[].frequency:
    type: string
    description: How often it's paid.
    enum:
      - weekly
      - biweekly
      - semimonthly
      - monthly
      - irregular
  $.current.incomes[].paidInCash:
    type: boolean
  $.current.incomes[].amountVaries:
    type: boolean
    description: Whether the amount changes from one payment to the next, as with irregular hours or tips.
  $.current.expenses[]:
    type: array
  $.current.expenses[].type:
    type: string
    enum:
      - rent
      - mortgage
      - utilities
      - dependent_care
      - medical
      - child_support
  $.current.expenses[].amount:
    type: number
  $.current.expenses[].frequency:
    type: string
    enum:
      - weekly
      - biweekly
      - semimonthly
      - monthly
  $.previous.size:
    type: integer
    description: The number of people who buy and prepare food together, as the household states it.
  $.previous.utilitiesIncludedInRent:
    type: boolean
    description: Whether the household says its utilities are included in the rent.
  $.previous.monthlyIncome:
    type: number
    description: Total monthly income, as the household states it.
  $.previous.monthlyExpenses:
    type: number
    description: Total monthly expenses, as the household states them.
  $.previous.members[]:
    type: array
  $.previous.members[].id:
    type: string
    description: The member's key within the household.
  $.previous.members[].dateOfBirth:
    type: string
    format: date
  $.previous.members[].isDisabled:
    type: boolean
    description: Whether the member is disabled.
  $.previous.jobs[]:
    type: array
  $.previous.jobs[].id:
    type: string
    description: The job's key within the household.
  $.previous.jobs[].memberId:
    type: string
    description: The member who holds the job.
  $.previous.jobs[].employer:
    type: string
  $.previous.incomes[]:
    type: array
  $.previous.incomes[].id:
    type: string
    description: The income's key within the household.
  $.previous.incomes[].memberId:
    type: string
    description: The member who receives it.
  $.previous.incomes[].jobId:
    type: string
    description: The job it's paid for, when it's earned.
  $.previous.incomes[].source:
    type: string
    enum:
      - earned
      - self_employment
      - unearned
  $.previous.incomes[].amount:
    type: number
    description: The amount received each time it's paid, in dollars.
  $.previous.incomes[].frequency:
    type: string
    description: How often it's paid.
    enum:
      - weekly
      - biweekly
      - semimonthly
      - monthly
      - irregular
  $.previous.incomes[].paidInCash:
    type: boolean
  $.previous.incomes[].amountVaries:
    type: boolean
    description: Whether the amount changes from one payment to the next, as with irregular hours or tips.
  $.previous.expenses[]:
    type: array
  $.previous.expenses[].type:
    type: string
    enum:
      - rent
      - mortgage
      - utilities
      - dependent_care
      - medical
      - child_support
  $.previous.expenses[].amount:
    type: number
  $.previous.expenses[].frequency:
    type: string
    enum:
      - weekly
      - biweekly
      - semimonthly
      - monthly
  $.verified[]:
    type: array
    description: What outside records show for this application.
  $.verified[].kind:
    type: string
    description: |
      Where the figure comes from: state wage records or IEVS, reported by quarter; or a pay stub the household provided and the worker verified.
    enum:
      - wage_record
      - pay_stub
  $.verified[].memberId:
    type: string
    description: The member it's about, by their key in the household.
  $.verified[].incomeId:
    type: string
    description: For a pay stub, the income it's for, by its key in the household.
  $.verified[].period:
    type: string
    description: For a wage record, the quarter it covers, as 2026-Q3; for a pay stub, the pay date.
  $.verified[].amount:
    type: number
    description: Gross wages for the quarter, or gross pay on the stub.
  $.verified[].frequency:
    type: string
    description: For a pay stub, how often the pay it shows is paid.
    enum:
      - weekly
      - biweekly
      - semimonthly
      - monthly
  $.asOf:
    type: string
    description: The date ages are measured from — the interview date.
    format: date
  $.programsAppliedFor[]:
    type: array
    description: The programs the household applied for.
constants:
  weeklyToMonthly:
    value: 4.3
    description: What weekly pay is multiplied by for a month. SNAP allows 4.3, or the exact 52 ÷ 12 (7 CFR § 273.10(c)(2)).
  biweeklyToMonthly:
    value: 2.15
    description: What pay every two weeks is multiplied by for a month. SNAP allows 2.15, or the exact 26 ÷ 12 (7 CFR § 273.10(c)(2)).
  differenceAllowed:
    value: 0.1
    description: How far apart two amounts can be, as a fraction, before they count as different.
  childCareAgeUnder:
    value: 13
    type: integer
    description: The age under which a child is taken to need care while the adults work.
facts:
  monthlyFactor:
    expression: |
      {'weekly': constants.weeklyToMonthly, 'biweekly': constants.biweeklyToMonthly,
       'semimonthly': 2.0, 'monthly': 1.0, 'irregular': 1.0}
    description: |
      What one payment is multiplied by for a month's worth, by how often it's paid. Irregular income is taken as the household's monthly figure.
  hasElderlyOrDisabledMember:
    expression: |
      current.members.exists(m, (has(m.isDisabled) && m.isDisabled)
        || asOf.getFullYear() - m.dateOfBirth.getFullYear()
           - ((asOf.getMonth() < m.dateOfBirth.getMonth()
               || (asOf.getMonth() == m.dateOfBirth.getMonth() && asOf.getDate() < m.dateOfBirth.getDate())) ? 1 : 0)
           >= 60)
    type: boolean
    description: A member is disabled, or 60 or older on the interview date.
  hasChild:
    expression: |
      current.members.exists(m,
        asOf.getFullYear() - m.dateOfBirth.getFullYear()
        - ((asOf.getMonth() < m.dateOfBirth.getMonth()
            || (asOf.getMonth() == m.dateOfBirth.getMonth() && asOf.getDate() < m.dateOfBirth.getDate())) ? 1 : 0)
        < constants.childCareAgeUnder)
    type: boolean
    description: A member is younger than the age a child is taken to need care, on the interview date.
  risks.earnedIncomeVaries:
    expression: current.incomes.exists(i, i.source == 'earned' && ((has(i.amountVaries) && i.amountVaries) || i.frequency == 'irregular'))
    type: boolean
    description: A member's wages change from one payment to the next, or come irregularly.
  risks.cashOrSelfEmploymentIncome:
    expression: current.incomes.exists(i, i.source == 'self_employment' || (has(i.paidInCash) && i.paidInCash))
    type: boolean
    description: A member has self-employment income, or is paid in cash.
  risks.incomeChangedSincePrevious:
    expression: |
      current.incomes.exists(i, !previous.incomes.exists(p,
        p.memberId == i.memberId && p.source == i.source && p.amount == i.amount && p.frequency == i.frequency))
      || previous.incomes.exists(p, !current.incomes.exists(i, i.memberId == p.memberId && i.source == p.source))
    type: boolean
    description: An income source is new, ended, or a different amount or frequency from the household on record.
  risks.householdChangedSincePrevious:
    expression: |
      current.members.exists(m, !previous.members.exists(p, p.id == m.id)) || previous.members.exists(p, !current.members.exists(m, m.id == p.id))
    type: boolean
    description: Someone has joined or left the household since the household on record.
  risks.shelterCostsCarriedOver:
    expression: |
      current.expenses.exists(e, e.type in ['rent', 'mortgage']
        && previous.expenses.exists(p, p.type == e.type && p.amount == e.amount && p.frequency == e.frequency))
    type: boolean
    description: Rent or mortgage is exactly what the household on record had.
  risks.elderlyOrDisabledWithoutMedicalCosts:
    expression: hasElderlyOrDisabledMember && !current.expenses.exists(e, e.type == 'medical')
    type: boolean
    description: A member is 60 or older, or disabled, and no medical costs are reported.
  risks.childrenAndEarnersWithoutDependentCare:
    expression: |
      hasChild && current.incomes.exists(i, i.source in ['earned', 'self_employment']) && !current.expenses.exists(e, e.type == 'dependent_care')
    type: boolean
    description: There's a child young enough to need care and someone earning, and no dependent care is reported.
  risks.multipleProgramsApplied:
    expression: "'snap' in programsAppliedFor && programsAppliedFor.exists(p, p != 'snap')"
    type: boolean
    description: The household applied for SNAP and another program, whose reporting rules differ.
  inconsistencies.incomeBelowExpenses:
    expression: current.monthlyIncome < current.monthlyExpenses
    type: boolean
    description: The household's stated monthly income doesn't cover its stated monthly expenses.
  inconsistencies.wagesDifferFromWageRecords:
    expression: |
      verified.exists(v, v.kind == 'wage_record' && !current.incomes.exists(i,
        i.memberId == v.memberId && i.source == 'earned' && i.frequency != 'irregular'
        && i.amount * monthlyFactor[i.frequency] >= v.amount / 3.0 * (1.0 - constants.differenceAllowed)
        && i.amount * monthlyFactor[i.frequency] <= v.amount / 3.0 * (1.0 + constants.differenceAllowed)))
    type: boolean
    description: |
      A member's monthly wages in the wage records differ by more than the allowed difference from their reported earned income, or they report no regular earned income.
  inconsistencies.incomeDiffersFromPayStub:
    expression: |
      verified.exists(v, v.kind == 'pay_stub' && has(v.incomeId) && has(v.frequency)
        && current.incomes.exists(i, i.id == v.incomeId && i.frequency != 'irregular'
          && (i.amount * monthlyFactor[i.frequency] < v.amount * monthlyFactor[v.frequency] * (1.0 - constants.differenceAllowed)
              || i.amount * monthlyFactor[i.frequency] > v.amount * monthlyFactor[v.frequency] * (1.0 + constants.differenceAllowed))))
    type: boolean
    description: A reported income differs by more than the allowed difference, a month at a time, from its verified pay stub.
  inconsistencies.householdSizeDiffersFromMembers:
    expression: current.size != size(current.members)
    type: boolean
    description: The stated household size isn't the number of members reported.
  inconsistencies.jobWithoutEarnedIncome:
    expression: current.jobs.exists(j, !current.incomes.exists(i, has(i.jobId) && i.jobId == j.id))
    type: boolean
    description: A member has a job with no earned income reported for it.
  inconsistencies.earnedIncomeWithoutJob:
    expression: |
      current.incomes.exists(i, i.source == 'earned'
        && !(has(i.jobId) && current.jobs.exists(j, j.id == i.jobId)))
    type: boolean
    description: Earned income is reported with no job behind it.
  inconsistencies.utilitiesIncludedButBilled:
    expression: current.utilitiesIncludedInRent && current.expenses.exists(e, e.type == 'utilities')
    type: boolean
    description: The household says utilities are included in the rent, but reports a utility bill.
dependencies:
  hasElderlyOrDisabledMember:
    - $.current.members[]
    - $.asOf
  hasChild:
    - $.current.members[]
    - $.asOf
  risks.earnedIncomeVaries:
    - $.current.incomes[]
  risks.cashOrSelfEmploymentIncome:
    - $.current.incomes[]
  risks.incomeChangedSincePrevious:
    - $.current.incomes[]
    - $.previous.incomes[]
  risks.householdChangedSincePrevious:
    - $.current.members[]
    - $.previous.members[]
  risks.shelterCostsCarriedOver:
    - $.current.expenses[]
    - $.previous.expenses[]
  risks.elderlyOrDisabledWithoutMedicalCosts:
    - $.current.expenses[]
    - hasElderlyOrDisabledMember
  risks.childrenAndEarnersWithoutDependentCare:
    - $.current.incomes[]
    - $.current.expenses[]
    - hasChild
  risks.multipleProgramsApplied:
    - $.programsAppliedFor[]
  inconsistencies.incomeBelowExpenses:
    - $.current.monthlyIncome
    - $.current.monthlyExpenses
  inconsistencies.wagesDifferFromWageRecords:
    - $.current.incomes[]
    - $.verified[]
    - monthlyFactor
  inconsistencies.incomeDiffersFromPayStub:
    - $.current.incomes[]
    - $.verified[]
    - monthlyFactor
  inconsistencies.householdSizeDiffersFromMembers:
    - $.current.size
    - $.current.members[]
  inconsistencies.jobWithoutEarnedIncome:
    - $.current.jobs[]
    - $.current.incomes[]
  inconsistencies.earnedIncomeWithoutJob:
    - $.current.jobs[]
    - $.current.incomes[]
  inconsistencies.utilitiesIncludedButBilled:
    - $.current.utilitiesIncludedInRent
    - $.current.expenses[]
