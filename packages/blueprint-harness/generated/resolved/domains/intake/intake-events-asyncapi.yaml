components:
  messages:
    IntakeApplicationCreated:
      name: intake.application.created
      summary: A Application was created. Carries the record as created.
      payload:
        schemaFormat: application/vnd.oai.openapi;version=3.1.0
        schema:
          $ref: "#/components/schemas/IntakeApplicationCreatedEvent"
      examples:
        - name: Example
          summary: An example intake.application.created event.
          payload:
            specversion: "1.0"
            id: 00000000-0000-4000-8000-000000000000
            source: /intake
            type: intake.application.created
            subject: 11111111-1111-4111-8111-111111111111
            time: "2024-01-01T00:00:00Z"
            datacontenttype: application/json
            data:
              id: 11111111-1111-4111-8111-111111111111
              status: submitted
              programsAppliedFor:
                - snap
              channel: online
              createdAt: "2026-02-01T09:00:00Z"
              updatedAt: "2026-02-01T09:15:00Z"
    IntakeApplicationUpdated:
      name: intake.application.updated
      summary: A Application was changed. Carries each changed field, before and after.
      payload:
        schemaFormat: application/vnd.oai.openapi;version=3.1.0
        schema:
          $ref: "#/components/schemas/IntakeApplicationUpdatedEvent"
      examples:
        - name: Example
          summary: An example intake.application.updated event.
          payload:
            specversion: "1.0"
            id: 00000000-0000-4000-8000-000000000000
            source: /intake
            type: intake.application.updated
            subject: 11111111-1111-4111-8111-111111111111
            time: "2024-01-01T00:00:00Z"
            datacontenttype: application/json
            data:
              changes:
                - field: channel
                  before: online
                  after: phone
    IntakeApplicationDeleted:
      name: intake.application.deleted
      summary: A Application was deleted. The subject is the record's id.
      payload:
        schemaFormat: application/vnd.oai.openapi;version=3.1.0
        schema:
          $ref: "#/components/schemas/IntakeApplicationDeletedEvent"
      examples:
        - name: Example
          summary: An example intake.application.deleted event.
          payload:
            specversion: "1.0"
            id: 00000000-0000-4000-8000-000000000000
            source: /intake
            type: intake.application.deleted
            subject: 11111111-1111-4111-8111-111111111111
            time: "2024-01-01T00:00:00Z"
            datacontenttype: application/json
            data: {}
    IntakeIncomeVerificationCreated:
      name: intake.income_verification.created
      summary: A IncomeVerification was created. Carries the record as created.
      payload:
        schemaFormat: application/vnd.oai.openapi;version=3.1.0
