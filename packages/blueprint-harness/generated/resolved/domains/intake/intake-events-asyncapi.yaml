    IntakeApplicationMemberDeleted:
      name: intake.application_member.deleted
      summary: A ApplicationMember was deleted. The subject is the record's id.
      payload:
        schemaFormat: application/vnd.oai.openapi;version=3.1.0
        schema:
          $ref: "#/components/schemas/IntakeApplicationMemberDeletedEvent"
      examples:
        - name: Example
          summary: An example intake.application_member.deleted event.
          payload:
            specversion: "1.0"
            id: 00000000-0000-4000-8000-000000000000
            source: /intake
            type: intake.application_member.deleted
            subject: 11111111-1111-4111-8111-100000000001
            time: "2024-01-01T00:00:00Z"
            datacontenttype: application/json
            data: {}
    IntakeApplicationSubmitted:
      name: intake.application.submitted
      summary: Published when an application is submitted for review. Eligibility creates a pending determination for it.
      payload:
        schemaFormat: application/vnd.oai.openapi;version=3.1.0
        schema:
          $ref: "#/components/schemas/IntakeApplicationSubmittedEvent"
      examples:
        - name: Example
          summary: An example intake.application.submitted event.
          payload:
