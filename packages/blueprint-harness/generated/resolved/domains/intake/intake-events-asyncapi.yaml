asyncapi: 3.0.0
info:
  title: Intake API events
  version: 1.0.0
  x-domain: intake
  description: The events intake-openapi.yaml and the state machines attached to its resources send, and the events those machines receive. Generated by resolve; not edited by hand.
channels:
  intake.application.created:
    address: intake.application.created
    messages:
      IntakeApplicationCreated:
        $ref: "#/components/messages/IntakeApplicationCreated"
  intake.application.updated:
    address: intake.application.updated
    messages:
      IntakeApplicationUpdated:
        $ref: "#/components/messages/IntakeApplicationUpdated"
  intake.application.deleted:
    address: intake.application.deleted
    messages:
      IntakeApplicationDeleted:
        $ref: "#/components/messages/IntakeApplicationDeleted"
  intake.income_verification.created:
    address: intake.income_verification.created
    messages:
      IntakeIncomeVerificationCreated:
        $ref: "#/components/messages/IntakeIncomeVerificationCreated"
  intake.application_income.created:
    address: intake.application_income.created
    messages:
      IntakeApplicationIncomeCreated:
        $ref: "#/components/messages/IntakeApplicationIncomeCreated"
  intake.application_income.updated:
    address: intake.application_income.updated
    messages:
      IntakeApplicationIncomeUpdated:
        $ref: "#/components/messages/IntakeApplicationIncomeUpdated"
  intake.interview.created:
    address: intake.interview.created
    messages:
      IntakeInterviewCreated:
        $ref: "#/components/messages/IntakeInterviewCreated"
  intake.application_member.created:
    address: intake.application_member.created
    messages:
      IntakeApplicationMemberCreated:
        $ref: "#/components/messages/IntakeApplicationMemberCreated"
  intake.application_member.updated:
    address: intake.application_member.updated
    messages:
      IntakeApplicationMemberUpdated:
        $ref: "#/components/messages/IntakeApplicationMemberUpdated"
  intake.application_member.deleted:
    address: intake.application_member.deleted
    messages:
      IntakeApplicationMemberDeleted:
        $ref: "#/components/messages/IntakeApplicationMemberDeleted"
  intake.application.submitted:
    address: intake.application.submitted
    messages:
      IntakeApplicationSubmitted:
        $ref: "#/components/messages/IntakeApplicationSubmitted"
  intake.application.closed:
    address: intake.application.closed
    messages:
      IntakeApplicationClosed:
        $ref: "#/components/messages/IntakeApplicationClosed"
  intake.application.withdrawn:
    address: intake.application.withdrawn
    messages:
      IntakeApplicationWithdrawn:
        $ref: "#/components/messages/IntakeApplicationWithdrawn"
  intake.application.review-reminder:
    address: intake.application.review-reminder
    messages:
      IntakeApplicationReviewReminder:
        $ref: "#/components/messages/IntakeApplicationReviewReminder"
  intake.review_reminder:
    address: intake.review_reminder
    messages:
      IntakeReviewReminder:
        $ref: "#/components/messages/IntakeReviewReminder"
  intake.interview.started:
    address: intake.interview.started
    messages:
      IntakeInterviewStarted:
        $ref: "#/components/messages/IntakeInterviewStarted"
  intake.interview.completed:
    address: intake.interview.completed
    messages:
      IntakeInterviewCompleted:
        $ref: "#/components/messages/IntakeInterviewCompleted"
operations:
  sendIntakeApplicationCreated:
    action: send
    channel:
      $ref: "#/channels/intake.application.created"
    messages:
      - $ref: "#/channels/intake.application.created/messages/IntakeApplicationCreated"
  sendIntakeApplicationUpdated:
    action: send
    channel:
      $ref: "#/channels/intake.application.updated"
    messages:
      - $ref: "#/channels/intake.application.updated/messages/IntakeApplicationUpdated"
  sendIntakeApplicationDeleted:
    action: send
    channel:
      $ref: "#/channels/intake.application.deleted"
    messages:
      - $ref: "#/channels/intake.application.deleted/messages/IntakeApplicationDeleted"
  sendIntakeIncomeVerificationCreated:
    action: send
    channel:
      $ref: "#/channels/intake.income_verification.created"
    messages:
      - $ref: "#/channels/intake.income_verification.created/messages/IntakeIncomeVerificationCreated"
  sendIntakeApplicationIncomeCreated:
    action: send
    channel:
      $ref: "#/channels/intake.application_income.created"
    messages:
      - $ref: "#/channels/intake.application_income.created/messages/IntakeApplicationIncomeCreated"
  sendIntakeApplicationIncomeUpdated:
    action: send
    channel:
      $ref: "#/channels/intake.application_income.updated"
    messages:
      - $ref: "#/channels/intake.application_income.updated/messages/IntakeApplicationIncomeUpdated"
  sendIntakeInterviewCreated:
    action: send
    channel:
      $ref: "#/channels/intake.interview.created"
    messages:
      - $ref: "#/channels/intake.interview.created/messages/IntakeInterviewCreated"
  sendIntakeApplicationMemberCreated:
    action: send
    channel:
      $ref: "#/channels/intake.application_member.created"
    messages:
      - $ref: "#/channels/intake.application_member.created/messages/IntakeApplicationMemberCreated"
  sendIntakeApplicationMemberUpdated:
    action: send
    channel:
      $ref: "#/channels/intake.application_member.updated"
    messages:
      - $ref: "#/channels/intake.application_member.updated/messages/IntakeApplicationMemberUpdated"
  sendIntakeApplicationMemberDeleted:
    action: send
    channel:
      $ref: "#/channels/intake.application_member.deleted"
    messages:
      - $ref: "#/channels/intake.application_member.deleted/messages/IntakeApplicationMemberDeleted"
  sendIntakeApplicationSubmitted:
    action: send
    channel:
      $ref: "#/channels/intake.application.submitted"
    messages:
      - $ref: "#/channels/intake.application.submitted/messages/IntakeApplicationSubmitted"
  sendIntakeApplicationClosed:
    action: send
    channel:
      $ref: "#/channels/intake.application.closed"
    messages:
      - $ref: "#/channels/intake.application.closed/messages/IntakeApplicationClosed"
  sendIntakeApplicationWithdrawn:
    action: send
    channel:
      $ref: "#/channels/intake.application.withdrawn"
    messages:
      - $ref: "#/channels/intake.application.withdrawn/messages/IntakeApplicationWithdrawn"
  sendIntakeApplicationReviewReminder:
    action: send
    channel:
      $ref: "#/channels/intake.application.review-reminder"
    messages:
      - $ref: "#/channels/intake.application.review-reminder/messages/IntakeApplicationReviewReminder"
  sendIntakeInterviewStarted:
    action: send
    channel:
      $ref: "#/channels/intake.interview.started"
    messages:
      - $ref: "#/channels/intake.interview.started/messages/IntakeInterviewStarted"
  sendIntakeInterviewCompleted:
    action: send
    channel:
      $ref: "#/channels/intake.interview.completed"
    messages:
      - $ref: "#/channels/intake.interview.completed/messages/IntakeInterviewCompleted"
  receiveIntakeReviewReminder:
    action: receive
    channel:
      $ref: "#/channels/intake.review_reminder"
    messages:
      - $ref: "#/channels/intake.review_reminder/messages/IntakeReviewReminder"
  receiveIntakeApplicationIncomeCreated:
    action: receive
    channel:
      $ref: "#/channels/intake.application_income.created"
    messages:
      - $ref: "#/channels/intake.application_income.created/messages/IntakeApplicationIncomeCreated"
  receiveIntakeApplicationIncomeUpdated:
    action: receive
    channel:
      $ref: "#/channels/intake.application_income.updated"
    messages:
      - $ref: "#/channels/intake.application_income.updated/messages/IntakeApplicationIncomeUpdated"
components:
  messages:
    IntakeApplicationCreated:
      name: intake.application.created
      summary: A Application was created. Carries the record as created.
      payload:
        $ref: "#/components/schemas/IntakeApplicationCreatedEvent"
    IntakeApplicationUpdated:
      name: intake.application.updated
      summary: A Application was changed. Carries each changed field, before and after.
      payload:
        $ref: "#/components/schemas/IntakeApplicationUpdatedEvent"
    IntakeApplicationDeleted:
      name: intake.application.deleted
      summary: A Application was deleted. The subject is the record's id.
      payload:
        $ref: "#/components/schemas/IntakeApplicationDeletedEvent"
    IntakeIncomeVerificationCreated:
      name: intake.income_verification.created
      summary: A IncomeVerification was created. Carries the record as created.
      payload:
        $ref: "#/components/schemas/IntakeIncomeVerificationCreatedEvent"
    IntakeApplicationIncomeCreated:
      name: intake.application_income.created
      summary: A ApplicationIncome was created. Carries the record as created.
      payload:
        $ref: "#/components/schemas/IntakeApplicationIncomeCreatedEvent"
    IntakeApplicationIncomeUpdated:
      name: intake.application_income.updated
      summary: A ApplicationIncome was changed. Carries each changed field, before and after.
      payload:
        $ref: "#/components/schemas/IntakeApplicationIncomeUpdatedEvent"
    IntakeInterviewCreated:
      name: intake.interview.created
      summary: A Interview was created. Carries the record as created.
      payload:
        $ref: "#/components/schemas/IntakeInterviewCreatedEvent"
    IntakeApplicationMemberCreated:
      name: intake.application_member.created
      summary: A ApplicationMember was created. Carries the record as created.
      payload:
        $ref: "#/components/schemas/IntakeApplicationMemberCreatedEvent"
    IntakeApplicationMemberUpdated:
      name: intake.application_member.updated
      summary: A ApplicationMember was changed. Carries each changed field, before and after.
      payload:
        $ref: "#/components/schemas/IntakeApplicationMemberUpdatedEvent"
    IntakeApplicationMemberDeleted:
      name: intake.application_member.deleted
      summary: A ApplicationMember was deleted. The subject is the record's id.
      payload:
        $ref: "#/components/schemas/IntakeApplicationMemberDeletedEvent"
    IntakeApplicationSubmitted:
      name: intake.application.submitted
      summary: TODO — describe when this event is emitted and who consumes it.
      payload:
        $ref: "#/components/schemas/IntakeApplicationSubmittedEvent"
    IntakeApplicationClosed:
      name: intake.application.closed
      summary: TODO — describe when this event is emitted and who consumes it.
      payload:
        $ref: "#/components/schemas/IntakeApplicationClosedEvent"
    IntakeApplicationWithdrawn:
      name: intake.application.withdrawn
      summary: TODO — describe when this event is emitted and who consumes it.
      payload:
        $ref: "#/components/schemas/IntakeApplicationWithdrawnEvent"
    IntakeApplicationReviewReminder:
      name: intake.application.review-reminder
      summary: Emitted when an application has been awaiting caseworker review for too long.
      payload:
        $ref: "#/components/schemas/IntakeApplicationReviewReminderEvent"
    IntakeReviewReminder:
      name: intake.review_reminder
      summary: |-
        Fires when an application has been awaiting caseworker review for too long. The callback event (intake.review_reminder) triggers an escalation notice.
         Sent by the timer service when the timer fires; the subject is the record the timer is for.
      payload:
        $ref: "#/components/schemas/IntakeReviewReminderEvent"
    IntakeInterviewStarted:
      name: intake.interview.started
      summary: The interview started.
      payload:
        $ref: "#/components/schemas/IntakeInterviewStartedEvent"
    IntakeInterviewCompleted:
      name: intake.interview.completed
      summary: The interview finished.
      payload:
        $ref: "#/components/schemas/IntakeInterviewCompletedEvent"
  schemas:
    IntakeApplicationCreatedEvent:
      allOf:
        - $ref: ../../base/schemas/events.yaml#/$defs/Event
        - type: object
          properties:
            type:
              type: string
              const: intake.application.created
            data:
              $ref: ./intake-openapi.yaml#/components/schemas/Application
    IntakeApplicationUpdatedEvent:
      allOf:
        - $ref: ../../base/schemas/events.yaml#/$defs/Event
        - type: object
          properties:
            type:
              type: string
              const: intake.application.updated
            data:
              $ref: ../../base/schemas/events.yaml#/ResourceUpdatedEvent
    IntakeApplicationDeletedEvent:
      allOf:
        - $ref: ../../base/schemas/events.yaml#/$defs/Event
        - type: object
          properties:
            type:
              type: string
              const: intake.application.deleted
            data:
              $ref: ../../base/schemas/events.yaml#/ResourceDeletedEvent
    IntakeIncomeVerificationCreatedEvent:
      allOf:
        - $ref: ../../base/schemas/events.yaml#/$defs/Event
        - type: object
          properties:
            type:
              type: string
              const: intake.income_verification.created
            data:
              $ref: ./intake-openapi.yaml#/components/schemas/IncomeVerification
    IntakeApplicationIncomeCreatedEvent:
      allOf:
        - $ref: ../../base/schemas/events.yaml#/$defs/Event
        - type: object
          properties:
            type:
              type: string
              const: intake.application_income.created
            data:
              $ref: ./intake-openapi.yaml#/components/schemas/ApplicationIncome
    IntakeApplicationIncomeUpdatedEvent:
      allOf:
        - $ref: ../../base/schemas/events.yaml#/$defs/Event
        - type: object
          properties:
            type:
              type: string
              const: intake.application_income.updated
            data:
              $ref: ../../base/schemas/events.yaml#/ResourceUpdatedEvent
    IntakeInterviewCreatedEvent:
      allOf:
        - $ref: ../../base/schemas/events.yaml#/$defs/Event
        - type: object
          properties:
            type:
              type: string
              const: intake.interview.created
            data:
              $ref: ./intake-openapi.yaml#/components/schemas/Interview
    IntakeApplicationMemberCreatedEvent:
      allOf:
        - $ref: ../../base/schemas/events.yaml#/$defs/Event
        - type: object
          properties:
            type:
              type: string
              const: intake.application_member.created
            data:
              $ref: ./intake-openapi.yaml#/components/schemas/ApplicationMember
    IntakeApplicationMemberUpdatedEvent:
      allOf:
        - $ref: ../../base/schemas/events.yaml#/$defs/Event
        - type: object
          properties:
            type:
              type: string
              const: intake.application_member.updated
            data:
              $ref: ../../base/schemas/events.yaml#/ResourceUpdatedEvent
    IntakeApplicationMemberDeletedEvent:
      allOf:
        - $ref: ../../base/schemas/events.yaml#/$defs/Event
        - type: object
          properties:
            type:
              type: string
              const: intake.application_member.deleted
            data:
              $ref: ../../base/schemas/events.yaml#/ResourceDeletedEvent
    IntakeApplicationSubmittedEvent:
      allOf:
        - $ref: ../../base/schemas/events.yaml#/$defs/Event
        - type: object
          properties:
            type:
              type: string
              const: intake.application.submitted
            data:
              type: object
              required:
                - programsAppliedFor
              additionalProperties: false
              properties:
                programsAppliedFor:
                  type: array
                  items:
                    type: string
                  description: The programs the household applied for, which eligibility screens.
    IntakeApplicationClosedEvent:
      allOf:
        - $ref: ../../base/schemas/events.yaml#/$defs/Event
        - type: object
          properties:
            type:
              type: string
              const: intake.application.closed
    IntakeApplicationWithdrawnEvent:
      allOf:
        - $ref: ../../base/schemas/events.yaml#/$defs/Event
        - type: object
          properties:
            type:
              type: string
              const: intake.application.withdrawn
    IntakeApplicationReviewReminderEvent:
      allOf:
        - $ref: ../../base/schemas/events.yaml#/$defs/Event
        - type: object
          properties:
            type:
              type: string
              const: intake.application.review-reminder
    IntakeReviewReminderEvent:
      allOf:
        - $ref: ../../base/schemas/events.yaml#/$defs/Event
        - type: object
          properties:
            type:
              type: string
              const: intake.review_reminder
            data:
              $ref: ../../base/schemas/events.yaml#/TimerCallbackEvent
    IntakeInterviewStartedEvent:
      allOf:
        - $ref: ../../base/schemas/events.yaml#/$defs/Event
        - type: object
          properties:
            type:
              type: string
              const: intake.interview.started
    IntakeInterviewCompletedEvent:
      allOf:
        - $ref: ../../base/schemas/events.yaml#/$defs/Event
        - type: object
          properties:
            type:
              type: string
              const: intake.interview.completed
