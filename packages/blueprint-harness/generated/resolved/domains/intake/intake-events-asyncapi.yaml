              source: earned
              amount: 300
              frequency: weekly
              amountVaries: true
              createdAt: "2026-02-01T09:00:00Z"
              updatedAt: "2026-02-01T09:00:00Z"
    IntakeApplicationIncomeUpdated:
      name: intake.application_income.updated
