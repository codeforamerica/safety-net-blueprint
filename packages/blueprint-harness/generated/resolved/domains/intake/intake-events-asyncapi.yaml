            type: intake.income_verification.created
            subject: 77777777-7777-4777-8777-777777777771
            time: "2024-01-01T00:00:00Z"
            datacontenttype: application/json
            data:
              id: 77777777-7777-4777-8777-777777777771
              applicationId: 66666666-6666-4666-8666-666666666666
              kind: wage_record
              memberId: client
              period: 2026-Q3
              amount: 5400
              createdAt: "2026-10-02T09:00:00Z"
              updatedAt: "2026-10-02T09:00:00Z"
    IntakeApplicationIncomeCreated:
      name: intake.application_income.created
