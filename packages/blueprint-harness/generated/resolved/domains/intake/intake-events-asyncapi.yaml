            type: intake.application_income.updated
            subject: 11111111-1111-4111-8111-200000000001
            time: "2024-01-01T00:00:00Z"
            datacontenttype: application/json
            data:
              changes:
                - field: source
                  before: earned
                  after: self_employment
    IntakeInterviewCreated:
      name: intake.interview.created
      summary: A Interview was created. Carries the record as created.
      payload:
