            time: "2024-01-01T00:00:00Z"
            datacontenttype: application/json
    IntakeApplicationReviewReminder:
      name: intake.application.review_reminder
      summary: |-
        Fires when an application has been awaiting caseworker review for too long. The callback event (intake.application.review_reminder) triggers an escalation notice.
         Published by the timer service when the timer fires; the subject is the record the timer is for.
      payload:
        schemaFormat: application/vnd.oai.openapi;version=3.1.0
        schema:
          $ref: "#/components/schemas/IntakeApplicationReviewReminderEvent"
      examples:
        - name: Example
