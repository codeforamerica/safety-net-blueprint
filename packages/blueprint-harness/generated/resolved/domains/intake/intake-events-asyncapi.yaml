            id: 00000000-0000-4000-8000-000000000000
            source: /intake
            type: intake.application.submitted
            subject: 11111111-1111-4111-8111-111111111111
            time: "2024-01-01T00:00:00Z"
            datacontenttype: application/json
            data:
              programsAppliedFor:
                - snap
    IntakeApplicationClosed:
      name: intake.application.closed
      summary: Published when a caseworker closes an application once intake processing is complete.
      payload:
        schemaFormat: application/vnd.oai.openapi;version=3.1.0
        schema:
          $ref: "#/components/schemas/IntakeApplicationClosedEvent"
      examples:
