openapi: 3.1.0
info:
  title: Intake API
  version: 1.0.0
  x-domain: intake
  x-status: stable
  x-visibility: public
x-events:
  application.created:
    type: org.codeforamerica.safety-net-blueprint.intake.application.created
    summary: Emitted when an application is created.
  application.updated:
    type: org.codeforamerica.safety-net-blueprint.intake.application.updated
    summary: Emitted when an application is updated via PATCH.
  application.deleted:
    type: org.codeforamerica.safety-net-blueprint.intake.application.deleted
    summary: Emitted when an application is deleted.
  applicationMember.created:
    type: org.codeforamerica.safety-net-blueprint.intake.application-member.created
    summary: Emitted when a household member is added to an application.
  applicationMember.updated:
    type: org.codeforamerica.safety-net-blueprint.intake.application-member.updated
    summary: Emitted when a household member is updated via PATCH.
  applicationMember.deleted:
    type: org.codeforamerica.safety-net-blueprint.intake.application-member.deleted
    summary: Emitted when a household member is removed from an application.
  intake.application.submitted:
    type: org.codeforamerica.safety-net-blueprint.intake.application.submitted
    summary: Emitted when an applicant formally submits an application, starting the regulatory processing clock.
  intake.application.withdrawn:
    type: org.codeforamerica.safety-net-blueprint.intake.application.withdrawn
    summary: Emitted when a household withdraws their application.
  intake.application.closed:
    type: org.codeforamerica.safety-net-blueprint.intake.application.closed
    summary: Emitted when intake is complete and the application is closed.
paths:
  /applications:
    get:
      summary: List applications
      operationId: listApplications
      tags:
        - Applications
      parameters:
        - $ref: ../../base/components/parameters.yaml#/SearchQueryParam
        - $ref: ../../base/components/parameters.yaml#/LimitParam
        - $ref: ../../base/components/parameters.yaml#/OffsetParam
        - $ref: ../../base/components/parameters.yaml#/SortParam
        - name: status
          in: query
          schema:
            type: string
          description: Filter by application status.
        - name: channel
          in: query
          schema:
            type: string
          description: Filter by submission channel.
      responses:
        "200":
          description: A paginated list of applications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationList"
        "400":
          $ref: ../../common/components/responses.yaml#/BadRequest
        "500":
          $ref: ../../common/components/responses.yaml#/InternalError
    post:
      summary: Create an application
      operationId: createApplication
      tags:
        - Applications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationCreate"
      responses:
        "201":
          description: Application created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: ../../common/components/responses.yaml#/BadRequest
        "422":
          $ref: ../../common/components/responses.yaml#/UnprocessableEntity
        "500":
          $ref: ../../common/components/responses.yaml#/InternalError
  /applications/{applicationId}:
    parameters:
      - $ref: "#/components/parameters/ApplicationIdParam"
    get:
      summary: Get an application
      operationId: getApplication
      tags:
        - Applications
      responses:
        "200":
          description: Application retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "404":
          $ref: ../../common/components/responses.yaml#/NotFound
        "500":
          $ref: ../../common/components/responses.yaml#/InternalError
    patch:
      summary: Update an application
      operationId: updateApplication
      tags:
        - Applications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationUpdate"
      responses:
        "200":
          description: Application updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: ../../common/components/responses.yaml#/BadRequest
        "404":
          $ref: ../../common/components/responses.yaml#/NotFound
        "422":
          $ref: ../../common/components/responses.yaml#/UnprocessableEntity
        "500":
          $ref: ../../common/components/responses.yaml#/InternalError
    delete:
      summary: Delete a draft application
      operationId: deleteApplication
      tags:
        - Applications
      responses:
        "204":
          description: Application deleted successfully.
        "404":
          $ref: ../../common/components/responses.yaml#/NotFound
        "500":
          $ref: ../../common/components/responses.yaml#/InternalError
  /applications/{applicationId}/members:
    parameters:
      - $ref: "#/components/parameters/ApplicationIdParam"
    get:
      summary: List household members
      operationId: listApplicationMembers
      tags:
        - Household Members
      parameters:
        - $ref: ../../base/components/parameters.yaml#/SearchQueryParam
        - $ref: ../../base/components/parameters.yaml#/LimitParam
        - $ref: ../../base/components/parameters.yaml#/OffsetParam
        - $ref: ../../base/components/parameters.yaml#/SortParam
      responses:
        "200":
          description: Household members for this application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationMemberList"
        "404":
          $ref: ../../common/components/responses.yaml#/NotFound
        "500":
          $ref: ../../common/components/responses.yaml#/InternalError
    post:
      summary: Add a household member
      operationId: createApplicationMember
      tags:
        - Household Members
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationMemberCreate"
      responses:
        "201":
          description: Household member added successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationMember"
        "400":
          $ref: ../../common/components/responses.yaml#/BadRequest
        "404":
          $ref: ../../common/components/responses.yaml#/NotFound
        "422":
          $ref: ../../common/components/responses.yaml#/UnprocessableEntity
        "500":
          $ref: ../../common/components/responses.yaml#/InternalError
  /applications/{applicationId}/members/{memberId}:
    parameters:
      - $ref: "#/components/parameters/ApplicationIdParam"
      - $ref: "#/components/parameters/MemberIdParam"
    get:
      summary: Get a household member
      operationId: getApplicationMember
      tags:
        - Household Members
      responses:
        "200":
          description: Household member retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationMember"
        "404":
          $ref: ../../common/components/responses.yaml#/NotFound
        "500":
          $ref: ../../common/components/responses.yaml#/InternalError
    patch:
      summary: Update a household member
      operationId: updateApplicationMember
      tags:
        - Household Members
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationMemberUpdate"
      responses:
        "200":
          description: Household member updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationMember"
        "400":
          $ref: ../../common/components/responses.yaml#/BadRequest
        "404":
          $ref: ../../common/components/responses.yaml#/NotFound
        "422":
          $ref: ../../common/components/responses.yaml#/UnprocessableEntity
        "500":
          $ref: ../../common/components/responses.yaml#/InternalError
    delete:
      summary: Remove a household member
      operationId: deleteApplicationMember
      tags:
        - Household Members
      responses:
        "204":
          description: Household member removed successfully.
        "404":
          $ref: ../../common/components/responses.yaml#/NotFound
        "500":
          $ref: ../../common/components/responses.yaml#/InternalError
  /applications/{applicationId}/submit:
    parameters:
      - name: applicationId
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Submit application
      description: Formally submits a draft application, starting the regulatory processing clock.
      operationId: submitApplication
      responses:
        "200":
          description: Transition applied successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: ../../base/components/responses.yaml#/BadRequest
        "404":
          $ref: ../../base/components/responses.yaml#/NotFound
        "409":
          $ref: ../../base/components/responses.yaml#/Conflict
        "500":
          $ref: ../../base/components/responses.yaml#/InternalError
      tags:
        - Applications
      x-relationship:
        type: state-machine-action
        domain: intake
        id: submit
  /applications/{applicationId}/open:
    parameters:
      - name: applicationId
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Open application
      description: Moves a submitted application into active caseworker review.
      operationId: openApplication
      responses:
        "200":
          description: Transition applied successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: ../../base/components/responses.yaml#/BadRequest
        "404":
          $ref: ../../base/components/responses.yaml#/NotFound
        "409":
          $ref: ../../base/components/responses.yaml#/Conflict
        "500":
          $ref: ../../base/components/responses.yaml#/InternalError
      tags:
        - Applications
      x-relationship:
        type: state-machine-action
        domain: intake
        id: open
  /applications/{applicationId}/close:
    parameters:
      - name: applicationId
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Close application
      description: Closes the application once intake processing is complete.
      operationId: closeApplication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseRequest"
      responses:
        "200":
          description: Transition applied successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: ../../base/components/responses.yaml#/BadRequest
        "404":
          $ref: ../../base/components/responses.yaml#/NotFound
        "409":
          $ref: ../../base/components/responses.yaml#/Conflict
        "500":
          $ref: ../../base/components/responses.yaml#/InternalError
      tags:
        - Applications
      x-relationship:
        type: state-machine-action
        domain: intake
        id: close
  /applications/{applicationId}/withdraw:
    parameters:
      - name: applicationId
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Withdraw application
      description: Withdraws the application at the household's request.
      operationId: withdrawApplication
      responses:
        "200":
          description: Transition applied successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: ../../base/components/responses.yaml#/BadRequest
        "404":
          $ref: ../../base/components/responses.yaml#/NotFound
        "409":
          $ref: ../../base/components/responses.yaml#/Conflict
        "500":
          $ref: ../../base/components/responses.yaml#/InternalError
      tags:
        - Applications
      x-relationship:
        type: state-machine-action
        domain: intake
        id: withdraw
  /applications/{applicationId}/summary:
    parameters:
      - $ref: "#/components/parameters/ApplicationIdParam"
    get:
      summary: Get applicationSummary
      operationId: getApplicationSummary
      responses:
        "200":
          description: applicationSummary retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationSummaryResponse"
        "404":
          $ref: ../../base/components/responses.yaml#/NotFound
        "500":
          $ref: ../../base/components/responses.yaml#/InternalError
      tags:
        - Applications
      x-relationship:
        type: composition
        domain: domains/intake/intake
        id: applicationSummary
  /applications/{applicationId}/review:
    parameters:
      - $ref: "#/components/parameters/ApplicationIdParam"
    get:
      summary: Get applicationReview
      operationId: getApplicationReview
      responses:
        "200":
          description: applicationReview retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationReviewResponse"
        "404":
          $ref: ../../base/components/responses.yaml#/NotFound
        "500":
          $ref: ../../base/components/responses.yaml#/InternalError
      tags:
        - Applications
      x-relationship:
        type: composition
        domain: domains/intake/intake
        id: applicationReview
  /applications/{applicationId}/review/demographics:
    parameters:
      - $ref: "#/components/parameters/ApplicationIdParam"
    get:
      summary: Get applicationReview demographics section panel
      operationId: getApplicationReviewDemographicsSection
      parameters:
        - $ref: ../../base/components/parameters.yaml#/SearchQueryParam
        - $ref: ../../base/components/parameters.yaml#/LimitParam
        - $ref: ../../base/components/parameters.yaml#/OffsetParam
        - $ref: ../../base/components/parameters.yaml#/SortParam
      responses:
        "200":
          description: applicationReview demographics section panel retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationReviewSectionResponse"
        "404":
          $ref: ../../base/components/responses.yaml#/NotFound
        "500":
          $ref: ../../base/components/responses.yaml#/InternalError
  /applications/{applicationId}/review/contact:
    parameters:
      - $ref: "#/components/parameters/ApplicationIdParam"
    get:
      summary: Get applicationReview contact section panel
      operationId: getApplicationReviewContactSection
      parameters:
        - $ref: ../../base/components/parameters.yaml#/SearchQueryParam
        - $ref: ../../base/components/parameters.yaml#/LimitParam
        - $ref: ../../base/components/parameters.yaml#/OffsetParam
        - $ref: ../../base/components/parameters.yaml#/SortParam
      responses:
        "200":
          description: applicationReview contact section panel retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationReviewSectionResponse"
        "404":
          $ref: ../../base/components/responses.yaml#/NotFound
        "500":
          $ref: ../../base/components/responses.yaml#/InternalError
  /applications/{applicationId}/review-progress/{section}:
    parameters:
      - $ref: "#/components/parameters/ApplicationIdParam"
      - name: section
        in: path
        required: true
        schema:
          type: string
        description: Section name within the sectionView composition.
    get:
      summary: List ReviewProgress state records for a section
      operationId: listReviewProgressBySection
      parameters:
        - $ref: ../../base/components/parameters.yaml#/SearchQueryParam
        - $ref: ../../base/components/parameters.yaml#/LimitParam
        - $ref: ../../base/components/parameters.yaml#/OffsetParam
        - $ref: ../../base/components/parameters.yaml#/SortParam
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewProgressListResponse"
        "404":
          $ref: ../../base/components/responses.yaml#/NotFound
        "500":
          $ref: ../../base/components/responses.yaml#/InternalError
    put:
      summary: Replace ReviewProgress state for a section
      operationId: replaceReviewProgressBySection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewProgressWritable"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewProgress"
        "400":
          $ref: ../../base/components/responses.yaml#/BadRequest
        "404":
          $ref: ../../base/components/responses.yaml#/NotFound
        "422":
          $ref: ../../base/components/responses.yaml#/UnprocessableEntity
        "500":
          $ref: ../../base/components/responses.yaml#/InternalError
    patch:
      summary: Update ReviewProgress state for a section
      operationId: updateReviewProgressBySection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewProgressWritable"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewProgress"
        "400":
          $ref: ../../base/components/responses.yaml#/BadRequest
        "404":
          $ref: ../../base/components/responses.yaml#/NotFound
        "422":
          $ref: ../../base/components/responses.yaml#/UnprocessableEntity
        "500":
          $ref: ../../base/components/responses.yaml#/InternalError
  /applications/{applicationId}/review-progress/{section}/{itemId}:
    parameters:
      - $ref: "#/components/parameters/ApplicationIdParam"
      - name: section
        in: path
        required: true
        schema:
          type: string
        description: Section name within the sectionView composition.
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Item identifier for collection-backed sections.
    get:
      summary: Get ReviewProgress state for a collection item
      operationId: getReviewProgressByItem
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewProgress"
        "404":
          $ref: ../../base/components/responses.yaml#/NotFound
        "500":
          $ref: ../../base/components/responses.yaml#/InternalError
    put:
      summary: Replace ReviewProgress state for a collection item
      operationId: replaceReviewProgressByItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewProgressWritable"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewProgress"
        "400":
          $ref: ../../base/components/responses.yaml#/BadRequest
        "404":
          $ref: ../../base/components/responses.yaml#/NotFound
        "422":
          $ref: ../../base/components/responses.yaml#/UnprocessableEntity
        "500":
          $ref: ../../base/components/responses.yaml#/InternalError
    patch:
      summary: Update ReviewProgress state for a collection item
      operationId: updateReviewProgressByItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewProgressWritable"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewProgress"
        "400":
          $ref: ../../base/components/responses.yaml#/BadRequest
        "404":
          $ref: ../../base/components/responses.yaml#/NotFound
        "422":
          $ref: ../../base/components/responses.yaml#/UnprocessableEntity
        "500":
          $ref: ../../base/components/responses.yaml#/InternalError
  /applications/{applicationId}/evaluate-interview-prompts:
    parameters:
      - $ref: "#/components/parameters/ApplicationIdParam"
    post:
      summary: Evaluate interviewPrompts
      operationId: evaluateInterviewPrompts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterviewPromptsRequest"
      responses:
        "200":
          description: interviewPrompts evaluation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewPromptsResponse"
        "400":
          $ref: ../../base/components/responses.yaml#/BadRequest
        "500":
          $ref: ../../base/components/responses.yaml#/InternalError
      tags:
        - Applications
      x-relationship:
        type: ruleset
        domain: intake
        id: interviewPrompts
components:
  parameters:
    ApplicationIdParam:
      name: applicationId
      in: path
      required: true
      description: Unique identifier of the application.
      schema:
        type: string
        format: uuid
      example: 00000000-0000-0000-0000-000000000001
    MemberIdParam:
      name: memberId
      in: path
      required: true
      description: Unique identifier of the household member.
      schema:
        type: string
        format: uuid
      example: 00000000-0000-0000-0000-000000000010
  schemas:
    ApplicationWritable:
      type: object
      properties:
        programsApplied:
          type: array
          items:
            type: string
            enum:
              - snap
              - medicaid
              - chip
              - tanf
          description: Benefit programs the household is applying for.
        channel:
          type: string
          enum:
            - online
            - phone
            - in_person
            - mail
          description: Channel through which the application was submitted.
        address:
          $ref: ../../common/schemas/shared.yaml#/$defs/Address
        contactInfo:
          $ref: ../../common/schemas/shared.yaml#/$defs/ContactInfo
        labels:
          type: object
          additionalProperties:
            type: string
          description: |
            Arbitrary key-value labels for state-specific tagging, routing, and reporting. States may use these to attach jurisdiction-specific metadata without modifying the core schema.
        countyCode:
          type: string
          maxLength: 10
          description: County code for routing this application to the correct local office.
    Application:
      description: A benefit application record, including server-managed fields.
      unevaluatedProperties: false
      required:
        - id
        - status
        - programsApplied
        - referenceId
        - createdAt
        - updatedAt
      allOf:
        - $ref: "#/components/schemas/ApplicationWritable"
        - type: object
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
              description: Unique identifier (server-generated).
            referenceId:
              type: string
              readOnly: true
              x-derived: $this.id.substring(0, 8).toUpperCase()
              description: Short human-readable reference code for this application.
            confirmationNumber:
              type: string
              readOnly: true
              deprecated: true
              description: |
                Deprecated — use referenceId instead. Legacy confirmation number assigned by older case management systems. Retained for backward compatibility during state migration periods.
            status:
              type: string
              readOnly: true
              description: Current lifecycle status of the application.
              enum:
                - draft
                - submitted
                - under_review
                - withdrawn
                - closed
            submittedAt:
              type: string
              format: date-time
              nullable: true
              readOnly: true
              description: Timestamp when the application was formally submitted. Null until submitted.
            openedAt:
              type: string
              format: date-time
              nullable: true
              readOnly: true
              description: Timestamp when a caseworker began active review. Null until the application is opened.
            slaTypeCode:
              type: string
              readOnly: true
              description: SLA type governing the processing deadline for this application.
              enum:
                - snap_standard
                - medicaid_standard
            members:
              type: array
              items:
                $ref: "#/components/schemas/ApplicationMember"
              description: Household members on this application.
            createdAt:
              type: string
              format: date-time
              readOnly: true
              description: Timestamp when the application was created.
            updatedAt:
              type: string
              format: date-time
              readOnly: true
              description: Timestamp when the application was last updated.
        - type: object
          properties:
            _links:
              type: object
              readOnly: true
              description: Generated composition links.
              properties:
                applicationSummary:
                  type: object
                  description: Link to the applicationSummary composition.
                  properties:
                    href:
                      type: string
                      format: uri-reference
                      readOnly: true
        - type: object
          properties:
            _links:
              type: object
              readOnly: true
              description: Generated composition links.
              properties:
                applicationReview:
                  type: object
                  description: Link to the applicationReview composition.
                  properties:
                    href:
                      type: string
                      format: uri-reference
                      readOnly: true
    ApplicationCreate:
      allOf:
        - $ref: "#/components/schemas/ApplicationWritable"
        - type: object
          required:
            - programsApplied
            - channel
    ApplicationUpdate:
      allOf:
        - $ref: "#/components/schemas/ApplicationWritable"
        - type: object
          minProperties: 1
    ApplicationList:
      type: object
      additionalProperties: false
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Application"
        total:
          type: integer
          minimum: 0
          description: Total number of matching applications.
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: Maximum number of applications per page.
        offset:
          type: integer
          minimum: 0
          description: Number of applications skipped.
        hasNext:
          type: boolean
          description: Whether more applications are available.
    ApplicationMemberWritable:
      type: object
      properties:
        firstName:
          type: string
          description: Member's first name.
        lastName:
          type: string
          description: Member's last name.
        dateOfBirth:
          type: string
          format: date
          description: Member's date of birth (YYYY-MM-DD).
        relationship:
          type: string
          enum:
            - self
            - spouse
            - child
            - parent
            - sibling
            - other
          description: Relationship of this member to the primary applicant.
        incomeSource:
          $ref: ./intake-schemas.yaml#/$defs/IncomeSource
        notificationPreference:
          description: How this member prefers to receive benefit notices and updates.
          oneOf:
            - $ref: "#/components/schemas/EmailNotification"
            - $ref: "#/components/schemas/SmsNotification"
            - $ref: "#/components/schemas/MailNotification"
          discriminator:
            propertyName: channel
        verificationEvidence:
          description: |
            Identity verification evidence for this member. Accepts anyOf: an electronic data match result, a manual caseworker review record, or both.
          anyOf:
            - $ref: "#/components/schemas/ElectronicVerification"
            - $ref: "#/components/schemas/ManualVerification"
    ApplicationMember:
      description: A household member on a benefit application.
      unevaluatedProperties: false
      required:
        - id
        - applicationId
        - firstName
        - lastName
        - relationship
        - createdAt
        - updatedAt
      allOf:
        - $ref: "#/components/schemas/ApplicationMemberWritable"
        - type: object
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
              description: Unique identifier (server-generated).
            applicationId:
              type: string
              format: uuid
              description: The application this member belongs to.
              x-relationship:
                type: fk
                resource: Application
                style: links-only
            createdAt:
              type: string
              format: date-time
              readOnly: true
              description: Timestamp when the member was added.
            updatedAt:
              type: string
              format: date-time
              readOnly: true
              description: Timestamp when the member was last updated.
            links:
              type: object
              readOnly: true
              description: Related resource links.
              properties:
                application:
                  type: string
                  format: uri-reference
                  description: Link to the related Application resource.
    ApplicationMemberCreate:
      allOf:
        - $ref: "#/components/schemas/ApplicationMemberWritable"
        - type: object
          required:
            - firstName
            - lastName
            - relationship
    ApplicationMemberUpdate:
      allOf:
        - $ref: "#/components/schemas/ApplicationMemberWritable"
        - type: object
          minProperties: 1
    ApplicationMemberList:
      type: object
      additionalProperties: false
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApplicationMember"
        total:
          type: integer
          minimum: 0
          description: Total number of matching household members.
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: Maximum number of household members per page.
        offset:
          type: integer
          minimum: 0
          description: Number of household members skipped.
        hasNext:
          type: boolean
          description: Whether more household members are available.
    EmailNotification:
      type: object
      required:
        - channel
        - address
      properties:
        channel:
          type: string
          enum:
            - email
        address:
          type: string
          format: email
          description: Email address for benefit notices.
    ElectronicVerification:
      type: object
      required:
        - source
        - matchCode
        - verifiedAt
      properties:
        source:
          type: string
          description: Data source used for the electronic match (e.g., SSA, IRS-IEVS).
        matchCode:
          type: string
          description: Result code returned by the data source.
        verifiedAt:
          type: string
          format: date-time
          description: Timestamp when the electronic verification was completed.
    MailNotification:
      type: object
      required:
        - channel
        - address
      properties:
        channel:
          type: string
          enum:
            - mail
        address:
          $ref: ../../common/schemas/shared.yaml#/$defs/Address
    ManualVerification:
      type: object
      required:
        - verifiedBy
        - verifiedAt
      properties:
        verifiedBy:
          type: string
          description: ID of the caseworker who performed the manual verification.
        verifiedAt:
          type: string
          format: date-time
          description: Timestamp when the manual verification was completed.
        notes:
          type: string
          description: Optional caseworker notes on the verification outcome.
    SmsNotification:
      type: object
      required:
        - channel
        - phone
      properties:
        channel:
          type: string
          enum:
            - sms
        phone:
          type: string
          description: Phone number for SMS benefit notices (E.164 format).
    CloseRequest:
      type: object
      required:
        - outcome
      properties:
        outcome:
          type: string
          enum:
            - approved
            - denied
          description: Whether the application was approved or denied at close.
        notes:
          type: string
          description: Optional caseworker notes on the closure decision.
    ApplicationSummaryResponse:
      type: object
      description: Generated composition response for applicationSummary.
    ApplicationReviewResponse:
      type: object
      description: Generated composition response for applicationReview.
    ApplicationReviewSectionResponse:
      type: object
      description: Generated section panel response for applicationReview.
    ApplicationReviewSections:
      type: string
      description: Valid section names for the applicationReview sectionView.
      enum:
        - demographics
        - contact
      x-generated: section-enum
    ReviewProgressWritable:
      type: object
      description: Client-writable fields for the reviewProgress state resource. Framework fields (id, section, itemId, createdAt, updatedAt) are added automatically.
      properties:
        status:
          type: string
          description: Caseworker review status for this section.
          enum:
            - not_started
            - in_progress
            - complete
            - flagged
          default: not_started
    ReviewProgress:
      type: object
      description: Generated state resource for reviewProgress.
      allOf:
        - $ref: "#/components/schemas/ReviewProgressWritable"
        - type: object
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
            section:
              type: string
              readOnly: true
            itemId:
              type: string
              format: uuid
              nullable: true
              readOnly: true
              x-relationship:
                resource: Polymorphic
            createdAt:
              type: string
              format: date-time
              readOnly: true
            updatedAt:
              type: string
              format: date-time
              readOnly: true
          required:
            - id
            - section
            - createdAt
            - updatedAt
    ReviewProgressListResponse:
      type: object
      description: Paginated list of reviewProgress state records.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReviewProgress"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        hasNext:
          type: boolean
      required:
        - items
        - total
        - limit
        - offset
        - hasNext
    InterviewPromptsRequest:
      type: object
      description: Input data for interviewPrompts evaluation. All fields are optional — partial inputs trigger partial evaluation.
      properties:
        household:
          type: object
          description: Household composition and financial circumstances.
          properties:
            monthlyIncome:
              type: number
              description: Total monthly gross income reported by the household.
            monthlyExpenses:
              type: number
              description: Total monthly expenses reported by the household.
            members:
              type: array
              description: All individuals in the household.
              items:
                type: object
                properties:
                  age:
                    type: integer
                    description: Member's age in years.
                  isEmployed:
                    type: boolean
                    description: Whether the member is currently employed.
                  isStudent:
                    type: boolean
                    description: Whether the member is enrolled at least half-time in higher education.
                  isNonCitizen:
                    type: boolean
                    description: Whether the member is a non-citizen subject to immigration screening.
        application:
          type: object
          description: Application-level context relevant to the interview.
          properties:
            hasChangedCircumstances:
              type: boolean
              description: Whether the household reported changes since the application was submitted.
    InterviewPromptsResponse:
      allOf:
        - $ref: ../../base/schemas/rules-evaluation.yaml#/EvaluationResult
      description: Evaluation result for interviewPrompts.
