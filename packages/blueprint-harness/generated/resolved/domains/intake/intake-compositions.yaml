$schema: compositions-schema.yaml
version: "1.0"
domain: intake
compositions:
  applicationSummary:
    resource: Application
    fields:
      - id
      - status
      - programsAppliedFor
      - channel
      - submittedAt
    endpoint:
      path: /applications/{applicationId}/summary
      parentLink: true
    include:
      members:
        resource: ApplicationMember
        bind: applicationId
        fields:
          - id
          - firstName
          - lastName
          - dateOfBirth
          - relationship
          - incomeSource
  interviewFlagsInputs:
    resource: Application
    fields:
      - interviewDate as asOf
      - previousHousehold as previous
      - programsAppliedFor
    endpoint:
      path: /applications/{applicationId}/interview-flags-inputs
    include:
      verified:
        resource: IncomeVerification
        bind: applicationId
        fields:
          - kind
          - memberId
          - incomeId
          - period
          - amount
          - frequency
      incomes:
        resource: ApplicationIncome
        bind: applicationId
        fields:
          - id
          - memberId
          - source
          - amount
          - frequency
          - paidInCash
          - amountVaries
  applicationReview:
    compositeType: sectionView
    resource: Application
    fields:
      - programsAppliedFor
      - status
    include:
      members:
        resource: ApplicationMember
        bind: applicationId
        fields:
          - id
          - firstName
          - lastName
    endpoint:
      path: /applications/{applicationId}/review
      parentLink: true
    sections:
      demographics:
        resource: ApplicationMember
        bind: applicationId
        links: true
        index:
          fields:
            - id
            - firstName
            - lastName
            - dateOfBirth
      contact:
        resource: Application
        fields:
          - contactInfo
    state:
      schema:
        name: ReviewProgress
        type: object
        additionalProperties: false
        properties:
          status:
            type: string
            description: Caseworker review status for this section.
            enum:
              - not_started
              - in_progress
              - complete
              - flagged
            default: not_started
  applicationDetails:
    compositeType: editable
    resource: Application
    include:
      members:
        resource: ApplicationMember
        bind: applicationId
      incomes:
        resource: ApplicationIncome
        bind: applicationId
    endpoint:
      path: /applications/{applicationId}/details
      parentLink: true
