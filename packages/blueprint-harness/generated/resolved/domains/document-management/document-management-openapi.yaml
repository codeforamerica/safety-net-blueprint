openapi: 3.1.0
info:
  title: Document Management API
  version: 1.0.0
  description: Uploading documents and reading back what was stored about them.
  x-domain: document-management
servers:
  - url: http://localhost:1080/document-management
    description: Local development server
tags:
  - name: Documents
    description: Uploaded documents.
paths:
  /documents:
    get:
      operationId: listDocuments
      x-sortable:
        fields:
          - uploadedAt
          - title
          - sizeBytes
          - documentTypeId
        default: "-uploadedAt"
      tags:
        - Documents
      summary: List documents
      parameters:
        - $ref: ../../base/components/parameters.yaml#/SearchQueryParam
        - $ref: ../../base/components/parameters.yaml#/LimitParam
        - $ref: ../../base/components/parameters.yaml#/OffsetParam
        - $ref: ../../base/components/parameters.yaml#/SortParam
      responses:
        "200":
          description: A page of documents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentList"
    post:
      operationId: uploadDocument
      tags:
        - Documents
      summary: Upload a document
      description: |
        A `multipart/form-data` request carrying the file itself. The response describes what was stored — name, type, size and a content hash — and not the contents, which are never written anywhere.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - documentTypeId
                - title
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to upload.
                documentTypeId:
                  type: string
                  example: proof-of-income
                  description: |
                    What kind of document this is. Required by the upload handler, which classifies before it stores.
                title:
                  type: string
                  example: April pay stub
                  description: A human-readable name for the document.
      responses:
        "201":
          description: The stored description of the upload.
          headers:
            Location:
              description: URL of the newly created document.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "422":
          $ref: ../../common/components/responses.yaml#/UnprocessableEntity
  /documents/{documentId}:
    parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getDocument
      tags:
        - Documents
      summary: Get one document
      responses:
        "200":
          description: The document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "404":
          $ref: ../../common/components/responses.yaml#/NotFound
components:
  schemas:
    DocumentWritable:
      type: object
      required:
        - documentTypeId
        - title
      properties:
        documentTypeId:
          type: string
          description: What kind of document this is.
        title:
          type: string
          description: A human-readable name for the document.
        documentDate:
          type: string
          format: date
          nullable: true
          description: The date the document itself bears, which is not the date it arrived.
    Document:
      allOf:
        - $ref: "#/components/schemas/DocumentWritable"
        - type: object
          required:
            - id
            - lifecycleState
            - latestVersionId
            - createdAt
            - updatedAt
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
            lifecycleState:
              type: string
              enum:
                - active
                - superseded
                - disposed
              readOnly: true
              description: Where this document is in its retention lifecycle.
            legalHold:
              type: boolean
              readOnly: true
              description: Whether disposition is suspended pending litigation.
            latestVersionId:
              type: string
              format: uuid
              readOnly: true
              description: The most recent version, which is what describes the file.
              x-relationship:
                type: fk
                domain: document-management
                resource: DocumentVersion
                style: links-only
            retentionDeadline:
              type: string
              format: date-time
              nullable: true
              readOnly: true
              description: When this document becomes eligible for disposition.
            metadata:
              type: object
              additionalProperties: true
              description: Arbitrary key-value metadata supplied at upload.
            createdAt:
              type: string
              format: date-time
              readOnly: true
            updatedAt:
              type: string
              format: date-time
              readOnly: true
            links:
              type: object
              readOnly: true
              description: Related resource links.
              properties:
                latestVersion:
                  type: string
                  format: uri-reference
                  description: Link to the related DocumentVersion resource.
    DocumentVersion:
      type: object
      required:
        - id
        - documentId
        - versionNumber
        - fileName
        - mimeType
        - sizeBytes
        - contentHash
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        documentId:
          type: string
          format: uuid
          readOnly: true
          x-relationship:
            type: fk
            resource: Document
            style: links-only
        versionNumber:
          type: integer
          readOnly: true
          description: Which upload this was, counting from one.
        fileName:
          type: string
          readOnly: true
          description: The name the file was uploaded under.
        mimeType:
          type: string
          readOnly: true
        sizeBytes:
          type: integer
          readOnly: true
          description: How many bytes were received, before they were discarded.
        contentHash:
          type: string
          readOnly: true
          description: SHA-256 of the bytes, computed while reading them.
        uploadedById:
          type: string
          readOnly: true
          description: Whoever sent it, from the caller identity on the request.
        createdAt:
          type: string
          format: date-time
          readOnly: true
        links:
          type: object
          readOnly: true
          description: Related resource links.
          properties:
            document:
              type: string
              format: uri-reference
              description: Link to the related Document resource.
    DocumentList:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Document"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        hasNext:
          type: boolean
