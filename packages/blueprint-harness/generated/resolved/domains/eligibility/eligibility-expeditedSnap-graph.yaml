$schema: https://blueprint.codeforamerica.org/schemas/graph-schema.yaml
domain: eligibility
ruleset: expeditedSnap
outputs:
  - isExpeditedEligible
inputs:
  $.household.monthlyGrossIncome:
    type: number
    description: Total monthly gross income for all household members (dollars).
  $.household.liquidResources:
    type: number
    description: Total liquid resources (cash, bank accounts) available to the household (dollars).
  $.household.monthlyShelterCost:
    type: number
    description: Monthly shelter cost including rent/mortgage and utilities (dollars).
  $.household.isMigrantFarmworker:
    type: boolean
    description: Whether any household member is a migrant or seasonal farmworker.
  $.policy.incomeThreshold:
    type: number
    description: Monthly gross income threshold for expedited eligibility (7 CFR § 273.2(i)(1)(i)).
    default: 150
  $.policy.resourceThreshold:
    type: number
    description: Liquid resource threshold for expedited eligibility (7 CFR § 273.2(i)(1)(i)).
    default: 100
facts:
  isLowIncome:
    expression: household.monthlyGrossIncome < policy.incomeThreshold
    type: boolean
    description: Monthly gross income is below the expedited income threshold.
  hasLowResources:
    expression: household.liquidResources < policy.resourceThreshold
    type: boolean
    description: Liquid resources are below the expedited resource threshold.
  isCombinedUnderShelter:
    expression: (household.monthlyGrossIncome + household.liquidResources) < household.monthlyShelterCost
    type: boolean
    description: Combined income and liquid resources are less than monthly shelter cost.
  isMigrantWithLowResources:
    expression: household.isMigrantFarmworker && household.liquidResources < policy.resourceThreshold
    type: boolean
    description: Household includes a migrant or seasonal farmworker with low liquid resources.
  isExpeditedEligible:
    expression: (isLowIncome && hasLowResources) || isCombinedUnderShelter || isMigrantWithLowResources
    type: boolean
    description: |
      Household qualifies for expedited processing under any of the three qualifying conditions (7 CFR § 273.2(i)).
dependencies:
  isLowIncome:
    - $.household.monthlyGrossIncome
    - $.policy.incomeThreshold
  hasLowResources:
    - $.household.liquidResources
    - $.policy.resourceThreshold
  isCombinedUnderShelter:
    - $.household.monthlyGrossIncome
    - $.household.liquidResources
    - $.household.monthlyShelterCost
  isMigrantWithLowResources:
    - $.household.liquidResources
    - $.household.isMigrantFarmworker
    - $.policy.resourceThreshold
  isExpeditedEligible:
    - isLowIncome
    - hasLowResources
    - isCombinedUnderShelter
    - isMigrantWithLowResources
