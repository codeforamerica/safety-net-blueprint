$schema: state-machine-schema.yaml
version: "1.0"
domain: eligibility
machines:
  - object: Determination
    states:
      - id: pending
        slaClock: running
        description: Determination initiated; eligibility rules evaluation in progress.
      - id: completed
        slaClock: stopped
        description: Determination complete; program results issued. Terminal.
    initialState: pending
    guards:
      - id: allProgramsResolved
        condition: determination.decisions.all(d, d.status != 'pending')
    emits:
      - id: complete
        description: TODO — describe when this event is emitted and who consumes it.
    actions:
      - id: complete
        description: Marks the determination as complete once all program results are resolved.
        transition:
          from: pending
          to: completed
        guards:
          - conditions:
              - allProgramsResolved
        steps:
          - emit:
              event: complete
              description: Signals that all program eligibility results are ready for caseworker review.
              type: eligibility.determination.complete
    "on":
      - type: intake.application.submitted
        description: Initiate an eligibility determination for each program applied for.
        steps:
          - call:
              POST: eligibility/determinations
              body:
                applicationId: $this.subject
              description: Create a pending determination for the submitted application.
