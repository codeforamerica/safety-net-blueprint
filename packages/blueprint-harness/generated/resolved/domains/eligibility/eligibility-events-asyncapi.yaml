asyncapi: 3.0.0
info:
  title: Eligibility API events
  version: 1.0.0
  x-domain: eligibility
  description: The events eligibility-openapi.yaml and the state machines attached to its resources send, and the events those machines receive. Generated by resolve; not edited by hand.
channels:
  eligibility.determination.created:
    address: eligibility.determination.created
    messages:
      EligibilityDeterminationCreated:
        $ref: "#/components/messages/EligibilityDeterminationCreated"
  eligibility.determination.updated:
    address: eligibility.determination.updated
    messages:
      EligibilityDeterminationUpdated:
        $ref: "#/components/messages/EligibilityDeterminationUpdated"
  eligibility.determination.complete:
    address: eligibility.determination.complete
    messages:
      EligibilityDeterminationComplete:
        $ref: "#/components/messages/EligibilityDeterminationComplete"
  intake.application.submitted:
    $ref: ../intake/intake-events-asyncapi.yaml#/channels/intake.application.submitted
operations:
  sendEligibilityDeterminationCreated:
    action: send
    channel:
      $ref: "#/channels/eligibility.determination.created"
    messages:
      - $ref: "#/channels/eligibility.determination.created/messages/EligibilityDeterminationCreated"
  sendEligibilityDeterminationUpdated:
    action: send
    channel:
      $ref: "#/channels/eligibility.determination.updated"
    messages:
      - $ref: "#/channels/eligibility.determination.updated/messages/EligibilityDeterminationUpdated"
  sendEligibilityDeterminationComplete:
    action: send
    channel:
      $ref: "#/channels/eligibility.determination.complete"
    messages:
      - $ref: "#/channels/eligibility.determination.complete/messages/EligibilityDeterminationComplete"
  receiveIntakeApplicationSubmitted:
    action: receive
    channel:
      $ref: "#/channels/intake.application.submitted"
    messages:
      - $ref: "#/channels/intake.application.submitted/messages/IntakeApplicationSubmitted"
components:
  messages:
    EligibilityDeterminationCreated:
      name: eligibility.determination.created
      summary: A Determination was created. Carries the record as created.
      payload:
        $ref: "#/components/schemas/EligibilityDeterminationCreatedEvent"
    EligibilityDeterminationUpdated:
      name: eligibility.determination.updated
      summary: A Determination was changed. Carries each changed field, before and after.
      payload:
        $ref: "#/components/schemas/EligibilityDeterminationUpdatedEvent"
    EligibilityDeterminationComplete:
      name: eligibility.determination.complete
      summary: TODO — describe when this event is emitted and who consumes it.
      payload:
        $ref: "#/components/schemas/EligibilityDeterminationCompleteEvent"
  schemas:
    EligibilityDeterminationCreatedEvent:
      allOf:
        - $ref: ../../base/schemas/events.yaml#/$defs/Event
        - type: object
          properties:
            type:
              type: string
              const: eligibility.determination.created
            data:
              $ref: ./eligibility-openapi.yaml#/components/schemas/Determination
    EligibilityDeterminationUpdatedEvent:
      allOf:
        - $ref: ../../base/schemas/events.yaml#/$defs/Event
        - type: object
          properties:
            type:
              type: string
              const: eligibility.determination.updated
            data:
              $ref: ../../base/schemas/events.yaml#/ResourceUpdatedEvent
    EligibilityDeterminationCompleteEvent:
      allOf:
        - $ref: ../../base/schemas/events.yaml#/$defs/Event
        - type: object
          properties:
            type:
              type: string
              const: eligibility.determination.complete
