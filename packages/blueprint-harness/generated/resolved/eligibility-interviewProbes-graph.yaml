$schema: https://blueprint.codeforamerica.org/schemas/graph-schema.yaml
domain: eligibility
ruleset: interviewProbes
outputs:
  - incomeInconsistencyProbe
  - workRequirementProbe
  - studentEligibilityProbe
  - immigrationStatusProbe
  - changeVerificationProbe
  - allMembersEmployed
inputs:
  $.household.monthlyIncome:
    type: number
    description: Total monthly gross income reported by the household.
  $.household.monthlyExpenses:
    type: number
    description: Total monthly expenses reported by the household.
  $.household.members[]:
    type: array
    description: All individuals in the household.
  $.household.members[].age:
    type: integer
    description: Member's age in years.
  $.household.members[].isEmployed:
    type: boolean
    description: Whether the member is currently employed.
  $.household.members[].isStudent:
    type: boolean
    description: Whether the member is enrolled at least half-time in higher education.
  $.household.members[].isNonCitizen:
    type: boolean
    description: Whether the member is a non-citizen subject to immigration screening.
  $.application.hasChangedCircumstances:
    type: boolean
    description: Whether the household reported changes since the application was submitted.
facts:
  incomeGapExists:
    expression: household.monthlyIncome < household.monthlyExpenses
    type: boolean
    description: |
      Monthly income is less than monthly expenses — an inconsistency that requires probing for other income sources or assistance (FNS-1104).
  workEligibleMembers:
    expression: household.members.filter(m, m.age >= 16 && m.age <= 54 && !m.isEmployed)
    description: |
      Members aged 16–59 who are not employed and may be subject to work requirement screening (7 CFR § 273.7).
  hasUnemployedWorkEligible:
    expression: household.members.exists(m, m.age >= 16 && m.age <= 59 && !m.isEmployed)
    type: boolean
    description: At least one member aged 16–59 is not employed.
  hasStudentMembers:
    expression: household.members.exists(m, m.isStudent)
    type: boolean
    description: At least one household member is enrolled in higher education.
  hasNonCitizenMembers:
    expression: household.members.exists(m, m.isNonCitizen)
    type: boolean
    description: At least one household member is a non-citizen.
  allMembersEmployed:
    expression: household.members.all(m, m.isEmployed)
    type: boolean
    description: Every household member is currently employed.
  incomeInconsistencyProbe:
    expression: incomeGapExists
    type: boolean
    description: |
      Probe the household for unexplained income sources or assistance that account for the gap between income and expenses.
  workRequirementProbe:
    expression: hasUnemployedWorkEligible
    type: boolean
    description: |
      Screen non-employed members aged 16–59 for work requirement exemptions (physical/mental fitness, caregiving, education, etc.).
  studentEligibilityProbe:
    expression: hasStudentMembers
    type: boolean
    description: |
      Screen student members for SNAP student eligibility exceptions (employment, dependent care, work-study, etc.).
  immigrationStatusProbe:
    expression: hasNonCitizenMembers
    type: boolean
    description: |
      Screen non-citizen members for immigration status and apply sponsor income deeming rules where applicable.
  changeVerificationProbe:
    expression: application.hasChangedCircumstances
    type: boolean
    description: |
      Identify and verify changes in household circumstances that occurred between the application date and the interview date.
dependencies:
  incomeGapExists:
    - $.household.monthlyIncome
    - $.household.monthlyExpenses
  workEligibleMembers:
    - $.household.members[]
  hasUnemployedWorkEligible:
    - $.household.members[]
  hasStudentMembers:
    - $.household.members[]
  hasNonCitizenMembers:
    - $.household.members[]
  allMembersEmployed:
    - $.household.members[]
  incomeInconsistencyProbe:
    - incomeGapExists
  workRequirementProbe:
    - hasUnemployedWorkEligible
  studentEligibilityProbe:
    - hasStudentMembers
  immigrationStatusProbe:
    - hasNonCitizenMembers
  changeVerificationProbe:
    - $.application.hasChangedCircumstances
