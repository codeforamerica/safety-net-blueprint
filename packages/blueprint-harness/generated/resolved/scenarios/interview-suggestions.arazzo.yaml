arazzo: 1.0.1
info:
  title: An interview's suggestions
  version: 1.0.0
  x-domain: intake
  description: |
    A caseworker interviews Rosa about her household's income. As they talk, the system points out things worth asking about, and an AI assistant listening in suggests fixes to her record. The caseworker decides what to do with each one.

    - When the interview starts, the system checks Rosa's incomes and flags the ones that often turn out wrong: wages that change week to week, tips paid in cash, self-employment income. Each flag appears as a suggestion for the caseworker.
    - Rosa's pay stub shows a higher salary than she reported, so the system suggests correcting it, and the caseworker accepts the correction.
    - The AI assistant suggests fixing Rosa's first name. When it suggests the same fix again, it's turned away. The caseworker accepts it with the spelling Rosa gives.
    - A fix the record won't take is turned down, and the caseworker tries again.
    - The caseworker dismisses a flag, saying why, and it doesn't come back.
    - When Rosa explains an income was a gift, not self-employment, its flag goes away on its own.
    - When the interview ends, whatever is still waiting is closed out.
sourceDescriptions:
  - name: intake
    url: ../domains/intake/intake-openapi.yaml
    type: openapi
  - name: suggestions
    url: ../base/domains/decision-support/decision-support-suggestions-openapi.yaml
    type: openapi
  - name: registries
    url: ../base/domains/platform/platform-registries-openapi.yaml
    type: openapi
  - name: events
    url: ../base/domains/platform/platform-events-openapi.yaml
    type: openapi
components:
  parameters:
    worker:
      name: X-Caller-Id
      in: header
      value: worker-1
    assistant:
      name: X-Caller-Id
      in: header
      value: assistant-1
    application:
      name: applicationId
      in: path
      value: 11111111-1111-4111-8111-111111111111
workflows:
  - workflowId: household
    summary: Rosa's household
    steps:
      - stepId: addRosa
        description: |
          Add Rosa

          - The response's `id` is Rosa's record. Suggestions about her name it as their `subjectId`.
        operationId: $sourceDescriptions.intake.createApplicationMember
        parameters:
          - reference: $components.parameters.worker
          - reference: $components.parameters.application
        requestBody:
          payload:
            firstName: Rosa
            lastName: Diaz
            relationship: self
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          id: $response.body#/id
      - stepId: reportWages
        description: |
          Add her wages, which change week to week

          - `amountVaries: true` and `frequency: weekly`: her pay changes week to week.
          - `memberId` is Rosa's `id` from the step before.
        operationId: $sourceDescriptions.intake.createApplicationIncome
        parameters:
          - reference: $components.parameters.worker
          - reference: $components.parameters.application
        requestBody:
          payload:
            memberId: $steps.addRosa.outputs.id
            source: earned
            amount: 300
            frequency: weekly
            amountVaries: true
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          id: $response.body#/id
      - stepId: reportTips
        description: |
          Add her cash tips

          - `paidInCash: true` and `amountVaries: true`: one income with two things worth asking about.
        operationId: $sourceDescriptions.intake.createApplicationIncome
        parameters:
          - reference: $components.parameters.worker
          - reference: $components.parameters.application
        requestBody:
          payload:
            memberId: $steps.addRosa.outputs.id
            source: earned
            amount: 120
            frequency: weekly
            paidInCash: true
            amountVaries: true
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          id: $response.body#/id
      - stepId: reportSideIncome
        description: |
          Add her self-employment income

          - `source: self_employment`.
        operationId: $sourceDescriptions.intake.createApplicationIncome
        parameters:
          - reference: $components.parameters.worker
          - reference: $components.parameters.application
        requestBody:
          payload:
            memberId: $steps.addRosa.outputs.id
            source: self_employment
            amount: 400
            frequency: monthly
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          id: $response.body#/id
      - stepId: reportSalary
        description: |
          Add her monthly salary

          - `amount: 1100`, paid `monthly`.
        operationId: $sourceDescriptions.intake.createApplicationIncome
        parameters:
          - reference: $components.parameters.worker
          - reference: $components.parameters.application
        requestBody:
          payload:
            memberId: $steps.addRosa.outputs.id
            source: earned
            amount: 1100
            frequency: monthly
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          id: $response.body#/id
      - stepId: recordPayStub
        description: |
          Record a pay stub showing a higher salary

          - `incomeId` is the salary from the step before, and `amount` is 1,250, more than the 1,100 she reported.
        operationId: $sourceDescriptions.intake.createIncomeVerification
        parameters:
          - reference: $components.parameters.worker
          - reference: $components.parameters.application
        requestBody:
          payload:
            kind: pay_stub
            memberId: $steps.addRosa.outputs.id
            incomeId: $steps.reportSalary.outputs.id
            period: "2026-10-15"
            amount: 1250
            frequency: monthly
        successCriteria:
          - condition: $statusCode == 201
      - stepId: scheduleInterview
        description: |
          Schedule the interview

          - `status` is `scheduled`, the interview's first state. Nothing in the request set it.
        operationId: $sourceDescriptions.intake.createApplicationInterview
        parameters:
          - reference: $components.parameters.worker
          - reference: $components.parameters.application
        requestBody:
          payload:
            scheduledFor: "2026-10-30"
        successCriteria:
          - condition: $statusCode == 201
          - condition: $response.body#/status == 'scheduled'
        outputs:
          id: $response.body#/id
      - stepId: changeBeforeInterview
        description: |
          Change her wages before the interview

          - `amount` is now 310.
        operationId: $sourceDescriptions.intake.updateApplicationIncome
        parameters:
          - reference: $components.parameters.worker
          - reference: $components.parameters.application
          - name: incomeId
            in: path
            value: $steps.reportWages.outputs.id
        requestBody:
          payload:
            amount: 310
        successCriteria:
          - condition: $statusCode == 200
      - stepId: nothingBeforeInterview
        description: |
          Nothing is flagged yet

          - `q` narrows to suggestions whose `metadata.intake.interviewId` is this interview: search reaches into nested fields.
          - `total` is 0: no suggestions are created until the interview starts.
        operationId: $sourceDescriptions.suggestions.listSuggestions
        parameters:
          - reference: $components.parameters.worker
          - name: q
            in: query
            value: metadata.intake.interviewId:{$steps.scheduleInterview.outputs.id}
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/total == 0
    outputs:
      addRosa: $steps.addRosa.outputs.id
      reportSalary: $steps.reportSalary.outputs.id
      reportSideIncome: $steps.reportSideIncome.outputs.id
      reportTips: $steps.reportTips.outputs.id
      reportWages: $steps.reportWages.outputs.id
      scheduleInterview: $steps.scheduleInterview.outputs.id
  - workflowId: interviewStarts
    summary: The interview flags what to ask about
    dependsOn:
      - household
    steps:
      - stepId: startInterview
        description: |
          Start the interview

          - `status` is `in_progress`, and `startedAt` is set.
        operationId: $sourceDescriptions.intake.startInterview
        parameters:
          - reference: $components.parameters.worker
          - reference: $components.parameters.application
          - name: interviewId
            in: path
            value: $workflows.household.outputs.scheduleInterview
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'in_progress'
      - stepId: interviewSuggestions
        description: |
          Five things to ask about

          - `total` is 5, one suggestion per flagged income: the wages and the tips for varying, the tips and the self-employment income for cash or self-employment, and the salary for differing from its pay stub.
        operationId: $sourceDescriptions.suggestions.listSuggestions
        parameters:
          - reference: $components.parameters.worker
          - name: q
            in: query
            value: metadata.intake.interviewId:{$workflows.household.outputs.scheduleInterview}
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/total == 5
      - stepId: wagesFlag
        description: |
          Her changing wages

          - `kind` is `informing`: a `category`, and the record it's about, `subjectType` and `subjectId`, which is the wages. There's nothing to perform.
          - `metadata.intake` names the interview, the flag and the record.
          - `expiresAt` is a day after `createdAt`. The proposal didn't give one, so it defaulted.
        operationId: $sourceDescriptions.suggestions.listSuggestions
        parameters:
          - reference: $components.parameters.worker
          - name: q
            in: query
            value: metadata.intake.recordId:{$workflows.household.outputs.reportWages}
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/items/0/kind == 'informing'
          - condition: $response.body#/items/0/category == 'earned-income-varies'
          - condition: $response.body#/items/0/subjectId == $workflows.household.outputs.reportWages
          - condition: $response.body#/items/0/status == 'proposed'
        outputs:
          id: $response.body#/items/0/id
      - stepId: tipsVaryFlag
        description: |
          Her tips, flagged for changing…

          - `category` is `earned-income-varies`, and `subjectId` is the tips.
        operationId: $sourceDescriptions.suggestions.listSuggestions
        parameters:
          - reference: $components.parameters.worker
          - name: q
            in: query
            value: metadata.intake.recordId:{$workflows.household.outputs.reportTips} category:earned-income-varies
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/total == 1
        outputs:
          id: $response.body#/items/0/id
      - stepId: tipsCashFlag
        description: |
          …and again for being paid in cash

          - The same `subjectId` as the step before, under `cash-or-self-employment-income`: the same record in another category is another suggestion.
        operationId: $sourceDescriptions.suggestions.listSuggestions
        parameters:
          - reference: $components.parameters.worker
          - name: q
            in: query
            value: metadata.intake.recordId:{$workflows.household.outputs.reportTips} category:cash-or-self-employment-income
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/total == 1
        outputs:
          id: $response.body#/items/0/id
      - stepId: sideIncomeFlag
        description: |
          Her self-employment income

          - `category` is `cash-or-self-employment-income`, and `subjectId` is the self-employment income.
        operationId: $sourceDescriptions.suggestions.listSuggestions
        parameters:
          - reference: $components.parameters.worker
          - name: q
            in: query
            value: metadata.intake.recordId:{$workflows.household.outputs.reportSideIncome}
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/total == 1
        outputs:
          id: $response.body#/items/0/id
      - stepId: salaryCorrection
        description: |
          A correction to her salary, ready to accept

          - `kind` is `operation`: instead of a category, a `call`, `updateApplicationIncome` on the salary, with `amount: 1250` from the pay stub.
          - There's no `subjectType` or `subjectId`: the call says what it changes.
        operationId: $sourceDescriptions.suggestions.listSuggestions
        parameters:
          - reference: $components.parameters.worker
          - name: q
            in: query
            value: metadata.intake.recordId:{$workflows.household.outputs.reportSalary}
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/items/0/kind == 'operation'
          - condition: $response.body#/items/0/call/operationId == 'updateApplicationIncome'
          - condition: $response.body#/items/0/call/requestBody/payload/amount == 1250
        outputs:
          id: $response.body#/items/0/id
      - stepId: createdEvent
        description: |
          Each suggestion is recorded as an event

          - One `decision-support.suggestion.created` event, with the suggestion's id as its `subject`.
          - `authid` is `system`: the interview's state machine proposed it, not a person.
        operationId: $sourceDescriptions.events.listEvents
        parameters:
          - reference: $components.parameters.worker
          - name: subject
            in: query
            value: $steps.wagesFlag.outputs.id
          - name: type
            in: query
            value: decision-support.suggestion.created
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/total == 1
          - condition: $response.body#/items/0/authid == 'system'
      - stepId: categories
        description: |
          What each kind of flag means

          - Each entry is an `id` and a `description`. The description is what the worker reads beside the record.
        operationId: $sourceDescriptions.registries.listRegistryEntries
        parameters:
          - reference: $components.parameters.worker
          - name: type
            in: path
            value: suggestion-categories
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/items/0/id == 'cash-or-self-employment-income'
    outputs:
      salaryCorrection: $steps.salaryCorrection.outputs.id
      sideIncomeFlag: $steps.sideIncomeFlag.outputs.id
      tipsCashFlag: $steps.tipsCashFlag.outputs.id
      tipsVaryFlag: $steps.tipsVaryFlag.outputs.id
      wagesFlag: $steps.wagesFlag.outputs.id
  - workflowId: assistantSuggests
    summary: The assistant suggests changes
    dependsOn:
      - household
    steps:
      - stepId: pointOutSomethingNew
        description: |
          The assistant notes something no flag covers

          - No `category`, so `message` says what it is.
          - `path: /firstName` narrows it to a field of Rosa's record.
        operationId: $sourceDescriptions.suggestions.createSuggestion
        parameters:
          - reference: $components.parameters.assistant
        requestBody:
          payload:
            kind: informing
            subjectType: application_member
            subjectId: $workflows.household.outputs.addRosa
            path: /firstName
            message: Rosa said she goes by her middle name at work.
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          id: $response.body#/id
      - stepId: findUncategorized
        description: |
          Find notes like that

          - `-category:*` in `q` means no category.
          - `total` is 1: the assistant's note.
        operationId: $sourceDescriptions.suggestions.listSuggestions
        parameters:
          - reference: $components.parameters.worker
          - name: q
            in: query
            value: kind:informing -category:*
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/total == 1
      - stepId: neitherCategoryNorMessage
        description: |
          A note that says nothing is turned away

          - `422`: the request has neither a `category` nor a `message`, and an informing suggestion needs one.
        operationId: $sourceDescriptions.suggestions.createSuggestion
        parameters:
          - reference: $components.parameters.assistant
        requestBody:
          payload:
            kind: informing
            subjectType: application_member
            subjectId: $workflows.household.outputs.addRosa
        successCriteria:
          - condition: $statusCode == 422
      - stepId: pathThatIsNotAPointer
        description: |
          A field named the wrong way is turned away

          - `422`: `path` is `firstName`, and it has to be a JSON Pointer, `/firstName`.
        operationId: $sourceDescriptions.suggestions.createSuggestion
        parameters:
          - reference: $components.parameters.assistant
        requestBody:
          payload:
            kind: informing
            subjectType: application_member
            subjectId: $workflows.household.outputs.addRosa
            path: firstName
            message: Check the spelling.
        successCriteria:
          - condition: $statusCode == 422
      - stepId: unknownOperation
        description: |
          A change to something that doesn't exist is turned away

          - `422`: no API declares `updateApplicantMember`.
        operationId: $sourceDescriptions.suggestions.createSuggestion
        parameters:
          - reference: $components.parameters.assistant
        requestBody:
          payload:
            kind: operation
            call:
              operationId: updateApplicantMember
              requestBody:
                payload:
                  firstName: Rosalinda
        successCriteria:
          - condition: $statusCode == 422
      - stepId: bodyTheOperationRefuses
        description: |
          A value the record won't take is turned away

          - `422`, naming `call.requestBody.payload.relationship`: `updateApplicationMember` doesn't accept `cousin`.
        operationId: $sourceDescriptions.suggestions.createSuggestion
        parameters:
          - reference: $components.parameters.assistant
        requestBody:
          payload:
            kind: operation
            call:
              operationId: updateApplicationMember
              parameters:
                - name: applicationId
                  in: path
                  value: 11111111-1111-4111-8111-111111111111
                - name: memberId
                  in: path
                  value: $workflows.household.outputs.addRosa
              requestBody:
                payload:
                  relationship: cousin
        successCriteria:
          - condition: $statusCode == 422
          - condition: $response.body#/details/0/field == 'call.requestBody.payload.relationship'
      - stepId: undeclaredParameter
        description: |
          An extra setting is turned away

          - `422`: `updateApplicationMember` declares no `verbose` parameter.
        operationId: $sourceDescriptions.suggestions.createSuggestion
        parameters:
          - reference: $components.parameters.assistant
        requestBody:
          payload:
            kind: operation
            call:
              operationId: updateApplicationMember
              parameters:
                - name: applicationId
                  in: path
                  value: 11111111-1111-4111-8111-111111111111
                - name: memberId
                  in: path
                  value: $workflows.household.outputs.addRosa
                - name: verbose
                  in: query
                  value: "true"
              requestBody:
                payload:
                  firstName: Rosalinda
        successCriteria:
          - condition: $statusCode == 422
      - stepId: missingPathParameter
        description: |
          A change that doesn't say which member is turned away

          - `422`: the call has no `memberId`, a path parameter `updateApplicationMember` needs.
        operationId: $sourceDescriptions.suggestions.createSuggestion
        parameters:
          - reference: $components.parameters.assistant
        requestBody:
          payload:
            kind: operation
            call:
              operationId: updateApplicationMember
              parameters:
                - name: applicationId
                  in: path
                  value: 11111111-1111-4111-8111-111111111111
              requestBody:
                payload:
                  firstName: Rosalinda
        successCriteria:
          - condition: $statusCode == 422
      - stepId: proposeChange
        description: |
          The assistant suggests her name is Rosalinda

          - `201`, with `status: proposed`. The `call` is `updateApplicationMember` with `firstName: Rosalinda`.
          - `fingerprint` is a hash: the values it stands for can't be read back from it.
        operationId: $sourceDescriptions.suggestions.createSuggestion
        parameters:
          - reference: $components.parameters.assistant
        requestBody:
          payload:
            kind: operation
            call:
              operationId: updateApplicationMember
              parameters:
                - name: applicationId
                  in: path
                  value: 11111111-1111-4111-8111-111111111111
                - name: memberId
                  in: path
                  value: $workflows.household.outputs.addRosa
              requestBody:
                payload:
                  firstName: Rosalinda
        successCriteria:
          - condition: $statusCode == 201
          - condition: $response.body#/status == 'proposed'
        outputs:
          id: $response.body#/id
      - stepId: proposeItAgain
        description: |
          Suggesting it again is turned away

          - `409`, and `details` names the open suggestion from the step before.
        operationId: $sourceDescriptions.suggestions.createSuggestion
        parameters:
          - reference: $components.parameters.assistant
        requestBody:
          payload:
            kind: operation
            call:
              operationId: updateApplicationMember
              parameters:
                - name: applicationId
                  in: path
                  value: 11111111-1111-4111-8111-111111111111
                - name: memberId
                  in: path
                  value: $workflows.household.outputs.addRosa
              requestBody:
                payload:
                  firstName: Rosalinda
        successCriteria:
          - condition: $statusCode == 409
          - condition: $response.body#/details/0/id == $steps.proposeChange.outputs.id
      - stepId: proposeItInCapitals
        description: |
          Even in capitals with spaces

          - `firstName` is ` ROSALINDA `, and it's still `409`: values are compared trimmed and without case.
        operationId: $sourceDescriptions.suggestions.createSuggestion
        parameters:
          - reference: $components.parameters.assistant
        requestBody:
          payload:
            kind: operation
            call:
              operationId: updateApplicationMember
              parameters:
                - name: applicationId
                  in: path
                  value: 11111111-1111-4111-8111-111111111111
                - name: memberId
                  in: path
                  value: $workflows.household.outputs.addRosa
              requestBody:
                payload:
                  firstName: " ROSALINDA "
        successCriteria:
          - condition: $statusCode == 409
      - stepId: proposeAnotherName
        description: |
          A different spelling is a new suggestion

          - `201`: `Rosa Maria` is a different change, so it's a new suggestion.
        operationId: $sourceDescriptions.suggestions.createSuggestion
        parameters:
          - reference: $components.parameters.assistant
        requestBody:
          payload:
            kind: operation
            call:
              operationId: updateApplicationMember
              parameters:
                - name: applicationId
                  in: path
                  value: 11111111-1111-4111-8111-111111111111
                - name: memberId
                  in: path
                  value: $workflows.household.outputs.addRosa
              requestBody:
                payload:
                  firstName: Rosa Maria
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          id: $response.body#/id
    outputs:
      pointOutSomethingNew: $steps.pointOutSomethingNew.outputs.id
      proposeAnotherName: $steps.proposeAnotherName.outputs.id
      proposeChange: $steps.proposeChange.outputs.id
  - workflowId: caseworkerDecides
    summary: The caseworker decides
    dependsOn:
      - household
      - interviewStarts
      - assistantSuggests
    steps:
      - stepId: acceptAsAnotherOperation
        description: |
          Accepting it as a different kind of change is turned away

          - `409`: the corrected `call` names `updateApplicationIncome`, and this suggestion's is `updateApplicationMember`.
        operationId: $sourceDescriptions.suggestions.acceptSuggestion
        parameters:
          - reference: $components.parameters.worker
          - name: suggestionId
            in: path
            value: $workflows.assistantSuggests.outputs.proposeChange
        requestBody:
          payload:
            call:
              operationId: updateApplicationIncome
              parameters:
                - name: applicationId
                  in: path
                  value: 11111111-1111-4111-8111-111111111111
                - name: incomeId
                  in: path
                  value: $workflows.household.outputs.reportWages
              requestBody:
                payload:
                  amount: 1
        successCriteria:
          - condition: $statusCode == 409
      - stepId: acceptWithAnEdit
        description: |
          Accept the name, spelled the way Rosa does

          - The request sends a corrected `call`, with `firstName: Rosalind`.
          - `status` is `accepted`. `performed` is the call made, and `call` is still the one proposed, `Rosalinda`.
        operationId: $sourceDescriptions.suggestions.acceptSuggestion
        parameters:
          - reference: $components.parameters.worker
          - name: suggestionId
            in: path
            value: $workflows.assistantSuggests.outputs.proposeChange
        requestBody:
          payload:
            call:
              operationId: updateApplicationMember
              parameters:
                - name: applicationId
                  in: path
                  value: 11111111-1111-4111-8111-111111111111
                - name: memberId
                  in: path
                  value: $workflows.household.outputs.addRosa
              requestBody:
                payload:
                  firstName: Rosalind
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'accepted'
          - condition: $response.body#/performed/requestBody/payload/firstName == 'Rosalind'
          - condition: $response.body#/call/requestBody/payload/firstName == 'Rosalinda'
      - stepId: memberChanged
        description: |
          Her record now says Rosalind

          - `firstName` is `Rosalind`, as edited.
        operationId: $sourceDescriptions.intake.getApplicationMember
        parameters:
          - reference: $components.parameters.worker
          - reference: $components.parameters.application
          - name: memberId
            in: path
            value: $workflows.household.outputs.addRosa
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/firstName == 'Rosalind'
      - stepId: acceptedEvent
        description: |
          The record shows who accepted it

          - `authid` is `worker-1`, the worker who accepted. The suggestion itself records no one.
        operationId: $sourceDescriptions.events.listEvents
        parameters:
          - reference: $components.parameters.worker
          - name: subject
            in: query
            value: $workflows.assistantSuggests.outputs.proposeChange
          - name: type
            in: query
            value: decision-support.suggestion.accepted
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/items/0/authid == 'worker-1'
        outputs:
          id: $response.body#/items/0/id
      - stepId: whatAcceptingCaused
        description: |
          And what accepting changed

          - Asking by the accepted event's id as `causationid` finds `intake.application_member.updated`: the change accepting made.
        operationId: $sourceDescriptions.events.listEvents
        parameters:
          - reference: $components.parameters.worker
          - name: causationid
            in: query
            value: $steps.acceptedEvent.outputs.id
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/items/0/type == 'intake.application_member.updated'
      - stepId: acceptItAgain
        description: |
          Accepting it twice is turned away

          - `409`: it's already `accepted`.
        operationId: $sourceDescriptions.suggestions.acceptSuggestion
        parameters:
          - reference: $components.parameters.worker
          - name: suggestionId
            in: path
            value: $workflows.assistantSuggests.outputs.proposeChange
        successCriteria:
          - condition: $statusCode == 409
      - stepId: acceptTheCorrection
        description: |
          Accept the salary correction

          - No request body, so the call proposed is made as it is.
          - `status` is `accepted`.
        operationId: $sourceDescriptions.suggestions.acceptSuggestion
        parameters:
          - reference: $components.parameters.worker
          - name: suggestionId
            in: path
            value: $workflows.interviewStarts.outputs.salaryCorrection
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'accepted'
      - stepId: salaryCorrected
        description: |
          Her salary now matches the pay stub

          - `amount` is 1,250, what the pay stub shows.
        operationId: $sourceDescriptions.intake.getApplicationIncome
        parameters:
          - reference: $components.parameters.worker
          - reference: $components.parameters.application
          - name: incomeId
            in: path
            value: $workflows.household.outputs.reportSalary
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/amount == 1250
      - stepId: acceptWithABadEdit
        description: |
          Accept the other name with a value the record won't take

          - `422`: `updateApplicationMember`'s own refusal of `relationship: cousin`.
          - `details` holds the suggestion, now `refused`.
        operationId: $sourceDescriptions.suggestions.acceptSuggestion
        parameters:
          - reference: $components.parameters.worker
          - name: suggestionId
            in: path
            value: $workflows.assistantSuggests.outputs.proposeAnotherName
        requestBody:
          payload:
            call:
              operationId: updateApplicationMember
              parameters:
                - name: applicationId
                  in: path
                  value: 11111111-1111-4111-8111-111111111111
                - name: memberId
                  in: path
                  value: $workflows.household.outputs.addRosa
              requestBody:
                payload:
                  relationship: cousin
        successCriteria:
          - condition: $statusCode == 422
          - condition: $response.body#/details/0/status == 'refused'
      - stepId: refusedEvent
        description: |
          The refusal is recorded, with what was tried

          - One `decision-support.suggestion.refused` event. Its `data` has the `call` that was tried and the `error`.
        operationId: $sourceDescriptions.events.listEvents
        parameters:
          - reference: $components.parameters.worker
          - name: subject
            in: query
            value: $workflows.assistantSuggests.outputs.proposeAnotherName
          - name: type
            in: query
            value: decision-support.suggestion.refused
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/total == 1
          - condition: $response.body#/items/0/data/call/requestBody/payload/relationship == 'cousin'
      - stepId: acceptWithTheSameBadEdit
        description: |
          Try the same value again

          - `422` again.
        operationId: $sourceDescriptions.suggestions.acceptSuggestion
        parameters:
          - reference: $components.parameters.worker
          - name: suggestionId
            in: path
            value: $workflows.assistantSuggests.outputs.proposeAnotherName
        requestBody:
          payload:
            call:
              operationId: updateApplicationMember
              parameters:
                - name: applicationId
                  in: path
                  value: 11111111-1111-4111-8111-111111111111
                - name: memberId
                  in: path
                  value: $workflows.household.outputs.addRosa
              requestBody:
                payload:
                  relationship: cousin
        successCriteria:
          - condition: $statusCode == 422
      - stepId: twoRefusals
        description: |
          Both refusals are on record

          - `total` is 2: each failed try has an event of its own. There's no limit on tries.
        operationId: $sourceDescriptions.events.listEvents
        parameters:
          - reference: $components.parameters.worker
          - name: subject
            in: query
            value: $workflows.assistantSuggests.outputs.proposeAnotherName
          - name: type
            in: query
            value: decision-support.suggestion.refused
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/total == 2
      - stepId: acceptAsProposed
        description: |
          Accept it as suggested

          - No request body, so the call proposed, `Rosa Maria`, is made.
          - `status` goes from `refused` to `accepted`.
        operationId: $sourceDescriptions.suggestions.acceptSuggestion
        parameters:
          - reference: $components.parameters.worker
          - name: suggestionId
            in: path
            value: $workflows.assistantSuggests.outputs.proposeAnotherName
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'accepted'
      - stepId: dismissWithoutAReason
        description: |
          Dismissing without a reason is turned away

          - `422`: the body has no `reason`.
        operationId: $sourceDescriptions.suggestions.dismissSuggestion
        parameters:
          - reference: $components.parameters.worker
          - name: suggestionId
            in: path
            value: $workflows.interviewStarts.outputs.wagesFlag
        requestBody:
          payload: {}
        successCriteria:
          - condition: $statusCode == 422
      - stepId: dismissTheWagesFlag
        description: |
          Dismiss the changing-wages flag, saying why

          - `status` is `dismissed`, and the `reason` is kept on it.
        operationId: $sourceDescriptions.suggestions.dismissSuggestion
        parameters:
          - reference: $components.parameters.worker
          - name: suggestionId
            in: path
            value: $workflows.interviewStarts.outputs.wagesFlag
        requestBody:
          payload:
            reason: Her hours are steady now.
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'dismissed'
          - condition: $response.body#/reason == 'Her hours are steady now.'
      - stepId: dismissItAgain
        description: |
          Dismissing it twice is turned away

          - `409`: it's already `dismissed`.
        operationId: $sourceDescriptions.suggestions.dismissSuggestion
        parameters:
          - reference: $components.parameters.worker
          - name: suggestionId
            in: path
            value: $workflows.interviewStarts.outputs.wagesFlag
        requestBody:
          payload:
            reason: Still steady.
        successCriteria:
          - condition: $statusCode == 409
    outputs: null
  - workflowId: answersChange
    summary: Rosa's answers change things
    dependsOn:
      - household
      - interviewStarts
      - assistantSuggests
      - caseworkerDecides
    steps:
      - stepId: changeWagesAgain
        description: |
          Change her wages again

          - `amount` is now 320, and the wages still vary.
        operationId: $sourceDescriptions.intake.updateApplicationIncome
        parameters:
          - reference: $components.parameters.worker
          - reference: $components.parameters.application
          - name: incomeId
            in: path
            value: $workflows.household.outputs.reportWages
        requestBody:
          payload:
            amount: 320
        successCriteria:
          - condition: $statusCode == 200
      - stepId: correctTheSideIncome
        description: |
          Her side income was a gift

          - `source` is now `unearned`: it was a gift.
        operationId: $sourceDescriptions.intake.updateApplicationIncome
        parameters:
          - reference: $components.parameters.worker
          - reference: $components.parameters.application
          - name: incomeId
            in: path
            value: $workflows.household.outputs.reportSideIncome
        requestBody:
          payload:
            source: unearned
        successCriteria:
          - condition: $statusCode == 200
      - stepId: clearedFlagExpired
        description: |
          Its flag closes on its own

          - `status` is `expired`: the self-employment flag no longer finds this income, so the interview expired its suggestion.
        operationId: $sourceDescriptions.suggestions.getSuggestion
        parameters:
          - reference: $components.parameters.worker
          - name: suggestionId
            in: path
            value: $workflows.interviewStarts.outputs.sideIncomeFlag
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'expired'
        onFailure:
          - name: waitForTheInterview
            type: retry
            retryAfter: 0.05
            retryLimit: 20
      - stepId: nothingNew
        description: |
          Nothing new is flagged, and the dismissed flag stays dismissed

          - `total` is still 5. Flags still raised were already suggested, and the dismissed wages flag wasn't suggested again.
        operationId: $sourceDescriptions.suggestions.listSuggestions
        parameters:
          - reference: $components.parameters.worker
          - name: q
            in: query
            value: metadata.intake.interviewId:{$workflows.household.outputs.scheduleInterview}
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/total == 5
      - stepId: acceptAFlagWithACall
        description: |
          Accepting a flag with a change attached is turned away

          - `409`: this is an informing suggestion, and the request sends a `call`.
        operationId: $sourceDescriptions.suggestions.acceptSuggestion
        parameters:
          - reference: $components.parameters.worker
          - name: suggestionId
            in: path
            value: $workflows.interviewStarts.outputs.tipsVaryFlag
        requestBody:
          payload:
            call:
              operationId: updateApplicationIncome
              parameters:
                - name: applicationId
                  in: path
                  value: 11111111-1111-4111-8111-111111111111
                - name: incomeId
                  in: path
                  value: $workflows.household.outputs.reportTips
              requestBody:
                payload:
                  amount: 130
        successCriteria:
          - condition: $statusCode == 409
      - stepId: acceptAFlag
        description: |
          Accept the tips flag: the caseworker asked about it

          - `status` is `accepted`, with no `performed`: there was nothing to make.
        operationId: $sourceDescriptions.suggestions.acceptSuggestion
        parameters:
          - reference: $components.parameters.worker
          - name: suggestionId
            in: path
            value: $workflows.interviewStarts.outputs.tipsVaryFlag
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'accepted'
      - stepId: whatsStillOpen
        description: |
          Only one thing is still waiting

          - `q` narrows to this interview and `status:proposed`.
          - `total` is 1: the cash-tips flag.
        operationId: $sourceDescriptions.suggestions.listSuggestions
        parameters:
          - reference: $components.parameters.worker
          - name: q
            in: query
            value: metadata.intake.interviewId:{$workflows.household.outputs.scheduleInterview} status:proposed
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/total == 1
          - condition: $response.body#/items/0/id == $workflows.interviewStarts.outputs.tipsCashFlag
      - stepId: expireByHand
        description: |
          Close the assistant's note by hand

          - `status` is `expired`.
        operationId: $sourceDescriptions.suggestions.expireSuggestion
        parameters:
          - reference: $components.parameters.worker
          - name: suggestionId
            in: path
            value: $workflows.assistantSuggests.outputs.pointOutSomethingNew
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'expired'
      - stepId: expireItAgain
        description: |
          Closing it twice is turned away

          - `409`: it's no longer open.
        operationId: $sourceDescriptions.suggestions.expireSuggestion
        parameters:
          - reference: $components.parameters.worker
          - name: suggestionId
            in: path
            value: $workflows.assistantSuggests.outputs.pointOutSomethingNew
        successCriteria:
          - condition: $statusCode == 409
  - workflowId: interviewEnds
    summary: The interview ends
    dependsOn:
      - household
      - interviewStarts
      - assistantSuggests
      - answersChange
    steps:
      - stepId: completeInterview
        description: |
          Complete the interview

          - `status` is `completed`, and `completedAt` is set.
        operationId: $sourceDescriptions.intake.completeInterview
        parameters:
          - reference: $components.parameters.worker
          - reference: $components.parameters.application
          - name: interviewId
            in: path
            value: $workflows.household.outputs.scheduleInterview
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'completed'
      - stepId: leftoverExpired
        description: |
          What was still waiting is closed

          - `status` is `expired`: completing the interview expired what was still waiting.
        operationId: $sourceDescriptions.suggestions.getSuggestion
        parameters:
          - reference: $components.parameters.worker
          - name: suggestionId
            in: path
            value: $workflows.interviewStarts.outputs.tipsCashFlag
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'expired'
      - stepId: changeAfterwards
        description: |
          Change her tips afterward

          - `amount` is now 140.
        operationId: $sourceDescriptions.intake.updateApplicationIncome
        parameters:
          - reference: $components.parameters.worker
          - reference: $components.parameters.application
          - name: incomeId
            in: path
            value: $workflows.household.outputs.reportTips
        requestBody:
          payload:
            amount: 140
        successCriteria:
          - condition: $statusCode == 200
      - stepId: stillFive
        description: |
          Nothing new is flagged

          - `total` is still 5: the interview is over, so changing an income creates no suggestions.
        operationId: $sourceDescriptions.suggestions.listSuggestions
        parameters:
          - reference: $components.parameters.worker
          - name: q
            in: query
            value: metadata.intake.interviewId:{$workflows.household.outputs.scheduleInterview}
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/total == 5
