arazzo: 1.1.0
info:
  title: A suggestion, from proposal to decision
  version: 1.0.0
  x-domain: intake
  description: |
    A caseworker interviews Rosa about her household's income. During the interview, the server proposes suggestions about things to ask, and the assistant proposes changes to her application. The caseworker accepts or dismisses each suggestion.
  x-actors:
    - id: caseworker
      name: The caseworker
      description: Interviews Rosa, and accepts or dismisses suggestions.
    - id: software
      name: The interview software
      description: Records the call, turns what's said into lines and saves them to the transcript.
    - id: assistant
      name: The assistant
      description: An AI model that reads the interview's transcript and proposes changes.
    - id: server
      name: The server
      description: Runs the contracts. In this demo, that's the mock server. The interview's state machine runs there, and proposes flags about Rosa's incomes when the interview starts and when they change.
sourceDescriptions:
  - name: intake
    url: ../domains/intake/intake-openapi.yaml
    type: openapi
  - name: suggestions
    url: ../base/domains/decision-support/decision-support-suggestions-openapi.yaml
    type: openapi
  - name: registries
    url: ../base/domains/platform/platform-registries-openapi.yaml
    type: openapi
  - name: events
    url: ../base/domains/platform/platform-events-openapi.yaml
    type: openapi
  - name: transcripts
    url: ../base/domains/communication/communication-transcripts-openapi.yaml
    type: openapi
components:
  parameters:
    worker:
      name: X-Caller-Id
      in: header
      value: worker-1
    assistant:
      name: X-Caller-Id
      in: header
      value: assistant-1
    application:
      name: applicationId
      in: path
      value: 11111111-1111-4111-8111-111111111111
workflows:
  - workflowId: beforeInterview
    summary: "Setup: Rosa's application before the interview"
    description: |
      - Where things stand before the interview: Rosa applied for SNAP and reported four incomes, wages, tips, self-employment income and a salary.
      - A pay stub on file shows a higher salary than she reported.
      - The caseworker schedules her interview.
    steps:
      - stepId: household
        description: |
          List Rosa's household members

          - Rosa applied for SNAP, and she is the only member of her household on the application.
        operationId: $sourceDescriptions.intake.listApplicationMembers
        parameters:
          - reference: $components.parameters.worker
          - reference: $components.parameters.application
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/total == 1
          - condition: $response.body#/items/0/firstName == 'Rosa'
      - stepId: incomes
        description: |
          List Rosa's incomes

          - Weekly wages that change from week to week, weekly tips paid in cash, monthly self-employment income, and a monthly salary of 1,100.
        operationId: $sourceDescriptions.intake.listApplicationIncomes
        parameters:
          - reference: $components.parameters.worker
          - reference: $components.parameters.application
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/total == 4
      - stepId: scheduleInterview
        x-actors:
          - caseworker
          - server
        description: |
          Schedule Rosa's interview

          - `status` is `scheduled`. The server sets a new interview to its initial state.
        operationId: $sourceDescriptions.intake.createApplicationInterview
        parameters:
          - reference: $components.parameters.worker
          - reference: $components.parameters.application
        requestBody:
          payload:
            scheduledFor: "2026-10-30"
        successCriteria:
          - condition: $statusCode == 201
          - condition: $response.body#/status == 'scheduled'
        outputs:
          id: $response.body#/id
    outputs:
      scheduleInterview: $steps.scheduleInterview.outputs.id
  - workflowId: interviewStarts
    summary: The interview starts
    description: |
      - When the caseworker starts the interview, the server checks Rosa's incomes and flags the kinds that are often reported wrong: wages that change from week to week, tips paid in cash, and self-employment income. Each flag is a suggestion for the caseworker.
      - Because the pay stub shows a higher salary, the server also suggests correcting it.
    dependsOn:
      - beforeInterview
    steps:
      - stepId: startInterview
        x-actors:
          - caseworker
          - server
        description: |
          Start the interview

          - The server moves it to `in_progress` and sets `startedAt`.
          - Its `start` action calls the `suggestFlags` procedure. That reads Rosa's incomes and pay stubs through the `interviewFlagsInputs` composition, and evaluates the `interviewFlags` rules.
          - The rules return the incomes behind each flag: `flagged.earnedIncomeVaries`, `flagged.cashOrSelfEmploymentIncome` and `flagged.incomeDiffersFromPayStub`. `suggestFlags` proposes a suggestion for each one.
        operationId: $sourceDescriptions.intake.startInterview
        parameters:
          - reference: $components.parameters.worker
          - reference: $components.parameters.application
          - name: interviewId
            in: path
            value: $workflows.beforeInterview.outputs.scheduleInterview
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'in_progress'
      - stepId: startTheTranscript
        x-actors:
          - caseworker
          - software
        description: |
          Start recording the interview

          - When the caseworker starts recording, the interview software starts a transcript of the interview and saves what's said to it, line by line.
          - `subjectType: interview` and `subjectId`, the interview's id, say which conversation the transcript records.
          - It uses the seeded `english` profile, which transcribes with a speech-to-text service, so `model` says which model writes the lines.
        operationId: $sourceDescriptions.transcripts.createTranscript
        parameters:
          - reference: $components.parameters.worker
        requestBody:
          payload:
            subjectType: interview
            subjectId: $workflows.beforeInterview.outputs.scheduleInterview
            profileId: 7a1e0c2d-0000-4000-8000-0000000000b1
            model: standard
            client: interview-assistant/0.1.0
            startedAt: "2026-11-03T10:00:00Z"
        successCriteria:
          - condition: $statusCode == 201
          - condition: $response.body#/status == 'recording'
        outputs:
          id: $response.body#/id
      - stepId: findTheTranscript
        description: |
          List the transcripts of Rosa's interview

          - `q` filters transcripts by `subjectId`, the interview's id. `total` is 1: the transcript started a moment ago.
        operationId: $sourceDescriptions.transcripts.listTranscripts
        parameters:
          - reference: $components.parameters.worker
          - name: q
            in: query
            value: subjectId:{$workflows.beforeInterview.outputs.scheduleInterview}
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/total == 1
          - condition: $response.body#/items/0/id == $steps.startTheTranscript.outputs.id
      - stepId: interviewSuggestions
        description: |
          List the suggestions the server proposed

          - `total` is 5. Each suggestion's `metadata.intake` holds the interview's id, the flag, and the id of the income it's about (`recordId`).
          - Wages: they have `amountVaries: true`, so they're flagged `earned-income-varies`. This suggestion is `kind: informing`: it has a `category` and names the record it's about (`subjectType`, `subjectId`). There's no change to make.
          - Tips: they have `amountVaries: true` and `paidInCash: true`, so they get two suggestions, one under `earned-income-varies` and one under `cash-or-self-employment-income`. Each category on a record is a separate suggestion.
          - Self-employment income: it has `source: self_employment`, so it's flagged `cash-or-self-employment-income`.
          - Salary: Rosa reported 1,100 a month, and a pay stub shows 1,250. This suggestion is `kind: operation`. Its `call` is `updateApplicationIncome` with `amount: 1250`, which runs if the caseworker accepts it. It has no `subjectId`, because the call identifies the record it changes.
          - `expiresAt` is one day after `createdAt`. The server didn't set one, so the default applies.
        operationId: $sourceDescriptions.suggestions.listSuggestions
        parameters:
          - reference: $components.parameters.worker
          - name: q
            in: query
            value: metadata.intake.interviewId:{$workflows.beforeInterview.outputs.scheduleInterview}
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/total == 5
          - context: $response.body
            condition: $.items[?@.subjectId == '11111111-1111-4111-8111-200000000001' && @.kind == 'informing' && @.category == 'earned-income-varies' && @.status == 'proposed']
            type: jsonpath
          - context: $response.body
            condition: $.items[?@.metadata.intake.recordId == '11111111-1111-4111-8111-200000000004' && @.kind == 'operation' && @.call.operationId == 'updateApplicationIncome' && @.call.requestBody.payload.amount == 1250]
            type: jsonpath
        outputs:
          wagesFlag:
            context: $response.body
            selector: $.items[?@.metadata.intake.recordId == '11111111-1111-4111-8111-200000000001'].id
            type: jsonpath
          salaryCorrection:
            context: $response.body
            selector: $.items[?@.metadata.intake.recordId == '11111111-1111-4111-8111-200000000004'].id
            type: jsonpath
    outputs:
      transcript: $steps.startTheTranscript.outputs.id
      salaryCorrection:
        context: $steps.interviewSuggestions.outputs.salaryCorrection
        selector: /0
        type: jsonpointer
      wagesFlag:
        context: $steps.interviewSuggestions.outputs.wagesFlag
        selector: /0
        type: jsonpointer
  - workflowId: assistantSuggests
    summary: The assistant suggests a change
    description: |
      - Rosa mentions child support that isn't on her application. The interview software saves her line to the transcript, and the assistant suggests adding the income, citing that line as evidence.
      - When it suggests the same change again, the second is rejected as a duplicate.
    dependsOn:
      - beforeInterview
      - interviewStarts
    steps:
      - stepId: rosaMentionsChildSupport
        x-actors:
          - software
        description: |
          Save what Rosa says about child support

          - Rosa says "I get child support too, two fifty a month." It isn't on her application.
          - The interview software saves the line as an entry in the interview's transcript, and the assistant reads it from there.
        operationId: $sourceDescriptions.transcripts.addTranscriptEntry
        parameters:
          - reference: $components.parameters.worker
          - name: transcriptId
            in: path
            value: $workflows.interviewStarts.outputs.transcript
          - name: Idempotency-Key
            in: header
            value: rosa-mentions-child-support
        requestBody:
          payload:
            kind: line
            startedAt: "2026-11-03T10:02:00Z"
            endedAt: "2026-11-03T10:02:04Z"
            text: I get child support too, two fifty a month.
            speaker: client
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          id: $response.body#/id
      - stepId: proposeChange
        x-actors:
          - assistant
        description: |
          Suggest adding child support Rosa didn't report

          - From Rosa's line, the assistant suggests adding the income. The `call` is `createApplicationIncome` with `source: unearned`, `amount: 250` and `frequency: monthly`.
          - `evidence` cites Rosa's line: `sourceType: transcript_entry` and the entry's id as `sourceId`. The server adds `links.source`, where the line is read. Evidence doesn't quote the line, so whoever reads it goes through the transcripts API and its access rules.
          - `201`, with `status: proposed`.
          - `fingerprint` is a hash of the change, used to detect duplicates. The values can't be recovered from it.
        operationId: $sourceDescriptions.suggestions.createSuggestion
        parameters:
          - reference: $components.parameters.assistant
        requestBody:
          payload:
            kind: operation
            call:
              operationId: createApplicationIncome
              parameters:
                - name: applicationId
                  in: path
                  value: 11111111-1111-4111-8111-111111111111
              requestBody:
                payload:
                  memberId: 11111111-1111-4111-8111-100000000001
                  source: unearned
                  amount: 250
                  frequency: monthly
            evidence:
              - sourceType: transcript_entry
                sourceId: $steps.rosaMentionsChildSupport.outputs.id
        successCriteria:
          - condition: $statusCode == 201
          - condition: $response.body#/status == 'proposed'
          - context: $response.body
            condition: $.evidence[?@.links.source]
            type: jsonpath
        outputs:
          id: $response.body#/id
          citedLine: $response.body#/evidence/0/sourceId
      - stepId: proposeItAgain
        x-actors:
          - assistant
        description: |
          Suggest the same change again

          - This time the suggestion cites no evidence.
          - `409`: an open suggestion already proposes this change. `details` gives that suggestion's id. The fingerprint, which is how duplicates are detected, covers only the change, not the evidence, so the same change is a duplicate whatever it cites.
        operationId: $sourceDescriptions.suggestions.createSuggestion
        parameters:
          - reference: $components.parameters.assistant
        requestBody:
          payload:
            kind: operation
            call:
              operationId: createApplicationIncome
              parameters:
                - name: applicationId
                  in: path
                  value: 11111111-1111-4111-8111-111111111111
              requestBody:
                payload:
                  memberId: 11111111-1111-4111-8111-100000000001
                  source: unearned
                  amount: 250
                  frequency: monthly
        successCriteria:
          - condition: $statusCode == 409
          - condition: $response.body#/details/0/id == $steps.proposeChange.outputs.id
    outputs:
      proposeChange: $steps.proposeChange.outputs.id
      citedLine: $steps.proposeChange.outputs.citedLine
  - workflowId: caseworkerDecides
    summary: The caseworker decides on suggestions
    description: |
      - The caseworker accepts the salary correction.
      - The caseworker reads the line the child support suggestion cites. Rosa then says the amount is 200, not 250. The caseworker's first attempt to accept it with the correct amount fails, because the edit leaves the amount empty by mistake. The second attempt, with 200 a month, succeeds.
      - The caseworker dismisses the wages flag and gives a reason.
    dependsOn:
      - beforeInterview
      - interviewStarts
      - assistantSuggests
    steps:
      - stepId: acceptTheCorrection
        x-actors:
          - caseworker
        description: |
          Accept the salary correction

          - The request has no body, so the proposed call runs unchanged.
          - `status` is `accepted`, and `performed` shows the call that ran: Rosa's salary is now 1,250, the amount on the pay stub.
        operationId: $sourceDescriptions.suggestions.acceptSuggestion
        parameters:
          - reference: $components.parameters.worker
          - name: suggestionId
            in: path
            value: $workflows.interviewStarts.outputs.salaryCorrection
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'accepted'
      - stepId: readTheCitedLine
        description: |
          Read the line the child support suggestion cites

          - To see why the assistant suggested the income, the caseworker reads the line the suggestion's `evidence` cites, at its `links.source`.
          - The server builds that link from the entry, so it includes the transcript the line is in. The suggestion alone is enough to find the line.
        operationId: $sourceDescriptions.transcripts.getTranscriptEntry
        parameters:
          - reference: $components.parameters.worker
          - name: transcriptId
            in: path
            value: $workflows.interviewStarts.outputs.transcript
          - name: entryId
            in: path
            value: $workflows.assistantSuggests.outputs.citedLine
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/text == 'I get child support too, two fifty a month.'
      - stepId: acceptWithABadEdit
        x-actors:
          - caseworker
        description: |
          Accept the child support, clearing the amount by mistake

          - Rosa says the child support is actually 200 a month, not 250. The caseworker edits the amount before accepting, and clears the field by mistake: `amount` is empty.
          - `422`: `createApplicationIncome` rejects an income with no amount, and Rosa's application doesn't change.
          - `details` holds the suggestion. Its `status` is now `refused`.
        operationId: $sourceDescriptions.suggestions.acceptSuggestion
        parameters:
          - reference: $components.parameters.worker
          - name: suggestionId
            in: path
            value: $workflows.assistantSuggests.outputs.proposeChange
        requestBody:
          payload:
            call:
              operationId: createApplicationIncome
              parameters:
                - name: applicationId
                  in: path
                  value: 11111111-1111-4111-8111-111111111111
              requestBody:
                payload:
                  memberId: 11111111-1111-4111-8111-100000000001
                  source: unearned
                  amount: null
                  frequency: monthly
        successCriteria:
          - condition: $statusCode == 422
          - condition: $response.body#/details/0/status == 'refused'
      - stepId: acceptWithAnEdit
        x-actors:
          - caseworker
        description: |
          Accept the child support with the amount corrected

          - The request's `call` has `amount: 200`, the amount Rosa gave.
          - `status` changes from `refused` to `accepted`. `performed` is the call that ran. `call` still holds what the assistant proposed, `amount: 250`.
        operationId: $sourceDescriptions.suggestions.acceptSuggestion
        parameters:
          - reference: $components.parameters.worker
          - name: suggestionId
            in: path
            value: $workflows.assistantSuggests.outputs.proposeChange
        requestBody:
          payload:
            call:
              operationId: createApplicationIncome
              parameters:
                - name: applicationId
                  in: path
                  value: 11111111-1111-4111-8111-111111111111
              requestBody:
                payload:
                  memberId: 11111111-1111-4111-8111-100000000001
                  source: unearned
                  amount: 200
                  frequency: monthly
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'accepted'
          - condition: $response.body#/performed/requestBody/payload/amount == 200
          - condition: $response.body#/call/requestBody/payload/amount == 250
      - stepId: incomeAdded
        description: |
          List Rosa's incomes again

          - `total` is 5. The new one is child support: `source: unearned`, `amount: 200`, `frequency: monthly`.
        operationId: $sourceDescriptions.intake.listApplicationIncomes
        parameters:
          - reference: $components.parameters.worker
          - reference: $components.parameters.application
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/total == 5
          - context: $response.body
            condition: $.items[?@.source == 'unearned' && @.amount == 200 && @.frequency == 'monthly']
            type: jsonpath
      - stepId: acceptedEvent
        description: |
          List the events for the accepted suggestion

          - `authid` is `worker-1`, the caseworker who accepted it. The suggestion itself doesn't store who decided it.
        operationId: $sourceDescriptions.events.listEvents
        parameters:
          - reference: $components.parameters.worker
          - name: subject
            in: query
            value: $workflows.assistantSuggests.outputs.proposeChange
          - name: type
            in: query
            value: decision-support.suggestion.accepted
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/items/0/authid == 'worker-1'
      - stepId: dismissTheWagesFlag
        x-actors:
          - caseworker
        description: |
          Dismiss the wages flag with a reason

          - The caseworker asked Rosa about her wages, and her pay stubs explain why they change.
          - `status` is `dismissed`, and the suggestion keeps the `reason`.
        operationId: $sourceDescriptions.suggestions.dismissSuggestion
        parameters:
          - reference: $components.parameters.worker
          - name: suggestionId
            in: path
            value: $workflows.interviewStarts.outputs.wagesFlag
        requestBody:
          payload:
            reason: Her pay stubs explain the changes.
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'dismissed'
          - condition: $response.body#/reason == 'Her pay stubs explain the changes.'
  - workflowId: assistantSuggestsAPatch
    summary: The assistant suggests a new household member through an editable composition
    description: |
      - Editable composition: `applicationDetails` is the application with its members and incomes, as one document that a JSON Patch changes. A new member and her income depend on each other, so the assistant proposes them together, as one change to that composition.
      - The suggestion is still `kind: operation`: its `call` is the composition's update, `updateApplicationDetails`, with the patch as its body.
      - Rosa mentions her daughter Maria, who works part time, and the interview software saves the line to the interview's transcript. The suggestion cites that line as evidence. The caseworker corrects Maria's income and accepts.
      - If the data changes after the assistant reads it, accepting its suggestion fails. The patch first checks the old value with a `test`, and that check no longer passes.
    dependsOn:
      - beforeInterview
      - interviewStarts
      - caseworkerDecides
    steps:
      - stepId: rosaMentionsMaria
        x-actors:
          - software
        description: |
          Save what Rosa says about Maria, who works part time

          - Rosa says "It's me and my two kids, and my oldest, Maria, works part time. She makes about 600 a month."
          - The interview software saves the line as an entry in the interview's transcript, and the assistant reads it from there.
        operationId: $sourceDescriptions.transcripts.addTranscriptEntry
        parameters:
          - reference: $components.parameters.worker
          - name: transcriptId
            in: path
            value: $workflows.interviewStarts.outputs.transcript
          - name: Idempotency-Key
            in: header
            value: rosa-mentions-maria
        requestBody:
          payload:
            kind: line
            startedAt: "2026-11-03T10:04:10Z"
            endedAt: "2026-11-03T10:04:16Z"
            text: It's me and my two kids, and my oldest, Maria, works part time. She makes about 600 a month.
            speaker: client
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          id: $response.body#/id
      - stepId: proposeTheHousehold
        x-actors:
          - assistant
        description: |
          Suggest adding Maria and her income in one change

          - From Rosa's line, the assistant learns that Maria lives with her and makes 600 a month.
          - The assistant makes up an id for Maria and puts it in the patch. The income in the same patch uses that id as its `memberId`, so it points at Maria even though she isn't saved yet.
          - The suggestion cites Rosa's line as evidence, twice: once with Maria's path in the patch, and once with her income's path, to say the line supports both changes.
          - `201`. The patch was checked against the application's current details, and nothing was saved. If the evidence `path` didn't match a change in the patch, it would get `422`.
        operationId: $sourceDescriptions.suggestions.createSuggestion
        parameters:
          - reference: $components.parameters.assistant
        requestBody:
          payload:
            kind: operation
            call:
              operationId: updateApplicationDetails
              parameters:
                - name: applicationId
                  in: path
                  value: 11111111-1111-4111-8111-111111111111
              requestBody:
                contentType: application/json-patch+json
                payload:
                  - op: add
                    path: /members/44444444-4444-4444-8444-000000000001
                    value:
                      firstName: Maria
                      lastName: Delgado
                      relationship: child
                  - op: add
                    path: /incomes/44444444-4444-4444-8444-000000000002
                    value:
                      memberId: 44444444-4444-4444-8444-000000000001
                      source: earned
                      amount: 600
                      frequency: monthly
            evidence:
              - sourceType: transcript_entry
                sourceId: $steps.rosaMentionsMaria.outputs.id
                path: /members/44444444-4444-4444-8444-000000000001
              - sourceType: transcript_entry
                sourceId: $steps.rosaMentionsMaria.outputs.id
                path: /incomes/44444444-4444-4444-8444-000000000002
        successCriteria:
          - condition: $statusCode == 201
          - condition: $response.body#/status == 'proposed'
          - condition: $response.body#/evidence/0/path == '/members/44444444-4444-4444-8444-000000000001'
        outputs:
          id: $response.body#/id
      - stepId: proposeItUnderNewIds
        x-actors:
          - assistant
        description: |
          Suggest Maria again, under different ids

          - The assistant proposes Maria and her income again. This time it makes up different ids for them.
          - `409`: it's a duplicate of the first suggestion, which `details` names. The fingerprint, which is how duplicates are detected, ignores the made-up ids of new records, so both suggestions have the same fingerprint.
        operationId: $sourceDescriptions.suggestions.createSuggestion
        parameters:
          - reference: $components.parameters.assistant
        requestBody:
          payload:
            kind: operation
            call:
              operationId: updateApplicationDetails
              parameters:
                - name: applicationId
                  in: path
                  value: 11111111-1111-4111-8111-111111111111
              requestBody:
                contentType: application/json-patch+json
                payload:
                  - op: add
                    path: /members/44444444-4444-4444-8444-000000000011
                    value:
                      firstName: Maria
                      lastName: Delgado
                      relationship: child
                  - op: add
                    path: /incomes/44444444-4444-4444-8444-000000000012
                    value:
                      memberId: 44444444-4444-4444-8444-000000000011
                      source: earned
                      amount: 600
                      frequency: monthly
        successCriteria:
          - condition: $statusCode == 409
          - condition: $response.body#/details/0/id == $steps.proposeTheHousehold.outputs.id
      - stepId: proposeTheIncomeAlone
        x-actors:
          - assistant
        description: |
          Suggest Maria's income without Maria

          - The patch adds an income for a member who isn't on the application and isn't added in the same patch.
          - `422`. To add a member and her income, put both in one patch.
        operationId: $sourceDescriptions.suggestions.createSuggestion
        parameters:
          - reference: $components.parameters.assistant
        requestBody:
          payload:
            kind: operation
            call:
              operationId: updateApplicationDetails
              parameters:
                - name: applicationId
                  in: path
                  value: 11111111-1111-4111-8111-111111111111
              requestBody:
                contentType: application/json-patch+json
                payload:
                  - op: add
                    path: /incomes/44444444-4444-4444-8444-000000000022
                    value:
                      memberId: 44444444-4444-4444-8444-000000000021
                      source: earned
                      amount: 600
                      frequency: monthly
        successCriteria:
          - condition: $statusCode == 422
      - stepId: previewAgainstTheDetails
        description: |
          Read the application's details before accepting

          - Rosa is in `members`. Maria isn't: proposing the suggestion saved nothing, and nothing is saved until someone accepts it.
        operationId: $sourceDescriptions.intake.getApplicationDetails
        parameters:
          - reference: $components.parameters.worker
          - reference: $components.parameters.application
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/members/11111111-1111-4111-8111-100000000001/firstName == 'Rosa'
      - stepId: acceptWithACorrectedIncome
        x-actors:
          - caseworker
        description: |
          Correct Maria's income and accept

          - Rosa says Maria makes 650 a month, not 600. The caseworker changes 600 to 650 and accepts. A correction can change values, but not which records or fields the patch changes.
          - `200`. Maria and her income were created in one request, made as the caseworker. `performed` has the corrected patch, and `call` still has the assistant's 600.
        operationId: $sourceDescriptions.suggestions.acceptSuggestion
        parameters:
          - reference: $components.parameters.worker
          - name: suggestionId
            in: path
            value: $steps.proposeTheHousehold.outputs.id
        requestBody:
          payload:
            call:
              operationId: updateApplicationDetails
              parameters:
                - name: applicationId
                  in: path
                  value: 11111111-1111-4111-8111-111111111111
              requestBody:
                contentType: application/json-patch+json
                payload:
                  - op: add
                    path: /members/44444444-4444-4444-8444-000000000001
                    value:
                      firstName: Maria
                      lastName: Delgado
                      relationship: child
                  - op: add
                    path: /incomes/44444444-4444-4444-8444-000000000002
                    value:
                      memberId: 44444444-4444-4444-8444-000000000001
                      source: earned
                      amount: 650
                      frequency: monthly
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'accepted'
          - condition: $response.body#/performed/requestBody/payload/1/value/amount == 650
          - condition: $response.body#/call/requestBody/payload/1/value/amount == 600
      - stepId: mariaAdded
        description: |
          Read the application's details again

          - Maria is in `members`, and her income of 650 is in `incomes`, with Maria's id as its `memberId`.
        operationId: $sourceDescriptions.intake.getApplicationDetails
        parameters:
          - reference: $components.parameters.worker
          - reference: $components.parameters.application
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/members/44444444-4444-4444-8444-000000000001/firstName == 'Maria'
          - condition: $response.body#/incomes/44444444-4444-4444-8444-000000000002/amount == 650
      - stepId: mariaCreatedByTheCaseworker
        description: |
          List the events for Maria's creation

          - `authid` is `worker-1`, the caseworker who accepted, not the assistant who proposed. Maria was created by `createApplicationMember`, so its checks ran and its event was sent, as if the caseworker had added her by hand.
        operationId: $sourceDescriptions.events.listEvents
        parameters:
          - reference: $components.parameters.worker
          - name: subject
            in: query
            value: 44444444-4444-4444-8444-000000000001
          - name: type
            in: query
            value: intake.application_member.created
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/items/0/authid == 'worker-1'
      - stepId: rosaGivesHerTips
        x-actors:
          - software
        description: |
          Save what Rosa says about her tips

          - Rosa says "My tips are more like 135 a week."
        operationId: $sourceDescriptions.transcripts.addTranscriptEntry
        parameters:
          - reference: $components.parameters.worker
          - name: transcriptId
            in: path
            value: $workflows.interviewStarts.outputs.transcript
          - name: Idempotency-Key
            in: header
            value: rosa-gives-her-tips
        requestBody:
          payload:
            kind: line
            startedAt: "2026-11-03T10:05:00Z"
            endedAt: "2026-11-03T10:05:03Z"
            text: My tips are more like 135 a week.
            speaker: client
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          id: $response.body#/id
      - stepId: proposeATipsCorrection
        x-actors:
          - assistant
        description: |
          Suggest correcting Rosa's tips

          - The application's details have Rosa's tips as 120 a week, and her line says 135. The assistant's patch first checks that the tips are still 120 (`test`), then changes them to 135 (`replace`).
          - The suggestion cites Rosa's line as evidence, with the `path` of the change it supports.
          - Every `replace` must have a `test` right before it, checking the value the assistant read.
        operationId: $sourceDescriptions.suggestions.createSuggestion
        parameters:
          - reference: $components.parameters.assistant
        requestBody:
          payload:
            kind: operation
            call:
              operationId: updateApplicationDetails
              parameters:
                - name: applicationId
                  in: path
                  value: 11111111-1111-4111-8111-111111111111
              requestBody:
                contentType: application/json-patch+json
                payload:
                  - op: test
                    path: /incomes/11111111-1111-4111-8111-200000000002/amount
                    value: 120
                  - op: replace
                    path: /incomes/11111111-1111-4111-8111-200000000002/amount
                    value: 135
            evidence:
              - sourceType: transcript_entry
                sourceId: $steps.rosaGivesHerTips.outputs.id
                path: /incomes/11111111-1111-4111-8111-200000000002/amount
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          id: $response.body#/id
      - stepId: changeTheTipsByHand
        x-actors:
          - caseworker
          - server
        description: |
          Change Rosa's tips before deciding on the suggestion

          - Before anyone decides on the suggestion, the caseworker sets the tips to 130 a week.
        operationId: $sourceDescriptions.intake.updateApplicationIncome
        parameters:
          - reference: $components.parameters.worker
          - reference: $components.parameters.application
          - name: incomeId
            in: path
            value: 11111111-1111-4111-8111-200000000002
        requestBody:
          payload:
            amount: 130
        successCriteria:
          - condition: $statusCode == 200
      - stepId: acceptTheStaleCorrection
        x-actors:
          - caseworker
        description: |
          Accept the tips correction

          - `409`: the patch checks for 120, but the tips are now 130, so nothing in the patch was saved. The tips stay 130.
          - The suggestion's `status` is now `refused`. `details` holds the suggestion.
        operationId: $sourceDescriptions.suggestions.acceptSuggestion
        parameters:
          - reference: $components.parameters.worker
          - name: suggestionId
            in: path
            value: $steps.proposeATipsCorrection.outputs.id
        successCriteria:
          - condition: $statusCode == 409
          - condition: $response.body#/details/0/status == 'refused'
  - workflowId: answersChange
    summary: The caseworker records Rosa's answers
    description: |
      - Rosa says her wages are different, and the caseworker updates them. The wages flag still applies, so the server proposes it again, and it's rejected because the caseworker dismissed it.
      - Rosa explains that her self-employment income is a gift, and the caseworker changes its source. The server expires the flag on that income.
    dependsOn:
      - beforeInterview
      - interviewStarts
      - assistantSuggests
      - caseworkerDecides
    steps:
      - stepId: changeWagesAgain
        x-actors:
          - caseworker
          - server
        description: |
          Update Rosa's wages

          - Rosa says her wages are closer to 320 a week, and the caseworker sets `amount` to 320. Her wages still change from week to week.
        operationId: $sourceDescriptions.intake.updateApplicationIncome
        parameters:
          - reference: $components.parameters.worker
          - reference: $components.parameters.application
          - name: incomeId
            in: path
            value: 11111111-1111-4111-8111-200000000001
        requestBody:
          payload:
            amount: 320
        successCriteria:
          - condition: $statusCode == 200
      - stepId: correctTheSideIncome
        x-actors:
          - caseworker
          - server
        description: |
          Record that Rosa's side income is a gift

          - Rosa explains that the 400 a month is help from her sister, not self-employment, and the caseworker sets `source` to `unearned`.
          - The change starts the interview's reaction to `intake.application_income.updated`, which calls `suggestFlags` again. `flagged.cashOrSelfEmploymentIncome` no longer lists this income.
        operationId: $sourceDescriptions.intake.updateApplicationIncome
        parameters:
          - reference: $components.parameters.worker
          - reference: $components.parameters.application
          - name: incomeId
            in: path
            value: 11111111-1111-4111-8111-200000000003
        requestBody:
          payload:
            source: unearned
        successCriteria:
          - condition: $statusCode == 200
      - stepId: clearedFlagExpired
        description: |
          List the expired suggestions about that income

          - `q` finds the suggestion about this income with `status:expired`.
          - The income isn't self-employment anymore, so the flag no longer applies, and the server expired the suggestion.
        operationId: $sourceDescriptions.suggestions.listSuggestions
        parameters:
          - reference: $components.parameters.worker
          - name: q
            in: query
            value: metadata.intake.recordId:11111111-1111-4111-8111-200000000003 status:expired
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/total == 1
        onFailure:
          - name: waitForTheInterview
            type: retry
            retryAfter: 0.05
            retryLimit: 20
      - stepId: nothingNew
        description: |
          List the interview's suggestions

          - `total` is still 5. Her wages still change from week to week, so the server proposes the wages flag again. That proposal is rejected with 409, because the caseworker dismissed the same suggestion.
        operationId: $sourceDescriptions.suggestions.listSuggestions
        parameters:
          - reference: $components.parameters.worker
          - name: q
            in: query
            value: metadata.intake.interviewId:{$workflows.beforeInterview.outputs.scheduleInterview}
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/total == 5
  - workflowId: interviewEnds
    summary: The caseworker completes the interview
    description: |
      - When the caseworker completes the interview, the server expires the suggestions nobody decided on.
      - Changes to Rosa's incomes after that create no suggestions.
    dependsOn:
      - beforeInterview
      - answersChange
    steps:
      - stepId: completeInterview
        x-actors:
          - caseworker
          - server
        description: |
          Complete the interview

          - The server moves it to `completed` and sets `completedAt`.
        operationId: $sourceDescriptions.intake.completeInterview
        parameters:
          - reference: $components.parameters.worker
          - reference: $components.parameters.application
          - name: interviewId
            in: path
            value: $workflows.beforeInterview.outputs.scheduleInterview
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'completed'
      - stepId: nothingWaiting
        description: |
          List the interview's open suggestions

          - `q` limits the list to this interview's suggestions with `status:proposed`.
          - `total` is 0. Nobody decided on the two tips suggestions, so the server expired them when the caseworker completed the interview.
        operationId: $sourceDescriptions.suggestions.listSuggestions
        parameters:
          - reference: $components.parameters.worker
          - name: q
            in: query
            value: metadata.intake.interviewId:{$workflows.beforeInterview.outputs.scheduleInterview} status:proposed
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/total == 0
      - stepId: changeAfterwards
        x-actors:
          - caseworker
        description: |
          Update Rosa's tips after the interview

          - Rosa calls to say her tips are about 140 a week, and the caseworker sets `amount` to 140.
        operationId: $sourceDescriptions.intake.updateApplicationIncome
        parameters:
          - reference: $components.parameters.worker
          - reference: $components.parameters.application
          - name: incomeId
            in: path
            value: 11111111-1111-4111-8111-200000000002
        requestBody:
          payload:
            amount: 140
        successCriteria:
          - condition: $statusCode == 200
      - stepId: stillFive
        description: |
          List the interview's suggestions again

          - `total` is still 5. The interview is completed, so the server no longer reacts to Rosa's income changes for it.
        operationId: $sourceDescriptions.suggestions.listSuggestions
        parameters:
          - reference: $components.parameters.worker
          - name: q
            in: query
            value: metadata.intake.interviewId:{$workflows.beforeInterview.outputs.scheduleInterview}
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/total == 5
