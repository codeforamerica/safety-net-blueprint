openapi: 3.1.0
x-relationship:
  type: external
info:
  title: Transcription Session Adapter API
  version: 0.1.0
  x-domain: communication
  x-capability: transcripts
  x-status: alpha
  x-visibility: external
  description: |
    How a transcription session reaches one transcription service: the
    session calls it to start, pause and stop streaming, and it publishes the
    session's events with `publishEvent`. Requests extend AdapterRequest, so
    the adapter echoes metadata back unchanged.
servers:
  - url: https://adapter.example.com
    description: Production server
  - url: http://localhost:1080
    description: Local development server
tags:
  - name: Streaming
    description: The streaming part. Starting, pausing and stopping the stream, called by the session.
  - name: Credentials
    description: The credentials part. Issuing what the streaming part connects with.
paths:
  /streams:
    post:
      summary: Start streaming for a session
      description: |
        Called by the session when it starts, and again when it resumes.
        Answers at once; the work goes on after it. The adapter gets a
        credential from requestCredentials when its service takes one,
        connects to the service, streams the audio, and publishes the
        session's events as things happen, each with the session's id as its
        subject and partition key, so one session's events stay in order.
        What it sends is
        communication-transcription-sessions-adapter-asyncapi.yaml:

        - `connected` when the connection opens, with the stretch nothing
          was captured in as `gap`: after a reconnect, from when it dropped;
          on the first connection, when `lastActivityAt` is given, from then.
        - `disconnected` when it drops. It then reconnects with a fresh
          credential and publishes `connected` again.
        - `failed` when it gives up connecting.
        - `line_updated` for a line in progress, and `line_finished` once,
          for each finished line. A line is published again after a network
          error, with the same key; the transcript keeps it once, and its
          entry's created event names the `line_finished` it came from as its
          cause (`causationid`).
        - `ended` after stopStream, once the last line is published.

        It renews its credential before it runs out, the same way.
      operationId: startStream
      tags:
        - Streaming
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StreamRequest"
      responses:
        "202":
          description: Starting. What happens is published as the session's events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamResponse"
        "400":
          $ref: ../../components/responses.yaml#/BadRequest
        "500":
          $ref: ../../components/responses.yaml#/InternalError
  /streams/{transcriptionSessionId}/pause:
    post:
      summary: Pause streaming
      description: |
        Called by the session when the conversation goes off the record.
        The adapter stops sending audio and closes the connection, so
        no audio goes to the service. A line already finished may still be
        published. Starting again is startStream.
      operationId: pauseStream
      tags:
        - Streaming
      parameters:
        - $ref: "#/components/parameters/TranscriptionSessionIdParam"
      requestBody:
        content:
          application/json:
            schema:
              $ref: ../../components/adapter.yaml#/AdapterRequest
      responses:
        "202":
          description: Pausing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamResponse"
        "404":
          $ref: ../../components/responses.yaml#/NotFound
        "500":
          $ref: ../../components/responses.yaml#/InternalError
  /streams/{transcriptionSessionId}/stop:
    post:
      summary: Stop streaming
      description: |
        Called by the session when the conversation is over. The adapter
        sends the end of the audio, waits for the last text, publishes the
        last `line_finished`, closes the connection, and publishes `ended`.
        With no connection open, paused or disconnected, it publishes
        `ended` at once.
      operationId: stopStream
      tags:
        - Streaming
      parameters:
        - $ref: "#/components/parameters/TranscriptionSessionIdParam"
      requestBody:
        content:
          application/json:
            schema:
              $ref: ../../components/adapter.yaml#/AdapterRequest
      responses:
        "202":
          description: Stopping. `ended` is published when it's done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamResponse"
        "404":
          $ref: ../../components/responses.yaml#/NotFound
        "500":
          $ref: ../../components/responses.yaml#/InternalError
  /credentials:
    post:
      summary: Request credentials for a transcription service
      description: |
        Answers with where the streaming part connects and a credential
        that starts one connection, for the service the request names. Every
        service fits the one answer: a URL that may carry the credential, as
        Amazon Transcribe's presigned URL does, or a token, as ElevenLabs,
        Deepgram and AssemblyAI issue.

        Called by the streaming part. Asked again, it issues a fresh
        credential: that is how the streaming part renews one, and how it
        reconnects. Check the caller's sign-in before
        issuing one: the credential spends the state's account with the service.
      operationId: requestCredentials
      security:
        - callerId: []
      tags:
        - Credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsRequest"
      responses:
        "200":
          description: Where and how the streaming part connects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialsResponse"
              example:
                metadata:
                  transcriptionSessionId: 7a1e0c2d-0000-4000-8000-0000000000c9
                  transcriptId: 7a1e0c2d-0000-4000-8000-0000000000c1
                provider: elevenlabs-scribe
                protocol: websocket
                url: wss://api.elevenlabs.io/v1/speech-to-text/realtime
                accessToken: sutkn_example
                tokenType: Bearer
                expiresIn: 900
                connectionParameters:
                  model_id: scribe_v2_realtime
                  language_code: en
        "400":
          $ref: ../../components/responses.yaml#/BadRequest
        "401":
          $ref: ../../components/responses.yaml#/Unauthorized
        "422":
          description: |
            The service can't take what the request asks for — several languages for a service that takes one and can't detect among them, say, or an audio encoding it doesn't accept — named in details.
          content:
            application/json:
              schema:
                $ref: ../../components/responses.yaml#/Error
        "500":
          $ref: ../../components/responses.yaml#/InternalError
components:
  parameters:
    TranscriptionSessionIdParam:
      name: transcriptionSessionId
      in: path
      required: true
      description: The session being streamed for.
      schema:
        type: string
        format: uuid
  securitySchemes:
    callerId:
      $ref: ../../components/security-schemes.yaml#/callerId
  schemas:
    StreamRequest:
      description: |
        What to stream for: the session and its transcript, whose ids the adapter puts on the events it publishes, and what its credential is requested for, from the transcript and its profile.
      allOf:
        - $ref: ../../components/adapter.yaml#/AdapterRequest
        - type: object
          required:
            - transcriptionSessionId
            - transcriptId
            - provider
          properties:
            transcriptionSessionId:
              type: string
              format: uuid
              description: The session, the subject of every event the adapter publishes.
              x-relationship:
                resource: TranscriptionSession
                style: links-only
            transcriptId:
              type: string
              format: uuid
              description: The session's transcript, on every event the adapter publishes.
              x-relationship:
                resource: Transcript
                style: links-only
            provider:
              type: string
              description: The transcription service, an entry of the transcription-services registry.
              example: elevenlabs-scribe
              enum:
                - assemblyai
                - aws-transcribe
                - azure-speech
                - deepgram
                - elevenlabs-scribe
                - fake-secured
                - gladia
                - google-cloud-speech
                - google-gemini-live
                - none
                - openai-realtime
                - soniox
                - speechmatics
                - whisper
              x-enum-source:
                registry: transcription-services
            model:
              type: string
              description: The service's model, from the transcript.
              example: scribe_v2_realtime
            languages:
              type: array
              minItems: 1
              items:
                $ref: ../../schemas/enums.yaml#/$defs/Language
              description: The languages the conversation may be in, from the transcript's profile.
            lastActivityAt:
              type: string
              format: date-time
              description: |
                When a session carries on a transcript that's still recording, when the transcript last heard from anyone. The adapter reports from then to its first connection as a gap.
            links:
              type: object
              readOnly: true
              description: Related resource links.
              properties:
                transcriptionSession:
                  type: string
                  format: uri-reference
                  description: Link to the related TranscriptionSession resource.
                transcript:
                  type: string
                  format: uri-reference
                  description: Link to the related Transcript resource.
    StreamResponse:
      description: The request's metadata, echoed back.
      allOf:
        - $ref: ../../components/adapter.yaml#/AdapterResponse
      example:
        metadata: {}
    CredentialsRequest:
      description: |
        What the service needs to issue a credential: the service, model and languages the adapter was started with, and the audio and protocols the streaming part streams with.
      allOf:
        - $ref: ../../components/adapter.yaml#/AdapterRequest
        - type: object
          required:
            - provider
            - audio
            - protocols
          properties:
            provider:
              type: string
              description: The transcription service, an entry of the transcription-services registry.
              example: elevenlabs-scribe
              enum:
                - assemblyai
                - aws-transcribe
                - azure-speech
                - deepgram
                - elevenlabs-scribe
                - fake-secured
                - gladia
                - google-cloud-speech
                - google-gemini-live
                - none
                - openai-realtime
                - soniox
                - speechmatics
                - whisper
              x-enum-source:
                registry: transcription-services
            model:
              type: string
              description: The service's model, for a service that fixes it when issuing the credential.
              example: scribe_v2_realtime
            languages:
              type: array
              minItems: 1
              items:
                $ref: ../../schemas/enums.yaml#/$defs/Language
              description: |
                The languages the conversation may be in. The adapter maps them to what its service takes — one, a list, or none to detect — and answers 422 when it can't. Absent, the service detects the language, if it can.
              example:
                - en-US
                - es-US
            audio:
              $ref: "#/components/schemas/AudioFormat"
            protocols:
              type: array
              minItems: 1
              uniqueItems: true
              items:
                $ref: "#/components/schemas/StreamProtocol"
              description: The protocols the streaming part can connect over. The adapter answers with one of them.
    CredentialsResponse:
      description: Where and how the streaming part connects, with metadata echoed back.
      unevaluatedProperties: false
      allOf:
        - $ref: ../../components/adapter.yaml#/AdapterResponse
        - $ref: "#/components/schemas/StreamConnectionFields"
    AudioEncoding:
      type: string
      description: |
        How the audio is encoded, by Google Cloud Speech-to-Text's encoding names in the blueprint's casing, which fix the bit depth: linear16 is 16-bit signed little-endian PCM.
      enum:
        - linear16
        - flac
        - mulaw
        - alaw
        - amr
        - amr_wb
        - ogg_opus
        - webm_opus
        - speex_with_header_byte
        - mp3
    AudioFormat:
      type: object
      description: |
        The audio the software will send. Some services fix it into the credential — Amazon Transcribe signs the sample rate into its URL — so the software says it before connecting, in a format its service takes.
      additionalProperties: false
      required:
        - encoding
        - sampleRateHertz
        - channelCount
      properties:
        encoding:
          $ref: "#/components/schemas/AudioEncoding"
        sampleRateHertz:
          type: integer
          minimum: 8000
          description: Samples per second, e.g. 16000.
          example: 16000
        channelCount:
          type: integer
          minimum: 1
          description: |
            Channels in the audio. One means the service tells speakers apart by voice; more, that each speaker is on a channel of their own, as a phone call recorded with each side on its own channel is.
          example: 1
    StreamProtocol:
      type: string
      description: How the software connects to the service.
      enum:
        - websocket
        - webrtc
    StreamConnectionFields:
      type: object
      description: |
        How the software connects to its transcription service: where, over what, and with what credential, named as OAuth 2.0's token response names it (RFC 6749 §5.1) in the blueprint's camelCase. The software's adapter for the service knows where the credential and the settings go on connecting.
      required:
        - provider
        - protocol
        - url
        - expiresIn
      dependentRequired:
        accessToken:
          - tokenType
      properties:
        provider:
          type: string
          description: The transcription service, as the transcript's profile names it.
          example: elevenlabs-scribe
          enum:
            - assemblyai
            - aws-transcribe
            - azure-speech
            - deepgram
            - elevenlabs-scribe
            - fake-secured
            - gladia
            - google-cloud-speech
            - google-gemini-live
            - none
            - openai-realtime
            - soniox
            - speechmatics
            - whisper
          x-enum-source:
            registry: transcription-services
        protocol:
          $ref: "#/components/schemas/StreamProtocol"
        url:
          type: string
          format: uri
          description: |
            Where to connect. It may carry the credential itself, as Amazon Transcribe's presigned URL does.
          example: wss://api.elevenlabs.io/v1/speech-to-text/realtime
        accessToken:
          type: string
          description: |
            The short-lived credential to present on connecting. Absent when the URL carries it.
        tokenType:
          type: string
          description: The kind of credential accessToken is, as OAuth names it.
          example: Bearer
        expiresIn:
          type: integer
          minimum: 1
          description: |
            Seconds from now until the credential can no longer start a connection. Asking again before then is how a credential is renewed.
          example: 900
        connectionParameters:
          type: object
          additionalProperties: true
          description: |
            Settings the server chose that the software sends on connecting, in its service's own names — the model and language, say — for a service that takes them then rather than when the credential is issued.
          example:
            model_id: scribe_v2_realtime
            language_code: en
