  communication.transcription_session.failed:
    address: communication.transcription_session.failed
    messages:
      CommunicationTranscriptionSessionFailed:
        $ref: "#/components/messages/CommunicationTranscriptionSessionFailed"
  communication.transcription_session.line_updated:
    address: communication.transcription_session.line_updated
    messages:
      CommunicationTranscriptionSessionLineUpdated:
        $ref: "#/components/messages/CommunicationTranscriptionSessionLineUpdated"
  communication.transcription_session.line_added:
    address: communication.transcription_session.line_added
    messages:
      CommunicationTranscriptionSessionLineAdded:
        $ref: "#/components/messages/CommunicationTranscriptionSessionLineAdded"
  communication.transcript.paused:
    $ref: ./communication-transcripts-events-asyncapi.yaml#/channels/communication.transcript.paused
  communication.transcript.closed:
    $ref: ./communication-transcripts-events-asyncapi.yaml#/channels/communication.transcript.closed
operations:
  sendCommunicationTranscriptionSessionCreated:
    action: send
    channel:
      $ref: "#/channels/communication.transcription_session.created"
    messages:
      - $ref: "#/channels/communication.transcription_session.created/messages/CommunicationTranscriptionSessionCreated"
  sendCommunicationTranscriptionSessionConnecting:
    action: send
    channel:
      $ref: "#/channels/communication.transcription_session.connecting"
    messages:
      - $ref: "#/channels/communication.transcription_session.connecting/messages/CommunicationTranscriptionSessionConnecting"
  sendCommunicationTranscriptionSessionConnected:
    action: send
    channel:
      $ref: "#/channels/communication.transcription_session.connected"
    messages:
      - $ref: "#/channels/communication.transcription_session.connected/messages/CommunicationTranscriptionSessionConnected"
  sendCommunicationTranscriptionSessionDisconnected:
    action: send
    channel:
      $ref: "#/channels/communication.transcription_session.disconnected"
    messages:
      - $ref: "#/channels/communication.transcription_session.disconnected/messages/CommunicationTranscriptionSessionDisconnected"
  sendCommunicationTranscriptionSessionPaused:
    action: send
    channel:
      $ref: "#/channels/communication.transcription_session.paused"
    messages:
      - $ref: "#/channels/communication.transcription_session.paused/messages/CommunicationTranscriptionSessionPaused"
  sendCommunicationTranscriptionSessionStopping:
    action: send
    channel:
      $ref: "#/channels/communication.transcription_session.stopping"
    messages:
      - $ref: "#/channels/communication.transcription_session.stopping/messages/CommunicationTranscriptionSessionStopping"
  sendCommunicationTranscriptionSessionClosed:
    action: send
    channel:
      $ref: "#/channels/communication.transcription_session.closed"
    messages:
      - $ref: "#/channels/communication.transcription_session.closed/messages/CommunicationTranscriptionSessionClosed"
  sendCommunicationTranscriptionSessionFailed:
    action: send
    channel:
      $ref: "#/channels/communication.transcription_session.failed"
    messages:
      - $ref: "#/channels/communication.transcription_session.failed/messages/CommunicationTranscriptionSessionFailed"
  sendCommunicationTranscriptionSessionLineUpdated:
    action: send
    channel:
      $ref: "#/channels/communication.transcription_session.line_updated"
    messages:
      - $ref: "#/channels/communication.transcription_session.line_updated/messages/CommunicationTranscriptionSessionLineUpdated"
  sendCommunicationTranscriptionSessionLineAdded:
    action: send
    channel:
      $ref: "#/channels/communication.transcription_session.line_added"
    messages:
