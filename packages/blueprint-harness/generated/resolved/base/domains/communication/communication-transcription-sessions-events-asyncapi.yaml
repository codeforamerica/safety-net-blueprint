components:
  messages:
    CommunicationTranscriptionSessionCreated:
      name: communication.transcription_session.created
      summary: A TranscriptionSession was created. Carries the record as created.
      payload:
        schemaFormat: application/vnd.oai.openapi;version=3.1.0
        schema:
          $ref: "#/components/schemas/CommunicationTranscriptionSessionCreatedEvent"
    CommunicationTranscriptionSessionConnecting:
      name: communication.transcription_session.connecting
      summary: The software is getting where to connect and opening the connection.
      payload:
        schemaFormat: application/vnd.oai.openapi;version=3.1.0
        schema:
          $ref: "#/components/schemas/CommunicationTranscriptionSessionConnectingEvent"
    CommunicationTranscriptionSessionConnected:
      name: communication.transcription_session.connected
      summary: The connection to the service is open.
      payload:
        schemaFormat: application/vnd.oai.openapi;version=3.1.0
        schema:
          $ref: "#/components/schemas/CommunicationTranscriptionSessionConnectedEvent"
    CommunicationTranscriptionSessionDisconnected:
      name: communication.transcription_session.disconnected
      summary: The connection dropped; the software is trying again.
      payload:
        schemaFormat: application/vnd.oai.openapi;version=3.1.0
        schema:
          $ref: "#/components/schemas/CommunicationTranscriptionSessionDisconnectedEvent"
    CommunicationTranscriptionSessionPaused:
      name: communication.transcription_session.paused
      summary: Off the record. The software closes the connection.
      payload:
        schemaFormat: application/vnd.oai.openapi;version=3.1.0
        schema:
          $ref: "#/components/schemas/CommunicationTranscriptionSessionPausedEvent"
    CommunicationTranscriptionSessionStopping:
      name: communication.transcription_session.stopping
      summary: Stop was asked for. The software sends the end of the audio and waits for the last text.
      payload:
        schemaFormat: application/vnd.oai.openapi;version=3.1.0
        schema:
          $ref: "#/components/schemas/CommunicationTranscriptionSessionStoppingEvent"
    CommunicationTranscriptionSessionClosed:
      name: communication.transcription_session.closed
      summary: The session is done and the transcript closed.
      payload:
        schemaFormat: application/vnd.oai.openapi;version=3.1.0
        schema:
          $ref: "#/components/schemas/CommunicationTranscriptionSessionClosedEvent"
    CommunicationTranscriptionSessionFailed:
      name: communication.transcription_session.failed
      summary: The software gave up connecting or reconnecting. The transcript is still open.
      payload:
        schemaFormat: application/vnd.oai.openapi;version=3.1.0
        schema:
          $ref: "#/components/schemas/CommunicationTranscriptionSessionFailedEvent"
    CommunicationTranscriptionSessionLineUpdated:
      name: communication.transcription_session.line_updated
      summary: A line in progress, to show. Not kept.
      payload:
        schemaFormat: application/vnd.oai.openapi;version=3.1.0
        schema:
          $ref: "#/components/schemas/CommunicationTranscriptionSessionLineUpdatedEvent"
    CommunicationTranscriptionSessionLineAdded:
      name: communication.transcription_session.line_added
      summary: A finished line was added to the transcript.
      payload:
        schemaFormat: application/vnd.oai.openapi;version=3.1.0
        schema:
          $ref: "#/components/schemas/CommunicationTranscriptionSessionLineAddedEvent"
  schemas:
    CommunicationTranscriptionSessionCreatedEvent:
      schemaFormat: application/vnd.oai.openapi;version=3.1.0
      schema:
        allOf:
          - $ref: ../../schemas/events.yaml#/$defs/Event
          - type: object
            properties:
              type:
                type: string
                const: communication.transcription_session.created
              data:
                $ref: ./communication-transcription-sessions-openapi.yaml#/components/schemas/TranscriptionSession
    CommunicationTranscriptionSessionConnectingEvent:
      schemaFormat: application/vnd.oai.openapi;version=3.1.0
      schema:
        allOf:
          - $ref: ../../schemas/events.yaml#/$defs/Event
          - type: object
            properties:
              type:
                type: string
                const: communication.transcription_session.connecting
    CommunicationTranscriptionSessionConnectedEvent:
      schemaFormat: application/vnd.oai.openapi;version=3.1.0
      schema:
        allOf:
          - $ref: ../../schemas/events.yaml#/$defs/Event
          - type: object
            properties:
              type:
                type: string
                const: communication.transcription_session.connected
    CommunicationTranscriptionSessionDisconnectedEvent:
      schemaFormat: application/vnd.oai.openapi;version=3.1.0
      schema:
        allOf:
          - $ref: ../../schemas/events.yaml#/$defs/Event
          - type: object
            properties:
              type:
                type: string
                const: communication.transcription_session.disconnected
    CommunicationTranscriptionSessionPausedEvent:
      schemaFormat: application/vnd.oai.openapi;version=3.1.0
      schema:
        allOf:
          - $ref: ../../schemas/events.yaml#/$defs/Event
          - type: object
            properties:
              type:
                type: string
                const: communication.transcription_session.paused
    CommunicationTranscriptionSessionStoppingEvent:
      schemaFormat: application/vnd.oai.openapi;version=3.1.0
      schema:
        allOf:
          - $ref: ../../schemas/events.yaml#/$defs/Event
          - type: object
            properties:
              type:
                type: string
                const: communication.transcription_session.stopping
    CommunicationTranscriptionSessionClosedEvent:
      schemaFormat: application/vnd.oai.openapi;version=3.1.0
      schema:
        allOf:
          - $ref: ../../schemas/events.yaml#/$defs/Event
          - type: object
            properties:
              type:
                type: string
                const: communication.transcription_session.closed
    CommunicationTranscriptionSessionFailedEvent:
      schemaFormat: application/vnd.oai.openapi;version=3.1.0
      schema:
        allOf:
          - $ref: ../../schemas/events.yaml#/$defs/Event
          - type: object
            properties:
              type:
                type: string
                const: communication.transcription_session.failed
    CommunicationTranscriptionSessionLineUpdatedEvent:
      schemaFormat: application/vnd.oai.openapi;version=3.1.0
      schema:
        allOf:
          - $ref: ../../schemas/events.yaml#/$defs/Event
          - type: object
            properties:
              type:
                type: string
                const: communication.transcription_session.line_updated
              data:
                type: object
                required:
                  - key
                  - text
                  - startedAt
                properties:
                  key:
                    type: string
                    description: The line's key
                    the same on every update and on the finished line.: null
                  text:
                    type: string
                  speaker:
                    type: string
                    description: Who's speaking
                    as the transcript's Speaker names it.: null
                  startedAt:
                    type: string
                    format: date-time
                    description: When it began
                    by the client's clock.: null
    CommunicationTranscriptionSessionLineAddedEvent:
      schemaFormat: application/vnd.oai.openapi;version=3.1.0
      schema:
        allOf:
          - $ref: ../../schemas/events.yaml#/$defs/Event
          - type: object
            properties:
              type:
                type: string
                const: communication.transcription_session.line_added
              data:
                type: object
                required:
                  - key
                  - entryId
                properties:
                  key:
                    type: string
                    description: The line's key
                    as the client gave it.: null
                  entryId:
                    type: string
                    format: uuid
                    description: The transcript entry the line became.
                    x-relationship:
                      resource: TranscriptEntry
