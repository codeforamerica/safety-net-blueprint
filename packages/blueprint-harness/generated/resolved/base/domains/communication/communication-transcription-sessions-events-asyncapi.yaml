      CommunicationTranscriptionSessionStopping:
        $ref: "#/components/messages/CommunicationTranscriptionSessionStopping"
  communication.transcription_session.closed:
    address: communication.transcription_session.closed
    messages:
      CommunicationTranscriptionSessionClosed:
        $ref: "#/components/messages/CommunicationTranscriptionSessionClosed"
  communication.transcript.paused:
    $ref: ./communication-transcripts-events-asyncapi.yaml#/channels/communication.transcript.paused
  communication.transcript.closed:
    $ref: ./communication-transcripts-events-asyncapi.yaml#/channels/communication.transcript.closed
