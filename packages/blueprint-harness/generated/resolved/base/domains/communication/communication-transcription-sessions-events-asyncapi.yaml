asyncapi: 3.0.0
info:
  title: Transcription sessions events
  version: 0.1.0
  x-domain: communication
  x-capability: transcripts
  description: The events communication-transcription-sessions-openapi.yaml and the state machines attached to its resources send, and the events those machines receive. Generated by resolve; not edited by hand.
channels:
  communication.transcription_session.created:
    address: communication.transcription_session.created
    messages:
      CommunicationTranscriptionSessionCreated:
        $ref: "#/components/messages/CommunicationTranscriptionSessionCreated"
  communication.transcription_session.connecting:
    address: communication.transcription_session.connecting
    messages:
      CommunicationTranscriptionSessionConnecting:
        $ref: "#/components/messages/CommunicationTranscriptionSessionConnecting"
  communication.transcription_session.connected:
    address: communication.transcription_session.connected
    messages:
      CommunicationTranscriptionSessionConnected:
        $ref: "#/components/messages/CommunicationTranscriptionSessionConnected"
  communication.transcription_session.disconnected:
    address: communication.transcription_session.disconnected
    messages:
      CommunicationTranscriptionSessionDisconnected:
        $ref: "#/components/messages/CommunicationTranscriptionSessionDisconnected"
  communication.transcription_session.paused:
    address: communication.transcription_session.paused
    messages:
      CommunicationTranscriptionSessionPaused:
        $ref: "#/components/messages/CommunicationTranscriptionSessionPaused"
  communication.transcription_session.stopping:
    address: communication.transcription_session.stopping
    messages:
