$schema: state-machine-schema.yaml
version: "1.0"
domain: communication
capability: transcripts
machines:
  - object: TranscriptionSession
    states:
      - id: created
        slaClock: stopped
        description: Started, not yet streaming.
      - id: connecting
        slaClock: stopped
        description: The adapter is getting a credential and opening the connection.
      - id: connected
        slaClock: stopped
        description: Audio is going to the service and text is coming back.
      - id: disconnected
        slaClock: stopped
        description: The connection dropped, and the adapter is trying again.
      - id: paused
        slaClock: stopped
        description: Off the record. The connection is closed, so no audio goes to the service.
      - id: stopping
        slaClock: stopped
        description: Stop was asked for; the adapter sends the last audio and the last text is still coming.
      - id: closed
        slaClock: stopped
        description: Done, and the transcript is closed. Terminal.
      - id: failed
        slaClock: stopped
        description: The adapter gave up connecting or reconnecting. The transcript stays open; a new session can carry on under it. Terminal.
    initialState: created
    guards:
      - id: transcriptOrStart
        description: it names a transcript, or gives what to start one with — a profile, the client and when it started
        condition: has(request.transcriptId) || (has(request.profileId) && has(request.client) && has(request.startedAt))
      - id: transcriptExists
        description: the transcript it names exists
        condition: "!has(request.transcriptId) || transcript != null"
      - id: hasTranscript
        description: the session has a transcript to carry on
        condition: has(object.transcriptId)
      - id: publishedByStarter
        description: the event was published by the caller who started the session, or the session was started with no caller identified
        condition: "!has(object.startedById) || (has(this.authid) && this.authid == object.startedById)"
    emits:
      - id: connecting
        description: The session started or resumed; its adapter is getting a credential and opening the connection.
      - id: connected
        description: The connection to the service is open. A stretch with nothing captured before it, after a reconnect or when carrying on a transcript, is its gap; the transcript records it.
        schema:
          type: object
          required:
            - transcriptId
          properties:
            transcriptId:
              type: string
              format: uuid
              description: The session's transcript. The transcript refuses an event that names another.
              x-relationship:
                resource: Transcript
                style: links-only
            gap:
              type: object
              additionalProperties: false
              required:
                - startedAt
                - endedAt
              description: The stretch nothing was captured in, by the client's clock.
              properties:
                startedAt:
                  type: string
                  format: date-time
                endedAt:
                  type: string
                  format: date-time
      - id: disconnected
        description: The connection dropped; it's trying again.
        schema:
          type: object
          required:
            - transcriptId
          properties:
            transcriptId:
              type: string
              format: uuid
              description: The session's transcript.
              x-relationship:
                resource: Transcript
                style: links-only
            at:
              type: string
              format: date-time
              description: When it dropped
              by the client's clock.: null
      - id: failed
        description: It gave up connecting or reconnecting. The transcript is still open.
        schema:
          type: object
          required:
            - transcriptId
          properties:
            transcriptId:
              type: string
              format: uuid
              description: The session's transcript.
              x-relationship:
                resource: Transcript
                style: links-only
            reason:
              type: string
              description: Why
              for people.: null
      - id: line_updated
        description: A line in progress, to show. Not kept.
        schema:
          type: object
          required:
            - transcriptId
            - key
            - text
            - startedAt
          properties:
            transcriptId:
              type: string
              format: uuid
              description: The session's transcript.
              x-relationship:
                resource: Transcript
                style: links-only
            key:
              type: string
              maxLength: 255
              description: The line's key, the same on every update and on the finished line, and unique within the session. A service's own result id is unique only within one connection, so the adapter makes it unique across reconnects, for example by putting the connection's number in front.
            text:
              type: string
            speaker:
              type: string
              description: Who's speaking, as the transcript's Speaker names it.
            startedAt:
              type: string
              format: date-time
              description: When it began, by the client's clock.
      - id: line_finished
        description: A finished line. The transcript keeps it, once for its key, and its entry's created event names this event as its cause, in causationid, so a consumer can tell which entry a line became; one the transcript refuses, closed say, isn't kept.
        schema:
          type: object
          required:
            - transcriptId
            - key
            - startedAt
            - endedAt
            - text
            - speaker
          properties:
            transcriptId:
              type: string
              format: uuid
              description: The session's transcript. The transcript refuses an event that names another.
              x-relationship:
                resource: Transcript
                style: links-only
            key:
              type: string
              maxLength: 255
              description: The line's key, as on its updates. The transcript keeps a line once for the session and its key, so one published again after a network error isn't added twice.
            startedAt:
              type: string
              format: date-time
              description: When it began, by the client's clock.
            endedAt:
              type: string
              format: date-time
              description: When it ended.
            text:
              type: string
              minLength: 1
            speaker:
              type: string
              description: Who's speaking, as the transcript's Speaker names it.
            speakerLabel:
              type: string
              description: The service's own label for the voice, when it tells voices apart.
            confidence:
              type: number
              minimum: 0
              maximum: 1
            language:
              type: string
              description: The line's language, as a BCP 47 tag the Language enum lists.
      - id: ended
        description: The session stopped the adapter, and it's done. The last line is published and the connection closed.
        schema:
          type: object
          required:
            - transcriptId
            - at
          properties:
            transcriptId:
              type: string
              format: uuid
              description: The session's transcript.
              x-relationship:
                resource: Transcript
                style: links-only
            at:
              type: string
              format: date-time
              description: When the last text came in
              by the client's clock; the transcript closes at it.: null
      - id: paused
        description: Off the record. The adapter closes the connection, so no audio goes to the service, whoever paused it — the app, or someone pausing the transcript.
      - id: stopping
        description: Stop was asked for. The adapter sends the end of the audio and publishes the last text, then ended.
      - id: closed
        description: The session is done and the transcript closed, whoever closed it.
    actions:
      - id: start
        description: Start streaming. A new transcript is started, unless the session names one to carry on.
        transition:
          from: created
          to: connecting
        steps:
          - set:
              field: startedById
              value: $caller.id
          - if: has(object.transcriptId)
            then:
              - call:
                  operationId: getTranscript
                  parameters:
                    - name: transcriptId
                      in: path
                      value: $object.transcriptId
                runAs: caller
                bind: $current
              - call:
                  operationId: getTranscriptionProfile
                  parameters:
                    - name: profileId
                      in: path
                      value: $current.profileId
                runAs: caller
                bind: $profile
              - call:
                  operationId: startStream
                  requestBody:
                    payload:
                      transcriptionSessionId: $object.id
                      transcriptId: $object.transcriptId
                      provider: $profile.provider
                      model: $current.model
                      languages: $profile.languages
                      lastActivityAt: $current.lastActivityAt
                runAs: caller
            else:
              - call:
                  operationId: createTranscript
                  requestBody:
                    payload:
                      profileId: $object.profileId
                      model: $object.model
                      client: $object.client
                      startedAt: $object.startedAt
                      subjectType: $object.subjectType
                      subjectId: $object.subjectId
                runAs: caller
                bind: $transcript
              - set:
                  field: transcriptId
                  value: $transcript.id
              - call:
                  operationId: getTranscriptionProfile
                  parameters:
                    - name: profileId
                      in: path
                      value: $transcript.profileId
                runAs: caller
                bind: $profile
              - call:
                  operationId: startStream
                  requestBody:
                    payload:
                      transcriptionSessionId: $object.id
                      transcriptId: $transcript.id
                      provider: $profile.provider
                      model: $transcript.model
                      languages: $profile.languages
                runAs: caller
          - emit:
              event: connecting
              type: communication.transcription_session.connecting
      - id: pause
        description: Take the conversation off the record. The transcript keeps the pause; the adapter closes the connection.
        transition:
          from: connected
          to: paused
        schema:
          request:
            $ref: "#/$defs/AtRequest"
        steps:
          - call:
              operationId: pauseStream
              parameters:
                - name: transcriptionSessionId
                  in: path
                  value: $object.id
            runAs: caller
          - call:
              operationId: pauseTranscript
              parameters:
                - name: transcriptId
                  in: path
                  value: $object.transcriptId
              requestBody:
                payload:
                  at: $request.at
            runAs: caller
          - emit:
              event: paused
              type: communication.transcription_session.paused
      - id: resume
        description: Put the conversation back on the record, and start the adapter streaming again. From created, a new session carries on a paused transcript.
        transition:
          from:
            - created
            - paused
          to: connecting
        schema:
          request:
            $ref: "#/$defs/AtRequest"
        guards:
          - conditions:
              - hasTranscript
        steps:
          - set:
              field: startedById
              value: $caller.id
          - call:
              operationId: resumeTranscript
              parameters:
                - name: transcriptId
                  in: path
                  value: $object.transcriptId
              requestBody:
                payload:
                  at: $request.at
            runAs: caller
          - call:
              operationId: getTranscript
              parameters:
                - name: transcriptId
                  in: path
                  value: $object.transcriptId
            runAs: caller
            bind: $current
          - call:
              operationId: getTranscriptionProfile
              parameters:
                - name: profileId
                  in: path
                  value: $current.profileId
            runAs: caller
            bind: $profile
          - call:
              operationId: startStream
              requestBody:
                payload:
                  transcriptionSessionId: $object.id
                  transcriptId: $object.transcriptId
                  provider: $profile.provider
                  model: $current.model
                  languages: $profile.languages
            runAs: caller
          - emit:
              event: connecting
              type: communication.transcription_session.connecting
      - id: stop
        description: Finish. The adapter sends the end of the audio and publishes the last text, then ended, which closes the transcript.
        transition:
          from:
            - connecting
            - connected
            - paused
            - disconnected
          to: stopping
        schema:
          request:
            $ref: "#/$defs/AtRequest"
        steps:
          - call:
              operationId: stopStream
              parameters:
                - name: transcriptionSessionId
                  in: path
                  value: $object.id
            runAs: caller
          - emit:
              event: stopping
              type: communication.transcription_session.stopping
    "on":
      - type: communication.transcription_session.connected
        description: Follow the adapter connected.
        transition:
          from:
            - connecting
            - disconnected
          to: connected
        guards:
          - conditions:
              - publishedByStarter
      - type: communication.transcription_session.disconnected
        description: Follow the adapter's connection dropping.
        transition:
          from: connected
          to: disconnected
        guards:
          - conditions:
              - publishedByStarter
      - type: communication.transcription_session.failed
        description: Follow the adapter giving up.
        transition:
          from:
            - connecting
            - disconnected
          to: failed
        guards:
          - conditions:
              - publishedByStarter
      - type: communication.transcription_session.ended
        description: The last line is in; close the transcript.
        transition:
          from: stopping
          to: closed
        guards:
          - conditions:
              - publishedByStarter
        steps:
          - call:
              operationId: closeTranscript
              parameters:
                - name: transcriptId
                  in: path
                  value: $object.transcriptId
              requestBody:
                payload:
                  at: $this.data.at
          - emit:
              event: closed
              type: communication.transcription_session.closed
      - type: communication.transcript.paused
        description: Follow the transcript off the record.
        transition:
          from:
            - connecting
            - connected
            - disconnected
          to: paused
        steps:
          - call:
              operationId: pauseStream
              parameters:
                - name: transcriptionSessionId
                  in: path
                  value: $object.id
            catch:
              do:
                - emit:
                    event: paused
                    type: communication.transcription_session.paused
          - emit:
              event: paused
              type: communication.transcription_session.paused
      - type: communication.transcript.closed
        description: Follow the transcript closed.
        transition:
          from:
            - connecting
            - connected
            - disconnected
            - paused
            - stopping
          to: closed
        steps:
          - call:
              operationId: stopStream
              parameters:
                - name: transcriptionSessionId
                  in: path
                  value: $object.id
            catch:
              do:
                - emit:
                    event: closed
                    type: communication.transcription_session.closed
          - emit:
              event: closed
              type: communication.transcription_session.closed
    resources:
      TranscriptionSession:
        create:
          context:
            - transcript:
                from: communication/transcripts
                where: has(request.transcriptId) && item.id == request.transcriptId
          guards:
            - conditions:
                - transcriptOrStart
                - transcriptExists
$defs:
  AtRequest:
    type: object
    additionalProperties: false
    required:
      - at
    example:
      at: "2026-01-15T14:30:00Z"
    properties:
      at:
        type: string
        format: date-time
        description: When it happened, by the client's clock.
