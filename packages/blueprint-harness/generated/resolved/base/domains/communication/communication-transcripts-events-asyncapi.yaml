components:
  messages:
    CommunicationTranscriptCreated:
      name: communication.transcript.created
      summary: A Transcript was created. Carries the record as created.
      payload:
        schemaFormat: application/vnd.oai.openapi;version=3.1.0
        schema:
          $ref: "#/components/schemas/CommunicationTranscriptCreatedEvent"
      examples:
        - name: Example
          summary: An example communication.transcript.created event.
          payload:
            specversion: "1.0"
            id: 00000000-0000-4000-8000-000000000000
            source: /communication
            type: communication.transcript.created
            subject: 7a1e0c2d-0000-4000-8000-000000000001
            time: "2024-01-01T00:00:00Z"
            datacontenttype: application/json
            data:
              id: 7a1e0c2d-0000-4000-8000-000000000001
              subjectType: interview
              subjectId: 7a1e0c2d-0000-4000-8000-0000000000a1
              profileId: 7a1e0c2d-0000-4000-8000-0000000000b1
              model: standard
              client: interview-assistant/0.1.0
              status: recording
              startedAt: "2026-10-11T14:00:00Z"
              createdAt: "2026-10-11T14:00:00Z"
              updatedAt: "2026-10-11T14:00:00Z"
    CommunicationTranscriptUpdated:
      name: communication.transcript.updated
      summary: A Transcript was changed. Carries each changed field, before and after.
      payload:
        schemaFormat: application/vnd.oai.openapi;version=3.1.0
        schema:
          $ref: "#/components/schemas/CommunicationTranscriptUpdatedEvent"
      examples:
        - name: Example
          summary: An example communication.transcript.updated event.
          payload:
            specversion: "1.0"
            id: 00000000-0000-4000-8000-000000000000
            source: /communication
            type: communication.transcript.updated
            subject: 7a1e0c2d-0000-4000-8000-000000000001
            time: "2024-01-01T00:00:00Z"
            datacontenttype: application/json
            data:
              changes:
                - field: subjectType
                  before: interview
                  after: chat
    CommunicationTranscriptDeleted:
      name: communication.transcript.deleted
      summary: A Transcript was deleted. The subject is the record's id.
      payload:
        schemaFormat: application/vnd.oai.openapi;version=3.1.0
