asyncapi: 3.0.0
info:
  title: Transcripts events
  version: 0.1.0
  x-domain: communication
  x-capability: transcripts
  description: The events communication-transcripts-openapi.yaml and the state machines attached to its resources send, and the events those machines receive. Generated by resolve; not edited by hand.
channels:
