operations:
  sendCommunicationTranscriptCreated:
    action: send
    channel:
      $ref: "#/channels/communication.transcript.created"
    messages:
      - $ref: "#/channels/communication.transcript.created/messages/CommunicationTranscriptCreated"
  sendCommunicationTranscriptUpdated:
