$schema: communication-transcripts-config-schema.yaml
version: "1.0"
domain: communication
capability: transcripts
profiles:
  resource: TranscriptionProfile
  entries:
    - id: 7a1e0c2d-0000-4000-8000-0000000000b1
      name: english
      description: An interview in English.
      provider: aws-transcribe
      languages:
        - en-US
      idleTimeout: PT30M
    - id: 7a1e0c2d-0000-4000-8000-0000000000b2
      name: english-or-spanish
      description: An interview in English, Spanish, or both — the service tells which is being spoken.
      provider: aws-transcribe
      languages:
        - en-US
        - es-US
      idleTimeout: PT30M
    - id: 7a1e0c2d-0000-4000-8000-0000000000b3
      name: typed
      description: A chat, or notes a person types. No transcription service.
      provider: none
      idleTimeout: PT30M
    - id: 7a1e0c2d-0000-4000-8000-0000000000f1
      name: english-interviews
      description: An interview in English, transcribed by the harness's fake service. No idle timeout, so a transcript under it never closes for being idle.
      provider: fake-transcription
      languages:
        - en-US
    - id: 7a1e0c2d-0000-4000-8000-0000000000f2
      name: english-interviews-30-minutes
      description: The same as english-interviews, but a transcript under it closes after 30 minutes with nothing added.
      provider: fake-transcription
      languages:
        - en-US
      idleTimeout: PT30M
    - id: 7a1e0c2d-0000-4000-8000-0000000000f3
      name: english-google
      description: An interview in English, transcribed by Google Cloud Speech-to-Text through the state's relay.
      provider: google-cloud-speech
      languages:
        - en-US
