asyncapi: 3.0.0
info:
  title: Suggestions events
  version: 0.1.0
  x-domain: decision-support
  x-capability: suggestions
  description: The events decision-support-suggestions-openapi.yaml and the state machines attached to its resources send, and the events those machines receive. Generated by resolve; not edited by hand.
channels:
  decision-support.suggestion.created:
    address: decision-support.suggestion.created
    messages:
      DecisionSupportSuggestionCreated:
        $ref: "#/components/messages/DecisionSupportSuggestionCreated"
  decision-support.suggestion.accepted:
    address: decision-support.suggestion.accepted
    messages:
      DecisionSupportSuggestionAccepted:
        $ref: "#/components/messages/DecisionSupportSuggestionAccepted"
  decision-support.suggestion.refused:
    address: decision-support.suggestion.refused
    messages:
      DecisionSupportSuggestionRefused:
        $ref: "#/components/messages/DecisionSupportSuggestionRefused"
  decision-support.suggestion.dismissed:
    address: decision-support.suggestion.dismissed
    messages:
      DecisionSupportSuggestionDismissed:
        $ref: "#/components/messages/DecisionSupportSuggestionDismissed"
  decision-support.suggestion.expired:
    address: decision-support.suggestion.expired
    messages:
      DecisionSupportSuggestionExpired:
        $ref: "#/components/messages/DecisionSupportSuggestionExpired"
  decision-support.suggestion_expiry:
    address: decision-support.suggestion_expiry
    messages:
      DecisionSupportSuggestionExpiry:
        $ref: "#/components/messages/DecisionSupportSuggestionExpiry"
operations:
  sendDecisionSupportSuggestionCreated:
    action: send
    channel:
      $ref: "#/channels/decision-support.suggestion.created"
    messages:
      - $ref: "#/channels/decision-support.suggestion.created/messages/DecisionSupportSuggestionCreated"
  sendDecisionSupportSuggestionAccepted:
    action: send
    channel:
      $ref: "#/channels/decision-support.suggestion.accepted"
    messages:
      - $ref: "#/channels/decision-support.suggestion.accepted/messages/DecisionSupportSuggestionAccepted"
  sendDecisionSupportSuggestionRefused:
    action: send
    channel:
      $ref: "#/channels/decision-support.suggestion.refused"
    messages:
      - $ref: "#/channels/decision-support.suggestion.refused/messages/DecisionSupportSuggestionRefused"
  sendDecisionSupportSuggestionDismissed:
    action: send
    channel:
      $ref: "#/channels/decision-support.suggestion.dismissed"
    messages:
      - $ref: "#/channels/decision-support.suggestion.dismissed/messages/DecisionSupportSuggestionDismissed"
  sendDecisionSupportSuggestionExpired:
    action: send
    channel:
      $ref: "#/channels/decision-support.suggestion.expired"
    messages:
      - $ref: "#/channels/decision-support.suggestion.expired/messages/DecisionSupportSuggestionExpired"
  receiveDecisionSupportSuggestionCreated:
    action: receive
    channel:
      $ref: "#/channels/decision-support.suggestion.created"
    messages:
      - $ref: "#/channels/decision-support.suggestion.created/messages/DecisionSupportSuggestionCreated"
  receiveDecisionSupportSuggestionExpiry:
    action: receive
    channel:
      $ref: "#/channels/decision-support.suggestion_expiry"
    messages:
      - $ref: "#/channels/decision-support.suggestion_expiry/messages/DecisionSupportSuggestionExpiry"
components:
  messages:
    DecisionSupportSuggestionCreated:
      name: decision-support.suggestion.created
      summary: A Suggestion was created. Carries the record as created.
      payload:
        $ref: "#/components/schemas/DecisionSupportSuggestionCreatedEvent"
    DecisionSupportSuggestionAccepted:
      name: decision-support.suggestion.accepted
      summary: A person said yes; for an operation suggestion, the call was made, and its own events name this one as their cause.
      payload:
        $ref: "#/components/schemas/DecisionSupportSuggestionAcceptedEvent"
    DecisionSupportSuggestionRefused:
      name: decision-support.suggestion.refused
      summary: A person said yes, and the call could not be made. Carries the call and the error.
      payload:
        $ref: "#/components/schemas/DecisionSupportSuggestionRefusedEvent"
    DecisionSupportSuggestionDismissed:
      name: decision-support.suggestion.dismissed
      summary: A person said no, with a reason.
      payload:
        $ref: "#/components/schemas/DecisionSupportSuggestionDismissedEvent"
    DecisionSupportSuggestionExpired:
      name: decision-support.suggestion.expired
      summary: It stopped applying before anyone decided.
      payload:
        $ref: "#/components/schemas/DecisionSupportSuggestionExpiredEvent"
    DecisionSupportSuggestionExpiry:
      name: decision-support.suggestion_expiry
      summary: Expires a suggestion nobody decided by its expiresAt. Sent by the timer service when the timer fires; the subject is the record the timer is for.
      payload:
        $ref: "#/components/schemas/DecisionSupportSuggestionExpiryEvent"
  schemas:
    DecisionSupportSuggestionCreatedEvent:
      allOf:
        - $ref: ../../schemas/events.yaml#/$defs/Event
        - type: object
          properties:
            type:
              type: string
              const: decision-support.suggestion.created
            data:
              $ref: ./decision-support-suggestions-openapi.yaml#/components/schemas/Suggestion
    DecisionSupportSuggestionAcceptedEvent:
      allOf:
        - $ref: ../../schemas/events.yaml#/$defs/Event
        - type: object
          properties:
            type:
              type: string
              const: decision-support.suggestion.accepted
    DecisionSupportSuggestionRefusedEvent:
      allOf:
        - $ref: ../../schemas/events.yaml#/$defs/Event
        - type: object
          properties:
            type:
              type: string
              const: decision-support.suggestion.refused
            data:
              type: object
              required:
                - call
                - error
              properties:
                call:
                  $ref: ../../schemas/operations.yaml#/$defs/OperationCall
                  description: The call that was tried, the corrected one sent or else the one proposed.
                error:
                  $ref: ../../schemas/operations.yaml#/$defs/CallError
    DecisionSupportSuggestionDismissedEvent:
      allOf:
        - $ref: ../../schemas/events.yaml#/$defs/Event
        - type: object
          properties:
            type:
              type: string
              const: decision-support.suggestion.dismissed
    DecisionSupportSuggestionExpiredEvent:
      allOf:
        - $ref: ../../schemas/events.yaml#/$defs/Event
        - type: object
          properties:
            type:
              type: string
              const: decision-support.suggestion.expired
    DecisionSupportSuggestionExpiryEvent:
      allOf:
        - $ref: ../../schemas/events.yaml#/$defs/Event
        - type: object
          properties:
            type:
              type: string
              const: decision-support.suggestion_expiry
            data:
              $ref: ../../schemas/events.yaml#/TimerCallbackEvent
