$schema: state-machine-schema.yaml
version: "1.0"
domain: transcription
eventsSpec: transcription-transcripts-asyncapi.yaml
machines:
  - object: Transcript
    states:
      - id: recording
        slaClock: stopped
        description: The conversation is on the record; lines are accepted.
      - id: paused
        slaClock: stopped
        description: The conversation is off the record — an applicant asked, say. Nothing said now is stored.
      - id: closed
        slaClock: stopped
        description: The transcript has ended. Terminal.
    initialState: recording
    guards:
      - id: atAfterStart
        condition: timestamp(request.at) >= timestamp(object.startedAt)
      - id: atAfterPauseBegan
        condition: openPause == null || timestamp(request.at) >= timestamp(openPause.startedAt)
      - id: aPauseIsOpen
        condition: openPause != null
      - id: startedWhileRecording
        condition: timestamp(request.startedAt) >= timestamp(object.startedAt) && pauseAtStart == null && (!has(object.closedAt) || timestamp(request.startedAt) < timestamp(object.closedAt))
      - id: endsAfterItStarts
        condition: timestamp(request.endedAt) >= timestamp(request.startedAt)
      - id: gapOutsidePauses
        condition: request.kind != "gap" || pauseOverlap == null
    actions:
      - id: pause
        description: Take the conversation off the record, at the time the client says.
        transition:
          from: recording
          to: paused
        schema:
          request:
            $ref: "#/$defs/AtRequest"
        guards:
          - conditions:
              - atAfterStart
        steps:
          - call:
              POST: transcription/transcripts/$object.id/entries
              body:
                kind: pause
                startedAt: $request.at
                endedAt: null
          - emit:
              type: transcription.transcript.paused
      - id: resume
        description: Put the conversation back on the record, at the time the client says.
        transition:
          from: paused
          to: recording
        schema:
          request:
            $ref: "#/$defs/AtRequest"
        context:
          - openPause:
              from: transcription/transcripts/entries
              where: item.kind == "pause" && item.transcriptId == object.id && item.endedAt == null
        guards:
          - conditions:
              - aPauseIsOpen
              - atAfterPauseBegan
        steps:
          - call:
              PATCH: transcription/transcripts/$object.id/entries/$openPause.id
              body:
                endedAt: $request.at
          - emit:
              type: transcription.transcript.resumed
      - id: close
        description: End the transcript, at the time the client says. A pause still open ends then too.
        transition:
          from:
            - recording
            - paused
          to: closed
        schema:
          request:
            $ref: "#/$defs/AtRequest"
        context:
          - openPause:
              from: transcription/transcripts/entries
              where: item.kind == "pause" && item.transcriptId == object.id && item.endedAt == null
        guards:
          - conditions:
              - atAfterStart
              - atAfterPauseBegan
        steps:
          - set:
              field: closedAt
              value: $request.at
          - if: openPause != null
            then:
              - call:
                  PATCH: transcription/transcripts/$object.id/entries/$openPause.id
                  body:
                    endedAt: $request.at
          - emit:
              type: transcription.transcript.closed
    resources:
      TranscriptEntry:
        create:
          context:
            - pauseAtStart:
                from: transcription/transcripts/entries
                where: item.kind == "pause" && item.transcriptId == object.id && timestamp(item.startedAt) <= timestamp(request.startedAt) && (item.endedAt == null || timestamp(item.endedAt) > timestamp(request.startedAt))
            - pauseOverlap:
                from: transcription/transcripts/entries
                where: item.kind == "pause" && item.transcriptId == object.id && timestamp(item.startedAt) < timestamp(request.endedAt) && (item.endedAt == null || timestamp(item.endedAt) > timestamp(request.startedAt))
          guards:
            - conditions:
                - startedWhileRecording
                - endsAfterItStarts
                - gapOutsidePauses
        update:
          guards:
            - actors:
                - system
$defs:
  AtRequest:
    type: object
    additionalProperties: false
    required:
      - at
    properties:
      at:
        type: string
        format: date-time
        description: When it happened, by the client's clock.
