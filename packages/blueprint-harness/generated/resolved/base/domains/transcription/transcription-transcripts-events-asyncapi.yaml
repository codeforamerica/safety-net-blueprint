asyncapi: 3.0.0
info:
  title: Transcripts events
  version: 0.1.0
  x-domain: transcription
  description: The events transcription-transcripts-openapi.yaml and the state machines attached to its resources send. Generated by resolve; not edited by hand.
channels:
