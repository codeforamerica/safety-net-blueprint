      TranscriptionTranscriptEntryCreated:
        $ref: "#/components/messages/TranscriptionTranscriptEntryCreated"
  transcription.transcript_entry.updated:
    address: transcription.transcript_entry.updated
    messages:
      TranscriptionTranscriptEntryUpdated:
        $ref: "#/components/messages/TranscriptionTranscriptEntryUpdated"
  transcription.transcription_profile.created:
    address: transcription.transcription_profile.created
    messages:
      TranscriptionTranscriptionProfileCreated:
        $ref: "#/components/messages/TranscriptionTranscriptionProfileCreated"
  transcription.transcription_profile.updated:
    address: transcription.transcription_profile.updated
    messages:
      TranscriptionTranscriptionProfileUpdated:
        $ref: "#/components/messages/TranscriptionTranscriptionProfileUpdated"
  transcription.transcript.paused:
    address: transcription.transcript.paused
    messages:
      TranscriptionTranscriptPaused:
        $ref: "#/components/messages/TranscriptionTranscriptPaused"
  transcription.transcript.resumed:
    address: transcription.transcript.resumed
    messages:
      TranscriptionTranscriptResumed:
        $ref: "#/components/messages/TranscriptionTranscriptResumed"
  transcription.transcript.closed:
    address: transcription.transcript.closed
    messages:
      TranscriptionTranscriptClosed:
        $ref: "#/components/messages/TranscriptionTranscriptClosed"
components:
  messages:
    TranscriptionTranscriptCreated:
      name: transcription.transcript.created
      summary: A Transcript was created. Carries the record as created.
      payload:
        $ref: "#/components/schemas/TranscriptionTranscriptCreatedEvent"
    TranscriptionTranscriptUpdated:
      name: transcription.transcript.updated
      summary: A Transcript was changed. Carries each changed field, before and after.
      payload:
        $ref: "#/components/schemas/TranscriptionTranscriptUpdatedEvent"
    TranscriptionTranscriptDeleted:
      name: transcription.transcript.deleted
      summary: A Transcript was deleted. The subject is the record's id.
      payload:
        $ref: "#/components/schemas/TranscriptionTranscriptDeletedEvent"
    TranscriptionTranscriptEntryCreated:
      name: transcription.transcript_entry.created
      summary: A TranscriptEntry was created. Carries the record as created.
      payload:
        $ref: "#/components/schemas/TranscriptionTranscriptEntryCreatedEvent"
    TranscriptionTranscriptEntryUpdated:
      name: transcription.transcript_entry.updated
      summary: A TranscriptEntry was changed. Carries each changed field, before and after.
      payload:
        $ref: "#/components/schemas/TranscriptionTranscriptEntryUpdatedEvent"
    TranscriptionTranscriptionProfileCreated:
      name: transcription.transcription_profile.created
      summary: A TranscriptionProfile was created. Carries the record as created.
      payload:
        $ref: "#/components/schemas/TranscriptionTranscriptionProfileCreatedEvent"
    TranscriptionTranscriptionProfileUpdated:
      name: transcription.transcription_profile.updated
      summary: A TranscriptionProfile was changed. Carries each changed field, before and after.
      payload:
        $ref: "#/components/schemas/TranscriptionTranscriptionProfileUpdatedEvent"
    TranscriptionTranscriptPaused:
      name: transcription.transcript.paused
      summary: The conversation went off the record. Anything said until it resumes is not stored.
      payload:
        $ref: "#/components/schemas/TranscriptionTranscriptPausedEvent"
    TranscriptionTranscriptResumed:
      name: transcription.transcript.resumed
      summary: The conversation is back on the record.
      payload:
        $ref: "#/components/schemas/TranscriptionTranscriptResumedEvent"
    TranscriptionTranscriptClosed:
      name: transcription.transcript.closed
      summary: The transcript has ended.
      payload:
        $ref: "#/components/schemas/TranscriptionTranscriptClosedEvent"
  schemas:
    TranscriptionTranscriptCreatedEvent:
      allOf:
        - $ref: ../../schemas/events.yaml#/$defs/Event
        - type: object
          properties:
            type:
              type: string
              const: transcription.transcript.created
            data:
              $ref: ./transcription-transcripts-openapi.yaml#/components/schemas/Transcript
    TranscriptionTranscriptUpdatedEvent:
      allOf:
        - $ref: ../../schemas/events.yaml#/$defs/Event
        - type: object
          properties:
            type:
              type: string
              const: transcription.transcript.updated
            data:
              $ref: ../../schemas/events.yaml#/ResourceUpdatedEvent
    TranscriptionTranscriptDeletedEvent:
      allOf:
