        $ref: "#/components/messages/TranscriptionTranscriptCreated"
  transcription.transcript.updated:
    address: transcription.transcript.updated
    messages:
      TranscriptionTranscriptUpdated:
        $ref: "#/components/messages/TranscriptionTranscriptUpdated"
  transcription.transcript.deleted:
    address: transcription.transcript.deleted
