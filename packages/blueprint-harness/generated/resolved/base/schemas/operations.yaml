$schema: https://json-schema.org/draft/2020-12/schema
$id: https://blueprint.codeforamerica.org/base/schemas/operations.yaml
title: CommonOperations
description: |
  What an operation's request carries, shared across the contracts: an operation named by its operationId with its arguments, as a suggestion proposes it; why a call failed; the id a caller may choose for a new record; and a JSON Patch. A call is written as an Arazzo step writes one: parameters by name and location, and the request body as `requestBody` with its `payload`.
$defs:
  OperationCall:
    type: object
    description: |
      An operation and its arguments. The operationId is one the contracts declare, as overlays leave them; the arguments are checked against that operation's parameters and request schema.
    additionalProperties: false
    required:
      - operationId
    properties:
      operationId:
        type: string
        description: The operation's operationId, e.g. `updateApplicationMember`.
        example: updateApplicationMember
      parameters:
        type: array
        description: |
          The operation's path, query, header and cookie parameters, as an Arazzo step or an OpenAPI operation lists them.
        items:
          type: object
          additionalProperties: false
          required:
            - name
            - in
            - value
          properties:
            name:
              type: string
              description: The parameter's name, as the operation declares it.
            in:
              type: string
              enum:
                - path
                - query
                - header
                - cookie
            value:
              description: The parameter's value.
      requestBody:
        $ref: "#/$defs/RequestBody"
  CallError:
    type: object
    description: |
      Why a call failed: the HTTP status it answered with, alongside the shared Error shape's code, message and details. What a state machine's catch binds, and what an event about a failed call carries.
    required:
      - status
      - code
      - message
    properties:
      status:
        type: integer
        description: The HTTP status the call answered with.
      code:
        $ref: ../components/responses.yaml#/Error/properties/code
      message:
        $ref: ../components/responses.yaml#/Error/properties/message
      details:
        $ref: ../components/responses.yaml#/Error/properties/details
  RequestBody:
    type: object
    description: |
      The request body a call sends, as an Arazzo step's requestBody: the body itself in `payload`, and the media type in `contentType` when the operation accepts more than one.
    additionalProperties: false
    properties:
      contentType:
        type: string
        description: One of the media types the operation's requestBody lists. Defaults to application/json.
        example: application/json
      payload:
        description: The request body, in the operation's request schema.
  NewId:
    type: object
    description: |
      The id a caller may choose for a record it creates, following JSON:API's client-generated ids. Every create schema references it. Without an id, the server sets one. An id another record already has is refused with 409. Choosing the id lets one request name a record another change in it creates, as a JSON Patch to a composition does.
    properties:
      id:
        type: string
        format: uuid
        description: The new record's id, a UUID (RFC 9562).
  JsonPatch:
    type: array
    description: |
      A JSON Patch (RFC 6902), sent as application/json-patch+json: changes applied in order, all or nothing. Each change's path is a JSON Pointer (RFC 6901). A change may carry members the RFC doesn't define, such as evidence; the RFC says they're ignored when the patch is applied.
    items:
      $ref: "#/$defs/JsonPatchOperation"
  JsonPatchOperation:
    type: object
    description: One change in a JSON Patch.
    required:
      - op
      - path
    properties:
      op:
        type: string
        enum:
          - add
          - remove
          - replace
          - move
          - copy
          - test
        description: |
          What the change does. `test` changes nothing: it refuses the whole patch unless the value at `path` equals `value`.
      path:
        type: string
        format: json-pointer
        description: Where the change applies, e.g. `/incomes/{incomeId}/amount`.
      value:
        description: The value to add, replace with, or test for.
      from:
        type: string
        format: json-pointer
        description: Where `move` and `copy` take their value from.
    allOf:
      - if:
          properties:
            op:
              enum:
                - add
                - replace
                - test
        then:
          required:
            - value
      - if:
          properties:
            op:
              enum:
                - move
                - copy
        then:
          required:
            - from
