$schema: https://json-schema.org/draft/2020-12/schema
$id: https://blueprint.codeforamerica.org/base/schemas/rules-evaluation.yaml
EvaluationFact:
  oneOf:
    - $ref: "#/EvaluationFactComplete"
    - $ref: "#/EvaluationFactPlaceholder"
    - $ref: "#/EvaluationFactMissing"
    - $ref: "#/EvaluationFactError"
  discriminator:
    propertyName: state
EvaluationFactComplete:
  type: object
  required:
    - state
    - value
  properties:
    state:
      type: string
      enum:
        - complete
    value:
      description: The computed value.
EvaluationFactPlaceholder:
  type: object
  required:
    - state
    - value
  properties:
    state:
      type: string
      enum:
        - placeholder
    value:
      description: The computed value, derived using one or more schema defaults.
EvaluationFactMissing:
  type: object
  required:
    - state
    - missing
  properties:
    state:
      type: string
      enum:
        - missing
    value:
      type: "null"
      description: Always null — there is no value yet.
    missing:
      type: array
      description: Input paths required to resolve this fact.
      items:
        type: string
EvaluationFactError:
  type: object
  required:
    - state
    - message
  properties:
    state:
      type: string
      enum:
        - error
    value:
      type: "null"
      description: Always null — the fact could not be computed.
    message:
      type: string
      description: The reason evaluation failed.
EvaluationResult:
  type: object
  description: |
    The ruleset's output facts, keyed by output name, so a result is read by name — `#/eligible/value`. Only output facts are included; intermediate facts are not returned. Each ruleset's response schema names its outputs and the type of each one's value.
  additionalProperties:
    $ref: "#/EvaluationFact"
