$id: https://blueprint.codeforamerica.org/base/schemas/rules-evaluation.yaml
EvaluationFact:
  oneOf:
    - $ref: "#/EvaluationFactComplete"
    - $ref: "#/EvaluationFactPlaceholder"
    - $ref: "#/EvaluationFactMissing"
    - $ref: "#/EvaluationFactError"
  discriminator:
    propertyName: state
EvaluationFactComplete:
  type: object
  required:
    - state
    - value
  properties:
    state:
      type: string
      enum:
        - complete
    value:
      description: The computed value.
EvaluationFactPlaceholder:
  type: object
  required:
    - state
    - value
  properties:
    state:
      type: string
      enum:
        - placeholder
    value:
      description: The computed value, derived using one or more schema defaults.
EvaluationFactMissing:
  type: object
  required:
    - state
    - value
    - missing
  properties:
    state:
      type: string
      enum:
        - missing
    value:
      type: "null"
    missing:
      type: array
      description: Input paths required to resolve this fact.
      items:
        type: string
EvaluationFactError:
  type: object
  required:
    - state
    - value
    - message
  properties:
    state:
      type: string
      enum:
        - error
    value:
      type: "null"
    message:
      type: string
      description: The reason evaluation failed.
EvaluationResult:
  type: object
  description: |
    Map of output fact names to their evaluation result. Only output facts are included; intermediate facts are not returned.
  additionalProperties:
    $ref: "#/EvaluationFact"
