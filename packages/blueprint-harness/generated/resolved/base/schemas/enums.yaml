$schema: https://json-schema.org/draft/2020-12/schema
$id: https://blueprint.codeforamerica.org/base/schemas/enums.yaml
$defs:
  Domain:
    type: string
    description: |
      Blueprint domain identifier. Used as the {domain} path parameter on metadata mutation endpoints and as the value type for x-domain annotations on domain OpenAPI specs. Its values are generated at resolve time: the domains the set's OpenAPI, AsyncAPI and rules documents declare.
    enum:
      - document-management
      - eligibility
      - intake
      - platform
      - scheduling
      - transcription
  MetricCollection:
    type: string
    description: |
      Harness metric collections. Extends the base MetricCollection with the primary resource collections for intake and eligibility domains.
    enum:
      - applications
      - determinations
      - events
  Frequency:
    type: string
    description: |
      How often an amount is received, incurred, or scheduled. Applies to income, expenses, SLA recurrence, scheduled reviews, and any other time-based cadence. Domain packages can extend this enum via overlay.
    enum:
      - daily
      - weekly
      - every_two_weeks
      - twice_monthly
      - monthly
      - yearly
      - variable
  Language:
    type: string
    description: Preferred language (BCP 47 language tag).
    pattern: ^[a-zA-Z]{2,3}(?:-[a-zA-Z0-9]{2,8})*$
  ConfigSource:
    type: string
    readOnly: true
    description: |
      Where a record of a config-seeded resource came from. `system`: the deployment's config file, which seeds it once; afterwards it can be changed through the API, but not deleted. `user`: added through the API, and deletable where the API allows it. A client can use it to leave out a delete it would be refused, without trying it first.
    enum:
      - system
      - user
  RoleType:
    type: string
    description: |
      Harness authorization roles. Replaces the base RoleType with the roles the harness's state machine guards name.
      - applicant: The household applying, acting on its own application - case_worker: Processes applications - supervisor: Oversees case workers - system: Automated service account for background and inter-service operations
    enum:
      - applicant
      - case_worker
      - supervisor
      - system
