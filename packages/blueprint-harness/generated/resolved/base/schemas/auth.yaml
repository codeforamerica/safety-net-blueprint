$schema: https://json-schema.org/draft/2020-12/schema
$id: https://blueprint.codeforamerica.org/base/schemas/auth.yaml
title: CommonAuth
description: |
  Shared connection and credential configuration schemas. Used in domain config files (e.g., data-exchange-config.yaml, eligibility-adapter-config.yaml) to define how adapters connect to external services.
$defs:
  Endpoint:
    type: object
    description: |
      Connection parameters for an external service. States overlay their domain config files (e.g., data-exchange-config.yaml) to fill in these fields for each service. No credentials live here — secrets are injected at deploy time via environment variables or a state-configured secrets manager, and referenced by name in the endpoint block.
    additionalProperties: true
    required:
      - url
    properties:
      url:
        type: string
        format: uri
        description: Base URL for the external service endpoint.
        example: https://hub.cms.gov/fdsh/ssa
      timeoutMs:
        type: integer
        description: Request timeout in milliseconds. Defaults to adapter implementation default if omitted.
        minimum: 0
        example: 30000
      apiVersion:
        type: string
        description: Service API version, if the external service requires explicit versioning.
        example: "2.0"
