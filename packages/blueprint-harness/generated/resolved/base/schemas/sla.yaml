$schema: https://json-schema.org/draft/2020-12/schema
$id: https://blueprint.codeforamerica.org/base/schemas/sla.yaml
title: Sla
description: |
  SLA tracking on a record, shared by any domain with SLA types: each SLA clock the record runs (SlaInfo), what a client names to start one (SlaInfoCreate), and the earliest deadline among them (SlaDeadline). The engine running the domain's SLA types manages every field but slaTypeCode.
$defs:
  SlaInfo:
    type: object
    description: |
      Engine-managed SLA tracking entry. Returned in resource responses. All fields except slaTypeCode are populated and managed by the engine.
    additionalProperties: false
    required:
      - slaTypeCode
      - status
      - clockStartedAt
      - deadline
    properties:
      slaTypeCode:
        type: string
        description: |
          Identifies which SLA type applies. Valid values are injected at resolve time from the domain's *-sla-types.yaml.
        enum:
          - snap_standard
          - medicaid_standard
      status:
        type: string
        enum:
          - active
          - warning
          - paused
          - breached
          - completed
        description: |
          Engine-managed SLA clock status. active — clock is running. warning — clock is running but warningThresholdPercent has elapsed. paused — clock is paused (e.g., awaiting client response). breached — deadline has passed without completion. completed — SLA was satisfied before the deadline.
        readOnly: true
      clockStartedAt:
        type: string
        format: date-time
        description: When the SLA clock started. Engine-managed.
        readOnly: true
      deadline:
        type: string
        format: date-time
        description: |
          Computed deadline. Recalculated after a resume to exclude accumulated paused duration. Engine-managed.
        readOnly: true
  SlaInfoCreate:
    type: object
    description: Client input for SLA tracking at resource creation.
    additionalProperties: false
    required:
      - slaTypeCode
    properties:
      slaTypeCode:
        type: string
        description: |
          Identifies which SLA type to track. Valid values are injected at resolve time from the domain's *-sla-types.yaml.
        enum:
          - snap_standard
          - medicaid_standard
  SlaDeadline:
    type:
      - string
      - "null"
    format: date-time
    readOnly: true
    description: |
      Engine-managed. The earliest deadline among the record's slaInfo entries that are active or in warning; null when none is. Recalculated whenever slaInfo changes. A record with slaInfo may declare it as slaDeadline.
