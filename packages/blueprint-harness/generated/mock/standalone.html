  // a multipart schema, which `requestSchema` does not look at.
  const multipart = op.operation?.requestBody?.content?.['multipart/form-data']?.schema;
  if (token === 'multipart/form-data' && multipart) {
    return { path: here, yaml: snippet(token, deref(multipart, doc)) };
  }
  const sources = [envelope, responseSchema(op), requestSchema(op), multipart && deref(multipart, doc)]
    .filter(Boolean);
  const asProperty = (name, declared) => {
    // Printed as authored: a property that is nothing but a `$ref` says
    // nothing, so that one is followed, and one carrying its own keywords
    // is left alone — the keywords are why it was named.
    const only = Object.keys(declared).length === 1 && declared.$ref;
    return { path: here, yaml: snippet(name, only ? deref(declared, doc) : declared) };
  };
  for (const schema of sources) {
    for (const [name, declared] of Object.entries(collectProperties(schema, doc))) {
      // By name, or by the expression it declares: the notes quote
      // `$this.programsAppliedFor.size()` on its own, and the thing a reader
      // wants when they read that is the field it was written on.
      if (name === token || deref(declared, doc)?.['x-derived'] === token) {
        return asProperty(name, declared);
      }
    }
  }

  // Things declared under an id of their own, looked for before the guard
  // below: `snap_standard` is a value of the `slaTypeCode` enum *and* the
  // name of an SLA document, and the SLA is what a reader wants.
  for (const candidate of docs.filter((d) => d.type === 'sla-types')) {
    const sla = (candidate.content?.slaTypes ?? []).find((one) => one.id === token);
    if (sla) return { path: candidate.relativePath, yaml: asList(essential(sla)) };
  }
  for (const candidate of docs.filter((d) => d.type === 'registry')) {
    const entry = candidate.content?.entries?.[token];
    if (entry) return { path: candidate.relativePath, yaml: snippet(token, entry, { prose: true }) };
  }

  // A value one of those fields may hold is not a reference to anything, and
  // looking further finds coincidences: `phone` is a channel here and a
  // contact detail two schemas over. Stop rather than point at the wrong one.
  for (const schema of sources) {
    for (const declared of Object.values(collectProperties(schema, doc))) {
      const resolved = deref(declared, doc);
      const values = resolved?.enum ?? deref(resolved?.items, doc)?.enum;
      if (Array.isArray(values) && values.includes(token)) return null;
    }
  }

  // An extension keyword: on the operation, or on one of its fields.
  if (token.startsWith('x-')) {
    if (op.operation?.[token]) return { path: here, yaml: snippet(token, op.operation[token]) };
    for (const schema of sources) {
      for (const [name, declared] of Object.entries(collectProperties(schema, doc))) {
        const carrying = declared[token] ?? deref(declared, doc)?.[token];
        if (carrying === undefined) continue;
        return { path: here, yaml: snippet(name, { [token]: carrying }) };
      }
    }
  }

  // A declared status, which is a `$ref` to the shared response for every
  // way of failing. Its description is the whole of what it says.
  if (/^\d{3}$/.test(token) && op.operation?.responses?.[token]) {
    return { path: here, yaml: snippet(token, op.operation.responses[token], { prose: true }) };
  }

  // The move this operation is, in the document that declares it: the action
  // by name, the states it joins, or whichever of its steps mentions the
  // token — which is how `intake.review_reminder` leads to the `timerId` it
  // was assembled from rather than to nothing at all.
  const move = op.action ?? (op.timer ? { id: op.timer.action } : null);
  if (move) {
    for (const candidate of docs.filter((d) => d.type === 'state-machine')) {
      for (const machine of candidate.content?.machines ?? []) {
        const declared = (machine.actions ?? []).find((one) => one.id === move.id);
        if (!declared) continue;
        const at = candidate.relativePath;
        if (token === declared.id || token.includes('→')) {
          return { path: at, yaml: asList(essential({ ...declared, steps: undefined })) };
        }
        // Against the declaration rather than the prose around it: every one
        // of these steps carries a sentence explaining itself, and matching
        // inside those turns a number quoted in a note into a false lead.
        for (const step of declared.steps ?? []) {
          const bare = essential(step);
          if (JSON.stringify(bare).includes(token)) return { path: at, yaml: asList(bare) };
        }
      }
    }
  }

  // A composition, reached from one of its own parts: the path it serves, or
  // a flag on the endpoint it declares.
  for (const candidate of docs.filter((d) => d.type === 'compositions')) {
    for (const [name, declared] of Object.entries(candidate.content?.compositions ?? {})) {
      const endpoint = declared.endpoint ?? {};
      const mine = token === name
        || (typeof endpoint.path === 'string' && endpoint.path.endsWith(token))
        || endpoint[token] !== undefined
        || declared.include?.[token] !== undefined;
      if (!mine) continue;
      let node = essential(declared);
      if (endpoint[token] !== undefined) node = { endpoint };
      if (declared.include?.[token] !== undefined) node = { include: { [token]: declared.include[token] } };
      return { path: candidate.relativePath, yaml: snippet(name, node) };
    }
  }

  // A file, named the way the set names a family of them. There is nothing
  // to excerpt — the answer is which files those are.
  if (token.includes('*')) {
    const pattern = new RegExp(`${token.split('*').map((part) =>
      part.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('.*')}$`);
    const matched = docs.filter((candidate) => pattern.test(candidate.relativePath ?? ''));
    if (matched.length > 0) return { paths: matched.map((candidate) => candidate.relativePath) };
  }

  // A fact in the ruleset this operation evaluates. The notes quote one as
  // `path = expression`; what is wanted is the declaration behind it.
  const factPath = token.split(' = ')[0];
  for (const fact of op.ruleset?.ruleset?.facts ?? []) {
    if (fact.path !== factPath) continue;
    return { path: op.ruleset.doc, yaml: asList(essential(fact)) };
  }
  for (const [name, declared] of Object.entries(op.ruleset?.ruleset?.inputs?.policy?.properties ?? {})) {
    if (name !== token) continue;
    return { path: op.ruleset.doc, yaml: snippet(name, declared, { prose: true }) };
  }

  // A schema anywhere in the set.
  for (const candidate of docs) {
    const schema = candidate.content?.components?.schemas?.[token];
    if (!schema) continue;
    const node = flattened(schema, candidate);
    const body = asYaml(essential({ [token]: node.schema })).replace(/^\n/, '');
    return {
      path: candidate.relativePath,
      yaml: node.folded ? `# allOf folded in, for reading\n${body}` : body,
    };
  }

  // A field of something else this document declares. A composition names
  // fields of the record it projects, and those are not on the shape the
  // composition answers with — they are on the resource it reads them off.
  for (const [name, schema] of Object.entries(doc?.content?.components?.schemas ?? {})) {
    const declared = schema.properties?.[token];
    if (!declared) continue;
    return { path: here, yaml: `# ${name}\n${snippet(token, declared)}` };
  }

  // A procedure a state machine calls, and the machine's own states.
  for (const candidate of docs.filter((d) => d.type === 'state-machine')) {
    const procedure = (candidate.content?.procedures ?? []).find((one) => one.id === token);
    if (procedure) {
      return { path: candidate.relativePath, yaml: snippet(token, essential(procedure)) };
    }
  }

  // An event type, as a channel — generated beside the API that emits it, or written by hand.
  for (const candidate of docs) {
    const channel = candidate.content?.channels?.[token];
    if (channel) {
      return { path: candidate.relativePath, yaml: snippet(token, channel, { prose: true }) };
    }
  }

  // An annotation, keyed by the object and field it is about.
  for (const candidate of docs.filter((d) => d.type === 'annotations')) {
    const declared = candidate.content?.schema?.[token]
      ?? candidate.content?.facts?.[token]
      ?? candidate.content?.operations?.[token];
    if (declared) {
      return { path: candidate.relativePath, yaml: snippet(token, declared, { prose: true }) };
    }
  }

  return null;
};

// ── The stage ───────────────────────────────────────────────────────────────

/** The walk, as a list, from wherever the contracts currently stand. */
const walkSteps = () => tourSteps(curate(operations()
  .map((op) => ({ ...op, ...classify(op) }))
  .filter((op) => op.kind !== 'stream')));

/**
 * Where a step sends and what it sends.
 *
 * Shared, because running the whole walk has to build exactly the requests
 * the panels would have built one at a time — two versions of this would
 * drift, and the transcript would stop being a record of what happened.
 */
const requestFor = async (op) => {
  const names = [...op.template.matchAll(/\{([^}]+)\}/g)].map((m) => m[1]);
  const collection = names.length > 0 ? collectionOf(op) : null;

  // Each parameter is a record in its own collection — the path up to it,
  // with the parameters before it filled in. `{entryId}` in
  // /platform/registry/{type}/{entryId} is an entry of the type picked for
  // `{type}`, not another type. A record answers for a parameter with the
  // field of that name when it has one (`type`), and with its id otherwise.
  const params = {};
  const pickers = [];
  for (const [index, name] of names.entries()) {
    const under = withParams(op.path.slice(0, op.path.indexOf(`/{${name}}`)), params);
    const held = await recordsIn(under);
    const valueOf = (record) => record?.[name] ?? record?.id;
    const walked = index === 0 ? made.get(collection) : undefined;
    // A pick whose record has since gone — deleted, or the store reset — is
    // dropped rather than sent.
    const picked = chosen.get(`${keyOf(op)}:${name}`);
    const stillThere = picked !== undefined && held.some((record) => valueOf(record) === picked);
    const value = (stillThere ? picked : undefined) ?? walked ?? valueOf(held[0]);
    if (value) params[name] = value;
    pickers.push({ name, records: held, value, valueOf });
  }
  const records = pickers[0]?.records ?? [];
  const target = pickers[0]?.value ?? null;

  // A control step carries its own body: no contract declares these, so
  // there is no schema to read one off. A read carries none at all, and
  // `fetch` will not let one be attached to a GET.
  const carries = op.method !== 'GET' && op.method !== 'DELETE';
  const parts = carries ? uploadParts(op) : null;
  const example = carries && !parts ? (op.body ?? exampleBody(op)) : null;

  return {
    names,
    collection,
    records,
    target,
    pickers,
    params,
    parts,
    path: withParams(op.path, params) + (op.query ? `?${op.query}` : ''),
    body: parts ? asFormData(parts) : (example === null ? undefined : example),
  };
};

/**
 * What a step produced.
 *
 * The walk follows one record, so remembering what each step made is what
 * lets the next eight act on it without asking which — by collection, for
 * the path parameters, and by the shape it answered with, for a foreign key
 * in some other domain that points at it.
 */
const remember = (op, result, sent) => {
  if (result.status === 201 && result.body?.id) {
    made.set(op.path, result.body.id);
    const shape = refName(op.operation?.responses?.['201']?.content?.['application/json']?.schema);
    if (shape) built.set(shape, result.body.id);
  }
  // What was sent, as well as what came back. A body is worked out from
  // what the walk has made so far, so recomputing one to redraw a step
  // shows the body that step *would* send now — and step one came out
  // carrying an id for a document uploaded after it ran.
  answers.set(keyOf(op), { result, sent });
};

/**
 * Run the whole walk without being asked fourteen times.
 *
 * The steps are in dependency order and each one is a real request, so
 * running them is exactly what pressing Next through all of them does —
 * the only thing lost is the pacing, which is the thing being objected to.
 * Afterwards every step is on screen at once, and the contents on the left
 * jump to any of them.
 */
const runWholeWalk = async (say) => {
  const steps = walkSteps();
  const started = performance.now();
  ranCount = 0;
  for (const [index, op] of steps.entries()) {
    if (done.has(keyOf(op))) continue;
    say?.(`Running… ${index + 1} of ${steps.length}`);
    const { path, body } = await requestFor(op);
    const result = await call(op.method, path, body, keyHeaders(op));
    remember(op, result, body);
    ranCount += 1;
    // A step that failed stops the run rather than carrying on into the
    // ones that needed it: eight 404s in a row explain nothing. One step
    // is meant to be refused, and that refusal is the step working.
    if (result.status >= 400 && result.status !== op.expects) break;
    done.add(keyOf(op));
  }
  ran = Math.round(performance.now() - started);
  transcript = true;
  selected = null;
};

const renderStage = async () => {
  const stage = $('stage');
  stage.replaceChildren();

  if (scenarioMode) { renderScenarioStage(stage); return; }

  // Every step at once, each showing what it answered. Same panels as the
  // walk, with nothing left to press.
  if (transcript) {
    const steps = walkSteps();
    const panel = el('div', '', 'panel');
    panel.append(el('h2', 'The whole walk'));
    const sent = ranCount === steps.length ? 'all of them sent just now'
      : `the last ${ranCount} of them sent just now`;
    panel.append(el('p',
      `${steps.length} requests, in the order you would do them${ranCount > 0
        ? `, ${sent} in ${ran} ms` : ''}. Each one below shows what it sent, what came back, and `
      + 'which line of which contract decided that. Anything on the left opens on its own again.',
      'note'));
    const again = el('button', 'One step at a time', 'primary');
    again.onclick = () => { transcript = false; selected = steps[0]; renderGroups(); renderStage(); };
    panel.append(again);
    stage.append(panel);

    for (const [index, op] of steps.entries()) {
      if (!answers.has(keyOf(op))) continue;
      stage.append(await stepPanel(op, { live: false, number: index + 1 }));
    }
    return;
  }

  if (!selected) {
    const panel = el('div', '', 'panel');
    // Two layouts, two things to say. Describing the reference while
    // standing in the walk was telling a reader about a page they are not
    // looking at — and this is the first thing anybody reads.
    if (showAll) {
      panel.append(el('h2', 'Pick an operation'));
      panel.append(el('p',
        'Every operation on the left came out of a contract, grouped by the domain '
        + 'that declares it, and then by what kind of thing it is.', 'note'));
    } else {
      // Counted, not written down: a contract set with more in it should say
      // so without anybody remembering to come back here.
      const all = operations()
        .map((candidate) => ({ ...candidate, ...classify(candidate) }))
        .filter((candidate) => candidate.kind !== 'stream');
      const steps = walkSteps();
      const total = all.length + stubStep().length + controlSteps().length;

      panel.append(el('h2', 'Start at step one'));
      panel.append(el('p',
        `${steps.length} steps, in the order you would actually do them. Each one sends a real `
        + 'request to the server this page derived a moment ago, and afterwards tells you which '
        + 'line of which contract made it answer that way. Run one and the next appears.', 'note'));
      panel.append(el('p',
        `Or press Let me explore for all ${total} operations, with nothing held back `
        + 'and everything editable.', 'note'));

      const [first] = steps;
      if (first) {
        const pair = el('div', '', 'row');
        const begin = el('button', `Start the tour — ${first.step}`, 'primary');
        begin.onclick = () => { selected = first; renderGroups(); renderStage(); };
        const whole = el('button', 'Or run all of it now', 'run-all');
        whole.onclick = async () => {
          whole.disabled = true;
          await runWholeWalk((saying) => { whole.textContent = saying; });
          renderGroups();
          await renderStage();
        };
        pair.append(begin, whole);
        panel.append(pair);
      }
    }
    stage.append(panel);
    return;
  }

  stage.append(await stepPanel(selected));
};

/**
 * One step: what it sends, what it answered, and what to notice about it.
 *
 * Built rather than rendered, because the same panel is both the thing you
 * press Execute on and one entry in a transcript of all fourteen.
 */
const stepPanel = async (op, { live = true, number = null } = {}) => {
  const group = GROUPS.find((candidate) => candidate.holds(op.kind));
  const panel = el('div', '', 'panel');

  // Everything the request needs, worked out before any of it is drawn.
  // The path line used to render above this and printed `{applicationId}`,
  // because the values it was interpolating did not exist yet.
  const { names, records, target, pickers, params: resolved, parts, body: fresh } = await requestFor(op);

  // Once a step has run, the pair on screen is the pair that happened. A
  // body is derived from what the walk has made, so rebuilding one to
  // redraw a finished step answers "what would this send now", which is a
  // different question and sometimes a different body.
  const already = answers.get(keyOf(op));
  const example = already && !showAll ? already.sent : fresh;
  const params = {};

  // On the walk there is nothing to choose: it is the record step one made.
  // Offering a dropdown of everything in the store, labeled with a uuid
  // and a status, asks a reader to decide something the walk decided for
  // them — and the reference is where deciding belongs.
  const fixed = showAll ? null : target;
  Object.assign(params, resolved);

  if (group) panel.append(el('p', group.title, 'kindline'));
  panel.append(el('h2', number ? `${String(number).padStart(2, '0')} · ${op.step}` : (op.step ?? op.summary)));
  const sending = withParams(op.path, params) + (op.query ? `?${op.query}` : '');
  if (showAll && live) panel.append(callerRow());
  const keyRow = showAll && live && takesIdempotencyKey(op) ? idempotencyRow() : null;
  if (keyRow) panel.append(keyRow.row);
  panel.append(el('p', `${op.method} ${sending}`, 'path'));

  const bodyRef = op.operation.requestBody?.content?.['application/json']?.schema?.$ref;
  const cited = [
    op.action && { name: `${op.action.object} lifecycle`, path: op.action.doc },
    op.ruleset && { name: op.ruleset.name, path: op.ruleset.doc },
    op.composition && { name: op.composition.name, path: op.composition.doc },
  ].filter((entry) => entry && entry.path);

  if (cited.length > 0) {
    const line = el('p', '', 'cited');
    for (const [index, entry] of cited.entries()) {
      if (index > 0) line.append(el('span', '  ·  '));
      if (entry.name) line.append(el('code', entry.name), el('span', ' — '));
      if (pageConfig.sourceUrl) {
        const link = el('a', entry.path);
        link.href = `${pageConfig.sourceUrl}/${entry.path}`;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        line.append(link);
      } else {
        line.append(el('span', entry.path));
      }
    }
    panel.append(line);
  }

  // Nothing above the request on the walk: the step title says what you are
  // doing, and everything worth saying is about what came back.
  if (showAll && group) panel.append(el('p', group.about, 'about'));
  if (showAll && op.operation.description) panel.append(el('p', op.operation.description, 'note'));

  // Path parameters become a picker of records the server actually holds,
  // rather than a box to paste a UUID into.
  if (!fixed) {
    for (const { name, records: held, value, valueOf } of pickers) {
      const field = el('label', '', 'field');
      field.append(el('span', name));
      if (held.length > 0) {
        const picker = el('select');
        for (const record of held) {
          // Just what is sent: the id, or the field the parameter is named for.
          const choice = el('option', valueOf(record));
          choice.value = valueOf(record);
          picker.append(choice);
        }
        picker.value = value ?? '';
        // Redrawn on a pick: the path line shows the new value, and any
        // parameter after this one lists what is under it.
        picker.onchange = () => { chosen.set(`${keyOf(op)}:${name}`, picker.value); renderStage(); };
        field.append(picker);
      } else {
        const box = el('input');
        box.type = 'text';
        box.placeholder = 'no records yet — create one first';
        box.oninput = () => { params[name] = box.value; };
        field.append(box);
      }
      panel.append(field);
    }
  }

  // A body that is not JSON, shown as the parts it is actually made of. A
  // textarea of JSON here would misdescribe the request entirely, which is
  // the whole reason this step is in the walk.
  if (parts) {
    const declared = op.operation.requestBody.content['multipart/form-data'].schema;
    panel.append(shapeLine('multipart/form-data', op.doc.relativePath, 'shape',
      flattened(deref(declared, op.doc), op.doc)));

    const sized = new TextEncoder().encode(SENT_BYTES).length;
    if (showAll) {
      for (const part of parts) {
        const row = el('label', '', 'field');
        row.append(el('span', part.name));
        if (part.bytes) {
          const picker = el('input');
          picker.type = 'file';
          picker.onchange = () => { part.file = picker.files?.[0] ?? null; };
          row.append(picker);
          row.append(el('p', `Nothing chosen sends ${part.fileName} — ${sized} bytes of filler, `
            + 'because the point is what happens to the bytes, not what is in them.', 'note'));
        } else {
          const box = el('input');
          box.type = 'text';
          box.value = part.value;
          box.oninput = () => { part.value = box.value; };
          row.append(box);
        }
        panel.append(row);
      }
    } else {
      const listing = el('pre', '', 'parts');
      listing.append(document.createTextNode(parts.map((part) => (part.bytes
        ? `${part.name.padEnd(16)}${part.fileName}  ·  text/plain  ·  ${sized} bytes`
        : `${part.name.padEnd(16)}${part.value}`)).join('\n')));
      panel.append(listing);
    }
  }

  // A body, prefilled, so nobody has to guess the shape.
  let bodyBox = null;
  if (!parts && example !== undefined) {
    const field = el('label', '', 'field');

    const requestShape = typeof bodyRef === 'string' ? bodyRef.split('/').pop() : null;
    if (requestShape && op.doc?.relativePath) {
      field.append(shapeLine(requestShape, op.doc.relativePath, 'shape',
        flattened(op.doc.content?.components?.schemas?.[requestShape], op.doc)));
    }

    // On the walk the body is fixed: the step is about what the server does
    // with it, and an editable box invites a reader to debug their typing.
    bodyBox = el('textarea');
    bodyBox.value = JSON.stringify(example, null, 2);
    bodyBox.readOnly = !showAll;
    if (!showAll) {
      bodyBox.className = 'fixed';
      bodyBox.title = 'Switch to Let me explore to change it';
    }
    field.append(bodyBox);
    panel.append(field);
  }

  // Nothing to press in a transcript: every one of these has already run,
  // and a button offering to run it again is a lie about what you are
  // reading.
  const send = el('button', 'Execute', 'primary');
  if (live) panel.append(send);

  // Named before the block it describes, the same as the request is.
  const shapeAbove = el('div');
  shapeAbove.hidden = true;
  const answer = el('pre');
  answer.hidden = true;
  panel.append(shapeAbove, answer);

  /**
   * Put an answer on screen.
   *
   * Used when one arrives and again when a reader walks back to a step they
   * have already run. Going back used to rebuild the step blank, which made
   * Previous feel like it had undone something.
   */
  const present = (result) => {
    answer.className = result.status >= 400 ? 'bad' : '';

    // Which shape came back depends on the status: a 201 and a 409 are
    // different objects, both declared. Named here rather than up with the
    // request because this is where a reader is looking when they wonder
    // what they are reading.
    shapeAbove.replaceChildren();
    const named = responseShape(op, result.status);
    if (named) {
      shapeAbove.append(shapeLine(named.name, named.path, 'shape', named.node));
    }
    shapeAbove.hidden = !named;

    answer.replaceChildren(
      el('span', `${result.status} ${result.statusText}`.trim(), 'label'),
      document.createTextNode(JSON.stringify(result.body, null, 2))
    );
    answer.hidden = false;
    watch.hidden = false;
    if (onward && (result.status < 400 || result.status === op.expects)) onward.hidden = false;
  };

  // One box, below the answer, only on the walk. Exploring is for people who
  // already know what they are looking at.
  const watch = el('div', '', 'watch');
  watch.hidden = true;
  let onward = null;
  const bullets = showAll ? [] : noticesFor(op, example);
  if (bullets.length > 0) {
    watch.append(el('p', 'What to notice', 'watch-title'));

    const list = el('ul');
    for (const line of bullets) {
      const item = el('li');
      // Backticks mark the bits a reader can go and find in a contract. Where
      // the page can find one too, the declaration itself is under the word:
      // hovering shows the lines, and the file is a link inside them.
      for (const [index, part] of line.split('`').entries()) {
        if (part === '') continue;
        if (index % 2 === 0) { item.append(el('span', part)); continue; }

        const found = locate(part, op);
        if (!found) { item.append(el('code', part)); continue; }

        const chipped = el('span', '', 'ref');
        const chip = el('code', part);
        // Reachable without a mouse, and on a touch screen, where there is
        // no hover at all and focus is the only thing a tap can produce.
        chip.tabIndex = 0;
        const card = el('span', '', 'card');
        if (found.yaml) card.append(el('pre', found.yaml, 'excerpt'));
        for (const where of found.paths ?? [found.path]) card.append(openLink(where));
        chipped.append(chip, card);
        item.append(chipped);
      }
      list.append(item);
    }
    watch.append(list);
    panel.append(watch);
  }

  // Below the box, not inside it: the walk moves on from here, but it is
  // an action like any other and should look like one. A transcript has
  // nowhere to move on to — the next step is the next thing on the page.
  if (bullets.length > 0 && live) {
    const steps = walkSteps();
    const at = steps.findIndex((candidate) => keyOf(candidate) === keyOf(op));
    const back = at > 0 ? steps[at - 1] : null;
    const then = at === -1 ? null : steps[at + 1];

    const pager = el('div', '', 'pager');

    // Going back needs nothing to have happened, so it is there from the
    // start. Going on does — hidden until the step has run, or already
    // showing if the reader has come back to one they finished.
    if (back) {
      const prior = el('button', `← ${back.step}`, 'step-back');
      prior.onclick = () => { selected = back; renderGroups(); renderStage(); };
      pager.append(prior);
    }
    if (then) {
      onward = el('button', `Next — ${then.step}`, 'primary next-step');
      onward.onclick = () => { selected = then; renderGroups(); renderStage(); };
    } else if (at === steps.length - 1) {
      onward = el('p', 'That is the whole walk. Switch to Let me explore and poke at the rest.', 'to-come');
    }
    if (onward) {
      onward.hidden = !done.has(keyOf(op));
      pager.append(onward);
    }
    if (pager.children.length > 0) panel.append(pager);
  }

  send.onclick = async () => {
    send.disabled = true;
    send.textContent = 'Working…';
    let body;
    if (parts) body = asFormData(parts);
    else if (bodyBox) {
      try {
        body = JSON.parse(bodyBox.value);
      } catch (error) {
        answer.className = 'bad';
        answer.replaceChildren(el('span', 'that body is not JSON', 'label'),
          document.createTextNode(error.message));
        answer.hidden = false;
        send.disabled = false;
        send.textContent = 'Execute';
        return;
      }
    }

    // From the parameters as they are now: a value typed into a box after the
    // panel was drawn has to reach the request.
    const headers = keyRow ? (keyRow.value() ? { 'Idempotency-Key': keyRow.value() } : {}) : keyHeaders(op);
    const result = await call(op.method, withParams(op.path, params) + (op.query ? `?${op.query}` : ''), body, headers);
    remember(op, result, body);
    present(result);

    // On the walk a step runs once. Pressing create twice leaves two
    // applications and a reader wondering which one the next step is
    // talking about; pressing submit twice answers 409 and looks broken.
    // A failure is the exception — that is worth another go. Unless the
    // step is the one being refused on purpose, where the refusal is the
    // answer and pressing it again would only get it twice.
    const worked = result.status < 400 || result.status === op.expects;
    if (!showAll && worked) {
      send.disabled = true;
      send.textContent = 'Done';
      done.add(keyOf(op));
      renderGroups();
    } else {
      send.disabled = false;
      send.textContent = showAll ? 'Execute again' : 'Try again';
    }
  };

  // Coming back to a step already run: it stays done, stays locked, and
  // shows what it showed.
  if (!showAll && already) {
    send.disabled = true;
    send.textContent = 'Done';
    present(already.result);
  }

  return panel;
};

let contracts;

const boot = async () => {
  contracts = await loadContracts();
  // One button, naming where it takes you rather than where you are.
  //
  // The walk ends by emptying the store and filling it again, as two of its
  // steps. Leaving the same two things in the header as buttons offers them
  // twice and lets you pull the floor out from under step six on the way
  // past, so they are only live once you are off the walk and poking about.
  const mode = (wanted) => {
    scenarioMode = false;
    $('scenarios').classList.remove('here');
    showAll = wanted;
    $('mode').textContent = wanted ? 'Show me around' : 'Let me explore';
    for (const id of ['reseed', 'empty']) {
      $(id).disabled = !wanted;
      $(id).title = wanted ? '' : 'The walk does this itself, at the end';
    }
    selected = null;
    transcript = false;
    if (!mock) return;
    renderGroups();
    renderStage();
  };
  $('mode').onclick = () => mode(!showAll);
  $('scenarios').onclick = () => {
    scenarioMode = true;
    selected = null;
    transcript = false;
    if (!selectedScenario) selectedScenario = scenarios()[0]?.relativePath ?? null;
    renderGroups();
    renderStage();
  };
  $('reseed').onclick = () => derive({ seed: true });
  $('empty').onclick = () => derive({ seed: false });

  await derive({ seed: true });
  // After the first derive, never before: this renders, and there is
  // nothing to render until the server exists.
  mode(showAll);
  window.mock = mock;
};

boot().catch((error) => {
  $('derived').textContent = `failed to start — ${error.message}`;
  console.error(error);
});
</script>
</body>
</html>
