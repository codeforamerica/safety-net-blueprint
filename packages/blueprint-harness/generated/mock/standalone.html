      + 'as they were read and then dropped — `contentHash` and `sizeBytes` are kept on the '
      + 'version this created, which `latestVersionId` names, and the file itself is nowhere. '
      + 'Nothing the mock holds can leak something nobody meant to share.');
  }

  // Whichever step actually carries a foreign key to something the walk has
  // made — read off the body being sent rather than placed on a step, so
  // moving the upload moves this with it.
  if (['create', 'edit'].includes(op.kind)) {
    const sending = wasSent ?? exampleBody(op) ?? {};
    for (const [name, property] of Object.entries(collectProperties(requestSchema(op) ?? {}, op.doc))) {
      if (property['x-relationship']?.type !== 'fk' || sending[name] === undefined) continue;
      const { resource, domain } = property['x-relationship'];
      // The read shape renames an expanded field, so the one to point at is
      // not the one that was sent.
      const expanded = Object.entries(props)
        .find(([, declared]) => declared?.['x-relationship']?.style === 'expand')?.[0];
      out.push(`\`${name}\` is the id of the \`${resource}\` you uploaded a moment ago, and `
        + `${expanded ? `\`${expanded}\`` : 'what came back'} is the whole record. The `
        + `${domain ?? op.domain} domain declares that shape, this one declares a relationship to `
        + 'it, and the mock put what the id points at where the id was — one request rather than '
        + 'two, and nothing joining them in a client.');
    }
  }

  if (op.kind === 'create') {
    if (readOnly.length > 0) {
      out.push(`${listOf(readOnly.slice(0, 5))} are marked \`readOnly\`, so they are not on the shape `
        + 'you sent at all. The server filled them in because the contract says they exist.');
    }
    for (const [name, declared] of derived) {
      out.push(`\`${name}\` is declared as a derived field, with the expression `
        + `\`${declared['x-derived']}\`. Nothing stores it: the mock evaluates that expression `
        + 'every time the record is read.');
    }
    for (const [name, declared] of enums.slice(0, 1)) {
      out.push(`\`${name}\` is an enum in the contract — ${declared.enum.map((v) => `\`${v}\``).join(', ')}. `
        + 'A value outside that list is refused by the schema, and no validation was written for '
        + 'this endpoint to do it.');
    }
  }

  if (op.kind === 'edit') {
    const counted = countedArray(op);
    if (counted) {
      out.push(`\`${counted.field}\` changed because you sent it, \`${counted.derived}\` because the `
        + 'mock evaluated its declared expression on the way out, and `updatedAt` because the '
        + 'server moved it. Nothing the request did not mention.');
    } else {
      out.push('`updatedAt` moved on its own. Everything the request did not mention is as it was.');
    }
    if (readOnly.length > 0) {
      out.push(`${listOf(readOnly.slice(0, 3))} are not on \`${sent ?? 'the update shape'}\` at all, `
        + 'so there is no way to send them and nothing to reject.');
    }
  }

  if (op.kind === 'collection') {
    const params = (op.operation.parameters ?? [])
      .map((parameter) => deref(parameter, op.doc)?.name)
      .filter(Boolean);
    if (params.length > 0) {
      const used = (op.query ?? '').split('&').filter(Boolean).map((pair) => pair.split('=')[0]);
      out.push(`${listOf(used)} are in the request above, and ${listOf(params)} are all declared on `
        + 'the operation. Declaring them was the whole of the work — the searching, filtering and '
        + 'paging came with them.');
    }
    const sortable = op.operation['x-sortable'];
    if (sortable?.fields) {
      out.push(`\`x-sortable\` lists ${listOf(sortable.fields.slice(0, 5))} as the fields that may be `
        + `sorted, and \`${sortable.default}\` as the order when a request does not say. Any other `
        + 'field is refused by name. The allowlist is that declaration — there is no check written '
        + 'for this endpoint.');
    }
    out.push('`items`, `total`, `limit`, `offset` — the page envelope is the contract\'s shape, not a convention the mock chose.');
  }

  // The move the contract does not allow from here. Shown rather than
  // claimed: the refusal below came out of the same line the moves that
  // work are read from.
  if (op.kind === 'transition' && op.variant === 'refused') {
    out.push(`The contract declares this move as \`${op.action.from.join(' | ')} → ${op.action.to}\`, `
      + 'and the record is not in that state yet. Nothing checked for this case on purpose — the '
      + 'mock reads that line and answers from it, the same line the moves that worked read.');
    out.push('Every lifecycle in the set is enforced this way, so a state machine nobody '
      + 'implemented is still a state machine you cannot get around.');
  }

  if (op.kind === 'transition' && op.variant !== 'refused') {
    if (op.firstTransition) {
      out.push(`The contract declares this move as \`${op.action.from.join(' | ')} → ${op.action.to}\`. `
        + 'From any other state the mock refuses it — not from a check somebody wrote for this '
        + 'endpoint, but by reading that line.');
    }
    // What this move does on the way through, which is how one differs from
    // the next. Three transitions sharing one sentence about `from` and `to`
    // taught the same thing three times. The first has plenty to say
    // already, so these go to the ones that otherwise had nothing.
    for (const step of op.firstTransition ? [] : op.action.steps ?? []) {
      if (step.set) {
        out.push(`\`${step.set.field}\` was null until now. The lifecycle declares `
          + `\`set: ${step.set.field} = ${step.set.value}\` on this move, so the field is written `
          + 'because the state machine says so — there is no handler here that writes it.');
      }
      if (step.emit?.type) {
        out.push(`This move emits \`${step.emit.type}\`, which the log a few steps on will have in `
          + 'it. Nothing subscribed to it and nothing called a publisher: the action declares an '
          + '`emit` and the mock does it.');
      }
    }
    const timer = timerRequest();
    if (timer && timer.action === op.action.id) {
      out.push(`This action also calls \`requestTimer\` with a \`fireAfter\` of ${timer.after}, which `
        + `emits \`${timer.on}\`. The stand-in you registered answers it immediately, so `
        + `\`${timer.callback}\` is already in the event log rather than three days away.`);
    }
  }

  if (op.kind === 'composition') {
    const found = op.composition && docs
      .filter((doc) => doc.type === 'compositions')
      .flatMap((doc) => Object.entries(doc.content?.compositions ?? {}))
      .find(([name]) => name === op.composition.name);
    const declared = found?.[1];
    if (declared) {
      const fields = Array.isArray(declared.fields) ? declared.fields : Object.keys(declared.fields ?? {});
      if (fields.length > 0) {
        out.push(`Nothing stores this shape. The composition names ${listOf(fields.slice(0, 6))} `
          + 'and the mock reads those fields off the stored application when you ask for it.');
      }
      if (declared.include) {
        const parts = Object.keys(declared.include);
        out.push(`It also pulls in ${listOf(parts)}, which live in their own collection. Reading this `
          + `without the composition means a request for the application and ${parts.length} more for `
          + 'the rest, then assembling them in the client.');
      }
    }
  }

  if (op.kind === 'rules') {
    const set = op.ruleset?.ruleset;
    const policy = Object.entries(set?.inputs?.policy?.properties ?? {});
    const facts = set?.facts ?? [];
    if (facts.length > 0) {
      const last = facts[facts.length - 1];
      out.push(`The answer is not one expression but a chain of named facts. The last is `
        + `\`${last.path} = ${last.expression}\` — so the system can say which condition carried, not just what it concluded.`);
    }
    // What a fact is for, which lives in the annotations rather than in the
    // ruleset. Without this the second ruleset step said one thing about
    // itself, and the most useful part of the contract set went unmentioned.
    const annotated = docs
      .filter((doc) => doc.type === 'annotations')
      .flatMap((doc) => Object.entries(doc.content?.facts ?? {}))
      .filter(([path]) => facts.some((fact) => path.endsWith(`.${fact.path}`)));
    let written = null;
    for (const [path, entry] of annotated) {
      const spoken = Object.entries(entry).find(([name, value]) => !['policies', 'patterns'].includes(name)
        && Array.isArray(value) && typeof value[0] === 'string');
      if (spoken) { written = { path, entry, key: spoken[0], lines: spoken[1] }; break; }
    }
    if (written) {
      out.push(`\`${written.path}\` carries more than a true or false. The annotations attach `
        + `${listOf(written.entry.policies ?? [])} to it and ${written.lines.length} `
        + `${inWords(written.key)} to go with it, so the rule that raises a prompt and the words `
        + 'somebody says out loud are one declaration rather than two that drift apart.');
    }

    for (const [name, declared] of policy.slice(0, 2)) {
      const cites = (declared.description ?? '').match(/\d+\s*CFR\s*§?\s*[\d.()a-z]+/i);
      let citation = cites ? cites[0].replace(/\.+$/, '') : null;
      while (citation && citation.endsWith(')')
        && (citation.match(/\(/g) ?? []).length < (citation.match(/\)/g) ?? []).length) {
        citation = citation.slice(0, -1);
      }
      out.push(`\`${name}\` is an input with a default of \`${declared.default}\``
        + `${citation ? `, citing ${citation}` : ''}. It is a number Congress changes, so the contract `
        + 'treats it as one rather than burying it in code.');
    }
    // Said about what is on screen. This used to explain `placeholder`
    // against an answer in which every fact came back `complete`, which
    // is a note about a thing the reader cannot see.
    if (op.explainPlaceholder ?? true) {
      out.push('Every fact comes back as a `state` and a `value` rather than a bare answer. '
        + '`complete` means everything it needed was given to it; a fact that fell back to a '
        + 'declared default says `placeholder` instead, so a caller can tell a real conclusion '
        + 'from a provisional one.');
    }
  }

  if (op.kind === 'events' && op.variant !== 'filtered') {
    const channels = docs
      .filter((doc) => doc.type === 'asyncapi')
      .flatMap((doc) => Object.keys(doc.content?.channels ?? {}));
    out.push('Every change you made emitted one of these, and nothing asked for them. Uploading '
      + 'a document wrote to this log; so did submitting, opening and closing.');
    if (channels.length > 0) {
      out.push(`The types are declared as channels in the contract set — ${listOf(channels.slice(0, 4))}`
        + `${channels.length > 4 ? `, and ${channels.length - 4} more` : ''}.`);
    }
    out.push('One log, every domain. Nothing wired them together.');
  }

  if (op.kind === 'events' && op.variant === 'filtered') {
    out.push('`q` is full text over the whole log, narrowed here to the application you created. '
      + 'The document upload drops out — it happened, but to a different subject.');
    out.push('What is left was written by more than one domain. Submitting the application is '
      + 'what made eligibility start a determination, and neither domain was wired to the other: '
      + 'each declares its own channel, and this log is all they share.');
    const sortable = op.operation['x-sortable'];
    if (sortable?.fields) {
      out.push(`\`sort\` works here for the same reason it worked on the applications — this `
        + `operation declares its own \`x-sortable\`, over ${listOf(sortable.fields)}. Nothing was `
        + 'written twice to make both endpoints sortable.');
    }
  }

  if (op.kind === 'stub') {
    const timer = timerRequest();
    if (timer) {
      out.push(`Nothing in the contract set implements a scheduler, and \`${timer.action}\` asks for one `
        + `\`${timer.after}\` out. That gap is declared, not accidental.`);
      out.push(`This registers a stand-in for \`${timer.on}\`, so the callback lands the moment it is asked `
        + 'for. The contract did not change — the thing on the other end of it did.');
    }
  }

  if (op.kind === 'control') {
    if (op.explainControl ?? true) {
      out.push('No contract declares this endpoint. It belongs to the mock, not to the system it '
        + 'is running.');
    }
    if (op.says) out.push(op.says);
  }

  // Each of the next few belongs to one step rather than to every step that
  // happens to return the same object. They were on all three of create,
  // read and edit, six identical bullets deep, because they key off the
  // response shape — and a bullet a reader has already read twice is one
  // they learn to skip. Submitting is when the clock starts, when the
  // status moves, and when the field with the regulation attached to it
  // gets written, so that is where those three live.

  // A deadline clock declared as a document rather than as a job somewhere.
  if (op.firstTransition && (resolved.slaTypeCode || resolved.slaInfo)) {
    // The one this record is actually under. Taking the first SLA in the
    // set named a seven-day expedited clock from another domain, while the
    // field in front of the reader said `snap_standard`.
    const allowed = new Set(resolved.slaTypeCode?.enum ?? []);
    const governing = docs
      .filter((doc) => doc.type === 'sla-types')
      .flatMap((doc) => doc.content?.slaTypes ?? [])
      .filter((sla) => allowed.size === 0 || allowed.has(sla.id));

    for (const sla of governing.slice(0, 1)) {
      const paused = pausedOn(sla.pauseWhen);
      out.push(`\`slaTypeCode\` and \`slaInfo\` are filled from an SLA contract: \`${sla.id}\` runs `
        + `${sla.duration.amount} ${sla.duration.unit}, warns at ${sla.warningThresholdPercent}% of `
        + `it${paused ? `, and stops while \`${paused.field}\` is ${listOf(paused.values)}` : ''}. `
        + 'The clock is a declaration, not a cron job somebody remembered to write.');
    }
  }

  // `_links` on a plain record is the work of a composition, and saying so
  // on the read explained compositions six steps before the walk gets to
  // them — naming two of them, which gave the reveal away as well. Said
  // here instead, where it is what the step is about.
  if (op.kind === 'composition') {
    const linked = docs
      .filter((doc) => doc.type === 'compositions')
      .flatMap((doc) => Object.entries(doc.content?.compositions ?? {}))
      .filter(([, declared]) => declared.endpoint?.parentLink)
      .map(([name, declared]) => ({ name, path: declared.endpoint.path }));
    if (linked.length > 0) {
      out.push(`This is where the \`_links\` on the application came from. `
        + `${listOf(linked.map((entry) => entry.name))} set \`parentLink\`, so the mock added `
        + `${listOf(linked.map((entry) => entry.path.replace(/^.*\}/, '')))} to every application it `
        + 'returns. The application\'s own schema says nothing about either of them.');
    }
  }

  // The legal authority attached to a field, which is the thing no other
  // API client could tell you. An annotation names a policy, and a registry
  // every domain shares resolves that policy to the regulation behind it —
  // so a denial can cite the rule rather than reporting that the system
  // said no.
  const governing = op.firstTransition ? policiesOn(op) : [];
  for (const { field, policy, citation, summary } of governing.slice(0, 2)) {
    out.push(`\`${field}\` is annotated with \`${policy}\``
      + `${citation ? `, which the shared policy registry resolves to ${citation}` : ''}. ${summary}`);
  }

  // One field can answer to more than one program, and the contract says
  // which — including on the objects hanging off this one.
  const nested = op.kind === 'composition' ? relatedPolicies(op) : [];
  for (const { object, field, policies } of nested.slice(0, 1)) {
    out.push(`\`${object}.${field}\` cites ${listOf(policies)} — one field, more than one `
      + 'program, each named rather than left to whoever implements the form.');
  }

  // Last, because it is the least surprising line here: true of every
  // operation, so a reader who stops before it has lost nothing.
  const codes = Object.keys(op.operation.responses ?? {}).filter((code) => /^\d+$/.test(code));
  if (codes.length > 1 && (op.showCodes ?? true)) {
    const good = codes.filter((code) => code.startsWith('2'));
    const bad = codes.filter((code) => !code.startsWith('2'));
    out.push(`${listOf(good)} and ${listOf(bad)} are all declared on this operation, and the mock `
      + `worked out which one applied and returned it. ${bad.includes('409')
        ? 'A `409` is declared here because the contract anticipates this call being made out of turn.'
        : 'None of them are canned.'}`);
  }

  return out;
};

/**
 * A deadline a move asks somebody else to keep.
 *
 * An action that calls a procedure with a `callback` is asking for a timer:
 * wake me in N hours and send this event. Nothing in the contract set
 * implements a scheduler, which is the whole point — in a deployment one
 * answers, and here a stub does, which is what makes a 72-hour deadline
 * something you can watch happen.
 */
const timerRequest = () => {
  const procedures = new Map();
  for (const doc of docs.filter((d) => d.type === 'state-machine')) {
    for (const procedure of doc.content?.procedures ?? []) procedures.set(procedure.id, procedure);
  }
  for (const doc of docs.filter((d) => d.type === 'state-machine')) {
    for (const machine of doc.content?.machines ?? []) {
      for (const action of machine.actions ?? []) {
        for (const step of action.steps ?? []) {
          const asks = step.call && step.with?.callback;
          if (!asks) continue;
          const emits = procedures.get(step.call)?.emit?.type;
          if (!emits) continue;
          const after = step.with.fireAfter;
          return {
            on: emits,
            action: action.id,
            callback: step.with.callback.event ?? step.with.callback,
            after: after ? `${after.amount} ${after.unit}` : null,
          };
        }
      }
    }
  }
  return null;
};

/** Registering the stand-in that answers it, as a step. */
const stubStep = () => {
  const timer = timerRequest();
  if (!timer || !mock.routes.has('POST /mock/stubs/events')) return [];
  return [{
    method: 'POST',
    path: '/mock/stubs/events',
    template: '/mock/stubs/events',
    operation: {},
    domain: 'the mock itself',
    kind: 'stub',
    timer,
    step: 'Stand in for the scheduler',
    summary: 'Register an event stub',
    body: { on: timer.on },
  }];
};

/**
 * The mock's own controls, as steps.
 *
 * They are endpoints like any other and a reader will want to know they
 * exist, but they are not derived from anything: the distinction between
 * the system and the harness around it is worth drawing rather than hiding.
 */
const controlSteps = () => [
  {
    path: '/mock/reset',
    step: 'Empty the store',
    summary: 'Reset',
    says: 'It clears records, never contracts — afterwards the API is exactly the API it was.',
  },
  {
    path: '/mock/reseed',
    step: 'Put the data back',
    summary: 'Reseed',
    says: 'The records come from the contract set\'s own `*-mock-data.yaml`, and are checked '
      + 'against the same schemas as anything you send.',
  },
]
  .filter((entry) => mock.routes.has(`POST ${entry.path}`))
  .map((entry) => ({
    ...entry,
    method: 'POST',
    template: entry.path,
    operation: {},
    domain: 'the mock itself',
    kind: 'control',
  }));

/**
 * The walk-through: the curated operations, in the order someone would do
 * them, each named for what it does rather than for what it is.
 */
/**
 * The resource a step will attach, if an earlier one makes it.
 *
 * Worth saying in the title: "Edit the application" undersells a request
 * that also files a document against it. Worked out from the contracts and
 * the order rather than written down, so moving the upload moves this with
 * it, and a set with no upload in it never says anything.
 */
const attachesIn = (op, earlier) => {
  const already = new Set(earlier
    .map((step) => refName(step.operation?.responses?.['201']?.content?.['application/json']?.schema))
    .filter(Boolean));
  for (const property of Object.values(collectProperties(requestSchema(op) ?? {}, op.doc))) {
    const relationship = property['x-relationship'];
    if (relationship?.type === 'fk' && already.has(relationship.resource)) return relationship.resource;
  }
  return null;
};

/** `ApplicationMember` → `application member`, for a title. */
const inWords = (name) => name.replace(/([a-z0-9])([A-Z])/g, '$1 $2').toLowerCase();

/**
 * The last move, attempted one step before the contract allows it.
 *
 * Three transitions in a row say the same thing three times: the contract
 * declares `a → b`, and from anywhere else the mock refuses. Asserting a
 * refusal is far weaker than being shown one, and the states it takes to
 * get there are not themselves the interesting part. So the move that needs
 * the most setup is tried early, refused, and then done properly.
 *
 * Inserted only where the operation declares a conflict, because without a
 * declared answer there is nothing to show and the step would just look
 * broken.
 */
const guarded = (moves) => {
  if (moves.length < 2) return moves;
  const last = moves[moves.length - 1];
  const conflict = Object.keys(last.operation?.responses ?? {}).find((code) => code === '409');
  if (!conflict) return moves;
  return [
    ...moves.slice(0, -2),
    { ...last, variant: 'refused', expects: Number(conflict) },
    ...moves.slice(-2),
  ];
};

const tourSteps = (ops) => {
  const kindOf = (op) => {
    if (op.kind === 'collection' && /\/events$/.test(op.path)) return 'events';
    if (op.kind === 'item' && op.method === 'PATCH') return 'edit';
    return op.kind;
  };
  const take = (kind) => ops.filter((op) => kindOf(op) === kind);
  const title = (op, earlier = []) => {
    const subject = subjectOf(op);
    switch (kindOf(op)) {
      case 'upload': return `Upload a ${subject}`;
      case 'create': return `Create an ${subject}`;
      case 'collection': return `List the ${subject}s`;
      case 'edit': {
        const attached = attachesIn(op, earlier);
        // Not "Edit the application and attach the document" — the subject
        // is the one the whole walk is about and saying it again costs a
        // wrapped line in a 17rem column.
        return attached ? `Edit and attach the ${inWords(attached)}` : `Edit the ${subject}`;
      }
      case 'item': return op.method === 'DELETE' ? `Delete the ${subject}` : `Read the ${subject} back`;
      case 'composition': return `Build a view of the ${subject}`;
      case 'transition': {
        const named = `${op.action.id.charAt(0).toUpperCase()}${op.action.id.slice(1)}`;
        return op.variant === 'refused'
          ? `${named} it from the wrong state`
          : `${named} the ${subject}`;
      }
      case 'rules': return `Evaluate ${op.ruleset?.name ?? 'the rules'}`;
      case 'events': return op.variant === 'filtered'
        ? 'Narrow the log to one record'
        : 'See what the walk emitted';
      default: return op.summary;
    }
  };

  const ordered = [
    ...take('create'),
    // The record exists before anything is filed against it, which is both
    // the order of the dependency and the order of the story: you start an
    // application, then you send your proof of income.
    ...take('upload'),
    // Editing before reading back, so the read has something to show: the
    // edit adds a program, attaches what was just uploaded, and the derived
    // count moves. Reading an unchanged record back only proves it is there.
    ...take('edit'),
    ...take('item'),
    ...take('collection'),
    // Before the moves, because a move that asks for a timer needs
    // something on the other end of it by the time it runs.
    ...stubStep(),
    ...guarded(lifecycleOrder(take('transition'), { happyPathOnly: true })),
    ...take('composition'),
    ...take('rules'),
    // The log, and then the log narrowed. Two questions, not one: what did
    // all of this write without being asked, and what of it belongs to the
    // record you followed. By this point four domains have written to it,
    // so the second is a genuinely different answer from the first.
    ...take('events').flatMap((op) => [op, { ...op, variant: 'filtered' }]),
  ];

  const walked = ordered.map((op, index) => {
    if (op.kind === 'stub') return op;
    const step = { ...op, kind: kindOf(op), step: title(op, ordered.slice(0, index)) };
    // A collection step sends the parameters its notes talk about. The
    // event log gets the same treatment with the record the walk has been
    // following as the search term — the log is every domain's, and the
    // interesting view of it is the one narrowed to what you did.
    if (step.kind === 'collection') {
      const query = listQuery(op);
      if (query) step.query = query;
    }
    if (step.kind === 'events' && step.variant === 'filtered') {
      const [following] = made.values();
      const query = listQuery(op, following);
      if (query) step.query = query;
    }
    return step;
  });

  /**
   * Mark what each step is the first to be able to say.
   *
   * Several of these bullets key off the response shape, so three
   * transitions returning the same object said the same three things, and
   * the status line appeared on all fourteen. A sentence a reader has
   * already read twice is one they learn to skip, which costs the bullets
   * that are worth reading. Said once, on the step that earns it.
   */
  const everything = [...walked, ...controlSteps()];
  const seenCodes = new Set();
  let saidSplit = false;
  let saidTransition = false;
  let saidPlaceholder = false;
  let saidControl = false;

  return everything.map((op) => {
    const codes = Object.keys(op.operation?.responses ?? {}).filter((code) => /^\d+$/.test(code));
    const fresh = codes.filter((code) => !seenCodes.has(code));
    for (const code of codes) seenCodes.add(code);

    const flags = {
      showCodes: fresh.length > 0,
      explainSplit: !saidSplit,
      firstTransition: op.kind === 'transition' && !saidTransition,
      explainPlaceholder: !saidPlaceholder,
      explainControl: !saidControl,
    };
    if (['create', 'edit'].includes(op.kind)) saidSplit = true;
    if (op.kind === 'transition') saidTransition = true;
    if (op.kind === 'rules') saidPlaceholder = true;
    if (op.kind === 'control') saidControl = true;

    return { ...op, ...flags };
  });
};

/**
 * The contents: domain, then what kind of thing each operation is.
 *
 * Domain first because that is what tells a reader what goes with what — and
 * because it is the only way the platform endpoints read as platform's
 * rather than as strays in whichever list they landed in. The kinds keep
 * their dependency order inside each domain; the explanation of what a kind
 * *is* belongs on the right, next to the one you picked, not repeated down
 * the side.
 */
const renderGroups = () => {
  const nav = $('groups');
  // Kept across the rebuild, so the list does not jump back to the top.
  const scrolled = nav.scrollTop;
  nav.replaceChildren();
  requestAnimationFrame(() => { nav.scrollTop = scrolled; });

  const everything = operations()
    .map((op) => ({ ...op, ...classify(op) }))
    .filter((op) => op.kind !== 'stream');

  // Walking through and looking something up are different jobs. The walk is
  // one numbered list in the order you would do them, because the order is
  // the content; the reference is by domain, because then you can find
  // things. Same operations, same panel, two ways in.
  if (!showAll) {
    const steps = tourSteps(curate(everything));

    // Shown: everything already run, plus the one to do next. The rest are
    // counted, not listed.
    //
    // Locking the later steps outright was the other option and it is the
    // wrong one: a reader who hits a 404 is stranded, and an engineer being
    // told they may not click something resents it. Revealing as you go
    // takes the wall away — which was the actual complaint — without ever
    // standing in anybody's way, and the count means nobody has to wonder
    // how long this goes on for.
    const reached = steps.findIndex((op) => !done.has(keyOf(op)));
    const upTo = reached === -1 ? steps.length : reached + 1;

    const list = el('ol', '', 'ops steps');
    for (const [index, op] of steps.slice(0, upTo).entries()) {
      const item = el('li');
      const button = el('button', '', 'op step');
      const run = done.has(keyOf(op));
      button.append(
        el('span', run ? '✓' : String(index + 1).padStart(2, '0'), run ? 'n run' : 'n'),
        el('span', op.step)
      );
      if (selected && keyOf(selected) === keyOf(op)) button.classList.add('here');
      button.onclick = () => { transcript = false; selected = op; renderGroups(); renderStage(); };
      item.append(button);
      list.append(item);
    }
    nav.append(list);

    const left = steps.length - upTo;
    if (left > 0) nav.append(el('p', `${left} more, once you have run this one`, 'to-come'));

    // Fourteen presses of Next is sometimes thirteen too many. This runs
    // whatever is left — the same requests, in the same order — and lays
    // the whole thing out as one page to read through.
    const unrun = steps.filter((op) => !done.has(keyOf(op))).length;
    const wholeThing = el('button',
      unrun > 0 ? `Run all ${steps.length} now` : 'Show the whole walk at once', 'run-all');
    wholeThing.onclick = async () => {
      wholeThing.disabled = true;
      await runWholeWalk((saying) => { wholeThing.textContent = saying; });
      renderGroups();
      await renderStage();
    };
    nav.append(wholeThing);
    return;
  }

  const classified = [...everything, ...stubStep(), ...controlSteps()];
  const domains = [...new Set(classified.map((op) => op.domain))].sort();
  // The first group starts open; after that, whatever the reader opened stays
  // open, and the group holding the selected operation always is.
  openDomains ??= new Set(domains.slice(0, 1));
  if (selected?.domain) openDomains.add(selected.domain);

  for (const domain of domains) {
    const mine = classified.filter((op) => op.domain === domain);
    const box = el('details', '', 'group');
    box.open = openDomains.has(domain);
    box.addEventListener('toggle', () => {
      if (box.open) openDomains.add(domain); else openDomains.delete(domain);
    });
    box.append(el('summary', `${domain}  (${mine.length})`));

    for (const group of GROUPS) {
      const ofKind = mine.filter((op) => group.holds(op.kind));
      if (ofKind.length === 0) continue;
      box.append(el('p', group.title, 'kind'));

      const list = el('ul', '', 'ops');
      for (const op of ofKind) {
        const item = el('li');
        const button = el('button', '', 'op');
        button.append(el('span', op.method, 'verb'), el('span', op.summary));
        if (selected && selected.method === op.method && selected.path === op.path) {
          button.classList.add('here');
        }
        button.onclick = () => { selected = op; renderGroups(); renderStage(); };
        item.append(button);
        list.append(item);
      }
      box.append(list);
    }
    nav.append(box);
  }
};

// ── Showing a contract ──────────────────────────────────────────────────────

/**
 * A schema with its `allOf` parts folded in.
 *
 * Printed as written, the interesting schemas are three lines of `allOf`
 * and a `$ref`, which tells a reader to go and look somewhere else — the
 * thing opening it in place was meant to avoid. Composition is how these
 * documents are written, so the excerpt assembles what the reader would
 * have assembled by hand.
 */
const flattened = (schema, doc) => {
  if (!schema) return null;
  const folded = (schema.allOf ?? []).length > 0;
  const parts = [schema, ...(schema.allOf ?? [])].map((part) => deref(part, doc));
  const merged = { properties: {} };
  for (const part of parts) {
    for (const [key, value] of Object.entries(part ?? {})) {
      if (key === 'allOf') continue;
      if (key === 'properties') Object.assign(merged.properties, value);
      else if (key === 'required') merged.required = [...(merged.required ?? []), ...value];
      else merged[key] = value;
    }
  }
  if (Object.keys(merged.properties).length === 0) delete merged.properties;
  return { schema: merged, folded };
};

/**
 * What a given status answers with, named and located.
 *
 * A success is declared inline and lives in this document. A failure is a
 * `$ref` to `common/components/responses.yaml`, which every operation in
 * every domain shares — so the response object has to be followed before
 * there is a schema to name, and the file it is named in is not this one.
 * Without that, the page showed a shape for the happy path and nothing at
 * all for the four declared ways to fail.
 */
const responseShape = (operation, status) => {
  const declared = operation.operation.responses?.[String(status)]
    ?? operation.operation.responses?.default;
  if (!declared) return null;

  const where = typeof declared.$ref === 'string'
    ? (declared.$ref.split('#')[0] || operation.doc.relativePath)
    : operation.doc.relativePath;
  const named = typeof declared.$ref === 'string' ? declared.$ref.split('/').pop() : null;

  const response = deref(declared, operation.doc);
  const schema = response?.content?.['application/json']?.schema;
  if (!schema) return null;

  const inline = typeof schema.$ref === 'string' ? schema.$ref.split('/').pop() : null;
  const name = inline ?? named;
  if (!name) return null;

  return {
    name,
    path: fileNamed(where, operation.doc),
    node: flattened(deref(schema, operation.doc), operation.doc),
  };
};

/**
 * `ApplicationCreate — domains/intake/intake-openapi.yaml`, which opens.
 *
 * The link alone cost a tab, a round trip and your place in the walk, to
 * read four lines. Those four lines are already in the artifact, so the
 * declaration opens in place and the link stays inside it for anyone who
 * wants the whole file.
 */
const shapeLine = (name, path, className, node) => {
  const box = el('details', '', className);
  const head = el('summary');
  head.append(el('code', name), el('span', ' — '), el('span', path));
  box.append(head);

  if (node?.schema) {
    // Named, so the excerpt is a thing rather than a fragment: `properties:`
    // on its own line reads like something torn out of a file, and leaves
    // the summary above doing work the snippet should do itself.
    const yaml = el('pre', '', 'excerpt');
    const body = asYaml(essential({ [name]: node.schema })).replace(/^\n/, '');
    // And said plainly where this is not what the file looks like. The
    // link is one line below; a snippet that quietly disagrees with it
    // would be found out immediately.
    yaml.append(document.createTextNode(
      node.folded ? `# allOf folded in, for reading\n${body}` : body
    ));
    box.append(yaml);
  }
  // The summary above already names the file, so without somewhere to send
  // a reader there is nothing to add.
  if (pageConfig.sourceUrl) box.append(openLink(path));
  return box;
};

/** A link to the whole file, where the build knew where the files are. */
const openLink = (path) => {
  if (!pageConfig.sourceUrl) return el('span', path, 'whole');
  const link = el('a', `open ${path}`, 'whole');
  link.href = `${pageConfig.sourceUrl}/${path}`;
  link.target = '_blank';
  link.rel = 'noopener noreferrer';
  return link;
};

/** A `$ref`'s file, as the set keys it: relative paths are written from a document. */
const fileNamed = (where, from) => {
  if (!where || !where.startsWith('.')) return where || from.relativePath;
  const tail = where.replace(/^(\.\.\/)+/, '');
  return docs.find((doc) => doc.relativePath?.endsWith(tail))?.relativePath ?? from.relativePath;
};

/** `programCount:\n  type: integer`, printed the way the file has it. */
const snippet = (name, node, { prose = false } = {}) =>
  asYaml(prose ? { [name]: node } : essential({ [name]: node })).replace(/^\n/, '').trimEnd();

/**
 * One entry of a list, printed as one.
 *
 * An action and a fact are both items in a sequence and both carry their own
 * `id` or `path`. Printed under that name as a key they appear to say it
 * twice, which is not what the file looks like.
 */
const asList = (node) => asYaml([node]).replace(/^\n/, '').trimEnd();

/**
 * Where a name in the notes is declared, and what it says there.
 *
 * The notes are full of things a reader might want to look at — a field, an
 * extension, a policy id, a procedure, a status code — and naming one in
 * backticks and then leaving it inert asks a question the page could have
 * answered. Only schema names used to resolve, which meant the two names
 * with an excerpt already open above them were linked and nothing else was.
 *
 * Order matters: a token is looked for in this operation first, because the
 * same word can be a query parameter here and a column somewhere else, and
 * the one a reader means is the one on the screen in front of them.
 */
const locate = (token, op) => {
  const doc = op.doc;
  const here = doc?.relativePath;

  // A parameter this operation declares. The shared ones live in a base
  // components file, which is the more interesting answer: `limit` is
  // declared once for every list endpoint in every domain.
  for (const parameter of op.operation?.parameters ?? []) {
    const resolved = deref(parameter, doc);
    if (resolved?.name !== token) continue;
    const from = typeof parameter.$ref === 'string' ? parameter.$ref.split('#')[0] : null;
    return { path: fileNamed(from, doc), yaml: snippet(token, resolved) };
  }

  // A field of what this operation takes or gives back — including the page
  // envelope, whose `items`/`total`/`limit` are a declared shape rather than
  // a convention the mock settled on.
  const answers = op.operation?.responses ?? {};
  const envelope = deref((answers['200'] ?? answers['201'] ?? answers['202'])
    ?.content?.['application/json']?.schema, doc);
  // The body that is not JSON counts as a source too: `file` is declared in
  // a multipart schema, which `requestSchema` does not look at.
  const multipart = op.operation?.requestBody?.content?.['multipart/form-data']?.schema;
  if (token === 'multipart/form-data' && multipart) {
    return { path: here, yaml: snippet(token, deref(multipart, doc)) };
  }
  const sources = [envelope, responseSchema(op), requestSchema(op), multipart && deref(multipart, doc)]
    .filter(Boolean);
  const asProperty = (name, declared) => {
    // Printed as authored: a property that is nothing but a `$ref` says
    // nothing, so that one is followed, and one carrying its own keywords
    // is left alone — the keywords are why it was named.
    const only = Object.keys(declared).length === 1 && declared.$ref;
    return { path: here, yaml: snippet(name, only ? deref(declared, doc) : declared) };
  };
  for (const schema of sources) {
    for (const [name, declared] of Object.entries(collectProperties(schema, doc))) {
      // By name, or by the expression it declares: the notes quote
      // `$this.programsAppliedFor.size()` on its own, and the thing a reader
      // wants when they read that is the field it was written on.
      if (name === token || deref(declared, doc)?.['x-derived'] === token) {
        return asProperty(name, declared);
      }
    }
  }

  // Things declared under an id of their own, looked for before the guard
  // below: `snap_standard` is a value of the `slaTypeCode` enum *and* the
  // name of an SLA document, and the SLA is what a reader wants.
  for (const candidate of docs.filter((d) => d.type === 'sla-types')) {
    const sla = (candidate.content?.slaTypes ?? []).find((one) => one.id === token);
    if (sla) return { path: candidate.relativePath, yaml: asList(essential(sla)) };
  }
  for (const candidate of docs.filter((d) => d.type === 'registry')) {
    const entry = candidate.content?.entries?.[token];
    if (entry) return { path: candidate.relativePath, yaml: snippet(token, entry, { prose: true }) };
  }

  // A value one of those fields may hold is not a reference to anything, and
  // looking further finds coincidences: `phone` is a channel here and a
  // contact detail two schemas over. Stop rather than point at the wrong one.
  for (const schema of sources) {
    for (const declared of Object.values(collectProperties(schema, doc))) {
      const resolved = deref(declared, doc);
      const values = resolved?.enum ?? deref(resolved?.items, doc)?.enum;
      if (Array.isArray(values) && values.includes(token)) return null;
    }
  }

  // An extension keyword: on the operation, or on one of its fields.
  if (token.startsWith('x-')) {
    if (op.operation?.[token]) return { path: here, yaml: snippet(token, op.operation[token]) };
    for (const schema of sources) {
      for (const [name, declared] of Object.entries(collectProperties(schema, doc))) {
        const carrying = declared[token] ?? deref(declared, doc)?.[token];
        if (carrying === undefined) continue;
        return { path: here, yaml: snippet(name, { [token]: carrying }) };
      }
    }
  }

  // A declared status, which is a `$ref` to the shared response for every
  // way of failing. Its description is the whole of what it says.
  if (/^\d{3}$/.test(token) && op.operation?.responses?.[token]) {
    return { path: here, yaml: snippet(token, op.operation.responses[token], { prose: true }) };
  }

  // The move this operation is, in the document that declares it: the action
  // by name, the states it joins, or whichever of its steps mentions the
  // token — which is how `intake.review_reminder` leads to the `timerId` it
  // was assembled from rather than to nothing at all.
  const move = op.action ?? (op.timer ? { id: op.timer.action } : null);
  if (move) {
    for (const candidate of docs.filter((d) => d.type === 'state-machine')) {
      for (const machine of candidate.content?.machines ?? []) {
        const declared = (machine.actions ?? []).find((one) => one.id === move.id);
        if (!declared) continue;
        const at = candidate.relativePath;
        if (token === declared.id || token.includes('→')) {
          return { path: at, yaml: asList(essential({ ...declared, steps: undefined })) };
        }
        // Against the declaration rather than the prose around it: every one
        // of these steps carries a sentence explaining itself, and matching
        // inside those turns a number quoted in a note into a false lead.
        for (const step of declared.steps ?? []) {
          const bare = essential(step);
          if (JSON.stringify(bare).includes(token)) return { path: at, yaml: asList(bare) };
        }
      }
    }
  }

  // A composition, reached from one of its own parts: the path it serves, or
  // a flag on the endpoint it declares.
  for (const candidate of docs.filter((d) => d.type === 'compositions')) {
    for (const [name, declared] of Object.entries(candidate.content?.compositions ?? {})) {
      const endpoint = declared.endpoint ?? {};
      const mine = token === name
        || (typeof endpoint.path === 'string' && endpoint.path.endsWith(token))
        || endpoint[token] !== undefined
        || declared.include?.[token] !== undefined;
      if (!mine) continue;
      let node = essential(declared);
      if (endpoint[token] !== undefined) node = { endpoint };
      if (declared.include?.[token] !== undefined) node = { include: { [token]: declared.include[token] } };
      return { path: candidate.relativePath, yaml: snippet(name, node) };
    }
  }

  // A file, named the way the set names a family of them. There is nothing
  // to excerpt — the answer is which files those are.
  if (token.includes('*')) {
    const pattern = new RegExp(`${token.split('*').map((part) =>
      part.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('.*')}$`);
    const matched = docs.filter((candidate) => pattern.test(candidate.relativePath ?? ''));
    if (matched.length > 0) return { paths: matched.map((candidate) => candidate.relativePath) };
  }

  // A fact in the ruleset this operation evaluates. The notes quote one as
  // `path = expression`; what is wanted is the declaration behind it.
  const factPath = token.split(' = ')[0];
  for (const fact of op.ruleset?.ruleset?.facts ?? []) {
    if (fact.path !== factPath) continue;
    return { path: op.ruleset.doc, yaml: asList(essential(fact)) };
  }
  for (const [name, declared] of Object.entries(op.ruleset?.ruleset?.inputs?.policy?.properties ?? {})) {
    if (name !== token) continue;
    return { path: op.ruleset.doc, yaml: snippet(name, declared, { prose: true }) };
  }

  // A schema anywhere in the set.
  for (const candidate of docs) {
    const schema = candidate.content?.components?.schemas?.[token];
    if (!schema) continue;
    const node = flattened(schema, candidate);
    const body = asYaml(essential({ [token]: node.schema })).replace(/^\n/, '');
    return {
      path: candidate.relativePath,
      yaml: node.folded ? `# allOf folded in, for reading\n${body}` : body,
    };
  }

  // A field of something else this document declares. A composition names
  // fields of the record it projects, and those are not on the shape the
  // composition answers with — they are on the resource it reads them off.
  for (const [name, schema] of Object.entries(doc?.content?.components?.schemas ?? {})) {
    const declared = schema.properties?.[token];
    if (!declared) continue;
    return { path: here, yaml: `# ${name}\n${snippet(token, declared)}` };
  }

  // A procedure a state machine calls, and the machine's own states.
  for (const candidate of docs.filter((d) => d.type === 'state-machine')) {
    const procedure = (candidate.content?.procedures ?? []).find((one) => one.id === token);
    if (procedure) {
      return { path: candidate.relativePath, yaml: snippet(token, essential(procedure)) };
    }
  }

  // An event type, declared as a channel or alongside the API that emits it.
  for (const candidate of docs) {
    const channel = candidate.content?.channels?.[token] ?? candidate.content?.['x-events']?.[token];
    if (channel) {
      return { path: candidate.relativePath, yaml: snippet(token, channel, { prose: true }) };
    }
  }

  // An annotation, keyed by the object and field it is about.
  for (const candidate of docs.filter((d) => d.type === 'annotations')) {
    const declared = candidate.content?.schema?.[token]
      ?? candidate.content?.facts?.[token]
      ?? candidate.content?.operations?.[token];
    if (declared) {
      return { path: candidate.relativePath, yaml: snippet(token, declared, { prose: true }) };
    }
  }

  return null;
};

// ── The stage ───────────────────────────────────────────────────────────────

/** The walk, as a list, from wherever the contracts currently stand. */
const walkSteps = () => tourSteps(curate(operations()
  .map((op) => ({ ...op, ...classify(op) }))
  .filter((op) => op.kind !== 'stream')));

/**
 * Where a step sends and what it sends.
 *
 * Shared, because running the whole walk has to build exactly the requests
 * the panels would have built one at a time — two versions of this would
 * drift, and the transcript would stop being a record of what happened.
 */
const requestFor = async (op) => {
  const names = [...op.template.matchAll(/\{([^}]+)\}/g)].map((m) => m[1]);
  const collection = names.length > 0 ? collectionOf(op) : null;

  // Each parameter is a record in its own collection — the path up to it,
  // with the parameters before it filled in. `{entryId}` in
  // /platform/registry/{type}/{entryId} is an entry of the type picked for
  // `{type}`, not another type. A record answers for a parameter with the
  // field of that name when it has one (`type`), and with its id otherwise.
  const params = {};
  const pickers = [];
  for (const [index, name] of names.entries()) {
    const under = withParams(op.path.slice(0, op.path.indexOf(`/{${name}}`)), params);
    const held = await recordsIn(under);
    const valueOf = (record) => record?.[name] ?? record?.id;
    const walked = index === 0 ? made.get(collection) : undefined;
    // A pick whose record has since gone — deleted, or the store reset — is
    // dropped rather than sent.
    const picked = chosen.get(`${keyOf(op)}:${name}`);
    const stillThere = picked !== undefined && held.some((record) => valueOf(record) === picked);
    const value = (stillThere ? picked : undefined) ?? walked ?? valueOf(held[0]);
    if (value) params[name] = value;
    pickers.push({ name, records: held, value, valueOf });
  }
  const records = pickers[0]?.records ?? [];
  const target = pickers[0]?.value ?? null;

  // A control step carries its own body: no contract declares these, so
  // there is no schema to read one off. A read carries none at all, and
  // `fetch` will not let one be attached to a GET.
  const carries = op.method !== 'GET' && op.method !== 'DELETE';
  const parts = carries ? uploadParts(op) : null;
  const example = carries && !parts ? (op.body ?? exampleBody(op)) : null;

  return {
    names,
    collection,
    records,
    target,
    pickers,
    params,
    parts,
    path: withParams(op.path, params) + (op.query ? `?${op.query}` : ''),
    body: parts ? asFormData(parts) : (example === null ? undefined : example),
  };
};

/**
 * What a step produced.
 *
 * The walk follows one record, so remembering what each step made is what
 * lets the next eight act on it without asking which — by collection, for
 * the path parameters, and by the shape it answered with, for a foreign key
 * in some other domain that points at it.
 */
const remember = (op, result, sent) => {
  if (result.status === 201 && result.body?.id) {
    made.set(op.path, result.body.id);
    const shape = refName(op.operation?.responses?.['201']?.content?.['application/json']?.schema);
    if (shape) built.set(shape, result.body.id);
  }
  // What was sent, as well as what came back. A body is worked out from
  // what the walk has made so far, so recomputing one to redraw a step
  // shows the body that step *would* send now — and step one came out
  // carrying an id for a document uploaded after it ran.
  answers.set(keyOf(op), { result, sent });
};

/**
 * Run the whole walk without being asked fourteen times.
 *
 * The steps are in dependency order and each one is a real request, so
 * running them is exactly what pressing Next through all of them does —
 * the only thing lost is the pacing, which is the thing being objected to.
 * Afterwards every step is on screen at once, and the contents on the left
 * jump to any of them.
 */
const runWholeWalk = async (say) => {
  const steps = walkSteps();
  const started = performance.now();
  ranCount = 0;
  for (const [index, op] of steps.entries()) {
    if (done.has(keyOf(op))) continue;
    say?.(`Running… ${index + 1} of ${steps.length}`);
    const { path, body } = await requestFor(op);
    const result = await call(op.method, path, body);
    remember(op, result, body);
    ranCount += 1;
    // A step that failed stops the run rather than carrying on into the
    // ones that needed it: eight 404s in a row explain nothing. One step
    // is meant to be refused, and that refusal is the step working.
    if (result.status >= 400 && result.status !== op.expects) break;
    done.add(keyOf(op));
  }
  ran = Math.round(performance.now() - started);
  transcript = true;
  selected = null;
};

const renderStage = async () => {
  const stage = $('stage');
  stage.replaceChildren();

  // Every step at once, each showing what it answered. Same panels as the
  // walk, with nothing left to press.
  if (transcript) {
    const steps = walkSteps();
    const panel = el('div', '', 'panel');
    panel.append(el('h2', 'The whole walk'));
    const sent = ranCount === steps.length ? 'all of them sent just now'
      : `the last ${ranCount} of them sent just now`;
    panel.append(el('p',
      `${steps.length} requests, in the order you would do them${ranCount > 0
        ? `, ${sent} in ${ran} ms` : ''}. Each one below shows what it sent, what came back, and `
      + 'which line of which contract decided that. Anything on the left opens on its own again.',
      'note'));
    const again = el('button', 'One step at a time', 'primary');
    again.onclick = () => { transcript = false; selected = steps[0]; renderGroups(); renderStage(); };
    panel.append(again);
    stage.append(panel);

    for (const [index, op] of steps.entries()) {
      if (!answers.has(keyOf(op))) continue;
      stage.append(await stepPanel(op, { live: false, number: index + 1 }));
    }
    return;
  }

  if (!selected) {
    const panel = el('div', '', 'panel');
    // Two layouts, two things to say. Describing the reference while
    // standing in the walk was telling a reader about a page they are not
    // looking at — and this is the first thing anybody reads.
    if (showAll) {
      panel.append(el('h2', 'Pick an operation'));
      panel.append(el('p',
        'Every operation on the left came out of a contract, grouped by the domain '
        + 'that declares it, and then by what kind of thing it is.', 'note'));
    } else {
      // Counted, not written down: a contract set with more in it should say
      // so without anybody remembering to come back here.
      const all = operations()
        .map((candidate) => ({ ...candidate, ...classify(candidate) }))
        .filter((candidate) => candidate.kind !== 'stream');
      const steps = walkSteps();
      const total = all.length + stubStep().length + controlSteps().length;

      panel.append(el('h2', 'Start at step one'));
      panel.append(el('p',
        `${steps.length} steps, in the order you would actually do them. Each one sends a real `
        + 'request to the server this page derived a moment ago, and afterwards tells you which '
        + 'line of which contract made it answer that way. Run one and the next appears.', 'note'));
      panel.append(el('p',
        `Or press Let me explore for all ${total} operations, with nothing held back `
        + 'and everything editable.', 'note'));

      const [first] = steps;
      if (first) {
        const pair = el('div', '', 'row');
        const begin = el('button', `Start the tour — ${first.step}`, 'primary');
        begin.onclick = () => { selected = first; renderGroups(); renderStage(); };
        const whole = el('button', 'Or run all of it now', 'run-all');
        whole.onclick = async () => {
          whole.disabled = true;
          await runWholeWalk((saying) => { whole.textContent = saying; });
          renderGroups();
          await renderStage();
        };
        pair.append(begin, whole);
        panel.append(pair);
      }
    }
    stage.append(panel);
    return;
  }

  stage.append(await stepPanel(selected));
};

/**
 * One step: what it sends, what it answered, and what to notice about it.
 *
 * Built rather than rendered, because the same panel is both the thing you
 * press Execute on and one entry in a transcript of all fourteen.
 */
const stepPanel = async (op, { live = true, number = null } = {}) => {
  const group = GROUPS.find((candidate) => candidate.holds(op.kind));
  const panel = el('div', '', 'panel');

  // Everything the request needs, worked out before any of it is drawn.
  // The path line used to render above this and printed `{applicationId}`,
  // because the values it was interpolating did not exist yet.
  const { names, records, target, pickers, params: resolved, parts, body: fresh } = await requestFor(op);

  // Once a step has run, the pair on screen is the pair that happened. A
  // body is derived from what the walk has made, so rebuilding one to
  // redraw a finished step answers "what would this send now", which is a
  // different question and sometimes a different body.
  const already = answers.get(keyOf(op));
  const example = already && !showAll ? already.sent : fresh;
  const params = {};

  // On the walk there is nothing to choose: it is the record step one made.
  // Offering a dropdown of everything in the store, labeled with a uuid
  // and a status, asks a reader to decide something the walk decided for
  // them — and the reference is where deciding belongs.
  const fixed = showAll ? null : target;
  Object.assign(params, resolved);

  if (group) panel.append(el('p', group.title, 'kindline'));
  panel.append(el('h2', number ? `${String(number).padStart(2, '0')} · ${op.step}` : (op.step ?? op.summary)));
  const sending = withParams(op.path, params) + (op.query ? `?${op.query}` : '');
  if (showAll && live) panel.append(callerRow());
  panel.append(el('p', `${op.method} ${sending}`, 'path'));

  const bodyRef = op.operation.requestBody?.content?.['application/json']?.schema?.$ref;
  const cited = [
    op.action && { name: `${op.action.object} lifecycle`, path: op.action.doc },
    op.ruleset && { name: op.ruleset.name, path: op.ruleset.doc },
    op.composition && { name: op.composition.name, path: op.composition.doc },
  ].filter((entry) => entry && entry.path);

  if (cited.length > 0) {
    const line = el('p', '', 'cited');
    for (const [index, entry] of cited.entries()) {
      if (index > 0) line.append(el('span', '  ·  '));
      if (entry.name) line.append(el('code', entry.name), el('span', ' — '));
      if (pageConfig.sourceUrl) {
        const link = el('a', entry.path);
        link.href = `${pageConfig.sourceUrl}/${entry.path}`;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        line.append(link);
      } else {
        line.append(el('span', entry.path));
      }
    }
    panel.append(line);
  }

  // Nothing above the request on the walk: the step title says what you are
  // doing, and everything worth saying is about what came back.
  if (showAll && group) panel.append(el('p', group.about, 'about'));
  if (showAll && op.operation.description) panel.append(el('p', op.operation.description, 'note'));

  // Path parameters become a picker of records the server actually holds,
  // rather than a box to paste a UUID into.
  if (!fixed) {
    for (const { name, records: held, value, valueOf } of pickers) {
      const field = el('label', '', 'field');
      field.append(el('span', name));
      if (held.length > 0) {
        const picker = el('select');
        for (const record of held) {
          // Just what is sent: the id, or the field the parameter is named for.
          const choice = el('option', valueOf(record));
          choice.value = valueOf(record);
          picker.append(choice);
        }
        picker.value = value ?? '';
        // Redrawn on a pick: the path line shows the new value, and any
        // parameter after this one lists what is under it.
        picker.onchange = () => { chosen.set(`${keyOf(op)}:${name}`, picker.value); renderStage(); };
        field.append(picker);
      } else {
        const box = el('input');
        box.type = 'text';
        box.placeholder = 'no records yet — create one first';
        box.oninput = () => { params[name] = box.value; };
        field.append(box);
      }
      panel.append(field);
    }
  }

  // A body that is not JSON, shown as the parts it is actually made of. A
  // textarea of JSON here would misdescribe the request entirely, which is
  // the whole reason this step is in the walk.
  if (parts) {
    const declared = op.operation.requestBody.content['multipart/form-data'].schema;
    panel.append(shapeLine('multipart/form-data', op.doc.relativePath, 'shape',
      flattened(deref(declared, op.doc), op.doc)));

    const sized = new TextEncoder().encode(SENT_BYTES).length;
    if (showAll) {
      for (const part of parts) {
        const row = el('label', '', 'field');
        row.append(el('span', part.name));
        if (part.bytes) {
          const picker = el('input');
          picker.type = 'file';
          picker.onchange = () => { part.file = picker.files?.[0] ?? null; };
          row.append(picker);
          row.append(el('p', `Nothing chosen sends ${part.fileName} — ${sized} bytes of filler, `
            + 'because the point is what happens to the bytes, not what is in them.', 'note'));
        } else {
          const box = el('input');
          box.type = 'text';
          box.value = part.value;
          box.oninput = () => { part.value = box.value; };
          row.append(box);
        }
        panel.append(row);
      }
    } else {
      const listing = el('pre', '', 'parts');
      listing.append(document.createTextNode(parts.map((part) => (part.bytes
        ? `${part.name.padEnd(16)}${part.fileName}  ·  text/plain  ·  ${sized} bytes`
        : `${part.name.padEnd(16)}${part.value}`)).join('\n')));
      panel.append(listing);
    }
  }

  // A body, prefilled, so nobody has to guess the shape.
  let bodyBox = null;
  if (!parts && example !== undefined) {
    const field = el('label', '', 'field');

    const requestShape = typeof bodyRef === 'string' ? bodyRef.split('/').pop() : null;
    if (requestShape && op.doc?.relativePath) {
      field.append(shapeLine(requestShape, op.doc.relativePath, 'shape',
        flattened(op.doc.content?.components?.schemas?.[requestShape], op.doc)));
    }

    // On the walk the body is fixed: the step is about what the server does
    // with it, and an editable box invites a reader to debug their typing.
    bodyBox = el('textarea');
    bodyBox.value = JSON.stringify(example, null, 2);
    bodyBox.readOnly = !showAll;
    if (!showAll) {
      bodyBox.className = 'fixed';
      bodyBox.title = 'Switch to Let me explore to change it';
    }
    field.append(bodyBox);
    panel.append(field);
  }

  // Nothing to press in a transcript: every one of these has already run,
  // and a button offering to run it again is a lie about what you are
  // reading.
  const send = el('button', 'Execute', 'primary');
  if (live) panel.append(send);

  // Named before the block it describes, the same as the request is.
  const shapeAbove = el('div');
  shapeAbove.hidden = true;
  const answer = el('pre');
  answer.hidden = true;
  panel.append(shapeAbove, answer);

  /**
   * Put an answer on screen.
   *
   * Used when one arrives and again when a reader walks back to a step they
   * have already run. Going back used to rebuild the step blank, which made
   * Previous feel like it had undone something.
   */
  const present = (result) => {
    answer.className = result.status >= 400 ? 'bad' : '';

    // Which shape came back depends on the status: a 201 and a 409 are
    // different objects, both declared. Named here rather than up with the
    // request because this is where a reader is looking when they wonder
    // what they are reading.
    shapeAbove.replaceChildren();
    const named = responseShape(op, result.status);
    if (named) {
      shapeAbove.append(shapeLine(named.name, named.path, 'shape', named.node));
    }
    shapeAbove.hidden = !named;

    answer.replaceChildren(
      el('span', `${result.status} ${result.statusText}`.trim(), 'label'),
      document.createTextNode(JSON.stringify(result.body, null, 2))
    );
    answer.hidden = false;
    watch.hidden = false;
    if (onward && (result.status < 400 || result.status === op.expects)) onward.hidden = false;
  };

  // One box, below the answer, only on the walk. Exploring is for people who
  // already know what they are looking at.
  const watch = el('div', '', 'watch');
  watch.hidden = true;
  let onward = null;
  const bullets = showAll ? [] : noticesFor(op, example);
  if (bullets.length > 0) {
    watch.append(el('p', 'What to notice', 'watch-title'));

    const list = el('ul');
    for (const line of bullets) {
      const item = el('li');
      // Backticks mark the bits a reader can go and find in a contract. Where
      // the page can find one too, the declaration itself is under the word:
      // hovering shows the lines, and the file is a link inside them.
      for (const [index, part] of line.split('`').entries()) {
        if (part === '') continue;
        if (index % 2 === 0) { item.append(el('span', part)); continue; }

        const found = locate(part, op);
        if (!found) { item.append(el('code', part)); continue; }

        const chipped = el('span', '', 'ref');
        const chip = el('code', part);
        // Reachable without a mouse, and on a touch screen, where there is
        // no hover at all and focus is the only thing a tap can produce.
        chip.tabIndex = 0;
        const card = el('span', '', 'card');
        if (found.yaml) card.append(el('pre', found.yaml, 'excerpt'));
        for (const where of found.paths ?? [found.path]) card.append(openLink(where));
        chipped.append(chip, card);
        item.append(chipped);
      }
      list.append(item);
    }
    watch.append(list);
    panel.append(watch);
  }

  // Below the box, not inside it: the walk moves on from here, but it is
  // an action like any other and should look like one. A transcript has
  // nowhere to move on to — the next step is the next thing on the page.
  if (bullets.length > 0 && live) {
    const steps = walkSteps();
    const at = steps.findIndex((candidate) => keyOf(candidate) === keyOf(op));
    const back = at > 0 ? steps[at - 1] : null;
    const then = at === -1 ? null : steps[at + 1];

    const pager = el('div', '', 'pager');

    // Going back needs nothing to have happened, so it is there from the
    // start. Going on does — hidden until the step has run, or already
    // showing if the reader has come back to one they finished.
    if (back) {
      const prior = el('button', `← ${back.step}`, 'step-back');
      prior.onclick = () => { selected = back; renderGroups(); renderStage(); };
      pager.append(prior);
    }
    if (then) {
      onward = el('button', `Next — ${then.step}`, 'primary next-step');
      onward.onclick = () => { selected = then; renderGroups(); renderStage(); };
    } else if (at === steps.length - 1) {
      onward = el('p', 'That is the whole walk. Switch to Let me explore and poke at the rest.', 'to-come');
    }
    if (onward) {
      onward.hidden = !done.has(keyOf(op));
      pager.append(onward);
    }
    if (pager.children.length > 0) panel.append(pager);
  }

  send.onclick = async () => {
    send.disabled = true;
    send.textContent = 'Working…';
    let body;
    if (parts) body = asFormData(parts);
    else if (bodyBox) {
      try {
        body = JSON.parse(bodyBox.value);
      } catch (error) {
        answer.className = 'bad';
        answer.replaceChildren(el('span', 'that body is not JSON', 'label'),
          document.createTextNode(error.message));
        answer.hidden = false;
        send.disabled = false;
        send.textContent = 'Execute';
        return;
      }
    }

    // From the parameters as they are now: a value typed into a box after the
    // panel was drawn has to reach the request.
    const result = await call(op.method, withParams(op.path, params) + (op.query ? `?${op.query}` : ''), body);
    remember(op, result, body);
    present(result);

    // On the walk a step runs once. Pressing create twice leaves two
    // applications and a reader wondering which one the next step is
    // talking about; pressing submit twice answers 409 and looks broken.
    // A failure is the exception — that is worth another go. Unless the
    // step is the one being refused on purpose, where the refusal is the
    // answer and pressing it again would only get it twice.
    const worked = result.status < 400 || result.status === op.expects;
    if (!showAll && worked) {
      send.disabled = true;
      send.textContent = 'Done';
      done.add(keyOf(op));
      renderGroups();
    } else {
      send.disabled = false;
      send.textContent = showAll ? 'Execute again' : 'Try again';
    }
  };

  // Coming back to a step already run: it stays done, stays locked, and
  // shows what it showed.
  if (!showAll && already) {
    send.disabled = true;
    send.textContent = 'Done';
    present(already.result);
  }

  return panel;
};

let contracts;

const boot = async () => {
  contracts = await loadContracts();
  // One button, naming where it takes you rather than where you are.
  //
  // The walk ends by emptying the store and filling it again, as two of its
  // steps. Leaving the same two things in the header as buttons offers them
  // twice and lets you pull the floor out from under step six on the way
  // past, so they are only live once you are off the walk and poking about.
  const mode = (wanted) => {
    showAll = wanted;
    $('mode').textContent = wanted ? 'Show me around' : 'Let me explore';
    for (const id of ['reseed', 'empty']) {
      $(id).disabled = !wanted;
      $(id).title = wanted ? '' : 'The walk does this itself, at the end';
    }
    selected = null;
    transcript = false;
    if (!mock) return;
    renderGroups();
    renderStage();
  };
  $('mode').onclick = () => mode(!showAll);
  $('reseed').onclick = () => derive({ seed: true });
  $('empty').onclick = () => derive({ seed: false });

  await derive({ seed: true });
  // After the first derive, never before: this renders, and there is
  // nothing to render until the server exists.
  mode(showAll);
  window.mock = mock;
};

boot().catch((error) => {
  $('derived').textContent = `failed to start — ${error.message}`;
  console.error(error);
});
</script>
</body>
</html>
