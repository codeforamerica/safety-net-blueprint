<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not your average Mock Server</title>
<!--
  A playground over the browser mock, rather than a tour of it.

  The page is generated from the contracts twice over: the server is, and so
  is this. Which operations exist, what kind of thing each one is, what a
  sensible body looks like, which records you can act on and which moves are
  legal from where they are — every one of those comes out of the contract
  set, which is why this can do things a generic API client cannot. Postman
  hands you a box and wishes you luck.

  Operations are grouped in dependency order, and the order is real rather
  than pedagogical: a composition needs a record to project, a transition
  needs a record already in a particular state. Resources first is not a
  teaching conceit, it is what has to happen.
-->
<style>
  :root {
    --ink: #1a1a1a; --muted: #555; --faint: #888; --line: #e2e2e2;
    --bg: #fafafa; --card: #fff; --accent: #2b6cb0; --ok: #2f7a3f; --bad: #b02b2b;
    --warm: #8a6d3b;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  /* Any `display` on a rule beats the user agent's `[hidden] { display: none }`,
     so an element given a layout and then hidden in script stays on screen.
     That has now produced two bugs — an empty bordered box, and a Next button
     offering to skip a step nobody had run. Settled here instead of per rule. */
  [hidden] { display: none !important; }
  body {
    margin: 0; padding: 0 0 5rem; background: var(--bg); color: var(--ink);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  h1 { font-size: 1.4rem; margin: 0; }
  code { font-family: var(--mono); font-size: .88em; }

  #masthead {
    max-width: 86rem; margin: 0 auto; padding: 1.6rem 1.2rem 1.1rem;
    border-bottom: 1px solid var(--line);
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2rem; align-items: start;
  }
  /* Two cells, not four rows: as separate rows the left-hand items were
     stretched to match whichever side was taller, which put a hand's width
     of nothing between the title and the text under it. */
  #masthead .intro { min-width: 0; }
  #derived {
    align-self: start;
    border: 1px solid var(--line); border-radius: 6px; background: var(--card);
    padding: .6rem .8rem; min-width: 17rem;
  }
  #derived .when {
    margin: .45rem 0 0; padding-top: .4rem; border-top: 1px solid var(--line);
    font-size: .66rem; letter-spacing: .04em; text-transform: uppercase;
    color: var(--faint); font-weight: 700;
  }
  #derived .stat {
    display: flex; gap: .4rem; align-items: baseline;
    font-size: .75rem; color: var(--muted); line-height: 1.45;
  }
  #derived .stat .n {
    font-family: var(--mono); min-width: 1.4rem; text-align: right; color: var(--ink);
  }
  #derived .stat.lead { font-size: .92rem; color: var(--ink); font-weight: 600; line-height: 1.3; }
  #derived .stat.lead .n { color: var(--accent); min-width: 1.9rem; }
  #derived .breakdown {
    display: grid; grid-template-columns: 1fr 1fr; column-gap: .9rem;
    margin-top: .45rem; padding-top: .4rem; border-top: 1px solid var(--line);
  }
  #derived .headline { margin-top: 0; padding-top: 0; border-top: 0; }
  @media (max-width: 60rem) {
    #masthead { grid-template-columns: 1fr; }
    #derived { grid-column: 1; grid-row: auto; }
  }
  .lede { color: var(--muted); margin: .4rem 0 0; max-width: 44rem; font-size: .95rem; }

  /* Throwing the whole thing away and deriving it again, which is the
     headline claim and takes about as long as a keystroke. */
  #controls { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; margin: .9rem 0 0; }
  #controls .sep { border-left: 1px solid var(--line); height: 1.4rem; margin: 0 .2rem; }
  #controls button:not(.primary) {
    font: inherit; font-size: .85rem; cursor: pointer; padding: .4rem 1rem;
    border-radius: 4px; border: 1px solid var(--line); background: var(--card); color: var(--ink);
  }
  #controls button:disabled { opacity: .4; cursor: not-allowed; }
  /* Who the reference calls as. Every request carries it, the way a real
     client's sign-in would, and the events it causes record it. */
  .caller { display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; margin: 0 0 .6rem; font-size: .85rem; color: var(--muted); }
  .caller input, .caller select { width: auto; }
  .caller .caller-id { width: 9rem; }
  .caller input.caller-roles { width: 15rem; }
  details.caller-roles { position: relative; }
  details.caller-roles summary {
    cursor: pointer; font-family: var(--mono); font-size: .8rem; padding: .4rem .5rem; min-width: 12rem;
    border: 1px solid var(--line); border-radius: 4px; background: #fcfcfc; color: var(--ink);
  }
  details.caller-roles .menu {
    position: absolute; z-index: 5; margin-top: .2rem; padding: .3rem .5rem; min-width: 100%;
    border: 1px solid var(--line); border-radius: 4px; background: var(--card); box-shadow: 0 2px 8px rgba(0,0,0,.08);
  }
  details.caller-roles .menu label { display: flex; gap: .4rem; align-items: center; padding: .15rem 0; font-family: var(--mono); font-size: .8rem; color: var(--ink); white-space: nowrap; }
  details.caller-roles .menu input { width: auto; }
  .caller .caller-id:disabled { opacity: .4; }


  #shell {
    display: grid; grid-template-columns: 17rem minmax(0, 1fr);
    gap: 2rem; max-width: 86rem; margin: 1.4rem auto 0; padding: 0 1.2rem;
  }
  #groups {
    position: sticky; top: 1rem; align-self: start;
    max-height: calc(100vh - 2rem); overflow: auto;
    border-right: 1px solid var(--line); padding-right: .8rem;
  }
  .group > summary {
    cursor: pointer; list-style: none; padding: .45rem .3rem;
    font-size: .76rem; letter-spacing: .06em; text-transform: uppercase;
    font-weight: 700; color: var(--ink);
  }
  .group > summary::-webkit-details-marker { display: none; }
  .group > summary::before { content: '▸ '; color: var(--faint); }
  .group[open] > summary::before { content: '▾ '; }
  .kind {
    margin: .5rem 0 .1rem .3rem; font-size: .68rem; letter-spacing: .05em;
    text-transform: uppercase; color: var(--faint); font-weight: 700;
  }
  .ops { list-style: none; margin: 0 0 .5rem; padding: 0; }
  .op {
    display: block; width: 100%; text-align: left; border: 0; background: none;
    font: inherit; font-size: .8rem; cursor: pointer; color: var(--muted);
    padding: .22rem .45rem; border-radius: 4px; line-height: 1.35;
  }
  .op:hover { background: #f1f4f8; color: var(--ink); }
  .op.here { background: #eef4fb; color: var(--accent); font-weight: 600; }
  .steps { counter-reset: none; }
  .op.step { padding: .34rem .45rem; font-size: .84rem; }
  .op .n {
    font-family: var(--mono); font-size: .7rem; color: var(--faint);
    display: inline-block; min-width: 1.9rem;
  }
  .op.step.here .n { color: var(--accent); }
  .panel .watch {
    margin: 1rem 0 0; padding: .8rem 1rem .9rem; font-size: .9rem; color: var(--ink);
    background: #f4f9f4; border: 1px solid #d6e8d6; border-radius: 4px; max-width: 48rem;
  }
  .watch-title {
    margin: 0 0 .5rem; font-size: .68rem; letter-spacing: .06em; text-transform: uppercase;
    font-weight: 700; color: var(--ok);
  }
  .panel .watch ul { margin: 0; padding-left: 1.1rem; }
  /* The anchor for the cards below: they span the bullet rather than hang
     off the word, so one near the right-hand edge has nowhere to overflow
     to and every card opens in the same place. */
  .panel .watch li { margin: 0 0 .45rem; line-height: 1.55; position: relative; }
  .panel .watch li:last-child { margin-bottom: 0; }
  .panel .watch code { background: #e4efe4; padding: .08em .3em; border-radius: 3px; }
  .panel .watch .ref > code {
    border-bottom: 1px dotted var(--ok); cursor: help; outline: none;
  }
  .panel .watch .ref > code:hover, .panel .watch .ref > code:focus { background: #cfe4cf; }
  .panel .watch .ref .card {
    display: none; position: absolute; left: 0; right: 0; top: calc(100% + .25rem);
    z-index: 5; background: var(--card); border: 1px solid #cfd6de; border-radius: 4px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, .13); padding: .55rem .7rem .6rem;
  }
  .panel .watch .ref:hover .card, .panel .watch .ref:focus-within .card { display: block; }
  .panel .watch .card .excerpt {
    margin: 0; background: #fcfbf7; border-color: #e6ded0; border-left: 3px solid var(--warm);
    max-height: 18rem; font-size: .73rem;
  }
  .panel .watch .card .whole {
    display: inline-block; margin: .45rem 0 0; font-family: var(--mono); font-size: .7rem;
    color: var(--accent); text-decoration: none; border-bottom: 1px dotted currentColor;
  }
  .panel .watch .card code { background: none; padding: 0; }
  .op .n.run { color: var(--ok); font-weight: 700; }
  .to-come { margin: .5rem 0 0 .45rem; font-size: .78rem; color: var(--faint); font-style: italic; }
  .row { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
  /* The other way through: dashed, because it is the alternative route and
     should not compete with the step you are being offered. */
  button.run-all {
    font: inherit; font-size: .8rem; cursor: pointer; padding: .4rem .8rem;
    border-radius: 4px; border: 1px dashed #c3cdd8; background: var(--card); color: var(--muted);
  }
  button.run-all:hover { color: var(--accent); border-color: var(--accent); border-style: solid; }
  button.run-all:disabled { opacity: .6; cursor: progress; }
  #groups button.run-all { display: block; width: 100%; margin: .7rem 0 .3rem; }
  .pager {
    display: flex; gap: .6rem; align-items: center; justify-content: space-between;
    margin-top: 1rem;
  }
  .pager .step-back {
    font: inherit; font-size: .82rem; cursor: pointer; padding: .35rem .8rem;
    border-radius: 4px; border: 1px solid var(--line); background: var(--card); color: var(--muted);
  }
  .pager .step-back:hover { color: var(--ink); border-color: #cfd6de; }
  /* Pushed right when it is the only one, so it sits where it always sits. */
  .pager .next-step { margin-left: auto; }
  .op .verb {
    font-family: var(--mono); font-size: .68rem; font-weight: 700;
    display: inline-block; min-width: 3.4rem; color: var(--faint);
  }
  .op.here .verb { color: var(--accent); }

  #stage { min-width: 0; }
  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: 6px;
    padding: 1.1rem 1.2rem; margin: 0 0 1.2rem;
  }
  .panel .kindline {
    font-size: .68rem; letter-spacing: .05em; text-transform: uppercase;
    font-weight: 700; color: var(--accent); margin: 0 0 .25rem;
  }
  .panel h2 { font-size: 1.05rem; margin: 0 0 .2rem; }
  .panel .about {
    color: var(--muted); font-size: .9rem; margin: 0 0 .8rem; padding: 0 0 .8rem;
    border-bottom: 1px solid var(--line); max-width: 46rem;
  }
  .panel .path { font-family: var(--mono); font-size: .82rem; color: var(--accent); margin: 0 0 .7rem; }
  .panel .note { color: var(--muted); font-size: .9rem; margin: 0 0 .9rem; max-width: 46rem; }
  .panel .cited { font-family: var(--mono); font-size: .74rem; color: var(--faint); margin: 0 0 .9rem; }
  .panel .cited code { background: #eef2f6; color: var(--ink); padding: .08em .3em; border-radius: 3px; }
  .panel .cited a { color: var(--accent); text-decoration: none; border-bottom: 1px dotted currentColor; }
  .panel .cited a:hover { border-bottom-style: solid; }

  label.field { display: block; margin: 0 0 .7rem; font-size: .82rem; color: var(--muted); }
  label.field > span { display: block; margin-bottom: .22rem; }
  .shape { margin: .9rem 0 .25rem; }
  .shape > summary {
    cursor: pointer; list-style: none;
    font-family: var(--mono); font-size: .74rem; color: var(--faint);
  }
  .shape > summary::-webkit-details-marker { display: none; }
  .shape > summary::before { content: '▸ '; }
  .shape[open] > summary::before { content: '▾ '; }
  .shape > summary:hover { color: var(--accent); }
  .shape code { background: #eef2f6; color: var(--ink); padding: .08em .3em; border-radius: 3px; }
  .shape .excerpt {
    margin: .4rem 0 0; background: #fcfbf7; border-color: #e6ded0; border-left: 3px solid var(--warm);
    max-height: 22rem; font-size: .74rem;
  }
  .shape .whole {
    display: inline-block; margin: .4rem 0 0; font-family: var(--mono); font-size: .72rem;
    color: var(--accent); text-decoration: none; border-bottom: 1px dotted currentColor;
  }
  label.field .shape { margin-top: 0; }
  label.field code { background: #eef2f6; padding: .08em .3em; border-radius: 3px; }
  label.field a { color: var(--accent); text-decoration: none; border-bottom: 1px dotted currentColor; }
  input[type=text], select, textarea {
    width: 100%; font-family: var(--mono); font-size: .8rem; padding: .4rem .5rem;
    border: 1px solid var(--line); border-radius: 4px; background: #fcfcfc; color: var(--ink);
  }
  textarea { min-height: 9rem; resize: vertical; line-height: 1.5; }
  textarea.fixed { background: #f3f3f3; color: var(--muted); cursor: default; }
  /* The parts of a body that is not JSON, listed rather than serialized:
     there is no text form of a multipart request worth showing anybody. */
  pre.parts { background: #f3f3f3; border-color: var(--line); color: var(--muted); }
  input[type=file] { font: inherit; font-size: .8rem; color: var(--muted); }

  button.primary {
    font: inherit; font-size: .85rem; cursor: pointer; padding: .4rem 1rem;
    border-radius: 4px; border: 1px solid var(--accent); background: var(--accent); color: #fff;
  }
  button.primary:disabled { opacity: .45; cursor: not-allowed; }
  button.primary:disabled[data-done] { opacity: .6; }

  pre {
    margin: .8rem 0 0; padding: .7rem .8rem; max-height: 26rem; overflow: auto;
    background: #f7f9fc; border: 1px solid #dbe4f0; border-radius: 4px;
    font-family: var(--mono); font-size: .76rem; line-height: 1.5; white-space: pre-wrap;
  }
  pre .label {
    display: block; font-family: inherit; font-size: .68rem; letter-spacing: .04em;
    text-transform: uppercase; color: var(--accent); margin-bottom: .35rem; font-weight: 600;
  }
  pre .label code { font-family: var(--mono); text-transform: none; letter-spacing: 0; }
  pre .label a { color: inherit; text-transform: none; letter-spacing: 0; border-bottom: 1px dotted currentColor; text-decoration: none; }
  pre.bad { background: #fdf6f6; border-color: #eccfcf; }
  /* A scenario's steps: what each called, what came back, what it checked. */
  ol.scenario-steps { padding-left: 1.2rem; margin: .8rem 0 0; }
  ol.scenario-steps > li { margin: 0 0 .9rem; }
  .scenario-steps .step-head { display: flex; gap: .5rem; align-items: baseline; flex-wrap: wrap; }
  .scenario-steps .mark { font-weight: 700; width: 1rem; }
  .scenario-steps .mark.passed { color: var(--ok); }
  .scenario-steps .mark.failed { color: var(--bad); }
  .scenario-steps .mark.pending { color: var(--muted); }
  .scenario-steps .call { font-family: var(--mono); font-size: .8rem; color: var(--accent); }
  .scenario-steps .checks { list-style: none; padding: 0; margin: .3rem 0 0; font-family: var(--mono); font-size: .78rem; }
  .scenario-steps .checks .passed { color: var(--ok); }
  .scenario-steps .checks .failed { color: var(--bad); }
  .scenario-steps details { margin-top: .3rem; font-size: .8rem; }
  pre.bad .label { color: var(--bad); }

  .empty { color: var(--faint); font-size: .9rem; }
  @media (max-width: 60rem) {
    #shell { grid-template-columns: 1fr; }
    #groups { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header id="masthead">
  <div class="intro">
    <h1>Not your average Mock Server</h1>
    <p class="lede">
      An entire server, generated from a set of contracts, running in this tab.
      <b>No custom code.</b> Everything is derived on the fly when the server
      boots. Change a contract and the API changes with it; hand it a different
      contract set and it is a different system.
    </p>
    <div id="controls">
      <button id="mode" class="primary">Let me explore</button>
      <button id="scenarios">Scenarios</button>
      <span class="sep"></span>
      <button id="reseed">Restart with data</button>
      <button id="empty">Start empty</button>
    </div>
  </div>
  <div id="derived">starting…</div>
</header>

<div id="shell">
  <nav id="groups" aria-label="Operations"></nav>
  <main id="stage"></main>
</div>

e domain's *-sla-types.yaml.\n","enum":["snap_standard","medicaid_standard"]}}}}},{"relativePath":"base/domains/platform/platform-events-openapi.yaml","domain":"platform","type":"openapi","content":{"openapi":"3.1.0","info":{"title":"Events","version":"1.0.0","x-domain":"platform","x-status":"beta","x-visibility":"internal","description":"The centralized log of domain events across every domain, as CloudEvents\n1.0 envelopes. Supports REST polling and a live stream, and keeps a\npermanent audit history whether or not a message broker is in use.\n\nPublishing records an event a domain producer emits. It is for systems\nrecording what happened, not for requests made on a person's behalf.\n"},"servers":[{"url":"https://api.example.com/platform","description":"Production server"},{"url":"http://localhost:1080/platform","description":"Local development server"}],"tags":[{"name":"Events","description":"Centralized event log across all domains."}],"paths":{"/events":{"get":{"summary":"List events","description":"Queryable log of all domain events across the blueprint. Supports\nREST polling as an integration pattern and provides permanent audit\nhistory regardless of whether a message broker is in use.\n\nEvents are returned in ascending time order (oldest first) to support\ncursor-based polling.\n","operationId":"listEvents","tags":["Events"],"x-sortable":{"fields":["time","type","source"],"default":"time","tieBreaker":"id"},"parameters":[{"$ref":"../../components/parameters.yaml#/SearchQueryParam"},{"$ref":"../../components/parameters.yaml#/SortParam"},{"name":"type","in":"query","description":"Filter by CloudEvents type. Supports prefix matching with a trailing wildcard (e.g., `intake.*`). When states apply an x-event-type-prefix overlay, the resolved prefix is prepended to all event types (e.g., `org.example.intake.*`).\n","schema":{"type":"string"},"example":"intake.application.submitted"},{"name":"source","in":"query","description":"Filter by CloudEvents source (the domain that produced the event, e.g., `/intake`, `/workflow`).","schema":{"type":"string"},"example":"/intake"},{"name":"subject","in":"query","description":"Filter by CloudEvents subject — the entity ID the event pertains to. Because every domain uses the same subject for the same entity, this returns a complete cross-domain timeline for that entity.\n","schema":{"type":"string","format":"uuid"}},{"name":"traceid","in":"query","description":"Filter by W3C Trace Context trace ID extracted from the `traceparent` attribute. All events sharing a trace ID were causally triggered by the same root action.\n","schema":{"type":"string"}},{"name":"causationid","in":"query","description":"Filter by the `causationid` extension — the ID of the event that directly caused this one. Use it to find the response event(s) produced by a specific trigger (e.g., the `call.completed` fired for one `service_call.created` when several were emitted for the same subject).\n","schema":{"type":"string","format":"uuid"}},{"name":"start","in":"query","description":"Return only events at or after this timestamp (ISO 8601).","schema":{"type":"string","format":"date-time"}},{"name":"end","in":"query","description":"Return only events before or at this timestamp (ISO 8601).","schema":{"type":"string","format":"date-time"}},{"$ref":"../../components/parameters.yaml#/LimitParam"},{"$ref":"../../components/parameters.yaml#/OffsetParam"}],"responses":{"200":{"description":"Paginated list of CloudEvents envelopes, ordered by time ascending.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/EventList"}}}},"400":{"$ref":"../../components/responses.yaml#/BadRequest"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}},"post":{"summary":"Publish an event","description":"Publish a CloudEvents 1.0 envelope to the event log. Used by domain\nproducers to record state transitions and significant data mutations.\n","operationId":"publishEvent","tags":["Events"],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/Event"}}}},"responses":{"201":{"description":"Event published successfully.","headers":{"Location":{"description":"URL of the published event.","schema":{"type":"string","format":"uri"}}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/Event"}}}},"400":{"$ref":"../../components/responses.yaml#/BadRequest"},"422":{"$ref":"../../components/responses.yaml#/UnprocessableEntity"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}}},"/events/stream":{"get":{"summary":"Stream domain events (SSE)","description":"Real-time stream of domain events delivered as Server-Sent Events (SSE).\n\nConnect with `Accept: text/event-stream`. Each event is delivered as a\n`data:` line containing a JSON-encoded `Event` object.\n\nThe stream stays open until the client disconnects. A `: heartbeat` comment\nis sent every 30 seconds to prevent proxy timeouts.\n","operationId":"streamEvents","tags":["Events"],"responses":{"200":{"description":"SSE stream of domain events.","content":{"text/event-stream":{"schema":{"type":"string","description":"Newline-delimited SSE frames, each containing a JSON Event."}}}}}}},"/events/{eventId}":{"parameters":[{"name":"eventId","in":"path","required":true,"description":"Unique identifier of the domain event.","schema":{"type":"string","format":"uuid"}}],"get":{"summary":"Get a domain event","description":"Retrieve a single domain event by its identifier.","operationId":"getEvent","tags":["Events"],"responses":{"200":{"description":"Domain event retrieved successfully.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Event"}}}},"404":{"$ref":"../../components/responses.yaml#/NotFound"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}}}},"components":{"schemas":{"Event":{"$ref":"../../schemas/events.yaml#/$defs/Event"},"EventList":{"description":"Paginated list of domain events.","allOf":[{"$ref":"../../components/pagination.yaml#/Pagination"},{"type":"object","required":["items"],"properties":{"items":{"type":"array","items":{"$ref":"#/components/schemas/Event"}}}}]}}}}},{"relativePath":"base/domains/platform/platform-registries-openapi.yaml","domain":"platform","type":"openapi","content":{"openapi":"3.1.0","info":{"title":"Registries","version":"1.0.0","x-domain":"platform","x-status":"beta","x-visibility":"internal","description":"Named, citable entries the contracts declare in registry files — regulatory\npolicies, sources, design patterns — readable by type. Entries carry a\ndescription and whatever fields their type defines.\n"},"servers":[{"url":"https://api.example.com/platform","description":"Production server"},{"url":"http://localhost:1080/platform","description":"Local development server"}],"tags":[{"name":"Registries","description":"Entries the contracts declare in registry files, by type."}],"paths":{"/registry":{"get":{"summary":"List registry types","description":"Every registry type the contracts declare, with how many entries each\nhas, in name order. `q` matches a type's name.\n","operationId":"listRegistryTypes","tags":["Registries"],"x-sortable":{"fields":["type"],"default":"type","tieBreaker":"type"},"parameters":[{"$ref":"../../components/parameters.yaml#/SearchQueryParam"},{"$ref":"../../components/parameters.yaml#/LimitParam"},{"$ref":"../../components/parameters.yaml#/OffsetParam"},{"$ref":"../../components/parameters.yaml#/SortParam"}],"responses":{"200":{"description":"The registry types, in name order.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RegistryTypeList"}}}},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}}},"/registry/{type}":{"parameters":[{"$ref":"#/components/parameters/RegistryTypeParam"}],"get":{"summary":"List a registry's entries","description":"Every entry of one registry type, from every file of that type, in id\norder. `q` matches an entry's id or description.\n","operationId" mas/RegistryType"}}}}]},"RegistryEntry":{"type":"object","required":["id","description"],"additionalProperties":true,"description":"An entry, with its id and the fields its type defines.","properties":{"id":{"type":"string","description":"The entry's stable id."},"description":{"type":"string","description":"Human-readable text for the entry."},"deprecated":{"type":"boolean","description":"When true, the entry should not be newly referenced."}}},"RegistryEntryList":{"description":"Paginated list of registry entries.","allOf":[{"$ref":"../../components/pagination.yaml#/Pagination"},{"type":"object","required":["items"],"properties":{"items":{"type":"array","items":{"$ref":"#/components/schemas/RegistryEntry"}}}}]}}}}},{"relativePath":"base/domains/transcription/transcription-config-schema.yaml","domain":"transcription","type":"schema","content":{"$schema":"https://json-schema.org/draft/2020-12/schema","$id":"https://blueprint.codeforamerica.org/base/domains/transcription/transcription-config-schema.yaml","title":"Transcription Config","domain":"transcription","description":"Schema for transcription-config.yaml. Validates the profile catalog's entries.","allOf":[{"$ref":"https://blueprint.codeforamerica.org/schemas/config-schema.yaml"}],"type":"object","properties":{"domain":{"const":"transcription","description":"Must be \"transcription\"."},"profiles":{"type":"object","description":"Profile catalog: the transcription service and languages to use for each kind of conversation. Seeded where they do not exist yet; afterwards they are changed through the API, and never deleted.\n","required":["resource","entries"],"additionalProperties":false,"properties":{"resource":{"const":"TranscriptionProfile"},"entries":{"type":"array","items":{"$ref":"#/$defs/ProfileConfig"}}}}},"unevaluatedProperties":false,"$defs":{"ProfileConfig":{"type":"object","description":"A profile, as the TranscriptionProfile resource has it.","required":["id","name","provider"],"additionalProperties":false,"properties":{"id":{"type":"string","format":"uuid","description":"Stable identifier, so overlays and transcripts can refer to it."},"name":{"type":"string","pattern":"^[a-z0-9]+(-[a-z0-9]+)*$","description":"A short handle people tell profiles apart by, e.g. `english-phone`."},"description":{"type":"string"},"provider":{"type":"string","description":"An entry of the `transcription-services` registry, or `none`."},"languages":{"type":"array","minItems":1,"uniqueItems":true,"items":{"$ref":"../../schemas/enums.yaml#/$defs/Language"}}}}}}},{"relativePath":"base/domains/transcription/transcription-config.yaml","domain":"transcription","type":"config","content":{"$schema":"transcription-config-schema.yaml","version":"1.0","domain":"transcription","profiles":{"resource":"TranscriptionProfile","entries":[{"id":"7a1e0c2d-0000-4000-8000-0000000000b1","name":"english","description":"An interview in English.","provider":"aws-transcribe","languages":["en-US"]},{"id":"7a1e0c2d-0000-4000-8000-0000000000b2","name":"english-or-spanish","description":"An interview in English, Spanish, or both — the service tells which is being spoken.","provider":"aws-transcribe","languages":["en-US","es-US"]},{"id":"7a1e0c2d-0000-4000-8000-0000000000b3","name":"typed","description":"A chat, or notes a person types. No transcription service.","provider":"none"}]}}},{"relativePath":"base/domains/transcription/transcription-mock-data.yaml","domain":"transcription","type":"mock-data","content":{"domain":"transcription","TranscriptExample1":{"id":"7a1e0c2d-0000-4000-8000-000000000001","subjectType":"interview","subjectId":"7a1e0c2d-0000-4000-8000-0000000000a1","profileId":"7a1e0c2d-0000-4000-8000-0000000000b1","model":"standard","client":"interview-assistant/0.1.0","status":"recording","startedAt":"2026-10-11T14:00:00Z","createdAt":"2026-10-11T14:00:00Z","updatedAt":"2026-10-11T14:00:00Z"},"TranscriptExample2":{"id":"7a1e0c2d-0000-4000-8000-000000000002","subjectType":"chat","subjectId":"7a1e0c2d-0000-4000-8000-0000000000a2","profileId":"7a1e0c2d-0000-4000-8000-0000000000b3","client":"webchat/2.1.0","status":"closed","startedAt":"2026-10-09T09:50:00Z","closedAt":"2026-10-09T10:12:00Z","createdAt":"2026-10-09T09:50:00Z","updatedAt":"2026-10-09T10:12:00Z"},"TranscriptEntryExample1":{"id":"7a1e0c2d-0000-4000-8000-0000000000e1","transcriptId":"7a1e0c2d-0000-4000-8000-000000000001","kind":"line","startedAt":"2026-10-11T14:00:05Z","endedAt":"2026-10-11T14:00:09Z","text":"Thanks for coming in. Can you tell me who lives in your household?","speaker":"staff","speakerLabel":"spk_0","confidence":0.96,"createdAt":"2026-10-11T14:00:10Z","updatedAt":"2026-10-11T14:00:10Z"},"TranscriptEntryExample2":{"id":"7a1e0c2d-0000-4000-8000-0000000000e2","transcriptId":"7a1e0c2d-0000-4000-8000-000000000001","kind":"line","startedAt":"2026-10-11T14:00:11Z","endedAt":"2026-10-11T14:00:16Z","text":"It's me and my two kids, and my mother stays with us most weeks.","speaker":"client","speakerLabel":"spk_1","confidence":0.91,"createdAt":"2026-10-11T14:00:17Z","updatedAt":"2026-10-11T14:00:17Z"},"TranscriptEntryExample3":{"id":"7a1e0c2d-0000-4000-8000-0000000000e3","transcriptId":"7a1e0c2d-0000-4000-8000-000000000001","kind":"gap","startedAt":"2026-10-11T14:01:02Z","endedAt":"2026-10-11T14:01:20Z","cause":"connection","createdAt":"2026-10-11T14:01:21Z","updatedAt":"2026-10-11T14:01:21Z"},"TranscriptEntryExample4":{"id":"7a1e0c2d-0000-4000-8000-0000000000e4","transcriptId":"7a1e0c2d-0000-4000-8000-000000000001","kind":"pause","startedAt":"2026-10-11T14:03:00Z","endedAt":"2026-10-11T14:04:30Z","createdAt":"2026-10-11T14:03:00Z","updatedAt":"2026-10-11T14:04:30Z"}}},{"relativePath":"base/domains/transcription/transcription-registry-transcription-services.yaml","domain":"transcription","type":"registry","content":{"$schema":"https://blueprint.codeforamerica.org/schemas/registry-schema.yaml","version":"1.0.0","domain":"transcription","type":"transcription-services","entries":{"aws-transcribe":{"description":"Amazon Transcribe streaming."},"elevenlabs-scribe":{"description":"ElevenLabs Scribe realtime."},"none":{"description":"No transcription service — a chat, or lines a person typed. A transcript naming it has no model."}}}},{"relativePath":"base/domains/transcription/transcription-transcripts-asyncapi.yaml","domain":"transcription","type":"asyncapi","content":{"asyncapi":"3.0.0","info":{"x-domain":"transcription","title":"Transcript events","version":"0.1.0","x-status":"alpha","description":"Events a transcript emits as it is paused, resumed and closed."},"channels":{"transcription.transcript.paused":{"address":"transcription.transcript.paused","messages":{"TranscriptPaused":{"$ref":"#/components/messages/TranscriptPausedMessage"}}},"transcription.transcript.resumed":{"address":"transcription.transcript.resumed","messages":{"TranscriptResumed":{"$ref":"#/components/messages/TranscriptResumedMessage"}}},"transcription.transcript.closed":{"address":"transcription.transcript.closed","messages":{"TranscriptClosed":{"$ref":"#/components/messages/TranscriptClosedMessage"}}}},"components":{"messages":{"TranscriptPausedMessage":{"name":"transcription.transcript.paused","summary":"The conversation went off the record. Anything said until it resumes is not stored.","payload":{"$ref":"#/components/schemas/TranscriptPausedEvent"}},"TranscriptResumedMessage":{"name":"transcription.transcript.resumed","summary":"The conversation is back on the record.","payload":{"$ref":"#/components/schemas/TranscriptResumedEvent"}},"TranscriptClosedMessage":{"name":"transcription.transcript.closed","summary":"The transcript has ended.","payload":{"$ref":"#/components/schemas/TranscriptClosedEvent"}}},"schemas":{"TranscriptPausedEvent":{"allOf":[{"$ref":"../../schemas/events.yaml#/$defs/Event"},{"type":"object","properties":{"type":{"type":"string","const":"transcription.transcript.paused"}}}]},"TranscriptResumedEvent":{"allOf":[{"$ref":"../../schemas/events.yaml#/$defs/Event"},{"type":"object","properties":{"type":{"type":"string","const":"transcription.transcript.resumed"}}}]},"TranscriptClosedEvent":{"allOf":[{"$ref":"../../schemas/events.yaml#/$defs/Event"},{"type":"object","properties":{"type":{"type":"string","const":"transcription.transcript.closed"}}}]}}}}},{"relativePath":"base/domains/transcription/transcription-transcripts-openapi.yaml","domain":"transcription","type":"openapi","content":{"openapi":"3.1.0","info":{"title":"Transcripts","version":"0.1.0","x-domain":"transcription","x-status":"alpha","x-visibility":"internal","description":"The written record of a conversation. Starting a transcript opens it for\nrecording; pausing takes the conversation off the record; closing ends it.\nA transcript refers to what it records — an interview, a call — and names\nthe profile it was started under, which says the transcription service,\nand the client and model that produced its lines. Updating corrects what\nit records; deleting removes it, and the event left behind says which one\nand by whom.\n\nA profile is a state's choice of transcription service and languages for\na kind of conversation. The deployment's config seeds them; they can be\nadded and changed here, never deleted, so every transcript's profile\nstill exists.\n\nIts entries are its timeline, in the order things happened: lines, gaps\nwhere nothing was captured, and pauses. Every time on a transcript and its\nentries is the client's — when it started, paused, resumed and closed, and\nwhen each line was said — so they are compared on one clock.\n"},"servers":[{"url":"https://api.example.com/transcription","description":"Production server"},{"url":"http://localhost:1080/transcription","description":"Local development server"}],"tags":[{"name":"Transcripts","description":"The written record of a conversation."},{"name":"Transcript entries","description":"A transcript's timeline — lines, gaps and pauses."},{"name":"Transcription profiles","description":"The transcription service and languages to use for a kind of conversation."}],"x-events":{"transcript.created":{"type":"org.codeforamerica.safety-net-blueprint.transcription.transcript.created","summary":"Emitted when a transcript is started.","payload":{"$ref":"#/components/schemas/TranscriptCreatedEvent"}},"transcript.updated":{"type":"org.codeforamerica.safety-net-blueprint.transcription.transcript.updated","summary":"Emitted when a transcript is updated via PATCH.","payload":{"$ref":"#/components/schemas/TranscriptUpdatedEvent"}},"transcript.deleted":{"type":"org.codeforamerica.safety-net-blueprint.transcription.transcript.deleted","summary":"Emitted when a transcript is deleted. Records which transcript, and who deleted it.","payload":{"$ref":"#/components/schemas/TranscriptDeletedEvent"}},"transcript_entry.created":{"type":"org.codeforamerica.safety-net-blueprint.transcription.transcript_entry.created","summary":"Emitted when an entry is added to a transcript — a line, a gap, or a pause beginning.","payload":{"$ref":"#/components/schemas/TranscriptEntryCreatedEvent"}},"transcript_entry.updated":{"type":"org.codeforamerica.safety-net-blueprint.transcription.transcript_entry.updated","summary":"Emitted when an entry changes — a pause ending, as the transcript resumes or closes.","payload":{"$ref":"#/components/schemas/TranscriptEntryUpdatedEvent"}},"profile.created":{"type":"org.codeforamerica.safety-net-blueprint.transcription.profile.created","summary":"Emitted when a profile is added through the API.","payload":{"$ref":"#/components/schemas/TranscriptionProfileCreatedEvent"}},"profile.updated":{"type":"org.codeforamerica.safety-net-blueprint.transcription.profile.updated","summary":"Emitted when a profile is changed. Records each field before and after, so what a profile said when a transcript started can be looked up.","payload":{"$ref":"#/components/schemas/TranscriptionProfileUpdatedEvent"}}},"paths":{"/transcripts":{"get":{"summary":"List transcripts","description":"Retrieve a pa scriptIdParam"}],"get":{"summary":"Get a transcript","description":"Retrieve a single transcript by identifier.","operationId":"getTranscript","tags":["Transcripts"],"responses":{"200":{"description":"Transcript retrieved successfully.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Transcript"},"examples":{"TranscriptExample1":{"$ref":"#/components/examples/TranscriptExample1"}}}}},"404":{"$ref":"../../components/responses.yaml#/NotFound"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}},"patch":{"summary":"Update a transcript","description":"Correct what a transcript records — its subject, model or client. Its\nprofile does not change, and its status changes only through `pause`,\n`resume` and `close`.\n","operationId":"updateTranscript","tags":["Transcripts"],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/TranscriptUpdate"}}}},"responses":{"200":{"description":"Transcript updated.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Transcript"}}}},"400":{"$ref":"../../components/responses.yaml#/BadRequest"},"404":{"$ref":"../../components/responses.yaml#/NotFound"},"422":{"$ref":"../../components/responses.yaml#/UnprocessableEntity"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}},"delete":{"summary":"Delete a transcript","description":"Permanently remove a transcript. The `transcription.transcript.deleted`\nevent records which transcript was removed and who removed it.\n","operationId":"deleteTranscript","tags":["Transcripts"],"responses":{"204":{"description":"Transcript deleted."},"404":{"$ref":"../../components/responses.yaml#/NotFound"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}}},"/transcripts/{transcriptId}/entries":{"parameters":[{"$ref":"#/components/parameters/TranscriptIdParam"}],"get":{"summary":"List a transcript's entries","description":"A transcript's timeline, in the order things happened — by `st ines are accepted."},{"id":"paused","slaClock":"stopped","description":"The conversation is off the record — an applicant asked, say. Nothing said now is stored."},{"id":"closed","slaClock":"stopped","description":"The transcript has ended. Terminal."}],"initialState":"recording","guards":[{"id":"atAfterStart","description":"the time given is not before the transcript started","condition":"timestamp(request.at) >= timestamp(object.startedAt)"},{"id":"atAfterPauseBegan","description":"the time given is not before the open pause began","condition":"openPause == null || timestamp(request.at) >= timestamp(openPause.startedAt)"},{"id":"aPauseIsOpen","description":"a pause is open","condition":"openPause != null"},{"id":"profileExists","description":"the transcript's profile exists","condition":"profile != null"},{"id":"modelGivenForTheService","description":"a model is given when the profile names a transcription service","condition":"profile == null || profile.provider == \"none\" || has(request.model)"},{"id":"startedWhileRecording","description":"the entry started while the transcript was recording — after it started, not during a pause, and before it closed","condition":"timestamp(request.startedAt) >= timestamp(object.startedAt) && pauseAtStart == null && (!has(object.closedAt) || timestamp(request.startedAt) \u003c timestamp(object.closedAt))"},{"id":"endsAfterItStarts","description":"the entry does not end before it starts","condition":"timestamp(request.endedAt) >= timestamp(request.startedAt)"},{"id":"gapOutsidePauses","description":"a gap does not overlap a pause","condition":"request.kind != \"gap\" || pauseOverlap == null"}],"actions":[{"id":"pause","description":"Take the conversation off the record, at the time the client says.","transition":{"from":"recording","to":"paused"},"schema":{"request":{"$ref":"#/$defs/AtRequest"}},"guards":[{"conditions":["atAfterStart"]}],"steps":[{"call":{"POST":"transcription/transcripts/$object.id/entries","body":{"kind":"pau where":"item.kind == \"pause\" && item.transcriptId == object.id && timestamp(item.startedAt) \u003c timestamp(request.endedAt) && (item.endedAt == null || timestamp(item.endedAt) > timestamp(request.startedAt))"}}],"guards":[{"conditions":["startedWhileRecording","endsAfterItStarts","gapOutsidePauses"]}]},"update":{"guards":[{"actors":["system"]}]}}}}],"$defs":{"AtRequest":{"type":"object","additionalProperties":false,"required":["at"],"properties":{"at":{"type":"string","format":"date-time","description":"When it happened, by the client's clock."}}}}}},{"relativePath":"base/schemas/auth.yaml","domain":null,"type":"schema","content":{"$schema":"https://json-schema.org/draft/2020-12/schema","$id":"https://blueprint.codeforamerica.org/base/schemas/auth.yaml","title":"CommonAuth","description":"Shared connection and credential configuration schemas. Used in domain config files (e.g., data-exchange-config.yaml, eligibility-adapter-config.yaml) to define how adapters connect to external services.\n","$defs":{"Endpoint":{"type":"object","description":"Connection parameters for an external service. States overlay their domain config files (e.g., data-exchange-config.yaml) to fill in these fields for each service. No credentials live here — secrets are injected at deploy time via environment variables or a state-configured secrets manager, and referenced by name in the endpoint block.\n","additionalProperties":true,"required":["url"],"properties":{"url":{"type":"string","format":"uri","description":"Base URL for the external service endpoint.","example":"https://hub.cms.gov/fdsh/ssa"},"timeoutMs":{"type":"integer","description":"Request timeout in milliseconds. Defaults to adapter implementation default if omitted.","minimum":0,"example":30000},"apiVersion":{"type":"string","description":"Service API version, if the external service requires explicit versioning.","example":"2.0"}}}}}},{"relativePath":"base/schemas/enums.yaml","domain":null,"type":"schema","content":{"$schema":"https://json-schema.org/draft/2020-12/schema","$id":"https://blueprint.codeforamerica.org/base/schemas/enums.yaml","$defs":{"Domain":{"type":"string","description":"Blueprint domain identifier. Used as the {domain} path parameter on metadata mutation endpoints and as the value type for x-domain annotations on domain OpenAPI specs. Its values are generated at resolve time: the domains the set's OpenAPI, AsyncAPI and rules documents declare.\n","enum":["document-management","eligibility","intake","platform","scheduling","transcription"]},"MetricCollection":{"type":"string","description":"Harness metric collections. Extends the base MetricCollection with the primary resource collections for intake and eligibility domains.\n","enum":["applications","determinations","events"]},"Frequency":{"type":"string","description":"How often an amount is received, incurred, or scheduled. Applies to income, expenses, SLA recurrence, scheduled reviews, and any other time-based cadence. Domain packages can extend this enum via overlay.\n","enum":["daily","weekly","every_two_weeks","twice_monthly","monthly","yearly","variable"]},"Language":{"type":"string","description":"Preferred language (BCP 47 language tag).","pattern":"^[a-zA-Z]{2,3}(?:-[a-zA-Z0-9]{2,8})*$"},"ConfigSource":{"type":"string","readOnly":true,"description":"Where a record of a config-seeded resource came from. `system`: the deployment's config file, which seeds it once; afterwards it can be changed through the API, but not deleted. `user`: added through the API, and deletable where the API allows it. A client can use it to leave out a delete it would be refused, without trying it first.\n","enum":["system","user"]},"RoleType":{"type":"string","description":"Harness authorization roles. Replaces the base RoleType with the roles the harness's state machine guards name.\n- applicant: The household applying, acting on its own application - case_worker: Processes applications - supervisor: Oversees case workers - system: Automated service account for background and inter-service operations\n","enum":["applicant","case_worker","supervisor","system"]}}}},{"relativePath":"base/schemas/events.yaml","domain":null,"type":"schema","content":{"$schema":"https://json-schema.org/draft/2020-12/schema","$id":"https://blueprint.codeforamerica.org/base/schemas/events.yaml","$defs":{"EventRef":{"type":"object","required":["type"],"properties":{"type":{"type":"string","description":"Fully qualified CloudEvents event type following the convention {domain}.{entity}.{action} (e.g., intake.application.submitted). Must match a channel address declared in the domain's eventsSpec AsyncAPI file.\n"},"description":{"type":"string","description":"Human-readable annotation for state machine authors. Not a CloudEvents field."}}},"EventBase":{"allOf":[{"$ref":"#/$defs/EventRef"},{"type":"object","properties":{"subject":{"type":"string","description":"CloudEvents subject override. The entity ID the event pertains to. Defaults to the emitting resource's own id when omitted.\n"},"causationid":{"type":"string","description":"CloudEvents Causation extension (optional). Value expression resolving to the id of the event that directly caused this one. Use when an event is emitted in response to another event (e.g., auto-resume triggered by a timer callback).\n"},"data":{"type":"object","additionalProperties":true,"description":"Event-specific payload. Field values are value expressions resolved at emit time."}}}]},"Event":{"allOf":[{"$ref":"#/$defs/EventBase"},{"type":"object","required":["specversion","id","source","subject","time","datacontenttype"],"properties":{"specversion":{"type":"string","const":"1.0","description":"CloudEvents specification version."},"id":{"type":"string","format":"uuid","description":"Unique event identifier."},"source":{"type":"string","description":"Domain base path that produced the event (e.g., /intake, /workflow).","example":"/intake"},"subject":{"type":"string","format":"uuid","description":"Entity ID the event pertains to."},"time":{"type":"string","format":"date-time","description":"When the event occurred."},"datacontenttype":{"type":"string","const":"application/json","description":"Media type of the event payload."},"traceparent":{"type":["string","null"],"description":"W3C Trace Context header (optional). Propagated from the triggering request or event. The trace ID component is stable across the full causal chain.\n"},"causationid":{"type":["string","null"],"format":"uuid","description":"CloudEvents Causation extension (optional). The `id` of the event that directly caused this one. Use when an event is emitted in direct response to another event (e.g., a task auto-resumed because a timer fired). Allows consumers to trace the immediate cause without inspecting the full distributed trace.\n"},"authid":{"type":["string","null"],"description":"CloudEvents Auth Context extension (optional). Principal identifier (userId from JWT claims) of the actor who triggered the event. No PII — user ID only, not name or email. Required for FTI-governed events per IRS Pub. 1075. Omitted when no caller identity is present.\n"},"authtype":{"type":["string","null"],"enum":["user","service_account","api_key","system","unauthenticated","unknown",null],"description":"CloudEvents Auth Context extension (optional). Principal type of the actor who triggered the event. Required when authid is present. Required for FTI-governed events per IRS Pub. 1075.\n"},"data":{"type":"object","description":"Event-specific payload. Schema is defined per event type in each domain's AsyncAPI file."}}}]}},"FieldChange":{"type":"object","description":"A single field change recorded in an updated event.","additionalProperties":false,"required":["field","before","after"],"properties":{"field":{"type":"string","description":"Dot-path of the changed field. Top-level fields are a simple name (e.g. `status`); nested fields use dot notation (e.g. `personalInformation.dateOfBirth`). Arrays are treated as leaf values — the path identifies the array field itself, not individual elements.\n"},"before":{"description":"Value of the field before the update."},"after":{"description":"Value of the field after the update."}}},"ResourceUpdatedEvent":{"type":"object","description":"Payload for a CRUD-emitted updated event. Contains a field-level diff\nrecording which fields changed and their before/after values.\n\nEmitted automatically by the mock server on every PATCH request.\nConsumers can react to specific field mutations without fetching the\nfull resource.\n","required":["changes"],"properties":{"changes":{"type":"array","description":"List of fields that changed, with before and after values.","items":{"$ref":"#/FieldChange"}}}},"ResourceDeletedEvent":{"type":"object","description":"Payload for a CRUD-emitted deleted event. Carries no data — the entity\nno longer exists and consumers should treat the subject ID as permanently\nremoved.\n","properties":{}},"SchedulingTimerCancelledEvent":{"type":"object","description":"Payload for a timer cancellation request sent to the scheduling service.\nIf the timer has already fired or does not exist, this is a no-op.\n","required":["timerId"],"properties":{"timerId":{"type":"string","description":"The timer to cancel."}}},"SchedulingTimerRequestedEvent":{"type":"object","description":"Payload for a timer request sent to the scheduling service. The scheduling\nservice registers the timer and fires the caller-specified callback event\nwhen the timer expires, passing callback.data through unchanged and adding\ntimerId to the payload.\n","required":["timerId","callback"],"properties":{"timerId":{"type":"string","description":"Deterministic timer identifier in the form domain.timerType.objectId (e.g., workflow.creation_deadline.task-123). Used as the cancellation key — safe to register idempotently with the same ID.\n"},"fireAfter":{"type":"string","description":"ISO 8601 duration to wait before firing (e.g., PT72H, P30D). Mutually exclusive with fireAt."},"fireAt":{"type":"string","format":"date-time","description":"Absolute timestamp to fire at. Use when the fire time is tied to a known deadline on the object. Mutually exclusive with fireAfter."},"fireOffset":{"type":"string","description":"ISO 8601 duration (negative) applied to fireAt to fire before the target time (e.g., -PT48H fires 48 hours before fireAt). Only valid when fireAt is set."},"calendarType":{"type":"string","enum":["calendar","business"],"description":"When business, elapsed time counts only business days. Defaults to calendar."},"callback":{"type":"object","description":"What to deliver when the timer fires.","required":["event","data"],"properties":{"event":{"type":"string","description":"CloudEvents type of the domain-specific event to emit when the timer expires (e.g., workflow.creation_deadline). The scheduling service passes this through unchanged — it does not derive or modify the event name.\n"},"data":{"type":"object","description":"Payload to include in the callback event, passed through unchanged. The scheduling service adds timerId to this payload before delivery.","additionalProperties":true}}}}},"TimerCallbackEvent":{"type":"object","description":"Payload delivered by the scheduling service when a timer expires. Contains\ncallback.data from the original scheduling.timer.requested event, passed\nthrough unchanged, with timerId added by the scheduling service.\n\nThe scheduling service is a pure relay — it does not add, derive, or modify\nany fields beyond timerId. The event name is the domain-specific name from\ncallback.event in the original request (e.g., workflow.creation_deadline),\nnot a generic scheduler.timer.fired event.\n","required":["timerId"],"properties":{"timerId":{"type":"string","description":"The deterministic timer ID from the original scheduling request."}},"additionalProperties":true}}},{"relativePath":"base/schemas/identity.yaml","domain":null,"type":"schema","content":{"$sche }],"responses":{"200":{"description":"A page of documents.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/DocumentList"}}}}}},"post":{"operationId":"uploadDocument","tags":["Documents"],"summary":"Upload a document","description":"A `multipart/form-data` request carrying the file itself. The response describes what was stored — name, type, size and a content hash — and not the contents, which are never written anywhere.\n","requestBody":{"required":true,"content":{"multipart/form-data":{"schema":{"type":"object","required":["file","documentTypeId","title"],"properties":{"file":{"type":"string","format":"binary","description":"The file to upload."},"documentTypeId":{"type":"string","example":"proof-of-income","description":"What kind of document this is. Required by the upload handler, which classifies before it stores.\n"},"title":{"type":"string","example":"April pay stub","description":"A human-readable name for the document."}}}}}},"responses":{"201":{"description":"The stored description of the upload.","headers":{"Location":{"description":"URL of the newly created document.","schema":{"type":"string","format":"uri"}}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/Document"}}}},"422":{"$ref":"../../common/components/responses.yaml#/UnprocessableEntity"}}}},"/documents/{documentId}":{"parameters":[{"name":"documentId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}],"get":{"operationId":"getDocument","tags":["Documents"],"summary":"Get one document","responses":{"200":{"description":"The document.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Document"}}}},"404":{"$ref":"../../common/components/responses.yaml#/NotFound"}}}}},"components":{"schemas":{"DocumentWritable":{"type":"object","required":["documentTypeId","title"],"properties":{"documentTypeId":{"type":"string","description":"What kind of document this is."},"title":{"type":"string","description":"A human-readable name for the document."},"documentDate":{"type":"string","format":"date","nullable":true,"description":"The date the document itself bears, which is not the date it arrived."}}},"Document":{"allOf":[{"$ref":"#/components/schemas/DocumentWritable"},{"type":"object","required":["id","lifecycleState","latestVersionId","createdAt","updatedAt"],"properties":{"id":{"type":"string","format":"uuid","readOnly":true},"lifecycleState":{"type":"string","enum":["active","superseded","disposed"],"readOnly":true,"description":"Where this document is in its retention lifecycle."},"legalHold":{"type":"boolean","readOnly":true,"description":"Whether disposition is suspended pending litigation."},"latestVersionId":{"type":"string","format":"uuid","readOnly":true,"description":"The most recent version, which is what describes the file.","x-relationship":{"type":"fk","domain":"document-management","resource":"DocumentVersion","style":"links-only"}},"retentionDeadline":{"type":"string","format":"date-time","nullable":true,"readOnly":true,"description":"When this document becomes eligible for disposition."},"metadata":{"type":"object","additionalProperties":true,"description":"Arbitrary key-value metadata supplied at upload."},"createdAt":{"type":"string","format":"date-time","readOnly":true},"updatedAt":{"type":"string","format":"date-time","readOnly":true},"links":{"type":"object","readOnly":true,"description":"Related resource links.","properties":{"latestVersion":{"type":"string","format":"uri-reference","description":"Link to the related DocumentVersion resource."}}}}}]},"DocumentVersion":{"type":"object","required":["id","documentId","versionNumber","fileName","mimeType","sizeBytes","contentHash"],"properties":{"id":{"type":"string","format":"uuid","readOnly":true},"documentId":{"type":"string","format":"uuid","readOnly":true,"x-relationship":{"type":"fk","resource":"Document","style":"links-only"}},"versionNumber":{"type":"integer","readOnly":true,"description":"Which upload this was, counting from one."},"fileName":{"type":"string","readOnly":true,"description":"The name the file was uploaded under."},"mimeType":{"type":"string","readOnly":true},"sizeBytes":{"type":"integer","readOnly":true,"description":"How many bytes were received, before they were discarded."},"contentHash":{"type":"string","readOnly":true,"description":"SHA-256 of the bytes, computed while reading them."},"uploadedById":{"type":"string","readOnly":true,"description":"Whoever sent it, from the caller identity on the request."},"createdAt":{"type":"string","format":"date-time","readOnly":true},"links":{"type":"object","readOnly":true,"description":"Related resource links.","properties":{"document":{"type":"string","format":"uri-reference","description":"Link to the related Document resource."}}}}},"DocumentList":{"type":"object","required":["items","total"],"properties":{"items":{"type":"array","items":{"$ref":"#/components/schemas/Document"}},"total":{"type":"integer"},"limit":{"type":"integer"},"offset":{"type":"integer"},"hasNext":{"type":"boolean"}}}}}}},{"relativePath":"domains/eligibility/eligibility-annotations.yaml","domain":"eligibility","type":"annotations","content":{"$schema":"annotations-schema.yaml","version":"1.0","domain":"eligibility","schema":{"determination":{"patterns":["polymorphic-base","paginated-list"]},"determination.id":{"patterns":["read-only-field","string-format"]},"determination.applicationId":{"patterns":["cross-domain-fk"]},"determination.expedited":{"policies":["snap-expedited-processing","snap-expedited-screening"],"patterns":["ruleset-output-fact","read-only-field"]},"determination.status":{"patterns":["allof-inline-required","x-enum-source","read-only-field"]},"determination.createdAt":{"patterns":["read-only-field","string-format"]},"determination.updatedAt":{"patterns":["read-only-field","string-format"]},"determination.decisions[]":{"patterns":["sub-resource","paginated-list"]},"determination.decisions[].eligible":{"policies":[" ges since the application was submitted."}}}},"facts":[{"path":"incomeGapExists","type":"boolean","description":"Monthly income is less than monthly expenses — an inconsistency that requires probing for other income sources or assistance (FNS-1104).\n","expression":"household.monthlyIncome \u003c household.monthlyExpenses"},{"path":"workEligibleMembers","description":"Members aged 16–59 who are not employed and may be subject to work requirement screening (7 CFR § 273.7).\n","expression":"household.members.filter(m, m.age >= 16 && m.age \u003c= 54 && !m.isEmployed)"},{"path":"hasUnemployedWorkEligible","type":"boolean","description":"At least one member aged 16–59 is not employed.","expression":"household.members.exists(m, m.age >= 16 && m.age \u003c= 59 && !m.isEmployed)"},{"path":"hasStudentMembers","type":"boolean","description":"At least one household member is enrolled in higher education.","expression":"household.members.exists(m, m.isStudent)"},{"path":"hasNonCitizenMembers","type":"boolean","description":"At least one household member is a non-citizen.","expression":"household.members.exists(m, m.isNonCitizen)"},{"path":"allMembersEmployed","type":"boolean","description":"Every household member is currently employed.","expression":"household.members.all(m, m.isEmployed)"},{"path":"incomeInconsistencyPrompt","type":"boolean","description":"Prompt the household for unexplained income sources or assistance that account for the gap between income and expenses.\n","expression":"incomeGapExists"},{"path":"workRequirementPrompt","type":"boolean","description":"Screen non-employed members aged 16–59 for work requirement exemptions (physical/mental fitness, caregiving, education, etc.).\n","expression":"hasUnemployedWorkEligible"},{"path":"studentEligibilityPrompt","type":"boolean","description":"Screen student members for SNAP student eligibility exceptions (employment, dependent care, work-study, etc.).\n","expression":"hasStudentMembers"},{"path":"immigrationStatu ctive processing."}}]},{"id":"close","description":"Closes the application once intake processing is complete.","schema":{"request":{"$ref":"#/$defs/CloseRequest"}},"transition":{"from":"under_review","to":"closed"},"steps":[{"emit":{"type":"intake.application.closed"}}]},{"id":"withdraw","description":"Withdraws the application at the household's request.","transition":{"from":["draft","submitted","under_review"],"to":"withdrawn"},"guards":[{"actors":["applicant","case_worker"]}],"steps":[{"emit":{"type":"intake.application.withdrawn"}}]}],"events":[{"type":"intake.review_reminder","description":"Escalates an application that has been awaiting caseworker review for too long. Fired by the scheduling service when the review_reminder timer expires.\n","transition":{"from":"submitted"},"steps":[{"emit":{"type":"intake.application.review-reminder","description":"Notify supervisors that this application needs immediate attention."}}]}]}],"$defs":{"CloseRequest":{"type":"object","required":["outcome"],"properties":{"outcome":{"type":"string","enum":["approved","denied"],"description":"Whether the application was approved or denied at close."},"notes":{"type":"string","description":"Optional caseworker notes on the closure decision."}}}}}},{"relativePath":"domains/platform/platform-registry-patterns.yaml","domain":"platform","type":"registry","content":{"$schema":"registry-schema.yaml","version":"1.0","domain":"platform","type":"patterns","entries":{"oneof-discriminator":{"description":"Inline oneOf with a discriminator property, where all variants are defined within the same file (not via external $ref). Exercises discriminated union rendering, discriminator label resolution, and variant expansion in the explorer.\n"},"anyof":{"description":"anyOf composition — a field that may satisfy more than one schema simultaneously (e.g., a record with both electronic and manual verification on file). Exercises anyOf rendering and the semantic distinction from oneOf.\n"},"additional-properties-map":{"description":"Map type using additionalProperties to allow arbitrary key-value pairs (e.g., labels or metadata). Exercises additionalProperties rendering in the explorer and map validation in the schema validator.\n"},"read-only-field":{"description":"Field marked readOnly: true — server-generated and never accepted in write operations. Common for IDs, computed values, and lifecycle timestamps. Exercises readOnly rendering in the explorer and write-operation filtering.\n"},"deprecated-field":{"description":"Field marked deprecated: true with a migration note pointing to its replacement. Exercises deprecated field rendering in the explorer and tooling warnings.\n"},"string-format":{"description":"String field with a format constraint (uuid, date-time, date, email, etc.). Exercises format rendering in the explorer and format validation.\n"},"polymorphic-base":{"description":"Base schema extended via allOf in Create and Update variants. The Create variant adds required fields; the Update variant applies minProperties: 1 for partial updates. Exercises allOf merging and the Create/Update schema pattern.\n"},"array-of-enum":{"description":"Array of enum values. Exercises array-of-enum rendering in the explorer and array item validation in the schema validator.\n"},"x-enum-source":{"description":"Enum values resolved at build time from an external source (e.g., a state machine's state IDs) via the x-enum-source extension, rather than hardcoded in the OpenAPI spec. Exercises the resolver's x-enum-source injection.\n"},"nullable-state-gated-field":{"description":"Nullable field that is only present after a lifecycle transition (e.g., a timestamp set when an application is submitted). Exercises nullable field rendering and the pattern of state-gated fields.\n"},"nullable-conditional-field":{"description":"Nullable field whose presence depends on another field's value (e.g., a benefit amount present only when eligible is true). Exercises nullable field handling and conditional presence patterns.\n"},"external-ref-shared-defs":{"description":"External $ref to a shared $defs schema in a separate file. Exercises the resolver's cross-file $ref resolution and the explorer's external schema name rendering.\n"},"external-ref-defs-oneof":{"description":"External $ref to a $defs schema that is itself a oneOf with a discriminator. Exercises: (1) cross-file $ref resolution, (2) discriminated union rendering with labeled variants, (3) field inventory handling of oneOf inside an external $defs ref.\n"},"allof-inline-required":{"description":"allOf composition that adds inline required fields without duplicating properties (e.g., a Create variant that adds a required field to a base schema). Exercises the resolver's allOf merging and the explorer's allOf rendering.\n"},"paginated-list":{"description":"Collection endpoint returning items/total/limit/offset/hasNext. The standard blueprint pagination envelope. Exercises paginated list rendering and parameter validation (limit, offset, sort, search).\n"},"sub-resource":{"description":"Resource nested under a parent at a path like /parents/{id}/children. Full CRUD scoped to the parent. Exercises nested routing, parent FK validation, and sub-resource list/detail rendering in the explorer.\n"},"singleton-sub-resource":{"description":"Single resource nested under a parent at a path like /parents/{id}/summary, with no item-level ID. Accessed only through the parent. Exercises singleton sub-resource routing and composition rendering.\n"},"intra-domain-fk":{"description":"Intra-domain x-relationship foreign key linking a sub-resource back to its parent resource within the same domain. Exercises cross-reference rendering in the explorer and FK validation.\n"},"cross-domain-fk":{"description":"Cross-domain x-relationship foreign key linking a resource in one domain to a resource in another. Exercises cross-domain reference rendering and FK validation across domain boundaries.\n"},"rpc-state-machine-action":{"description":"RPC-style state machine action with a generated POST endpoint. Exercises the RPC overlay generator, x-relationship tagging, and state machine → API cross-linking in the explorer.\n"},"state-machine-guard":{"description":"Named boolean condition (CEL expression) attached to a state machine action. The action can only be triggered when all guard conditions pass. Exercises guard evaluation, actor role checking, and guard composition (any/all).\n"},"state-machine-timer":{"description":"Timer declaration on a state machine. The scheduling service emits a callback event ({domain}.{id}) when the timer fires; the machine subscribes to react. Exercises timer declaration rendering and the timer → event subscription link.\n"},"state-machine-subscription":{"description":"State machine subscribing to a domain event emitted by a different domain. The handler runs steps (create, emit, call) automatically when the event arrives. Exercises cross-domain event subscription and handler rendering.\n"},"state-machine-event":{"description":"Domain event emitted on a state machine transition. Exercises AsyncAPI event catalog generation and event → state machine cross-linking.\n"},"cross-domain-event":{"description":"Domain event consumed by downstream domains outside the emitting domain. Exercises event catalog cross-domain consumer rendering.\n"},"composition":{"description":"Read-only singleton resource assembled from fields across multiple resources, generated from a compositions contract. Produces a GET endpoint nested under the parent resource (e.g. /applications/{id}/summary). Exercises the composition generator, x-relationship injection, and singleton rendering in the explorer.\n"},"overlay":{"description":"Field or element added or modified by an adopter overlay. Overlays add state-required fields, tighten enums, and set global configuration (x-casing, x-pagination, x-search, x-relationship, x-event-type-prefix). Exercises the overlay resolver and adopter-level customization patterns.\n"},"ruleset-output-fact":{"description":"Output fact from a ruleset — a fact declared in the outputs list and returned by the REST endpoint. Exercises the rules engine → API endpoint link in the explorer (Rules badge).\n"},"ruleset-intermediate-fact":{"description":"Intermediate fact used internally by other facts but not returned by the REST endpoint. Exercises fact graph dependency rendering in the rules-docs visualizer.\n"},"array-of-oneof":{"description":"Array whose items are a oneOf discriminated union (e.g., EvaluationResult returning EvaluationFact variants). Exercises array-of-oneOf rendering, discriminator label resolution, and schema variant expansion.\n"}}}},{"relativePath":"domains/platform/platform-registry-policies.yaml","domain":"platform","type":"registry","content":{"$schema":"registry-schema.yaml","version":"1.0.0","domain":"platform","type":"policies","entries":{"snap-application-acceptance":{"citation":"7 CFR § 273.2(c)","description":"SNAP application acceptance requirements — agencies must accept applications on the day of initial contact and must not discourage or delay submission.\n"},"snap-right-to-apply":{"citation":"7 CFR § 273.2(a)","description":"SNAP right-to-apply — any household wishing to participate must be allowed to file an application, and the filing date establishes the benefit month.\n"},"snap-processing-clock":{"citation":"7 CFR § 273.2(g)","description":"SNAP application processing standards — 30-day processing clock from date of filing; expedited service within 7 days for qualifying households.\n"},"medicaid-processing-clock":{"citation":"42 CFR § 435.912","description":"Medicaid application processing standards — 45-day processing clock for most applicants; 90 days for disability-based applicants.\n"},"snap-notice-of-action":{"citation":"7 CFR § 273.13","description":"SNAP notice of adverse action — agencies must provide timely and adequate written notice before reducing, suspending, or terminating benefits.\n"},"snap-notice-of-eligibility":{"citation":"7 CFR § 273.10(g)","description":"SNAP notice of eligibility determination — written notice of approval or denial with reason, rights, and certification period.\n"},"medicaid-notice-of-eligibility":{"citation":"42 CFR § 435.917","description":"Medicaid notice of eligibility determination — written notice of approval or denial with reason, appeal rights, and effective date.\n"},"snap-fair-hearing-rights":{"citation":"7 CFR § 273.15","description":"SNAP fair hearing rights — households have the right to request a fair hearing within 90 days of any adverse action notice.\n"},"snap-interview-toolkit":{"citation":"FNS-1104 (March 2023, revised June 2025)","description":"FNS SNAP Interview Toolkit — six essential interview functions, probe triggers for inconsistency flags, verification requirements, and interview conclusion standards.\n"},"snap-general-work-requirement":{"citation":"7 CFR § 273.7","description":"SNAP general work requirements — able-bodied adults aged 16–59 must register for work, accept suitable employment, and participate in assigned employment and training programs. Exemptions include physical/mental incapacity, caregiving, school enrollment, and participation in other programs.\n"},"snap-abawd-work-requirement":{"citation":"7 CFR § 273.24","description":"SNAP able-bodied adults without dependents (ABAWD) work requirement — individuals aged 18–54 without dependents are limited to 3 months of benefits in any 36-month period unless they meet work, exemption, or waiver criteria.\n"},"snap-student-eligibility":{"citation":"7 CFR § 273.5","description":"SNAP eligibility rules for students enrolled at least half-time in higher education — generally ineligible unless they meet one of the statutory exceptions (employment, work-study, dependent care, TANF participation, etc.).\n"},"snap-expedited-processing":{"citation":"7 CFR § 273.2(i)","description":"SNAP expedited service — households with gross monthly income below $150 and liquid resources below $100 (or migrant/seasonal farmworkers) must receive benefits within 7 days of application.\n"},"snap-expedited-screening":{"citation":"7 CFR § 273.2(i)(1)","description":"SNAP expedited screening criteria — agencies must screen all applications on the day of receipt and identify households entitled to expedited service.\n"},"qualified-alien-eligibility":{"citation":"7 CFR § 273.4","description":"SNAP eligibility for non-citizens — only qualified aliens are eligible; status categories include LPRs, refugees, asylees, and other federally defined categories with varying waiting periods.\n"},"prwora-sponsor-deeming":{"citation":"8 U.S.C. § 1631","description":"PRWORA sponsor income deeming — income and resources of a sponsor who signed an I-864 Affidavit of Support on or after December 19, 1997 are deemed available to the sponsored non-citizen for SNAP purposes.\n"},"snap-household-composition":{"citation":"7 CFR § 273.1","description":"SNAP household composition rules — defines who must be included in a SNAP household, including mandatory household members, separate household rules, and treatment of boarders, roommates, and institutionalized individuals.\n"},"snap-income-verification":{"citation":"7 CFR § 273.2(f)","description":"SNAP income verification requirements — agencies must verify earned and unearned income at application and recertification, including acceptable documentary evidence and collateral contact standards.\n"},"snap-elderly-disabled-deductions":{"citation":"7 CFR § 273.9(d)","description":"SNAP deductions for elderly and disabled households — households with an elderly or disabled member may claim excess medical expense deductions and are exempt from the gross income test.\n"},"snap-benefit-calculation":{"citation":"7 CFR § 273.10","description":"SNAP benefit calculation — net monthly income is used to determine benefit allotment; benefit equals 30% of net income subtracted from the maximum allotment for household size.\n"},"chip-age-eligibility":{"citation":"42 CFR § 457.310","description":"CHIP age eligibility — states must define an upper age limit for CHIP eligibility (up to age 19), and may extend coverage to unborn children and former foster youth up to age 26 under state plan options.\n"},"medicaid-caretaker-relative":{"citation":"42 CFR § 435.110","description":"Medicaid caretaker relative eligibility — states must provide Medicaid to caretaker relatives of dependent children who meet income and resource standards, including parents and other adults who are the primary caregiver.\n"},"medicaid-cost-sharing":{"citation":"42 CFR § 447.50","description":"Medicaid cost sharing — limits on premiums, copayments, and other cost sharing for Medicaid enrollees, including aggregate limits by income level and prohibition on cost sharing for certain populations and services.\n"},"medicaid-determination-documentation":{"citation":"42 CFR § 435.940","description":"Medicaid eligibility verification — agencies must verify eligibility factors through electronic data sources before requesting documentation from applicants; paper documentation may be requested only when electronic verification is unavailable.\n"}}}},{"relativePath":"domains/platform/platform-state-machine.yaml","domain":null,"type":"state-machine","content":{"$schema":"state-machine-schema.yaml","version":"1.0","procedures":[{"id":"requestTimer","description":"Request a time-based callback from the scheduling service. Pass fireAfter (a duration) or fireAt (an absolute timestamp), and a callback naming the event to publish when it elapses. Nothing here waits: the request is an event, and whatever provides scheduling answers it — in a deployment a scheduler, in a test a mock stub, which is what makes a 72-hour deadline testable in a second.\n","parameters":["timerId","callback","fireAfter","fireAt"],"emit":{"type":"scheduling.timer.requested","subject":"$object.id","data":{"timerId":"$params.timerId","fireAfter":"$params.fireAfter","fireAt":"$params.fireAt","callback":"$params.callback"}}}]}},{"relativePath":"domains/scheduling/scheduling-asyncapi.yaml","domain":"scheduling","type":"asyncapi","content":{"asyncapi":"3.0.0","info":{"title":"Scheduling Domain Events","version":"0.1.0","x-status":"draft","x-domain":"scheduling","description":"The timer request channel, which is the whole scheduling surface this\nfixture needs. A domain asks for a time-based callback by publishing\n`scheduling.timer.requested` with the event to fire when it elapses;\nwhatever provides scheduling answers it. Nothing in this contract set\nimplements a scheduler, which is the point — the mock server's timer stub\nstands in, so a deadline measured in days is exercised in a second.\n"},"channels":{"scheduling.timer.requested":{"address":"scheduling.timer.requested","messages":{"timerRequested":{"$ref":"#/components/messages/TimerRequestedMessage"}}}},"components":{"messages":{"TimerRequestedMessage":{"name":"scheduling.timer.requested","summary":"Emitted by the platform requestTimer procedure. A scheduler registers the timer and publishes the callback event on expiry.\n","payload":{"$ref":"#/components/schemas/TimerRequestedEvent"}}},"schemas":{"TimerRequestedEvent":{"allOf":[{"$ref":"../../base/schemas/events.yaml#/$defs/Event"},{"type":"object","properties":{"type":{"type":"string","const":"scheduling.timer.requested"}}}]}}}}},{"relativePath":"scenarios/transcript-lifecycle.arazzo.yaml","domain":"transcription","type":"arazzo","content":{"arazzo":"1.0.1","info":{"title":"A transcript, from start to close","version":"1.0.0","x-domain":"transcription","description":"The interview software a caseworker uses transcribes an interview. An\nadministrator adds the profile it runs under. The software starts a\ntranscript under that profile, adds lines — retrying one — pauses when the\napplicant asks to go off the record, and closes it at the end. Along the\nway the transcript refuses to start wi
