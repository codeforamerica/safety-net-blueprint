<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not your average Mock Server</title>
<!--
  A playground over the browser mock, rather than a tour of it.

  The page is generated from the contracts twice over: the server is, and so
  is this. Which operations exist, what kind of thing each one is, what a
  sensible body looks like, which records you can act on and which moves are
  legal from where they are — every one of those comes out of the contract
  set, which is why this can do things a generic API client cannot. Postman
  hands you a box and wishes you luck.

  Operations are grouped in dependency order, and the order is real rather
  than pedagogical: a composition needs a record to project, a transition
  needs a record already in a particular state. Resources first is not a
  teaching conceit, it is what has to happen.
-->
<style>
  :root {
    --ink: #1a1a1a; --muted: #555; --faint: #888; --line: #e2e2e2;
    --bg: #fafafa; --card: #fff; --accent: #2b6cb0; --ok: #2f7a3f; --bad: #b02b2b;
    --warm: #8a6d3b;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  /* Any `display` on a rule beats the user agent's `[hidden] { display: none }`,
     so an element given a layout and then hidden in script stays on screen.
     That has now produced two bugs — an empty bordered box, and a Next button
     offering to skip a step nobody had run. Settled here instead of per rule. */
  [hidden] { display: none !important; }
  body {
    margin: 0; padding: 0 0 5rem; background: var(--bg); color: var(--ink);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  h1 { font-size: 1.4rem; margin: 0; }
  code { font-family: var(--mono); font-size: .88em; }

  #masthead {
    max-width: 86rem; margin: 0 auto; padding: 1.6rem 1.2rem 1.1rem;
    border-bottom: 1px solid var(--line);
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2rem; align-items: start;
  }
  /* Two cells, not four rows: as separate rows the left-hand items were
     stretched to match whichever side was taller, which put a hand's width
     of nothing between the title and the text under it. */
  #masthead .intro { min-width: 0; }
  #derived {
    align-self: start;
    border: 1px solid var(--line); border-radius: 6px; background: var(--card);
    padding: .6rem .8rem; min-width: 17rem;
  }
  #derived .when {
    margin: .45rem 0 0; padding-top: .4rem; border-top: 1px solid var(--line);
    font-size: .66rem; letter-spacing: .04em; text-transform: uppercase;
    color: var(--faint); font-weight: 700;
  }
  #derived .stat {
    display: flex; gap: .4rem; align-items: baseline;
    font-size: .75rem; color: var(--muted); line-height: 1.45;
  }
  #derived .stat .n {
    font-family: var(--mono); min-width: 1.4rem; text-align: right; color: var(--ink);
  }
  #derived .stat.lead { font-size: .92rem; color: var(--ink); font-weight: 600; line-height: 1.3; }
  #derived .stat.lead .n { color: var(--accent); min-width: 1.9rem; }
  #derived .breakdown {
    display: grid; grid-template-columns: 1fr 1fr; column-gap: .9rem;
    margin-top: .45rem; padding-top: .4rem; border-top: 1px solid var(--line);
  }
  #derived .headline { margin-top: 0; padding-top: 0; border-top: 0; }
  @media (max-width: 60rem) {
    #masthead { grid-template-columns: 1fr; }
    #derived { grid-column: 1; grid-row: auto; }
  }
  .lede { color: var(--muted); margin: .4rem 0 0; max-width: 44rem; font-size: .95rem; }

  /* Throwing the whole thing away and deriving it again, which is the
     headline claim and takes about as long as a keystroke. */
  #controls { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; margin: .9rem 0 0; }
  #controls .sep { border-left: 1px solid var(--line); height: 1.4rem; margin: 0 .2rem; }
  #controls button:not(.primary) {
    font: inherit; font-size: .85rem; cursor: pointer; padding: .4rem 1rem;
    border-radius: 4px; border: 1px solid var(--line); background: var(--card); color: var(--ink);
  }
  #controls button:disabled { opacity: .4; cursor: not-allowed; }
  /* Who the reference calls as. Every request carries it, the way a real
     client's sign-in would, and the events it causes record it. */
  .caller { display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; margin: 0 0 .6rem; font-size: .85rem; color: var(--muted); }
  .caller input, .caller select { width: auto; }
  .caller .caller-id { width: 9rem; }
  .caller input.caller-roles { width: 15rem; }
  details.caller-roles { position: relative; }
  details.caller-roles summary {
    cursor: pointer; font-family: var(--mono); font-size: .8rem; padding: .4rem .5rem; min-width: 12rem;
    border: 1px solid var(--line); border-radius: 4px; background: #fcfcfc; color: var(--ink);
  }
  details.caller-roles .menu {
    position: absolute; z-index: 5; margin-top: .2rem; padding: .3rem .5rem; min-width: 100%;
    border: 1px solid var(--line); border-radius: 4px; background: var(--card); box-shadow: 0 2px 8px rgba(0,0,0,.08);
  }
  details.caller-roles .menu label { display: flex; gap: .4rem; align-items: center; padding: .15rem 0; font-family: var(--mono); font-size: .8rem; color: var(--ink); white-space: nowrap; }
  details.caller-roles .menu input { width: auto; }
  .caller .caller-id:disabled { opacity: .4; }


  #shell {
    display: grid; grid-template-columns: 17rem minmax(0, 1fr);
    gap: 2rem; max-width: 86rem; margin: 1.4rem auto 0; padding: 0 1.2rem;
  }
  #groups {
    position: sticky; top: 1rem; align-self: start;
    max-height: calc(100vh - 2rem); overflow: auto;
    border-right: 1px solid var(--line); padding-right: .8rem;
  }
  .group > summary {
    cursor: pointer; list-style: none; padding: .45rem .3rem;
    font-size: .76rem; letter-spacing: .06em; text-transform: uppercase;
    font-weight: 700; color: var(--ink);
  }
  .group > summary::-webkit-details-marker { display: none; }
  .group > summary::before { content: '▸ '; color: var(--faint); }
  .group[open] > summary::before { content: '▾ '; }
  .kind {
    margin: .5rem 0 .1rem .3rem; font-size: .68rem; letter-spacing: .05em;
    text-transform: uppercase; color: var(--faint); font-weight: 700;
  }
  .ops { list-style: none; margin: 0 0 .5rem; padding: 0; }
  .op {
    display: block; width: 100%; text-align: left; border: 0; background: none;
    font: inherit; font-size: .8rem; cursor: pointer; color: var(--muted);
    padding: .22rem .45rem; border-radius: 4px; line-height: 1.35;
  }
  .op:hover { background: #f1f4f8; color: var(--ink); }
  .op.here { background: #eef4fb; color: var(--accent); font-weight: 600; }
  .steps { counter-reset: none; }
  .op.step { padding: .34rem .45rem; font-size: .84rem; }
  .op .n {
    font-family: var(--mono); font-size: .7rem; color: var(--faint);
    display: inline-block; min-width: 1.9rem;
  }
  .op.step.here .n { color: var(--accent); }
  .panel .watch {
    margin: 1rem 0 0; padding: .8rem 1rem .9rem; font-size: .9rem; color: var(--ink);
    background: #f4f9f4; border: 1px solid #d6e8d6; border-radius: 4px; max-width: 48rem;
  }
  .watch-title {
    margin: 0 0 .5rem; font-size: .68rem; letter-spacing: .06em; text-transform: uppercase;
    font-weight: 700; color: var(--ok);
  }
  .panel .watch ul { margin: 0; padding-left: 1.1rem; }
  /* The anchor for the cards below: they span the bullet rather than hang
     off the word, so one near the right-hand edge has nowhere to overflow
     to and every card opens in the same place. */
  .panel .watch li { margin: 0 0 .45rem; line-height: 1.55; position: relative; }
  .panel .watch li:last-child { margin-bottom: 0; }
  .panel .watch code { background: #e4efe4; padding: .08em .3em; border-radius: 3px; }
  .panel .watch .ref > code {
    border-bottom: 1px dotted var(--ok); cursor: help; outline: none;
  }
  .panel .watch .ref > code:hover, .panel .watch .ref > code:focus { background: #cfe4cf; }
  .panel .watch .ref .card {
    display: none; position: absolute; left: 0; right: 0; top: calc(100% + .25rem);
    z-index: 5; background: var(--card); border: 1px solid #cfd6de; border-radius: 4px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, .13); padding: .55rem .7rem .6rem;
  }
  .panel .watch .ref:hover .card, .panel .watch .ref:focus-within .card { display: block; }
  .panel .watch .card .excerpt {
    margin: 0; background: #fcfbf7; border-color: #e6ded0; border-left: 3px solid var(--warm);
    max-height: 18rem; font-size: .73rem;
  }
  .panel .watch .card .whole {
    display: inline-block; margin: .45rem 0 0; font-family: var(--mono); font-size: .7rem;
    color: var(--accent); text-decoration: none; border-bottom: 1px dotted currentColor;
  }
  .panel .watch .card code { background: none; padding: 0; }
  .op .n.run { color: var(--ok); font-weight: 700; }
  .to-come { margin: .5rem 0 0 .45rem; font-size: .78rem; color: var(--faint); font-style: italic; }
  .row { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
  /* The other way through: dashed, because it is the alternative route and
     should not compete with the step you are being offered. */
  button.run-all {
    font: inherit; font-size: .8rem; cursor: pointer; padding: .4rem .8rem;
    border-radius: 4px; border: 1px dashed #c3cdd8; background: var(--card); color: var(--muted);
  }
  button.run-all:hover { color: var(--accent); border-color: var(--accent); border-style: solid; }
  button.run-all:disabled { opacity: .6; cursor: progress; }
  #groups button.run-all { display: block; width: 100%; margin: .7rem 0 .3rem; }
  .pager {
    display: flex; gap: .6rem; align-items: center; justify-content: space-between;
    margin-top: 1rem;
  }
  .pager .step-back {
    font: inherit; font-size: .82rem; cursor: pointer; padding: .35rem .8rem;
    border-radius: 4px; border: 1px solid var(--line); background: var(--card); color: var(--muted);
  }
  .pager .step-back:hover { color: var(--ink); border-color: #cfd6de; }
  /* Pushed right when it is the only one, so it sits where it always sits. */
  .pager .next-step { margin-left: auto; }
  .op .verb {
    font-family: var(--mono); font-size: .68rem; font-weight: 700;
    display: inline-block; min-width: 3.4rem; color: var(--faint);
  }
  .op.here .verb { color: var(--accent); }

  #stage { min-width: 0; }
  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: 6px;
    padding: 1.1rem 1.2rem; margin: 0 0 1.2rem;
  }
  .panel .kindline {
    font-size: .68rem; letter-spacing: .05em; text-transform: uppercase;
    font-weight: 700; color: var(--accent); margin: 0 0 .25rem;
  }
  .panel h2 { font-size: 1.05rem; margin: 0 0 .2rem; }
  .panel .about {
    color: var(--muted); font-size: .9rem; margin: 0 0 .8rem; padding: 0 0 .8rem;
    border-bottom: 1px solid var(--line); max-width: 46rem;
  }
  .panel .path { font-family: var(--mono); font-size: .82rem; color: var(--accent); margin: 0 0 .7rem; }
  .panel .note { color: var(--muted); font-size: .9rem; margin: 0 0 .9rem; max-width: 46rem; }
  .panel ul.note { padding-left: 1.1rem; }
  .panel ul.note li { margin: 0 0 .25rem; }
  .panel .cited { font-family: var(--mono); font-size: .74rem; color: var(--faint); margin: 0 0 .9rem; }
  .panel .cited code { background: #eef2f6; color: var(--ink); padding: .08em .3em; border-radius: 3px; }
  .panel .cited a { color: var(--accent); text-decoration: none; border-bottom: 1px dotted currentColor; }
  .panel .cited a:hover { border-bottom-style: solid; }

  label.field { display: block; margin: 0 0 .7rem; font-size: .82rem; color: var(--muted); }
  label.field > span { display: block; margin-bottom: .22rem; }
  .shape { margin: .9rem 0 .25rem; }
  .shape > summary {
    cursor: pointer; list-style: none;
    font-family: var(--mono); font-size: .74rem; color: var(--faint);
  }
  .shape > summary::-webkit-details-marker { display: none; }
  .shape > summary::before { content: '▸ '; }
  .shape[open] > summary::before { content: '▾ '; }
  .shape > summary:hover { color: var(--accent); }
  .shape code { background: #eef2f6; color: var(--ink); padding: .08em .3em; border-radius: 3px; }
  .shape .excerpt {
    margin: .4rem 0 0; background: #fcfbf7; border-color: #e6ded0; border-left: 3px solid var(--warm);
    max-height: 22rem; font-size: .74rem;
  }
  .shape .whole {
    display: inline-block; margin: .4rem 0 0; font-family: var(--mono); font-size: .72rem;
    color: var(--accent); text-decoration: none; border-bottom: 1px dotted currentColor;
  }
  label.field .shape { margin-top: 0; }
  label.field code { background: #eef2f6; padding: .08em .3em; border-radius: 3px; }
  label.field a { color: var(--accent); text-decoration: none; border-bottom: 1px dotted currentColor; }
  input[type=text], select, textarea {
    width: 100%; font-family: var(--mono); font-size: .8rem; padding: .4rem .5rem;
    border: 1px solid var(--line); border-radius: 4px; background: #fcfcfc; color: var(--ink);
  }
  textarea { min-height: 9rem; resize: vertical; line-height: 1.5; }
  textarea.fixed { background: #f3f3f3; color: var(--muted); cursor: default; }
  /* The parts of a body that is not JSON, listed rather than serialized:
     there is no text form of a multipart request worth showing anybody. */
  pre.parts { background: #f3f3f3; border-color: var(--line); color: var(--muted); }
  input[type=file] { font: inherit; font-size: .8rem; color: var(--muted); }

  button.primary {
    font: inherit; font-size: .85rem; cursor: pointer; padding: .4rem 1rem;
    border-radius: 4px; border: 1px solid var(--accent); background: var(--accent); color: #fff;
  }
  button.primary:disabled { opacity: .45; cursor: not-allowed; }
  button.primary:disabled[data-done] { opacity: .6; }

  pre {
    margin: .8rem 0 0; padding: .7rem .8rem; max-height: 26rem; overflow: auto;
    background: #f7f9fc; border: 1px solid #dbe4f0; border-radius: 4px;
    font-family: var(--mono); font-size: .76rem; line-height: 1.5; white-space: pre-wrap;
  }
  pre .label {
    display: block; font-family: inherit; font-size: .68rem; letter-spacing: .04em;
    text-transform: uppercase; color: var(--accent); margin-bottom: .35rem; font-weight: 600;
  }
  pre .label code { font-family: var(--mono); text-transform: none; letter-spacing: 0; }
  pre .label a { color: inherit; text-transform: none; letter-spacing: 0; border-bottom: 1px dotted currentColor; text-decoration: none; }
  pre.bad { background: #fdf6f6; border-color: #eccfcf; }
  /* A scenario's steps: what each called, what came back, what it checked. */
  .tour-picker { display: block; margin: 0 0 .8rem; }
  .tour-picker span { display: block; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: .25rem; }
  .tour-picker select { width: 100%; }
  ul.checks { list-style: none; padding: 0; margin: .5rem 0 0; font-family: var(--mono); font-size: .78rem; }
  ul.checks .passed { color: var(--ok); }
  ul.checks .failed { color: var(--bad); }
  pre.bad .label { color: var(--bad); }

  .empty { color: var(--faint); font-size: .9rem; }
  @media (max-width: 60rem) {
    #shell { grid-template-columns: 1fr; }
    #groups { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header id="masthead">
  <div class="intro">
    <h1>Not your average Mock Server</h1>
    <p class="lede">
      An entire server, generated from a set of contracts, running in this tab.
      <b>No custom code.</b> Everything is derived on the fly when the server
      boots, so what you see here is what these contracts say, and nothing
      else.
    </p>
    <div id="controls">
      <button id="mode" class="primary">Let me explore</button>
      <span class="sep"></span>
      <button id="reseed">Restart with data</button>
      <button id="empty">Start empty</button>
    </div>
  </div>
  <div id="derived">starting…</div>
</header>

<div id="shell">
  <nav id="groups" aria-label="Operations"></nav>
  <main id="stage"></main>
</div>

domain that produced the event, e.g., `/intake`, `/workflow`).","schema":{"type":"string"},"example":"/intake"},{"name":"subject","in":"query","description":"Filter by CloudEvents subject — the entity ID the event pertains to. Because every domain uses the same subject for the same entity, this returns a complete cross-domain timeline for that entity.\n","schema":{"type":"string","format":"uuid"}},{"name":"traceid","in":"query","description":"Filter by W3C Trace Context trace ID extracted from the `traceparent` attribute. All events sharing a trace ID were causally triggered by the same root action.\n","schema":{"type":"string"}},{"name":"causationid","in":"query","description":"Filter by the `causationid` extension — the ID of the event that directly caused this one. Use it to find the response event(s) produced by a specific trigger (e.g., the `call.completed` fired for one `service_call.created` when several were emitted for the same subject).\n","schema":{"type":"string","format":"uuid"}},{"name":"start","in":"query","description":"Return only events at or after this timestamp (ISO 8601).","schema":{"type":"string","format":"date-time"}},{"name":"end","in":"query","description":"Return only events before or at this timestamp (ISO 8601).","schema":{"type":"string","format":"date-time"}},{"$ref":"../../components/parameters.yaml#/LimitParam"},{"$ref":"../../components/parameters.yaml#/OffsetParam"}],"responses":{"200":{"description":"Paginated list of CloudEvents envelopes, ordered by time ascending.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/EventList"}}}},"400":{"$ref":"../../components/responses.yaml#/BadRequest"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}},"post":{"summary":"Publish an event","description":"Publish a CloudEvents 1.0 envelope to the event log. Used by domain\nproducers to record state transitions and significant data mutations.\n","operationId":"publishEvent","tags":["Events"],"requestBody":{"re mas/RegistryType"}}}}]},"RegistryEntry":{"type":"object","required":["id","description"],"additionalProperties":true,"description":"An entry, with its id and the fields its type defines.","properties":{"id":{"type":"string","description":"The entry's stable id."},"description":{"type":"string","description":"Human-readable text for the entry."},"deprecated":{"type":"boolean","description":"When true, the entry should not be newly referenced."}}},"RegistryEntryList":{"description":"Paginated list of registry entries.","allOf":[{"$ref":"../../components/pagination.yaml#/Pagination"},{"type":"object","required":["items"],"properties":{"items":{"type":"array","items":{"$ref":"#/components/schemas/RegistryEntry"}}}}]}}}}},{"relativePath":"base/domains/transcription/transcription-config-schema.yaml","domain":"transcription","type":"schema","content":{"$schema":"https://json-schema.org/draft/2020-12/schema","$id":"https://blueprint.codeforamerica.org/base/domains/transcription/transcription-config-schema.yaml","title":"Transcription Config","domain":"transcription","description":"Schema for transcription-config.yaml. Validates the profile catalog's entries.","allOf":[{"$ref":"https://blueprint.codeforamerica.org/schemas/config-schema.yaml"}],"type":"object","properties":{"domain":{"const":"transcription","description":"Must be \"transcription\"."},"profiles":{"type":"object","description":"Profile catalog: the transcription service and languages to use for each kind of conversation. Seeded where they do not exist yet; afterwards they are changed through the API, and never deleted.\n","required":["resource","entries"],"additionalProperties":false,"properties":{"resource":{"const":"TranscriptionProfile"},"entries":{"type":"array","items":{"$ref":"#/$defs/ProfileConfig"}}}}},"unevaluatedProperties":false,"$defs":{"ProfileConfig":{"type":"object","description":"A profile, as the TranscriptionProfile resource has it.","required":["id","name","provider"],"additionalProperties":f d. Carries each changed field, before and after.","payload":{"$ref":"#/components/schemas/TranscriptionTranscriptEntryUpdatedEvent"}},"TranscriptionTranscriptionProfileCreated":{"name":"transcription.transcription_profile.created","summary":"A TranscriptionProfile was created. Carries the record as created.","payload":{"$ref":"#/components/schemas/TranscriptionTranscriptionProfileCreatedEvent"}},"TranscriptionTranscriptionProfileUpdated":{"name":"transcription.transcription_profile.updated","summary":"A TranscriptionProfile was changed. Carries each changed field, before and after.","payload":{"$ref":"#/components/schemas/TranscriptionTranscriptionProfileUpdatedEvent"}},"TranscriptionTranscriptPaused":{"name":"transcription.transcript.paused","summary":"The conversation went off the record. Anything said until it resumes is not stored.","payload":{"$ref":"#/components/schemas/TranscriptionTranscriptPausedEvent"}},"TranscriptionTranscriptResumed":{"name":"transcription.transcript.resumed","summary":"The conversation is back on the record.","payload":{"$ref":"#/components/schemas/TranscriptionTranscriptResumedEvent"}},"TranscriptionTranscriptClosed":{"name":"transcription.transcript.closed","summary":"The transcript has ended.","payload":{"$ref":"#/components/schemas/TranscriptionTranscriptClosedEvent"}}},"schemas":{"TranscriptionTranscriptCreatedEvent":{"allOf":[{"$ref":"../../schemas/events.yaml#/$defs/Event"},{"type":"object","properties":{"type":{"type":"string","const":"transcription.transcript.created"},"data":{"$ref":"./transcription-transcripts-openapi.yaml#/components/schemas/Transcript"}}}]},"TranscriptionTranscriptUpdatedEvent":{"allOf":[{"$ref":"../../schemas/events.yaml#/$defs/Event"},{"type":"object","properties":{"type":{"type":"string","const":"transcription.transcript.updated"},"data":{"$ref":"../../schemas/events.yaml#/ResourceUpdatedEvent"}}}]},"TranscriptionTranscriptDeletedEvent":{"allOf":[{"$ref":"../../schemas/events.yaml#/$defs/Event"},{"type":"object","properties":{"type":{"type":"string","const":"transcription.transcript.deleted"},"data":{"$ref":"../../schemas/events.yaml#/ResourceDeletedEvent"}}}]},"TranscriptionTranscriptEntryCreatedEvent":{"allOf":[{"$ref":"../../schemas/events.yaml#/$defs/Event"},{"type":"object","properties":{"type":{"type":"string","const":"transcription.transcript_entry.created"},"data":{"$ref":"./transcription-transcripts-openapi.yaml#/components/schemas/TranscriptEntry"}}}]},"TranscriptionTranscriptEntryUpdatedEvent":{"allOf":[{"$ref":"../../schemas/events.yaml#/$defs/Event"},{"type":"object","properties":{"type":{"type":"string","const":"transcription.transcript_entry.updated"},"data":{"$ref":"../../schemas/events.yaml#/ResourceUpdatedEvent"}}}]},"TranscriptionTranscriptionProfileCreatedEvent":{"allOf":[{"$ref":"../../schemas/events.yaml#/$defs/Event"},{"type":"object","properties":{"type":{"type":"string","const":"transcription.transcription_profile.created"},"data":{"$ref":"./transcription-transcripts-openapi.yaml#/components/schemas/TranscriptionProfile"}}}]},"TranscriptionTranscriptionProfileUpdatedEvent":{"allOf":[{"$ref":"../../schemas/events.yaml#/$defs/Event"},{"type":"object","properties":{"type":{"type":"string","const":"transcription.transcription_profile.updated"},"data":{"$ref":"../../schemas/events.yaml#/ResourceUpdatedEvent"}}}]},"TranscriptionTranscriptPausedEvent":{"allOf":[{"$ref":"../../schemas/events.yaml#/$defs/Event"},{"type":"object","properties":{"type":{"type":"string","const":"transcription.transcript.paused"}}}]},"TranscriptionTranscriptResumedEvent":{"allOf":[{"$ref":"../../schemas/events.yaml#/$defs/Event"},{"type":"object","properties":{"type":{"type":"string","const":"transcription.transcript.resumed"}}}]},"TranscriptionTranscriptClosedEvent":{"allOf":[{"$ref":"../../schemas/events.yaml#/$defs/Event"},{"type":"object","properties":{"type":{"type":"string","const":"transcription.transcript.closed"}}}]}}}}},{"relativePath":"base/domains/transcription/transcription-transcripts-openapi.yaml","domain":"transcription","type":"openapi","content":{"openapi":"3.1.0","info":{"title":"Transcripts","version":"0.1.0","x-domain":"transcription","x-status":"alpha","x-visibility":"internal","description":"The written record of a conversation. Starting a transcript opens it for\nrecording; pausing takes the conversation off the record; closing ends it.\nA transcript refers to what it records — an interview, a call — and names\nthe profile it was started under, which says the transcription service,\nand the client and model that produced its lines. Updating corrects what\nit records; deleting removes it, and the event left behind says which one\nand by whom.\n\nA profile is a state's choice of transcription service and languages for\na kind of conversation. The deployment's config seeds them; they can be\nadded and changed here, never deleted, so every transcript's profile\nstill exists.\n\nIts entries are its timeline, in the order things happened: lines, gaps\nwhere nothing was captured, and pauses. Every time on a transcript and its\nentries is the client's — when it started, paused, resumed and closed, and\nwhen each line was said — so they are compared on one clock.\n"},"servers":[{"url":"https://api.example.com/transcription","description":"Production server"},{"url":"http://localhost:1080/transcription","description":"Local development server"}],"tags":[{"name":"Transcripts","description":"The written record of a conversation."},{"name":"Transcript entries","description":"A transcript's timeline — lines, gaps and pauses."},{"name":"Transcription profiles","description":"The transcription service and languages to use for a kind of conversation."}],"paths":{"/transcripts":{"get":{"summary":"List transcripts","description":"Retrieve a paginated list of transcripts. Filter by `subjectId` to find\nthe transcripts of one interview or call.\n","operationId":"listTranscripts","tags":["Transcripts"],"x-sortable":{"fields":["createdAt"],"default":"-createdAt","tieBreaker":"id"},"parameters":[{"$ref":"../../components/parameters.yaml#/SearchQueryParam"},{"$ref":"../../components/parameters.yaml#/LimitParam"},{"$ref":"../../components/parameters.yaml#/OffsetParam"},{"$ref":"../../components/parameters.yaml#/SortParam"}],"responses":{"200":{"description":"A paginated collection of transcripts.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/TranscriptList"}}}},"400":{"$ref":"../../components/responses.yaml#/BadRequest"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}},"post":{"summary":"Start a transcript","description":"Start recording a conversation, under a profile. The transcript begins\nin `recording`. It is refused when the profile does not exist, or when\nthe profile names a transcription service and no `model` is given.\n","operationId":"createTranscript","tags":["Transcripts"],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/TranscriptCreate"}}}},"responses":{"201":{"description":"Transcript started.","headers":{"Location":{"description":"URL of the new transcript.","schema":{"type":"string","format":"uri"}}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/Transcript"}}}},"400":{"$ref":"../../components/responses.yaml#/BadRequest"},"409":{"description":"The transcript is refused: its profile does not exist, or the\nprofile names a transcription service and no `model` was given.\n","content":{"application/json":{"schema":{"$ref":"../../components/responses.yaml#/Error"}}}},"422":{"$ref":"../../components/responses.yaml#/UnprocessableEntity"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}}},"/transcripts/{transcriptId}":{"parameters":[{"$ref":"#/components/parameters/TranscriptIdParam"}],"get":{"summary":"Get a transcript","description":"Retrieve a single transcript by identifier.","operationId":"getTranscript","tags":["Transcripts"],"responses":{"200":{"description":"Transcript retrieved successfully.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Transcript"},"examples":{"TranscriptExample1":{"$ref":"#/components/examples/TranscriptExample1"}}}}},"404":{"$ref":"../../components/responses.yaml#/NotFound"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}},"patch":{"summary":"Update a transcript","description":"Correct what a transcript records — its subject, model or client. Its\nprofile does not change, and its status changes only through `pause`,\n`resume` and `close`.\n","operationId":"updateTranscript","tags":["Transcripts"],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/TranscriptUpdate"}}}},"responses":{"200":{"description":"Transcript updated.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Transcript"}}}},"400":{"$ref":"../../components/responses.yaml#/BadRequest"},"404":{"$ref":"../../components/responses.yaml#/NotFound"},"422":{"$ref":"../../components/responses.yaml#/UnprocessableEntity"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}},"delete":{"summary":"Delete a transcript","description":"Permanently remove a transcript. The `transcription.transcript.deleted`\nevent records which transcript was removed and who removed it.\n","operationId":"deleteTranscript","tags":["Transcripts"],"responses":{"204":{"description":"Transcript deleted."},"404":{"$ref":"../../components/responses.yaml#/NotFound"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}}},"/transcripts/{transcriptId}/entries":{"parameters":[{"$ref":"#/components/parameters/TranscriptIdParam"}],"get":{"summary":"List a transcript's entries","description":"A transcript's timeline, in the order things happened — by `startedAt`.\nFilter by `kind` for only its lines, gaps or pauses.\n","operationId":"listTranscriptEntries","tags":["Transcript entries"],"x-sortable":{"fields":["startedAt"],"default":"startedAt","tieBreaker":"id"},"parameters":[{"$ref":"../../components/parameters.yaml#/LimitParam"},{"$ref":"../../components/parameters.yaml#/OffsetParam"},{"$ref":"../../components/parameters.yaml#/SortParam"},{"name":"kind","in":"query","description":"Only entries of this kind.","schema":{"$ref":"#/components/schemas/TranscriptEntryKind"}}],"responses":{"200":{"description":"The transcript's entries, in the order things happened.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/TranscriptEntryList"}}}},"400":{"$ref":"../../components/responses.yaml#/BadRequest"},"404":{"$ref":"../../components/responses.yaml#/NotFound"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}},"post":{"summary":"Add an entry to a transcript","description":"Add a finished line, or a gap where nothing was captured. Pauses are not\nadded here: pausing the transcript adds one.\n\nSend an `Idempotency-Key` with every add, and the same key when retrying\none, so a retry is not a second line. The transcript refuses an entry\nthat started while it was paused or after it closed, an entry that ends\nbefore it starts, and a gap that overlaps a pause.\n","operationId":"addTranscriptEntry","tags":["Transcript entries"],"parameters":[{"$ref":"../../components/parameters.yaml#/IdempotencyKeyParam"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/TranscriptEntryCreate"}}}},"responses":{"201":{"description":"Entry added.","headers":{"Location":{"description":"URL of the new entry.","schema":{"type":"string","format":"uri"}}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/TranscriptEntry"}}}},"400":{"$ref":"../../components/responses.yaml#/BadRequest"},"403":{"$ref":"../../components/responses.yaml#/Forbidden"},"404":{"$ref":"../../components/responses.yaml#/NotFound"},"409":{"description":"The transcript refuses the entry: it started while the transcript\nwas paused or after it closed, it ends before it starts, or it is a\ngap overlapping a pause.\n","content":{"application/json":{"schema":{"$ref":"../../components/responses.yaml#/Error"}}}},"422":{"description":"The entry is not valid, or its `Idempotency-Key` was already used\nfor a different request.\n","content":{"application/json":{"schema":{"$ref":"../../components/responses.yaml#/Error"}}}},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}}},"/transcripts/{transcriptId}/entries/{entryId}":{"parameters":[{"$ref":"#/components/parameters/TranscriptIdParam"},{"$ref":"#/components/parameters/TranscriptEntryIdParam"}],"get":{"summary":"Get a transcript entry","description":"Retrieve a single entry by identifier.","operationId":"getTranscriptEntry","tags":["Transcript entries"],"responses":{"200":{"description":"Entry retrieved successfully.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/TranscriptEntry"}}}},"404":{"$ref":"../../components/responses.yaml#/NotFound"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}},"patch":{"summary":"End a pause entry","description":"Set when a pause ended. Only the system may — resuming or closing the\ntranscript does it. Nothing else about an entry changes once it is\nwritten, and entries are never deleted.\n","operationId":"updateTranscriptEntry","tags":["Transcript entries"],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/TranscriptEntryUpdate"}}}},"responses":{"200":{"description":"Entry updated.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/TranscriptEntry"}}}},"403":{"$ref":"../../components/responses.yaml#/Forbidden"},"404":{"$ref":"../../components/responses.yaml#/NotFound"},"422":{"$ref":"../../components/responses.yaml#/UnprocessableEntity"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}}},"/profiles":{"get":{"summary":"List transcription profiles","description":"Retrieve a paginated list of profiles, by name.","operationId":"listTranscriptionProfiles","tags":["Transcription profiles"],"x-sortable":{"fields":["name","createdAt"],"default":"name","tieBreaker":"id"},"parameters":[{"$ref":"../../components/parameters.yaml#/SearchQueryParam"},{"$ref":"../../components/parameters.yaml#/LimitParam"},{"$ref":"../../components/parameters.yaml#/OffsetParam"},{"$ref":"../../components/parameters.yaml#/SortParam"}],"responses":{"200":{"description":"A paginated collection of profiles.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/TranscriptionProfileList"}}}},"400":{"$ref":"../../components/responses.yaml#/BadRequest"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}},"post":{"summary":"Add a transcription profile","description":"Add a profile beside the ones the deployment's config seeds. It is\nmarked `source: user`.\n","operationId":"createTranscriptionProfile","tags":["Transcription profiles"],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/TranscriptionProfileCreate"}}}},"responses":{"201":{"description":"Profile added.","headers":{"Location":{"description":"URL of the new profile.","schema":{"type":"string","format":"uri"}}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/TranscriptionProfile"}}}},"400":{"$ref":"../../components/responses.yaml#/BadRequest"},"422":{"$ref":"../../components/responses.yaml#/UnprocessableEntity"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}}},"/profiles/{profileId}":{"parameters":[{"$ref":"#/components/parameters/ProfileIdParam"}],"get":{"summary":"Get a transcription profile","description":"Retrieve a single profile by identifier.","operationId":"getTranscriptionProfile","tags":["Transcription profiles"],"responses":{"200":{"description":"Profile retrieved successfully.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/TranscriptionProfile"}}}},"404":{"$ref":"../../components/responses.yaml#/NotFound"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}},"patch":{"summary":"Change a transcription profile","description":"Change a profile, including one the config seeded. The change applies to\ntranscripts started from now on; the update event records each field\nbefore and after, so what the profile said when an earlier transcript\nstarted can still be looked up. Profiles are never deleted.\n","operationId":"updateTranscriptionProfile","tags":["Transcription profiles"],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/TranscriptionProfileUpdate"}}}},"responses":{"200":{"description":"Profile changed.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/TranscriptionProfile"}}}},"400":{"$ref":"../../components/responses.yaml#/BadRequest"},"404":{"$ref":"../../components/responses.yaml#/NotFound"},"422":{"$ref":"../../components/responses.yaml#/UnprocessableEntity"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}}},"/transcripts/{transcriptId}/pause":{"parameters":[{"$ref":"#/components/parameters/TranscriptIdParam"}],"post":{"summary":"Pause transcript","description":"Take the conversation off the record, at the time the client says.","operationId":"pauseTranscript","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/AtRequest"}}}},"responses":{"200":{"description":"Transition applied successfully.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Transcript"}}}},"400":{"$ref":"../../components/responses.yaml#/BadRequest"},"404":{"$ref":"../../components/responses.yaml#/NotFound"},"409":{"$ref":"../../components/responses.yaml#/Conflict"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}},"tags":["Transcripts"],"x-relationship":{"type":"state-machine-action","domain":"transcription","id":"pause"}}},"/transcripts/{transcriptId}/resume":{"parameters":[{"$ref":"#/components/parameters/TranscriptIdParam"}],"post":{"summary":"Resume transcript","description":"Put the conversation back on the record, at the time the client says.","operationId":"resumeTranscript","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/AtRequest"}}}},"responses":{"200":{"description":"Transition applied successfully.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Transcript"}}}},"400":{"$ref":"../../components/responses.yaml#/BadRequest"},"404":{"$ref":"../../components/responses.yaml#/NotFound"},"409":{"$ref":"../../components/responses.yaml#/Conflict"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}},"tags":["Transcripts"],"x-relationship":{"type":"state-machine-action","domain":"transcription","id":"resume"}}},"/transcripts/{transcriptId}/close":{"parameters":[{"$ref":"#/components/parameters/TranscriptIdParam"}],"post":{"summary":"Close transcript","description":"End the transcript, at the time the client says. A pause still open ends then too.","operationId":"closeTranscript","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/AtRequest"}}}},"responses":{"200":{"description":"Transition applied successfully.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Transcript"}}}},"400":{"$ref":"../../components/responses.yaml#/BadRequest"},"404":{"$ref":"../../components/responses.yaml#/NotFound"},"409":{"$ref":"../../components/responses.yaml#/Conflict"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}},"tags":["Transcripts"],"x-relationship":{"type":"state-machine-action","domain":"transcription","id":"close"}}}},"components":{"parameters":{"TranscriptIdParam":{"name":"transcriptId","in":"path","required":true,"description":"Unique identifier of the transcript.","schema":{"type":"string","format":"uuid"},"example":"4d1f13f0-3e26-4c50-b2fb-8d140f7ec1c2"},"TranscriptEntryIdParam":{"name":"entryId","in":"path","required":true,"description":"Unique identifier of the entry.","schema":{"type":"string","format":"uuid"},"example":"9c2e4a10-7b1d-4f3e-8a62-1d5c0b7e9f24"},"ProfileIdParam":{"name":"profileId","in":"path","required":true,"description":"Unique identifier of the profile.","schema":{"type":"string","format":"uuid"},"example":"7a1e0c2d-0000-4000-8000-0000000000b1"}},"schemas":{"TranscriptWritable":{"type":"object","description":"Client-writable fields of a transcript.","properties":{"subjectType":{"type":"string","description":"What kind of thing the transcript records, e.g. `interview` or `call`.","example":"interview"},"subjectId":{"type":"string","format":"uuid","description":"The record of the conversation it transcribes — an interview's id, say. `subjectType` says what kind.","x-relationship":{"resource":"Polymorphic"}},"model":{"type":"string","description":"The transcription service's identifier for the model that produced\nits lines — e.g. `scribe_v2`. Services change the model behind the\nsame name, so this is what tells two transcripts made a month apart\napart. Where a service does not report a version, the model the\nclient requested — e.g. `standard`. Required unless the profile's\nservice is `none`.\n","example":"scribe_v2"},"client":{"type":"string","pattern":"^[a-z0-9][a-z0-9.-]*/[0-9A-Za-z.+-]+$","description":"The software that wrote its lines, as `name/version` — a transcription client, or a chat.","example":"interview-assistant/0.1.0"}}},"Transcript":{"description":"A transcript, including server-managed fields.","unevaluatedProperties":false,"required":["id","status","createdAt","updatedAt"],"allOf":[{"$ref":"#/components/schemas/TranscriptWritable"},{"type":"object","properties":{"id":{"type":"string","format":"uuid","readOnly":true,"description":"Unique identifier (server-generated)."},"status":{"type":"string","readOnly":true,"description":"`recording` while the conversation is on the record, `paused`\nwhile it is off it, and `closed` once it has ended.\n","enum":["recording","paused","closed"]},"startedAt":{"type":"string","format":"date-time","readOnly":true,"description":"When the conversation began, by the client's clock — the clock every time on its entries is on."},"closedAt":{"type":"string","format":"date-time","readOnly":true,"description":"When the transcript was closed, by the client's clock."},"lastActivityAt":{"type":"string","format":"date-time","readOnly":true,"description":"When the last line or gap ended, by the client's clock. A transcript closed for being idle closes at this time."},"createdAt":{"type":"string","format":"date-time","readOnly":true,"description":"When the transcript was started."},"updatedAt":{"type":"string","format":"date-time","readOnly":true,"description":"When the transcript last changed."},"profile":{"$ref":"#/components/schemas/TranscriptionProfile","x-relationship":{"resource":"TranscriptionProfile","style":"expand"}}}}]},"TranscriptCreate":{"unevaluatedProperties":false,"allOf":[{"$ref":"#/components/schemas/TranscriptWritable"},{"type":"object","description":"Payload to start a transcript. What produced it is required — the\nprofile, which says the transcription service; the client; and the\nmodel unless the profile's service is `none` — so every transcript\nsays where its lines came from — and when it started, by the\nclient's clock. id, status, createdAt and updatedAt are set by the\nserver.\n","required":["profileId","client","startedAt"],"properties":{"profileId":{"type":"string","format":"uuid","description":"The profile to start it under.","x-relationship":{"resource":"TranscriptionProfile"}},"startedAt":{"type":"string","format":"date-time","description":"When the conversation began, by the client's clock."}}}]},"TranscriptUpdate":{"unevaluatedProperties":false,"allOf":[{"$ref":"#/components/schemas/TranscriptWritable"},{"type":"object","description":"Payload to update one or more fields of a transcript. Partial\nupdates are supported; status is not one of them.\n","minProperties":1}]},"TranscriptList":{"type":"object","additionalProperties":false,"required":["items","total","limit","offset"],"properties":{"items":{"type":"array","items":{"$ref":"#/components/schemas/Transcript"}},"total":{"type":"integer","minimum":0,"description":"Total number of transcripts available."},"limit":{"type":"integer","minimum":1,"maximum":100,"description":"Maximum number of transcripts requested."},"offset":{"type":"integer","minimum":0,"description":"Number of items skipped before the current page."},"hasNext":{"type":"boolean","description":"Whether more transcripts are available beyond this page."}}},"TranscriptEntryKind":{"type":"string","enum":["line","gap","pause"],"description":"`line`: something said or typed. `gap`: a stretch where nothing was\ncaptured — a dropped connection, a provider failure. `pause`: the\nconversation off the record, by choice.\n"},"Speaker":{"type":"string","enum":["staff","client","unknown"],"description":"Who said a line, as a role. A contract set replaces these by overlay —\nsafety-net-contracts might say `worker` and `applicant`.\n"},"GapCause":{"type":"string","enum":["connection","provider","client","unknown"],"description":"Why nothing was captured, as far as the client knows."},"TranscriptEntry":{"description":"An entry in a transcript's timeline, including server-managed fields.","type":"object","required":["id","transcriptId","kind","startedAt","endedAt","createdAt","updatedAt"],"properties":{"id":{"type":"string","format":"uuid","readOnly":true,"description":"Unique identifier (server-generated)."},"transcriptId":{"type":"string","format":"uuid","readOnly":true,"description":"The transcript it belongs to.","x-relationship":{"resource":"Transcript"}},"kind":{"$ref":"#/components/schemas/TranscriptEntryKind"},"startedAt":{"type":"string","format":"date-time","description":"When it began, by the client's clock. Entries are in this order."},"endedAt":{"type":["string","null"],"format":"date-time","description":"When it ended, by the client's clock. Null only for a pause still going on."},"text":{"type":"string","description":"What was said or typed. Lines only."},"speaker":{"$ref":"#/components/schemas/Speaker"},"speakerLabel":{"type":"string","description":"The transcription service's own label for the speaker, e.g. `spk_0` or `ch_1`, kept so a mapping mistake can be corrected. Lines only."},"confidence":{"type":"number","minimum":0,"maximum":1,"description":"The transcription service's confidence in the line. Spoken lines only."},"cause":{"$ref":"#/components/schemas/GapCause"},"createdAt":{"type":"string","format":"date-time","readOnly":true,"description":"When the entry was recorded, by the server's clock."},"updatedAt":{"type":"string","format":"date-time","readOnly":true,"description":"When the entry last changed, by the server's clock."},"links":{"type":"object","readOnly":true,"description":"Related resource links.","properties":{"transcript":{"type":"string","format":"uri-reference","description":"Link to the related Transcript resource."}}}}},"TranscriptEntryCreate":{"oneOf":[{"$ref":"#/components/schemas/TranscriptLineCreate"},{"$ref":"#/components/schemas/TranscriptGapCreate"}],"discriminator":{"propertyName":"kind","mapping":{"line":"#/components/schemas/TranscriptLineCreate","gap":"#/components/schemas/TranscriptGapCreate"}}},"TranscriptLineCreate":{"type":"object","description":"A finished line, said or typed.","additionalProperties":false,"required":["kind","startedAt","endedAt","text","speaker"],"properties":{"kind":{"const":"line"},"startedAt":{"type":"string","format":"date-time","description":"When it began","by the client's clock.":null},"endedAt":{"type":"string","format":"date-time","description":"When it ended. For a typed line","the same as startedAt.":null},"text":{"type":"string","minLength":1},"speaker":{"$ref":"#/components/schemas/Speaker"},"speakerLabel":{"type":"string"},"confidence":{"type":"number","minimum":0,"maximum":1}}},"TranscriptGapCreate":{"type":"object","description":"A stretch where nothing was captured, recorded once transcription works again or the transcript closes.","additionalProperties":false,"required":["kind","startedAt","endedAt"],"properties":{"kind":{"const":"gap"},"startedAt":{"type":"string","format":"date-time"},"endedAt":{"type":"string","format":"date-time"},"cause":{"$ref":"#/components/schemas/GapCause"}}},"TranscriptEntryUpdate":{"type":"object","description":"When a pause ended. Written by resuming or closing the transcript.","additionalProperties":false,"required":["endedAt"],"properties":{"endedAt":{"type":"string","format":"date-time"}}},"TranscriptEntryList":{"type":"object","additionalProperties":false,"required":["items","total","limit","offset"],"properties":{"items":{"type":"array","items":{"$ref":"#/components/schemas/TranscriptEntry"}},"total":{"type":"integer","minimum":0,"description":"Total number of entries."},"limit":{"type":"integer","minimum":1,"maximum":100,"description":"Maximum number of entries requested."},"offset":{"type":"integer","minimum":0,"description":"Number of entries skipped before this page."},"hasNext":{"type":"boolean","description":"Whether more entries are available beyond this page."}}},"TranscriptionProfileWritable":{"type":"object","description":"Client-writable fields of a profile.","properties":{"name":{"type":"string","pattern":"^[a-z0-9]+(-[a-z0-9]+)*$","description":"A short handle people tell profiles apart by, e.g. `english-phone`. Nothing checks that it is unique.","example":"english-phone"},"description":{"type":"string","description":"What the profile is for."},"provider":{"type":"string","description":"The transcription service — an entry of the `transcription-services`\nregistry, which a contract set extends with a registry file of its\nown. `none` for conversations no service transcribes: a chat, or\nlines a person types.\n","example":"aws-transcribe","enum":["aws-transcribe","elevenlabs-scribe","none"]},"languages":{"type":"array","minItems":1,"uniqueItems":true,"items":{"$ref":"../../schemas/enums.yaml#/$defs/Language"},"description":"The languages the conversation may be in. One fixes the language;\nseveral let the service tell which is being spoken among them.\nAbsent, the service detects the language itself — which not every\nservice can do.\n","example":["en-US","es-US"]},"idleTimeout":{"type":"string","format":"duration","description":"How long a recording transcript may go without a line or gap before\nit closes itself, as an ISO 8601 duration. It is checked when the\ntime is up and again after any activity since, so a quiet\ntranscript closes between one and two of these after it was last\nheard from. Absent, a transcript never closes for being idle.\n","example":"PT30M"}}},"TranscriptionProfile":{"description":"A profile, including server-managed fields.","unevaluatedProperties":false,"required":["id","name","provider","source","createdAt","updatedAt"],"allOf":[{"$ref":"#/components/schemas/TranscriptionProfileWritable"},{"type":"object","properties":{"id":{"type":"string","format":"uuid","readOnly":true,"description":"Unique identifier — given in the config for a seeded profile, server-generated for one added here."},"source":{"$ref":"../../schemas/enums.yaml#/$defs/ConfigSource"},"createdAt":{"type":"string","format":"date-time","readOnly":true,"description":"When the profile was added."},"updatedAt":{"type":"string","format":"date-time","readOnly":true,"description":"When the profile last changed."}}}]},"TranscriptionProfileCreate":{"unevaluatedProperties":false,"allOf":[{"$ref":"#/components/schemas/TranscriptionProfileWritable"},{"type":"object","description":"Payload to add a profile.","required":["name","provider"]}]},"TranscriptionProfileUpdate":{"unevaluatedProperties":false,"allOf":[{"$ref":"#/components/schemas/TranscriptionProfileWritable"},{"type":"object","description":"Payload to change one or more fields of a profile.","min .profileId"}}],"timers":[{"id":"idle_check","description":"Whether a recording transcript has gone quiet for its profile's idleTimeout."}],"guards":[{"id":"atAfterStart","description":"the time given is not before the transcript started","condition":"timestamp(request.at) >= timestamp(object.startedAt)"},{"id":"atAfterPauseBegan","description":"the time given is not before the open pause began","condition":"openPause == null || timestamp(request.at) >= timestamp(openPause.startedAt)"},{"id":"aPauseIsOpen","description":"a pause is open","condition":"openPause != null"},{"id":"profileExists","description":"the profile it names exists","condition":"profile != null"},{"id":"modelGivenForTheService","description":"a model is given when the profile names a transcription service","condition":"profile == null || profile.provider == \"none\" || has(request.model)"},{"id":"startedWhileRecording","description":"the entry started while the transcript was recording — after it started, not during a pause, and before it closed","condition":"timestamp(request.startedAt) >= timestamp(object.startedAt) && pauseAtStart == null && (!has(object.closedAt) || timestamp(request.startedAt) \u003c timestamp(object.closedAt))"},{"id":"endsAfterItStarts","description":"the entry does not end before it starts","condition":"timestamp(request.endedAt) >= timestamp(request.startedAt)"},{"id":"gapOutsidePauses","description":"a gap does not overlap a pause","condition":"request.kind != \"gap\" || pauseOverlap == null"}],"emits":[{"id":"paused","description":"The conversation went off the record. Anything said until it resumes is not stored."},{"id":"resumed","description":"The conversation is back on the record."},{"id":"closed","description":"The transcript has ended."}],"actions":[{"id":"pause","description":"Take the conversation off the record, at the time the client says.","transition":{"from":"recording","to":"paused"},"schema":{"request":{"$ref":"#/$defs/AtRequest"}},"guards":[{"conditions"
