<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not your average Mock Server</title>
<!--
  A playground over the browser mock, rather than a tour of it.

  The page is generated from the contracts twice over: the server is, and so
  is this. Which operations exist, what kind of thing each one is, what a
  sensible body looks like, which records you can act on and which moves are
  legal from where they are — every one of those comes out of the contract
  set, which is why this can do things a generic API client cannot. Postman
  hands you a box and wishes you luck.

  Operations are grouped in dependency order, and the order is real rather
  than pedagogical: a composition needs a record to project, a transition
  needs a record already in a particular state. Resources first is not a
  teaching conceit, it is what has to happen.
-->
<style>
  :root {
    --ink: #1a1a1a; --muted: #555; --faint: #888; --line: #e2e2e2;
    --bg: #fafafa; --card: #fff; --accent: #2b6cb0; --ok: #2f7a3f; --bad: #b02b2b;
    --warm: #8a6d3b;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  /* Any `display` on a rule beats the user agent's `[hidden] { display: none }`,
     so an element given a layout and then hidden in script stays on screen.
     That has now produced two bugs — an empty bordered box, and a Next button
     offering to skip a step nobody had run. Settled here instead of per rule. */
  [hidden] { display: none !important; }
  body {
    margin: 0; padding: 0 0 5rem; background: var(--bg); color: var(--ink);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  h1 { font-size: 1.4rem; margin: 0; }
  code { font-family: var(--mono); font-size: .88em; }

  #masthead {
    max-width: 86rem; margin: 0 auto; padding: 1.6rem 1.2rem 1.1rem;
    border-bottom: 1px solid var(--line);
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2rem; align-items: start;
  }
  /* Two cells, not four rows: as separate rows the left-hand items were
     stretched to match whichever side was taller, which put a hand's width
     of nothing between the title and the text under it. */
  #masthead .intro { min-width: 0; }
  #derived {
    align-self: start;
    border: 1px solid var(--line); border-radius: 6px; background: var(--card);
    padding: .6rem .8rem; min-width: 17rem;
  }
  #derived .when {
    margin: .45rem 0 0; padding-top: .4rem; border-top: 1px solid var(--line);
    font-size: .66rem; letter-spacing: .04em; text-transform: uppercase;
    color: var(--faint); font-weight: 700;
  }
  #derived .stat {
    display: flex; gap: .4rem; align-items: baseline;
    font-size: .75rem; color: var(--muted); line-height: 1.45;
  }
  #derived .stat .n {
    font-family: var(--mono); min-width: 1.4rem; text-align: right; color: var(--ink);
  }
  #derived .stat.lead { font-size: .92rem; color: var(--ink); font-weight: 600; line-height: 1.3; }
  #derived .stat.lead .n { color: var(--accent); min-width: 1.9rem; }
  #derived .breakdown {
    display: grid; grid-template-columns: 1fr 1fr; column-gap: .9rem;
    margin-top: .45rem; padding-top: .4rem; border-top: 1px solid var(--line);
  }
  #derived .headline { margin-top: 0; padding-top: 0; border-top: 0; }
  @media (max-width: 60rem) {
    #masthead { grid-template-columns: 1fr; }
    #derived { grid-column: 1; grid-row: auto; }
  }
  .lede { color: var(--muted); margin: .4rem 0 0; max-width: 44rem; font-size: .95rem; }

  /* Throwing the whole thing away and deriving it again, which is the
     headline claim and takes about as long as a keystroke. */
  #controls { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; margin: .9rem 0 0; }
  #controls .sep { border-left: 1px solid var(--line); height: 1.4rem; margin: 0 .2rem; }
  #controls button:not(.primary) {
    font: inherit; font-size: .85rem; cursor: pointer; padding: .4rem 1rem;
    border-radius: 4px; border: 1px solid var(--line); background: var(--card); color: var(--ink);
  }
  #controls button:disabled { opacity: .4; cursor: not-allowed; }
  /* Who the reference calls as. Every request carries it, the way a real
     client's sign-in would, and the events it causes record it. */
  .caller { display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; margin: 0 0 .6rem; font-size: .85rem; color: var(--muted); }
  .caller input, .caller select { width: auto; }
  .caller .caller-id { width: 9rem; }
  .caller input.caller-roles { width: 15rem; }
  details.caller-roles { position: relative; }
  details.caller-roles summary {
    cursor: pointer; font-family: var(--mono); font-size: .8rem; padding: .4rem .5rem; min-width: 12rem;
    border: 1px solid var(--line); border-radius: 4px; background: #fcfcfc; color: var(--ink);
  }
  details.caller-roles .menu {
    position: absolute; z-index: 5; margin-top: .2rem; padding: .3rem .5rem; min-width: 100%;
    border: 1px solid var(--line); border-radius: 4px; background: var(--card); box-shadow: 0 2px 8px rgba(0,0,0,.08);
  }
  details.caller-roles .menu label { display: flex; gap: .4rem; align-items: center; padding: .15rem 0; font-family: var(--mono); font-size: .8rem; color: var(--ink); white-space: nowrap; }
  details.caller-roles .menu input { width: auto; }
  .caller .caller-id:disabled { opacity: .4; }


  #shell {
    display: grid; grid-template-columns: 17rem minmax(0, 1fr);
    gap: 2rem; max-width: 86rem; margin: 1.4rem auto 0; padding: 0 1.2rem;
  }
  #groups {
    position: sticky; top: 1rem; align-self: start;
    max-height: calc(100vh - 2rem); overflow: auto;
    border-right: 1px solid var(--line); padding-right: .8rem;
  }
  .group > summary {
    cursor: pointer; list-style: none; padding: .45rem .3rem;
    font-size: .76rem; letter-spacing: .06em; text-transform: uppercase;
    font-weight: 700; color: var(--ink);
  }
  .group > summary::-webkit-details-marker { display: none; }
  .group > summary::before { content: '▸ '; color: var(--faint); }
  .group[open] > summary::before { content: '▾ '; }
  .kind {
    margin: .5rem 0 .1rem .3rem; font-size: .68rem; letter-spacing: .05em;
    text-transform: uppercase; color: var(--faint); font-weight: 700;
  }
  .ops { list-style: none; margin: 0 0 .5rem; padding: 0; }
  .op {
    display: block; width: 100%; text-align: left; border: 0; background: none;
    font: inherit; font-size: .8rem; cursor: pointer; color: var(--muted);
    padding: .22rem .45rem; border-radius: 4px; line-height: 1.35;
  }
  .op:hover { background: #f1f4f8; color: var(--ink); }
  .op.here { background: #eef4fb; color: var(--accent); font-weight: 600; }
  .steps { counter-reset: none; }
  .op.step { padding: .34rem .45rem; font-size: .84rem; }
  .op .n {
    font-family: var(--mono); font-size: .7rem; color: var(--faint);
    display: inline-block; min-width: 1.9rem;
  }
  .op.step.here .n { color: var(--accent); }
  .panel .watch {
    margin: 1rem 0 0; padding: .8rem 1rem .9rem; font-size: .9rem; color: var(--ink);
    background: #f4f9f4; border: 1px solid #d6e8d6; border-radius: 4px; max-width: 48rem;
  }
  .watch-title {
    margin: 0 0 .5rem; font-size: .68rem; letter-spacing: .06em; text-transform: uppercase;
    font-weight: 700; color: var(--ok);
  }
  .panel .watch ul { margin: 0; padding-left: 1.1rem; }
  /* The anchor for the cards below: they span the bullet rather than hang
     off the word, so one near the right-hand edge has nowhere to overflow
     to and every card opens in the same place. */
  .panel .watch li { margin: 0 0 .45rem; line-height: 1.55; position: relative; }
  .panel .watch li:last-child { margin-bottom: 0; }
  .panel .watch code { background: #e4efe4; padding: .08em .3em; border-radius: 3px; }
  .panel .watch .ref > code {
    border-bottom: 1px dotted var(--ok); cursor: help; outline: none;
  }
  .panel .watch .ref > code:hover, .panel .watch .ref > code:focus { background: #cfe4cf; }
  .panel .watch .ref .card {
    display: none; position: absolute; left: 0; right: 0; top: calc(100% + .25rem);
    z-index: 5; background: var(--card); border: 1px solid #cfd6de; border-radius: 4px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, .13); padding: .55rem .7rem .6rem;
  }
  .panel .watch .ref:hover .card, .panel .watch .ref:focus-within .card { display: block; }
  .panel .watch .card .excerpt {
    margin: 0; background: #fcfbf7; border-color: #e6ded0; border-left: 3px solid var(--warm);
    max-height: 18rem; font-size: .73rem;
  }
  .panel .watch .card .whole {
    display: inline-block; margin: .45rem 0 0; font-family: var(--mono); font-size: .7rem;
    color: var(--accent); text-decoration: none; border-bottom: 1px dotted currentColor;
  }
  .panel .watch .card code { background: none; padding: 0; }
  .op .n.run { color: var(--ok); font-weight: 700; }
  .to-come { margin: .5rem 0 0 .45rem; font-size: .78rem; color: var(--faint); font-style: italic; }
  .row { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
  /* The other way through: dashed, because it is the alternative route and
     should not compete with the step you are being offered. */
  button.run-all {
    font: inherit; font-size: .8rem; cursor: pointer; padding: .4rem .8rem;
    border-radius: 4px; border: 1px dashed #c3cdd8; background: var(--card); color: var(--muted);
  }
  button.run-all:hover { color: var(--accent); border-color: var(--accent); border-style: solid; }
  button.run-all:disabled { opacity: .6; cursor: progress; }
  #groups button.run-all { display: block; width: 100%; margin: .7rem 0 .3rem; }
  .pager {
    display: flex; gap: .6rem; align-items: center; justify-content: space-between;
    margin-top: 1rem;
  }
  .pager .step-back {
    font: inherit; font-size: .82rem; cursor: pointer; padding: .35rem .8rem;
    border-radius: 4px; border: 1px solid var(--line); background: var(--card); color: var(--muted);
  }
  .pager .step-back:hover { color: var(--ink); border-color: #cfd6de; }
  /* Pushed right when it is the only one, so it sits where it always sits. */
  .pager .next-step { margin-left: auto; }
  .op .verb {
    font-family: var(--mono); font-size: .68rem; font-weight: 700;
    display: inline-block; min-width: 3.4rem; color: var(--faint);
  }
  .op.here .verb { color: var(--accent); }

  #stage { min-width: 0; }
  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: 6px;
    padding: 1.1rem 1.2rem; margin: 0 0 1.2rem;
  }
  .panel .kindline {
    font-size: .68rem; letter-spacing: .05em; text-transform: uppercase;
    font-weight: 700; color: var(--accent); margin: 0 0 .25rem;
  }
  .panel h2 { font-size: 1.05rem; margin: 0 0 .2rem; }
  .panel .about {
    color: var(--muted); font-size: .9rem; margin: 0 0 .8rem; padding: 0 0 .8rem;
    border-bottom: 1px solid var(--line); max-width: 46rem;
  }
  .panel .path { font-family: var(--mono); font-size: .82rem; color: var(--accent); margin: 0 0 .7rem; }
  .panel .note { color: var(--muted); font-size: .9rem; margin: 0 0 .9rem; max-width: 46rem; }
  .panel .cited { font-family: var(--mono); font-size: .74rem; color: var(--faint); margin: 0 0 .9rem; }
  .panel .cited code { background: #eef2f6; color: var(--ink); padding: .08em .3em; border-radius: 3px; }
  .panel .cited a { color: var(--accent); text-decoration: none; border-bottom: 1px dotted currentColor; }
  .panel .cited a:hover { border-bottom-style: solid; }

  label.field { display: block; margin: 0 0 .7rem; font-size: .82rem; color: var(--muted); }
  label.field > span { display: block; margin-bottom: .22rem; }
  .shape { margin: .9rem 0 .25rem; }
  .shape > summary {
    cursor: pointer; list-style: none;
    font-family: var(--mono); font-size: .74rem; color: var(--faint);
  }
  .shape > summary::-webkit-details-marker { display: none; }
  .shape > summary::before { content: '▸ '; }
  .shape[open] > summary::before { content: '▾ '; }
  .shape > summary:hover { color: var(--accent); }
  .shape code { background: #eef2f6; color: var(--ink); padding: .08em .3em; border-radius: 3px; }
  .shape .excerpt {
    margin: .4rem 0 0; background: #fcfbf7; border-color: #e6ded0; border-left: 3px solid var(--warm);
    max-height: 22rem; font-size: .74rem;
  }
  .shape .whole {
    display: inline-block; margin: .4rem 0 0; font-family: var(--mono); font-size: .72rem;
    color: var(--accent); text-decoration: none; border-bottom: 1px dotted currentColor;
  }
  label.field .shape { margin-top: 0; }
  label.field code { background: #eef2f6; padding: .08em .3em; border-radius: 3px; }
  label.field a { color: var(--accent); text-decoration: none; border-bottom: 1px dotted currentColor; }
  input[type=text], select, textarea {
    width: 100%; font-family: var(--mono); font-size: .8rem; padding: .4rem .5rem;
    border: 1px solid var(--line); border-radius: 4px; background: #fcfcfc; color: var(--ink);
  }
  textarea { min-height: 9rem; resize: vertical; line-height: 1.5; }
  textarea.fixed { background: #f3f3f3; color: var(--muted); cursor: default; }
  /* The parts of a body that is not JSON, listed rather than serialized:
     there is no text form of a multipart request worth showing anybody. */
  pre.parts { background: #f3f3f3; border-color: var(--line); color: var(--muted); }
  input[type=file] { font: inherit; font-size: .8rem; color: var(--muted); }

  button.primary {
    font: inherit; font-size: .85rem; cursor: pointer; padding: .4rem 1rem;
    border-radius: 4px; border: 1px solid var(--accent); background: var(--accent); color: #fff;
  }
  button.primary:disabled { opacity: .45; cursor: not-allowed; }
  button.primary:disabled[data-done] { opacity: .6; }

  pre {
    margin: .8rem 0 0; padding: .7rem .8rem; max-height: 26rem; overflow: auto;
    background: #f7f9fc; border: 1px solid #dbe4f0; border-radius: 4px;
    font-family: var(--mono); font-size: .76rem; line-height: 1.5; white-space: pre-wrap;
  }
  pre .label {
    display: block; font-family: inherit; font-size: .68rem; letter-spacing: .04em;
    text-transform: uppercase; color: var(--accent); margin-bottom: .35rem; font-weight: 600;
  }
  pre .label code { font-family: var(--mono); text-transform: none; letter-spacing: 0; }
  pre .label a { color: inherit; text-transform: none; letter-spacing: 0; border-bottom: 1px dotted currentColor; text-decoration: none; }
  pre.bad { background: #fdf6f6; border-color: #eccfcf; }
  pre.bad .label { color: var(--bad); }

  .empty { color: var(--faint); font-size: .9rem; }
  @media (max-width: 60rem) {
    #shell { grid-template-columns: 1fr; }
    #groups { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header id="masthead">
  <div class="intro">
    <h1>Not your average Mock Server</h1>
    <p class="lede">
      An entire server, generated from a set of contracts, running in this tab.
      <b>No custom code.</b> Everything is derived on the fly when the server
      boots. Change a contract and the API changes with it; hand it a different
      contract set and it is a different system.
    </p>
    <div id="controls">
      <button id="mode" class="primary">Let me explore</button>
      <span class="sep"></span>
      <button id="reseed">Restart with data</button>
      <button id="empty">Start empty</button>
    </div>
  </div>
  <div id="derived">starting…</div>
</header>

<div id="shell">
  <nav id="groups" aria-label="Operations"></nav>
  <main id="stage"></main>
</div>

e domain's *-sla-types.yaml.\n","enum":["snap_standard","medicaid_standard"]}}}}},{"relativePath":"base/domains/platform/platform-events-openapi.yaml","domain":"platform","type":"openapi","content":{"openapi":"3.1.0","info":{"title":"Events","version":"1.0.0","x-domain":"platform","x-status":"beta","x-visibility":"internal","description":"The centralized log of domain events across every domain, as CloudEvents\n1.0 envelopes. Supports REST polling and a live stream, and keeps a\npermanent audit history whether or not a message broker is in use.\n\nPublishing records an event a domain producer emits. It is for systems\nrecording what happened, not for requests made on a person's behalf.\n"},"servers":[{"url":"https://api.example.com/platform","description":"Production server"},{"url":"http://localhost:1080/platform","description":"Local development server"}],"tags":[{"name":"Events","description":"Centralized event log across all domains."}],"paths":{"/events":{"get":{"summary":"List events","description":"Queryable log of all domain events across the blueprint. Supports\nREST polling as an integration pattern and provides permanent audit\nhistory regardless of whether a message broker is in use.\n\nEvents are returned in ascending time order (oldest first) to support\ncursor-based polling.\n","operationId":"listEvents","tags":["Events"],"x-sortable":{"fields":["time","type","source"],"default":"time","tieBreaker":"id"},"parameters":[{"$ref":"../../components/parameters.yaml#/SearchQueryParam"},{"$ref":"../../components/parameters.yaml#/SortParam"},{"name":"type","in":"query","description":"Filter by CloudEvents type. Supports prefix matching with a trailing wildcard (e.g., `intake.*`). When states apply an x-event-type-prefix overlay, the resolved prefix is prepended to all event types (e.g., `org.example.intake.*`).\n","schema":{"type":"string"},"example":"intake.application.submitted"},{"name":"source","in":"query","description":"Filter by CloudEvents source (the domain that produced the event, e.g., `/intake`, `/workflow`).","schema":{"type":"string"},"example":"/intake"},{"name":"subject","in":"query","description":"Filter by CloudEvents subject — the entity ID the event pertains to. Because every domain uses the same subject for the same entity, this returns a complete cross-domain timeline for that entity.\n","schema":{"type":"string","format":"uuid"}},{"name":"traceid","in":"query","description":"Filter by W3C Trace Context trace ID extracted from the `traceparent` attribute. All events sharing a trace ID were causally triggered by the same root action.\n","schema":{"type":"string"}},{"name":"causationid","in":"query","description":"Filter by the `causationid` extension — the ID of the event that directly caused this one. Use it to find the response event(s) produced by a specific trigger (e.g., the `call.completed` fired for one `service_call.created` when several were emitted for the same subject).\n","schema":{"type":"string","format":"uuid"}},{"name":"start","in":"query","description":"Return only events at or after this timestamp (ISO 8601).","schema":{"type":"string","format":"date-time"}},{"name":"end","in":"query","description":"Return only events before or at this timestamp (ISO 8601).","schema":{"type":"string","format":"date-time"}},{"$ref":"../../components/parameters.yaml#/LimitParam"},{"$ref":"../../components/parameters.yaml#/OffsetParam"}],"responses":{"200":{"description":"Paginated list of CloudEvents envelopes, ordered by time ascending.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/EventList"}}}},"400":{"$ref":"../../components/responses.yaml#/BadRequest"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}},"post":{"summary":"Publish an event","description":"Publish a CloudEvents 1.0 envelope to the event log. Used by domain\nproducers to record state transitions and significant data mutations.\n","operationId":"publishEvent","tags":["Events"],"requestBody":{"re tryExample2":{"id":"7a1e0c2d-0000-4000-8000-0000000000e2","transcriptId":"7a1e0c2d-0000-4000-8000-000000000001","kind":"line","startedAt":"2026-10-11T14:00:11Z","endedAt":"2026-10-11T14:00:16Z","text":"It's me and my two kids, and my mother stays with us most weeks.","speaker":"client","speakerLabel":"spk_1","confidence":0.91,"createdAt":"2026-10-11T14:00:17Z","updatedAt":"2026-10-11T14:00:17Z"},"TranscriptEntryExample3":{"id":"7a1e0c2d-0000-4000-8000-0000000000e3","transcriptId":"7a1e0c2d-0000-4000-8000-000000000001","kind":"gap","startedAt":"2026-10-11T14:01:02Z","endedAt":"2026-10-11T14:01:20Z","cause":"connection","createdAt":"2026-10-11T14:01:21Z","updatedAt":"2026-10-11T14:01:21Z"},"TranscriptEntryExample4":{"id":"7a1e0c2d-0000-4000-8000-0000000000e4","transcriptId":"7a1e0c2d-0000-4000-8000-000000000001","kind":"pause","startedAt":"2026-10-11T14:03:00Z","endedAt":"2026-10-11T14:04:30Z","createdAt":"2026-10-11T14:03:00Z","updatedAt":"2026-10-11T14:04:30Z"}}},{"relativePath":"base/domains/transcription/transcription-registry-transcription-services.yaml","domain":"transcription","type":"registry","content":{"$schema":"https://blueprint.codeforamerica.org/schemas/registry-schema.yaml","version":"1.0.0","domain":"transcription","type":"transcription-services","entries":{"aws-transcribe":{"description":"Amazon Transcribe streaming."},"elevenlabs-scribe":{"description":"ElevenLabs Scribe realtime."},"none":{"description":"No transcription service — a chat, or lines a person typed. A transcript naming it has no model."}}}},{"relativePath":"base/domains/transcription/transcription-transcripts-asyncapi.yaml","domain":"transcription","type":"asyncapi","content":{"asyncapi":"3.0.0","info":{"x-domain":"transcription","title":"Transcript events","version":"0.1.0","x-status":"alpha","description":"Events a transcript emits as it is paused, resumed and closed."},"channels":{"transcription.transcript.paused":{"address":"transcription.transcript.paused","messages":{"TranscriptPaused":{"$ref":"#/components/messages/TranscriptPausedMessage"}}},"transcription.transcript.resumed":{"address":"transcription.transcript.resumed","messages":{"TranscriptResumed":{"$ref":"#/components/messages/TranscriptResumedMessage"}}},"transcription.transcript.closed":{"address":"transcription.transcript.closed","messages":{"TranscriptClosed":{"$ref":"#/components/messages/TranscriptClosedMessage"}}}},"components":{"messages":{"TranscriptPausedMessage":{"name":"transcription.transcript.paused","summary":"The conversation went off the record. Anything said until it resumes is not stored.","payload":{"$ref":"#/components/schemas/TranscriptPausedEvent"}},"TranscriptResumedMessage":{"name":"transcription.transcript.resumed","summary":"The conversation is back on the record.","payload":{"$ref":"#/components/schemas/TranscriptResumedEvent"}},"TranscriptClosedMessage":{"name":"transcription.transcript.closed","summary":"The transcript has ended.","payload":{"$ref":"#/components/schemas/TranscriptClosedEvent"}}},"schemas":{"TranscriptPausedEvent":{"allOf":[{"$ref":"../../schemas/events.yaml#/$defs/Event"},{"type":"object","properties":{"type":{"type":"string","const":"transcription.transcript.paused"}}}]},"TranscriptResumedEvent":{"allOf":[{"$ref":"../../schemas/events.yaml#/$defs/Event"},{"type":"object","properties":{"type":{"type":"string","const":"transcription.transcript.resumed"}}}]},"TranscriptClosedEvent":{"allOf":[{"$ref":"../../schemas/events.yaml#/$defs/Event"},{"type":"object","properties":{"type":{"type":"string","const":"transcription.transcript.closed"}}}]}}}}},{"relativePath":"base/domains/transcription/transcription-transcripts-openapi.yaml","domain":"transcription","type":"openapi","content":{"openapi":"3.1.0","info":{"title":"Transcripts","version":"0.1.0","x-domain":"transcription","x-status":"alpha","x-visibility":"internal","description":"The written record of a conversation. Starting a transcript opens it for\nrecording; pausing takes the conversation off the record; closing ends it.\nA transcript refers to what it records — an interview, a call — and records\nwhich client, transcription service and model produced it. Updating corrects what it records;\ndeleting removes it, and the event left behind says which one and by whom.\n\nIts entries are its timeline, in the order things happened: lines, gaps\nwhere nothing was captured, and pauses. Every time on a transcript and its\nentries is the client's — when it started, paused, resumed and closed, and\nwhen each line was said — so they are compared on one clock.\n"},"servers":[{"url":"https://api.example.com/transcription","description":"Production server"},{"url":"http://localhost:1080/transcription","description":"Local development server"}],"tags":[{"name":"Transcripts","description":"The written record of a conversation."},{"name":"Transcript entries","description":"A transcript's timeline — lines, gaps and pauses."}],"x-events":{"transcript.created":{"type":"org.codeforamerica.safety-net-blueprint.transcription.transcript.created","summary":"Emitted when a transcript is started.","payload":{"$ref":"#/components/schemas/TranscriptCreatedEvent"}},"transcript.updated":{"type":"org.codeforamerica.safety-net-blueprint.transcription.transcript.updated","summary":"Emitted when a transcript is updated via PATCH.","payload":{"$ref":"#/components/schemas/TranscriptUpdatedEvent"}},"transcript.deleted":{"type":"org.codeforamerica.safety-net-blueprint.transcription.transcript.deleted","summary":"Emitted when a transcript is deleted. Records which transcript, and who deleted it.","payload":{"$ref":"#/components/schemas/TranscriptDeletedEvent"}},"transcript_entry.created":{"type":"org.codeforamerica.safety-net-blueprint.transcription.transcript_entry.created","summary":"Emitted when an entry is added to a transcript — a line, a gap, or a pause beginning.","payload":{"$ref":"#/components/schemas/TranscriptEntryCreatedEvent"}},"transcript_entry.updated":{"type":"org.codeforamerica.safety-net-blueprint.transcription.transcript_entry.updated","summary":"Emitted when an entry changes — a pause ending, as the transcript resumes or closes.","payload":{"$ref":"#/components/schemas/TranscriptEntryUpdatedEvent"}}},"paths":{"/transcripts":{"get":{"summary":"List transcripts","description":"Retrieve a paginated list of transcripts. Filter by `subjectId` to find\nthe transcripts of one interview or call.\n","operationId":"listTranscripts","tags":["Transcripts"],"x-sortable":{"fields":["createdAt"],"default":"-createdAt","tieBreaker":"id"},"parameters":[{"$ref":"../../components/parameters.yaml#/SearchQueryParam"},{"$ref":"../../components/parameters.yaml#/LimitParam"},{"$ref":"../../components/parameters.yaml#/OffsetParam"},{"$ref":"../../components/parameters.yaml#/SortParam"}],"responses":{"200":{"description":"A paginated collection of transcripts.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/TranscriptList"}}}},"400":{"$ref":"../../components/responses.yaml#/BadRequest"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}},"post":{"summary":"Start a transcript","description":"Start recording a conversation. The transcript begins in `recording`.\n","operationId":"createTranscript","tags":["Transcripts"],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/TranscriptCreate"}}}},"responses":{"201":{"description":"Transcript started.","headers":{"Location":{"description":"URL of the new transcript.","schema":{"type":"string","format":"uri"}}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/Transcript"}}}},"400":{"$ref":"../../components/responses.yaml#/BadRequest"},"422":{"$ref":"../../components/responses.yaml#/UnprocessableEntity"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}}},"/transcripts/{transcriptId}":{"parameters":[{"$ref":"#/components/parameters/TranscriptIdParam"}],"get":{"summary":"Get a transcript","description":"Retrieve a single transcript by identifier.","operationId":"getTranscript","tags":["Transcripts"],"responses":{"200":{"description":"Transcript retrieved successfully.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Transcript"},"examples":{"TranscriptExample1":{"$ref":"#/components/examples/TranscriptExample1"}}}}},"404":{"$ref":"../../components/responses.yaml#/NotFound"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}},"patch":{"summary":"Update a transcript","description":"Correct what a transcript records — its subject, provider or client.\nIts status changes only through `pause`, `resume` and `close`.\n","operationId":"updateTranscript","tags":["Transcripts"],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/TranscriptUpdate"}}}},"responses":{"200":{"description":"Transcript updated.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Transcript"}}}},"400":{"$ref":"../../components/responses.yaml#/BadRequest"},"404":{"$ref":"../../components/responses.yaml#/NotFound"},"422":{"$ref":"../../components/responses.yaml#/UnprocessableEntity"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}},"delete":{"summary":"Delete a transcript","description":"Permanently remove a transcript. The `transcription.transcript.deleted`\nevent records which transcript was removed and who removed it.\n","operationId":"deleteTranscript","tags":["Transcripts"],"responses":{"204":{"description":"Transcript deleted."},"404":{"$ref":"../../components/responses.yaml#/NotFound"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}}},"/transcripts/{transcriptId}/entries":{"parameters":[{"$ref":"#/components/parameters/TranscriptIdParam"}],"get":{"summary":"List a transcript's entries","description":"A transcript's timeline, in the order things happened — by `startedAt`.\nFilter by `kind` for only its lines, gaps or pauses.\n","operationId":"listTr :{"url":{"type":"string","format":"uri","description":"Base URL for the external service endpoint.","example":"https://hub.cms.gov/fdsh/ssa"},"timeoutMs":{"type":"integer","description":"Request timeout in milliseconds. Defaults to adapter implementation default if omitted.","minimum":0,"example":30000},"apiVersion":{"type":"string","description":"Service API version, if the external service requires explicit versioning.","example":"2.0"}}}}}},{"relativePath":"base/schemas/enums.yaml","domain":null,"type":"schema","content":{"$schema":"https://json-schema.org/draft/2020-12/schema","$id":"https://blueprint.codeforamerica.org/base/schemas/enums.yaml","$defs":{"Domain":{"type":"string","description":"Blueprint domain identifier. Used as the {domain} path parameter on metadata mutation endpoints and as the value type for x-domain annotations on domain OpenAPI specs. Its values are generated at resolve time: the domains the set's OpenAPI, AsyncAPI and rules documents declare.\n","enum":["document-management","eligibility","intake","platform","scheduling","transcription"]},"MetricCollection":{"type":"string","description":"Harness metric collections. Extends the base MetricCollection with the primary resource collections for intake and eligibility domains.\n","enum":["applications","determinations","events"]},"Frequency":{"type":"string","description":"How often an amount is received, incurred, or scheduled. Applies to income, expenses, SLA recurrence, scheduled reviews, and any other time-based cadence. Domain packages can extend this enum via overlay.\n","enum":["daily","weekly","every_two_weeks","twice_monthly","monthly","yearly","variable"]},"Language":{"type":"string","description":"Preferred language (BCP 47 language tag).","pattern":"^[a-zA-Z]{2,3}(?:-[a-zA-Z0-9]{2,8})*$"},"RoleType":{"type":"string","description":"Harness authorization roles. Replaces the base RoleType with the roles the harness's state machine guards name.\n- applicant: The household applying, acting on its own application - case_worker: Processes applications - supervisor: Oversees case workers - system: Automated service account for background and inter-service operations\n","enum":["applicant","case_worker","supervisor","system"]}}}},{"relativePath":"base/schemas/events.yaml","domain":null,"type":"schema","content":{"$schema":"https://json-schema.org/draft/2020-12/schema","$id":"https://blueprint.codeforamerica.org/base/schemas/events.yaml","$defs":{"EventRef":{"type":"object","required":["type"],"properties":{"type":{"type":"string","description":"Fully qualified CloudEvents event type following the convention {domain}.{entity}.{action} (e.g., intake.application.submitted). Must match a channel address declared in the domain's eventsSpec AsyncAPI file.\n"},"description":{"type":"string","description":"Human-readable annotation for state machine authors. Not a CloudEvents field."}}},"EventBase":{"allOf":[{"$ref":"#/$defs/EventRef"},{"type":"object","properties":{"subject":{"type":"string","description":"CloudEvents subject override. The entity ID the event pertains to. Defaults to the emitting resource's own id when omitted.\n"},"causationid":{"type":"string","description":"CloudEvents Causation extension (optional). Value expression resolving to the id of the event that directly caused this one. Use when an event is emitted in response to another event (e.g., auto-resume triggered by a timer callback).\n"},"data":{"type":"object","additionalProperties":true,"description":"Event-specific payload. Field values are value expressions resolved at emit time."}}}]},"Event":{"allOf":[{"$ref":"#/$defs/EventBase"},{"type":"object","required":["specversion","id","source","subject","time","datacontenttype"],"properties":{"specversion":{"type":"string","const":"1.0","description":"CloudEvents specification version."},"id":{"type":"string","format":"uuid","description":"Unique event identifier."},"source":{"type":"string","description":"Domain base path that produced the event (e.g., /intake, /workflow).","example":"/intake"},"subject":{"type":"string","format":"uuid","description":"Entity ID the event pertains to."},"time":{"type":"string","format":"date-time","description":"When the event occurred."},"datacontenttype":{"type":"string","const":"application/json","description":"Media type of the event payload."},"traceparent":{"type":["string","null"],"description":"W3C Trace Context header (optional). Propagated from the triggering request or event. The trace ID component is stable across the full causal chain.\n"},"causationid":{"type":["string","null"],"format":"uuid","description":"CloudEvents Causation extension (optional). The `id` of the event that directly caused this one. Use when an event is emitted in direct response to another event (e.g., a task auto-resumed because a timer fired). Allows consumers to trace the immediate cause without inspecting the full distributed trace.\n"},"authid":{"type":["string","null"],"description":"CloudEvents Auth Context extension (optional). Principal identifier (userId from JWT claims) of the actor who triggered the event. No PII — user ID only, not name or email. Required for FTI-governed events per IRS Pub. 1075. Omitted when no caller identity is present.\n"},"authtype":{"type":["string","null"],"enum":["user","service_account","api_key","system","unauthenticated","unknown",null],"description":"CloudEvents Auth Context extension (optional). Principal type of the actor who triggered the event. Required when authid is present. Required for FTI-governed events per IRS Pub. 1075.\n"},"data":{"type":"object","description":"Event-specific payload. Schema is defined per event type in each domain's AsyncAPI file."}}}]}},"FieldChange":{"type":"object","description":"A single field change recorded in an updated event.","additionalProperties":false,"required":["field","before","after"],"properties":{"field":{"type":"string","description":"Dot-path of the changed field. Top-level fields are a on was approved or denied at close."},"notes":{"type":"string","description":"Optional caseworker notes on the closure decision."}}},"ApplicationSummaryResponse":{"type":"object","description":"Generated composition response for applicationSummary."},"ApplicationReviewResponse":{"type":"object","description":"Generated composition response for applicationReview."},"ApplicationReviewSectionResponse":{"type":"object","description":"Generated section panel response for applicationReview."},"ApplicationReviewSections":{"type":"string","description":"Valid section names for the applicationReview sectionView.","enum":["demographics","contact"],"x-generated":"section-enum"},"ReviewProgressWritable":{"type":"object","description":"Client-writable fields for the reviewProgress state resource. Framework fields (id, section, itemId, createdAt, updatedAt) are added automatically.","properties":{"status":{"type":"string","description":"Caseworker review status for this section.","enum":["not_started","in_progress","complete","flagged"],"default":"not_started"}}},"ReviewProgress":{"type":"object","description":"Generated state resource for reviewProgress.","allOf":[{"$ref":"#/components/schemas/ReviewProgressWritable"},{"type":"object","properties":{"id":{"type":"string","format":"uuid","readOnly":true},"section":{"type":"string","readOnly":true},"itemId":{"type":"string","format":"uuid","nullable":true,"readOnly":true,"x-relationship":{"resource":"Polymorphic"}},"createdAt":{"type":"string","format":"date-time","readOnly":true},"updatedAt":{"type":"string","format":"date-time","readOnly":true}},"required":["id","section","createdAt","updatedAt"]}]},"ReviewProgressListResponse":{"type":"object","description":"Paginated list of reviewProgress state records.","properties":{"items":{"type":"array","items":{"$ref":"#/components/schemas/ReviewProgress"}},"total":{"type":"integer"},"limit":{"type":"integer"},"offset":{"type":"integer"},"hasNext":{"type":"boolean"}},"required":["items","total","limit","offset","hasNext"]},"Document":{"allOf":[{"$ref":"#/components/schemas/DocumentWritable"},{"type":"object","required":["id","lifecycleState","latestVersionId","createdAt","updatedAt"],"properties":{"id":{"type":"string","format":"uuid","readOnly":true},"lifecycleState":{"type":"string","enum":["active","superseded","disposed"],"readOnly":true,"description":"Where this document is in its retention lifecycle."},"legalHold":{"type":"boolean","readOnly":true,"description":"Whether disposition is suspended pending litigation."},"latestVersionId":{"type":"string","format":"uuid","readOnly":true,"description":"The most recent version, which is what describes the file.","x-relationship":{"type":"fk","domain":"document-management","resource":"DocumentVersion","style":"links-only"}},"retentionDeadline":{"type":"string","format":"date-time","nullable":true,"readOnly":true,"description":"When this document becomes eligible for disposition."},"metadata":{"type":"object","additionalProperties":true,"description":"Arbitrary key-value metadata supplied at upload."},"createdAt":{"type":"string","format":"date-time","readOnly":true},"updatedAt":{"type":"string","format":"date-time","readOnly":true},"links":{"type":"object","readOnly":true,"description":"Related resource links.","properties":{"latestVersion":{"type":"string","format":"uri-reference","description":"Link to the related DocumentVersion resource."}}}}}]},"DocumentWritable":{"type":"object","required":["documentTypeId","title"],"properties":{"documentTypeId":{"type":"string","description":"What kind of document this is."},"title":{"type":"string","description":"A human-readable name for the document."},"documentDate":{"type":"string","format":"date","nullable":true,"description":"The date the document itself bears, which is not the date it arrived."}}}}}}},{"relativePath":"domains/intake/intake-rules-examples.yaml","domain":"intake","type":"rules-examples","content":{"$schema":"https://blueprint.codeforamerica.org/schemas/rules-examples-schema.yaml","domain":"intake","rulesets":{"interviewPrompts":{"examples":[{"description":"Income gap and unemployed members — multiple prompts triggered","inputs":{"household":{"monthlyIncome":800,"monthlyExpenses":1200,"members":[{"age":35,"isEmployed":false,"isStudent":false,"isNonCitizen":false},{"age":8,"isEmployed":false,"isStudent":false,"isNonCitizen":false}]},"application":{"hasChangedCircumstances":false}}},{"description":"Non-citizen student with changed circumstances","inputs":{"household":{"monthlyIncome":1500,"monthlyExpenses":1400,"members":[{"age":22,"isEmployed":true,"isStudent":true,"isNonCitizen":true}]},"application":{"hasChangedCircumstances":true}}},{"description":"All members employed — no work requirement prompt","inputs":{"household":{"monthlyIncome":3000,"monthlyExpenses":2500,"members":[{"age":40,"isEmployed":true,"isStudent":false,"isNonCitizen":false},{"age":38,"isEmployed":true,"isStudent":false,"isNonCitizen":false}]},"application":{"hasChangedCircumstances":false}}}]}}}},{"relativePath":"domains/intake/intake-rules-openapi.yaml","domain":"intake","type":"openapi","content":{"openapi":"3.1.0","info":{"title":"Intake rules","version":"1.0.0","description":"Evaluation endpoints for the intake rulesets, generated from their rules document.","x-domain":"intake"},"servers":[{"url":"/intake"}],"paths":{"/applications/evaluate-interview-prompts":{"post":{"summary":"Evaluate interviewPrompts","operationId":"evaluateInterviewPrompts","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/InterviewPromptsRequest"}}}},"responses":{"200":{"description":"interviewPrompts evaluation result.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/InterviewPromptsResponse"}}}},"400":{"$ref":"../../base/components/responses.yaml#/BadRequest"},"500":{"$ref":"../../base/components/responses.yaml#/InternalError"}},"tags":["Applications"],"x-relationship":{"type":"ruleset","domain":"intake","id":"interviewPrompts"}}}},"components":{"schemas":{"InterviewPromptsRequest":{"type":"object","description":"Input data for interviewPrompts evaluation. All fields are optional — partial inputs trigger partial evaluation.","properties":{"household":{"type":"object","description":"Household composition and financial circumstances.","properties":{"monthlyIncome":{"type":"number","description":"Total monthly gross income reported by the household."},"monthlyExpenses":{"type":"number","description":"Total monthly expenses reported by the household."},"members":{"type":"array","description":"All individuals in the household.","items":{"$ref":"./intake-schemas.yaml#/$defs/HouseholdMember"}}}},"application":{"type":"object","description":"Application-level context relevant to the interview.","properties":{"hasChangedCircumstances":{"type":"boolean","description":"Whether the household reported changes since the application was submitted."}}}}},"InterviewPromptsResponse":{"allOf":[{"$ref":"../../base/schemas/rules-evaluation.yaml#/EvaluationResult"}],"description":"Evaluation result for interviewPrompts."}}}}},{"relativePath":"domains/intake/intake-rules.yaml","domain":"intake","type":"rules","content":{"$schema":"https://blueprint.codeforamerica.org/schemas/rules-schema.yaml","domain":"intake","rulesets":{"interviewPrompts":{"endpoint":{"path":"/applications/evaluate-interview-prompts"},"inputs":{"household":{"type":"object","description":"Household composition and financial circumstances.","properties":{"monthlyIncome":{"type":"number","description":"Total monthly gross income reported by the household."},"monthlyExpenses":{"type":"number","description":"Total monthly expenses reported by the household."},"members":{"type":"array","description":"All individuals in the household.","items":{"$ref":"./intake-schemas.yaml#/$defs/HouseholdMember"}}}},"application":{"type":"object","description":"Application-level context relevant to the interview.","properties":{"hasChangedCircumstances":{"type":"boolean","description":"Whether the household reported changes since the application was submitted."}}}},"facts":[{"path":"incomeGapExists","type":"boolean","description":"Monthly income is less than monthly expenses — an inconsistency that requires probing for other income sources or assistance (FNS-1104).\n","expression":"household.monthlyIncome \u003c household.monthlyExpenses"},{"path":"workEligibleMembers","description":"Members aged 16–59 who are not employed and may be subject to work requirement screening (7 CFR § 273.7).\n","expression":"household.members.filter(m, m.age >= 16 && m.age \u003c= 54 && !m.isEmployed)"},{"path":"hasUnemployedWorkEligible","type":"boolean","description":"At least one member aged 16–59 is not employed.","expression":"household.members.exists(m, m.age >= 16 && m.age \u003c= 59 && !m.isEmployed)"},{"path":"hasStudentMembers","type":"boolean","description":"At least one household member is enrolled in higher education.","expression":"household.members.exists(m, m.isStudent)"},{"path":"hasNonCitizenMembers","type":"boolean","description":"At least one household member is a non-citizen.","expression":"household.members.exists(m, m.isNonCitizen)"},{"path":"allMembersEmployed","type":"boolean","description":"Every household member is currently employed.","expression":"household.members.all(m, m.isEmployed)"},{"path":"incomeInconsistencyPrompt","type":"boolean","description":"Prompt the household for unexplained income sources or assistance that account for the gap between income and expenses.\n","expression":"incomeGapExists"},{"path":"workRequirementPrompt","type":"boolean","description":"Screen non-employed members aged 16–59 for work requirement exemptions (physical/mental fitness, caregiving, education, etc.).\n","expression":"hasUnemployedWorkEligible"},{"path":"studentEligibilityPrompt","type":"boolean","description":"Screen student members for SNAP student eligibility exceptions (employment, dependent care, work-study, etc.).\n","expression":"hasStudentMembers"},{"path":"immigrationStatusPrompt","type":"boolean","description":"Screen non-citizen members for immigration status and apply sponsor income deeming rules where applicable.\n","expression":"hasNonCitizenMembers"},{"path":"changeVerificationPrompt","type":"boolean","description":"Identify and verify changes in household circumstances that occurred between the application date and the interview date.\n","expression":"application.hasChangedCircumstances"}],"outputs":{"incomeInconsistencyPrompt":{"type":"boolean"},"workEligibleMembers":{"type":"array"},"workRequirementPrompt":{"type":"boolean"},"studentEligibilityPrompt":{"type":"boolean"},"immigrationStatusPrompt":{"type":"boolean"},"changeVerificationPrompt":{"type":"boolean"},"allMembersEmployed":{"type":"boolean"}}}}}},{"relativePath":"domains/intake/intake-schemas.yaml","domain":null,"type":"components","content":{"$defs":{"HouseholdMember":{"type":"object","description":"A person in the household, as the interview rules read them. Shared so a ruleset can reference it rather than restating the shape — the compiler follows the $ref down to individual field paths, which is what keeps missing-input tracking per-field rather than per-object.\n","properties":{"age":{"type":"integer","description":"Member's age in years."},"isEmployed":{"type":"boolean","description":"Whether the member is currently employed."},"isStudent":{"type":"boolean","description":"Whether the member is enrolled at least half-time in higher education."},"isNonCitizen":{"type":"boolean","description":"Whether the member is a non-citizen subject to immigration screening."}}},"IncomeSource":{"description":"Income reported by a household member. Type discriminator determines the variant.","oneOf":[{"$ref":"#/$defs/EmploymentIncome"},{"$ref":"#/$defs/SelfEmploymentIncome"},{"$ref":"#/$defs/BenefitIncome"}],"discriminator":{"propertyName":"type","mapping":{"employment":"#/$defs/EmploymentIncome","self_employment":"#/$defs/SelfEmploymentIncome","benefit":"#/$defs/BenefitIncome"}}},"EmploymentIncome":{"type":"object","description":"Income from wages or salary employment.","required":["type","employer","monthlyGrossIncome"],"properties":{"type":{"type":"string","const":"employment"},"employer":{"type":"string","description":"Name of the employer."},"monthlyGrossIncome":{"type":"number","minimum":0,"description":"Monthly gross income before deductions (dollars)."}}},"SelfEmploymentIncome":{"type":"object","description":"Income from self-employment or a sole proprietorship.","required":["type","businessType","monthlyNetIncome"],"properties":{"type":{"type":"string","const":"self_employment"},"businessType":{"type":"string","description":"Type of business (e.g., sole proprietor, freelance)."},"monthlyNetIncome":{"type":"number","minimum":0,"description":"Monthly net income after business expenses (dollars)."}}},"BenefitIncome":{"type":"object","description":"Income from a government benefit program.","required":["type","benefitType","monthlyAmount"],"properties":{"type":{"type":"string","const":"benefit"},"benefitType":{"type":"string","enum":["ssi","ssdi","unemployment","veterans","other"],"description":"The benefit program providing income."},"monthlyAmount":{"type":"number","minimum":0,"description":"Monthly benefit amount (dollars)."}}}}}},{"relativePath":"domains/intake/intake-sla-types.yaml","domain":"intake","type":"sla-types","content":{"$schema":"sla-types-schema.yaml","version":"1.0","domain":"intake","slaTypes":[{"id":"snap_standard","name":"SNAP Standard Processing","duration":{"amount":30,"unit":"days"},"warningThresholdPercent":80,"pauseWhen":{"in":[{"var":"status"},["withdrawn"]]}},{"id":"medicaid_standard","name":"Medicaid Standard Processing","duration":{"amount":45,"unit":"days"},"warningThresholdPercent":80,"pauseWhen":{"in":[{"var":"status"},["withdrawn"]]}}]}},{"relativePath":"domains/intake/intake-state-machine.yaml","domain":"intake","type":"state-machine","content":{"$schema":"state-machine-schema.yaml","extends":"../platform/platform-state-machine.yaml","version":"1.0","domain":"intake","eventsSpec":"intake-asyncapi.yaml","machines":[{"object":"Application","states":[{"id":"draft","slaClock":"stopped","description":"Created but not yet filed; regulatory clock has not started."},{"id":"submitted","slaClock":"running","description":"Formally filed; regulatory clock starts (7 CFR § 273.2(g))."},{"id":"under_review","slaClock":"running","description":"Caseworker is actively reviewing; clock running toward processing deadline."},{"id":"withdrawn","slaClock":"stopped","description":"Household withdrew the application. Terminal."},{"id":"closed","slaClock":"stopped","description":"Intake complete; case opened if approved. Terminal."}],"initialState":"draft","timers":[{"id":"review_reminder","description":"Fires when an application has been awaiting caseworker review for too long. The callback event (intake.review_reminder) triggers an escalation notice.\n"}],"actions":[{"id":"submit","description":"Formally submits a draft application, starting the regulatory processing clock.","transition":{"from":"draft","to":"submitted"},"steps":[{"set":{"field":"submittedAt","value":"$now","description":"Record the submission timestamp (regulatory clock start)."}},{"emit":{"type":"intake.application.submitted","subject":"$object.id","data":{"id":"$object.id","programsAppliedFor":"$object.programsAppliedFor"},"description":"Triggers eligibility screening, caseworker task creation, and confirmation notice."}},{"call":"requestTimer","with":{"timerId":"review_reminder","fireAfter":{"amount":72,"unit":"hours"},"callback":{"event":"intake.review_reminder"}},"description":"Escalate if no caseworker has opened this application in 72 hours."}]},{"id":"open","description":"Moves a submitted application into active caseworker review.","transition":{"from":"submitted","to":"under_review"},"steps":[{"set":{"field":"openedAt","value":"$now","description":"Record when caseworker began review, marking the start of active processing."}}]},{"id":"close","description":"Closes the application once intake processing is complete.","schema":{"request":{"$ref":"#/$defs/CloseRequest"}},"transition":{"from":"under_review","to":"closed"},"steps":[{"emit":{"type":"intake.application.closed"}}]},{"id":"withdraw","description":"Withdraws the application at the household's request.","transition":{"from":["draft","submitted","under_review"],"to":"withdrawn"},"guards":[{"actors":["applicant","case_worker"]}],"steps":[{"emit":{"type":"intake.application.withdrawn"}}]}],"events":[{"type":"intake.review_reminder","description":"Escalates an application that has been awaiting caseworker review for too long. Fired by the scheduling service when the review_reminder timer expires.\n","transition":{"from":"submitted"},"steps":[{"emit":{"type":"intake.application.review-reminder","description":"Notify supervisors that this application needs immediate attention."}}]}]}],"$defs":{"CloseRequest":{"type":"object","required":["outcome"],"properties":{"outcome":{"type":"string","enum":["approved","denied"],"description":"Whether the application was approved or denied at close."},"notes":{"type":"string","description":"Optional caseworker notes on the closure decision."}}}}}},{"relativePath":"domains/platform/platform-registry-patterns.yaml","domain":"platform","type":"registry","content":{"$schema":"registry-schema.yaml","version":"1.0","domain":"platform","type":"patterns","entries":{"oneof-discriminator":{"description":"Inline oneOf with a discriminator property, where all variants are defined within the same file (not via external $ref). Exercises discriminated union rendering, discriminator label resolution, and variant expansion in the explorer.\n"},"anyof":{"description":"anyOf composition — a field that may satisfy more than one schema simultaneously (e.g., a record with both electronic and manual verification on file). Exercises anyOf rendering and the semantic distinction from oneOf.\n"},"additional-properties-map":{"description":"Map type using additionalProperties to allow arbitrary key-value pairs (e.g., labels or metadata). Exercises additionalProperties rendering in the explorer and map validation in the schema validator.\n"},"read-only-field":{"description":"Field marked readOnly: true — server-generated and never accepted in write operations. Common for IDs, computed values, and lifecycle timestamps. Exercises readOnly rendering in the explorer and write-operation filtering.\n"},"deprecated-field":{"description":"Field marked deprecated: true with a migration note pointing to its replacement. Exercises deprecated field rendering in the explorer and tooling warnings.\n"},"string-format":{"description":"String field with a format constraint (uuid, date-time, date, email, etc.). Exercises format rendering in the explorer and format validation.\n"},"polymorphic-base":{"description":"Base schema extended via allOf in Create and Update variants. The Create variant adds required fields; the Update variant applies minProperties: 1 for partial updates. Exercises allOf merging and the Create/Update schema pattern.\n"},"array-of-enum":{"description":"Array of enum values. Exercises array-of-enum rendering in the explorer and array item validation in the schema validator.\n"},"x-enum-source":{"description":"Enum values resolved at build time from an external source (e.g., a state machine's state IDs) via the x-enum-source extension, rather than hardcoded in the OpenAPI spec. Exercises the resolver's x-enum-source injection.\n"},"nullable-state-gated-field":{"description":"Nullable field that is only present after a lifecycle transition (e.g., a timestamp set when an application is submitted). Exercises nullable field rendering and the pattern of state-gated fields.\n"},"nullable-conditional-field":{"description":"Nullable field whose presence depends on another field's value (e.g., a benefit amount present only when eligible is true). Exercises nullable field handling and conditional presence patterns.\n"},"external-ref-shared-defs":{"description":"External $ref to a shared $defs schema in a separate file. Exercises the resolver's cross-file $ref resolution and the explorer's external schema name rendering.\n"},"external-ref-defs-oneof":{"description":"External $ref to a $defs schema that is itself a oneOf with a discriminator. Exercises: (1) cross-file $ref resolution, (2) discriminated union rendering with labeled variants, (3) field inventory handling of oneOf inside an external $defs ref.\n"},"allof-inline-required":{"description":"allOf composition that adds inline required fields without duplicating properties (e.g., a Create variant that adds a required field to a base schema). Exercises the resolver's allOf merging and the explorer's allOf rendering.\n"},"paginated-list":{"description":"Collection endpoint returning items/total/limit/offset/hasNext. The standard blueprint pagination envelope. Exercises paginated list rendering and parameter validation (limit, offset, sort, search).\n"},"sub-resource":{"description":"Resource nested under a parent at a path like /parents/{id}/children. Full CRUD scoped to the parent. Exercises nested routing, parent FK validation, and sub-resource list/detail rendering in the explorer.\n"},"singleton-sub-resource":{"description":"Single resource nested under a parent at a path like /parents/{id}/summary, with no item-level ID. Accessed only through the parent. Exercises singleton sub-resource routing and composition rendering.\n"},"intra-domain-fk":{"description":"Intra-domain x-relationship foreign key linking a sub-resource back to its parent resource within the same domain. Exercises cross-reference rendering in the explorer and FK validation.\n"},"cross-domain-fk":{"description":"Cross-domain x-relationship foreign key linking a resource in one domain to a resource in another. Exercises cross-domain reference rendering and FK validation across domain boundaries.\n"},"rpc-state-machine-action":{"description":"RPC-style state machine action with a generated POST endpoint. Exercises the RPC overlay generator, x-relationship tagging, and state machine → API cross-linking in the explorer.\n"},"state-machine-guard":{"description":"Named boolean condition (CEL expression) attached to a state machine action. The action can only be triggered when all guard conditions pass. Exercises guard evaluation, actor role checking, and guard composition (any/all).\n"},"state-machine-timer":{"description":"Timer declaration on a state machine. The scheduling service emits a callback event ({domain}.{id}) when the timer fires; the machine subscribes to react. Exercises timer declaration rendering and the timer → event subscription link.\n"},"state-machine-subscription":{"description":"State machine subscribing to a domain event emitted by a different domain. The handler runs steps (create, emit, call) automatically when the event arrives. Exercises cross-domain event subscription and handler rendering.\n"},"state-machine-event":{"description":"Domain event emitted on a state machine transition. Exercises AsyncAPI event catalog generation and event → state machine cross-linking.\n"},"cross-domain-event":{"description":"Domain event consumed by downstream domains outside the emitting domain. Exercises event catalog cross-domain consumer rendering.\n"},"composition":{"description":"Read-only singleton resource assembled from fields across multiple resources, generated from a compositions contract. Produces a GET endpoint nested under the parent resource (e.g. /applications/{id}/summary). Exercises the composition generator, x-relationship injection, and singleton rendering in the explorer.\n"},"overlay":{"description":"Field or element added or modified by an adopter overlay. Overlays add state-required fields, tighten enums, and set global configuration (x-casing, x-pagination, x-search, x-relationship, x-event-type-prefix). Exercises the overlay resolver and adopter-level customization patterns.\n"},"ruleset-output-fact":{"description":"Output fact from a ruleset — a fact declared in the outputs list and returned by the REST endpoint. Exercises the rules engine → API endpoint link in the explorer (Rules badge).\n"},"ruleset-intermediate-fact":{"description":"Intermediate fact used internally by other facts but not returned by the REST endpoint. Exercises fact graph dependency rendering in the rules-docs visualizer.\n"},"array-of-oneof":{"description":"Array whose items are a oneOf discriminated union (e.g., EvaluationResult returning EvaluationFact variants). Exercises array-of-oneOf rendering, discriminator label resolution, and schema variant expansion.\n"}}}},{"relativePath":"domains/platform/platform-registry-policies.yaml","domain":"platform","type":"registry","content":{"$schema":"registry-schema.yaml","version":"1.0.0","domain":"platform","type":"policies","entries":{"snap-application-acceptance":{"citation":"7 CFR § 273.2(c)","description":"SNAP application acceptance requirements — agencies must accept applications on the day of initial contact and must not discourage or delay submission.\n"},"snap-right-to-apply":{"citation":"7 CFR § 273.2(a)","description":"SNAP right-to-apply — any household wishing to participate must be allowed to file an application, and the filing date establishes the benefit month.\n"},"snap-processing-clock":{"citation":"7 CFR § 273.2(g)","description":"SNAP application processing standards — 30-day processing clock from date of filing; expedited service within 7 days for qualifying households.\n"},"medicaid-processing-clock":{"citation":"42 CFR § 435.912","description":"Medicaid application processing standards — 45-day processing clock for most applicants; 90 days for disability-based applicants.\n"},"snap-notice-of-action":{"citation":"7 CFR § 273.13","description":"SNAP notice of <script type="module">
const { createMockServer, extract, generate } =
  globalThis.BlueprintMock ?? await import('./mock.js');

const $ = (id) => document.getElementById(id);
const el = (tag, text = '', className = '') => {
  const node = document.createElement(tag);
  if (text !== '') node.textContent = text;
  if (className) node.className = className;
  return node;
};

/** Everything below the directory this page is served from. */
const basePath = location.pathname.replace(/\/[^/]*$/, '');

/** Where this checkout's contracts are browsable, if the build knew. */
const pageConfig = (() => {
  const tag = document.getElementById('page-config');
  try { return tag ? JSON.parse(tag.textContent) : {}; } catch { return {}; }
})();

let docs;          // every document in the set
let mock;          // the server derived from them
let seeded = true; // whether the last derive loaded the shipped records
let showAll = false;  // the walk-through, or the whole reference
const done = new Set(); // steps of the walk already run, by method and path
const made = new Map();  // collection → the id the walk created there
const built = new Map(); // schema name → the id the walk created of that shape
const answers = new Map(); // step → what it answered, so going back shows it
let selected = null;
// The reference's domain groups the reader has opened. The navigation is
// rebuilt on every click, and rebuilding from scratch used to collapse every
// group but the first — so picking an operation closed the one you were in.
let openDomains = null;
// What the reader picked for each path parameter, by operation and name, so a
// panel redrawn after a pick keeps it — and the parameters after it list the
// records under what was picked.
const chosen = new Map();
let transcript = false; // the whole walk at once, rather than a step at a time
let ran = 0;            // how long running it that way took
let ranCount = 0;       // how many of the steps that run actually sent

/**
 * The contract set, inlined by the single-file build or fetched beside the
 * page when it is served.
 */
const loadContracts = async () => {
  const inlined = document.getElementById('contracts-data');
  if (inlined) return JSON.parse(inlined.textContent);
  const response = await fetch('./contracts.json');
  if (!response.ok) throw new Error(`contracts.json: ${response.status}`);
  return response.json();
};

// Who the reference calls as, chosen above each request. The walk always
// calls as itself, so a choice made while exploring cannot break a step.
const WALK_CALLER = 'the-explorer';
const caller = { id: WALK_CALLER, type: 'user', roles: [] };

/**
 * The caller headers a request carries.
 *
 * The mock reads the kind of actor from the roles, so a kind other than
 * `user` goes in as one; an unauthenticated caller sends no identity at all.
 * A real deployment takes all of this from the sign-in token instead.
 */
const callerHeaders = () => {
  if (!showAll) return { 'X-Caller-Id': WALK_CALLER };
  const id = caller.id.trim();
  if (caller.type === 'unauthenticated' || !id) return {};
  const roles = caller.roles.filter((role) => role !== caller.type);
  if (caller.type !== 'user') roles.unshift(caller.type);
  return { 'X-Caller-Id': id, ...(roles.length ? { 'X-Caller-Roles': roles.join(',') } : {}) };
};

/** The kinds of actor an event can record, as the events contract lists them. */
const actorTypes = () => {
  const schema = docs.find((doc) => doc.type === 'schema' && doc.content?.$defs?.Event);
  const parts = schema?.content.$defs.Event.allOf ?? [];
  const authtype = parts.map((part) => part.properties?.authtype).find(Boolean);
  return (authtype?.enum ?? ['user']).filter((value) => value !== null);
};

/**
 * The roles a caller can hold: the set's RoleType, which its guards are
 * validated against. Empty when the set declares none.
 */
const roleTypes = () => {
  const schema = docs.find((doc) => Array.isArray(doc.content?.$defs?.RoleType?.enum));
  return schema?.content.$defs.RoleType.enum ?? [];
};

/**
 * Whether an operation takes an Idempotency-Key header — the shared
 * IdempotencyKeyParam, which an operation lists to require one per create.
 */
const takesIdempotencyKey = (op) => (op.operation?.parameters ?? [])
  .map((parameter) => deref(parameter, op.doc))
  .some((p) => p?.in === 'header' && typeof p.name === 'string' && p.name.toLowerCase() === 'idempotency-key');

/** The headers a step sends besides the caller's: a fresh key, where the operation takes one. */
const keyHeaders = (op, key = crypto.randomUUID()) =>
  takesIdempotencyKey(op) ? { 'Idempotency-Key': key } : {};

/**
 * The Idempotency-Key row: a fresh key each time the panel opens, which the
 * reader can type over — `12345` twice is how to see a retry answered with
 * the same entry, and `12345` with a different body how to see it refused.
 */
const idempotencyRow = () => {
  const row = el('div', '', 'caller');
  const box = el('input', '', 'caller-id');
  box.type = 'text';
  box.value = crypto.randomUUID();
  box.setAttribute('aria-label', 'Idempotency-Key');
  row.append(document.createTextNode('Idempotency-Key'), box);
  return { row, value: () => box.value.trim() };
};

/** The "Calling as" row: an id, a kind of actor, and roles. */
const callerRow = () => {
  const row = el('div', '', 'caller');
  const id = el('input', '', 'caller-id');
  id.type = 'text';
  id.value = caller.id;
  id.setAttribute('aria-label', 'Caller id');
  id.oninput = () => { caller.id = id.value; };

  const type = el('select', '', 'caller-type');
  type.setAttribute('aria-label', 'Caller type');
  type.append(...actorTypes().map((kind) => el('option', kind)));
  type.value = caller.type;
  id.disabled = caller.type === 'unauthenticated';
  type.onchange = () => { caller.type = type.value; id.disabled = type.value === 'unauthenticated'; };

  // A dropdown of the declared roles, any number checked; a box to type them
  // into for a set that declares none.
  let roles;
  const declared = roleTypes();
  if (declared.length > 0) {
    roles = el('details', '', 'caller-roles');
    const summary = el('summary');
    const label = () => { summary.textContent = caller.roles.length ? caller.roles.join(', ') : 'no roles'; };
    roles.append(summary);
    const list = el('div', '', 'menu');
    for (const role of declared) {
      const option = el('label');
      const box = el('input');
      box.type = 'checkbox';
      box.checked = caller.roles.includes(role);
      box.onchange = () => {
        caller.roles = declared.filter((name) => name === role ? box.checked : caller.roles.includes(name));
        label();
      };
      option.append(box, document.createTextNode(role));
      list.append(option);
    }
    roles.append(list);
    label();
  } else {
    roles = el('input', '', 'caller-roles');
    roles.type = 'text';
    roles.value = caller.roles.join(', ');
    roles.placeholder = 'roles, comma-separated';
    roles.oninput = () => { caller.roles = roles.value.split(',').map((role) => role.trim()).filter(Boolean); };
  }
  roles.setAttribute('aria-label', 'Caller roles');

  row.append(document.createTextNode('Calling as'), id, type, roles);
  return row;
};

const call = async (method, path, body, headers = {}) => {
  const init = { method, headers: { ...callerHeaders(), ...headers } };
  if (body instanceof FormData) {
    init.body = body;
  } else if (body !== undefined) {
    init.headers['content-type'] = 'application/json';
    init.body = typeof body === 'string' ? body : JSON.stringify(body);
  }
  const response = await mock.fetch(new Request(new URL(basePath + path, location.origin), init));
  const text = await response.text();
  let parsed;
  try { parsed = JSON.parse(text); } catch { parsed = text; }
  return { status: response.status, statusText: response.statusText, body: parsed };
};

// ── Reading the contracts ───────────────────────────────────────────────────

const openapiDocs = () => docs.filter((doc) => doc.type === 'openapi');

/** The server prefix an OpenAPI document's paths hang off. */
const prefixOf = (doc) => {
  const [server] = doc.content?.servers ?? [];
  if (!server?.url) return '';
  try { return new URL(server.url).pathname.replace(/\/$/, ''); } catch { return server.url; }
};

/**
 * Every operation the loaded documents declare, with where it came from.
 *
 * Read off the documents rather than the server's route table: the table
 * registers four extra methods on a read-only projection purely so they can
 * answer 405, and offering those is offering four ways to be told no.
 */
const operations = () => {
  const found = [];
  for (const doc of openapiDocs()) {
    const prefix = prefixOf(doc);
    for (const [declared, item] of Object.entries(doc.content?.paths ?? {})) {
      for (const [method, operation] of Object.entries(item ?? {})) {
        if (!/^(get|post|put|patch|delete)$/.test(method)) continue;
        found.push({
          method: method.toUpperCase(),
          path: prefix + declared,
          template: declared,
          operation,
          doc,
          domain: doc.domain ?? doc.content?.info?.['x-domain'] ?? 'other',
          summary: operation.summary ?? operation.operationId ?? `${method.toUpperCase()} ${declared}`,
        });
      }
    }
  }
  return found;
};

/** The state machine actions the loaded documents declare, by endpoint path. */
const actions = () => {
  const byPath = new Map();
  for (const doc of docs.filter((d) => d.type === 'state-machine')) {
    for (const machine of doc.content?.machines ?? []) {
      for (const action of machine.actions ?? []) {
        const from = action.transition?.from;
        byPath.set(action.id, {
          id: action.id,
          object: machine.object,
          from: Array.isArray(from) ? from : String(from ?? '').split(',').map((s) => s.trim()),
          to: action.transition?.to,
          // What the move does on the way through, which is how one
          // transition differs from the next. Without these every move in a
          // lifecycle has the same thing said about it.
          steps: action.steps ?? [],
          doc: doc.relativePath,
        });
      }
    }
  }
  return byPath;
};

/**
 * The paths every declared composition owns, including the ones it generates
 * beneath itself — section panels and the per-section review state.
 *
 * Without this they classify as ordinary item routes, and nineteen of them
 * pile into Resources, which is both wrong and the exact overwhelm this page
 * is supposed to avoid.
 */
const compositionPaths = () => {
  const owned = new Map();
  for (const doc of docs.filter((d) => d.type === 'compositions')) {
    for (const [name, declared] of Object.entries(doc.content?.compositions ?? {})) {
      const base = declared.endpoint?.path;
      if (!base) continue;
      owned.set(base, { name, doc: doc.relativePath });
      // A sectioned composition serves a panel per section and a progress
      // resource alongside it; both hang off the same declared path.
      for (const suffix of ['/{section}', '/{section}/{itemId}']) {
        owned.set(base + suffix, { name, doc: doc.relativePath });
      }
      const progress = base.replace(/\/[^/]+$/, '/review-progress');
      for (const suffix of ['/{section}', '/{section}/{itemId}']) {
        owned.set(progress + suffix, { name, doc: doc.relativePath });
      }
      for (const section of Object.keys(declared.sections ?? {})) {
        owned.set(`${base}/${section}`, { name, doc: doc.relativePath });
      }
    }
  }
  return owned;
};

/** The rulesets the loaded documents declare, and the examples for each. */
const rulesets = () => {
  const examples = new Map();
  for (const doc of docs.filter((d) => d.type === 'rules-examples')) {
    for (const [name, declared] of Object.entries(doc.content?.rulesets ?? {})) {
      examples.set(name, declared.examples ?? []);
    }
  }
  const found = [];
  for (const doc of docs.filter((d) => d.type === 'rules')) {
    for (const [name, declared] of Object.entries(doc.content?.rulesets ?? {})) {
      found.push({ name, ruleset: declared, doc: doc.relativePath, examples: examples.get(name) ?? [] });
    }
  }
  return found;
};

/**
 * What kind of thing an operation is.
 *
 * The affordance a reader needs differs completely between these, and the
 * contracts are what say which is which — a transition is only a transition
 * because a state machine declares an action whose endpoint this is.
 */
const classify = (op) => {
  const last = op.template.split('/').filter(Boolean).pop() ?? '';
  const act = actions().get(last);
  if (op.method === 'POST' && act) return { kind: 'transition', action: act };
  if (op.method === 'POST' && /\/evaluate-/.test(op.template)) {
    const name = last.replace(/^evaluate-/, '');
    const found = rulesets().find((r) => r.name.toLowerCase() === name.replace(/-/g, '').toLowerCase());
    return { kind: 'rules', ruleset: found ?? rulesets()[0] ?? null };
  }
  const composed = compositionPaths().get(op.template);
  if (composed) return { kind: 'composition', composition: composed };
  if (op.operation.requestBody?.content?.['multipart/form-data']) return { kind: 'upload' };
  if (/\/stream$/.test(op.template)) return { kind: 'stream' };
  if (op.template.includes('{')) return { kind: 'item' };
  return { kind: op.method === 'POST' ? 'create' : 'collection' };
};

// ── Example bodies ──────────────────────────────────────────────────────────

/** The schema an operation's JSON request body points at, dereferenced. */
const requestSchema = (op) => {
  const schema = op.operation.requestBody?.content?.['application/json']?.schema;
  return schema ? deref(schema, op.doc) : null;
};

/** A relative path, from the document at `from`: dirname, then each segment, with `..` going up. */
const resolveRelative = (from, relative) => {
  const parts = from.split('/').slice(0, -1);
  for (const segment of relative.split('/')) {
    if (segment === '..') parts.pop();
    else if (segment !== '.' && segment !== '') parts.push(segment);
  }
  return parts.join('/');
};

const deref = (node, doc, seen = 0) => {
  if (!node || typeof node !== 'object' || seen > 8) return node;
  if (typeof node.$ref !== 'string') return node;

  const [file, fragment = ''] = node.$ref.split('#');
  // Same document.
  if (file === '') {
    const target = fragment.replace(/^\//, '').split('/').reduce((at, key) => at?.[key], doc.content);
    return deref(target, doc, seen + 1);
  }

  // Another one. A relative reference resolves against the document it is
  // written in — `../../components/parameters.yaml` from
  // base/domains/transcription/ is base/components/parameters.yaml. One written
  // as a URL is matched on its tail, since the set is keyed by relative path.
  const relative = !/^[a-z]+:/i.test(file) && doc.relativePath
    ? resolveRelative(doc.relativePath, file)
    : null;
  const wanted = file.replace(/^.*?([^/]+\/[^/]+\/[^/]+)$/, '$1');
  const other = docs.find((candidate) => candidate.relativePath
    && (candidate.relativePath === relative
      || (!relative && (candidate.relativePath === wanted || candidate.relativePath.endsWith(wanted)))));
  if (!other) return node;
  const target = fragment
    ? fragment.replace(/^\//, '').split('/').reduce((at, key) => at?.[key], other.content)
    : other.content;
  return deref(target, other, seen + 1);
};

/**
 * A body worth pressing Execute on.
 *
 * In descending order of how much a reader learns from it: a record the
 * contract set already ships as mock data, with the server's own fields
 * stripped; then the schema's declared example; then something built from
 * the schema, which at least gets the enums right. Typing a correct body
 * from scratch is the thing that makes an unfamiliar API exhausting.
 */
const exampleBody = (op) => {
  // An edit worth watching: add to the list a derived field counts, so the
  // count moves on the next read. A `PATCH` that changes nothing visible
  // teaches nothing.
  if (op.kind === 'edit') {
    const counted = countedArray(op);
    if (counted) return attaching(op, { [counted.field]: counted.allowed.slice(0, 2) });
  }

  // A ruleset's inputs are nested and nobody can type them from memory. The
  // contract set ships described examples for exactly this reason.
  if (op.kind === 'rules') {
    const [first] = op.ruleset?.examples ?? [];
    if (first?.inputs) return first.inputs;
    const inputs = op.ruleset?.ruleset?.inputs ?? {};
    return Object.fromEntries(
      Object.entries(inputs).map(([name, declared]) => [name, fromSchema(declared, op.doc)])
    );
  }

  const schema = requestSchema(op);
  if (!schema) return null;

  const managed = new Set(['id', 'createdAt', 'updatedAt', 'status', '_links']);
  const writable = new Set(Object.keys(collectProperties(schema, op.doc)));

  for (const data of docs.filter((d) => d.type === 'mock-data' && d.domain === op.doc.domain)) {
    for (const record of Object.values(data.content ?? {})) {
      if (!record || typeof record !== 'object') continue;
      const body = Object.fromEntries(
        Object.entries(record).filter(([key]) => writable.has(key) && !managed.has(key))
      );
      if (Object.keys(body).length > 0) return attaching(op, body);
    }
  }

  if (op.operation.requestBody?.content?.['application/json']?.example) {
    return op.operation.requestBody.content['application/json'].example;
  }
  return attaching(op, fromSchema(schema, op.doc));
};

/**
 * Fill in a foreign key the walk can already satisfy.
 *
 * A field the contract says points at something, where the walk has made
 * one of those: send its id. This is what makes a relationship visible
 * rather than described — the request carries the id of the document
 * uploaded a step ago, and the record comes back with the document in it.
 */
const attaching = (op, body) => {
  const schema = requestSchema(op);
  if (!schema) return body;
  for (const [name, property] of Object.entries(collectProperties(schema, op.doc))) {
    const relationship = property['x-relationship'];
    if (relationship?.type !== 'fk') continue;
    const id = built.get(relationship.resource);
    if (id) body[name] = id;
  }
  return body;
};

/**
 * The parts of a body that is not JSON.
 *
