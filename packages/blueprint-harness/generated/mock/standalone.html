<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not your average Mock Server</title>
<!--
  A playground over the browser mock, rather than a tour of it.

  The page is generated from the contracts twice over: the server is, and so
  is this. Which operations exist, what kind of thing each one is, what a
  sensible body looks like, which records you can act on and which moves are
  legal from where they are — every one of those comes out of the contract
  set, which is why this can do things a generic API client cannot. Postman
  hands you a box and wishes you luck.

  Operations are grouped in dependency order, and the order is real rather
  than pedagogical: a composition needs a record to project, a transition
  needs a record already in a particular state. Resources first is not a
  teaching conceit, it is what has to happen.
-->
<style>
  :root {
    --ink: #1a1a1a; --muted: #555; --faint: #888; --line: #e2e2e2;
    --bg: #fafafa; --card: #fff; --accent: #2b6cb0; --ok: #2f7a3f; --bad: #b02b2b;
    --warm: #8a6d3b;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  /* Any `display` on a rule beats the user agent's `[hidden] { display: none }`,
     so an element given a layout and then hidden in script stays on screen.
     That has now produced two bugs — an empty bordered box, and a Next button
     offering to skip a step nobody had run. Settled here instead of per rule. */
  [hidden] { display: none !important; }
  body {
    margin: 0; padding: 0 0 5rem; background: var(--bg); color: var(--ink);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  h1 { font-size: 1.4rem; margin: 0; }
  code { font-family: var(--mono); font-size: .88em; }

  #masthead {
    max-width: 86rem; margin: 0 auto; padding: 1.6rem 1.2rem 1.1rem;
    border-bottom: 1px solid var(--line);
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2rem; align-items: start;
  }
  /* Two cells, not four rows: as separate rows the left-hand items were
     stretched to match whichever side was taller, which put a hand's width
     of nothing between the title and the text under it. */
  #masthead .intro { min-width: 0; }
  #derived {
    align-self: start;
    border: 1px solid var(--line); border-radius: 6px; background: var(--card);
    padding: .6rem .8rem; min-width: 17rem;
  }
  #derived .when {
    margin: .45rem 0 0; padding-top: .4rem; border-top: 1px solid var(--line);
    font-size: .66rem; letter-spacing: .04em; text-transform: uppercase;
    color: var(--faint); font-weight: 700;
  }
  #derived .stat {
    display: flex; gap: .4rem; align-items: baseline;
    font-size: .75rem; color: var(--muted); line-height: 1.45;
  }
  #derived .stat .n {
    font-family: var(--mono); min-width: 1.4rem; text-align: right; color: var(--ink);
  }
  #derived .stat.lead { font-size: .92rem; color: var(--ink); font-weight: 600; line-height: 1.3; }
  #derived .stat.lead .n { color: var(--accent); min-width: 1.9rem; }
  #derived .breakdown {
    display: grid; grid-template-columns: 1fr 1fr; column-gap: .9rem;
    margin-top: .45rem; padding-top: .4rem; border-top: 1px solid var(--line);
  }
  #derived .headline { margin-top: 0; padding-top: 0; border-top: 0; }
  @media (max-width: 60rem) {
    #masthead { grid-template-columns: 1fr; }
    #derived { grid-column: 1; grid-row: auto; }
  }
  .lede { color: var(--muted); margin: .4rem 0 0; max-width: 44rem; font-size: .95rem; }

  /* Throwing the whole thing away and deriving it again, which is the
     headline claim and takes about as long as a keystroke. */
  #controls { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; margin: .9rem 0 0; }
  #controls .sep { border-left: 1px solid var(--line); height: 1.4rem; margin: 0 .2rem; }
  #controls button:not(.primary) {
    font: inherit; font-size: .85rem; cursor: pointer; padding: .4rem 1rem;
    border-radius: 4px; border: 1px solid var(--line); background: var(--card); color: var(--ink);
  }
  #controls button:disabled { opacity: .4; cursor: not-allowed; }
  /* Who the reference calls as. Every request carries it, the way a real
     client's sign-in would, and the events it causes record it. */
  .caller { display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; margin: 0 0 .6rem; font-size: .85rem; color: var(--muted); }
  .caller input, .caller select { width: auto; }
  .caller .caller-id { width: 9rem; }
  .caller input.caller-roles { width: 15rem; }
  details.caller-roles { position: relative; }
  details.caller-roles summary {
    cursor: pointer; font-family: var(--mono); font-size: .8rem; padding: .4rem .5rem; min-width: 12rem;
    border: 1px solid var(--line); border-radius: 4px; background: #fcfcfc; color: var(--ink);
  }
  details.caller-roles .menu {
    position: absolute; z-index: 5; margin-top: .2rem; padding: .3rem .5rem; min-width: 100%;
    border: 1px solid var(--line); border-radius: 4px; background: var(--card); box-shadow: 0 2px 8px rgba(0,0,0,.08);
  }
  details.caller-roles .menu label { display: flex; gap: .4rem; align-items: center; padding: .15rem 0; font-family: var(--mono); font-size: .8rem; color: var(--ink); white-space: nowrap; }
  details.caller-roles .menu input { width: auto; }
  .caller .caller-id:disabled { opacity: .4; }


  #shell {
    display: grid; grid-template-columns: 17rem minmax(0, 1fr);
    gap: 2rem; max-width: 86rem; margin: 1.4rem auto 0; padding: 0 1.2rem;
  }
  #groups {
    position: sticky; top: 1rem; align-self: start;
    max-height: calc(100vh - 2rem); overflow: auto;
    border-right: 1px solid var(--line); padding-right: .8rem;
  }
  .group > summary {
    cursor: pointer; list-style: none; padding: .45rem .3rem;
    font-size: .76rem; letter-spacing: .06em; text-transform: uppercase;
    font-weight: 700; color: var(--ink);
  }
  .group > summary::-webkit-details-marker { display: none; }
  .group > summary::before { content: '▸ '; color: var(--faint); }
  .group[open] > summary::before { content: '▾ '; }
  .kind {
    margin: .5rem 0 .1rem .3rem; font-size: .68rem; letter-spacing: .05em;
    text-transform: uppercase; color: var(--faint); font-weight: 700;
  }
  .ops { list-style: none; margin: 0 0 .5rem; padding: 0; }
  .op {
    display: block; width: 100%; text-align: left; border: 0; background: none;
    font: inherit; font-size: .8rem; cursor: pointer; color: var(--muted);
    padding: .22rem .45rem; border-radius: 4px; line-height: 1.35;
  }
  .op:hover { background: #f1f4f8; color: var(--ink); }
  .op.here { background: #eef4fb; color: var(--accent); font-weight: 600; }
  .steps { counter-reset: none; }
  .op.step { padding: .34rem .45rem; font-size: .84rem; }
  .op .n {
    font-family: var(--mono); font-size: .7rem; color: var(--faint);
    display: inline-block; min-width: 1.9rem;
  }
  .op.step.here .n { color: var(--accent); }
  .panel .watch {
    margin: 1rem 0 0; padding: .8rem 1rem .9rem; font-size: .9rem; color: var(--ink);
    background: #f4f9f4; border: 1px solid #d6e8d6; border-radius: 4px; max-width: 48rem;
  }
  .watch-title {
    margin: 0 0 .5rem; font-size: .68rem; letter-spacing: .06em; text-transform: uppercase;
    font-weight: 700; color: var(--ok);
  }
  .panel .watch ul { margin: 0; padding-left: 1.1rem; }
  /* The anchor for the cards below: they span the bullet rather than hang
     off the word, so one near the right-hand edge has nowhere to overflow
     to and every card opens in the same place. */
  .panel .watch li { margin: 0 0 .45rem; line-height: 1.55; position: relative; }
  .panel .watch li:last-child { margin-bottom: 0; }
  .panel .watch code { background: #e4efe4; padding: .08em .3em; border-radius: 3px; }
  .panel .watch .ref > code {
    border-bottom: 1px dotted var(--ok); cursor: help; outline: none;
  }
  .panel .watch .ref > code:hover, .panel .watch .ref > code:focus { background: #cfe4cf; }
  .panel .watch .ref .card {
    display: none; position: absolute; left: 0; right: 0; top: calc(100% + .25rem);
    z-index: 5; background: var(--card); border: 1px solid #cfd6de; border-radius: 4px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, .13); padding: .55rem .7rem .6rem;
  }
  .panel .watch .ref:hover .card, .panel .watch .ref:focus-within .card { display: block; }
  .panel .watch .card .excerpt {
    margin: 0; background: #fcfbf7; border-color: #e6ded0; border-left: 3px solid var(--warm);
    max-height: 18rem; font-size: .73rem;
  }
  .panel .watch .card .whole {
    display: inline-block; margin: .45rem 0 0; font-family: var(--mono); font-size: .7rem;
    color: var(--accent); text-decoration: none; border-bottom: 1px dotted currentColor;
  }
  .panel .watch .card code { background: none; padding: 0; }
  .op .n.run { color: var(--ok); font-weight: 700; }
  .to-come { margin: .5rem 0 0 .45rem; font-size: .78rem; color: var(--faint); font-style: italic; }
  .row { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
  /* The other way through: dashed, because it is the alternative route and
     should not compete with the step you are being offered. */
  button.run-all {
    font: inherit; font-size: .8rem; cursor: pointer; padding: .4rem .8rem;
    border-radius: 4px; border: 1px dashed #c3cdd8; background: var(--card); color: var(--muted);
  }
  button.run-all:hover { color: var(--accent); border-color: var(--accent); border-style: solid; }
  button.run-all:disabled { opacity: .6; cursor: progress; }
  #groups button.run-all { display: block; width: 100%; margin: .7rem 0 .3rem; }
  .pager {
    display: flex; gap: .6rem; align-items: center; justify-content: space-between;
    margin-top: 1rem;
  }
  .pager .step-back {
    font: inherit; font-size: .82rem; cursor: pointer; padding: .35rem .8rem;
    border-radius: 4px; border: 1px solid var(--line); background: var(--card); color: var(--muted);
  }
  .pager .step-back:hover { color: var(--ink); border-color: #cfd6de; }
  /* Pushed right when it is the only one, so it sits where it always sits. */
  .pager .next-step { margin-left: auto; }
  .op .verb {
    font-family: var(--mono); font-size: .68rem; font-weight: 700;
    display: inline-block; min-width: 3.4rem; color: var(--faint);
  }
  .op.here .verb { color: var(--accent); }

  #stage { min-width: 0; }
  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: 6px;
    padding: 1.1rem 1.2rem; margin: 0 0 1.2rem;
  }
  .panel .kindline {
    font-size: .68rem; letter-spacing: .05em; text-transform: uppercase;
    font-weight: 700; color: var(--accent); margin: 0 0 .25rem;
  }
  .panel h2 { font-size: 1.05rem; margin: 0 0 .2rem; }
  .panel .about {
    color: var(--muted); font-size: .9rem; margin: 0 0 .8rem; padding: 0 0 .8rem;
    border-bottom: 1px solid var(--line); max-width: 46rem;
  }
  .panel .path { font-family: var(--mono); font-size: .82rem; color: var(--accent); margin: 0 0 .7rem; }
  .panel .note { color: var(--muted); font-size: .9rem; margin: 0 0 .9rem; max-width: 46rem; }
  .panel ul.note { padding-left: 1.1rem; }
  .panel ul.note li { margin: 0 0 .25rem; }
  .panel .cited { font-family: var(--mono); font-size: .74rem; color: var(--faint); margin: 0 0 .9rem; }
  .panel .cited code { background: #eef2f6; color: var(--ink); padding: .08em .3em; border-radius: 3px; }
  .panel .cited a { color: var(--accent); text-decoration: none; border-bottom: 1px dotted currentColor; }
  .panel .cited a:hover { border-bottom-style: solid; }

  label.field { display: block; margin: 0 0 .7rem; font-size: .82rem; color: var(--muted); }
  label.field > span { display: block; margin-bottom: .22rem; }
  .shape { margin: .9rem 0 .25rem; }
  .shape > summary {
    cursor: pointer; list-style: none;
    font-family: var(--mono); font-size: .74rem; color: var(--faint);
  }
  .shape > summary::-webkit-details-marker { display: none; }
  .shape > summary::before { content: '▸ '; }
  .shape[open] > summary::before { content: '▾ '; }
  .shape > summary:hover { color: var(--accent); }
  .shape code { background: #eef2f6; color: var(--ink); padding: .08em .3em; border-radius: 3px; }
  .shape .excerpt {
    margin: .4rem 0 0; background: #fcfbf7; border-color: #e6ded0; border-left: 3px solid var(--warm);
    max-height: 22rem; font-size: .74rem;
  }
  .shape .whole {
    display: inline-block; margin: .4rem 0 0; font-family: var(--mono); font-size: .72rem;
    color: var(--accent); text-decoration: none; border-bottom: 1px dotted currentColor;
  }
  label.field .shape { margin-top: 0; }
  label.field code { background: #eef2f6; padding: .08em .3em; border-radius: 3px; }
  label.field a { color: var(--accent); text-decoration: none; border-bottom: 1px dotted currentColor; }
  input[type=text], select, textarea {
    width: 100%; font-family: var(--mono); font-size: .8rem; padding: .4rem .5rem;
    border: 1px solid var(--line); border-radius: 4px; background: #fcfcfc; color: var(--ink);
  }
  textarea { min-height: 9rem; resize: vertical; line-height: 1.5; }
  textarea.fixed { background: #f3f3f3; color: var(--muted); cursor: default; }
  /* The parts of a body that is not JSON, listed rather than serialized:
     there is no text form of a multipart request worth showing anybody. */
  pre.parts { background: #f3f3f3; border-color: var(--line); color: var(--muted); }
  input[type=file] { font: inherit; font-size: .8rem; color: var(--muted); }

  button.primary {
    font: inherit; font-size: .85rem; cursor: pointer; padding: .4rem 1rem;
    border-radius: 4px; border: 1px solid var(--accent); background: var(--accent); color: #fff;
  }
  button.primary:disabled { opacity: .45; cursor: not-allowed; }
  button.primary:disabled[data-done] { opacity: .6; }

  pre {
    margin: .8rem 0 0; padding: .7rem .8rem; max-height: 26rem; overflow: auto;
    background: #f7f9fc; border: 1px solid #dbe4f0; border-radius: 4px;
    font-family: var(--mono); font-size: .76rem; line-height: 1.5; white-space: pre-wrap;
  }
  pre .label {
    display: block; font-family: inherit; font-size: .68rem; letter-spacing: .04em;
    text-transform: uppercase; color: var(--accent); margin-bottom: .35rem; font-weight: 600;
  }
  pre .label code { font-family: var(--mono); text-transform: none; letter-spacing: 0; }
  pre .label a { color: inherit; text-transform: none; letter-spacing: 0; border-bottom: 1px dotted currentColor; text-decoration: none; }
  pre.bad { background: #fdf6f6; border-color: #eccfcf; }
  /* A scenario's steps: what each called, what came back, what it checked. */
  .tour-picker { display: block; margin: 0 0 .8rem; }
  .tour-picker span { display: block; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: .25rem; }
  .tour-picker select { width: 100%; }
  ul.checks { list-style: none; padding: 0; margin: .5rem 0 0; font-family: var(--mono); font-size: .78rem; }
  ul.checks .passed { color: var(--ok); }
  ul.checks .failed { color: var(--bad); }
  pre.bad .label { color: var(--bad); }

  .empty { color: var(--faint); font-size: .9rem; }
  @media (max-width: 60rem) {
    #shell { grid-template-columns: 1fr; }
    #groups { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header id="masthead">
  <div class="intro">
    <h1>Not your average Mock Server</h1>
    <p class="lede">
      An entire server, generated from a set of contracts, running in this tab.
      <b>No custom code.</b> Everything is derived on the fly when the server
      boots, so what you see here is what these contracts say, and nothing
      else.
    </p>
    <div id="controls">
      <button id="mode" class="primary">Let me explore</button>
      <span class="sep"></span>
      <button id="reseed">Restart with data</button>
      <button id="empty">Start empty</button>
    </div>
  </div>
  <div id="derived">starting…</div>
</header>

<div id="shell">
  <nav id="groups" aria-label="Operations"></nav>
  <main id="stage"></main>
</div>

er of items to return (1-100).","schema":{"type":"integer","minimum":1,"maximum":100,"default":25}},"OffsetParam":{"name":"offset","in":"query","description":"Number of items to skip before collecting results.","schema":{"type":"integer","minimum":0,"default":0}},"SearchQueryParam":{"name":"q","in":"query","required":false,"schema":{"type":"string"},"description":"Search query using field:value syntax. Multiple conditions separated by\nspaces are ANDed together.\n\n**URL Encoding:** This parameter must be URL-encoded when sent over HTTP.\nMost HTTP clients handle this automatically. Examples in this documentation\nshow human-readable syntax for clarity.\n\n## Syntax\n\n| Pattern | Description | Example |\n|---------|-------------|---------|\n| `term` | Full-text exact match | `john` |\n| `*term*` | Full-text contains | `*john*` |\n| `term*` | Full-text starts with | `john*` |\n| `*term` | Full-text ends with | `*smith` |\n| `field:value` | Exact match on field | `status:approved` |\n| `field:*value*` | Contains (case-insensitive) | `name:*john*` |\n| `field:value*` | Starts with | `name:john*` |\n| `field:*value` | Ends with | `email:*@example.com` |\n| `field:\"value\"` | Quoted value (for spaces) | `name:\"john doe\"` |\n| `field.nested:value` | Nested field (dot notation) | `address.state:CA` |\n| `field:>value` | Greater than | `income:>1000` |\n| `field:>=value` | Greater than or equal | `income:>=1000` |\n| `field:\u003cvalue` | Less than | `income:\u003c5000` |\n| `field:\u003c=value` | Less than or equal | `income:\u003c=5000` |\n| `field:val1,val2` | Match any value (OR) | `status:approved,pending` |\n| `-field:value` | Exclude / negate | `-status:denied` |\n| `field:*` | Field exists (not null) | `email:*` |\n| `-field:*` | Field does not exist | `-deletedAt:*` |\n\n## Examples\n\n- `john` — exact match for \"john\" in searchable fields\n- `*john*` — contains \"john\" in searchable fields\n- `name:*smith*` — name contains \"smith\" (case-insensitive)\n- `e scriptResumed":{"$ref":"#/components/messages/CommunicationTranscriptResumed"}}},"communication.transcript.closed":{"address":"communication.transcript.closed","messages":{"CommunicationTranscriptClosed":{"$ref":"#/components/messages/CommunicationTranscriptClosed"}}}},"components":{"messages":{"CommunicationTranscriptCreated":{"name":"communication.transcript.created","summary":"A Transcript was created. Carries the record as created.","payload":{"$ref":"#/components/schemas/CommunicationTranscriptCreatedEvent"}},"CommunicationTranscriptUpdated":{"name":"communication.transcript.updated","summary":"A Transcript was changed. Carries each changed field, before and after.","payload":{"$ref":"#/components/schemas/CommunicationTranscriptUpdatedEvent"}},"CommunicationTranscriptDeleted":{"name":"communication.transcript.deleted","summary":"A Transcript was deleted. The subject is the record's id.","payload":{"$ref":"#/components/schemas/CommunicationTranscriptDeletedEvent"}},"CommunicationTranscriptEntryCreated":{"name":"communication.transcript_entry.created","summary":"A TranscriptEntry was created. Carries the record as created.","payload":{"$ref":"#/components/schemas/CommunicationTranscriptEntryCreatedEvent"}},"CommunicationTranscriptEntryUpdated":{"name":"communication.transcript_entry.updated","summary":"A TranscriptEntry was changed. Carries each changed field, before and after.","payload":{"$ref":"#/components/schemas/CommunicationTranscriptEntryUpdatedEvent"}},"CommunicationTranscriptionProfileCreated":{"name":"communication.transcription_profile.created","summary":"A TranscriptionProfile was created. Carries the record as created.","payload":{"$ref":"#/components/schemas/CommunicationTranscriptionProfileCreatedEvent"}},"CommunicationTranscriptionProfileUpdated":{"name":"communication.transcription_profile.updated","summary":"A TranscriptionProfile was changed. Carries each changed field, before and after.","payload":{"$ref":"#/components/schemas/CommunicationTranscriptionProfileUpdatedEvent"}},"CommunicationTranscriptPaused":{"name":"communication.transcript.paused","summary":"The conversation went off the record. Anything said until it resumes is not stored.","payload":{"$ref":"#/components/schemas/CommunicationTranscriptPausedEvent"}},"CommunicationTranscriptResumed":{"name":"communication.transcript.resumed","summary":"The conversation is back on the record.","payload":{"$ref":"#/components/schemas/CommunicationTranscriptResumedEvent"}},"CommunicationTranscriptClosed":{"name":"communication.transcript.closed","summary":"The transcript has ended.","payload":{"$ref":"#/components/schemas/CommunicationTranscriptClosedEvent"}}},"schemas":{"CommunicationTranscriptCreatedEvent":{"allOf":[{"$ref":"../../schemas/events.yaml#/$defs/Event"},{"type":"object","properties":{"type":{"type":"string","const":"communication.transcript.created"},"data":{"$ref":"./communication-transcripts-openapi.yaml#/components/schemas/Transcript"}}}]},"CommunicationTranscriptUpdatedEvent":{"allOf":[{"$ref":"../../schemas/events.yaml#/$defs/Event"},{"type":"object","properties":{"type":{"type":"string","const":"communication.transcript.updated"},"data":{"$ref":"../../schemas/events.yaml#/ResourceUpdatedEvent"}}}]},"CommunicationTranscriptDeletedEvent":{"allOf":[{"$ref":"../../schemas/events.yaml#/$defs/Event"},{"type":"object","properties":{"type":{"type":"string","const":"communication.transcript.deleted"},"data":{"$ref":"../../schemas/events.yaml#/ResourceDeletedEvent"}}}]},"CommunicationTranscriptEntryCreatedEvent":{"allOf":[{"$ref":"../../schemas/events.yaml#/$defs/Event"},{"type":"object","properties":{"type":{"type":"string","const":"communication.transcript_entry.created"},"data":{"$ref":"./communication-transcripts-openapi.yaml#/components/schemas/TranscriptEntry"}}}]},"CommunicationTranscriptEntryUpdatedEvent":{"allOf":[{"$ref":"../../schemas/events.yaml#/$defs/Event"},{"type":"object","properties":{"type":{"type":"string","const":"communication.transcript_entry.updated"},"data":{"$ref":"../../schemas/events.yaml#/ResourceUpdatedEvent"}}}]},"CommunicationTranscriptionProfileCreatedEvent":{"allOf":[{"$ref":"../../schemas/events.yaml#/$defs/Event"},{"type":"object","properties":{"type":{"type":"string","const":"communication.transcription_profile.created"},"data":{"$ref":"./communication-transcripts-openapi.yaml#/components/schemas/TranscriptionProfile"}}}]},"CommunicationTranscriptionProfileUpdatedEvent":{"allOf":[{"$ref":"../../schemas/events.yaml#/$defs/Event"},{"type":"object","properties":{"type":{"type":"string","const":"communication.transcription_profile.updated"},"data":{"$ref":"../../schemas/events.yaml#/ResourceUpdatedEvent"}}}]},"CommunicationTranscriptPausedEvent":{"allOf":[{"$ref":"../../schemas/events.yaml#/$defs/Event"},{"type":"object","properties":{"type":{"type":"string","const":"communication.transcript.paused"}}}]},"CommunicationTranscriptResumedEvent":{"allOf":[{"$ref":"../../schemas/events.yaml#/$defs/Event"},{"type":"object","properties":{"type":{"type":"string","const":"communication.transcript.resumed"}}}]},"CommunicationTranscriptClosedEvent":{"allOf":[{"$ref":"../../schemas/events.yaml#/$defs/Event"},{"type":"object","properties":{"type":{"type":"string","const":"communication.transcript.closed"}}}]}}}}},{"relativePath":"base/domains/communication/communication-transcripts-openapi.yaml","domain":"communication","type":"openapi","content":{"openapi":"3.1.0","info":{"title":"Transcripts","version":"0.1.0","x-domain":"communication","x-status":"alpha","x-visibility":"internal","description":"The written record of a conversation. Starting a transcript opens it for\nrecording; pausing takes the conversation off the record; closing ends it.\nA transcript refers to what it records — an interview, a call — and names\nthe profile it was started under, which says the transcription service,\nand the client and model that produced its lines. Updating corrects what\nit records; deleting removes it, and the event left behind says which one\nand by whom.\n\nA profile is a state's choice of transcription service and languages for\na kind of conversation. The deployment's config seeds them; they can be\nadded and changed here, never deleted, so every transcript's profile\nstill exists.\n\nIts entries are its timeline, in the order things happened: lines, gaps\nwhere nothing was captured, and pauses. Every time on a transcript and its\nentries is the client's — when it started, paused, resumed and closed, and\nwhen each line was said — so they are compared on one clock.\n"},"servers":[{"url":"https://api.example.com/communication","description":"Production server"},{"url":"http://localhost:1080/communication","description":"Local development server"}],"tags":[{"name":"Transcripts","description":"The written record of a conversation."},{"name":"Transcript entries","description":"A transcript's timeline — lines, gaps and pauses."},{"name":"Transcription profiles","description":"The transcription service and languages to use for a kind of conversation."}],"paths":{"/transcripts":{"get":{"summary":"List transcripts","description":"Retrieve a paginated list of transcripts. Filter by `subjectId` to find\nthe transcripts of one interview or call.\n","operationId":"listTranscripts","tags":["Transcripts"],"x-sortable":{"fields":["createdAt"],"default":"-createdAt","tieBreaker":"id"},"parameters":[{"$ref":"../../components/parameters.yaml#/SearchQueryParam"},{"$ref":"../../components/parameters.yaml#/LimitParam"},{"$ref":"../../components/parameters.yaml#/OffsetParam"},{"$ref":"../../components/parameters.yaml#/SortParam"}],"responses":{"200":{"description":"A paginated collection of transcripts.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/TranscriptList"}}}},"400":{"$ref":"../../components/responses.yaml#/BadRequest"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}},"post":{"summary":"Start a transcript","description":"Start recording a conversation, under a profile. The transcript begins\nin `recording`. It is refused when the profile does not exist, or when\nthe profile names a transcription service and no `model` is given.\n","operationId":"createTranscript","tags":["Transcripts"],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/TranscriptCreate"}}}},"responses":{"201":{"description":"Transcript started.","headers":{"Location":{"description":"URL of the new transcript.","schema":{"type":"string","format":"uri"}}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/Transcript"}}}},"400":{"$ref":"../../components/responses.yaml#/BadRequest"},"409":{"description":"The transcript is refused: its profile does not exist, or the\nprofile names a transcription service and no `model` was given.\n","content":{"application/json":{"schema":{"$ref":"../../components/responses.yaml#/Error"}}}},"422":{"$ref":"../../components/responses.yaml#/UnprocessableEntity"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}}},"/transcripts/{transcriptId}":{"parameters":[{"$ref":"#/components/parameters/TranscriptIdParam"}],"get":{"summary":"Get a transcript","description":"Retrieve a single transcript by identifier.","operationId":"getTranscript","tags":["Transcripts"],"responses":{"200":{"description":"Transcript retrieved successfully.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Transcript"},"examples":{"TranscriptExample1":{"$ref":"#/components/examples/TranscriptExample1"}}}}},"404":{"$ref":"../../components/responses.yaml#/NotFound"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}},"patch":{"summary":"Update a transcript","description":"Correct what a transcript records — its subject, model or client. Its\nprofile does not change, and its status changes only through `pause`,\n`resume` and `close`.\n","operationId":"updateTranscript","tags":["Transcripts"],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/TranscriptUpdate"}}}},"responses":{"200":{"description":"Transcript updated.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Transcript"}}}},"400":{"$ref":"../../components/responses.yaml#/BadRequest"},"404":{"$ref":"../../components/responses.yaml#/NotFound"},"422":{"$ref":"../../components/responses.yaml#/UnprocessableEntity"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}},"delete":{"summary":"Delete a transcript","description":"Permanently remove a transcript. The `communication.transcript.deleted`\nevent records which transcript was removed and who removed it.\n","operationId":"deleteTranscript","tags":["Transcripts"],"responses":{"204":{"description":"Transcript deleted."},"404":{"$ref":"../../components/responses.yaml#/NotFound"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}}},"/transcripts/{transcriptId}/entries":{"parameters":[{"$ref":"#/components/parameters/TranscriptIdParam"}],"get":{"summary":"List a transcript's entries","description":"A transcript's timeline, in the order things happened — by `startedAt`.\nFilter by `kind` for only its lines, gaps or pauses.\n\nTo fetch only entries added since the last read, search on `createdAt`,\nwhich the server sets when it stores an entry: `q=createdAt:>=\u003cthe\nnewest createdAt already read>`, skipping ids already read. `startedAt`\nis the client's clock, so a line can arrive after one that started\nlater than it; `createdAt` still puts it after the last read.\n","operationId":"listTranscriptEntries","tags":["Transcript entries"],"x-sortable":{"fields":["startedAt","createdAt"],"default":"startedAt","tieBreaker":"id"},"parameters":[{"$ref":"../../components/parameters.yaml#/SearchQueryParam"},{"$ref":"../../components/parameters.yaml#/LimitParam"},{"$ref":"../../components/parameters.yaml#/OffsetParam"},{"$ref":"../../components/parameters.yaml#/SortParam"},{"name":"kind","in":"query","description":"Only entries of this kind.","schema":{"$ref":"#/components/schemas/TranscriptEntryKind"}}],"responses":{"200":{"description":"The transcript's entries, in the order things happened.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/TranscriptEntryList"}}}},"400":{"$ref":"../../components/responses.yaml#/BadRequest"},"404":{"$ref":"../../components/responses.yaml#/NotFound"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}},"post":{"summary":"Add an entry to a transcript","description":"Add a finished line, or a gap where nothing was captured. Pauses are not\nadded here: pausing the transcript adds one.\n\nSend an `Idempotency-Key` with every add, and the same key when retrying\none, so a retry is not a second line. The transcript refuses an entry\nthat started while it was paused or after it closed, an entry that ends\nbefore it starts, and a gap that overlaps a pause.\n","operationId":"addTranscriptEntry","tags":["Transcript entries"],"parameters":[{"$ref":"../../components/parameters.yaml#/IdempotencyKeyParam"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/TranscriptEntryCreate"}}}},"responses":{"201":{"description":"Entry added.","headers":{"Location":{"description":"URL of the new entry.","schema":{"type":"string","format":"uri"}}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/TranscriptEntry"}}}},"400":{"$ref":"../../components/responses.yaml#/BadRequest"},"403":{"$ref":"../../components/responses.yaml#/Forbidden"},"404":{"$ref":"../../components/responses.yaml#/NotFound"},"409":{"description":"The transcript refuses the entry: it started while the transcript\nwas paused or after it closed, it ends before it starts, or it is a\ngap overlapping a pause.\n","content":{"application/json":{"schema":{"$ref":"../../components/responses.yaml#/Error"}}}},"422":{"description":"The entry is not valid, or its `Idempotency-Key s(object.closedAt) || timestamp(request.startedAt) \u003c timestamp(object.closedAt))"},{"id":"endsAfterItStarts","description":"the entry does not end before it starts","condition":"timestamp(request.endedAt) >= timestamp(request.startedAt)"},{"id":"gapOutsidePauses","description":"a gap does not overlap a pause","condition":"request.kind != \"gap\" || pauseOverlap == null"}],"emits":[{"id":"paused","description":"The conversation went off the record. Anything said until it resumes is not stored."},{"id":"resumed","description":"The conversation is back on the record."},{"id":"closed","description":"The transcript has ended."}],"actions":[{"id":"pause","description":"Take the conversation off the record, at the time the client says.","transition":{"from":"recording","to":"paused"},"schema":{"request":{"$ref":"#/$defs/AtRequest"}},"guards":[{"conditions":["atAfterStart"]}],"steps":[{"call":{"POST":"communication/transcripts/$object.id/entries","body":{"kind":"pause","startedAt":"$request.at","endedAt":null}}},{"emit":{"event":"paused","type":"communication.transcript.paused"}}]},{"id":"resume","description":"Put the conversation back on the record, at the time the client says.","transition":{"from":"paused","to":"recording"},"schema":{"request":{"$ref":"#/$defs/AtRequest"}},"context":[{"openPause":{"from":"communication/transcripts/entries","where":"item.kind == \"pause\" && item.transcriptId == object.id && item.endedAt == null"}}],"guards":[{"conditions":["aPauseIsOpen","atAfterPauseBegan"]}],"steps":[{"call":{"PATCH":"communication/transcripts/$object.id/entries/$openPause.id","body":{"endedAt":"$request.at"}}},{"call":"requestIdleCheck"},{"emit":{"event":"resumed","type":"communication.transcript.resumed"}}]},{"id":"close","description":"End the transcript, at the time the client says. A pause still open ends then too.","transition":{"from":["recording","paused"],"to":"closed"},"schema":{"request":{"$ref":"#/$defs/AtRequest"}},"context":[{"openPause":{"from":"communication/transcripts/entries","where":"item.kind == \"pause\" && item.transcriptId == object.id && item.endedAt == null"}}],"guards":[{"conditions":["atAfterStart","atAfterPauseBegan"]}],"steps":[{"set":{"field":"closedAt","value":"$request.at"}},{"if":"openPause != null","then":[{"call":{"PATCH":"communication/transcripts/$object.id/entries/$openPause.id","body":{"endedAt":"$request.at"}}}]},{"emit":{"event":"closed","type":"communication.transcript.closed"}}]}],"on":[{"type":"communication.transcript.created","description":"Ask for the first idle check, when the profile sets a timeout.","transition":{},"steps":[{"call":"requestIdleCheck"}]},{"type":"communication.transcript_entry.created","description":"Record when the software was last heard from.","steps":[{"if":"this.data.kind != \"pause\"","then":[{"call":{"PATCH":"communication/transcripts/$this.data.transcriptId","body":{"lastActivityAt":"$this.data.endedAt"}}}]}]},{"type":"communication.idle_check","description":"Close a transcript that has gone quiet; ask again if something arrived since the last check.","transition":{"from":"recording"},"context":[{"newActivity":{"from":"communication/transcripts/entries","where":"item.transcriptId == object.id && item.kind != \"pause\" && timestamp(item.createdAt) > timestamp(this.data.since)"}}],"steps":[{"if":"newActivity != null","then":[{"call":"requestIdleCheck"}],"else":[{"if":"has(object.lastActivityAt)","then":[{"call":{"POST":"communication/transcripts/$object.id/close","body":{"at":"$object.lastActivityAt"}}}],"else":[{"call":{"POST":"communication/transcripts/$object.id/close","body":{"at":"$object.startedAt"}}}]}]}]}],"procedures":[{"id":"requestIdleCheck","description":"Ask the scheduler for an idle check after the profile's idleTimeout, if it sets one.","if":"profile != null && has(profile.idleTimeout)","then":[{"emit":{"type":"scheduling.timer.requested","data":{"timerId":"communication.idle_check.{$object.id}","fireAfter":"$profile.idleTimeout","callback":{"event":"communication.idle_check","data":{"since":"$now"}}}}}]}],"resources":{"Transcript":{"create":{"context":[{"profile":{"from":"communication/profiles","where":"item.id == request.profileId"}}],"guards":[{"conditions":["profileExists","modelGivenForTheService"]}]}},"TranscriptEntry":{"create":{"context":[{"pauseAtStart":{"from":"communication/transcripts/entries","where":"item.kind == \"pause\" && item.transcriptId == object.id && timestamp(item.startedAt) \u003c= timestamp(request.startedAt) && (item.endedAt == null || timestamp(item.endedAt) > timestamp(request.startedAt))"}},{"pauseOverlap":{"from":"communication/transcripts/entries","where":"item.kind == \"pause\" && item.transcriptId == object.id && timestamp(item.startedAt) \u003c timestamp(request.endedAt) && (item.endedAt == null || timestamp(item.endedAt) > timestamp(request.startedAt))"}}],"guards":[{"conditions":["startedWhileRecording","endsAfterItStarts","gapOutsidePauses"]}]},"update":{"guards":[{"actors":["system"]}]}}}}],"$defs":{"AtRequest":{"type":"object","additionalProperties":false,"required":["at"],"properties":{"at":{"type":"string","format":"date-time","description":"When it happened, by the client's clock."}}}}}},{"relativePath":"base/domains/platform/platform-events-openapi.yaml","domain":"platform","type":"openapi","content":{"openapi":"3.1.0","info":{"title":"Events","version":"1.0.0","x-domain":"platform","x-status":"beta","x-visibility":"internal","description":"The centralized log of domain events across every domain, as CloudEvents\n1.0 envelopes. Supports REST polling and a live stream, and keeps a\npermanent audit history whether or not a message broker is in use.\n\nPublishing records an event a domain producer emits. It is for systems\nrecording what happened, not for requests made on a person's behalf.\n"},"servers":[{"url":"https://api.example.com/platform","description":"Production server"},{"url":"http://localhost:1080/platform","description":"Local development server"}],"tags":[{"name":"Events","description":"Centralized event log across all domains."}],"paths":{"/events":{"get":{"summary":"List events","description":"Queryable log of all domain events across the blueprint. Supports\nREST polling as an integration pattern and provides permanent audit\nhistory regardless of whether a message broker is in use.\n\nEvents are returned in ascending time order (oldest first) to support\ncursor-based polling.\n","operationId":"listEvents","tags":["Events"],"x-sortable":{"fields":["time","type","source"],"default":"time","tieBreaker":"id"},"parameters":[{"$ref":"../../components/parameters.yaml#/SearchQueryParam"},{"$ref":"../../components/parameters.yaml#/SortParam"},{"name":"type","in":"query","description":"Filter by CloudEvents type. Supports prefix matching with a trailing wildcard (e.g., `intake.*`). When states apply an x-event-type-prefix overlay, the resolved prefix is prepended to all event types (e.g., `org.example.intake.*`).\n","schema":{"type":"string"},"example":"intake.application.submitted"},{"name":"source","in":"query","description":"Filter by CloudEvents source (the domain that produced the event, e.g., `/intake`, `/workflow`).","schema":{"type":"string"},"example":"/intake"},{"name":"subject","in":"query","description":"Filter by CloudEvents subject — the entity ID the event pertains to. Because every domain uses the same subject for the same entity, this returns a complete cross-domain timeline for that entity.\n","schema":{"type":"string","format":"uuid"}},{"name":"traceid","in":"query","description":"Filter by W3C Trace Context trace ID extracted from the `traceparent` attribute. All events sharing a trace ID were causally triggered by the same root action.\n","schema":{"type":"string"}},{"name":"causationid","in":"query","description":"Filter by the `causationid` extension — the ID of the event that directly caused this one. Use it to find the response event(s) produced by a specific trigger (e.g., the `call. he client disconnects. A `: heartbeat` comment\nis sent every 30 seconds to prevent proxy timeouts.\n","operationId":"streamEvents","tags":["Events"],"responses":{"200":{"description":"SSE stream of domain events.","content":{"text/event-stream":{"schema":{"type":"string","description":"Newline-delimited SSE frames, each containing a JSON Event."}}}}}}},"/events/{eventId}":{"parameters":[{"name":"eventId","in":"path","required":true,"description":"Unique identifier of the domain event.","schema":{"type":"string","format":"uuid"}}],"get":{"summary":"Get a domain event","description":"Retrieve a single domain event by its identifier.","operationId":"getEvent","tags":["Events"],"responses":{"200":{"description":"Domain event retrieved successfully.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Event"}}}},"404":{"$ref":"../../components/responses.yaml#/NotFound"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}}}},"components":{"schemas":{"Event":{"$ref":"../../schemas/events.yaml#/$defs/Event"},"EventList":{"description":"Paginated list of domain events.","allOf":[{"$ref":"../../components/pagination.yaml#/Pagination"},{"type":"object","required":["items"],"properties":{"items":{"type":"array","items":{"$ref":"#/components/schemas/Event"}}}}]}}}}},{"relativePath":"base/domains/platform/platform-registries-openapi.yaml","domain":"platform","type":"openapi","content":{"openapi":"3.1.0","info":{"title":"Registries","version":"1.0.0","x-domain":"platform","x-status":"beta","x-visibility":"internal","description":"Named, citable entries the contracts declare in registry files — regulatory\npolicies, sources, design patterns — readable by type. Entries carry a\ndescription and whatever fields their type defines.\n"},"servers":[{"url":"https://api.example.com/platform","description":"Production server"},{"url":"http://localhost:1080/platform","description":"Local development server"}],"tags":[{"name":"Registries","description":"Entries ","$id":"https://blueprint.codeforamerica.org/base/schemas/auth.yaml","title":"CommonAuth","description":"Shared connection and credential configuration schemas. Used in domain config files (e.g., data-exchange-config.yaml, eligibility-adapter-config.yaml) to define how adapters connect to external services.\n","$defs":{"Endpoint":{"type":"object","description":"Connection parameters for an external service. States overlay their domain config files (e.g., data-exchange-config.yaml) to fill in these fields for each service. No credentials live here — secrets are injected at deploy time via environment variables or a state-configured secrets manager, and referenced by name in the endpoint block.\n","additionalProperties":true,"required":["url"],"properties":{"url":{"type":"string","format":"uri","description":"Base URL for the external service endpoint.","example":"https://hub.cms.gov/fdsh/ssa"},"timeoutMs":{"type":"integer","description":"Request timeout in milliseconds. Defaults to adapter implementation default if omitted.","minimum":0,"example":30000},"apiVersion":{"type":"string","description":"Service API version, if the external service requires explicit versioning.","example":"2.0"}}}}}},{"relativePath":"base/schemas/enums.yaml","domain":null,"type":"schema","content":{"$schema":"https://json-schema.org/draft/2020-12/schema","$id":"https://blueprint.codeforamerica.org/base/schemas/enums.yaml","$defs":{"Domain":{"type":"string","description":"Blueprint domain identifier. Used as the {domain} path parameter on metadata mutation endpoints and as the value type for x-domain annotations on domain OpenAPI specs. Its values are generated at resolve time: the domains the set's OpenAPI, AsyncAPI and rules documents declare.\n","enum":["communication","document-management","eligibility","intake","platform","scheduling"]},"MetricCollection":{"type":"string","description":"Harness metric collections. Extends the base MetricCollection with the primary resource collections for intake and eligibility domains.\n","enum":["applications","determinations","events"]},"Frequency":{"type":"string","description":"How often an amount is received, incurred, or scheduled. Applies to income, expenses, SLA recurrence, scheduled reviews, and any other time-based cadence. Domain packages can extend this enum via overlay.\n","enum":["daily","weekly","every_two_weeks","twice_monthly","monthly","yearly","variable"]},"Language":{"type":"string","description":"Preferred language (BCP 47 language tag).","pattern":"^[a-zA-Z]{2,3}(?:-[a-zA-Z0-9]{2,8})*$"},"ConfigSource":{"type":"string","readOnly":true,"description":"Where a record of a config-seeded resource came from. `system`: the deployment's config file, which seeds it once; afterwards it can be changed through the API, but not deleted. `user`: added through the API, and deletable where the API allows it. A client can use it to leave out a delete it would be refused, without trying it first.\n","enum":["system","user"]},"RoleType":{"type":"string","description":"Harness authorization roles. Replaces the base RoleType with the roles the harness's state machine guards name.\n- applicant: The household applying, acting on its own application - case_worker: Processes applications - supervisor: Oversees case workers - system: Automated service account for background and inter-service operations\n","enum":["applicant","case_worker","supervisor","system"]}}}},{"relativePath":"base/schemas/events.yaml","domain":null,"type":"schema","content":{"$schema":"https://json-schema.org/draft/2020-12/schema","$id":"https://blueprint.codeforamerica.org/base/schemas/events.yaml","$defs":{"EventRef":{"type":"object","required":["type"],"properties":{"type":{"type":"string","description":"Fully qualified CloudEvents event type, {domain}.{resource}.{event} (e.g., intake.application.submitted): the domain as declared, the resource's schema name in snake_case.\n"},"description":{"type":"string","description":"Human-readable annotation for state machine authors. Not a CloudEvents field."}}},"EventBase":{"allOf":[{"$ref":"#/$defs/EventRef"},{"type":"object","properties":{"subject":{"type":"string","description":"CloudEvents subject override. The entity ID the event pertains to. Defaults to the emitting resource's own id when omitted.\n"},"causationid":{"type":"string","description":"CloudEvents Causation extension (optional). Value expression resolving to the id of the event that directly caused this one. Use when an event is emitted in response to another event (e.g., auto-resume triggered by a timer callback).\n"},"data":{"type":"object","additionalProperties":true,"description":"Event-specific payload. Field values are value expressions resolved at emit time."}}}]},"Event":{"allOf":[{"$ref":"#/$defs/EventBase"},{"type":"object","required":["specversion","id","source","subject","time","datacontenttype"],"properties":{"specversion":{"type":"string","const":"1.0","description":"CloudEvents specification version."},"id":{"type":"string","format":"uuid","description":"Unique event identifier."},"source":{"type":"string","description":"Domain base path that produced the event (e.g., /intake, /workflow).","example":"/intake"},"subject":{"type":"string","format":"uuid","description":"Entity ID the event pertains to."},"time":{"type":"string","format":"date-time","description":"When the event occurred."},"datacontenttype":{"type":"string","const":"application/json","description":"Media type of the event payload."},"traceparent":{"type":["string","null"],"description":"W3C Trace Context header (optional). Propagated from the triggering request or event. The trace ID component is stable across the full causal chain.\n"},"causationid":{"type":["string","null"],"format":"uuid","description":"CloudEvents Causation extension (optional). The `id` of the event that directly caused this one. Use when an event is emitted in direct response to another event (e.g., a task auto-resumed because a timer fired). Allows consumers to trace the immediate cause without inspecting the full distributed trace.\n"},"authid":{"type":["string","null"],"description":"CloudEvents Auth Context extension (optional). Principal identifier (userId from JWT claims) of the actor who triggered the event. No PII — user ID only, not name or email. Required for FTI-governed events per IRS Pub. 1075. Omitted when no caller identity is present.\n"},"authtype":{"type":["string","null"],"enum":["user","service_account","api_key","system","unauthenticated","unknown",null],"description":"CloudEvents Auth Context extension (optional). Principal type of the actor who triggered the event. Required when authid is present. Required for FTI-governed events per IRS Pub. 1075.\n"},"data":{"type":"object","description":"Event-specific payload. Schema is defined per event type in each domain's AsyncAPI file."}}}]}},"FieldChange":{"type":"object","description":"A single field change recorded in an updated event.","additionalProperties":false,"required":["field","before","after"],"properties":{"field":{"type":"string","description":"Dot-path of the changed field. Top-level fields are a simple name (e.g. `status`); nested fields use dot notation (e.g. `personalInformation.dateOfBirth`). Arrays are treated as leaf values — the path identifies the array field itself, not individual elements.\n"},"before":{"description":"Value of the field before the update."},"after":{"description":"Value of the field after the update."}}},"ResourceUpdatedEvent":{"type":"object","description":"Payload for a CRUD-emitted updated event. Contains a field-level diff\nrecording which fields changed and their before/after values.\n\nEmitted automatically by the mock server on every PATCH request.\nConsumers can react to specific field mutations without fetching the\nfull resource.\n","required":["changes"],"properties":{"changes":{"type":"array","description":"List of fields that changed, with before and after values.","items":{"$ref":"#/FieldChange"}}}},"ResourceDeletedEvent":{"type":"object","description":"Payload for a CRUD-emitted deleted event. Carries no data — the entity\nno longer exists and consumers should treat the subject ID as permanently\nremoved.\n","properties":{}},"SchedulingTimerCancelledEvent":{"type":"object","description":"Payload for a timer cancellation request sent to the scheduling service.\nIf the timer has already fired or does not exist, this is a no-op.\n","required":["timerId"],"properties":{"timerId":{"type":"string","description":"The timer to cancel."}}},"SchedulingTimerRequestedEvent":{"type":"object","description":"Payload for a timer request sent to the scheduling service. The scheduling\nservice registers the timer and fires the caller-specified callback event\nwhen the timer expires, passing callback.data through unchanged and adding\ntimerId to the payload.\n","required":["timerId","callback"],"properties":{"timerId":{"type":"string","description":"Deterministic timer identifier in the form domain.timerType.objectId (e.g., workflow.creation_deadline.task-123). Used as the cancellation key — safe to register idempotently with the same ID.\n"},"fireAfter":{"type":"string","description":"ISO 8601 duration to wait before firing (e.g., PT72H, P30D). Mutually exclusive with fireAt."},"fireAt":{"type":"string","format":"date-time","description":"Absolute timestamp to fire at. Use when the fire time is tied to a known deadline on the object. Mutually exclusive with fireAfter."},"fireOffset":{"type":"string","description":"ISO 8601 duration (negative) applied to fireAt to fire before the target time (e.g., -PT48H fires 48 hours before fireAt). Only valid when fireAt is set."},"calendarType":{"type":"string","enum":["calendar","business"],"description":"When business, elapsed time counts only business days. Defaults to calendar."},"callback":{"type":"object","description":"What to deliver when the timer fires.","required":["event","data"],"properties":{"event":{"type":"string","description":"CloudEvents type of the domain-specific event to emit when the timer expires (e.g., workflow.creation_deadline). The scheduling service passes this through unchanged — it does not derive or modify the event name.\n"},"data":{"type":"object","description":"Payload to include in the callback event, passed through unchanged. The scheduling service adds timerId to this payload before delivery.","additionalProperties":true}}}}},"TimerCallbackEvent":{"type":"object","description":"Payload delivered by the scheduling service when a timer expires. Contains\ncallback.data from the original scheduling.timer.requested event, passed\nthrough unchanged, with timerId added by the scheduling service.\n\nThe scheduling service is a pure relay — it does not add, derive, or modify\nany fields beyond timerId. The event name is the domain-specific name from\ncallback.event in the original request (e.g., workflow.creation_deadline),\nnot a generic scheduler.timer.fired event.\n","required":["timerId"],"properties":{"timerId":{"type":"string","description":"The deterministic timer ID from the original scheduling request."}},"additionalProperties":true}}},{"relativePath":"base/schemas/identity.yaml","domain":null,"type":"schema","content":{"$schema":"https://json-schema.org/draft/2020-12/schema","$id":"https://blueprint.codeforamerica.org/base/schemas/identity.yaml","title":"Identity","description":"Shared identity schemas for personal identification. Referenced by OpenAPI specs, state machine schemas, and event schemas across blueprint deployments.\n","$defs":{"DateOfBirth":{"title":"DateOfBirth","type":"string","format":"date","description":"Date of birth. Used in age-based eligibility criteria and as a core identity-matching field for verification calls."},"Name":{"title":"Name","type":"object","description":"Legal name of a person.","additionalProperties":false,"required":["firstName","lastName"],"properties":{"firstName":{"type":"string","description":"First nam
