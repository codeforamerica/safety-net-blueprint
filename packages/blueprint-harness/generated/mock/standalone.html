<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not your average Mock Server</title>
<!--
  A playground over the browser mock, rather than a tour of it.

  The page is generated from the contracts twice over: the server is, and so
  is this. Which operations exist, what kind of thing each one is, what a
  sensible body looks like, which records you can act on and which moves are
  legal from where they are — every one of those comes out of the contract
  set, which is why this can do things a generic API client cannot. Postman
  hands you a box and wishes you luck.

  Operations are grouped in dependency order, and the order is real rather
  than pedagogical: a composition needs a record to project, a transition
  needs a record already in a particular state. Resources first is not a
  teaching conceit, it is what has to happen.
-->
<style>
  :root {
    --ink: #1a1a1a; --muted: #555; --faint: #888; --line: #e2e2e2;
    --bg: #fafafa; --card: #fff; --accent: #2b6cb0; --ok: #2f7a3f; --bad: #b02b2b;
    --warm: #8a6d3b;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  /* Any `display` on a rule beats the user agent's `[hidden] { display: none }`,
     so an element given a layout and then hidden in script stays on screen.
     That has now produced two bugs — an empty bordered box, and a Next button
     offering to skip a step nobody had run. Settled here instead of per rule. */
  [hidden] { display: none !important; }
  body {
    margin: 0; padding: 0 0 5rem; background: var(--bg); color: var(--ink);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  h1 { font-size: 1.4rem; margin: 0; }
  code { font-family: var(--mono); font-size: .88em; }

  #masthead {
    max-width: 86rem; margin: 0 auto; padding: 1.6rem 1.2rem 1.1rem;
    border-bottom: 1px solid var(--line);
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2rem; align-items: start;
  }
  /* Two cells, not four rows: as separate rows the left-hand items were
     stretched to match whichever side was taller, which put a hand's width
     of nothing between the title and the text under it. */
  #masthead .intro { min-width: 0; }
  #derived {
    align-self: start;
    border: 1px solid var(--line); border-radius: 6px; background: var(--card);
    padding: .6rem .8rem; min-width: 17rem;
  }
  #derived .when {
    margin: .45rem 0 0; padding-top: .4rem; border-top: 1px solid var(--line);
    font-size: .66rem; letter-spacing: .04em; text-transform: uppercase;
    color: var(--faint); font-weight: 700;
  }
  #derived .stat {
    display: flex; gap: .4rem; align-items: baseline;
    font-size: .75rem; color: var(--muted); line-height: 1.45;
  }
  #derived .stat .n {
    font-family: var(--mono); min-width: 1.4rem; text-align: right; color: var(--ink);
  }
  #derived .stat.lead { font-size: .92rem; color: var(--ink); font-weight: 600; line-height: 1.3; }
  #derived .stat.lead .n { color: var(--accent); min-width: 1.9rem; }
  #derived .breakdown {
    display: grid; grid-template-columns: 1fr 1fr; column-gap: .9rem;
    margin-top: .45rem; padding-top: .4rem; border-top: 1px solid var(--line);
  }
  #derived .headline { margin-top: 0; padding-top: 0; border-top: 0; }
  @media (max-width: 60rem) {
    #masthead { grid-template-columns: 1fr; }
    #derived { grid-column: 1; grid-row: auto; }
  }
  .lede { color: var(--muted); margin: .4rem 0 0; max-width: 44rem; font-size: .95rem; }

  /* Throwing the whole thing away and deriving it again, which is the
     headline claim and takes about as long as a keystroke. */
  #controls { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; margin: .9rem 0 0; }
  #controls .sep { border-left: 1px solid var(--line); height: 1.4rem; margin: 0 .2rem; }
  #controls button:not(.primary) {
    font: inherit; font-size: .85rem; cursor: pointer; padding: .4rem 1rem;
    border-radius: 4px; border: 1px solid var(--line); background: var(--card); color: var(--ink);
  }
  #controls button:disabled { opacity: .4; cursor: not-allowed; }
  /* Who the reference calls as. Every request carries it, the way a real
     client's sign-in would, and the events it causes record it. */
  .caller { display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; margin: 0 0 .6rem; font-size: .85rem; color: var(--muted); }
  .caller input, .caller select { width: auto; }
  .caller .caller-id { width: 9rem; }
  .caller input.caller-roles { width: 15rem; }
  details.caller-roles { position: relative; }
  details.caller-roles summary {
    cursor: pointer; font-family: var(--mono); font-size: .8rem; padding: .4rem .5rem; min-width: 12rem;
    border: 1px solid var(--line); border-radius: 4px; background: #fcfcfc; color: var(--ink);
  }
  details.caller-roles .menu {
    position: absolute; z-index: 5; margin-top: .2rem; padding: .3rem .5rem; min-width: 100%;
    border: 1px solid var(--line); border-radius: 4px; background: var(--card); box-shadow: 0 2px 8px rgba(0,0,0,.08);
  }
  details.caller-roles .menu label { display: flex; gap: .4rem; align-items: center; padding: .15rem 0; font-family: var(--mono); font-size: .8rem; color: var(--ink); white-space: nowrap; }
  details.caller-roles .menu input { width: auto; }
  .caller .caller-id:disabled { opacity: .4; }


  #shell {
    display: grid; grid-template-columns: 17rem minmax(0, 1fr);
    gap: 2rem; max-width: 86rem; margin: 1.4rem auto 0; padding: 0 1.2rem;
  }
  #groups {
    position: sticky; top: 1rem; align-self: start;
    max-height: calc(100vh - 2rem); overflow: auto;
    border-right: 1px solid var(--line); padding-right: .8rem;
  }
  .group > summary {
    cursor: pointer; list-style: none; padding: .45rem .3rem;
    font-size: .76rem; letter-spacing: .06em; text-transform: uppercase;
    font-weight: 700; color: var(--ink);
  }
  .group > summary::-webkit-details-marker { display: none; }
  .group > summary::before { content: '▸ '; color: var(--faint); }
  .group[open] > summary::before { content: '▾ '; }
  .kind {
    margin: .5rem 0 .1rem .3rem; font-size: .68rem; letter-spacing: .05em;
    text-transform: uppercase; color: var(--faint); font-weight: 700;
  }
  .ops { list-style: none; margin: 0 0 .5rem; padding: 0; }
  .op {
    display: block; width: 100%; text-align: left; border: 0; background: none;
    font: inherit; font-size: .8rem; cursor: pointer; color: var(--muted);
    padding: .22rem .45rem; border-radius: 4px; line-height: 1.35;
  }
  .op:hover { background: #f1f4f8; color: var(--ink); }
  .op.here { background: #eef4fb; color: var(--accent); font-weight: 600; }
  .steps { counter-reset: none; }
  .op.step { padding: .34rem .45rem; font-size: .84rem; }
  .op .n {
    font-family: var(--mono); font-size: .7rem; color: var(--faint);
    display: inline-block; min-width: 1.9rem;
  }
  .op.step.here .n { color: var(--accent); }
  .panel .watch {
    margin: 1rem 0 0; padding: .8rem 1rem .9rem; font-size: .9rem; color: var(--ink);
    background: #f4f9f4; border: 1px solid #d6e8d6; border-radius: 4px; max-width: 48rem;
  }
  .watch-title {
    margin: 0 0 .5rem; font-size: .68rem; letter-spacing: .06em; text-transform: uppercase;
    font-weight: 700; color: var(--ok);
  }
  .panel .watch ul { margin: 0; padding-left: 1.1rem; }
  /* The anchor for the cards below: they span the bullet rather than hang
     off the word, so one near the right-hand edge has nowhere to overflow
     to and every card opens in the same place. */
  .panel .watch li { margin: 0 0 .45rem; line-height: 1.55; position: relative; }
  .panel .watch li:last-child { margin-bottom: 0; }
  .panel .watch code { background: #e4efe4; padding: .08em .3em; border-radius: 3px; }
  .panel .watch .ref > code {
    border-bottom: 1px dotted var(--ok); cursor: help; outline: none;
  }
  .panel .watch .ref > code:hover, .panel .watch .ref > code:focus { background: #cfe4cf; }
  .panel .watch .ref .card {
    display: none; position: absolute; left: 0; right: 0; top: calc(100% + .25rem);
    z-index: 5; background: var(--card); border: 1px solid #cfd6de; border-radius: 4px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, .13); padding: .55rem .7rem .6rem;
  }
  .panel .watch .ref:hover .card, .panel .watch .ref:focus-within .card { display: block; }
  .panel .watch .card .excerpt {
    margin: 0; background: #fcfbf7; border-color: #e6ded0; border-left: 3px solid var(--warm);
    max-height: 18rem; font-size: .73rem;
  }
  .panel .watch .card .whole {
    display: inline-block; margin: .45rem 0 0; font-family: var(--mono); font-size: .7rem;
    color: var(--accent); text-decoration: none; border-bottom: 1px dotted currentColor;
  }
  .panel .watch .card code { background: none; padding: 0; }
  .op .n.run { color: var(--ok); font-weight: 700; }
  .to-come { margin: .5rem 0 0 .45rem; font-size: .78rem; color: var(--faint); font-style: italic; }
  .row { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
  /* The other way through: dashed, because it is the alternative route and
     should not compete with the step you are being offered. */
  button.run-all {
    font: inherit; font-size: .8rem; cursor: pointer; padding: .4rem .8rem;
    border-radius: 4px; border: 1px dashed #c3cdd8; background: var(--card); color: var(--muted);
  }
  button.run-all:hover { color: var(--accent); border-color: var(--accent); border-style: solid; }
  button.run-all:disabled { opacity: .6; cursor: progress; }
  #groups button.run-all { display: block; width: 100%; margin: .7rem 0 .3rem; }
  .pager {
    display: flex; gap: .6rem; align-items: center; justify-content: space-between;
    margin-top: 1rem;
  }
  .pager .step-back {
    font: inherit; font-size: .82rem; cursor: pointer; padding: .35rem .8rem;
    border-radius: 4px; border: 1px solid var(--line); background: var(--card); color: var(--muted);
  }
  .pager .step-back:hover { color: var(--ink); border-color: #cfd6de; }
  /* Pushed right when it is the only one, so it sits where it always sits. */
  .pager .next-step { margin-left: auto; }
  .op .verb {
    font-family: var(--mono); font-size: .68rem; font-weight: 700;
    display: inline-block; min-width: 3.4rem; color: var(--faint);
  }
  .op.here .verb { color: var(--accent); }

  #stage { min-width: 0; }
  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: 6px;
    padding: 1.1rem 1.2rem; margin: 0 0 1.2rem;
  }
  .panel .kindline {
    font-size: .68rem; letter-spacing: .05em; text-transform: uppercase;
    font-weight: 700; color: var(--accent); margin: 0 0 .25rem;
  }
  .panel h2 { font-size: 1.05rem; margin: 0 0 .2rem; }
  .panel .about {
    color: var(--muted); font-size: .9rem; margin: 0 0 .8rem; padding: 0 0 .8rem;
    border-bottom: 1px solid var(--line); max-width: 46rem;
  }
  .panel .path { font-family: var(--mono); font-size: .82rem; color: var(--accent); margin: 0 0 .7rem; }
  .panel .note { color: var(--muted); font-size: .9rem; margin: 0 0 .9rem; max-width: 46rem; }
  .panel .cited { font-family: var(--mono); font-size: .74rem; color: var(--faint); margin: 0 0 .9rem; }
  .panel .cited code { background: #eef2f6; color: var(--ink); padding: .08em .3em; border-radius: 3px; }
  .panel .cited a { color: var(--accent); text-decoration: none; border-bottom: 1px dotted currentColor; }
  .panel .cited a:hover { border-bottom-style: solid; }

  label.field { display: block; margin: 0 0 .7rem; font-size: .82rem; color: var(--muted); }
  label.field > span { display: block; margin-bottom: .22rem; }
  .shape { margin: .9rem 0 .25rem; }
  .shape > summary {
    cursor: pointer; list-style: none;
    font-family: var(--mono); font-size: .74rem; color: var(--faint);
  }
  .shape > summary::-webkit-details-marker { display: none; }
  .shape > summary::before { content: '▸ '; }
  .shape[open] > summary::before { content: '▾ '; }
  .shape > summary:hover { color: var(--accent); }
  .shape code { background: #eef2f6; color: var(--ink); padding: .08em .3em; border-radius: 3px; }
  .shape .excerpt {
    margin: .4rem 0 0; background: #fcfbf7; border-color: #e6ded0; border-left: 3px solid var(--warm);
    max-height: 22rem; font-size: .74rem;
  }
  .shape .whole {
    display: inline-block; margin: .4rem 0 0; font-family: var(--mono); font-size: .72rem;
    color: var(--accent); text-decoration: none; border-bottom: 1px dotted currentColor;
  }
  label.field .shape { margin-top: 0; }
  label.field code { background: #eef2f6; padding: .08em .3em; border-radius: 3px; }
  label.field a { color: var(--accent); text-decoration: none; border-bottom: 1px dotted currentColor; }
  input[type=text], select, textarea {
    width: 100%; font-family: var(--mono); font-size: .8rem; padding: .4rem .5rem;
    border: 1px solid var(--line); border-radius: 4px; background: #fcfcfc; color: var(--ink);
  }
  textarea { min-height: 9rem; resize: vertical; line-height: 1.5; }
  textarea.fixed { background: #f3f3f3; color: var(--muted); cursor: default; }
  /* The parts of a body that is not JSON, listed rather than serialized:
     there is no text form of a multipart request worth showing anybody. */
  pre.parts { background: #f3f3f3; border-color: var(--line); color: var(--muted); }
  input[type=file] { font: inherit; font-size: .8rem; color: var(--muted); }

  button.primary {
    font: inherit; font-size: .85rem; cursor: pointer; padding: .4rem 1rem;
    border-radius: 4px; border: 1px solid var(--accent); background: var(--accent); color: #fff;
  }
  button.primary:disabled { opacity: .45; cursor: not-allowed; }
  button.primary:disabled[data-done] { opacity: .6; }

  pre {
    margin: .8rem 0 0; padding: .7rem .8rem; max-height: 26rem; overflow: auto;
    background: #f7f9fc; border: 1px solid #dbe4f0; border-radius: 4px;
    font-family: var(--mono); font-size: .76rem; line-height: 1.5; white-space: pre-wrap;
  }
  pre .label {
    display: block; font-family: inherit; font-size: .68rem; letter-spacing: .04em;
    text-transform: uppercase; color: var(--accent); margin-bottom: .35rem; font-weight: 600;
  }
  pre .label code { font-family: var(--mono); text-transform: none; letter-spacing: 0; }
  pre .label a { color: inherit; text-transform: none; letter-spacing: 0; border-bottom: 1px dotted currentColor; text-decoration: none; }
  pre.bad { background: #fdf6f6; border-color: #eccfcf; }
  /* A scenario's steps: what each called, what came back, what it checked. */
  ol.scenario-steps { padding-left: 1.2rem; margin: .8rem 0 0; }
  ol.scenario-steps > li { margin: 0 0 .9rem; }
  .scenario-steps .step-head { display: flex; gap: .5rem; align-items: baseline; flex-wrap: wrap; }
  .scenario-steps .mark { font-weight: 700; width: 1rem; }
  .scenario-steps .mark.passed { color: var(--ok); }
  .scenario-steps .mark.failed { color: var(--bad); }
  .scenario-steps .mark.pending { color: var(--muted); }
  .scenario-steps .call { font-family: var(--mono); font-size: .8rem; color: var(--accent); }
  .scenario-steps .checks { list-style: none; padding: 0; margin: .3rem 0 0; font-family: var(--mono); font-size: .78rem; }
  .scenario-steps .checks .passed { color: var(--ok); }
  .scenario-steps .checks .failed { color: var(--bad); }
  .scenario-steps details { margin-top: .3rem; font-size: .8rem; }
  pre.bad .label { color: var(--bad); }

  .empty { color: var(--faint); font-size: .9rem; }
  @media (max-width: 60rem) {
    #shell { grid-template-columns: 1fr; }
    #groups { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header id="masthead">
  <div class="intro">
    <h1>Not your average Mock Server</h1>
    <p class="lede">
      An entire server, generated from a set of contracts, running in this tab.
      <b>No custom code.</b> Everything is derived on the fly when the server
      boots. Change a contract and the API changes with it; hand it a different
      contract set and it is a different system.
    </p>
    <div id="controls">
      <button id="mode" class="primary">Let me explore</button>
      <button id="scenarios">Scenarios</button>
      <span class="sep"></span>
      <button id="reseed">Restart with data</button>
      <button id="empty">Start empty</button>
    </div>
  </div>
  <div id="derived">starting…</div>
</header>

<div id="shell">
  <nav id="groups" aria-label="Operations"></nav>
  <main id="stage"></main>
</div>

er of items to return (1-100).","schema":{"type":"integer","minimum":1,"maximum":100,"default":25}},"OffsetParam":{"name":"offset","in":"query","description":"Number of items to skip before collecting results.","schema":{"type":"integer","minimum":0,"default":0}},"SearchQueryParam":{"name":"q","in":"query","required":false,"schema":{"type":"string"},"description":"Search query using field:value syntax. Multiple conditions separated by\nspaces are ANDed together.\n\n**URL Encoding:** This parameter must be URL-encoded when sent over HTTP.\nMost HTTP clients handle this automatically. Examples in this documentation\nshow human-readable syntax for clarity.\n\n## Syntax\n\n| Pattern | Description | Example |\n|---------|-------------|---------|\n| `term` | Full-text exact match | `john` |\n| `*term*` | Full-text contains | `*john*` |\n| `term*` | Full-text starts with | `john*` |\n| `*term` | Full-text ends with | `*smith` |\n| `field:value` | Exact match on field | `status:approved` |\n| `field:*value*` | Contains (case-insensitive) | `name:*john*` |\n| `field:value*` | Starts with | `name:john*` |\n| `field:*value` | Ends with | `email:*@example.com` |\n| `field:\"value\"` | Quoted value (for spaces) | `name:\"john doe\"` |\n| `field.nested:value` | Nested field (dot notation) | `address.state:CA` |\n| `field:>value` | Greater than | `income:>1000` |\n| `field:>=value` | Greater than or equal | `income:>=1000` |\n| `field:\u003cvalue` | Less than | `income:\u003c5000` |\n| `field:\u003c=value` | Less than or equal | `income:\u003c=5000` |\n| `field:val1,val2` | Match any value (OR) | `status:approved,pending` |\n| `-field:value` | Exclude / negate | `-status:denied` |\n| `field:*` | Field exists (not null) | `email:*` |\n| `-field:*` | Field does not exist | `-deletedAt:*` |\n\n## Examples\n\n- `john` — exact match for \"john\" in searchable fields\n- `*john*` — contains \"john\" in searchable fields\n- `name:*smith*` — name contains \"smith\" (case-insensitive)\n- `email:*@example.com` — email ends with \"@example.com\"\n- `status:approved` — exact match on status field\n- `status:approved,pending` — status is \"approved\" OR \"pending\"\n- `income:>=1000` — income greater than or equal to 1000\n- `created:>2024-01-01` — created after January 1, 2024\n- `status:approved income:>=1000` — approved AND income >= 1000 (multiple conditions)\n- `-status:denied` — exclude records with status \"denied\"\n- `-deletedAt:*` — only records where deletedAt does not exist\n- `applicant.state:CA` — nested field filter\n\n## URL Encoding Reference\n\nWhen manually constructing URLs, encode these characters:\n\n| Character | Encoded |\n|-----------|---------|\n| (space) | `%20` or `+` |\n| `\"` | `%22` |\n| `:` | `%3A` |\n| `>` | `%3E` |\n| `\u003c` | `%3C` |\n| `,` | `%2C` |\n\n**Example:**\n```\nHuman-readable: q=status:approved income:>=1000\nURL-encoded:    q=status%3Aapproved%20income%3A%3E%3D1000\n```\n","examples":{"simpleSearch":{"summary":"Full-text exact match","value":"john"},"containsSearch":{"summary":"Full-text contains","value":"*john*"},"exactMatch":{"summary":"Filter by status","value":"status:approved"},"containsField":{"summary":"Name contains (case-insensitive)","value":"name:*smith*"},"startsWithField":{"summary":"Name starts with","value":"name:john*"},"endsWithField":{"summary":"Email ends with domain","value":"email:*@example.com"},"multipleFilters":{"summary":"Status and income filter","value":"status:approved income:>=1000"},"dateRange":{"summary":"Created after date","value":"created:>2024-01-01"},"multiValue":{"summary":"Multiple statuses (OR)","value":"status:approved,pending,under_review"},"negation":{"summary":"Exclude denied","value":"-status:denied"},"notExists":{"summary":"Field does not exist","value":"-deletedAt:*"},"nestedField":{"summary":"Filter by nested field","value":"applicant.state:CA"}}},"SortParam":{"name":"sort","in":"query","required":false,"schema":{"type":"string"},"description":"Comma-separated mas/RegistryType"}}}}]},"RegistryEntry":{"type":"object","required":["id","description"],"additionalProperties":true,"description":"An entry, with its id and the fields its type defines.","properties":{"id":{"type":"string","description":"The entry's stable id."},"description":{"type":"string","description":"Human-readable text for the entry."},"deprecated":{"type":"boolean","description":"When true, the entry should not be newly referenced."}}},"RegistryEntryList":{"description":"Paginated list of registry entries.","allOf":[{"$ref":"../../components/pagination.yaml#/Pagination"},{"type":"object","required":["items"],"properties":{"items":{"type":"array","items":{"$ref":"#/components/schemas/RegistryEntry"}}}}]}}}}},{"relativePath":"base/domains/transcription/transcription-config-schema.yaml","domain":"transcription","type":"schema","content":{"$schema":"https://json-schema.org/draft/2020-12/schema","$id":"https://blueprint.codeforamerica.org/base/domains/transcription/transcription-config-schema.yaml","title":"Transcription Config","domain":"transcription","description":"Schema for transcription-config.yaml. Validates the profile catalog's entries.","allOf":[{"$ref":"https://blueprint.codeforamerica.org/schemas/config-schema.yaml"}],"type":"object","properties":{"domain":{"const":"transcription","description":"Must be \"transcription\"."},"profiles":{"type":"object","description":"Profile catalog: the transcription service and languages to use for each kind of conversation. Seeded where they do not exist yet; afterwards they are changed through the API, and never deleted.\n","required":["resource","entries"],"additionalProperties":false,"properties":{"resource":{"const":"TranscriptionProfile"},"entries":{"type":"array","items":{"$ref":"#/$defs/ProfileConfig"}}}}},"unevaluatedProperties":false,"$defs":{"ProfileConfig":{"type":"object","description":"A profile, as the TranscriptionProfile resource has it.","required":["id","name","provider"],"additionalProperties":f rofile.created","summary":"A TranscriptionProfile was created. Carries the record as created.","payload":{"$ref":"#/components/schemas/TranscriptionTranscriptionProfileCreatedEvent"}},"TranscriptionTranscriptionProfileUpdated":{"name":"transcription.transcription_profile.updated","summary":"A TranscriptionProfile was changed. Carries each changed field, before and after.","payload":{"$ref":"#/components/schemas/TranscriptionTranscriptionProfileUpdatedEvent"}},"TranscriptionTranscriptPaused":{"name":"transcription.transcript.paused","summary":"The conversation went off the record. Anything said until it resumes is not stored.","payload":{"$ref":"#/components/schemas/TranscriptionTranscriptPausedEvent"}},"TranscriptionTranscriptResumed":{"name":"transcription.transcript.resumed","summary":"The conversation is back on the record.","payload":{"$ref":"#/components/schemas/TranscriptionTranscriptResumedEvent"}},"TranscriptionTranscriptClosed":{"name":"transcription.transcript.closed","summary":"The transcript has ended.","payload":{"$ref":"#/components/schemas/TranscriptionTranscriptClosedEvent"}}},"schemas":{"TranscriptionTranscriptCreatedEvent":{"allOf":[{"$ref":"../../schemas/events.yaml#/$defs/Event"},{"type":"object","properties":{"type":{"type":"string","const":"transcription.transcript.created"},"data":{"$ref":"./transcription-transcripts-openapi.yaml#/components/schemas/Transcript"}}}]},"TranscriptionTranscriptUpdatedEvent":{"allOf":[{"$ref":"../../schemas/events.yaml#/$defs/Event"},{"type":"object","properties":{"type":{"type":"string","const":"transcription.transcript.updated"},"data":{"$ref":"../../schemas/events.yaml#/ResourceUpdatedEvent"}}}]},"TranscriptionTranscriptDeletedEvent":{"allOf":[{"$ref":"../../schemas/events.yaml#/$defs/Event"},{"type":"object","properties":{"type":{"type":"string","const":"transcription.transcript.deleted"},"data":{"$ref":"../../schemas/events.yaml#/ResourceDeletedEvent"}}}]},"TranscriptionTranscriptEntryCreatedEvent":{"allOf":[{"$ref":"../../schemas/events.yaml#/$defs/Event"},{"type":"object","properties":{"type":{"type":"string","const":"transcription.transcript_entry.created"},"data":{"$ref":"./transcription-transcripts-openapi.yaml#/components/schemas/TranscriptEntry"}}}]},"TranscriptionTranscriptEntryUpdatedEvent":{"allOf":[{"$ref":"../../schemas/events.yaml#/$defs/Event"},{"type":"object","properties":{"type":{"type":"string","const":"transcription.transcript_entry.updated"},"data":{"$ref":"../../schemas/events.yaml#/ResourceUpdatedEvent"}}}]},"TranscriptionTranscriptionProfileCreatedEvent":{"allOf":[{"$ref":"../../schemas/events.yaml#/$defs/Event"},{"type":"object","properties":{"type":{"type":"string","const":"transcription.transcription_profile.created"},"data":{"$ref":"./transcription-transcripts-openapi.yaml#/components/schemas/TranscriptionProfile"}}}]},"TranscriptionTranscriptionProfileUpdatedEvent":{"allOf":[{"$ref":"../../schemas/events.yaml#/$defs/Event"},{"type":"object","properties":{"type":{"type":"string","const":"transcription.transcription_profile.updated"},"data":{"$ref":"../../schemas/events.yaml#/ResourceUpdatedEvent"}}}]},"TranscriptionTranscriptPausedEvent":{"allOf":[{"$ref":"../../schemas/events.yaml#/$defs/Event"},{"type":"object","properties":{"type":{"type":"string","const":"transcription.transcript.paused"}}}]},"TranscriptionTranscriptResumedEvent":{"allOf":[{"$ref":"../../schemas/events.yaml#/$defs/Event"},{"type":"object","properties":{"type":{"type":"string","const":"transcription.transcript.resumed"}}}]},"TranscriptionTranscriptClosedEvent":{"allOf":[{"$ref":"../../schemas/events.yaml#/$defs/Event"},{"type":"object","properties":{"type":{"type":"string","const":"transcription.transcript.closed"}}}]}}}}},{"relativePath":"base/domains/transcription/transcription-transcripts-openapi.yaml","domain":"transcription","type":"openapi","content":{"openapi":"3.1.0","info":{"title":"Transcripts","version":"0.1.0","x-domain":"transcription","x-status":"alpha","x-visibility":"internal","description":"The written record of a conversation. Starting a transcript opens it for\nrecording; pausing takes the conversation off the record; closing ends it.\nA transcript refers to what it records — an interview, a call — and names\nthe profile it was started under, which says the transcription service,\nand the client and model that produced its lines. Updating corrects what\nit records; deleting removes it, and the event left behind says which one\nand by whom.\n\nA profile is a state's choice of transcription service and languages for\na kind of conversation. The deployment's config seeds them; they can be\nadded and changed here, never deleted, so every transcript's profile\nstill exists.\n\nIts entries are its timeline, in the order things happened: lines, gaps\nwhere nothing was captured, and pauses. Every time on a transcript and its\nentries is the client's — when it started, paused, resumed and closed, and\nwhen each line was said — so they are compared on one clock.\n"},"servers":[{"url":"https://api.example.com/transcription","description":"Production server"},{"url":"http://localhost:1080/transcription","description":"Local development server"}],"tags":[{"name":"Transcripts","description":"The written record of a conversation."},{"name":"Transcript entries","description":"A transcript's timeline — lines, gaps and pauses."},{"name":"Transcription profiles","description":"The transcription service and languages to use for a kind of conversation."}],"paths":{"/transcripts":{"get":{"summary":"List transcripts","description":"Retrieve a paginated list of transcripts. Filter by `subjectId` to find\nthe transcripts of one interview or call.\n","operationId":"listTranscripts","tags":["Transcripts"],"x-sortable":{"fields":["createdAt"],"default":"-createdAt","tieBreaker":"id"},"parameters":[{"$ref":"../../components/parameters.yaml#/SearchQueryParam"},{"$ref":"../../components/parameters.yaml#/LimitParam"},{"$ref":"../../components/parameters.yaml#/OffsetParam"},{"$ref":"../../components/parameters.yaml#/SortParam"}],"responses":{"200":{"description":"A paginated collection of transcripts.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/TranscriptList"}}}},"400":{"$ref":"../../components/responses.yaml#/BadRequest"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}},"post":{"summary":"Start a transcript","description":"Start recording a conversation, under a profile. The transcript begins\nin `recording`. It is refused when the profile does not exist, or when\nthe profile names a transcription service and no `model` is given.\n","operationId":"createTranscript","tags":["Transcripts"],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/TranscriptCreate"}}}},"responses":{"201":{"description":"Transcript started.","headers":{"Location":{"description":"URL of the new transcript.","schema":{"type":"string","format":"uri"}}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/Transcript"}}}},"400":{"$ref":"../../components/responses.yaml#/BadRequest"},"409":{"description":"The transcript is refused: its profile does not exist, or the\nprofile names a transcription service and no `model` was given.\n","content":{"application/json":{"schema":{"$ref":"../../components/responses.yaml#/Error"}}}},"422":{"$ref":"../../components/responses.yaml#/UnprocessableEntity"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}}},"/transcripts/{transcriptId}":{"parameters":[{"$ref":"#/components/parameters/TranscriptIdParam"}],"get":{"summary":"Get a transcript","description":"Retrieve a single transcript by identifier.","operationId":"getTranscript","tags":["Transcripts"],"responses":{"200":{"description":"Transcript retrieved successfully.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Transcript"},"examples":{"TranscriptExample1":{"$ref":"#/components/examples/TranscriptExample1"}}}}},"404":{"$ref":"../../components/responses.yaml#/NotFound"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}},"patch":{"summary":"Update a transcript","description":"Correct what a transcript records — its subject, model or client. Its\nprofile does not change, and its status changes only through `pause`,\n`resume` and `close`.\n","operationId":"updateTranscript","tags":["Transcripts"],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/TranscriptUpdate"}}}},"responses":{"200":{"description":"Transcript updated.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Transcript"}}}},"400":{"$ref":"../../components/responses.yaml#/BadRequest"},"404":{"$ref":"../../components/responses.yaml#/NotFound"},"422":{"$ref":"../../components/responses.yaml#/UnprocessableEntity"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}},"delete":{"summary":"Delete a transcript","description":"Permanently remove a transcript. The `transcription.transcript.deleted`\nevent records which transcript was removed and who removed it.\n","operationId":"deleteTranscript","tags":["Transcripts"],"responses":{"204":{"description":"Transcript deleted."},"404":{"$ref":"../../components/responses.yaml#/NotFound"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}}},"/transcripts/{transcriptId}/entries":{"parameters":[{"$ref":"#/components/parameters/TranscriptIdParam"}],"get":{"summary":"List a transcript's entries","description":"A transcript's timeline, in the order things happened — by `startedAt`.\nFilter by `kind` for only its lines, gaps or pauses.\n","operationId":"listTranscriptEntries","tags":["Transcript entries"],"x-sortable":{"fields":["startedAt"],"default":"startedAt","tieBreaker":"id"},"parameters":[{"$ref":"../../components/parameters.yaml#/LimitParam"},{"$ref":"../../components/parameters.yaml#/OffsetParam"},{"$ref":"../../components/parameters.yaml#/SortParam"},{"name":"kind","in":"query","description":"Only entries of this kind.","schema":{"$ref":"#/components/schemas/TranscriptEntryKind"}}],"responses":{"200":{"description":"The transcript's entries, in the order things happened.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/TranscriptEntryList"}}}},"400":{"$ref":"../../components/responses.yaml#/BadRequest"},"404":{"$ref":"../../components/responses.yaml#/NotFound"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}},"post":{"summary":"Add an entry to a transcript","description":"Add a finished line, or a gap where nothing was captured. Pauses are not\nadded here: pausing the transcript adds one.\n\nSend an `Idempotency-Key` with every add, and the same key when retrying\none, so a retry is not a second line. The transcript refuses an entry\nthat started while it was paused or after it closed, an entry that ends\nbefore it starts, and a gap that overlaps a pause.\n","operationId":"addTranscriptEntry","tags":["Transcript entries"],"parameters":[{"$ref":"../../components/parameters.yaml#/IdempotencyKeyParam"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/TranscriptEntryCreate"}}}},"responses":{"201":{"description":"Entry added.","headers":{"Location":{"description":"URL of the new entry.","schema":{"type":"string","format":"uri"}}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/TranscriptEntry"}}}},"400":{"$ref":"../../components/responses.yaml#/BadRequest"},"403":{"$ref":"../../components/responses.yaml#/Forbidden"},"404":{"$ref":"../../components/responses.yaml#/NotFound"},"409":{"description":"The transcript refuses the entry: it started while the transcript\nwas paused or after it closed, it ends before it starts, or it is a\ngap overlapping a pause.\n","content":{"application/json":{"schema":{"$ref":"../../components/responses.yaml#/Error"}}}},"422":{"description":"The entry is not valid, or its `Idempotency-Key` was already used\nfor a different request.\n","content":{"application/json":{"schema":{"$ref":"../../components/responses.yaml#/Error"}}}},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}}},"/transcripts/{transcriptId}/entries/{entryId}":{"parameters":[{"$ref":"#/components/parameters/TranscriptIdParam"},{"$ref":"#/components/parameters/TranscriptEntryIdParam"}],"get":{"summary":"Get a transcript entry","description":"Retrieve a single entry by identifier.","operationId":"getTranscriptEntry","tags":["Transcript entries"],"responses":{"200":{"description":"Entry retrieved successfully.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/TranscriptEntry"}}}},"404":{"$ref":"../../components/responses.yaml#/NotFound"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}},"patch":{"summary":"End a pause entry","description":"Set when a pause ended. Only the system may — resuming or closing the\ntranscript does it. Nothing else about an entry changes once it is\nwritten, and entries are never deleted.\n","operationId":"updateTranscriptEntry","tags":["Transcript entries"],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/TranscriptEntryUpdate"}}}},"responses":{"200":{"description":"Entry updated.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/TranscriptEntry"}}}},"403":{"$ref":"../../components/responses.yaml#/Forbidden"},"404":{"$ref":"../../components/responses.yaml#/NotFound"},"422":{"$ref":"../../components/responses.yaml#/UnprocessableEntity"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}}},"/profiles":{"get":{"summary":"List transcription profiles","description":"Retrieve a paginated list of profiles, by name.","operationId":"listTranscriptionProfiles","tags":["Transcription profiles"],"x-sortable":{"fields":["name","createdAt"],"default":"name","tieBreaker":"id"},"parameters":[{"$ref":"../../components/parameters.yaml#/Se ne's state IDs) via the x-enum-source extension, rather than hardcoded in the OpenAPI spec. Exercises the resolver's x-enum-source injection.\n"},"nullable-state-gated-field":{"description":"Nullable field that is only present after a lifecycle transition (e.g., a timestamp set when an application is submitted). Exercises nullable field rendering and the pattern of state-gated fields.\n"},"nullable-conditional-field":{"description":"Nullable field whose presence depends on another field's value (e.g., a benefit amount present only when eligible is true). Exercises nullable field handling and conditional presence patterns.\n"},"external-ref-shared-defs":{"description":"External $ref to a shared $defs schema in a separate file. Exercises the resolver's cross-file $ref resolution and the explorer's external schema name rendering.\n"},"external-ref-defs-oneof":{"description":"External $ref to a $defs schema that is itself a oneOf with a discriminator. Exercises: (1) cross-file $ref resolution, (2) discriminated union rendering with labeled variants, (3) field inventory handling of oneOf inside an external $defs ref.\n"},"allof-inline-required":{"description":"allOf composition that adds inline required fields without duplicating properties (e.g., a Create variant that adds a required field to a base schema). Exercises the resolver's allOf merging and the explorer's allOf rendering.\n"},"paginated-list":{"description":"Collection endpoint returning items/total/limit/offset/hasNext. The standard blueprint pagination envelope. Exercises paginated list rendering and parameter validation (limit, offset, sort, search).\n"},"sub-resource":{"description":"Resource nested under a parent at a path like /parents/{id}/children. Full CRUD scoped to the parent. Exercises nested routing, parent FK validation, and sub-resource list/detail rendering in the explorer.\n"},"singleton-sub-resource":{"description":"Single resource nested under a parent at a path like /parents/{id}/summary, with no item-level ID. Accessed only through the parent. Exercises singleton sub-resource routing and composition rendering.\n"},"intra-domain-fk":{"description":"Intra-domain x-relationship foreign key linking a sub-resource back to its parent resource within the same domain. Exercises cross-reference rendering in the explorer and FK validation.\n"},"cross-domain-fk":{"description":"Cross-domain x-relationship foreign key linking a resource in one domain to a resource in another. Exercises cross-domain reference rendering and FK validation across domain boundaries.\n"},"rpc-state-machine-action":{"description":"RPC-style state machine action with a generated POST endpoint. Exercises the RPC overlay generator, x-relationship tagging, and state machine → API cross-linking in the explorer.\n"},"state-machine-guard":{"description":"Named boolean condition (CEL expression) attached to a state machine action. The action can only be triggered when all guard conditions pass. Exercises guard evaluation, actor role checking, and guard composition (any/all).\n"},"state-machine-timer":{"description":"Timer declaration on a state machine. The scheduling service emits a callback event ({domain}.{id}) when the timer fires; the machine subscribes to react. Exercises timer declaration rendering and the timer → event subscription link.\n"},"state-machine-subscription":{"description":"State machine subscribing to a domain event emitted by a different domain. The handler runs steps (create, emit, call) automatically when the event arrives. Exercises cross-domain event subscription and handler rendering.\n"},"state-machine-event":{"description":"Domain event emitted on a state machine transition. Exercises AsyncAPI event catalog generation and event → state machine cross-linking.\n"},"cross-domain-event":{"description":"Domain event consumed by downstream domains outside the emitting domain. Exercises event catalog cross-domain consumer rendering.\n"},"composition":{"description":"Read-only singleton resource assembled from fields across multiple resources, generated from a compositions contract. Produces a GET endpoint nested under the parent resource (e.g. /applications/{id}/summary). Exercises the composition generator, x-relationship injection, and singleton rendering in the explorer.\n"},"overlay":{"description":"Field or element added or modified by an adopter overlay. Overlays add state-required fields, tighten enums, and set global configuration (x-casing, x-pagination, x-search, x-relationship, x-event-type-prefix). Exercises the overlay resolver and adopter-level customization patterns.\n"},"ruleset-output-fact":{"description":"Output fact from a ruleset — a fact declared in the outputs list and returned by the REST endpoint. Exercises the rules engine → API endpoint link in the explorer (Rules badge).\n"},"ruleset-intermediate-fact":{"description":"Intermediate fact used internally by other facts but not returned by the REST endpoint. Exercises fact graph dependency rendering in the rules-docs visualizer.\n"},"array-of-oneof":{"description":"Array whose items are a oneOf discriminated union (e.g., EvaluationResult returning EvaluationFact variants). Exercises array-of-oneOf rendering, discriminator label resolution, and schema variant expansion.\n"}}}},{"relativePath":"domains/platform/platform-registry-policies.yaml","domain":"platform","type":"registry","content":{"$schema":"registry-schema.yaml","version":"1.0.0","domain":"platform","type":"policies","entries":{"snap-application-acceptance":{"citation":"7 CFR § 273.2(c)","description":"SNAP application acceptance requirements — agencies must accept applications on the day of initial contact and must not discourage or delay submission.\n"},"snap-right-to-apply":{"citation":"7 CFR § 273.2(a)","description":"SNAP right-to-apply — any household wishing to participate must be allowed to file an application, and the filing date establishes the benefit month.\n"},"snap-processing-clock":{"citation":"7 CFR § 273.2(g)","description":"SNAP application processing standards — 30-day processing clock from date of filing; expedited service within 7 days for qualifying households.\n"},"medicaid-processing-clock":{"citation":"42 CFR § 435.912","description":"Medicaid application processing standards — 45-day processing clock for most applicants; 90 days for disability-based applicants.\n"},"snap-notice-of-action":{"citation":"7 CFR § 273.13","description":"SNAP notice of adverse action — agencies must provide timely and adequate written notice before reducing, suspending, or terminating benefits.\n"},"snap-notice-of-eligibility":{"citation":"7 CFR § 273.10(g)","description":"SNAP notice of eligibility determination — written notice of approval or denial with reason, rights, and certification period.\n"},"medicaid-notice-of-eligibility":{"citation":"42 CFR § 435.917","description":"Medicaid notice of eligibility determination — written notice of approval or denial with reason, appeal rights, and effective date.\n"},"snap-fair-hearing-rights":{"citation":"7 CFR § 273.15","description":"SNAP fair hearing rights — households have the right to request a fair hearing within 90 days of any adverse action notice.\n"},"snap-interview-toolkit":{"citation":"FNS-1104 (March 2023, revised June 2025)","description":"FNS SNAP Interview Toolkit — six essential interview functions, probe triggers for inconsistency flags, verification requirements, and interview conclusion standards.\n"},"snap-general-work-requirement":{"citation":"7 CFR § 273.7","description":"SNAP general work requirements — able-bodied adults aged 16–59 must register for work, accept suitable employment, and participate in assigned employment and training programs. Exemptions include physical/mental incapacity, caregiving, school enrollment, and participation in other programs.\n"},"snap-abawd-work-requirement":{"citation":"7 CFR § 273.24","description":"SNAP able-bodied adults without dependents (ABAWD) work requirement — individuals aged 18–54 without dependents are limited to 3 months of benefits in any 36-month period unless they meet work, exemption, or waiver criteria.\n"},"snap-student-eligibility":{"citation":"7 CFR § 273.5","description":"SNAP eligibility rules for students enrolled at least half-time in higher education — generally ineligible unless they meet one of the statutory exceptions (employment, work-study, dependent care, TANF participation, etc.).\n"},"snap-expedited-processing":{"citation":"7 CFR § 273.2(i)","description":"SNAP expedited service — households with gross monthly income below $150 and liquid resources below $100 (or migrant/seasonal farmworkers) must receive benefits within 7 days of application.\n"},"snap-expedited-screening":{"citation":"7 CFR § 273.2(i)(1)","description":"SNAP expedited screening criteria — agencies must screen all applications on the day of receipt and identify households entitled to expedited service.\n"},"qualified-alien-eligibility":{"citation":"7 CFR § 273.4","description":"SNAP eligibility for non-citizens — only qualified aliens are eligible; status categories include LPRs, refugees, asylees, and other federally defined categories with varying waiting periods.\n"},"prwora-sponsor-deeming":{"citation":"8 U.S.C. § 1631","description":"PRWORA sponsor income deeming — income and resources of a sponsor who signed an I-864 Affidavit of Support on or after December 19, 1997 are deemed available to the sponsored non-citizen for SNAP purposes.\n"},"snap-household-composition":{"citation":"7 CFR § 273.1","description":"SNAP household composition rules — defines who must be included in a SNAP household, including mandatory household members, separate household rules, and treatment of boarders, roommates, and institutionalized individuals.\n"},"snap-income-verification":{"citation":"7 CFR § 273.2(f)","description":"SNAP income verification requirements — agencies must verify earned and unearned income at application and recertification, including acceptable documentary evidence and collateral contact standards.\n"},"snap-elderly-disabled-deductions":{"citation":"7 CFR § 273.9(d)","description":"SNAP deductions for elderly and disabled households — households with an elderly or disabled member may claim excess medical expense deductions and are exempt from the gross income test.\n"},"snap-benefit-calculation":{"citation":"7 CFR § 273.10","description":"SNAP benefit calculation — net monthly income is used to determine benefit allotment; benefit equals 30% of net income subtracted from the maximum allotment for household size.\n"},"chip-age-eligibility":{"citation":"42 CFR § 457.310","description":"CHIP age eligibility — states must define an upper age limit for CHIP eligibility (up to age 19), and may extend coverage to unborn children and former foster youth up to age 26 under state plan options.\n"},"medicaid-caretaker-relative":{"citation":"42 CFR § 435.110","description":"Medicaid caretaker relative eligibility — states must provide Medicaid to caretaker relatives of dependent children who meet income and resource standards, including parents and other adults who are the primary caregiver.\n"},"medicaid-cost-sharing":{"citation":"42 CFR § 447.50","description":"Medicaid cost sharing — limits on premiums, copayments, and other cost sharing for Medicaid enrollees, including aggregate limits by income level and prohibition on cost sharing for certain populations and services.\n"},"medicaid-determination-documentation":{"citation":"42 CFR § 435.940","description":"Medicaid eligibility verification — agencies must verify eligibility factors through electronic data sources before requesting documentation from applicants; paper documentation may be requested only when electronic verification is unavailable.\n"}}}},{"relativePath":"domains/platform/platform-state-machine.yaml","domain":null,"type":"state-machine","content":{"$schema":"state-machine-schema.yaml","version":"1.0","procedures":[{"id":"requestTimer","description":"Request a time-based callback from the scheduling service. Pass fireAfter (a duration) or fireAt (an absolute timestamp), and a callback naming the event to publish when it elapses. Nothing here waits: the request is an event, and whatever provides scheduling answers it — in a deployment a scheduler, in a test a mock stub, which is what makes a 72-hour deadline testable in a second.\n","parameters":["timerId","callback","fireAfter","fireAt"],"emit":{"type":"scheduling.timer.requested","subject":"$object.id","data":{"timerId":"$params.timerId","fireAfter":"$params.fireAfter","fireAt":"$params.fireAt","callback":"$params.callback"}}}]}},{"relativePath":"domains/scheduling/scheduling-asyncapi.yaml","domain":"scheduling","type":"asyncapi","content":{"asyncapi":"3.0.0","info":{"title":"Scheduling Domain Events","version":"0.1.0","x-status":"draft","x-domain":"scheduling","description":"The timer request channel, which is the whole scheduling surface this\nfixture needs. A domain asks for a time-based callback by publishing\n`scheduling.timer.requested` with the event to fire when it elapses;\nwhatever provides scheduling answers it. Nothing in this contract set\nimplements a scheduler, which is the point — the mock server's timer stub\nstands in, so a deadline measured in days is exercised in a second.\n"},"channels":{"scheduling.timer.requested":{"address":"scheduling.timer.requested","messages":{"timerRequested":{"$ref":"#/components/messages/TimerRequestedMessage"}}}},"components":{"messages":{"TimerRequestedMessage":{"name":"scheduling.timer.requested","summary":"Emitted by the platform requestTimer procedure. A scheduler registers the timer and publishes the callback event on expiry.\n","payload":{"$ref":"#/components/schemas/TimerRequestedEvent"}}},"schemas":{"TimerRequestedEvent":{"allOf":[{"$ref":"../../base/schemas/events.yaml#/$defs/Event"},{"type":"object","properties":{"type":{"type":"string","const":"scheduling.timer.requested"}}}]}}}}},{"relativePath":"scenarios/transcript-lifecycle.arazzo.yaml","domain":"transcription","type":"arazzo","content":{"arazzo":"1.0.1","info":{"title":"A transcript, from start to close","version":"1.0.0","x-domain":"transcription","description":"The interview software a caseworker uses transcribes an interview. An\nadministrator adds the profile it runs under. The software starts a\ntranscript under that profile, adds lines — retrying one — pauses when the\napplicant asks to go off the record, and closes it at the end. Along the\nway the transcript refuses to start without a model or under a profile that\ndoes not exist; keeps a line said just before the pause; and refuses a line\nsaid during it, a lost stretch overlapping it, a line after the close, and\nthe software editing an entry. Every time is by the software's clock.\n"},"sourceDescriptions":[{"name":"transcripts","url":"../base/domains/transcription/transcription-transcripts-openapi.yaml","type":"openapi"}],"components":{"parameters":{"caller":{"name":"X-Caller-Id","in":"header","value":"worker-1"},"transcript":{"name":"transcriptId","in":"path","value":"$steps.start.outputs.id"}}},"workflows":[{"workflowId":"transcriptLifecycle","summary":"Start, record, pause, resume and close a transcript, and see what it refuses.","steps":[{"stepId":"addProfile","description":"An administrator adds the profile interviews in English run under.","operationId":"createTranscriptionProfile","parameters":[{"name":"X-Caller-Id","in":"header","value":"admin-1"}],"requestBody":{"payload":{"name":"english-interview","provider":"aws-transcribe","languages":["en-US"]}},"successCriteria":[{"condition":"$statusCode == 201"},{"condition":"$response.body#/source == 'user'"}],"outputs":{"id":"$response.body#/id"}},{"stepId":"startWithoutAModel","description":"A transcript under a profile with a transcription service has to say which model produced its lines.","operationId":"createTranscript","parameters":[{"reference":"$components.parameters.caller"}],"requestBody":{"payload":{"profileId":"$steps.addProfile.outputs.id","client":"interview-assistant/0.1.0","startedAt":"2026-10-12T10:00:00Z"}},"successCriteria":[{"condition":"$statusCode == 409"}]},{"stepId":"startUnderAMissingProfile","description":"A transcript is started under a profile that exists.","operationId":"createTranscript","parameters":[{"reference":"$components.parameters.caller"}],"requestBody":{"payload":{"profileId":"00000000-0000-4000-8000-000000000000","model":"standard","client":"interview-assistant/0.1.0","startedAt":"2026-10-12T10:00:00Z"}},"successCriteria":[{"condition":"$statusCode == 409"}]},{"stepId":"start","description":"The caseworker starts a transcript of the interview.","operationId":"createTranscript","parameters":[{"reference":"$components.parameters.caller"}],"requestBody":{"payload":{"profileId":"$steps.addProfile.outputs.id","model":"standard","client":"interview-assistant/0.1.0","startedAt":"2026-10-12T10:00:00Z"}},"successCriteria":[{"condition":"$statusCode == 201"},{"condition":"$response.body#/status == 'recording'"},{"condition":"$response.body#/profileId == $steps.addProfile.outputs.id"}],"outputs":{"id":"$response.body#/id"}},{"stepId":"firstLine","description":"The first finished line arrives.","operationId":"addTranscriptEntry","parameters":[{"reference":"$components.parameters.caller"},{"reference":"$components.parameters.transcript"},{"name":"Idempotency-Key","in":"header","value":"line-1"}],"requestBody":{"payload":{"kind":"line","startedAt":"2026-10-12T10:00:05Z","endedAt":"2026-10-12T10:00:06Z","text":"Can you tell me who lives with you?","speaker":"staff"}},"successCriteria":[{"condition":"$statusCode == 201"}],"outputs":{"id":"$response.body#/id"}},{"stepId":"retryFirstLine","description":"The connection drops before the answer comes back, so the software sends the line again with the same key — and gets the same line, not a second one.","operationId":"addTranscriptEntry","parameters":[{"reference":"$components.parameters.caller"},{"reference":"$components.parameters.transcript"},{"name":"Idempotency-Key","in":"header","value":"line-1"}],"requestBody":{"payload":{"kind":"line","startedAt":"2026-10-12T10:00:05Z","endedAt":"2026-10-12T10:00:06Z","text":"Can you tell me who lives with you?","speaker":"staff"}},"successCriteria":[{"condition":"$statusCode == 201"},{"condition":"$response.body#/id == $steps.firstLine.outputs.id"},{"condition":"$response.header.Idempotent-Replayed == 'true'"}]},{"stepId":"pause","description":"The applicant asks to go off the record.","operationId":"pauseTranscript","parameters":[{"reference":"$components.parameters.caller"},{"reference":"$components.parameters.transcript"}],"requestBody":{"payload":{"at":"2026-10-12T10:00:10Z"}},"successCriteria":[{"condition":"$statusCode == 200"},{"condition":"$response.body#/status == 'paused'"}]},{"stepId":"lineSaidBeforeThePause","description":"A line said just before the pause arrives just after it. It started on the record, so it is kept.","operationId":"addTranscriptEntry","parameters":[{"reference":"$components.parameters.caller"},{"reference":"$components.parameters.transcript"},{"name":"Idempotency-Key","in":"header","value":"line-2"}],"requestBody":{"payload":{"kind":"line","startedAt":"2026-10-12T10:00:08Z","endedAt":"2026-10-12T10:00:11Z","text":"My two kids and my mother.","speaker":"client"}},"successCriteria":[{"condition":"$statusCode == 201"}]},{"stepId":"lineSaidDuringThePause","description":"A line said off the record is refused, even from faulty software.","operationId":"addTranscriptEntry","parameters":[{"reference":"$components.parameters.caller"},{"reference":"$components.parameters.transcript"},{"name":"Idempotency-Key","in":"header","value":"line-3"}],"requestBody":{"payload":{"kind":"line","startedAt":"2026-10-12T10:00:12Z","endedAt":"2026-10-12T10:00:13Z","text":"Off the record.","speaker":"client"}},"successCriteria":[{"condition":"$statusCode == 409"}]},{"stepId":"gapOverlappingThePause","description":"A lost stretch overlapping the pause is refused — the pause already accounts for that time.","operationId":"addTranscriptEntry","parameters":[{"reference":"$components.parameters.caller"},{"reference":"$components.parameters.transcript"},{"name":"Idempotency-Key","in":"header","value":"gap-1"}],"requestBody":{"payload":{"kind":"gap","startedAt":"2026-10-12T10:00:09Z","endedAt":"2026-10-12T10:00:11Z","cause":"connection"}},"successCriteria":[{"condition":"$statusCode == 409"}]},{"stepId":"resume","description":"Back on the record.","operationId":"resumeTranscript","parameters":[{"reference":"$components.parameters.caller"},{"reference":"$components.parameters.transcript"}],"requestBody":{"payload":{"at":"2026-10-12T10:00:20Z"}},"successCriteria":[{"condition":"$statusCode == 200"},{"condition":"$response.body#/status == 'recording'"}]},{"stepId":"lineSaidDuringThePastPause","description":"A late line from inside the pause that has ended is still refused.","operationId":"addTranscriptEntry","parameters":[{"reference":"$components.parameters.caller"},{"reference":"$components.parameters.transcript"},{"name":"Idempotency-Key","in":"header","value":"line-4"}],"requestBody":{"payload":{"kind":"line","startedAt":"2026-10-12T10:00:15Z","endedAt":"2026-10-12T10:00:16Z","text":"Still off the record.","speaker":"client"}},"successCriteria":[{"condition":"$statusCode == 409"}]},{"stepId":"timeline","description":"The timeline reads in the order things happened, with the pause in it.","operationId":"listTranscriptEntries","parameters":[{"reference":"$components.parameters.caller"},{"reference":"$components.parameters.transcript"}],"successCriteria":[{"condition":"$statusCode == 200"},{"condition":"$response.body#/total == 3"},{"condition":"$response.body#/items/2/kind == 'pause'"},{"condition":"$response.body#/items/2/endedAt == '2026-10-12T10:00:20Z'"}],"outputs":{"firstEntryId":"$response.body#/items/0/id"}},{"stepId":"clientEditsAnEntry","description":"Entries do not change — only the system may update one.","operationId":"updateTranscriptEntry","parameters":[{"reference":"$components.parameters.caller"},{"reference":"$components.parameters.transcript"},{"name":"entryId","in":"path","value":"$steps.timeline.outputs.firstEntryId"}],"requestBody":{"payload":{"endedAt":"2026-10-12T10:00:59Z"}},"successCriteria":[{"condition":"$statusCode == 403"}]},{"stepId":"close","description":"The interview ends.","operationId":"closeTranscript","parameters":[{"reference":"$components.parameters.caller"},{"reference":"$components.parameters.transcript"}],"requestBody":{"payload":{"at":"2026-10-12T10:00:30Z"}},"successCriteria":[{"condition":"$statusCode == 200"},{"condition":"$response.body#/status == 'closed'"}]},{"stepId":"lineAfterTheClose","description":"Nothing is added after the close.","operationId":"addTranscriptEntry","parameters":[{"reference":"$components.parameters.caller"},{"reference":"$components.parameters.transcript"},{"name":"Idempotency-Key","in":"header","value":"line-5"}],"requestBody":{"payload":{"kind":"line","startedAt":"2026-10-12T10:00:31Z","endedAt":"2026-10-12T10:00:32Z","text":"Too late.","speaker":"client"}},"successCriteria":[{"condition":"$statusCode == 409"}]}]}]}}]}</script>
<script type="module">
const { createMockServer, extract, generate, runScenario, operationIndex } =
  globalThis.BlueprintMock ?? await import('./mock.js');

const $ = (id) => document.getElementById(id);
const el = (tag, text = '', className = '') => {
  const node = document.createElement(tag);
  if (text !== '') node.textContent = text;
  if (className) node.className = className;
  return node;
};

/** Everything below the directory this page is served from. */
const basePath = location.pathname.replace(/\/[^/]*$/, '');

/** Where this checkout's contracts are browsable, if the build knew. */
const pageConfig = (() => {
  const tag = document.getElementById('page-config');
  try { return tag ? JSON.parse(tag.textContent) : {}; } catch { return {}; }
})();

let docs;          // every document in the set
let mock;          // the server derived from them
let seeded = true; // whether the last derive loaded the shipped records
let showAll = false;  // the walk-through, or the whole reference
// The contract set's Arazzo scenarios: whether they are what is showing, which
// one, and what its last run answered.
let scenarioMode = false;
let selectedScenario = null;
let scenarioRun = null;
const done = new Set(); // steps of the walk already run, by method and path
const made = new Map();  // collection → the id the walk created there
const built = new Map(); // schema name → the id the walk created of that shape
const answers = new Map(); // step → what it answered, so going back shows it
let selected = null;
// The reference's domain groups the reader has opened. The navigation is
// rebuilt on every click, and rebuilding from scratch used to collapse every
// group but the first — so picking an operation closed the one you were in.
let openDomains = null;
// What the reader picked for each path parameter, by operation and name, so a
// panel redrawn after a pick keeps it — and the parameters after it list the
// records under what was picked.
const chosen = new Map();
let transcript = false; // the whole walk at once, rather than a step at a time
let ran = 0;            // how long running it that way took
let ranCount = 0;       // how many of the steps that run actually sent

/**
 * The contract set, inlined by the single-file build or fetched beside the
 * page when it is served.
 */
const loadContracts = async () => {
  const inlined = document.getElementById('contracts-data');
  if (inlined) return JSON.parse(inlined.textContent);
  const response = await fetch('./contracts.json');
  if (!response.ok) throw new Error(`contracts.json: ${response.status}`);
  return response.json();
};

// Who the reference calls as, chosen above each request. The walk always
// calls as itself, so a choice made while exploring cannot break a step.
const WALK_CALLER = 'the-explorer';
const caller = { id: WALK_CALLER, type: 'user', roles: [] };

/**
 * The caller headers a request carries.
 *
 * The mock reads the kind of actor from the roles, so a kind other than
 * `user` goes in as one; an unauthenticated caller sends no identity at all.
 * A real deployment takes all of this from the sign-in token instead.
 */
const callerHeaders = () => {
  if (!showAll) return { 'X-Caller-Id': WALK_CALLER };
  const id = caller.id.trim();
  if (caller.type === 'unauthenticated' || !id) return {};
  const roles = caller.roles.filter((role) => role !== caller.type);
  if (caller.type !== 'user') roles.unshift(caller.type);
  return { 'X-Caller-Id': id, ...(roles.length ? { 'X-Caller-Roles': roles.join(',') } : {}) };
};

/** The kinds of actor an event can record, as the events contract lists them. */
const actorTypes = () => {
  const schema = docs.find((doc) => doc.type === 'schema' && doc.content?.$defs?.Event);
  const parts = schema?.content.$defs.Event.allOf ?? [];
  const authtype = parts.map((part) => part.properties?.authtype).find(Boolean);
  return (authtype?.enum ?? ['user']).filter((value) => value !== null);
};

/**
 * The roles a caller can hold: the set's RoleType, which its guards are
 * validated against. Empty when the set declares none.
 */
const roleTypes = () => {
  const schema = docs.find((doc) => Array.isArray(doc.content?.$defs?.RoleType?.enum));
  return schema?.content.$defs.RoleType.enum ?? [];
};

/**
 * Whether an operation takes an Idempotency-Key header — the shared
 * IdempotencyKeyParam, which an operation lists to require one per create.
 */
const takesIdempotencyKey = (op) => (op.operation?.parameters ?? [])
  .map((parameter) => deref(parameter, op.doc))
  .some((p) => p?.in === 'header' && typeof p.name === 'string' && p.name.toLowerCase() === 'idempotency-key');

/** The headers a step sends besides the caller's: a fresh key, where the operation takes one. */
const keyHeaders = (op, key = crypto.randomUUID()) =>
  takesIdempotencyKey(op) ? { 'Idempotency-Key': key } : {};

/**
 * The Idempotency-Key row: a fresh key each time the panel opens, which the
 * reader can type over — `12345` twice is how to see a retry answered with
 * the same entry, and `12345` with a different body how to see it refused.
 */
const idempotencyRow = () => {
  const row = el('div', '', 'caller');
  const box = el('input', '', 'caller-id');
  box.type = 'text';
  box.value = crypto.randomUUID();
  box.setAttribute('aria-label', 'Idempotency-Key');
  row.append(document.createTextNode('Idempotency-Key'), box);
  return { row, value: () => box.value.trim() };
};

/** The "Calling as" row: an id, a kind of actor, and roles. */
const callerRow = () => {
  const row = el('div', '', 'caller');
  const id = el('input', '', 'caller-id');
  id.type = 'text';
  id.value = caller.id;
  id.setAttribute('aria-label', 'Caller id');
  id.oninput = () => { caller.id = id.value; };

  const type = el('select', '', 'caller-type');
  type.setAttribute('aria-label', 'Caller type');
  type.append(...actorTypes().map((kind) => el('option', kind)));
  type.value = caller.type;
  id.disabled = caller.type === 'unauthenticated';
  type.onchange = () => { caller.type = type.value; id.disabled = type.value === 'unauthenticated'; };

  // A dropdown of the declared roles, any number checked; a box to type them
  // into for a set that declares none.
  let roles;
  const declared = roleTypes();
  if (declared.length > 0) {
    roles = el('details', '', 'caller-roles');
    const summary = el('summary');
    const label = () => { summary.textContent = caller.roles.length ? caller.roles.join(', ') : 'no roles'; };
    roles.append(summary);
    const list = el('div', '', 'menu');
    for (const role of declared) {
      const option = el('label');
      const box = el('input');
      box.type = 'checkbox';
      box.checked = caller.roles.includes(role);
      box.onchange = () => {
        caller.roles = declared.filter((name) => name === role ? box.checked : caller.roles.includes(name));
        label();
      };
      option.append(box, document.createTextNode(role));
      list.append(option);
    }
    roles.append(list);
    label();
  } else {
    roles = el('input', '', 'caller-roles');
    roles.type = 'text';
    roles.value = caller.roles.join(', ');
    roles.placeholder = 'roles, comma-separated';
    roles.oninput = () => { caller.roles = roles.value.split(',').map((role) => role.trim()).filter(Boolean); };
  }
  roles.setAttribute('aria-label', 'Caller roles');

  row.append(document.createTextNode('Calling as'), id, type, roles);
  return row;
};

const call = async (method, path, body, headers = {}) => {
  const init = { method, headers: { ...callerHeaders(), ...headers } };
  if (body instanceof FormData) {
    init.body = body;
  } else if (body !== undefined) {
    init.headers['content-type'] = 'application/json';
    init.body = typeof body === 'string' ? body : JSON.stringify(body);
  }
  const response = await mock.fetch(new Request(new URL(basePath + path, location.origin), init));
  const text = await response.text();
  let parsed;
  try { parsed = JSON.parse(text); } catch { parsed = text; }
  return { status: response.status, statusText: response.statusText, body: parsed };
};

// ── Reading the contracts ───────────────────────────────────────────────────

const openapiDocs = () => docs.filter((doc) => doc.type === 'openapi');

/** The server prefix an OpenAPI document's paths hang off. */
const prefixOf = (doc) => {
  const [server] = doc.content?.servers ?? [];
  if (!server?.url) return '';
  try { return new URL(server.url).pathname.replace(/\/$/, ''); } catch { return server.url; }
};

/**
 * Every operation the loaded documents declare, with where it came from.
 *
 * Read off the documents rather than the server's route table: the table
 * registers four extra methods on a read-only projection purely so they can
 * answer 405, and offering those is offering four ways to be told no.
 */
const operations = () => {
  const found = [];
  for (const doc of openapiDocs()) {
    const prefix = prefixOf(doc);
    for (const [declared, item] of Object.entries(doc.content?.paths ?? {})) {
      for (const [method, operation] of Object.entries(item ?? {})) {
        if (!/^(get|post|put|patch|delete)$/.test(method)) continue;
        found.push({
          method: method.toUpperCase(),
          path: prefix + declared,
          template: declared,
          operation,
          doc,
          domain: doc.domain ?? doc.content?.info?.['x-domain'] ?? 'other',
          summary: operation.summary ?? operation.operationId ?? `${method.toUpperCase()} ${declared}`,
        });
      }
    }
  }
  return found;
};

/** The state machine actions the loaded documents declare, by endpoint path. */
const actions = () => {
  const byPath = new Map();
  for (const doc of docs.filter((d) => d.type === 'state-machine')) {
    for (const machine of doc.content?.machines ?? []) {
      for (const action of machine.actions ?? []) {
        const from = action.transition?.from;
        byPath.set(action.id, {
          id: action.id,
          object: machine.object,
          from: Array.isArray(from) ? from : String(from ?? '').split(',').map((s) => s.trim()),
          to: action.transition?.to,
          // What the move does on the way through, which is how one
          // transition differs from the next. Without these every move in a
          // lifecycle has the same thing said about it.
          steps: action.steps ?? [],
          doc: doc.relativePath,
        });
      }
    }
  }
  return byPath;
};

/**
 * The paths every declared composition owns, including the ones it generates
 * beneath itself — section panels and the per-section review state.
 *
 * Without this they classify as ordinary item routes, and nineteen of them
 * pile into Resources, which is both wrong and the exact overwhelm this page
 * is supposed to avoid.
 */
const compositionPaths = () => {
  const owned = new Map();
  for (const doc of docs.filter((d) => d.type === 'compositions')) {
    for (const [name, declared] of Object.entries(doc.content?.compositions ?? {})) {
      const base = declared.endpoint?.path;
      if (!base) continue;
      owned.set(base, { name, doc: doc.relativePath });
      // A sectioned composition serves a panel per section and a progress
      // resource alongside it; both hang off the same declared path.
      for (const suffix of ['/{section}', '/{section}/{itemId}']) {
        owned.set(base + suffix, { name, doc: doc.relativePath });
      }
      const progress = base.replace(/\/[^/]+$/, '/review-progress');
      for (const suffix of ['/{section}', '/{section}/{itemId}']) {
        owned.set(progress + suffix, { name, doc: doc.relativePath });
      }
      for (const section of Object.keys(declared.sections ?? {})) {
        owned.set(`${base}/${section}`, { name, doc: doc.relativePath });
      }
    }
  }
  return owned;
};

/** The rulesets the loaded documents declare, and the examples for each. */
const rulesets = () => {
  const examples = new Map();
  for (const doc of docs.filter((d) => d.type === 'rules-examples')) {
    for (const [name, declared] of Object.entries(doc.content?.rulesets ?? {})) {
      examples.set(name, declared.examples ?? []);
    }
  }
  const found = [];
  for (const doc of docs.filter((d) => d.type === 'rules')) {
    for (const [name, declared] of Object.entries(doc.content?.rulesets ?? {})) {
      found.push({ name, ruleset: declared, doc: doc.relativePath, examples: examples.get(name) ?? [] });
    }
  }
  return found;
};

/**
 * What kind of thing an operation is.
 *
 * The affordance a reader needs differs completely between these, and the
 * contracts are what say which is which — a transition is only a transition
 * because a state machine declares an action whose endpoint this is.
 */
const classify = (op) => {
  const last = op.template.split('/').filter(Boolean).pop() ?? '';
  const act = actions().get(last);
  if (op.method === 'POST' && act) return { kind: 'transition', action: act };
  if (op.method === 'POST' && /\/evaluate-/.test(op.template)) {
    const name = last.replace(/^evaluate-/, '');
    const found = rulesets().find((r) => r.name.toLowerCase() === name.replace(/-/g, '').toLowerCase());
    return { kind: 'rules', ruleset: found ?? rulesets()[0] ?? null };
  }
  const composed = compositionPaths().get(op.template);
  if (composed) return { kind: 'composition', composition: composed };
  if (op.operation.requestBody?.content?.['multipart/form-data']) return { kind: 'upload' };
  if (/\/stream$/.test(op.template)) return { kind: 'stream' };
  if (op.template.includes('{')) return { kind: 'item' };
  return { kind: op.method === 'POST' ? 'create' : 'collection' };
};

// ── Example bodies ──────────────────────────────────────────────────────────

/** The schema an operation's JSON request body points at, dereferenced. */
const requestSchema = (op) => {
  const schema = op.operation.requestBody?.content?.['application/json']?.schema;
  return schema ? deref(schema, op.doc) : null;
};

/** A relative path, from the document at `from`: dirname, then each segment, with `..` going up. */
const resolveRelative = (from, relative) => {
  const parts = from.split('/').slice(0, -1);
  for (const segment of relative.split('/')) {
    if (segment === '..') parts.pop();
    else if (segment !== '.' && segment !== '') parts.push(segment);
  }
  return parts.join('/');
};

const deref = (node, doc, seen = 0) => {
  if (!node || typeof node !== 'object' || seen > 8) return node;
  if (typeof node.$ref !== 'string') return node;

  const [file, fragment = ''] = node.$ref.split('#');
  // Same document.
  if (file === '') {
    const target = fragment.replace(/^\//, '').split('/').reduce((at, key) => at?.[key], doc.content);
    return deref(target, doc, seen + 1);
  }

  // Another one. A relative reference resolves against the document it is
  // written in — `../../components/parameters.yaml` from
  // base/domains/transcription/ is base/components/parameters.yaml. One written
  // as a URL is matched on its tail, since the set is keyed by relative path.
  const relative = !/^[a-z]+:/i.test(file) && doc.relativePath
    ? resolveRelative(doc.relativePath, file)
    : null;
  const wanted = file.replace(/^.*?([^/]+\/[^/]+\/[^/]+)$/, '$1');
  const other = docs.find((candidate) => candidate.relativePath
    && (candidate.relativePath === relative
      || (!relative && (candidate.relativePath === wanted || candidate.relativePath.endsWith(wanted)))));
  if (!other) return node;
  const target = fragment
    ? fragment.replace(/^\//, '').split('/').reduce((at, key) => at?.[key], other.content)
    : other.content;
  return deref(target, other, seen + 1);
};

/**
 * A body worth pressing Execute on.
 *
 * In descending order of how much a reader learns from it: a record the
 * contract set already ships as mock data, with the server's own fields
 * stripped; then the schema's declared example; then something built from
 * the schema, which at least gets the enums right. Typing a correct body
 * from scratch is the thing that makes an unfamiliar API exhausting.
 */
const exampleBody = (op) => {
  // An edit worth watching: add to the list a derived field counts, so the
  // count moves on the next read. A `PATCH` that changes nothing visible
  // teaches nothing.
  if (op.kind === 'edit') {
    const counted = countedArray(op);
    if (counted) return attaching(op, { [counted.field]: counted.allowed.slice(0, 2) });
  }

  // A ruleset's inputs are nested and nobody can type them from memory. The
  // contract set ships described examples for exactly this reason.
  if (op.kind === 'rules') {
    const [first] = op.ruleset?.examples ?? [];
    if (first?.inputs) return first.inputs;
    const inputs = op.ruleset?.ruleset?.inputs ?? {};
    return Object.fromEntries(
      Object.entries(inputs).map(([name, declared]) => [name, fromSchema(declared, op.doc)])
    );
  }

  const schema = requestSchema(op);
  if (!schema) return null;

  const managed = new Set(['id', 'createdAt', 'updatedAt', 'status', '_links']);
  const writable = new Set(Object.keys(collectProperties(schema, op.doc)));

  for (const data of docs.filter((d) => d.type === 'mock-data' && d.domain === op.doc.domain)) {
    for (const record of Object.values(data.content ?? {})) {
      if (!record || typeof record !== 'object') continue;
      const body = Object.fromEntries(
        Object.entries(record).filter(([key]) => writable.has(key) && !managed.has(key))
      );
      if (Object.keys(body).length > 0) return attaching(op, body);
    }
  }

  if (op.operation.requestBody?.content?.['application/json']?.example) {
    return op.operation.requestBody.content['application/json'].example;
  }
  return attaching(op, fromSchema(schema, op.doc));
};

/**
 * Fill in a foreign key the walk can already satisfy.
 *
 * A field the contract says points at something, where the walk has made
 * one of those: send its id. This is what makes a relationship visible
 * rather than described — the request carries the id of the document
 * uploaded a step ago, and the record comes back with the document in it.
 */
const attaching = (op, body) => {
  const schema = requestSchema(op);
  if (!schema) return body;
  for (const [name, property] of Object.entries(collectProperties(schema, op.doc))) {
    const relationship = property['x-relationship'];
    if (relationship?.type !== 'fk') continue;
    const id = built.get(relationship.resource);
    if (id) body[name] = id;
  }
  return body;
};

/**
 * The parts of a body that is not JSON.
 *
 * One operation in the set declares `multipart/form-data`, and a textarea
 * full of JSON is the wrong affordance for it entirely. The parts and their
 * values come off the contract the same way a JSON body does; the bytes are
 * the one thing that cannot, because no contract can carry a file and
 * nothing in a shipped artifact should.
 */
const SENT_BYTES = 'Hashed on the way in, and then thrown away.\n';

const uploadParts = (op) => {
  const declared = op.operation?.requestBody?.content?.['multipart/form-data']?.schema;
  if (!declared) return null;
  const properties = collectProperties(deref(declared, op.doc), op.doc);

  const parts = [];
  for (const [name, property] of Object.entries(properties)) {
    const resolved = deref(property, op.doc);
    if (resolved?.format === 'binary') { parts.push({ name, bytes: true }); continue; }
    parts.push({ name, value: String(resolved?.example ?? valueFor(resolved, op.doc) ?? '') });
  }

  // Named after what it is, which the contract already says: a part called
  // `title` holding "April pay stub" makes april-pay-stub.txt.
  const titled = parts.find((part) => /title|name/i.test(part.name))?.value;
  const fileName = `${(titled || 'upload').toLowerCase().replace(/[^a-z0-9]+/g, '-')}.txt`;
  for (const part of parts) if (part.bytes) part.fileName = fileName;
  return parts;
};

/** What `uploadParts` describes, as something `fetch` can send. */
const asFormData = (parts) => {
  const form = new FormData();
  for (const part of parts) {
