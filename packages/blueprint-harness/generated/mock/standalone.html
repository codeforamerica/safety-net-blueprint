mbers aged 16–59 for work requirement exemptions (physical/mental fitness, caregiving, education, etc.).\n","expression":"hasUnemployedWorkEligible"},{"path":"studentEligibilityPrompt","type":"boolean","description":"Screen student members for SNAP student eligibility exceptions (employment, dependent care, work-study, etc.).\n","expression":"hasStudentMembers"},{"path":"immigrationStatusPrompt","type":"boolean","description":"Screen non-citizen members for immigration status and apply sponsor income deeming rules where applicable.\n","expression":"hasNonCitizenMembers"},{"path":"changeVerificationPrompt","type":"boolean","description":"Identify and verify changes in household circumstances that occurred between the application date and the interview date.\n","expression":"application.hasChangedCircumstances"}],"outputs":{"incomeInconsistencyPrompt":{"type":"boolean"},"workEligibleMembers":{"type":"array"},"workRequirementPrompt":{"type":"boolean"},"studentEligibilityPrompt":{"type":"boolean"},"immigrationStatusPrompt":{"type":"boolean"},"changeVerificationPrompt":{"type":"boolean"},"allMembersEmployed":{"type":"boolean"}}}}}},{"relativePath":"domains/intake/intake-schemas.yaml","domain":null,"type":"components","content":{"$defs":{"HouseholdMember":{"type":"object","description":"A person in the household, as the interview rules read them. Shared so a ruleset can reference it rather than restating the shape — the compiler follows the $ref down to individual field paths, which is what keeps missing-input tracking per-field rather than per-object.\n","properties":{"age":{"type":"integer","description":"Member's age in years."},"isEmployed":{"type":"boolean","description":"Whether the member is currently employed."},"isStudent":{"type":"boolean","description":"Whether the member is enrolled at least half-time in higher education."},"isNonCitizen":{"type":"boolean","description":"Whether the member is a non-citizen subject to immigration screening."}}},"IncomeSource":{"description":"Income reported by a household member. Type discriminator determines the variant.","oneOf":[{"$ref":"#/$defs/EmploymentIncome"},{"$ref":"#/$defs/SelfEmploymentIncome"},{"$ref":"#/$defs/BenefitIncome"}],"discriminator":{"propertyName":"type","mapping":{"employment":"#/$defs/EmploymentIncome","self_employment":"#/$defs/SelfEmploymentIncome","benefit":"#/$defs/BenefitIncome"}}},"EmploymentIncome":{"type":"object","description":"Income from wages or salary employment.","required":["type","employer","monthlyGrossIncome"],"properties":{"type":{"type":"string","const":"employment"},"employer":{"type":"string","description":"Name of the employer."},"monthlyGrossIncome":{"type":"number","minimum":0,"description":"Monthly gross income before deductions (dollars)."}}},"SelfEmploymentIncome":{"type":"object","description":"Income from self-employment or a sole proprietorship.","required":["type","businessType","monthlyNetIncome"],"properties":{"type":{"type":"string","const":"self_employment"},"businessType":{"type":"string","description":"Type of business (e.g., sole proprietor, freelance)."},"monthlyNetIncome":{"type":"number","minimum":0,"description":"Monthly net income after business expenses (dollars)."}}},"BenefitIncome":{"type":"object","description":"Income from a government benefit program.","required":["type","benefitType","monthlyAmount"],"properties":{"type":{"type":"string","const":"benefit"},"benefitType":{"type":"string","enum":["ssi","ssdi","unemployment","veterans","other"],"description":"The benefit program providing income."},"monthlyAmount":{"type":"number","minimum":0,"description":"Monthly benefit amount (dollars)."}}}}}},{"relativePath":"domains/intake/intake-sla-types.yaml","domain":"intake","type":"sla-types","content":{"$schema":"sla-types-schema.yaml","version":"1.0","domain":"intake","slaTypes":[{"id":"snap_standard","name":"SNAP Standard Processing","duration":{"amount":30,"unit":"days"},"warningThresholdPercent":80,"pauseWhen":{"in":[{"var":"status"},["withdrawn"]]}},{"id":"medicaid_standard","name":"Medicaid Standard Processing","duration":{"amount":45,"unit":"days"},"warningThresholdPercent":80,"pauseWhen":{"in":[{"var":"status"},["withdrawn"]]}}]}},{"relativePath":"domains/intake/intake-state-machine.yaml","domain":"intake","type":"state-machine","content":{"$schema":"state-machine-schema.yaml","extends":"../platform/platform-state-machine.yaml","version":"1.0","domain":"intake","eventsSpec":"intake-asyncapi.yaml","machines":[{"object":"Application","states":[{"id":"draft","slaClock":"stopped","description":"Created but not yet filed; regulatory clock has not started."},{"id":"submitted","slaClock":"running","description":"Formally filed; regulatory clock starts (7 CFR § 273.2(g))."},{"id":"under_review","slaClock":"running","description":"Caseworker is actively reviewing; clock running toward processing deadline."},{"id":"withdrawn","slaClock":"stopped","description":"Household withdrew the application. Terminal."},{"id":"closed","slaClock":"stopped","description":"Intake complete; case opened if approved. Terminal."}],"initialState":"draft","timers":[{"id":"review_reminder","description":"Fires when an application has been awaiting caseworker review for too long. The callback event (intake.review_reminder) triggers an escalation notice.\n"}],"emits":[{"id":"submitted","description":"TODO — describe when this event is emitted and who consumes it."},{"id":"closed","description":"TODO — describe when this event is emitted and who consumes it."},{"id":"withdrawn","description":"TODO — describe when this event is emitted and who consumes it."},{"id":"review-reminder","description":"Emitted when an application has been awaiting caseworker review for too long."}],"actions":[{"id":"submit","description":"Formally submits a draft application, starting the regulatory processing clock.","transition":{"from":"draft","to":"submitted"},"steps":[{"set":{"field":"submittedAt","value":"$now","description":"Record the submission timestamp (regulatory clock start)."}},{"emit":{"event":"submitted","subject":"$object.id","data":{"id":"$object.id","programsAppliedFor":"$object.programsAppliedFor"},"description":"Triggers eligibility screening, caseworker task creation, and confirmation notice.","type":"intake.application.submitted"}},{"call":"requestTimer","with":{"timerId":"review_reminder","fireAfter":{"amount":72,"unit":"hours"},"callback":{"event":"intake.review_reminder"}},"description":"Escalate if no caseworker has opened this application in 72 hours."}]},{"id":"open","description":"Moves a submitted application into active caseworker review.","transition":{"from":"submitted","to":"under_review"},"steps":[{"set":{"field":"openedAt","value":"$now","description":"Record when caseworker began review, marking the start of active processing."}}]},{"id":"close","description":"Closes the application once intake processing is complete.","schema":{"request":{"$ref":"#/$defs/CloseRequest"}},"transition":{"from":"under_review","to":"closed"},"steps":[{"emit":{"event":"closed","type":"intake.application.closed"}}]},{"id":"withdraw","description":"Withdraws the application at the household's request.","transition":{"from":["draft","submitted","under_review"],"to":"withdrawn"},"guards":[{"actors":["applicant","case_worker"]}],"steps":[{"emit":{"event":"withdrawn","type":"intake.application.withdrawn"}}]}],"on":[{"type":"intake.review_reminder","description":"Escalates an application that has been awaiting caseworker review for too long. Fired by the scheduling service when the review_reminder timer expires.\n","transition":{"from":"submitted"},"steps":[{"emit":{"event":"review-reminder","description":"Notify supervisors that this application needs immediate attention.","type":"intake.application.review-reminder"}}]}]}],"$defs":{"CloseRequest":{"type":"object","required":["outcome"],"properties":{"outcome":{"type":"string","enum":["approved","denied"],"description":"Whether the application was approved or denied at close."},"notes":{"type":"string","description":"Optional caseworker notes on the closure decision."}}}}}},{"relativePath":"domains/platform/platform-registry-patterns.yaml","domain":"platform","type":"registry","content":{"$schema":"registry-schema.yaml","version":"1.0","domain":"platform","type":"patterns","entries":{"oneof-discriminator":{"description":"Inline oneOf with a discriminator property, where all variants are defined within the same file (not via external $ref). Exercises discriminated union rendering, discriminator label resolution, and variant expansion in the explorer.\n"},"anyof":{"description":"anyOf composition — a field that may satisfy more than one schema simultaneously (e.g., a record with both electronic and manual verification on file). Exercises anyOf rendering and the semantic distinction from oneOf.\n"},"additional-properties-map":{"description":"Map type using additionalProperties to allow arbitrary key-value pairs (e.g., labels or metadata). Exercises additionalProperties rendering in the explorer and map validation in the schema validator.\n"},"read-only-field":{"description":"Field marked readOnly: true — server-generated and never accepted in write operations. Common for IDs, computed values, and lifecycle timestamps. Exercises readOnly rendering in the explorer and write-operation filtering.\n"},"deprecated-field":{"description":"Field marked deprecated: true with a migration note pointing to its replacement. Exercises deprecated field rendering in the explorer and tooling warnings.\n"},"string-format":{"description":"String field with a format constraint (uuid, date-time, date, email, etc.). Exercises format rendering in the explorer and format validation.\n"},"polymorphic-base":{"description":"Base schema extended via allOf in Create and Update variants. The Create variant adds required fields; the Update variant applies minProperties: 1 for partial updates. Exercises allOf merging and the Create/Update schema pattern.\n"},"array-of-enum":{"description":"Array of enum values. Exercises array-of-enum rendering in the explorer and array item validation in the schema validator.\n"},"x-enum-source":{"description":"Enum values resolved at build time from an external source (e.g., a state machine's state IDs) via the x-enum-source extension, rather than hardcoded in the OpenAPI spec. Exercises the resolver's x-enum-source injection.\n"},"nullable-state-gated-field":{"description":"Nullable field that is only present after a lifecycle transition (e.g., a timestamp set when an application is submitted). Exercises nullable field rendering and the pattern of state-gated fields.\n"},"nullable-conditional-field":{"description":"Nullable field whose presence depends on another field's value (e.g., a benefit amount present only when eligible is true). Exercises nullable field handling and conditional presence patterns.\n"},"external-ref-shared-defs":{"description":"External $ref to a shared $defs schema in a separate file. Exercises the resolver's cross-file $ref resolution and the explorer's external schema name rendering.\n"},"external-ref-defs-oneof":{"description":"External $ref to a $defs schema that is itself a oneOf with a discriminator. Exercises: (1) cross-file $ref resolution, (2) discriminated union rendering with labeled variants, (3) field inventory handling of oneOf inside an external $defs ref.\n"},"allof-inline-required":{"description":"allOf composition that adds inline required fields without duplicating properties (e.g., a Create variant that adds a required field to a base schema). Exercises the resolver's allOf merging and the explorer's allOf rendering.\n"},"paginated-list":{"description":"Collection endpoint returning items/total/limit/offset/hasNext. The standard blueprint pagination envelope. Exercises paginated list rendering and parameter validation (limit, offset, sort, search).\n"},"sub-resource":{"description":"Resource nested under a parent at a path like /parents/{id}/children. Full CRUD scoped to the parent. Exercises nested routing, parent FK validation, and sub-resource list/detail rendering in the explorer.\n"},"singleton-sub-resource":{"description":"Single resource nested under a parent at a path like /parents/{id}/summary, with no item-level ID. Accessed only through the parent. Exercises singleton sub-resource routing and composition rendering.\n"},"intra-domain-fk":{"description":"Intra-domain x-relationship foreign key linking a sub-resource back to its parent resource within the same domain. Exercises cross-reference rendering in the explorer and FK validation.\n"},"cross-domain-fk":{"description":"Cross-domain x-relationship foreign key linking a resource in one domain to a resource in another. Exercises cross-domain reference rendering and FK validation across domain boundaries.\n"},"rpc-state-machine-action":{"description":"RPC-style state machine action with a generated POST endpoint. Exercises the RPC overlay generator, x-relationship tagging, and state machine → API cross-linking in the explorer.\n"},"state-machine-guard":{"description":"Named boolean condition (CEL expression) attached to a state machine action. The action can only be triggered when all guard conditions pass. Exercises guard evaluation, actor role checking, and guard composition (any/all).\n"},"state-machine-timer":{"description":"Timer declaration on a state machine. The scheduling service emits a callback event ({domain}.{id}) when the timer fires; the machine subscribes to react. Exercises timer declaration rendering and the timer → event subscription link.\n"},"state-machine-subscription":{"description":"State machine subscribing to a domain event emitted by a different domain. The handler runs steps (create, emit, call) automatically when the event arrives. Exercises cross-domain event subscription and handler rendering.\n"},"state-machine-event":{"description":"Domain event emitted on a state machine transition. Exercises AsyncAPI event catalog generation and event → state machine cross-linking.\n"},"cross-domain-event":{"description":"Domain event consumed by downstream domains outside the emitting domain. Exercises event catalog cross-domain consumer rendering.\n"},"composition":{"description":"Read-only singleton resource assembled from fields across multiple resources, generated from a compositions contract. Produces a GET endpoint nested under the parent resource (e.g. /applications/{id}/summary). Exercises the composition generator, x-relationship injection, and singleton rendering in the explorer.\n"},"overlay":{"description":"Field or element added or modified by an adopter overlay. Overlays add state-required fields, tighten enums, and set global configuration (x-casing, x-pagination, x-search, x-relationship, x-event-type-prefix). Exercises the overlay resolver and adopter-level customization patterns.\n"},"ruleset-output-fact":{"description":"Output fact from a ruleset — a fact declared in the outputs list and returned by the REST endpoint. Exercises the rules engine → API endpoint link in the explorer (Rules badge).\n"},"ruleset-intermediate-fact":{"description":"Intermediate fact used internally by other facts but not returned by the REST endpoint. Exercises fact graph dependency rendering in the rules-docs visualizer.\n"},"array-of-oneof":{"description":"Array whose items are a oneOf discriminated union (e.g., EvaluationResult returning EvaluationFact variants). Exercises array-of-oneOf rendering, discriminator label resolution, and schema variant expansion.\n"}}}},{"relativePath":"domains/platform/platform-registry-policies.yaml","domain":"platform","type":"registry","content":{"$schema":"registry-schema.yaml","version":"1.0.0","domain":"platform","type":"policies","entries":{"snap-application-acceptance":{"citation":"7 CFR § 273.2(c)","description":"SNAP application acceptance requirements — agencies must accept applications on the day of initial contact and must not discourage or delay submission.\n"},"snap-right-to-apply":{"citation":"7 CFR § 273.2(a)","description":"SNAP right-to-apply — any household wishing to participate must be allowed to file an application, and the filing date establishes the benefit month.\n"},"snap-processing-clock":{"citation":"7 CFR § 273.2(g)","description":"SNAP application processing standards — 30-day processing clock from date of filing; expedited service within 7 days for qualifying households.\n"},"medicaid-processing-clock":{"citation":"42 CFR § 435.912","description":"Medicaid application processing standards — 45-day processing clock for most applicants; 90 days for disability-based applicants.\n"},"snap-notice-of-action":{"citation":"7 CFR § 273.13","description":"SNAP notice of adverse action — agencies must provide timely and adequate written notice before reducing, suspending, or terminating benefits.\n"},"snap-notice-of-eligibility":{"citation":"7 CFR § 273.10(g)","description":"SNAP notice of eligibility determination — written notice of approval or denial with reason, rights, and certification period.\n"},"medicaid-notice-of-eligibility":{"citation":"42 CFR § 435.917","description":"Medicaid notice of eligibility determination — written notice of approval or denial with reason, appeal rights, and effective date.\n"},"snap-fair-hearing-rights":{"citation":"7 CFR § 273.15","description":"SNAP fair hearing rights — households have the right to request a fair hearing within 90 days of any adverse action notice.\n"},"snap-interview-toolkit":{"citation":"FNS-1104 (March 2023, revised June 2025)","description":"FNS SNAP Interview Toolkit — six essential interview functions, probe triggers for inconsistency flags, verification requirements, and interview conclusion standards.\n"},"snap-general-work-requirement":{"citation":"7 CFR § 273.7","description":"SNAP general work requirements — able-bodied adults aged 16–59 must register for work, accept suitable employment, and participate in assigned employment and training programs. Exemptions include physical/mental incapacity, caregiving, school enrollment, and participation in other programs.\n"},"snap-abawd-work-requirement":{"citation":"7 CFR § 273.24","description":"SNAP able-bodied adults without dependents (ABAWD) work requirement — individuals aged 18–54 without dependents are limited to 3 months of benefits in any 36-month period unless they meet work, exemption, or waiver criteria.\n"},"snap-student-eligibility":{"citation":"7 CFR § 273.5","description":"SNAP eligibility rules for students enrolled at least half-time in higher education — generally ineligible unless they meet one of the statutory exceptions (employment, work-study, dependent care, TANF participation, etc.).\n"},"snap-expedited-processing":{"citation":"7 CFR § 273.2(i)","description":"SNAP expedited service — households with gross monthly income below $150 and liquid resources below $100 (or migrant/seasonal farmworkers) must receive benefits within 7 days of application.\n"},"snap-expedited-screening":{"citation":"7 CFR § 273.2(i)(1)","description":"SNAP expedited screening criteria — agencies must screen all applications on the day of receipt and identify households entitled to expedited service.\n"},"qualified-alien-eligibility":{"citation":"7 CFR § 273.4","description":"SNAP eligibility for non-citizens — only qualified aliens are eligible; status categories include LPRs, refugees, asylees, and other federally defined categories with varying waiting periods.\n"},"prwora-sponsor-deeming":{"citation":"8 U.S.C. § 1631","description":"PRWORA sponsor income deeming — income and resources of a sponsor who signed an I-864 Affidavit of Support on or after December 19, 1997 are deemed available to the sponsored non-citizen for SNAP purposes.\n"},"snap-household-composition":{"citation":"7 CFR § 273.1","description":"SNAP household composition rules — defines who must be included in a SNAP household, including mandatory household members, separate household rules, and treatment of boarders, roommates, and institutionalized individuals.\n"},"snap-income-verification":{"citation":"7 CFR § 273.2(f)","description":"SNAP income verification requirements — agencies must verify earned and unearned income at application and recertification, including acceptable documentary evidence and collateral contact standards.\n"},"snap-elderly-disabled-deductions":{"citation":"7 CFR § 273.9(d)","description":"SNAP deductions for elderly and disabled households — households with an elderly or disabled member may claim excess medical expense deductions and are exempt from the gross income test.\n"},"snap-benefit-calculation":{"citation":"7 CFR § 273.10","description":"SNAP benefit calculation — net monthly income is used to determine benefit allotment; benefit equals 30% of net income subtracted from the maximum allotment for household size.\n"},"chip-age-eligibility":{"citation":"42 CFR § 457.310","description":"CHIP age eligibility — states must define an upper age limit for CHIP eligibility (up to age 19), and may extend coverage to unborn children and former foster youth up to age 26 under state plan options.\n"},"medicaid-caretaker-relative":{"citation":"42 CFR § 435.110","description":"Medicaid caretaker relative eligibility — states must provide Medicaid to caretaker relatives of dependent children who meet income and resource standards, including parents and other adults who are the primary caregiver.\n"},"medicaid-cost-sharing":{"citation":"42 CFR § 447.50","description":"Medicaid cost sharing — limits on premiums, copayments, and other cost sharing for Medicaid enrollees, including aggregate limits by income level and prohibition on cost sharing for certain populations and services.\n"},"medicaid-determination-documentation":{"citation":"42 CFR § 435.940","description":"Medicaid eligibility verification — agencies must verify eligibility factors through electronic data sources before requesting documentation from applicants; paper documentation may be requested only when electronic verification is unavailable.\n"}}}},{"relativePath":"domains/platform/platform-state-machine.yaml","domain":null,"type":"state-machine","content":{"$schema":"state-machine-schema.yaml","version":"1.0","procedures":[{"id":"requestTimer","description":"Request a time-based callback from the scheduling service. Pass fireAfter (a duration) or fireAt (an absolute timestamp), and a callback naming the event to publish when it elapses. Nothing here waits: the request is an event, and whatever provides scheduling answers it — in a deployment a scheduler, in a test a mock stub, which is what makes a 72-hour deadline testable in a second.\n","parameters":["timerId","callback","fireAfter","fireAt"],"emit":{"type":"scheduling.timer.requested","subject":"$object.id","data":{"timerId":"$params.timerId","fireAfter":"$params.fireAfter","fireAt":"$params.fireAt","callback":"$params.callback"}}}]}},{"relativePath":"domains/scheduling/scheduling-asyncapi.yaml","domain":"scheduling","type":"asyncapi","content":{"asyncapi":"3.0.0","info":{"title":"Scheduling Domain Events","version":"0.1.0","x-status":"draft","x-domain":"scheduling","description":"The timer request channel, which is the whole scheduling surface this\nfixture needs. A domain asks for a time-based callback by publishing\n`scheduling.timer.requested` with the event to fire when it elapses;\nwhatever provides scheduling answers it. Nothing in this contract set\nimplements a scheduler, which is the point — the mock server's timer stub\nstands in, so a deadline measured in days is exercised in a second.\n"},"channels":{"scheduling.timer.requested":{"address":"scheduling.timer.requested","messages":{"timerRequested":{"$ref":"#/components/messages/TimerRequestedMessage"}}}},"components":{"messages":{"TimerRequestedMessage":{"name":"scheduling.timer.requested","summary":"Emitted by the platform requestTimer procedure. A scheduler registers the timer and publishes the callback event on expiry.\n","payload":{"$ref":"#/components/schemas/TimerRequestedEvent"}}},"schemas":{"TimerRequestedEvent":{"allOf":[{"$ref":"../../base/schemas/events.yaml#/$defs/Event"},{"type":"object","properties":{"type":{"type":"string","const":"scheduling.timer.requested"}}}]}}}}},{"relativePath":"scenarios/transcript-lifecycle.arazzo.yaml","domain":"transcription","type":"arazzo","content":{"arazzo":"1.0.1","info":{"title":"A transcript, from start to close","version":"1.0.0","x-domain":"transcription","description":"The interview software a caseworker uses transcribes an interview. An\nadministrator adds the profile it runs under. The software starts a\ntranscript under that profile, adds lines — retrying one — pauses when the\napplicant asks to go off the record, and closes it at the end. Along the\nway the transcript refuses to start without a model or under a profile that\ndoes not exist; keeps a line said just before the pause; and refuses a line\nsaid during it, a lost stretch overlapping it, a line after the close, and\nthe software editing an entry. Every time is by the software's clock.\n"},"sourceDescriptions":[{"name":"transcripts","url":"../base/domains/transcription/transcription-transcripts-openapi.yaml","type":"openapi"}],"components":{"parameters":{"caller":{"name":"X-Caller-Id","in":"header","value":"worker-1"},"transcript":{"name":"transcriptId","in":"path","value":"$steps.start.outputs.id"}}},"workflows":[{"workflowId":"transcriptLifecycle","summary":"Start, record, pause, resume and close a transcript, and see what it refuses.","steps":[{"stepId":"addProfile","description":"An administrator adds the profile interviews in English run under.","operationId":"createTranscriptionProfile","parameters":[{"name":"X-Caller-Id","in":"header","value":"admin-1"}],"requestBody":{"payload":{"name":"english-interview","provider":"aws-transcribe","languages":["en-US"]}},"successCriteria":[{"condition":"$statusCode == 201"},{"condition":"$response.body#/source == 'user'"}],"outputs":{"id":"$response.body#/id"}},{"stepId":"startWithoutAModel","description":"A transcript under a profile with a transcription service has to say which model produced its lines.","operationId":"createTranscript","parameters":[{"reference":"$components.parameters.caller"}],"requestBody":{"payload":{"profileId":"$steps.addProfile.outputs.id","client":"interview-assistant/0.1.0","startedAt":"2026-10-12T10:00:00Z"}},"successCriteria":[{"condition":"$statusCode == 409"}]},{"stepId":"startUnderAMissingProfile","description":"A transcript is started under a profile that exists.","operationId":"createTranscript","parameters":[{"reference":"$components.parameters.caller"}],"requestBody":{"payload":{"profileId":"00000000-0000-4000-8000-000000000000","model":"standard","client":"interview-assistant/0.1.0","startedAt":"2026-10-12T10:00:00Z"}},"successCriteria":[{"condition":"$statusCode == 409"}]},{"stepId":"start","description":"The caseworker starts a transcript of the interview.","operationId":"createTranscript","parameters":[{"reference":"$components.parameters.caller"}],"requestBody":{"payload":{"profileId":"$steps.addProfile.outputs.id","model":"standard","client":"interview-assistant/0.1.0","startedAt":"2026-10-12T10:00:00Z"}},"successCriteria":[{"condition":"$statusCode == 201"},{"condition":"$response.body#/status == 'recording'"},{"condition":"$response.body#/profileId == $steps.addProfile.outputs.id"}],"outputs":{"id":"$response.body#/id"}},{"stepId":"firstLine","description":"The first finished line arrives.","operationId":"addTranscriptEntry","parameters":[{"reference":"$components.parameters.caller"},{"reference":"$components.parameters.transcript"},{"name":"Idempotency-Key","in":"header","value":"line-1"}],"requestBody":{"payload":{"kind":"line","startedAt":"2026-10-12T10:00:05Z","endedAt":"2026-10-12T10:00:06Z","text":"Can you tell me who lives with you?","speaker":"staff"}},"successCriteria":[{"condition":"$statusCode == 201"}],"outputs":{"id":"$response.body#/id"}},{"stepId":"retryFirstLine","description":"The connection drops before the answer comes back, so the software sends the line again with the same key — and gets the same line, not a second one.","operationId":"addTranscriptEntry","parameters":[{"reference":"$components.parameters.caller"},{"reference":"$components.parameters.transcript"},{"name":"Idempotency-Key","in":"header","value":"line-1"}],"requestBody":{"payload":{"kind":"line","startedAt":"2026-10-12T10:00:05Z","endedAt":"2026-10-12T10:00:06Z","text":"Can you tell me who lives with you?","speaker":"staff"}},"successCriteria":[{"condition":"$statusCode == 201"},{"condition":"$response.body#/id == $steps.firstLine.outputs.id"},{"condition":"$response.header.Idempotent-Replayed == 'true'"}]},{"stepId":"pause","description":"The applicant asks to go off the record.","operationId":"pauseTranscript","parameters":[{"reference":"$components.parameters.caller"},{"reference":"$components.parameters.transcript"}],"requestBody":{"payload":{"at":"2026-10-12T10:00:10Z"}},"successCriteria":[{"condition":"$statusCode == 200"},{"condition":"$response.body#/status == 'paused'"}]},{"stepId":"lineSaidBeforeThePause","description":"A line said just before the pause arrives just after it. It started on the record, so it is kept.","operationId":"addTranscriptEntry","parameters":[{"reference":"$components.parameters.caller"},{"reference":"$components.parameters.transcript"},{"name":"Idempotency-Key","in":"header","value":"line-2"}],"requestBody":{"payload":{"kind":"line","startedAt":"2026-10-12T10:00:08Z","endedAt":"2026-10-12T10:00:11Z","text":"My two kids and my mother.","speaker":"client"}},"successCriteria":[{"condition":"$statusCode == 201"}]},{"stepId":"lineSaidDuringThePause","description":"A line said off the record is refused, even from faulty software.","operationId":"addTranscriptEntry","parameters":[{"reference":"$components.parameters.caller"},{"reference":"$components.parameters.transcript"},{"name":"Idempotency-Key","in":"header","value":"line-3"}],"requestBody":{"payload":{"kind":"line","startedAt":"2026-10-12T10:00:12Z","endedAt":"2026-10-12T10:00:13Z","text":"Off the record.","speaker":"client"}},"successCriteria":[{"condition":"$statusCode == 409"}]},{"stepId":"gapOverlappingThePause","description":"A lost stretch overlapping the pause is refused — the pause already accounts for that time.","operationId":"addTranscriptEntry","parameters":[{"reference":"$components.parameters.caller"},{"reference":"$components.parameters.transcript"},{"name":"Idempotency-Key","in":"header","value":"gap-1"}],"requestBody":{"payload":{"kind":"gap","startedAt":"2026-10-12T10:00:09Z","endedAt":"2026-10-12T10:00:11Z","cause":"connection"}},"successCriteria":[{"condition":"$statusCode == 409"}]},{"stepId":"resume","description":"Back on the record.","operationId":"resumeTranscript","parameters":[{"reference":"$components.parameters.caller"},{"reference":"$components.parameters.transcript"}],"requestBody":{"payload":{"at":"2026-10-12T10:00:20Z"}},"successCriteria":[{"condition":"$statusCode == 200"},{"condition":"$response.body#/status == 'recording'"}]},{"stepId":"lineSaidDuringThePastPause","description":"A late line from inside the pause that has ended is still refused.","operationId":"addTranscriptEntry","parameters":[{"reference":"$components.parameters.caller"},{"reference":"$components.parameters.transcript"},{"name":"Idempotency-Key","in":"header","value":"line-4"}],"requestBody":{"payload":{"kind":"line","startedAt":"2026-10-12T10:00:15Z","endedAt":"2026-10-12T10:00:16Z","text":"Still off the record.","speaker":"client"}},"successCriteria":[{"condition":"$statusCode == 409"}]},{"stepId":"timeline","description":"The timeline reads in the order things happened, with the pause in it.","operationId":"listTranscriptEntries","parameters":[{"reference":"$components.parameters.caller"},{"reference":"$components.parameters.transcript"}],"successCriteria":[{"condition":"$statusCode == 200"},{"condition":"$response.body#/total == 3"},{"condition":"$response.body#/items/2/kind == 'pause'"},{"condition":"$response.body#/items/2/endedAt == '2026-10-12T10:00:20Z'"}],"outputs":{"firstEntryId":"$response.body#/items/0/id"}},{"stepId":"clientEditsAnEntry","description":"Entries do not change — only the system may update one.","operationId":"updateTranscriptEntry","parameters":[{"reference":"$components.parameters.caller"},{"reference":"$components.parameters.transcript"},{"name":"entryId","in":"path","value":"$steps.timeline.outputs.firstEntryId"}],"requestBody":{"payload":{"endedAt":"2026-10-12T10:00:59Z"}},"successCriteria":[{"condition":"$statusCode == 403"}]},{"stepId":"close","description":"The interview ends.","operationId":"closeTranscript","parameters":[{"reference":"$components.parameters.caller"},{"reference":"$components.parameters.transcript"}],"requestBody":{"payload":{"at":"2026-10-12T10:00:30Z"}},"successCriteria":[{"condition":"$statusCode == 200"},{"condition":"$response.body#/status == 'closed'"}]},{"stepId":"lineAfterTheClose","description":"Nothing is added after the close.","operationId":"addTranscriptEntry","parameters":[{"reference":"$components.parameters.caller"},{"reference":"$components.parameters.transcript"},{"name":"Idempotency-Key","in":"header","value":"line-5"}],"requestBody":{"payload":{"kind":"line","startedAt":"2026-10-12T10:00:31Z","endedAt":"2026-10-12T10:00:32Z","text":"Too late.","speaker":"client"}},"successCriteria":[{"condition":"$statusCode == 409"}]}]}]}}]}</script>
<script type="module">
const { createMockServer, extract, generate, runScenario, operationIndex } =
  globalThis.BlueprintMock ?? await import('./mock.js');

const $ = (id) => document.getElementById(id);
const el = (tag, text = '', className = '') => {
  const node = document.createElement(tag);
  if (text !== '') node.textContent = text;
  if (className) node.className = className;
  return node;
};

/** Everything below the directory this page is served from. */
const basePath = location.pathname.replace(/\/[^/]*$/, '');

/** Where this checkout's contracts are browsable, if the build knew. */
const pageConfig = (() => {
  const tag = document.getElementById('page-config');
  try { return tag ? JSON.parse(tag.textContent) : {}; } catch { return {}; }
})();

let docs;          // every document in the set
let mock;          // the server derived from them
let seeded = true; // whether the last derive loaded the shipped records
let showAll = false;  // the walk-through, or the whole reference
// The contract set's Arazzo scenarios: whether they are what is showing, which
// one, and what its last run answered.
let scenarioMode = false;
let selectedScenario = null;
let scenarioRun = null;
const done = new Set(); // steps of the walk already run, by method and path
const made = new Map();  // collection → the id the walk created there
const built = new Map(); // schema name → the id the walk created of that shape
const answers = new Map(); // step → what it answered, so going back shows it
let selected = null;
// The reference's domain groups the reader has opened. The navigation is
// rebuilt on every click, and rebuilding from scratch used to collapse every
// group but the first — so picking an operation closed the one you were in.
let openDomains = null;
// What the reader picked for each path parameter, by operation and name, so a
// panel redrawn after a pick keeps it — and the parameters after it list the
// records under what was picked.
const chosen = new Map();
let transcript = false; // the whole walk at once, rather than a step at a time
let ran = 0;            // how long running it that way took
let ranCount = 0;       // how many of the steps that run actually sent

/**
 * The contract set, inlined by the single-file build or fetched beside the
 * page when it is served.
 */
const loadContracts = async () => {
  const inlined = document.getElementById('contracts-data');
  if (inlined) return JSON.parse(inlined.textContent);
  const response = await fetch('./contracts.json');
  if (!response.ok) throw new Error(`contracts.json: ${response.status}`);
  return response.json();
};

// Who the reference calls as, chosen above each request. The walk always
// calls as itself, so a choice made while exploring cannot break a step.
const WALK_CALLER = 'the-explorer';
const caller = { id: WALK_CALLER, type: 'user', roles: [] };

/**
 * The caller headers a request carries.
 *
 * The mock reads the kind of actor from the roles, so a kind other than
 * `user` goes in as one; an unauthenticated caller sends no identity at all.
 * A real deployment takes all of this from the sign-in token instead.
 */
const callerHeaders = () => {
  if (!showAll) return { 'X-Caller-Id': WALK_CALLER };
  const id = caller.id.trim();
  if (caller.type === 'unauthenticated' || !id) return {};
  const roles = caller.roles.filter((role) => role !== caller.type);
  if (caller.type !== 'user') roles.unshift(caller.type);
  return { 'X-Caller-Id': id, ...(roles.length ? { 'X-Caller-Roles': roles.join(',') } : {}) };
};

/** The kinds of actor an event can record, as the events contract lists them. */
const actorTypes = () => {
  const schema = docs.find((doc) => doc.type === 'schema' && doc.content?.$defs?.Event);
  const parts = schema?.content.$defs.Event.allOf ?? [];
  const authtype = parts.map((part) => part.properties?.authtype).find(Boolean);
  return (authtype?.enum ?? ['user']).filter((value) => value !== null);
};

/**
 * The roles a caller can hold: the set's RoleType, which its guards are
 * validated against. Empty when the set declares none.
 */
const roleTypes = () => {
  const schema = docs.find((doc) => Array.isArray(doc.content?.$defs?.RoleType?.enum));
  return schema?.content.$defs.RoleType.enum ?? [];
};

/**
 * Whether an operation takes an Idempotency-Key header — the shared
 * IdempotencyKeyParam, which an operation lists to require one per create.
 */
const takesIdempotencyKey = (op) => (op.operation?.parameters ?? [])
  .map((parameter) => deref(parameter, op.doc))
  .some((p) => p?.in === 'header' && typeof p.name === 'string' && p.name.toLowerCase() === 'idempotency-key');

/** The headers a step sends besides the caller's: a fresh key, where the operation takes one. */
const keyHeaders = (op, key = crypto.randomUUID()) =>
  takesIdempotencyKey(op) ? { 'Idempotency-Key': key } : {};

/**
 * The Idempotency-Key row: a fresh key each time the panel opens, which the
 * reader can type over — `12345` twice is how to see a retry answered with
 * the same entry, and `12345` with a different body how to see it refused.
 */
const idempotencyRow = () => {
  const row = el('div', '', 'caller');
  const box = el('input', '', 'caller-id');
  box.type = 'text';
  box.value = crypto.randomUUID();
  box.setAttribute('aria-label', 'Idempotency-Key');
  row.append(document.createTextNode('Idempotency-Key'), box);
  return { row, value: () => box.value.trim() };
};

/** The "Calling as" row: an id, a kind of actor, and roles. */
const callerRow = () => {
  const row = el('div', '', 'caller');
  const id = el('input', '', 'caller-id');
  id.type = 'text';
  id.value = caller.id;
  id.setAttribute('aria-label', 'Caller id');
  id.oninput = () => { caller.id = id.value; };

  const type = el('select', '', 'caller-type');
  type.setAttribute('aria-label', 'Caller type');
  type.append(...actorTypes().map((kind) => el('option', kind)));
  type.value = caller.type;
  id.disabled = caller.type === 'unauthenticated';
  type.onchange = () => { caller.type = type.value; id.disabled = type.value === 'unauthenticated'; };

  // A dropdown of the declared roles, any number checked; a box to type them
  // into for a set that declares none.
  let roles;
  const declared = roleTypes();
  if (declared.length > 0) {
    roles = el('details', '', 'caller-roles');
    const summary = el('summary');
    const label = () => { summary.textContent = caller.roles.length ? caller.roles.join(', ') : 'no roles'; };
    roles.append(summary);
    const list = el('div', '', 'menu');
    for (const role of declared) {
      const option = el('label');
      const box = el('input');
      box.type = 'checkbox';
      box.checked = caller.roles.includes(role);
      box.onchange = () => {
        caller.roles = declared.filter((name) => name === role ? box.checked : caller.roles.includes(name));
        label();
      };
      option.append(box, document.createTextNode(role));
      list.append(option);
    }
    roles.append(list);
    label();
  } else {
    roles = el('input', '', 'caller-roles');
    roles.type = 'text';
    roles.value = caller.roles.join(', ');
    roles.placeholder = 'roles, comma-separated';
    roles.oninput = () => { caller.roles = roles.value.split(',').map((role) => role.trim()).filter(Boolean); };
  }
  roles.setAttribute('aria-label', 'Caller roles');

  row.append(document.createTextNode('Calling as'), id, type, roles);
  return row;
};

const call = async (method, path, body, headers = {}) => {
  const init = { method, headers: { ...callerHeaders(), ...headers } };
  if (body instanceof FormData) {
    init.body = body;
  } else if (body !== undefined) {
    init.headers['content-type'] = 'application/json';
    init.body = typeof body === 'string' ? body : JSON.stringify(body);
  }
  const response = await mock.fetch(new Request(new URL(basePath + path, location.origin), init));
  const text = await response.text();
  let parsed;
  try { parsed = JSON.parse(text); } catch { parsed = text; }
  return { status: response.status, statusText: response.statusText, body: parsed };
};

// ── Reading the contracts ───────────────────────────────────────────────────

const openapiDocs = () => docs.filter((doc) => doc.type === 'openapi');

/** The server prefix an OpenAPI document's paths hang off. */
const prefixOf = (doc) => {
  const [server] = doc.content?.servers ?? [];
  if (!server?.url) return '';
  try { return new URL(server.url).pathname.replace(/\/$/, ''); } catch { return server.url; }
};

/**
 * Every operation the loaded documents declare, with where it came from.
 *
 * Read off the documents rather than the server's route table: the table
 * registers four extra methods on a read-only projection purely so they can
 * answer 405, and offering those is offering four ways to be told no.
 */
const operations = () => {
  const found = [];
  for (const doc of openapiDocs()) {
    const prefix = prefixOf(doc);
    for (const [declared, item] of Object.entries(doc.content?.paths ?? {})) {
      for (const [method, operation] of Object.entries(item ?? {})) {
        if (!/^(get|post|put|patch|delete)$/.test(method)) continue;
        found.push({
          method: method.toUpperCase(),
          path: prefix + declared,
          template: declared,
          operation,
          doc,
          domain: doc.domain ?? doc.content?.info?.['x-domain'] ?? 'other',
          summary: operation.summary ?? operation.operationId ?? `${method.toUpperCase()} ${declared}`,
        });
      }
    }
  }
  return found;
};

/** The state machine actions the loaded documents declare, by endpoint path. */
const actions = () => {
  const byPath = new Map();
  for (const doc of docs.filter((d) => d.type === 'state-machine')) {
    for (const machine of doc.content?.machines ?? []) {
      for (const action of machine.actions ?? []) {
        const from = action.transition?.from;
        byPath.set(action.id, {
          id: action.id,
          object: machine.object,
          from: Array.isArray(from) ? from : String(from ?? '').split(',').map((s) => s.trim()),
          to: action.transition?.to,
          // What the move does on the way through, which is how one
          // transition differs from the next. Without these every move in a
          // lifecycle has the same thing said about it.
          steps: action.steps ?? [],
          doc: doc.relativePath,
        });
      }
    }
  }
  return byPath;
};

/**
 * The paths every declared composition owns, including the ones it generates
 * beneath itself — section panels and the per-section review state.
 *
 * Without this they classify as ordinary item routes, and nineteen of them
 * pile into Resources, which is both wrong and the exact overwhelm this page
 * is supposed to avoid.
 */
const compositionPaths = () => {
  const owned = new Map();
  for (const doc of docs.filter((d) => d.type === 'compositions')) {
    for (const [name, declared] of Object.entries(doc.content?.compositions ?? {})) {
      const base = declared.endpoint?.path;
      if (!base) continue;
      owned.set(base, { name, doc: doc.relativePath });
      // A sectioned composition serves a panel per section and a progress
      // resource alongside it; both hang off the same declared path.
      for (const suffix of ['/{section}', '/{section}/{itemId}']) {
        owned.set(base + suffix, { name, doc: doc.relativePath });
      }
      const progress = base.replace(/\/[^/]+$/, '/review-progress');
      for (const suffix of ['/{section}', '/{section}/{itemId}']) {
        owned.set(progress + suffix, { name, doc: doc.relativePath });
      }
      for (const section of Object.keys(declared.sections ?? {})) {
        owned.set(`${base}/${section}`, { name, doc: doc.relativePath });
      }
    }
  }
  return owned;
};

/** The rulesets the loaded documents declare, and the examples for each. */
const rulesets = () => {
  const examples = new Map();
  for (const doc of docs.filter((d) => d.type === 'rules-examples')) {
    for (const [name, declared] of Object.entries(doc.content?.rulesets ?? {})) {
      examples.set(name, declared.examples ?? []);
    }
  }
  const found = [];
  for (const doc of docs.filter((d) => d.type === 'rules')) {
    for (const [name, declared] of Object.entries(doc.content?.rulesets ?? {})) {
      found.push({ name, ruleset: declared, doc: doc.relativePath, examples: examples.get(name) ?? [] });
    }
  }
  return found;
};

/**
 * What kind of thing an operation is.
 *
 * The affordance a reader needs differs completely between these, and the
 * contracts are what say which is which — a transition is only a transition
 * because a state machine declares an action whose endpoint this is.
 */
const classify = (op) => {
  const last = op.template.split('/').filter(Boolean).pop() ?? '';
  const act = actions().get(last);
  if (op.method === 'POST' && act) return { kind: 'transition', action: act };
  if (op.method === 'POST' && /\/evaluate-/.test(op.template)) {
    const name = last.replace(/^evaluate-/, '');
    const found = rulesets().find((r) => r.name.toLowerCase() === name.replace(/-/g, '').toLowerCase());
    return { kind: 'rules', ruleset: found ?? rulesets()[0] ?? null };
  }
  const composed = compositionPaths().get(op.template);
  if (composed) return { kind: 'composition', composition: composed };
  if (op.operation.requestBody?.content?.['multipart/form-data']) return { kind: 'upload' };
  if (/\/stream$/.test(op.template)) return { kind: 'stream' };
  if (op.template.includes('{')) return { kind: 'item' };
  return { kind: op.method === 'POST' ? 'create' : 'collection' };
};

// ── Example bodies ──────────────────────────────────────────────────────────

/** The schema an operation's JSON request body points at, dereferenced. */
const requestSchema = (op) => {
  const schema = op.operation.requestBody?.content?.['application/json']?.schema;
  return schema ? deref(schema, op.doc) : null;
};

/** A relative path, from the document at `from`: dirname, then each segment, with `..` going up. */
const resolveRelative = (from, relative) => {
  const parts = from.split('/').slice(0, -1);
  for (const segment of relative.split('/')) {
    if (segment === '..') parts.pop();
    else if (segment !== '.' && segment !== '') parts.push(segment);
  }
  return parts.join('/');
};

const deref = (node, doc, seen = 0) => {
  if (!node || typeof node !== 'object' || seen > 8) return node;
  if (typeof node.$ref !== 'string') return node;

  const [file, fragment = ''] = node.$ref.split('#');
  // Same document.
  if (file === '') {
    const target = fragment.replace(/^\//, '').split('/').reduce((at, key) => at?.[key], doc.content);
    return deref(target, doc, seen + 1);
  }

  // Another one. A relative reference resolves against the document it is
  // written in — `../../components/parameters.yaml` from
  // base/domains/transcription/ is base/components/parameters.yaml. One written
  // as a URL is matched on its tail, since the set is keyed by relative path.
  const relative = !/^[a-z]+:/i.test(file) && doc.relativePath
    ? resolveRelative(doc.relativePath, file)
    : null;
  const wanted = file.replace(/^.*?([^/]+\/[^/]+\/[^/]+)$/, '$1');
  const other = docs.find((candidate) => candidate.relativePath
    && (candidate.relativePath === relative
      || (!relative && (candidate.relativePath === wanted || candidate.relativePath.endsWith(wanted)))));
  if (!other) return node;
  const target = fragment
    ? fragment.replace(/^\//, '').split('/').reduce((at, key) => at?.[key], other.content)
    : other.content;
  return deref(target, other, seen + 1);
};

/**
 * A body worth pressing Execute on.
 *
 * In descending order of how much a reader learns from it: a record the
 * contract set already ships as mock data, with the server's own fields
 * stripped; then the schema's declared example; then something built from
 * the schema, which at least gets the enums right. Typing a correct body
 * from scratch is the thing that makes an unfamiliar API exhausting.
 */
const exampleBody = (op) => {
  // An edit worth watching: add to the list a derived field counts, so the
  // count moves on the next read. A `PATCH` that changes nothing visible
  // teaches nothing.
  if (op.kind === 'edit') {
    const counted = countedArray(op);
    if (counted) return attaching(op, { [counted.field]: counted.allowed.slice(0, 2) });
  }

  // A ruleset's inputs are nested and nobody can type them from memory. The
  // contract set ships described examples for exactly this reason.
  if (op.kind === 'rules') {
    const [first] = op.ruleset?.examples ?? [];
    if (first?.inputs) return first.inputs;
    const inputs = op.ruleset?.ruleset?.inputs ?? {};
    return Object.fromEntries(
      Object.entries(inputs).map(([name, declared]) => [name, fromSchema(declared, op.doc)])
    );
  }

  const schema = requestSchema(op);
  if (!schema) return null;

  const managed = new Set(['id', 'createdAt', 'updatedAt', 'status', '_links']);
  const writable = new Set(Object.keys(collectProperties(schema, op.doc)));

  for (const data of docs.filter((d) => d.type === 'mock-data' && d.domain === op.doc.domain)) {
    for (const record of Object.values(data.content ?? {})) {
      if (!record || typeof record !== 'object') continue;
      const body = Object.fromEntries(
        Object.entries(record).filter(([key]) => writable.has(key) && !managed.has(key))
      );
      if (Object.keys(body).length > 0) return attaching(op, body);
    }
  }

  if (op.operation.requestBody?.content?.['application/json']?.example) {
    return op.operation.requestBody.content['application/json'].example;
  }
  return attaching(op, fromSchema(schema, op.doc));
};

/**
 * Fill in a foreign key the walk can already satisfy.
 *
 * A field the contract says points at something, where the walk has made
 * one of those: send its id. This is what makes a relationship visible
 * rather than described — the request carries the id of the document
 * uploaded a step ago, and the record comes back with the document in it.
 */
const attaching = (op, body) => {
  const schema = requestSchema(op);
  if (!schema) return body;
  for (const [name, property] of Object.entries(collectProperties(schema, op.doc))) {
    const relationship = property['x-relationship'];
    if (relationship?.type !== 'fk') continue;
    const id = built.get(relationship.resource);
    if (id) body[name] = id;
  }
  return body;
};

/**
 * The parts of a body that is not JSON.
 *
 * One operation in the set declares `multipart/form-data`, and a textarea
 * full of JSON is the wrong affordance for it entirely. The parts and their
 * values come off the contract the same way a JSON body does; the bytes are
 * the one thing that cannot, because no contract can carry a file and
 * nothing in a shipped artifact should.
 */
const SENT_BYTES = 'Hashed on the way in, and then thrown away.\n';

const uploadParts = (op) => {
  const declared = op.operation?.requestBody?.content?.['multipart/form-data']?.schema;
  if (!declared) return null;
  const properties = collectProperties(deref(declared, op.doc), op.doc);

  const parts = [];
  for (const [name, property] of Object.entries(properties)) {
    const resolved = deref(property, op.doc);
    if (resolved?.format === 'binary') { parts.push({ name, bytes: true }); continue; }
    parts.push({ name, value: String(resolved?.example ?? valueFor(resolved, op.doc) ?? '') });
  }

  // Named after what it is, which the contract already says: a part called
  // `title` holding "April pay stub" makes april-pay-stub.txt.
  const titled = parts.find((part) => /title|name/i.test(part.name))?.value;
  const fileName = `${(titled || 'upload').toLowerCase().replace(/[^a-z0-9]+/g, '-')}.txt`;
  for (const part of parts) if (part.bytes) part.fileName = fileName;
  return parts;
};

/** What `uploadParts` describes, as something `fetch` can send. */
const asFormData = (parts) => {
  const form = new FormData();
  for (const part of parts) {
    if (part.bytes) form.append(part.name, part.file ?? new File([SENT_BYTES], part.fileName, { type: 'text/plain' }));
    else form.append(part.name, part.value);
  }
  return form;
};

/** Every property on a schema, following allOf. */
const collectProperties = (schema, doc) => {
  const out = {};
  for (const part of [schema, ...(schema?.allOf ?? [])]) {
    const resolved = deref(part, doc);
    Object.assign(out, resolved?.properties ?? {});
    for (const inner of resolved?.allOf ?? []) {
      Object.assign(out, deref(inner, doc)?.properties ?? {});
    }
  }
  return out;
};

/** A plausible value for each required property, taking enums seriously. */
const fromSchema = (schema, doc) => {
  // One of several shapes — a line or a gap — is shown as the first.
  const resolved = deref(schema, doc);
  if (Array.isArray(resolved?.oneOf) && resolved.oneOf.length > 0) return fromSchema(deref(resolved.oneOf[0], doc), doc);
  const properties = collectProperties(schema, doc);
  const required = new Set([
    ...(schema?.required ?? []),
    ...(schema?.allOf ?? []).flatMap((part) => deref(part, doc)?.required ?? []),
  ]);
  const body = {};
  for (const [name, declared] of Object.entries(properties)) {
    if (!required.has(name)) continue;
    body[name] = valueFor(deref(declared, doc), doc);
  }
  return Object.keys(body).length > 0 ? body : {};
};

const valueFor = (declared, doc) => {
  if (!declared) return null;
  if ('const' in declared) return declared.const;
  if (Array.isArray(declared.enum)) return declared.enum[0];
  switch (declared.type) {
    case 'integer': case 'number': return 0;
    case 'boolean': return false;
    case 'array': {
      const items = deref(declared.items, doc);
      return items ? [valueFor(items, doc)] : [];
    }
    case 'object': return fromSchema(declared, doc);
    default:
      if (declared.format === 'date-time') return new Date().toISOString();
      return declared.minLength > 0 ? 'example' : '';
  }
};

// ── Records, for the pickers ────────────────────────────────────────────────

/** The collection an item or transition path hangs off. */
const collectionOf = (op) => op.path.slice(0, op.path.indexOf('/{'));

/** What the server is holding in a collection, for a picker to offer. */
const recordsIn = async (path) => {
  const answered = await call('GET', `${path}?limit=50`);
  return Array.isArray(answered.body?.items) ? answered.body.items : [];
};

// ── Boot ────────────────────────────────────────────────────────────────────

/**
 * Throw the server away and derive it again from the documents.
 *
 * Not a reset of the data — a rebuild of the system. The route table, the
 * validators, the state machines and the rules are all produced again from
 * the contract set, and the time it takes is printed because it is the
 * claim: an entire backend, in about as long as a keystroke.
 */
const derive = async ({ seed = true, artifact } = {}) => {
  $('derived').textContent = 'deriving…';
  const started = performance.now();

  const set = artifact ?? contracts;
  docs = extract(set, 'docs');
  mock = await createMockServer({ contracts: set, basePath, seed });
  seeded = seed;

  const ms = Math.round(performance.now() - started);

  // What went in, named by kind.
  //
  // A raw file count is a vague answer and a third of it is shared schema
  // fragments that exist to be $ref'd. Those are not contracts and are not
  // worth a reader's attention, so they are not counted here: every number
  // below is something that declares behavior.
  const kinds = new Map();
  for (const doc of docs) kinds.set(doc.type, (kinds.get(doc.type) ?? 0) + 1);
  const CONTRACTS = [
    ['openapi', 'API', 'APIs'],
    ['state-machine', 'state machine', 'state machines'],
    ['rules', 'ruleset', 'rulesets'],
    ['compositions', 'composition', 'compositions'],
    ['asyncapi', 'event catalog', 'event catalogs'],
    ['annotations', 'annotation set', 'annotation sets'],
    ['registry', 'registry', 'registries'],
    ['sla-types', 'SLA definition', 'SLA definitions'],
  ];
  const counted = CONTRACTS
    .filter(([type]) => kinds.get(type))
    .map(([type, one, many]) => `${kinds.get(type)} ${kinds.get(type) === 1 ? one : many}`);
  const total = CONTRACTS.reduce((n, [type]) => n + (kinds.get(type) ?? 0), 0);

  // What seeding actually put there: example records the contract set
  // declares and validates against its own schemas, not production data.
  const examples = docs
    .filter((doc) => doc.type === 'mock-data')
    .reduce((n, doc) => n + Object.keys(doc.content ?? {}).length, 0);

  // Stacked, beside the title rather than under it. As a sentence this ran
  // to two wrapped lines of the one thing on the page nobody needs to read
  // twice; as a column it is scannable and costs no vertical space at all.
  const stat = (count, label, className = '') => {
    const row = el('div', '', `stat ${className}`.trim());
    row.append(el('span', String(count), 'n'), el('span', label));
    return row;
  };

  // Two columns for the breakdown. One per line was eleven rows deep and
  // made the masthead taller than it had been as a sentence, which is the
  // opposite of the point.
  const breakdown = el('div', '', 'breakdown');
  for (const [type, one, many] of CONTRACTS) {
    const count = kinds.get(type);
    if (count) breakdown.append(stat(count, count === 1 ? one : many));
  }

  // Side by side, on the same grid as the breakdown under them: what went
  // in and what came out, read left to right.
  const headline = el('div', '', 'breakdown headline');
  headline.append(stat(total, 'contracts', 'lead'), stat(mock.routes.size, 'routes', 'lead'));

  $('derived').replaceChildren(
    headline,
    breakdown,
    el('p', `derived in ${ms} ms · ${seed ? `${examples} examples seeded` : 'started empty'}`, 'when')
  );

  // The system is new, so nothing the walk did to the old one still holds:
  // the records it made are gone with the store that held them.
  selected = null;
  transcript = false;
  done.clear();
  made.clear();
  built.clear();
  answers.clear();
  renderGroups();
  renderStage();
};

// ── The groups ──────────────────────────────────────────────────────────────

/**
 * Operations in dependency order, which is the order a reader has to meet
 * them in: a composition needs a record to project, a transition needs a
 * record already in a particular state.
 */
const GROUPS = [
  {
    id: 'resources',
    title: 'Resources',
    about: 'Create, read, search and change records. The part of an API everyone already knows.',
    holds: (kind) => ['collection', 'create', 'item', 'upload'].includes(kind),
  },
  {
    id: 'compositions',
    title: 'Compositions',
    about: 'A shape nothing stores, assembled on read from wherever the pieces live.',
    holds: (kind) => kind === 'composition',
  },
  {
    id: 'behavior',
    title: 'Behavior',
    about: 'Not fields you set — moves the contract allows, and only from where it says.',
    holds: (kind) => kind === 'transition',
  },
  {
    id: 'rules',
    title: 'Rules',
    about: 'Policy the system evaluates, with the thresholds declared as inputs.',
    holds: (kind) => kind === 'rules',
  },
  {
    id: 'control',
    title: 'The mock itself',
    about: 'The only endpoints here that no contract declares. They belong to the harness, not to the system it is running — resetting it, reseeding it, and standing in for whatever has not been built.',
    holds: (kind) => kind === 'control' || kind === 'stub',
  },
];

/**
 * A handful worth being walked through, rather than everything there is.
 *
 * Sixty-two operations is a reference, and a reference is a bad first
 * impression: there is no way to tell which three of them are the point.
 * This takes one domain — whichever declares the most different *kinds* of
 * thing, so the walk covers the most ground — and from it one of each kind,
 * every move its lifecycle allows, and the shared event log. Chosen by rule
 * rather than by a list of paths, so another contract set curates itself.
 */
const curate = (ops) => {
  const kindsPerDomain = new Map();
  for (const op of ops) {
    const seen = kindsPerDomain.get(op.domain) ?? new Set();
    seen.add(op.kind);
    kindsPerDomain.set(op.domain, seen);
  }
  const lead = [...kindsPerDomain.entries()]
    .sort((a, b) => b[1].size - a[1].size
      || ops.filter((o) => o.domain === b[0]).length - ops.filter((o) => o.domain === a[0]).length)
    .map(([name]) => name)[0];

  const picked = [];
  const mine = ops.filter((op) => op.domain === lead);
  const shortest = (candidates) => [...candidates].sort((a, b) => a.path.length - b.path.length)[0];

  // The one body in the set that is not JSON, wherever it lives. A mock
  // that only parses JSON fails on the first file a client sends, so if the
  // contracts declare an upload, the walk does it.
  const upload = shortest(ops.filter((op) => op.kind === 'upload'));
  if (upload) picked.push(upload);

  // One of each kind, preferring the least nested, which is the one whose
  // point is easiest to see.
  for (const kind of ['create', 'collection', 'composition']) {
    const one = shortest(mine.filter((op) => op.kind === kind));
    if (one) picked.push(one);
  }
  // The edit, not the plain read. Reading a record straight back shows the
  // record you were just shown: this one declares no parameters to vary the
  // request with, so the step was a second look at the answer above it.
  // Everything it had to say — a derived field worked out again rather than
  // stored — the edit says while something is actually changing.
  const edit = shortest(mine.filter((op) => op.kind === 'item' && op.method === 'PATCH'));
  if (edit) picked.push(edit);
  // Every move, because a lifecycle with one move in it is not a lifecycle.
  picked.push(...mine.filter((op) => op.kind === 'transition'));
  // Every ruleset, wherever it lives: they do genuinely different jobs.
  picked.push(...ops.filter((op) => op.kind === 'rules'));
  // And the log they all write into.
  const log = ops.find((op) => op.kind === 'collection' && /\/events$/.test(op.path));
  if (log) picked.push(log);

  return picked;
};

/**
 * What identifies a step, for remembering it has been run.
 *
 * The walk visits one operation twice — the event log whole, then narrowed
 * — so the method and path alone do not tell two steps apart. The variant
 * does, and unlike the query string it does not change as the walk fills
 * in the record it is following.
 */
const keyOf = (op) => `${op.method} ${op.path}${op.variant ? ` (${op.variant})` : ''}`;

/**
 * Print a contract node the way it was authored.
 *
 * The artifact is parsed data, so there is no original text to quote — this
 * renders the node back to YAML. Only the shapes contracts actually use are
 * handled, which is the whole point: it is here to show four lines of a state
 * machine, not to be a serializer.
 */
const asYaml = (node, indent = 0) => {
  const pad = '  '.repeat(indent);
  if (node === null || node === undefined) return 'null';
  if (Array.isArray(node)) {
    if (node.every((v) => v === null || typeof v !== 'object')) return `[${node.join(', ')}]`;
    return '\n' + node.map((v) => `${pad}- ${asYaml(v, indent + 1).replace(/^\n/, '').trimStart()}`).join('\n');
  }
  if (typeof node === 'object') {
    const entries = Object.entries(node).filter(([, v]) => v !== undefined);
    if (entries.length === 0) return '{}';
    return '\n' + entries
      .map(([k, v]) => {
        const printed = asYaml(v, indent + 1);
        return printed.startsWith('\n')
          ? `${pad}${k}:${printed}`
          : `${pad}${k}: ${printed}`;
      })
      .join('\n');
  }
  if (typeof node === 'string' && (node === '' || /[:#]/.test(node))) return JSON.stringify(node);
  return String(node);
};

/**
 * Strip what the step does not talk about.
 *
 * Every contract node carries a `description`, and no step narrates one — the
 * step has its own prose for that, and the excerpt is there to show structure.
 * Leaving them in buries the two lines that matter under paragraphs nobody
 * reads at that moment.
 */
const essential = (node) => {
  if (Array.isArray(node)) return node.map(essential);
  if (node === null || typeof node !== 'object') return node;
  return Object.fromEntries(
    Object.entries(node)
      .filter(([key]) => key !== 'description')
      .map(([key, value]) => [key, essential(value)])
  );
};

/** A path with its parameters filled in, or left as written where they are not. */
const withParams = (path, params) => Object.entries(params).reduce(
  (at, [name, value]) => (value ? at.replace(`{${name}}`, encodeURIComponent(value)) : at),
  path
);

/** `applications` → `application`, for naming a step after what it acts on. */
const singular = (plural) => plural.replace(/ies$/, 'y').replace(/s$/, '');

/**
 * The resource an operation acts on.
 *
 * For anything hanging off a record — a composition, a transition — that is
 * the record, not the last segment of the path: a view of an application is
 * not "a view of the review".
 */
const subjectOf = (op) => {
  const path = op.path.includes('/{') ? op.path.slice(0, op.path.indexOf('/{')) : op.path;
  const parts = path.split('/').filter(Boolean).filter((part) => !part.startsWith('{'));
  return singular(parts[parts.length - 1] ?? 'record');
};

/**
 * A query string that uses what the operation declares.
 *
 * Listing six parameters in the notes while sending none of them described
 * a feature instead of showing it — and `q` is the one a reader would most
 * want to see working. The values come from the contract: the search term
 * is an enum the records actually carry, the sort field is one `x-sortable`
 * permits.
 */
const listQuery = (op, searchFor) => {
  const declared = new Set((op.operation.parameters ?? [])
    .map((parameter) => deref(parameter, op.doc)?.name)
    .filter(Boolean));

  const schema = responseSchema(op);
  const props = schema ? collectProperties(schema, op.doc) : {};
  const [declaredTerm] = Object.values(props)
    .map((prop) => deref(prop, op.doc))
    .filter((prop) => Array.isArray(prop?.enum) && !prop.readOnly)
    .map((prop) => prop.enum[0]);
  const term = searchFor ?? declaredTerm;

  const sortable = op.operation['x-sortable']?.fields ?? [];
  const parts = [];
  if (declared.has('q') && term) parts.push(`q=${encodeURIComponent(term)}`);
  if (declared.has('sort') && sortable.length > 0) parts.push(`sort=-${sortable[0]}`);
  if (declared.has('limit')) parts.push('limit=5');
  return parts.join('&');
};

/**
 * The lifecycle in the order it is actually lived, rather than the order the
 * actions happen to be written in.
 */
const lifecycleOrder = (transitions, { happyPathOnly = false } = {}) => {
  const reachable = new Set(transitions.map((op) => op.action.to));
  const starts = transitions.filter((op) => op.action.from.every((state) => !reachable.has(state)));
  const ordered = [];
  const left = [...transitions];
  let at = starts[0]?.action.from ?? [];

  while (left.length > 0) {
    const index = left.findIndex((op) => op.action.from.some((state) => at.includes(state)));
    if (index === -1) break;
    const [next] = left.splice(index, 1);
    ordered.push(next);
    at = [next.action.to];
  }
  // Whatever is left could not be reached by walking forward: withdraw, and
  // anything else that leaves the path rather than continuing along it. Real
  // moves, and in the reference — but following Close with Withdraw reads
  // like a step rather than the alternative ending it is.
  return happyPathOnly ? ordered : [...ordered, ...left];
};

/**
 * The policies attached to the fields of what an operation returns, and the
 * regulation each one cites.
 *
 * Annotations key off `object.field` and name policies; a registry every
 * domain shares resolves each policy to a citation and a sentence. Neither
 * is an endpoint and neither appears in a response, so without this the
 * most defensible thing in the contract set is invisible.
 */
const policiesOn = (op) => {
  const answers = op.operation.responses ?? {};
  const name = refName((answers['200'] ?? answers['201'])?.content?.['application/json']?.schema);
  if (!name) return [];
  const object = name.charAt(0).toLowerCase() + name.slice(1);

  const registry = new Map();
  for (const doc of docs.filter((d) => d.type === 'registry' && /polic/.test(d.relativePath))) {
    for (const [id, entry] of Object.entries(doc.content?.entries ?? {})) registry.set(id, entry);
  }

  const found = [];
  for (const doc of docs.filter((d) => d.type === 'annotations')) {
    for (const [path, declared] of Object.entries(doc.content?.schema ?? {})) {
      const [on, field] = path.split('.');
      if (on !== object || !field || !declared?.policies?.length) continue;
      const policy = declared.policies[0];
      const entry = registry.get(policy) ?? {};
      found.push({
        field,
        policy,
        citation: entry.citation ?? null,
        summary: (entry.description ?? '').trim().split('\n')[0],
      });
    }
  }
  return found;
};

/**
 * Annotated fields on the objects hanging off this one.
 *
 * A household member's date of birth answers to CHIP age rules and to SNAP
 * deductions at once. That lives under `applicationMember`, not
 * `application`, so looking only at the object returned misses it.
 */
const relatedPolicies = (op) => {
  const answers = op.operation.responses ?? {};
  const name = refName((answers['200'] ?? answers['201'])?.content?.['application/json']?.schema);
  if (!name) return [];
  const object = name.charAt(0).toLowerCase() + name.slice(1);
  const found = [];
  for (const doc of docs.filter((d) => d.type === 'annotations')) {
    for (const [path, declared] of Object.entries(doc.content?.schema ?? {})) {
      const [on, field] = path.split('.');
      if (!field || on === object || !on?.startsWith(object)) continue;
      if ((declared?.policies ?? []).length < 2) continue;
      found.push({ object: on, field, policies: declared.policies });
    }
  }
  return found;
};

/**
 * The array a derived field counts, and the values its contract allows.
 *
 * `programCount` is `$this.programsAppliedFor.size()`, so the way to show
 * that it is computed rather than stored is to change the list and read the
 * count back. Which list, and what may go in it, both come out of the
 * contract rather than being named here.
 */
const countedArray = (op) => {
  const schema = responseSchema(op);
  if (!schema) return null;
  const props = collectProperties(schema, op.doc);
  for (const [name, declared] of Object.entries(props)) {
    const expression = deref(declared, op.doc)?.['x-derived'];
    const counts = typeof expression === 'string' && expression.match(/\$this\.(\w+)\.size\(\)/);
    if (!counts) continue;
    const field = deref(props[counts[1]], op.doc);
    const allowed = deref(field?.items, op.doc)?.enum;
    if (Array.isArray(allowed) && allowed.length > 1) {
      return { derived: name, field: counts[1], allowed, expression };
    }
  }
  return null;
};

/** The schema an operation answers with, dereferenced. */
const responseSchema = (op) => {
  const answers = op.operation.responses ?? {};
  const ok = answers['200'] ?? answers['201'] ?? answers['202'];
  let schema = ok?.content?.['application/json']?.schema;
  schema = schema ? deref(schema, op.doc) : null;
  // A collection answers with an envelope; the interesting shape is inside.
  const items = schema?.properties?.items;
  return items ? deref(deref(items, op.doc).items, op.doc) : schema;
};

const listOf = (names) => names.map((name) => `\`${name}\``).join(', ');

/**
 * The field a pause condition watches, and the values that trigger it.
 *
 * These are written as JsonLogic. Printed raw in a sentence —
 * `{"in":[{"var":"status"},["withdrawn"]]}` — it is unreadable, and no
 * reader is going to parse it mid-paragraph. This pulls out the two parts
 * worth saying and leaves the rest to the excerpt.
 */
const pausedOn = (rule) => {
  if (!rule) return null;
  const field = JSON.stringify(rule).match(/"var":"([^"]+)"/)?.[1];
  const values = [];
  const walk = (node) => {
    if (typeof node === 'string') values.push(node);
    else if (Array.isArray(node)) node.forEach(walk);
    else if (node && typeof node === 'object') Object.values(node).forEach(walk);
  };
  walk(rule);
  const wanted = values.filter((value) => value !== field);
  return wanted.length > 0 ? { field, values: wanted } : null;
};

/** The name a schema is declared under, from a `$ref`. */
const refName = (node) => (typeof node?.$ref === 'string' ? node.$ref.split('/').pop() : null);

/** What an operation takes and what it gives back, by name. */
const shapesOf = (op) => {
  const sent = refName(op.operation.requestBody?.content?.['application/json']?.schema);
  const answers = op.operation.responses ?? {};
  const ok = answers['201'] ?? answers['200'] ?? answers['202'];
  return { sent, got: refName(ok?.content?.['application/json']?.schema) };
};

/**
 * What to notice, read off the contract for this exact operation.
 *
 * Generic sentences about what a composition "is" sound like marketing and
 * teach nobody anything. A reader wants the join: this field, in this
 * document, is why the server did that. So every line below names something
 * they can go and look at — a flag on a property, an expression, a state, a
 * citation — rather than describing the idea in the abstract.
 */
const noticesFor = (op, wasSent) => {
  const out = [];
  const schema = responseSchema(op);
  const props = schema ? collectProperties(schema, op.doc) : {};
  const resolved = Object.fromEntries(
    Object.entries(props).map(([name, declared]) => [name, deref(declared, op.doc)])
  );

  // `links` and `_links` are the resolver's work, not an author's — naming
  // them in a list of fields somebody declared is misleading twice over.
  const readOnly = Object.entries(resolved)
    .filter(([name, declared]) => declared?.readOnly && !declared['x-derived'] && !/^_?links$/.test(name))
    .map(([name]) => name);
  const derived = Object.entries(resolved).filter(([, declared]) => declared?.['x-derived']);
  const enums = Object.entries(resolved).filter(([, declared]) => Array.isArray(declared?.enum));

  // Each step says what is new about *it*. The same three lines on create,
  // read, edit and list taught nothing after the first and made the box
  // look like boilerplate, which is how a reader learns to skip it.
  // Two schemas, not one — and it is the reason the rest of this is true.
  const { sent, got } = shapesOf(op);
  const article = (word) => (/^[aeiou]/i.test(word) ? 'an' : 'a');
  if (['create', 'edit'].includes(op.kind) && sent && got && sent !== got) {
    out.push((op.explainSplit ?? true)
      ? `You sent ${article(sent)} \`${sent}\` and got back ${article(got)} \`${got}\` — two `
        + 'schemas, not one. The contract declares the shape a client may write separately from '
        + 'the shape the system keeps.'
      : `A third shape: \`${sent}\` is what you may send here, and it is not \`${got}\` either.`);
  }

  if (op.kind === 'upload') {
    const parts = uploadParts(op) ?? [];
    const file = parts.find((part) => part.bytes);
    if (file) {
      out.push(`This body is \`multipart/form-data\`, not JSON. The contract declares \`${file.name}\` `
        + 'with `format: binary`, which is how an OpenAPI document says bytes, and '
        + `${listOf(parts.filter((part) => !part.bytes).map((part) => part.name))} alongside it as `
        + 'ordinary fields. One operation in the whole set sends something that is not JSON, and '
        + 'it is the one most mocks fall over on.');
    }
    out.push('What came back describes the upload and does not contain it. The bytes were hashed '
      + 'as they were read and then dropped — `contentHash` and `sizeBytes` are kept on the '
      + 'version this created, which `latestVersionId` names, and the file itself is nowhere. '
      + 'Nothing the mock holds can leak something nobody meant to share.');
  }

  // Whichever step actually carries a foreign key to something the walk has
  // made — read off the body being sent rather than placed on a step, so
  // moving the upload moves this with it.
  if (['create', 'edit'].includes(op.kind)) {
    const sending = wasSent ?? exampleBody(op) ?? {};
    for (const [name, property] of Object.entries(collectProperties(requestSchema(op) ?? {}, op.doc))) {
      if (property['x-relationship']?.type !== 'fk' || sending[name] === undefined) continue;
      const { resource, domain } = property['x-relationship'];
      // The read shape renames an expanded field, so the one to point at is
      // not the one that was sent.
      const expanded = Object.entries(props)
        .find(([, declared]) => declared?.['x-relationship']?.style === 'expand')?.[0];
      out.push(`\`${name}\` is the id of the \`${resource}\` you uploaded a moment ago, and `
        + `${expanded ? `\`${expanded}\`` : 'what came back'} is the whole record. The `
        + `${domain ?? op.domain} domain declares that shape, this one declares a relationship to `
        + 'it, and the mock put what the id points at where the id was — one request rather than '
        + 'two, and nothing joining them in a client.');
    }
  }

  if (op.kind === 'create') {
    if (readOnly.length > 0) {
      out.push(`${listOf(readOnly.slice(0, 5))} are marked \`readOnly\`, so they are not on the shape `
        + 'you sent at all. The server filled them in because the contract says they exist.');
    }
    for (const [name, declared] of derived) {
      out.push(`\`${name}\` is declared as a derived field, with the expression `
        + `\`${declared['x-derived']}\`. Nothing stores it: the mock evaluates that expression `
        + 'every time the record is read.');
    }
    for (const [name, declared] of enums.slice(0, 1)) {
      out.push(`\`${name}\` is an enum in the contract — ${declared.enum.map((v) => `\`${v}\``).join(', ')}. `
        + 'A value outside that list is refused by the schema, and no validation was written for '
        + 'this endpoint to do it.');
    }
  }

  if (op.kind === 'edit') {
