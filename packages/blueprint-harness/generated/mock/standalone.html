<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not your average Mock Server</title>
<!--
  A playground over the browser mock, rather than a tour of it.

  The page is generated from the contracts twice over: the server is, and so
  is this. Which operations exist, what kind of thing each one is, what a
  sensible body looks like, which records you can act on and which moves are
  legal from where they are — every one of those comes out of the contract
  set, which is why this can do things a generic API client cannot. Postman
  hands you a box and wishes you luck.

  Operations are grouped in dependency order, and the order is real rather
  than pedagogical: a composition needs a record to project, a transition
  needs a record already in a particular state. Resources first is not a
  teaching conceit, it is what has to happen.
-->
<style>
  :root {
    --ink: #1a1a1a; --muted: #555; --faint: #888; --line: #e2e2e2;
    --bg: #fafafa; --card: #fff; --accent: #2b6cb0; --ok: #2f7a3f; --bad: #b02b2b;
    --warm: #8a6d3b;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  /* Any `display` on a rule beats the user agent's `[hidden] { display: none }`,
     so an element given a layout and then hidden in script stays on screen.
     That has now produced two bugs — an empty bordered box, and a Next button
     offering to skip a step nobody had run. Settled here instead of per rule. */
  [hidden] { display: none !important; }
  body {
    margin: 0; padding: 0 0 5rem; background: var(--bg); color: var(--ink);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  h1 { font-size: 1.4rem; margin: 0; }
  code { font-family: var(--mono); font-size: .88em; }

  #masthead {
    max-width: 86rem; margin: 0 auto; padding: 1.6rem 1.2rem 1.1rem;
    border-bottom: 1px solid var(--line);
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2rem; align-items: start;
  }
  /* Two cells, not four rows: as separate rows the left-hand items were
     stretched to match whichever side was taller, which put a hand's width
     of nothing between the title and the text under it. */
  #masthead .intro { min-width: 0; }
  #derived {
    align-self: start;
    border: 1px solid var(--line); border-radius: 6px; background: var(--card);
    padding: .6rem .8rem; min-width: 17rem;
  }
  #derived .when {
    margin: .45rem 0 0; padding-top: .4rem; border-top: 1px solid var(--line);
    font-size: .66rem; letter-spacing: .04em; text-transform: uppercase;
    color: var(--faint); font-weight: 700;
  }
  #derived .stat {
    display: flex; gap: .4rem; align-items: baseline;
    font-size: .75rem; color: var(--muted); line-height: 1.45;
  }
  #derived .stat .n {
    font-family: var(--mono); min-width: 1.4rem; text-align: right; color: var(--ink);
  }
  #derived .stat.lead { font-size: .92rem; color: var(--ink); font-weight: 600; line-height: 1.3; }
  #derived .stat.lead .n { color: var(--accent); min-width: 1.9rem; }
  #derived .breakdown {
    display: grid; grid-template-columns: 1fr 1fr; column-gap: .9rem;
    margin-top: .45rem; padding-top: .4rem; border-top: 1px solid var(--line);
  }
  #derived .headline { margin-top: 0; padding-top: 0; border-top: 0; }
  @media (max-width: 60rem) {
    #masthead { grid-template-columns: 1fr; }
    #derived { grid-column: 1; grid-row: auto; }
  }
  .lede { color: var(--muted); margin: .4rem 0 0; max-width: 44rem; font-size: .95rem; }

  /* Throwing the whole thing away and deriving it again, which is the
     headline claim and takes about as long as a keystroke. */
  #controls { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; margin: .9rem 0 0; }
  #controls .sep { border-left: 1px solid var(--line); height: 1.4rem; margin: 0 .2rem; }
  #controls button:not(.primary) {
    font: inherit; font-size: .85rem; cursor: pointer; padding: .4rem 1rem;
    border-radius: 4px; border: 1px solid var(--line); background: var(--card); color: var(--ink);
  }
  #controls button:disabled { opacity: .4; cursor: not-allowed; }
  /* Who the reference calls as. Every request carries it, the way a real
     client's sign-in would, and the events it causes record it. */
  .caller { display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; margin: 0 0 .6rem; font-size: .85rem; color: var(--muted); }
  .caller input, .caller select { width: auto; }
  .caller .caller-id { width: 9rem; }
  .caller input.caller-roles { width: 15rem; }
  details.caller-roles { position: relative; }
  details.caller-roles summary {
    cursor: pointer; font-family: var(--mono); font-size: .8rem; padding: .4rem .5rem; min-width: 12rem;
    border: 1px solid var(--line); border-radius: 4px; background: #fcfcfc; color: var(--ink);
  }
  details.caller-roles .menu {
    position: absolute; z-index: 5; margin-top: .2rem; padding: .3rem .5rem; min-width: 100%;
    border: 1px solid var(--line); border-radius: 4px; background: var(--card); box-shadow: 0 2px 8px rgba(0,0,0,.08);
  }
  details.caller-roles .menu label { display: flex; gap: .4rem; align-items: center; padding: .15rem 0; font-family: var(--mono); font-size: .8rem; color: var(--ink); white-space: nowrap; }
  details.caller-roles .menu input { width: auto; }
  .caller .caller-id:disabled { opacity: .4; }


  #shell {
    display: grid; grid-template-columns: 17rem minmax(0, 1fr);
    gap: 2rem; max-width: 86rem; margin: 1.4rem auto 0; padding: 0 1.2rem;
  }
  #groups {
    position: sticky; top: 1rem; align-self: start;
    max-height: calc(100vh - 2rem); overflow: auto;
    border-right: 1px solid var(--line); padding-right: .8rem;
  }
  .group > summary {
    cursor: pointer; list-style: none; padding: .45rem .3rem;
    font-size: .76rem; letter-spacing: .06em; text-transform: uppercase;
    font-weight: 700; color: var(--ink);
  }
  .group > summary::-webkit-details-marker { display: none; }
  .group > summary::before { content: '▸ '; color: var(--faint); }
  .group[open] > summary::before { content: '▾ '; }
  .kind {
    margin: .5rem 0 .1rem .3rem; font-size: .68rem; letter-spacing: .05em;
    text-transform: uppercase; color: var(--faint); font-weight: 700;
  }
  .ops { list-style: none; margin: 0 0 .5rem; padding: 0; }
  .op {
    display: block; width: 100%; text-align: left; border: 0; background: none;
    font: inherit; font-size: .8rem; cursor: pointer; color: var(--muted);
    padding: .22rem .45rem; border-radius: 4px; line-height: 1.35;
  }
  .op:hover { background: #f1f4f8; color: var(--ink); }
  .op.here { background: #eef4fb; color: var(--accent); font-weight: 600; }
  .steps { counter-reset: none; }
  .op.step { padding: .34rem .45rem; font-size: .84rem; }
  .op .n {
    font-family: var(--mono); font-size: .7rem; color: var(--faint);
    display: inline-block; min-width: 1.9rem;
  }
  .op.step.here .n { color: var(--accent); }
  .panel .watch {
    margin: 1rem 0 0; padding: .8rem 1rem .9rem; font-size: .9rem; color: var(--ink);
    background: #f4f9f4; border: 1px solid #d6e8d6; border-radius: 4px; max-width: 48rem;
  }
  .watch-title {
    margin: 0 0 .5rem; font-size: .68rem; letter-spacing: .06em; text-transform: uppercase;
    font-weight: 700; color: var(--ok);
  }
  .panel .watch ul { margin: 0; padding-left: 1.1rem; }
  /* The anchor for the cards below: they span the bullet rather than hang
     off the word, so one near the right-hand edge has nowhere to overflow
     to and every card opens in the same place. */
  .panel .watch li { margin: 0 0 .45rem; line-height: 1.55; position: relative; }
  .panel .watch li:last-child { margin-bottom: 0; }
  .panel .watch code { background: #e4efe4; padding: .08em .3em; border-radius: 3px; }
  .panel .watch .ref > code {
    border-bottom: 1px dotted var(--ok); cursor: help; outline: none;
  }
  .panel .watch .ref > code:hover, .panel .watch .ref > code:focus { background: #cfe4cf; }
  .panel .watch .ref .card {
    display: none; position: absolute; left: 0; right: 0; top: calc(100% + .25rem);
    z-index: 5; background: var(--card); border: 1px solid #cfd6de; border-radius: 4px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, .13); padding: .55rem .7rem .6rem;
  }
  .panel .watch .ref:hover .card, .panel .watch .ref:focus-within .card { display: block; }
  .panel .watch .card .excerpt {
    margin: 0; background: #fcfbf7; border-color: #e6ded0; border-left: 3px solid var(--warm);
    max-height: 18rem; font-size: .73rem;
  }
  .panel .watch .card .whole {
    display: inline-block; margin: .45rem 0 0; font-family: var(--mono); font-size: .7rem;
    color: var(--accent); text-decoration: none; border-bottom: 1px dotted currentColor;
  }
  .panel .watch .card code { background: none; padding: 0; }
  .op .n.run { color: var(--ok); font-weight: 700; }
  .to-come { margin: .5rem 0 0 .45rem; font-size: .78rem; color: var(--faint); font-style: italic; }
  .row { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
  /* The other way through: dashed, because it is the alternative route and
     should not compete with the step you are being offered. */
  button.run-all {
    font: inherit; font-size: .8rem; cursor: pointer; padding: .4rem .8rem;
    border-radius: 4px; border: 1px dashed #c3cdd8; background: var(--card); color: var(--muted);
  }
  button.run-all:hover { color: var(--accent); border-color: var(--accent); border-style: solid; }
  button.run-all:disabled { opacity: .6; cursor: progress; }
  #groups button.run-all { display: block; width: 100%; margin: .7rem 0 .3rem; }
  .pager {
    display: flex; gap: .6rem; align-items: center; justify-content: space-between;
    margin-top: 1rem;
  }
  .pager .step-back {
    font: inherit; font-size: .82rem; cursor: pointer; padding: .35rem .8rem;
    border-radius: 4px; border: 1px solid var(--line); background: var(--card); color: var(--muted);
  }
  .pager .step-back:hover { color: var(--ink); border-color: #cfd6de; }
  /* Pushed right when it is the only one, so it sits where it always sits. */
  .pager .next-step { margin-left: auto; }
  .op .verb {
    font-family: var(--mono); font-size: .68rem; font-weight: 700;
    display: inline-block; min-width: 3.4rem; color: var(--faint);
  }
  .op.here .verb { color: var(--accent); }

  #stage { min-width: 0; }
  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: 6px;
    padding: 1.1rem 1.2rem; margin: 0 0 1.2rem;
  }
  .panel .kindline {
    font-size: .68rem; letter-spacing: .05em; text-transform: uppercase;
    font-weight: 700; color: var(--accent); margin: 0 0 .25rem;
  }
  .panel h2 { font-size: 1.05rem; margin: 0 0 .2rem; }
  .panel .about {
    color: var(--muted); font-size: .9rem; margin: 0 0 .8rem; padding: 0 0 .8rem;
    border-bottom: 1px solid var(--line); max-width: 46rem;
  }
  .panel .path { font-family: var(--mono); font-size: .82rem; color: var(--accent); margin: 0 0 .7rem; }
  .panel .note { color: var(--muted); font-size: .9rem; margin: 0 0 .9rem; max-width: 46rem; }
  .panel .cited { font-family: var(--mono); font-size: .74rem; color: var(--faint); margin: 0 0 .9rem; }
  .panel .cited code { background: #eef2f6; color: var(--ink); padding: .08em .3em; border-radius: 3px; }
  .panel .cited a { color: var(--accent); text-decoration: none; border-bottom: 1px dotted currentColor; }
  .panel .cited a:hover { border-bottom-style: solid; }

  label.field { display: block; margin: 0 0 .7rem; font-size: .82rem; color: var(--muted); }
  label.field > span { display: block; margin-bottom: .22rem; }
  .shape { margin: .9rem 0 .25rem; }
  .shape > summary {
    cursor: pointer; list-style: none;
    font-family: var(--mono); font-size: .74rem; color: var(--faint);
  }
  .shape > summary::-webkit-details-marker { display: none; }
  .shape > summary::before { content: '▸ '; }
  .shape[open] > summary::before { content: '▾ '; }
  .shape > summary:hover { color: var(--accent); }
  .shape code { background: #eef2f6; color: var(--ink); padding: .08em .3em; border-radius: 3px; }
  .shape .excerpt {
    margin: .4rem 0 0; background: #fcfbf7; border-color: #e6ded0; border-left: 3px solid var(--warm);
    max-height: 22rem; font-size: .74rem;
  }
  .shape .whole {
    display: inline-block; margin: .4rem 0 0; font-family: var(--mono); font-size: .72rem;
    color: var(--accent); text-decoration: none; border-bottom: 1px dotted currentColor;
  }
  label.field .shape { margin-top: 0; }
  label.field code { background: #eef2f6; padding: .08em .3em; border-radius: 3px; }
  label.field a { color: var(--accent); text-decoration: none; border-bottom: 1px dotted currentColor; }
  input[type=text], select, textarea {
    width: 100%; font-family: var(--mono); font-size: .8rem; padding: .4rem .5rem;
    border: 1px solid var(--line); border-radius: 4px; background: #fcfcfc; color: var(--ink);
  }
  textarea { min-height: 9rem; resize: vertical; line-height: 1.5; }
  textarea.fixed { background: #f3f3f3; color: var(--muted); cursor: default; }
  /* The parts of a body that is not JSON, listed rather than serialized:
     there is no text form of a multipart request worth showing anybody. */
  pre.parts { background: #f3f3f3; border-color: var(--line); color: var(--muted); }
  input[type=file] { font: inherit; font-size: .8rem; color: var(--muted); }

  button.primary {
    font: inherit; font-size: .85rem; cursor: pointer; padding: .4rem 1rem;
    border-radius: 4px; border: 1px solid var(--accent); background: var(--accent); color: #fff;
  }
  button.primary:disabled { opacity: .45; cursor: not-allowed; }
  button.primary:disabled[data-done] { opacity: .6; }

  pre {
    margin: .8rem 0 0; padding: .7rem .8rem; max-height: 26rem; overflow: auto;
    background: #f7f9fc; border: 1px solid #dbe4f0; border-radius: 4px;
    font-family: var(--mono); font-size: .76rem; line-height: 1.5; white-space: pre-wrap;
  }
  pre .label {
    display: block; font-family: inherit; font-size: .68rem; letter-spacing: .04em;
    text-transform: uppercase; color: var(--accent); margin-bottom: .35rem; font-weight: 600;
  }
  pre .label code { font-family: var(--mono); text-transform: none; letter-spacing: 0; }
  pre .label a { color: inherit; text-transform: none; letter-spacing: 0; border-bottom: 1px dotted currentColor; text-decoration: none; }
  pre.bad { background: #fdf6f6; border-color: #eccfcf; }
  /* A scenario's steps: what each called, what came back, what it checked. */
  ol.scenario-steps { padding-left: 1.2rem; margin: .8rem 0 0; }
  ol.scenario-steps > li { margin: 0 0 .9rem; }
  .scenario-steps .step-head { display: flex; gap: .5rem; align-items: baseline; flex-wrap: wrap; }
  .scenario-steps .mark { font-weight: 700; width: 1rem; }
  .scenario-steps .mark.passed { color: var(--ok); }
  .scenario-steps .mark.failed { color: var(--bad); }
  .scenario-steps .mark.pending { color: var(--muted); }
  .scenario-steps .call { font-family: var(--mono); font-size: .8rem; color: var(--accent); }
  .scenario-steps .checks { list-style: none; padding: 0; margin: .3rem 0 0; font-family: var(--mono); font-size: .78rem; }
  .scenario-steps .checks .passed { color: var(--ok); }
  .scenario-steps .checks .failed { color: var(--bad); }
  .scenario-steps details { margin-top: .3rem; font-size: .8rem; }
  pre.bad .label { color: var(--bad); }

  .empty { color: var(--faint); font-size: .9rem; }
  @media (max-width: 60rem) {
    #shell { grid-template-columns: 1fr; }
    #groups { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header id="masthead">
  <div class="intro">
    <h1>Not your average Mock Server</h1>
    <p class="lede">
      An entire server, generated from a set of contracts, running in this tab.
      <b>No custom code.</b> Everything is derived on the fly when the server
      boots. Change a contract and the API changes with it; hand it a different
      contract set and it is a different system.
    </p>
    <div id="controls">
      <button id="mode" class="primary">Let me explore</button>
      <button id="scenarios">Scenarios</button>
      <span class="sep"></span>
      <button id="reseed">Restart with data</button>
      <button id="empty">Start empty</button>
    </div>
  </div>
  <div id="derived">starting…</div>
</header>

<div id="shell">
  <nav id="groups" aria-label="Operations"></nav>
  <main id="stage"></main>
</div>

er of items to return (1-100).","schema":{"type":"integer","minimum":1,"maximum":100,"default":25}},"OffsetParam":{"name":"offset","in":"query","description":"Number of items to skip before collecting results.","schema":{"type":"integer","minimum":0,"default":0}},"SearchQueryParam":{"name":"q","in":"query","required":false,"schema":{"type":"string"},"description":"Search query using field:value syntax. Multiple conditions separated by\nspaces are ANDed together.\n\n**URL Encoding:** This parameter must be URL-encoded when sent over HTTP.\nMost HTTP clients handle this automatically. Examples in this documentation\nshow human-readable syntax for clarity.\n\n## Syntax\n\n| Pattern | Description | Example |\n|---------|-------------|---------|\n| `term` | Full-text exact match | `john` |\n| `*term*` | Full-text contains | `*john*` |\n| `term*` | Full-text starts with | `john*` |\n| `*term` | Full-text ends with | `*smith` |\n| `field:value` | Exact match on field | `status:approved` |\n| `field:*value*` | Contains (case-insensitive) | `name:*john*` |\n| `field:value*` | Starts with | `name:john*` |\n| `field:*value` | Ends with | `email:*@example.com` |\n| `field:\"value\"` | Quoted value (for spaces) | `name:\"john doe\"` |\n| `field.nested:value` | Nested field (dot notation) | `address.state:CA` |\n| `field:>value` | Greater than | `income:>1000` |\n| `field:>=value` | Greater than or equal | `income:>=1000` |\n| `field:\u003cvalue` | Less than | `income:\u003c5000` |\n| `field:\u003c=value` | Less than or equal | `income:\u003c=5000` |\n| `field:val1,val2` | Match any value (OR) | `status:approved,pending` |\n| `-field:value` | Exclude / negate | `-status:denied` |\n| `field:*` | Field exists (not null) | `email:*` |\n| `-field:*` | Field does not exist | `-deletedAt:*` |\n\n## Examples\n\n- `john` — exact match for \"john\" in searchable fields\n- `*john*` — contains \"john\" in searchable fields\n- `name:*smith*` — name contains \"smith\" (case-insensitive)\n- `email:*@example.com` — email ends with \"@example.com\"\n- `status:approved` — exact match on status field\n- `status:approved,pending` — status is \"approved\" OR \"pending\"\n- `income:>=1000` — income greater than or equal to 1000\n- `created:>2024-01-01` — created after January 1, 2024\n- `status:approved income:>=1000` — approved AND income >= 1000 (multiple conditions)\n- `-status:denied` — exclude records with status \"denied\"\n- `-deletedAt:*` — only records where deletedAt does not exist\n- `applicant.state:CA` — nested field filter\n\n## URL Encoding Reference\n\nWhen manually constructing URLs, encode these characters:\n\n| Character | Encoded |\n|-----------|---------|\n| (space) | `%20` or `+` |\n| `\"` | `%22` |\n| `:` | `%3A` |\n| `>` | `%3E` |\n| `\u003c` | `%3C` |\n| `,` | `%2C` |\n\n**Example:**\n```\nHuman-readable: q=status:approved income:>=1000\nURL-encoded:    q=status%3Aapproved%20income%3A%3E%3D1000\n```\n","examples":{"simpleSearch":{"summary":"Full-text exact match","value":"john"},"containsSearch":{"summary":"Full-text contains","value":"*john*"},"exactMatch":{"summary":"Filter by status","value":"status:approved"},"containsField":{"summary":"Name contains (case-insensitive)","value":"name:*smith*"},"startsWithField":{"summary":"Name starts with","value":"name:john*"},"endsWithField":{"summary":"Email ends with domain","value":"email:*@example.com"},"multipleFilters":{"summary":"Status and income filter","value":"status:approved income:>=1000"},"dateRange":{"summary":"Created after date","value":"created:>2024-01-01"},"multiValue":{"summary":"Multiple statuses (OR)","value":"status:approved,pending,under_review"},"negation":{"summary":"Exclude denied","value":"-status:denied"},"notExists":{"summary":"Field does not exist","value":"-deletedAt:*"},"nestedField":{"summary":"Filter by nested field","value":"applicant.state:CA"}}},"SortParam":{"name":"sort","in":"query","required":false,"schema":{"type":"string"},"description":"Comma-separated mas/RegistryType"}}}}]},"RegistryEntry":{"type":"object","required":["id","description"],"additionalProperties":true,"description":"An entry, with its id and the fields its type defines.","properties":{"id":{"type":"string","description":"The entry's stable id."},"description":{"type":"string","description":"Human-readable text for the entry."},"deprecated":{"type":"boolean","description":"When true, the entry should not be newly referenced."}}},"RegistryEntryList":{"description":"Paginated list of registry entries.","allOf":[{"$ref":"../../components/pagination.yaml#/Pagination"},{"type":"object","required":["items"],"properties":{"items":{"type":"array","items":{"$ref":"#/components/schemas/RegistryEntry"}}}}]}}}}},{"relativePath":"base/domains/transcription/transcription-config-schema.yaml","domain":"transcription","type":"schema","content":{"$schema":"https://json-schema.org/draft/2020-12/schema","$id":"https://blueprint.codeforamerica.org/base/domains/transcription/transcription-config-schema.yaml","title":"Transcription Config","domain":"transcription","description":"Schema for transcription-config.yaml. Validates the profile catalog's entries.","allOf":[{"$ref":"https://blueprint.codeforamerica.org/schemas/config-schema.yaml"}],"type":"object","properties":{"domain":{"const":"transcription","description":"Must be \"transcription\"."},"profiles":{"type":"object","description":"Profile catalog: the transcription service and languages to use for each kind of conversation. Seeded where they do not exist yet; afterwards they are changed through the API, and never deleted.\n","required":["resource","entries"],"additionalProperties":false,"properties":{"resource":{"const":"TranscriptionProfile"},"entries":{"type":"array","items":{"$ref":"#/$defs/ProfileConfig"}}}}},"unevaluatedProperties":false,"$defs":{"ProfileConfig":{"type":"object","description":"A profile, as the TranscriptionProfile resource has it.","required":["id","name","provider"],"additionalProperties":false,"properties":{"id":{"type":"string","format":"uuid","description":"Stable identifier, so overlays and transcripts can refer to it."},"name":{"type":"string","pattern":"^[a-z0-9]+(-[a-z0-9]+)*$","description":"A short handle people tell profiles apart by, e.g. `english-phone`."},"description":{"type":"string"},"provider":{"type":"string","description":"An entry of the `transcription-services` registry, or `none`."},"languages":{"type":"array","minItems":1,"uniqueItems":true,"items":{"$ref":"../../schemas/enums.yaml#/$defs/Language"}}}}}}},{"relativePath":"base/domains/transcription/transcription-config.yaml","domain":"transcription","type":"config","content":{"$schema":"transcription-config-schema.yaml","version":"1.0","domain":"transcription","profiles":{"resource":"TranscriptionProfile","entries":[{"id":"7a1e0c2d-0000-4000-8000-0000000000b1","name":"english","description":"An interview in English.","provider":"aws-transcribe","languages":["en-US"]},{"id":"7a1e0c2d-0000-4000-8000-0000000000b2","name":"english-or-spanish","description":"An interview in English, Spanish, or both — the service tells which is being spoken.","provider":"aws-transcribe","languages":["en-US","es-US"]},{"id":"7a1e0c2d-0000-4000-8000-0000000000b3","name":"typed","description":"A chat, or notes a person types. No transcription service.","provider":"none"}]}}},{"relativePath":"base/domains/transcription/transcription-mock-data.yaml","domain":"transcription","type":"mock-data","content":{"domain":"transcription","TranscriptExample1":{"id":"7a1e0c2d-0000-4000-8000-000000000001","subjectType":"interview","subjectId":"7a1e0c2d-0000-4000-8000-0000000000a1","profileId":"7a1e0c2d-0000-4000-8000-0000000000b1","model":"standard","client":"interview-assistant/0.1.0","status":"recording","startedAt":"2026-10-11T14:00:00Z","createdAt":"2026-10-11T14:00:00Z","updatedAt":"2026-10-11T14:00:00Z"},"TranscriptExample2":{"id":"7a1e0c2d-0000-4000-8000-000000000002","subjectType":"chat","subjectId":"7a1e0c2d-0000-4000-8000-0000000000a2","profileId":"7a1e0c2d-0000-4000-8000-0000000000b3","client":"webchat/2.1.0","status":"closed","startedAt":"2026-10-09T09:50:00Z","closedAt":"2026-10-09T10:12:00Z","createdAt":"2026-10-09T09:50:00Z","updatedAt":"2026-10-09T10:12:00Z"},"TranscriptEntryExample1":{"id":"7a1e0c2d-0000-4000-8000-0000000000e1","transcriptId":"7a1e0c2d-0000-4000-8000-000000000001","kind":"line","startedAt":"2026-10-11T14:00:05Z","endedAt":"2026-10-11T14:00:09Z","text":"Thanks for coming in. Can you tell me who lives in your household?","speaker":"staff","speakerLabel":"spk_0","confidence":0.96,"createdAt":"2026-10-11T14:00:10Z","updatedAt":"2026-10-11T14:00:10Z"},"TranscriptEntryExample2":{"id":"7a1e0c2d-0000-4000-8000-0000000000e2","transcriptId":"7a1e0c2d-0000-4000-8000-000000000001","kind":"line","startedAt":"2026-10-11T14:00:11Z","endedAt":"2026-10-11T14:00:16Z","text":"It's me and my two kids, and my mother stays with us most weeks.","speaker":"client","speakerLabel":"spk_1","confidence":0.91,"createdAt":"2026-10-11T14:00:17Z","updatedAt":"2026-10-11T14:00:17Z"},"TranscriptEntryExample3":{"id":"7a1e0c2d-0000-4000-8000-0000000000e3","transcriptId":"7a1e0c2d-0000-4000-8000-000000000001","kind":"gap","startedAt":"2026-10-11T14:01:02Z","endedAt":"2026-10-11T14:01:20Z","cause":"connection","createdAt":"2026-10-11T14:01:21Z","updatedAt":"2026-10-11T14:01:21Z"},"TranscriptEntryExample4":{"id":"7a1e0c2d-0000-4000-8000-0000000000e4","transcriptId":"7a1e0c2d-0000-4000-8000-000000000001","kind":"pause","startedAt":"2026-10-11T14:03:00Z","endedAt":"2026-10-11T14:04:30Z","createdAt":"2026-10-11T14:03:00Z","updatedAt":"2026-10-11T14:04:30Z"}}},{"relativePath":"base/domains/transcription/transcription-registry-transcription-services.yaml","domain":"transcription","type":"registry","content":{"$schema":"https://blueprint.codeforamerica.org/schemas/registry-schema.yaml","version":"1.0.0","domain":"transcription","type":"transcription-services","entries":{"aws-transcribe":{"description":"Amazon Transcribe streaming."},"elevenlabs-scribe":{"description":"ElevenLabs Scribe realtime."},"none":{"description":"No transcription service — a chat, or lines a person typed. A transcript naming it has no model."}}}},{"relativePath":"base/domains/transcription/transcription-transcripts-asyncapi.yaml","domain":"transcription","type":"asyncapi","content":{"asyncapi":"3.0.0","info":{"x-domain":"transcription","title":"Transcript events","version":"0.1.0","x-status":"alpha","description":"Events a transcript emits as it is paused, resumed and closed."},"channels":{"transcription.transcript.paused":{"address":"transcription.transcript.paused","messages":{"TranscriptPaused":{"$ref":"#/components/messages/TranscriptPausedMessage"}}},"transcription.transcript.resumed":{"address":"transcription.transcript.resumed","messages":{"TranscriptResumed":{"$ref":"#/components/messages/TranscriptResumedMessage"}}},"transcription.transcript.closed":{"address":"transcription.transcript.closed","messages":{"TranscriptClosed":{"$ref":"#/components/messages/TranscriptClosedMessage"}}}},"components":{"messages":{"TranscriptPausedMessage":{"name":"transcription.transcript.paused","summary":"The conversation went off the record. Anything said until it resumes is not stored.","payload":{"$ref":"#/components/schemas/TranscriptPausedEvent"}},"TranscriptResumedMessage":{"name":"transcription.transcript.resumed","summary":"The conversation is back on the record.","payload":{"$ref":"#/components/schemas/TranscriptResumedEvent"}},"TranscriptClosedMessage":{"name":"transcription.transcript.closed","summary":"The transcript has ended.","payload":{"$ref":"#/components/schemas/TranscriptClosedEvent"}}},"schemas":{"TranscriptPausedEvent":{"allOf":[{"$ref":"../../schemas/events.yaml#/$defs/Event"},{"type":"object","properties":{"type":{"type":"string","const":"transcription.transcript.paused"}}}]},"TranscriptResumedEvent":{"allOf":[{"$ref":"../../schemas/events.yaml#/$defs/Event"},{"type":"object","properties":{"type":{"type":"string","const":"transcription.transcript.resumed"}}}]},"TranscriptClosedEvent":{"allOf":[{"$ref":"../../schemas/events.yaml#/$defs/Event"},{"type":"object","properties":{"type":{"type":"string","const":"transcription.transcript.closed"}}}]}}}}},{"relativePath":"base/domains/transcription/transcription-transcripts-openapi.yaml","domain":"transcription","type":"openapi","content":{"openapi":"3.1.0","info":{"title":"Transcripts","version":"0.1.0","x-domain":"transcription","x-status":"alpha","x-visibility":"internal","description":"The written record of a conversation. Starting a transcript opens it for\nrecording; pausing takes the conversation off the record; closing ends it.\nA transcript refers to what it records — an interview, a call — and names\nthe profile it was started under, which says the transcription service,\nand the client and model that produced its lines. Updating corrects what\nit records; deleting removes it, and the event left behind says which one\nand by whom.\n\nA profile is a state's choice of transcription service and languages for\na kind of conversation. The deployment's config seeds them; they can be\nadded and changed here, never deleted, so every transcript's profile\nstill exists.\n\nIts entries are its timeline, in the order things happened: lines, gaps\nwhere nothing was captured, and pauses. Every time on a transcript and its\nentries is the client's — when it started, paused, resumed and closed, and\nwhen each line was said — so they are compared on one clock.\n"},"servers":[{"url":"https://api.example.com/transcription","description":"Production server"},{"url":"http://localhost:1080/transcription","description":"Local development server"}],"tags":[{"name":"Transcripts","description":"The written record of a conversation."},{"name":"Transcript entries","description":"A transcript's timeline — lines, gaps and pauses."},{"name":"Transcription profiles","description":"The transcription service and languages to use for a kind of conversation."}],"x-events":{"transcript.created":{"type":"org.codeforamerica.safety-net-blueprint.transcription.transcript.created","summary":"Emitted when a transcript is started.","payload":{"$ref":"#/components/schemas/TranscriptCreatedEvent"}},"transcript.updated":{"type":"org.codeforamerica.safety-net-blueprint.transcription.transcript.updated","summary":"Emitted when a transcript is updated via PATCH.","payload":{"$ref":"#/components/schemas/TranscriptUpdatedEvent"}},"transcript.deleted":{"type":"org.codeforamerica.safety-net-blueprint.transcription.transcript.deleted","summary":"Emitted when a transcript is deleted. Records which transcript, and who deleted it.","payload":{"$ref":"#/components/schemas/TranscriptDeletedEvent"}},"transcript_entry.created":{"type":"org.codeforamerica.safety-net-blueprint.transcription.transcript_entry.created","summary":"Emitted when an entry is added to a transcript — a line, a gap, or a pause beginning.","payload":{"$ref":"#/components/schemas/TranscriptEntryCreatedEvent"}},"transcript_entry.updated":{"type":"org.codeforamerica.safety-net-blueprint.transcription.transcript_entry.updated","summary":"Emitted when an entry changes — a pause ending, as the transcript resumes or closes.","payload":{"$ref":"#/components/schemas/TranscriptEntryUpdatedEvent"}},"profile.created":{"type":"org.codeforamerica.safety-net-blueprint.transcription.transcription_profile.created","summary":"Emitted when a profile is added through the API.","payload":{"$ref":"#/components/schemas/TranscriptionProfileCreatedEvent"}},"profile.updated":{"type":"org.codeforamerica.safety-net-blueprint.transcription.transcription_profile.updated","summary":"Emitted when a profile is changed. Records each field before and after, so what a profile said when a transcript started can be looked up.","payload":{"$ref":"#/components/schemas/TranscriptionProfileUpdatedEvent"}}},"paths":{"/transcripts":{"get":{"summary":"List transcripts","description":"Retrieve a paginated list of transcripts. Filter by `subjectId` to find\nthe transcripts of one interview or call.\n","operationId":"listTranscripts","tags":["Transcripts"],"x-sortable":{"fields":["createdAt"],"default":"-createdAt","tieBreaker":"id"},"parameters":[{"$ref":"../../components/parameters.yaml#/SearchQueryParam"},{"$ref":"../../components/parameters.yaml#/LimitParam"},{"$ref":"../../components/parameters.yaml#/OffsetParam"},{"$ref":"../../components/parameters.yaml#/SortParam"}],"responses":{"200":{"description":"A paginated collection of transcripts.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/TranscriptList"}}}},"400":{"$ref":"../../components/responses.yaml#/BadRequest"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}},"post":{"summary":"Start a transcript","description":"Start recording a conversation, under a profile. The transcript begins\nin `recording`. It is refused when the profile does not exist, or when\nthe profile names a transcription service and no `model` is given.\n","operationId":"createTranscript","tags":["Transcripts"],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/TranscriptCreate"}}}},"responses":{"201":{"description":"Transcript started.","headers":{"Location":{"description":"URL of the new transcript.","schema":{"type":"string","format":"uri"}}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/Transcript"}}}},"400":{"$ref":"../../components/responses.yaml#/BadRequest"},"409":{"description":"The transcript is refused: its profile does not exist, or the\nprofile names a transcription service and no `model` was given.\n","content":{"application/json":{"schema":{"$ref":"../../components/responses.yaml#/Error"}}}},"422":{"$ref":"../../components/responses.yaml#/UnprocessableEntity"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}}},"/transcripts/{transcriptId}":{"parameters":[{"$ref":"#/components/parameters/TranscriptIdParam"}],"get":{"summary":"Get a transcript","description":"Retrieve a single transcript by identifier.","operationId":"getTranscript","tags":["Transcripts"],"responses":{"200":{"description":"Transcript retrieved successfully.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Transcript"},"examples":{"TranscriptExample1":{"$ref":"#/components/examples/TranscriptExample1"}}}}},"404":{"$ref":"../../components/responses.yaml#/NotFound"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}},"patch":{"summary":"Update a transcript","description":"Correct what a transcript records — its subject, model or client. Its\nprofile does not change, and its status changes only through `pause`,\n`resume` and `close`.\n","operationId":"updateTranscript","tags":["Transcripts"],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/TranscriptUpdate"}}}},"responses":{"200":{"description":"Transcript updated.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Transcript"}}}},"400":{"$ref":"../../components/responses.yaml#/BadRequest"},"404":{"$ref":"../../components/responses.yaml#/NotFound"},"422":{"$ref":"../../components/responses.yaml#/UnprocessableEntity"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}},"delete":{"summary":"Delete a transcript","description":"Permanently remove a transcript. The `transcription.transcript.deleted`\nevent records which transcript was removed and who removed it.\n","operationId":"deleteTranscript","tags":["Transcripts"],"responses":{"204":{"description":"Transcript deleted."},"404":{"$ref":"../../components/responses.yaml#/NotFound"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}}},"/transcripts/{transcriptId}/entries":{"parameters":[{"$ref":"#/components/parameters/TranscriptIdParam"}],"get":{"summary":"List a transcript's entries","description":"A transcript's timeline, in the order things happened — by `startedAt`.\nFilter by `kind` for only its lines, gaps or pauses.\n","operationId":"listTranscriptEntries","tags":["Transcript entries"],"x-sortable":{"fields":["startedAt"],"default":"startedAt","tieBreaker":"id"},"parameters":[{"$ref":"../../components/parameters.yaml#/LimitParam"},{"$ref":"../../components/parameters.yaml#/OffsetParam"},{"$ref":"../../components/parameters.yaml#/SortParam"},{"name":"kind","in":"query","description":"Only entries of this kind.","schema":{"$ref":"#/components/schemas/TranscriptEntryKind"}}],"responses":{"200":{"description":"The transcript's entries, in the order things happened.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/TranscriptEntryList"}}}},"400":{"$ref":"../../components/responses.yaml#/BadRequest"},"404":{"$ref":"../../components/responses.yaml#/NotFound"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}},"post":{"summary":"Add an entry to a transcript","description":"Add a finished line, or a gap where nothing was captured. Pauses are not\nadded here: pausing the transcript adds one.\n\nSend an `Idempotency-Key` with every add, and the same key when retrying\none, so a retry is not a second line. The transcript refuses an entry\nthat started while it was paused or after it closed, an entry that ends\nbefore it starts, and a gap that overlaps a pause.\n","operationId":"addTranscriptEntry","tags":["Transcript entries"],"parameters":[{"$ref":"../../components/parameters.yaml#/IdempotencyKeyParam"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/TranscriptEntryCreate"}}}},"responses":{"201":{"description":"Entry added.","headers":{"Location":{"description":"URL of the new entry.","schema":{"type":"string","format":"uri"}}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/TranscriptEntry"}}}},"400":{"$ref":"../../components/responses.yaml#/BadRequest"},"403":{"$ref":"../../components/responses.yaml#/Forbidden"},"404":{"$ref":"../../components/responses.yaml#/NotFound"},"409":{"description":"The transcript refuses the entry: it started while the transcript\nwas paused or after it closed, it ends before it starts, or it is a\ngap overlapping a pause.\n","content":{"application/json":{"schema":{"$ref":"../../components/responses.yaml#/Error"}}}},"422":{"description":"The entry is not valid, or its `Idempotency-Key` was already used\nfor a different request.\n","content":{"application/json":{"schema":{"$ref":"../../components/responses.yaml#/Error"}}}},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}}},"/transcripts/{transcriptId}/entries/{entryId}":{"parameters":[{"$ref":"#/components/parameters/TranscriptIdParam"},{"$ref":"#/components/parameters/TranscriptEntryIdParam"}],"get":{"summary":"Get a transcript entry","description":"Retrieve a single entry by identifier.","operationId":"getTranscriptEntry","tags":["Transcript entries"],"responses":{"200":{"description":"Entry retrieved successfully.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/TranscriptEntry"}}}},"404":{"$ref":"../../components/responses.yaml#/NotFound"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}},"patch":{"summary":"End a pause entry","description":"Set when a pause ended. Only the system may — resuming or closing the\ntranscript does it. Nothing else about an entry changes once it is\nwritten, and entries are never deleted.\n","operationId":"updateTranscriptEntry","tags":["Transcript entries"],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/TranscriptEntryUpdate"}}}},"responses":{"200":{"description":"Entry updated.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/TranscriptEntry"}}}},"403":{"$ref":"../../components/responses.yaml#/Forbidden"},"404":{"$ref":"../../components/responses.yaml#/NotFound"},"422":{"$ref":"../../components/responses.yaml#/UnprocessableEntity"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}}},"/profiles":{"get":{"summary":"List transcription profiles","description":"Retrieve a paginated list of profiles, by name.","operationId":"listTranscriptionProfiles","tags":["Transcription profiles"],"x-sortable":{"fields":["name","createdAt"],"default":"name","tieBreaker":"id"},"parameters":[{"$ref":"../../components/parameters.yaml#/SearchQueryParam"},{"$ref":"../../components/parameters.yaml#/LimitParam"},{"$ref":"../../components/parameters.yaml#/OffsetParam"},{"$ref":"../../components/parameters.yaml#/SortParam"}],"responses":{"200":{"description":"A paginated collection of profiles.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/TranscriptionProfileList"}}}},"400":{"$ref":"../../components/responses.yaml#/BadRequest"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}},"post":{"summary":"Add a transcription profile","description":"Add a profile beside the ones the deployment's config seeds. It is\nmarked `source: user`.\n","operationId":"createTranscriptionProfile","tags":["Transcription profiles"],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/TranscriptionProfileCreate"}}}},"responses":{"201":{"description":"Profile added.","headers":{"Location":{"description":"URL of the new profile.","schema":{"type":"string","format":"uri"}}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/TranscriptionProfile"}}}},"400":{"$ref":"../../components/responses.yaml#/BadRequest"},"422":{"$ref":"../../components/responses.yaml#/UnprocessableEntity"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}}},"/profiles/{profileId}":{"parameters":[{"$ref":"#/components/parameters/ProfileIdParam"}],"get":{"summary":"Get a transcription profile","description":"Retrieve a single profile by identifier.","operationId":"getTranscriptionProfile","tags":["Transcription profiles"],"responses":{"200":{"description":"Profile retrieved successfully.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/TranscriptionProfile"}}}},"404":{"$ref":"../../components/responses.yaml#/NotFound"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}},"patch":{"summary":"Change a transcription profile","description":"Change a profile, including one the config seeded. The change applies to\ntranscripts started from now on; the update event records each field\nbefore and after, so what the profile said when an earlier transcript\nstarted can still be looked up. Profiles are never deleted.\n","operationId":"updateTranscriptionProfile","tags":["Transcription profiles"],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/TranscriptionProfileUpdate"}}}},"responses":{"200":{"description":"Profile changed.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/TranscriptionProfile"}}}},"400":{"$ref":"../../components/responses.yaml#/BadRequest"},"404":{"$ref":"../../components/responses.yaml#/NotFound"},"422":{"$ref":"../../components/responses.yaml#/UnprocessableEntity"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}}}},"/transcripts/{transcriptId}/pause":{"parameters":[{"$ref":"#/components/parameters/TranscriptIdParam"}],"post":{"summary":"Pause transcript","description":"Take the conversation off the record, at the time the client says.","operationId":"pauseTranscript","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/AtRequest"}}}},"responses":{"200":{"description":"Transition applied successfully.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Transcript"}}}},"400":{"$ref":"../../components/responses.yaml#/BadRequest"},"404":{"$ref":"../../components/responses.yaml#/NotFound"},"409":{"$ref":"../../components/responses.yaml#/Conflict"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}},"tags":["Transcripts"],"x-relationship":{"type":"state-machine-action","domain":"transcription","id":"pause"}}},"/transcripts/{transcriptId}/resume":{"parameters":[{"$ref":"#/components/parameters/TranscriptIdParam"}],"post":{"summary":"Resume transcript","description":"Put the conversation back on the record, at the time the client says.","operationId":"resumeTranscript","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/AtRequest"}}}},"responses":{"200":{"description":"Transition applied successfully.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Transcript"}}}},"400":{"$ref":"../../components/responses.yaml#/BadRequest"},"404":{"$ref":"../../components/responses.yaml#/NotFound"},"409":{"$ref":"../../components/responses.yaml#/Conflict"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}},"tags":["Transcripts"],"x-relationship":{"type":"state-machine-action","domain":"transcription","id":"resume"}}},"/transcripts/{transcriptId}/close":{"parameters":[{"$ref":"#/components/parameters/TranscriptIdParam"}],"post":{"summary":"Close transcript","description":"End the transcript, at the time the client says. A pause still open ends then too.","operationId":"closeTranscript","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/AtRequest"}}}},"responses":{"200":{"description":"Transition applied successfully.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Transcript"}}}},"400":{"$ref":"../../components/responses.yaml#/BadRequest"},"404":{"$ref":"../../components/responses.yaml#/NotFound"},"409":{"$ref":"../../components/responses.yaml#/Conflict"},"500":{"$ref":"../../components/responses.yaml#/InternalError"}},"tags":["Transcripts"],"x-relationship":{"type":"state-machine-action","domain":"transcription","id":"close"}}}},"components":{"parameters":{"TranscriptIdParam":{"name":"transcriptId"," nly":true,"description":"Unique identifier (server-generated)."},"status":{"type":"string","readOnly":true,"description":"`recording` while the conversation is on the record, `paused`\nwhile it is off it, and `closed` once it has ended.\n","enum":["recording","paused","closed"]},"startedAt":{"type":"string","format":"date-time","readOnly":true,"description":"When the conversation began, by the client's clock — the clock every time on its entries is on."},"closedAt":{"type":"string","format":"date-time","readOnly":true,"description":"When the transcript was closed, by the client's clock."},"createdAt":{"type":"string","format":"date-time","readOnly":true,"description":"When the transcript was started."},"updatedAt":{"type":"string","format":"date-time","readOnly":true,"description":"When the transcript last changed."},"profile":{"$ref":"#/components/schemas/TranscriptionProfile","x-relationship":{"resource":"TranscriptionProfile","style":"expand"}}}}]},"TranscriptCreate":{"unevaluatedProperties":false,"allOf":[{"$ref":"#/components/schemas/TranscriptWritable"},{"type":"object","description":"Payload to start a transcript. What produced it is required — the\nprofile, which says the transcription service; the client; and the\nmodel unless the profile's service is `none` — so every transcript\nsays where its lines came from — and when it started, by the\nclient's clock. id, status, createdAt and updatedAt are set by the\nserver.\n","required":["profileId","client","startedAt"],"properties":{"profileId":{"type":"string","format":"uuid","description":"The profile to start it under.","x-relationship":{"resource":"TranscriptionProfile"}},"startedAt":{"type":"string","format":"date-time","description":"When the conversation began, by the client's clock."}}}]},"TranscriptUpdate":{"unevaluatedProperties":false,"allOf":[{"$ref":"#/components/schemas/TranscriptWritable"},{"type":"object","description":"Payload to update one or more fields of a transcript. Partial\nupdates are supported; status is not one of them.\n","minProperties":1}]},"TranscriptList":{"type":"object","additionalProperties":false,"required":["items","total","limit","offset"],"properties":{"items":{"type":"array","items":{"$ref":"#/components/schemas/Transcript"}},"total":{"type":"integer","minimum":0,"description":"Total number of transcripts available."},"limit":{"type":"integer","minimum":1,"maximum":100,"description":"Maximum number of transcripts requested."},"offset":{"type":"integer","minimum":0,"description":"Number of items skipped before the current page."},"hasNext":{"type":"boolean","description":"Whether more transcripts are available beyond this page."}}},"TranscriptEntryKind":{"type":"string","enum":["line","gap","pause"],"description":"`line`: something said or typed. `gap`: a stretch where nothing was\ncaptured — a dropped connection, a provider failure. `pause`: the\nconversation off the record, by choice.\n"},"Speaker":{"type":"string","enum":["staff","client","unknown"],"description":"Who said a line, as a role. A contract set replaces these by overlay —\nsafety-net-contracts might say `worker` and `applicant`.\n"},"GapCause":{"type":"string","enum":["connection","provider","client","unknown"],"description":"Why nothing was captured, as far as the client knows."},"TranscriptEntry":{"description":"An entry in a transcript's timeline, including server-managed fields.","type":"object","required":["id","transcriptId","kind","startedAt","endedAt","createdAt","updatedAt"],"properties":{"id":{"type":"string","format":"uuid","readOnly":true,"description":"Unique identifier (server-generated)."},"transcriptId":{"type":"string","format":"uuid","readOnly":true,"description":"The transcript it belongs to.","x-relationship":{"resource":"Transcript"}},"kind":{"$ref":"#/components/schemas/TranscriptEntryKind"},"startedAt":{"type":"string","format":"date-time","description":"When it began, by the client's clock. Entries are in this order."},"endedAt":{"type":["string","null"],"format":"date-time","description":"When it ended, by the client's clock. Null only for a pause still going on."},"text":{"type":"string","description":"What was said or typed. Lines only."},"speaker":{"$ref":"#/components/schemas/Speaker"},"speakerLabel":{"type":"string","description":"The transcription service's own label for the speaker, e.g. `spk_0` or `ch_1`, kept so a mapping mistake can be corrected. Lines only."},"confidence":{"type":"number","minimum":0,"maximum":1,"description":"The transcription service's confidence in the line. Spoken lines only."},"cause":{"$ref":"#/components/schemas/GapCause"},"createdAt":{"type":"string","format":"date-time","readOnly":true,"description":"When the entry was recorded, by the server's clock."},"updatedAt":{"type":"string","format":"date-time","readOnly":true,"description":"When the entry last changed, by the server's clock."},"links":{"type":"object","readOnly":true,"description":"Related resource links.","properties":{"transcript":{"type":"string","format":"uri-reference","description":"Link to the related Transcript resource."}}}}},"TranscriptEntryCreate":{"oneOf":[{"$ref":"#/components/schemas/TranscriptLineCreate"},{"$ref":"#/components/schemas/TranscriptGapCreate"}],"discriminator":{"propertyName":"kind","mapping":{"line":"#/components/schemas/TranscriptLineCreate","gap":"#/components/schemas/TranscriptGapCreate"}}},"TranscriptLineCreate":{"type":"object","description":"A finished line, said or typed.","additionalProperties":false,"required":["kind","startedAt","endedAt","text","speaker"],"properties":{"kind":{"const":"line"},"startedAt":{"type":"string","format":"date-time","description":"When it began","by the client's clock.":null},"endedAt":{"type":"string","format":"date-time","description":"When it ended. For a typed line","the same as startedAt.":null},"text":{"type":"string","minLength":1},"speaker":{"$ref":"#/components/schemas/Speaker"},"speakerLabel":{"type":"string"},"confidence":{"type":"number","minimum":0,"maximum":1}}},"TranscriptGapCreate":{"type":"object","description":"A stretch where nothing was captured, recorded once transcription works again or the transcript closes.","additionalProperties":false,"required":["kind","startedAt","endedAt"],"properties":{"kind":{"const":"gap"},"startedAt":{"type":"string","format":"date-time"},"endedAt":{"type":"string","format":"date-time"},"cause":{"$ref":"#/components/schemas/GapCause"}}},"TranscriptEntryUpdate":{"type":"object","description":"When a pause ended. Written by resuming or closing the transcript.","additionalProperties":false,"required":["endedAt"],"properties":{"endedAt":{"type":"string","format":"date-time"}}},"TranscriptEntryList":{"type":"object","additionalProperties":false,"required":["items","total","limit","offset"],"properties":{"items":{"type":"array","items":{"$ref":"#/components/schemas/TranscriptEntry"}},"total":{"type":"integer","minimum":0,"description":"Total number of entries."},"limit":{"type":"integer","minimum":1,"maximum":100,"description":"Maximum number of entries requested."},"offset":{"type":"integer","minimum":0,"description":"Number of entries skipped before this page."},"hasNext":{"type":"boolean","description":"Whether more entries are available beyond this page."}}},"TranscriptionProfileWritable":{"type":"object","description":"Client-writable fields of a profile.","properties":{"name":{"type":"string","pattern":"^[a-z0-9]+(-[a-z0-9]+)*$","description":"A short handle people tell profiles apart by, e.g. `english-phone`. Nothing checks that it is unique.","example":"english-phone"},"description":{"type":"string","description":"What the profile is for."},"provider":{"type":"string","description":"The transcription service — an entry of the `transcription-services`\nregistry, which a contract set extends with a registry file of its\nown. `none` for conversations no service transcribes: a chat, or\nlines a person types.\n","example":"aws-transcribe","enum":["aws-transcribe","elevenlabs-scribe","none"]},"languages":{"type":"array","minItems":1,"uniqueItems":true,"items":{"$ref":"../../schemas/enums.yaml#/$defs/Language"},"description":"The languages the conversation may be in. One fixes the language;\nseveral let the service tell which is being spoken among them.\nAbsent, the service detects the language itself — which not every\nservice can do.\n","example":["en-US","es-US"]}}},"TranscriptionProfile":{"description":"A profile, including server-managed fields.","unevaluatedProperties":false,"required":["id","name","provider","source","createdAt","updatedAt"],"allOf":[{"$ref":"#/components/schemas/TranscriptionProfileWritable"},{"type":"object","properties":{"id":{"type":"string","format":"uuid","readOnly":true,"description":"Unique identifier — given in the config for a seeded profile, server-generated for one added here."},"source":{"$ref":"../../schemas/enums.yaml#/$defs/ConfigSource"},"createdAt":{"type":"string","format":"date-time","readOnly":true,"description":"When the profile was added."},"updatedAt":{"type":"string","format":"date-time","readOnly":true,"description":"When the profile last changed."}}}]},"TranscriptionProfileCreate":{"unevaluatedProperties":false,"allOf":[{"$ref":"#/components/schemas/TranscriptionProfileWritable"},{"type":"object","description":"Payload to add a profile.","required":["name","provider"]}]},"TranscriptionProfileUpdate":{"unevaluatedProperties":false,"allOf":[{"$ref":"#/components/schemas/TranscriptionProfileWritable"},{"type":"object","description":"Payload to change one or more fields of a profile.","minProperties":1}]},"TranscriptionProfileList":{"type":"object","additionalProperties":false,"required":["items","total","limit","offset"],"properties":{"items":{"type":"array","items":{"$ref":"#/components/schemas/TranscriptionProfile"}},"total":{"type":"integer","minimum":0,"description":"Total number of profiles."},"limit":{"type":"integer","minimum":1,"maximum":100,"description":"Maximum number of profiles requested."},"offset":{"type":"integer","minimum":0,"description":"Number of profiles skipped before this page."},"hasNext":{"type":"boolean","description":"Whether more profiles are available beyond this page."}}},"TranscriptCreatedEvent":{"description":"Snapshot of the newly started transcript.","$ref":"#/components/schemas/Transcript"},"TranscriptUpdatedEvent":{"$ref":"../../schemas/events.yaml#/ResourceUpdatedEvent"},"TranscriptDeletedEvent":{"$ref":"../../schemas/events.yaml#/ResourceDeletedEvent"},"TranscriptEntryCreatedEvent":{"description":"Snapshot of the new entry.","$ref":"#/components/schemas/TranscriptEntry"},"TranscriptEntryUpdatedEvent":{"$ref":"../../schemas/events.yaml#/ResourceUpdatedEvent"},"TranscriptionProfileCreatedEvent":{"description":"Snapshot of the new profile.","$ref":"#/components/schemas/TranscriptionProfile"},"TranscriptionProfileUpdatedEvent":{"$ref":"../../schemas/events.yaml#/ResourceUpdatedEvent"},"AtRequest":{"type":"object","additionalProperties":false,"required":["at"],"properties":{"at":{"type":"string","format":"date-time","description":"When it happened, by the client's clock."}}}},"examples":{"TranscriptExample1":{"summary":"A transcript of an interview, recording","value":{"id":"a1b2c3d4-e5f6-7890-abcd-ef1234567890","subjectType":"interview","subjectId":"5c1f8a2e-0d3b-4e6f-9a7c-2b4d6e8f0a1c","profileId":"7a1e0c2d-0000-4000-8000-0000000000b1","model":"standard","client":"interview-assistant/0.1.0","status":"recording","startedAt":"2026-10-11T14:00:00Z","createdAt":"2026-10-11T14:00:00Z","updatedAt":"2026-10-11T14:00:00Z"}}}}}},{"relativePath":"base/domains/transcription/transcription-transcripts-state-machine.yaml","domain":"transcription","type":"state-machine","content":{"$schema":"state-machine-schema.yaml","version":"1.0","domain":"transcription","eventsSpec":"transcription-transcripts-asyncapi.yaml","machines":[{"object":"Transcript","states":[{"id":"recording","slaClock":"stopped","description":"The conversation is on the record; lines are accepted."},{"id":"paused","slaClock":"stopped","description":"The conversation is off the record — an applicant asked, say. Nothing said now is stored."},{"id":"closed","slaClock":"stopped","description":"The transcript has ended. Terminal."}],"initialState":"recording","guards":[{"id":"atAfterStart","description":"the time given is not before the transcript started","condition":"timestamp(request.at) >= timestamp(object.startedAt)"},{"id":"atAfterPauseBegan","description":"the time given is not before the open pause began","condition":"openPause == null || timestamp(request.at) >= timestamp(openPause.startedAt)"},{"id":"aPauseIsOpen","description":"a pause is open","condition":"openPause != null"},{"id":"profileExists","description":"the transcript's profile exists","condition":"profile != null"},{"id":"modelGivenForTheService","description":"a model is given when the profile names a transcription service","condition":"profile == null || profile.provider == \"none\" || has(request.model)"},{"id":"startedWhileRecording","description":"the entry started while the transcript was recording — after it started, not during a pause, and before it closed","condition":"timestamp(request.startedAt) >= timestamp(object.startedAt) && pauseAtStart == null && (!has(object.closedAt) || timestamp(request.startedAt) \u003c timestamp(object.closedAt))"},{"id":"endsAfterItStarts","description":"the entry does not end before it starts","condition":"timestamp(request.endedAt) >= timestamp(request.startedAt)"},{"id":"gapOutsidePauses","description":"a gap does not overlap a pause","condition":"request.kind != \"gap\" || pauseOverlap == null"}],"emits":[{"id":"paused","description":"The conversation went off the record. Anything said until it resumes is not stored."},{"id":"resumed","description":"The conversation is back on the record."},{"id":"closed","description":"The transcript has ended."}],"actions":[{"id":"pause","description":"Take the conversation off the record, at the time the client says.","transition":{"from":"recording","to":"paused"},"schema":{"request":{"$ref":"#/$defs/AtRequest"}},"guards":[{"conditions":["atAfterStart"]}],"steps":[{"call":{"POST":"transcription/transcripts/$object.id/entries","body":{"kind":"pause","startedAt":"$request.at","endedAt":null}}},{"emit":{"event":"paused","type":"transcription.transcript.paused"}}]},{"id":"resume","description":"Put the conversation back on the record, at the time the client says.","transition":{"from":"paused","to":"recording"},"schema":{"request":{"$ref":"#/$defs/AtRequest"}},"context":[{"openPause":{"from":"transcription/transcripts/entries","where":"item.kind == \"pause\" && item.transcriptId == object.id && item.endedAt == null"}}],"guards":[{"conditions":["aPauseIsOpen","atAfterPauseBegan"]}],"steps":[{"call":{"PATCH":"transcription/transcripts/$object.id/entries/$openPause.id","body":{"endedAt":"$request.at"}}},{"emit":{"event":"resumed","type":"transcription.transcript.resumed"}}]},{"id":"close","description":"End the transcript, at the time the client says. A pause still open ends then too.","transition":{"from":["recording","paused"],"to":"closed"},"schema":{"request":{"$ref":"#/$defs/AtRequest"}},"context":[{"openPause":{"from":"transcription/transcripts/entries","where":"item.kind == \"pause\" && item.transcriptId == object.id && item.endedAt == null"}}],"guards":[{"conditions":["atAfterStart","atAfterPauseBegan"]}],"steps":[{"set":{"field":"closedAt","value":"$request.at"}},{"if":"openPause != null","then":[{"call":{"PATCH":"transcription/transcripts/$object.id/entries/$openPause.id","body":{"endedAt":"$request.at"}}}]},{"emit":{"event":"closed","type":"transcription.transcript.closed"}}]}],"resources":{"Transcript":{"create":{"context":[{"profile":{"from":"transcription/profiles","where":"item.id == request.profileId"}}],"guards":[{"conditions":["profileExists","modelGivenForTheService"]}]}},"TranscriptEntry":{"create":{"context":[{"pauseAtStart":{"from":"transcription/transcripts/entries","where":"item.kind == \"pause\" && item.transcriptId == object.id && timestamp(item.startedAt) \u003c= timestamp(request.startedAt) && (item.endedAt == null || timestamp(item.endedAt) > timestamp(request.startedAt))"}},{"pauseOverlap":{"from":"transcription/transcripts/entries","where":"item.kind == \"pause\" && item.transcriptId == object.id && timestamp(item.startedAt) \u003c timestamp(request.endedAt) && (item.endedAt == null || timestamp(item.endedAt) > timestamp(request.startedAt))"}}],"guards":[{"conditions":["startedWhileRecording","endsAfterItStarts","gapOutsidePauses"]}]},"update":{"guards":[{"actors":["system"]}]}}}}],"$defs":{"AtRequest":{"type":"object","additionalProperties":false,"required":["at"],"properties":{"at":{"type":"string","format":"date-time","description":"When it happened, by the client's clock."}}}}}},{"relativePath":"base/schemas/auth.yaml","domain":null,"type":"schema","content":{"$schema":"https://json-schema.org/draft/2020-12/schema","$id":"https://blueprint.codeforamerica.org/base/schemas/auth.yaml","title":"CommonAuth","description":"Shared connection and credential configuration schemas. Used in domain config files (e.g., data-exchange-config.yaml, eligibility-adapter-config.yaml) to define how adapters connect to external services.\n","$defs":{"Endpoint":{"type":"object","description":"Connection parameters for an external service. States overlay their domain config files (e.g., data-exchange-config.yaml) to fill in these fields for each service. No credentials live here — secrets are injected at deploy time via environment variables or a state-configured secrets manager, and referenced by name in the endpoint block.\n","additionalProperties":true,"required":["url"],"properties":{"url":{"type":"string","format":"uri","description":"Base URL for the external service endpoint.","example":"https://hub.cms.gov/fdsh/ssa"},"timeoutMs":{"type":"integer","description":"Request timeout in milliseconds. Defaults to adapter implementation default if omitted.","minimum":0,"example":30000},"apiVersion":{"type":"string","description":"Service API version, if the external service requires explicit versioning.","example":"2.0"}}}}}},{"relativePath":"base/schemas/enums.yaml","domain":null,"type":"schema","content":{"$schema":"https://json-schema.org/draft/2020-12/schema","$id":"https://blueprint.codeforamerica.org/base/schemas/enums.yaml","$defs":{"Domain":{"type":"string","description":"Blueprint domain identifier. Used as the {domain} path parameter on metadata mutation endpoints and as the value type for x-domain annotations on domain OpenAPI specs. Its values are generated at resolve time: the domains the set's OpenAPI, AsyncAPI and rules documents declare.\n","enum":["document-management","eligibility","intake","platform","scheduling","transcription"]},"MetricCollection":{"type":"string","description":"Harness metric collections. Extends the base MetricCollection with the primary resource collections for intake and eligibility domains.\n","enum":["applications","determinations","events"]},"Frequency":{"type":"string","description":"How often an amount is received, incurred, or scheduled. Applies to income, expenses, SLA recurrence, scheduled reviews, and any other time-based cadence. Domain packages can extend this enum via overlay.\n","enum":["daily","weekly","every_two_weeks","twice_monthly","monthly","yearly","variable"]},"Language":{"type":"string","description":"Preferred language (BCP 47 language tag).","pattern":"^[a-zA-Z]{2,3}(?:-[a-zA-Z0-9]{2,8})*$"},"ConfigSource":{"type":"string","readOnly":true,"description":"Where a record of a config-seeded resource came from. `system`: the deployment's config file, which seeds it once; afterwards it can be changed through the API, but not deleted. `user`: added through the API, and deletable where the API allows it. A client can use it to leave out a delete it would be refused, without trying it first.\n","enum":["system","user"]},"RoleType":{"type":"string","description":"Harness authorization roles. Replaces the base RoleType with the roles the harness's state machine guards name.\n- applicant: The household applying, acting on its own application - case_worker: Processes applications - supervisor: Oversees case workers - system: Automated service account for background and inter-service operations\n","enum":["applicant","case_worker","supervisor","system"]}}}},{"relativePath":"base/schemas/events.yaml","domain":null,"type":"schema","content":{"$schema":"https://json-schema.org/draft/2020-12/schema","$id":"https://blueprint.codeforamerica.org/base/schemas/events.yaml","$defs":{"EventRef":{"type":"object","required":["type"],"properties":{"type":{"type":"string","description":"Fully qualified CloudEvents event type following the convention {domain}.{entity}.{action} (e.g., intake.application.submitted). Must match a channel address declared in the domain's eventsSpec AsyncAPI file.\n"},"description":{"type":"string","description":"Human-readable annotation for state machine authors. Not a CloudEvents field."}}},"EventBase":{"allOf":[{"$ref":"#/$defs/EventRef"},{"type":"object","properties":{"subject":{"type":"string","description":"CloudEvents subject override. The entity ID the event pertains to. Defaults to the emitting resource's own id when omitted.\n"},"causationid":{"type":"string","description":"CloudEvents Causation extension (optional). Value expression resolving to the id of the event that directly caused this one. Use when an event is emitted in response to another event (e.g., auto-resume triggered by a timer callback).\n"},"data":{"type":"object","additionalProperties":true,"description":"Event-specific payload. Field values are value expressions resolved at emit time."}}}]},"Event":{"allOf":[{"$ref":"#/$defs/EventBase"},{"type":"object","required":["specversion","id","source","subject","time","datacontenttype"],"properties":{"specversion":{"type {"channel":{"type":"string","enum":["sms"]},"phone":{"type":"string","description":"Phone number for SMS benefit notices (E.164 format)."}}},"CloseRequest":{"type":"object","required":["outcome"],"properties":{"outcome":{"type":"string","enum":["approved","denied"],"description":"Whether the application was approved or denied at close."},"notes":{"type":"string","description":"Optional caseworker notes on the closure decision."}}},"ApplicationSummaryResponse":{"type":"object","description":"Generated composition response for applicationSummary."},"ApplicationReviewResponse":{"type":"object","description":"Generated composition response for applicationReview."},"ApplicationReviewSectionResponse":{"type":"object","description":"Generated section panel response for applicationReview."},"ApplicationReviewSections":{"type":"string","description":"Valid section names for the applicationReview sectionView.","enum":["demographics","contact"],"x-generated":"section-enum"},"ReviewProgressWritable":{"type":"object","description":"Client-writable fields for the reviewProgress state resource. Framework fields (id, section, itemId, createdAt, updatedAt) are added automatically.","properties":{"status":{"type":"string","description":"Caseworker review status for this section.","enum":["not_started","in_progress","complete","flagged"],"default":"not_started"}}},"ReviewProgress":{"type":"object","description":"Generated state resource for reviewProgress.","allOf":[{"$ref":"#/components/schemas/ReviewProgressWritable"},{"type":"object","properties":{"id":{"type":"string","format":"uuid","readOnly":true},"section":{"type":"string","readOnly":true},"itemId":{"type":["string","null"],"format":"uuid","readOnly":true,"x-relationship":{"resource":"Polymorphic"}},"createdAt":{"type":"string","format":"date-time","readOnly":true},"updatedAt":{"type":"string","format":"date-time","readOnly":true}},"required":["id","section","createdAt","updatedAt"]}]},"ReviewProgressListResponse":{"type":"object","description":"Paginated list of reviewProgress state records.","properties":{"items":{"type":"array","items":{"$ref":"#/components/schemas/ReviewProgress"}},"total":{"type":"integer"},"limit":{"type":"integer"},"offset":{"type":"integer"},"hasNext":{"type":"boolean"}},"required":["items","total","limit","offset","hasNext"]},"Document":{"allOf":[{"$ref":"#/components/schemas/DocumentWritable"},{"type":"object","required":["id","lifecycleState","latestVersionId","createdAt","updatedAt"],"properties":{"id":{"type":"string","format":"uuid","readOnly":true},"lifecycleState":{"type":"string","enum":["active","superseded","disposed"],"readOnly":true,"description":"Where this document is in its retention lifecycle."},"legalHold":{"type":"boolean","readOnly":true,"description":"Whether disposition is suspended pending litigation."},"latestVersionId":{"type":"string","format":"uuid","readOnly":true,"description":"The most recent version, which is what describes the file.","x-relationship":{"type":"fk","domain":"document-management","resource":"DocumentVersion","style":"links-only"}},"retentionDeadline":{"type":["string","null"],"format":"date-time","readOnly":true,"description":"When this document becomes eligible for disposition."},"metadata":{"type":"object","additionalProperties":true,"description":"Arbitrary key-value metadata supplied at upload."},"createdAt":{"type":"string","format":"date-time","readOnly":true},"updatedAt":{"type":"string","format":"date-time","readOnly":true},"links":{"type":"object","readOnly":true,"description":"Related resource links.","properties":{"latestVersion":{"type":"string","format":"uri-reference","description":"Link to the related DocumentVersion resource."}}}}}]},"DocumentWritable":{"type":"object","required":["documentTypeId","title"],"properties":{"documentTypeId":{"type":"string","description":"What kind of document this is."},"title":{"type":"string","description":"A human-readable name for the document."},"documentDate":{"type":["string","null"],"format":"date","description":"The date the document itself bears, which is not the date it arrived."}}}}}}},{"relativePath":"domains/intake/intake-rules-examples.yaml","domain":"intake","type":"rules-examples","content":{"$schema":"https://blueprint.codeforamerica.org/schemas/rules-examples-schema.yaml","domain":"intake","rulesets":{"interviewPrompts":{"examples":[{"description":"Income gap and unemployed members — multiple prompts triggered","inputs":{"household":{"monthlyIncome":800,"monthlyExpenses":1200,"members":[{"age":35,"isEmployed":false,"isStudent":false,"isNonCitizen":false},{"age":8,"isEmployed":false,"isStudent":false,"isNonCitizen":false}]},"application":{"hasChangedCircumstances":false}}},{"description":"Non-citizen student with changed circumstances","inputs":{"household":{"monthlyIncome":1500,"monthlyExpenses":1400,"members":[{"age":22,"isEmployed":true,"isStudent":true,"isNonCitizen":true}]},"application":{"hasChangedCircumstances":true}}},{"description":"All members employed — no work requirement prompt","inputs":{"household":{"monthlyIncome":3000,"monthlyExpenses":2500,"members":[{"age":40,"isEmployed":true,"isStudent":false,"isNonCitizen":false},{"age":38,"isEmployed":true,"isStudent":false,"isNonCitizen":false}]},"application":{"hasChangedCircumstances":false}}}]}}}},{"relativePath":"domains/intake/intake-rules-openapi.yaml","domain":"intake","type":"openapi","content":{"openapi":"3.1.0","info":{"title":"Intake rules","version":"1.0.0","description":"Evaluation endpoints for the intake rulesets, generated from their rules document.","x-domain":"intake"},"servers":[{"url":"/intake"}],"paths":{"/applications/evaluate-interview-prompts":{"post":{"summary":"Evaluate interviewPrompts","operationId":"evaluateInterviewPrompts","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/InterviewPromptsRequest"}}}},"responses":{"200":{"description":"interviewPrompts evaluation result.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/InterviewPromptsResponse"}}}},"400":{"$ref":"../../base/components/responses.yaml#/BadRequest"},"500":{"$ref":"../../base/components/responses.yaml#/InternalError"}},"tags":["Applications"],"x-relationship":{"type":"ruleset","domain":"intake","id":"interviewPrompts"}}}},"components":{"schemas":{"InterviewPromptsRequest":{"type":"object","description":"Input data for interviewPrompts evaluation. All fields are optional — partial inputs trigger partial evaluation.","properties":{"household":{"type":"object","description":"Household composition and financial circumstances.","properties":{"monthlyIncome":{"type":"number","description":"Total monthly gross income reported by the household."},"monthlyExpenses":{"type":"number","description":"Total monthly expenses reported by the household."},"members":{"type":"array","description":"All individuals in the household.","items":{"$ref":"./intake-schemas.yaml#/$defs/HouseholdMember"}}}},"application":{"type":"object","description":"Application-level context relevant to the interview.","properties":{"hasChangedCircumstances":{"type":"boolean","description":"Whether the household reported changes since the application was submitted."}}}}},"InterviewPromptsResponse":{"allOf":[{"$ref":"../../base/schemas/rules-evaluation.yaml#/EvaluationResult"}],"description":"Evaluation result for interviewPrompts."}}}}},{"relativePath":"domains/intake/intake-rules.yaml","domain":"intake","type":"rules","content":{"$schema":"https://blueprint.codeforamerica.org/schemas/rules-schema.yaml","domain":"intake","rulesets":{"interviewPrompts":{"endpoint":{"path":"/applications/evaluate-interview-prompts"},"inputs":{"household":{"type":"object","description":"Household composition and financial circumstances.","properties":{"monthlyIncome":{"type":"number","description":"Total monthly gross income reported by the household."},"monthlyExpenses":{"type":"number","description":"Total monthly expenses reported by the household."},"members":{"type":"array","description":"All individuals in the household.","items":{"$ref":"./intake-schemas.yaml#/$defs/HouseholdMember"}}}},"application":{"type":"object","description":"Application-level context relevant to the interview.","properties":{"hasChangedCircumstances":{"type":"boolean","description":"Whether the household reported changes since the application was submitted."}}}},"facts":[{"path":"incomeGapExists","type":"boolean","description":"Monthly income is less than monthly expenses — an inconsistency that requires probing for other income sources or assistance (FNS-1104).\n","expression":"household.monthlyIncome \u003c household.monthlyExpenses"},{"path":"workEligibleMembers","description":"Members aged 16–59 who are not employed and may be subject to work requirement screening (7 CFR § 273.7).\n","expression":"household.members.filter(m, m.age >= 16 && m.age \u003c= 54 && !m.isEmployed)"},{"path":"hasUnemployedWorkEligible","type":"boolean","description":"At least one member aged 16–59 is not employed.","expression":"household.members.exists(m, m.age >= 16 && m.age \u003c= 59 && !m.isEmployed)"},{"path":"hasStudentMembers","type":"boolean","description":"At least one household member is enrolled in higher education.","expression":"household.members.exists(m, m.isStudent)"},{"path":"hasNonCitizenMembers","type":"boolean","description":"At least one household member is a non-citizen.","expression":"household.members.exists(m, m.isNonCitizen)"},{"path":"allMembersEmployed","type":"boolean","description":"Every household member is currently employed.","expression":"household.members.all(m, m.isEmployed)"},{"path":"incomeInconsistencyPrompt","type":"boolean","description":"Prompt the household for unexplained income sources or assistance that account for the gap between income and expenses.\n","expression":"incomeGapExists"},{"path":"workRequirementPrompt","type":"boolean","description":"Screen non-employed me
