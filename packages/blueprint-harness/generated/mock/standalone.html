for the reviewProgress state resource. Framework fields (id, section, itemId, createdAt, updatedAt) are added automatically.","properties":{"status":{"type":"string","description":"Caseworker review status for this section.","enum":["not_started","in_progress","complete","flagged"],"default":"not_started"}}},"ReviewProgress":{"type":"object","description":"Generated state resource for reviewProgress.","allOf":[{"$ref":"#/components/schemas/ReviewProgressWritable"},{"type":"object","properties":{"id":{"type":"string","format":"uuid","readOnly":true},"section":{"type":"string","readOnly":true},"itemId":{"type":["string","null"],"format":"uuid","readOnly":true,"x-relationship":{"resource":"Polymorphic"}},"createdAt":{"type":"string","format":"date-time","readOnly":true},"updatedAt":{"type":"string","format":"date-time","readOnly":true}},"required":["id","section","createdAt","updatedAt"]}]},"ReviewProgressListResponse":{"type":"object","description":"Paginated list of reviewProgress state records.","properties":{"items":{"type":"array","items":{"$ref":"#/components/schemas/ReviewProgress"}},"total":{"type":"integer"},"limit":{"type":"integer"},"offset":{"type":"integer"},"hasNext":{"type":"boolean"}},"required":["items","total","limit","offset","hasNext"]},"Document":{"allOf":[{"$ref":"#/components/schemas/DocumentWritable"},{"type":"object","required":["id","lifecycleState","latestVersionId","createdAt","updatedAt"],"properties":{"id":{"type":"string","format":"uuid","readOnly":true},"lifecycleState":{"type":"string","enum":["active","superseded","disposed"],"readOnly":true,"description":"Where this document is in its retention lifecycle."},"legalHold":{"type":"boolean","readOnly":true,"description":"Whether disposition is suspended pending litigation."},"latestVersionId":{"type":"string","format":"uuid","readOnly":true,"description":"The most recent version, which is what describes the file.","x-relationship":{"type":"fk","domain":"document-management","resource":"DocumentVersion","style":"links-only"}},"retentionDeadline":{"type":["string","null"],"format":"date-time","readOnly":true,"description":"When this document becomes eligible for disposition."},"metadata":{"type":"object","additionalProperties":true,"description":"Arbitrary key-value metadata supplied at upload."},"createdAt":{"type":"string","format":"date-time","readOnly":true},"updatedAt":{"type":"string","format":"date-time","readOnly":true},"links":{"type":"object","readOnly":true,"description":"Related resource links.","properties":{"latestVersion":{"type":"string","format":"uri-reference","description":"Link to the related DocumentVersion resource."}}}}}]},"DocumentWritable":{"type":"object","required":["documentTypeId","title"],"properties":{"documentTypeId":{"type":"string","description":"What kind of document this is."},"title":{"type":"string","description":"A human-readable name for the document."},"documentDate":{"type":["string","null"],"format":"date","description":"The date the document itself bears, which is not the date it arrived."}}}}}}},{"relativePath":"domains/intake/intake-rules-examples.yaml","domain":"intake","type":"rules-examples","content":{"$schema":"https://blueprint.codeforamerica.org/schemas/rules-examples-schema.yaml","domain":"intake","rulesets":{"interviewPrompts":{"examples":[{"description":"Income gap and unemployed members — multiple prompts triggered","inputs":{"household":{"monthlyIncome":800,"monthlyExpenses":1200,"members":[{"age":35,"isEmployed":false,"isStudent":false,"isNonCitizen":false},{"age":8,"isEmployed":false,"isStudent":false,"isNonCitizen":false}]},"application":{"hasChangedCircumstances":false}}},{"description":"Non-citizen student with changed circumstances","inputs":{"household":{"monthlyIncome":1500,"monthlyExpenses":1400,"members":[{"age":22,"isEmployed":true,"isStudent":true,"isNonCitizen":true}]},"application":{"hasChangedCircumstances":true}}},{"description":"All members employed — no work requirement prompt","inputs":{"household":{"monthlyIncome":3000,"monthlyExpenses":2500,"members":[{"age":40,"isEmployed":true,"isStudent":false,"isNonCitizen":false},{"age":38,"isEmployed":true,"isStudent":false,"isNonCitizen":false}]},"application":{"hasChangedCircumstances":false}}}]}}}},{"relativePath":"domains/intake/intake-rules-openapi.yaml","domain":"intake","type":"openapi","content":{"openapi":"3.1.0","info":{"title":"Intake rules","version":"1.0.0","description":"Evaluation endpoints for the intake rulesets, generated from their rules document.","x-domain":"intake"},"servers":[{"url":"/intake"}],"paths":{"/applications/evaluate-interview-prompts":{"post":{"summary":"Evaluate interviewPrompts","operationId":"evaluateInterviewPrompts","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/InterviewPromptsRequest"}}}},"responses":{"200":{"description":"interviewPrompts evaluation result.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/InterviewPromptsResponse"}}}},"400":{"$ref":"../../base/components/responses.yaml#/BadRequest"},"500":{"$ref":"../../base/components/responses.yaml#/InternalError"}},"tags":["Applications"],"x-relationship":{"type":"ruleset","domain":"intake","id":"interviewPrompts"}}}},"components":{"schemas":{"InterviewPromptsRequest":{"type":"object","description":"Input data for interviewPrompts evaluation. All fields are optional — partial inputs trigger partial evaluation.","properties":{"household":{"type":"object","description":"Household composition and financial circumstances.","properties":{"monthlyIncome":{"type":"number","description":"Total monthly gross income reported by the household."},"monthlyExpenses":{"type":"number","description":"Total monthly expenses reported by the household."},"members":{"type":"array","description":"All individuals in the household.","items":{"$ref":"./intake-schemas.yaml#/$defs/HouseholdMember"}}}},"application":{"type":"object","description":"Application-level context relevant to the interview.","properties":{"hasChangedCircumstances":{"type":"boolean","description":"Whether the household reported changes since the application was submitted."}}}}},"InterviewPromptsResponse":{"allOf":[{"$ref":"../../base/schemas/rules-evaluation.yaml#/EvaluationResult"}],"description":"Evaluation result for interviewPrompts."}}}}},{"relativePath":"domains/intake/intake-rules.yaml","domain":"intake","type":"rules","content":{"$schema":"https://blueprint.codeforamerica.org/schemas/rules-schema.yaml","domain":"intake","rulesets":{"interviewPrompts":{"endpoint":{"path":"/applications/evaluate-interview-prompts"},"inputs":{"household":{"type":"object","description":"Household composition and financial circumstances.","properties":{"monthlyIncome":{"type":"number","description":"Total monthly gross income reported by the household."},"monthlyExpenses":{"type":"number","description":"Total monthly expenses reported by the household."},"members":{"type":"array","description":"All individuals in the household.","items":{"$ref":"./intake-schemas.yaml#/$defs/HouseholdMember"}}}},"application":{"type":"object","description":"Application-level context relevant to the interview.","properties":{"hasChangedCircumstances":{"type":"boolean","description":"Whether the household reported changes since the application was submitted."}}}},"facts":[{"path":"incomeGapExists","type":"boolean","description":"Monthly income is less than monthly expenses — an inconsistency that requires probing for other income sources or assistance (FNS-1104).\n","expression":"household.monthlyIncome \u003c household.monthlyExpenses"},{"path":"workEligibleMembers","description":"Members aged 16–59 who are not employed and may be subject to work requirement screening (7 CFR § 273.7).\n","expression":"household.members.filter(m, m.age >= 16 && m.age \u003c= 54 && !m.isEmployed)"},{"path":"hasUnemployedWorkEligible","type":"boolean","description":"At least one member aged 16–59 is not employed.","expression":"household.members.exists(m, m.age >= 16 && m.age \u003c= 59 && !m.isEmployed)"},{"path":"hasStudentMembers","type":"boolean","description":"At least one household member is enrolled in higher education.","expression":"household.members.exists(m, m.isStudent)"},{"path":"hasNonCitizenMembers","type":"boolean","description":"At least one household member is a non-citizen.","expression":"household.members.exists(m, m.isNonCitizen)"},{"path":"allMembersEmployed","type":"boolean","description":"Every household member is currently employed.","expression":"household.members.all(m, m.isEmployed)"},{"path":"incomeInconsistencyPrompt","type":"boolean","description":"Prompt the household for unexplained income sources or assistance that account for the gap between income and expenses.\n","expression":"incomeGapExists"},{"path":"workRequirementPrompt","type":"boolean","description":"Screen non-employed members aged 16–59 for work requirement exemptions (physical/mental fitness, caregiving, education, etc.).\n","expression":"hasUnemployedWorkEligible"},{"path":"studentEligibilityPrompt","type":"boolean","description":"Screen student members for SNAP student eligibility exceptions (employment, dependent care, work-study, etc.).\n","expression":"hasStudentMembers"},{"path":"immigrationStatusPrompt","type":"boolean","description":"Screen non-citizen members for immigration status and apply sponsor income deeming rules where applicable.\n","expression":"hasNonCitizenMembers"},{"path":"changeVerificationPrompt","type":"boolean","description":"Identify and verify changes in household circumstances that occurred between the application date and the interview date.\n","expression":"application.hasChangedCircumstances"}],"outputs":{"incomeInconsistencyPrompt":{"type":"boolean"},"workEligibleMembers":{"type":"array"},"workRequirementPrompt":{"type":"boolean"},"studentEligibilityPrompt":{"type":"boolean"},"immigrationStatusPrompt":{"type":"boolean"},"changeVerificationPrompt":{"type":"boolean"},"allMembersEmployed":{"type":"boolean"}}}}}},{"relativePath":"domains/intake/intake-schemas.yaml","domain":null,"type":"components","content":{"$defs":{"HouseholdMember":{"type":"object","description":"A person in the household, as the interview rules read them. Shared so a ruleset can reference it rather than restating the shape — the compiler follows the $ref down to individual field paths, which is what keeps missing-input tracking per-field rather than per-object.\n","properties":{"age":{"type":"integer","description":"Member's age in years."},"isEmployed":{"type":"boolean","description":"Whether the member is currently employed."},"isStudent":{"type":"boolean","description":"Whether the member is enrolled at least half-time in higher education."},"isNonCitizen":{"type":"boolean","description":"Whether the member is a non-citizen subject to immigration screening."}}},"IncomeSource":{"description":"Income reported by a household member. Type discriminator determines the variant.","oneOf":[{"$ref":"#/$defs/EmploymentIncome"},{"$ref":"#/$defs/SelfEmploymentIncome"},{"$ref":"#/$defs/BenefitIncome"}],"discriminator":{"propertyName":"type","mapping":{"employment":"#/$defs/EmploymentIncome","self_employment":"#/$defs/SelfEmploymentIncome","benefit":"#/$defs/BenefitIncome"}}},"EmploymentIncome":{"type":"object","description":"Income from wages or salary employment.","required":["type","employer","monthlyGrossIncome"],"properties":{"type":{"type":"string","const":"employment"},"employer":{"type":"string","description":"Name of the employer."},"monthlyGrossIncome":{"type":"number","minimum":0,"description":"Monthly gross income before deductions (dollars)."}}},"SelfEmploymentIncome":{"type":"object","description":"Income from self-employment or a sole proprietorship.","required":["type","businessType","monthlyNetIncome"],"properties":{"type":{"type":"string","const":"self_employment"},"businessType":{"type":"string","description":"Type of business (e.g., sole proprietor, freelance)."},"monthlyNetIncome":{"type":"number","minimum":0,"description":"Monthly net income after business expenses (dollars)."}}},"BenefitIncome":{"type":"object","description":"Income from a government benefit program.","required":["type","benefitType","monthlyAmount"],"properties":{"type":{"type":"string","const":"benefit"},"benefitType":{"type":"string","enum":["ssi","ssdi","unemployment","veterans","other"],"description":"The benefit program providing income."},"monthlyAmount":{"type":"number","minimum":0,"description":"Monthly benefit amount (dollars)."}}}}}},{"relativePath":"domains/intake/intake-sla-types.yaml","domain":"intake","type":"sla-types","content":{"$schema":"sla-types-schema.yaml","version":"1.0","domain":"intake","slaTypes":[{"id":"snap_standard","name":"SNAP Standard Processing","duration":{"amount":30,"unit":"days"},"warningThresholdPercent":80,"pauseWhen":{"in":[{"var":"status"},["withdrawn"]]}},{"id":"medicaid_standard","name":"Medicaid Standard Processing","duration":{"amount":45,"unit":"days"},"warningThresholdPercent":80,"pauseWhen":{"in":[{"var":"status"},["withdrawn"]]}}]}},{"relativePath":"domains/intake/intake-state-machine.yaml","domain":"intake","type":"state-machine","content":{"$schema":"state-machine-schema.yaml","extends":"../platform/platform-state-machine.yaml","version":"1.0","domain":"intake","machines":[{"object":"Application","states":[{"id":"draft","slaClock":"stopped","description":"Created but not yet filed; regulatory clock has not started."},{"id":"submitted","slaClock":"running","description":"Formally filed; regulatory clock starts (7 CFR § 273.2(g))."},{"id":"under_review","slaClock":"running","description":"Caseworker is actively reviewing; clock running toward processing deadline."},{"id":"withdrawn","slaClock":"stopped","description":"Household withdrew the application. Terminal."},{"id":"closed","slaClock":"stopped","description":"Intake complete; case opened if approved. Terminal."}],"initialState":"draft","timers":[{"id":"review_reminder","description":"Fires when an application has been awaiting caseworker review for too long. The callback event (intake.review_reminder) triggers an escalation notice.\n"}],"emits":[{"id":"submitted","description":"TODO — describe when this event is emitted and who consumes it."},{"id":"closed","description":"TODO — describe when this event is emitted and who consumes it."},{"id":"withdrawn","description":"TODO — describe when this event is emitted and who consumes it."},{"id":"review-reminder","description":"Emitted when an application has been awaiting caseworker review for too long."}],"actions":[{"id":"submit","description":"Formally submits a draft application, starting the regulatory processing clock.","transition":{"from":"draft","to":"submitted"},"steps":[{"set":{"field":"submittedAt","value":"$now","description":"Record the submission timestamp (regulatory clock start)."}},{"emit":{"event":"submitted","subject":"$object.id","data":{"id":"$object.id","programsAppliedFor":"$object.programsAppliedFor"},"description":"Triggers eligibility screening, caseworker task creation, and confirmation notice.","type":"intake.application.submitted"}},{"call":"requestTimer","with":{"timerId":"review_reminder","fireAfter":{"amount":72,"unit":"hours"},"callback":{"event":"intake.review_reminder"}},"description":"Escalate if no caseworker has opened this application in 72 hours."}]},{"id":"open","description":"Moves a submitted application into active caseworker review.","transition":{"from":"submitted","to":"under_review"},"steps":[{"set":{"field":"openedAt","value":"$now","description":"Record when caseworker began review, marking the start of active processing."}}]},{"id":"close","description":"Closes the application once intake processing is complete.","schema":{"request":{"$ref":"#/$defs/CloseRequest"}},"transition":{"from":"under_review","to":"closed"},"steps":[{"emit":{"event":"closed","type":"intake.application.closed"}}]},{"id":"withdraw","description":"Withdraws the application at the household's request.","transition":{"from":["draft","submitted","under_review"],"to":"withdrawn"},"guards":[{"actors":["applicant","case_worker"]}],"steps":[{"emit":{"event":"withdrawn","type":"intake.application.withdrawn"}}]}],"on":[{"type":"intake.review_reminder","description":"Escalates an application that has been awaiting caseworker review for too long. Fired by the scheduling service when the review_reminder timer expires.\n","transition":{"from":"submitted"},"steps":[{"emit":{"event":"review-reminder","description":"Notify supervisors that this application needs immediate attention.","type":"intake.application.review-reminder"}}]}]}],"$defs":{"CloseRequest":{"type":"object","required":["outcome"],"properties":{"outcome":{"type":"string","enum":["approved","denied"],"description":"Whether the application was approved or denied at close."},"notes":{"type":"string","description":"Optional caseworker notes on the closure decision."}}}}}},{"relativePath":"domains/platform/platform-registry-patterns.yaml","domain":"platform","type":"registry","content":{"$schema":"registry-schema.yaml","version":"1.0","domain":"platform","type":"patterns","entries":{"oneof-discriminator":{"description":"Inline oneOf with a discriminator property, where all variants are defined within the same file (not via external $ref). Exercises discriminated union rendering, discriminator label resolution, and variant expansion in the explorer.\n"},"anyof":{"description":"anyOf composition — a field that may satisfy more than one schema simultaneously (e.g., a record with both electronic and manual verification on file). Exercises anyOf rendering and the semantic distinction from oneOf.\n"},"additional-properties-map":{"description":"Map type using additionalProperties to allow arbitrary key-value pairs (e.g., labels or metadata). Exercises additionalProperties rendering in the explorer and map validation in the schema validator.\n"},"read-only-field":{"description":"Field marked readOnly: true — server-generated and never accepted in write operations. Common for IDs, computed values, and lifecycle timestamps. Exercises readOnly rendering in the explorer and write-operation filtering.\n"},"deprecated-field":{"description":"Field marked deprecated: true with a migration note pointing to its replacement. Exercises deprecated field rendering in the explorer and tooling warnings.\n"},"string-format":{"description":"String field with a format constraint (uuid, date-time, date, email, etc.). Exercises format rendering in the explorer and format validation.\n"},"polymorphic-base":{"description":"Base schema extended via allOf in Create and Update variants. The Create variant adds required fields; the Update variant applies minProperties: 1 for partial updates. Exercises allOf merging and the Create/Update schema pattern.\n"},"array-of-enum":{"description":"Array of enum values. Exercises array-of-enum rendering in the explorer and array item validation in the schema validator.\n"},"x-enum-source":{"description":"Enum values resolved at build time from an external source (e.g., a state machine's state IDs) via the x-enum-source extension, rather than hardcoded in the OpenAPI spec. Exercises the resolver's x-enum-source injection.\n"},"nullable-state-gated-field":{"description":"Nullable field that is only present after a lifecycle transition (e.g., a timestamp set when an application is submitted). Exercises nullable field rendering and the pattern of state-gated fields.\n"},"nullable-conditional-field":{"description":"Nullable field whose presence depends on another field's value (e.g., a benefit amount present only when eligible is true). Exercises nullable field handling and conditional presence patterns.\n"},"external-ref-shared-defs":{"description":"External $ref to a shared $defs schema in a separate file. Exercises the resolver's cross-file $ref resolution and the explorer's external schema name rendering.\n"},"external-ref-defs-oneof":{"description":"External $ref to a $defs schema that is itself a oneOf with a discriminator. Exercises: (1) cross-file $ref resolution, (2) discriminated union rendering with labeled variants, (3) field inventory handling of oneOf inside an external $defs ref.\n"},"allof-inline-required":{"description":"allOf composition that adds inline required fields without duplicating properties (e.g., a Create variant that adds a required field to a base schema). Exercises the resolver's allOf merging and the explorer's allOf rendering.\n"},"paginated-list":{"description":"Collection endpoint returning items/total/limit/offset/hasNext. The standard blueprint pagination envelope. Exercises paginated list rendering and parameter validation (limit, offset, sort, search).\n"},"sub-resource":{"description":"Resource nested under a parent at a path like /parents/{id}/children. Full CRUD scoped to the parent. Exercises nested routing, parent FK validation, and sub-resource list/detail rendering in the explorer.\n"},"singleton-sub-resource":{"description":"Single resource nested under a parent at a path like /parents/{id}/summary, with no item-level ID. Accessed only through the parent. Exercises singleton sub-resource routing and composition rendering.\n"},"intra-domain-fk":{"description":"Intra-domain x-relationship foreign key linking a sub-resource back to its parent resource within the same domain. Exercises cross-reference rendering in the explorer and FK validation.\n"},"cross-domain-fk":{"description":"Cross-domain x-relationship foreign key linking a resource in one domain to a resource in another. Exercises cross-domain reference rendering and FK validation across domain boundaries.\n"},"rpc-state-machine-action":{"description":"RPC-style state machine action with a generated POST endpoint. Exercises the RPC overlay generator, x-relationship tagging, and state machine → API cross-linking in the explorer.\n"},"state-machine-guard":{"description":"Named boolean condition (CEL expression) attached to a state machine action. The action can only be triggered when all guard conditions pass. Exercises guard evaluation, actor role checking, and guard composition (any/all).\n"},"state-machine-timer":{"description":"Timer declaration on a state machine. The scheduling service emits a callback event ({domain}.{id}) when the timer fires; the machine subscribes to react. Exercises timer declaration rendering and the timer → event subscription link.\n"},"state-machine-subscription":{"description":"State machine subscribing to a domain event emitted by a different domain. The handler runs steps (create, emit, call) automatically when the event arrives. Exercises cross-domain event subscription and handler rendering.\n"},"state-machine-event":{"description":"Domain event emitted on a state machine transition. Exercises AsyncAPI event catalog generation and event → state machine cross-linking.\n"},"cross-domain-event":{"description":"Domain event consumed by downstream domains outside the emitting domain. Exercises event catalog cross-domain consumer rendering.\n"},"composition":{"description":"Read-only singleton resource assembled from fields across multiple resources, generated from a compositions contract. Produces a GET endpoint nested under the parent resource (e.g. /applications/{id}/summary). Exercises the composition generator, x-relationship injection, and singleton rendering in the explorer.\n"},"overlay":{"description":"Field or element added or modified by an adopter overlay. Overlays add state-required fields, tighten enums, and set global configuration (x-casing, x-pagination, x-search, x-relationship, x-event-type-prefix). Exercises the overlay resolver and adopter-level customization patterns.\n"},"ruleset-output-fact":{"description":"Output fact from a ruleset — a fact declared in the outputs list and returned by the REST endpoint. Exercises the rules engine → API endpoint link in the explorer (Rules badge).\n"},"ruleset-intermediate-fact":{"description":"Intermediate fact used internally by other facts but not returned by the REST endpoint. Exercises fact graph dependency rendering in the rules-docs visualizer.\n"},"array-of-oneof":{"description":"Array whose items are a oneOf discriminated union (e.g., EvaluationResult returning EvaluationFact variants). Exercises array-of-oneOf rendering, discriminator label resolution, and schema variant expansion.\n"}}}},{"relativePath":"domains/platform/platform-registry-policies.yaml","domain":"platform","type":"registry","content":{"$schema":"registry-schema.yaml","version":"1.0.0","domain":"platform","type":"policies","entries":{"snap-application-acceptance":{"citation":"7 CFR § 273.2(c)","description":"SNAP application acceptance requirements — agencies must accept applications on the day of initial contact and must not discourage or delay submission.\n"},"snap-right-to-apply":{"citation":"7 CFR § 273.2(a)","description":"SNAP right-to-apply — any household wishing to participate must be allowed to file an application, and the filing date establishes the benefit month.\n"},"snap-processing-clock":{"citation":"7 CFR § 273.2(g)","description":"SNAP application processing standards — 30-day processing clock from date of filing; expedited service within 7 days for qualifying households.\n"},"medicaid-processing-clock":{"citation":"42 CFR § 435.912","description":"Medicaid application processing standards — 45-day processing clock for most applicants; 90 days for disability-based applicants.\n"},"snap-notice-of-action":{"citation":"7 CFR § 273.13","description":"SNAP notice of adverse action — agencies must provide timely and adequate written notice before reducing, suspending, or terminating benefits.\n"},"snap-notice-of-eligibility":{"citation":"7 CFR § 273.10(g)","description":"SNAP notice of eligibility determination — written notice of approval or denial with reason, rights, and certification period.\n"},"medicaid-notice-of-eligibility":{"citation":"42 CFR § 435.917","description":"Medicaid notice of eligibility determination — written notice of approval or denial with reason, appeal rights, and effective date.\n"},"snap-fair-hearing-rights":{"citation":"7 CFR § 273.15","description":"SNAP fair hearing rights — households have the right to request a fair hearing within 90 days of any adverse action notice.\n"},"snap-interview-toolkit":{"citation":"FNS-1104 (March 2023, revised June 2025)","description":"FNS SNAP Interview Toolkit — six essential interview functions, probe triggers for inconsistency flags, verification requirements, and interview conclusion standards.\n"},"snap-general-work-requirement":{"citation":"7 CFR § 273.7","description":"SNAP general work requirements — able-bodied adults aged 16–59 must register for work, accept suitable employment, and participate in assigned employment and training programs. Exemptions include physical/mental incapacity, caregiving, school enrollment, and participation in other programs.\n"},"snap-abawd-work-requirement":{"citation":"7 CFR § 273.24","description":"SNAP able-bodied adults without dependents (ABAWD) work requirement — individuals aged 18–54 without dependents are limited to 3 months of benefits in any 36-month period unless they meet work, exemption, or waiver criteria.\n"},"snap-student-eligibility":{"citation":"7 CFR § 273.5","description":"SNAP eligibility rules for students enrolled at least half-time in higher education — generally ineligible unless they meet one of the statutory exceptions (employment, work-study, dependent care, TANF participation, etc.).\n"},"snap-expedited-processing":{"citation":"7 CFR § 273.2(i)","description":"SNAP expedited service — households with gross monthly income below $150 and liquid resources below $100 (or migrant/seasonal farmworkers) must receive benefits within 7 days of application.\n"},"snap-expedited-screening":{"citation":"7 CFR § 273.2(i)(1)","description":"SNAP expedited screening criteria — agencies must screen all applications on the day of receipt and identify households entitled to expedited service.\n"},"qualified-alien-eligibility":{"citation":"7 CFR § 273.4","description":"SNAP eligibility for non-citizens — only qualified aliens are eligible; status categories include LPRs, refugees, asylees, and other federally defined categories with varying waiting periods.\n"},"prwora-sponsor-deeming":{"citation":"8 U.S.C. § 1631","description":"PRWORA sponsor income deeming — income and resources of a sponsor who signed an I-864 Affidavit of Support on or after December 19, 1997 are deemed available to the sponsored non-citizen for SNAP purposes.\n"},"snap-household-composition":{"citation":"7 CFR § 273.1","description":"SNAP household composition rules — defines who must be included in a SNAP household, including mandatory household members, separate household rules, and treatment of boarders, roommates, and institutionalized individuals.\n"},"snap-income-verification":{"citation":"7 CFR § 273.2(f)","description":"SNAP income verification requirements — agencies must verify earned and unearned income at application and recertification, including acceptable documentary evidence and collateral contact standards.\n"},"snap-elderly-disabled-deductions":{"citation":"7 CFR § 273.9(d)","description":"SNAP deductions for elderly and disabled households — households with an elderly or disabled member may claim excess medical expense deductions and are exempt from the gross income test.\n"},"snap-benefit-calculation":{"citation":"7 CFR § 273.10","description":"SNAP benefit calculation — net monthly income is used to determine benefit allotment; benefit equals 30% of net income subtracted from the maximum allotment for household size.\n"},"chip-age-eligibility":{"citation":"42 CFR § 457.310","description":"CHIP age eligibility — states must define an upper age limit for CHIP eligibility (up to age 19), and may extend coverage to unborn children and former foster youth up to age 26 under state plan options.\n"},"medicaid-caretaker-relative":{"citation":"42 CFR § 435.110","description":"Medicaid caretaker relative eligibility — states must provide Medicaid to caretaker relatives of dependent children who meet income and resource standards, including parents and other adults who are the primary caregiver.\n"},"medicaid-cost-sharing":{"citation":"42 CFR § 447.50","description":"Medicaid cost sharing — limits on premiums, copayments, and other cost sharing for Medicaid enrollees, including aggregate limits by income level and prohibition on cost sharing for certain populations and services.\n"},"medicaid-determination-documentation":{"citation":"42 CFR § 435.940","description":"Medicaid eligibility verification — agencies must verify eligibility factors through electronic data sources before requesting documentation from applicants; paper documentation may be requested only when electronic verification is unavailable.\n"}}}},{"relativePath":"domains/platform/platform-state-machine.yaml","domain":null,"type":"state-machine","content":{"$schema":"state-machine-schema.yaml","version":"1.0","procedures":[{"id":"requestTimer","description":"Request a time-based callback from the scheduling service. Pass fireAfter (a duration) or fireAt (an absolute timestamp), and a callback naming the event to publish when it elapses. Nothing here waits: the request is an event, and whatever provides scheduling answers it — in a deployment a scheduler, in a test a mock stub, which is what makes a 72-hour deadline testable in a second.\n","parameters":["timerId","callback","fireAfter","fireAt"],"emit":{"type":"scheduling.timer.requested","subject":"$object.id","data":{"timerId":"$params.timerId","fireAfter":"$params.fireAfter","fireAt":"$params.fireAt","callback":"$params.callback"}}}]}},{"relativePath":"domains/scheduling/scheduling-asyncapi.yaml","domain":"scheduling","type":"asyncapi","content":{"asyncapi":"3.0.0","info":{"title":"Scheduling Domain Events","version":"0.1.0","x-status":"draft","x-domain":"scheduling","description":"The timer request channel, which is the whole scheduling surface this\nfixture needs. A domain asks for a time-based callback by publishing\n`scheduling.timer.requested` with the event to fire when it elapses;\nwhatever provides scheduling answers it. Nothing in this contract set\nimplements a scheduler, which is the point — the mock server's timer stub\nstands in, so a deadline measured in days is exercised in a second.\n"},"channels":{"scheduling.timer.requested":{"address":"scheduling.timer.requested","messages":{"timerRequested":{"$ref":"#/components/messages/TimerRequestedMessage"}}}},"components":{"messages":{"TimerRequestedMessage":{"name":"scheduling.timer.requested","summary":"Emitted by the platform requestTimer procedure. A scheduler registers the timer and publishes the callback event on expiry.\n","payload":{"$ref":"#/components/schemas/TimerRequestedEvent"}}},"schemas":{"TimerRequestedEvent":{"allOf":[{"$ref":"../../base/schemas/events.yaml#/$defs/Event"},{"type":"object","properties":{"type":{"type":"string","const":"scheduling.timer.requested"}}}]}}}}},{"relativePath":"scenarios/application-walkthrough.arazzo.yaml","domain":"intake","type":"arazzo","content":{"arazzo":"1.0.1","info":{"title":"The application walk-through","version":"1.0.0","x-domain":"intake","description":"A household applies for SNAP online and a caseworker takes the application from submission to close, showing what the mock does from the contracts alone:\n\n- separate shapes for what a client writes and what the system keeps, and derived fields\n- a file upload and an expanded relationship\n- search, sorting and paging\n- a lifecycle that refuses moves made out of turn\n- a composed view, and rules that explain their answers\n- one event log across every domain\n- the mock's own stand-ins and reset\n"},"sourceDescriptions":[{"name":"intake","url":"../domains/intake/intake-openapi.yaml","type":"openapi"},{"name":"intakeRules","url":"../domains/intake/intake-rules-openapi.yaml","type":"openapi"},{"name":"documents","url":"../domains/document-management/document-management-openapi.yaml","type":"openapi"},{"name":"eligibilityRules","url":"../domains/eligibility/eligibility-rules-openapi.yaml","type":"openapi"},{"name":"events","url":"../base/domains/platform/platform-events-openapi.yaml","type":"openapi"},{"name":"mock","url":"https://blueprint.codeforamerica.org/mock/mock-openapi.yaml","type":"openapi"}],"components":{"parameters":{"caller":{"name":"X-Caller-Id","in":"header","value":"the-explorer"}}},"workflows":[{"workflowId":"applicationWalkthrough","summary":"An application from creation to close, through every kind of thing the contracts declare.","steps":[{"stepId":"createApplication","description":"Create an application\n\n- You sent an `ApplicationCreate` and got back an `Application` — two schemas, not one. The contract declares the shape a client may write separately from the shape the system keeps.\n- `id`, `confirmationNumber`, `status`, `submittedAt`, `openedAt` are marked `readOnly`, so they are not on the shape you sent at all. The server filled them in because the contract says they exist.\n- `programCount` is declared as a derived field, with the expression `this.programsAppliedFor.size()`. Nothing stores it: the mock evaluates that expression every time the record is read.\n- `channel` is an enum in the contract — `online`, `phone`, `in_person`, `mail`. A value outside that list is refused by the schema, and no validation was written for this endpoint to do it.\n- `201` and `400`, `422`, `500` are all declared on this operation, and the mock worked out which one applied and returned it. None of them are canned.\n","operationId":"$sourceDescriptions.intake.createApplication","parameters":[{"reference":"$components.parameters.caller"}],"requestBody":{"payload":{"programsAppliedFor":["snap"],"channel":"online"}},"successCriteria":[{"condition":"$statusCode == 201"}],"outputs":{"id":"$response.body#/id"}},{"stepId":"uploadDocument","description":"Upload a document\n\n- This body is `multipart/form-data`, not JSON. The contract declares `file` with `format: binary`, which is how an OpenAPI document says bytes, and `documentTypeId`, `title` alongside it as ordinary fields. One operation in the whole set sends something that is not JSON, and it is the one most mocks fall over on.\n- What came back describes the upload and does not contain it. The bytes were hashed as they were read and then dropped — `contentHash` and `sizeBytes` are kept on the version this created, which `latestVersionId` names, and the file itself is nowhere. Nothing the mock holds can leak something nobody meant to share.\n","operationId":"$sourceDescriptions.documents.uploadDocument","parameters":[{"reference":"$components.parameters.caller"}],"requestBody":{"contentType":"multipart/form-data","payload":{"file":{"fileName":"april-pay-stub.txt","contentType":"text/plain","content":"Hashed on the way in, and then thrown away.\n"},"documentTypeId":"proof-of-income","title":"April pay stub"}},"successCriteria":[{"condition":"$statusCode == 201"}],"outputs":{"id":"$response.body#/id"}},{"stepId":"attachTheDocument","description":"Edit and attach the document\n\n- A third shape: `ApplicationUpdate` is what you may send here, and it is not `Application` either.\n- `proofOfIncomeDocumentId` is the id of the `Document` you uploaded a moment ago, and `proofOfIncomeDocument` is the whole record. The document-management domain declares that shape, this one declares a relationship to it, and the mock put what the id points at where the id was — one request rather than two, and nothing joining them in a client.\n- `updatedAt` moved on its own. Everything the request did not mention is as it was.\n- `id`, `confirmationNumber`, `status` are not on `ApplicationUpdate` at all, so there is no way to send them and nothing to reject.\n- `200` and `400`, `404`, `422`, `500` are all declared on this operation, and the mock worked out which one applied and returned it. None of them are canned.\n","operationId":"$sourceDescriptions.intake.updateApplication","parameters":[{"reference":"$components.parameters.caller"},{"name":"applicationId","in":"path","value":"$steps.createApplication.outputs.id"}],"requestBody":{"payload":{"programsAppliedFor":["snap"],"channel":"online","proofOfIncomeDocumentId":"$steps.uploadDocument.outputs.id"}},"successCriteria":[{"condition":"$statusCode == 200"}]},{"stepId":"listApplications","description":"List the applications\n\n- `q`, `sort`, `limit` are in the request above, and `q`, `limit`, `offset`, `sort`, `status`, `channel` are all declared on the operation. Declaring them was the whole of the work — the searching, filtering and paging came with them.\n- `x-sortable` lists `createdAt`, `updatedAt`, `submittedAt`, `status`, `channel` as the fields that may be sorted, and `-createdAt` as the order when a request does not say. Any other field is refused by name. The allowlist is that declaration — there is no check written for this endpoint.\n- `items`, `total`, `limit`, `offset` — the page envelope is the contract's shape, not a convention the mock chose.\n","operationId":"$sourceDescriptions.intake.listApplications","parameters":[{"reference":"$components.parameters.caller"},{"name":"q","in":"query","value":"online"},{"name":"sort","in":"query","value":"-createdAt"},{"name":"limit","in":"query","value":"5"}],"successCriteria":[{"condition":"$statusCode == 200"}]},{"stepId":"standInForTheScheduler","description":"Stand in for the scheduler\n\n- Nothing in the contract set implements a scheduler, and `submit` asks for one `72 hours` out. That gap is declared, not accidental.\n- This registers a stand-in for `scheduling.timer.requested`, so the callback lands the moment it is asked for. The contract did not change — the thing on the other end of it did.\n","operationId":"$sourceDescriptions.mock.registerEventStub","requestBody":{"payload":{"on":"scheduling.timer.requested"}},"successCriteria":[{"condition":"$statusCode == 201"}]},{"stepId":"submitApplication","description":"Submit the application\n\n- The contract declares this move as `draft → submitted`. From any other state the mock refuses it — not from a check somebody wrote for this endpoint, but by reading that line.\n- This action also calls `requestTimer` with a `fireAfter` of 72 hours, which emits `scheduling.timer.requested`. The stand-in you registered answers it immediately, so `intake.review_reminder` is already in the event log rather than three days away.\n- `slaTypeCode` and `slaInfo` are filled from an SLA contract: `snap_standard` runs 30 days, warns at 80% of it, and stops while `status` is `withdrawn`. The clock is a declaration, not a cron job somebody remembered to write.\n- `submittedAt` is annotated with `snap-processing-clock`, which the shared policy registry resolves to 7 CFR § 273.2(g). SNAP application processing standards — 30-day processing clock from date of filing; expedited service within 7 days for qualifying households.\n- `200` and `400`, `404`, `409`, `500` are all declared on this operation, and the mock worked out which one applied and returned it. A `409` is declared here because the contract anticipates this call being made out of turn.\n","operationId":"$sourceDescriptions.intake.submitApplication","parameters":[{"reference":"$components.parameters.caller"},{"name":"applicationId","in":"path","value":"$steps.createApplication.outputs.id"}],"successCriteria":[{"condition":"$statusCode == 200"}]},{"stepId":"closeFromTheWrongState","description":"Close it from the wrong state\n\n- The contract declares this move as `under_review → closed`, and the record is not in that state yet. Nothing checked for this case on purpose — the mock reads that line and answers from it, the same line the moves that worked read.\n- Every lifecycle in the set is enforced this way, so a state machine nobody implemented is still a state machine you cannot get around.\n","operationId":"$sourceDescriptions.intake.closeApplication","parameters":[{"reference":"$components.parameters.caller"},{"name":"applicationId","in":"path","value":"$steps.createApplication.outputs.id"}],"requestBody":{"payload":{"outcome":"approved"}},"successCriteria":[{"condition":"$statusCode == 409"}]},{"stepId":"openApplication","description":"Open the application\n\n- `openedAt` was null until now. The lifecycle declares `set: openedAt = $now` on this move, so the field is written because the state machine says so — there is no handler here that writes it.\n","operationId":"$sourceDescriptions.intake.openApplication","parameters":[{"reference":"$components.parameters.caller"},{"name":"applicationId","in":"path","value":"$steps.createApplication.outputs.id"}],"successCriteria":[{"condition":"$statusCode == 200"}]},{"stepId":"closeApplication","description":"Close the application\n\n- This move emits `intake.application.closed`, which the log a few steps on will have in it. Nothing subscribed to it and nothing called a publisher: the action declares an `emit` and the mock does it.\n","operationId":"$sourceDescriptions.intake.closeApplication","parameters":[{"reference":"$components.parameters.caller"},{"name":"applicationId","in":"path","value":"$steps.createApplication.outputs.id"}],"requestBody":{"payload":{"outcome":"approved"}},"successCriteria":[{"condition":"$statusCode == 200"}]},{"stepId":"buildAView","description":"Build a view of the application\n\n- Nothing stores this shape. The composition names `programsAppliedFor`, `status` and the mock reads those fields off the stored application when you ask for it.\n- It also pulls in `members`, which live in their own collection. Reading this without the composition means a request for the application and 1 more for the rest, then assembling them in the client.\n- This is where the `_links` on the application came from. `applicationSummary`, `applicationReview` set `parentLink`, so the mock added `/summary`, `/review` to every application it returns. The application's own schema says nothing about either of them.\n","operationId":"$sourceDescriptions.intake.getApplicationReview","parameters":[{"reference":"$components.parameters.caller"},{"name":"applicationId","in":"path","value":"$steps.createApplication.outputs.id"}],"successCriteria":[{"condition":"$statusCode == 200"}]},{"stepId":"evaluateExpeditedSnap","description":"Evaluate expeditedSnap\n\n- The answer is not one expression but a chain of named facts. The last is `isExpeditedEligible = (isLowIncome && hasLowResources) || isCombinedUnderShelter || isMigrantWithLowResources` — so the system can say which condition carried, not just what it concluded.\n- `incomeThreshold` is an input with a default of `150`, citing 7 CFR § 273.2(i)(1)(i). It is a number Congress changes, so the contract treats it as one rather than burying it in code.\n- `resourceThreshold` is an input with a default of `100`, citing 7 CFR § 273.2(i)(1)(i). It is a number Congress changes, so the contract treats it as one rather than burying it in code.\n- Every fact comes back as a `state` and a `value` rather than a bare answer. `complete` means everything it needed was given to it; a fact that fell back to a declared default says `placeholder` instead, so a caller can tell a real conclusion from a provisional one.\n","operationId":"$sourceDescriptions.eligibilityRules.evaluateExpeditedSnap","parameters":[{"reference":"$components.parameters.caller"}],"requestBody":{"payload":{"household":{"monthlyGrossIncome":120,"liquidResources":75,"monthlyShelterCost":800,"isMigrantFarmworker":false},"policy":{"incomeThreshold":150,"resourceThreshold":100}}},"successCriteria":[{"condition":"$statusCode == 200"}]},{"stepId":"evaluateInterviewPrompts","description":"Evaluate interviewPrompts\n\n- The answer is not one expression but a chain of named facts. The last is `changeVerificationPrompt = application.hasChangedCircumstances` — so the system can say which condition carried, not just what it concluded.\n- `interviewPrompts.incomeInconsistencyPrompt` carries more than a true or false. The annotations attach `snap-interview-toolkit` to it and 2 interview questions to go with it, so the rule that raises a prompt and the words somebody says out loud are one declaration rather than two that drift apart.\n","operationId":"$sourceDescriptions.intakeRules.evaluateInterviewPrompts","parameters":[{"reference":"$components.parameters.caller"}],"requestBody":{"payload":{"household":{"monthlyIncome":800,"monthlyExpenses":1200,"members":[{"age":35,"isEmployed":false,"isStudent":false,"isNonCitizen":false},{"age":8,"isEmployed":false,"isStudent":false,"isNonCitizen":false}]},"application":{"hasChangedCircumstances":false}}},"successCriteria":[{"condition":"$statusCode == 200"}]},{"stepId":"seeWhatTheWalkEmitted","description":"See what the walk emitted\n\n- Every change you made emitted one of these, and nothing asked for them. Uploading a document wrote to this log; so did submitting, opening and closing.\n- The types are declared as channels in the contract set — `communication.transcript.created`, `communication.transcript.updated`, `communication.transcript.deleted`, `communication.transcript_entry.created`, and the rest.\n- One log, every domain. Nothing wired them together.\n","operationId":"$sourceDescriptions.events.listEvents","parameters":[{"reference":"$components.parameters.caller"}],"successCriteria":[{"condition":"$statusCode == 200"}]},{"stepId":"narrowTheLog","description":"Narrow the log to one record\n\n- `q` is full text over the whole log, narrowed here to the application you created. The document upload drops out — it happened, but to a different subject.\n- What is left was written by more than one domain. Submitting the application is what made eligibility start a determination, and neither domain was wired to the other: each declares its own channel, and this log is all they share.\n- `sort` works here for the same reason it worked on the applications — this operation declares its own `x-sortable`, over `time`, `type`, `source`. Nothing was written twice to make both endpoints sortable.\n","operationId":"$sourceDescriptions.events.listEvents","parameters":[{"reference":"$components.parameters.caller"},{"name":"q","in":"query","value":"$steps.createApplication.outputs.id"},{"name":"sort","in":"query","value":"-time"},{"name":"limit","in":"query","value":"5"}],"successCriteria":[{"condition":"$statusCode == 200"}]},{"stepId":"emptyTheStore","description":"Empty the store\n\n- No contract declares this endpoint. It belongs to the mock, not to the system it is running.\n- It clears records, never contracts — afterwards the API is exactly the API it was.\n","operationId":"$sourceDescriptions.mock.resetMock","successCriteria":[{"condition":"$statusCode == 204"}]},{"stepId":"putTheDataBack","description":"Put the data back\n\n- The records come from the contract set's own `*-mock-data.yaml`, and are checked against the same schemas as anything you send.\n","operationId":"$sourceDescriptions.mock.reseedMock","successCriteria":[{"condition":"$statusCode == 204"}]}]}]}},{"relativePath":"scenarios/transcript-lifecycle.arazzo.yaml","domain":"communication","type":"arazzo","content":{"arazzo":"1.0.1","info":{"title":"A transcript, from start to close","version":"1.0.0","x-domain":"communication","description":"A caseworker's interview software transcribes an interview from start to close, then abandons a second transcript, exercising the transcription domain end to end:\n\n- profiles, and what a transcript needs before it can start\n- a timeline of lines, gaps and pauses, each judged by when it started\n- retries recognized by their Idempotency-Key, and entries that never change\n- closing, and the idle timeout, with the mock standing in for the scheduler\n"},"sourceDescriptions":[{"name":"transcripts","url":"../base/domains/communication/communication-transcripts-openapi.yaml","type":"openapi"},{"name":"mock","url":"https://blueprint.codeforamerica.org/mock/mock-openapi.yaml","type":"openapi"}],"components":{"parameters":{"caller":{"name":"X-Caller-Id","in":"header","value":"worker-1"},"transcript":{"name":"transcriptId","in":"path","value":"$steps.start.outputs.id"}}},"workflows":[{"workflowId":"transcriptLifecycle","summary":"Start, record, pause, resume and close a transcript, and see what it refuses.","steps":[{"stepId":"addProfile","description":"Add a profile\n\n- You sent a `TranscriptionProfileCreate` and got back a `TranscriptionProfile`: the shape an administrator writes, and the shape the system keeps.\n- `provider` takes its values from the `transcription-services` registry, through `x-enum-source`. `aws-transcribe` is an entry there; a service no entry names is refused, and a contract set adds one with a registry file of its own.\n- `source` is `user` for a profile added through the API, and `system` for the ones the config seeds.\n- No `idleTimeout`, so transcripts under this profile never close for being idle.\n","operationId":"$sourceDescriptions.transcripts.createTranscriptionProfile","parameters":[{"name":"X-Caller-Id","in":"header","value":"admin-1"}],"requestBody":{"payload":{"name":"english-interview","provider":"aws-transcribe","languages":["en-US"]}},"successCriteria":[{"condition":"$statusCode == 201"},{"condition":"$response.body#/source == 'user'"}],"outputs":{"id":"$response.body#/id"}},{"stepId":"startWithoutAModel","description":"Start without a model\n\n- Refused with `409` by `modelGivenForTheService`: under a profile whose `provider` is a transcription service, a transcript has to say which `model` produced its lines.\n- The refusal is the guard's description, written as a sentence. `profileExists` passed, so only the condition not met is named.\n- A guard runs on a plain create because the state machine governs `Transcript` under `resources:`. No action is involved.\n","operationId":"$sourceDescriptions.transcripts.createTranscript","parameters":[{"reference":"$components.parameters.caller"}],"requestBody":{"payload":{"profileId":"$steps.addProfile.outputs.id","client":"interview-assistant/0.1.0","startedAt":"2026-10-12T10:00:00Z"}},"successCriteria":[{"condition":"$statusCode == 409"}]},{"stepId":"startUnderAMissingProfile","description":"Start under a profile that does not exist\n\n- Refused with `409` by `profileExists`: the guard reads the profile `profileId` names, through the machine's context, and there isn't one.\n- Both guards run, and each one not met is named. `modelGivenForTheService` passes here, since without a profile there is no service to need a model.\n","operationId":"$sourceDescriptions.transcripts.createTranscript","parameters":[{"reference":"$components.parameters.caller"}],"requestBody":{"payload":{"profileId":"00000000-0000-4000-8000-000000000000","model":"standard","client":"interview-assistant/0.1.0","startedAt":"2026-10-12T10:00:00Z"}},"successCriteria":[{"condition":"$statusCode == 409"}]},{"stepId":"start","description":"Start the transcript\n\n- `TranscriptCreate` requires `profileId`, `client` and `startedAt`. `model` is required by the guard, not the schema, because a profile whose `provider` is `none` needs none.\n- `status` is `recording` because that is the state machine's initial state. Nothing in the request set it.\n- `startedAt` is by the software's clock, and every time on the transcript's entries is compared on that same clock.\n","operationId":"$sourceDescriptions.transcripts.createTranscript","parameters":[{"reference":"$components.parameters.caller"}],"requestBody":{"payload":{"profileId":"$steps.addProfile.outputs.id","model":"standard","client":"interview-assistant/0.1.0","startedAt":"2026-10-12T10:00:00Z"}},"successCriteria":[{"condition":"$statusCode == 201"},{"condition":"$response.body#/status == 'recording'"},{"condition":"$response.body#/profile/id == $steps.addProfile.outputs.id"}],"outputs":{"id":"$response.body#/id"}},{"stepId":"firstLine","description":"Add the first line\n\n- `Idempotency-Key` is declared on this operation, from the shared parameters every domain uses. The mock remembers the key with its answer.\n- The body is a `TranscriptLineCreate`, one of the kinds `TranscriptEntryCreate` chooses between by `kind`.\n- `startedWhileRecording`, `endsAfterItStarts` and `gapOutsidePauses` all passed: the guards the machine puts on every new entry.\n","operationId":"$sourceDescriptions.transcripts.addTranscriptEntry","parameters":[{"reference":"$components.parameters.caller"},{"reference":"$components.parameters.transcript"},{"name":"Idempotency-Key","in":"header","value":"line-1"}],"requestBody":{"payload":{"kind":"line","startedAt":"2026-10-12T10:00:05Z","endedAt":"2026-10-12T10:00:06Z","text":"Can you tell me who lives with you?","speaker":"staff"}},"successCriteria":[{"condition":"$statusCode == 201"}],"outputs":{"id":"$response.body#/id"}},{"stepId":"retryFirstLine","description":"Send it again\n\n- Same `Idempotency-Key`, same body: the mock answers with the line it already stored, with the same `id` and `Idempotent-Replayed: true`. No second line is written.\n- The same key with a different body would be refused with `422`. A retry is the same request; a new request needs a new key.\n","operationId":"$sourceDescriptions.transcripts.addTranscriptEntry","parameters":[{"reference":"$components.parameters.caller"},{"reference":"$components.parameters.transcript"},{"name":"Idempotency-Key","in":"header","value":"line-1"}],"requestBody":{"payload":{"kind":"line","startedAt":"2026-10-12T10:00:05Z","endedAt":"2026-10-12T10:00:06Z","text":"Can you tell me who lives with you?","speaker":"staff"}},"successCriteria":[{"condition":"$statusCode == 201"},{"condition":"$response.body#/id == $steps.firstLine.outputs.id"},{"condition":"$response.header.Idempotent-Replayed == 'true'"}]},{"stepId":"pause","description":"Go off the record\n\n- `pause` is an action of the transcript's state machine, from `recording` to `paused`, guarded by `atAfterStart`.\n- Its steps write a `pause` entry with no `endedAt`, and emit `paused`, which resolve names `communication.transcript.paused`.\n- `at` is by the software's clock too. `AtRequest` declares it, for pausing, resuming and closing alike.\n","operationId":"$sourceDescriptions.transcripts.pauseTranscript","parameters":[{"reference":"$components.parameters.caller"},{"reference":"$components.parameters.transcript"}],"requestBody":{"payload":{"at":"2026-10-12T10:00:10Z"}},"successCriteria":[{"condition":"$statusCode == 200"},{"condition":"$response.body#/status == 'paused'"}]},{"stepId":"lineSaidBeforeThePause","description":"A line said just before the pause\n\n- It arrived after the pause, but its `startedAt` is before it, and `startedWhileRecording` judges an entry by when it started. Kept.\n- Software sends a line once it is finished, so a line still being spoken when the pause came always arrives late.\n","operationId":"$sourceDescriptions.transcripts.addTranscriptEntry","parameters":[{"reference":"$components.parameters.caller"},{"reference":"$components.parameters.transcript"},{"name":"Idempotency-Key","in":"header","value":"line-2"}],"requestBody":{"payload":{"kind":"line","startedAt":"2026-10-12T10:00:08Z","endedAt":"2026-10-12T10:00:11Z","text":"My two kids and my mother.","speaker":"client"}},"successCriteria":[{"condition":"$statusCode == 201"}]},{"stepId":"lineSaidDuringThePause","description":"A line said during the pause\n\n- Refused with `409` by `startedWhileRecording`: a pause was open when the line started.\n- The server refuses it, not the software. Nothing said off the record is kept, even from software that keeps sending.\n","operationId":"$sourceDescriptions.transcripts.addTranscriptEntry","parameters":[{"reference":"$components.parameters.cal eters":[{"reference":"$components.parameters.caller"},{"reference":"$components.parameters.transcript"},{"name":"Idempotency-Key","in":"header","value":"line-4"}],"requestBody":{"payload":{"kind":"line","startedAt":"2026-10-12T10:00:15Z","endedAt":"2026-10-12T10:00:16Z","text":"Still off the record.","speaker":"client"}},"successCriteria":[{"condition":"$statusCode == 409"}]},{"stepId":"timeline","description":"Read the timeline\n\n- A `TranscriptEntryList`: lines, gaps and pauses together, in the order they happened by `startedAt`.\n- `total` is 3: the two lines kept, and the pause with the `endedAt` resuming gave it. The refused entries left nothing behind.\n","operationId":"$sourceDescriptions.transcripts.listTranscriptEntries","parameters":[{"reference":"$components.parameters.caller"},{"reference":"$components.parameters.transcript"}],"successCriteria":[{"condition":"$statusCode == 200"},{"condition":"$response.body#/total == 3"},{"condition":"$response.body#/items/2/kind == 'pause'"},{"condition":"$response.body#/items/2/endedAt == '2026-10-12T10:00:20Z'"}],"outputs":{"firstEntryId":"$response.body#/items/0/id"}},{"stepId":"clientEditsAnEntry","description":"Try to change an entry\n\n- Refused with `403`: the machine lets only `system` update a `TranscriptEntry`, and the caller's role is checked before the body is.\n- Resuming and closing end a pause through the machine's own steps, which are not held to this.\n","operationId":"$sourceDescriptions.transcripts.updateTranscriptEntry","parameters":[{"reference":"$components.parameters.caller"},{"reference":"$components.parameters.transcript"},{"name":"entryId","in":"path","value":"$steps.timeline.outputs.firstEntryId"}],"requestBody":{"payload":{"endedAt":"2026-10-12T10:00:59Z"}},"successCriteria":[{"condition":"$statusCode == 403"}]},{"stepId":"close","description":"Close the transcript\n\n- `close` goes from `recording` or `paused` to `closed`, and sets `closedAt` to the `at` sent.\n- `lastActivityAt` is when t <script type="module">
const { createMockServer, extract, generate, startScenario, operationIndex, controlOperations } =
  globalThis.BlueprintMock ?? await import('./mock.js');

const $ = (id) => document.getElementById(id);
const el = (tag, text = '', className = '') => {
  const node = document.createElement(tag);
  if (text !== '') node.textContent = text;
  if (className) node.className = className;
  return node;
};

/** Everything below the directory this page is served from. */
const basePath = location.pathname.replace(/\/[^/]*$/, '');

/** Where this checkout's contracts are browsable, if the build knew. */
const pageConfig = (() => {
  const tag = document.getElementById('page-config');
  try { return tag ? JSON.parse(tag.textContent) : {}; } catch { return {}; }
})();

let docs;          // every document in the set
let mock;          // the server derived from them
let seeded = true; // whether the last derive loaded the shipped records
let showAll = false;  // the walk-through, or the whole reference
// What Show me around is showing: the application walk-through, or one of the
// contract set's Arazzo scenarios by path — which step of it, and what its
// last run answered, by workflow and step.
let tour = null;
let tourStep = null;
let tourRunner = null;          // the run in progress, a step at a time on this server
const tourResults = new Map();  // workflow/step → what it answered
let tourWhole = false;          // the whole tour on one page, rather than a step at a time
const made = new Map();  // collection → the id the walk created there
const built = new Map(); // schema name → the id the walk created of that shape
const answers = new Map(); // step → what it answered, so going back shows it
let selected = null;
// The reference's domain groups the reader has opened. The navigation is
// rebuilt on every click, and rebuilding from scratch used to collapse every
// group but the first — so picking an operation closed the one you were in.
let openDomains = null;
// What the reader picked for each path parameter, by operation and name, so a
// panel redrawn after a pick keeps it — and the parameters after it list the
// records under what was picked.
const chosen = new Map();

/**
 * The contract set, inlined by the single-file build or fetched beside the
 * page when it is served.
 */
const loadContracts = async () => {
  const inlined = document.getElementById('contracts-data');
  if (inlined) return JSON.parse(inlined.textContent);
  const response = await fetch('./contracts.json');
  if (!response.ok) throw new Error(`contracts.json: ${response.status}`);
  return response.json();
};

// Who the reference calls as, chosen above each request. The walk always
// calls as itself, so a choice made while exploring cannot break a step.
const WALK_CALLER = 'the-explorer';
const caller = { id: WALK_CALLER, type: 'user', roles: [] };

/**
 * The caller headers a request carries.
 *
 * The mock reads the kind of actor from the roles, so a kind other than
 * `user` goes in as one; an unauthenticated caller sends no identity at all.
 * A real deployment takes all of this from the sign-in token instead.
 */
const callerHeaders = () => {
  if (!showAll) return { 'X-Caller-Id': WALK_CALLER };
  const id = caller.id.trim();
  if (caller.type === 'unauthenticated' || !id) return {};
  const roles = caller.roles.filter((role) => role !== caller.type);
  if (caller.type !== 'user') roles.unshift(caller.type);
  return { 'X-Caller-Id': id, ...(roles.length ? { 'X-Caller-Roles': roles.join(',') } : {}) };
};

/** The kinds of actor an event can record, as the events contract lists them. */
const actorTypes = () => {
  const schema = docs.find((doc) => doc.type === 'schema' && doc.content?.$defs?.Event);
  const parts = schema?.content.$defs.Event.allOf ?? [];
  const authtype = parts.map((part) => part.properties?.authtype).find(Boolean);
  return (authtype?.enum ?? ['user']).filter((value) => value !== null);
};

/**
 * The roles a caller can hold: the set's RoleType, which its guards are
 * validated against. Empty when the set declares none.
 */
const roleTypes = () => {
  const schema = docs.find((doc) => Array.isArray(doc.content?.$defs?.RoleType?.enum));
  return schema?.content.$defs.RoleType.enum ?? [];
};

/**
 * Whether an operation takes an Idempotency-Key header — the shared
 * IdempotencyKeyParam, which an operation lists to require one per create.
 */
const takesIdempotencyKey = (op) => (op.operation?.parameters ?? [])
  .map((parameter) => deref(parameter, op.doc))
  .some((p) => p?.in === 'header' && typeof p.name === 'string' && p.name.toLowerCase() === 'idempotency-key');

/** The headers a step sends besides the caller's: a fresh key, where the operation takes one. */
const keyHeaders = (op, key = crypto.randomUUID()) =>
  takesIdempotencyKey(op) ? { 'Idempotency-Key': key } : {};

/**
 * The Idempotency-Key row: a fresh key each time the panel opens, which the
 * reader can type over — `12345` twice is how to see a retry answered with
 * the same entry, and `12345` with a different body how to see it refused.
 */
const idempotencyRow = () => {
  const row = el('div', '', 'caller');
  const box = el('input', '', 'caller-id');
  box.type = 'text';
  box.value = crypto.randomUUID();
  box.setAttribute('aria-label', 'Idempotency-Key');
  row.append(document.createTextNode('Idempotency-Key'), box);
  return { row, value: () => box.value.trim() };
};

/** The "Calling as" row: an id, a kind of actor, and roles. */
const callerRow = () => {
  const row = el('div', '', 'caller');
  const id = el('input', '', 'caller-id');
  id.type = 'text';
  id.value = caller.id;
  id.setAttribute('aria-label', 'Caller id');
  id.oninput = () => { caller.id = id.value; };

  const type = el('select', '', 'caller-type');
  type.setAttribute('aria-label', 'Caller type');
  type.append(...actorTypes().map((kind) => el('option', kind)));
  type.value = caller.type;
  id.disabled = caller.type === 'unauthenticated';
  type.onchange = () => { caller.type = type.value; id.disabled = type.value === 'unauthenticated'; };

  // A dropdown of the declared roles, any number checked; a box to type them
  // into for a set that declares none.
  let roles;
  const declared = roleTypes();
  if (declared.length > 0) {
    roles = el('details', '', 'caller-roles');
    const summary = el('summary');
    const label = () => { summary.textContent = caller.roles.length ? caller.roles.join(', ') : 'no roles'; };
    roles.append(summary);
    const list = el('div', '', 'menu');
    for (const role of declared) {
      const option = el('label');
      const box = el('input');
      box.type = 'checkbox';
      box.checked = caller.roles.includes(role);
      box.onchange = () => {
        caller.roles = declared.filter((name) => name === role ? box.checked : caller.roles.includes(name));
        label();
      };
      option.append(box, document.createTextNode(role));
      list.append(option);
    }
    roles.append(list);
    label();
  } else {
    roles = el('input', '', 'caller-roles');
    roles.type = 'text';
    roles.value = caller.roles.join(', ');
    roles.placeholder = 'roles, comma-separated';
    roles.oninput = () => { caller.roles = roles.value.split(',').map((role) => role.trim()).filter(Boolean); };
  }
  roles.setAttribute('aria-label', 'Caller roles');

  row.append(document.createTextNode('Calling as'), id, type, roles);
  return row;
};

const call = async (method, path, body, headers = {}) => {
  const init = { method, headers: { ...callerHeaders(), ...headers } };
  if (body instanceof FormData) {
    init.body = body;
  } else if (body !== undefined) {
    init.headers['content-type'] = 'application/json';
    init.body = typeof body === 'string' ? body : JSON.stringify(body);
  }
  const response = await mock.fetch(new Request(new URL(basePath + path, location.origin), init));
  const text = await response.text();
  let parsed;
  try { parsed = JSON.parse(text); } catch { parsed = text; }
  return { status: response.status, statusText: response.statusText, body: parsed };
};

// ── Reading the contracts ───────────────────────────────────────────────────

const openapiDocs = () => docs.filter((doc) => doc.type === 'openapi');

/** The server prefix an OpenAPI document's paths hang off. */
const prefixOf = (doc) => {
  const [server] = doc.content?.servers ?? [];
  if (!server?.url) return '';
  try { return new URL(server.url).pathname.replace(/\/$/, ''); } catch { return server.url; }
};

/**
 * Every operation the loaded documents declare, with where it came from.
 *
 * Read off the documents rather than the server's route table: the table
 * registers four extra methods on a read-only projection purely so they can
 * answer 405, and offering those is offering four ways to be told no.
 */
const operations = () => {
  const found = [];
  for (const doc of openapiDocs()) {
    const prefix = prefixOf(doc);
    for (const [declared, item] of Object.entries(doc.content?.paths ?? {})) {
      for (const [method, operation] of Object.entries(item ?? {})) {
        if (!/^(get|post|put|patch|delete)$/.test(method)) continue;
        found.push({
          method: method.toUpperCase(),
          path: prefix + declared,
          template: declared,
          operation,
          doc,
          domain: doc.domain ?? doc.content?.info?.['x-domain'] ?? 'other',
          summary: operation.summary ?? operation.operationId ?? `${method.toUpperCase()} ${declared}`,
        });
      }
    }
  }
  return found;
};

/** The state machine actions the loaded documents declare, by endpoint path. */
const actions = () => {
  const byPath = new Map();
  for (const doc of docs.filter((d) => d.type === 'state-machine')) {
    for (const machine of doc.content?.machines ?? []) {
      for (const action of machine.actions ?? []) {
        const from = action.transition?.from;
        byPath.set(action.id, {
          id: action.id,
          object: machine.object,
          from: Array.isArray(from) ? from : String(from ?? '').split(',').map((s) => s.trim()),
          to: action.transition?.to,
          // What the move does on the way through, which is how one
          // transition differs from the next. Without these every move in a
          // lifecycle has the same thing said about it.
          steps: action.steps ?? [],
          doc: doc.relativePath,
        });
      }
    }
  }
  return byPath;
};

/**
 * The paths every declared composition owns, including the ones it generates
 * beneath itself — section panels and the per-section review state.
 *
 * Without this they classify as ordinary item routes, and nineteen of them
 * pile into Resources, which is both wrong and the exact overwhelm this page
 * is supposed to avoid.
 */
const compositionPaths = () => {
  const owned = new Map();
  for (const doc of docs.filter((d) => d.type === 'compositions')) {
    for (const [name, declared] of Object.entries(doc.content?.compositions ?? {})) {
      const base = declared.endpoint?.path;
      if (!base) continue;
      owned.set(base, { name, doc: doc.relativePath });
      // A sectioned composition serves a panel per section and a progress
      // resource alongside it; both hang off the same declared path.
      for (const suffix of ['/{section}', '/{section}/{itemId}']) {
        owned.set(base + suffix, { name, doc: doc.relativePath });
      }
      const progress = base.replace(/\/[^/]+$/, '/review-progress');
      for (const suffix of ['/{section}', '/{section}/{itemId}']) {
        owned.set(progress + suffix, { name, doc: doc.relativePath });
      }
      for (const section of Object.keys(declared.sections ?? {})) {
        owned.set(`${base}/${section}`, { name, doc: doc.relativePath });
      }
    }
  }
  return owned;
};

/** The rulesets the loaded documents declare, and the examples for each. */
const rulesets = () => {
  const examples = new Map();
  for (const doc of docs.filter((d) => d.type === 'rules-examples')) {
    for (const [name, declared] of Object.entries(doc.content?.rulesets ?? {})) {
      examples.set(name, declared.examples ?? []);
    }
  }
  const found = [];
  for (const doc of docs.filter((d) => d.type === 'rules')) {
    for (const [name, declared] of Object.entries(doc.content?.rulesets ?? {})) {
      found.push({ name, ruleset: declared, doc: doc.relativePath, examples: examples.get(name) ?? [] });
    }
  }
  return found;
};

/**
 * What kind of thing an operation is.
 *
 * The affordance a reader needs differs completely between these, and the
 * contracts are what say which is which — a transition is only a transition
 * because a state machine declares an action whose endpoint this is.
 */
const classify = (op) => {
  const last = op.template.split('/').filter(Boolean).pop() ?? '';
  const act = actions().get(last);
  if (op.method === 'POST' && act) return { kind: 'transition', action: act };
  if (op.method === 'POST' && /\/evaluate-/.test(op.template)) {
    const name = last.replace(/^evaluate-/, '');
    const found = rulesets().find((r) => r.name.toLowerCase() === name.replace(/-/g, '').toLowerCase());
    return { kind: 'rules', ruleset: found ?? rulesets()[0] ?? null };
  }
  const composed = compositionPaths().get(op.template);
  if (composed) return { kind: 'composition', composition: composed };
  if (op.operation.requestBody?.content?.['multipart/form-data']) return { kind: 'upload' };
  if (/\/stream$/.test(op.template)) return { kind: 'stream' };
  if (op.template.includes('{')) return { kind: 'item' };
  return { kind: op.method === 'POST' ? 'create' : 'collection' };
};

// ── Example bodies ──────────────────────────────────────────────────────────

/** The schema an operation's JSON request body points at, dereferenced. */
const requestSchema = (op) => {
  const schema = op.operation.requestBody?.content?.['application/json']?.schema;
  return schema ? deref(schema, op.doc) : null;
};

/** A relative path, from the document at `from`: dirname, then each segment, with `..` going up. */
const resolveRelative = (from, relative) => {
  const parts = from.split('/').slice(0, -1);
  for (const segment of relative.split('/')) {
    if (segment === '..') parts.pop();
    else if (segment !== '.' && segment !== '') parts.push(segment);
  }
  return parts.join('/');
};

const deref = (node, doc, seen = 0) => {
  if (!node || typeof node !== 'object' || seen > 8) return node;
  if (typeof node.$ref !== 'string') return node;

  const [file, fragment = ''] = node.$ref.split('#');
  // Same document.
  if (file === '') {
    const target = fragment.replace(/^\//, '').split('/').reduce((at, key) => at?.[key], doc.content);
    return deref(target, doc, seen + 1);
  }

  // Another one. A relative reference resolves against the document it is
  // written in — `../../components/parameters.yaml` from
  // base/domains/communication/ is base/components/parameters.yaml. One written
  // as a URL is matched on its tail, since the set is keyed by relative path.
  const relative = !/^[a-z]+:/i.test(file) && doc.relativePath
    ? resolveRelative(doc.relativePath, file)
    : null;
  const wanted = file.replace(/^.*?([^/]+\/[^/]+\/[^/]+)$/, '$1');
  const other = docs.find((candidate) => candidate.relativePath
    && (candidate.relativePath === relative
      || (!relative && (candidate.relativePath === wanted || candidate.relativePath.endsWith(wanted)))));
  if (!other) return node;
  const target = fragment
    ? fragment.replace(/^\//, '').split('/').reduce((at, key) => at?.[key], other.content)
    : other.content;
  return deref(target, other, seen + 1);
};

/**
 * A body worth pressing Execute on.
 *
 * In descending order of how much a reader learns from it: a record the
 * contract set already ships as mock data, with the server's own fields
 * stripped; then the schema's declared example; then something built from
 * the schema, which at least gets the enums right. Typing a correct body
 * from scratch is the thing that makes an unfamiliar API exhausting.
 */
const exampleBody = (op) => {
  // An edit worth watching: add to the list a derived field counts, so the
  // count moves on the next read. A `PATCH` that changes nothing visible
  // teaches nothing.
  if (op.kind === 'edit') {
    const counted = countedArray(op);
    if (counted) return attaching(op, { [counted.field]: counted.allowed.slice(0, 2) });
  }

  // A ruleset's inputs are nested and nobody can type them from memory. The
  // contract set ships described examples for exactly this reason.
  if (op.kind === 'rules') {
    const [first] = op.ruleset?.examples ?? [];
    if (first?.inputs) return first.inputs;
    const inputs = op.ruleset?.ruleset?.inputs ?? {};
    return Object.fromEntries(
      Object.entries(inputs).map(([name, declared]) => [name, fromSchema(declared, op.doc)])
    );
  }

  const schema = requestSchema(op);
  if (!schema) return null;

  const managed = new Set(['id', 'createdAt', 'updatedAt', 'status', '_links']);
  const writable = new Set(Object.keys(collectProperties(schema, op.doc)));

  for (const data of docs.filter((d) => d.type === 'mock-data' && d.domain === op.doc.domain)) {
    for (const record of Object.values(data.content ?? {})) {
      if (!record || typeof record !== 'object') continue;
      const body = Object.fromEntries(
        Object.entries(record).filter(([key]) => writable.has(key) && !managed.has(key))
      );
      if (Object.keys(body).length > 0) return attaching(op, body);
    }
  }

  if (op.operation.requestBody?.content?.['application/json']?.example) {
    return op.operation.requestBody.content['application/json'].example;
  }
  return attaching(op, fromSchema(schema, op.doc));
};

/**
 * Fill in a foreign key the walk can already satisfy.
 *
 * A field the contract says points at something, where the walk has made
 * one of those: send its id. This is what makes a relationship visible
 * rather than described — the request carries the id of the document
 * uploaded a step ago, and the record comes back with the document in it.
 */
const attaching = (op, body) => {
  const schema = requestSchema(op);
  if (!schema) return body;
  for (const [name, property] of Object.entries(collectProperties(schema, op.doc))) {
    const relationship = property['x-relationship'];
    if (relationship?.type !== 'fk') continue;
    const id = built.get(relationship.resource);
    if (id) body[name] = id;
  }
  return body;
};

/**
 * The parts of a body that is not JSON.
 *
 * One operation in the set declares `multipart/form-data`, and a textarea
 * full of JSON is the wrong affordance for it entirely. The parts and their
 * values come off the contract the same way a JSON body does; the bytes are
 * the one thing that cannot, because no contract can carry a file and
 * nothing in a shipped artifact should.
 */
const SENT_BYTES = 'Hashed on the way in, and then thrown away.\n';

const uploadParts = (op) => {
  const declared = op.operation?.requestBody?.content?.['multipart/form-data']?.schema;
  if (!declared) return null;
  const properties = collectProperties(deref(declared, op.doc), op.doc);

  const parts = [];
  for (const [name, property] of Object.entries(properties)) {
    const resolved = deref(property, op.doc);
    if (resolved?.format === 'binary') { parts.push({ name, bytes: true }); continue; }
    parts.push({ name, value: String(resolved?.example ?? valueFor(resolved, op.doc) ?? '') });
  }

  // Named after what it is, which the contract already says: a part called
  // `title` holding "April pay stub" makes april-pay-stub.txt.
  const titled = parts.find((part) => /title|name/i.test(part.name))?.value;
  const fileName = `${(titled || 'upload').toLowerCase().replace(/[^a-z0-9]+/g, '-')}.txt`;
  for (const part of parts) if (part.bytes) part.fileName = fileName;
  return parts;
};
