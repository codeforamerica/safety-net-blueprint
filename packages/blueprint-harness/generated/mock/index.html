<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not your average Mock Server</title>
<!--
  A playground over the browser mock, rather than a tour of it.

  The page is generated from the contracts twice over: the server is, and so
  is this. Which operations exist, what kind of thing each one is, what a
  sensible body looks like, which records you can act on and which moves are
  legal from where they are — every one of those comes out of the contract
  set, which is why this can do things a generic API client cannot. Postman
  hands you a box and wishes you luck.

  Operations are grouped in dependency order, and the order is real rather
  than pedagogical: a composition needs a record to project, a transition
  needs a record already in a particular state. Resources first is not a
  teaching conceit, it is what has to happen.
-->
<style>
  :root {
    --ink: #1a1a1a; --muted: #555; --faint: #888; --line: #e2e2e2;
    --bg: #fafafa; --card: #fff; --accent: #2b6cb0; --ok: #2f7a3f; --bad: #b02b2b;
    --warm: #8a6d3b;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  /* Any `display` on a rule beats the user agent's `[hidden] { display: none }`,
     so an element given a layout and then hidden in script stays on screen.
     That has now produced two bugs — an empty bordered box, and a Next button
     offering to skip a step nobody had run. Settled here instead of per rule. */
  [hidden] { display: none !important; }
  body {
    margin: 0; padding: 0 0 5rem; background: var(--bg); color: var(--ink);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  h1 { font-size: 1.4rem; margin: 0; }
  code { font-family: var(--mono); font-size: .88em; }

  #masthead {
    max-width: 86rem; margin: 0 auto; padding: 1.6rem 1.2rem 1.1rem;
    border-bottom: 1px solid var(--line);
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2rem; align-items: start;
  }
  /* Two cells, not four rows: as separate rows the left-hand items were
     stretched to match whichever side was taller, which put a hand's width
     of nothing between the title and the text under it. */
  #masthead .intro { min-width: 0; }
  #derived {
    align-self: start;
    border: 1px solid var(--line); border-radius: 6px; background: var(--card);
    padding: .6rem .8rem; min-width: 17rem;
  }
  #derived .when {
    margin: .45rem 0 0; padding-top: .4rem; border-top: 1px solid var(--line);
    font-size: .66rem; letter-spacing: .04em; text-transform: uppercase;
    color: var(--faint); font-weight: 700;
  }
  #derived .stat {
    display: flex; gap: .4rem; align-items: baseline;
    font-size: .75rem; color: var(--muted); line-height: 1.45;
  }
  #derived .stat .n {
    font-family: var(--mono); min-width: 1.4rem; text-align: right; color: var(--ink);
  }
  #derived .stat.lead { font-size: .92rem; color: var(--ink); font-weight: 600; line-height: 1.3; }
  #derived .stat.lead .n { color: var(--accent); min-width: 1.9rem; }
  #derived .breakdown {
    display: grid; grid-template-columns: 1fr 1fr; column-gap: .9rem;
    margin-top: .45rem; padding-top: .4rem; border-top: 1px solid var(--line);
  }
  #derived .headline { margin-top: 0; padding-top: 0; border-top: 0; }
  @media (max-width: 60rem) {
    #masthead { grid-template-columns: 1fr; }
    #derived { grid-column: 1; grid-row: auto; }
  }
  .lede { color: var(--muted); margin: .4rem 0 0; max-width: 44rem; font-size: .95rem; }

  /* Throwing the whole thing away and deriving it again, which is the
     headline claim and takes about as long as a keystroke. */
  #controls { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; margin: .9rem 0 0; }
  #controls .sep { border-left: 1px solid var(--line); height: 1.4rem; margin: 0 .2rem; }
  #controls button:not(.primary) {
    font: inherit; font-size: .85rem; cursor: pointer; padding: .4rem 1rem;
    border-radius: 4px; border: 1px solid var(--line); background: var(--card); color: var(--ink);
  }
  #controls button:disabled { opacity: .4; cursor: not-allowed; }
  /* Who the reference calls as. Every request carries it, the way a real
     client's sign-in would, and the events it causes record it. */
  .caller { display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; margin: 0 0 .6rem; font-size: .85rem; color: var(--muted); }
  .caller input, .caller select { width: auto; }
  .caller .caller-id { width: 9rem; }
  .caller input.caller-roles { width: 15rem; }
  details.caller-roles { position: relative; }
  details.caller-roles summary {
    cursor: pointer; font-family: var(--mono); font-size: .8rem; padding: .4rem .5rem; min-width: 12rem;
    border: 1px solid var(--line); border-radius: 4px; background: #fcfcfc; color: var(--ink);
  }
  details.caller-roles .menu {
    position: absolute; z-index: 5; margin-top: .2rem; padding: .3rem .5rem; min-width: 100%;
    border: 1px solid var(--line); border-radius: 4px; background: var(--card); box-shadow: 0 2px 8px rgba(0,0,0,.08);
  }
  details.caller-roles .menu label { display: flex; gap: .4rem; align-items: center; padding: .15rem 0; font-family: var(--mono); font-size: .8rem; color: var(--ink); white-space: nowrap; }
  details.caller-roles .menu input { width: auto; }
  .caller .caller-id:disabled { opacity: .4; }


  #shell {
    display: grid; grid-template-columns: 17rem minmax(0, 1fr);
    gap: 2rem; max-width: 86rem; margin: 1.4rem auto 0; padding: 0 1.2rem;
  }
  #groups {
    position: sticky; top: 1rem; align-self: start;
    max-height: calc(100vh - 2rem); overflow: auto;
    border-right: 1px solid var(--line); padding-right: .8rem;
  }
  .group > summary {
    cursor: pointer; list-style: none; padding: .45rem .3rem;
    font-size: .76rem; letter-spacing: .06em; text-transform: uppercase;
    font-weight: 700; color: var(--ink);
  }
  .group > summary::-webkit-details-marker { display: none; }
  .group > summary::before { content: '▸ '; color: var(--faint); }
  .group[open] > summary::before { content: '▾ '; }
  .kind {
    margin: .5rem 0 .1rem .3rem; font-size: .68rem; letter-spacing: .05em;
    text-transform: uppercase; color: var(--faint); font-weight: 700;
  }
  .ops { list-style: none; margin: 0 0 .5rem; padding: 0; }
  .op {
    display: block; width: 100%; text-align: left; border: 0; background: none;
    font: inherit; font-size: .8rem; cursor: pointer; color: var(--muted);
    padding: .22rem .45rem; border-radius: 4px; line-height: 1.35;
  }
  .op:hover { background: #f1f4f8; color: var(--ink); }
  .op.here { background: #eef4fb; color: var(--accent); font-weight: 600; }
  .steps { counter-reset: none; }
  .op.step { padding: .34rem .45rem; font-size: .84rem; }
  .op .n {
    font-family: var(--mono); font-size: .7rem; color: var(--faint);
    display: inline-block; min-width: 1.9rem;
  }
  .op.step.here .n { color: var(--accent); }
  .panel .watch {
    margin: 1rem 0 0; padding: .8rem 1rem .9rem; font-size: .9rem; color: var(--ink);
    background: #f4f9f4; border: 1px solid #d6e8d6; border-radius: 4px; max-width: 48rem;
  }
  .watch-title {
    margin: 0 0 .5rem; font-size: .68rem; letter-spacing: .06em; text-transform: uppercase;
    font-weight: 700; color: var(--ok);
  }
  .panel .watch ul { margin: 0; padding-left: 1.1rem; }
  /* The anchor for the cards below: they span the bullet rather than hang
     off the word, so one near the right-hand edge has nowhere to overflow
     to and every card opens in the same place. */
  .panel .watch li { margin: 0 0 .45rem; line-height: 1.55; position: relative; }
  .panel .watch li:last-child { margin-bottom: 0; }
  .panel .watch code { background: #e4efe4; padding: .08em .3em; border-radius: 3px; }
  .panel .watch .ref > code {
    border-bottom: 1px dotted var(--ok); cursor: help; outline: none;
  }
  .panel .watch .ref > code:hover, .panel .watch .ref > code:focus { background: #cfe4cf; }
  .panel .watch .ref .card {
    display: none; position: absolute; left: 0; right: 0; top: calc(100% + .25rem);
    z-index: 5; background: var(--card); border: 1px solid #cfd6de; border-radius: 4px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, .13); padding: .55rem .7rem .6rem;
  }
  .panel .watch .ref:hover .card, .panel .watch .ref:focus-within .card { display: block; }
  .panel .watch .card .excerpt {
    margin: 0; background: #fcfbf7; border-color: #e6ded0; border-left: 3px solid var(--warm);
    max-height: 18rem; font-size: .73rem;
  }
  .panel .watch .card .whole {
    display: inline-block; margin: .45rem 0 0; font-family: var(--mono); font-size: .7rem;
    color: var(--accent); text-decoration: none; border-bottom: 1px dotted currentColor;
  }
  .panel .watch .card code { background: none; padding: 0; }
  .op .n.run { color: var(--ok); font-weight: 700; }
  .to-come { margin: .5rem 0 0 .45rem; font-size: .78rem; color: var(--faint); font-style: italic; }
  .row { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
  /* The other way through: dashed, because it is the alternative route and
     should not compete with the step you are being offered. */
  button.run-all {
    font: inherit; font-size: .8rem; cursor: pointer; padding: .4rem .8rem;
    border-radius: 4px; border: 1px dashed #c3cdd8; background: var(--card); color: var(--muted);
  }
  button.run-all:hover { color: var(--accent); border-color: var(--accent); border-style: solid; }
  button.run-all:disabled { opacity: .6; cursor: progress; }
  #groups button.run-all { display: block; width: 100%; margin: .7rem 0 .3rem; }
  .pager {
    display: flex; gap: .6rem; align-items: center; justify-content: space-between;
    margin-top: 1rem;
  }
  .pager .step-back {
    font: inherit; font-size: .82rem; cursor: pointer; padding: .35rem .8rem;
    border-radius: 4px; border: 1px solid var(--line); background: var(--card); color: var(--muted);
  }
  .pager .step-back:hover { color: var(--ink); border-color: #cfd6de; }
  /* Pushed right when it is the only one, so it sits where it always sits. */
  .pager .next-step { margin-left: auto; }
  .op .verb {
    font-family: var(--mono); font-size: .68rem; font-weight: 700;
    display: inline-block; min-width: 3.4rem; color: var(--faint);
  }
  .op.here .verb { color: var(--accent); }

  #stage { min-width: 0; }
  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: 6px;
    padding: 1.1rem 1.2rem; margin: 0 0 1.2rem;
  }
  .panel .kindline {
    font-size: .68rem; letter-spacing: .05em; text-transform: uppercase;
    font-weight: 700; color: var(--accent); margin: 0 0 .25rem;
  }
  .panel h2 { font-size: 1.05rem; margin: 0 0 .2rem; }
  .panel .about {
    color: var(--muted); font-size: .9rem; margin: 0 0 .8rem; padding: 0 0 .8rem;
    border-bottom: 1px solid var(--line); max-width: 46rem;
  }
  .panel .path { font-family: var(--mono); font-size: .82rem; color: var(--accent); margin: 0 0 .7rem; }
  .panel .note { color: var(--muted); font-size: .9rem; margin: 0 0 .9rem; max-width: 46rem; }
  .panel ul.note { padding-left: 1.1rem; }
  .panel ul.note li { margin: 0 0 .25rem; }
  .panel .cited { font-family: var(--mono); font-size: .74rem; color: var(--faint); margin: 0 0 .9rem; }
  .panel .cited code { background: #eef2f6; color: var(--ink); padding: .08em .3em; border-radius: 3px; }
  .panel .cited a { color: var(--accent); text-decoration: none; border-bottom: 1px dotted currentColor; }
  .panel .cited a:hover { border-bottom-style: solid; }

  label.field { display: block; margin: 0 0 .7rem; font-size: .82rem; color: var(--muted); }
  label.field > span { display: block; margin-bottom: .22rem; }
  .shape { margin: .9rem 0 .25rem; }
  .shape > summary {
    cursor: pointer; list-style: none;
    font-family: var(--mono); font-size: .74rem; color: var(--faint);
  }
  .shape > summary::-webkit-details-marker { display: none; }
  .shape > summary::before { content: '▸ '; }
  .shape[open] > summary::before { content: '▾ '; }
  .shape > summary:hover { color: var(--accent); }
  .shape code { background: #eef2f6; color: var(--ink); padding: .08em .3em; border-radius: 3px; }
  .shape .excerpt {
    margin: .4rem 0 0; background: #fcfbf7; border-color: #e6ded0; border-left: 3px solid var(--warm);
    max-height: 22rem; font-size: .74rem;
  }
  .shape .whole {
    display: inline-block; margin: .4rem 0 0; font-family: var(--mono); font-size: .72rem;
    color: var(--accent); text-decoration: none; border-bottom: 1px dotted currentColor;
  }
  label.field .shape { margin-top: 0; }
  label.field code { background: #eef2f6; padding: .08em .3em; border-radius: 3px; }
  label.field a { color: var(--accent); text-decoration: none; border-bottom: 1px dotted currentColor; }
  input[type=text], select, textarea {
    width: 100%; font-family: var(--mono); font-size: .8rem; padding: .4rem .5rem;
    border: 1px solid var(--line); border-radius: 4px; background: #fcfcfc; color: var(--ink);
  }
  textarea { min-height: 9rem; resize: vertical; line-height: 1.5; }
  textarea.fixed { background: #f3f3f3; color: var(--muted); cursor: default; }
  /* The parts of a body that is not JSON, listed rather than serialized:
     there is no text form of a multipart request worth showing anybody. */
  pre.parts { background: #f3f3f3; border-color: var(--line); color: var(--muted); }
  input[type=file] { font: inherit; font-size: .8rem; color: var(--muted); }

  button.primary {
    font: inherit; font-size: .85rem; cursor: pointer; padding: .4rem 1rem;
    border-radius: 4px; border: 1px solid var(--accent); background: var(--accent); color: #fff;
  }
  button.primary:disabled { opacity: .45; cursor: not-allowed; }
  button.primary:disabled[data-done] { opacity: .6; }

  pre {
    margin: .8rem 0 0; padding: .7rem .8rem; max-height: 26rem; overflow: auto;
    background: #f7f9fc; border: 1px solid #dbe4f0; border-radius: 4px;
    font-family: var(--mono); font-size: .76rem; line-height: 1.5; white-space: pre-wrap;
  }
  pre .label {
    display: block; font-family: inherit; font-size: .68rem; letter-spacing: .04em;
    text-transform: uppercase; color: var(--accent); margin-bottom: .35rem; font-weight: 600;
  }
  pre .label code { font-family: var(--mono); text-transform: none; letter-spacing: 0; }
  pre .label a { color: inherit; text-transform: none; letter-spacing: 0; border-bottom: 1px dotted currentColor; text-decoration: none; }
  pre.bad { background: #fdf6f6; border-color: #eccfcf; }
  /* A scenario's steps: what each called, what came back, what it checked. */
  .tour-picker { display: block; margin: 0 0 .8rem; }
  .tour-picker span { display: block; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: .25rem; }
  .tour-picker select { width: 100%; }
  ul.checks { list-style: none; padding: 0; margin: .5rem 0 0; font-family: var(--mono); font-size: .78rem; }
  ul.checks .passed { color: var(--ok); }
  ul.checks .failed { color: var(--bad); }
  pre.bad .label { color: var(--bad); }

  .empty { color: var(--faint); font-size: .9rem; }
  @media (max-width: 60rem) {
    #shell { grid-template-columns: 1fr; }
    #groups { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header id="masthead">
  <div class="intro">
    <h1>Not your average Mock Server</h1>
    <p class="lede">
      An entire server, generated from a set of contracts, running in this tab.
      <b>No custom code.</b> Everything is derived on the fly when the server
      boots, so what you see here is what these contracts say, and nothing
      else.
    </p>
    <div id="controls">
      <button id="mode" class="primary">Let me explore</button>
      <span class="sep"></span>
      <button id="reseed">Restart with data</button>
      <button id="empty">Start empty</button>
    </div>
  </div>
  <div id="derived">starting…</div>
</header>

<div id="shell">
  <nav id="groups" aria-label="Operations"></nav>
  <main id="stage"></main>
</div>

<script type="application/json" id="page-config">{"sourceUrl":"https://github.com/codeforamerica/safety-net-blueprint/blob/main/packages/blueprint-harness/contracts","firstTour":"scenarios/application-walkthrough.arazzo.yaml"}</script>
<script type="module">
const { createMockServer, extract, generate, startScenario, operationIndex, controlOperations } =
  globalThis.BlueprintMock ?? await import('./mock.js');

const $ = (id) => document.getElementById(id);
const el = (tag, text = '', className = '') => {
  const node = document.createElement(tag);
  if (text !== '') node.textContent = text;
  if (className) node.className = className;
  return node;
};

/** Everything below the directory this page is served from. */
const basePath = location.pathname.replace(/\/[^/]*$/, '');

/** Where this checkout's contracts are browsable, if the build knew. */
const pageConfig = (() => {
  const tag = document.getElementById('page-config');
  try { return tag ? JSON.parse(tag.textContent) : {}; } catch { return {}; }
})();

let docs;          // every document in the set
let mock;          // the server derived from them
let seeded = true; // whether the last derive loaded the shipped records
let showAll = false;  // the walk-through, or the whole reference
// What Show me around is showing: the application walk-through, or one of the
// contract set's Arazzo scenarios by path — which step of it, and what its
// last run answered, by workflow and step.
let tour = null;
let tourStep = null;
let tourRunner = null;          // the run in progress, a step at a time on this server
const tourResults = new Map();  // workflow/step → what it answered
let tourWhole = false;          // the whole tour on one page, rather than a step at a time
const made = new Map();  // collection → the id the walk created there
const built = new Map(); // schema name → the id the walk created of that shape
const answers = new Map(); // step → what it answered, so going back shows it
let selected = null;
// The reference's domain groups the reader has opened. The navigation is
// rebuilt on every click, and rebuilding from scratch used to collapse every
// group but the first — so picking an operation closed the one you were in.
let openDomains = null;
// What the reader picked for each path parameter, by operation and name, so a
// panel redrawn after a pick keeps it — and the parameters after it list the
// records under what was picked.
const chosen = new Map();

/**
 * The contract set, inlined by the single-file build or fetched beside the
 * page when it is served.
 */
const loadContracts = async () => {
  const inlined = document.getElementById('contracts-data');
  if (inlined) return JSON.parse(inlined.textContent);
  const response = await fetch('./contracts.json');
  if (!response.ok) throw new Error(`contracts.json: ${response.status}`);
  return response.json();
};

// Who the reference calls as, chosen above each request. The walk always
// calls as itself, so a choice made while exploring cannot break a step.
const WALK_CALLER = 'the-explorer';
const caller = { id: WALK_CALLER, type: 'user', roles: [] };

/**
 * The caller headers a request carries.
 *
 * The mock reads the kind of actor from the roles, so a kind other than
 * `user` goes in as one; an unauthenticated caller sends no identity at all.
 * A real deployment takes all of this from the sign-in token instead.
 */
const callerHeaders = () => {
  if (!showAll) return { 'X-Caller-Id': WALK_CALLER };
  const id = caller.id.trim();
  if (caller.type === 'unauthenticated' || !id) return {};
  const roles = caller.roles.filter((role) => role !== caller.type);
  if (caller.type !== 'user') roles.unshift(caller.type);
  return { 'X-Caller-Id': id, ...(roles.length ? { 'X-Caller-Roles': roles.join(',') } : {}) };
};

/** The kinds of actor an event can record, as the events contract lists them. */
const actorTypes = () => {
  const schema = docs.find((doc) => doc.type === 'schema' && doc.content?.$defs?.Event);
  const parts = schema?.content.$defs.Event.allOf ?? [];
  const authtype = parts.map((part) => part.properties?.authtype).find(Boolean);
  return (authtype?.enum ?? ['user']).filter((value) => value !== null);
};

/**
 * The roles a caller can hold: the set's RoleType, which its guards are
 * validated against. Empty when the set declares none.
 */
const roleTypes = () => {
  const schema = docs.find((doc) => Array.isArray(doc.content?.$defs?.RoleType?.enum));
  return schema?.content.$defs.RoleType.enum ?? [];
};

/**
 * Whether an operation takes an Idempotency-Key header — the shared
 * IdempotencyKeyParam, which an operation lists to require one per create.
 */
const takesIdempotencyKey = (op) => (op.operation?.parameters ?? [])
  .map((parameter) => deref(parameter, op.doc))
  .some((p) => p?.in === 'header' && typeof p.name === 'string' && p.name.toLowerCase() === 'idempotency-key');

/** The headers a step sends besides the caller's: a fresh key, where the operation takes one. */
const keyHeaders = (op, key = crypto.randomUUID()) =>
  takesIdempotencyKey(op) ? { 'Idempotency-Key': key } : {};

/**
 * The Idempotency-Key row: a fresh key each time the panel opens, which the
 * reader can type over — `12345` twice is how to see a retry answered with
 * the same entry, and `12345` with a different body how to see it refused.
 */
const idempotencyRow = () => {
  const row = el('div', '', 'caller');
  const box = el('input', '', 'caller-id');
  box.type = 'text';
  box.value = crypto.randomUUID();
  box.setAttribute('aria-label', 'Idempotency-Key');
  row.append(document.createTextNode('Idempotency-Key'), box);
  return { row, value: () => box.value.trim() };
};

/** The "Calling as" row: an id, a kind of actor, and roles. */
const callerRow = () => {
  const row = el('div', '', 'caller');
  const id = el('input', '', 'caller-id');
  id.type = 'text';
  id.value = caller.id;
  id.setAttribute('aria-label', 'Caller id');
  id.oninput = () => { caller.id = id.value; };

  const type = el('select', '', 'caller-type');
  type.setAttribute('aria-label', 'Caller type');
  type.append(...actorTypes().map((kind) => el('option', kind)));
  type.value = caller.type;
  id.disabled = caller.type === 'unauthenticated';
  type.onchange = () => { caller.type = type.value; id.disabled = type.value === 'unauthenticated'; };

  // A dropdown of the declared roles, any number checked; a box to type them
  // into for a set that declares none.
  let roles;
  const declared = roleTypes();
  if (declared.length > 0) {
    roles = el('details', '', 'caller-roles');
    const summary = el('summary');
    const label = () => { summary.textContent = caller.roles.length ? caller.roles.join(', ') : 'no roles'; };
    roles.append(summary);
    const list = el('div', '', 'menu');
    for (const role of declared) {
      const option = el('label');
      const box = el('input');
      box.type = 'checkbox';
      box.checked = caller.roles.includes(role);
      box.onchange = () => {
        caller.roles = declared.filter((name) => name === role ? box.checked : caller.roles.includes(name));
        label();
      };
      option.append(box, document.createTextNode(role));
      list.append(option);
    }
    roles.append(list);
    label();
  } else {
    roles = el('input', '', 'caller-roles');
    roles.type = 'text';
    roles.value = caller.roles.join(', ');
    roles.placeholder = 'roles, comma-separated';
    roles.oninput = () => { caller.roles = roles.value.split(',').map((role) => role.trim()).filter(Boolean); };
  }
  roles.setAttribute('aria-label', 'Caller roles');

  row.append(document.createTextNode('Calling as'), id, type, roles);
  return row;
};

const call = async (method, path, body, headers = {}) => {
  const init = { method, headers: { ...callerHeaders(), ...headers } };
  if (body instanceof FormData) {
    init.body = body;
  } else if (body !== undefined) {
    init.headers['content-type'] = 'application/json';
    init.body = typeof body === 'string' ? body : JSON.stringify(body);
  }
  const response = await mock.fetch(new Request(new URL(basePath + path, location.origin), init));
  const text = await response.text();
  let parsed;
  try { parsed = JSON.parse(text); } catch { parsed = text; }
  return { status: response.status, statusText: response.statusText, body: parsed };
};

// ── Reading the contracts ───────────────────────────────────────────────────

const openapiDocs = () => docs.filter((doc) => doc.type === 'openapi');

/** The server prefix an OpenAPI document's paths hang off. */
const prefixOf = (doc) => {
  const [server] = doc.content?.servers ?? [];
  if (!server?.url) return '';
  try { return new URL(server.url).pathname.replace(/\/$/, ''); } catch { return server.url; }
};

/**
 * Every operation the loaded documents declare, with where it came from.
 *
 * Read off the documents rather than the server's route table: the table
 * registers four extra methods on a read-only projection purely so they can
 * answer 405, and offering those is offering four ways to be told no.
 */
const operations = () => {
  const found = [];
  for (const doc of openapiDocs()) {
    const prefix = prefixOf(doc);
    for (const [declared, item] of Object.entries(doc.content?.paths ?? {})) {
      for (const [method, operation] of Object.entries(item ?? {})) {
        if (!/^(get|post|put|patch|delete)$/.test(method)) continue;
        found.push({
          method: method.toUpperCase(),
          path: prefix + declared,
          template: declared,
          operation,
          doc,
          domain: doc.domain ?? doc.content?.info?.['x-domain'] ?? 'other',
          summary: operation.summary ?? operation.operationId ?? `${method.toUpperCase()} ${declared}`,
        });
      }
    }
  }
  return found;
};

/** The state machine actions the loaded documents declare, by endpoint path. */
const actions = () => {
  const byPath = new Map();
  for (const doc of docs.filter((d) => d.type === 'state-machine')) {
    for (const machine of doc.content?.machines ?? []) {
      for (const action of machine.actions ?? []) {
        const from = action.transition?.from;
        byPath.set(action.id, {
          id: action.id,
          object: machine.object,
          from: Array.isArray(from) ? from : String(from ?? '').split(',').map((s) => s.trim()),
          to: action.transition?.to,
          // What the move does on the way through, which is how one
          // transition differs from the next. Without these every move in a
          // lifecycle has the same thing said about it.
          steps: action.steps ?? [],
          doc: doc.relativePath,
        });
      }
    }
  }
  return byPath;
};

/**
 * The paths every declared composition owns, including the ones it generates
 * beneath itself — section panels and the per-section review state.
 *
 * Without this they classify as ordinary item routes, and nineteen of them
 * pile into Resources, which is both wrong and the exact overwhelm this page
 * is supposed to avoid.
 */
const compositionPaths = () => {
  const owned = new Map();
  for (const doc of docs.filter((d) => d.type === 'compositions')) {
    for (const [name, declared] of Object.entries(doc.content?.compositions ?? {})) {
      const base = declared.endpoint?.path;
      if (!base) continue;
      owned.set(base, { name, doc: doc.relativePath });
      // A sectioned composition serves a panel per section and a progress
      // resource alongside it; both hang off the same declared path.
      for (const suffix of ['/{section}', '/{section}/{itemId}']) {
        owned.set(base + suffix, { name, doc: doc.relativePath });
      }
      const progress = base.replace(/\/[^/]+$/, '/review-progress');
      for (const suffix of ['/{section}', '/{section}/{itemId}']) {
        owned.set(progress + suffix, { name, doc: doc.relativePath });
      }
      for (const section of Object.keys(declared.sections ?? {})) {
        owned.set(`${base}/${section}`, { name, doc: doc.relativePath });
      }
    }
  }
  return owned;
};

/** The rulesets the loaded documents declare, and the examples for each. */
const rulesets = () => {
  const examples = new Map();
  for (const doc of docs.filter((d) => d.type === 'rules-examples')) {
    for (const [name, declared] of Object.entries(doc.content?.rulesets ?? {})) {
      examples.set(name, declared.examples ?? []);
    }
  }
  const found = [];
  for (const doc of docs.filter((d) => d.type === 'rules')) {
    for (const [name, declared] of Object.entries(doc.content?.rulesets ?? {})) {
      found.push({ name, ruleset: declared, doc: doc.relativePath, examples: examples.get(name) ?? [] });
    }
  }
  return found;
};

/**
 * What kind of thing an operation is.
 *
 * The affordance a reader needs differs completely between these, and the
 * contracts are what say which is which — a transition is only a transition
 * because a state machine declares an action whose endpoint this is.
 */
const classify = (op) => {
  const last = op.template.split('/').filter(Boolean).pop() ?? '';
  const act = actions().get(last);
  if (op.method === 'POST' && act) return { kind: 'transition', action: act };
  if (op.method === 'POST' && /\/evaluate-/.test(op.template)) {
    const name = last.replace(/^evaluate-/, '');
    const found = rulesets().find((r) => r.name.toLowerCase() === name.replace(/-/g, '').toLowerCase());
    return { kind: 'rules', ruleset: found ?? rulesets()[0] ?? null };
  }
  const composed = compositionPaths().get(op.template);
  if (composed) return { kind: 'composition', composition: composed };
  if (op.operation.requestBody?.content?.['multipart/form-data']) return { kind: 'upload' };
  if (/\/stream$/.test(op.template)) return { kind: 'stream' };
  if (op.template.includes('{')) return { kind: 'item' };
  return { kind: op.method === 'POST' ? 'create' : 'collection' };
};

// ── Example bodies ──────────────────────────────────────────────────────────

/** The schema an operation's JSON request body points at, dereferenced. */
const requestSchema = (op) => {
  const schema = op.operation.requestBody?.content?.['application/json']?.schema;
  return schema ? deref(schema, op.doc) : null;
};

/** A relative path, from the document at `from`: dirname, then each segment, with `..` going up. */
const resolveRelative = (from, relative) => {
  const parts = from.split('/').slice(0, -1);
  for (const segment of relative.split('/')) {
    if (segment === '..') parts.pop();
    else if (segment !== '.' && segment !== '') parts.push(segment);
  }
  return parts.join('/');
};

const deref = (node, doc, seen = 0) => {
  if (!node || typeof node !== 'object' || seen > 8) return node;
  if (typeof node.$ref !== 'string') return node;

  const [file, fragment = ''] = node.$ref.split('#');
  // Same document.
  if (file === '') {
    const target = fragment.replace(/^\//, '').split('/').reduce((at, key) => at?.[key], doc.content);
    return deref(target, doc, seen + 1);
  }

  // Another one. A relative reference resolves against the document it is
  // written in — `../../components/parameters.yaml` from
  // base/domains/transcription/ is base/components/parameters.yaml. One written
  // as a URL is matched on its tail, since the set is keyed by relative path.
  const relative = !/^[a-z]+:/i.test(file) && doc.relativePath
    ? resolveRelative(doc.relativePath, file)
    : null;
  const wanted = file.replace(/^.*?([^/]+\/[^/]+\/[^/]+)$/, '$1');
  const other = docs.find((candidate) => candidate.relativePath
    && (candidate.relativePath === relative
      || (!relative && (candidate.relativePath === wanted || candidate.relativePath.endsWith(wanted)))));
  if (!other) return node;
  const target = fragment
    ? fragment.replace(/^\//, '').split('/').reduce((at, key) => at?.[key], other.content)
    : other.content;
  return deref(target, other, seen + 1);
};

/**
 * A body worth pressing Execute on.
 *
 * In descending order of how much a reader learns from it: a record the
 * contract set already ships as mock data, with the server's own fields
 * stripped; then the schema's declared example; then something built from
 * the schema, which at least gets the enums right. Typing a correct body
 * from scratch is the thing that makes an unfamiliar API exhausting.
 */
const exampleBody = (op) => {
  // An edit worth watching: add to the list a derived field counts, so the
  // count moves on the next read. A `PATCH` that changes nothing visible
  // teaches nothing.
  if (op.kind === 'edit') {
    const counted = countedArray(op);
    if (counted) return attaching(op, { [counted.field]: counted.allowed.slice(0, 2) });
  }

  // A ruleset's inputs are nested and nobody can type them from memory. The
  // contract set ships described examples for exactly this reason.
  if (op.kind === 'rules') {
    const [first] = op.ruleset?.examples ?? [];
    if (first?.inputs) return first.inputs;
    const inputs = op.ruleset?.ruleset?.inputs ?? {};
    return Object.fromEntries(
      Object.entries(inputs).map(([name, declared]) => [name, fromSchema(declared, op.doc)])
    );
  }

  const schema = requestSchema(op);
  if (!schema) return null;

  const managed = new Set(['id', 'createdAt', 'updatedAt', 'status', '_links']);
  const writable = new Set(Object.keys(collectProperties(schema, op.doc)));

  for (const data of docs.filter((d) => d.type === 'mock-data' && d.domain === op.doc.domain)) {
    for (const record of Object.values(data.content ?? {})) {
      if (!record || typeof record !== 'object') continue;
      const body = Object.fromEntries(
        Object.entries(record).filter(([key]) => writable.has(key) && !managed.has(key))
      );
      if (Object.keys(body).length > 0) return attaching(op, body);
    }
  }

  if (op.operation.requestBody?.content?.['application/json']?.example) {
    return op.operation.requestBody.content['application/json'].example;
  }
  return attaching(op, fromSchema(schema, op.doc));
};

/**
 * Fill in a foreign key the walk can already satisfy.
 *
 * A field the contract says points at something, where the walk has made
 * one of those: send its id. This is what makes a relationship visible
 * rather than described — the request carries the id of the document
 * uploaded a step ago, and the record comes back with the document in it.
 */
const attaching = (op, body) => {
  const schema = requestSchema(op);
  if (!schema) return body;
  for (const [name, property] of Object.entries(collectProperties(schema, op.doc))) {
    const relationship = property['x-relationship'];
    if (relationship?.type !== 'fk') continue;
    const id = built.get(relationship.resource);
    if (id) body[name] = id;
  }
  return body;
};

/**
 * The parts of a body that is not JSON.
 *
 * One operation in the set declares `multipart/form-data`, and a textarea
 * full of JSON is the wrong affordance for it entirely. The parts and their
 * values come off the contract the same way a JSON body does; the bytes are
 * the one thing that cannot, because no contract can carry a file and
 * nothing in a shipped artifact should.
 */
const SENT_BYTES = 'Hashed on the way in, and then thrown away.\n';

const uploadParts = (op) => {
  const declared = op.operation?.requestBody?.content?.['multipart/form-data']?.schema;
  if (!declared) return null;
  const properties = collectProperties(deref(declared, op.doc), op.doc);

  const parts = [];
  for (const [name, property] of Object.entries(properties)) {
    const resolved = deref(property, op.doc);
    if (resolved?.format === 'binary') { parts.push({ name, bytes: true }); continue; }
    parts.push({ name, value: String(resolved?.example ?? valueFor(resolved, op.doc) ?? '') });
  }

  // Named after what it is, which the contract already says: a part called
  // `title` holding "April pay stub" makes april-pay-stub.txt.
  const titled = parts.find((part) => /title|name/i.test(part.name))?.value;
  const fileName = `${(titled || 'upload').toLowerCase().replace(/[^a-z0-9]+/g, '-')}.txt`;
  for (const part of parts) if (part.bytes) part.fileName = fileName;
  return parts;
};

/** What `uploadParts` describes, as something `fetch` can send. */
const asFormData = (parts) => {
  const form = new FormData();
  for (const part of parts) {
    if (part.bytes) form.append(part.name, part.file ?? new File([SENT_BYTES], part.fileName, { type: 'text/plain' }));
    else form.append(part.name, part.value);
  }
  return form;
};

/** Every property on a schema, following allOf. */
const collectProperties = (schema, doc) => {
  const out = {};
  for (const part of [schema, ...(schema?.allOf ?? [])]) {
    const resolved = deref(part, doc);
    Object.assign(out, resolved?.properties ?? {});
    for (const inner of resolved?.allOf ?? []) {
      Object.assign(out, deref(inner, doc)?.properties ?? {});
    }
  }
  return out;
};

/** A plausible value for each required property, taking enums seriously. */
const fromSchema = (schema, doc) => {
  // One of several shapes — a line or a gap — is shown as the first.
  const resolved = deref(schema, doc);
  if (Array.isArray(resolved?.oneOf) && resolved.oneOf.length > 0) return fromSchema(deref(resolved.oneOf[0], doc), doc);
  const properties = collectProperties(schema, doc);
  const required = new Set([
    ...(schema?.required ?? []),
    ...(schema?.allOf ?? []).flatMap((part) => deref(part, doc)?.required ?? []),
  ]);
  const body = {};
  for (const [name, declared] of Object.entries(properties)) {
    if (!required.has(name)) continue;
    body[name] = valueFor(deref(declared, doc), doc);
  }
  return Object.keys(body).length > 0 ? body : {};
};

const valueFor = (declared, doc) => {
  if (!declared) return null;
  if ('const' in declared) return declared.const;
  if (Array.isArray(declared.enum)) return declared.enum[0];
  switch (declared.type) {
    case 'integer': case 'number': return 0;
    case 'boolean': return false;
    case 'array': {
      const items = deref(declared.items, doc);
      return items ? [valueFor(items, doc)] : [];
    }
    case 'object': return fromSchema(declared, doc);
    default:
      if (declared.format === 'date-time') return new Date().toISOString();
      return declared.minLength > 0 ? 'example' : '';
  }
};

// ── Records, for the pickers ────────────────────────────────────────────────

/** The collection an item or transition path hangs off. */
const collectionOf = (op) => op.path.slice(0, op.path.indexOf('/{'));

/** What the server is holding in a collection, for a picker to offer. */
const recordsIn = async (path) => {
  const answered = await call('GET', `${path}?limit=50`);
  return Array.isArray(answered.body?.items) ? answered.body.items : [];
};

// ── Boot ────────────────────────────────────────────────────────────────────

/**
 * Throw the server away and derive it again from the documents.
 *
 * Not a reset of the data — a rebuild of the system. The route table, the
 * validators, the state machines and the rules are all produced again from
 * the contract set, and the time it takes is printed because it is the
 * claim: an entire backend, in about as long as a keystroke.
 */
const derive = async ({ seed = true, artifact } = {}) => {
  $('derived').textContent = 'deriving…';
  const started = performance.now();

  const set = artifact ?? contracts;
  docs = extract(set, 'docs');
  mock = await createMockServer({ contracts: set, basePath, seed });
  seeded = seed;

  const ms = Math.round(performance.now() - started);

  // What went in, named by kind.
  //
  // A raw file count is a vague answer and a third of it is shared schema
  // fragments that exist to be $ref'd. Those are not contracts and are not
  // worth a reader's attention, so they are not counted here: every number
  // below is something that declares behavior.
  const kinds = new Map();
  for (const doc of docs) kinds.set(doc.type, (kinds.get(doc.type) ?? 0) + 1);
  const CONTRACTS = [
    ['openapi', 'API', 'APIs'],
    ['state-machine', 'state machine', 'state machines'],
    ['rules', 'ruleset', 'rulesets'],
    ['compositions', 'composition', 'compositions'],
    ['asyncapi', 'event catalog', 'event catalogs'],
    ['annotations', 'annotation set', 'annotation sets'],
    ['registry', 'registry', 'registries'],
    ['sla-types', 'SLA definition', 'SLA definitions'],
  ];
  const counted = CONTRACTS
    .filter(([type]) => kinds.get(type))
    .map(([type, one, many]) => `${kinds.get(type)} ${kinds.get(type) === 1 ? one : many}`);
  const total = CONTRACTS.reduce((n, [type]) => n + (kinds.get(type) ?? 0), 0);

  // What seeding actually put there: example records the contract set
  // declares and validates against its own schemas, not production data.
  const examples = docs
    .filter((doc) => doc.type === 'mock-data')
    .reduce((n, doc) => n + Object.keys(doc.content ?? {}).length, 0);

  // Stacked, beside the title rather than under it. As a sentence this ran
  // to two wrapped lines of the one thing on the page nobody needs to read
  // twice; as a column it is scannable and costs no vertical space at all.
  const stat = (count, label, className = '') => {
    const row = el('div', '', `stat ${className}`.trim());
    row.append(el('span', String(count), 'n'), el('span', label));
    return row;
  };

  // Two columns for the breakdown. One per line was eleven rows deep and
  // made the masthead taller than it had been as a sentence, which is the
  // opposite of the point.
  const breakdown = el('div', '', 'breakdown');
  for (const [type, one, many] of CONTRACTS) {
    const count = kinds.get(type);
    if (count) breakdown.append(stat(count, count === 1 ? one : many));
  }

  // Side by side, on the same grid as the breakdown under them: what went
  // in and what came out, read left to right.
  const headline = el('div', '', 'breakdown headline');
  headline.append(stat(total, 'contracts', 'lead'), stat(mock.routes.size, 'routes', 'lead'));

  $('derived').replaceChildren(
    headline,
    breakdown,
    el('p', `derived in ${ms} ms · ${seed ? `${examples} examples seeded` : 'started empty'}`, 'when')
  );

  // The system is new, so nothing the walk did to the old one still holds:
  // the records it made are gone with the store that held them.
  selected = null;
  resetTour();
  answers.clear();
  renderGroups();
  renderStage();
};

// ── The groups ──────────────────────────────────────────────────────────────

/**
 * Operations in dependency order, which is the order a reader has to meet
 * them in: a composition needs a record to project, a transition needs a
 * record already in a particular state.
 */
const GROUPS = [
  {
    id: 'resources',
    title: 'Resources',
    about: 'Create, read, search and change records. The part of an API everyone already knows.',
    holds: (kind) => ['collection', 'create', 'item', 'upload'].includes(kind),
  },
  {
    id: 'compositions',
    title: 'Compositions',
    about: 'A shape nothing stores, assembled on read from wherever the pieces live.',
    holds: (kind) => kind === 'composition',
  },
  {
    id: 'behavior',
    title: 'Behavior',
    about: 'Not fields you set — moves the contract allows, and only from where it says.',
    holds: (kind) => kind === 'transition',
  },
  {
    id: 'rules',
    title: 'Rules',
    about: 'Policy the system evaluates, with the thresholds declared as inputs.',
    holds: (kind) => kind === 'rules',
  },
  {
    id: 'control',
    title: 'The mock itself',
    about: 'The only endpoints here that no contract declares. They belong to the harness, not to the system it is running — resetting it, reseeding it, and standing in for whatever has not been built.',
    holds: (kind) => kind === 'control' || kind === 'stub',
  },
];


/**
 * What identifies a step, for remembering it has been run.
 *
 * The walk visits one operation twice — the event log whole, then narrowed
 * — so the method and path alone do not tell two steps apart. The variant
 * does, and unlike the query string it does not change as the walk fills
 * in the record it is following.
 */
const keyOf = (op) => `${op.method} ${op.path}${op.variant ? ` (${op.variant})` : ''}`;

/**
 * Print a contract node the way it was authored.
 *
 * The artifact is parsed data, so there is no original text to quote — this
 * renders the node back to YAML. Only the shapes contracts actually use are
 * handled, which is the whole point: it is here to show four lines of a state
 * machine, not to be a serializer.
 */
const asYaml = (node, indent = 0) => {
  const pad = '  '.repeat(indent);
  if (node === null || node === undefined) return 'null';
  if (Array.isArray(node)) {
    if (node.every((v) => v === null || typeof v !== 'object')) return `[${node.join(', ')}]`;
    return '\n' + node.map((v) => `${pad}- ${asYaml(v, indent + 1).replace(/^\n/, '').trimStart()}`).join('\n');
  }
  if (typeof node === 'object') {
    const entries = Object.entries(node).filter(([, v]) => v !== undefined);
    if (entries.length === 0) return '{}';
    return '\n' + entries
      .map(([k, v]) => {
        const printed = asYaml(v, indent + 1);
        return printed.startsWith('\n')
          ? `${pad}${k}:${printed}`
          : `${pad}${k}: ${printed}`;
      })
      .join('\n');
  }
  if (typeof node === 'string' && (node === '' || /[:#]/.test(node))) return JSON.stringify(node);
  return String(node);
};

/**
 * Strip what the step does not talk about.
 *
 * Every contract node carries a `description`, and no step narrates one — the
 * step has its own prose for that, and the excerpt is there to show structure.
 * Leaving them in buries the two lines that matter under paragraphs nobody
 * reads at that moment.
 */
const essential = (node) => {
  if (Array.isArray(node)) return node.map(essential);
  if (node === null || typeof node !== 'object') return node;
  return Object.fromEntries(
    Object.entries(node)
      .filter(([key]) => key !== 'description')
      .map(([key, value]) => [key, essential(value)])
  );
};

/** A path with its parameters filled in, or left as written where they are not. */
const withParams = (path, params) => Object.entries(params).reduce(
  (at, [name, value]) => (value ? at.replace(`{${name}}`, encodeURIComponent(value)) : at),
  path
);







/**
 * The array a derived field counts, and the values its contract allows.
 *
 * `programCount` is `$this.programsAppliedFor.size()`, so the way to show
 * that it is computed rather than stored is to change the list and read the
 * count back. Which list, and what may go in it, both come out of the
 * contract rather than being named here.
 */
const countedArray = (op) => {
  const schema = responseSchema(op);
  if (!schema) return null;
  const props = collectProperties(schema, op.doc);
  for (const [name, declared] of Object.entries(props)) {
    const expression = deref(declared, op.doc)?.['x-derived'];
    const counts = typeof expression === 'string' && expression.match(/\$this\.(\w+)\.size\(\)/);
    if (!counts) continue;
    const field = deref(props[counts[1]], op.doc);
    const allowed = deref(field?.items, op.doc)?.enum;
    if (Array.isArray(allowed) && allowed.length > 1) {
      return { derived: name, field: counts[1], allowed, expression };
    }
  }
  return null;
};

/** The schema an operation answers with, dereferenced. */
const responseSchema = (op) => {
  const answers = op.operation.responses ?? {};
  const ok = answers['200'] ?? answers['201'] ?? answers['202'];
  let schema = ok?.content?.['application/json']?.schema;
  schema = schema ? deref(schema, op.doc) : null;
  // A collection answers with an envelope; the interesting shape is inside.
  const items = schema?.properties?.items;
  return items ? deref(deref(items, op.doc).items, op.doc) : schema;
};


/** The name a schema is declared under, from a `$ref`. */
const refName = (node) => (typeof node?.$ref === 'string' ? node.$ref.split('/').pop() : null);



/**
 * A deadline a move asks somebody else to keep.
 *
 * An action that calls a procedure with a `callback` is asking for a timer:
 * wake me in N hours and send this event. Nothing in the contract set
 * implements a scheduler, which is the whole point — in a deployment one
 * answers, and here a stub does, which is what makes a 72-hour deadline
 * something you can watch happen.
 */
const timerRequest = () => {
  const procedures = new Map();
  for (const doc of docs.filter((d) => d.type === 'state-machine')) {
    for (const procedure of doc.content?.procedures ?? []) procedures.set(procedure.id, procedure);
  }
  for (const doc of docs.filter((d) => d.type === 'state-machine')) {
    for (const machine of doc.content?.machines ?? []) {
      for (const action of machine.actions ?? []) {
        for (const step of action.steps ?? []) {
          const asks = step.call && step.with?.callback;
          if (!asks) continue;
          const emits = procedures.get(step.call)?.emit?.type;
          if (!emits) continue;
          const after = step.with.fireAfter;
          return {
            on: emits,
            action: action.id,
            callback: step.with.callback.event ?? step.with.callback,
            after: after ? `${after.amount} ${after.unit}` : null,
          };
        }
      }
    }
  }
  return null;
};

/** Registering the stand-in that answers it, as a step. */
const stubStep = () => {
  const timer = timerRequest();
  if (!timer || !mock.routes.has('POST /mock/stubs/events')) return [];
  return [{
    method: 'POST',
    path: '/mock/stubs/events',
    template: '/mock/stubs/events',
    operation: {},
    domain: 'the mock itself',
    kind: 'stub',
    timer,
    step: 'Stand in for the scheduler',
    summary: 'Register an event stub',
    body: { on: timer.on },
  }];
};

/**
 * The mock's own controls, as steps.
 *
 * They are endpoints like any other and a reader will want to know they
 * exist, but they are not derived from anything: the distinction between
 * the system and the harness around it is worth drawing rather than hiding.
 */
const controlSteps = () => [
  {
    path: '/mock/reset',
    step: 'Empty the store',
    summary: 'Reset',
    says: 'It clears records, never contracts — afterwards the API is exactly the API it was.',
  },
  {
    path: '/mock/reseed',
    step: 'Put the data back',
    summary: 'Reseed',
    says: 'The records come from the contract set\'s own `*-mock-data.yaml`, and are checked '
      + 'against the same schemas as anything you send.',
  },
]
  .filter((entry) => mock.routes.has(`POST ${entry.path}`))
  .map((entry) => ({
    ...entry,
    method: 'POST',
    template: entry.path,
    operation: {},
    domain: 'the mock itself',
    kind: 'control',
  }));

// ── Tours ───────────────────────────────────────────────────────────────────
//
// Show me around is a choice of tours, and every tour is one of the contract
// set's Arazzo scenarios — the application walk-through included. Each step
// is drawn the same way: what it sends, which schemas say so, what came back,
// and what to notice, revealed as it is run.

/** The set's Arazzo scenarios, found by contract type. */
const scenarios = () => docs.filter((doc) => doc.type === 'arazzo');

/** The tour Show me around is on: the one picked, else the one the page was built to open with, else the first. */
const currentScenario = () => {
  const all = scenarios();
  return all.find((doc) => doc.relativePath === tour)
    ?? all.find((doc) => doc.relativePath === pageConfig.firstTour)
    ?? all[0] ?? null;
};

/** Every step of a scenario, in order, across its workflows. */
const scenarioSteps = (doc) => (doc.content.workflows ?? []).flatMap((workflow) =>
  (workflow.steps ?? []).map((step) => ({ workflow, step, key: `${workflow.workflowId}/${step.stepId}` })));

/**
 * A step's title and key points, from its description: the first paragraph is
 * the title, and the bullets after it are what to notice. Standard Arazzo — a
 * description is CommonMark — so any tool shows the same text.
 */
const describe = (step) => {
  const [first = '', ...rest] = String(step.description ?? '').split(/\n\s*\n/);
  const points = rest.join('\n\n').split('\n')
    .map((line) => line.trim())
    .filter((line) => line.startsWith('- '))
    .map((line) => line.slice(2));
  return { title: first.trim().replace(/\s+/g, ' ') || step.stepId, points };
};

/** Every operation a scenario can call: the contracts', and the mock's own. */
const scenarioOperations = () => new Map([...operationIndex(docs), ...controlOperations(mock)]);

/** The page's own reading of the operation a step calls, for its group, schemas and links. */
const operationFor = (step) => {
  const ref = scenarioOperations().get(String(step.operationId).replace(/^\$sourceDescriptions\.[^.]+\./, ''));
  if (!ref) return { ref: null, op: null };
  const op = operations().find((candidate) => candidate.method === ref.method && candidate.path === ref.path);
  return { ref, op: op ? { ...op, ...classify(op) } : null };
};

/**
 * A scenario's introduction, from its description: the first paragraph, and
 * the bullets after it — what the tour demonstrates.
 */
const introOf = (doc) => {
  const panelParts = [];
  const { title, points } = describe({ description: doc.content.info?.description, stepId: '' });
  if (title) panelParts.push(el('p', title, 'note'));
  if (points.length > 0) {
    // Read as part of the introduction, so set like the sentence above them.
    const list = noticeList(points, null);
    list.className = 'note';
    panelParts.push(list);
  }
  return panelParts;
};

/** The run of the tour on this server, started at its first step. */
const runnerFor = (doc) => {
  if (!tourRunner) {
    const fetchHere = (request) => {
      const { pathname, search } = new URL(request.url);
      return mock.fetch(new Request(new URL(basePath + pathname + search, location.origin), request));
    };
    tourRunner = startScenario(doc.content, { fetch: fetchHere, operations: scenarioOperations() });
  }
  return tourRunner;
};

/** Forget a tour's run, as a new server does. */
const resetTour = () => {
  tourRunner = null;
  tourResults.clear();
  tourStep = null;
  tourWhole = false;
};

/** Run on, through the given step or to the end, remembering each answer. */
const runOn = async (doc, until, say) => {
  const runner = runnerFor(doc);
  const entries = scenarioSteps(doc);
  let count = 0;
  let result;
  while ((result = await runner.next())) {
    count += 1;
    tourResults.set(`${result.workflowId}/${result.stepId}`, result);
    const at = entries.findIndex((entry) => entry.key === `${result.workflowId}/${result.stepId}`);
    say?.(`Running… ${at + 2 > entries.length ? entries.length : at + 2} of ${entries.length}`);
    if (until && result.workflowId === until.workflowId && result.stepId === until.stepId) break;
    // A step that failed stops the run rather than carrying on into the ones
    // that needed it. One may be meant to be refused — its checks say so.
    if (!result.passed) break;
  }
  return count;
};

/** Run whatever is left of a tour, and lay the whole of it out as one page. */
const runWholeTour = async (doc, say) => {
  await runOn(doc, null, say);
  tourWhole = true;
  tourStep = null;
};

/** Show me around's choice of tour. */
const tourPicker = () => {
  const field = el('label', '', 'tour-picker');
  field.append(el('span', 'Show me'));
  const picker = el('select');
  for (const doc of scenarios()) {
    const option = el('option', doc.content.info?.title ?? doc.relativePath);
    option.value = doc.relativePath;
    picker.append(option);
  }
  picker.value = currentScenario()?.relativePath ?? '';
  // Another tour starts on fresh data, so nothing the last one made is in its way.
  picker.onchange = async () => { tour = picker.value; await derive({ seed: true }); };
  field.append(picker);
  return field;
};

/** A tour's steps down the side: everything run, and the one to do next. */
const renderTourNav = (nav, doc) => {
  const entries = scenarioSteps(doc);
  // Shown: everything already run, plus the one to do next. The rest are
  // counted, not listed, so nobody wonders how long this goes on for.
  const reached = entries.findIndex((entry) => !tourResults.get(entry.key)?.passed);
  const upTo = reached === -1 ? entries.length : reached + 1;
  const list = el('ol', '', 'ops steps');
  for (const [index, entry] of entries.slice(0, upTo).entries()) {
    const item = el('li');
    const button = el('button', '', 'op step');
    const run = Boolean(tourResults.get(entry.key)?.passed);
    button.append(
      el('span', run ? '✓' : String(index + 1).padStart(2, '0'), run ? 'n run' : 'n'),
      el('span', describe(entry.step).title)
    );
    if (tourStep === index) button.classList.add('here');
    button.onclick = () => {
      tourStep = index;
      // On the whole page, a step is a place on it to go to.
      if (tourWhole) {
        renderGroups();
        document.getElementById(`tour-step-${index}`)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        return;
      }
      renderGroups();
      renderStage();
    };
    item.append(button);
    list.append(item);
  }
  nav.append(list);

  const left = entries.length - upTo;
  if (left > 0) nav.append(el('p', `${left} more, once you have run this one`, 'to-come'));

  // Sixteen presses of Next is sometimes fifteen too many. This runs whatever
  // is left — the same requests, in the same order — and lays the whole thing
  // out as one page to read through.
  const unrun = entries.filter((entry) => !tourResults.has(entry.key)).length;
  const wholeThing = el('button', unrun > 0 ? `Run all ${entries.length} now` : 'Show the whole walk at once', 'run-all');
  wholeThing.onclick = async () => {
    wholeThing.disabled = true;
    await runWholeTour(doc, (saying) => { wholeThing.textContent = saying; });
    renderGroups();
    await renderStage();
  };
  nav.append(wholeThing);
};

/** A tour's opening panel. */
const tourIntro = (doc) => {
  const panel = el('div', '', 'panel');
  const entries = scenarioSteps(doc);
  // Counted, not written down: a contract set with more in it should say so
  // without anybody remembering to come back here.
  const total = operations().map((candidate) => ({ ...candidate, ...classify(candidate) }))
    .filter((candidate) => candidate.kind !== 'stream').length + stubStep().length + controlSteps().length;
  panel.append(el('h2', doc.content.info?.title ?? 'Start at step one'));
  panel.append(...introOf(doc));
  panel.append(el('p',
    `Or press Let me explore for all ${total} operations, with nothing held back `
    + 'and everything editable.', 'note'));
  const [first] = entries;
  if (first) {
    const pair = el('div', '', 'row');
    const begin = el('button', `Start the tour — ${describe(first.step).title}`, 'primary');
    begin.onclick = () => { tourStep = 0; renderGroups(); renderStage(); };
    const whole = el('button', 'Or run all of it now', 'run-all');
    whole.onclick = async () => {
      whole.disabled = true;
      await runWholeTour(doc, (saying) => { whole.textContent = saying; });
      renderGroups();
      await renderStage();
    };
    pair.append(begin, whole);
    panel.append(pair);
  }
  return panel;
};

/** The contracts a step's move, ruleset or composition is declared in, linked. */
const citedLine = (op) => {
  const cited = [
    op?.action && { name: `${op.action.object} lifecycle`, path: op.action.doc },
    op?.ruleset && { name: op.ruleset.name, path: op.ruleset.doc },
    op?.composition && { name: op.composition.name, path: op.composition.doc },
  ].filter((entry) => entry && entry.path);
  if (cited.length === 0) return null;
  const line = el('p', '', 'cited');
  for (const [index, entry] of cited.entries()) {
    if (index > 0) line.append(el('span', '  ·  '));
    if (entry.name) line.append(el('code', entry.name), el('span', ' — '));
    if (pageConfig.sourceUrl) {
      const link = el('a', entry.path);
      link.href = `${pageConfig.sourceUrl}/${entry.path}`;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      line.append(link);
    } else {
      line.append(el('span', entry.path));
    }
  }
  return line;
};

/**
 * Key points as a list, where each backticked name the page can find in the
 * step's operation carries its declaration underneath: hovering shows the
 * lines, and the file is a link inside them. Shared by every tour and by
 * Let me explore.
 */
const noticeList = (points, op) => {
  const list = el('ul');
  for (const line of points) {
    const item = el('li');
    for (const [index, part] of line.split('`').entries()) {
      if (part === '') continue;
      if (index % 2 === 0) { item.append(el('span', part)); continue; }
      const found = op ? locate(part, op) : null;
      if (!found) { item.append(el('code', part)); continue; }
      const chipped = el('span', '', 'ref');
      const chip = el('code', part);
      // Reachable without a mouse, and on a touch screen, where there is no
      // hover at all and focus is the only thing a tap can produce.
      chip.tabIndex = 0;
      const card = el('span', '', 'card');
      if (found.yaml) card.append(el('pre', found.yaml, 'excerpt'));
      for (const where of found.paths ?? [found.path]) card.append(openLink(where));
      chipped.append(chip, card);
      item.append(chipped);
    }
    list.append(item);
  }
  return list;
};

/** The headers a step sends that matter to it — an Idempotency-Key, say; not who is calling. */
const headersWorthShowing = (headers) => Object.entries(headers ?? {})
  .filter(([name]) => !/^(content-type|x-caller-id|x-caller-roles)$/i.test(name))
  .map(([name, value]) => `${name}: ${value}`);

/**
 * One step of a tour: what it sends, which schemas say so, what came back, and
 * what to notice — the last two once it has run. Executing runs the tour on to
 * this step, on the same server as the steps before it.
 */
const tourStepPanel = (doc, entries, index, { live = true } = {}) => {
  const entry = entries[index];
  const { step } = entry;
  const { title, points } = describe(step);
  const { op } = operationFor(step);
  const result = tourResults.get(entry.key);
  const sending = result?.request ?? runnerFor(doc).preview(entry.workflow.workflowId, step);
  const panel = el('div', '', 'panel');
  panel.id = `tour-step-${index}`;

  const group = op ? GROUPS.find((candidate) => candidate.holds(op.kind)) : GROUPS.find((candidate) => candidate.id === 'control');
  if (group) panel.append(el('p', group.title, 'kindline'));
  panel.append(el('h2', `${String(index + 1).padStart(2, '0')} · ${title}`));
  panel.append(el('p', sending ? `${sending.method} ${sending.url}` : step.operationId, 'path'));
  const shown = headersWorthShowing(sending?.headers);
  if (shown.length > 0) panel.append(el('p', shown.join('   ·   '), 'cited'));
  const cited = citedLine(op);
  if (cited) panel.append(cited);

  if (sending?.multipart && op) {
    // A body that is not JSON, shown as the parts it is actually made of.
    const declared = op.operation.requestBody.content['multipart/form-data'].schema;
    panel.append(shapeLine('multipart/form-data', op.doc.relativePath, 'shape', flattened(deref(declared, op.doc), op.doc)));
    const listing = el('pre', '', 'parts');
    listing.append(document.createTextNode(Object.entries(sending.body ?? {}).map(([name, value]) => (value && typeof value === 'object'
      ? `${name.padEnd(16)}${value.fileName}  ·  ${value.contentType}  ·  ${new TextEncoder().encode(String(value.content ?? '')).length} bytes`
      : `${name.padEnd(16)}${value}`)).join('\n')));
    panel.append(listing);
  } else if (sending?.body !== undefined) {
    const field = el('label', '', 'field');
    const requestRef = op?.operation?.requestBody?.content?.['application/json']?.schema?.$ref;
    const requestShape = typeof requestRef === 'string' ? requestRef.split('/').pop() : null;
    if (requestShape && op?.doc?.relativePath) {
      field.append(shapeLine(requestShape, op.doc.relativePath, 'shape',
        flattened(op.doc.content?.components?.schemas?.[requestShape], op.doc)));
    }
    // The body is fixed: the step is about what the server does with it.
    const box = el('textarea');
    box.value = JSON.stringify(sending.body, null, 2);
    box.readOnly = true;
    box.className = 'fixed';
    box.title = 'Switch to Let me explore to change it';
    field.append(box);
    panel.append(field);
  }

  const send = el('button', 'Execute', 'primary');
  if (live) panel.append(send);
  if (result) {
    send.disabled = result.passed;
    send.textContent = result.passed ? 'Done' : 'Try again';
  }

  if (result) {
    const named = op ? responseShape(op, result.response.status) : null;
    if (named) panel.append(shapeLine(named.name, named.path, 'shape', named.node));
    const answer = el('pre', '', result.response.status >= 400 ? 'bad' : '');
    // The response headers the step checks, which are what it is about —
    // Idempotent-Replayed on a retry, say.
    const checked = [...new Set((step.successCriteria ?? [])
      .flatMap((criterion) => [...String(criterion.condition).matchAll(/\$response\.header\.([A-Za-z0-9-]+)/g)].map((m) => m[1])))];
    const headerLines = checked.map((name) => `${name}: ${result.response.headers?.[name.toLowerCase()] ?? '(not sent)'}\n`).join('');
    answer.append(el('span', `${result.response.status} ${result.response.statusText ?? ''}`.trim(), 'label'),
      document.createTextNode(headerLines + (headerLines ? '\n' : '') + JSON.stringify(result.response.body, null, 2)));
    panel.append(answer);
    // A step's checks are shown when one fails; a step that did what it says
    // has nothing to add to its answer.
    if (!result.passed) {
      const checks = el('ul', '', 'checks');
      for (const check of result.checks) checks.append(el('li', `${check.passed ? '✓' : '✗'} ${check.condition}`, check.passed ? 'passed' : 'failed'));
      panel.append(checks);
    }
    if (points.length > 0) {
      const watch = el('div', '', 'watch');
      watch.append(el('p', 'What to notice', 'watch-title'), noticeList(points, op));
      panel.append(watch);
    }
  }

  send.onclick = async () => {
    send.disabled = true;
    send.textContent = 'Working…';
    // A failed step is tried again on fresh data, from the start: the run
    // cannot step back, and the steps before it are what it acts on.
    if (result && !result.passed) { await derive({ seed: true }); tourStep = index; }
    await runOn(doc, { workflowId: entry.workflow.workflowId, stepId: step.stepId });
    renderGroups();
    await renderStage();
  };

  if (!live) return panel;
  const pager = el('div', '', 'pager');
  if (index > 0) {
    const back = el('button', `← ${describe(entries[index - 1].step).title}`, 'step-back');
    back.onclick = () => { tourStep = index - 1; renderGroups(); renderStage(); };
    pager.append(back);
  }
  if (index < entries.length - 1) {
    const next = el('button', `Next — ${describe(entries[index + 1].step).title}`, 'primary next-step');
    next.onclick = () => { tourStep = index + 1; renderGroups(); renderStage(); };
    // Going on needs this step to have run.
    next.hidden = !result?.passed;
    pager.append(next);
  } else {
    const end = el('p', 'That is the whole walk. Switch to Let me explore and poke at the rest.', 'to-come');
    end.hidden = !result?.passed;
    pager.append(end);
  }
  panel.append(pager);
  return panel;
};

/** Show me around: a tour's opening, the step in view, or all of it at once. */
const renderTourStage = (stage, doc) => {
  const entries = scenarioSteps(doc);
  if (tourWhole) {
    // Every step at once, each showing what it answered. Same panels as one
    // step at a time, with nothing left to press.
    const panel = el('div', '', 'panel');
    panel.append(el('h2', doc.content.info?.title ?? doc.relativePath));
    panel.append(...introOf(doc));
    const again = el('button', 'One step at a time', 'primary');
    again.onclick = () => { tourWhole = false; tourStep = 0; renderGroups(); renderStage(); };
    panel.append(again);
    stage.append(panel);
    for (const [index, entry] of entries.entries()) {
      if (tourResults.has(entry.key)) stage.append(tourStepPanel(doc, entries, index, { live: false }));
    }
    return;
  }
  stage.append(tourStep === null || !entries[tourStep] ? tourIntro(doc) : tourStepPanel(doc, entries, tourStep));
};

const renderGroups = () => {
  const nav = $('groups');
  // Kept across the rebuild, so the list does not jump back to the top.
  const scrolled = nav.scrollTop;
  nav.replaceChildren();
  requestAnimationFrame(() => { nav.scrollTop = scrolled; });

  const everything = operations()
    .map((op) => ({ ...op, ...classify(op) }))
    .filter((op) => op.kind !== 'stream');

  // Walking through and looking something up are different jobs. The walk is
  // one numbered list in the order you would do them, because the order is
  // the content; the reference is by domain, because then you can find
  // things. Same operations, same panel, two ways in.
  // Show me around is a tour, a step at a time; Let me explore is the
  // reference, by domain. Same operations, two ways in.
  if (!showAll) {
    nav.append(tourPicker());
    const doc = currentScenario();
    if (doc) renderTourNav(nav, doc);
    else nav.append(el('p', 'This contract set has no scenarios to tour.', 'note'));
    return;
  }

  const classified = [...everything, ...stubStep(), ...controlSteps()];
  const domains = [...new Set(classified.map((op) => op.domain))].sort();
  // The first group starts open; after that, whatever the reader opened stays
  // open, and the group holding the selected operation always is.
  openDomains ??= new Set(domains.slice(0, 1));
  if (selected?.domain) openDomains.add(selected.domain);

  for (const domain of domains) {
    const mine = classified.filter((op) => op.domain === domain);
    const box = el('details', '', 'group');
    box.open = openDomains.has(domain);
    box.addEventListener('toggle', () => {
      if (box.open) openDomains.add(domain); else openDomains.delete(domain);
    });
    box.append(el('summary', `${domain}  (${mine.length})`));

    for (const group of GROUPS) {
      const ofKind = mine.filter((op) => group.holds(op.kind));
      if (ofKind.length === 0) continue;
      box.append(el('p', group.title, 'kind'));

      const list = el('ul', '', 'ops');
      for (const op of ofKind) {
        const item = el('li');
        const button = el('button', '', 'op');
        button.append(el('span', op.method, 'verb'), el('span', op.summary));
        if (selected && selected.method === op.method && selected.path === op.path) {
          button.classList.add('here');
        }
        button.onclick = () => { selected = op; renderGroups(); renderStage(); };
        item.append(button);
        list.append(item);
      }
      box.append(list);
    }
    nav.append(box);
  }
};

// ── Showing a contract ──────────────────────────────────────────────────────

/**
 * A schema with its `allOf` parts folded in.
 *
 * Printed as written, the interesting schemas are three lines of `allOf`
 * and a `$ref`, which tells a reader to go and look somewhere else — the
 * thing opening it in place was meant to avoid. Composition is how these
 * documents are written, so the excerpt assembles what the reader would
 * have assembled by hand.
 */
const flattened = (schema, doc) => {
  if (!schema) return null;
  const folded = (schema.allOf ?? []).length > 0;
  const parts = [schema, ...(schema.allOf ?? [])].map((part) => deref(part, doc));
  const merged = { properties: {} };
  for (const part of parts) {
    for (const [key, value] of Object.entries(part ?? {})) {
      if (key === 'allOf') continue;
      if (key === 'properties') Object.assign(merged.properties, value);
      else if (key === 'required') merged.required = [...(merged.required ?? []), ...value];
      else merged[key] = value;
    }
  }
  if (Object.keys(merged.properties).length === 0) delete merged.properties;
  return { schema: merged, folded };
};

/**
 * What a given status answers with, named and located.
 *
 * A success is declared inline and lives in this document. A failure is a
 * `$ref` to `common/components/responses.yaml`, which every operation in
 * every domain shares — so the response object has to be followed before
 * there is a schema to name, and the file it is named in is not this one.
 * Without that, the page showed a shape for the happy path and nothing at
 * all for the four declared ways to fail.
 */
const responseShape = (operation, status) => {
  const declared = operation.operation.responses?.[String(status)]
    ?? operation.operation.responses?.default;
  if (!declared) return null;

  const where = typeof declared.$ref === 'string'
    ? (declared.$ref.split('#')[0] || operation.doc.relativePath)
    : operation.doc.relativePath;
  const named = typeof declared.$ref === 'string' ? declared.$ref.split('/').pop() : null;

  const response = deref(declared, operation.doc);
  const schema = response?.content?.['application/json']?.schema;
  if (!schema) return null;

  const inline = typeof schema.$ref === 'string' ? schema.$ref.split('/').pop() : null;
  const name = inline ?? named;
  if (!name) return null;

  return {
    name,
    path: fileNamed(where, operation.doc),
    node: flattened(deref(schema, operation.doc), operation.doc),
  };
};

/**
 * `ApplicationCreate — domains/intake/intake-openapi.yaml`, which opens.
 *
 * The link alone cost a tab, a round trip and your place in the walk, to
 * read four lines. Those four lines are already in the artifact, so the
 * declaration opens in place and the link stays inside it for anyone who
 * wants the whole file.
 */
const shapeLine = (name, path, className, node) => {
  const box = el('details', '', className);
  const head = el('summary');
  head.append(el('code', name), el('span', ' — '), el('span', path));
  box.append(head);

  if (node?.schema) {
    // Named, so the excerpt is a thing rather than a fragment: `properties:`
    // on its own line reads like something torn out of a file, and leaves
    // the summary above doing work the snippet should do itself.
    const yaml = el('pre', '', 'excerpt');
    const body = asYaml(essential({ [name]: node.schema })).replace(/^\n/, '');
    // And said plainly where this is not what the file looks like. The
    // link is one line below; a snippet that quietly disagrees with it
    // would be found out immediately.
    yaml.append(document.createTextNode(
      node.folded ? `# allOf folded in, for reading\n${body}` : body
    ));
    box.append(yaml);
  }
  // The summary above already names the file, so without somewhere to send
  // a reader there is nothing to add.
  if (pageConfig.sourceUrl) box.append(openLink(path));
  return box;
};

/** A link to the whole file, where the build knew where the files are. */
const openLink = (path) => {
  if (!pageConfig.sourceUrl) return el('span', path, 'whole');
  const link = el('a', `open ${path}`, 'whole');
  link.href = `${pageConfig.sourceUrl}/${path}`;
  link.target = '_blank';
  link.rel = 'noopener noreferrer';
  return link;
};

/** A `$ref`'s file, as the set keys it: relative paths are written from a document. */
const fileNamed = (where, from) => {
  if (!where || !where.startsWith('.')) return where || from.relativePath;
  const tail = where.replace(/^(\.\.\/)+/, '');
  return docs.find((doc) => doc.relativePath?.endsWith(tail))?.relativePath ?? from.relativePath;
};

/** `programCount:\n  type: integer`, printed the way the file has it. */
const snippet = (name, node, { prose = false } = {}) =>
  asYaml(prose ? { [name]: node } : essential({ [name]: node })).replace(/^\n/, '').trimEnd();

/**
 * One entry of a list, printed as one.
 *
 * An action and a fact are both items in a sequence and both carry their own
 * `id` or `path`. Printed under that name as a key they appear to say it
 * twice, which is not what the file looks like.
 */
const asList = (node) => asYaml([node]).replace(/^\n/, '').trimEnd();

/**
 * Where a name in the notes is declared, and what it says there.
 *
 * The notes are full of things a reader might want to look at — a field, an
 * extension, a policy id, a procedure, a status code — and naming one in
 * backticks and then leaving it inert asks a question the page could have
 * answered. Only schema names used to resolve, which meant the two names
 * with an excerpt already open above them were linked and nothing else was.
 *
 * Order matters: a token is looked for in this operation first, because the
 * same word can be a query parameter here and a column somewhere else, and
 * the one a reader means is the one on the screen in front of them.
 */
const locate = (token, op) => {
  const doc = op.doc;
  const here = doc?.relativePath;

  // A parameter this operation declares. The shared ones live in a base
  // components file, which is the more interesting answer: `limit` is
  // declared once for every list endpoint in every domain.
  for (const parameter of op.operation?.parameters ?? []) {
    const resolved = deref(parameter, doc);
    if (resolved?.name !== token) continue;
    const from = typeof parameter.$ref === 'string' ? parameter.$ref.split('#')[0] : null;
    return { path: fileNamed(from, doc), yaml: snippet(token, resolved) };
  }

  // A field of what this operation takes or gives back — including the page
  // envelope, whose `items`/`total`/`limit` are a declared shape rather than
  // a convention the mock settled on.
  const answers = op.operation?.responses ?? {};
  const envelope = deref((answers['200'] ?? answers['201'] ?? answers['202'])
    ?.content?.['application/json']?.schema, doc);
  // The body that is not JSON counts as a source too: `file` is declared in
  // a multipart schema, which `requestSchema` does not look at.
  const multipart = op.operation?.requestBody?.content?.['multipart/form-data']?.schema;
  if (token === 'multipart/form-data' && multipart) {
    return { path: here, yaml: snippet(token, deref(multipart, doc)) };
  }
  const sources = [envelope, responseSchema(op), requestSchema(op), multipart && deref(multipart, doc)]
    .filter(Boolean);
  const asProperty = (name, declared) => {
    // Printed as authored: a property that is nothing but a `$ref` says
    // nothing, so that one is followed, and one carrying its own keywords
    // is left alone — the keywords are why it was named.
    const only = Object.keys(declared).length === 1 && declared.$ref;
    return { path: here, yaml: snippet(name, only ? deref(declared, doc) : declared) };
  };
  for (const schema of sources) {
    for (const [name, declared] of Object.entries(collectProperties(schema, doc))) {
      // By name, or by the expression it declares: the notes quote
      // `$this.programsAppliedFor.size()` on its own, and the thing a reader
      // wants when they read that is the field it was written on.
      if (name === token || deref(declared, doc)?.['x-derived'] === token) {
        return asProperty(name, declared);
      }
    }
  }

  // Things declared under an id of their own, looked for before the guard
  // below: `snap_standard` is a value of the `slaTypeCode` enum *and* the
  // name of an SLA document, and the SLA is what a reader wants.
  for (const candidate of docs.filter((d) => d.type === 'sla-types')) {
    const sla = (candidate.content?.slaTypes ?? []).find((one) => one.id === token);
    if (sla) return { path: candidate.relativePath, yaml: asList(essential(sla)) };
