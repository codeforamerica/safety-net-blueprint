# transcription field inventory
# Do not edit — regenerate with: node generate-field-inventory.mjs --domain=transcription

# ── Transcript ──────────────────────────────────────────────────────────────────

transcript.subjectId: { type: uuid, relationship: Polymorphic }
transcript.id: { type: uuid }
transcript.subjectType: { type: string }
transcript.model: { type: string }
transcript.client: { type: string }
transcript.status: { type: enum, values: [recording, paused, closed] }
transcript.startedAt: { type: datetime }
transcript.closedAt: { type: datetime }
transcript.lastActivityAt: { type: datetime }
transcript.profile: { type: string, relationship: TranscriptionProfile }

# ── TranscriptEntry ─────────────────────────────────────────────────────────────

transcript.entries[]: { type: list(TranscriptEntry) }
transcript.entries[].id: { type: uuid }
transcript.entries[].transcriptId: { type: uuid, relationship: Transcript }
transcript.entries[].kind: { type: enum, values: [line, gap, pause] }
transcript.entries[].startedAt: { type: datetime }
transcript.entries[].endedAt: { type: datetime }
transcript.entries[].text: { type: string }
transcript.entries[].speaker: { type: enum, values: [staff, client, unknown] }
transcript.entries[].speakerLabel: { type: string }
transcript.entries[].confidence: { type: number }
transcript.entries[].language: { type: string }
transcript.entries[].cause: { type: enum, values: [connection, provider, client, unknown] }
transcript.entries[].links: { type: object }
transcript.entries[].links.transcript: { type: string }

# ── TranscriptionProfile ────────────────────────────────────────────────────────

profile.id: { type: uuid }
profile.name: { type: string }
profile.description: { type: string }
profile.provider: { type: enum, values: [aws-transcribe, elevenlabs-scribe, none] }
profile.languages[]: { type: string }
profile.idleTimeout: { type: string }
profile.source: { type: enum, values: [system, user] }
