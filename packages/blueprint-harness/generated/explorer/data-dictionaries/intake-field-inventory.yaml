# intake field inventory
# Do not edit — regenerate with: node generate-field-inventory.mjs --domain=intake

# ── Application ─────────────────────────────────────────────────────────────────

application.id: { type: uuid }
application.programsApplied[]: { type: enum, values: [snap, medicaid, chip, tanf] }
application.channel: { type: enum, values: [online, phone, in_person, mail] }
application.address: { type: object }
application.address.street: { type: string }
application.address.city: { type: string }
application.address.state: { type: string }
application.address.zip: { type: string }
application.contactInfo: { type: object }
application.contactInfo.phone: { type: string }
application.contactInfo.email: { type: email }
application.contactInfo.preferredContact: { type: enum, values: [phone, email, mail] }
application.labels: { type: object }
application.countyCode: { type: string }
application.referenceId: { type: string }
application.confirmationNumber: { type: string }
application.status: { type: enum, values: [draft, submitted, under_review, withdrawn, closed] }
application.submittedAt: { type: datetime }
application.openedAt: { type: datetime }
application.slaTypeCode: { type: enum, values: [snap_standard, medicaid_standard] }

# ── ApplicationMember ───────────────────────────────────────────────────────────

application.members[]: { type: list(ApplicationMember) }
application.members[].id: { type: uuid }
application.members[].applicationId: { type: uuid, relationship: Application }
application.members[].firstName: { type: string }
application.members[].lastName: { type: string }
application.members[].dateOfBirth: { type: date }
application.members[].relationship: { type: enum, values: [self, spouse, child, parent, sibling, other] }
application.members[].verificationEvidence: { type: string }
application.members[].links: { type: object }
application.members[].links.application: { type: string }

# ── ReviewProgressListResponse ──────────────────────────────────────────────────

application.reviewProgress[]: { type: list(ReviewProgressListResponse) }
application.reviewProgress[].items[]: { type: list(ReviewProgress) }
application.reviewProgress[].items[].id: { type: uuid }
application.reviewProgress[].items[].itemId: { type: uuid, relationship: Polymorphic }
application.reviewProgress[].items[].status: { type: enum, values: [not_started, in_progress, complete, flagged] }
application.reviewProgress[].items[].section: { type: string }
application.reviewProgress[].total: { type: integer }
application.reviewProgress[].limit: { type: integer }
application.reviewProgress[].offset: { type: integer }
application.reviewProgress[].hasNext: { type: boolean }
