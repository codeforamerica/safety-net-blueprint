name: "Blueprint Harness"
first_tour: scenarios/framework-features.arazzo.yaml
repo:
  url: "https://github.com/codeforamerica/safety-net-blueprint"
  branch: main
  spec_path: packages/blueprint-harness/contracts

cross_cutting:
  - Authentication & Authorization
  - Audit & History

domains:
  - id: intake
    label: Intake
    status: partial
    description: Application intake and eligibility screening
    entities: [Application]
  - id: eligibility
    label: Eligibility
    status: partial
    description: Eligibility determination and benefit calculation
    entities: [Determination]
  - id: platform
    label: Platform
    status: partial
    description: Cross-cutting platform services and policies

events:
  - name: intake.application.submitted
    publisher: intake
    status: implemented
    subscribers: [eligibility]
  - name: intake.application.withdrawn
    publisher: intake
    status: implemented
    subscribers: []
  - name: intake.application.closed
    publisher: intake
    status: implemented
    subscribers: []
  - name: eligibility.determination.complete
    publisher: eligibility
    status: implemented
    subscribers: []

# The environments the site switches between, as a developer portal does,
# the first the default: each one's config and overlays (../environments/),
# routing and sign-in. The site is built from the contracts resolved without
# an environment, and the page applies the one picked.
environments:
  # The sandbox: everything in the page, and nobody signs in. Sessions under
  # the whisper profile transcribe in it.
  - name: Local
    variables: ../environments/local.env
    routing: routing.yaml
  # A stand-in for a deployment that requires signing in: the contracts
  # require it (production.overlay.yaml), through the stand-in sign-in page in
  # pages/. Sessions under fake-secured go to a fake service whose
  # credentials need it.
  - name: Production
    variables: ../environments/production.env
    overlays: [../environments/production.overlay.yaml]
    routing: routing-production.yaml
    sign_in:
      client_id: blueprint-harness

pages: pages
