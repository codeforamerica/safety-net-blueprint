name: "Blueprint Harness"
first_tour: scenarios/framework-features.arazzo.yaml
repo:
  url: "https://github.com/codeforamerica/safety-net-blueprint"
  branch: main
  spec_path: packages/blueprint-harness/contracts

cross_cutting:
  - Authentication & Authorization
  - Audit & History

domains:
  - id: intake
    label: Intake
    status: partial
    description: Application intake and eligibility screening
    entities: [Application]
  - id: eligibility
    label: Eligibility
    status: partial
    description: Eligibility determination and benefit calculation
    entities: [Determination]
  - id: platform
    label: Platform
    status: partial
    description: Cross-cutting platform services and policies

events:
  - name: intake.application.submitted
    publisher: intake
    status: implemented
    subscribers: [eligibility]
  - name: intake.application.withdrawn
    publisher: intake
    status: implemented
    subscribers: []
  - name: intake.application.closed
    publisher: intake
    status: implemented
    subscribers: []
  - name: eligibility.determination.complete
    publisher: eligibility
    status: implemented
    subscribers: []

# The harness's own routing: sessions under a Whisper profile transcribe in
# the page; under fake-secured, they go to a fake service behind sign-in.
routing: routing.yaml

# Signing in, where a call needs it: the provider comes from the contracts'
# security scheme (contracts/overlays/sign-in.yaml), and this is the client
# the explorer signs in as. The harness's provider is a stand-in page in
# pages/, which signs in anyone.
sign_in:
  client_id: blueprint-harness
pages: pages
