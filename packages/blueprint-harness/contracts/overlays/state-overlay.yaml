overlay: 1.0.0
info:
  title: Example state customization overlay
  version: 1.0.0

# Project-level configuration settings applied across all resolved specs.
# These override blueprint defaults for a specific state deployment.
config:
  x-casing: snake_case
  x-pagination:
    style: cursor
  x-search:
    style: filtered
  x-relationship:
    style: expand
  # A deployment namespaces its events so two deployments' events cannot be
  # confused. Left as a state code for now, and the choice is open: naming a
  # real state in a fixture implies a deployment that does not exist, but
  # `example.` does not work — blueprint-explorer's validate-config strips a
  # jurisdiction prefix with /^[a-z]{2,3}\./, so anything longer than three
  # letters stops the sequence-diagram config matching its events. `xx.` (the
  # ISO 3166 user-assigned "not a real place" code) would fit that rule.
  x-event-type-prefix: ca.

# JSONPath-targeted actions that add or modify fields in specific specs.
actions:
  # Add a state-specific field to the Application schema.
  - target: "$.components.schemas.ApplicationWritable.properties"
    update:
      countyCode:
        type: string
        maxLength: 10
        description: County code for routing this application to the correct local office.

