overlay: '1.0.0'
info:
  title: Harness transcription profiles
  version: 1.0.0

# The profile the harness adds to the framework's catalog, seeded as a state
# seeds its own: one naming the fake service behind sign-in, which the
# explorer signs in to. The scenarios and the explorer otherwise use the
# framework's own profiles: `whisper` for a spoken conversation, which the
# explorer runs in the page, and `typed` for a chat.

actions:
  - target: "$.profiles.entries"
    files: base/domains/communication/communication-transcripts-config.yaml
    description: A profile whose service needs signing in
    append:
      - id: 7a1e0c2d-0000-4000-8000-0000000000f5
        name: fake-secured
        description: An interview in English, transcribed by the harness's fake service behind sign-in. Starting a session under it asks you to sign in first.
        provider: fake-secured
        languages: [en-US]

  - target: "$.paths['/transcription-sessions'].post.requestBody.content['application/json']"
    files: base/domains/communication/communication-transcription-sessions-openapi.yaml
    description: Start a session under the Whisper profile, so trying it needs no service
    update:
      example:
        profileId: 7a1e0c2d-0000-4000-8000-0000000000b1
        model: whisper-tiny.en
        client: interview-assistant/0.1.0
        startedAt: "2026-01-15T14:00:00Z"
