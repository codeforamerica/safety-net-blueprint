overlay: '1.0.0'
info:
  title: Harness enum extensions
  version: 1.0.0

# Extends base enum definitions to include harness-specific collections. The Domain
# enum needs no overlay: it is generated from the domains the contracts declare.
# This mirrors what a real domain package overlay would do when deploying blueprint contracts.

actions:
  # Extend the MetricCollection enum to include domain-specific resource collections.
  # The base enum covers workflow (tasks, events); domain packages add their primary
  # resource collections via overlay.
  - target: "$.$defs.MetricCollection"
    files: https://blueprint.codeforamerica.org/base/schemas/enums.yaml
    description: Add intake and eligibility resource collections to MetricCollection
    replace:
      type: string
      description: >
        Harness metric collections. Extends the base MetricCollection with the
        primary resource collections for intake and eligibility domains.
      enum:
        - applications
        - determinations
        - events

  # Replace the generic base roles with the harness's own, as a program would.
  # Guard actors are validated against this list, and the demo page offers it
  # as the roles a caller can hold.
  - target: "$.$defs.RoleType"
    files: https://blueprint.codeforamerica.org/base/schemas/enums.yaml
    description: Replace the base roles with the harness's
    replace:
      type: string
      description: >
        Harness authorization roles. Replaces the base RoleType with the roles
        the harness's state machine guards name.

        - applicant: The household applying, acting on its own application
        - case_worker: Processes applications
        - supervisor: Oversees case workers
        - system: Automated service account for background and inter-service operations
      enum:
        - applicant
        - case_worker
        - supervisor
        - system
