arazzo: 1.1.0
info:
  title: Transcribing a spoken conversation
  version: 1.0.0
  x-domain: communication
  x-capability: transcripts
  description: |
    A staff member transcribes a conversation as it's spoken. The staff member starts, pauses and stops the session. The session's adapter, in their browser, sends the audio straight to a transcription service and publishes what happens as the session's events; the session follows them, and the transcript keeps the lines on the server. The adapter's credentials part gives the credential the adapter connects with.

    The main path starts, transcribes one line and stops. The other situations each start their own session.
  # Who acts in the scenario. A step lists them in x-actors in the order they
  # act, starting with the one who starts the step; the page shows them as
  # A → B. A stub step lists the one part it stands in for.
  x-actors:
    - id: staff
      name: Staff member
      description: Starts, pauses, resumes and stops transcribing, from their browser, and sees the lines as they come.
    - id: session
      name: Session
      description: Keeps track of the connection, and calls its adapter to start, pause and stop. It runs in the browser; in this demo, the mock runs it.
    - id: adapter
      name: Adapter's streaming part
      description: The session's adapter for the transcription service, its streaming part, in the staff member's browser. It sends the audio to the service and publishes what happens as the session's events. This scenario plays its part; a stub takes the session's calls to it.
    - id: transcript
      name: Transcript
      description: Keeps the transcript and its rules, on the server. In this demo, the mock runs it.
    - id: adapterServer
      name: Adapter's credentials part
      description: The adapter's credentials part, on the state's server, which holds the service's secret and gives the streaming part a short-lived credential. In this demo, the mock stands in for it with stubs.
    - id: supervisor
      name: Supervisor
      description: Someone else with access to the transcript.
    - id: scheduler
      name: Scheduler
      description: The platform's scheduler, which sends an event when a timer is due. In this demo, the mock stands in for it with a stub.
sourceDescriptions:
  # Relative to the resolved contract set, where the framework's documents sit
  # under base/.
  - name: sessions
    url: ../base/domains/communication/communication-transcription-sessions-openapi.yaml
    type: openapi
  - name: sessionEvents
    url: ../base/domains/communication/communication-transcription-sessions-events-asyncapi.yaml
    type: asyncapi
  # The session's adapter: the calls the session makes to it, and its server
  # part's credentials.
  - name: adapter
    url: ../base/domains/communication/communication-transcription-sessions-adapter-openapi.yaml
    type: openapi
  - name: transcripts
    url: ../base/domains/communication/communication-transcripts-openapi.yaml
    type: openapi
  - name: transcriptEvents
    url: ../base/domains/communication/communication-transcripts-events-asyncapi.yaml
    type: asyncapi
  # The mock's own routes, to stand in for the adapter's parts and the
  # scheduler. This makes the scenario one to run against the mock.
  - name: mock
    url: https://blueprint.codeforamerica.org/mock/mock-openapi.yaml
    type: openapi
components:
  parameters:
    caller:
      name: X-Caller-Id
      in: header
      value: worker-1
workflows:
  # ── The main path ─────────────────────────────────────────────────────────
  - workflowId: startAndConnect
    summary: Starting and connecting
    description: The staff member starts transcribing. The session starts a transcript and calls its adapter, which gets a credential, connects straight to the service, and publishes that it's connected.
    x-branch: main
    steps:
      - stepId: create
        x-actors: [staff, session]
        description: |
          Create a session

          - It says what to start a transcript with: the profile, the model, the client and when the conversation began. No transcript exists yet.
          - The profile, `english-interviews`, is one the harness seeds, as a state seeds its own. It uses the harness's fake service, and has no limit on time with nothing added, so a transcript under it never closes on its own partway through.
          - The session begins in `created`.
          - The staff member is already signed in. Signing in is outside this scenario.
        operationId: $sourceDescriptions.sessions.createTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
        requestBody:
          payload:
            # english-interviews, seeded by overlays/transcription-profiles.yaml
            profileId: 7a1e0c2d-0000-4000-8000-0000000000f1
            model: standard
            client: interview-assistant/0.1.0
            startedAt: '2026-10-12T10:00:00Z'
        successCriteria:
          - condition: $statusCode == 201
          - condition: $response.body#/status == 'created'
        outputs:
          id: $response.body#/id

      - stepId: adapterStub
        x-actors: [adapter]
        description: |
          Takes the session's call to start streaming

          - The session calls its adapter to start. This scenario plays the adapter, so a stub takes the call, and the adapter's work follows in the steps below.
        operationId: $sourceDescriptions.mock.registerHttpStub
        requestBody:
          payload:
            match: {method: POST, url: /streams}
            response: {status: 202, body: {metadata: {}}}
        successCriteria:
          - condition: $statusCode == 201

      - stepId: start
        x-actors: [staff, session, adapter]
        description: |
          Start

          - The session has no transcript yet, so it starts one, under the profile it was created with, then reads the profile for the service and languages, and calls its adapter to start streaming.
          - The session is `connecting`.
        operationId: $sourceDescriptions.sessions.startTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptionSessionId
            in: path
            value: $steps.create.outputs.id
        requestBody:
          payload: {}
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'connecting'
        outputs:
          transcriptId: $response.body#/transcriptId

      - stepId: connecting
        x-actors: [session, staff]
        description: |
          Status: connecting

          - The page follows the session's events, so whatever changes the session, the staff member sees.
        operationId: $sourceDescriptions.sessionEvents.sendCommunicationTranscriptionSessionConnecting
        action: receive
        successCriteria:
          - condition: $message.payload#/subject == $steps.create.outputs.id

      - stepId: adapterServerStub
        x-actors: [adapterServer]
        description: |
          Gives a credential for the service

          - The adapter's credentials part holds the service's secret and gives a credential that lasts minutes. The mock can't do that itself: without a stub it answers `POST /credentials` with `501`.
          - This stub answers the next `POST /credentials` as the credentials part would: where to connect, and a token good for five minutes.
        operationId: $sourceDescriptions.mock.registerHttpStub
        requestBody:
          payload:
            match: {method: POST, url: /credentials}
            response:
              status: 200
              body:
                metadata: {}
                provider: fake-transcription
                protocol: websocket
                url: wss://fake-transcription.example/stream
                accessToken: fake-service-token
                tokenType: Bearer
                expiresIn: 300
        successCriteria:
          - condition: $statusCode == 201

      - stepId: requestCredentials
        x-actors: [adapter, adapterServer]
        description: |
          Ask for credentials

          - The adapter asks its credentials part, with the service, model and languages the session started it with, and the audio it will send.
          - The answer says where to connect and the credential. The adapter opens the connection to the service with it and sends the audio straight there; it never passes through the server.
        operationId: $sourceDescriptions.adapter.requestCredentials
        requestBody:
          payload:
            metadata: {transcriptionSessionId: $steps.create.outputs.id}
            provider: fake-transcription
            model: standard
            languages: [en-US]
            audio: {encoding: linear16, sampleRateHertz: 16000, channelCount: 1}
            protocols: [websocket]
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/provider == 'fake-transcription'
          - condition: $response.body#/expiresIn == 300

      - stepId: publishConnected
        x-actors: [adapter, session]
        description: |
          Publish connected

          - The adapter opened the connection to the service itself, so only it knows it worked. It publishes that as the session's event, with the session's id as the subject and the partition key, so the session's events stay in order.
          - The session follows it to `connected`.
        operationId: $sourceDescriptions.sessionEvents.sendCommunicationTranscriptionSessionConnected
        action: send
        requestBody:
          payload:
            subject: $steps.create.outputs.id
            partitionkey: $steps.create.outputs.id
            data: {transcriptId: $steps.start.outputs.transcriptId}

      - stepId: connected
        x-actors: [staff, session]
        description: |
          Get the session: connected

          - It names the transcript it started.
        operationId: $sourceDescriptions.sessions.getTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptionSessionId
            in: path
            value: $steps.create.outputs.id
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'connected'
    outputs:
      sessionId: $steps.create.outputs.id
      transcriptId: $steps.start.outputs.transcriptId

  - workflowId: eachLine
    summary: Each line spoken
    description: One line is spoken. The service sends its text while it's in progress and once it's final, and the adapter publishes each as the session's event. The transcript keeps the finished line.
    x-branch: main
    dependsOn: [startAndConnect]
    steps:
      - stepId: publishLineUpdated
        x-actors: [adapter, staff]
        description: |
          Publish the line in progress

          - The service's text so far, which it may still change. The adapter gives the line a key; a later line with the same key replaces it. The page shows it. Nothing is kept.
        operationId: $sourceDescriptions.sessionEvents.sendCommunicationTranscriptionSessionLineUpdated
        action: send
        requestBody:
          payload:
            subject: $workflows.startAndConnect.outputs.sessionId
            partitionkey: $workflows.startAndConnect.outputs.sessionId
            data:
              transcriptId: $workflows.startAndConnect.outputs.transcriptId
              key: r1
              text: Can you tell me who
              speaker: staff
              startedAt: '2026-10-12T10:00:05Z'

      - stepId: publishLineFinished
        x-actors: [adapter, transcript]
        description: |
          Publish the finished line

          - Once the service's text for the line is final, with the same key. Its times are by the browser's clock.
          - The transcript keeps it, once for the session and the key, so if it's published again after a network error, it's still kept once. The page swaps the line in progress for it.
        operationId: $sourceDescriptions.sessionEvents.sendCommunicationTranscriptionSessionLineFinished
        action: send
        requestBody:
          payload:
            subject: $workflows.startAndConnect.outputs.sessionId
            partitionkey: $workflows.startAndConnect.outputs.sessionId
            data:
              transcriptId: $workflows.startAndConnect.outputs.transcriptId
              key: r1
              text: Can you tell me who lives with you?
              speaker: staff
              startedAt: '2026-10-12T10:00:05Z'
              endedAt: '2026-10-12T10:00:06Z'
        outputs:
          eventId: $response.body#/id

      - stepId: lineKept
        x-actors: [transcript, staff]
        description: |
          Entry added

          - The transcript's own event, for the line it kept. The line is now part of the record.
          - It names the `line_finished` the adapter published as its cause, in `causationid`, which is how anything that saw the line finds the entry it became.
        operationId: $sourceDescriptions.transcriptEvents.sendCommunicationTranscriptEntryCreated
        action: receive
        successCriteria:
          - condition: $message.payload#/data/transcriptId == $workflows.startAndConnect.outputs.transcriptId && $message.payload#/data/kind == 'line'
          - condition: $message.payload#/causationid == $steps.publishLineFinished.outputs.eventId

  - workflowId: stopping
    summary: Stopping
    description: The staff member stops. The session calls its adapter to stop; the adapter sends the end of the audio, publishes the last line the service sends, then publishes that it's done, and the session closes the transcript.
    x-branch: main
    dependsOn: [startAndConnect, eachLine]
    steps:
      - stepId: adapterStub
        x-actors: [adapter]
        description: Takes the session's call to stop streaming
        operationId: $sourceDescriptions.mock.registerHttpStub
        requestBody:
          payload:
            match: {method: POST, url: '/streams/{$workflows.startAndConnect.outputs.sessionId}/stop'}
            response: {status: 202, body: {metadata: {}}}
        successCriteria:
          - condition: $statusCode == 201

      - stepId: stop
        x-actors: [staff, session, adapter]
        description: |
          Stop

          - The session calls its adapter to stop, and is `stopping`. The adapter sends the end of the audio and waits for the last text.
        operationId: $sourceDescriptions.sessions.stopTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptionSessionId
            in: path
            value: $workflows.startAndConnect.outputs.sessionId
        requestBody:
          payload: {at: '2026-10-12T10:00:10Z'}
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'stopping'

      - stepId: publishLastLine
        x-actors: [adapter, transcript]
        description: |
          Publish the last line

          - The last text the service sends after the end of the audio. Still kept: the transcript is still recording, and the line began before it closes.
        operationId: $sourceDescriptions.sessionEvents.sendCommunicationTranscriptionSessionLineFinished
        action: send
        requestBody:
          payload:
            subject: $workflows.startAndConnect.outputs.sessionId
            partitionkey: $workflows.startAndConnect.outputs.sessionId
            data: {transcriptId: $workflows.startAndConnect.outputs.transcriptId, key: r2, text: "Thank you, that's everything.", speaker: staff, startedAt: '2026-10-12T10:00:08Z', endedAt: '2026-10-12T10:00:10Z'}

      - stepId: publishEnded
        x-actors: [adapter, session]
        description: |
          Publish ended

          - The last line is published and the connection closed. The session closes the transcript, at the time the adapter says the last text came in.
          - It's published after the last line with the same partition key, so the transcript keeps the line before it closes.
        operationId: $sourceDescriptions.sessionEvents.sendCommunicationTranscriptionSessionEnded
        action: send
        requestBody:
          payload:
            subject: $workflows.startAndConnect.outputs.sessionId
            partitionkey: $workflows.startAndConnect.outputs.sessionId
            data: {transcriptId: $workflows.startAndConnect.outputs.transcriptId, at: '2026-10-12T10:00:11Z'}

      - stepId: sessionClosed
        x-actors: [session, staff]
        description: 'Status: closed'
        operationId: $sourceDescriptions.sessionEvents.sendCommunicationTranscriptionSessionClosed
        action: receive
        successCriteria:
          - condition: $message.payload#/subject == $workflows.startAndConnect.outputs.sessionId

      - stepId: transcriptClosed
        x-actors: [transcript, staff]
        description: |
          Status: closed

          - This event is the transcript's, and anyone following the transcript gets it.
        operationId: $sourceDescriptions.transcriptEvents.sendCommunicationTranscriptClosed
        action: receive
        successCriteria:
          - condition: $message.payload#/subject == $workflows.startAndConnect.outputs.transcriptId

      - stepId: timeline
        x-actors: [staff, transcript]
        description: |
          Get the timeline

          - Both lines, and nothing from the line in progress.
        operationId: $sourceDescriptions.transcripts.listTranscriptEntries
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptId
            in: path
            value: $workflows.startAndConnect.outputs.transcriptId
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/total == 2
          - condition: $response.body#/items/0/text == 'Can you tell me who lives with you?'
          - condition: $response.body#/items/1/text == "Thank you, that's everything."

  # ── Other situations ──────────────────────────────────────────────────────
  # Each starts its own session, so each can be run on its own.
  - workflowId: rejectedBeforeConnecting
    summary: What's rejected before connecting
    description: A session created without saying which model turns speech into text can't start, and a session that hasn't started can't pause.
    x-branch: other
    steps:
      - stepId: createWithoutAModel
        x-actors: [staff, session]
        description: |
          Create a session without a model

          - The session doesn't check the model. The transcript does, when the session starts it.
        operationId: $sourceDescriptions.sessions.createTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
        requestBody:
          payload:
            profileId: 7a1e0c2d-0000-4000-8000-0000000000f1
            client: interview-assistant/0.1.0
            startedAt: '2026-10-12T11:00:00Z'
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          id: $response.body#/id

      - stepId: startWithoutAModel
        x-actors: [staff, session]
        description: |
          Try to start: rejected (409)

          - Starting starts the transcript, and the transcript rejects it: under a profile that uses a transcription service, a transcript has to say which model turns speech into text.
          - The transcript's `409` comes back as the session's answer, the adapter is never called, and the session stays in `created`.
        operationId: $sourceDescriptions.sessions.startTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptionSessionId
            in: path
            value: $steps.createWithoutAModel.outputs.id
        requestBody:
          payload: {}
        successCriteria:
          - condition: $statusCode == 409

      - stepId: create
        x-actors: [staff, session]
        description: Create a session
        operationId: $sourceDescriptions.sessions.createTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
        requestBody:
          payload:
            profileId: 7a1e0c2d-0000-4000-8000-0000000000f1
            model: standard
            client: interview-assistant/0.1.0
            startedAt: '2026-10-12T11:00:00Z'
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          id: $response.body#/id

      - stepId: pauseBeforeConnecting
        x-actors: [staff, session]
        description: |
          Try to pause before connecting: rejected (409)

          - A session pauses only while connected, when there's audio to take off the record.
        operationId: $sourceDescriptions.sessions.pauseTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptionSessionId
            in: path
            value: $steps.create.outputs.id
        requestBody:
          payload: {at: '2026-10-12T11:00:01Z'}
        successCriteria:
          - condition: $statusCode == 409

  - workflowId: offTheRecord
    summary: Going off the record
    description: The staff member pauses. The session calls its adapter to pause, so nothing said off the record leaves the browser; the adapter publishes the line said just before the pause, and the transcript keeps it. On resume, the session starts the adapter again.
    x-branch: other
    steps:
      - stepId: connected
        x-actors: [staff, session, adapter]
        description: |
          Start and connect, as in the main path

          - Runs the main path's first workflow, on a new session.
        workflowId: startAndConnect
        outputs:
          sessionId: $outputs.sessionId
          transcriptId: $outputs.transcriptId

      - stepId: adapterStubPause
        x-actors: [adapter]
        description: Takes the session's call to pause streaming
        operationId: $sourceDescriptions.mock.registerHttpStub
        requestBody:
          payload:
            match: {method: POST, url: '/streams/{$steps.connected.outputs.sessionId}/pause'}
            response: {status: 202, body: {metadata: {}}}
        successCriteria:
          - condition: $statusCode == 201

      - stepId: pause
        x-actors: [staff, session, adapter]
        description: |
          Pause

          - The session calls its adapter to pause first, so no audio leaves the browser once it's off the record, then pauses the transcript, at the time the staff member says.
        operationId: $sourceDescriptions.sessions.pauseTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptionSessionId
            in: path
            value: $steps.connected.outputs.sessionId
        requestBody:
          payload: {at: '2026-10-12T10:00:10Z'}
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'paused'

      - stepId: paused
        x-actors: [session, staff]
        description: 'Status: paused'
        operationId: $sourceDescriptions.sessionEvents.sendCommunicationTranscriptionSessionPaused
        action: receive
        successCriteria:
          - condition: $message.payload#/subject == $steps.connected.outputs.sessionId

      - stepId: publishLineBeforeThePause
        x-actors: [adapter, transcript]
        description: |
          Publish the line said before the pause

          - On pause, the adapter stops sending audio and asks the service for the text it still has, then closes the connection, so a line said just before the pause still reaches the transcript.
          - The transcript keeps it, though it's paused, because the line started before the pause.
        operationId: $sourceDescriptions.sessionEvents.sendCommunicationTranscriptionSessionLineFinished
        action: send
        requestBody:
          payload:
            subject: $steps.connected.outputs.sessionId
            partitionkey: $steps.connected.outputs.sessionId
            data: {transcriptId: $steps.connected.outputs.transcriptId, key: r1, text: My two kids and my mother., speaker: client, startedAt: '2026-10-12T10:00:07Z', endedAt: '2026-10-12T10:00:09Z'}

      - stepId: lineKept
        x-actors: [transcript, staff]
        description: Entry added
        operationId: $sourceDescriptions.transcriptEvents.sendCommunicationTranscriptEntryCreated
        action: receive
        successCriteria:
          - condition: $message.payload#/data/transcriptId == $steps.connected.outputs.transcriptId && $message.payload#/data/kind == 'line'

      - stepId: stillPaused
        x-actors: [staff, session]
        description: 'Get the session: paused, no connection'
        operationId: $sourceDescriptions.sessions.getTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptionSessionId
            in: path
            value: $steps.connected.outputs.sessionId
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'paused'

      - stepId: adapterStubStart
        x-actors: [adapter]
        description: Takes the session's call to start streaming again
        operationId: $sourceDescriptions.mock.registerHttpStub
        requestBody:
          payload:
            match: {method: POST, url: /streams}
            response: {status: 202, body: {metadata: {}}}
        successCriteria:
          - condition: $statusCode == 201

      - stepId: resume
        x-actors: [staff, session, adapter]
        description: |
          Resume

          - The session resumes the transcript and calls its adapter to start streaming again. It's `connecting`.
        operationId: $sourceDescriptions.sessions.resumeTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptionSessionId
            in: path
            value: $steps.connected.outputs.sessionId
        requestBody:
          payload: {at: '2026-10-12T10:00:20Z'}
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'connecting'

      - stepId: reconnected
        x-actors: [adapter, session]
        description: |
          Connect again, with a new credential

          - The same steps as connecting the first time, on the same session: a new credential, and a new connection.
        workflowId: reconnect
        parameters:
          - name: sessionId
            value: $steps.connected.outputs.sessionId
          - name: transcriptId
            value: $steps.connected.outputs.transcriptId

  - workflowId: newCredential
    summary: Getting a new credential before the old one runs out
    description: Before the credential runs out, the adapter gets a new one from its credentials part without closing the connection. The session isn't involved.
    x-branch: other
    steps:
      - stepId: connected
        x-actors: [staff, session, adapter]
        description: |
          Start and connect, as in the main path

          - Runs the main path's first workflow, on a new session.
        workflowId: startAndConnect
        outputs:
          sessionId: $outputs.sessionId
          transcriptId: $outputs.transcriptId

      - stepId: adapterServerStub
        x-actors: [adapterServer]
        description: Gives a new credential
        operationId: $sourceDescriptions.mock.registerHttpStub
        requestBody:
          payload:
            match: {method: POST, url: /credentials}
            response:
              status: 200
              body: {metadata: {}, provider: fake-transcription, protocol: websocket, url: 'wss://fake-transcription.example/stream', accessToken: fake-service-token-2, tokenType: Bearer, expiresIn: 300}
        successCriteria:
          - condition: $statusCode == 201

      - stepId: renew
        x-actors: [adapter, adapterServer]
        description: |
          Ask for a new credential, keeping the connection

          - The same request as the first time. Asked again, the credentials part gives a fresh credential.
        operationId: $sourceDescriptions.adapter.requestCredentials
        requestBody:
          payload:
            metadata: {transcriptionSessionId: $steps.connected.outputs.sessionId}
            provider: fake-transcription
            model: standard
            languages: [en-US]
            audio: {encoding: linear16, sampleRateHertz: 16000, channelCount: 1}
            protocols: [websocket]
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/accessToken == 'fake-service-token-2'

      - stepId: stillConnected
        x-actors: [staff, session]
        description: |
          Get the session: still connected

          - The connection isn't closed, and nothing is published.
        operationId: $sourceDescriptions.sessions.getTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptionSessionId
            in: path
            value: $steps.connected.outputs.sessionId
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'connected'

  - workflowId: supervisorPauses
    summary: When a supervisor pauses the transcript
    description: A supervisor pauses the transcript directly, not through the session. The session follows the transcript off the record and calls its adapter to pause, as when the staff member pauses. Only the staff member can resume.
    x-branch: other
    steps:
      - stepId: connected
        x-actors: [staff, session, adapter]
        description: |
          Start and connect, as in the main path

          - Runs the main path's first workflow, on a new session.
        workflowId: startAndConnect
        outputs:
          sessionId: $outputs.sessionId
          transcriptId: $outputs.transcriptId

      - stepId: adapterStubPause
        x-actors: [adapter]
        description: Takes the session's call to pause streaming
        operationId: $sourceDescriptions.mock.registerHttpStub
        requestBody:
          payload:
            match: {method: POST, url: '/streams/{$steps.connected.outputs.sessionId}/pause'}
            response: {status: 202, body: {metadata: {}}}
        successCriteria:
          - condition: $statusCode == 201

      - stepId: pauseTheTranscript
        x-actors: [supervisor, transcript]
        description: |
          Pause

          - A request to the transcript, not the session: nobody tells the session.
        operationId: $sourceDescriptions.transcripts.pauseTranscript
        parameters:
          - name: X-Caller-Id
            in: header
            value: supervisor-1
          - name: transcriptId
            in: path
            value: $steps.connected.outputs.transcriptId
        requestBody:
          payload: {at: '2026-10-12T10:00:10Z'}
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'paused'

      - stepId: transcriptPaused
        x-actors: [transcript, session]
        description: |
          Status: paused

          - The session listens for the transcript's events, and finds itself by the transcript's id.
        operationId: $sourceDescriptions.transcriptEvents.sendCommunicationTranscriptPaused
        action: receive
        successCriteria:
          - condition: $message.payload#/subject == $steps.connected.outputs.transcriptId

      - stepId: sessionPaused
        x-actors: [session, staff]
        description: |
          Status: paused

          - The session follows and calls its adapter to pause, as when the staff member pauses.
        operationId: $sourceDescriptions.sessionEvents.sendCommunicationTranscriptionSessionPaused
        action: receive
        successCriteria:
          - condition: $message.payload#/subject == $steps.connected.outputs.sessionId

      - stepId: adapterStubStart
        x-actors: [adapter]
        description: Takes the session's call to start streaming again
        operationId: $sourceDescriptions.mock.registerHttpStub
        requestBody:
          payload:
            match: {method: POST, url: /streams}
            response: {status: 202, body: {metadata: {}}}
        successCriteria:
          - condition: $statusCode == 201

      - stepId: resume
        x-actors: [staff, session, adapter]
        description: |
          Resume

          - The session resumes the transcript and calls its adapter to start streaming again. It's `connecting`.
        operationId: $sourceDescriptions.sessions.resumeTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptionSessionId
            in: path
            value: $steps.connected.outputs.sessionId
        requestBody:
          payload: {at: '2026-10-12T10:00:20Z'}
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'connecting'

      - stepId: reconnected
        x-actors: [adapter, session]
        description: Connect again, with a new credential
        workflowId: reconnect
        parameters:
          - name: sessionId
            value: $steps.connected.outputs.sessionId
          - name: transcriptId
            value: $steps.connected.outputs.transcriptId

  - workflowId: connectionDrops
    summary: When the connection drops
    description: The connection to the service drops partway through. The adapter publishes that, connects again with a new credential, and publishes how long nothing was captured, which the transcript keeps as a gap.
    x-branch: other
    steps:
      - stepId: connected
        x-actors: [staff, session, adapter]
        description: |
          Start and connect, as in the main path

          - Runs the main path's first workflow, on a new session.
        workflowId: startAndConnect
        outputs:
          sessionId: $outputs.sessionId
          transcriptId: $outputs.transcriptId

      - stepId: publishLineFinished
        x-actors: [adapter, transcript]
        description: |
          Publish the finished line

          - What the service sent before the connection dropped is kept.
        operationId: $sourceDescriptions.sessionEvents.sendCommunicationTranscriptionSessionLineFinished
        action: send
        requestBody:
          payload:
            subject: $steps.connected.outputs.sessionId
            partitionkey: $steps.connected.outputs.sessionId
            data: {transcriptId: $steps.connected.outputs.transcriptId, key: r1, text: I work at the grocery store., speaker: client, startedAt: '2026-10-12T10:00:02Z', endedAt: '2026-10-12T10:00:03Z'}

      - stepId: lineKept
        x-actors: [transcript, staff]
        description: Entry added
        operationId: $sourceDescriptions.transcriptEvents.sendCommunicationTranscriptEntryCreated
        action: receive
        successCriteria:
          - condition: $message.payload#/data/transcriptId == $steps.connected.outputs.transcriptId && $message.payload#/data/kind == 'line'

      - stepId: publishDisconnected
        x-actors: [adapter, session]
        description: |
          Publish disconnected

          - The adapter saw the connection close. The session follows it to `disconnected`, and the adapter tries again.
        operationId: $sourceDescriptions.sessionEvents.sendCommunicationTranscriptionSessionDisconnected
        action: send
        requestBody:
          payload:
            subject: $steps.connected.outputs.sessionId
            partitionkey: $steps.connected.outputs.sessionId
            data: {transcriptId: $steps.connected.outputs.transcriptId, at: '2026-10-12T10:00:04Z'}

      - stepId: disconnected
        x-actors: [staff, session]
        description: 'Get the session: disconnected'
        operationId: $sourceDescriptions.sessions.getTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptionSessionId
            in: path
            value: $steps.connected.outputs.sessionId
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'disconnected'

      - stepId: reconnected
        x-actors: [adapter, session]
        description: |
          Connect again, with a new credential and how long nothing was captured

          - The transcript keeps that stretch as a gap, with `cause` `connection`, after the line from before the drop.
        workflowId: reconnect
        parameters:
          - name: sessionId
            value: $steps.connected.outputs.sessionId
          - name: transcriptId
            value: $steps.connected.outputs.transcriptId
          - name: gap
            value: {startedAt: '2026-10-12T10:00:04Z', endedAt: '2026-10-12T10:00:08Z'}

      - stepId: gapKept
        x-actors: [transcript, staff]
        description: |
          Entry added: the gap
        operationId: $sourceDescriptions.transcriptEvents.sendCommunicationTranscriptEntryCreated
        action: receive
        successCriteria:
          - condition: $message.payload#/data/transcriptId == $steps.connected.outputs.transcriptId && $message.payload#/data/kind == 'gap'

  - workflowId: connectingFails
    summary: When connecting again fails
    description: The connection drops, and the service rejects the new one. The adapter gives up and publishes that, and the session fails, but the transcript stays open for a new session to pick up.
    x-branch: other
    steps:
      - stepId: connected
        x-actors: [staff, session, adapter]
        description: |
          Start and connect, as in the main path

          - Runs the main path's first workflow, on a new session.
        workflowId: startAndConnect
        outputs:
          sessionId: $outputs.sessionId
          transcriptId: $outputs.transcriptId

      - stepId: publishDisconnected
        x-actors: [adapter, session]
        description: |
          Publish disconnected

          - The connection to the service drops.
        operationId: $sourceDescriptions.sessionEvents.sendCommunicationTranscriptionSessionDisconnected
        action: send
        requestBody:
          payload:
            subject: $steps.connected.outputs.sessionId
            partitionkey: $steps.connected.outputs.sessionId
            data: {transcriptId: $steps.connected.outputs.transcriptId, at: '2026-10-12T10:00:03Z'}

      - stepId: adapterServerStub
        x-actors: [adapterServer]
        description: Gives a new credential
        operationId: $sourceDescriptions.mock.registerHttpStub
        requestBody:
          payload:
            match: {method: POST, url: /credentials}
            response:
              status: 200
              body: {metadata: {}, provider: fake-transcription, protocol: websocket, url: 'wss://fake-transcription.example/stream', accessToken: fake-service-token, tokenType: Bearer, expiresIn: 300}
        successCriteria:
          - condition: $statusCode == 201

      - stepId: requestCredentialsAgain
        x-actors: [adapter, adapterServer]
        description: Ask for credentials
        operationId: $sourceDescriptions.adapter.requestCredentials
        requestBody:
          payload:
            metadata: {transcriptionSessionId: $steps.connected.outputs.sessionId}
            provider: fake-transcription
            model: standard
            languages: [en-US]
            audio: {encoding: linear16, sampleRateHertz: 16000, channelCount: 1}
            protocols: [websocket]
        successCriteria:
          - condition: $statusCode == 200

      - stepId: publishFailed
        x-actors: [adapter, session]
        description: |
          Publish failed

          - The adapter connects again with the new credential, and the service refuses. After as many tries as it allows, the adapter gives up. The session follows it to `failed`.
        operationId: $sourceDescriptions.sessionEvents.sendCommunicationTranscriptionSessionFailed
        action: send
        requestBody:
          payload:
            subject: $steps.connected.outputs.sessionId
            partitionkey: $steps.connected.outputs.sessionId
            data: {transcriptId: $steps.connected.outputs.transcriptId, reason: The service is unavailable.}

      - stepId: failed
        x-actors: [staff, session]
        description: 'Get the session: failed'
        operationId: $sourceDescriptions.sessions.getTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptionSessionId
            in: path
            value: $steps.connected.outputs.sessionId
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'failed'

      - stepId: transcriptStillOpen
        x-actors: [staff, transcript]
        description: |
          Get the transcript: still recording

          - A session failing doesn't close its transcript, so a new session can pick it up.
        operationId: $sourceDescriptions.transcripts.getTranscript
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptId
            in: path
            value: $steps.connected.outputs.transcriptId
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'recording'
    outputs:
      transcriptId: $steps.connected.outputs.transcriptId

  - workflowId: newSessionPicksUp
    summary: A new session picks up the transcript
    description: After the page reloads, or a session fails, a new session carries on the same transcript. The session gives its adapter when the transcript last heard from anyone, and the adapter publishes the time since as a gap when it connects.
    x-branch: other
    dependsOn: [connectingFails]
    steps:
      - stepId: create
        x-actors: [staff, session]
        description: |
          Create a session for the same transcript

          - Given the transcript's id instead of a profile: the page kept it, or found it by who the conversation is about.
        operationId: $sourceDescriptions.sessions.createTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
        requestBody:
          payload:
            transcriptId: $workflows.connectingFails.outputs.transcriptId
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          id: $response.body#/id

      - stepId: adapterStub
        x-actors: [adapter]
        description: Takes the session's call to start streaming
        operationId: $sourceDescriptions.mock.registerHttpStub
        requestBody:
          payload:
            match: {method: POST, url: /streams}
            response: {status: 202, body: {metadata: {}}}
        successCriteria:
          - condition: $statusCode == 201

      - stepId: start
        x-actors: [staff, session, adapter]
        description: |
          Start

          - The session already names a transcript, so no new one is started. It calls its adapter with when the transcript last heard from anyone.
        operationId: $sourceDescriptions.sessions.startTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptionSessionId
            in: path
            value: $steps.create.outputs.id
        requestBody:
          payload: {}
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'connecting'

      - stepId: connecting
        x-actors: [session, staff]
        description: 'Status: connecting'
        operationId: $sourceDescriptions.sessionEvents.sendCommunicationTranscriptionSessionConnecting
        action: receive
        successCriteria:
          - condition: $message.payload#/subject == $steps.create.outputs.id

      - stepId: reconnected
        x-actors: [adapter, session]
        description: |
          Connect, with how long nothing was captured

          - The gap runs from when the transcript was last heard from to now. The transcript keeps it.
        workflowId: reconnect
        parameters:
          - name: sessionId
            value: $steps.create.outputs.id
          - name: transcriptId
            value: $workflows.connectingFails.outputs.transcriptId
          - name: gap
            value: {startedAt: '2026-10-12T10:00:00Z', endedAt: '2026-10-12T10:01:00Z'}

      - stepId: gapKept
        x-actors: [transcript, staff]
        description: |
          Entry added: the gap

          - On the same transcript the failed session started.
        operationId: $sourceDescriptions.transcriptEvents.sendCommunicationTranscriptEntryCreated
        action: receive
        successCriteria:
          - condition: $message.payload#/data/transcriptId == $workflows.connectingFails.outputs.transcriptId && $message.payload#/data/kind == 'gap'

  - workflowId: nothingAdded
    summary: When nothing is added for 30 minutes
    description: A transcript nobody adds anything to closes itself once its profile's time limit passes, so one left open by mistake doesn't stay open forever. The transcript asks the platform's scheduler to check back, and closes if nothing was added when the check comes.
    x-branch: other
    steps:
      - stepId: schedulerStub
        x-actors: [scheduler]
        description: |
          Sends each check back at once, instead of when it's due

          - Nobody waits 30 minutes in a demo. This stub answers the next request for an idle check at once, as if the time had passed.
        operationId: $sourceDescriptions.mock.registerEventStub
        requestBody:
          payload:
            'on': platform.timer.requested
            match:
              data.callback.event: communication.transcript.idle_check
        successCriteria:
          - condition: $statusCode == 201

      - stepId: start
        x-actors: [staff, transcript]
        description: |
          Start a transcript, then add nothing

          - Under `english-interviews-30-minutes`, a profile the harness seeds: the same as `english-interviews`, but a transcript under it closes after 30 minutes with nothing added.
          - In a conversation, the session starts the transcript when it starts. This starts it directly, because the scheduler's stub answers at once: through the session, the transcript would close before the session finished connecting.
        operationId: $sourceDescriptions.transcripts.createTranscript
        parameters:
          - reference: $components.parameters.caller
        requestBody:
          payload:
            # english-interviews-30-minutes, seeded by overlays/transcription-profiles.yaml
            profileId: 7a1e0c2d-0000-4000-8000-0000000000f2
            model: standard
            client: interview-assistant/0.1.0
            startedAt: '2026-10-12T12:00:00Z'
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          transcriptId: $response.body#/id

      - stepId: idleCheck
        x-actors: [scheduler, transcript]
        description: |
          Check: has anything been added?

          - When it started, the transcript asked the scheduler for this reminder, due after its profile's time limit. The stub sent it back at once.
          - The reminder says when it was asked for. Nothing was added since, so the transcript closes.
        operationId: $sourceDescriptions.transcriptEvents.receiveCommunicationTranscriptIdleCheck
        action: receive

      - stepId: closed
        x-actors: [transcript, staff]
        description: |
          Status: closed

          - Nobody asked for it to close, so the event is from the system.
        operationId: $sourceDescriptions.transcriptEvents.sendCommunicationTranscriptClosed
        action: receive
        successCriteria:
          - condition: $message.payload#/subject == $steps.start.outputs.transcriptId
          - condition: $message.payload#/authtype == 'system'

      - stepId: whenItClosed
        x-actors: [staff, transcript]
        description: |
          Get the transcript: closed as of when it started

          - It closed as of the last time anything happened, here when it started, not when the check came.
        operationId: $sourceDescriptions.transcripts.getTranscript
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptId
            in: path
            value: $steps.start.outputs.transcriptId
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'closed'
          - condition: $response.body#/closedAt == '2026-10-12T12:00:00Z'

  # ── Run as a step by the other situations, not walked on its own ──────────
  - workflowId: reconnect
    summary: Connect again, with a new credential
    description: The adapter gets a new credential, connects again, and publishes that it's connected, with a gap when one is given.
    inputs:
      type: object
      required: [sessionId, transcriptId]
      properties:
        sessionId: {type: string}
        transcriptId: {type: string}
        gap: {type: object}
    steps:
      - stepId: adapterServerStub
        x-actors: [adapterServer]
        description: Gives a new credential
        operationId: $sourceDescriptions.mock.registerHttpStub
        requestBody:
          payload:
            match: {method: POST, url: /credentials}
            response:
              status: 200
              body: {metadata: {}, provider: fake-transcription, protocol: websocket, url: 'wss://fake-transcription.example/stream', accessToken: fake-service-token, tokenType: Bearer, expiresIn: 300}
        successCriteria:
          - condition: $statusCode == 201

      - stepId: requestCredentials
        x-actors: [adapter, adapterServer]
        description: Ask for credentials
        operationId: $sourceDescriptions.adapter.requestCredentials
        requestBody:
          payload:
            metadata: {transcriptionSessionId: $inputs.sessionId}
            provider: fake-transcription
            model: standard
            languages: [en-US]
            audio: {encoding: linear16, sampleRateHertz: 16000, channelCount: 1}
            protocols: [websocket]
        successCriteria:
          - condition: $statusCode == 200

      - stepId: publishConnected
        x-actors: [adapter, session]
        description: |
          Publish connected

          - With a gap, if one is given: how long nothing was captured, which the transcript keeps.
        operationId: $sourceDescriptions.sessionEvents.sendCommunicationTranscriptionSessionConnected
        action: send
        requestBody:
          payload:
            subject: $inputs.sessionId
            partitionkey: $inputs.sessionId
            data: {transcriptId: $inputs.transcriptId, gap: $inputs.gap}

      - stepId: connected
        x-actors: [staff, session]
        description: 'Get the session: connected'
        operationId: $sourceDescriptions.sessions.getTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptionSessionId
            in: path
            value: $inputs.sessionId
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'connected'
