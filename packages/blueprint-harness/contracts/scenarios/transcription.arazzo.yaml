  - workflowId: nothingAdded
    summary: When nothing is added for 30 minutes
    description: A transcript nobody adds anything to closes itself once its profile's time limit passes, so one left open by mistake doesn't stay open forever. The transcript asks the platform's scheduler to check back, and closes if nothing was added when the check comes.
    x-branch: other
    steps:
      - stepId: schedulerStub
        x-actors: [scheduler]
        description: |
          Sends each check back at once, instead of when it's due

          - Nobody waits 30 minutes in a demo. This stub answers the next request for an idle check at once, as if the time had passed.
        operationId: $sourceDescriptions.mock.registerEventStub
        requestBody:
          payload:
            'on': platform.timer.requested
            match:
              data.callback.event: communication.idle_check
        successCriteria:
          - condition: $statusCode == 201

      - stepId: start
        x-actors: [client, transcript]
        description: |
          Start a transcript, then add nothing

          - Under `english-interviews-30-minutes`, a profile the harness seeds: the same as `english-interviews`, but a transcript under it closes after 30 minutes with nothing added.
          - In a conversation, the session starts the transcript the first time the client asks how to connect. This starts it directly, because the scheduler's stub answers at once: through the session, the transcript would close before the session finished connecting.
        operationId: $sourceDescriptions.transcripts.createTranscript
        parameters:
          - reference: $components.parameters.caller
        requestBody:
          payload:
            # english-interviews-30-minutes, seeded by overlays/transcription-profiles.yaml
            profileId: 7a1e0c2d-0000-4000-8000-0000000000f2
            model: standard
            client: interview-assistant/0.1.0
            startedAt: '2026-10-12T12:00:00Z'
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          transcriptId: $response.body#/id

      - stepId: idleCheck
        x-actors: [scheduler, transcript]
        description: |
          Check: has anything been added?

          - When it started, the transcript asked the scheduler for this reminder, due after its profile's time limit. The stub sent it back at once.
          - The reminder says when it was asked for. Nothing was added since, so the transcript closes.
        operationId: $sourceDescriptions.transcriptEvents.receiveCommunicationIdleCheck
        action: receive

      - stepId: closed
        x-actors: [transcript, client]
        description: |
          Status: closed

          - Nobody asked for it to close, so the event is from the system.
        operationId: $sourceDescriptions.transcriptEvents.sendCommunicationTranscriptClosed
        action: receive
        successCriteria:
          - condition: $message.payload#/subject == $steps.start.outputs.transcriptId
          - condition: $message.payload#/authtype == 'system'

      - stepId: whenItClosed
        x-actors: [client, transcript]
        description: |
          Get the transcript: closed as of when it started

          - It closed as of the last time anything happened, here when it started, not when the check came.
        operationId: $sourceDescriptions.transcripts.getTranscript
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptId
            in: path
            value: $steps.start.outputs.transcriptId
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'closed'
          - condition: $response.body#/closedAt == '2026-10-12T12:00:00Z'

