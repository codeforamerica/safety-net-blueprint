        operationId: $sourceDescriptions.audio.receiveStart
        action: send
        parameters:
          - name: Sec-WebSocket-Protocol
            in: header
            value: '{$steps.getConnection.outputs.subprotocol}, {$steps.getConnection.outputs.accessToken}'
        requestBody:
          payload: {type: start, audio: {encoding: linear16, sampleRateHertz: 16000, channelCount: 1}, languages: [en-US]}

      - stepId: started
        x-actors: [service, client]
        description: Ready
        operationId: $sourceDescriptions.audio.sendStarted
        action: receive

      - stepId: connect
        x-actors: [client, session]
        description: |
          Connection open

          - With a gap, if one is given: how long nothing was recorded, which the session adds to the transcript.
        operationId: $sourceDescriptions.sessions.connectTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptionSessionId
            in: path
            value: $inputs.sessionId
        requestBody:
          payload: {gap: $inputs.gap}
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'connected'

      - stepId: connected
        x-actors: [session, client]
        description: 'Status: connected'
        operationId: $sourceDescriptions.sessionEvents.sendCommunicationTranscriptionSessionConnected
        action: receive
        successCriteria:
          - condition: $message.payload#/subject == $inputs.sessionId
