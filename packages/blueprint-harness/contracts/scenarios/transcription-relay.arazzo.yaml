arazzo: 1.1.0
info:
  title: Transcribing a spoken conversation through a relay
  version: 1.0.0
  x-domain: communication
  x-capability: transcripts
  description: |
    A staff member transcribes a conversation as it's spoken, using a service the browser can't reach, such as Google Cloud Speech-to-Text. The session's adapter, in their browser, sends the audio to the state's relay instead, which passes it on to the service, and publishes what happens as the session's events; the transcript keeps the lines on the server. The adapter's credentials part gives the adapter a token for the relay.

    The main path starts, transcribes one line and stops. The other situations are the ones where the relay does something of its own. The rest run the same as without a relay, with the relay where the service is.
  # Who acts in the scenario. A step lists them in x-actors in the order they
  # act, starting with the one who starts the step; the page shows them as
  # A → B. A stub step lists the one part it stands in for.
  x-actors:
    - id: staff
      name: Staff member
      description: Starts, pauses, resumes and stops transcribing, from their browser.
    - id: session
      name: Session
      description: Keeps track of the connection, and calls its adapter to start, pause and stop. It runs in the browser; in this demo, the mock runs it.
    - id: adapter
      name: Adapter's streaming part
      description: The session's adapter. It sends the audio to the relay and publishes what happens as the session's events. This scenario plays its part; a stub takes the session's calls to it.
    - id: transcript
      name: Transcript
      description: Keeps the transcript and its rules, on the server. In this demo, the mock runs it.
    - id: relay
      name: Relay
      description: The state's server in front of a service the browser can't reach. It speaks the blueprint's relay contract to the adapter and the service's own API to the service. In this demo, the mock stands in for it with stubs.
    - id: adapterServer
      name: Adapter's credentials part
      description: The adapter's credentials part, on the state's server, which signs a short-lived token for the relay. In this demo, the mock stands in for it with stubs.
sourceDescriptions:
  # Relative to the resolved contract set, where the framework's documents sit
  # under base/.
  - name: sessions
    url: ../base/domains/communication/communication-transcription-sessions-openapi.yaml
    type: openapi
  - name: sessionEvents
    url: ../base/domains/communication/communication-transcription-sessions-events-asyncapi.yaml
    type: asyncapi
  # The session's adapter: the calls the session makes to it, and its server
  # part's credentials.
  - name: adapter
    url: ../base/domains/communication/communication-transcription-sessions-adapter-openapi.yaml
    type: openapi
  - name: transcripts
    url: ../base/domains/communication/communication-transcripts-openapi.yaml
    type: openapi
  - name: transcriptEvents
    url: ../base/domains/communication/communication-transcripts-events-asyncapi.yaml
    type: asyncapi
  # The relay contract, which every relay speaks.
  - name: audio
    url: ../base/domains/communication/communication-transcripts-relay-asyncapi.yaml
    type: asyncapi
  # The mock's own routes, to stand in for the adapter and the relay. This
  # makes the scenario one to run against the mock.
  - name: mock
    url: https://blueprint.codeforamerica.org/mock/mock-openapi.yaml
    type: openapi
components:
  parameters:
    caller:
      name: X-Caller-Id
      in: header
      value: worker-1
workflows:
  # ── The main path ─────────────────────────────────────────────────────────
  - workflowId: startAndConnect
    summary: Starting and connecting
    description: The staff member starts transcribing. The session starts a transcript and calls its adapter, which gets the relay's address and a token for it, connects to the relay, and publishes that it's connected.
    x-branch: main
    steps:
      - stepId: create
        x-actors: [staff, session]
        description: |
          Create a session, under the Google Cloud Speech-to-Text profile

          - Google's service takes only gRPC, which a browser can't speak, so the state runs a relay in front of it. The profile names the service; where the relay is, is the adapter's setting.
          - The profile, `english-google`, is one the harness seeds, as a state seeds its own.
        operationId: $sourceDescriptions.sessions.createTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
        requestBody:
          payload:
            # english-google, seeded by overlays/transcription-profiles.yaml
            profileId: 7a1e0c2d-0000-4000-8000-0000000000f3
            model: latest_long
            client: interview-assistant/0.1.0
            startedAt: '2026-10-12T10:00:00Z'
        successCriteria:
          - condition: $statusCode == 201
          - condition: $response.body#/status == 'created'
        outputs:
          id: $response.body#/id

      - stepId: adapterStub
        x-actors: [adapter]
        description: |
          Takes the session's call to start streaming

          - This scenario plays the adapter, so a stub takes the call, and the adapter's work follows in the steps below.
        operationId: $sourceDescriptions.mock.registerHttpStub
        requestBody:
          payload:
            match: {method: POST, url: /streams}
            response: {status: 202, body: {metadata: {}}}
        successCriteria:
          - condition: $statusCode == 201

      - stepId: start
        x-actors: [staff, session, adapter]
        description: |
          Start

          - The session starts a transcript, reads the profile for the service and languages, and calls its adapter to start streaming. It's `connecting`.
        operationId: $sourceDescriptions.sessions.startTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptionSessionId
            in: path
            value: $steps.create.outputs.id
        requestBody:
          payload: {}
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'connecting'
        outputs:
          transcriptId: $response.body#/transcriptId

      - stepId: connecting
        x-actors: [session, staff]
        description: 'Status: connecting'
        operationId: $sourceDescriptions.sessionEvents.sendCommunicationTranscriptionSessionConnecting
        action: receive
        successCriteria:
          - condition: $message.payload#/subject == $steps.create.outputs.id

      - stepId: adapterServerStub
        x-actors: [adapterServer]
        description: |
          Gives a token for the relay

          - For a service behind a relay, the adapter's credentials part answers with the relay's address, the relay contract's `subprotocol`, and a token it signed itself for the relay, lasting a minute. It calls nothing to make it.
        operationId: $sourceDescriptions.mock.registerHttpStub
        requestBody:
          payload:
            match: {method: POST, url: /credentials}
            response:
              status: 200
              body:
                metadata: {}
                provider: google-cloud-speech
                protocol: websocket
                url: wss://relay.example/transcribe
                subprotocol: blueprint.transcripts.relay.v1
                accessToken: eyJhbGciOiJFUzI1NiIsImtpZCI6InJlbGF5LTIwMjYtMTEiLCJ0eXAiOiJKV1QifQ.eyJhdWQiOiJ3c3M6Ly9yZWxheS5leGFtcGxlL3RyYW5zY3JpYmUiLCJpYXQiOjE3OTA2NzI0MDAsImV4cCI6MTc5MDY3MjQ2MH0.c2lnbmF0dXJl
                tokenType: Bearer
                expiresIn: 60
        successCriteria:
          - condition: $statusCode == 201

      - stepId: requestCredentials
        x-actors: [adapter, adapterServer]
        description: |
          Ask for credentials

          - The same request as without a relay, with the same shape of answer. `subprotocol` tells the adapter the connection uses the relay contract.
        operationId: $sourceDescriptions.adapter.requestCredentials
        requestBody:
          payload:
            metadata: {transcriptionSessionId: $steps.create.outputs.id}
            provider: google-cloud-speech
            model: latest_long
            languages: [en-US]
            audio: {encoding: linear16, sampleRateHertz: 16000, channelCount: 1}
            protocols: [websocket]
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/provider == 'google-cloud-speech'
          - condition: $response.body#/subprotocol == 'blueprint.transcripts.relay.v1'
          - condition: $response.body#/expiresIn == 60
        outputs:
          subprotocol: $response.body#/subprotocol
          accessToken: $response.body#/accessToken

      - stepId: relayStub
        x-actors: [relay]
        description: Answers a new connection with ready
        operationId: $sourceDescriptions.mock.registerWsStub
        requestBody:
          payload:
            channel: communication-transcripts-relay-asyncapi.yaml#/channels/audio
            'on': start
            send: [{type: started}]
        successCriteria:
          - condition: $statusCode == 201

      - stepId: sendStart
        x-actors: [adapter, relay]
        description: |
          Open the connection, with the audio format

          - These messages are the blueprint's relay contract, the same for every relay. Without a relay, the adapter would use the service's own messages instead.
          - The token goes in the `Sec-WebSocket-Protocol` header rather than the URL, since URLs get logged. The relay checks it before taking the connection, then opens its own connection to Google, through Google's API.
        operationId: $sourceDescriptions.audio.receiveStart
        action: send
        parameters:
          - name: Sec-WebSocket-Protocol
            in: header
            value: '{$steps.requestCredentials.outputs.subprotocol}, {$steps.requestCredentials.outputs.accessToken}'
        requestBody:
          payload:
            type: start
            audio: {encoding: linear16, sampleRateHertz: 16000, channelCount: 1}
            languages: [en-US]
            model: latest_long

      - stepId: started
        x-actors: [relay, adapter]
        description: Ready
        operationId: $sourceDescriptions.audio.sendStarted
        action: receive

      - stepId: publishConnected
        x-actors: [adapter, session]
        description: |
          Publish connected

          - The session follows it to `connected`.
        operationId: $sourceDescriptions.sessionEvents.sendCommunicationTranscriptionSessionConnected
        action: send
        requestBody:
          payload:
            subject: $steps.create.outputs.id
            partitionkey: $steps.create.outputs.id
            data: {transcriptId: $steps.start.outputs.transcriptId}

      - stepId: connected
        x-actors: [staff, session]
        description: 'Get the session: connected'
        operationId: $sourceDescriptions.sessions.getTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptionSessionId
            in: path
            value: $steps.create.outputs.id
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'connected'
    outputs:
      sessionId: $steps.create.outputs.id
      transcriptId: $steps.start.outputs.transcriptId

  - workflowId: eachLine
    summary: Each line spoken
    description: One line is spoken. The relay sends Google's text while it's in progress and once it's final, in the relay contract's shape, and the adapter publishes each as the session's event. The transcript keeps the finished line.
    x-branch: main
    dependsOn: [startAndConnect]
    steps:
      - stepId: keepalive
        x-actors: [adapter, relay]
        description: |
          Keep-alive, while nobody is speaking

          - Sent when no audio has gone for a while, since code in a browser can't send a WebSocket ping. Nothing answers it.
        operationId: $sourceDescriptions.audio.receiveKeepalive
        action: send
        requestBody:
          payload: {type: keepalive}

      - stepId: relayStub
        x-actors: [relay]
        description: Answers the audio with text in progress, then the final text
        operationId: $sourceDescriptions.mock.registerWsStub
        requestBody:
          payload:
            channel: communication-transcripts-relay-asyncapi.yaml#/channels/audio
            'on': audio
            send:
              - {type: result, id: r1, isFinal: false, startOffsetMs: 5000, endOffsetMs: 5600, speaker: spk_0, alternatives: [{transcript: Can you tell me who}]}
              - {type: result, id: r1, isFinal: true, startOffsetMs: 5000, endOffsetMs: 6000, speaker: spk_0, alternatives: [{transcript: Can you tell me who lives with you?, confidence: 0.94}]}
        successCriteria:
          - condition: $statusCode == 201

      - stepId: sendAudio
        x-actors: [adapter, relay]
        description: Audio
        operationId: $sourceDescriptions.audio.receiveAudio
        action: send
        requestBody:
          payload: (16-bit PCM audio)

      - stepId: textInProgress
        x-actors: [relay, adapter]
        description: |
          Text in progress

          - The relay sends Google's results in the relay contract's shape, so the adapter handles them as it would any relay's.
        operationId: $sourceDescriptions.audio.sendResult
        action: receive
        successCriteria:
          - condition: $message.payload#/isFinal == false
        outputs:
          key: $message.payload#/id
          text: $message.payload#/alternatives/0/transcript

      - stepId: publishLineUpdated
        x-actors: [adapter, staff]
        description: Publish the line in progress
        operationId: $sourceDescriptions.sessionEvents.sendCommunicationTranscriptionSessionLineUpdated
        action: send
        requestBody:
          payload:
            subject: $workflows.startAndConnect.outputs.sessionId
            partitionkey: $workflows.startAndConnect.outputs.sessionId
            data:
              transcriptId: $workflows.startAndConnect.outputs.transcriptId
              key: $steps.textInProgress.outputs.key
              text: $steps.textInProgress.outputs.text
              speaker: staff
              startedAt: '2026-10-12T10:00:05Z'

      - stepId: finalText
        x-actors: [relay, adapter]
        description: Final text
        operationId: $sourceDescriptions.audio.sendResult
        action: receive
        successCriteria:
          - condition: $message.payload#/isFinal == true
        outputs:
          key: $message.payload#/id
          text: $message.payload#/alternatives/0/transcript

      - stepId: publishLineFinished
        x-actors: [adapter, transcript]
        description: Publish the finished line
        operationId: $sourceDescriptions.sessionEvents.sendCommunicationTranscriptionSessionLineFinished
        action: send
        requestBody:
          payload:
            subject: $workflows.startAndConnect.outputs.sessionId
            partitionkey: $workflows.startAndConnect.outputs.sessionId
            data:
              transcriptId: $workflows.startAndConnect.outputs.transcriptId
              key: $steps.finalText.outputs.key
              text: $steps.finalText.outputs.text
              speaker: staff
              startedAt: '2026-10-12T10:00:05Z'
              endedAt: '2026-10-12T10:00:06Z'
        outputs:
          eventId: $response.body#/id

      - stepId: lineKept
        x-actors: [transcript, staff]
        description: |
          Entry added

          - It names the `line_finished` the adapter published as its cause, in `causationid`, which is how anything that saw the line finds the entry it became.
        operationId: $sourceDescriptions.transcriptEvents.sendCommunicationTranscriptEntryCreated
        action: receive
        successCriteria:
          - condition: $message.payload#/data/transcriptId == $workflows.startAndConnect.outputs.transcriptId && $message.payload#/data/kind == 'line'
          - condition: $message.payload#/causationid == $steps.publishLineFinished.outputs.eventId

  - workflowId: stopping
    summary: Stopping
    description: The staff member stops. The session calls its adapter to stop; the adapter sends the end of the audio to the relay, publishes the last line, then publishes that it's done, and the session closes the transcript.
    x-branch: main
    dependsOn: [startAndConnect, eachLine]
    steps:
      - stepId: adapterStub
        x-actors: [adapter]
        description: Takes the session's call to stop streaming
        operationId: $sourceDescriptions.mock.registerHttpStub
        requestBody:
          payload:
            match: {method: POST, url: '/streams/{$workflows.startAndConnect.outputs.sessionId}/stop'}
            response: {status: 202, body: {metadata: {}}}
        successCriteria:
          - condition: $statusCode == 201

      - stepId: stop
        x-actors: [staff, session, adapter]
        description: Stop
        operationId: $sourceDescriptions.sessions.stopTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptionSessionId
            in: path
            value: $workflows.startAndConnect.outputs.sessionId
        requestBody:
          payload: {at: '2026-10-12T10:00:10Z'}
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'stopping'

      - stepId: relayStub
        x-actors: [relay]
        description: Answers the end of the audio with the last text and done, then closes the connection
        operationId: $sourceDescriptions.mock.registerWsStub
        requestBody:
          payload:
            channel: communication-transcripts-relay-asyncapi.yaml#/channels/audio
            'on': end
            send:
              - {type: result, id: r2, isFinal: true, startOffsetMs: 8500, endOffsetMs: 10200, speaker: spk_0, alternatives: [{transcript: "Thank you, that's everything."}]}
              - {type: ended}
            close: {code: 1000}
        successCriteria:
          - condition: $statusCode == 201

      - stepId: sendEnd
        x-actors: [adapter, relay]
        description: End of the audio
        operationId: $sourceDescriptions.audio.receiveEnd
        action: send
        requestBody:
          payload: {type: end}

      - stepId: lastText
        x-actors: [relay, adapter]
        description: Last text
        operationId: $sourceDescriptions.audio.sendResult
        action: receive
        successCriteria:
          - condition: $message.payload#/id == 'r2'
        outputs:
          key: $message.payload#/id
          text: $message.payload#/alternatives/0/transcript

      - stepId: publishLastLine
        x-actors: [adapter, transcript]
        description: Publish the last line
        operationId: $sourceDescriptions.sessionEvents.sendCommunicationTranscriptionSessionLineFinished
        action: send
        requestBody:
          payload:
            subject: $workflows.startAndConnect.outputs.sessionId
            partitionkey: $workflows.startAndConnect.outputs.sessionId
            data: {transcriptId: $workflows.startAndConnect.outputs.transcriptId, key: $steps.lastText.outputs.key, text: $steps.lastText.outputs.text, speaker: staff, startedAt: '2026-10-12T10:00:08Z', endedAt: '2026-10-12T10:00:10Z'}

      - stepId: ended
        x-actors: [relay, adapter]
        description: Done
        operationId: $sourceDescriptions.audio.sendEnded
        action: receive

      - stepId: publishEnded
        x-actors: [adapter, session]
        description: |
          Publish ended

          - The session closes the transcript.
        operationId: $sourceDescriptions.sessionEvents.sendCommunicationTranscriptionSessionEnded
        action: send
        requestBody:
          payload:
            subject: $workflows.startAndConnect.outputs.sessionId
            partitionkey: $workflows.startAndConnect.outputs.sessionId
            data: {transcriptId: $workflows.startAndConnect.outputs.transcriptId, at: '2026-10-12T10:00:11Z'}

      - stepId: transcriptClosed
        x-actors: [transcript, staff]
        description: 'Status: closed'
        operationId: $sourceDescriptions.transcriptEvents.sendCommunicationTranscriptClosed
        action: receive
        successCriteria:
          - condition: $message.payload#/subject == $workflows.startAndConnect.outputs.transcriptId

      - stepId: timeline
        x-actors: [staff, transcript]
        description: Get the timeline
        operationId: $sourceDescriptions.transcripts.listTranscriptEntries
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptId
            in: path
            value: $workflows.startAndConnect.outputs.transcriptId
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/total == 2

  # ── Other situations ──────────────────────────────────────────────────────
  - workflowId: tokenExpired
    summary: When the token has expired
    description: The adapter connects with a token kept from an earlier connection, which has run out. The relay rejects it, and the adapter asks its credentials part for a new one.
    x-branch: other
    steps:
      - stepId: create
        x-actors: [staff, session]
        description: Create a session, under the Google Cloud Speech-to-Text profile
        operationId: $sourceDescriptions.sessions.createTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
        requestBody:
          payload:
            profileId: 7a1e0c2d-0000-4000-8000-0000000000f3
            model: latest_long
            client: interview-assistant/0.1.0
            startedAt: '2026-10-12T11:00:00Z'
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          id: $response.body#/id

      - stepId: adapterStub
        x-actors: [adapter]
        description: Takes the session's call to start streaming
        operationId: $sourceDescriptions.mock.registerHttpStub
        requestBody:
          payload:
            match: {method: POST, url: /streams}
            response: {status: 202, body: {metadata: {}}}
        successCriteria:
          - condition: $statusCode == 201

      - stepId: start
        x-actors: [staff, session, adapter]
        description: Start
        operationId: $sourceDescriptions.sessions.startTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptionSessionId
            in: path
            value: $steps.create.outputs.id
        requestBody:
          payload: {}
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'connecting'
        outputs:
          transcriptId: $response.body#/transcriptId

      - stepId: relayStub
        x-actors: [relay]
        description: |
          Rejects a token that has expired

          - A WebSocket stub with `protocols` answers only a connection that offered each of them, so this one answers only a connection with the expired token.
          - A relay checks the token before it accepts the connection. A stub answers a message, so this one answers `start`; the adapter sees the same refusal.
        operationId: $sourceDescriptions.mock.registerWsStub
        requestBody:
          payload:
            channel: communication-transcripts-relay-asyncapi.yaml#/channels/audio
            'on': start
            protocols: [an-expired-token]
            send: [{type: error, code: not-allowed, message: The token has expired.}]
            close: {code: 1008, reason: not-allowed}
        successCriteria:
          - condition: $statusCode == 201

      - stepId: sendStartWithAnExpiredToken
        x-actors: [adapter, relay]
        description: |
          Open the connection, with a token that has expired

          - The relay checks the token with the adapter's public keys.
          - A token lasts a minute, so one kept from an earlier connection has run out.
        operationId: $sourceDescriptions.audio.receiveStart
        action: send
        parameters:
          - name: Sec-WebSocket-Protocol
            in: header
            value: 'blueprint.transcripts.relay.v1, an-expired-token'
        requestBody:
          payload:
            type: start
            audio: {encoding: linear16, sampleRateHertz: 16000, channelCount: 1}

      - stepId: refused
        x-actors: [relay, adapter]
        description: |
          Error: not allowed

          - Then the relay closes the connection. The adapter asks its credentials part for a new token.
        operationId: $sourceDescriptions.audio.sendError
        action: receive
        successCriteria:
          - condition: $message.payload#/code == 'not-allowed'

      - stepId: retried
        x-actors: [adapter, session]
        description: |
          Connect again, with a new token

          - After a refusal, the adapter asks for a new token once, since a new token fixes one that expired. Refused again, it publishes that it failed.
        workflowId: reconnect
        parameters:
          - name: sessionId
            value: $steps.create.outputs.id
          - name: transcriptId
            value: $steps.start.outputs.transcriptId

  - workflowId: connectionDrops
    summary: When the connection drops
    description: The connection to the relay drops partway through. The adapter publishes that, asks its credentials part for a new token, and the relay checks it as it did the first.
    x-branch: other
    steps:
      - stepId: connected
        x-actors: [staff, session, adapter]
        description: |
          Start and connect, as in the main path

          - Runs the main path's first workflow, on a new session.
        workflowId: startAndConnect
        outputs:
          sessionId: $outputs.sessionId
          transcriptId: $outputs.transcriptId

      - stepId: relayStub
        x-actors: [relay]
        description: Answers the audio with the final text, then drops the connection
        operationId: $sourceDescriptions.mock.registerWsStub
        requestBody:
          payload:
            channel: communication-transcripts-relay-asyncapi.yaml#/channels/audio
            'on': audio
            send:
              - {type: result, id: r1, isFinal: true, startOffsetMs: 2000, endOffsetMs: 3500, speaker: spk_0, alternatives: [{transcript: "I work at the grocery store."}]}
            close: {code: 1006}
        successCriteria:
          - condition: $statusCode == 201

      - stepId: sendAudio
        x-actors: [adapter, relay]
        description: Audio
        operationId: $sourceDescriptions.audio.receiveAudio
        action: send
        requestBody:
          payload: (16-bit PCM audio)

      - stepId: finalText
        x-actors: [relay, adapter]
        description: Final text
        operationId: $sourceDescriptions.audio.sendResult
        action: receive
        successCriteria:
          - condition: $message.payload#/isFinal == true
        outputs:
          key: $message.payload#/id
          text: $message.payload#/alternatives/0/transcript

      - stepId: publishLineFinished
        x-actors: [adapter, transcript]
        description: Publish the finished line
        operationId: $sourceDescriptions.sessionEvents.sendCommunicationTranscriptionSessionLineFinished
        action: send
        requestBody:
          payload:
            subject: $steps.connected.outputs.sessionId
            partitionkey: $steps.connected.outputs.sessionId
            data: {transcriptId: $steps.connected.outputs.transcriptId, key: $steps.finalText.outputs.key, text: $steps.finalText.outputs.text, speaker: client, startedAt: '2026-10-12T10:00:02Z', endedAt: '2026-10-12T10:00:03Z'}

      - stepId: lineKept
        x-actors: [transcript, staff]
        description: |
          Entry added

          - What arrived before the drop is kept.
        operationId: $sourceDescriptions.transcriptEvents.sendCommunicationTranscriptEntryCreated
        action: receive
        successCriteria:
          - condition: $message.payload#/data/transcriptId == $steps.connected.outputs.transcriptId && $message.payload#/data/kind == 'line'

      - stepId: publishDisconnected
        x-actors: [adapter, session]
        description: Publish disconnected
        operationId: $sourceDescriptions.sessionEvents.sendCommunicationTranscriptionSessionDisconnected
        action: send
        requestBody:
          payload:
            subject: $steps.connected.outputs.sessionId
            partitionkey: $steps.connected.outputs.sessionId
            data: {transcriptId: $steps.connected.outputs.transcriptId, at: '2026-10-12T10:00:04Z'}

      - stepId: disconnected
        x-actors: [staff, session]
        description: 'Get the session: disconnected'
        operationId: $sourceDescriptions.sessions.getTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptionSessionId
            in: path
            value: $steps.connected.outputs.sessionId
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'disconnected'

      - stepId: reconnected
        x-actors: [adapter, session]
        description: |
          Connect again, with a new token and how long nothing was captured

          - A token lasts a minute, so the adapter always asks for a new one rather than keeping the last.
        workflowId: reconnect
        parameters:
          - name: sessionId
            value: $steps.connected.outputs.sessionId
          - name: transcriptId
            value: $steps.connected.outputs.transcriptId
          - name: gap
            value: {startedAt: '2026-10-12T10:00:04Z', endedAt: '2026-10-12T10:00:08Z'}

      - stepId: gapKept
        x-actors: [transcript, staff]
        description: 'Entry added: the gap'
        operationId: $sourceDescriptions.transcriptEvents.sendCommunicationTranscriptEntryCreated
        action: receive
        successCriteria:
          - condition: $message.payload#/data/transcriptId == $steps.connected.outputs.transcriptId && $message.payload#/data/kind == 'gap'

  # ── Run as a step by the other situations, not walked on its own ──────────
  - workflowId: reconnect
    summary: Connect again, with a new token
    description: The adapter gets a new token, connects to the relay again, and publishes that it's connected, with a gap when one is given.
    inputs:
      type: object
      required: [sessionId, transcriptId]
      properties:
        sessionId: {type: string}
        transcriptId: {type: string}
        gap: {type: object}
    steps:
      - stepId: adapterServerStub
        x-actors: [adapterServer]
        description: Gives a new token for the relay
        operationId: $sourceDescriptions.mock.registerHttpStub
        requestBody:
          payload:
            match: {method: POST, url: /credentials}
            response:
              status: 200
              body: {metadata: {}, provider: google-cloud-speech, protocol: websocket, url: 'wss://relay.example/transcribe', subprotocol: blueprint.transcripts.relay.v1, accessToken: a-new-token, tokenType: Bearer, expiresIn: 60}
        successCriteria:
          - condition: $statusCode == 201

      - stepId: requestCredentials
        x-actors: [adapter, adapterServer]
        description: Ask for credentials
        operationId: $sourceDescriptions.adapter.requestCredentials
        requestBody:
          payload:
            metadata: {transcriptionSessionId: $inputs.sessionId}
            provider: google-cloud-speech
            model: latest_long
            languages: [en-US]
            audio: {encoding: linear16, sampleRateHertz: 16000, channelCount: 1}
            protocols: [websocket]
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          subprotocol: $response.body#/subprotocol
          accessToken: $response.body#/accessToken

      - stepId: relayStub
        x-actors: [relay]
        description: Answers a new connection with ready
        operationId: $sourceDescriptions.mock.registerWsStub
        requestBody:
          payload:
            channel: communication-transcripts-relay-asyncapi.yaml#/channels/audio
            'on': start
            send: [{type: started}]
        successCriteria:
          - condition: $statusCode == 201

      - stepId: sendStart
        x-actors: [adapter, relay]
        description: Open the connection, with the audio format
        operationId: $sourceDescriptions.audio.receiveStart
        action: send
        parameters:
          - name: Sec-WebSocket-Protocol
            in: header
            value: '{$steps.requestCredentials.outputs.subprotocol}, {$steps.requestCredentials.outputs.accessToken}'
        requestBody:
          payload: {type: start, audio: {encoding: linear16, sampleRateHertz: 16000, channelCount: 1}, languages: [en-US], model: latest_long}

      - stepId: started
        x-actors: [relay, adapter]
        description: Ready
        operationId: $sourceDescriptions.audio.sendStarted
        action: receive

      - stepId: publishConnected
        x-actors: [adapter, session]
        description: Publish connected
        operationId: $sourceDescriptions.sessionEvents.sendCommunicationTranscriptionSessionConnected
        action: send
        requestBody:
          payload:
            subject: $inputs.sessionId
            partitionkey: $inputs.sessionId
            data: {transcriptId: $inputs.transcriptId, gap: $inputs.gap}

      - stepId: connected
        x-actors: [staff, session]
        description: 'Get the session: connected'
        operationId: $sourceDescriptions.sessions.getTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptionSessionId
            in: path
            value: $inputs.sessionId
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'connected'
