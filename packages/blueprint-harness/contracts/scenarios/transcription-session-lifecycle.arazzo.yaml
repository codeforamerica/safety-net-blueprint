arazzo: 1.1.0
info:
  title: A transcription session, from start to close
  version: 1.0.0
  x-domain: communication
  description: |
    The interview software keeps track of its connection to the transcription service through a session, from start to close. The session runs in the page; its actions call the transcript's operations, so everything kept is the transcript's.

    - starting the transcript the first time the software asks how to stream
    - lines in progress, which are only shown, and finished lines, which are kept once
    - renewing the credential, going off the record, and a dropped connection
    - stopping, with the last line arriving after Stop
  # Who acts in the scenario, in the order they act in each step.
  x-actors:
    - id: caseworker
      name: The caseworker
      description: Starts, pauses, resumes and stops the session from the page.
    - id: software
      name: The client adapter
      description: Streams the audio to the transcription service and tells the session what happens.
    - id: server
      name: The server
      description: Runs the contracts. In this demo, that's the mock server, which also stands in for the page.
    - id: developer
      name: The developer
      description: Runs the demo or test, and stands in for the state's server adapter with the mock server's own routes.
sourceDescriptions:
  # Relative to the resolved contract set, where the framework's documents sit
  # under base/.
  - name: sessions
    url: ../base/domains/communication/communication-transcription-sessions-openapi.yaml
    type: openapi
  - name: transcripts
    url: ../base/domains/communication/communication-transcripts-openapi.yaml
    type: openapi
  - name: mock
    url: https://blueprint.codeforamerica.org/mock/mock-openapi.yaml
    type: openapi
components:
  parameters:
    caller:
      name: X-Caller-Id
      in: header
      value: worker-1
    session:
      name: transcriptionSessionId
      in: path
      value: $steps.start.outputs.id
workflows:
  - workflowId: transcriptionSessionLifecycle
    summary: Start a session, stream, pause, resume, lose the connection, and stop.
    steps:
      - stepId: addProfile
        x-actors: [caseworker]
        description: |
          Add a profile

          - The transcription service and languages transcripts are started under.
        operationId: $sourceDescriptions.transcripts.createTranscriptionProfile
        parameters:
          - name: X-Caller-Id
            in: header
            value: admin-1
        requestBody:
          payload: {name: english-sessions, provider: aws-transcribe, languages: [en-US]}
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          id: $response.body#/id

      - stepId: start
        x-actors: [caseworker, server]
        description: |
          Start a session

          - It says what to start a transcript with: the profile, the model, the software and when the conversation began. No transcript exists yet.
          - The session begins in `created`.
        operationId: $sourceDescriptions.sessions.createTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
        requestBody:
          payload:
            profileId: $steps.addProfile.outputs.id
            model: standard
            client: interview-assistant/0.1.0
            startedAt: '2026-10-12T10:00:00Z'
        successCriteria:
          - condition: $statusCode == 201
          - condition: $response.body#/status == 'created'
        outputs:
          id: $response.body#/id

      - stepId: lineBeforeConnecting
        x-actors: [software]
        description: |
          Send a finished line before connecting

          - Refused with `409`: a line is added only while connected, paused or stopping.
        operationId: $sourceDescriptions.sessions.addLineTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - reference: $components.parameters.session
        requestBody:
          payload: {key: early, startedAt: '2026-10-12T10:00:01Z', endedAt: '2026-10-12T10:00:02Z', text: Too soon., speaker: staff}
        successCriteria:
          - condition: $statusCode == 409

      - stepId: standInForTheAdapter
        x-actors: [developer]
        description: |
          Stand in for the server adapter

          - The state's server adapter issues the short-lived credential the software streams with. This stub, on the mock server's own route, answers its operation, `POST /issue-connection`, once; each later connection registers another.
        operationId: $sourceDescriptions.mock.registerHttpStub
        requestBody:
          payload:
            match: {method: POST, url: /issue-connection}
            response:
              status: 200
              body: {provider: aws-transcribe, protocol: websocket, url: 'wss://transcribe.example/stream?X-Amz-Expires=300', expiresIn: 300}
        successCriteria:
          - condition: $statusCode == 201

      - stepId: getConnection
        x-actors: [software, server]
        description: |
          Ask how to stream

          - The session has no transcript yet, so `get-connection` starts one, under the profile it was created with, then gets where to connect and a credential through the transcript's own `get-connection`.
          - The session is `connecting` until the software says the connection is open.
        operationId: $sourceDescriptions.sessions.getConnectionTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - reference: $components.parameters.session
        requestBody:
          payload: {audio: {encoding: linear16, sampleRateHertz: 16000, channelCount: 1}, protocols: [websocket]}
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/protocol == 'websocket'
          - condition: $response.body#/expiresIn == 300

      - stepId: sessionHasItsTranscript
        description: |
          Read the session

          - It now names the transcript it started.
        operationId: $sourceDescriptions.sessions.getTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - reference: $components.parameters.session
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'connecting'
        outputs:
          transcriptId: $response.body#/transcriptId

      - stepId: connect
        x-actors: [software]
        description: |
          Say the connection is open

          - The software opened the connection to the service itself; only it knows it worked. The session is `connected`.
        operationId: $sourceDescriptions.sessions.connectTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - reference: $components.parameters.session
        requestBody:
          payload: {}
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'connected'

      - stepId: lineInProgress
        x-actors: [software]
        description: |
          Show a line in progress

          - Sent as the service revises it, with the line's key. It's only an event, `line_updated`, for the page to show; nothing is kept.
        operationId: $sourceDescriptions.sessions.updateLineTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - reference: $components.parameters.session
        requestBody:
          payload: {key: line-1, text: Can you tell me who, speaker: staff, startedAt: '2026-10-12T10:00:05Z'}
        successCriteria:
          - condition: $statusCode == 200

      - stepId: finishedLine
        x-actors: [software, server]
        description: |
          Add the finished line

          - The session adds it to the transcript, with the line's key as its `Idempotency-Key`, and sends `line_added` with the key and the new entry, so the page swaps one for the other.
        operationId: $sourceDescriptions.sessions.addLineTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - reference: $components.parameters.session
        requestBody:
          payload: {key: line-1, startedAt: '2026-10-12T10:00:05Z', endedAt: '2026-10-12T10:00:06Z', text: Can you tell me who lives with you?, speaker: staff}
        successCriteria:
          - condition: $statusCode == 200

      - stepId: finishedLineAgain
        x-actors: [software]
        description: |
          Send it again

          - A retry with the same key: the transcript recognizes it and keeps the line once.
        operationId: $sourceDescriptions.sessions.addLineTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - reference: $components.parameters.session
        requestBody:
          payload: {key: line-1, startedAt: '2026-10-12T10:00:05Z', endedAt: '2026-10-12T10:00:06Z', text: Can you tell me who lives with you?, speaker: staff}
        successCriteria:
          - condition: $statusCode == 200

      - stepId: standInForRenewal
        x-actors: [developer]
        description: Stand in for the server adapter for the renewal
        operationId: $sourceDescriptions.mock.registerHttpStub
        requestBody:
          payload:
            match: {method: POST, url: /issue-connection}
            response:
              status: 200
              body: {provider: aws-transcribe, protocol: websocket, url: 'wss://transcribe.example/stream?X-Amz-Expires=300', expiresIn: 300}
        successCriteria:
          - condition: $statusCode == 201

      - stepId: renew
        x-actors: [software, server]
        description: |
          Renew the credential

          - While connected, `renew-connection` gets a fresh credential and leaves the session `connected`; the connection isn't dropped.
        operationId: $sourceDescriptions.sessions.renewConnectionTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - reference: $components.parameters.session
        requestBody:
          payload: {audio: {encoding: linear16, sampleRateHertz: 16000, channelCount: 1}, protocols: [websocket]}
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/expiresIn == 300

      - stepId: pause
        x-actors: [caseworker, server]
        description: |
          Go off the record

          - The page pauses the session, which pauses the transcript on the server and sends `paused`; the software closes the connection, so no audio leaves the page.
        operationId: $sourceDescriptions.sessions.pauseTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - reference: $components.parameters.session
        requestBody:
          payload: {at: '2026-10-12T10:00:10Z'}
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'paused'

      - stepId: transcriptPaused
        description: |
          Read the transcript

          - The pause is kept on the transcript, which is `paused` too.
        operationId: $sourceDescriptions.transcripts.getTranscript
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptId
            in: path
            value: $steps.sessionHasItsTranscript.outputs.transcriptId
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'paused'

      - stepId: resume
        x-actors: [caseworker, server]
        description: |
          Go back on the record

          - The session resumes the transcript and is `connecting`: the software asks how to stream again.
        operationId: $sourceDescriptions.sessions.resumeTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - reference: $components.parameters.session
        requestBody:
          payload: {at: '2026-10-12T10:00:20Z'}
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'connecting'

      - stepId: standInForResume
        x-actors: [developer]
        description: Stand in for the server adapter for the reconnect after the pause
        operationId: $sourceDescriptions.mock.registerHttpStub
        requestBody:
          payload:
            match: {method: POST, url: /issue-connection}
            response:
              status: 200
              body: {provider: aws-transcribe, protocol: websocket, url: 'wss://transcribe.example/stream?X-Amz-Expires=300', expiresIn: 300}
        successCriteria:
          - condition: $statusCode == 201

      - stepId: reconnectAfterResume
        x-actors: [software, server]
        description: |
          Ask how to stream again

          - The session already has its transcript, so it only gets a new credential.
        operationId: $sourceDescriptions.sessions.getConnectionTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - reference: $components.parameters.session
        requestBody:
          payload: {audio: {encoding: linear16, sampleRateHertz: 16000, channelCount: 1}, protocols: [websocket]}
        successCriteria:
          - condition: $statusCode == 200

      - stepId: connectAfterResume
        x-actors: [software]
        description: Say the connection is open again
        operationId: $sourceDescriptions.sessions.connectTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - reference: $components.parameters.session
        requestBody:
          payload: {}
        successCriteria:
          - condition: $statusCode == 200

      - stepId: dropped
        x-actors: [software]
        description: |
          Lose the connection

          - The session is `disconnected`, and the software tries again.
        operationId: $sourceDescriptions.sessions.disconnectTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - reference: $components.parameters.session
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'disconnected'

      - stepId: standInAgain
        x-actors: [developer]
        description: Stand in for the server adapter for the reconnect
        operationId: $sourceDescriptions.mock.registerHttpStub
        requestBody:
          payload:
            match: {method: POST, url: /issue-connection}
            response:
              status: 200
              body: {provider: aws-transcribe, protocol: websocket, url: 'wss://transcribe.example/stream?X-Amz-Expires=300', expiresIn: 300}
        successCriteria:
          - condition: $statusCode == 201

      - stepId: reconnect
        x-actors: [software, server]
        description: Ask how to stream after the drop
        operationId: $sourceDescriptions.sessions.getConnectionTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - reference: $components.parameters.session
        requestBody:
          payload: {audio: {encoding: linear16, sampleRateHertz: 16000, channelCount: 1}, protocols: [websocket]}
        successCriteria:
          - condition: $statusCode == 200

      - stepId: connectWithLostStretch
        x-actors: [software, server]
        description: |
          Say the connection is open, and what was lost

          - The stretch nothing was captured in is recorded on the transcript as a gap.
        operationId: $sourceDescriptions.sessions.connectTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - reference: $components.parameters.session
        requestBody:
          payload: {lostStretch: {startedAt: '2026-10-12T10:00:30Z', endedAt: '2026-10-12T10:00:34Z'}}
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'connected'

      - stepId: stop
        x-actors: [caseworker, server]
        description: |
          Stop

          - The session is `stopping`; the software sends the end of the audio and waits for the last text.
        operationId: $sourceDescriptions.sessions.stopTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - reference: $components.parameters.session
        requestBody:
          payload: {at: '2026-10-12T10:00:40Z'}
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'stopping'

      - stepId: lastLine
        x-actors: [software, server]
        description: |
          Add the last line, after Stop

          - Still added: lines are accepted while stopping, and it began before the transcript closes.
        operationId: $sourceDescriptions.sessions.addLineTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - reference: $components.parameters.session
        requestBody:
          payload: {key: line-2, startedAt: '2026-10-12T10:00:38Z', endedAt: '2026-10-12T10:00:41Z', text: "Thank you, that's everything.", speaker: staff}
        successCriteria:
          - condition: $statusCode == 200

      - stepId: close
        x-actors: [software, server]
        description: |
          Close

          - The last text is in and the connection is closed. The session closes the transcript, at the time the software says.
        operationId: $sourceDescriptions.sessions.closeTranscriptionSession
        parameters:
          - reference: $components.parameters.caller
          - reference: $components.parameters.session
        requestBody:
          payload: {at: '2026-10-12T10:00:42Z'}
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'closed'

      - stepId: timeline
        description: |
          Read the transcript's timeline

          - The first line once, despite the retry; the pause; the gap from the dropped connection; and the last line. Nothing from the line in progress.
        operationId: $sourceDescriptions.transcripts.listTranscriptEntries
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptId
            in: path
            value: $steps.sessionHasItsTranscript.outputs.transcriptId
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/total == 4
