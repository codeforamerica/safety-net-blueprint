arazzo: 1.0.1
info:
  title: A transcript, from start to close
  version: 1.0.0
  x-domain: transcription
  description: |
    The interview software a caseworker uses transcribes an interview. An
    administrator adds the profile it runs under. The software starts a
    transcript under that profile, adds lines — retrying one — pauses when the
    applicant asks to go off the record, and closes it at the end. Along the
    way the transcript refuses to start without a model or under a profile that
    does not exist; keeps a line said just before the pause; and refuses a line
    said during it, a lost stretch overlapping it, a line after the close, and
    the software editing an entry. Every time is by the software's clock.

    Then a second transcript, under a profile with an idle timeout, is started
    and never written to. The mock stands in for the scheduler, so the idle
    check comes at once, finds nothing, and the transcript closes itself.
sourceDescriptions:
  # Relative to the resolved contract set, where the framework's documents sit
  # under base/.
  - name: transcripts
    url: ../base/domains/transcription/transcription-transcripts-openapi.yaml
    type: openapi
  # The mock's own routes, to stand in for the scheduler. This makes the
  # scenario one to run against the mock.
  - name: mock
    url: https://blueprint.codeforamerica.org/mock/mock-openapi.yaml
    type: openapi
components:
  parameters:
    caller:
      name: X-Caller-Id
      in: header
      value: worker-1
    transcript:
      name: transcriptId
      in: path
      value: $steps.start.outputs.id
workflows:
  - workflowId: transcriptLifecycle
    summary: Start, record, pause, resume and close a transcript, and see what it refuses.
    steps:
      - stepId: addProfile
        description: An administrator adds the profile interviews in English run under.
        operationId: $sourceDescriptions.transcripts.createTranscriptionProfile
        parameters:
          - name: X-Caller-Id
            in: header
            value: admin-1
        requestBody:
          payload:
            name: english-interview
            provider: aws-transcribe
            languages: [en-US]
        successCriteria:
          - condition: $statusCode == 201
          - condition: $response.body#/source == 'user'
        outputs:
          id: $response.body#/id

      - stepId: startWithoutAModel
        description: A transcript under a profile with a transcription service has to say which model produced its lines.
        operationId: $sourceDescriptions.transcripts.createTranscript
        parameters:
          - reference: $components.parameters.caller
        requestBody:
          payload:
            profileId: $steps.addProfile.outputs.id
            client: interview-assistant/0.1.0
            startedAt: '2026-10-12T10:00:00Z'
        successCriteria:
          - condition: $statusCode == 409

      - stepId: startUnderAMissingProfile
        description: A transcript is started under a profile that exists.
        operationId: $sourceDescriptions.transcripts.createTranscript
        parameters:
          - reference: $components.parameters.caller
        requestBody:
          payload:
            profileId: 00000000-0000-4000-8000-000000000000
            model: standard
            client: interview-assistant/0.1.0
            startedAt: '2026-10-12T10:00:00Z'
        successCriteria:
          - condition: $statusCode == 409

      - stepId: start
        description: The caseworker starts a transcript of the interview.
        operationId: $sourceDescriptions.transcripts.createTranscript
        parameters:
          - reference: $components.parameters.caller
        requestBody:
          payload:
            profileId: $steps.addProfile.outputs.id
            model: standard
            client: interview-assistant/0.1.0
            startedAt: '2026-10-12T10:00:00Z'
        successCriteria:
          - condition: $statusCode == 201
          - condition: $response.body#/status == 'recording'
          - condition: $response.body#/profile/id == $steps.addProfile.outputs.id
        outputs:
          id: $response.body#/id

      - stepId: firstLine
        description: The first finished line arrives.
        operationId: $sourceDescriptions.transcripts.addTranscriptEntry
        parameters:
          - reference: $components.parameters.caller
          - reference: $components.parameters.transcript
          - name: Idempotency-Key
            in: header
            value: line-1
        requestBody:
          payload: {kind: line, startedAt: '2026-10-12T10:00:05Z', endedAt: '2026-10-12T10:00:06Z', text: Can you tell me who lives with you?, speaker: staff}
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          id: $response.body#/id

      - stepId: retryFirstLine
        description: The connection drops before the answer comes back, so the software sends the line again with the same key — and gets the same line, not a second one.
        operationId: $sourceDescriptions.transcripts.addTranscriptEntry
        parameters:
          - reference: $components.parameters.caller
          - reference: $components.parameters.transcript
          - name: Idempotency-Key
            in: header
            value: line-1
        requestBody:
          payload: {kind: line, startedAt: '2026-10-12T10:00:05Z', endedAt: '2026-10-12T10:00:06Z', text: Can you tell me who lives with you?, speaker: staff}
        successCriteria:
          - condition: $statusCode == 201
          - condition: $response.body#/id == $steps.firstLine.outputs.id
          - condition: $response.header.Idempotent-Replayed == 'true'

      - stepId: pause
        description: The applicant asks to go off the record.
        operationId: $sourceDescriptions.transcripts.pauseTranscript
        parameters:
          - reference: $components.parameters.caller
          - reference: $components.parameters.transcript
        requestBody:
          payload: {at: '2026-10-12T10:00:10Z'}
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'paused'

      - stepId: lineSaidBeforeThePause
        description: A line said just before the pause arrives just after it. It started on the record, so it is kept.
        operationId: $sourceDescriptions.transcripts.addTranscriptEntry
        parameters:
          - reference: $components.parameters.caller
          - reference: $components.parameters.transcript
          - name: Idempotency-Key
            in: header
            value: line-2
        requestBody:
          payload: {kind: line, startedAt: '2026-10-12T10:00:08Z', endedAt: '2026-10-12T10:00:11Z', text: My two kids and my mother., speaker: client}
        successCriteria:
          - condition: $statusCode == 201

      - stepId: lineSaidDuringThePause
        description: A line said off the record is refused, even from faulty software.
        operationId: $sourceDescriptions.transcripts.addTranscriptEntry
        parameters:
          - reference: $components.parameters.caller
          - reference: $components.parameters.transcript
          - name: Idempotency-Key
            in: header
            value: line-3
        requestBody:
          payload: {kind: line, startedAt: '2026-10-12T10:00:12Z', endedAt: '2026-10-12T10:00:13Z', text: Off the record., speaker: client}
        successCriteria:
          - condition: $statusCode == 409

      - stepId: gapOverlappingThePause
        description: A lost stretch overlapping the pause is refused — the pause already accounts for that time.
        operationId: $sourceDescriptions.transcripts.addTranscriptEntry
        parameters:
          - reference: $components.parameters.caller
          - reference: $components.parameters.transcript
          - name: Idempotency-Key
            in: header
            value: gap-1
        requestBody:
          payload: {kind: gap, startedAt: '2026-10-12T10:00:09Z', endedAt: '2026-10-12T10:00:11Z', cause: connection}
        successCriteria:
          - condition: $statusCode == 409

      - stepId: resume
        description: Back on the record.
        operationId: $sourceDescriptions.transcripts.resumeTranscript
        parameters:
          - reference: $components.parameters.caller
          - reference: $components.parameters.transcript
        requestBody:
          payload: {at: '2026-10-12T10:00:20Z'}
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'recording'

      - stepId: lineSaidDuringThePastPause
        description: A late line from inside the pause that has ended is still refused.
        operationId: $sourceDescriptions.transcripts.addTranscriptEntry
        parameters:
          - reference: $components.parameters.caller
          - reference: $components.parameters.transcript
          - name: Idempotency-Key
            in: header
            value: line-4
        requestBody:
          payload: {kind: line, startedAt: '2026-10-12T10:00:15Z', endedAt: '2026-10-12T10:00:16Z', text: Still off the record., speaker: client}
        successCriteria:
          - condition: $statusCode == 409

      - stepId: timeline
        description: The timeline reads in the order things happened, with the pause in it.
        operationId: $sourceDescriptions.transcripts.listTranscriptEntries
        parameters:
          - reference: $components.parameters.caller
          - reference: $components.parameters.transcript
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/total == 3
          - condition: $response.body#/items/2/kind == 'pause'
          - condition: $response.body#/items/2/endedAt == '2026-10-12T10:00:20Z'
        outputs:
          firstEntryId: $response.body#/items/0/id

      - stepId: clientEditsAnEntry
        description: Entries do not change — only the system may update one.
        operationId: $sourceDescriptions.transcripts.updateTranscriptEntry
        parameters:
          - reference: $components.parameters.caller
          - reference: $components.parameters.transcript
          - name: entryId
            in: path
            value: $steps.timeline.outputs.firstEntryId
        requestBody:
          payload: {endedAt: '2026-10-12T10:00:59Z'}
        successCriteria:
          - condition: $statusCode == 403

      - stepId: close
        description: The interview ends.
        operationId: $sourceDescriptions.transcripts.closeTranscript
        parameters:
          - reference: $components.parameters.caller
          - reference: $components.parameters.transcript
        requestBody:
          payload: {at: '2026-10-12T10:00:30Z'}
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'closed'
          - condition: $response.body#/lastActivityAt == '2026-10-12T10:00:11Z'

      - stepId: lineAfterTheClose
        description: Nothing is added after the close.
        operationId: $sourceDescriptions.transcripts.addTranscriptEntry
        parameters:
          - reference: $components.parameters.caller
          - reference: $components.parameters.transcript
          - name: Idempotency-Key
            in: header
            value: line-5
        requestBody:
          payload: {kind: line, startedAt: '2026-10-12T10:00:31Z', endedAt: '2026-10-12T10:00:32Z', text: Too late., speaker: client}
        successCriteria:
          - condition: $statusCode == 409

      - stepId: addTimedProfile
        description: An administrator adds a profile whose transcripts close themselves after 30 quiet minutes.
        operationId: $sourceDescriptions.transcripts.createTranscriptionProfile
        parameters:
          - name: X-Caller-Id
            in: header
            value: admin-1
        requestBody:
          payload:
            name: english-timed
            provider: aws-transcribe
            languages: [en-US]
            idleTimeout: PT30M
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          id: $response.body#/id

      - stepId: standInForTheScheduler
        description: Nobody waits 30 minutes in a test. The mock answers the next idle check request at once, as if the time had passed.
        operationId: $sourceDescriptions.mock.registerEventStub
        requestBody:
          payload:
            'on': scheduling.timer.requested
            match:
              data.callback.event: transcription.idle_check
        successCriteria:
          - condition: $statusCode == 201

      - stepId: startAndGoQuiet
        description: The software starts a transcript and is never heard from again.
        operationId: $sourceDescriptions.transcripts.createTranscript
        parameters:
          - reference: $components.parameters.caller
        requestBody:
          payload:
            profileId: $steps.addTimedProfile.outputs.id
            model: standard
            client: interview-assistant/0.1.0
            startedAt: '2026-10-12T11:00:00Z'
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          id: $response.body#/id

      - stepId: quietTranscriptClosedItself
        description: The idle check found nothing since it was asked for, so the transcript closed — at the time it was last heard from, here when it started.
        operationId: $sourceDescriptions.transcripts.getTranscript
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptId
            in: path
            value: $steps.startAndGoQuiet.outputs.id
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'closed'
          - condition: $response.body#/closedAt == '2026-10-12T11:00:00Z'
