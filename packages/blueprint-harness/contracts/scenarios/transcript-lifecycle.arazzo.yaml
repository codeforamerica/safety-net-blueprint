arazzo: 1.0.1
info:
  title: A transcript, from start to close
  version: 1.0.0
  x-domain: transcription
  description: |
    A caseworker's interview software transcribes an interview from start to close, then abandons a second transcript, exercising the transcription domain end to end:

    - profiles, and what a transcript needs before it can start
    - a timeline of lines, gaps and pauses, each judged by when it started
    - retries recognized by their Idempotency-Key, and entries that never change
    - closing, and the idle timeout, with the mock standing in for the scheduler
sourceDescriptions:
  # Relative to the resolved contract set, where the framework's documents sit
  # under base/.
  - name: transcripts
    url: ../base/domains/transcription/transcription-transcripts-openapi.yaml
    type: openapi
  # The mock's own routes, to stand in for the scheduler. This makes the
  # scenario one to run against the mock.
  - name: mock
    url: https://blueprint.codeforamerica.org/mock/mock-openapi.yaml
    type: openapi
components:
  parameters:
    caller:
      name: X-Caller-Id
      in: header
      value: worker-1
    transcript:
      name: transcriptId
      in: path
      value: $steps.start.outputs.id
workflows:
  - workflowId: transcriptLifecycle
    summary: Start, record, pause, resume and close a transcript, and see what it refuses.
    steps:
      - stepId: addProfile
        description: |
          Add a profile

          - An administrator adds the profile English interviews run under: the transcription service and its languages.
          - Profiles the config seeds are marked `source: system`; one added here is `user`.
        operationId: $sourceDescriptions.transcripts.createTranscriptionProfile
        parameters:
          - name: X-Caller-Id
            in: header
            value: admin-1
        requestBody:
          payload:
            name: english-interview
            provider: aws-transcribe
            languages: [en-US]
        successCriteria:
          - condition: $statusCode == 201
          - condition: $response.body#/source == 'user'
        outputs:
          id: $response.body#/id

      - stepId: startWithoutAModel
        description: |
          Start without a model

          - Refused with 409: under a profile with a transcription service, a transcript says which model produced its lines.
          - The refusal names the condition not met, from the guard's description.
        operationId: $sourceDescriptions.transcripts.createTranscript
        parameters:
          - reference: $components.parameters.caller
        requestBody:
          payload:
            profileId: $steps.addProfile.outputs.id
            client: interview-assistant/0.1.0
            startedAt: '2026-10-12T10:00:00Z'
        successCriteria:
          - condition: $statusCode == 409

      - stepId: startUnderAMissingProfile
        description: |
          Start under a profile that does not exist

          - The profile id doesn't belong to any profile, so the transcript is refused with 409.
        operationId: $sourceDescriptions.transcripts.createTranscript
        parameters:
          - reference: $components.parameters.caller
        requestBody:
          payload:
            profileId: 00000000-0000-4000-8000-000000000000
            model: standard
            client: interview-assistant/0.1.0
            startedAt: '2026-10-12T10:00:00Z'
        successCriteria:
          - condition: $statusCode == 409

      - stepId: start
        description: |
          Start the transcript

          - The caseworker's software starts a transcript of the interview, under the profile.
          - It begins in `recording`, with `startedAt` by the software's clock.
        operationId: $sourceDescriptions.transcripts.createTranscript
        parameters:
          - reference: $components.parameters.caller
        requestBody:
          payload:
            profileId: $steps.addProfile.outputs.id
            model: standard
            client: interview-assistant/0.1.0
            startedAt: '2026-10-12T10:00:00Z'
        successCriteria:
          - condition: $statusCode == 201
          - condition: $response.body#/status == 'recording'
          - condition: $response.body#/profile/id == $steps.addProfile.outputs.id
        outputs:
          id: $response.body#/id

      - stepId: firstLine
        description: |
          Add the first line

          - A finished line arrives, with an `Idempotency-Key`.
          - Its start and end times come from the transcription software's clock, not the server's, so every time on a transcript is compared on one clock.
        operationId: $sourceDescriptions.transcripts.addTranscriptEntry
        parameters:
          - reference: $components.parameters.caller
          - reference: $components.parameters.transcript
          - name: Idempotency-Key
            in: header
            value: line-1
        requestBody:
          payload: {kind: line, startedAt: '2026-10-12T10:00:05Z', endedAt: '2026-10-12T10:00:06Z', text: Can you tell me who lives with you?, speaker: staff}
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          id: $response.body#/id

      - stepId: retryFirstLine
        description: |
          Send it again

          - The connection drops before the answer comes back, so the software sends the line again with the same key.
          - It gets the same line back, marked `Idempotent-Replayed`, not a second one.
        operationId: $sourceDescriptions.transcripts.addTranscriptEntry
        parameters:
          - reference: $components.parameters.caller
          - reference: $components.parameters.transcript
          - name: Idempotency-Key
            in: header
            value: line-1
        requestBody:
          payload: {kind: line, startedAt: '2026-10-12T10:00:05Z', endedAt: '2026-10-12T10:00:06Z', text: Can you tell me who lives with you?, speaker: staff}
        successCriteria:
          - condition: $statusCode == 201
          - condition: $response.body#/id == $steps.firstLine.outputs.id
          - condition: $response.header.Idempotent-Replayed == 'true'

      - stepId: pause
        description: |
          Go off the record

          - The applicant asks to stop. Pausing adds an open pause entry to the timeline.
        operationId: $sourceDescriptions.transcripts.pauseTranscript
        parameters:
          - reference: $components.parameters.caller
          - reference: $components.parameters.transcript
        requestBody:
          payload: {at: '2026-10-12T10:00:10Z'}
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'paused'

      - stepId: lineSaidBeforeThePause
        description: |
          A line said just before the pause

          - It arrives just after the pause began, but it started on the record, so it is kept.
          - A line is judged by when it started, not when it arrived.
        operationId: $sourceDescriptions.transcripts.addTranscriptEntry
        parameters:
          - reference: $components.parameters.caller
          - reference: $components.parameters.transcript
          - name: Idempotency-Key
            in: header
            value: line-2
        requestBody:
          payload: {kind: line, startedAt: '2026-10-12T10:00:08Z', endedAt: '2026-10-12T10:00:11Z', text: My two kids and my mother., speaker: client}
        successCriteria:
          - condition: $statusCode == 201

      - stepId: lineSaidDuringThePause
        description: |
          A line said during the pause

          - Refused with 409: nothing said off the record is kept, even from faulty software.
        operationId: $sourceDescriptions.transcripts.addTranscriptEntry
        parameters:
          - reference: $components.parameters.caller
          - reference: $components.parameters.transcript
          - name: Idempotency-Key
            in: header
            value: line-3
        requestBody:
          payload: {kind: line, startedAt: '2026-10-12T10:00:12Z', endedAt: '2026-10-12T10:00:13Z', text: Off the record., speaker: client}
        successCriteria:
          - condition: $statusCode == 409

      - stepId: gapOverlappingThePause
        description: |
          A lost stretch overlapping the pause

          - Refused with 409: the pause already accounts for that time.
        operationId: $sourceDescriptions.transcripts.addTranscriptEntry
        parameters:
          - reference: $components.parameters.caller
          - reference: $components.parameters.transcript
          - name: Idempotency-Key
            in: header
            value: gap-1
        requestBody:
          payload: {kind: gap, startedAt: '2026-10-12T10:00:09Z', endedAt: '2026-10-12T10:00:11Z', cause: connection}
        successCriteria:
          - condition: $statusCode == 409

      - stepId: resume
        description: |
          Back on the record

          - Resuming gives the open pause its end time.
        operationId: $sourceDescriptions.transcripts.resumeTranscript
        parameters:
          - reference: $components.parameters.caller
          - reference: $components.parameters.transcript
        requestBody:
          payload: {at: '2026-10-12T10:00:20Z'}
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'recording'

      - stepId: lineSaidDuringThePastPause
        description: |
          A late line from inside the past pause

          - Still refused: the pause has ended, but the line started inside it.
        operationId: $sourceDescriptions.transcripts.addTranscriptEntry
        parameters:
          - reference: $components.parameters.caller
          - reference: $components.parameters.transcript
          - name: Idempotency-Key
            in: header
            value: line-4
        requestBody:
          payload: {kind: line, startedAt: '2026-10-12T10:00:15Z', endedAt: '2026-10-12T10:00:16Z', text: Still off the record., speaker: client}
        successCriteria:
          - condition: $statusCode == 409

      - stepId: timeline
        description: |
          Read the timeline

          - Lines, gaps and pauses in the order they happened, by `startedAt`.
          - The pause is in it, with its end time.
        operationId: $sourceDescriptions.transcripts.listTranscriptEntries
        parameters:
          - reference: $components.parameters.caller
          - reference: $components.parameters.transcript
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/total == 3
          - condition: $response.body#/items/2/kind == 'pause'
          - condition: $response.body#/items/2/endedAt == '2026-10-12T10:00:20Z'
        outputs:
          firstEntryId: $response.body#/items/0/id

      - stepId: clientEditsAnEntry
        description: |
          Try to change an entry

          - Refused with 403: entries do not change, and only the system may update one.
        operationId: $sourceDescriptions.transcripts.updateTranscriptEntry
        parameters:
          - reference: $components.parameters.caller
          - reference: $components.parameters.transcript
          - name: entryId
            in: path
            value: $steps.timeline.outputs.firstEntryId
        requestBody:
          payload: {endedAt: '2026-10-12T10:00:59Z'}
        successCriteria:
          - condition: $statusCode == 403

      - stepId: close
        description: |
          Close the transcript

          - The interview ends.
          - `lastActivityAt` says when the software was last heard from: the end of its last line.
        operationId: $sourceDescriptions.transcripts.closeTranscript
        parameters:
          - reference: $components.parameters.caller
          - reference: $components.parameters.transcript
        requestBody:
          payload: {at: '2026-10-12T10:00:30Z'}
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'closed'
          - condition: $response.body#/lastActivityAt == '2026-10-12T10:00:11Z'

      - stepId: lineAfterTheClose
        description: |
          A line after the close

          - Refused with 409: nothing is added after the close.
        operationId: $sourceDescriptions.transcripts.addTranscriptEntry
        parameters:
          - reference: $components.parameters.caller
          - reference: $components.parameters.transcript
          - name: Idempotency-Key
            in: header
            value: line-5
        requestBody:
          payload: {kind: line, startedAt: '2026-10-12T10:00:31Z', endedAt: '2026-10-12T10:00:32Z', text: Too late., speaker: client}
        successCriteria:
          - condition: $statusCode == 409

      - stepId: addTimedProfile
        description: |
          Add a profile with an idle timeout

          - Its transcripts close themselves after 30 quiet minutes: `idleTimeout: PT30M`.
        operationId: $sourceDescriptions.transcripts.createTranscriptionProfile
        parameters:
          - name: X-Caller-Id
            in: header
            value: admin-1
        requestBody:
          payload:
            name: english-timed
            provider: aws-transcribe
            languages: [en-US]
            idleTimeout: PT30M
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          id: $response.body#/id

      - stepId: standInForTheScheduler
        description: |
          Stand in for the scheduler

          - Nobody waits 30 minutes in a test. A stub on the mock answers the next idle check request at once, as if the time had passed.
          - This step calls the mock's own route, so the scenario runs against the mock.
        operationId: $sourceDescriptions.mock.registerEventStub
        requestBody:
          payload:
            'on': scheduling.timer.requested
            match:
              data.callback.event: transcription.idle_check
        successCriteria:
          - condition: $statusCode == 201

      - stepId: startAndGoQuiet
        description: |
          Start a transcript and go quiet

          - The software starts a transcript and is never heard from again.
        operationId: $sourceDescriptions.transcripts.createTranscript
        parameters:
          - reference: $components.parameters.caller
        requestBody:
          payload:
            profileId: $steps.addTimedProfile.outputs.id
            model: standard
            client: interview-assistant/0.1.0
            startedAt: '2026-10-12T11:00:00Z'
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          id: $response.body#/id

      - stepId: quietTranscriptClosedItself
        description: |
          It closed itself

          - The idle check found nothing since it was asked for, so the transcript closed.
          - It closed at the time it was last heard from: here, when it started.
        operationId: $sourceDescriptions.transcripts.getTranscript
        parameters:
          - reference: $components.parameters.caller
          - name: transcriptId
            in: path
            value: $steps.startAndGoQuiet.outputs.id
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'closed'
          - condition: $response.body#/closedAt == '2026-10-12T11:00:00Z'
