# Seed records for the intake domain.
#
# Keyed by the schema each record exemplifies — `ApplicationExample1` is an
# `Application` — which is how `extract(docs, 'examples')` groups them and how
# the seeder decides which collection each belongs in. The key names the
# schema, not the collection, because a collection is the server's name for a
# database and a schema is something the contract declares.
#
# Without these the sample contract set boots with every collection empty, so
# nothing that reads a list demonstrates anything.
domain: intake

ApplicationExample1:
  id: 11111111-1111-4111-8111-111111111111
  status: submitted
  programsAppliedFor:
    - snap
  channel: online
  createdAt: "2026-02-01T09:00:00Z"
  updatedAt: "2026-02-01T09:15:00Z"

ApplicationExample2:
  id: 22222222-2222-4222-8222-222222222222
  status: draft
  programsAppliedFor:
    - snap
    - medicaid
  channel: phone
  createdAt: "2026-02-02T10:00:00Z"
  updatedAt: "2026-02-02T10:00:00Z"

# A renewal. previousHousehold is the household as last certified, copied when
# the renewal was opened.
ApplicationExample3:
  id: 66666666-6666-4666-8666-666666666666
  status: submitted
  type: renewal
  interviewDate: "2026-10-14"
  programsAppliedFor:
    - snap
  channel: phone
  previousHousehold:
    size: 3
    utilitiesIncludedInRent: true
    monthlyIncome: 2400
    monthlyExpenses: 1500
    members:
      - { id: client, dateOfBirth: "1985-03-02", isDisabled: false }
      - { id: daughter, dateOfBirth: "2007-06-10", isDisabled: false }
      - { id: son, dateOfBirth: "2018-01-15", isDisabled: false }
    jobs:
      - { id: warehouse, memberId: client, employer: Northgate Distribution }
    incomes:
      - { id: wages, memberId: client, jobId: warehouse, source: earned, amount: 1110, frequency: biweekly, paidInCash: false, amountVaries: false }
    expenses:
      - { type: rent, amount: 1150, frequency: monthly }
  createdAt: "2026-10-01T09:00:00Z"
  updatedAt: "2026-10-01T09:00:00Z"

# What outside records show for the renewal: a quarter of wages from the state's
# wage records, and a verified pay stub.
IncomeVerificationExample1:
  id: 77777777-7777-4777-8777-777777777771
  applicationId: 66666666-6666-4666-8666-666666666666
  kind: wage_record
  memberId: client
  period: 2026-Q3
  amount: 5400
  createdAt: "2026-10-02T09:00:00Z"
  updatedAt: "2026-10-02T09:00:00Z"

IncomeVerificationExample2:
  id: 77777777-7777-4777-8777-777777777772
  applicationId: 66666666-6666-4666-8666-666666666666
  kind: pay_stub
  memberId: client
  incomeId: wages
  period: "2026-09-26"
  amount: 840
  frequency: biweekly
  createdAt: "2026-10-02T09:00:00Z"
  updatedAt: "2026-10-02T09:00:00Z"
