# External schema definitions for the intake domain.
# Referenced from intake-openapi.yaml via: $ref: './intake-schemas.yaml#/$defs/IncomeSource'
# The discriminated oneOf here exercises the field inventory generator's
# oneOf/discriminator handling.

$defs:
  # What the interview rules read: the application as it stands, the household's
  # last certification, and what data matches and verifications returned. Shared
  # so each ruleset references it rather than restating the shape — the compiler
  # follows the $ref down to individual field paths, which is what keeps
  # missing-input tracking per-field rather than per-object. Data, never
  # conclusions: whether income "varies" is worked out from `payPattern`, not
  # sent as a flag.
  InterviewApplication:
    type: object
    description: The application as it stands at the interview.
    properties:
      programsAppliedFor:
        type: array
        items: { type: string, enum: [snap, medicaid, tanf, chip] }
        description: Programs the household applied for.
      householdSize:
        type: integer
        description: The household size the application states.
      members:
        type: array
        items: { $ref: '#/$defs/InterviewMember' }
      jobs:
        type: array
        items: { $ref: '#/$defs/InterviewJob' }
      incomes:
        type: array
        items: { $ref: '#/$defs/InterviewIncome' }
      expenses:
        type: array
        items: { $ref: '#/$defs/InterviewExpense' }
      reportedMonthlyIncome:
        type: number
        description: Total monthly income, as the household reported it.
      reportedMonthlyExpenses:
        type: number
        description: Total monthly expenses, as the household reported them.
      utilitiesIncludedInRent:
        type: boolean
        description: Whether the household says its utilities are included in the rent.
      claimsUtilityAllowance:
        type: boolean
        description: Whether a standard utility allowance is applied to the household.
      hasChangedCircumstances:
        type: boolean
        description: Whether the household reported changes since the application was submitted.

  InterviewMember:
    type: object
    properties:
      id: { type: string, description: The member's id. }
      age: { type: integer, description: Age in years. }
      isDisabled: { type: boolean, description: Whether the member is disabled. }

  InterviewJob:
    type: object
    properties:
      id: { type: string, description: The job's id. }
      memberId: { type: string, description: The member who holds the job. }

  InterviewIncome:
    type: object
    properties:
      id: { type: string, description: The income's id. }
      memberId: { type: string, description: The member who receives it. }
      jobId: { type: string, description: The job it's paid for, when it's earned income. }
      type: { type: string, enum: [earned, self_employment, unearned], description: Where the money comes from. }
      payPattern: { type: string, enum: [regular, irregular, tips, cash], description: How it's paid. }
      monthlyAmount: { type: number, description: Monthly amount, in dollars. }

  InterviewExpense:
    type: object
    properties:
      category: { type: string, enum: [rent, mortgage, utilities, dependent_care, medical, child_support], description: What it's for. }
      monthlyAmount: { type: number, description: Monthly amount, in dollars. }

  LastCertification:
    type: object
    description: What the household's last certification recorded.
    properties:
      memberIds:
        type: array
        items: { type: string }
        description: The members certified last time.
      incomes:
        type: array
        items: { $ref: '#/$defs/InterviewIncome' }
      expenses:
        type: array
        items: { $ref: '#/$defs/InterviewExpense' }

  DataMatches:
    type: object
    description: What outside data and verified documents say.
    properties:
      wageRecords:
        type: array
        description: Monthly wages from state wage records or IEVS, by member.
        items:
          type: object
          properties:
            memberId: { type: string }
            monthlyWages: { type: number }
      payStubs:
        type: array
        description: Monthly amounts worked out from verified pay stubs, by income.
        items:
          type: object
          properties:
            incomeId: { type: string }
            monthlyAmount: { type: number }

  IncomeSource:
    description: Income reported by a household member. Type discriminator determines the variant.
    oneOf:
      - $ref: '#/$defs/EmploymentIncome'
      - $ref: '#/$defs/SelfEmploymentIncome'
      - $ref: '#/$defs/BenefitIncome'
    discriminator:
      propertyName: type
      mapping:
        employment: '#/$defs/EmploymentIncome'
        self_employment: '#/$defs/SelfEmploymentIncome'
        benefit: '#/$defs/BenefitIncome'

  EmploymentIncome:
    type: object
    description: Income from wages or salary employment.
    required: [type, employer, monthlyGrossIncome]
    properties:
      type:
        type: string
        const: employment
      employer:
        type: string
        description: Name of the employer.
      monthlyGrossIncome:
        type: number
        minimum: 0
        description: Monthly gross income before deductions (dollars).

  SelfEmploymentIncome:
    type: object
    description: Income from self-employment or a sole proprietorship.
    required: [type, businessType, monthlyNetIncome]
    properties:
      type:
        type: string
        const: self_employment
      businessType:
        type: string
        description: Type of business (e.g., sole proprietor, freelance).
      monthlyNetIncome:
        type: number
        minimum: 0
        description: Monthly net income after business expenses (dollars).

  BenefitIncome:
    type: object
    description: Income from a government benefit program.
    required: [type, benefitType, monthlyAmount]
    properties:
      type:
        type: string
        const: benefit
      benefitType:
        type: string
        enum: [ssi, ssdi, unemployment, veterans, other]
        description: The benefit program providing income.
      monthlyAmount:
        type: number
        minimum: 0
        description: Monthly benefit amount (dollars).
