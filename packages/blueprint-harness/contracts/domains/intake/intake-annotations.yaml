$schema: annotations-schema.yaml
version: "1.0"
domain: intake

schema:
  # Top-level resource annotations (polymorphic-base and paginated-list apply
  # to the Create/Update/List schema variants derived from this resource)
  application:
    patterns: [polymorphic-base, paginated-list]

  application.id:
    patterns: [read-only-field, string-format]

  application.confirmationNumber:
    patterns: [deprecated-field, read-only-field]

  application.referenceId:
    patterns: [read-only-field]

  application.status:
    patterns: [x-enum-source, read-only-field]

  application.programsApplied[]:
    patterns: [array-of-enum]

  application.submittedAt:
    policies: [snap-processing-clock, medicaid-processing-clock]
    patterns: [nullable-state-gated-field, read-only-field, string-format]

  application.openedAt:
    patterns: [nullable-state-gated-field, read-only-field, string-format]

  application.createdAt:
    patterns: [read-only-field, string-format]

  application.updatedAt:
    patterns: [read-only-field, string-format]

  application.address:
    patterns: [external-ref-shared-defs]

  application.contactInfo:
    patterns: [external-ref-shared-defs]

  application.labels:
    patterns: [additional-properties-map]

  applicationSummary:
    patterns: [singleton-sub-resource, composition]

  applicationWritable.countyCode:
    patterns: [overlay]

  # spec-relative: navigates from the root Application resource
  application.members[]:
    patterns: [sub-resource, polymorphic-base, paginated-list]

  # schema-relative: first segment is the ApplicationMember schema name (camelCase).
  # merge-annotations resolves these to application.members[].* automatically.
  applicationMember.id:
    patterns: [read-only-field, string-format]

  applicationMember.dateOfBirth:
    policies: [chip-age-eligibility, snap-elderly-disabled-deductions]
    patterns: [string-format]

  applicationMember.relationship:
    policies: [snap-household-composition, medicaid-caretaker-relative]

  applicationMember.incomeSource:
    policies: [snap-income-verification]
    patterns: [external-ref-defs-oneof]

  applicationMember.applicationId:
    patterns: [intra-domain-fk]

  applicationMember.notificationPreference:
    patterns: [oneof-discriminator]

  applicationMember.verificationEvidence:
    patterns: [anyof]

facts:
  interviewPrompts.incomeGapExists:
    interviewPromptRationale: >
      Flags a potential inconsistency when reported income does not cover reported expenses.
      Required by FNS-1104 as a probe trigger — workers must probe for undisclosed income
      sources or assistance.
    policies: [snap-interview-toolkit]

  interviewPrompts.hasUnemployedWorkEligible:
    interviewPromptRationale: >
      Identifies household members aged 16–59 who are not employed and have not yet been
      screened for general work requirement exemptions.
    policies: [snap-general-work-requirement]

  interviewPrompts.hasStudentMembers:
    interviewPromptRationale: >
      Identifies household members enrolled at least half-time in higher education who are
      subject to student eligibility restrictions.
    policies: [snap-student-eligibility]

  interviewPrompts.hasNonCitizenMembers:
    interviewPromptRationale: >
      Identifies non-citizen household members who must be screened for qualified alien
      status and sponsor income deeming rules.
    policies: [qualified-alien-eligibility]

  interviewPrompts.incomeInconsistencyPrompt:
    interviewPromptRationale: >
      Probe for undisclosed income sources or assistance when monthly income is less than
      monthly expenses.
    policies: [snap-interview-toolkit]
    patterns: [ruleset-output-fact]
    interviewQuestions:
      - "Your application shows monthly income of [income] and monthly expenses of [expenses].
        Can you tell me about any other income sources or assistance your household receives?"
      - "Does anyone in the household receive help with expenses from family, friends, or
        community organizations?"

  interviewPrompts.workRequirementPrompt:
    interviewPromptRationale: >
      Screen non-employed household members aged 16–59 for general work requirement
      exemptions before determining work registration obligations.
    policies: [snap-general-work-requirement, snap-abawd-work-requirement]
    patterns: [ruleset-output-fact]
    interviewQuestions:
      - "Is [member] currently able to work — are there any physical or mental health
        conditions that limit their ability to work?"
      - "Is [member] currently caring for a child under 6 or an incapacitated person
        in the household?"
      - "Is [member] currently enrolled in school, job training, or a work program
        through another benefit program?"
      - "Is [member] currently working at least 30 hours per week or earning the
        federal minimum wage equivalent?"

  interviewPrompts.studentEligibilityPrompt:
    interviewPromptRationale: >
      Screen higher-education students for SNAP eligibility exceptions — most students
      enrolled at least half-time are ineligible unless they meet one of the statutory
      exceptions.
    policies: [snap-student-eligibility]
    patterns: [ruleset-output-fact]
    interviewQuestions:
      - "Is [member] currently working at least 20 hours per week?"
      - "Is [member] participating in a state or federally-funded work-study program?"
      - "Is [member] enrolled in a school-sponsored job training or vocational program?"
      - "Is [member] caring for a dependent child under 6, or a child aged 6–11 when
        adequate childcare is unavailable?"
      - "Is [member] receiving TANF assistance?"
      - "Is [member] a single parent enrolled full-time with a dependent child under 12?"

  interviewPrompts.immigrationStatusPrompt:
    interviewPromptRationale: >
      Determine qualified alien status and apply sponsor income and resource deeming
      rules for non-citizen household members.
    policies: [qualified-alien-eligibility, prwora-sponsor-deeming]
    patterns: [ruleset-output-fact]
    interviewQuestions:
      - "What is [member]'s current immigration status?"
      - "When did [member] enter the United States?"
      - "Does [member] have a sponsor who signed an I-864 Affidavit of Support on or
        after December 19, 1997?"
      - "If yes — what is the sponsor's current income and resources?"

  interviewPrompts.changeVerificationPrompt:
    interviewPromptRationale: >
      Identify and document all changes in household circumstances that occurred between
      the application date and the interview date, and determine what verification is
      required.
    policies: [snap-interview-toolkit]
    patterns: [ruleset-output-fact]
    interviewQuestions:
      - "Since you submitted your application, have there been any changes to who lives
        in your household?"
      - "Have there been any changes to income — new jobs, job losses, raises, or changes
        to other income sources?"
      - "Have there been any changes to your household's expenses — rent, utilities,
        childcare, or medical costs?"
      - "Have there been any other changes in your household's situation we should know
        about?"

operations:
  application.submit:
    policies: [snap-application-acceptance, snap-processing-clock, medicaid-processing-clock, snap-right-to-apply]
    patterns: [rpc-state-machine-action]

  application.withdraw:
    policies: [snap-notice-of-action]

  application.close:
    policies: [snap-notice-of-eligibility, medicaid-notice-of-eligibility, snap-fair-hearing-rights]

events:
  intake.application.submitted:
    policies: [snap-processing-clock, medicaid-processing-clock, snap-household-composition]
    patterns: [state-machine-event]

  intake.application.withdrawn:
    policies: [snap-notice-of-action]

  intake.application.closed:
    policies: [snap-notice-of-eligibility, medicaid-notice-of-eligibility, snap-fair-hearing-rights]

  intake.application.review-reminder:
    patterns: [state-machine-timer]
