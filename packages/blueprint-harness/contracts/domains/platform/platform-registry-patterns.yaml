$schema: registry-schema.yaml
version: "1.0"
domain: platform
type: patterns

entries:

  # ── Schema modeling patterns ───────────────────────────────────────────────

  oneof-discriminator:
    description: >
      Inline oneOf with a discriminator property, where all variants are defined
      within the same file (not via external $ref). Exercises discriminated union
      rendering, discriminator label resolution, and variant expansion in the explorer.

  anyof:
    description: >
      anyOf composition — a field that may satisfy more than one schema simultaneously
      (e.g., a record with both electronic and manual verification on file). Exercises
      anyOf rendering and the semantic distinction from oneOf.

  additional-properties-map:
    description: >
      Map type using additionalProperties to allow arbitrary key-value pairs (e.g.,
      labels or metadata). Exercises additionalProperties rendering in the explorer
      and map validation in the schema validator.

  read-only-field:
    description: >
      Field marked readOnly: true — server-generated and never accepted in write
      operations. Common for IDs, computed values, and lifecycle timestamps. Exercises
      readOnly rendering in the explorer and write-operation filtering.

  deprecated-field:
    description: >
      Field marked deprecated: true with a migration note pointing to its replacement.
      Exercises deprecated field rendering in the explorer and tooling warnings.

  string-format:
    description: >
      String field with a format constraint (uuid, date-time, date, email, etc.).
      Exercises format rendering in the explorer and format validation.

  polymorphic-base:
    description: >
      Base schema extended via allOf in Create and Update variants. The Create variant
      adds required fields; the Update variant applies minProperties: 1 for partial
      updates. Exercises allOf merging and the Create/Update schema pattern.

  array-of-enum:
    description: >
      Array of enum values. Exercises array-of-enum rendering in the explorer
      and array item validation in the schema validator.

  x-enum-source:
    description: >
      Enum values resolved at build time from an external source (e.g., a state
      machine's state IDs) via the x-enum-source extension, rather than hardcoded
      in the OpenAPI spec. Exercises the resolver's x-enum-source injection.

  nullable-state-gated-field:
    description: >
      Nullable field that is only present after a lifecycle transition (e.g., a
      timestamp set when an application is submitted). Exercises nullable field
      rendering and the pattern of state-gated fields.

  nullable-conditional-field:
    description: >
      Nullable field whose presence depends on another field's value (e.g., a
      benefit amount present only when eligible is true). Exercises nullable field
      handling and conditional presence patterns.

  external-ref-shared-defs:
    description: >
      External $ref to a shared $defs schema in a separate file. Exercises the
      resolver's cross-file $ref resolution and the explorer's external schema
      name rendering.

  external-ref-defs-oneof:
    description: >
      External $ref to a $defs schema that is itself a oneOf with a discriminator.
      Exercises: (1) cross-file $ref resolution, (2) discriminated union rendering
      with labeled variants, (3) field inventory handling of oneOf inside an
      external $defs ref.

  allof-inline-required:
    description: >
      allOf composition that adds inline required fields without duplicating
      properties (e.g., a Create variant that adds a required field to a base
      schema). Exercises the resolver's allOf merging and the explorer's allOf
      rendering.

  # ── API structure ──────────────────────────────────────────────────────────

  paginated-list:
    description: >
      Collection endpoint returning items/total/limit/offset/hasNext. The standard
      blueprint pagination envelope. Exercises paginated list rendering and parameter
      validation (limit, offset, sort, search).

  sub-resource:
    description: >
      Resource nested under a parent at a path like /parents/{id}/children. Full
      CRUD scoped to the parent. Exercises nested routing, parent FK validation,
      and sub-resource list/detail rendering in the explorer.

  singleton-sub-resource:
    description: >
      Single resource nested under a parent at a path like /parents/{id}/summary,
      with no item-level ID. Accessed only through the parent. Exercises singleton
      sub-resource routing and composition rendering.

  # ── Relationship patterns ──────────────────────────────────────────────────

  intra-domain-fk:
    description: >
      Intra-domain x-relationship foreign key linking a sub-resource back to its
      parent resource within the same domain. Exercises cross-reference rendering
      in the explorer and FK validation.

  cross-domain-fk:
    description: >
      Cross-domain x-relationship foreign key linking a resource in one domain to
      a resource in another. Exercises cross-domain reference rendering and FK
      validation across domain boundaries.

  # ── State machine patterns ─────────────────────────────────────────────────

  rpc-state-machine-action:
    description: >
      RPC-style state machine action with a generated POST endpoint. Exercises the
      RPC overlay generator, x-relationship tagging, and state machine → API
      cross-linking in the explorer.

  state-machine-guard:
    description: >
      Named boolean condition (CEL expression) attached to a state machine action.
      The action can only be triggered when all guard conditions pass. Exercises
      guard evaluation, actor role checking, and guard composition (any/all).

  state-machine-timer:
    description: >
      Timer declaration on a state machine. The scheduling service emits a callback
      event ({domain}.{id}) when the timer fires; the machine subscribes to react.
      Exercises timer declaration rendering and the timer → event subscription link.

  state-machine-subscription:
    description: >
      State machine subscribing to a domain event emitted by a different domain.
      The handler runs steps (create, emit, call) automatically when the event
      arrives. Exercises cross-domain event subscription and handler rendering.

  # ── Event patterns ─────────────────────────────────────────────────────────

  state-machine-event:
    description: >
      Domain event emitted on a state machine transition. Exercises AsyncAPI event
      catalog generation and event → state machine cross-linking.

  cross-domain-event:
    description: >
      Domain event consumed by downstream domains outside the emitting domain.
      Exercises event catalog cross-domain consumer rendering.

  composition:
    description: >
      Read-only singleton resource assembled from fields across multiple resources,
      generated from a compositions contract. Produces a GET endpoint nested under
      the parent resource (e.g. /applications/{id}/summary). Exercises the
      composition generator, x-relationship injection, and singleton rendering
      in the explorer.

  # ── Overlay patterns ──────────────────────────────────────────────────────

  overlay:
    description: >
      Field or element added or modified by an adopter overlay. Overlays
      add state-required fields, tighten enums, and set global configuration
      (x-casing, x-pagination, x-search, x-relationship, x-event-type-prefix).
      Exercises the overlay resolver and adopter-level customization patterns.

  # ── Rules engine patterns ──────────────────────────────────────────────────

  ruleset-output-fact:
    description: >
      Output fact from a ruleset — a fact declared in the outputs list and returned
      by the REST endpoint. Exercises the rules engine → API endpoint link in the
      explorer (Rules badge).

  ruleset-intermediate-fact:
    description: >
      Intermediate fact used internally by other facts but not returned by the REST
      endpoint. Exercises fact graph dependency rendering in the rules-docs visualizer.

  array-of-oneof:
    description: >
      Array whose items are a oneOf discriminated union (e.g., EvaluationResult
      returning EvaluationFact variants). Exercises array-of-oneOf rendering,
      discriminator label resolution, and schema variant expansion.
