# A transcription service for the harness's scenarios, so they can show the
# whole flow without naming a real service. The entries combine with the
# framework's own.
$schema: https://blueprint.codeforamerica.org/schemas/registry-schema.yaml
version: "1.0.0"
domain: communication
capability: transcripts
type: transcription-services

entries:
  fake-transcription:
    description: >
      A fake service for demos and tests. It speaks the relay contract
      (communication-transcripts-relay-asyncapi.yaml) at a URL a browser can
      reach, so the mock answers for it with message stubs, as it would for
      a relay.
