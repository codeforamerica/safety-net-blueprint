# A household's circumstances, as one record: who is in it, their work and
# income, and what they pay. Shared because three things need the same shape
# and must not drift apart — what an application stated (intake), what a
# determination certified (eligibility), and what the household is reporting in
# an interview (the interview flags' input).
#
# Ids inside a household are keys within it, not links to stored records: an
# income's `memberId` names a member of the same household. So they're plain
# strings.
#
# Usage: $ref: '../../common/schemas/household.yaml#/$defs/Household'

$defs:
  Household:
    type: object
    description: A household's circumstances at one point in time.
    properties:
      statedSize:
        type: integer
        minimum: 1
        description: The number of people the household says buy and prepare food together.
      utilitiesIncludedInRent:
        type: boolean
        description: Whether the household says its utilities are included in the rent.
      statedMonthlyIncome:
        type: number
        minimum: 0
        description: Total monthly income, as the household states it.
      statedMonthlyExpenses:
        type: number
        minimum: 0
        description: Total monthly expenses, as the household states them.
      members:
        type: array
        items:
          $ref: '#/$defs/HouseholdMember'
      jobs:
        type: array
        items:
          $ref: '#/$defs/HouseholdJob'
      incomes:
        type: array
        items:
          $ref: '#/$defs/HouseholdIncome'
      expenses:
        type: array
        items:
          $ref: '#/$defs/HouseholdExpense'

  HouseholdMember:
    type: object
    required: [id]
    properties:
      id:
        type: string
        description: The member's key within the household.
      dateOfBirth:
        type: string
        format: date
      isDisabled:
        type: boolean
        description: Whether the member is disabled.

  HouseholdJob:
    type: object
    required: [id, memberId]
    properties:
      id:
        type: string
        description: The job's key within the household.
      memberId:
        type: string
        description: The member who holds the job.
      employer:
        type: string

  HouseholdIncome:
    type: object
    required: [id, memberId, source, amount, frequency]
    properties:
      id:
        type: string
        description: The income's key within the household.
      memberId:
        type: string
        description: The member who receives it.
      jobId:
        type: string
        description: The job it's paid for, when it's earned.
      source:
        type: string
        enum: [earned, self_employment, unearned]
      amount:
        type: number
        minimum: 0
        description: The amount received each time it's paid, in dollars.
      frequency:
        type: string
        enum: [weekly, biweekly, semimonthly, monthly, irregular]
        description: How often it's paid.
      paidInCash:
        type: boolean
      amountVaries:
        type: boolean
        description: Whether the amount changes from one payment to the next, as with irregular hours or tips.

  HouseholdExpense:
    type: object
    required: [type, amount, frequency]
    properties:
      type:
        type: string
        enum: [rent, mortgage, utilities, dependent_care, medical, child_support]
      amount:
        type: number
        minimum: 0
      frequency:
        type: string
        enum: [weekly, biweekly, semimonthly, monthly]
