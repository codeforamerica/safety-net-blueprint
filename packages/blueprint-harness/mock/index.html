<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not your average Mock Server</title>
<!--
  A playground over the browser mock, rather than a tour of it.

  The page is generated from the contracts twice over: the server is, and so
  is this. Which operations exist, what kind of thing each one is, what a
  sensible body looks like, which records you can act on and which moves are
  legal from where they are — every one of those comes out of the contract
  set, which is why this can do things a generic API client cannot. Postman
  hands you a box and wishes you luck.

  Operations are grouped in dependency order, and the order is real rather
  than pedagogical: a composition needs a record to project, a transition
  needs a record already in a particular state. Resources first is not a
  teaching conceit, it is what has to happen.
-->
<style>
  :root {
    --ink: #1a1a1a; --muted: #555; --faint: #888; --line: #e2e2e2;
    --bg: #fafafa; --card: #fff; --accent: #2b6cb0; --ok: #2f7a3f; --bad: #b02b2b;
    --warm: #8a6d3b;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0 0 5rem; background: var(--bg); color: var(--ink);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  h1 { font-size: 1.4rem; margin: 0; }
  code { font-family: var(--mono); font-size: .88em; }

  #masthead {
    max-width: 86rem; margin: 0 auto; padding: 1.6rem 1.2rem 1rem;
    border-bottom: 1px solid var(--line);
  }
  .lede { color: var(--muted); margin: .4rem 0 0; max-width: 46rem; font-size: .95rem; }

  /* Throwing the whole thing away and deriving it again, which is the
     headline claim and takes about as long as a keystroke. */
  #controls { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; margin: .9rem 0 0; }
  #controls .sep { border-left: 1px solid var(--line); height: 1.4rem; margin: 0 .2rem; }
  #controls button:not(.primary) {
    font: inherit; font-size: .85rem; cursor: pointer; padding: .4rem 1rem;
    border-radius: 4px; border: 1px solid var(--line); background: var(--card); color: var(--ink);
  }
  #controls button:disabled { opacity: .4; cursor: not-allowed; }
  #derived { font-family: var(--mono); font-size: .76rem; color: var(--faint); }

  #shell {
    display: grid; grid-template-columns: 17rem minmax(0, 1fr);
    gap: 2rem; max-width: 86rem; margin: 1.4rem auto 0; padding: 0 1.2rem;
  }
  #groups {
    position: sticky; top: 1rem; align-self: start;
    max-height: calc(100vh - 2rem); overflow: auto;
    border-right: 1px solid var(--line); padding-right: .8rem;
  }
  .group > summary {
    cursor: pointer; list-style: none; padding: .45rem .3rem;
    font-size: .76rem; letter-spacing: .06em; text-transform: uppercase;
    font-weight: 700; color: var(--ink);
  }
  .group > summary::-webkit-details-marker { display: none; }
  .group > summary::before { content: '▸ '; color: var(--faint); }
  .group[open] > summary::before { content: '▾ '; }
  .kind {
    margin: .5rem 0 .1rem .3rem; font-size: .68rem; letter-spacing: .05em;
    text-transform: uppercase; color: var(--faint); font-weight: 700;
  }
  .ops { list-style: none; margin: 0 0 .5rem; padding: 0; }
  .op {
    display: block; width: 100%; text-align: left; border: 0; background: none;
    font: inherit; font-size: .8rem; cursor: pointer; color: var(--muted);
    padding: .22rem .45rem; border-radius: 4px; line-height: 1.35;
  }
  .op:hover { background: #f1f4f8; color: var(--ink); }
  .op.here { background: #eef4fb; color: var(--accent); font-weight: 600; }
  .steps { counter-reset: none; }
  .op.step { padding: .34rem .45rem; font-size: .84rem; }
  .op .n {
    font-family: var(--mono); font-size: .7rem; color: var(--faint);
    display: inline-block; min-width: 1.9rem;
  }
  .op.step.here .n { color: var(--accent); }
  .panel .watch {
    margin: 1rem 0 0; padding: .8rem 1rem .9rem; font-size: .9rem; color: var(--ink);
    background: #f4f9f4; border: 1px solid #d6e8d6; border-radius: 4px; max-width: 48rem;
  }
  .watch-title {
    margin: 0 0 .5rem; font-size: .68rem; letter-spacing: .06em; text-transform: uppercase;
    font-weight: 700; color: var(--ok);
  }
  .panel .watch ul { margin: 0; padding-left: 1.1rem; }
  .panel .watch li { margin: 0 0 .45rem; line-height: 1.55; }
  .panel .watch li:last-child { margin-bottom: 0; }
  .panel .watch code { background: #e4efe4; padding: .08em .3em; border-radius: 3px; }
  .op .n.run { color: var(--ok); font-weight: 700; }
  .to-come { margin: .5rem 0 0 .45rem; font-size: .78rem; color: var(--faint); font-style: italic; }
  .next-step {
    margin: .8rem 0 0; font: inherit; font-size: .85rem; cursor: pointer; padding: .35rem .9rem;
    border-radius: 4px; border: 1px solid var(--ok); background: var(--ok); color: #fff;
  }
  .op .verb {
    font-family: var(--mono); font-size: .68rem; font-weight: 700;
    display: inline-block; min-width: 3.4rem; color: var(--faint);
  }
  .op.here .verb { color: var(--accent); }

  #stage { min-width: 0; }
  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: 6px;
    padding: 1.1rem 1.2rem; margin: 0 0 1.2rem;
  }
  .panel .kindline {
    font-size: .68rem; letter-spacing: .05em; text-transform: uppercase;
    font-weight: 700; color: var(--accent); margin: 0 0 .25rem;
  }
  .panel h2 { font-size: 1.05rem; margin: 0 0 .2rem; }
  .panel .about {
    color: var(--muted); font-size: .9rem; margin: 0 0 .8rem; padding: 0 0 .8rem;
    border-bottom: 1px solid var(--line); max-width: 46rem;
  }
  .panel .path { font-family: var(--mono); font-size: .82rem; color: var(--accent); margin: 0 0 .7rem; }
  .panel .note { color: var(--muted); font-size: .9rem; margin: 0 0 .9rem; max-width: 46rem; }
  .panel .cited { font-family: var(--mono); font-size: .74rem; color: var(--faint); margin: 0 0 .9rem; }
  .panel .cited code { background: #eef2f6; color: var(--ink); padding: .08em .3em; border-radius: 3px; }
  .panel .cited a { color: var(--accent); text-decoration: none; border-bottom: 1px dotted currentColor; }
  .panel .cited a:hover { border-bottom-style: solid; }

  label.field { display: block; margin: 0 0 .7rem; font-size: .82rem; color: var(--muted); }
  label.field > span { display: block; margin-bottom: .22rem; }
  label.field code { background: #eef2f6; padding: .08em .3em; border-radius: 3px; }
  label.field a { color: var(--accent); text-decoration: none; border-bottom: 1px dotted currentColor; }
  input[type=text], select, textarea {
    width: 100%; font-family: var(--mono); font-size: .8rem; padding: .4rem .5rem;
    border: 1px solid var(--line); border-radius: 4px; background: #fcfcfc; color: var(--ink);
  }
  textarea { min-height: 9rem; resize: vertical; line-height: 1.5; }
  textarea.fixed { background: #f3f3f3; color: var(--muted); cursor: default; }

  button.primary {
    font: inherit; font-size: .85rem; cursor: pointer; padding: .4rem 1rem;
    border-radius: 4px; border: 1px solid var(--accent); background: var(--accent); color: #fff;
  }
  button.primary:disabled { opacity: .45; cursor: not-allowed; }

  pre {
    margin: .8rem 0 0; padding: .7rem .8rem; max-height: 26rem; overflow: auto;
    background: #f7f9fc; border: 1px solid #dbe4f0; border-radius: 4px;
    font-family: var(--mono); font-size: .76rem; line-height: 1.5; white-space: pre-wrap;
  }
  pre .label {
    display: block; font-family: inherit; font-size: .68rem; letter-spacing: .04em;
    text-transform: uppercase; color: var(--accent); margin-bottom: .35rem; font-weight: 600;
  }
  pre .label code { font-family: var(--mono); text-transform: none; letter-spacing: 0; }
  pre .label a { color: inherit; text-transform: none; letter-spacing: 0; border-bottom: 1px dotted currentColor; text-decoration: none; }
  pre.bad { background: #fdf6f6; border-color: #eccfcf; }
  pre.bad .label { color: var(--bad); }

  .empty { color: var(--faint); font-size: .9rem; }
  @media (max-width: 60rem) {
    #shell { grid-template-columns: 1fr; }
    #groups { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header id="masthead">
  <h1>Not your average Mock Server</h1>
  <p class="lede">
    An entire server, generated from a set of contracts, running in this tab.
    Every endpoint below came out of a document. Nothing here was written for
    applications, or for SNAP — the same server runs whatever contracts you
    give it.
  </p>
  <div id="controls">
    <button id="mode" class="primary">Let me explore</button>
    <span class="sep"></span>
    <button id="reseed">Restart with data</button>
    <button id="empty">Start empty</button>
    <span id="derived">starting…</span>
  </div>
</header>

<div id="shell">
  <nav id="groups" aria-label="Operations"></nav>
  <main id="stage"></main>
</div>

<script type="module">
const { createMockServer, extract, generate } =
  globalThis.BlueprintMock ?? await import('./mock.js');

const $ = (id) => document.getElementById(id);
const el = (tag, text = '', className = '') => {
  const node = document.createElement(tag);
  if (text !== '') node.textContent = text;
  if (className) node.className = className;
  return node;
};

/** Everything below the directory this page is served from. */
const basePath = location.pathname.replace(/\/[^/]*$/, '');

/** Where this checkout's contracts are browsable, if the build knew. */
const pageConfig = (() => {
  const tag = document.getElementById('page-config');
  try { return tag ? JSON.parse(tag.textContent) : {}; } catch { return {}; }
})();
const CALLER = 'the-explorer';

let docs;          // every document in the set
let mock;          // the server derived from them
let seeded = true; // whether the last derive loaded the shipped records
let showAll = false;  // the walk-through, or the whole reference
const done = new Set(); // steps of the walk already run, by method and path
let selected = null;

/**
 * The contract set, inlined by the single-file build or fetched beside the
 * page when it is served.
 */
const loadContracts = async () => {
  const inlined = document.getElementById('contracts-data');
  if (inlined) return JSON.parse(inlined.textContent);
  const response = await fetch('./contracts.json');
  if (!response.ok) throw new Error(`contracts.json: ${response.status}`);
  return response.json();
};

const call = async (method, path, body) => {
  const init = { method, headers: { 'X-Caller-Id': CALLER } };
  if (body instanceof FormData) {
    init.body = body;
  } else if (body !== undefined) {
    init.headers['content-type'] = 'application/json';
    init.body = typeof body === 'string' ? body : JSON.stringify(body);
  }
  const response = await mock.fetch(new Request(new URL(basePath + path, location.origin), init));
  const text = await response.text();
  let parsed;
  try { parsed = JSON.parse(text); } catch { parsed = text; }
  return { status: response.status, statusText: response.statusText, body: parsed };
};

// ── Reading the contracts ───────────────────────────────────────────────────

const openapiDocs = () => docs.filter((doc) => doc.type === 'openapi');

/** The server prefix an OpenAPI document's paths hang off. */
const prefixOf = (doc) => {
  const [server] = doc.content?.servers ?? [];
  if (!server?.url) return '';
  try { return new URL(server.url).pathname.replace(/\/$/, ''); } catch { return server.url; }
};

/**
 * Every operation the loaded documents declare, with where it came from.
 *
 * Read off the documents rather than the server's route table: the table
 * registers four extra methods on a read-only projection purely so they can
 * answer 405, and offering those is offering four ways to be told no.
 */
const operations = () => {
  const found = [];
  for (const doc of openapiDocs()) {
    const prefix = prefixOf(doc);
    for (const [declared, item] of Object.entries(doc.content?.paths ?? {})) {
      for (const [method, operation] of Object.entries(item ?? {})) {
        if (!/^(get|post|put|patch|delete)$/.test(method)) continue;
        found.push({
          method: method.toUpperCase(),
          path: prefix + declared,
          template: declared,
          operation,
          doc,
          domain: doc.domain ?? doc.content?.info?.['x-domain'] ?? 'other',
          summary: operation.summary ?? operation.operationId ?? `${method.toUpperCase()} ${declared}`,
        });
      }
    }
  }
  return found;
};

/** The state machine actions the loaded documents declare, by endpoint path. */
const actions = () => {
  const byPath = new Map();
  for (const doc of docs.filter((d) => d.type === 'state-machine')) {
    for (const machine of doc.content?.machines ?? []) {
      for (const action of machine.actions ?? []) {
        const from = action.transition?.from;
        byPath.set(action.id, {
          id: action.id,
          object: machine.object,
          from: Array.isArray(from) ? from : String(from ?? '').split(',').map((s) => s.trim()),
          to: action.transition?.to,
          doc: doc.relativePath,
        });
      }
    }
  }
  return byPath;
};

/**
 * The paths every declared composition owns, including the ones it generates
 * beneath itself — section panels and the per-section review state.
 *
 * Without this they classify as ordinary item routes, and nineteen of them
 * pile into Resources, which is both wrong and the exact overwhelm this page
 * is supposed to avoid.
 */
const compositionPaths = () => {
  const owned = new Map();
  for (const doc of docs.filter((d) => d.type === 'compositions')) {
    for (const [name, declared] of Object.entries(doc.content?.compositions ?? {})) {
      const base = declared.endpoint?.path;
      if (!base) continue;
      owned.set(base, { name, doc: doc.relativePath });
      // A sectioned composition serves a panel per section and a progress
      // resource alongside it; both hang off the same declared path.
      for (const suffix of ['/{section}', '/{section}/{itemId}']) {
        owned.set(base + suffix, { name, doc: doc.relativePath });
      }
      const progress = base.replace(/\/[^/]+$/, '/review-progress');
      for (const suffix of ['/{section}', '/{section}/{itemId}']) {
        owned.set(progress + suffix, { name, doc: doc.relativePath });
      }
      for (const section of Object.keys(declared.sections ?? {})) {
        owned.set(`${base}/${section}`, { name, doc: doc.relativePath });
      }
    }
  }
  return owned;
};

/** The rulesets the loaded documents declare, and the examples for each. */
const rulesets = () => {
  const examples = new Map();
  for (const doc of docs.filter((d) => d.type === 'rules-examples')) {
    for (const [name, declared] of Object.entries(doc.content?.rulesets ?? {})) {
      examples.set(name, declared.examples ?? []);
    }
  }
  const found = [];
  for (const doc of docs.filter((d) => d.type === 'rules')) {
    for (const [name, declared] of Object.entries(doc.content?.rulesets ?? {})) {
      found.push({ name, ruleset: declared, doc: doc.relativePath, examples: examples.get(name) ?? [] });
    }
  }
  return found;
};

/**
 * What kind of thing an operation is.
 *
 * The affordance a reader needs differs completely between these, and the
 * contracts are what say which is which — a transition is only a transition
 * because a state machine declares an action whose endpoint this is.
 */
const classify = (op) => {
  const last = op.template.split('/').filter(Boolean).pop() ?? '';
  const act = actions().get(last);
  if (op.method === 'POST' && act) return { kind: 'transition', action: act };
  if (op.method === 'POST' && /\/evaluate-/.test(op.template)) {
    const name = last.replace(/^evaluate-/, '');
    const found = rulesets().find((r) => r.name.toLowerCase() === name.replace(/-/g, '').toLowerCase());
    return { kind: 'rules', ruleset: found ?? rulesets()[0] ?? null };
  }
  const composed = compositionPaths().get(op.template);
  if (composed) return { kind: 'composition', composition: composed };
  if (op.operation.requestBody?.content?.['multipart/form-data']) return { kind: 'upload' };
  if (/\/stream$/.test(op.template)) return { kind: 'stream' };
  if (op.template.includes('{')) return { kind: 'item' };
  return { kind: op.method === 'POST' ? 'create' : 'collection' };
};

// ── Example bodies ──────────────────────────────────────────────────────────

/** The schema an operation's JSON request body points at, dereferenced. */
const requestSchema = (op) => {
  const schema = op.operation.requestBody?.content?.['application/json']?.schema;
  return schema ? deref(schema, op.doc) : null;
};

const deref = (node, doc, seen = 0) => {
  if (!node || typeof node !== 'object' || seen > 8) return node;
  if (typeof node.$ref !== 'string') return node;

  const [file, fragment = ''] = node.$ref.split('#');
  // Same document.
  if (file === '') {
    const target = fragment.replace(/^\//, '').split('/').reduce((at, key) => at?.[key], doc.content);
    return deref(target, doc, seen + 1);
  }

  // Another one. The reference may be written relative or as a URL, and the
  // set is keyed by repository-relative path, so match on the tail.
  const wanted = file.replace(/^.*?([^/]+\/[^/]+\/[^/]+)$/, '$1');
  const other = docs.find((candidate) => candidate.relativePath
    && (candidate.relativePath === wanted || candidate.relativePath.endsWith(wanted)));
  if (!other) return node;
  const target = fragment
    ? fragment.replace(/^\//, '').split('/').reduce((at, key) => at?.[key], other.content)
    : other.content;
  return deref(target, other, seen + 1);
};

/**
 * A body worth pressing Execute on.
 *
 * In descending order of how much a reader learns from it: a record the
 * contract set already ships as mock data, with the server's own fields
 * stripped; then the schema's declared example; then something built from
 * the schema, which at least gets the enums right. Typing a correct body
 * from scratch is the thing that makes an unfamiliar API exhausting.
 */
const exampleBody = (op) => {
  // A ruleset's inputs are nested and nobody can type them from memory. The
  // contract set ships described examples for exactly this reason.
  if (op.kind === 'rules') {
    const [first] = op.ruleset?.examples ?? [];
    if (first?.inputs) return first.inputs;
    const inputs = op.ruleset?.ruleset?.inputs ?? {};
    return Object.fromEntries(
      Object.entries(inputs).map(([name, declared]) => [name, fromSchema(declared, op.doc)])
    );
  }

  const schema = requestSchema(op);
  if (!schema) return null;

  const managed = new Set(['id', 'createdAt', 'updatedAt', 'status', '_links']);
  const writable = new Set(Object.keys(collectProperties(schema, op.doc)));

  for (const data of docs.filter((d) => d.type === 'mock-data' && d.domain === op.doc.domain)) {
    for (const record of Object.values(data.content ?? {})) {
      if (!record || typeof record !== 'object') continue;
      const body = Object.fromEntries(
        Object.entries(record).filter(([key]) => writable.has(key) && !managed.has(key))
      );
      if (Object.keys(body).length > 0) return body;
    }
  }

  if (op.operation.requestBody?.content?.['application/json']?.example) {
    return op.operation.requestBody.content['application/json'].example;
  }
  return fromSchema(schema, op.doc);
};

/** Every property on a schema, following allOf. */
const collectProperties = (schema, doc) => {
  const out = {};
  for (const part of [schema, ...(schema?.allOf ?? [])]) {
    const resolved = deref(part, doc);
    Object.assign(out, resolved?.properties ?? {});
    for (const inner of resolved?.allOf ?? []) {
      Object.assign(out, deref(inner, doc)?.properties ?? {});
    }
  }
  return out;
};

/** A plausible value for each required property, taking enums seriously. */
const fromSchema = (schema, doc) => {
  const properties = collectProperties(schema, doc);
  const required = new Set([
    ...(schema?.required ?? []),
    ...(schema?.allOf ?? []).flatMap((part) => deref(part, doc)?.required ?? []),
  ]);
  const body = {};
  for (const [name, declared] of Object.entries(properties)) {
    if (!required.has(name)) continue;
    body[name] = valueFor(deref(declared, doc), doc);
  }
  return Object.keys(body).length > 0 ? body : {};
};

const valueFor = (declared, doc) => {
  if (!declared) return null;
  if (Array.isArray(declared.enum)) return declared.enum[0];
  switch (declared.type) {
    case 'integer': case 'number': return 0;
    case 'boolean': return false;
    case 'array': {
      const items = deref(declared.items, doc);
      return items ? [valueFor(items, doc)] : [];
    }
    case 'object': return fromSchema(declared, doc);
    default: return declared.format === 'date-time' ? new Date().toISOString() : '';
  }
};

// ── Records, for the pickers ────────────────────────────────────────────────

/** The collection an item or transition path hangs off. */
const collectionOf = (op) => op.path.slice(0, op.path.indexOf('/{'));

/** What the server is holding in a collection, for a picker to offer. */
const recordsIn = async (path) => {
  const answered = await call('GET', `${path}?limit=50`);
  return Array.isArray(answered.body?.items) ? answered.body.items : [];
};

// ── Boot ────────────────────────────────────────────────────────────────────

/**
 * Throw the server away and derive it again from the documents.
 *
 * Not a reset of the data — a rebuild of the system. The route table, the
 * validators, the state machines and the rules are all produced again from
 * the contract set, and the time it takes is printed because it is the
 * claim: an entire backend, in about as long as a keystroke.
 */
const derive = async ({ seed = true, artifact } = {}) => {
  $('derived').textContent = 'deriving…';
  const started = performance.now();

  const set = artifact ?? contracts;
  docs = extract(set, 'docs');
  mock = await createMockServer({ contracts: set, basePath, seed });
  seeded = seed;

  const ms = Math.round(performance.now() - started);
  $('derived').textContent = `${docs.length} documents → ${mock.routes.size} routes`
    + `, ${seed ? 'seeded' : 'empty'}, derived in ${ms} ms`;

  selected = null;
  renderGroups();
  renderStage();
};

// ── The groups ──────────────────────────────────────────────────────────────

/**
 * Operations in dependency order, which is the order a reader has to meet
 * them in: a composition needs a record to project, a transition needs a
 * record already in a particular state.
 */
const GROUPS = [
  {
    id: 'resources',
    title: 'Resources',
    about: 'Create, read, search and change records. The part of an API everyone already knows.',
    holds: (kind) => ['collection', 'create', 'item', 'upload'].includes(kind),
  },
  {
    id: 'compositions',
    title: 'Compositions',
    about: 'A shape nothing stores, assembled on read from wherever the pieces live.',
    holds: (kind) => kind === 'composition',
  },
  {
    id: 'behaviour',
    title: 'Behaviour',
    about: 'Not fields you set — moves the contract allows, and only from where it says.',
    holds: (kind) => kind === 'transition',
  },
  {
    id: 'rules',
    title: 'Rules',
    about: 'Policy the system evaluates, with the thresholds declared as inputs.',
    holds: (kind) => kind === 'rules',
  },
  {
    id: 'control',
    title: 'The mock itself',
    about: 'The only endpoints here that no contract declares. They belong to the harness, not to the system it is running — resetting it, reseeding it, and standing in for whatever has not been built.',
    holds: (kind) => kind === 'control' || kind === 'stub',
  },
];

/**
 * A handful worth being walked through, rather than everything there is.
 *
 * Sixty-two operations is a reference, and a reference is a bad first
 * impression: there is no way to tell which three of them are the point.
 * This takes one domain — whichever declares the most different *kinds* of
 * thing, so the walk covers the most ground — and from it one of each kind,
 * every move its lifecycle allows, and the shared event log. Chosen by rule
 * rather than by a list of paths, so another contract set curates itself.
 */
const curate = (ops) => {
  const kindsPerDomain = new Map();
  for (const op of ops) {
    const seen = kindsPerDomain.get(op.domain) ?? new Set();
    seen.add(op.kind);
    kindsPerDomain.set(op.domain, seen);
  }
  const lead = [...kindsPerDomain.entries()]
    .sort((a, b) => b[1].size - a[1].size
      || ops.filter((o) => o.domain === b[0]).length - ops.filter((o) => o.domain === a[0]).length)
    .map(([name]) => name)[0];

  const picked = [];
  const mine = ops.filter((op) => op.domain === lead);
  const shortest = (candidates) => [...candidates].sort((a, b) => a.path.length - b.path.length)[0];

  // One of each kind, preferring the least nested, which is the one whose
  // point is easiest to see.
  for (const kind of ['create', 'collection', 'composition']) {
    const one = shortest(mine.filter((op) => op.kind === kind));
    if (one) picked.push(one);
  }
  // Reading one back and changing it are different things to learn, so the
  // walk gets both rather than whichever item route happened to be shortest.
  for (const method of ['GET', 'PATCH']) {
    const one = shortest(mine.filter((op) => op.kind === 'item' && op.method === method));
    if (one) picked.push(one);
  }
  // Every move, because a lifecycle with one move in it is not a lifecycle.
  picked.push(...mine.filter((op) => op.kind === 'transition'));
  // Every ruleset, wherever it lives: they do genuinely different jobs.
  picked.push(...ops.filter((op) => op.kind === 'rules'));
  // And the log they all write into.
  const log = ops.find((op) => op.kind === 'collection' && /\/events$/.test(op.path));
  if (log) picked.push(log);

  return picked;
};

/** What identifies a step, for remembering it has been run. */
const keyOf = (op) => `${op.method} ${op.path}`;

/** `applications` → `application`, for naming a step after what it acts on. */
const singular = (plural) => plural.replace(/ies$/, 'y').replace(/s$/, '');

/**
 * The resource an operation acts on.
 *
 * For anything hanging off a record — a composition, a transition — that is
 * the record, not the last segment of the path: a view of an application is
 * not "a view of the review".
 */
const subjectOf = (op) => {
  const path = op.path.includes('/{') ? op.path.slice(0, op.path.indexOf('/{')) : op.path;
  const parts = path.split('/').filter(Boolean).filter((part) => !part.startsWith('{'));
  return singular(parts[parts.length - 1] ?? 'record');
};

/**
 * The lifecycle in the order it is actually lived, rather than the order the
 * actions happen to be written in.
 */
const lifecycleOrder = (transitions, { happyPathOnly = false } = {}) => {
  const reachable = new Set(transitions.map((op) => op.action.to));
  const starts = transitions.filter((op) => op.action.from.every((state) => !reachable.has(state)));
  const ordered = [];
  const left = [...transitions];
  let at = starts[0]?.action.from ?? [];

  while (left.length > 0) {
    const index = left.findIndex((op) => op.action.from.some((state) => at.includes(state)));
    if (index === -1) break;
    const [next] = left.splice(index, 1);
    ordered.push(next);
    at = [next.action.to];
  }
  // Whatever is left could not be reached by walking forward: withdraw, and
  // anything else that leaves the path rather than continuing along it. Real
  // moves, and in the reference — but following Close with Withdraw reads
  // like a step rather than the alternative ending it is.
  return happyPathOnly ? ordered : [...ordered, ...left];
};

/**
 * The policies attached to the fields of what an operation returns, and the
 * regulation each one cites.
 *
 * Annotations key off `object.field` and name policies; a registry every
 * domain shares resolves each policy to a citation and a sentence. Neither
 * is an endpoint and neither appears in a response, so without this the
 * most defensible thing in the contract set is invisible.
 */
const policiesOn = (op) => {
  const answers = op.operation.responses ?? {};
  const name = refName((answers['200'] ?? answers['201'])?.content?.['application/json']?.schema);
  if (!name) return [];
  const object = name.charAt(0).toLowerCase() + name.slice(1);

  const registry = new Map();
  for (const doc of docs.filter((d) => d.type === 'registry' && /polic/.test(d.relativePath))) {
    for (const [id, entry] of Object.entries(doc.content?.entries ?? {})) registry.set(id, entry);
  }

  const found = [];
  for (const doc of docs.filter((d) => d.type === 'annotations')) {
    for (const [path, declared] of Object.entries(doc.content?.schema ?? {})) {
      const [on, field] = path.split('.');
      if (on !== object || !field || !declared?.policies?.length) continue;
      const policy = declared.policies[0];
      const entry = registry.get(policy) ?? {};
      found.push({
        field,
        policy,
        citation: entry.citation ?? null,
        summary: (entry.description ?? '').trim().split('\n')[0],
      });
    }
  }
  return found;
};

/**
 * Annotated fields on the objects hanging off this one.
 *
 * A household member's date of birth answers to CHIP age rules and to SNAP
 * deductions at once. That lives under `applicationMember`, not
 * `application`, so looking only at the object returned misses it.
 */
const relatedPolicies = (op) => {
  const answers = op.operation.responses ?? {};
  const name = refName((answers['200'] ?? answers['201'])?.content?.['application/json']?.schema);
  if (!name) return [];
  const object = name.charAt(0).toLowerCase() + name.slice(1);
  const found = [];
  for (const doc of docs.filter((d) => d.type === 'annotations')) {
    for (const [path, declared] of Object.entries(doc.content?.schema ?? {})) {
      const [on, field] = path.split('.');
      if (!field || on === object || !on?.startsWith(object)) continue;
      if ((declared?.policies ?? []).length < 2) continue;
      found.push({ object: on, field, policies: declared.policies });
    }
  }
  return found;
};

/** The schema an operation answers with, dereferenced. */
const responseSchema = (op) => {
  const answers = op.operation.responses ?? {};
  const ok = answers['200'] ?? answers['201'] ?? answers['202'];
  let schema = ok?.content?.['application/json']?.schema;
  schema = schema ? deref(schema, op.doc) : null;
  // A collection answers with an envelope; the interesting shape is inside.
  const items = schema?.properties?.items;
  return items ? deref(deref(items, op.doc).items, op.doc) : schema;
};

const listOf = (names) => names.map((name) => `\`${name}\``).join(', ');

/** The name a schema is declared under, from a `$ref`. */
const refName = (node) => (typeof node?.$ref === 'string' ? node.$ref.split('/').pop() : null);

/** What an operation takes and what it gives back, by name. */
const shapesOf = (op) => {
  const sent = refName(op.operation.requestBody?.content?.['application/json']?.schema);
  const answers = op.operation.responses ?? {};
  const ok = answers['201'] ?? answers['200'] ?? answers['202'];
  return { sent, got: refName(ok?.content?.['application/json']?.schema) };
};

/**
 * What to notice, read off the contract for this exact operation.
 *
 * Generic sentences about what a composition "is" sound like marketing and
 * teach nobody anything. A reader wants the join: this field, in this
 * document, is why the server did that. So every line below names something
 * they can go and look at — a flag on a property, an expression, a state, a
 * citation — rather than describing the idea in the abstract.
 */
const noticesFor = (op) => {
  const out = [];
  const schema = responseSchema(op);
  const props = schema ? collectProperties(schema, op.doc) : {};
  const resolved = Object.fromEntries(
    Object.entries(props).map(([name, declared]) => [name, deref(declared, op.doc)])
  );

  const readOnly = Object.entries(resolved)
    .filter(([, declared]) => declared?.readOnly && !declared['x-derived'])
    .map(([name]) => name);
  const derived = Object.entries(resolved).filter(([, declared]) => declared?.['x-derived']);
  const enums = Object.entries(resolved).filter(([, declared]) => Array.isArray(declared?.enum));

  // Each step says what is new about *it*. The same three lines on create,
  // read, edit and list taught nothing after the first and made the box
  // look like boilerplate, which is how a reader learns to skip it.
  // Two schemas, not one — and it is the reason the rest of this is true.
  const { sent, got } = shapesOf(op);
  const article = (word) => (/^[aeiou]/i.test(word) ? 'an' : 'a');
  if (['create', 'edit'].includes(op.kind) && sent && got && sent !== got) {
    out.push(`You sent ${article(sent)} \`${sent}\` and got back ${article(got)} \`${got}\` — two `
      + 'schemas, not one. The contract declares the shape a client may write separately from the '
      + 'shape the system keeps.');
  }

  if (op.kind === 'create') {
    if (readOnly.length > 0) {
      out.push(`${listOf(readOnly.slice(0, 5))} are marked \`readOnly\`, so they are not on the shape `
        + 'you sent at all. The server filled them in because the document says they exist.');
    }
    for (const [name, declared] of derived) {
      out.push(`\`${name}\` is a derived field. Nothing stores it — the contract computes it with `
        + `\`${declared['x-derived']}\`, evaluated every time the record is read.`);
    }
    for (const [name, declared] of enums.slice(0, 1)) {
      out.push(`\`${name}\` is an enum in the contract — ${declared.enum.map((v) => `\`${v}\``).join(', ')}. `
        + 'Send anything else and the schema refuses it, with no validation written to do that.');
    }
  }

  if (op.kind === 'item') {
    for (const [name, declared] of derived) {
      out.push(`\`${name}\` was computed again just now, from \`${declared['x-derived']}\`. It is not `
        + 'read from a column, so it cannot drift from the field it counts.');
    }
    out.push('Same record, same id — read straight back out of the store.');
  }

  if (op.kind === 'edit') {
    out.push('Only the field you sent changed; everything else is as it was, and `updatedAt` moved on its own.');
    if (readOnly.length > 0) {
      out.push(`Try adding ${listOf(readOnly.slice(0, 3))} to the body and it is refused — not by a check `
        + 'somebody wrote, but because those fields are not on the shape you are allowed to send.');
    }
  }

  if (op.kind === 'collection') {
    const params = (op.operation.parameters ?? [])
      .map((parameter) => deref(parameter, op.doc)?.name)
      .filter(Boolean);
    if (params.length > 0) {
      out.push(`The operation declares ${listOf(params)} as query parameters. Declaring them was all `
        + 'it took — the searching, filtering and paging came with them.');
    }
    const sortable = op.operation['x-sortable'];
    if (sortable?.fields) {
      out.push(`\`x-sortable\` lists ${listOf(sortable.fields.slice(0, 5))} as the fields that may be `
        + `sorted, defaulting to \`${sortable.default}\`. Ask for one outside that list and it names it.`);
    }
    out.push('`items`, `total`, `limit`, `offset` — the page envelope is the contract\'s shape, not a convention the mock chose.');
  }

  if (op.kind === 'transition') {
    out.push(`The contract declares this move as \`${op.action.from.join(' | ')} → ${op.action.to}\`. `
      + 'Run it from anywhere else and it is refused — nothing checks the state, the refusal is the declaration.');
    const timer = timerRequest();
    if (timer && timer.action === op.action.id) {
      out.push(`This action also calls \`${'requestTimer'}\` with \`fireAfter: ${timer.after}\`, which emits `
        + `\`${timer.on}\`. The stand-in you registered answers it immediately, so \`${timer.callback}\` `
        + 'is already in the event log rather than three days away.');
    }
  }

  if (op.kind === 'composition') {
    const found = op.composition && docs
      .filter((doc) => doc.type === 'compositions')
      .flatMap((doc) => Object.entries(doc.content?.compositions ?? {}))
      .find(([name]) => name === op.composition.name);
    const declared = found?.[1];
    if (declared) {
      const fields = Array.isArray(declared.fields) ? declared.fields : Object.keys(declared.fields ?? {});
      if (fields.length > 0) {
        out.push(`The composition projects ${listOf(fields.slice(0, 6))} from the record — a subset `
          + 'the document chose, not whoever wrote an endpoint.');
      }
      if (declared.include) {
        out.push(`It pulls in ${listOf(Object.keys(declared.include))} alongside, so one request answers what `
          + 'would otherwise be several. No table holds this shape.');
      }
    }
  }

  if (op.kind === 'rules') {
    const set = op.ruleset?.ruleset;
    const policy = Object.entries(set?.inputs?.policy?.properties ?? {});
    const facts = set?.facts ?? [];
    if (facts.length > 0) {
      const last = facts[facts.length - 1];
      out.push(`The answer is not one expression but a chain of named facts. The last is `
        + `\`${last.path} = ${last.expression}\` — so the system can say which condition carried, not just what it concluded.`);
    }
    for (const [name, declared] of policy.slice(0, 2)) {
      const cites = (declared.description ?? '').match(/\d+\s*CFR\s*§?\s*[\d.()a-z]+/i);
      let citation = cites ? cites[0].replace(/\.+$/, '') : null;
      while (citation && citation.endsWith(')')
        && (citation.match(/\(/g) ?? []).length < (citation.match(/\)/g) ?? []).length) {
        citation = citation.slice(0, -1);
      }
      out.push(`\`${name}\` is an input with a default of \`${declared.default}\``
        + `${citation ? `, citing ${citation}` : ''}. It is a number Congress changes, so the contract `
        + 'treats it as one rather than burying it in code.');
    }
    out.push('A `placeholder` state means it answered, but something it read fell back to a declared '
      + 'default rather than a value you gave it.');
  }

  if (op.kind === 'events') {
    const channels = docs
      .filter((doc) => doc.type === 'asyncapi')
      .flatMap((doc) => Object.keys(doc.content?.channels ?? {}));
    out.push('Every change you made emitted one of these. Nothing asked for them.');
    if (channels.length > 0) {
      out.push(`The types are declared as channels in the contract set — ${listOf(channels.slice(0, 4))}`
        + `${channels.length > 4 ? `, and ${channels.length - 4} more` : ''}.`);
    }
    out.push('One log, every domain. Nothing wired them together.');
  }

  if (op.kind === 'stub') {
    const timer = timerRequest();
    if (timer) {
      out.push(`Nothing in the contract set implements a scheduler, and \`${timer.action}\` asks for one `
        + `\`${timer.after}\` out. That gap is declared, not accidental.`);
      out.push(`This registers a stand-in for \`${timer.on}\`, so the callback lands the moment it is asked `
        + 'for. The contract did not change — the thing on the other end of it did.');
    }
  }

  if (op.kind === 'control') {
    out.push('No contract declares this endpoint. It belongs to the mock, not to the system it is running.');
    if (op.says) out.push(op.says);
  }

  // Each of the next few belongs to one step rather than to every step that
  // happens to return the same object. They were on all three of create,
  // read and edit, six identical bullets deep, because they key off the
  // response shape — and a bullet a reader has already read twice is one
  // they learn to skip. Submitting is when the clock starts, when the
  // status moves, and when the field with the regulation attached to it
  // gets written, so that is where those three live.

  // A deadline clock declared as a document rather than as a job somewhere.
  if (op.kind === 'transition' && (resolved.slaTypeCode || resolved.slaInfo)) {
    for (const doc of docs.filter((d) => d.type === 'sla-types')) {
      const [sla] = doc.content?.slaTypes ?? [];
      if (!sla) continue;
      const pause = sla.pauseWhen ? JSON.stringify(sla.pauseWhen) : null;
      out.push(`\`slaTypeCode\` and \`slaInfo\` are filled from an SLA document: \`${sla.id}\` runs `
        + `${sla.duration.amount} ${sla.duration.unit}, warns at ${sla.warningThresholdPercent}% of it`
        + `${pause ? `, and stops when \`${pause}\`` : ''}. The clock is a declaration, not a cron job.`);
      break;
    }
  }

  // Links to shapes that are not tables, because a composition asked for
  // them. On the read, where following one is the obvious next thought.
  if (op.kind === 'item' && resolved._links) {
    const named = docs
      .filter((doc) => doc.type === 'compositions')
      .flatMap((doc) => Object.entries(doc.content?.compositions ?? {}))
      .filter(([, declared]) => declared.endpoint?.parentLink)
      .map(([name]) => name);
    if (named.length > 0) {
      out.push(`\`_links\` appeared because ${listOf(named)} declare \`parentLink\`. The record points `
        + 'at shapes that no table holds, and it did not have to be told they exist.');
    }
  }

  // The legal authority attached to a field, which is the thing no other
  // API client could tell you. An annotation names a policy, and a registry
  // every domain shares resolves that policy to the regulation behind it —
  // so a denial can cite the rule rather than reporting that the system
  // said no.
  const governing = op.kind === 'transition' ? policiesOn(op) : [];
  for (const { field, policy, citation, summary } of governing.slice(0, 2)) {
    out.push(`\`${field}\` is annotated with \`${policy}\``
      + `${citation ? `, which the shared policy registry resolves to ${citation}` : ''}. ${summary}`);
  }

  // One field can answer to more than one programme, and the contract says
  // which — including on the objects hanging off this one.
  const nested = op.kind === 'composition' ? relatedPolicies(op) : [];
  for (const { object, field, policies } of nested.slice(0, 1)) {
    out.push(`\`${object}.${field}\` cites ${listOf(policies)} — one field, more than one `
      + 'programme, each named rather than left to whoever implements the form.');
  }

  // Last, because it is the least surprising line here: true of every
  // operation, so a reader who stops before it has lost nothing.
  const codes = Object.keys(op.operation.responses ?? {}).filter((code) => /^\d+$/.test(code));
  if (codes.length > 1) {
    const good = codes.filter((code) => code.startsWith('2'));
    const bad = codes.filter((code) => !code.startsWith('2'));
    out.push(`The contract declares ${listOf(good)} on success and ${listOf(bad)} for the ways this `
      + `can fail. ${bad.includes('409')
        ? 'A `409` appears here because the document expects this call to be made out of turn.'
        : 'The status you get back was chosen by the document, not by the mock.'}`);
  }

  return out;
};

/**
 * A deadline a move asks somebody else to keep.
 *
 * An action that calls a procedure with a `callback` is asking for a timer:
 * wake me in N hours and send this event. Nothing in the contract set
 * implements a scheduler, which is the whole point — in a deployment one
 * answers, and here a stub does, which is what makes a 72-hour deadline
 * something you can watch happen.
 */
const timerRequest = () => {
  const procedures = new Map();
  for (const doc of docs.filter((d) => d.type === 'state-machine')) {
    for (const procedure of doc.content?.procedures ?? []) procedures.set(procedure.id, procedure);
  }
  for (const doc of docs.filter((d) => d.type === 'state-machine')) {
    for (const machine of doc.content?.machines ?? []) {
      for (const action of machine.actions ?? []) {
        for (const step of action.steps ?? []) {
          const asks = step.call && step.with?.callback;
          if (!asks) continue;
          const emits = procedures.get(step.call)?.emit?.type;
          if (!emits) continue;
          const after = step.with.fireAfter;
          return {
            on: emits,
            action: action.id,
            callback: step.with.callback.event ?? step.with.callback,
            after: after ? `${after.amount} ${after.unit}` : null,
          };
        }
      }
    }
  }
  return null;
};

/** Registering the stand-in that answers it, as a step. */
const stubStep = () => {
  const timer = timerRequest();
  if (!timer || !mock.routes.has('POST /mock/stubs/events')) return [];
  return [{
    method: 'POST',
    path: '/mock/stubs/events',
    template: '/mock/stubs/events',
    operation: {},
    domain: 'the mock itself',
    kind: 'stub',
    timer,
    step: 'Stand in for the scheduler',
    summary: 'Register an event stub',
    body: { on: timer.on },
  }];
};

/**
 * The mock's own controls, as steps.
 *
 * They are endpoints like any other and a reader will want to know they
 * exist, but they are not derived from anything: the distinction between
 * the system and the harness around it is worth drawing rather than hiding.
 */
const controlSteps = () => [
  {
    path: '/mock/reset',
    step: 'Empty the store',
    summary: 'Reset',
    says: 'It clears records, never contracts — afterwards the API is exactly the API it was.',
  },
  {
    path: '/mock/reseed',
    step: 'Put the data back',
    summary: 'Reseed',
    says: 'The records come from `*-mock-data.yaml` documents in the contract set, and are checked '
      + 'against the same schemas as anything you send.',
  },
]
  .filter((entry) => mock.routes.has(`POST ${entry.path}`))
  .map((entry) => ({
    ...entry,
    method: 'POST',
    template: entry.path,
    operation: {},
    domain: 'the mock itself',
    kind: 'control',
  }));

/**
 * The walk-through: the curated operations, in the order someone would do
 * them, each named for what it does rather than for what it is.
 */
const tourSteps = (ops) => {
  const kindOf = (op) => {
    if (op.kind === 'collection' && /\/events$/.test(op.path)) return 'events';
    if (op.kind === 'item' && op.method === 'PATCH') return 'edit';
    return op.kind;
  };
  const take = (kind) => ops.filter((op) => kindOf(op) === kind);
  const title = (op) => {
    const subject = subjectOf(op);
    switch (kindOf(op)) {
      case 'create': return `Create an ${subject}`;
      case 'collection': return `List the ${subject}s`;
      case 'edit': return `Edit the ${subject}`;
      case 'item': return op.method === 'DELETE' ? `Delete the ${subject}` : `Read the ${subject} back`;
      case 'composition': return `Build a view of the ${subject}`;
      case 'transition': return `${op.action.id.charAt(0).toUpperCase()}${op.action.id.slice(1)} the ${subject}`;
      case 'rules': return `Evaluate ${op.ruleset?.name ?? 'the rules'}`;
      case 'events': return 'See the events that were created';
      default: return op.summary;
    }
  };

  const ordered = [
    ...take('create'),
    ...take('item'),
    ...take('edit'),
    ...take('collection'),
    // Before the moves, because a move that asks for a timer needs
    // something on the other end of it by the time it runs.
    ...stubStep(),
    ...lifecycleOrder(take('transition'), { happyPathOnly: true }),
    ...take('composition'),
    ...take('rules'),
    ...take('events'),
  ];

  const walked = ordered.map((op) => (op.kind === 'stub'
    ? op
    : { ...op, kind: kindOf(op), step: title(op) }));

  // Last, because clearing up is what you do once you have made a mess.
  return [...walked, ...controlSteps()];
};

/**
 * The contents: domain, then what kind of thing each operation is.
 *
 * Domain first because that is what tells a reader what goes with what — and
 * because it is the only way the platform endpoints read as platform's
 * rather than as strays in whichever list they landed in. The kinds keep
 * their dependency order inside each domain; the explanation of what a kind
 * *is* belongs on the right, next to the one you picked, not repeated down
 * the side.
 */
const renderGroups = () => {
  const nav = $('groups');
  nav.replaceChildren();

  const everything = operations()
    .map((op) => ({ ...op, ...classify(op) }))
    .filter((op) => op.kind !== 'stream');

  // Walking through and looking something up are different jobs. The walk is
  // one numbered list in the order you would do them, because the order is
  // the content; the reference is by domain, because then you can find
  // things. Same operations, same panel, two ways in.
  if (!showAll) {
    const steps = tourSteps(curate(everything));

    // Shown: everything already run, plus the one to do next. The rest are
    // counted, not listed.
    //
    // Locking the later steps outright was the other option and it is the
    // wrong one: a reader who hits a 404 is stranded, and an engineer being
    // told they may not click something resents it. Revealing as you go
    // takes the wall away — which was the actual complaint — without ever
    // standing in anybody's way, and the count means nobody has to wonder
    // how long this goes on for.
    const reached = steps.findIndex((op) => !done.has(keyOf(op)));
    const upTo = reached === -1 ? steps.length : reached + 1;

    const list = el('ol', '', 'ops steps');
    for (const [index, op] of steps.slice(0, upTo).entries()) {
      const item = el('li');
      const button = el('button', '', 'op step');
      const run = done.has(keyOf(op));
      button.append(
        el('span', run ? '✓' : String(index + 1).padStart(2, '0'), run ? 'n run' : 'n'),
        el('span', op.step)
      );
      if (selected && keyOf(selected) === keyOf(op)) button.classList.add('here');
      button.onclick = () => { selected = op; renderGroups(); renderStage(); };
      item.append(button);
      list.append(item);
    }
    nav.append(list);

    const left = steps.length - upTo;
    if (left > 0) nav.append(el('p', `${left} more, once you have run this one`, 'to-come'));
    return;
  }

  const classified = [...everything, ...stubStep(), ...controlSteps()];
  const domains = [...new Set(classified.map((op) => op.domain))].sort();
  let first = true;

  for (const domain of domains) {
    const mine = classified.filter((op) => op.domain === domain);
    const box = el('details', '', 'group');
    box.open = first;
    first = false;
    box.append(el('summary', `${domain}  (${mine.length})`));

    for (const group of GROUPS) {
      const ofKind = mine.filter((op) => group.holds(op.kind));
      if (ofKind.length === 0) continue;
      box.append(el('p', group.title, 'kind'));

      const list = el('ul', '', 'ops');
      for (const op of ofKind) {
        const item = el('li');
        const button = el('button', '', 'op');
        button.append(el('span', op.method, 'verb'), el('span', op.summary));
        if (selected && selected.method === op.method && selected.path === op.path) {
          button.classList.add('here');
        }
        button.onclick = () => { selected = op; renderGroups(); renderStage(); };
        item.append(button);
        list.append(item);
      }
      box.append(list);
    }
    nav.append(box);
  }
};

// ── The stage ───────────────────────────────────────────────────────────────

const renderStage = async () => {
  const stage = $('stage');
  stage.replaceChildren();

  if (!selected) {
    const panel = el('div', '', 'panel');
    // Two layouts, two things to say. Describing the reference while
    // standing in the walk was telling a reader about a page they are not
    // looking at — and this is the first thing anybody reads.
    if (showAll) {
      panel.append(el('h2', 'Pick an operation'));
      panel.append(el('p',
        'Every operation on the left came out of a contract document, grouped by the domain '
        + 'that declares it, and then by what kind of thing it is.', 'note'));
    } else {
      // Counted, not written down: a contract set with more in it should say
      // so without anybody remembering to come back here.
      const all = operations()
        .map((candidate) => ({ ...candidate, ...classify(candidate) }))
        .filter((candidate) => candidate.kind !== 'stream');
      const steps = tourSteps(curate(all)).length;
      const total = all.length + stubStep().length + controlSteps().length;

      panel.append(el('h2', 'Start at step one'));
      panel.append(el('p',
        `${steps} steps, in the order you would actually do them. Each one sends a real request `
        + 'to the server this page derived a moment ago, and afterwards tells you which line of '
        + 'which document made it answer that way. Run one and the next appears.', 'note'));
      panel.append(el('p',
        `Or press Let me explore for all ${total} operations, with nothing held back `
        + 'and everything editable.', 'note'));
    }
    stage.append(panel);
    return;
  }

  const op = selected;
  const group = GROUPS.find((candidate) => candidate.holds(op.kind));
  const panel = el('div', '', 'panel');
  if (group) panel.append(el('p', group.title, 'kindline'));
  panel.append(el('h2', op.step ?? op.summary));
  panel.append(el('p', `${op.method} ${op.path}`, 'path'));

  /**
   * What governs this operation, named and linked.
   *
   * Each entry is the thing itself and the file it lives in, because a bare
   * path makes a reader open the document to find out which part of it
   * mattered. For a plain resource that is the request schema; for a move
   * it is also the lifecycle, for a decision the ruleset, for a projection
   * the composition — and those second documents are the ones nobody would
   * otherwise find, because the behaviour is not in the file the endpoint
   * is declared in.
   */
  const bodyRef = op.operation.requestBody?.content?.['application/json']?.schema?.$ref;
  const cited = [
    {
      name: typeof bodyRef === 'string' ? bodyRef.split('/').pop() : op.operation.operationId,
      path: op.doc?.relativePath,
    },
    op.action && { name: `${op.action.object} lifecycle`, path: op.action.doc },
    op.ruleset && { name: op.ruleset.name, path: op.ruleset.doc },
    op.composition && { name: op.composition.name, path: op.composition.doc },
  ].filter((entry) => entry && entry.path);

  if (cited.length > 0) {
    const line = el('p', '', 'cited');
    for (const [index, entry] of cited.entries()) {
      if (index > 0) line.append(el('span', '  ·  '));
      if (entry.name) line.append(el('code', entry.name), el('span', ' — '));
      if (pageConfig.sourceUrl) {
        const link = el('a', entry.path);
        link.href = `${pageConfig.sourceUrl}/${entry.path}`;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        line.append(link);
      } else {
        line.append(el('span', entry.path));
      }
    }
    panel.append(line);
  }

  // Nothing above the request on the walk: the step title says what you are
  // doing, and everything worth saying is about what came back.
  if (showAll && group) panel.append(el('p', group.about, 'about'));
  if (showAll && op.operation.description) panel.append(el('p', op.operation.description, 'note'));

  // Path parameters become a picker of records the server actually holds,
  // rather than a box to paste a UUID into.
  const params = {};
  const names = [...op.template.matchAll(/\{([^}]+)\}/g)].map((m) => m[1]);
  if (names.length > 0) {
    const held = await recordsIn(collectionOf(op));
    for (const name of names) {
      const field = el('label', '', 'field');
      field.append(el('span', name));
      if (held.length > 0) {
        const picker = el('select');
        for (const record of held) {
          const describe = [record.id, record.status, record.title].filter(Boolean).join('  ·  ');
          const choice = el('option', describe);
          choice.value = record.id;
          picker.append(choice);
        }
        picker.onchange = () => { params[name] = picker.value; };
        params[name] = held[0]?.id;
        field.append(picker);
      } else {
        const box = el('input');
        box.type = 'text';
        box.placeholder = 'no records yet — create one in Resources first';
        box.oninput = () => { params[name] = box.value; };
        field.append(box);
      }
      panel.append(field);
    }
  }

  // A body, prefilled, so nobody has to guess the shape.
  let bodyBox = null;
  // A control step carries its own body: no contract declares these, so
  // there is no schema to read one off.
  const example = op.body ?? exampleBody(op);
  if (example !== null && op.method !== 'GET' && op.method !== 'DELETE') {
    const field = el('label', '', 'field');

    // The citation above already names the schema and its document.
    field.append(el('span', 'Request body'));

    // On the walk the body is fixed: the step is about what the server does
    // with it, and an editable box invites a reader to debug their typing.
    bodyBox = el('textarea');
    bodyBox.value = JSON.stringify(example, null, 2);
    bodyBox.readOnly = !showAll;
    if (!showAll) {
      bodyBox.className = 'fixed';
      bodyBox.title = 'Switch to Let me explore to change it';
    }
    field.append(bodyBox);
    panel.append(field);
  }

  const send = el('button', 'Execute', 'primary');
  panel.append(send);

  const answer = el('pre');
  answer.hidden = true;
  panel.append(answer);

  // One box, below the answer, only on the walk. Exploring is for people who
  // already know what they are looking at.
  const watch = el('div', '', 'watch');
  watch.hidden = true;
  const bullets = showAll ? [] : noticesFor(op);
  if (bullets.length > 0) {
    watch.append(el('p', 'What to notice', 'watch-title'));
    const list = el('ul');
    for (const line of bullets) {
      const item = el('li');
      // Backticks mark the bits a reader can go and find in a document.
      for (const [index, part] of line.split('`').entries()) {
        if (part !== '') item.append(index % 2 === 1 ? el('code', part) : el('span', part));
      }
      list.append(item);
    }
    watch.append(list);
    // The walk moves on from here rather than from the sidebar: you have
    // just read why that answer looks like that, and the next thing to do
    // belongs at the end of the sentence, not back up at the top left.
    const steps = tourSteps(curate(operations()
      .map((candidate) => ({ ...candidate, ...classify(candidate) }))
      .filter((candidate) => candidate.kind !== 'stream')));
    const at = steps.findIndex((candidate) => keyOf(candidate) === keyOf(op));
    const then = at === -1 ? null : steps[at + 1];
    if (then) {
      const onward = el('button', `Next — ${then.step}`, 'next-step');
      onward.onclick = () => { selected = then; renderGroups(); renderStage(); };
      watch.append(onward);
    } else if (at === steps.length - 1) {
      watch.append(el('p', 'That is the whole walk. Switch to Let me explore and poke at the rest.', 'to-come'));
    }

    panel.append(watch);
  }

  send.onclick = async () => {
    send.disabled = true;
    send.textContent = 'Working…';
    let body;
    if (bodyBox) {
      try {
        body = JSON.parse(bodyBox.value);
      } catch (error) {
        answer.className = 'bad';
        answer.replaceChildren(el('span', 'that body is not JSON', 'label'),
          document.createTextNode(error.message));
        answer.hidden = false;
        send.disabled = false;
        send.textContent = 'Execute';
        return;
      }
    }

    let path = op.path;
    for (const [name, value] of Object.entries(params)) {
      path = path.replace(`{${name}}`, encodeURIComponent(value ?? ''));
    }

    const result = await call(op.method, path, body);
    answer.className = result.status >= 400 ? 'bad' : '';

    // What came back is a declared shape too, and which one depends on the
    // status: a 201 and a 409 are different objects, both in the contract.
    // Naming it here rather than in the citation above because this is
    // where a reader is looking when they wonder what they are reading.
    const label = el('span', '', 'label');
    label.append(el('span', `${result.status} ${result.statusText}`.trim()));
    const answered = op.operation.responses?.[String(result.status)]
      ?? op.operation.responses?.default;
    const ref = answered?.content?.['application/json']?.schema?.$ref;
    const shape = typeof ref === 'string' ? ref.split('/').pop() : null;
    if (shape && op.doc?.relativePath) {
      label.append(el('span', '  ·  '), el('code', shape), el('span', ' — '));
      if (pageConfig.sourceUrl) {
        const link = el('a', op.doc.relativePath);
        link.href = `${pageConfig.sourceUrl}/${op.doc.relativePath}`;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        label.append(link);
      } else {
        label.append(el('span', op.doc.relativePath));
      }
    }

    answer.replaceChildren(label, document.createTextNode(JSON.stringify(result.body, null, 2)));
    answer.hidden = false;
    watch.hidden = false;
    send.disabled = false;
    send.textContent = 'Execute again';

    if (!showAll) {
      done.add(keyOf(op));
      renderGroups();
    }
  };

  stage.append(panel);
};

let contracts;

const boot = async () => {
  contracts = await loadContracts();
  // One button, naming where it takes you rather than where you are.
  //
  // The walk ends by emptying the store and filling it again, as two of its
  // steps. Leaving the same two things in the header as buttons offers them
  // twice and lets you pull the floor out from under step six on the way
  // past, so they are only live once you are off the walk and poking about.
  const mode = (wanted) => {
    showAll = wanted;
    $('mode').textContent = wanted ? 'Show me around' : 'Let me explore';
    for (const id of ['reseed', 'empty']) {
      $(id).disabled = !wanted;
      $(id).title = wanted ? '' : 'The walk does this itself, at the end';
    }
    selected = null;
    if (!mock) return;
    renderGroups();
    renderStage();
  };
  $('mode').onclick = () => mode(!showAll);
  $('reseed').onclick = () => derive({ seed: true });
  $('empty').onclick = () => derive({ seed: false });

  await derive({ seed: true });
  // After the first derive, never before: this renders, and there is
  // nothing to render until the server exists.
  mode(showAll);
  window.mock = mock;
};

boot().catch((error) => {
  $('derived').textContent = `failed to start — ${error.message}`;
  console.error(error);
});
</script>
</body>
</html>
