openapi: 3.1.0
info:
  title: Notification API
  version: 0.1.0
  x-domain: notifications
  x-status: alpha
  x-visibility: internal
  description: |
    REST API for managing notifications. The specification defines CRUD operations
    for creating, reading, updating, and deleting notifications.
  contact:
    name: API Support
    email: support@example.com
servers:
- url: https://api.example.com
  description: Production server
- url: http://localhost:8080
  description: Local development server
tags:
- name: Notifications
  description: Manage notifications.
x-events:
  notification.created:
    type: org.codeforamerica.safety-net-blueprint.notifications.notification.created
    summary: Emitted when a notification is created
    payload:
      $ref: "#/components/schemas/NotificationCreatedEvent"
  notification.updated:
    type: org.codeforamerica.safety-net-blueprint.notifications.notification.updated
    summary: Emitted when a notification is updated via PATCH
    payload:
      $ref: "#/components/schemas/NotificationUpdatedEvent"
  notification.deleted:
    type: org.codeforamerica.safety-net-blueprint.notifications.notification.deleted
    summary: Emitted when a notification is deleted
    payload:
      $ref: "#/components/schemas/NotificationDeletedEvent"
paths:
  "/notifications":
    get:
      summary: List notifications
      description: Retrieve a paginated list of notifications.
      operationId: listNotifications
      tags:
      - Notifications
      parameters:
      - "$ref": "./components/parameters.yaml#/SearchQueryParam"
      - "$ref": "./components/parameters.yaml#/LimitParam"
      - "$ref": "./components/parameters.yaml#/OffsetParam"
      - "$ref": "./components/parameters.yaml#/SortParam"
      responses:
        '200':
          description: A paginated collection of notifications.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/NotificationList"
        '400':
          "$ref": "./components/responses.yaml#/BadRequest"
        '500':
          "$ref": "./components/responses.yaml#/InternalError"
    post:
      summary: Create a notification
      description: Create a new notification record.
      operationId: createNotification
      tags:
      - Notifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/NotificationCreate"
      responses:
        '201':
          description: Notification created successfully.
          headers:
            Location:
              description: URL of the newly created notification resource.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Notification"
        '400':
          "$ref": "./components/responses.yaml#/BadRequest"
        '422':
          "$ref": "./components/responses.yaml#/UnprocessableEntity"
        '500':
          "$ref": "./components/responses.yaml#/InternalError"
  "/notifications/{notificationId}":
    parameters:
    - "$ref": "#/components/parameters/NotificationIdParam"
    get:
      summary: Get a notification
      description: Retrieve a single notification by identifier.
      operationId: getNotification
      tags:
      - Notifications
      responses:
        '200':
          description: Notification retrieved successfully.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Notification"
              examples:
                NotificationExample1:
                  $ref: "#/components/examples/NotificationExample1"
        '404':
          "$ref": "./components/responses.yaml#/NotFound"
        '500':
          "$ref": "./components/responses.yaml#/InternalError"
    patch:
      summary: Update a notification
      description: Apply partial updates to an existing notification.
      operationId: updateNotification
      tags:
      - Notifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/NotificationUpdate"
      responses:
        '200':
          description: Notification updated successfully.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Notification"
        '400':
          "$ref": "./components/responses.yaml#/BadRequest"
        '404':
          "$ref": "./components/responses.yaml#/NotFound"
        '422':
          "$ref": "./components/responses.yaml#/UnprocessableEntity"
        '500':
          "$ref": "./components/responses.yaml#/InternalError"
    delete:
      summary: Delete a notification
      description: Permanently remove a notification record.
      operationId: deleteNotification
      tags:
      - Notifications
      responses:
        '204':
          description: Notification deleted successfully.
        '404':
          "$ref": "./components/responses.yaml#/NotFound"
        '500':
          "$ref": "./components/responses.yaml#/InternalError"
components:
  parameters:
    NotificationIdParam:
      name: notificationId
      in: path
      required: true
      description: Unique identifier of the notification.
      schema:
        type: string
        format: uuid
      example: 4d1f13f0-3e26-4c50-b2fb-8d140f7ec1c2
  schemas:
    Notification:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Unique identifier (server-generated).
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Name of the notification.
        description:
          type: string
          maxLength: 1000
          description: Optional description.
        status:
          type: string
          enum:
            - active
            - inactive
            - pending
          description: Current status.
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when the notification was created.
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when the notification was last updated.
    NotificationCreate:
      allOf:
      - "$ref": "#/components/schemas/Notification"
      - type: object
        description: |
          Payload to create a new notification record.

          Note: id, createdAt, and updatedAt are server-generated (readOnly) and will be returned in the response.
    NotificationUpdate:
      allOf:
      - "$ref": "#/components/schemas/Notification"
      - type: object
        description: |
          Payload to update one or more mutable fields of an existing notification. Partial updates are supported.

          Note: id, createdAt, and updatedAt are server-generated (readOnly) and cannot be updated.
        minProperties: 1
    NotificationList:
      type: object
      additionalProperties: false
      required:
      - items
      - total
      - limit
      - offset
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/Notification"
        total:
          type: integer
          minimum: 0
          description: Total number of notifications available.
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: Maximum number of notifications requested.
        offset:
          type: integer
          minimum: 0
          description: Number of items skipped before the current page.
        hasNext:
          type: boolean
          description: Indicates whether more notifications are available beyond the current page.

    # Event payload schemas — referenced by x-events section above
    NotificationCreatedEvent:
      description: Snapshot of the newly created notification resource.
      $ref: "#/components/schemas/Notification"

    NotificationUpdatedEvent:
      $ref: "./components/../schemas/events.yaml#/ResourceUpdatedEvent"

    NotificationDeletedEvent:
      $ref: "./components/../schemas/events.yaml#/ResourceDeletedEvent"

  examples:
    NotificationExample1:
      summary: Example Notification record
      value:
        id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        name: "Example Notification 1"
        description: "This is an example notification."
        status: "active"
        createdAt: "2024-01-15T10:30:00Z"
        updatedAt: "2024-01-15T10:30:00Z"
