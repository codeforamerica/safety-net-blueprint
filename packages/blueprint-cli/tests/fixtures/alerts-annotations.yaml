# No $schema — the annotations-schema.yaml Domain enum only includes "platform" in the base;
# "alerts" is added by the alerts domain package overlay in real deployments.
# Generate-ts-clients uses the domain field to route output to the alerts/ directory.
version: "1.0"
domain: alerts

schema:
  notice.status:
    programs: [snap, medicaid]
  notice.reviewer:
    programs: [snap]

operations:
  # Keys are {objectName}.{actionId} — state machine actions
  notice.send:
    policies: [alerts-data-access]
  notice.acknowledge:
    policies: [alerts-data-access]
  notice.expire:
    policies: [alerts-data-access]

events:
  # Keys are dot-separated event type identifiers (at least two segments)
  notice.sent:
    programs: [snap, medicaid]

facts:
  # Keys are {ruleset}.{factName}
  urgency.isUrgent:
    programs: [snap, medicaid]
  urgency.urgencyLevel:
    programs: [snap, medicaid]
