$schema: "https://blueprint.codeforamerica.org/schemas/rules-schema.yaml"
domain: alerts
rulesets:
  urgency:
    endpoint:
      path: /notices/evaluate-urgency
    inputs:
      notice:
        type: object
        properties:
          status:
            type: string
          daysSinceCreated:
            type: integer
      policy:
        type: object
        properties:
          urgencyThresholdDays:
            type: integer
            default: 3
    facts:
      - path: isUrgent
        type: boolean
        expression: "notice.status == 'sent' && notice.daysSinceCreated >= policy.urgencyThresholdDays"
        description: "Whether the notice requires urgent attention"
      - path: urgencyLevel
        type: string
        expression: "isUrgent ? 'high' : 'normal'"
        description: "Urgency classification of the notice"
    outputs:
      isUrgent:
        type: boolean
      urgencyLevel:
        type: string
