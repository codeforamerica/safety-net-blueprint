openapi: 3.1.0
info:
  title: Alerts API
  version: 1.0.0
  x-domain: alerts
x-events:
  notice.sent:
    type: org.codeforamerica.safety-net-blueprint.alerts.notice.sent
    summary: Emitted when a notice transitions to sent state
  notice.expired:
    type: org.codeforamerica.safety-net-blueprint.alerts.notice.expired
    summary: Emitted when a notice expires
paths:
  /alerts/notices:
    get:
      summary: List notices
      operationId: listNotices
      tags:
        - Notices
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - status
                        - createdAt
                        - updatedAt
                      example:
                        id: 00000000-0000-0000-0000-000000000001
                        status: draft
                        message: Your application has been received
                        createdAt: "2024-01-01T00:00:00Z"
                        updatedAt: "2024-01-01T00:00:00Z"
                      properties:
                        id:
                          type: string
                          format: uuid
                          readOnly: true
                        status:
                          type: string
                          enum:
                            - draft
                            - sent
                            - acknowledged
                            - expired
                        category:
                          type: string
                          enum:
                            - system
                            - caseworker
                            - administrative
                          description: Category of notice
                        message:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
                          readOnly: true
                        updatedAt:
                          type: string
                          format: date-time
                          readOnly: true
                        county_code:
                          type: string
                          description: County-specific code for routing this notice
                        reviewer:
                          type: object
                          description: Expanded CaseWorker.
                          x-relationship:
                            domain: case-management
                            resource: CaseWorker
                            style: expand
                        caseWorker:
                          type: object
                          description: Expanded CaseWorker.
                          x-relationship:
                            domain: case-management
                            resource: CaseWorker
                            style: expand
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
                  hasNext:
                    type: boolean
        "400":
          description: Bad request — validation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
    post:
      summary: Create a notice
      operationId: createNotice
      tags:
        - Notices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                category:
                  type: string
                  enum:
                    - system
                    - caseworker
                    - administrative
                  description: Category of notice
                caseWorkerId:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - status
                  - createdAt
                  - updatedAt
                example:
                  id: 00000000-0000-0000-0000-000000000001
                  status: draft
                  message: Your application has been received
                  createdAt: "2024-01-01T00:00:00Z"
                  updatedAt: "2024-01-01T00:00:00Z"
                properties:
                  id:
                    type: string
                    format: uuid
                    readOnly: true
                  status:
                    type: string
                    enum:
                      - draft
                      - sent
                      - acknowledged
                      - expired
                  category:
                    type: string
                    enum:
                      - system
                      - caseworker
                      - administrative
                    description: Category of notice
                  message:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                    readOnly: true
                  updatedAt:
                    type: string
                    format: date-time
                    readOnly: true
                  county_code:
                    type: string
                    description: County-specific code for routing this notice
                  reviewer:
                    type: object
                    description: Expanded CaseWorker.
                    x-relationship:
                      domain: case-management
                      resource: CaseWorker
                      style: expand
                  caseWorker:
                    type: object
                    description: Expanded CaseWorker.
                    x-relationship:
                      domain: case-management
                      resource: CaseWorker
                      style: expand
        "400":
          description: Bad request — validation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
