$schema: https://blueprint.codeforamerica.org/schemas/rules-examples-schema.yaml
domain: alerts
rulesets:
  urgency:
    examples:
      - description: Urgent — notice is sent and past the urgency threshold
        inputs:
          notice:
            status: sent
            daysSinceCreated: 5
          policy:
            urgencyThresholdDays: 3
        outputs:
          isUrgent: true
          urgencyLevel: high
      - description: Missing — daysSinceCreated absent, isUrgent cannot be determined
        inputs:
          notice:
            status: sent
          policy:
            urgencyThresholdDays: 3
