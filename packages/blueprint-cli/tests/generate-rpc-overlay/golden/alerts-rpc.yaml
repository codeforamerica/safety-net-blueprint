overlay: 1.0.0
info:
  title: alerts RPC Overlay
  version: 1.0.0
  description: Auto-generated RPC endpoints from alerts-state-machine.yaml
actions:
  - target: $.paths
    file: alerts-openapi.yaml
    description: Add state machine transition endpoints for alerts
    update:
      /alerts/notices/{noticeId}/send:
        post:
          summary: Send notice
          description: Trigger the send transition (draft → sent).
          operationId: sendNotice
          tags:
            - Notices
          parameters:
            - $ref: "#/components/parameters/NoticeIdParam"
          responses:
            "200":
              description: Transition applied successfully.
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/Notice"
            "400":
              $ref: ./components/responses.yaml#/BadRequest
            "404":
              $ref: ./components/responses.yaml#/NotFound
            "409":
              $ref: ./components/responses.yaml#/Conflict
            "500":
              $ref: ./components/responses.yaml#/InternalError
      /alerts/notices/{noticeId}/acknowledge:
        post:
          summary: Acknowledge notice
          description: Trigger the acknowledge transition (sent → acknowledged).
          operationId: acknowledgeNotice
          tags:
            - Notices
          parameters:
            - $ref: "#/components/parameters/NoticeIdParam"
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  required:
                    - acknowledgedBy
                  properties:
                    acknowledgedBy:
                      type: string
                      description: ID of the person acknowledging the notice
          responses:
            "200":
              description: Transition applied successfully.
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/Notice"
            "400":
              $ref: ./components/responses.yaml#/BadRequest
            "404":
              $ref: ./components/responses.yaml#/NotFound
            "409":
              $ref: ./components/responses.yaml#/Conflict
            "500":
              $ref: ./components/responses.yaml#/InternalError
      /alerts/notices/{noticeId}/expire:
        post:
          summary: Expire notice
          description: Trigger the expire transition (sent | acknowledged → expired).
          operationId: expireNotice
          tags:
            - Notices
          parameters:
            - $ref: "#/components/parameters/NoticeIdParam"
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/ExpireRequest"
          responses:
            "200":
              description: Transition applied successfully.
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/Notice"
            "400":
              $ref: ./components/responses.yaml#/BadRequest
            "404":
              $ref: ./components/responses.yaml#/NotFound
            "409":
              $ref: ./components/responses.yaml#/Conflict
            "500":
              $ref: ./components/responses.yaml#/InternalError
  - target: $.components.schemas
    file: alerts-openapi.yaml
    description: Hoist state-machine action $defs into components.schemas for alerts
    update:
      ExpireRequest:
        type: object
        required:
          - reason
        properties:
          reason:
            type: string
            enum:
              - superseded
              - deadline_passed
              - cancelled
            description: Why the notice is being expired
          notes:
            type: string
            description: Optional additional context
