openapi: 3.1.0
info:
  title: User Service API
  version: 0.1.0
  x-domain: identity-access
  x-status: stable
  x-visibility: internal
  description: |
    Manages user accounts, roles, and permissions for safety net program APIs.

    This service provides authorization context. It:
    - Links IdP identities to roles and county assignments
    - Provides claims for JWT enrichment at login
    - Manages user lifecycle (invite, activate, deactivate)

    **Not for runtime authorization checks.** Permissions are embedded in JWTs
    and evaluated by domain APIs directly.

    > **Status: Sketch**
    > This specification outlines the API shape. Details will be refined during implementation.

  contact:
    name: API Support
    email: support@example.com

servers:
  - url: https://api.example.com/identity-access
    description: Production server
  - url: http://localhost:1080/identity-access
    description: Local development server

tags:
  - name: Users
    description: User account management.
  - name: Token
    description: JWT enrichment (called by IdP).

security:
  - bearerAuth: []

paths:
  # ─────────────────────────────────────────────────────────────────────────────
  # User Management
  # ─────────────────────────────────────────────────────────────────────────────
  /users:
    get:
      summary: List users
      description: |
        List users with filtering by role, county, or status.
        Requires `users:read` permission.
      operationId: listUsers
      tags: [Users]
      x-sortable:
        # email and idpSubject excluded — sort order leaks domain groupings
        # and IdP identifier patterns even without projection (A01:2025).
        fields: [createdAt, updatedAt, status]
        default: -updatedAt
        tieBreaker: id
      parameters:
        - $ref: "./components/parameters.yaml#/SearchQueryParam"
        - $ref: "./components/parameters.yaml#/LimitParam"
        - $ref: "./components/parameters.yaml#/OffsetParam"
        - $ref: "./components/parameters.yaml#/SortParam"
      responses:
        "200":
          description: Paginated list of users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "400":
          $ref: "./components/responses.yaml#/BadRequest"
        "401":
          $ref: "./components/responses.yaml#/Unauthorized"
        "403":
          $ref: "./components/responses.yaml#/Forbidden"

    post:
      summary: Create a user
      description: |
        Create a new user record. The user must already exist in the IdP.
        Links the IdP identity (sub) to roles and county assignments.
        Requires `users:create` permission.
      operationId: createUser
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: User created successfully.
          headers:
            Location:
              description: URL of the newly created user.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "./components/responses.yaml#/BadRequest"
        "401":
          $ref: "./components/responses.yaml#/Unauthorized"
        "403":
          $ref: "./components/responses.yaml#/Forbidden"
        "409":
          $ref: "./components/responses.yaml#/Conflict"
        "422":
          $ref: "./components/responses.yaml#/UnprocessableEntity"

  /users/me:
    get:
      summary: Get the authenticated user
      description: |
        Returns the authenticated user's own record. Resolves the caller identity
        from the auth context without requiring the caller to know their own ID.

        No additional permissions required beyond valid authentication.
      operationId: getCurrentUser
      tags: [Users]
      responses:
        "200":
          description: Authenticated user details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "./components/responses.yaml#/Unauthorized"
        "404":
          $ref: "./components/responses.yaml#/NotFound"

  /users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserIdParam"

    get:
      summary: Get a user
      description: |
        Retrieve a user by ID. Use "me" as the userId to get the current user.
        Requires `users:read` permission for other users.
      operationId: getUser
      tags: [Users]
      responses:
        "200":
          description: User details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              examples:
                UserExample1:
                  $ref: "#/components/examples/UserExample1"
        "401":
          $ref: "./components/responses.yaml#/Unauthorized"
        "403":
          $ref: "./components/responses.yaml#/Forbidden"
        "404":
          $ref: "./components/responses.yaml#/NotFound"

    patch:
      summary: Update a user
      description: |
        Update user role, status, or county assignments.
        Use "me" as the userId to update current user preferences.
        Requires `users:update` permission for other users.
      operationId: updateUser
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: User updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "./components/responses.yaml#/BadRequest"
        "401":
          $ref: "./components/responses.yaml#/Unauthorized"
        "403":
          $ref: "./components/responses.yaml#/Forbidden"
        "404":
          $ref: "./components/responses.yaml#/NotFound"
        "422":
          $ref: "./components/responses.yaml#/UnprocessableEntity"

    delete:
      summary: Deactivate a user
      description: |
        Soft-delete (deactivate) a user. Sets status to inactive.
        Does not remove from IdP.
        Requires `users:deactivate` permission.
      operationId: deactivateUser
      tags: [Users]
      responses:
        "204":
          description: User deactivated successfully.
        "401":
          $ref: "./components/responses.yaml#/Unauthorized"
        "403":
          $ref: "./components/responses.yaml#/Forbidden"
        "404":
          $ref: "./components/responses.yaml#/NotFound"

  # ─────────────────────────────────────────────────────────────────────────────
  # Token Enrichment (IdP Integration)
  # ─────────────────────────────────────────────────────────────────────────────
  /token/claims/{sub}:
    get:
      summary: Get claims for JWT enrichment
      description: |
        Called by the IdP during login to fetch the user's role and permissions
        for embedding in the JWT.

        **When this is called:** During OAuth token issuance. When a user logs in,
        the IdP (Auth0, Okta, etc.) calls this endpoint before issuing the JWT.
        The returned claims are embedded in the token. This is how permissions
        get into the JWT without runtime authorization calls.

        Authenticated via API key (not user JWT).
      operationId: getTokenClaims
      tags: [Token]
      security:
        - apiKeyAuth: []
      parameters:
        - name: sub
          in: path
          required: true
          description: IdP subject identifier (the user's unique ID in the IdP).
          schema:
            type: string
          example: "auth0|507f1f77bcf86cd799439011"
      responses:
        "200":
          description: Claims to embed in JWT.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenClaims"
        "401":
          $ref: "./components/responses.yaml#/Unauthorized"
        "404":
          $ref: "./components/responses.yaml#/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT from Identity Provider with embedded permissions.

        Expected claims structure: see schemas/domain/identity-access.yaml#/$defs/JwtClaims
        Documentation: docs/architecture/cross-cutting/identity-access.md

    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for IdP integration (token enrichment endpoint).

  parameters:
    UserIdParam:
      name: userId
      in: path
      required: true
      description: |
        Unique identifier of the user. Use "me" to reference the current user.
      schema:
        type: string
      example: a1b2c3d4-e5f6-7890-abcd-ef1234567890

  schemas:
    # Primary schema
    User:
      description: |
        User account for authentication and authorization. Links an IdP identity
        to roles, permissions, and county assignments.

        Note: Job function details (skills, team, workload) are not stored here.
        Staff users link to a CaseWorker record in the Case Management domain.
      unevaluatedProperties: false
      allOf:
        - $ref: "./schemas/domain/identity-access.yaml#/$defs/User"
        - $ref: "./schemas/domain/identity-access.yaml#/$defs/FrontendAuthContext"
        - type: object
          required:
            - id
            - idpSubject
            - email
            - status
            - createdAt
            - updatedAt
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
              description: Unique identifier for the user.
            userId:
              type: string
              format: uuid
              readOnly: true
              x-derived: "$this.id"
              description: |
                Alias for id, used in JWT claims context (BackendAuthContext.userId).
                Same value as id.
            createdAt:
              type: string
              format: date-time
              readOnly: true
              description: Timestamp when the user was created.
            updatedAt:
              type: string
              format: date-time
              readOnly: true
              description: Timestamp when the user was last updated.

    # Ancillary schemas (alphabetical)

    # FrontendAuthContext — JWT/BFF schema for enriched frontend tokens.
    # Defined in schemas/domain/identity-access.yaml; exposed here for tooling.
    FrontendAuthContext:
      $ref: "./schemas/domain/identity-access.yaml#/$defs/FrontendAuthContext"

    RoleType:
      $ref: "./schemas/common/enums.yaml#/$defs/RoleType"

    TokenClaims:
      $ref: "./schemas/domain/identity-access.yaml#/$defs/BackendAuthContext"

    # API-specific schemas

    UserCreate:
      allOf:
        - $ref: "./schemas/domain/identity-access.yaml#/$defs/User"
        - type: object
          description: |
            Payload to create a new user.

            Note: id, userId, createdAt, and updatedAt are server-generated (readOnly)
            and will be returned in the response.
          required:
            - idpSubject
            - email
            - roles

    UserList:
      description: Paginated list of users.
      unevaluatedProperties: false
      allOf:
        - $ref: "./components/pagination.yaml#/Pagination"
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/User"

    UserUpdate:
      allOf:
        - $ref: "./schemas/domain/identity-access.yaml#/$defs/User"
        - type: object
          description: |
            Payload to update one or more mutable fields of an existing user.
            Partial updates are supported.

            Note: id, userId, createdAt, and updatedAt are server-generated (readOnly)
            and cannot be updated.
          minProperties: 1

  examples:
    UserExample1:
      summary: Jane Smith — active case worker
      value:
        id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        userId: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        idpSubject: auth0|507f1f77bcf86cd799439011
        email: jane.smith@example.gov
        roles:
          name: case_worker
          permissions:
            - applications:read
            - applications:create
            - persons:read
        status: active
        createdAt: '2024-01-15T10:30:00Z'
        updatedAt: '2024-01-15T10:30:00Z'
