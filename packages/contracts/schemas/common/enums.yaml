$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "schemas/common/enums.yaml"
title: CommonEnums
description: >
  Canonical shared enumerations used across domains and artifact types
  (OpenAPI specs, state machines, rules schemas). Define once here;
  reference everywhere. States extend values via overlay.

$defs:
  Domain:
    type: string
    enum:
      - client-management
      - data-exchange
      - document-management
      - eligibility
      - intake
      - workflow
    description: >
      Blueprint domain identifier. Used as the {domain} path parameter on
      metadata mutation endpoints and as the value type for x-domain annotations
      on domain OpenAPI specs.

  Frequency:
    type: string
    enum:
      - daily
      - weekly
      - every_two_weeks
      - twice_monthly
      - monthly
      - yearly
      - variable
    description: >
      How often an amount is received or incurred. Not all values apply to
      all contexts — daily and weekly are typical for earned income; monthly
      is typical for expenses. variable is used when the amount or timing
      is irregular. Domain schemas (income.yaml, health.yaml) define their
      own frequency enums where the allowed values differ from this baseline.

  Language:
    type: string
    description: Preferred language (BCP 47 language tag).
    pattern: "^[a-zA-Z]{2,3}(?:-[a-zA-Z0-9]{2,8})*$"

  RoleType:
    type: string
    description: >
      Authorization roles that determine base permissions and data scoping.
      Used in state machine actors arrays and JWT role claims.

      - applicant: Self-service access to own applications (scoped by personId)
      - case_worker: Process applications for assigned county
      - supervisor: Oversee case workers, approve determinations (may span counties)
      - county_admin: Administer county staff and configuration
      - state_admin: Statewide oversight and administration (all counties)
      - partner_readonly: External partner with limited read access
      - system: Automated service account for background and inter-service operations
    enum:
      - applicant
      - case_worker
      - supervisor
      - county_admin
      - state_admin
      - partner_readonly
      - system

  Program:
    type: string
    enum:
      - snap          # Supplemental Nutrition Assistance Program
      - medicaid      # Medicaid / MAGI Medicaid
      - chip          # Children's Health Insurance Program (Title XXI)
      - tanf          # Temporary Assistance for Needy Families
      - aca           # ACA Marketplace / premium tax credits
    description: >
      Baseline public assistance programs. SNAP, Medicaid/MAGI, and CHIP are
      first-class programs with full intake and eligibility support. TANF is a
      thin baseline — federal requirements are minimal; state-specific intake
      behavior is an overlay concern. ACA covers marketplace eligibility rules
      (premium tax credits, employer affordability, special enrollment periods).
      Values use the federal program name; state-specific names are overlay
      concerns. States may extend this list via overlay.
