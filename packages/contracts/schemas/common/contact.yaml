$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "schemas/common/contact.yaml"
title: Contact
description: >
  A person referenced in an application who is not a household member —
  an authorized representative, sponsor, tax dependent, or other non-member
  contact. Carries the name and contact details needed to reach them.
  Members who are also contacts are linked via PersonRef (type: member).

type: object
required:
  - name
additionalProperties: true
properties:
  name:
    $ref: "../common/identity.yaml#/$defs/Name"
  primaryAddress:
    $ref: "#/$defs/Address"
    description: Primary address for this contact.
  primaryPhone:
    $ref: "#/$defs/PhoneNumber"
    description: Primary phone number.
  email:
    $ref: "#/$defs/Email"
    description: Email address.

$defs:
  Address:
    type: object
    description: Residential or mailing address used to determine eligibility.
    additionalProperties: false
    required:
      - addressLine1
      - city
      - state
      - zip
    properties:
      addressLine1:
        type: string
        description: Primary street address line.
        minLength: 1
        maxLength: 150
      addressLine2:
        type: string
        description: Secondary address line such as apartment or unit.
        maxLength: 150
      city:
        type: string
        description: City or locality of residence.
        minLength: 1
        maxLength: 100
      state:
        type: string
        description: State, province, or region of residence.
        minLength: 1
        maxLength: 100
      zip:
        type: string
        description: Postal or ZIP code.
        minLength: 3
        maxLength: 20
      county:
        type: string
        description: County or equivalent administrative region.
        maxLength: 100

  Email:
    type: string
    format: email
    description: Email address.
    maxLength: 320

  PhoneNumber:
    type: string
    description: Phone number in international or local format.
    pattern: "^\\+?[0-9 .\\-()]{7,20}$"
