$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "schemas/common/employment.yaml"
title: Job
description: >
  A single job record for a household member. Covers W-2 employment and
  self-employment. Employment status and hours affect TANF work participation
  requirements (45 CFR § 261.22) and CCDF activity eligibility. Self-employment
  expenses are deducted to compute net self-employment income for program
  eligibility calculations.

type: object
required:
  - type
  - status

properties:
  type:
    $ref: "#/$defs/JobType"
  status:
    $ref: "#/$defs/JobStatus"
  employerId:
    type: string
    format: uuid
    description: The employer organization for this job. Present when type is employed.
    x-relationship:
      resource: Organization
  hoursPerWeek:
    type: number
    format: float
    minimum: 0
    description: >
      Average hours worked per week. Used in TANF work participation rate
      calculations (45 CFR § 261.22) and CCDF activity eligibility determinations.
  isTemporary:
    type: boolean
    description: Whether the position is temporary or seasonal.
  startDate:
    type: string
    format: date
    description: Date employment began.
  endDate:
    type: string
    format: date
    description: Date employment ended or is expected to end.
  endReason:
    $ref: "#/$defs/JobEndReason"
    description: Reason employment ended. Present when status is ended.
  strikeStartDate:
    type: string
    format: date
    description: Date the strike began. Present when status is on_strike.
  lastPaycheckDate:
    type: string
    format: date
    description: Date of the most recent paycheck received from this employer.
  lastPaycheckGrossAmount:
    type: number
    format: float
    minimum: 0
    description: Gross amount of the most recent paycheck from this employer.
  businessName:
    type: string
    description: Business or trade name. Present when type is self_employed.
  businessType:
    type: string
    description: Type of business or industry. Present when type is self_employed.
  reportingMonth:
    type: string
    format: date
    description: >
      Month for which self-employment income is being reported (first day of
      the month). Present when type is self_employed.
  expenses:
    $ref: "#/$defs/SelfEmploymentExpenses"
    description: Allowable business expense deductions. Present when type is self_employed.

additionalProperties: true

$defs:

  JobType:
    type: string
    enum:
      - employed
      - self_employed
    description: >
      Whether this is W-2 employment (employed) or self-employment / gig work
      (self_employed). Determines which expense deductions and verification
      pathways apply.

  JobStatus:
    type: string
    enum:
      - active
      - on_strike
      - ended
    description: >
      Current status of the job. active — currently working. on_strike —
      participating in a labor strike (SNAP eligibility may be affected under
      7 CFR § 273.1(f)). ended — employment has concluded.

  JobEndReason:
    type: string
    enum:
      - voluntary_separation
      - involuntary_separation
    description: >
      Why the job ended. Used in TANF voluntary quit determinations (45 CFR
      § 261.51). voluntary_separation may trigger a sanction period.

  SelfEmploymentExpenses:
    type: object
    description: >
      Allowable business expense deductions for computing net self-employment
      income. SNAP allows a 40% standard deduction or itemized deductions
      (7 CFR § 273.11(b)). States may allow itemized deductions for Medicaid
      and TANF.
    additionalProperties: true
    properties:
      utilities:
        type: number
        format: float
        minimum: 0
        description: Utility costs attributable to the business.
      taxes:
        type: number
        format: float
        minimum: 0
        description: Business taxes paid.
      interest:
        type: number
        format: float
        minimum: 0
        description: Business loan interest paid.
      laborCosts:
        type: number
        format: float
        minimum: 0
        description: Wages or contracted labor costs paid to others.
      costOfMerchandise:
        type: number
        format: float
        minimum: 0
        description: Cost of goods purchased for resale.
      other:
        type: number
        format: float
        minimum: 0
        description: Other allowable business expenses not captured above.
