$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "schemas/common/assets.yaml"
title: Asset
description: >
  A single asset record for a household member. Covers liquid assets, vehicles,
  real property, retirement accounts, insurance policies, and other asset types.
  Liquid assets are used in SNAP resource tests and expedited screening
  (7 CFR § 273.8, 7 CFR § 273.2(i)). Vehicle and real property treatment
  varies by program and state policy.

discriminator:
  propertyName: type
  mapping:
    liquid: "#/$defs/LiquidOrRetirementAsset"
    retirement_account: "#/$defs/LiquidOrRetirementAsset"
    vehicle: "#/$defs/VehicleAsset"
    insurance: "#/$defs/InsuranceAsset"
    real_property: "#/$defs/RealPropertyAsset"
    other: "#/$defs/OtherAsset"
oneOf:
  - $ref: "#/$defs/LiquidOrRetirementAsset"
  - $ref: "#/$defs/VehicleAsset"
  - $ref: "#/$defs/InsuranceAsset"
  - $ref: "#/$defs/RealPropertyAsset"
  - $ref: "#/$defs/OtherAsset"

$defs:

  AssetBase:
    title: AssetBase
    type: object
    required:
      - value
    additionalProperties: true
    properties:
      type:
        $ref: "#/$defs/AssetType"
      typeOther:
        type: string
        description: Free-text description when type is other.
      value:
        type: number
        format: float
        minimum: 0
        description: The current fair market value of the asset.

  LiquidOrRetirementAsset:
    title: LiquidOrRetirementAsset
    description: A liquid asset (cash, checking, savings) or retirement account.
    allOf:
      - $ref: "#/$defs/AssetBase"
      - type: object
        properties:
          type:
            type: string
            enum: [liquid, retirement_account]
          financialInstitutionName:
            type: string
            description: Name of the financial institution holding the account.
          accountNumber:
            type: string
            description: Account number.

  VehicleAsset:
    title: VehicleAsset
    description: A vehicle asset.
    allOf:
      - $ref: "#/$defs/AssetBase"
      - type: object
        properties:
          type:
            type: string
            enum: [vehicle]
          year:
            type: string
            description: Model year.
          make:
            type: string
            description: Vehicle make (manufacturer).
          model:
            type: string
            description: Vehicle model.

  InsuranceAsset:
    title: InsuranceAsset
    description: A life insurance policy with cash value.
    allOf:
      - $ref: "#/$defs/AssetBase"
      - type: object
        properties:
          type:
            type: string
            enum: [insurance]
          policyType:
            $ref: "#/$defs/InsurancePolicyType"
            description: Insurance policy type.
          companyName:
            type: string
            description: Insurance company name.
          policyNumber:
            type: string
            description: Policy or certificate number.
          faceValue:
            type: number
            format: float
            minimum: 0
            description: >
              Face value of the insurance policy. Life insurance policies with a cash
              surrender value above the resource limit count toward SNAP and TANF
              resource tests.
          isRevocable:
            type: boolean
            description: Whether the insurance policy is revocable.

  RealPropertyAsset:
    title: RealPropertyAsset
    description: A real property asset.
    allOf:
      - $ref: "#/$defs/AssetBase"
      - type: object
        properties:
          type:
            type: string
            enum: [real_property]
          address:
            $ref: "./contact.yaml#/$defs/Address"
            description: Property address.
          primaryUse:
            $ref: "#/$defs/RealPropertyUse"
            description: Primary use of the real property.
          primaryUseOther:
            type: string
            description: Free-text description when primaryUse is other.

  OtherAsset:
    title: OtherAsset
    description: An asset not covered by more specific types.
    allOf:
      - $ref: "#/$defs/AssetBase"
      - type: object
        properties:
          type:
            type: string
            enum: [other]

  AssetType:
    title: AssetType
    type: string
    enum:
      - liquid
      - vehicle
      - real_property
      - retirement_account
      - insurance
      - other
    description: >
      The category of asset. liquid (cash, checking, savings) is counted in
      the SNAP resource test (7 CFR § 273.8) and expedited screening resource
      threshold. vehicle and real_property treatment varies by program and
      state policy. retirement_account treatment depends on whether the account
      is accessible. insurance includes life insurance policies with cash value.

  InsurancePolicyType:
    title: InsurancePolicyType
    type: string
    enum:
      - term
      - permanent
      - burial
      - other
    description: >
      The type of life insurance policy. permanent and burial policies have
      cash surrender value that counts toward SNAP resource tests.
      term policies generally do not have cash value.

  RealPropertyUse:
    title: RealPropertyUse
    type: string
    enum:
      - primary_residence
      - rental
      - self_employment
      - for_sale
      - other
    description: >
      The primary use of the real property. primary_residence is generally
      excluded from SNAP and TANF resource tests. rental, self_employment,
      and for_sale properties may be counted depending on program rules
      and state policy.

  AssetDisposal:
    title: AssetDisposal
    type: object
    description: >
      A record of an asset transferred or sold in the past. Used to determine
      whether a penalty period applies for transferring assets at below fair
      market value under SNAP resource rules (7 CFR § 273.8(h)) and TANF.
    required:
      - dateOfDisposal
      - amountReceived
      - fairMarketValue
    properties:
      type:
        $ref: "#/$defs/AssetType"
      typeOther:
        type: string
        description: Free-text description when type is other.
      dateOfDisposal:
        type: string
        format: date
        description: Date the asset was transferred, sold, or otherwise disposed of.
      amountReceived:
        type: number
        format: float
        minimum: 0
        description: Amount actually received from the transfer or sale.
      fairMarketValue:
        type: number
        format: float
        minimum: 0
        description: Fair market value of the asset at the time of disposal.
    additionalProperties: true
