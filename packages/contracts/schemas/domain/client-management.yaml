$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "schemas/domain/client-management.yaml"
title: ClientManagement
description: >
  Shared client management types. Person is the system of record for unique,
  de-duplicated individuals across all interactions with the safety net system.

$defs:
  Person:
    type: object
    description: >
      A unique, de-duplicated individual record. Multiple applications may
      reference the same person; Client Management resolves that identity across
      applications and cases. Full schema TBD — additional identity fields will
      be added as the client management domain is built out.
    additionalProperties: true
