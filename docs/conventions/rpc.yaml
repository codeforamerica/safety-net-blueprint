# API Design Conventions — RPC & Behavioral Contracts
# Part of the blueprint conventions. See conventions/ for the full set.

version: "1.0"

rpc_endpoints:
  path_pattern: "/{resources}/{resourceId}/{trigger}"
  method: POST
  description: |
    RPC endpoints trigger state transitions defined in the state machine
    contract. They are registered at server startup from the operations:
    array in each state machine YAML.

  request:
    headers:
      - name: X-Caller-Id
        required: true
        description: Identity of the caller; evaluated by guards that reference $caller.id
    body: Optional. Defined per-trigger in the state machine requestBodies section.

  success_response:
    code: 200
    description: Transition applied successfully
    body: Updated resource with new status

  error_responses:
    400: Missing X-Caller-Id header
    404: Resource not found
    409: |
      Transition not valid from current state, or a guard condition failed.
      Response body includes code: CONFLICT and a descriptive message.
    500: Unexpected server error

  guards:
    description: |
      Guards are preconditions evaluated before a transition is applied.
      Defined in the state machine guards section and referenced by name
      in each transition's guards array.
    context_variables:
      - "$caller.id": Resolved from the X-Caller-Id request header
      - "$caller.roles": Resolved from the X-Caller-Roles request header (comma-separated list)

  validation_exemptions:
    - Pattern validator skips CRUD POST rules (request body, 201, Location header)
    - Detected by isActionPath(): paths with segments after the {id} parameter

# =============================================================================
# Behavioral Contract Steps
# =============================================================================
# Steps appear in state machine operations (then:), rule conditions (then:), and
# event trigger handlers (triggers.onEvent[].then:, triggers.onCreate.then:, etc.).
#
# Step types:
#
#   set:
#     field: <fieldName>
#     value: <literal | $now | $caller.id | $request.fieldName | $object.fieldName>
#     Sets a field on the resource being operated on.
#
#   emit:
#     event: <name>                 # e.g. "submitted" → emitted as intake.application.submitted
#     data:
#       <key>: <value expression>   # $now, $object.field, $request.field, etc.
#     Emits an event the machine declares under emits:, named {domain}.{resource}.{name} —
#     the domain as declared, the resource's schema name in snake_case. With no data,
#     write just `emit: <name>`.
#
#   evaluate: <ruleId>
#     Evaluates a named rule from the state machine's rules: section. The rule
#     can produce set:, invoke:, or nested evaluate: steps.
#
#   invoke:
#     # POST form — creates a resource or triggers an operation:
#     POST: <path>                  # e.g. workflow/tasks, intake/applications/$application.id/open
#     body:
#       <key>: <value expression>
#
#     # PATCH form — appends a value to an array field:
#     PATCH: <path>                 # e.g. intake/applications/members/$this.data.memberId
#     body:
#       <fieldName>:
#         $push: <value expression> # appended to the array; object or scalar
#
# Expressions (paths, body values, and set: value: all use the same syntax):
#   $alias.field    — value from a context binding alias (e.g. $application.id, usable in paths and bodies)
#   $this.field     — value from the current event or resource envelope (dot-path supported)
#   $object.field   — value from the resource being operated on
#   $request.field  — value from the operation request body
#   $now            — current ISO timestamp
#   $params.field   — an argument a procedure was called with (with:)
#   <literal>       — string, number, boolean, or null
#
# To build a string from several values, embed expressions in braces, as
# OpenAPI runtime expressions are embedded in strings:
#   timerId: "workflow.{$params.timerType}.{$object.id}"
# Each {$…} is looked up like a lone expression and the pieces joined. Nothing
# is evaluated, so there are no operators; a missing value contributes nothing.
#
# Conditions are CEL, with no dialect: a guard's condition, if:, match:, a
# context binding's where: string, a composition's filter:, and x-derived.
# They are evaluated by a spec-compliant implementation (@bufbuild/cel), so an
# expression that is not CEL is refused, not run some other way.
#   - Names are unprefixed: caller, object, request, params, this (the event),
#     now, and each context binding by its alias. `$` is value-expression
#     syntax, above, and not CEL.
#   - A field a record does not have is an error, not null: ask with has(),
#     e.g. !has(object.escalatedAt) || object.escalatedAt == null.
#   - A binding that found no record is null; test the binding, not a field
#     through it: reviewTask != null.
#   - List membership is `x in list`; contains() is for strings.


behavioral_contract_steps:
  step_types:
    - set
    - emit
    - evaluate
    - invoke
  invoke_methods:
    - POST    # create a resource or trigger a state machine operation
    - PATCH   # append a value to an array field via $push

# =============================================================================
# Sub-Resource Path Patterns
# =============================================================================
# Paths that nest a child resource under a parent, distinct from RPC trigger paths.
# The noun/verb distinction determines which pattern applies:
#
#   Noun  → sub-resource (this section):  GET /applications/{id}/documents
#   Verb  → RPC transition (rpc_endpoints): POST /applications/{id}/submit
#
# Both use the /{resources}/{resourceId}/{segment} structure. The segment is a
# noun (plural for collections, singular for singletons) for sub-resources and a
# verb (action word) for RPC endpoints.

behavioral_yaml:
  # Always use arrays for config item collections — never object-as-map.
  # Each item carries an identity field (id or trigger) instead of being keyed
  # by property name.
  #
  # Why: Arrays support overlay filter targeting (e.g., [?(@.id == 'foo')]).
  # Consumers that need O(1) lookup by id build an index map at load time.
  # Object-as-map is appropriate ONLY in OpenAPI schemas (properties:) where
  # merge-by-key semantics are intentional and well-understood.
  collection_format:
    preferred: array with id/trigger field
    avoid: object-as-map
    rationale: |
      Arrays allow overlay filter expressions to target individual items.
      Consumers build index maps at load time when O(1) lookup is needed.
    examples:
      # Correct — arrays
      states:
        - id: pending
          slaClock: running
        - id: in_progress
          slaClock: running
      guards:
        - id: callerIsAssignedWorker
          field: assignedToId
          operator: equals
          value: $caller.id
      requestBodies:
        - trigger: complete
          type: object
          properties:
            outcome:
              type: string
          required: [outcome]
      # Incorrect — avoid
      states_avoid:
        pending:
          slaClock: running
      guards_avoid:
        callerIsAssignedWorker:
          field: assignedToId

  # Identity field naming:
  # - Use id: for items that represent named concepts (states, guards, slaTypes, metrics)
  identity_fields:
    states: id
    guards: id
    slaTypes: id
    metrics: id

# RPC endpoints (POST with action verbs) are generated from state machine triggers.
# REST endpoints follow standard CRUD patterns below.
