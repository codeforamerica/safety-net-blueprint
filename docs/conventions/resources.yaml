# API Design Conventions — REST Resource Patterns
# Part of the blueprint conventions. See conventions/ for the full set.

version: "1.0"

required_info_fields:
  fields:
    - name: title
      description: Human-readable API name
      example: "Applications API"
    - name: version
      description: API version (semver)
      example: "1.0.0"
    - name: x-domain
      description: Business domain this API belongs to (see api_classification for values)
      required: true
      example: "intake"
    - name: x-status
      description: Lifecycle status; use alpha for new APIs (see api_classification for values)
      required: true
      default: alpha
      example: "alpha"
    - name: x-visibility
      description: Audience; use internal by default (see api_classification for values)
      required: true
      default: internal
      example: "internal"
  note: |
    The api:new generator scaffolds all required fields automatically.
    Run npm run validate to catch missing fields.

# =============================================================================
# List Endpoint Pattern# =============================================================================

list_endpoints:
  # All REST list endpoints (GET /resources) must include these parameters
  required_parameters:
    - ref: "./components/common-parameters.yaml#/SearchQueryParam"
      name: q
      description: Search query using field:value syntax
    - ref: "./components/common-parameters.yaml#/LimitParam"
      name: limit
      description: Maximum items to return (1-100, default 25)
    - ref: "./components/common-parameters.yaml#/OffsetParam"
      name: offset
      description: Number of items to skip (default 0)

  # Response schema must include these properties.
  # Pagination fields (total, limit, offset, hasNext) are defined in a shared
  # component and composed into each list schema via allOf:
  #   $ref: "./components/pagination.yaml#/Pagination"
  # States can swap the pagination strategy with a single overlay on Pagination.
  response:
    pagination_component: "./components/pagination.yaml#/Pagination"
    required_properties:
      - name: items
        type: array
        description: Array of resources
      - name: total
        type: integer
        description: Total number of matching resources
      - name: limit
        type: integer
        description: Requested limit value
      - name: offset
        type: integer
        description: Requested offset value
    recommended_properties:
      - name: hasNext
        type: boolean
        description: Whether more results exist beyond current page

  # Response schema naming: {Resource}List
  # Example: PersonList, ApplicationList
  response_schema_suffix: List

# =============================================================================
# Search Query Syntax# =============================================================================

search_syntax:
  parameter_name: q
  description: |
    Search query using field:value syntax. Multiple conditions separated by
    spaces are ANDed together.

  operators:
    - pattern: "term"
      description: Full-text search across all searchable fields
      example: "john"
    - pattern: "field:value"
      description: Exact match on field
      example: "status:approved"
    - pattern: "field:>value"
      description: Greater than
      example: "income:>1000"
    - pattern: "field:>=value"
      description: Greater than or equal
      example: "income:>=1000"
    - pattern: "field:<value"
      description: Less than
      example: "income:<5000"
    - pattern: "field:<=value"
      description: Less than or equal
      example: "income:<=5000"
    - pattern: "field:val1,val2"
      description: Match any value (OR)
      example: "status:approved,pending"
    - pattern: "-field:value"
      description: Exclude/negate
      example: "-status:denied"
    - pattern: "field:*"
      description: Field exists (not null)
      example: "email:*"
    - pattern: "field.nested:value"
      description: Nested field using dot notation
      example: "address.state:CA"

# =============================================================================
# CRUD Operations# =============================================================================
# =============================================================================
# RPC / State Transition Endpoints
# =============================================================================
# Generated from state machine triggers. Each trigger becomes a POST endpoint
# on the item path: POST /{resources}/{resourceId}/{trigger}

crud_operations:
  # CREATE - POST /resources
  create:
    method: POST
    path_pattern: "/{resources}"
    success_response:
      code: 201
      description: Resource created successfully
      headers:
        - name: Location
          description: URL of the newly created resource
          format: uri
      body: Created resource object
    error_responses: [400, 422, 500]
    request_body:
      required: true
      schema_suffix: Create
      description: "Payload to create a new {resource}"

  # READ (single) - GET /resources/{id}
  read:
    method: GET
    path_pattern: "/{resources}/{resourceId}"
    success_response:
      code: 200
      description: Resource retrieved successfully
      body: Resource object
    error_responses: [404, 500]

  # READ (list) - GET /resources
  list:
    method: GET
    path_pattern: "/{resources}"
    success_response:
      code: 200
      description: Paginated list of resources
      body: List response with items array
    error_responses: [400, 500]
    parameters: See list_endpoints section

  # UPDATE - PATCH /resources/{id}
  update:
    method: PATCH
    path_pattern: "/{resources}/{resourceId}"
    success_response:
      code: 200
      description: Resource updated successfully
      body: Updated resource object
    error_responses: [400, 404, 422, 500]
    request_body:
      required: true
      schema_suffix: Update
      description: "Partial update payload for {resource}"

  # DELETE - DELETE /resources/{id}
  delete:
    method: DELETE
    path_pattern: "/{resources}/{resourceId}"
    success_response:
      code: 204
      description: Resource deleted successfully
      body: null
    error_responses: [404, 500]

# =============================================================================
# Shared Components# =============================================================================

sub_resource_paths:

  # ---------------------------------------------------------------------------
  # Collection sub-resource
  # ---------------------------------------------------------------------------
  # Follows the same conventions as top-level CRUD endpoints. Collection path
  # supports GET (list) and POST (create). Item path supports GET, PATCH, and
  # DELETE. This mirrors how GitHub (POST /repos/{owner}/{repo}/issues,
  # PATCH /repos/{owner}/{repo}/issues/{number}) and Google Calendar
  # (POST /calendars/{id}/events, DELETE /calendars/{id}/events/{eventId})
  # handle nested resources.
  #
  # Whether a parallel top-level collection exists depends on the resource.
  # Some child resources are only accessible via the nested path; others also
  # have a top-level collection for cross-parent queries.
  collection:
    collection_path:
      pattern: "/{resources}/{resourceId}/{subResources}"
      methods:
        GET:
          description: |
            Scoped list of child resources belonging to the parent. Identical
            response shape and query parameters as a top-level list endpoint:
            items, total, limit, offset, hasNext; supports q / limit / offset.
          success_response:
            code: 200
            body: Standard list response (items, total, limit, offset, hasNext)
          error_responses: [400, 500]
        POST:
          description: |
            Create a child resource scoped to the parent. The parent ID in the
            URL replaces the need to include it in the request body. Returns 201
            with a Location header pointing to the new child item path.

            REQUEST SCHEMA CONSTRAINT — additionalProperties: true (or omitted)
            is REQUIRED for sub-resource POST request schemas. The mock-server's
            create-handler spreads every URL path param into the request body
            so that nested routes (e.g.
            /applications/{applicationId}/members/{memberId}/incomes) carry
            both the parent FK and the grandparent FK onto the persisted
            record — schemas typically declare both as required. A request
            schema with additionalProperties: false would reject the
            auto-injected params and 422 the create. If a schema needs to
            restrict its top-level shape, declare each URL param explicitly
            in properties[] so the server-injected values match the schema.
          success_response:
            code: 201
            headers:
              - name: Location
                description: URL of the newly created child resource
          error_responses: [400, 422, 500]

    item_path:
      pattern: "/{resources}/{resourceId}/{subResources}/{subResourceId}"
      methods:
        GET:
          description: Get a specific child resource by ID.
          success_response:
            code: 200
            body: Child resource object
          error_responses: [404, 500]
        PATCH:
          description: Partial update of a specific child resource. All fields optional.
          success_response:
            code: 200
            body: Updated child resource object
          error_responses: [400, 404, 422, 500]
        DELETE:
          description: Delete a specific child resource.
          success_response:
            code: 204
          error_responses: [404, 500]

    examples:
      - GET    /applications/{applicationId}/documents
      - POST   /applications/{applicationId}/documents
      - GET    /applications/{applicationId}/documents/{documentId}
      - PATCH  /applications/{applicationId}/documents/{documentId}
      - DELETE /applications/{applicationId}/documents/{documentId}
      - GET    /tasks/{taskId}/comments

  # ---------------------------------------------------------------------------
  # Singleton sub-resource: exactly one child per parent
  # ---------------------------------------------------------------------------
  # Example: GET   /applications/{applicationId}/interview
  #          PATCH /applications/{applicationId}/interview
  #
  # Exactly one child resource per parent. The parent ID fully identifies the
  # child — no {subResourceId} in the path. Use when a regulatory or domain
  # obligation produces exactly one record per parent (e.g., one Interview per
  # application per certification period).
  singleton:
    path_pattern: "/{resources}/{resourceId}/{subResource}"
    methods: [GET, PATCH]
    description: |
      Returns or updates the single child resource associated with the parent.
      No {subResourceId} in the path — the parent ID is the full key.
      GET returns the resource object directly (not wrapped in items[]).
      PATCH follows the standard partial-update pattern (all fields optional,
      returns updated resource).
    success_responses:
      get:
        code: 200
        body: Resource object (not wrapped in items[])
      patch:
        code: 200
        body: Updated resource object
    error_responses:
      404: Child not yet created for this parent
    notes:
      - Segment is singular — signals a one-to-one relationship.
      - No POST — singletons are system-created (e.g., by the rules engine),
        not caller-created.
      - No DELETE — the singleton exists for the lifetime of the parent.
      - The child is also accessible at its own item endpoint
        (GET /{subResources}/{subResourceId}) via its id field.
    examples:
      - GET   /applications/{applicationId}/interview
      - PATCH /applications/{applicationId}/interview

  # ---------------------------------------------------------------------------
  # Server-initialized collections
  # ---------------------------------------------------------------------------
  # Some sub-resource collections are pre-populated by the server rather than
  # created by the caller. Callers read the list and update entries by id via
  # PATCH /{resources}/{resourceId}/{subResources}/{subResourceId}.
  #
  # Prefer this over upsert endpoints (PATCH-by-composite-key). Upsert conflates
  # create and update, requires the caller to know the composite key, and makes
  # it impossible to distinguish "entry does not exist" from "entry exists with
  # these values." Only use an upsert endpoint if there is a documented reason
  # why server initialization is not feasible.
  #
  # Examples:
  #   - ReviewProgressEntry — initialized per section when a task is claimed
  #   - Interview — singleton, system-created on application submission

# =============================================================================
# Events Endpoint Pattern
# =============================================================================
# Every domain API that emits domain events must expose a GET /events endpoint.
# This provides a queryable event log for REST polling consumers and serves as
# the on-ramp to pub/sub — the same event types and payloads are delivered via
# broker subscription in a pub/sub implementation.
#
# Events are returned as CloudEvents 1.0 envelopes (see schemas/events-schema.yaml).
# Query parameters use CloudEvents attribute names for consistency with the
# event payload itself.

shared_components:
  # Error responses - use $ref to these
  error_responses:
    400:
      ref: "./components/common-responses.yaml#/BadRequest"
      description: Invalid request parameters or body
    404:
      ref: "./components/common-responses.yaml#/NotFound"
      description: Resource not found
    422:
      ref: "./components/common-responses.yaml#/UnprocessableEntity"
      description: Request body failed validation
    500:
      ref: "./components/common-responses.yaml#/InternalError"
      description: Unexpected server error

  # Query parameters - use $ref to these
  parameters:
    search:
      ref: "./components/common-parameters.yaml#/SearchQueryParam"
    limit:
      ref: "./components/common-parameters.yaml#/LimitParam"
    offset:
      ref: "./components/common-parameters.yaml#/OffsetParam"

  # Reusable schemas - import and reference as needed
  reusable_schemas:
    - ref: "./components/common.yaml#/Address"
      description: Physical mailing address
      fields: [addressLine1, addressLine2, city, state, zip, county]
    - ref: "./components/common.yaml#/Name"
      description: Person's name
      fields: [firstName, middleInitial, middleName, lastName, maidenName]
    - ref: "./components/common.yaml#/PhoneNumber"
      description: Phone number with regex validation
      pattern: '^\+?[0-9 .\-()]{7,20}$'
    - ref: "./components/common.yaml#/Email"
      description: Email address
      format: email
      maxLength: 320

# =============================================================================
# Schema Patterns
# =============================================================================

schema_patterns:
  # Every resource should have these standard fields
  resource_base_fields:
    - name: id
      type: string
      format: uuid
      readOnly: true
      description: Unique identifier (server-generated)
    - name: createdAt
      type: string
      format: date-time
      readOnly: true
      description: Timestamp when resource was created
    - name: updatedAt
      type: string
      format: date-time
      readOnly: true
      description: Timestamp when resource was last updated

  # Common field patterns
  common_fields:
    # Dates
    date_of_birth:
      type: string
      format: date
      example: "1990-05-15"

    # SSN (optional, sensitive)
    social_security_number:
      type: string
      pattern: '^\d{3}-\d{2}-\d{4}$'
      example: "123-45-6789"

    # Money/currency
    monetary_amount:
      type: number
      minimum: 0
      description: Amount in dollars
      example: 1500.00

    # Status enums
    status_pattern:
      type: string
      enum: Define allowed values
      description: Current status of the resource

    # Enum extensibility via overlay
    enum_extensibility:
      principle: |
        Use enum for domain values in the base blueprint. States that need additional
        values extend the enum via overlay — that is what the overlay process is for.
        Do NOT default to open string "for extensibility"; that sacrifices validation
        and contract clarity unnecessarily.
      applies_to: |
        Status fields, disposition fields, type classifiers (taskType, serviceType,
        failureReason, callMode), event data payload fields, request body fields.
      example: |
        # Base blueprint defines known values as enum:
        disposition:
          type: string
          enum: [approved, denied, referred]
          description: |
            Outcome of the intake review. States add values via overlay
            (e.g., pending_appeal, referred_to_snap_only).

  # Schema variants for CRUD
  schema_variants:
    base:
      description: Full resource schema with all fields including server-managed readOnly fields
      suffix: ""
    writable:
      description: |
        Intermediate base schema containing only client-writable fields (no readOnly fields,
        no server-managed fields like id, createdAt, updatedAt). Create and Update schemas
        extend this base. Use this pattern whenever any writable field needs a different
        sub-schema on write vs read (e.g., SlaInfoCreate vs SlaInfo). Always extract this
        base even when there is no immediate substitution need — it prevents the allOf
        contradiction bug and keeps Create/Update schemas consistent.
      suffix: Writable
      composition:
        base: extends ResourceWritable via allOf
        full_resource: "allOf [ResourceWritable, server-managed fields]"
        create: "allOf [ResourceWritable, required fields, write-only overrides]"
        update: "allOf [ResourceWritable, minProperties: 1]"
      example: |
        TaskWritable:        # client-writable fields only
          type: object
          properties:
            name: ...
            status: ...
            slaInfo:
              items: $ref SlaInfoCreate   # write schema here

        Task:                # full read schema
          allOf:
            - $ref: TaskWritable
            - type: object
              properties:
                id: { readOnly: true }
                slaInfo:
                  items: $ref SlaInfo    # read schema overrides write schema
                createdAt: { readOnly: true }
                updatedAt: { readOnly: true }

        TaskCreate:
          allOf:
            - $ref: TaskWritable
            - type: object
              required: [name, status]

        TaskUpdate:
          allOf:
            - $ref: TaskWritable
            - type: object
              minProperties: 1
    create:
      description: Schema for POST requests (extends ResourceWritable, declares required fields)
      suffix: Create
    update:
      description: Schema for PATCH requests (extends ResourceWritable, all fields optional)
      suffix: Update
    list:
      description: Response schema for GET collection endpoints
      suffix: List

  # Immutable type fields in categorized resources
  immutable_type_pattern:
    description: |
      When a resource uses a type field as its categorical identity (e.g. income type,
      asset type, expense type), type is immutable after creation. Clients that need to
      change the type must delete and recreate the record.

      This applies to both plain categorical resources (Deduction, Expense, AssetDisposal)
      and discriminated union resources (Income, Asset, Job, HealthPlan) where type drives
      oneOf variant selection.
    rationale: |
      Type fields determine which fields are valid (especially for discriminated unions),
      how eligibility rules apply, and how the record is categorized in program calculations.
      Allowing type mutation creates ambiguity about which variant-specific fields are valid
      and risks silent miscategorization in eligibility outcomes.
    rule: |
      Do NOT include type in the base schema required list. Instead:
      - Plain categorical schemas (Deduction, Expense, AssetDisposal): add type to required
        in the Create schema (allOf second member), not the base schema.
      - Discriminated union schemas (Income, Asset, Job, HealthPlan): type is already enforced
        by the oneOf/discriminator at the root — no change needed to Create schemas.
      - Update schemas for discriminated unions must $ref the base sub-schema
        (e.g. IncomeBase, AssetBase) NOT the discriminated root, so the oneOf does not
        require type in PATCH bodies.
    examples:
      plain_categorical: |
        # Base schema — type not in required
        Deduction:
          required: [amount]
          properties:
            type: { $ref: DeductionType }
            amount: { type: number }

        # Create schema — type required here
        DeductionCreate:
          allOf:
            - $ref: Deduction
            - required: [type, memberId]

        # Update schema — type not required (inherits from base)
        DeductionUpdate:
          allOf:
            - $ref: Deduction
            - minProperties: 1

      discriminated_union: |
        # Update schema references base sub-schema, not the discriminated root
        IncomeUpdate:
          allOf:
            - $ref: income.yaml#/$defs/IncomeBase   # NOT income.yaml (root oneOf)
            - minProperties: 1

  # Foreign key references to other schemas
  foreign_keys:
    description: |
      Foreign key references use the naming convention {entityName}Id with format: uuid
      and MUST declare an x-relationship annotation identifying the related resource.
      This enables relationship resolution, seed data generation, and design reference tooling.
    naming_convention:
      pattern: "{SchemaName}Id"
      format: uuid
      example: "personId references Person, householdId references Household"
    required_annotation:
      extension: x-relationship
      required_fields: [resource]
      description: |
        Every FK field must declare which resource it references. Style defaults to
        links-only and can be overridden via state overlay.
        Use resource: External for fields that identify records in systems outside
        the blueprint (e.g., vendor case IDs). The seed generator skips External fields.
        Use resource: Polymorphic for fields that are part of a polymorphic association
        paired with a *Type discriminator field — where the target schema varies by type
        and cannot be statically declared (e.g., subjectId + subjectType).
    examples:
      - field: personId
        type: string
        format: uuid
        description: Reference to the Person record
        x-relationship:
          resource: Person
      - field: applicationId
        type: string
        format: uuid
        description: Reference to the Application record
        x-relationship:
          resource: Application
      - field: externalVendorId
        type: string
        format: uuid
        description: References a record in the state's vendor case management system
        x-relationship:
          resource: External
      - field: subjectId
        type: string
        format: uuid
        description: Polymorphic reference — target type determined by subjectType
        x-relationship:
          resource: Polymorphic
    validation:
      - error: FK field missing x-relationship annotation
        condition: field ends in 'Id', has format uuid, and lacks x-relationship
      - Tooling detects FK fields when field ends in 'Id' and has format: uuid
      - The schema name is derived by removing 'Id' suffix and capitalizing
      - Works for both top-level properties and nested array items
      - resource: External is a reserved value — seed generator skips these fields
      - resource: Polymorphic is a reserved value — no automatic expansion; consumers resolve conditionally by the paired *Type field

# =============================================================================
# File Structure# =============================================================================
# API specs are organized flat with x-extensions for classification.
# See "API Classification" section for x-domain, x-status.

file_structure:
  # Main API specs go in openapi/ root (flat structure)
  api_specs:
    location: "openapi/"
    pattern: "{resource-plural}.yaml"
    organization: |
      APIs are organized logically using x-extensions rather than folders:
      - x-domain: Business domain (intake, client-management, etc.)
      - x-status: Implementation status (planned, stable, deprecated)

      API type (REST vs RPC) is determined by which contract artifacts exist,
      not by a metadata tag. See contract-driven-architecture.md.
    examples:
      - openapi/applications.yaml   # x-domain: intake
      - openapi/persons.yaml        # x-domain: client-management
      - openapi/households.yaml     # x-domain: intake
      - openapi/incomes.yaml        # x-domain: intake
      - openapi/users.yaml          # x-domain: identity-access

  # Shared components in openapi/components/
  components:
    location: "openapi/components/"
    files:
      - common.yaml: Reusable schemas (Address, Name, etc.)
      - common-parameters.yaml: Shared query parameters
      - common-responses.yaml: Shared error responses
      - "{resource}.yaml": Resource-specific schemas

  # Example data in openapi/examples/
  examples:
    location: "openapi/examples/"
    pattern: "{resource-plural}.yaml"
    format: |
      {ResourceName}Example1:
        id: "uuid-here"
        field1: "value1"
        # ... all required fields

  # Generated clients
  generated:
    zodios_clients: "generated/clients/zodios/"
    postman_collection: "generated/postman-collection.json"

# =============================================================================
# API Classification
# =============================================================================
# Extensions for organizing and identifying APIs without folder restructuring.
# These extensions enable filtering, documentation generation, and tooling
# without requiring physical file reorganization.
#
# Note: x-actors and x-capability concepts still apply but belong to contract
# artifacts (state machine YAML), not a separate API metadata layer. See
# docs/architecture/contract-driven-architecture.md.
