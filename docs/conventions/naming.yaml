# API Design Conventions — Naming & Authoring Style
# Part of the blueprint conventions. See conventions/ for the full set.

version: "1.0"

naming:
  # Casing: pick a name's casing by what kind of name it is, so the casing
  # tells a reader what they're looking at.
  #   - A type name: PascalCase. Code generators turn schemas into classes,
  #     which every mainstream language names in PascalCase.
  #   - A JSON field or a name code calls: camelCase, the default in
  #     JavaScript and most JSON APIs. x-casing lets a state serve fields in
  #     snake_case instead.
  #   - A name that ends up in a URL or a file name: kebab-case, the usual
  #     form for both.
  #   - A value: snake_case, the most common casing for JSON values (GitHub,
  #     Stripe). Values are stored and compared in rules, so they keep one
  #     casing whatever x-casing serves fields in.
  # Write a reference to a name as the name is declared.
  casing:
    type_names: PascalCase
    fields_and_code_names: camelCase
    url_and_file_names: kebab-case
    values: snake_case

  # URL path segments: kebab-case (lowercase with hyphens)
  # REST example: /user-profiles, /order-items
  # RPC example: /tasks/{id}/claim
  paths: kebab-case

  # Path parameters: camelCase inside braces
  # Example: /users/{userId}, /orders/{orderId}
  path_parameters: camelCase

  # Query parameters: camelCase
  # Example: ?pageSize=10, ?sortOrder=desc
  query_parameters: camelCase

  # Operation IDs: camelCase verb + noun
  # REST example: listPersons, createApplication, getHouseholdById
  # RPC example: claimTask, completeTask, submitApplication
  operation_ids: camelCase

  # Schema/component names: PascalCase
  # Example: Person, ApplicationCreate, HouseholdList
  schemas: PascalCase

  # Naming a resource from another contract: name it by the schema its
  # endpoints return, as declared. x-relationship's resource, a state
  # machine's object, a config catalog's resource and a composition's
  # resource all name it this way. Not the path segment (members) and not a
  # storage name (application-members): one resource has one name everywhere.
  # A step that addresses records by location, such as a call's
  # PATCH: intake/applications/verifications/$verification.id, writes a path
  # instead.
  # Example: resource: ApplicationMember
  resource_references: schema name, PascalCase

  # Schema property names (field names): camelCase — always, regardless of x-casing.
  # x-casing is a rendering hint that tells the runtime how to serialize field names
  # to API clients. It does NOT rename YAML properties in source files. All spec
  # authoring — OpenAPI schemas, overlay additions, annotation keys — must use
  # camelCase property names.
  # Example: applicationId, dateOfBirth, submittedAt
  schema_properties: camelCase

  # Field paths: to name a field, write $, then each property name from the
  # root after a dot, with [*] after each list. Each name is a valid CEL
  # identifier. That's RFC 9535 JSONPath limited to those segments, so any
  # JSONPath library reads it, and CEL reads $.person.age as person.age.
  # Example: $.application.members[*].personalInformation.ssn
  # Annotation and data dictionary keys and rules input paths still use an
  # older form, with no $ and [] for [*] (application.members[].ssn), until
  # they're moved. Match it there; use field paths in anything new.
  # Not field paths: a fact's name, which is a CEL name (ageVerified), and a
  # search field, which is a name in the search syntax (metadata.intake.interviewId).
  field_paths: $ then dot-separated names, [*] for list items

  # File names: kebab-case
  # Example: user-profiles.yaml, common-parameters.yaml
  files: kebab-case

  # Domains: kebab-case; a domain is a URL and file name segment.
  # Example: case-management, data-exchange
  domains: kebab-case

  # State machine action ids: kebab-case; each becomes an RPC path segment.
  # Example: approve-determination → POST /applications/{applicationId}/approve-determination
  action_ids: kebab-case

  # Registry types: kebab-case; a registry's type is its file name's suffix.
  # Example: intake-registry-suggestion-categories.yaml has type: suggestion-categories
  # A reference to one is written as declared: x-enum-source: {registry: transcription-services}
  registry_types: kebab-case

  # Values: snake_case. That covers enum values, state ids, SLA type ids and
  # registry entry ids.
  # Example: in_person, awaiting_client, snap_expedited
  # Exception: registry entry ids are kebab-case (name-mismatch), which
  # registry-schema.yaml enforces, until they're renamed.
  values: snake_case

  # CloudEvents types: {domain}.{resource}.{event}
  # Full format: org.codeforamerica.safety-net-blueprint.{domain}.{resource}.{event}
  # Example: org.codeforamerica.safety-net-blueprint.data-exchange.external_service_call.created
  # The domain as it is declared (kebab-case, the same as everywhere else); the
  # resource as its schema is named, in snake_case (ApplicationMember →
  # application_member); the event in snake_case (created, paused, approval_needed).
  # An event is always named for the resource that sends it.
  event_types:
    domain: as declared
    resource: snake_case
    event: snake_case

# =============================================================================
# Spec Authoring Style
# =============================================================================

authoring_style:
  # Usage examples communicate intent faster than long descriptions.
  examples_over_prose:
    description: |
      Add a comment block with a usage example above each type definition that
      has non-obvious structure or multiple valid forms — directly above the
      definition it illustrates, not buried inside it. Trim the prose once the
      example makes the point.

  # Do not specify OpenAPI properties that merely restate the default behavior.
  # Omitting defaults keeps specs concise and consistent.
  omit_defaults:
    description: |
      Do not include OpenAPI fields whose values are already the default.
      Examples of defaults to omit:
      - style: form (default for query parameters)
      - explode: true (default for query style: form)
      - explode: false (prefer omitting; only include when behavior is ambiguous)
      - required: false (default for parameters)

  schema_titles:
    description: |
      Every named schema defined in a $defs block must include a title: field
      that matches the schema key. The title is the authoritative type name used
      by code generators, data model visualizers, and documentation tooling.
      Without it, tools emit { type: object } instead of a meaningful type name.
    rule: title must equal the $defs key (PascalCase schema name)
    example: |
      $defs:
        HouseholdMember:
          title: HouseholdMember
          type: object
          properties:
            ...

  json_schema_files:
    description: |
      Domain schemas and shared component schemas must be defined in standalone
      JSON Schema files under schemas/domain/ or schemas/common/, with a $schema
      header and a $defs map. OpenAPI specs reference them via $ref. Do not define
      domain schemas inline in OpenAPI components/schemas — that couples the schema
      to a single spec and prevents reuse across specs.

      Operation-specific wrapper schemas (ApplicationCreate, ApplicationList, etc.)
      are the exception: they are thin allOf compositions that only make sense in
      the context of a specific API, so they live inline in components/schemas.

    schema_locations:
      openapi_components_schemas:
        purpose: REST API scaffolding — adds system fields and composes API variants
        contains: |
          - {Resource}: allOf [domain schema, system fields (id, createdAt, updatedAt)]
          - {Resource}Create: allOf [domain schema, required declaration] — no system fields
          - {Resource}Update: allOf [domain schema, minProperties: 1] — no system fields
          - {Resource}List: pagination envelope with an items array
        rule: |
          id, createdAt, and updatedAt belong here, not in the domain schema.
          They are API mechanics (server-generated, readOnly), not domain knowledge.
          Keeping them out of the domain schema means Create/Update schemas can
          reference the domain schema directly without needing to strip readOnly fields.

      schemas_domain:
        purpose: Domain-specific field definitions — no system fields
        location: schemas/domain/{domain-name}.yaml
        contains: |
          - All domain-specific property definitions for the resource
          - Domain-specific FK fields (e.g., applicationId, memberId)
        rule: |
          Do not include id, createdAt, or updatedAt here — those are added at
          the OpenAPI components/schemas layer. Each domain gets one file. Fields
          that carry domain-specific FKs belong here, not in schemas/common/.

      schemas_common:
        purpose: Reusable value types shared verbatim across multiple domains
        location: schemas/common/ or components/common.yaml
        contains: |
          - Value objects: Address, Name, Email, PhoneNumber, and similar
          - Types that carry no domain-specific FK fields
        rule: |
          A type belongs in common/ only if it can be used verbatim in any
          domain without carrying domain-specific FK fields (applicationId,
          memberId, etc.). If it needs domain FKs to be useful, it is a
          domain schema, not a common one.

    file_structure: |
      # schemas/domain/example.yaml — domain fields only, no id/createdAt/updatedAt
      $schema: https://json-schema.org/draft/2020-12/schema
      $defs:
        MyResource:
          title: MyResource
          type: object
          properties:
            status: { type: string }
            # ... domain-specific fields
    reference_pattern: |
      # In OpenAPI spec (components/schemas):
      MyResource:                    # full resource — domain fields + system fields
        allOf:
          - $ref: "./schemas/domain/example.yaml#/$defs/MyResource"
          - type: object
            required: [id, createdAt, updatedAt]
            properties:
              id: { type: string, format: uuid, readOnly: true }
              createdAt: { type: string, format: date-time, readOnly: true }
              updatedAt: { type: string, format: date-time, readOnly: true }

      MyResourceCreate:              # POST body — domain fields, declare required
        allOf:
          - $ref: "./schemas/domain/example.yaml#/$defs/MyResource"
          - type: object
            required: [status]

      MyResourceUpdate:              # PATCH body — domain fields, at least one required
        allOf:
          - $ref: "./schemas/domain/example.yaml#/$defs/MyResource"
          - type: object
            minProperties: 1

      MyResourceList:                # GET collection response — pagination envelope
        allOf:
          - $ref: "./components/pagination.yaml#/Pagination"
          - type: object
            required: [items]
            properties:
              items:
                type: array
                items:
                  $ref: "#/components/schemas/MyResource"

# =============================================================================
# Required Info Fields
# =============================================================================
# Every API spec must include these fields in its info: block.
