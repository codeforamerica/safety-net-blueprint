# Pattern — Routing
# Part of the blueprint conventions. See conventions/ for the full set; each
# file in patterns/ is one pattern, in the same shape.

version: "1.0"

pattern: Routing
summary: >
  No contract says where it runs. Configuration for each environment says
  which domain, API or operation is answered where — in the browser, by a
  state's service, by a stand-in for testing — so the same contracts work in
  every arrangement.

use_when:
  - >-
    Parts of the blueprint run in different places, such as a session in the
    page and the record it keeps on a service.
  - >-
    A state builds or buys its services one domain at a time, and the rest is
    answered by something else meanwhile.
  - >-
    A demo or a test answers an operation in place of the service that would,
    such as an adapter that holds a vendor's secret.

do_not_use_when:
  - case: The contracts themselves have to differ for a state.
    use_instead: An overlay (patterns/overlay-customization.yaml).
  - case: The other side is a system outside the blueprint, with its own API.
    use_instead: An adapter that implements a blueprint contract (patterns/adapter.yaml); routing then says where that adapter is.

rules:
  - >-
    Keep where things run out of the contracts: no hosts, no "runs in the
    browser" in a contract. It's per-environment configuration: a contract
    says what an API is; routing says where it's answered.
  - >-
    For the blueprint's own runtime — the mock server, the explorer, an app
    running the mock in its page — write routing as a routing file
    (blueprint-core's schemas/routing-schema.yaml), and check it with
    `blueprint validate --routing=<file>`, which the runtime and the explorer's
    build also run. A state's own services route with their own
    infrastructure — an API gateway, a load balancer, a service mesh —
    following these same rules; don't adopt the file for that.
  - >-
    When code answers a route, write `handler:` with the path of a JavaScript
    module that exports a handler for each operation it answers, by
    operationId. A handler gets the request and `{ params, publish, call }`:
    publish sends an event the contracts declare, through publishEvent; call
    makes another call by operationId, through routing.
  - >-
    When several implementations answer the same API, such as one session
    adapter per transcription service, give each entry a `match`: dot paths
    into the request body, each with the value it must equal, as a stub's
    match is written. The first entry whose match the request meets answers
    it, and a later request about the same resource that names none of the
    fields goes to the same entry. Match on a field the contract declares,
    with a value it allows.
  - >-
    Call another domain's operation by operationId, so routing follows the
    call when that domain runs elsewhere; a call by method and path stays where
    the caller is.
  - >-
    Route a whole domain or API where you can, with exceptions for what runs
    elsewhere. Route a single operation only when something outside the
    contracts answers it (an adapter's), when several implementations answer
    it chosen by match, or when it keeps no data of its own (a credentials
    request, a ruleset evaluation). Never route a single operation that reads
    or writes a resource whose other operations run elsewhere: a record one
    place creates is missing from the other's reads. Validation warns about
    one routed apart from the rest of its API.
  - >-
    Route a domain's events with it: what its state machines react to is
    delivered to wherever it runs.
  - >-
    Publish and subscribe in contracts; leave where the event bus runs to
    routing. Publishing is the platform's publishEvent operation, routed like
    any other: to an event bus in the page when everything that follows the
    event runs there, to the state's event log when something on a service
    does. A contract never names an emitter in the page.
  - >-
    Pass on only the headers a request describes itself with, and a caller's
    credentials only where the configuration names them; a page holds no
    secrets, so what a page reaches must accept the user's own credential or
    none.

example: >
  For transcription, the communication domain is routed to the state's
  service except the session's API, which stays in the page; the session's
  actions call the transcript by operationId, so those calls reach the
  service. The session adapter's streaming operations stay in the page, and
  its credentials operation goes to the service. What the adapter publishes
  goes to the service's event log, where the transcript follows it. A demo
  with no backend routes nothing: the session, its adapter and the transcript
  all run in the page, and the events never leave it.

rationale: docs/architecture/cross-cutting/routing.md
