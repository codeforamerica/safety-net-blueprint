# Pattern — Browser-to-vendor stream
# Part of the blueprint conventions. See conventions/ for the full set; each
# file in patterns/ is one pattern, in the same shape.

version: "1.0"

pattern: Browser-to-vendor stream
summary: >
  The browser streams to a vendor directly, for something live such as
  speech, while the blueprint keeps the result. A session in the page tracks
  the connection; its running adapter streams to the vendor and reports by
  publishing the session's events; and the adapter's credentials part issues
  short-lived credentials.

use_when:
  - >-
    The browser and a vendor exchange a live, continuous stream — audio, video,
    a real-time conversation — where delay matters.
  - >-
    The raw stream shouldn't pass through the server, for its delay or cost, or
    because the blueprint shouldn't hold it.
  - >-
    What's kept is a result derived from the stream, such as text, not the
    stream itself.
  - >-
    The connection belongs to one browser tab and doesn't need to outlive it.
  - >-
    The vendor issues browsers short-lived credentials, or the state runs a
    server the browser can reach in front of one that doesn't.

do_not_use_when:
  - case: One request and one answer, such as checking a fact with an outside authority.
    use_instead: The adapter pattern (patterns/adapter.yaml), or Data Exchange.
  - case: Processing content already stored, such as an uploaded document or a recording transcribed after the fact.
    use_instead: A server-side adapter that reads the stored content.
  - case: The raw stream has to be kept or audited.
    use_instead: Stream through the state's own server, and keep it there.
  - case: The connection has to outlive the tab, or continue with no page open.
    use_instead: A session on the server, not in the page.

rules:
  - >-
    Define a session resource, with a state machine, designed to run in the
    page. Keep it there with routing, and send the record to the server, by
    routing the domain to the server except the session's API. No contract says
    where it runs.
  - >-
    Give the session's API only what the app does: start, pause, resume and
    stop. The page calls only those, and follows the session's events.
  - >-
    Make the session's adapter for each vendor a running adapter
    (patterns/adapter.yaml): the session calls it to start, pause and stop
    streaming; it streams to the vendor and reports by publishing the
    session's events — connected, disconnected, failed, each draft and each
    finished result, and ended — which the session follows. The adapter never
    calls the session or the record.
  - >-
    Have the record follow the finished results itself, under on:, and keep
    each once. The session's actions call the record's operations by
    operationId, so routing carries the calls to the server; the adapter's
    events reach the record wherever routing sends publishEvent.
  - >-
    Keep only finished results on the server. Drafts, such as a line still being
    revised, are events nothing keeps; tie each draft to its finished result
    with a key the adapter gives, which the record keeps the result once by.
  - >-
    Issue the vendor's credential from the adapter's credentials part, which the
    state runs and which holds the vendor's secret, as a short-lived credential
    in one shape for every vendor. The adapter's streaming part asks for it, and the
    vendor's secret never reaches the page.
  - >-
    Let the adapter get its credential and open the connection itself, and
    publish connected when it opens: only the adapter knows whether it did.
    Between start and connected the session is connecting, so a connection
    that fails to open has somewhere to land.
  - >-
    For a vendor a browser can't reach, write an adapter for it like any
    other. The state runs a server in front of the vendor, and how the adapter
    talks to that server is the adapter's own business: define no contract
    for it, since the session sees the same calls and events either way.
  - >-
    Name the session's states from a standard for a connection's states where
    one fits (WebRTC's), and name actions, states and events with one word each
    (naming.yaml, state_machine_names).
  - >-
    When the user goes off the record, stop the stream to the vendor, not only
    what's kept: disconnect, and connect again to resume. Stay connected only
    when the vendor holds state the conversation needs that a new connection
    would lose, such as a voice agent's memory of the call. Then send no
    audio, keep the connection alive the vendor's way, and still move the
    session to paused, so the record shows the audio stopped.
  - >-
    Draw the flow as the diagrams convention says (diagrams.yaml, flows),
    showing where each part runs.

example: >
  Transcription, in the communication domain: the transcription session, the
  transcript and the transcription session adapter
  (docs/architecture/domains/communication-transcripts.md, "How the parts work
  together" and Decisions 3, 11 to 17).

rationale: docs/architecture/cross-cutting/browser-vendor-stream.md
