# API Design Conventions — Events
# Part of the blueprint conventions. See conventions/ for the full set.

version: "1.0"

events_endpoint:
  path: "/platform/events"
  method: GET
  description: |
    Centralized, queryable log of all domain events across the blueprint.
    Supports REST polling as an integration pattern and provides permanent
    audit history for all state transitions and significant data mutations.
    Events are returned in ascending time order (oldest first) to support
    cursor-based polling.

    Defined in platform-openapi.yaml. The /platform prefix may be overlaid
    by state partners to match their own conventions.

  parameters:
    - name: type
      in: query
      description: |
        Filter by CloudEvents type. Supports prefix matching with a trailing
        wildcard (e.g., intake.*).
        Matches the `type` field in the CloudEvents envelope.
      schema:
        type: string
      example: "intake.application.submitted"

    - name: source
      in: query
      description: |
        Filter by CloudEvents source — the domain that produced the event
        (e.g., /intake, /workflow). Matches the `source` field in the
        CloudEvents envelope.
      schema:
        type: string
      example: "/intake"

    - name: subject
      in: query
      description: |
        Filter by CloudEvents subject — the entity ID the event pertains to
        (e.g., an application UUID). Because every domain uses the same subject
        for the same entity, filtering by subject returns a complete cross-domain
        timeline for that entity.
      schema:
        type: string
        format: uuid

    - name: traceid
      in: query
      description: |
        Filter by W3C Trace Context trace ID extracted from the `traceparent`
        attribute. All events sharing a trace ID were causally triggered by the
        same root action, enabling full causal chain reconstruction in one query.
      schema:
        type: string

    - name: start
      in: query
      description: |
        Return only events at or after this timestamp (ISO 8601). Use as a
        polling cursor — store the `time` of the last received event and pass
        it as `start` on the next poll.
      schema:
        type: string
        format: date-time

    - name: end
      in: query
      description: |
        Return only events before or at this timestamp (ISO 8601). Combined
        with `start`, supports bounded historical queries (e.g., all changes
        in a given day).
      schema:
        type: string
        format: date-time

    - name: limit
      description: Maximum number of events to return.
      ref: "./components/common-parameters.yaml#/LimitParam"

    - name: offset
      description: Number of events to skip.
      ref: "./components/common-parameters.yaml#/OffsetParam"

  response:
    code: 200
    schema_suffix: List
    description: Paginated list of CloudEvents envelopes, ordered by time ascending.
    body: |
      Standard paginated list response (items, total, limit, offset, hasNext)
      where each item is a CloudEvents 1.0 envelope. The envelope schema is
      defined in platform-openapi.yaml#/components/schemas/Event.

  notes:
    - The /events endpoint is read-only for consumers. Events are written
      internally by producers as state machine transitions and data mutation
      effects fire.
    - Consumers should use `start` as a cursor for polling, advancing it to the
      `time` of the last event received on each poll.
    - The same event types and payloads delivered here are published to broker
      topics in a pub/sub implementation. Moving from polling to pub/sub requires
      no changes to event schemas.
    - The `subject` filter is the primary cross-domain correlation mechanism.
      The `traceid` filter reconstructs causal chains across domains.

# =============================================================================
# Event Catalog
# =============================================================================

event_catalog:
  description: |
    Every event a domain sends is documented in AsyncAPI, and nearly all of it
    is generated. Resolve writes `<name>-events-asyncapi.yaml` beside each
    OpenAPI document: the created, updated and deleted events of each resource
    its API writes, and every event the state machines attached to its
    resources declare under `emits:`. Nobody writes these by hand, and a
    hand-written channel for an event that is generated is a validation error.

  hand_written:
    description: |
      A domain's own `*-asyncapi.yaml` holds only events nothing in the
      contracts sends — an adapter's result, say — each marked as a placeholder
      until the resource or state machine that sends it is declared.

  x_events:
    description: |
      Removed. OpenAPI's `x-events` repeated what AsyncAPI documents and nothing
      read it; validation warns where it remains.

  naming: "{domain}.{resource}.{event} — see naming.yaml event_types."

  cloudevents_envelope:
    description: |
      All blueprint events use the CloudEvents 1.0 envelope. Core attributes:
    attributes:
      - name: specversion
        value: "1.0"
        required: true
      - name: id
        description: |
          Unique event identifier (UUID). The publisher sets it when it makes
          the event, before sending it anywhere — whether that is a domain
          emitting its own event or a service such as the timer service
          publishing through POST /platform/events, which requires it. Keep
          `source` plus `id` unique for each distinct event, and send the same
          id again when retrying a publish, so the retry is the same event, not
          a second one (CloudEvents 1.0, id). A subscriber may treat two events
          with the same `source` and `id` as one.
        required: true
      - name: type
        description: Fully qualified event type, {domain}.{resource}.{event}
        required: true
      - name: source
        description: Domain base path (e.g., /intake, /workflow)
        required: true
      - name: subject
        description: Entity ID the event pertains to (bare UUID)
        required: true
      - name: time
        description: ISO 8601 timestamp when the event occurred
        required: true
      - name: datacontenttype
        value: application/json
        required: true
      - name: data
        description: Event payload; schema defined by the event's AsyncAPI channel
        required: true
      - name: traceparent
        description: |
          W3C Trace Context header (optional). Propagated from the triggering
          request or event. The trace ID component is stable across the full
          causal chain — every downstream event shares the same trace ID.
        required: false
      - name: authtype
        description: |
          CloudEvents Auth Context extension (optional). Principal type of the
          actor who triggered the event. Required when authid is present.
          Required for FTI-governed events per IRS Pub. 1075.
          Values: user, service_account, api_key, system, unauthenticated, unknown.
        required: false
      - name: authid
        description: |
          CloudEvents Auth Context extension (optional). Principal identifier
          (userId from JWT claims) of the actor who triggered the event. No PII —
          user ID only, not name or email. Required when authtype is present.
          Required for FTI-governed events per IRS Pub. 1075.
        required: false
      - name: causationid
        description: |
          CloudEvents Correlation extension (optional). The id of the event
          that caused this one, set when an event is emitted in reaction to
          another. Events caused by a request carry traceparent instead.
        required: false
      - name: partitionkey
        description: |
          CloudEvents Partitioning extension. The id of the aggregate the
          event belongs to; see event_ordering.
        required: false

  event_ordering:
    rule: |
      Set partitionkey to the id of the aggregate the event belongs to: the
      record that owns the others, as the application owns its members,
      incomes and interviews. A subscriber handles events with the same key one
      at a time, in the order they occurred, and finishes one before it takes
      the next.
    rationale: |
      It keeps a subscriber from acting on stale data: two reactions to the
      same application can't overlap or finish out of order. Changes to one
      record from different sources, such as an action and a reaction, take
      turns too (http.yaml, etags, one_change_at_a_time).
    details: docs/architecture/inter-domain-communication.md (Event ordering)

  type_naming:
    pattern: "{domain}.{resource}.{event}"
    rule: |
      Name every event {domain}.{resource}.{event}: the domain as it is
      declared, the resource that sends it in snake_case, and what happened in
      snake_case. A timer's callback is named the same way, for the resource
      whose machine declares the timer. Validation refuses any other shape
      (event-name-shape).
    prefix: |
      Leave the prefix out of the contracts. A state that shares a bus with
      other systems sets its own reverse-DNS namespace once, as
      x-event-type-prefix in its overlay config, and resolve puts it in front
      of every event type: gov.ca.dss.intake.application.submitted. Don't
      write a Code for America namespace into a type; the events a state sends
      are the state's.
    rationale: |
      CloudEvents recommends a reverse-DNS prefix on type so types from
      different producers don't collide. The producer is the state running
      the system, so the state chooses it.
    examples:
      - intake.application.submitted
      - workflow.task.created
      - intake.application.review_reminder
      - gov.ca.dss.intake.application.submitted   # with x-event-type-prefix: gov.ca.dss

  asyncapi_channel_naming:
    pattern: "{domain}.{entity}.{verb}"
    description: |
      AsyncAPI channel names are the event types, {domain}.{resource}.{event},
      and carry the state's prefix too when it sets one. The domain matches the API's x-domain
      value; the entity is the resource's schema name in snake_case
      (application_member); the verb is the action.
    examples:
      - intake.application.submitted
      - intake.application.withdrawn
      - workflow.task.created
      - workflow.task.claimed
    note: |
      Channel names are the canonical identifier for a stream in the broker.

  versioning:
    description: |
      New fields may be added to an event payload without versioning.
      Breaking changes (removed or renamed fields) introduce a new type
      alongside the old one, published in parallel until all consumers migrate.
    example:
      - intake.application.submitted
      - intake.application.submitted.v2

  auto_emit:
    description: |
      Every REST resource emits three standard lifecycle events automatically.
      These do not require any state machine declaration — the mock server emits
      them for every POST, PATCH, and DELETE, regardless of whether a state
      machine is defined. Each is named for the resource, `{domain}.{resource}.created`,
      and resolve generates its channel. A POST to a path that is no resource's
      collection is a call, and a resource whose schema is the shared `Event` is
      an event itself; neither emits a lifecycle event.

    events:
      - trigger: POST /resources
        action: "{resource}.created"
        payload: Full resource snapshot (same shape as the main resource schema)

      - trigger: PATCH /resources/{id}
        action: "{resource}.updated"
        payload: Field-level diff listing changed fields with before/after values

      - trigger: DELETE /resources/{id}
        action: "{resource}.deleted"
        payload: null

    payload_schemas:
      created: The resource itself, as its API's schema declares it.
      updated: "The shared ResourceUpdatedEvent in base/schemas/events.yaml."
      deleted: "The shared ResourceDeletedEvent in base/schemas/events.yaml."

    traceparent:
      description: |
        W3C Trace Context propagation. Implementations must forward the
        `traceparent` HTTP request header to all events emitted during that
        request's lifecycle, including events from state machine transitions
        and CRUD lifecycle effects triggered by the same call.

        When no `traceparent` is present on the inbound request, the
        implementation starts a trace, as W3C Trace Context has the first traced
        service do, and every event that request causes carries it.

        Clients that are already part of a trace include their `traceparent`,
        so the trace continues end to end. The trace ID component is stable
        across the full causal chain,
        so filtering events by trace ID reconstructs the complete set of
        operations triggered by a single originating request.

        The `traceparent` attribute in CloudEvents follows the CloudEvents
        Distributed Tracing extension specification.

