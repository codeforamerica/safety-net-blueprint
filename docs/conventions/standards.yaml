# API Design Conventions — Standards
# Part of the blueprint conventions. See conventions/ for the full set.
#
# Read this before adding a mechanism — a key, a field, an extension, a
# header, a syntax, a step. Each entry says when to use the standard, any
# exception, and where the details are.

version: "1.0"

# Use an adopted standard, as the standard defines it. If none fits, borrow
# from prior art and name the source in the design. Invent only when neither
# fits, and say in the design that it's an invention, and why. When you adopt
# a standard or first borrow from a source, add it here.
order_of_preference:
  - adopted standard
  - borrowed prior art
  - invention, stated as one

adopted:
  - name: JSON Schema
    version: "2020-12"
    url: https://json-schema.org/draft/2020-12
    use: >
      Use it for every data shape, in every contract type, and its keywords
      and formats before an x- extension.
    exception: >
      It has no negative duration: write iCalendar's form (RFC 5545), e.g.
      -PT48H, and validate it with a `pattern`.
    details: docs/conventions/naming.yaml (json_schema_files)

  - name: OpenAPI
    version: "3.1.0"
    url: https://spec.openapis.org/oas/v3.1.0
    use: >
      Use it to describe a domain's HTTP API, and its own constructs
      (deprecated, readOnly, links, securitySchemes) before an x- extension.
    details: docs/conventions/resources.yaml, docs/conventions/rpc.yaml

  - name: AsyncAPI
    version: "3.0.0"
    url: https://www.asyncapi.com/docs/reference/specification/v3.0.0
    use: Use it to declare the events a domain sends.
    details: docs/conventions/events.yaml (what's generated and what's written by hand)

  - name: CloudEvents
    version: "1.0"
    url: https://github.com/cloudevents/spec
    use: >
      Use it as the envelope of every event. Before adding an envelope
      attribute, use one of its extensions if one fits. In use: Distributed
      Tracing (traceparent), Correlation (causationid), Auth Context (authid,
      authtype), Partitioning (partitionkey), which keeps an aggregate's events
      in order.
    details: docs/conventions/events.yaml (cloudevents_envelope, event_ordering)

  - name: Arazzo
    version: "1.1.0"
    url: https://spec.openapis.org/arazzo/v1.1.0.html
    use: >
      Use it to write a scenario when you add or change a capability that
      takes several calls to see working. To take a value from a response,
      use a JSON Pointer (`$response.body#/id`) when it's at a fixed place,
      and a JSONPath selector when you find it by what it holds, such as one
      item in a list. When you change how the state machine DSL writes a
      call, keep Arazzo's shape for the parts they share (parameters,
      requestBody).
    details: docs/conventions/contract-files.yaml (scenarios)

  - name: OpenAPI Overlay
    version: "1.0.0"
    url: https://spec.openapis.org/overlay/v1.0.0.html
    use: >
      Use it to change a contract file you build on but don't own, such as a
      framework file or a set you extend, of any contract type.
    details: docs/conventions/contract-files.yaml (change_by_overlay), docs/guides/overlay-guide.md

  - name: JSONPath
    version: RFC 9535
    url: https://www.rfc-editor.org/rfc/rfc9535
    use: >
      To name a field, write a field path: JSONPath limited to names and
      `[*]`, as in `$.application.members[*].ssn`. To select parts of a
      contract file, as an overlay's targets do, or items in a response, as
      a scenario's selectors do, use full JSONPath.
    exception: >
      Annotation and data dictionary keys and rules input paths still use an
      older form (`application.members[].ssn`) until they're moved. Match it
      there; don't use it in anything new.
    details: docs/conventions/naming.yaml (field_paths)

  - name: JSON Pointer
    version: RFC 6901
    url: https://www.rfc-editor.org/rfc/rfc6901
    use: >
      Use it to point at one field in one specific record, such as a JSON
      Patch's path into an editable composition (`/incomes/{incomeId}/amount`),
      or a value at a fixed place in a response, as a scenario's
      `$response.body#/id` does. It addresses a list item only by position,
      so key records by id wherever a path has to name one.

  - name: JSON Patch
    version: RFC 6902
    url: https://www.rfc-editor.org/rfc/rfc6902
    use: >
      Use it to change several related records in one request: an editable
      composition takes one as application/json-patch+json, applied all or
      nothing, and a suggestion that proposes a change to data carries one.
      An operation may carry members the RFC doesn't define, such as
      evidence; the RFC says they're ignored.
    details: blueprint-core/schemas/compositions-schema.yaml (CompositionEditable), docs/conventions/resources.yaml (editable_composition)

  - name: OData referential actions
    version: OData 4.01 CSDL, section 8.6 (OnDelete)
    url: https://docs.oasis-open.org/odata/odata-csdl-xml/v4.01/odata-csdl-xml-v4.01.html
    use: >
      Use x-relationship's onDelete to say what deleting the named record does
      to the record holding the field, with OData's names. cascade deletes it
      too. Leaving onDelete out is OData's None: the delete is refused while any
      record names it. SQL's ON DELETE actions are the origin; OData is the API
      description standard that declares them.
    exception: >
      Only cascade is declared; SetNull and SetDefault aren't, until a contract
      needs them. OData leaves the action unspecified when OnDelete is absent;
      here, absent means None, so a contract always says what a delete does.
    details: docs/architecture/x-extensions.md (x-relationship), docs/conventions/extensions.yaml (x-relationship)

  - name: UUID
    version: RFC 9562
    url: https://www.rfc-editor.org/rfc/rfc9562
    use: >
      Use it for every record id (format: uuid). A caller may choose a new
      record's id on create, so one request can name a record another change
      in it creates.
    details: blueprint-core/base-contracts/schemas/operations.yaml (NewId), docs/conventions/resources.yaml (create)

  - name: CEL
    url: https://github.com/google/cel-spec
    use: Use it for every expression.
    exception: >
      SLA types, metrics and some where clauses still use JSON Logic, and are
      being moved to CEL. Don't use JSON Logic in anything new.
    details: docs/architecture/cross-cutting/behavioral-contract-dsl.md

  - name: HTTP
    url: https://www.rfc-editor.org/rfc/rfc9110
    use: >
      Use methods, status codes and headers as RFC 9110 defines them. Use its
      conditional requests (ETag, If-Match) so a write based on an outdated
      read is refused instead of overwriting a newer change, and the
      Idempotency-Key header (an IETF draft) to make a retried POST or a
      composition's PATCH safe. For a PATCH, answer as RFC 5789 sets out: 400
      for a malformed patch, 415 for a media type the operation doesn't take,
      409 when the data changed since it was read, and 422 for a change that
      can't be made.
    exception: >
      The mock server doesn't send ETags or check If-Match yet, and the
      framework contracts don't declare them.
    details: docs/conventions/http.yaml (etags, idempotency)

# Prior art to borrow from where no adopted standard fits. Take a name or a
# shape from it, and name the source in the design.
borrowed:
  - name: CNCF Serverless Workflow
    url: https://github.com/serverlessworkflow/specification
    use: >
      When you add or change a state machine step, use its name and shape
      where one fits. Don't adopt it wholesale.
    details: docs/architecture/cross-cutting/behavioral-contract-dsl.md (Decision 2)

  - name: JSON:API client-generated ids
    url: https://jsonapi.org/format/#crud-creating-client-ids
    use: >
      A create may carry the id the caller chose; without one the server sets
      it, and an id another record has is refused with 409.

  - name: Domain-driven design aggregates
    url: https://martinfowler.com/bliki/DDD_Aggregate.html
    use: >
      An editable composition is an aggregate: a root record and the records
      changed with it, as one unit, all or nothing. Use the term when you
      describe what an editable composition holds.

  - name: Amazon States Language
    url: https://states-language.net/spec.html
    use: When a step can fail, handle it with a `catch` on the step, as its Catch sits on a Task.

  - name: XState and SCXML
    url: https://stately.ai/docs
    use: When you name a state machine concept, use their term before coining one.
